[build]
  command = "echo 'Using pre-built files from git' && ls -la frontend/out/_next/static/chunks/pages/ | grep symptom"
  publish = "frontend/out"

[build.environment]
  NODE_VERSION = "20"

# Cache configuration
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
