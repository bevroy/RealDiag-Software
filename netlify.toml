[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  # Force fresh build - updated 2025-11-17
  ignore = "git diff --quiet HEAD^ HEAD ./"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # Force rebuild - display limit and likelihood fixes
  BUILD_ID = "2025-11-18-display-fixes"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache configuration
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
