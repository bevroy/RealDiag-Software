[build]
  base = "frontend"
  command = "npm run build && ls -la out/_next/static/chunks/pages/ | grep symptom"
  publish = "out"
  # Force fresh build - updated 2025-11-18
  ignore = "git diff --quiet HEAD^ HEAD ./"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # Force rebuild - static export with new bundles
  BUILD_ID = "2025-11-18-static-export-v2"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache configuration
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
