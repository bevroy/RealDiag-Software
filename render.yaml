# Render infrastructure-as-code manifest to deploy the backend service.
# See: https://render.com/docs/deploy-anything#render-yaml
#
# This describes a Docker-backed web service that builds from the repo's
# `backend/Dockerfile` and runs the FastAPI app. Connect your GitHub repo to
# Render and the `render.yaml` will allow Render to create/update the service.

services:
  - type: web
    name: realdiag-backend
    env: docker
    branch: main
    plan: free
    repo: bevroy/RealDiag-Software
    dockerfilePath: backend/Dockerfile
    # The Dockerfile CMD will be used for startup (gunicorn with 2 workers)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FHIR_BASE_URL
        value: http://localhost:8080/fhir  # UPDATE THIS with your EMR FHIR URL
      - key: FHIR_AUTH_TOKEN
        sync: false  # Set this securely in Render dashboard
      - key: PREVIEW_ORIGIN_REGEX
        value: ^https?://(?:localhost(?::\\d+)?|.*\\.netlify\\.app|www\\.realdiag\\.com)$
