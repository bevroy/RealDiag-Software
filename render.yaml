# Render infrastructure-as-code manifest to deploy the backend service.
# See: https://render.com/docs/deploy-anything#render-yaml
#
# This describes a Docker-backed web service that builds from the repo's
# `backend/Dockerfile` and runs the FastAPI app. Connect your GitHub repo to
# Render and the `render.yaml` will allow Render to create/update the service.

databases:
  - name: realdiag-database
    databaseName: realdiag_prod
    user: realdiag_user
    plan: free  # 90-day free trial, then expires (change to 'starter' for $7/month paid plan)
    region: ohio
    ipAllowList: []  # Only accessible from Render services

  # Redis Cache for Performance Optimization
  - name: realdiag-redis
    type: redis
    plan: free  # 25MB free tier (sufficient for caching)
    ipAllowList: []  # Only accessible from Render services
    maxmemoryPolicy: allkeys-lru  # Evict least recently used keys when full

services:

  # Backend Web Service
  - type: web
    name: realdiag-backend
    env: docker
    branch: main
    plan: free
    repo: https://github.com/bevroy/RealDiag-Software
    dockerfilePath: backend/Dockerfile
    # The Dockerfile CMD will be used for startup (gunicorn with 2 workers)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: realdiag-database
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: realdiag-redis
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 4  # Number of Gunicorn workers (auto-calculated if not set)
      - key: FHIR_BASE_URL
        value: http://localhost:8080/fhir  # UPDATE THIS with your EMR FHIR URL
      - key: FHIR_AUTH_TOKEN
        sync: false  # Set this securely in Render dashboard
      - key: PREVIEW_ORIGIN_REGEX
        value: ^https?://(?:localhost(?::\\d+)?|.*\\.netlify\\.app|www\\.realdiag\\.com)$
