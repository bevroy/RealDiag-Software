# Render Blueprint for RealDiag production. See: https://render.com/docs/blueprint-spec
#
# This Blueprint manages only the production database. The production backend
# (realdiag-backend, serving api.realdiag.com) was created in the Render
# dashboard and is not linked to this Blueprint, so it must not be listed here:
# a Blueprint sync creates a new, separate service for any service it does not
# already manage (it did this once, as realdiag-backend-s2m5). Configure the
# backend, including its environment variables, in the dashboard.

databases:
  - name: realdiag-database
    databaseName: realdiag_prod
    user: realdiag_user
    plan: 0.1c-256mb  # Basic-256mb in the dashboard ($6/month); must match it, Blueprint syncs apply this
    region: virginia
    ipAllowList: []  # Only accessible from Render services
