tree_id: TOX-SEROTONIN-SYNDROME
name: Serotonin Syndrome
family: Toxicology
specialty: Toxicology
icd10:
- G93.89
snomed:
- '35434009'
urgency: medium
description: Comprehensive evaluation and management of Serotonin Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Mental status changes: Agitation, confusion, restlessness'
- 'Autonomic instability: Tachycardia, hypertension (not hypotension), hyperthermia
  (38-41°C), diaphoresis, mydriasis'
- 'Neuromuscular hyperactivity: Tremor, clonus (spontaneous/inducible/ocular), hyperreflexia,
  muscle rigidity (MORE in lower extremities)'
- 'Recent increase/addition of serotonergic agent: SSRIs, SNRIs, MAOIs, tramadol,
  linezolid, ondansetron, dextromethorphan'
- 'Onset: Typically within 24 hours of medication change'
- 'Hunter Criteria: More sensitive than Sternbach criteria for diagnosis'
workup: []
treatment:
- 'Guideline-based treatment options for Serotonin Syndrome include:'
- 'Immediate: Stop all serotonergic agents, supportive care (cooling, fluids, sedation
  with benzos) (AAPCC 2023)'
- 'Benzodiazepines: Lorazepam 1-2mg IV for agitation, tremor, rigidity (AAPCC 2023)'
- 'Cyproheptadine: 12mg PO load, then 8mg PO q6h (AAPCC 2023)'
- 'Severe cases: ICU admission, intubation for hyperthermia >41°C, paralysis with
  non-depolarizing agent (rocuronium) (AAPCC 2023)'
- 'Disposition: Mild (outpatient after observation), moderate-severe (admit for monitoring
  24-48hr), psychiatry medication reconciliation (AAPCC 2023)'
clinical_pearls:
- 'Hunter Criteria (requires serotonergic agent + one of): Spontaneous clonus, inducible
  clonus + agitation/diaphoresis, ocular clonus + agitation/diaphoresis, tremor +
  hyperreflexia, hypertonia + temp >38 + ocular clonus/inducible clonus'
- 'Clonus = KEY finding: Inducible ankle clonus most specific, test by rapid dorsiflexion'
- 'Differentiate from NMS: SS = hyperreflexia/clonus, NMS = hyporeflexia/lead-pipe
  rigidity'
- 'Stop offending agents immediately: Improvement typically within 24 hours'
- 'Cyproheptadine (5-HT2A antagonist): 12mg load, then 8mg q6h (max 32mg/day)'
- 'Avoid antipsychotics: Can worsen or cause NMS'
referrals: []
differentials:
  - Neuroleptic malignant syndrome
  - Malignant hyperthermia
  - Anticholinergic toxicity
  - Meningitis
trace:
  source: American College of Medical Toxicology (ACMT) Guidelines, American Association
    of Poison Control Centers (AAPCC)
