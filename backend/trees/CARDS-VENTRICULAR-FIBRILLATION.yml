tree_id: CARDS-VENTRICULAR-FIBRILLATION
name: Ventricular Fibrillation
family: Cardiology
specialty: Cardiology
chief_complaint: Sudden cardiac arrest
description: Chaotic disorganized ventricular electrical activity causing loss of cardiac output and sudden cardiac death. No discernible QRS complexes on ECG. Immediate defibrillation only effective treatment. Ischemic heart disease most common cause. ICD essential for survivors.
icd10: I49.01
snomed: 17366009
presentations:
  - Sudden cardiac arrest
  - Loss of consciousness
  - No pulse, no breathing
  - Requires immediate CPR and defibrillation
  - May be preceded by palpitations or chest pain
  - Fatal if not treated immediately
urgency: life-threatening

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Presentation: sudden cardiac arrest
  - Loss of consciousness: within seconds (no cerebral perfusion)
  - No pulse: cardiac output zero
  - No breathing: agonal respirations or apnea
  - Sudden cardiac death: if not resuscitated within minutes
  - Causes:
  - Acute MI: most common (first presentation of CAD in 15%)
  - Prior MI with scar: substrate for ventricular arrhythmias
  - Non-ischemic cardiomyopathy: dilated, hypertrophic, ARVC
  - Structural heart disease: valvular, congenital
  - Channelopathies: long QT syndrome, Brugada syndrome, CPVT, short QT syndrome
  - Commotio cordis: blunt chest trauma during vulnerable period (baseball to chest)
  - Electrolyte abnormalities: severe hypokalemia, hypomagnesemia
  - Drug-induced: proarrhythmic medications, cocaine, amphetamines
  - Hypothermia
  - ECG (diagnostic):
  - Chaotic irregular waveforms: no discernible QRS complexes
  - No organized electrical activity
  - Coarse VF: large amplitude fibrillatory waves (better prognosis, more likely to defibrillate)
  - Fine VF: low amplitude fibrillatory waves (worse prognosis, may progress to asystole)
  - Distinguished from asystole: some electrical activity present (not flatline)
  - Workup after resuscitation:
  - Emergent coronary angiography: rule out acute MI (most common cause)
  - Echocardiogram: assess LV function, structural disease
  - Electrolytes: potassium, magnesium, calcium
  - Troponin, BNP
  - Cardiac MRI: assess for scar, infiltrative disease, ARVC
  - Genetic testing: if young patient or suspected channelopathy
  - EP study: assess for inducible VT/VF, guide ablation

treatment:
  - Acute management (ACLS protocol):
  - Immediate CPR: high-quality chest compressions 100-120/min, depth 2 inches
  - Immediate defibrillation: 200 J biphasic (or 360 J monophasic)
  - Time to defibrillation most critical factor: survival decreases 7-10% per minute delay
  - Resume CPR immediately after shock x2 minutes
  - Repeat shock if VF persists
  - Epinephrine 1 mg IV every 3-5 minutes during resuscitation
  - Amiodarone 300 mg IV bolus if VF persists after 3 shocks (then 150 mg)
  - Treat reversible causes (H's and T's):
  - Hypovolemia, Hypoxia, Hydrogen ion (acidosis), Hypo/Hyperkalemia, Hypothermia
  - Tension pneumothorax, Tamponade, Toxins, Thrombosis (coronary or pulmonary)
  - Post-cardiac arrest care:
  - Target temperature management: 32-36°C x24 hours (neuroprotection)
  - Emergent coronary angiography: if STEMI or high suspicion for ACS
  - Mechanical ventilation: optimize oxygenation and ventilation
  - Hemodynamic support: vasopressors if needed
  - Treat precipitating cause:
  - Acute MI: emergent PCI or CABG
  - Electrolyte abnormalities: correct immediately
  - Long QT syndrome: stop offending drugs, magnesium, pacing
  - Long-term management:
  - ICD (implantable cardioverter-defibrillator):
  - Essential for survivors of VF cardiac arrest (secondary prevention - class I indication)
  - Most effective treatment to prevent recurrent sudden death
  - Delay implantation 40 days post-MI (give time for healing, EF may improve)
  - If VF from reversible cause (acute MI, electrolytes), reassess after correction
  - Antiarrhythmic medications:
  - Beta blockers: essential in ischemic heart disease, reduce arrhythmia burden
  - Amiodarone: adjunct to ICD, reduce VF recurrence
  - Catheter ablation: if recurrent VF despite ICD and medications
  - Treat underlying disease:
  - Revascularization: if ischemic
  - Heart failure therapy: if cardiomyopathy
  - Genetic counseling: if channelopathy, screen family members
  - Prognosis:
  - Out-of-hospital cardiac arrest: survival to discharge 10-30% (dependent on bystander CPR, time to defibrillation)
  - In-hospital cardiac arrest: survival 15-25%
  - Neurologic outcomes: depends on time to ROSC (return of spontaneous circulation)
  - With ICD: sudden death prevention over 95%

clinical_pearls:
  - Chaotic irregular waveforms with no discernible QRS complexes
  - Sudden cardiac arrest with loss of pulse and consciousness
  - Immediate defibrillation only effective treatment (time-critical)
  - Survival decreases 7-10% per minute without defibrillation
  - Acute MI most common cause (emergent angiography after ROSC)
  - ICD essential for survivors (secondary prevention - prevents recurrent sudden death)
  - Coarse VF better prognosis than fine VF
  - Always check for reversible causes (H's and T's)

differentials:
  - Asystole: flatline, no electrical activity (worse prognosis than VF)
  - Pulseless electrical activity (PEA): organized rhythm on monitor but no pulse
  - Polymorphic VT: organized wide complex tachycardia (may degenerate to VF)
  - Artifact: loose leads mimicking VF (check patient, not just monitor)

trace: |
  A 52-year-old man with no known cardiac history collapsed suddenly while playing basketball. Witnessed cardiac arrest, bystander immediately called 911 and started CPR. Paramedics arrived 6 minutes after collapse (good response time). Cardiac monitor showed ventricular fibrillation (coarse VF - large amplitude fibrillatory waves, no organized QRS complexes). Immediate defibrillation 200 J biphasic delivered. Converted briefly to sinus rhythm then immediately back to VF. Continued high-quality CPR, defibrillated again 200 J. Persistent VF. Given epinephrine 1 mg IV, continued CPR x2 minutes. Third defibrillation 200 J, converted to sinus rhythm with palpable pulse (ROSC - return of spontaneous circulation 12 minutes after collapse). Total downtime 12 minutes (acceptable for good neurologic outcome if under 15 minutes with good CPR). Immediately post-ROSC: BP 75/50 (hypotensive), started norepinephrine infusion. 12-lead ECG: sinus tachycardia rate 115, ST elevations in V2-V4 (anterior STEMI - acute MI caused VF). Troponin 2.5 (elevated). Intubated for airway protection, started target temperature management 33°C x24 hours (neuroprotection). Emergent cardiac catheterization: total occlusion of proximal LAD (acute thrombotic occlusion - culprit), successful PCI with drug-eluting stent to LAD, TIMI 3 flow restored. Other coronaries normal. Admitted to CCU. Therapeutic hypothermia x24 hours then slow rewarming. Neurologic exam: initially comatose (post-cardiac arrest), no sedation after 48 hours. At 72 hours: awakened, followed commands, no focal deficits (excellent neurologic recovery - good CPR and rapid defibrillation saved brain). Echocardiogram: anterior wall hypokinesis (acute MI), EF 40% (moderately reduced), no other abnormalities. At 1 week extubated, neurologically intact, ambulating. CHA2DS2-VASc score for anticoagulation not applicable (sinus rhythm, no AFib). ICD implantation discussed: survived VF cardiac arrest from acute MI (secondary prevention indication class I - ICD essential to prevent recurrent sudden death). However, guidelines recommend delaying ICD x40 days post-MI (allow time for healing, EF may improve, VF may have been from acute ischemia not chronic substrate). At 2 weeks discharged on aspirin, ticagrelor (dual antiplatelet post-stent), atorvastatin 80 mg, metoprolol 50 mg BID (beta blocker essential post-MI and for arrhythmia prevention), lisinopril. LifeVest (wearable defibrillator) prescribed for home monitoring during 40-day waiting period for ICD. Cardiac rehab. At 6 weeks repeat echocardiogram: EF improved to 45% (partial recovery common after revascularization), anterior wall hypokinesis persists. Still meets ICD criteria: survived VF cardiac arrest, EF 45% (borderline but survived VF). ICD implanted for secondary prevention. At 3 months: neurologically intact, back to work, functional status excellent. No ICD shocks. At 1 year: no arrhythmia recurrences, ICD never fired, continues optimal medical therapy. Survived sudden cardiac death due to rapid bystander CPR, early defibrillation, revascularization, and ICD.
