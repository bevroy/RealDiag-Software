tree_id: ENDO-OSTEOPENIA
name: Osteopenia (Low Bone Mass)
family: endocrinology
specialty: Endocrinology
icd10: M85.80
snomed: 312894000
urgency: []
homeopathy: []
presentations:
  - Asymptomatic (found on bone density screening)
  - Low bone mineral density on DEXA scan
  - T-score between -1.0 and -2.5 (osteopenia range)
  - Risk factors: postmenopausal women, age >50, family history of osteoporosis
  - Low body weight or BMI <20
  - Previous fragility fracture
  - Chronic glucocorticoid use
  - No fracture history (distinguishes from osteoporosis clinically)
workup:
  - Bone mineral density (BMD) testing via DEXA scan
  - T-score -1.0 to -2.5 = osteopenia
  - T-score ≤-2.5 = osteoporosis
  - Measure hip (femoral neck, total hip) and lumbar spine
  - Secondary causes evaluation
  - Complete blood count
  - Comprehensive metabolic panel (calcium, phosphate, creatinine)
  - 25-hydroxyvitamin D level (target >30 ng/mL)
  - TSH (hyperthyroidism causes bone loss)
  - Serum protein electrophoresis (multiple myeloma in older adults)
  - Testosterone in men (hypogonadism)
  - Consider: PTH, 24-hour urine calcium, celiac antibodies if indicated
  - Fracture risk assessment
  - FRAX score (10-year fracture risk calculator)
  - Considers age, BMD, risk factors
  - Greater than 20% major osteoporotic fracture or greater than 3% hip fracture warrants treatment
treatment:
  - Non-pharmacologic interventions (all patients)
  - Calcium supplementation: 1000-1200 mg/day total (diet + supplements)
  - Vitamin D supplementation: 800-1000 IU daily (or higher if deficient)
  - Weight-bearing and resistance exercises (30 min most days)
  - Fall prevention strategies (home safety, balance training, vision correction)
  - Smoking cessation and limit alcohol (<2 drinks/day)
  - Pharmacotherapy indications for osteopenia
  - High fracture risk on FRAX (>20% major, >3% hip)
  - Previous fragility fracture
  - T-score approaching -2.5 with additional risk factors
  - Most osteopenia patients do NOT require medication - lifestyle and monitoring sufficient
  - Bisphosphonates if pharmacotherapy indicated
  - Alendronate 70 mg weekly or risedronate 35 mg weekly
  - Take on empty stomach with water, remain upright 30-60 min
  - Alternative agents: denosumab, raloxifene (postmenopausal women)
  - Treat secondary causes
  - Optimize thyroid function
  - Testosterone replacement if hypogonadism in men
  - Minimize glucocorticoid use if possible
  - Repeat DEXA scan every 2-5 years to monitor progression
clinical_pearls:
  - "Osteopenia is intermediate bone density - lower than normal but not osteoporosis"
  - "50% of women >50 have osteopenia - very common"
  - "Most osteopenia patients do not require medication - focus on prevention"
  - "Lifestyle interventions can slow or reverse bone loss in osteopenia"
  - "FRAX score guides treatment decisions - not all osteopenia needs medication"
  - "Weight-bearing exercise stimulates bone formation - key for prevention"
  - "Glucocorticoids most common medication cause of bone loss (even low doses)"
  - "Vitamin D insufficiency (<30 ng/mL) impairs calcium absorption - optimize first"
referrals:
  - Endocrinology if high fracture risk, secondary causes, or considering pharmacotherapy
  - Physical therapy for fall prevention and exercise prescription
  - Rheumatology if underlying inflammatory condition
differentials:
  - Osteopenia (T-score -1.0 to -2.5) - low bone mass without fractures
  - Osteoporosis (T-score ≤-2.5 or fragility fracture)
  - Normal bone density (T-score ≥-1.0)
  - Secondary osteoporosis/osteopenia (hyperparathyroidism, hyperthyroidism, celiac, myeloma)
  - Glucocorticoid-induced bone loss
  - Vitamin D deficiency
trace:
  source: AACE Guidelines on Osteoporosis 2020, NOF Clinician's Guide to Prevention and Treatment
  version: '1.0'
  last_updated: '2025-12-26'
