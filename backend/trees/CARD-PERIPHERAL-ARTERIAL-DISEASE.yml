tree_id: CARD-PERIPHERAL-ARTERIAL-DISEASE
name: Peripheral Arterial Disease Evaluation
family: Cardiology
specialty: Cardiology, Vascular Surgery
chief_complaint: Leg Pain with Walking, Claudication, Non-Healing Wound
description: Evaluation and management of peripheral arterial disease
version: "1.0"
icd10: I26.9
author: RealDiag Clinical Team

entry_point: pad_evaluation

nodes:
  - id: pad_evaluation
    type: question
    text: "Clinical presentation?"
    options:
      - label: "Intermittent claudication (chronic PAD)"
        next: intermittent_claudication
      - label: "Critical limb ischemia"
        next: critical_limb_ischemia
      - label: "Acute limb ischemia"
        next: acute_limb_ischemia

  - id: intermittent_claudication
    type: diagnosis
    name: "Peripheral Arterial Disease - Intermittent Claudication"
    icd10: "I70.219"
    urgency: medium
    workup:
      - PAD - Atherosclerotic stenosis/occlusion of peripheral arteries (lower extremities 90%)
      - Prevalence - 8-12% population, 20% age >70, 200 deaths per 100,000 (US)
      - Risk factors - Smoking (strongest, 4x risk), diabetes (4x risk, more distal disease), age, hypertension, hyperlipidemia, CKD
      - Marker of systemic atherosclerosis - 50% have significant CAD, 30% significant carotid disease, increased MI/stroke risk
      - Fontaine/Rutherford classification
      - Stage I - Asymptomatic (may have abnormal ABI)
      - Stage II - Intermittent claudication (IIa mild, IIb moderate-severe)
      - Stage III - Rest pain
      - Stage IV - Tissue loss (ulceration, gangrene)
      - Intermittent claudication - Reproducible discomfort in muscle groups with exertion, relieved by rest
      - Cramping, aching, fatigue, heaviness (NOT sharp pain)
      - Distance/duration to symptoms consistent
      - Relief within 2-5 minutes of stopping (if longer, consider other causes)
      - Location predicts stenosis level (one level below)
      - Buttock/thigh - Aortoiliac disease (Leriche syndrome: buttock claudication + impotence + absent femoral pulses)
      - Calf - Superficial femoral artery (most common site)
      - Foot - Tibial/peroneal arteries
      - Physical exam - Diminished/absent pulses (femoral, popliteal, dorsalis pedis, posterior tibial), bruits (femoral), cool extremities, prolonged capillary refill >3 sec, hair loss, shiny atrophic skin, dependent rubor (legs hang over bed turn red, then elevate turn pale), muscle atrophy
      - Differential diagnosis - Spinal stenosis (pseudoclaudication - relief with sitting/leaning forward, NOT standing still), venous claudication (relief with elevation), arthritis, Baker's cyst, chronic compartment syndrome
      - Ankle-brachial index (ABI) - FIRST-LINE screening test
      - Ratio of ankle systolic BP to brachial systolic BP (use higher of DP or PT at ankle, higher arm)
      - Normal 1.0-1.4
      - PAD <0.9 (sensitivity 90%, specificity 95%)
      - Mild 0.7-0.9, moderate 0.4-0.69, severe <0.4
      - Non-compressible (calcified vessels) >1.4 (diabetes, CKD) - Use toe-brachial index (TBI <0.7 abnormal) or pulse volume recordings
      - Exercise ABI - If resting ABI borderline, repeat after treadmill (decrease >20% confirms PAD)
      - Segmental pressures and pulse volume recordings - Localize disease level
      - Duplex ultrasound - Visualize stenosis, plaque, measure velocities
      - CT angiography or MR angiography - Detailed anatomy for intervention planning
      - Angiography - Gold standard, but invasive (reserved for when intervention planned)
    treatment:
      - Goals - Improve functional status (reduce symptoms), prevent cardiovascular events (MI/stroke), prevent limb loss
      - Cardiovascular risk reduction - MOST IMPORTANT (reduce mortality)
      - Antiplatelet therapy - Aspirin 75-325 mg daily OR clopidogrel 75 mg daily
      - Clopidogrel slightly superior (CAPRIE trial)
      - Dual antiplatelet (aspirin + clopidogrel) NOT routinely recommended (increased bleeding, no benefit in PAD alone)
      - Exception - After revascularization
      - High-intensity statin - Atorvastatin 40-80 mg or rosuvastatin 20-40 mg
      - LDL goal <70 mg/dL
      - Reduces cardiovascular events 20-25%, may improve claudication
      - Antihypertensive therapy - Goal BP <130/80
      - ACE inhibitor or ARB preferred (ramipril in HOPE trial reduced MI/stroke in PAD)
      - Beta-blockers NOT contraindicated (old myth, do NOT worsen claudication)
      - Diabetes control - HbA1c <7% (reduce microvascular, uncertain macrovascular benefit)
      - SGLT2 inhibitors, GLP-1 agonists reduce cardiovascular events
      - Smoking cessation - MANDATORY (most important intervention)
      - Slows progression, reduces amputation risk 50%
      - Supervised exercise therapy - First-line for claudication
      - 30-45 min treadmill walking 3x/week for 12 weeks minimum
      - Walk to near-maximal pain, rest, repeat
      - Improves walking distance 50-200%, collateral formation
      - More effective than medications
      - Pharmacotherapy for claudication - Adjunct to exercise
      - Cilostazol 100 mg BID - Phosphodiesterase inhibitor (vasodilator + antiplatelet)
      - Increases walking distance 40-60%
      - Side effects - Headache, diarrhea, palpitations
      - Contraindication - Heart failure (class III/IV, increased mortality in CHF trials)
      - Pentoxifylline 400 mg TID - Hemorheologic agent
      - Minimally effective (inferior to cilostazol), rarely used
      - Rivaroxaban 2.5 mg BID + aspirin 100 mg - Dual pathway inhibition
      - COMPASS trial - Reduced cardiovascular events AND major adverse limb events (amputation, acute limb ischemia)
      - Increased bleeding (GI)
      - Consider in high-risk PAD (prior revascularization, amputation, critical limb ischemia)
      - Revascularization - If inadequate response to medical/exercise therapy (lifestyle-limiting symptoms) OR critical limb ischemia
      - Endovascular - Angioplasty ± stenting
      - Preferred first-line (less invasive, lower morbidity)
      - Best for aortoiliac disease (patency 80-90% at 5 years)
      - Femoropopliteal disease - Drug-eluting stents or drug-coated balloons improve patency
      - Tibial disease - Technical success lower, for limb salvage
      - Surgical bypass - Open surgery
      - Aortobifemoral bypass - For aortoiliac disease (excellent patency 90% at 10 years, but higher morbidity)
      - Fem-pop bypass - For femoropopliteal disease, autogenous vein (saphenous) best (80% patency 5 years)
      - Fem-distal bypass - For tibial disease (limb salvage)
      - Indications surgery over endovascular - Long lesions, total occlusions, failed endovascular, younger patients (durability)
      - Endarterectomy - Remove plaque (for short focal stenosis)

  - id: critical_limb_ischemia
    type: diagnosis
    name: "Critical Limb Ischemia"
    icd10: "I70.263"
    urgency: critical
    workup:
      - Critical limb ischemia (CLI) - Chronic ischemic rest pain >2 weeks OR ulceration/gangrene with PAD
      - Severe reduction in blood flow, limb-threatening
      - WIfI classification - Wound, Ischemia, foot Infection (stage severity, predict amputation risk)
      - Rest pain - Constant severe pain (forefoot/toes), worse at night (legs elevated in bed), relief with dependency (hanging leg over bed)
      - Ulceration - Non-healing (usually toes, heel, pressure points), punched-out, painful
      - Gangrene - Tissue necrosis (black, dry or wet)
      - ABI <0.4, toe pressure <30 mmHg, TcPO2 <30 mmHg
      - Natural history - 25% require amputation within 1 year, 25% die within 1 year (cardiovascular events)
    treatment:
      - Urgent vascular surgery referral - Revascularization to save limb
      - Analgesia - Opioids often required for rest pain
      - Wound care - Debridement, offloading, prevent infection
      - Antibiotics - If infection present
      - Revascularization - Endovascular or surgical bypass
      - Goal - Restore inline flow to foot (at least 1 tibial artery patent to foot)
      - Success - 80-90% limb salvage at 1 year with successful revascularization
      - Amputation - If revascularization not possible (no target vessel), extensive tissue loss, or patient not candidate for surgery
      - Below-knee amputation preferred (better functional outcome, prosthetic ambulation)

  - id: acute_limb_ischemia
    type: diagnosis
    name: "Acute Limb Ischemia"
    icd10: "I74.3"
    urgency: critical
    workup:
      - SURGICAL EMERGENCY - Sudden decrease in limb perfusion, threatens limb viability
      - Causes - Thrombosis (60%, acute clot on chronic PAD stenosis) or embolism (40%, AF most common source, cardiac thrombus)
      - "6 Ps - Pain (sudden severe), Pulselessness, Pallor, Paresthesias, Paralysis (motor deficit, late finding), Poikilothermia (cold)"
      - Rutherford classification - Severity
      - I (viable) - No immediate threat, audible Doppler signals
      - IIa (marginally threatened) - Salvageable if prompt treatment, no motor deficit, diminished Doppler
      - IIb (immediately threatened) - Salvageable with immediate revascularization, motor deficit (early, still reversible), inaudible Doppler
      - III (irreversible) - Major tissue loss inevitable, profound paralysis and anesthesia, rigor
      - Duration - <6 hours best prognosis, >6 hours increased risk permanent damage, >12 hours likely irreversible
    treatment:
      - URGENT vascular surgery consult - Minutes to hours matter
      - Anticoagulation - Unfractionated heparin bolus 80 units/kg IV then infusion 18 units/kg/hr (prevent propagation of clot)
      - Do NOT delay for imaging
      - Revascularization
      - Catheter-directed thrombolysis - If viable or marginally threatened (Rutherford I-IIa)
      - Infuse tPA directly into clot via catheter
      - Takes 12-48 hours
      - Contraindications - Recent surgery/stroke/bleeding, irreversible ischemia
      - Surgical thrombectomy/embolectomy - Fogarty catheter balloon extraction
      - If immediately threatened (IIb) or failed thrombolysis
      - Bypass - If extensive occlusive disease
      - Fasciotomy - If >6 hours ischemia (prevent compartment syndrome from reperfusion injury)
      - Amputation - If irreversible ischemia (Rutherford III, no salvage)
      - Complications - Reperfusion injury (rhabdomyolysis, hyperkalemia, acidosis, ARF), compartment syndrome
      - Prognosis - If treated <6 hours, 80-90% limb salvage, if >12 hours 50%
