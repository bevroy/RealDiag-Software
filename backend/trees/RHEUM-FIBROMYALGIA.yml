referrals:
  - 'Rheumatology if: Diagnostic uncertainty (elevated inflammatory markers, synovitis, abnormal labs suggesting alternative diagnosis)'
  - Most fibromyalgia managed by primary care with exercise, CBT, duloxetine/pregabalin/amitriptyline
