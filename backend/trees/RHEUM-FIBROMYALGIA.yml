tree_id: RHEUM-FIBROMYALGIA
name: Fibromyalgia
family: Rheumatology
specialty: Rheumatology
chief_complaint: Widespread pain and fatigue
description: Chronic pain syndrome with widespread musculoskeletal pain, fatigue, sleep disturbance, and cognitive dysfunction. Multimodal treatment with exercise, CBT, and medications (duloxetine, pregabalin) improves quality of life, no cure available.
icd10: M79.7
urgency: non-urgent

workup:
  - Clinical diagnosis: widespread pain (above and below waist, both sides of body) present at least 3 months
  - 2016 Revised criteria: widespread pain index (WPI) and symptom severity scale (SSS)
  - Key symptoms: chronic widespread pain, fatigue, non-restorative sleep, cognitive dysfunction (fibro fog)
  - Pain: diffuse aching, burning, or stabbing, worsened by stress, cold weather, overexertion
  - Fatigue: profound, not relieved by rest
  - Sleep disturbance: difficulty falling asleep, frequent awakening, unrefreshing sleep
  - Cognitive symptoms: difficulty concentrating, memory problems, mental fog
  - Associated symptoms: headaches, IBS symptoms, mood disorders (depression, anxiety 50-70%)
  - Tender points: historical 18-point exam less emphasized now (subjective, unreliable)
  - Normal labs: ESR, CRP, CBC, TSH, CK all normal (rule out inflammatory or endocrine causes)
  - Rule out: hypothyroidism (check TSH), rheumatoid arthritis, lupus, polymyalgia rheumatica, vitamin D deficiency, sleep apnea
  - No imaging needed: normal X-rays and MRI
  - Diagnosis of exclusion: after ruling out other causes of chronic pain

treatment:
  - Multimodal approach: combination of non-pharmacologic and pharmacologic treatments
  - Exercise (most important): aerobic exercise (walking, swimming, cycling) 30 minutes 3-5 times weekly
  - Start low intensity and gradually increase (avoid overexertion causing flares)
  - Improves pain, fatigue, sleep, mood - most effective long-term treatment
  - Cognitive behavioral therapy (CBT): addresses pain catastrophizing, improves coping strategies
  - Sleep hygiene: regular sleep schedule, avoid caffeine and screens before bed, dark quiet room
  - Stress management: relaxation techniques, meditation, yoga, tai chi
  - Pharmacologic treatment: FDA-approved medications
  - Duloxetine (Cymbalta) 30-60 mg daily: SNRI, treats pain and comorbid depression/anxiety (first-line)
  - Pregabalin (Lyrica) 150-450 mg daily divided BID-TID: reduces pain and improves sleep (first-line)
  - Milnacipran (Savella) 50-100 mg BID: SNRI, similar to duloxetine
  - Gabapentin 300-1200 mg TID: alternative to pregabalin, less expensive
  - Amitriptyline 10-50 mg at bedtime: tricyclic antidepressant, improves sleep and pain (older option)
  - Avoid opioids: not effective for fibromyalgia, high addiction risk, worsens outcomes
  - Avoid benzodiazepines: worsen sleep architecture despite sedation
  - NSAIDs: limited benefit (not inflammatory condition)
  - Treat comorbidities: depression, anxiety, sleep apnea if present
  - Realistic expectations: no cure, goal is symptom management and improved function

clinical_pearls:
  - Widespread pain plus fatigue, sleep disturbance, cognitive dysfunction
  - Normal labs (ESR, CRP, CK) - rule out inflammatory and endocrine causes
  - Diagnosis of exclusion after ruling out other causes
  - Exercise most effective long-term treatment despite initial discomfort
  - Duloxetine or pregabalin first-line medications
  - Avoid opioids and benzodiazepines (worsen outcomes)
  - Multimodal treatment: exercise, CBT, sleep hygiene, medications
  - Associated with depression/anxiety in 50-70%

differentials:
  - Polymyalgia rheumatica: bilateral shoulder/hip pain, age over 50, markedly elevated ESR, responds dramatically to steroids
  - Hypothyroidism: fatigue, weight gain, cold intolerance, dry skin, elevated TSH
  - Rheumatoid arthritis: joint swelling, morning stiffness, positive RF or anti-CCP, erosions on X-ray
  - Polymyositis: proximal muscle weakness, elevated CK, muscle biopsy abnormal
  - Chronic fatigue syndrome: profound fatigue worse than pain, post-exertional malaise

trace: |
  A 42-year-old woman presented with 18 months of widespread body pain and fatigue. Pain affects neck, shoulders, back, hips, arms, and legs (diffuse and migratory). Describes as constant aching with sharp pains. Exhausted despite 8-9 hours sleep (unrefreshing sleep). Difficulty concentrating at work (fibro fog). Symptoms started after stressful life event. History of IBS and migraines. No joint swelling. Exam showed diffuse tenderness multiple sites, no synovitis, normal strength, full range of motion all joints. Labs: CBC normal, ESR 8, CRP below 1, TSH 2.1, CK 85 (all normal - ruled out inflammatory, endocrine, muscle disease). Diagnosed with fibromyalgia (widespread pain above 3 months, fatigue, sleep disturbance, cognitive symptoms, normal labs). Explained chronic pain syndrome, no cure but symptoms manageable. Started graduated exercise program: walking 10 minutes daily, gradually increase to 30 minutes 5 times weekly. Referred to CBT for pain management. Sleep hygiene counseling. Started duloxetine 30 mg daily (SNRI treats pain and comorbid anxiety). At 4 weeks exercise tolerance improving, increased to duloxetine 60 mg. At 8 weeks pain improved 30%, mood better, sleep quality improved. At 3 months pain improved 50%, fatigue better, cognitive function improved, exercising regularly 30 minutes most days. At 6 months significant improvement in quality of life, pain 60% better, functional improvement. Continues exercise, duloxetine maintenance, CBT skills for flare management. Counseled that fibromyalgia chronic condition requiring ongoing self-management.
