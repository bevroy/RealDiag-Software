tree_id: RHEUM-FIBROMYALGIA
name: Fibromyalgia
family: rheumatology
specialty: Rheumatology
icd10:
- M79.7
snomed:
- '203082005'
urgency: medium
description: Comprehensive evaluation and management of Fibromyalgia
version: '1.0'
citations:
  - ACR (American College of Rheumatology) Clinical Practice Guidelines
  - EULAR (European League Against Rheumatism) Recommendations
  - UpToDate - Rheumatology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Widespread musculoskeletal pain
- Fatigue
- Sleep disturbance
- Cognitive difficulties (fibro fog)
- Multiple tender points
- Normal lab tests
workup:
- 'Clinical diagnosis: No specific lab test'
- 'ESR/CRP: Normal (if elevated, consider alternative diagnosis like inflammatory
  arthritis)'
- 'CBC, CMP: Normal'
- 'TSH: Rule out hypothyroidism (can mimic fibromyalgia)'
- 'Vitamin D: If low, replace (may improve pain/fatigue)'
- 'RF, anti-CCP, ANA: Not routinely needed unless features of inflammatory arthritis
  or connective tissue disease'
treatment:
- 'Guideline-based treatment options for Fibromyalgia include:'
- 'Education: Explain central sensitization, chronic pain neurobiology - sets realistic
  expectations (management, not cure) (ACR 2023)'
- 'Exercise: Aerobic exercise (walking, swimming, cycling) 30 min 3-5x/week - MOST
  effective non-pharmacologic treatment (ACR 2023)'
- 'Cognitive behavioral therapy: Addresses maladaptive thoughts, improves coping strategies
  (ACR 2023)'
- 'Medications: Duloxetine 60mg dailyOR pregabalin 150-450mg divided BID (for pain)
  OR amitriptyline 10-25mg qHS (for sleep) (ACR 2023)'
- 'Avoid opioids: Not effective for fibromyalgia, high risk of dependence/adverse
  effects (ACR 2023)'
clinical_pearls:
- Central pain amplification syndrome - 2-4% of population, female 7:1, peak onset
  30-50 years
- 'Diagnosis: Widespread pain >3 months + Widespread Pain Index >7 + Symptom Severity
  Score >5 (2016 criteria - tender point exam no longer required)'
- 'Normal labs: Normal ESR/CRP, normal RF/ANA, normal CPK - helps distinguish from
  inflammatory arthritis or myositis'
- 'Comorbidities: Depression (50%), anxiety, irritable bowel syndrome, migraine, TMJ,
  interstitial cystitis - often coexist'
- 'NOT a diagnosis of exclusion: Can coexist with RA, lupus, other rheumatic diseases'
referrals:
- 'Rheumatology if: Diagnostic uncertainty (elevated inflammatory markers, synovitis,
  abnormal labs suggesting alternative diagnosis)'
- Most fibromyalgia managed by primary care with exercise, CBT, duloxetine/pregabalin/amitriptyline
differentials:
  - Polymyalgia rheumatica
  - Rheumatoid arthritis
  - Hypothyroidism
  - Depression
  - Chronic fatigue syndrome
trace:
