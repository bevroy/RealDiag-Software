presentations:
  - Depressed mood for most of the day, more days than not, for at least 2 years (1 year in children/adolescents)
  - Poor appetite or overeating
  - Insomnia or hypersomnia
  - Low energy or fatigue
  - Low self-esteem
  - Poor concentration or difficulty making decisions
  - Feelings of hopelessness
  - Never without symptoms for more than 2 months at a time during 2-year period
  - Functioning impaired but able to maintain daily activities (unlike major depression)
differentials:
  - Persistent depressive disorder (chronic low-grade depression 2+ years)
  - Major depressive disorder (more severe episodic depression)
  - Bipolar disorder II (history of hypomanic episodes)
  - Cyclothymic disorder (chronic mood instability with hypomanic and depressive periods)
  - Adjustment disorder with depressed mood (identifiable stressor, <6 months duration)
  - Hypothyroidism (fatigue, weight gain, check TSH)
  - Chronic fatigue syndrome (predominantly physical fatigue)
  - Substance-induced mood disorder (alcohol, benzodiazepines, beta-blockers)
  - Personality disorders (borderline, avoidant - long-standing interpersonal patterns)
workup:
  - Clinical diagnosis based on DSM-5-TR criteria
  - Psychiatric evaluation and mental status examination
  - 'Duration: depressed mood most days for at least 2 years (adults) or 1 year (children/adolescents)'
  - 'Must have at least 2 of: appetite changes, sleep disturbance, low energy, low self-esteem, poor concentration, hopelessness'
  - Rule out major depressive disorder (may be superimposed on PDD - "double depression")
  - Assess severity and functional impairment
  - Screen for suicidality (PHQ-9, Columbia Scale)
  - Laboratory tests to rule out medical causes
  - TSH, CBC, CMP (rule out hypothyroidism, anemia, electrolyte abnormalities)
  - Vitamin B12, folate, vitamin D levels
  - Consider toxicology screen if substance use suspected
  - Rating scales
  - PHQ-9 (Patient Health Questionnaire-9)
  - Beck Depression Inventory (BDI)
  - Hamilton Depression Rating Scale (HAM-D)
  - Screen for comorbidities
  - Anxiety disorders (present in 50-75%)
  - Substance use disorders (present in 25-50%)
  - Personality disorders (present in 30-40%)
treatment:
  - Psychotherapy (first-line, often combined with medication)
  - Cognitive Behavioral Therapy (CBT) - most evidence
  - Interpersonal therapy (IPT)
  - Psychodynamic therapy
  - Typically requires longer-term therapy (6-12 months or more)
  - Pharmacotherapy
  - SSRIs first-line
  - Sertraline 50-200 mg daily
  - Escitalopram 10-20 mg daily
  - Fluoxetine 20-60 mg daily
  - SNRIs alternative
  - Venlafaxine XR 75-225 mg daily
  - Duloxetine 40-120 mg daily
  - Bupropion 150-450 mg daily (if fatigue/low energy prominent)
  - Combination therapy (psychotherapy + medication) more effective than either alone
  - Lifestyle interventions
  - Regular exercise (30 minutes moderate activity 5 days/week)
  - 'Patient advice: Sleep hygiene'
  - Stress reduction techniques
  - Social support and engagement
  - Nutritional counseling
  - Treatment duration
  - Medication typically continued for at least 1-2 years after response
  - High relapse rate if discontinued prematurely
  - Some patients require long-term maintenance
clinical_pearls:
  - Dysthymia affects 3-6% of general population, more common in women (2:1 ratio)
  - Average duration before seeking treatment is 5-10 years - often viewed as 'personality' rather than treatable disorder
  - Double depression (major depression superimposed on PDD) occurs in 75% at some point - treat the acute major episode
  - Combination therapy (psychotherapy + medication) superior to monotherapy - 75% response vs 48-55% with either alone
  - Earlier onset (before age 21) associated with worse prognosis and higher comorbidity
  - 'High comorbidity: 75% have another psychiatric disorder (anxiety, substance use, personality disorders)'
  - Suicide risk lower than major depression but still elevated - always assess
  - Treatment resistance common - may require augmentation strategies or medication trials
red_flags: []
disposition_guidance: {}
referrals:
  - Psychiatry for medication management and complex cases
  - Psychotherapy referral for CBT or IPT (evidence-based modalities)
  - Psychiatry if treatment-resistant (failed 2+ medication trials)
  - Emergency evaluation if active suicidal ideation or intent
