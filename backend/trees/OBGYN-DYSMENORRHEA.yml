tree_id: OBGYN-DYSMENORRHEA
name: Dysmenorrhea
family: obstetrics_gynecology
specialty: Gynecology/Primary Care
icd10: N94.6
snomed: 266599000
urgency: []
homeopathy: []
presentations:
  - Painful menstrual cramps in lower abdomen
  - Pain typically begins with onset of menses or 1-2 days before
  - Cramping, spasmodic, colicky pain
  - Pain may radiate to lower back and thighs
  - Associated nausea, vomiting, diarrhea
  - Headache and fatigue
  - Pain interferes with daily activities, school, or work
  - Primary dysmenorrhea: starts with menarche or shortly after, no pelvic pathology
  - Secondary dysmenorrhea: develops later in life, associated with pelvic pathology
workup:
  - Detailed menstrual and pain history
  - Age of menarche and when pain started
  - Timing of pain relative to menses
  - Duration and severity of pain (Visual Analog Scale 0-10)
  - Response to over-the-counter pain medications
  - Impact on daily functioning
  - Associated symptoms (heavy bleeding, dyspareunia, dyschezia)
  - Distinguish primary versus secondary dysmenorrhea
  - Primary: pain starts with menarche, age less than 20, cramping begins with menses, lasts 1-3 days
  - Secondary: pain develops later (age greater than 25), progressively worsens, persists beyond menses, deep dyspareunia
  - Sexual history and contraception use
  - Physical examination
  - Abdominal examination (tenderness, masses, guarding)
  - Pelvic examination (if sexually active or severe symptoms)
  - Inspect cervix (cervical stenosis rare cause)
  - Bimanual exam to assess for
  - Uterine size, position, mobility, tenderness
  - Adnexal masses or tenderness
  - Uterosacral nodularity (suggests endometriosis)
  - Cervical motion tenderness (suggests PID)
  - May be completely normal in primary dysmenorrhea
  - Laboratory evaluation
  - Usually NOT needed for primary dysmenorrhea in adolescents
  - Consider if secondary dysmenorrhea suspected
  - Pregnancy test (beta-hCG) if sexually active
  - STI screening (gonorrhea, chlamydia) if sexually active and pelvic pain
  - Complete blood count if heavy bleeding or concern for anemia
  - CA-125 may be elevated in endometriosis (not diagnostic, limited utility)
  - Imaging studies (if secondary dysmenorrhea suspected)
  - Transvaginal ultrasound (or transabdominal if not sexually active)
  - Evaluate for adenomyosis (heterogeneous myometrium, globular uterus)
  - Assess for fibroids, ovarian masses, endometriomas (chocolate cysts)
  - MRI pelvis if suspicion for deep infiltrating endometriosis
  - Laparoscopy (gold standard for endometriosis diagnosis)
  - Indicated if failed medical therapy or high suspicion for endometriosis
  - Direct visualization of pelvic organs
  - Can diagnose and treat endometriosis (excision or ablation)
treatment:
  - Primary dysmenorrhea management
  - First-line therapy: NSAIDs
  - Ibuprofen 400-600 mg every 6 hours (max 2400 mg/day)
  - Naproxen sodium 550 mg initially, then 275 mg every 6-8 hours
  - Mefenamic acid 500 mg TID
  - Start 1-2 days before expected menses and continue first 2-3 days
  - Mechanism: inhibit prostaglandin synthesis (excess prostaglandins cause uterine contractions)
  - 70-80% effective for pain relief
  - Take with food to minimize GI side effects
  - Hormonal contraception (if NSAIDs insufficient or contraception desired)
  - Combined oral contraceptive pills (OCPs)
  - Suppress ovulation, reduce endometrial prostaglandin production
  - Cyclic or continuous regimens (continuous may be more effective)
  - 70-80% report improvement
  - Levonorgestrel IUD (Mirena)
  - Thins endometrium, reduces prostaglandins
  - Particularly effective for heavy bleeding + dysmenorrhea
  - Contraceptive vaginal ring (NuvaRing) or transdermal patch
  - Progestin-only methods (Depo-Provera, Nexplanon)
  - Can cause amenorrhea, eliminating menses and pain
  - Non-pharmacologic measures
  - Heat therapy (heating pad, warm bath) - increases blood flow, relaxes muscles
  - Exercise (aerobic activity) - releases endorphins
  - Transcutaneous electrical nerve stimulation (TENS)
  - Dietary modifications (omega-3 fatty acids, vitamin B1, magnesium)
  - Acupuncture (some evidence for benefit)
  - Secondary dysmenorrhea treatment - treat underlying cause
  - Endometriosis
  - First-line: NSAIDs + hormonal contraception (OCPs, IUD)
  - GnRH agonists (leuprolide) for severe cases - induces medical menopause
  - Add-back hormone therapy to prevent bone loss
  - Laparoscopic excision or ablation of endometriotic lesions
  - Adenomyosis
  - NSAIDs + hormonal contraception
  - Levonorgestrel IUD particularly effective
  - Hysterectomy definitive treatment
  - Uterine fibroids
  - NSAIDs for pain
  - Hormonal contraception (may worsen if submucosal fibroids)
  - Myomectomy or uterine artery embolization for large symptomatic fibroids
  - Pelvic inflammatory disease (PID)
  - Antibiotics: ceftriaxone 500 mg IM + doxycycline 100 mg PO BID for 14 days
  - Treat sexual partners
  - Cervical stenosis
  - Cervical dilation (rare)
  - Refractory dysmenorrhea management
  - Referral to gynecology for further evaluation
  - Consider laparoscopy to diagnose/treat endometriosis
  - Presacral neurectomy or laparoscopic uterine nerve ablation (rarely performed)
  - Hysterectomy as last resort if childbearing complete
clinical_pearls:
  - 'Primary dysmenorrhea affects 50-90% of menstruating women - most common gynecologic complaint in adolescents'
  - 'NSAIDs are first-line treatment - most effective when started 1-2 days before menses (prevent prostaglandin buildup)'
  - 'Combined oral contraceptives effective for 70-80% of women with primary dysmenorrhea'
  - 'Progressive worsening of pain over time suggests secondary dysmenorrhea (endometriosis, adenomyosis)'
  - 'Endometriosis present in 70% of adolescents with dysmenorrhea refractory to NSAIDs and OCPs'
  - 'Heat therapy as effective as ibuprofen for dysmenorrhea pain relief in some studies'
  - 'Continuous OCP regimens (skipping placebo week) more effective than cyclic for dysmenorrhea'
  - 'Dyspareunia (painful intercourse) with dysmenorrhea strongly suggests endometriosis'
referrals:
  - Gynecology for failed medical management, suspicion of endometriosis or adenomyosis
  - Gynecology for consideration of laparoscopy if refractory to NSAIDs and hormonal therapy
  - Pain management or chronic pain specialist for severe refractory dysmenorrhea
  - Pelvic floor physical therapy for associated pelvic floor dysfunction
differentials:
  - Primary dysmenorrhea (no pelvic pathology, starts with menarche, responds to NSAIDs)
  - Endometriosis (progressive pain, dyspareunia, dyschezia, infertility, may have endometriomas)
  - Adenomyosis (age greater than 30, heavy bleeding, diffusely enlarged tender uterus)
  - Uterine fibroids (enlarged irregular uterus, heavy bleeding, pelvic pressure)
  - Pelvic inflammatory disease (cervical motion tenderness, fever, abnormal discharge, STI exposure)
  - Ovarian cyst (unilateral pain, acute if rupture or torsion)
  - Irritable bowel syndrome (cyclical bowel symptoms with menses, bloating, diarrhea/constipation)
  - Interstitial cystitis (pelvic pain, urinary frequency, dysuria)
