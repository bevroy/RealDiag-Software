tree_id: ENDO-OSTEOPOROSIS
name: Osteoporosis
family: Endocrinology
specialty: Endocrinology
chief_complaint: Low bone density or fragility fracture
description: Systemic skeletal disease characterized by low bone mass and microarchitectural deterioration leading to increased fracture risk. Screening and treatment prevent fragility fractures which cause significant morbidity and mortality.
icd10: M81.0
urgency: non-urgent

workup:
  - DEXA scan (DXA): gold standard for bone mineral density at hip and lumbar spine
  - T-score interpretation: normal >-1.0, osteopenia -1.0 to -2.5, osteoporosis <-2.5
  - Screening: all women ≥65, men ≥70, or younger with risk factors (fracture history, glucocorticoid use, smoking, low BMI <20)
  - FRAX score: 10-year probability of major osteoporotic fracture (guides treatment threshold)
  - Labs to exclude secondary causes: CBC, CMP, calcium, phosphate, 25-OH vitamin D, TSH, testosterone (men)
  - Consider celiac serology, serum protein electrophoresis if clinical suspicion for secondary causes
  - Vertebral fracture assessment (VFA): lateral spine imaging on DEXA to detect asymptomatic compression fractures

treatment:
  - Calcium supplementation: 1200 mg daily from diet plus supplements if needed
  - Vitamin D: 800-1000 IU daily, maintain 25-OH vitamin D >30 ng/mL
  - Bisphosphonates first-line: alendronate 70 mg PO weekly or risedronate 35 mg weekly or zoledronic acid 5 mg IV annually
  - Take oral bisphosphonates on empty stomach with full glass water, remain upright 30 minutes (prevent esophagitis)
  - Denosumab 60 mg SC every 6 months: alternative if intolerant to bisphosphonates, inhibits RANK ligand
  - Teriparatide or abaloparatide (anabolic agents): for very high risk (T-score <-3.5 or multiple fractures), SC daily x2 years max
  - Romosozumab: anabolic sclerostin inhibitor for very high risk, monthly SC x12 months followed by antiresorptive
  - Fall prevention: home safety assessment, balance exercises, vision correction, avoid sedatives
  - Weight-bearing and resistance exercise
  - Follow-up DEXA every 1-2 years to monitor response
  - Treatment duration: bisphosphonates 3-5 years then reassess (drug holiday if low risk), denosumab indefinite (rebound risk if stopped)

clinical_pearls:
  - Screen all women ≥65, men ≥70 with DEXA
  - T-score <-2.5 or fragility fracture diagnostic
  - Bisphosphonates first-line - alendronate 70 mg weekly with calcium and vitamin D
  - Take oral bisphosphonates upright fasting 30 minutes before food to improve absorption and prevent esophagitis
  - Denosumab alternative if bisphosphonate intolerant or renal dysfunction
  - Anabolic agents (teriparatide, romosozumab) for very high risk
  - Hip fracture 20% one-year mortality - prevention crucial
  - Drug holiday after 3-5 years bisphosphonates if low risk but continue calcium and vitamin D

differentials:
  - Osteomalacia: vitamin D deficiency causes defective bone mineralization, elevated alkaline phosphatase, low calcium and phosphate
  - Multiple myeloma: bone pain, hypercalcemia, anemia, elevated protein gap, lytic lesions
  - Hyperparathyroidism: elevated PTH and calcium cause bone resorption
  - Paget disease: localized bone pain, elevated alkaline phosphatase, mixed lytic-sclerotic lesions

trace: |
  A 68-year-old postmenopausal woman underwent screening DEXA which showed lumbar spine T-score -2.8 and femoral neck T-score -2.6 (osteoporosis). Height loss of 2 inches from age 40. Labs showed calcium 9.2, vitamin D 18 (low), PTH 52 (normal), TSH 2.1 (normal). VFA showed mild T12 compression fracture (asymptomatic). FRAX score 22% major osteoporotic fracture risk. Started alendronate 70 mg weekly with calcium 600 mg BID and vitamin D 2000 IU daily. Counseled on taking alendronate first thing in morning on empty stomach with full glass water, remain upright 30 minutes before eating. Started weight-bearing exercise and fall prevention interventions. At 6 months vitamin D improved to 38. At 18 months repeat DEXA showed lumbar spine T-score improved to -2.5 and femoral neck stable at -2.6. No new fractures. Continues alendronate with plan to reassess at 5 years.
