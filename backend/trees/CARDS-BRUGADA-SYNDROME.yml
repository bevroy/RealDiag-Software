tree_id: CARDS-BRUGADA-SYNDROME
name: Brugada Syndrome
family: Cardiology
specialty: Cardiology
chief_complaint: Syncope at rest or during sleep
description: Genetic sodium channelopathy causing ST elevations in V1-V3 and risk of ventricular fibrillation during sleep or rest. Structurally normal heart. ICD only effective treatment for high-risk patients. Avoid fever, sodium channel blockers.
icd10: I47.9
snomed: 195080001
presentations:
  - Syncope (typically at rest or during sleep)
  - Nocturnal agonal respiration
  - Palpitations
  - Sudden cardiac death (ventricular fibrillation)
  - Often asymptomatic until sudden death
  - Family history of sudden cardiac death
  - Fever may unmask ECG changes
urgency: urgent

workup:
  - Symptoms: ventricular arrhythmias at rest or sleep
  - Syncope: sudden loss of consciousness at rest or during sleep
  - Nocturnal agonal respirations: gasping or choking sounds during sleep (VF)
  - Sudden cardiac death: often first presentation, typically age 30-40s
  - Palpitations: VT or VF
  - Often asymptomatic: discovered on screening ECG
  - Family history: sudden death in young relatives (during sleep or rest)
  - Demographics: more common in Asian males (Southeast Asia highest prevalence)
  - ECG findings (diagnostic):
  - Type 1 Brugada pattern (diagnostic):
  - Coved ST elevation over 2 mm in V1-V2 (right precordial leads)
  - Descending ST segment
  - Inverted T wave
  - Pseudo-RBBB appearance
  - Type 2 and 3 patterns (suggestive but not diagnostic):
  - Saddleback ST elevation
  - Require provocative testing to confirm
  - Dynamic pattern: ST elevations can be intermittent (move leads up to 2nd intercostal space may unmask)
  - Provocative testing:
  - Sodium channel blocker challenge: procainamide, ajmaline, or flecainide IV
  - Unmasks Type 1 pattern if suspected Brugada
  - Must be done with resuscitation equipment available (can trigger VF)
  - Causes:
  - Genetic: SCN5A mutation most common (sodium channel), over 20 genes identified
  - Autosomal dominant inheritance with variable penetrance
  - Acquired Brugada phenocopy: fever, medications (sodium channel blockers), electrolyte abnormalities
  - Structurally normal heart: normal coronary arteries, normal LV function
  - Risk stratification:
  - High risk: spontaneous Type 1 pattern with syncope or cardiac arrest
  - Intermediate risk: spontaneous Type 1 pattern asymptomatic, family history sudden death
  - Lower risk: drug-induced Type 1 pattern only
  - EP study: controversial, programmed stimulation to induce VF

treatment:
  - ICD (implantable cardioverter-defibrillator):
  - Only effective treatment to prevent sudden death
  - Secondary prevention: survived cardiac arrest or documented VF (class I indication)
  - Primary prevention: spontaneous Type 1 pattern with syncope or family history sudden death (class IIa)
  - Asymptomatic with spontaneous Type 1: controversial, individualized decision
  - Drug-induced Type 1 only: ICD usually not indicated (lower risk)
  - No effective pharmacologic therapy:
  - Quinidine: may reduce arrhythmias (Ito current blocker), not first-line, consider if ICD not feasible or multiple shocks
  - Isoproterenol: acute treatment for VF storm
  - Avoid triggers:
  - Treat fever aggressively: acetaminophen or ibuprofen (fever lowers threshold for VF)
  - Avoid sodium channel blockers: class IC antiarrhythmics (flecainide, propafenone), class IA (quinidine, procainamide), tricyclic antidepressants
  - Avoid certain medications: check www.brugadadrugs.org
  - Moderate alcohol consumption (excessive alcohol can trigger)
  - Catheter ablation:
  - Epicardial ablation of substrate in RVOT
  - Experimental, for refractory VF storm or multiple ICD shocks
  - Not standard therapy
  - Genetic testing and family screening:
  - Identify mutation in 30% (SCN5A most common)
  - Screen first-degree relatives with ECG (baseline and high precordial leads)
  - If mutation identified: genetic testing for relatives
  - Prognosis:
  - With ICD: excellent survival
  - Without treatment: 10% sudden death risk over 3 years if symptomatic
  - Asymptomatic with spontaneous Type 1: 0.5% annual event rate

clinical_pearls:
  - Coved ST elevations over 2 mm in V1-V2 (Type 1 pattern diagnostic)
  - VF occurs at rest or during sleep (opposite of exercise-induced in CPVT or LQTS)
  - Structurally normal heart distinguishes from ARVC
  - Fever can unmask pattern and trigger VF (treat aggressively)
  - ICD only effective treatment for high-risk patients
  - Asian males most affected
  - Avoid sodium channel blockers (class IC, IA)
  - Autosomal dominant, screen first-degree relatives

differentials:
  - Early repolarization: benign ST elevation, different morphology, younger patients
  - Pericarditis: diffuse ST elevations, not localized to V1-V2
  - ARVC: structural RV abnormalities on imaging, epsilon waves
  - Acute MI: chest pain, troponin elevation, dynamic changes

trace: |
  A 35-year-old Thai man presented to ED after syncopal episode while sleeping. Wife heard gasping sounds (nocturnal agonal respirations - VF), found him unresponsive, called 911. Paramedics arrived, patient awake and confused (post-ictal-like from cerebral hypoperfusion, spontaneously converted from VF). No chest pain, no prior cardiac history. Family history: brother died suddenly at age 32 during sleep (sudden cardiac death in young relative - red flag for inherited arrhythmia syndrome). Exam: BP 125/80, HR 72, no murmurs, neurologically intact. ECG: sinus rhythm rate 72 bpm, coved ST elevations 3 mm in V1 and V2 (right precordial leads), descending ST segment with inverted T waves (Type 1 Brugada pattern - diagnostic), normal QT interval. Diagnosed with Brugada syndrome (spontaneous Type 1 pattern, syncope during sleep suggesting VF, family history sudden death, structurally normal heart). High risk for sudden cardiac death. Admitted to telemetry. Echocardiogram: structurally normal heart, EF 60%, no abnormalities (distinguishes from ARVC - no RV structural disease). Coronary angiography not needed (young, no chest pain, Brugada doesn't involve coronary arteries). Genetic testing sent: identified SCN5A mutation (sodium channel, confirms diagnosis, found in 30% of Brugada patients). Risk stratification: spontaneous Type 1 pattern (high risk), syncope during sleep (very high risk - likely aborted sudden death from VF that self-terminated), positive family history. ICD indicated (class I indication - survived apparent VF with syncope). EP study discussed but deferred (controversial role, not needed when diagnosis clear and symptoms present). Counseled on triggers to avoid: treat fevers aggressively with acetaminophen (fever lowers threshold for VF), avoid sodium channel blocking medications (flecainide, propafenone, class IA antiarrhythmics, tricyclic antidepressants - check brugadadrugs.org), moderate alcohol only. ICD implanted for secondary prevention (single-chamber ICD sufficient, no need for pacing function in young patient). Programmed for VF detection and therapy. Family screening: parents and siblings screened with ECG (including high precordial lead placement V1-V2 at 2nd intercostal space). Brother's widow provided ECG from brother before death: showed Type 1 Brugada pattern (explains sudden death). Sister: borderline Type 2 pattern on screening ECG. Underwent IV procainamide challenge test (sodium channel blocker to unmask Type 1), unmasked Type 1 Brugada pattern (diagnostic). Sister genetic testing: same SCN5A mutation. Sister asymptomatic, spontaneous Type 1 not present at baseline. Discussed ICD: controversial in asymptomatic with drug-induced only pattern. Decision: close monitoring, avoid triggers, no ICD at this time (lower risk than proband). At 2 weeks post-ICD implantation: no shocks, asymptomatic, understanding triggers to avoid. At 6 months: developed fever to 102°F from viral illness, treated aggressively with acetaminophen and ibuprofen (fever can trigger VF in Brugada). Fever resolved, no arrhythmias. At 2 years: ICD fired once during sleep for VF (ICD saved his life, justified implantation). Successfully terminated with shock. Continues avoidance of triggers. At 5 years: total of 3 appropriate ICD shocks for VF, all during sleep (classic Brugada pattern). ICD functioning well, excellent quality of life. ICD essential for survival with Brugada syndrome.
