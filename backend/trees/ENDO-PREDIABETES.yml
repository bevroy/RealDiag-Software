presentations:
  - Asymptomatic (most common)
  - Incidental finding on routine labs
  - Acanthosis nigricans (dark, velvety skin patches in neck, axilla, groin)
  - 'Risk factors: obesity, family history of diabetes, sedentary lifestyle'
  - Polycystic ovary syndrome (PCOS)
  - History of gestational diabetes
  - Metabolic syndrome components present
  - Fatigue or increased thirst (mild symptoms)
differentials:
  - Prediabetes (impaired fasting glucose or impaired glucose tolerance)
  - Type 2 diabetes mellitus (FPG ≥126, 2hr OGTT ≥200, or A1c ≥6.5%)
  - Stress hyperglycemia (acute illness, recent hospitalization)
  - Medication-induced hyperglycemia (steroids, thiazides, atypical antipsychotics)
  - Normal glucose metabolism (FPG <100, A1c <5.7%)
workup:
  - Diagnostic criteria (any one of the following)
  - Fasting plasma glucose 100-125 mg/dL (impaired fasting glucose)
  - 2-hour oral glucose tolerance test 140-199 mg/dL (impaired glucose tolerance)
  - Hemoglobin A1c 5.7-6.4%
  - Confirm with repeat testing on different day
  - Assess cardiovascular risk factors
  - Lipid panel (LDL, HDL, triglycerides)
  - Blood pressure
  - BMI and waist circumference
  - Screen for complications
  - Microalbuminuria (urine albumin-to-creatinine ratio)
  - Comprehensive metabolic panel (liver, kidney function)
  - Consider additional testing for PCOS, fatty liver disease if indicated
treatment:
  - Lifestyle modifications (first-line, most effective)
  - 'Weight loss goal: 7-10% of body weight reduces diabetes risk by 58%'
  - 'Diet: Mediterranean or DASH diet, reduce simple carbohydrates, portion control'
  - 'Exercise: 150 minutes/week moderate-intensity aerobic activity + resistance training'
  - Behavioral counseling and support programs (Diabetes Prevention Program)
  - Pharmacotherapy for high-risk patients
  - Metformin 850 mg BID or 1000 mg BID (reduces diabetes risk by 31%)
  - 'Indications: BMI ≥35, age <60, history of gestational diabetes, A1c >6%'
  - Consider in those unable to achieve lifestyle goals
  - Monitor and treat cardiovascular risk factors
  - Statin if indicated (ASCVD risk ≥7.5% or LDL >190)
  - Antihypertensive if BP ≥130/80
  - Aspirin if high cardiovascular risk
  - Annual screening for progression to diabetes
  - Repeat A1c or fasting glucose annually
  - More frequent if very high risk or A1c approaching 6.5%
clinical_pearls:
  - Prediabetes affects 38% of US adults - 96 million Americans
  - 5-10% of prediabetics progress to diabetes annually without intervention
  - Lifestyle intervention more effective than metformin in preventing diabetes (58% vs 31% risk reduction)
  - Weight loss of 7-10% can return blood glucose to normal in many patients
  - Prediabetes increases cardiovascular disease risk even before progression to diabetes
  - A1c 6.0-6.4% has highest risk of progression to diabetes - consider metformin
  - Diabetes Prevention Program (DPP) covered by Medicare for eligible patients
  - Not everyone with prediabetes will develop diabetes - some revert to normal glucose
