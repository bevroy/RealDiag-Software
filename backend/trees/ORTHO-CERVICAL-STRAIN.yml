tree_id: ORTHO-CERVICAL-STRAIN
name: Cervical Strain/Sprain
family: orthopedics
specialty: Orthopedics
icd10: S13.4XXA
snomed: 263244009
urgency: []
homeopathy: []
presentations:
  - Acute neck pain after sudden movement, poor posture, or whiplash injury
  - Pain localized to neck, may radiate to shoulders or upper back
  - Neck stiffness and restricted range of motion
  - Muscle spasm in cervical paraspinal muscles
  - Pain worse with neck movement (flexion, extension, rotation)
  - Headache (tension-type) at base of skull
  - No arm pain, numbness, or weakness (rules out radiculopathy)
  - Tenderness to palpation over cervical paraspinal muscles
  - History of motor vehicle accident (whiplash), sports injury, or prolonged poor posture
workup:
  - Clinical diagnosis based on history and physical examination
  - Physical exam findings
  - Tenderness over cervical paraspinal muscles
  - Muscle spasm and restricted range of motion
  - Pain with active and passive neck movement
  - Normal neurologic exam (upper extremity strength, sensation, reflexes intact)
  - Negative Spurling test (rules out cervical radiculopathy)
  - Red flags requiring imaging or further workup
  - High-energy trauma, neurologic deficits, severe pain
  - Age >65, history of cancer, fever, weight loss
  - Progressive symptoms, bowel/bladder dysfunction
  - Inability to rotate neck 45 degrees to left and right (Canadian C-Spine Rule)
  - Imaging (only if red flags present)
  - Cervical spine X-rays (AP, lateral, odontoid) if trauma
  - MRI cervical spine if neurologic deficits or concern for disc herniation
  - CT cervical spine if bony injury suspected
  - No imaging needed for uncomplicated acute neck pain without trauma
treatment:
  - Acute phase (first 48-72 hours)
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Acetaminophen 1000 mg TID if NSAIDs contraindicated
  - Ice application 15-20 minutes every 2-3 hours for first 48 hours
  - Soft cervical collar for comfort ONLY (limit to 1-2 days max)
  - Prolonged collar use causes muscle weakness and delays recovery
  - Muscle relaxants if severe spasm (cyclobenzaprine 5-10 mg at bedtime x 3-5 days)
  - Subacute phase (after 72 hours)
  - Heat application 15-20 minutes several times daily
  - Gentle range of motion exercises (neck rotations, flexion/extension)
  - Avoid prolonged immobilization - encourage early mobilization
  - Physical therapy if not improving after 2-3 weeks
  - Manual therapy, cervical traction, therapeutic exercises
  - Postural training and ergonomic modifications
  - Strengthening exercises for cervical and scapular stabilizers
  - Activity modifications
  - Avoid prolonged looking down (phone, computer), overhead work
  - Ergonomic workstation setup (monitor at eye level)
  - Frequent position changes, stretching breaks
  - Expected recovery: Most improve within 2-4 weeks
clinical_pearls:
  - "Whiplash injuries can take 6-12 weeks to fully resolve despite normal imaging"
  - "Prolonged soft collar use (>1-2 days) delays recovery and causes muscle atrophy"
  - "Early mobilization and range of motion exercises promote faster recovery"
  - "Spurling test: neck extension + rotation + axial compression reproduces arm pain = radiculopathy"
  - "Canadian C-Spine Rule: imaging needed if age >65, dangerous mechanism, or inability to rotate 45 degrees"
  - "Red flags: high-energy trauma, neurologic deficits, severe midline bony tenderness"
  - "Most cervical strains resolve within 4-6 weeks with conservative treatment"
  - "Chronic whiplash-associated disorder affects 10-20% of patients after MVA"
referrals:
  - Physical therapy if not improving after 2-3 weeks
  - Orthopedic spine or neurosurgery if pain persists >6 weeks or neurologic deficits develop
  - Pain management if chronic pain develops
  - Emergency department if high-energy trauma, neurologic deficits, or inability to clear C-spine
differentials:
  - Cervical strain/sprain (muscular, no neurologic deficits)
  - Cervical disc herniation with radiculopathy (arm pain, positive Spurling test, neurologic deficits)
  - Cervical spondylosis/degenerative disc disease (older age, chronic symptoms)
  - Cervical spinal stenosis (myelopathy symptoms, gait instability, upper motor neuron signs)
  - Whiplash-associated disorder (after MVA, can have persistent symptoms)
  - Cervical fracture (high-energy trauma, severe pain, bony tenderness)
  - Torticollis (head tilted to one side, muscle contracture)
  - Meningitis (fever, nuchal rigidity, photophobia, severe headache)
  - Cervical lymphadenopathy (swollen nodes, infection, malignancy)
trace:
  source: American Academy of Orthopaedic Surgeons Clinical Practice Guidelines on Cervical Spine Injuries
