tree_id: DERM-IMPETIGO-ADULT
name: Impetigo (Adult)
family: dermatology
specialty: Dermatology/Primary Care
chief_complaint: Honey-crusted sores on face or extremities
description: Superficial bacterial skin infection caused by Staphylococcus aureus or Streptococcus pyogenes. Two types - non-bullous (most common, honey-colored crusts) and bullous (blisters). Highly contagious. Responds well to topical or oral antibiotics.
icd10: L01.0
snomed: 48277006
presentations:
  - Honey-colored crusted lesions
  - Superficial erosions with golden crust
  - Small vesicles or pustules that rupture easily
  - Pruritic
  - Common on face (around nose and mouth) and extremities
  - Highly contagious
  - Often secondary to minor trauma, insect bites, or underlying dermatosis
urgency: routine
referrals:
  emergency:
    - Post-streptococcal glomerulonephritis
    - Extensive infection with systemic toxicity
  urgent:
    - Widespread infection
    - Failed outpatient treatment
  routine:
    - Localized impetigo

workup:
  - Clinical diagnosis based on characteristic appearance
  - Types
  - Non-bullous impetigo (70%) - most common
  - Caused by S. aureus (80%), S. pyogenes (20%), or both
  - Begins as small vesicles or pustules on erythematous base
  - Rupture easily leaving superficial erosions
  - Characteristic honey-colored or golden crusts form
  - Surrounding erythema
  - Regional lymphadenopathy common
  - Pruritic, not painful
  - Bullous impetigo (30%)
  - Caused by S. aureus producing exfoliative toxins (exfoliatin A and B)
  - Flaccid bullae (thin-walled blisters) 1-2 cm on normal skin
  - Rupture easily leaving shallow erosions with collarette of scale
  - No honey-colored crust (key difference from non-bullous)
  - Less surrounding erythema
  - Common in infants and young children, rare in adults
  - History
  - Duration - days to weeks
  - Location - face (perioral, perinasal), extremities, areas of skin breakdown
  - Exposures - daycare, close contact with infected person, crowded living conditions
  - Predisposing factors
  - Minor trauma (abrasions, cuts, insect bites)
  - Underlying dermatosis (atopic dermatitis, scabies, herpes simplex) - "impetiginization" of pre-existing condition
  - Poor hygiene, warm humid climate
  - Nasal carriage of S. aureus
  - Diabetes (impaired healing)
  - Physical examination
  - Inspect lesions - superficial erosions with honey-colored crust (non-bullous) or flaccid bullae and shallow erosions (bullous)
  - Distribution - often grouped, may be scattered
  - Surrounding erythema
  - Palpate regional lymph nodes - often tender and enlarged
  - No systemic signs (fever) typically
  - Check for underlying dermatosis - atopic dermatitis, scabies
  - Ecthyma - deeper variant of impetigo
  - Ulcerative lesions extending into dermis (deeper than impetigo)
  - Painful, punched-out ulcers with thick adherent crust
  - Usually on lower legs
  - Heals with scarring (unlike superficial impetigo)
  - More common in immunocompromised, poor nutrition, poor hygiene
  - Caused by S. pyogenes more than S. aureus
  - Laboratory studies - usually not needed
  - Culture - if extensive, recurrent, or not responding to empiric therapy
  - Swab erosion base after removing crust
  - Identifies S. aureus vs S. pyogenes, determines if MRSA
  - Gram stain and culture
  - ASO titer (antistreptolysin O) and anti-DNase B - if concern for post-streptococcal glomerulonephritis
  - Complications - rare
  - Post-streptococcal glomerulonephritis - after S. pyogenes (not S. aureus) impetigo
  - Occurs 2-3 weeks after skin infection
  - Hematuria, proteinuria, hypertension, edema
  - Acute rheumatic fever does NOT occur after skin infection (only after pharyngitis)
  - Cellulitis - deeper infection, requires systemic antibiotics
  - Scarring - with ecthyma (deeper variant)
treatment:
  - Topical antibiotics - for limited disease (few lesions)
  - Mupirocin 2% ointment three times daily x 5 days - first-line
  - Highly effective against S. aureus and S. pyogenes
  - Superior to other topical antibiotics
  - Apply to lesions and surrounding skin
  - Retapamulin 1% ointment twice daily x 5 days - alternative, expensive
  - Avoid neomycin, bacitracin (less effective)
  - Oral antibiotics - for extensive disease, multiple lesions, or involvement of multiple body areas
  - First-line (covers S. aureus and S. pyogenes)
  - Cephalexin 500 mg four times daily x 7 days (or 250 mg QID in children 25-50 mg/kg/day)
  - Dicloxacillin 500 mg four times daily x 7 days
  - Amoxicillin-clavulanate 875 mg twice daily x 7 days
  - If MRSA suspected or confirmed (community-acquired, previous MRSA, treatment failure)
  - Trimethoprim-sulfamethoxazole (Bactrim DS) 1-2 tablets twice daily x 7 days (does NOT cover S. pyogenes - add cephalexin if concerned about strep)
  - Doxycycline 100 mg twice daily x 7 days (avoid in children under 8)
  - Clindamycin 300 mg three times daily x 7 days (increasing resistance)
  - If bullous impetigo - use anti-staphylococcal antibiotic (cephalexin, dicloxacillin, or TMP-SMX if MRSA)
  - Adjunctive measures
  - Remove crusts - soak with warm water or saline compresses, gently remove crusts to allow antibiotic penetration
  - Hygiene
  - Wash with antibacterial soap (chlorhexidine, benzoyl peroxide)
  - Keep nails short, avoid scratching
  - Clean towels, linens daily
  - Avoid sharing personal items (towels, razors, clothing)
  - Infection control - highly contagious
  - Exclude from school/daycare until 24 hours after starting antibiotic therapy
  - Cover lesions if possible
  - Hand hygiene
  - Treat contacts if infected
  - Decolonization for recurrent infections
  - Intranasal mupirocin 2% twice daily x 5 days (eradicate nasal S. aureus carriage)
  - Chlorhexidine or dilute bleach baths
  - Ecthyma (deeper variant) - oral antibiotics required (cephalexin or dicloxacillin x 10 days)
clinical_pearls:
  - Most common bacterial skin infection in children, but occurs in adults
  - Highly contagious - spread by direct contact or fomites
  - Non-bullous impetigo (70%) - honey-colored crusts pathognomonic
  - Bullous impetigo (30%) - caused by toxin-producing S. aureus, flaccid bullae without crusts
  - S. aureus most common cause overall (80%), S. pyogenes (20%)
  - Topical mupirocin effective for limited disease (few lesions)
  - Oral antibiotics for extensive disease - cephalexin first-line
  - MRSA increasing cause - consider TMP-SMX or doxycycline if suspected (previous MRSA, treatment failure)
  - Post-streptococcal glomerulonephritis can occur after strep impetigo (not rheumatic fever)
  - Exclude from school/daycare until 24 hours on antibiotics
  - Remove crusts before applying topical antibiotic (improves penetration)
  - Nasal carriage of S. aureus common - decolonization with intranasal mupirocin for recurrent infections
  - Impetiginization - secondary bacterial infection of pre-existing dermatosis (atopic dermatitis, scabies, HSV)
  - Ecthyma deeper variant - ulcerative, painful, heals with scarring, requires oral antibiotics
differentials:
  - Herpes simplex virus (HSV) - grouped vesicles on erythematous base, no honey-colored crust, painful, Tzanck smear positive
  - Tinea corporis (ringworm) - annular with central clearing, scaly border, KOH positive
  - Contact dermatitis - vesicular, pruritic, no honey-colored crust, history of exposure
  - Atopic dermatitis - chronic, dry, scaly, lichenified, flexural distribution
  - Folliculitis - pustules centered on hair follicles, no honey-colored crust
  - Ecthyma - deeper, ulcerative, painful, scarring (variant of impetigo)
  - Pemphigus vulgaris - flaccid bullae, mucous membrane involvement, Nikolsky sign, requires biopsy
trace:
  - 42-year-old man presents with sores on face for 5 days
  - Started as small blisters around nose that ruptured and formed crusts
  - Spreading to chin and upper lip
  - Itchy, not painful
  - Noticed after shaving cut on upper lip 1 week ago
  - No fever, otherwise well
  - Works in close contact with children (elementary school teacher)
  - No prior history of similar rash
  - Physical examination - multiple superficial erosions with characteristic honey-colored (golden) crusts on upper lip, around nares, and chin
  - Surrounding erythema
  - Lesions grouped, vary in size 3-8 mm
  - No bullae
  - Submandibular lymphadenopathy, tender, enlarged
  - No fever
  - Diagnosis - Non-bullous impetigo (multiple lesions on face, extensive)
  - Treatment plan
  - Oral antibiotics - cephalexin 500 mg four times daily x 7 days (covers both S. aureus and S. pyogenes)
  - Topical adjunct - mupirocin 2% ointment three times daily x 5 days to lesions (synergistic with oral therapy)
  - Remove crusts - soak with warm water compresses 3-4 times daily, gently remove crusts before applying mupirocin
  - Wash face twice daily with antibacterial soap (benzoyl peroxide wash or chlorhexidine)
  - No sharing towels, wash towels daily
  - Exclude from work until 24 hours after starting antibiotics
  - At 3 days - significant improvement, crusting decreased, less erythema, new lesions stopped appearing
  - Continue antibiotics for full 7 days
  - At 7 days - complete resolution, no crusts, erosions healed, residual faint erythema fading
  - Counseled on good hand hygiene, avoid touching face, keep nails short
  - Advised that if recurs consider nasal swab for S. aureus carriage and decolonization

citations:
  - AAD (American Academy of Dermatology) Guidelines
  - IDSA (Infectious Diseases Society of America) Practice Guidelines
  - UpToDate - Dermatology and Infectious Disease
