presentations:
  - Acute watery diarrhea (non-bloody)
  - Nausea and vomiting (often prominent)
  - Low-grade fever <38.5°C (101.3°F)
  - Abdominal cramping
  - Headache and myalgias
  - Sudden onset of symptoms
  - Multiple ill contacts or outbreak setting
  - Symptoms typically resolve in 1-3 days
  - Minimal to no fecal leukocytes
  - Exposure to young children or healthcare setting
differentials:
  - Bacterial gastroenteritis (high fever, bloody diarrhea, fecal leukocytes, more severe)
  - Food poisoning (Staph aureus, Bacillus cereus) - rapid onset, short duration
  - Parasitic infection (Giardia, Cryptosporidium) - more prolonged course
  - C. difficile colitis (recent antibiotic use, healthcare-associated)
  - Inflammatory bowel disease (chronic or recurrent symptoms, weight loss, blood)
  - Medication-induced diarrhea (antibiotics, NSAIDs, metformin, antacids)
workup:
  - Clinical diagnosis based on symptoms and epidemiology
  - No routine testing needed for most cases (self-limited)
  - Stool PCR multiplex panel if diagnosis uncertain (detects norovirus, rotavirus, adenovirus)
  - Basic metabolic panel if signs of moderate-severe dehydration
  - Consider stool culture to rule out bacterial if bloody diarrhea or severe symptoms
  - Assess hydration status (vital signs, mucous membranes, skin turgor, urine output)
treatment:
  - Supportive care - cornerstone of treatment
  - Oral rehydration solution (ORS) - WHO formula or commercial products (Pedialyte)
  - Small frequent sips if nausea/vomiting; avoid large volumes at once
  - IV fluids only if severe dehydration or unable to tolerate oral intake
  - Ondansetron for persistent vomiting (especially in children >6 months)
  - Avoid antimotility agents (loperamide) in children
  - Antimotility agents acceptable in adults if no fever or bloody diarrhea
  - No antibiotics (viral etiology, not effective)
  - Probiotics (Lactobacillus rhamnosus, Saccharomyces boulardii) may reduce duration
  - Zinc supplementation in children 6 months-5 years (10-20 mg daily x 10-14 days)
  - 'Patient advice: Return to normal diet as tolerated; avoid prolonged dietary restrictions'
  - Breastfeeding should continue in infants
  - Isolate patient to prevent transmission (contact precautions)
  - Hand hygiene with soap and water (alcohol sanitizers less effective for norovirus)
  - Disinfect contaminated surfaces with bleach solution
clinical_pearls:
  - Norovirus is most common cause of viral gastroenteritis in all age groups (58% of cases in US)
  - Rotavirus was leading cause in children before vaccine; now rare in vaccinated populations
  - Norovirus is highly contagious - low infectious dose (10-100 viral particles), prolonged shedding
  - Vomiting more prominent than diarrhea suggests viral (especially norovirus)
  - Dehydration is main complication, especially in young children and elderly
  - Viral shedding can persist 2+ weeks after symptoms resolve
  - Outbreaks common in closed settings (cruise ships, schools, nursing homes, hospitals)
  - No specific antiviral therapy available for viral gastroenteritis
  - Rotavirus vaccine (RotaTeq, Rotarix) highly effective - given to infants at 2, 4, 6 months
  - Post-infectious lactose intolerance common - avoid dairy for 1-2 weeks if symptoms recur
