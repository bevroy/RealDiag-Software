tree_id: NEPHRO-KIDNEY-STONE
name: Nephrolithiasis (Kidney Stones)
family: Nephrology
specialty: Nephrology
icd10:
- N20.0
- N20.2
snomed:
- '95570007'
urgency: medium
description: Comprehensive evaluation and management of Nephrolithiasis (Kidney Stones)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden severe colicky flank pain radiating to groin (follows ureter course)
- Pain comes in waves (colicky), crescendo-decrescendo pattern
- Hematuria (microscopic or gross, 90% of cases)
- Nausea and vomiting (from visceral pain and autonomic response)
- Restlessness, inability to find comfortable position (vs peritonitis where patient
  stays still)
- CVA tenderness on affected side
- 'CT scan: Stone visible, may show hydronephrosis (backup of urine)'
- 'Stone types: Calcium oxalate (80%), uric acid (9%), struvite/infection (10%), cystine
  (1%)'
- 'Stone size predicts passage: <5mm (90% pass), 5-10mm (50% pass), >10mm (unlikely,
  needs intervention)'
- 'Infection stone (struvite): Urease-producing bacteria, staghorn calculus, needs
  removal'
- 'Risk factors: Dehydration, high sodium/protein diet, family history, hyperparathyroidism'
- 'Recurrence: 50% within 5-10 years without prevention strategies'
workup:
- CT abdomen/pelvis without contrast (gold standard, 100% sensitive)
- Urinalysis (hematuria in 85%, but absence doesn't rule out stone)
- Basic metabolic panel (Cr, assess for AKI if obstruction)
- Stone analysis if passed (guides prevention)
- 24-hour urine collection (calcium, oxalate, citrate, uric acid) if recurrent
treatment:
- 'Guideline-based treatment options for Nephrolithiasis (Kidney Stones) include:'
- 'Pain control: NSAIDspreferred over opioids (equally effective, less nausea) (KDIGO
  2024)'
- 'Antiemetics: Ondansetron 4-8mg IV PRN (KDIGO 2024)'
- 'Hydration: Encourage PO fluids (KDIGO 2024)'
- 'Medical expulsive therapy: Tamsulosin 0.4mg daily (helps stones 5-10mm pass) (KDIGO
  2024)'
- 'Intervention if: Stone >10mm, obstruction with infection, intractable pain, solitary
  kidney (KDIGO 2024)'
clinical_pearls:
- 'Most common type: Calcium oxalate (80%), then uric acid (10%), struvite (infection),
  cystine (rare)'
- 'Stones <5mm: 90% pass spontaneously with conservative management'
- 'Stones >10mm: Unlikely to pass, usually need intervention'
- CT without contrast is gold standard (100% sensitivity), detects all stone types
- Tamsulosin (alpha-blocker) facilitates stone passage (medical expulsive therapy)
- Recurrence rate 50% at 5-10 years
referrals:
- 'Urology if: Stone >10mm, obstruction with infection, intractable pain, failed conservative
  management'
- 'Procedures: Shock wave lithotripsy (ESWL), ureteroscopy, percutaneous nephrolithotomy
  (PCNL)'
- Nephrology if recurrent stones for metabolic workup
differentials: []
