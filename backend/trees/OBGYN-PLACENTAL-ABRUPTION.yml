tree_id: OBGYN-PLACENTAL-ABRUPTION
name: Placental Abruption
family: Obstetrics Gynecology
specialty: Obstetrics Gynecology
applies_to: female
icd10:
- O45.90
- O45.93
snomed:
- '415105001'
urgency: medium
description: Comprehensive evaluation and management of Placental Abruption
version: '1.0'
citations:
  - ACOG (American College of Obstetricians and Gynecologists) Practice Bulletins
  - RCOG (Royal College of Obstetricians and Gynaecologists) Guidelines
  - UpToDate - Obstetrics and Gynecology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Vaginal bleeding (80%) - may be concealed (20%)
- Abdominal pain (usually severe, constant)
- Uterine tenderness, firmness, or contractions (tetanic uterus)
- 'Fetal distress: Abnormal heart rate tracing, late decelerations'
- Maternal shock out of proportion to visible bleeding (if concealed abruption)
- 'Risk factors: Hypertension, preeclampsia, trauma, cocaine, smoking, prior abruption
  (10% recurrence)'
workup:
- Continuous fetal heart monitoring (most important)
- CBC (assess anemia, monitor for DIC)
- Type & screen/cross 4 units
- Coagulation panel (PT, PTT, fibrinogen - watch for DIC)
- Kleihauer-Betke test (fetal-maternal hemorrhage)
- Ultrasound (may show retroplacental hematoma but often negative)
treatment:
- 'Guideline-based treatment options for Placental Abruption include:'
- 'Stabilize mother: Two large-bore IVs, fluids, type & cross 4 units PRBC (ACOG 2024)'
- 'Continuous fetal monitoring: Assess for fetal distress (ACOG 2024)'
- 'If fetal distress or maternal instability: Emergent C-section (ACOG 2024)'
- 'If stable + preterm: Tocolytics controversial, betamethasone for fetal lung maturity
  (ACOG 2024)'
- 'RhoGAM: 300 mcg IM if Rh-negative mother (Kleihauer-Betke to determine dose) (ACOG
  2024)'
clinical_pearls:
- 'Clinical diagnosis: Ultrasound only 50% sensitive (don''t rule out if negative)'
- 'Concealed abruption (20%): Blood trapped behind placenta, severe maternal/fetal
  compromise'
- 'DIC complication (10%): Tissue factor release from placenta'
- 'Severe abruption: Emergent C-section (fetal distress) or rapid vaginal delivery
  if imminent'
- 'Kleihauer-Betke test: Detects fetal-maternal hemorrhage, give RhoGAM if Rh-negative'
referrals:
- OB/GYN immediately
- Operating room if fetal distress
- ICU if maternal shock or DIC
differentials:
  - Placenta previa
  - Uterine rupture
  - Vasa previa
  - Labor
