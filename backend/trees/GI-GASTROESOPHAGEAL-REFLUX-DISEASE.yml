tree_id: GI-GASTROESOPHAGEAL-REFLUX-DISEASE
name: Gastroesophageal Reflux Disease (GERD)
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Heartburn and regurgitation
description: |
  Chronic reflux of gastric contents into esophagus causing symptoms or complications. Affects 20-30% of Western populations. Lower esophageal sphincter (LES) dysfunction allows acid reflux.
  Classic symptoms - heartburn, regurgitation. Complications include esophagitis, stricture, Barrett's esophagus (intestinal metaplasia, premalignant), adenocarcinoma. Lifestyle modifications and PPIs mainstay of treatment.
icd10: K21.9
urgency: Low
workup:
  - Clinical diagnosis - typical symptoms (heartburn, regurgitation) and response to PPI trial (no testing needed)
  - Heartburn - burning retrosternal discomfort, worse after meals, lying down, bending over
  - Regurgitation - effortless return of gastric contents to mouth (sour/bitter taste)
  - Atypical symptoms - chronic cough, laryngitis, asthma exacerbation, dental erosions, chest pain (non-cardiac)
  - Red flags require endoscopy - dysphagia, odynophagia, weight loss, GI bleeding, anemia, age greater than 60 with new onset symptoms
  - Upper endoscopy (EGD) indications
  - Alarm symptoms (above)
  - Symptoms refractory to 8-12 weeks PPI therapy
  - Long-standing GERD (greater than 5-10 years) to screen for Barrett's esophagus
  - Los Angeles classification of esophagitis - Grade A (less than 5mm mucosal breaks), B (greater than 5mm, not continuous), C (continuous breaks less than 75% circumference), D (greater than 75% circumference)
  - Barrett's esophagus - salmon-colored mucosa, requires biopsy confirmation (intestinal metaplasia)
  - Ambulatory pH monitoring (24-hour or 48-96 hour wireless) if diagnosis uncertain, refractory symptoms on PPI, or pre-operative evaluation
  - DeMeester score greater than 14.7 or pH less than 4 for greater than 4% of time diagnostic
  - Esophageal manometry before anti-reflux surgery - assess peristalsis (rule out achalasia, scleroderma), measure LES pressure
  - Barium swallow evaluates anatomy (hiatal hernia, stricture) but not diagnostic for GERD
treatment:
  - Lifestyle modifications - all patients
  - Elevate head of bed 6-8 inches (gravity reduces nocturnal reflux)
  - Avoid late meals (no food 3 hours before bed)
  - Weight loss if overweight (obesity increases intra-abdominal pressure)
  - Avoid trigger foods - fatty foods, chocolate, peppermint, coffee, alcohol, citrus, tomatoes, spicy foods
  - Smoking cessation (nicotine relaxes LES)
  - Avoid tight clothing
  - Pharmacologic therapy
  - PPI (proton pump inhibitor) first-line - most effective
  - Omeprazole 20mg, lansoprazole 30mg, esomeprazole 40mg, pantoprazole 40mg, rabeprazole 20mg - all once daily 30-60 minutes before first meal
  - Take 80-90% effective for healing esophagitis, symptom relief
  - If partial response, increase to BID dosing (before breakfast and dinner)
  - Duration - 8 weeks for symptom relief and esophagitis healing, continue long-term if symptoms recur (most require maintenance)
  - Step-down to lowest effective dose or on-demand therapy if mild intermittent symptoms
  - H2 receptor antagonists (H2RA) less effective than PPI - ranitidine (withdrawn), famotidine 20-40mg BID
  - Useful for nocturnal breakthrough symptoms on PPI (bedtime H2RA)
  - Tachyphylaxis develops with chronic use
  - Antacids for immediate symptom relief (onset minutes, short duration) - calcium carbonate, aluminum/magnesium hydroxide
  - Alginates (Gaviscon) form foam barrier on top of gastric contents
  - Refractory GERD (symptoms persist on BID PPI x 8-12 weeks)
  - Ensure compliance, appropriate timing (before meals)
  - Upper endoscopy to assess for complications, alternative diagnosis
  - pH monitoring on therapy to confirm acid suppression
  - If continued acid reflux - increase PPI, add H2RA at bedtime
  - If adequate acid suppression - consider functional heartburn, eosinophilic esophagitis, bile reflux
  - Baclofen 5-20mg TID reduces transient LES relaxations (refractory cases)
  - Anti-reflux surgery (fundoplication) if refractory to medical therapy or patient preference (avoid lifelong medications)
  - Nissen fundoplication (360-degree wrap) laparoscopic - 80-90% effective, durability 10+ years
  - Partial fundoplication (Toupet 270-degree) if impaired esophageal motility
  - Complications - dysphagia (5-10%), gas-bloat syndrome, inability to belch/vomit
  - Barrett's esophagus surveillance and treatment
  - No dysplasia - surveillance EGD q3-5 years
  - Low-grade dysplasia - endoscopic ablation (radiofrequency ablation) or surveillance q6-12 months
  - High-grade dysplasia or intramucosal carcinoma - endoscopic resection plus ablation
  - Continue PPI indefinitely for Barrett's (may reduce progression)
clinical_pearls:
  - GERD symptoms do not correlate with severity of esophagitis (can have severe esophagitis without symptoms)
  - Barrett's esophagus adenocarcinoma risk 0.5% per year (requires surveillance)
  - PPI side effects - C. difficile infection, osteoporosis/fractures (long-term), hypomagnesemia, vitamin B12 deficiency, interstitial nephritis (rare)
  - Functional heartburn - symptoms without acid reflux on pH monitoring, poor PPI response (treat with neuromodulators)
  - Eosinophilic esophagitis - food impaction, dysphagia, vertical furrows on endoscopy, eosinophils on biopsy (treat with swallowed fluticasone)
  - Water brash (sudden excessive salivation) due to reflux
  - Avoid NSAIDs and bisphosphonates in severe esophagitis (worsen mucosal injury)
differentials:
  - Peptic ulcer disease
  - Cardiac chest pain (angina)
  - Eosinophilic esophagitis
  - Achalasia
  - Esophageal cancer
  - Functional dyspepsia
trace:
  - 45-year-old obese man (BMI 33) with 2 years of heartburn 3-4 times weekly, worse after meals and at night → Occasional regurgitation → No dysphagia, weight loss, or bleeding → Tried antacids with temporary relief → Lifestyle modifications advised - elevate head of bed, avoid late meals, weight loss → Start omeprazole 20mg daily before breakfast → Significant improvement within 2 weeks, 90% symptom reduction → Continue omeprazole x 8 weeks → Symptoms controlled, attempt to discontinue → Heartburn returns within 1 week → Resume omeprazole 20mg daily long-term maintenance → Loses 15 pounds over 6 months → Attempt dose reduction to every other day → Symptoms remain controlled → Continue weight loss, lifestyle modifications, low-dose PPI as needed
