tree_id: GI-GASTROESOPHAGEAL-REFLUX-DISEASE
name: Gastroesophageal Reflux Disease
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Heartburn and regurgitation
description: |
  Chronic reflux of gastric contents into esophagus causing symptoms or complications.
  Affects 20% of Western population. Pathophysiology: lower esophageal sphincter dysfunction, hiatal hernia, delayed gastric emptying.
icd10: K21.9
urgency: Low
workup:
  - Clinical diagnosis if typical symptoms (heartburn, regurgitation) and no alarm features
  - Alarm features requiring endoscopy: dysphagia, odynophagia, weight loss, GI bleeding, anemia, chronic vomiting
  - Upper endoscopy (EGD) if: alarm features, age >50 with chronic symptoms, failed PPI trial, suspicion for Barrett's esophagus
  - Esophageal pH monitoring or impedance testing if diagnosis uncertain or refractory to PPI
  - Esophageal manometry before anti-reflux surgery (rule out achalasia, assess peristalsis)
  - Barium esophagram if stricture or anatomic abnormality suspected
treatment:
  - Lifestyle modifications: elevate head of bed 6-8 inches, avoid late meals (3 hours before bed), weight loss if obese
  - Avoid trigger foods: caffeine, alcohol, chocolate, peppermint, fatty/spicy foods, citrus, tomatoes
  - PPI therapy first-line: omeprazole 20mg, pantoprazole 40mg, or esomeprazole 40mg daily before breakfast
  - Trial 8 weeks PPI for symptom relief (80% response rate)
  - H2 receptor antagonist (ranitidine, famotidine) alternative if mild symptoms or PPI intolerant
  - Step-down therapy once controlled: reduce to lowest effective dose or on-demand therapy
  - Refractory GERD: increase PPI to twice daily, check compliance, consider pH testing
  - Surgical fundoplication (Nissen) if: severe symptoms refractory to medical therapy, young patient desiring to avoid lifelong PPI
clinical_pearls:
  - Typical symptoms: heartburn (retrosternal burning), regurgitation, worse after meals and when lying down
  - Atypical symptoms: chronic cough, laryngitis, asthma exacerbation, dental erosion (extra-esophageal manifestations)
  - Barrett's esophagus: intestinal metaplasia from chronic acid exposure (1% annual risk of adenocarcinoma)
  - Screen for Barrett's: age >50, chronic GERD >5 years, plus risk factors (male, white, obesity, smoking, hiatal hernia)
  - PPI twice daily more effective than H2RA for healing erosive esophagitis
  - Long-term PPI use risks: C. difficile, pneumonia, hypomagnesemia, osteoporosis, B12 deficiency
differentials:
  - Peptic ulcer disease
  - Functional dyspepsia
  - Cardiac chest pain
  - Esophageal motility disorder
  - Eosinophilic esophagitis
  - Gastritis
trace:
  - Heartburn and regurgitation → Assess for alarm features → None present, typical GERD → Lifestyle modifications and PPI trial → Omeprazole 20mg daily x 8 weeks → Symptoms resolve → Step down to lowest effective dose → Symptoms recur, increase back to daily → Chronic symptoms, consider EGD to screen for Barrett's esophagus
