tree_id: PEDS-IMMUNIZATION
name: Immunization Encounter (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/Public Health
icd10: Z23
snomed: 33879002
urgency: []
homeopathy: []
presentations:
  - Visit specifically for immunization administration
  - Catch-up immunization visit for delayed or missed vaccines
  - Pre-travel vaccination consultation
  - Vaccine required for school or daycare entry
  - Seasonal influenza vaccine visit
  - Routine vaccines per CDC schedule
  - Parent requesting vaccine information or addressing vaccine concerns
  - Special circumstances (outbreak response, post-exposure prophylaxis)
  - Vaccine administration at sick visit if due and child well enough
workup:
  - Review immunization history
  - Obtain official immunization record (state registry, provider records, parent-held record)
  - Review CDC catch-up schedule if behind
  - Identify vaccines due at current visit
  - Assess for missed or delayed vaccines
  - Verify previous adverse reactions to vaccines
  - Confirm all vaccine components documented (manufacturer, lot number, expiration date, site, route, VIS date)
  - CDC/AAP Recommended Immunization Schedule (2025)
  - Birth
  - Hepatitis B (HepB) - 1st dose within 24 hours
  - 1-2 months
  - HepB - 2nd dose (at least 4 weeks after 1st dose)
  - 2 months
  - DTaP (Diphtheria, Tetanus, Pertussis) - 1st dose
  - IPV (Inactivated Poliovirus) - 1st dose
  - Hib (Haemophilus influenzae type b) - 1st dose
  - PCV13/PCV15/PCV20 (Pneumococcal conjugate) - 1st dose
  - Rotavirus (RV1 or RV5) - 1st dose (by age 15 weeks)
  - 4 months
  - DTaP - 2nd dose
  - IPV - 2nd dose
  - Hib - 2nd dose
  - PCV13/15/20 - 2nd dose
  - Rotavirus - 2nd dose
  - 6 months
  - DTaP - 3rd dose
  - IPV - 3rd dose (optional, can wait until 6-18 months)
  - Hib - 3rd dose (depending on vaccine brand)
  - PCV13/15/20 - 3rd dose
  - Rotavirus - 3rd dose (if RV5, not needed for RV1)
  - HepB - 3rd dose (6-18 months)
  - Influenza - annual, starting at 6 months (2 doses first year, 1 dose subsequent years)
  - 12-15 months
  - MMR (Measles, Mumps, Rubella) - 1st dose
  - Varicella - 1st dose
  - Hib - final dose (12-15 months)
  - PCV13/15/20 - final dose (12-15 months)
  - Hepatitis A - 1st dose (12-23 months, 2-dose series 6-18 months apart)
  - 15-18 months
  - DTaP - 4th dose
  - 18-24 months
  - Hepatitis A - 2nd dose (6-18 months after 1st dose)
  - 4-6 years (kindergarten entry)
  - DTaP - 5th dose
  - IPV - 4th dose (final dose)
  - MMR - 2nd dose
  - Varicella - 2nd dose
  - 11-12 years
  - Tdap (Tetanus, Diphtheria, Pertussis) - single dose
  - HPV (Human Papillomavirus) - 2-dose series if starting before age 15 (0, 6-12 months)
  - Meningococcal conjugate (MenACWY) - 1st dose
  - 16 years
  - MenACWY - 2nd dose (booster)
  - Meningococcal B (MenB) - optional, 2-dose series (especially if high risk: complement deficiency, asplenia, outbreak)
  - Annual influenza vaccine
  - Age 6 months and older, every year
  - 2 doses (4 weeks apart) first year for children age 6 months to 8 years
  - 1 dose annually thereafter
  - COVID-19 vaccine
  - Per current CDC recommendations (dosing and schedule evolving)
  - Special populations vaccines
  - Pneumococcal polysaccharide (PPSV23) - high-risk conditions (sickle cell, asplenia, immunodeficiency)
  - Hepatitis A - all children 12-23 months, catch-up to age 18 years
  - Hepatitis B - catch-up if not completed
  - Meningococcal B - high-risk (complement deficiency, asplenia, outbreak)
  - Pre-assessment (before vaccine administration)
  - Review contraindications and precautions
  - Severe allergic reaction (anaphylaxis) to previous dose or vaccine component - CONTRAINDICATION
  - Moderate or severe acute illness (with or without fever) - PRECAUTION, defer vaccines
  - Mild illness (URI, low-grade fever, diarrhea) NOT contraindication - can vaccinate
  - History of Guillain-Barré syndrome - precaution for certain vaccines
  - Immunocompromised (live vaccines contraindicated)
  - Pregnancy (live vaccines contraindicated)
  - Recent blood product administration (may defer MMR, varicella)
  - Screen for contraindications
  - Allergies (eggs, gelatin, latex, neomycin, yeast)
  - Previous severe reaction to vaccine
  - Immune deficiency (congenital, HIV, chemotherapy, high-dose steroids)
  - Pregnancy (adolescent females)
  - Recent blood products (IVIG, transfusion)
  - Current illness severity
  - Physical examination (limited, focused)
  - Vital signs (temperature, weight for dosing)
  - General appearance (assess for acute moderate-severe illness)
  - Injection site examination (previous reactions, keloids)
  - Administer only if child well or mildly ill
  - Informed consent
  - Provide current Vaccine Information Statements (VIS) for each vaccine
  - Required by federal law (National Childhood Vaccine Injury Act)
  - Available in multiple languages
  - Allow time for parent to read and ask questions
  - Address vaccine concerns and hesitancy
  - Use motivational interviewing, presumptive approach
  - Provide evidence-based information
  - Discuss vaccine safety and efficacy
  - Document VIS publication date and date given to parent
treatment:
  - Vaccine administration technique
  - Intramuscular (IM) route (most vaccines)
  - Site selection by age
  - Infants (age less than 12 months): anterolateral thigh (vastus lateralis) - preferred
  - Toddlers and children (age 12 months to 2 years): anterolateral thigh or deltoid
  - Older children and adolescents: deltoid muscle
  - Needle size by age
  - Newborn-infant: 5/8 inch or 1 inch, 22-25 gauge
  - Toddler-preschool: 5/8 to 1 inch, 22-25 gauge
  - School-age and adolescent: 1 to 1.5 inch, 22-25 gauge
  - Inject at 90-degree angle
  - Do NOT aspirate before injection (no longer recommended, causes unnecessary pain)
  - Subcutaneous (SC) route
  - MMR, Varicella (45-degree angle, upper outer triceps or anterolateral thigh)
  - Oral route
  - Rotavirus (oral drops)
  - Intranasal route
  - Live attenuated influenza vaccine (LAIV, FluMist) - age 2-49 years, not immunocompromised
  - Multiple vaccine administration
  - Can administer multiple vaccines same visit (separate injection sites)
  - Separate injection sites by at least 1 inch if same limb
  - Use different limbs when possible
  - Administer most painful vaccine last
  - Pain mitigation strategies
  - Comfort positioning (hold child, not restraint)
  - Breastfeeding during injection (infants)
  - Topical anesthetics (limited benefit, may delay visit)
  - Distraction techniques (bubbles, toys, music, videos)
  - Tactile stimulation (rubbing near site)
  - Do NOT tell child "it won't hurt" (be honest)
  - Age-appropriate explanations
  - Adolescents: sit upright (prevent vasovagal syncope), observe 15 minutes
  - Injection site comfort measures
  - Apply pressure after injection (do NOT rub)
  - Cool compress if swelling
  - Acetaminophen or ibuprofen for pain (do NOT give prophylactically, may reduce immune response)
  - Post-vaccination monitoring
  - Observe 15 minutes (especially first dose of vaccine, history of allergies)
  - Anaphylaxis risk greatest in first 15 minutes
  - Assess for immediate reactions (urticaria, angioedema, wheezing, hypotension)
  - Emergency medications available (epinephrine 0.01 mg/kg IM, max 0.5 mg)
  - Common expected side effects (counsel parents)
  - Local reactions: pain, redness, swelling at injection site (most common)
  - Systemic reactions: low-grade fever, fussiness, decreased appetite
  - Onset typically within 24-48 hours, resolves in 1-3 days
  - Rotavirus: mild diarrhea or vomiting
  - MMR: fever (10-14 days post-vaccine), transient rash
  - Varicella: varicella-like rash (mild, 5-26 days post-vaccine)
  - Management of minor reactions
  - Local reactions: cool compress, acetaminophen or ibuprofen for pain
  - Fever: acetaminophen 15 mg/kg/dose or ibuprofen 10 mg/kg/dose every 4-6 hours as needed
  - Do NOT give antipyretics prophylactically (may reduce immune response)
  - When to call provider
  - High fever (greater than 104°F/40°C)
  - Signs of allergic reaction (hives, swelling, difficulty breathing)
  - Inconsolable crying greater than 3 hours
  - Seizure
  - Severe weakness or unusual behavior
  - Documentation (CRITICAL)
  - Vaccine name (generic and brand)
  - Manufacturer
  - Lot number
  - Expiration date
  - Site of administration (right/left deltoid or thigh, SC or IM)
  - Route of administration
  - Dose (volume in mL)
  - Date and time of administration
  - VIS publication date and date provided to parent
  - Person administering vaccine (name, title)
  - Document in patient chart AND state immunization registry
  - Report to Vaccine Adverse Event Reporting System (VAERS) if serious adverse event
  - Provide immunization record to parent
  - Schedule next vaccine visit
  - Catch-up immunization
  - Use CDC catch-up schedule
  - Minimum intervals between doses (do NOT restart series if delayed)
  - Accelerated schedule if needed (travel, outbreak)
  - Prioritize vaccines: MMR, varicella, Tdap, meningococcal (if age-appropriate)
clinical_pearls:
  - 'Vaccines are one of most important public health interventions - prevent serious infectious diseases and save lives'
  - 'Mild illness (URI, low-grade fever) is NOT contraindication to vaccination - do not defer unnecessarily'
  - 'Multiple vaccines can be safely administered at same visit - separate sites by 1 inch, use different limbs when possible'
  - 'Do NOT aspirate before IM injection (no longer recommended, causes unnecessary pain without benefit)'
  - 'Pain mitigation: breastfeeding, comfort positioning, distraction - NOT restraint'
  - 'Observe 15 minutes post-vaccination for immediate reactions, especially first dose or history of allergies'
  - 'Acetaminophen or ibuprofen for post-vaccine fever or pain - do NOT give prophylactically (may reduce immune response)'
  - 'Address vaccine hesitancy with empathy, presumptive approach, and evidence-based information - motivational interviewing effective'
referrals:
  - Allergy/immunology if history of severe vaccine reaction or anaphylaxis to vaccine component
  - Public health department for vaccine assistance programs (Vaccines for Children, uninsured)
  - Travel medicine clinic if international travel requiring special vaccines (yellow fever, typhoid, Japanese encephalitis)
  - Infectious disease if immunocompromised child needing modified vaccine schedule
differentials:
  - Routine immunization visit per CDC schedule
  - Catch-up immunization for delayed or missed vaccines
  - Travel-related immunization (pre-travel consultation)
  - School or daycare entry requirement vaccines
  - Post-exposure prophylaxis (rabies, hepatitis B, varicella if appropriate)
  - Outbreak response vaccination (meningococcal, measles)
