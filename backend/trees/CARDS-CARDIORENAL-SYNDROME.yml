tree_id: CARDS-CARDIORENAL-SYNDROME
name: Cardiorenal Syndrome
family: Cardiology
specialty: Cardiology
chief_complaint: Worsening renal function in heart failure patient
description: Bidirectional interaction between heart and kidney with acute or chronic dysfunction. Type 1 involves acute HF causing acute kidney injury. Type 2 involves chronic HF causing chronic kidney disease. Reduced renal perfusion from low cardiac output and venous congestion. Diuresis may transiently worsen creatinine but improves long-term outcomes. Continue RAAS inhibitors when possible.
icd10: N17.9
snomed: 14669001
presentations:
  - Acute kidney injury in setting of heart failure
  - Oliguria, rising creatinine
  - Peripheral edema, ascites
  - Dyspnea, orthopnea
  - Jugular venous distension
urgency: urgent

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Cardiorenal syndrome types:
  - Type 1 (acute cardiorenal) - acute HF causes AKI
  - Most common in ADHF, low cardiac output reduces renal perfusion
  - Type 2 (chronic cardiorenal) - chronic HF causes CKD
  - Chronic low perfusion, venous congestion
  - Type 3 (acute renocardiac) - AKI causes acute HF
  - Volume overload, electrolyte disturbances
  - Type 4 (chronic renocardiac) - CKD causes chronic HF
  - Hypertension, anemia, mineral bone disease
  - Type 5 (secondary) - systemic disease affects both (sepsis, amyloidosis)
  - Pathophysiology:
  - Reduced cardiac output (decreased renal perfusion, forward failure)
  - Venous congestion (elevated central venous pressure transmitted to renal veins, backward failure)
  - Neurohormonal activation (RAAS and SNS worsen both HF and renal function)
  - Clinical presentation:
  - Worsening renal function during HF hospitalization or after diuresis
  - Creatinine elevation (often 0.3-0.5 mg/dL increase)
  - Oliguria (urine output under 0.5 mL/kg/hr)
  - Volume overload with edema and congestion
  - Labs:
  - Creatinine elevation to define severity
  - BUN/Cr ratio over 20 suggests prerenal (volume depletion, low perfusion)
  - Electrolytes (hyperkalemia risk with reduced renal function and RAAS inhibitors)
  - Urinalysis (bland sediment with hyaline casts, no RBCs/WBCs)
  - Urine sodium under 20 mEq/L suggests prerenal
  - Assess volume status:
  - If congested (elevated JVP, edema) continue diuresis despite creatinine elevation
  - If euvolemic or dry, hold diuretics and assess for other causes of AKI
  - Imaging:
  - Renal ultrasound (assess for obstruction, chronic kidney disease with small kidneys)
  - Echocardiogram (assess cardiac output and congestion)

treatment:
  - Diuresis (paradoxical but essential):
  - Continue diuretics despite worsening creatinine if still congested
  - Venous congestion worsens renal function more than diuresis
  - Goal is achieving euvolemia with optimal filling pressures
  - Creatinine may transiently worsen during diuresis but improves long-term once euvolemic
  - Acceptable creatinine increase up to 0.3 mg/dL if achieving decongestion
  - Optimize cardiac output:
  - GDMT for HFrEF with ACE inhibitor/ARNI and beta blocker improves cardiac output over time
  - Inotropes if cardiogenic shock (dobutamine or milrinone) but risk arrhythmias
  - RAAS inhibitor management:
  - Do NOT reflexively stop ACE inhibitor/ARB/ARNI when creatinine rises
  - Acceptable creatinine increase up to 30% from baseline
  - Stopping RAAS inhibitors worsens long-term HF and renal outcomes
  - Hold only if creatinine over 3 mg/dL, hyperkalemia (over 5.5 mEq/L), or hypotension
  - Diuretic optimization:
  - If inadequate response, increase IV loop diuretic dose or add thiazide (metolazone) for synergy
  - If worsening renal function limits diuresis, consider ultrafiltration
  - Treat congestion:
  - Elevated JVP most important hemodynamic marker
  - Normalize JVP (under 8 cm H2O) to improve renal perfusion
  - Monitor electrolytes:
  - Hyperkalemia management with holding potassium-sparing diuretics (spironolactone), low-potassium diet, patiromer or zirconium cyclosilicate if needed
  - Hyponatremia management with fluid restriction, avoid overly aggressive diuresis
  - Ultrafiltration if diuretic-resistant severe volume overload
  - Mechanical fluid removal with veno-venous device
  - Hemodialysis if severe AKI (creatinine over 4-5 mg/dL, hyperkalemia, refractory volume overload)
  - Long-term management:
  - Once euvolemic, creatinine often improves
  - Continue GDMT including RAAS inhibitors
  - SGLT2 inhibitors are renoprotective and reduce HF hospitalizations

clinical_pearls:
  - Cardiorenal syndrome involves bidirectional interaction between heart and kidney
  - Type 1 (acute HF causing AKI) is most common
  - Venous congestion worsens renal function more than low cardiac output
  - Continue diuresis despite worsening creatinine if still congested
  - Creatinine may transiently worsen during diuresis but improves long-term once euvolemic
  - Do NOT reflexively stop RAAS inhibitors when creatinine rises (acceptable up to 30% increase)
  - Elevated JVP is most important marker of congestion

differentials:
  - Prerenal AKI from volume depletion or hypotension
  - Intrinsic renal disease (ATN or glomerulonephritis)
  - Postrenal obstruction (BPH or kidney stones)
  - Contrast-induced nephropathy from recent imaging with contrast

trace: |
  A 70-year-old man with HFrEF (EF 25%) and CKD stage 3 (baseline creatinine 1.6 mg/dL) admitted with ADHF. Presented with dyspnea, orthopnea, gained 12 pounds. Exam: BP 125/75, JVP 18 cm H2O (severely elevated - congestion), diffuse crackles, 3+ edema. BNP 1450 pg/mL. Chest X-ray: pulmonary edema. Admitted for diuresis. Started furosemide 80 mg IV BID. Day 1: diuresed 2 liters, weight decreased 5 pounds. Labs: creatinine increased from 1.6 to 2.0 mg/dL (0.4 mg/dL rise - worsening renal function). Team concerned about cardiorenal syndrome. However, patient still congested (JVP 15 cm H2O, crackles, edema 2+). Diagnosis: Type 1 acute cardiorenal syndrome (acute HF causing AKI). Key decision: continue diuresis despite creatinine elevation because still congested. Venous congestion worsens renal function more than diuresis. Continued furosemide 80 mg IV BID. Day 2: diuresed another 2 liters, weight down 5 more pounds. Creatinine increased further to 2.3 mg/dL (team anxious). However, physical exam improving: JVP decreased to 12 cm H2O, crackles improved, edema 1+. Dyspnea much better. Continued aggressive diuresis (goal: achieve euvolemia). Day 3: diuresed 1.5 liters, weight down 3 pounds (total 13 pounds lost). Creatinine peaked at 2.4 mg/dL. Physical exam: JVP 8 cm H2O (normalized - euvolemic), crackles resolved, trace edema only. Patient feeling excellent, no dyspnea. Continued diuresis at lower dose (furosemide 40 mg IV BID). Day 4: weight stable (euvolemic achieved). Labs: creatinine IMPROVED to 2.0 mg/dL (decreased from peak 2.4 - paradoxical improvement after achieving euvolemia). BUN/Cr ratio normalized. This demonstrates that creatinine transiently worsens during diuresis but improves long-term once euvolemic. Venous congestion (elevated JVP) was worsening renal function, not the diuresis. Day 5: transitioned to oral torsemide 40 mg daily, restarted GDMT: sacubitril/valsartan 97/103 mg BID (ARNI - did NOT stop despite creatinine elevation), carvedilol 25 mg BID, spironolactone held temporarily (hyperkalemia risk with worsening renal function). Day 6: creatinine improved further to 1.8 mg/dL (near baseline 1.6 - full recovery). Potassium 4.8 mEq/L, restarted spironolactone 12.5 mg daily (lower dose given renal function). Discharged euvolemic, NYHA class II. At 2 weeks: outpatient follow-up, stable, creatinine 1.7 mg/dL (returned to baseline), potassium 4.6 mEq/L. JVP 7 cm H2O (euvolemic maintained). Uptitrated spironolactone to 25 mg daily. At 1 month: creatinine stable 1.6 mg/dL (baseline), no HF readmission. This case demonstrates that continuing diuresis despite worsening creatinine is appropriate when patient remains congested. Achieving euvolemia (normalized JVP) improved renal function paradoxically. Stopping diuresis prematurely would have left patient congested and worsened both HF and renal outcomes. RAAS inhibitor (ARNI) continued throughout despite creatinine elevation because increase was under 30% and patient benefited from decongestion.
