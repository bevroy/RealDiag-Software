tree_id: NEU-HEMORRHAGIC-STROKE
name: Hemorrhagic Stroke
family: Neurology
specialty: Neurology/Emergency Medicine
chief_complaint: Sudden onset focal neurologic deficit with intracranial hemorrhage
description: Acute neurologic deficit caused by spontaneous rupture of blood vessel resulting in intracerebral hemorrhage (ICH) or subarachnoid hemorrhage (SAH) with devastating morbidity and mortality

icd10: I61.9
snomed: "230690007"

urgency: emergency

homeopathy:
  - remedy: "Arnica montana 200C"
    indications: "Trauma, bruising, hemorrhage, head injury, shock state, bleeding"
  - remedy: "Belladonna 200C"
    indications: "Sudden onset, throbbing headache, flushed face, dilated pupils, confusion"
  - remedy: "Lachesis 200C"
    indications: "Left-sided symptoms, hemorrhage, worse after sleep, purple discoloration"
  - remedy: "Opium 200C"
    indications: "Coma, stupor, stroke-like presentation, slow response, respiratory depression"
  - remedy: "Bothrops 30C"
    indications: "Hemorrhagic tendency, right-sided hemiplegia, blood disorders"

presentations:
  - Sudden severe headache (worst headache of life - SAH)
  - Focal neurologic deficit (hemiparesis, aphasia, visual field defect)
  - Altered mental status or coma
  - Seizure (10-15 percent of ICH presentations)
  - Nausea and vomiting
  - Nuchal rigidity (SAH)
  - Loss of consciousness
  - Rapidly progressive symptoms
  - Worst in early morning hours (elevated BP during sleep)
  - Activity-related onset (SAH during exertion)

workup:
  - Immediate recognition: stroke alert for any acute focal neurologic deficit or worst headache of life, time is critical (golden hour for hemorrhage control)
  - Rapid assessment: airway breathing circulation (ABCs), vital signs (elevated BP common in ICH), Glasgow Coma Scale (GCS), NIHSS stroke scale score (quantify deficit severity), blood glucose (exclude hypoglycemia mimicking stroke)
  - Non-contrast CT head (first-line imaging - immediately): detects acute hemorrhage (hyperdense on CT), distinguishes hemorrhagic from ischemic stroke (critical - thrombolytics contraindicated in hemorrhage), identifies location and size of bleed, detects intraventricular extension or hydrocephalus, detects midline shift or herniation
  - ICH types by location: deep/basal ganglia (hypertensive), lobar (amyloid angiopathy in elderly, AVM in young), cerebellar (worst prognosis if large), intraventricular (poor prognosis), primary vs secondary (trauma, tumor, coagulopathy)
  - CT angiography (CTA head): identify vascular lesions (aneurysm causing SAH, AVM, dural arteriovenous fistula), spot sign (active extravasation predicts hematoma expansion), perform immediately if nontraumatic ICH for surgical planning
  - Labs: CBC with platelets (thrombocytopenia), PT/INR and PTT (coagulopathy), BMP (renal function for contrast), troponin and ECG (cardiac complications common), toxicology if indicated (cocaine amphetamines cause hemorrhagic stroke)
  - Reverse coagulopathy urgently if present: warfarin (INR greater than 1.5) - give 4-factor prothrombin complex concentrate (PCC 25-50 units/kg) plus vitamin K 10 mg IV (faster reversal than FFP), direct oral anticoagulants (dabigatran - idarucizumab, rivaroxaban/apixaban - andexanet alfa or PCC), heparin - protamine sulfate, thrombocytopenia - platelet transfusion
  - Subarachnoid hemorrhage workup: non-contrast CT 95 percent sensitive first 24 hours (blood in basal cisterns, sylvian fissures), lumbar puncture if CT negative and high suspicion (xanthochromia - yellow CSF from bilirubin, elevated RBC count that does not decrease tube 1 to 4), CT angiography or conventional angiography to identify aneurysm (85 percent SAH from aneurysm rupture)
  - MRI brain (if subacute or diagnosis unclear): gradient echo (GRE) or susceptibility-weighted imaging (SWI) detects old microbleeds (suggests hypertensive vasculopathy or amyloid angiopathy), identifies tumor or vascular malformation, better for posterior fossa

treatment:
  - Emergency management: secure airway if GCS less than 8 or declining (intubation for airway protection), elevate head of bed 30 degrees (reduce ICP), IV access (two large bore), activate neurosurgery stroke team
  - Blood pressure management (ICH): lower BP acutely reduces hematoma expansion but balance cerebral perfusion, systolic BP 140-180 mmHg target (lower if possible without neurologic decline), IV nicardipine or labetalol (titratable), avoid nitroprusside (increases ICP), lower BP within 1 hour of presentation if systolic BP greater than 220 mmHg
  - Intracranial pressure (ICP) management: osmotic therapy if signs of herniation or elevated ICP (mannitol 1-1.5 g/kg IV bolus or hypertonic saline 23.4 percent 30 mL bolus), goal ICP less than 20 mmHg, CPP greater than 60-70 mmHg, hyperventilation temporary measure only (target PaCO2 30-35 mmHg)
  - Surgical evacuation indications: cerebellar hemorrhage greater than 3 cm with brainstem compression or hydrocephalus (life-saving), lobar ICH greater than 30 mL within 1 cm of cortical surface with deterioration, obstructive hydrocephalus from intraventricular hemorrhage (external ventricular drain - EVD)
  - Subarachnoid hemorrhage management: nimodipine 60 mg PO/NG every 4 hours x 21 days (reduces vasospasm and improves outcomes), maintain euvolemia (avoid hypovolemia worsens vasospasm), early aneurysm securing within 24-72 hours (coil embolization preferred over surgical clipping for most), monitor for delayed cerebral ischemia (vasospasm peaks day 4-14, serial transcranial Doppler, CT perfusion)
  - Seizure prophylaxis controversial: if seizure at presentation treat with antiseizure medication (levetiracetam 500-1000 mg IV/PO BID preferred), prophylaxis for lobar hemorrhage or cortical involvement reasonable (levetiracetam x 7 days), avoid phenytoin (worsens outcomes)
  - DVT prophylaxis: pneumatic compression devices immediately, subcutaneous heparin 5000 units TID or enoxaparin 40 mg daily after hemorrhage stability confirmed (usually 1-4 days), balance bleeding risk vs thrombosis risk
  - ICU monitoring: continuous cardiac telemetry (arrhythmias common), frequent neurologic checks (hourly initially), repeat CT head at 6 hours and if neurologic decline (detect hematoma expansion), monitor for complications (rebleeding, hydrocephalus, seizures, cerebral edema)
  - Medical complications: fever (associated with worse outcome - treat aggressively with acetaminophen, cooling), hyperglycemia (keep glucose 80-180 mg/dL with insulin), electrolyte abnormalities
  - Long-term management: rehabilitation (physical, occupational, speech therapy), secondary prevention (strict BP control, target less than 130/80 for ICH survivors), avoid anticoagulation if possible (high rebleeding risk especially lobar amyloid angiopathy), restart antiplatelet therapy cautiously after 4-8 weeks if needed for coronary disease

clinical_pearls:
  - Hemorrhagic stroke is 10-15 percent of all strokes but highest mortality (40 percent at 30 days)
  - Non-contrast CT head is first-line imaging (detects acute blood immediately)
  - Blood pressure lowering to 140 mmHg systolic reduces hematoma expansion without harm
  - Spot sign on CTA predicts hematoma expansion (active bleeding)
  - Reverse coagulopathy urgently (PCC for warfarin faster than FFP)
  - Cerebellar hemorrhage greater than 3 cm requires neurosurgical evaluation (life-saving decompression)
  - SAH: worst headache of life, CT 95 percent sensitive first 24 hours, LP if CT negative
  - Nimodipine reduces vasospasm and improves outcomes in SAH
  - Intraventricular extension of ICH worsens prognosis
  - Lobar hemorrhage in elderly suggests cerebral amyloid angiopathy (recurrence risk high)

referrals:
  - Emergency department immediately (stroke alert activation)
  - Neurosurgery emergently for large cerebellar hemorrhage, hydrocephalus, or deteriorating patient (surgical evacuation consideration)
  - Neurocritical care or ICU admission (all hemorrhagic stroke patients)
  - Interventional neuroradiology for SAH aneurysm coiling (preferred over surgical clipping for most)
  - Rehabilitation services (inpatient then outpatient physical, occupational, speech therapy)
  - Vascular neurology for secondary prevention and long-term management

differentials:
  - Ischemic stroke (CT negative for hemorrhage, similar presentation otherwise)
  - Brain tumor with hemorrhage (underlying mass on MRI)
  - Vascular malformation (AVM, cavernoma - younger patients)
  - Cerebral venous thrombosis (hemorrhagic infarct, different pattern)
  - Subdural or epidural hematoma (trauma history, different CT appearance)
  - Hypertensive encephalopathy (elevated BP, confusion, seizures, posterior reversible encephalopathy syndrome PRES on MRI)
  - Migraine with aura (visual symptoms, no permanent deficit)

trace:
  - 62-year-old man with history of poorly controlled hypertension presents to ED via EMS with sudden onset right-sided weakness and slurred speech, onset 1 hour ago while watching TV
  - Past medical history: hypertension x 10 years (poorly compliant with medications), hyperlipidemia, 30 pack-year smoking history
  - Medications: lisinopril 20 mg daily (not taking regularly), atorvastatin 40 mg nightly, aspirin 81 mg daily
  - Patient alert, BP 210/118, HR 92, temperature 98.6F, oxygen saturation 97 percent room air
  - Exam: right hemiparesis (3/5 strength), right facial droop, dysarthria (slurred speech), left gaze preference, NIHSS score 12 (moderate-severe stroke)
  - Glucose 142 mg/dL (normal, not hypoglycemia)
  - Stroke alert activated, immediate non-contrast CT head: left basal ganglia hemorrhage 35 mL volume, no intraventricular extension, no midline shift
  - Labs: INR 1.1 (normal, not on warfarin), platelets 245,000 (normal), creatinine 0.9 mg/dL
  - CT angiography head: spot sign present (active extravasation) predicting hematoma expansion, no aneurysm or AVM identified
  - Diagnosis: spontaneous intracerebral hemorrhage (hypertensive ICH) left basal ganglia with active bleeding
  - Admitted neurocritical care ICU, two large bore IVs placed, head of bed elevated 30 degrees
  - Blood pressure management: IV nicardipine drip started, systolic BP lowered to 140-160 mmHg within 1 hour (aggressive BP reduction to prevent expansion)
  - Neurosurgery consulted: deep location (basal ganglia), no surgical indication currently, monitor clinically and repeat CT in 6 hours
  - Seizure prophylaxis: levetiracetam 1000 mg IV load then 500 mg BID (cortical involvement concern)
  - Repeat CT head 6 hours later: hemorrhage stable at 36 mL (minimal expansion), no new intraventricular blood, patient neurologically stable
  - ICU day 2: BP controlled 145/88 on oral medications (amlodipine 10 mg daily, labetalol 200 mg BID), nicardipine drip weaned off, neurologically unchanged (still right hemiparesis)
  - CT head day 3: hemorrhage stable, surrounding edema present (expected), no mass effect
  - ICU day 5: patient improving, right arm strength 4/5 (was 3/5), speech clearer, transferred to step-down unit
  - DVT prophylaxis started day 4: subcutaneous heparin 5000 units TID (hemorrhage stable)
  - Physical, occupational, speech therapy evaluations: recommends inpatient rehabilitation
  - Day 8: transferred to acute inpatient rehabilitation facility, continued improvement in right-sided strength
  - Rehabilitation 3 weeks: discharged home with outpatient therapy, ambulating with cane, right arm strength 4+/5, speech normal, independent in ADLs with minimal assistance
  - Outpatient follow-up neurology 1 month: repeat MRI brain shows chronic left basal ganglia hemosiderin deposition, small residual cavity, no new hemorrhage
  - Secondary prevention: strict BP control (target less than 130/80) on amlodipine 10 mg and lisinopril 40 mg daily, home BP monitoring, atorvastatin continued, aspirin HELD (high rebleed risk first 6-12 months after ICH, patient has no strong indication for antiplatelet - no CAD or stent)
  - 6 months: BP well controlled at home (average 125/78), no recurrent hemorrhage, mild residual right hand weakness only, returned to work part-time, smoking cessation achieved
