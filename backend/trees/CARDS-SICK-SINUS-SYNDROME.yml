tree_id: CARDS-SICK-SINUS-SYNDROME
name: Sick Sinus Syndrome (Sinus Node Dysfunction)
family: Cardiology
specialty: Cardiology
chief_complaint: Dizziness and fatigue with slow heart rate
description: Dysfunction of sinus node causing bradycardia, sinus pauses, chronotropic incompetence, and often alternating with tachycardia (tachy-brady syndrome). Symptoms from cerebral hypoperfusion. Permanent pacemaker indicated for symptomatic bradycardia.
icd10: I49.5
urgency: urgent

workup:
  - Symptoms: result from bradycardia and cerebral hypoperfusion
  - Fatigue: most common symptom, chronotropic incompetence (inability to increase heart rate with exertion)
  - Dizziness, lightheadedness, presyncope
  - Syncope: from prolonged pauses
  - Dyspnea: from inadequate heart rate response to exertion
  - Palpitations: if tachy-brady syndrome (alternating fast and slow)
  - Confusion, memory problems: especially in elderly from chronic cerebral hypoperfusion
  - Often asymptomatic: discovered on routine ECG
  - ECG manifestations (variable):
  - Sinus bradycardia: resting heart rate under 50 bpm
  - Sinus pauses or arrest: absence of P waves for over 3 seconds
  - Sinoatrial block: intermittent failure of sinus impulse to conduct to atria
  - Junctional escape rhythm: if sinus node fails, AV junction takes over (rate 40-60 bpm)
  - Chronotropic incompetence: inability to reach 85% of age-predicted max heart rate with exercise
  - Tachy-brady syndrome (50%): alternating bradycardia with atrial tachyarrhythmias (AFib, atrial flutter, atrial tachycardia)
  - Physical exam:
  - Bradycardia: slow pulse (under 50 bpm)
  - Irregular pulse: if tachy-brady with intermittent AFib
  - Otherwise often normal
  - Causes:
  - Idiopathic fibrosis: age-related degeneration of sinus node (most common)
  - Ischemic heart disease: RCA supplies sinus node in 60%
  - Medications: beta blockers, calcium channel blockers, digoxin, antiarrhythmics
  - Infiltrative disease: amyloidosis, sarcoidosis, hemochromatosis
  - Collagen vascular disease: lupus, scleroderma
  - Surgical: post-cardiac surgery, atrial ablation
  - Lyme disease: carditis with conduction abnormalities
  - Holter monitor (essential for diagnosis):
  - Correlate symptoms with bradycardia or pauses
  - Document chronotropic incompetence
  - Capture tachy-brady episodes
  - Exercise stress test: assess chronotropic response
  - Echocardiogram: assess for structural heart disease
  - Rule out reversible causes: TSH (hypothyroidism), medication review

treatment:
  - Address reversible causes:
  - Stop offending medications: beta blockers, calcium channel blockers, digoxin if possible
  - Treat hypothyroidism, ischemia, electrolyte abnormalities
  - Permanent pacemaker (definitive treatment):
  - Class I indication: symptomatic bradycardia or pauses
  - Syncope, presyncope, dizziness, fatigue attributed to bradycardia
  - Chronotropic incompetence with symptoms
  - Tachy-brady syndrome: pacemaker allows aggressive rate control of tachycardia without worsening bradycardia
  - Type of pacemaker:
  - Dual-chamber (DDD): most common, maintains AV synchrony
  - Single-chamber atrial (AAI): if no AV nodal disease (rare)
  - Rate-responsive: adjusts rate based on activity level (important for chronotropic incompetence)
  - Management of tachy-brady syndrome:
  - Pacemaker first: allows safe treatment of tachycardia
  - Then rate control: beta blockers or calcium channel blockers (previously contraindicated due to bradycardia)
  - Anticoagulation: if AFib episodes (CHA2DS2-VASc score)
  - Consider catheter ablation: for recurrent atrial tachyarrhythmias
  - No pacemaker needed:
  - Asymptomatic bradycardia or pauses (observation)
  - Reversible causes corrected
  - Prognosis:
  - Excellent with pacemaker (symptoms resolve)
  - Without pacing: progressive symptoms, risk of syncope and injury from falls
  - Tachy-brady increases stroke risk (AFib episodes)

clinical_pearls:
  - Sinus node dysfunction causing bradycardia, pauses, chronotropic incompetence
  - Tachy-brady syndrome: alternating bradycardia with atrial tachyarrhythmias (50%)
  - Holter monitor essential to correlate symptoms with heart rate
  - Permanent pacemaker for symptomatic bradycardia (curative)
  - Pacemaker allows safe treatment of tachycardia in tachy-brady syndrome
  - Age-related degeneration most common cause
  - Rule out reversible causes (medications, hypothyroidism)

differentials:
  - Hypothyroidism: bradycardia from low thyroid, check TSH
  - Medication-induced: beta blockers, calcium channel blockers, digoxin
  - Athletic heart: physiologic bradycardia, asymptomatic, normal chronotropic response
  - AV block: bradycardia from AV nodal disease not sinus node
  - Vasovagal syncope: transient bradycardia with trigger, not chronic

trace: |
  A 78-year-old woman presented with 6 months of progressive fatigue and multiple episodes of dizziness. Noticed inability to climb stairs or walk uphill without severe fatigue and dyspnea (chronotropic incompetence - heart rate not increasing with exertion). Two episodes of near-syncope, once while standing from chair. No chest pain. On metoprolol 25 mg daily for hypertension. Exam: BP 130/75, HR 42 bpm regular (sinus bradycardia), otherwise normal. ECG: sinus bradycardia rate 42 bpm, normal PR interval, no AV block. 48-hour Holter monitor: baseline sinus bradycardia 40-50 bpm during day (abnormally slow), nocturnal rates 35-40 bpm, three sinus pauses over 4 seconds (longest 5.2 seconds - abnormal, over 3 seconds significant), multiple episodes of atrial fibrillation lasting 10-30 minutes (tachy-brady syndrome - alternating AFib with bradycardia), symptom diary correlated dizziness with pauses and AFib episodes. Exercise stress test: baseline HR 45 bpm, peak exercise HR 85 bpm (chronotropic incompetence - should reach 85% of age-predicted max which is 0.85 x (220-78) = 121 bpm, only reached 85 bpm). Diagnosed with sick sinus syndrome with tachy-brady syndrome (sinus bradycardia, prolonged pauses, chronotropic incompetence, episodes of AFib). Symptomatic: dizziness, near-syncope, fatigue correlated with bradycardia and pauses on Holter. TSH normal (ruled out hypothyroidism). Echocardiogram: normal LV function EF 60%, mild LA enlargement, no structural disease. Stopped metoprolol (beta blocker may worsen bradycardia, cannot continue without pacemaker protection). CHA2DS2-VASc score: Hypertension 1, Age 75+ 2, female Sex 1 = 4 points (high stroke risk from AFib episodes, anticoagulation indicated). Permanent pacemaker indicated (class I indication - symptomatic bradycardia with pauses over 3 seconds). Underwent dual-chamber rate-responsive pacemaker (DDD-R) implantation: leads in right atrium and right ventricle, rate-responsive feature adjusts rate based on activity (addresses chronotropic incompetence). Lower rate limit set to 60 bpm (prevents bradycardia and pauses). At 1 week post-implantation: dramatic improvement in fatigue and dizziness (symptoms resolved), pacemaker interrogation showed pacing 65% of time (high burden - sinus node severely dysfunctional). Now safe to restart metoprolol for rate control of AFib episodes (pacemaker prevents excessive bradycardia). Started metoprolol 25 mg BID. Started apixaban 5 mg BID for stroke prevention (CHA2DS2-VASc score 4). At 1 month: asymptomatic, able to climb stairs and walk hills without fatigue (chronotropic response restored by rate-responsive pacing), no dizziness, no near-syncope. Pacemaker functioning well. At 6 months: excellent quality of life, no symptoms, continues metoprolol and apixaban, AFib episodes less frequent and well rate-controlled. At 1 year: annual pacemaker check shows appropriate function, battery life 8-10 years remaining. Continues follow-up every 6-12 months. Pacemaker cured symptoms of sick sinus syndrome.
