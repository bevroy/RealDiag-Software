tree_id: ENDO-GOITER
name: Goiter (Thyroid Enlargement)
family: endocrinology
specialty: Endocrinology
icd10: E04.9
snomed: 3716002
urgency: []
homeopathy: []
presentations:
  - Visible neck swelling or fullness
  - Palpable thyroid enlargement
  - Sensation of neck tightness or pressure
  - Difficulty swallowing (dysphagia) if large
  - Choking sensation
  - Hoarseness or voice changes (recurrent laryngeal nerve compression)
  - Shortness of breath or stridor if severe tracheal compression
  - May be asymptomatic (incidental finding)
  - May have symptoms of hyperthyroidism or hypothyroidism
workup:
  - Physical examination
  - Palpation for size, symmetry, nodules, tenderness
  - Grade goiter (WHO classification): Grade 0-3
  - Auscultate for bruit (suggests Graves' disease)
  - Check for Pemberton sign (raise arms overhead - facial flushing, stridor suggests thoracic inlet obstruction)
  - Thyroid function tests
  - TSH (primary screening test)
  - Free T4 and free T3 if TSH abnormal
  - Thyroid ultrasound
  - Assess size, echotexture, presence of nodules
  - Measure dimensions and calculate volume
  - Thyroid antibodies
  - Anti-TPO and anti-thyroglobulin (Hashimoto thyroiditis)
  - TSH receptor antibodies (Graves' disease)
  - If nodules present: fine needle aspiration (FNA) based on size and ultrasound characteristics
  - CT or MRI neck/chest if substernal extension or severe compressive symptoms
  - Pulmonary function tests with flow-volume loops if concern for tracheal compression
treatment:
  - Management based on etiology and symptoms
  - Iodine deficiency goiter
  - Iodine supplementation (150 mcg/day)
  - Rare in developed countries with iodized salt
  - Hypothyroid goiter (Hashimoto thyroiditis)
  - Levothyroxine replacement to normalize TSH
  - May reduce goiter size over time
  - Hyperthyroid goiter (Graves' disease, toxic multinodular goiter)
  - Antithyroid medications (methimazole, propylthiouracil)
  - Radioactive iodine ablation
  - Thyroidectomy if severe or refractory
  - Non-toxic goiter (euthyroid)
  - Observation if small and asymptomatic
  - Levothyroxine suppression therapy (controversial, limited benefit)
  - Radioactive iodine to shrink goiter (off-label)
  - Surgery (thyroidectomy) if compressive symptoms or substernal extension
  - Indications: dysphagia, dyspnea, cosmetic concerns, suspicious nodules
  - Avoid goitrogens if large goiter (excessive cruciferous vegetables, soy in large amounts)
clinical_pearls:
  - "Goiter most commonly due to iodine deficiency worldwide, but Hashimoto thyroiditis in US"
  - "Goiter can be diffuse (smooth) or nodular (multinodular goiter)"
  - "Euthyroid goiter (normal thyroid function) most common presentation"
  - "Pemberton sign: facial flushing and respiratory distress when arms raised - suggests substernal extension"
  - "Rapid goiter growth or hard, fixed mass raises concern for thyroid cancer"
  - "Lithium, amiodarone, and interferon can cause goiter"
  - "Multinodular goiter increases with age - 5% of women >60 have palpable multinodular goiter"
  - "Even large goiters rarely cause significant compression unless substernal"
referrals:
  - Endocrinology for all goiters to determine etiology and management
  - Otolaryngology or endocrine surgery if compressive symptoms or substernal extension
  - Immediate ENT/Surgery if acute airway compromise
differentials:
  - Diffuse goiter (Graves' disease, Hashimoto thyroiditis, iodine deficiency)
  - Multinodular goiter (toxic or non-toxic)
  - Thyroid nodule (solitary or dominant nodule)
  - Thyroiditis (subacute, acute, chronic)
  - Thyroid cancer (rapidly growing, hard, fixed mass)
  - Substernal goiter (retrosternal extension, may compress trachea)
  - Medication-induced goiter (lithium, amiodarone, interferon)
trace:
  source: ATA Guidelines on Thyroid Nodules and Goiter 2015, European Thyroid Association Guidelines
  version: '1.0'
