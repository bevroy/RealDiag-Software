tree_id: SURG-HERNIA-INGUINAL
name: Inguinal Hernia (Surgical Evaluation)
family: surgery
specialty: Surgery, Primary Care
chief_complaint: Groin bulge, inguinal hernia
description: |
  Inguinal hernia is protrusion of abdominal contents through inguinal canal.
  Most common hernia type (75% of all hernias). More common in men (9:1 ratio).
  Surgical repair (herniorrhaphy) is definitive treatment for symptomatic hernias.
icd10: K40.90
snomed: "396232000"
presentations:
  - Groin bulge or mass, more prominent with standing, coughing, straining
  - Reducible - can push contents back into abdomen
  - Dull aching or dragging sensation in groin
  - May radiate to scrotum or labia
  - Worse with physical activity, lifting, prolonged standing
  - Relieved by lying down
  - Asymptomatic hernias discovered on physical exam
  - Risk factors - male sex, age, chronic cough, constipation, heavy lifting, obesity, previous hernia, family history
urgency: Low
referrals:
  emergency:
    - Incarcerated hernia (irreducible, tender)
    - Strangulated hernia (incarcerated + signs of vascular compromise - severe pain, nausea, vomiting, fever)
    - Bowel obstruction symptoms
  surgery:
    - All symptomatic inguinal hernias
    - Asymptomatic hernias in young healthy patients (prophylactic repair)
    - Large or complicated hernias
workup:
  - History
    - Duration of bulge
    - Reducibility
    - Associated symptoms - pain, nausea, vomiting, constipation
    - Occupation and activity level
    - Previous hernia repairs
    - Risk factors for recurrence
  - Physical examination
    - Inspect both inguinal regions while standing and with Valsalva
    - Palpate inguinal canal
      - Place finger through scrotum into external inguinal ring
      - Ask patient to cough or strain
      - Direct hernia - felt medial to inferior epigastric vessels (bulges through Hesselbach triangle)
      - Indirect hernia - felt lateral to inferior epigastric vessels (through internal ring, may descend into scrotum)
    - Assess reducibility - gentle pressure to reduce contents
    - Examine contralateral side (bilateral in 10%)
    - Check for complications - incarceration, skin changes, bowel sounds in hernia
  - Imaging
    - Clinical diagnosis - imaging not routinely needed
    - Ultrasound if uncertain diagnosis (occult hernia, femoral vs inguinal)
    - CT if concern for complications or alternative diagnosis
treatment:
  conservative_management:
    - Watchful waiting option for
      - Asymptomatic or minimally symptomatic hernias
      - Elderly patients with significant comorbidities
      - Patient preference to defer surgery
    - Risk of incarceration ~1-3% per year
    - Activity modification - avoid heavy lifting, treat constipation, weight loss
    - Hernia trusses NOT recommended (ineffective, may cause skin complications)
  surgical_repair:
    - Indications for surgery
      - Symptomatic hernias (pain, discomfort interfering with activities)
      - Large hernias
      - Incarcerated or strangulated hernias (emergency)
      - Young healthy patients (lower surgical risk, more life-years at risk for incarceration)
    - Surgical approaches
      - Open repair (tension-free with mesh)
        - Lichtenstein repair most common
        - Local or regional anesthesia possible
        - Mesh placed over defect
        - Outpatient procedure
      - Laparoscopic repair (TEP or TAPP)
        - Transabdominal preperitoneal (TAPP) or totally extraperitoneal (TEP)
        - General anesthesia required
        - Benefits - less postoperative pain, faster recovery, better cosmesis
        - Preferred for bilateral hernias or recurrent hernias
        - Slightly higher cost
      - Tissue repair without mesh (Bassini, Shouldice)
        - Reserved for young patients or contaminated fields
        - Higher recurrence rate (10-15% vs 1-3% with mesh)
  postoperative_care:
    - Most procedures outpatient (same-day discharge)
    - Pain control - NSAIDs + acetaminophen, opioids for breakthrough
    - Activity restrictions
      - Light activity immediately
      - No heavy lifting (>10 lbs) for 2-4 weeks
      - Return to full activity 4-6 weeks
    - Complications
      - Chronic pain (10-12%) - most common complication
      - Hematoma or seroma (5-10%)
      - Wound infection (<5%)
      - Recurrence (1-3% with mesh, 10-15% without mesh)
      - Nerve injury (ilioinguinal, iliohypogastric, genitofemoral) causing numbness or pain
      - Testicular atrophy (<1%, from vascular injury)
clinical_pearls:
  - Inguinal hernias do NOT resolve spontaneously in adults (unlike umbilical hernias in children)
  - Indirect hernias more common in young patients (congenital patent processus vaginalis)
  - Direct hernias more common in elderly (acquired weakness of transversalis fascia)
  - Pantaloon hernia - both direct and indirect components
  - Bilateral hernias in 10% - always examine both sides
  - Femoral hernias below inguinal ligament, more common in women, higher strangulation risk
  - Richter hernia - only portion of bowel wall incarcerated (no obstruction, easy to miss)
  - Incarceration risk increases over time - most surgeons recommend repair even if asymptomatic
  - Mesh reduces recurrence but may increase chronic pain
  - Laparoscopic approach preferred for bilateral or recurrent hernias
  - Never attempt to reduce strangulated hernia (may reduce necrotic bowel)
differentials:
  - Inguinal hernia (direct)
  - Inguinal hernia (indirect)
  - Femoral hernia
  - Incarcerated hernia
  - Strangulated hernia
  - Lipoma of cord
  - Hydrocele
  - Lymphadenopathy
  - Femoral artery aneurysm
trace: |
  52-year-old man presented with 6-month history of right groin bulge. Noticed when lifting heavy objects at work. Intermittent dull aching in groin, worse end of day. Bulge disappears when lying down. No nausea, vomiting, constipation. Past medical history: hypertension (controlled). Exam standing position showed 3x2 cm bulge in right inguinal region, increases with Valsalva. On palpation, hernia felt lateral to pubic tubercle (inferior epigastric vessels), extends toward scrotum on straining, easily reducible (indirect inguinal hernia). Left side normal. No tenderness, no skin changes. Vitals normal. Clinical diagnosis of reducible indirect right inguinal hernia. Options discussed: watchful waiting vs surgical repair. Patient works as plumber with frequent heavy lifting, desires repair. Referred to general surgery. Preoperative clearance obtained (EKG normal, no additional testing needed). Underwent elective laparoscopic TEP (totally extraperitoneal) repair with mesh under general anesthesia. Mesh secured over myopectineal orifice, no fixation needed. Surgery 45 minutes, no complications. Discharged home same day. Pain controlled with ibuprofen 600mg q8h and acetaminophen 1000mg q6h, minimal opioid use. Post-op day 1: minimal pain, ambulating well. Instructed no heavy lifting >10 lbs x 4 weeks. At 2 weeks: sutures absorbed, incisions healed, minimal discomfort. At 6 weeks: cleared return to full work including heavy lifting. At 6 months: no recurrence, no chronic pain, excellent outcome.
