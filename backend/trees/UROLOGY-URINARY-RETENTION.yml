id: UROLOGY-URINARY-RETENTION
title: Urinary Retention Diagnostic Tree
family: Urology
specialty: Urology/Emergency Medicine
version: 1.0
icd10: R33.9
last_updated: 2025-11-20
evidence_level: AUA Guidelines, EAU Guidelines
entry: initial_assessment

clinical_pearls:
  - Acute retention = sudden inability to void, painful bladder distension
  - Chronic retention = gradual onset, painless, high post-void residual (>300mL)
  - BPH most common cause in men, medications in women
  - Bladder scan >300mL post-void = significant retention
  - Post-obstructive diuresis after catheterization (monitor fluid status)
  - Neurogenic bladder = detrusor underactivity or sphincter dysfunction

red_flags:
  - Saddle anesthesia (cauda equina syndrome)
  - Bilateral leg weakness or numbness (spinal cord compression)
  - Recent back trauma or surgery (epidural hematoma)
  - Overflow incontinence (bladder overdistension)
  - Fever with retention (obstructive uropathy with infection - emergency)
  - Acute kidney injury (bilateral obstruction or single kidney)

nodes:
- id: initial_assessment
  when: {}
  description: Initial urinary retention evaluation
  tests:
  - History
    - Onset (acute vs chronic)
    - Pain (acute usually painful, chronic painless)
    - Prior episodes
    - Urinary symptoms (hesitancy, weak stream, dribbling)
    - Medications (anticholinergics, sympathomimetics, opioids)
    - Bowel function (constipation)
    - Neurologic symptoms (weakness, numbness, saddle anesthesia)
  - Physical exam
    - Suprapubic palpation (distended bladder)
    - Genital exam (phimosis, meatal stenosis, masses)
    - Digital rectal exam (prostate size, tone, masses)
    - Neurologic exam (lower extremity strength, sensation, reflexes, rectal tone)
  - Bladder ultrasound or bladder scan (volume)
  - Post-void residual (if able to void)
  - Urinalysis and culture
  - BMP (creatinine - assess kidney function)
  suggest_dx: []
  next:
  - when:
      symptoms_contains_any:
      - saddle_anesthesia
      - bilateral_leg_weakness
      - loss_of_rectal_tone
    go: cauda_equina_syndrome
  - when:
      all_of:
      - onset: acute
      - pain: severe
      - unable_to_void: true
    go: acute_urinary_retention
  - when:
      all_of:
      - onset: gradual
      - post_void_residual: '>300mL'
      - pain: minimal_or_none
    go: chronic_urinary_retention
  - default: acute_urinary_retention

- id: cauda_equina_syndrome
  when:
    symptoms_contains_any:
    - saddle_anesthesia
    - bilateral_leg_weakness
    - loss_of_rectal_tone
    - loss_of_anal_sphincter_tone
  description: Cauda equina syndrome - SURGICAL EMERGENCY
  tests:
  - Neurologic exam
    - Lower extremity strength, sensation, reflexes
    - Saddle anesthesia (perineum, buttocks, inner thighs)
    - Rectal tone (decreased or absent)
    - Anal wink reflex (absent)
    - Bulbocavernosus reflex
  - MRI lumbar spine STAT (gold standard)
    - Disc herniation (most common)
    - Epidural abscess
    - Epidural hematoma
    - Tumor
    - Spinal stenosis
  - Bladder catheterization (measure volume, decompress)
  - BMP, CBC
  suggest_dx:
  - Cauda equina syndrome
    - Lumbar disc herniation (L4-L5, L5-S1 most common)
    - Epidural abscess
    - Epidural hematoma (post-procedural, trauma, anticoagulation)
    - Spinal tumor
    - Spinal stenosis (severe)
  referrals:
  - Neurosurgery STAT
  - Spine surgery STAT
  - ICU admission
  management:
  - EMERGENT surgical decompression (within 24-48 hours)
    - Outcomes worse if delayed >48 hours
    - Laminectomy and discectomy
  - Foley catheter (bladder decompression)
  - High-dose dexamethasone 10mg IV (if tumor or inflammation)
  - IV antibiotics if epidural abscess
    - Vancomycin 15 mg/kg IV + ceftriaxone 2g IV
  - Reverse anticoagulation if epidural hematoma
  - NPO (for surgery)
  prognosis:
  - Better outcomes if surgery within 48 hours
  - Bladder function may not fully recover
  - May need intermittent catheterization long-term
  next:
  - default: null

- id: acute_urinary_retention
  when:
    all_of:
    - onset: acute
    - unable_to_void: true
  description: Acute urinary retention (AUR)
  tests:
  - Bladder scan or ultrasound (confirm distended bladder >300mL)
  - Urinalysis and culture
  - BMP (creatinine, electrolytes)
  - DRE (prostate size, masses)
  - Medication review
  suggest_dx: []
  next:
  - when:
      patient: male
    go: male_acute_retention
  - when:
      patient: female
    go: female_acute_retention
  - default: male_acute_retention

- id: male_acute_retention
  when:
    all_of:
    - patient: male
    - onset: acute
  description: Acute urinary retention in men
  tests:
  - DRE - prostate size, nodules, tenderness
  - PSA (after catheterization, not emergent)
  - Urinalysis and culture (rule out infection)
  - BMP
  - Post-catheterization residual volume
  suggest_dx:
  - Benign prostatic hyperplasia (BPH) - most common cause in older men
  - Prostatitis
  - Prostate cancer
  - Urethral stricture
  - Phimosis, paraphimosis
  - Meatal stenosis
  - Bladder neck contracture (post-surgical)
  - Medications (anticholinergics, sympathomimetics, opioids, antihistamines)
  - Neurogenic bladder
  - Post-operative (anesthesia, pain medications)
  referrals:
  - Urology consultation (next day or urgent if unable to catheterize)
  - Admit if unable to place catheter, concurrent infection, or AKI
  management:
  - Urethral catheterization (Foley 16-18F)
    - Lidocaine jelly for lubrication and anesthesia
    - If unable to pass (urethral stricture, large prostate)
      - Try Coudé catheter (curved tip navigates prostatic urethra)
      - Urology for flexible cystoscopy and guidewire placement
      - Suprapubic catheter (if unable to pass urethral catheter)
  - Monitor urine output (post-obstructive diuresis possible)
    - Replace half of urine output with IV fluids if >200mL/hr
    - Monitor electrolytes (Na, K)
  - Alpha-blocker (improve chances of successful voiding trial)
    - Tamsulosin 0.4mg PO daily
    - Start immediately after catheterization
  - Voiding trial in 3-7 days
    - Remove catheter, measure post-void residual
    - Successful if voids >150mL with PVR <200mL
  - If failed voiding trial
    - Replace catheter, continue alpha-blocker
    - Urology follow-up for further management (TURP, medications)
  - Treat underlying cause
    - Prostatitis - antibiotics (fluoroquinolone x 4-6 weeks)
    - Medications - discontinue offending agent
    - Constipation - laxatives
  discharge_criteria:
  - Catheter draining well
  - No signs of infection
  - Urology follow-up arranged
  - Patient can manage catheter or has home health
  next:
  - default: null

- id: female_acute_retention
  when:
    all_of:
    - patient: female
    - onset: acute
  description: Acute urinary retention in women
  tests:
  - Pelvic exam
    - Pelvic organ prolapse (cystocele, uterine prolapse)
    - Pelvic mass (fibroid, ovarian mass)
    - Atrophic vaginitis
    - Vulvar/vaginal lesions (herpes)
  - Urinalysis and culture
  - Pregnancy test (if reproductive age)
  - Consider pelvic ultrasound (mass, retained tampon, pessary)
  suggest_dx:
  - Medications (most common - anticholinergics, antihistamines, sympathomimetics)
  - Pelvic organ prolapse (cystocele, rectocele, uterine)
  - Pelvic mass (fibroid, ovarian cyst)
  - Post-operative (gynecologic, rectal surgery)
  - Acute cystitis (urethral edema)
  - Herpes simplex (vulvar pain, urethral involvement)
  - Fowler syndrome (young women, detrusor-sphincter dyssynergia)
  - Neurogenic bladder
  - Psychogenic retention (rare)
  referrals:
  - Urology consultation
  - Gynecology if pelvic mass or prolapse
  management:
  - Urethral catheterization (14-16F Foley)
  - Alpha-blocker
    - Tamsulosin 0.4mg PO daily
  - Treat underlying cause
    - Medications - discontinue offending agent
    - UTI - antibiotics
    - Herpes - acyclovir 400mg PO TID x 7-10 days
    - Prolapse - pessary or surgical repair
    - Mass - gynecology referral
  - Voiding trial in 3-7 days
  - If failed trial
    - Replace catheter
    - Consider intermittent self-catheterization (ISC)
    - Urology follow-up
  next:
  - default: null

- id: chronic_urinary_retention
  when:
    all_of:
    - post_void_residual: '>300mL'
    - symptoms: gradual_onset
    - pain: minimal
  description: Chronic urinary retention
  tests:
  - Bladder scan - post-void residual >300mL
  - Urinalysis and culture
  - BMP (creatinine - assess for hydronephrosis)
  - Renal ultrasound (if elevated creatinine - assess for hydronephrosis)
  - Uroflowmetry (measure flow rate)
  - Urodynamic testing (if diagnosis uncertain)
  - DRE (men - prostate)
  - Neurologic exam (rule out neurogenic bladder)
  suggest_dx:
  - Benign prostatic hyperplasia (men)
  - Detrusor underactivity (bladder muscle weakness)
  - Neurogenic bladder
    - Diabetes mellitus (autonomic neuropathy)
    - Multiple sclerosis
    - Parkinson disease
    - Spinal cord injury
    - Disc disease
  - Bladder outlet obstruction (stricture, BPH, pelvic prolapse)
  - Medications (chronic anticholinergic use)
  referrals:
  - Urology for comprehensive evaluation
  - Neurology if neurogenic bladder suspected
  management:
  - Intermittent self-catheterization (ISC)
    - Preferred over indwelling catheter
    - Lower infection risk
    - Teach patient technique (every 4-6 hours)
  - Indwelling catheter (if unable to perform ISC)
    - Urethral Foley (change monthly)
    - Or suprapubic catheter (better long-term option)
  - Medications (limited efficacy in chronic retention)
    - Alpha-blockers (tamsulosin) if BPH
    - 5-alpha-reductase inhibitors (finasteride) if large prostate
    - Bethanechol (cholinergic, improves detrusor contractility) - rarely used
  - Treat underlying cause
    - BPH - TURP or laser prostatectomy
    - Stricture - urethral dilation or urethroplasty
    - Neurogenic - intermittent catheterization, possible sacral neuromodulation
  - Monitor kidney function (risk of hydronephrosis)
  patient_education:
  - Clean intermittent catheterization technique
  - Signs of UTI (fever, cloudy urine, odor)
  - Catheter care (if indwelling)
  next:
  - default: null

- id: post_operative_retention
  when:
    history: recent_surgery
  description: Post-operative urinary retention (POUR)
  tests:
  - Bladder scan (>600mL indicates retention)
  - Urinalysis (rule out UTI)
  - Review operative and anesthesia records
  suggest_dx:
  - Post-operative urinary retention
    - Anesthesia effects (spinal, epidural, general)
    - Opioid pain medications
    - Anticholinergic medications
    - Surgical manipulation (pelvic, rectal, gynecologic surgeries)
    - Overdistension of bladder intraoperatively
  referrals:
  - Urology if retention persists >48 hours after catheter removal
  management:
  - In-and-out catheterization
    - Single catheterization to decompress bladder
    - Repeat PRN if unable to void
  - Indwelling catheter (if recurrent)
    - Leave in place 24-48 hours
    - Trial of void after removal
  - Reduce/discontinue offending medications
    - Taper opioids as able
    - Avoid anticholinergics
  - Encourage voiding every 4 hours
  - Alpha-blocker (tamsulosin) may help
  - Most resolve within 2-7 days post-op
  patient_education:
  - Common after surgery, especially pelvic
  - Usually temporary
  - Return if unable to void >6-8 hours
  next:
  - default: null

differential_diagnosis:
  obstructive:
    - Benign prostatic hyperplasia (BPH) - most common in older men
    - Prostate cancer
    - Urethral stricture
    - Bladder neck contracture
    - Phimosis, paraphimosis
    - Meatal stenosis
    - Pelvic organ prolapse (women)
    - Pelvic mass (fibroid, ovarian)
    - Bladder stone
    - Blood clot (gross hematuria)
    - Fecal impaction (mass effect)
  neurogenic:
    - Cauda equina syndrome (disc herniation, tumor, abscess)
    - Spinal cord injury
    - Multiple sclerosis
    - Diabetes mellitus (autonomic neuropathy)
    - Parkinson disease
    - Stroke (cerebrovascular accident)
    - Spinal stenosis
    - Herniated disc
    - Guillain-Barré syndrome
  medication_induced:
    - Anticholinergics (antihistamines, tricyclics, antispasmodics)
    - Opioids
    - Sympathomimetics (decongestants, amphetamines)
    - Benzodiazepines
    - Calcium channel blockers
  infectious_inflammatory:
    - Prostatitis
    - Acute cystitis with urethral edema
    - Herpes simplex (vulvar, urethral pain)
    - Urethritis
  other:
    - Post-operative (anesthesia, pain meds, surgical manipulation)
    - Psychogenic (anxiety, shy bladder syndrome)
    - Fowler syndrome (young women, detrusor-sphincter dyssynergia)
    - Detrusor underactivity (chronic overdistension)

disposition_guidance:
  admit:
    - Unable to place urinary catheter (urology consult)
    - Cauda equina syndrome (neurosurgery emergency)
    - Acute kidney injury (bilateral obstruction)
    - Sepsis with obstructive uropathy
    - Post-obstructive diuresis (>200mL/hr urine output)
    - Elderly with altered mental status or social issues
  discharge:
    - Catheter placed successfully
    - No AKI or infection
    - Urology follow-up arranged (3-7 days for voiding trial)
    - Patient or caregiver can manage catheter
    - Adequate pain control
  follow_up:
    - Voiding trial in 3-7 days (remove catheter, measure PVR)
    - Urology for failed voiding trial or recurrent retention
    - PSA (men) - after infection resolved, 4-6 weeks post-catheterization
    - Imaging and cystoscopy as outpatient (if indicated)

references:
  - Selius BA, Subedi R. Urinary Retention in Adults - Diagnosis and Initial Management. Am Fam Physician. 2008.
  - Choong S, Emberton M. Acute Urinary Retention. BJU Int. 2000.
  - Fitzpatrick JM, Kirby RS. Management of Acute Urinary Retention. BJU Int. 2006.
  - Nyman MA et al. AUA/SUFU Guidelines - Cauda Equina Syndrome and Acute Urinary Retention. J Urol. 2008.
