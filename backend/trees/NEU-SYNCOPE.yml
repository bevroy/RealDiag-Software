tree_id: NEU-SYNCOPE
name: Syncope
family: Neurology
specialty: Neurology
chief_complaint: Transient loss of consciousness with loss of postural tone
description: Sudden, brief loss of consciousness with spontaneous complete recovery due to global cerebral hypoperfusion, requiring prompt evaluation to identify cardiac vs non-cardiac causes

icd10: R55
snomed: "271594007"

urgency: urgent

homeopathy:
  - remedy: "Carbo vegetabilis 30C"
    indications: "Collapse, weakness, cold extremities, air hunger, near-syncope episodes"
  - remedy: "Gelsemium 30C"
    indications: "Weakness, trembling, dizziness before fainting, vasovagal syncope"
  - remedy: "China officinalis 30C"
    indications: "Syncope from blood loss, weakness, anemia, postural hypotension"
  - remedy: "Phosphorus 200C"
    indications: "Anxiety, weakness, fainting from fright or emotional stress"
  - remedy: "Veratrum album 30C"
    indications: "Profuse sweating, coldness, collapse, vasovagal symptoms"

presentations:
  - Sudden transient loss of consciousness (TLOC)
  - Loss of postural tone/falling
  - Spontaneous recovery
  - Brief (less than 20 seconds) or no confusion post-event
  - Preceding lightheadedness
  - Diaphoresis
  - Nausea
  - Pallor
  - Palpitations before event
  - Exertional syncope (cardiac concern)
  - No warning (cardiac concern)
  - Brief myoclonic jerks (convulsive syncope - still syncope not seizure)

workup:
  - Distinguish syncope from other causes of TLOC: seizure (postictal confusion, tongue biting, incontinence, prolonged), psychogenic pseudosyncope (gradual onset, prolonged duration, eyes closed, no injury)
  - History is key: precipitating factors (prolonged standing, pain, emotion, micturition, defecation suggests vasovagal), prodrome (lightheadedness, vision changes, diaphoresis suggests reflex syncope), position (upright suggests orthostatic), exertional or sudden without warning (cardiac), medications (antihypertensives, diuretics, QT prolonging)
  - High-risk features requiring admission: age greater than 60, known cardiac disease (heart failure, MI, structural), ECG abnormalities, exertional syncope, family history sudden death, no prodrome, syncope while supine, new dyspnea
  - Initial evaluation (all patients): orthostatic vital signs (BP/HR supine then after 3 minutes standing - drop 20 mmHg systolic or 10 mmHg diastolic or HR increase 30 bpm suggests orthostatic hypotension), 12-lead ECG (identify arrhythmias, ischemia, structural disease, conduction abnormalities, long QT, Brugada pattern, WPW)
  - ECG findings requiring cardiology evaluation: QTc greater than 500 ms (long QT syndrome), Brugada pattern (ST elevation V1-V3), epsilon wave (ARVC), LVH with strain, pathologic Q waves (prior MI), second or third-degree AV block, sinus pauses greater than 3 seconds, ventricular tachycardia
  - Lab tests (if indicated): CBC (anemia), BMP (electrolytes, renal function), glucose (hypoglycemia), troponin (if chest pain or ECG changes), pregnancy test (women of childbearing age)
  - Cardiac evaluation if suspected structural/arrhythmic cause: echocardiogram (valvular disease, cardiomyopathy, LV function), exercise stress test (exertional syncope), Holter or event monitor (intermittent arrhythmia), implantable loop recorder (recurrent unexplained syncope), electrophysiology study (if suspected VT or conduction disease)
  - Carotid sinus massage (if age greater than 40 and recurrent syncope, no carotid bruit, ECG monitoring): reproduction of symptoms with 3+ seconds asystole or 50+ mmHg BP drop suggests carotid sinus hypersensitivity
  - Tilt table test: reproduces vasovagal syncope (70-80 percent sensitivity), used if diagnosis unclear and reassurance needed
  - Neurologic evaluation rarely helpful: head CT or MRI not indicated unless focal neurologic deficits, EEG only if seizure suspected (prolonged confusion, tongue biting, incontinence)

treatment:
  - Vasovagal (reflex) syncope: patient education (recognize prodrome - sit or lie down immediately), increase fluid intake (2+ liters daily), increase salt intake (5-10 grams daily), avoid triggers (prolonged standing, heat, dehydration), physical counter-pressure maneuvers (leg crossing, handgrip, arm tensing when prodrome), midodrine 5-10 mg TID if recurrent (alpha agonist increases vascular tone), fludrocortisone 0.1-0.2 mg daily (volume expansion), tilt training (controversial efficacy)
  - Orthostatic hypotension: discontinue/reduce causative medications (antihypertensives, diuretics, alpha blockers), increase fluid and salt intake, compression stockings (waist high 30-40 mmHg), elevate head of bed 10 degrees (reduces nocturnal diuresis), avoid large meals and alcohol (splanchnic pooling), midodrine 2.5-10 mg TID (first-line pharmacologic), fludrocortisone 0.1-0.3 mg daily (second-line), pyridostigmine 60 mg TID (acetylcholinesterase inhibitor alternative), droxidopa 100-600 mg TID (norepinephrine precursor for neurogenic orthostatic hypotension)
  - Cardiac syncope: urgent cardiology referral, admit if high-risk features, treat underlying cause (pacemaker for bradyarrhythmias/heart block, ICD for ventricular tachycardia or high-risk structural disease, ablation for SVT, aortic valve replacement for severe AS, beta blockers for long QT syndrome)
  - Carotid sinus hypersensitivity: avoid tight collars, head turning, pacemaker if severe cardioinhibitory response (asystole greater than 6 seconds)
  - Situational syncope (micturition, defecation, cough): patient education, void sitting down, avoid straining
  - General measures: avoid dehydration, rise slowly from lying/sitting, avoid prolonged standing, recognize prodrome

clinical_pearls:
  - Syncope is loss of consciousness from global cerebral hypoperfusion (not focal CNS lesion)
  - Cardiac syncope is most dangerous (increased mortality) - identify high-risk features
  - History and ECG identify cause in 50 percent of cases
  - Vasovagal syncope is most common (benign, triggered, prodrome present)
  - Exertional syncope or syncope without prodrome concerning for cardiac cause
  - Orthostatic hypotension common in elderly (medications, autonomic dysfunction)
  - Brief myoclonic jerks can occur with syncope (convulsive syncope) but distinguish from seizure by rapid recovery without postictal confusion
  - Tilt table test reproduces vasovagal syncope but does not change management in most cases
  - Implantable loop recorder high yield for recurrent unexplained syncope

referrals:
  - Emergency department if high-risk features (cardiac disease, abnormal ECG, exertional syncope, no prodrome, age greater than 60, new dyspnea, syncope while supine)
  - Cardiology for suspected cardiac syncope (structural heart disease, arrhythmia, conduction abnormality, exertional symptoms)
  - Electrophysiology if suspected arrhythmic syncope (ventricular tachycardia, heart block, need for pacemaker/ICD)
  - Neurology if suspected seizure (prolonged confusion, tongue biting, incontinence, abnormal movements)
  - Autonomic specialist for refractory orthostatic hypotension or neurogenic causes

differentials:
  - Seizure (postictal confusion, tongue biting, incontinence, prolonged unconsciousness, abnormal movements)
  - Psychogenic pseudosyncope (eyes closed, prolonged duration, no injury, witnessed)
  - Hypoglycemia (sweating, confusion, responsive to glucose)
  - Stroke/TIA (focal deficits, not typical for syncope)
  - Concussion (head trauma, altered mental status persists)
  - Cardiac syncope (structural disease, arrhythmia, high-risk features)
  - Vasovagal syncope (triggered, prodrome, benign)
  - Orthostatic hypotension (postural, medications, autonomic dysfunction)

trace:
  - 68-year-old man presents to ED after sudden loss of consciousness while grocery shopping, fell to floor, bystanders report 10-15 seconds unconscious, no seizure activity, fully alert on EMS arrival
  - Past medical history: hypertension, hyperlipidemia, remote MI 10 years ago with stent placement, LVEF 45 percent on echo 2 years ago
  - Medications: metoprolol 50 mg BID, lisinopril 20 mg daily, atorvastatin 80 mg nightly, aspirin 81 mg daily
  - Patient reports no warning before syncope, no chest pain or palpitations, denies exertional symptoms but event occurred while walking (mild exertion), no prior syncope episodes
  - Exam: awake alert, BP 128/76, HR 62 regular, no orthostatic hypotension, cardiovascular exam normal S1/S2 no murmurs, lungs clear, no focal neurologic deficits, abrasion on forehead from fall
  - 12-lead ECG: sinus rhythm rate 62, old Q waves inferior leads (prior MI), no acute ST changes, QTc 420 ms, no AV block
  - Labs: troponin negative (less than 0.01 ng/mL), BMP normal (sodium 138, potassium 4.1, creatinine 1.0 mg/dL), glucose 102 mg/dL, hemoglobin 13.8 g/dL
  - Risk stratification: high-risk features present - age greater than 60, known cardiac disease (prior MI, reduced LVEF), syncope without prodrome (concerning for arrhythmic cause)
  - Decision: admit for telemetry monitoring and cardiac evaluation
  - Telemetry day 1: episodes of non-sustained ventricular tachycardia (5-10 beat runs rate 160s) captured during sleep, asymptomatic
  - Echocardiogram: LVEF 40 percent (decreased from 45 percent 2 years ago), inferior wall hypokinesis (old MI territory), no valvular disease, LV chamber mildly dilated
  - Electrophysiology consult: syncope likely from ventricular tachycardia (NSVT on telemetry), substrate present (prior MI with reduced LVEF), high risk for sudden cardiac death
  - EP study: inducible sustained monomorphic VT (rate 180 bpm, same morphology as NSVT on telemetry)
  - Treatment: dual chamber ICD implanted (primary prevention - LVEF less than 35 percent with prior MI or secondary prevention if VT caused syncope), programmed for VT detection and therapy (antitachycardia pacing then shock if needed)
  - Medication adjustment: metoprolol increased to 100 mg BID (beta blocker reduces VT risk), continue other cardiac medications
  - Patient education: ICD monitors heart rhythm 24/7, will deliver therapy if dangerous arrhythmia, avoid large magnets near device, restrict driving 6 months after ICD implant for syncope, follow-up device clinic 2 weeks then every 3-6 months
  - Discharge day 5 after ICD implant, follow-up cardiology 2 weeks, no further syncope episodes, ICD functioning appropriately
