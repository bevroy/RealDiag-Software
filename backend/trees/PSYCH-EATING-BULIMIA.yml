presentations:
  - Recurrent binge eating
  - Compensatory behaviors (vomiting, laxatives, exercise)
  - Self-evaluation influenced by body shape/weight
  - Episodes at least weekly for 3 months
  - Normal or slightly above normal weight
differentials:
  - Anorexia
  - Binge eating disorder
  - Depression
  - Anxiety
workup: []
treatment:
  - Cognitive behavioral therapy (CBT) - first-line, most effective (60-70% remission), 20 sessions over 5 months
  - 'CBT components: self-monitoring food intake, regular eating pattern, stimulus control, cognitive restructuring'
  - Fluoxetine 60mg daily - only FDA-approved medication for bulimia (higher dose than depression)
  - Other SSRIs also effective - sertraline 150-200mg, citalopram 40mg, paroxetine 40-60mg
  - Nutritional counseling - establish regular meal pattern (3 meals + 2-3 snacks), stop dieting
  - Interpersonal psychotherapy (IPT) - alternative to CBT if CBT not available
  - Address electrolyte abnormalities - hypokalemia, hypochloremia, metabolic alkalosis from vomiting
  - Dental referral - enamel erosion from gastric acid, recommend fluoride treatment, do not brush teeth immediately after vomiting
  - Monitor for complications - esophageal tears (Mallory-Weiss), parotid gland swelling, Russell sign (calluses on knuckles)
  - Treat comorbid conditions - depression (50%), anxiety, substance abuse common
  - Family therapy for adolescents
  - Avoid bupropion (Wellbutrin) - contraindicated due to increased seizure risk in purging patients
  - Hospitalization rarely needed unless severe electrolyte abnormalities or suicidality
  - Prognosis better than anorexia - 50-70% recover with treatment
