tree_id: RHEUM-GOUT
name: Acute Gout and Chronic Gouty Arthritis
family: rheumatologic
specialty: Rheumatology
chief_complaint: Sudden severe joint pain, swelling, redness, typically great toe
description: Crystal-induced arthropathy from monosodium urate crystal deposition causing acute inflammatory arthritis
icd10: M10.9
urgency: urgent
workup:
  - Clinical presentation - acute monoarticular arthritis, exquisitely painful
  - Acute gout attack with sudden onset (often overnight)
  - Exquisite pain (often worst pain patient has experienced)
  - Swelling, erythema, warmth of affected joint
  - Extreme tenderness (unable to bear touch)
  - Podagra (first MTP joint of great toe) classic in 50% of first attacks
  - Peak intensity 12-24 hours, self-limited 7-14 days without treatment
  - Other joints include ankle, midfoot, knee, wrist, fingers
  - Triggers include sudden uric acid change, alcohol, purine-rich foods, dehydration, diuretics
  - Physical examination showing monoarticular arthritis
  - Joint swollen, red, warm (mimics infection)
  - Extremely tender
  - Fever may be present
  - Chronic tophaceous gout shows tophi (chalky deposits)
  - Risk factors include hyperuricemia, male, age, obesity, CKD, medications, alcohol, high-purine diet
  - Synovial fluid analysis - GOLD STANDARD
  - Arthrocentesis to aspirate joint fluid
  - Polarized light microscopy shows needle-shaped negatively birefringent crystals
  - Intracellular crystals within WBCs
  - WBC count inflammatory (5,000-75,000)
  - Gram stain and culture rule out septic arthritis
  - Serum uric acid NOT diagnostic during acute attack (can be normal)
  - Check 2-4 weeks after attack resolves
  - Additional labs include CBC, ESR, CRP, renal function
  - Imaging shows rat-bite erosions in chronic gout
treatment:
  - Acute gout attack - anti-inflammatory therapy
  - NSAIDs first-line (indomethacin 50 mg TID, naproxen 500 mg BID)
  - Contraindications include CKD, PUD, heart failure
  - Colchicine effective if started early
  - Loading 1.2 mg then 0.6 mg 1 hour later
  - Then 0.6 mg BID until resolved
  - Side effect is diarrhea
  - Corticosteroids if NSAIDs and colchicine contraindicated
  - Prednisone 30-40 mg daily x5-7 days
  - Intra-articular injection for monoarticular
  - Do NOT start or stop urate-lowering during attack
  - Urate-lowering therapy (ULT) to prevent future attacks
  - Indications include 2+ attacks per year, CKD, tophi, stones
  - Start 2-4 weeks after acute attack resolves
  - Xanthine oxidase inhibitors first-line
  - Allopurinol start 100 mg daily, increase by 100 mg every 2-4 weeks
  - Target serum uric acid less than 6 mg/dL
  - Typical dose 300-600 mg daily
  - Febuxostat 40-80 mg daily alternative
  - Uricosuric agents (probenecid) increase renal excretion
  - Requires GFR greater than 50
  - Pegloticase for refractory severe tophaceous gout
  - Flare prophylaxis essential during ULT initiation
  - Colchicine 0.6 mg daily or BID for 3-6 months
  - Low-dose NSAID or prednisone alternatives
  - Lifestyle modifications include limit alcohol, avoid purine-rich foods, weight loss, hydration
  - Switch from thiazide diuretic if possible
clinical_pearls:
  - Classic podagra presentation with sudden overnight onset
  - Diagnosis confirmed by negatively birefringent crystals
  - Serum uric acid can be normal during attack
  - Treat acute attack with NSAIDs, colchicine, or steroids
  - Target uric acid less than 6 mg/dL with ULT
  - Flare prophylaxis essential when starting ULT
  - Allopurinol first-line, start low and titrate slowly
  - Beer and organ meats high in purines
  - Thiazide diuretics increase uric acid
differentials:
  - Septic arthritis (higher WBC, positive culture)
  - Pseudogout (positively birefringent crystals)
  - Reactive arthritis
  - Rheumatoid arthritis
  - Osteoarthritis
  - Cellulitis
trace:
  - 55-year-old obese man with hypertension on HCTZ presents at 2 AM with severe right great toe pain
  - Went to bed fine, woke at midnight with excruciating pain 10/10
  - Cannot touch toe, cannot walk
  - Toe swollen and red
  - Yesterday had seafood dinner and several beers
  - Father had gout
  - Exam shows right first MTP markedly swollen, erythematous, warm, extremely tender
  - Unable to bear weight or tolerate passive ROM
  - Serum uric acid 7.2 mg/dL
  - Arthrocentesis shows 32,000 WBC, numerous needle-shaped negatively birefringent crystals intracellular
  - Diagnosis - acute gout (podagra)
  - Risk factors include obesity, HCTZ, alcohol, seafood
  - Treated with indomethacin 50 mg TID and colchicine
  - Culture negative, pain improved in 3 days
  - Resolved completely in 2 weeks
  - Baseline uric acid 8.9 mg/dL
  - Lifestyle modifications discussed, switched HCTZ to losartan
  - Had second attack at 9 months (left ankle)
  - Two attacks in 9 months - indication for ULT
  - Started allopurinol 100 mg with colchicine prophylaxis 0.6 mg daily
  - Titrated allopurinol to 300 mg over 6 months
  - Achieved uric acid 5.5 mg/dL, no further attacks
  - Discontinued colchicine after 6 months
  - One year later no attacks on allopurinol maintenance
  - Weight loss 25 pounds, reduced alcohol
  - Outcome - successful treatment and prevention with ULT
