tree_id: RHEUM-GOUT
name: Gout
family: Rheumatology
specialty: Rheumatology
chief_complaint: Sudden severe joint pain and swelling
description: |
  Crystal arthropathy from monosodium urate crystal deposition. Classic presentation is podagra (first MTP joint).
  Caused by hyperuricemia (uric acid greater than 6.8 mg/dL leads to crystal formation). Affects 4% of US adults, more common in men.
icd10: M10.9
urgency: Moderate
workup:
  - Arthrocentesis with synovial fluid analysis (gold standard) - WBC 2000-50,000/mm3, negatively birefringent needle-shaped crystals under polarized microscopy
  - Serum uric acid level - elevated in 90% during acute attack but can be normal (not diagnostic, hyperuricemia alone does not confirm gout)
  - X-ray of affected joint - punched-out erosions with overhanging edges in chronic gout, normal in early disease
  - Ultrasound shows double contour sign (urate crystals on cartilage surface)
  - Rule out septic arthritis - send synovial fluid for Gram stain and culture
treatment:
  - Acute gout attack - NSAIDs, colchicine, or corticosteroids (treat within 24 hours for best response)
  - NSAIDs first-line - indomethacin 50mg TID, naproxen 500mg BID, or ibuprofen 800mg TID until resolution
  - Colchicine 1.2mg loading dose, then 0.6mg 1 hour later, then 0.6mg daily (or BID during attack) - most effective if started early
  - Corticosteroids if NSAIDs/colchicine contraindicated - prednisone 40mg daily x 5 days then taper, or intra-articular injection
  - Do NOT start urate-lowering therapy during acute attack (can worsen attack)
  - Urate-lowering therapy (ULT) for recurrent attacks (2 or more per year), tophi, chronic kidney disease, or urolithiasis
  - Allopurinol 100mg daily, increase by 100mg every 2-4 weeks to achieve uric acid less than 6 mg/dL (max 800mg/day)
  - Febuxostat 40-80mg daily alternative if allopurinol intolerant
  - Prophylaxis with colchicine 0.6mg daily or low-dose NSAID during first 6 months of ULT (prevents flares)
clinical_pearls:
  - Classic presentation includes sudden onset severe monoarthritis, often at night, with erythema and warmth
  - Risk factors include male gender, obesity, alcohol (especially beer), high-purine diet (red meat, seafood), diuretics, kidney disease
  - Podagra (first MTP joint) occurs in 50% of first attacks, eventually 90%
  - Tophi (subcutaneous urate deposits) in chronic untreated gout, commonly on ears, fingers, elbows
  - Uric acid can be normal during acute attack (acute phase response increases renal excretion)
  - HLA-B5801 testing before allopurinol in high-risk populations (Asian descent) - predicts severe hypersensitivity
differentials:
  - Septic arthritis
  - Pseudogout (calcium pyrophosphate deposition)
  - Rheumatoid arthritis
  - Trauma
  - Cellulitis
  - Psoriatic arthritis
trace:
  - Sudden onset severe right first MTP joint pain, red, swollen, unable to bear weight → Arthrocentesis shows 15,000 WBC/mm3, negatively birefringent needle-shaped crystals → Uric acid 9.2 mg/dL → Diagnose acute gouty arthritis → Indomethacin 50mg TID → Pain improves in 48 hours → Complete 7-day course → Two prior similar attacks, start urate-lowering therapy after resolution → Allopurinol 100mg daily with colchicine 0.6mg daily prophylaxis → Titrate allopurinol to achieve uric acid less than 6 mg/dL → No further attacks
