tree_id: RHEUM-GOUT
name: Gout (Acute Gouty Arthritis)
family: Musculoskeletal
specialty: Rheumatology
chief_complaint: Severe joint pain and swelling
description: Crystal arthropathy from monosodium urate crystal deposition in joints causing acute inflammatory arthritis, typically first MTP joint (podagra)

icd10: M10.9

urgency: urgent

workup:
  - Clinical presentation: acute onset (over hours) severe pain, swelling, erythema, warmth in joint (often awakens from sleep), exquisitely tender, limited range of motion
  - First MTP joint (podagra) affected in 50 percent of initial attacks (90 percent at some point), also ankle, knee, wrist, elbow
  - Risk factors: hyperuricemia (serum uric acid greater than 7 mg/dL), male sex, obesity, alcohol (especially beer), purine-rich diet (red meat, seafood), diuretics, CKD, cardiovascular disease
  - Precipitants: alcohol binge, dehydration, surgery, trauma, acute illness, initiation of urate-lowering therapy
  - Exam: red, hot, swollen joint with severe tenderness (resembles cellulitis or septic arthritis), fever may be present
  - Arthrocentesis (joint aspiration): synovial fluid analysis gold standard, appearance cloudy/turbulent, WBC 10,000-50,000 cells/microL (inflammatory), polarized microscopy shows needle-shaped negatively birefringent monosodium urate crystals (yellow when parallel to polarizer, blue when perpendicular) - pathognomonic
  - Always send synovial fluid for Gram stain and culture (exclude septic arthritis - can coexist with gout)
  - Serum uric acid: often elevated (greater than 7 mg/dL) but may be normal during acute attack (30 percent have normal uric acid during flare), not diagnostic
  - Radiographs: normal early, chronic gout shows punched-out erosions with overhanging edges, tophi (soft tissue masses)
  - Ultrasound: double contour sign (MSU crystals on cartilage surface), tophi
  - DECT (dual-energy CT): color codes MSU crystals (green), high sensitivity for gout

treatment:
  - Acute gout attack: start treatment within 24 hours (early treatment more effective)
  - NSAIDs first-line for acute attack: indomethacin 50 mg TID, naproxen 500 mg BID, ibuprofen 800 mg TID - continue until symptoms resolve (typically 5-7 days), contraindicated if CKD stage 4-5, GI bleeding, heart failure
  - Colchicine for acute attack: most effective if started within 24 hours, loading dose 1.2 mg then 0.6 mg one hour later, then 0.6 mg daily or BID until resolution, reduce dose if CKD, side effects diarrhea/nausea (dose-dependent)
  - Corticosteroids if NSAIDs/colchicine contraindicated: intra-articular injection (triamcinolone) if monoarticular, oral prednisone 30-40 mg daily x 5-7 days then taper if polyarticular, IV methylprednisolone if unable to take oral
  - Do NOT start or stop urate-lowering therapy during acute attack (precipitates flare)
  - Urate-lowering therapy (ULT) indicated for recurrent gout (2 or more attacks/year), tophaceous gout, chronic kidney disease, urolithiasis - goal serum uric acid less than 6 mg/dL (less than 5 mg/dL if tophi)
  - Allopurinol first-line ULT: xanthine oxidase inhibitor, start 100 mg daily (50 mg if CKD stage 4-5), titrate by 100 mg every 2-4 weeks to goal uric acid, typical dose 300 mg daily (max 800 mg), rare serious hypersensitivity (DRESS, SJS/TEN) especially in HLA-B*5801 carriers
  - Febuxostat alternative ULT: xanthine oxidase inhibitor 40-80 mg daily, no dose adjustment for CKD, may increase cardiovascular events (black box warning)
  - Probenecid alternative if allopurinol intolerant: uricosuric agent increases uric acid excretion, 500 mg BID, contraindicated if CKD (eGFR less than 50), urolithiasis
  - Prophylaxis during ULT initiation: colchicine 0.6 mg daily or BID (prevents flares from mobilizing urate crystals), continue 6 months, or low-dose NSAID alternative
  - Lifestyle modifications: avoid alcohol (especially beer), limit purine-rich foods (red meat, organ meats, shellfish, high-fructose corn syrup), lose weight if obese, stay hydrated, avoid diuretics if possible

clinical_pearls:
  - Acute gout classically affects first MTP joint (podagra) with severe sudden pain and swelling
  - Synovial fluid analysis with polarized microscopy gold standard (negatively birefringent needle-shaped crystals)
  - Serum uric acid may be normal during acute attack (not diagnostic)
  - Early treatment within 24 hours more effective (NSAIDs, colchicine, or corticosteroids)
  - Do NOT start or stop urate-lowering therapy during acute attack (precipitates flare)
  - Urate-lowering therapy (allopurinol) for recurrent gout, goal uric acid less than 6 mg/dL
  - Prophylactic colchicine 6 months when starting ULT prevents flares

differentials:
  - Septic arthritis (acute monoarthritis with fever, synovial fluid WBC greater than 50,000, positive Gram stain/culture, requires urgent antibiotics)
  - Pseudogout (calcium pyrophosphate deposition, rhomboid-shaped positively birefringent crystals, older patients, often knee)
  - Cellulitis (skin erythema/warmth without joint effusion, no crystals on arthrocentesis)
  - Trauma (acute injury, no crystals, less inflammatory)

trace:
  - 48-year-old obese man awakens at 2 AM with excruciating pain in right big toe, never experienced this before, unable to bear weight, denies trauma
  - History: drinks 3-4 beers daily, ate large steak dinner last night, hypertension on hydrochlorothiazide
  - Exam: temp 99.2 F, right first MTP joint markedly swollen, erythematous, warm, exquisitely tender (cannot tolerate sheet touching it), limited range of motion from pain
  - Arthrocentesis right first MTP joint: synovial fluid turbid/cloudy, WBC 28,000 cells/microL with 85 percent neutrophils (inflammatory), polarized microscopy shows needle-shaped negatively birefringent monosodium urate crystals (diagnostic for gout), Gram stain negative, culture sent
  - Labs: serum uric acid 9.8 mg/dL (elevated, normal 3.5-7.2), creatinine 1.1 mg/dL (eGFR 75 - CKD stage 2 mild)
  - Diagnosis: acute gout attack (podagra) first episode
  - Started indomethacin 50 mg TID with food (NSAID for acute attack)
  - 24 hours: significant improvement in pain, able to ambulate with limp
  - 3 days: pain/swelling nearly resolved, continues indomethacin
  - 5 days: complete resolution, stopped indomethacin
  - Follow-up 2 weeks: discuss urate-lowering therapy, patient had first attack only so defer ULT for now (typically start after 2 or more attacks), counseling on lifestyle modifications (reduce alcohol especially beer, limit red meat/seafood, lose weight, adequate hydration), consider stopping HCTZ (can increase uric acid) and switch to alternative antihypertensive
  - Switched HCTZ to amlodipine 5 mg daily for hypertension
  - 6 months: second gout attack (right ankle this time)
  - Decision to start urate-lowering therapy given recurrent attacks
  - Started allopurinol 100 mg daily with colchicine 0.6 mg daily prophylaxis (prevent flares during ULT initiation)
  - Treated acute attack with prednisone 40 mg daily x 5 days
  - 4 weeks: uric acid 7.2 mg/dL (still above goal less than 6), increased allopurinol to 200 mg daily, continues colchicine prophylaxis
  - 8 weeks: uric acid 5.8 mg/dL (at goal less than 6 mg/dL), continues allopurinol 200 mg daily, will continue colchicine prophylaxis 6 months total then stop
  - 1 year: no further gout attacks on allopurinol, uric acid 5.5 mg/dL (maintained below goal), weight loss 15 pounds, reduced alcohol intake
