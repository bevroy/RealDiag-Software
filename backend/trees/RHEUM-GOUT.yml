tree_id: RHEUM-GOUT
name: Gout
family: Rheumatology
specialty: Rheumatology
icd10:
- M10.9
- M10.00
snomed:
- '90560007'
urgency: medium
description: Comprehensive evaluation and management of Gout
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden onset severe joint pain
- First MTP joint (podagra) most common
- Joint erythema and swelling
- Elevated uric acid
- Monosodium urate crystals
workup:
- 'Synovial fluid analysis (GOLD STANDARD): Monosodium urate crystals (needle-shaped,
  negatively birefringent under polarized light), WBC 2,000-100,000'
- 'Serum uric acid: >6.8 mg/dL (can be NORMAL during acute attack - 30% have normal
  uric acid during flare)'
- 'X-ray: Normal early. Chronic: Punched-out erosions with overhanging edges (rat-bite
  erosions), tophi'
- 'Ultrasound: Double contour sign (urate on cartilage surface) - more sensitive than
  X-ray'
treatment:
- 'Guideline-based treatment options for Gout include:'
- 'Acute attack: NSAIDsOR colchicine 1.2mg then 0.6mg 1h later OR prednisone 40mg
  daily x5 days (ACR 2023)'
- DO NOT start allopurinol during acute attack (worsens flare) - treat acute inflammation
  first (ACR 2023)
- 'Urate-lowering therapy: Allopurinol 100mg daily, increase by 100mg q2-4 weeks to
  achieve uric acid <6 mg/dL (goal <5 if tophaceous) (ACR 2023)'
- 'Colchicine prophylaxis: 0.6mg daily during first 6 months of ULT (prevents flares
  from urate mobilization) (ACR 2023)'
- 'Lifestyle: Limit alcohol, red meat, seafood (high purines). Increase water, low-fat
  dairy, cherries (ACR 2023)'
clinical_pearls:
- Most common inflammatory arthritis in men - monosodium urate crystal deposition
  from hyperuricemia (>6.8 mg/dL)
- 'Podagra (first MTP joint): 50% of initial attacks, 90% affected at some point -
  exquisitely painful, can''t tolerate bedsheet touch'
- 'Hyperuricemia: Overproduction (10% - HGPRT deficiency, lymphoproliferative, high
  purine diet) or underexcretion (90% - renal insufficiency, diuretics)'
- 'Tophus: Urate crystal deposits in soft tissues (ears, elbows, fingers) - appear
  after 10+ years of untreated gout'
- 'Acute attacks triggered by: Alcohol, red meat, seafood, dehydration, diuretics,
  trauma, surgery'
referrals:
- 'Rheumatology if: Atypical presentation, polyarticular gout, refractory to treatment,
  tophaceous gout'
- Most gout managed by primary care with NSAIDs/colchicine (acute) and allopurinol
  (chronic)
differentials:
  - Septic arthritis
  - Pseudogout
  - Cellulitis
  - Trauma
  - RA
trace:
  source: American College of Rheumatology (ACR) Guidelines, European League Against
    Rheumatism (EULAR)
