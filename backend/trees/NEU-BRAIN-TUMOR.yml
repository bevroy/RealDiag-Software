tree_id: NEU-BRAIN-TUMOR
name: Brain Tumor
family: Neurology
specialty: Neurology
icd10:
- C71.9
- D33.2
snomed:
- '126952004'
urgency: medium
description: Comprehensive evaluation and management of Brain Tumor
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- headache (worse in morning)
- seizures
- focal neurological deficits
- personality changes
- nausea and vomiting
- papilledema
- Progressive symptoms over weeks to months
- 'Morning headache: Worse with Valsalva, cough, lying flat (increased ICP)'
- New-onset seizures in adult (especially >40 years)
- 'Focal deficits depend on location: Motor, sensory, language, vision'
workup:
- 'MRI brain with and without contrast: Gold standard, shows location, size, enhancement
  pattern'
- 'Biopsy or resection: Tissue diagnosis required (glioma grade, metastasis, lymphoma,
  meningioma)'
- 'Chest/abdomen/pelvis CT: If metastases suspected, find primary tumor'
- 'PET scan: May help differentiate tumor recurrence from radiation necrosis'
treatment:
- 'Guideline-based treatment options for Brain Tumor include:'
- 'Dexamethasone: 4-8mg PO/IV q6h to reduce vasogenic edema and symptoms (AAN 2024)'
- 'Anti-epileptics: If seizures present, not for prophylaxis (AAN 2024)'
- 'Neurosurgery consult: Resection for tissue diagnosis and cytoreduction (AAN 2024)'
- 'Radiation + chemotherapy: Temozolomide for glioblastoma, radiation for many primary
  and metastatic tumors (AAN 2024)'
- 'Palliative care: Early involvement for symptom management, goals of care (AAN 2024)'
clinical_pearls:
- 'Primary brain tumors: Glioblastoma (most common malignant), meningioma (most common
  benign)'
- 'Metastatic brain tumors: More common than primary (10:1), from lung, breast, melanoma,
  renal, colon'
- 'MRI with contrast: Gadolinium enhancement differentiates high-grade (enhances)
  vs low-grade (no enhancement)'
- 'Dexamethasone: Reduces vasogenic edema, improves symptoms rapidly'
- 'Glioblastoma: Median survival 15 months with surgery + radiation + temozolomide'
referrals:
- 'Neurosurgery URGENTLY: For biopsy/resection'
- 'Neuro-oncology: For chemotherapy and radiation planning'
- 'Palliative care: Early involvement for high-grade tumors'
differentials: []
