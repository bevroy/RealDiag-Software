tree_id: CARDS-DYSRHYTHMIA
name: Dysrhythmia, Unspecified
family: cardiology
specialty: Cardiology
icd10: I49.9
snomed: 698247007
urgency: moderate
homeopathy: []
presentations:
  - Palpitations (sensation of rapid, fluttering, or pounding heartbeat)
  - Irregular heartbeat
  - Skipped beats or extra beats
  - Lightheadedness or dizziness
  - Syncope or near-syncope
  - Chest discomfort
  - Dyspnea
  - Fatigue
  - Asymptomatic (found on routine exam or ECG)
  - May be paroxysmal or persistent
workup:
  - 12-lead ECG (diagnostic test of choice)
  - Identify rhythm - sinus rhythm, atrial fibrillation, flutter, SVT, VTach, bradycardia, heart blocks
  - Assess rate, intervals (PR, QRS, QT), axis, chamber enlargement
  - Ambulatory ECG monitoring if paroxysmal symptoms
  - Holter monitor (24-48 hours continuous recording)
  - Event recorder (1-4 weeks, patient-triggered)
  - Mobile cardiac telemetry (MCT) or patch monitor (2-4 weeks continuous)
  - Implantable loop recorder for infrequent symptoms (up to 3 years)
  - Exercise stress test if exercise-induced symptoms
  - Echocardiogram - assess structural heart disease, LV function
  - Basic labs - TSH, CBC, BMP, magnesium
  - Troponin if chest pain or concern for ACS
  - Consider electrophysiology study for complex arrhythmias or ablation planning
treatment:
  - Depends on specific arrhythmia identified
  - General measures for all patients
  - Identify and treat reversible causes (electrolytes, thyroid, ischemia, drugs)
  - Avoid triggers - caffeine, alcohol, stimulants, stress
  - Treat underlying heart disease
  - Specific arrhythmia management
  - Atrial fibrillation - rate control (beta-blockers, CCB) or rhythm control, anticoagulation
  - Atrial flutter - rate control, consider ablation
  - PSVT - vagal maneuvers, adenosine, beta-blockers, CCB, ablation for recurrent
  - Ventricular tachycardia - antiarrhythmics (amiodarone, lidocaine), ICD, ablation
  - Premature beats (PACs, PVCs) - reassurance if benign, beta-blockers if symptomatic
  - Bradycardia - pacemaker if symptomatic or high-grade AV block
  - Sinus tachycardia - treat underlying cause (infection, pain, anemia, thyroid)
  - Symptomatic relief
  - Beta-blockers for symptomatic palpitations (metoprolol, atenolol)
  - Calcium channel blockers alternative (diltiazem, verapamil)
  - Anticoagulation based on stroke risk (AFib, flutter)
clinical_pearls:
  - Most palpitations are benign and self-limited
  - Red flags - syncope, chest pain, family history sudden cardiac death, structural heart disease
  - Frequent PVCs (>10% of beats) can lead to cardiomyopathy
  - PACs and PVCs common and usually benign in absence of structural heart disease
  - Ventricular arrhythmias more concerning than supraventricular
  - Ischemia can present with new arrhythmias
  - Electrolyte abnormalities (K, Mg, Ca) can precipitate arrhythmias
  - Hyperthyroidism common cause of atrial fibrillation
  - QT prolongation increases torsades de pointes risk (avoid QT-prolonging drugs)
  - Anxiety and panic attacks can mimic cardiac arrhythmias
referrals:
  - Cardiology for sustained arrhythmias, syncope, abnormal echo, or refractory symptoms
  - Electrophysiology for recurrent symptomatic arrhythmias, ablation consideration, or ICD/pacemaker evaluation
  - Emergency department for sustained ventricular tachycardia, symptomatic bradycardia, or hemodynamic instability
differentials:
  - Sinus tachycardia (physiologic response to stress, fever, pain, etc.)
  - Atrial fibrillation (irregularly irregular rhythm)
  - Atrial flutter (regular rapid atrial rate with variable block)
  - Paroxysmal supraventricular tachycardia (PSVT)
  - Premature atrial contractions (PACs)
  - Premature ventricular contractions (PVCs)
  - Ventricular tachycardia
  - Bradycardia (sinus bradycardia, AV blocks)
  - Wolff-Parkinson-White syndrome (pre-excitation)
  - Anxiety or panic disorder (non-cardiac palpitations)
trace:
  source: ACC/AHA/ESC Guidelines for Arrhythmia Management 2019
