presentations:
  - Worsening dyspnea (cardinal symptom)
  - Increased sputum production
  - Change in sputum color/purulence (green, yellow)
  - Increased cough
  - Increased wheezing
  - Chest tightness
  - Reduced exercise tolerance
  - Fever (if infectious cause)
  - Confusion or altered mental status (hypoxemia/hypercapnia)
  - Use of accessory muscles
  - Pursed-lip breathing
  - Peripheral edema (right heart failure)
  - Triggers - bacterial/viral infection, air pollution, medication noncompliance
differentials:
  - COPD exacerbation
  - Pneumonia (infiltrate on CXR, high fever)
  - Heart failure exacerbation (elevated JVP, BNP >400)
  - Pulmonary embolism (sudden onset, risk factors, D-dimer)
  - Pneumothorax (unilateral decreased breath sounds, sudden onset)
  - Pleural effusion (dullness to percussion)
  - Lung cancer (weight loss, hemoptysis, mass on CXR)
  - Arrhythmia (palpitations, ECG changes)
workup:
  - Pulse oximetry - assess baseline O2 saturation and response to supplemental O2
  - Arterial blood gas if severe or concern for hypercapnia
  - Type I respiratory failure - hypoxemia without hypercapnia (PaO2 <60 mmHg)
  - Type II respiratory failure - hypoxemia with hypercapnia (PaCO2 >50 mmHg)
  - Chest X-ray to rule out pneumonia, pneumothorax, pleural effusion, heart failure
  - ECG - assess for arrhythmia, right heart strain, ischemia
  - CBC - leukocytosis suggests bacterial infection, polycythemia from chronic hypoxemia
  - BNP if concern for heart failure exacerbation
  - Sputum culture if purulent sputum or severe exacerbation (rarely changes management)
  - Blood cultures if sepsis suspected
  - Spirometry NOT recommended during acute exacerbation
treatment:
  - Oxygen therapy - target SpO2 88-92% (avoid hyperoxia in chronic CO2 retainers)
  - Bronchodilators (first-line therapy)
  - Short-acting beta-2 agonists (albuterol 2.5-5mg nebulized q1-4h or MDI 4-8 puffs q1-4h)
  - Short-acting anticholinergics (ipratropium 0.5mg nebulized q4-6h)
  - Combination therapy more effective than either alone
  - Systemic corticosteroids (reduce treatment failure and shorten recovery)
  - Prednisone 40mg PO daily x 5 days
  - Methylprednisolone 125mg IV q6h if severe or unable to take PO
  - 5-day course as effective as 14 days with fewer side effects
  - Antibiotics if increased sputum purulence or pneumonia (shorten recovery, reduce failure)
  - Amoxicillin-clavulanate 875mg PO BID x 5-7 days (first-line)
  - Azithromycin 500mg PO day 1, then 250mg daily x 4 days (alternative)
  - Doxycycline 100mg PO BID x 5-7 days (alternative)
  - Fluoroquinolone (levofloxacin, moxifloxacin) if risk factors for Pseudomonas
  - Mucolytics, chest physiotherapy - limited evidence
  - Non-invasive positive pressure ventilation (BiPAP/CPAP) for acute hypercapnic respiratory failure
  - Indications - pH 7.25-7.35, PaCO2 >45 mmHg, respiratory rate >25
  - Reduces intubation rate and mortality
  - Intubation and mechanical ventilation if NIV fails or contraindicated
  - Discharge with action plan, inhaler education, smoking cessation, pulmonary rehab referral
clinical_pearls:
  - Most exacerbations caused by viral infections (50%), bacterial (50%), or both
  - Common bacterial pathogens - H. influenzae, S. pneumoniae, M. catarrhalis
  - Anthonisen criteria for antibiotics - increased dyspnea + sputum volume + purulence (all 3 = antibiotics)
  - Oxygen is lifesaving but can worsen hypercapnia - monitor ABG
  - Systemic steroids reduce treatment failure by 50% and shorten hospital stay
  - No role for theophylline or aminophylline (narrow therapeutic window, toxicity)
  - BiPAP reduces intubation rate from 27% to 11%
  - Mortality 10% for hospitalized patients, 40% for ICU patients requiring intubation
  - Post-discharge follow-up at 4-6 weeks to reassess and optimize therapy
  - 30-day readmission rate 20% - high-risk period
