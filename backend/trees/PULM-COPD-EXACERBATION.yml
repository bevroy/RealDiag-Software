tree_id: PULM-COPD-EXACERBATION
name: COPD Exacerbation
family: Pulmonology
specialty: Pulmonology
icd10:
- J44.1
- J44.0
snomed:
- '195951007'
urgency: medium
description: Comprehensive evaluation and management of COPD Exacerbation
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Increased dyspnea, cough, sputum production (or change in sputum color/purulence)
- Wheezing, prolonged expiration, use of accessory muscles
- Decreased exercise tolerance, fatigue
- Hypoxia, hypercapnia (CO2 retention in severe cases)
- 'Triggers: Infection (viral or bacterial), air pollution, non-adherence to meds'
- 'Chest X-ray: Hyperinflation, flattened diaphragms, +/- infiltrate if pneumonia'
workup:
- ABG if severe (assess pH, pCO2, oxygenation)
- Chest X-ray (rule out pneumonia, pneumothorax)
- CBC (if suspect infection)
- BNP if concern for heart failure (often coexist)
treatment:
- 'Guideline-based treatment options for COPD Exacerbation include:'
- 'Bronchodilators: Albuterol 2.5mg + ipratropium 0.5mg nebulized q4-6h (ATS 2023)'
- 'Systemic steroids: Prednisone 40mg PO daily x 5 days (ATS 2023)'
- 'Antibiotics: Azithromycin 500mg daily x 5d or doxycycline 100mg BID x 5-7d (ATS
  2023)'
- 'Oxygen: Target SpO2 88-92% (avoid hyperoxia in CO2 retainers) (ATS 2023)'
- BiPAP if respiratory acidosis (pH <7.35) or severe dyspnea (ATS 2023)
clinical_pearls:
- 'Anthonisen criteria: Increased dyspnea + sputum volume + sputum purulence'
- 'Antibiotics if 2+ of: Dyspnea, sputum volume, purulence (reduces failure rate)'
- 'Systemic steroids: Prednisone 40mg x 5 days (equal to longer courses)'
- 'Bronchodilators: Albuterol + ipratropium nebulized'
- Non-invasive ventilation (BiPAP) if acidotic (pH <7.35) or hypercapnic
referrals:
- Pulmonology follow-up post-discharge
- ICU if severe respiratory failure or acidosis
differentials: []
