referrals:
  - Pulmonology for recurrent exacerbations (≥2 per year), severe COPD, or candidacy for advanced therapies
  - ICU admission for respiratory failure, altered mental status, or hemodynamic instability
  - Palliative care for end-stage COPD (GOLD stage IV) or frequent exacerbations
  - Pulmonary rehabilitation post-exacerbation (improves outcomes)
