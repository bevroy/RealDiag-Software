tree_id: PULM-COPD-EXACERBATION
name: COPD Exacerbation
family: pulmonary
specialty: Pulmonology
chief_complaint: Worsening shortness of breath, increased cough, increased sputum production
description: Acute worsening of COPD symptoms beyond normal day-to-day variation requiring change in therapy
icd10: J44.1
urgency: urgent-to-emergency
workup:
  - Clinical presentation - acute worsening of respiratory symptoms
  - Cardinal symptoms (Anthonisen criteria)
  - Increased dyspnea (worsening shortness of breath)
  - Increased sputum volume
  - Increased sputum purulence (yellow/green suggests bacterial infection)
  - Type I exacerbation - all 3 cardinal symptoms present
  - Type II - 2 of 3 cardinal symptoms
  - Type III - 1 cardinal symptom plus one of: upper respiratory infection, fever, increased wheeze, increased cough, tachypnea, tachycardia
  - Additional symptoms
  - Increased cough
  - Wheeze
  - Chest tightness
  - Fatigue
  - Confusion (hypoxemia, hypercapnia)
  - Severity assessment
  - Mild - increased symptoms, no respiratory distress, treat outpatient
  - Moderate - increased symptoms, some distress, may require ED/hospitalization
  - Severe - severe distress, hypoxemia, hypercapnia, respiratory failure, ICU needed
  - Precipitating factors - identify and treat
  - Infections (70-80%) - most common
  - Viral (40-50%) - rhinovirus, influenza, RSV, parainfluenza
  - Bacterial (40-50%) - Haemophilus influenzae, Streptococcus pneumoniae, Moraxella catarrhalis
  - Atypical bacteria - Mycoplasma, Chlamydia pneumoniae
  - Environmental factors
  - Air pollution, smoke exposure
  - Temperature extremes
  - Allergens
  - Medication noncompliance (stopped inhalers)
  - Pulmonary embolism (2-5% of exacerbations)
  - Heart failure (coexistent LV dysfunction)
  - Pneumothorax (bullous disease rupture)
  - Physical examination
  - Vital signs - tachypnea (RR greater than 20), tachycardia, hypoxemia (SpO2 less than 90%), hypotension if severe
  - Respiratory distress - use of accessory muscles, pursed-lip breathing, tripod position
  - Cyanosis (central if severe hypoxemia)
  - Decreased breath sounds, prolonged expiratory phase
  - Wheeze, rhonchi
  - Hyperresonance to percussion (hyperinflation)
  - Jugular venous distention (cor pulmonale - right heart failure from chronic lung disease)
  - Peripheral edema (cor pulmonale)
  - Altered mental status (CO2 retention, hypoxemia)
  - Laboratory assessment
  - Arterial blood gas (ABG) - if severe or uncertain acid-base status
  - Hypoxemia (PaO2 less than 60 mmHg)
  - Hypercapnia (PaCO2 greater than 45 mmHg, may be chronic compensated)
  - Respiratory acidosis (pH less than 7.35 with elevated PaCO2) - acute decompensation
  - Pulse oximetry - SpO2 target 88-92% (avoid excessive oxygen, risk CO2 retention)
  - CBC - leukocytosis suggests bacterial infection, eosinophilia may suggest allergic component
  - CMP - electrolytes, renal function
  - BNP or NT-proBNP - if concern for heart failure
  - Sputum culture - if purulent sputum, not routinely needed for mild-moderate exacerbations
  - Blood cultures - if febrile, severe illness
  - Influenza testing - during flu season
  - COVID-19 testing - if pandemic, endemic
  - Imaging
  - Chest X-ray - identify complications (pneumonia, pneumothorax, heart failure)
  - Flattened diaphragms, hyperinflation (chronic COPD findings)
  - Infiltrate suggests pneumonia
  - CT chest - not routine, if suspect PE (CT-PE protocol)
  - EKG - right heart strain (cor pulmonale), rule out MI or arrhythmia
  - Spirometry - NOT performed during acute exacerbation (wait 4-6 weeks after recovery)
treatment:
  - Assess severity and determine disposition (outpatient vs hospital vs ICU)
  - Outpatient - mild exacerbation, no respiratory distress, SpO2 greater than 90%
  - Hospital - moderate-severe, respiratory distress, hypoxemia, comorbidities
  - ICU - severe respiratory distress, respiratory acidosis (pH less than 7.35), altered mental status, need for NIV/intubation
  - Bronchodilators - cornerstone of acute management
  - Short-acting beta-2 agonists (SABA) - albuterol nebulizer 2.5-5 mg every 4 hours or more frequently if severe
  - Albuterol MDI 4-8 puffs every 4 hours alternative
  - Short-acting anticholinergics (SAMA) - ipratropium nebulizer 0.5 mg every 4-6 hours
  - Ipratropium MDI 4 puffs every 4-6 hours
  - Combination - albuterol/ipratropium (DuoNeb) 3 mL nebulizer every 4 hours (synergistic bronchodilation)
  - Long-acting bronchodilators (LABA, LAMA) - continue maintenance inhalers if already on them
  - Systemic corticosteroids - reduce inflammation, shorten recovery, prevent relapse
  - Prednisone 40 mg PO daily x 5 days (short course sufficient)
  - Methylprednisolone 125 mg IV q6h if unable to take PO or severe
  - No benefit beyond 5-7 days for uncomplicated exacerbation
  - Antibiotics - if purulent sputum (Anthonisen Type I or II exacerbation)
  - First-line - amoxicillin/clavulanate 875 mg PO BID x 5 days
  - Alternatives - doxycycline 100 mg PO BID, azithromycin 500 mg day 1 then 250 mg daily x 4 days
  - Respiratory fluoroquinolone (levofloxacin 750 mg daily) if recent antibiotics or risk resistant organisms
  - Oxygen therapy - maintain SpO2 88-92% (avoid higher, risk CO2 retention)
  - Nasal cannula 1-3 L/min, titrate to target
  - Venturi mask if precise FiO2 needed
  - AVOID excessive oxygen (can worsen hypercapnia by decreasing respiratory drive in chronic CO2 retainers)
  - Noninvasive positive pressure ventilation (NIPPV) - BiPAP
  - Indications - respiratory acidosis (pH 7.25-7.35), moderate-severe dyspnea, tachypnea, use of accessory muscles
  - Contraindications - unable to protect airway, copious secretions, hemodynamic instability, recent facial surgery
  - Benefits - reduces intubation rate, mortality, hospital length of stay
  - Settings - IPAP 10-20 cmH2O, EPAP 5-10 cmH2O, titrate
  - Invasive mechanical ventilation - if NIPPV fails or contraindicated
  - Indications - severe respiratory acidosis (pH less than 7.25), respiratory arrest, altered mental status unable to protect airway, hemodynamic instability
  - Ventilator strategy - low tidal volumes (6-8 mL/kg), permissive hypercapnia, long expiratory time (prevent auto-PEEP/breath stacking)
  - Adjunctive therapies
  - Chest physiotherapy, incentive spirometry
  - Mucolytics (guaifenesin, NAC) - minimal evidence
  - Magnesium sulfate 2 g IV - bronchodilator, may help severe exacerbations
  - Heliox (helium-oxygen mixture) - reduces work of breathing, limited availability
  - Treat precipitating factors
  - Antiviral therapy if influenza (oseltamivir 75 mg BID x 5 days)
  - Diuretics if heart failure contributing
  - Anticoagulation if PE suspected/confirmed
  - Smoking cessation counseling
  - Vaccination - influenza annually, pneumococcal (PCV20 or PCV15 + PPSV23)
  - Disposition and follow-up
  - Admit if moderate-severe, hypoxemia, respiratory acidosis, comorbidities, poor social support
  - ICU if severe distress, pH less than 7.35, need NIV/intubation
  - Discharge if mild, improved with treatment, SpO2 greater than 90%, reliable follow-up
  - Discharge with prednisone 40 mg x 5 days, antibiotics if indicated, continue bronchodilators
  - Follow-up 2-7 days post-discharge
  - Optimize maintenance COPD therapy after recovery
  - Long-acting bronchodilators (LABA, LAMA)
  - Inhaled corticosteroids (ICS) if frequent exacerbations
  - Pulmonary rehabilitation
clinical_pearls:
  - COPD exacerbation most commonly precipitated by viral or bacterial respiratory infections (70-80%)
  - Anthonisen criteria - Type I (all 3 cardinal symptoms) benefit most from antibiotics
  - Short-course corticosteroids (prednisone 40 mg x 5 days) as effective as longer courses
  - Antibiotics indicated if purulent sputum (Type I or II exacerbation)
  - Oxygen target SpO2 88-92% in COPD (avoid excessive oxygen, risk worsening hypercapnia)
  - BiPAP (NIPPV) reduces intubation and mortality in COPD exacerbations with respiratory acidosis
  - Most common bacterial pathogens - H. influenzae, S. pneumoniae, M. catarrhalis
  - Combination bronchodilators (albuterol + ipratropium) more effective than either alone
  - 5-10% of patients admitted for COPD exacerbation die in hospital
  - 30-day readmission rate high (20-25%), optimize maintenance therapy and follow-up
differentials:
  - Pneumonia (infiltrate on chest X-ray, fever, productive cough)
  - Heart failure exacerbation (BNP elevated, pulmonary edema on X-ray, JVD, crackles)
  - Pulmonary embolism (sudden dyspnea, pleuritic chest pain, risk factors, D-dimer elevated)
  - Pneumothorax (sudden dyspnea, unilateral decreased breath sounds, hyperresonance, visible on X-ray)
  - Asthma exacerbation (younger, reversible airflow obstruction, atopy, eosinophils)
  - Acute coronary syndrome (chest pain, EKG changes, troponin elevated)
  - Upper airway obstruction (stridor, inspiratory difficulty)
trace:
  - 68-year-old man with COPD presents to ED with 3-day history of worsening shortness of breath
  - Dyspnea at rest, worse with minimal exertion (walking to bathroom)
  - Increased cough, producing more sputum than usual
  - Sputum yellow-green color (purulent)
  - Increased wheeze
  - Feels more chest tightness
  - No fever, no chest pain
  - Started 2 days ago with cold symptoms (runny nose, sore throat)
  - Using albuterol inhaler every 2-3 hours (usually once daily)
  - Past medical history - COPD (FEV1 40% predicted, GOLD stage 3, severe), 50 pack-year smoking history
  - Prior exacerbations - 2 in past year, both treated outpatient with prednisone and antibiotics
  - Current COPD maintenance - tiotropium (Spiriva) 18 mcg inhaled daily, fluticasone/salmeterol (Advair) 250/50 one puff BID, albuterol MDI PRN
  - Medications - tiotropium, fluticasone/salmeterol, albuterol, aspirin, atorvastatin
  - Social - former smoker (quit 2 years ago), lives with wife
  - Physical exam - appears dyspneic, using accessory muscles
  - Vitals - temp 37.8C, HR 108 (tachycardia), BP 145/85, RR 28 (tachypnea), SpO2 86% on room air
  - General - sitting upright, leaning forward (tripod position), speaking in short sentences
  - Using sternocleidomastoid muscles, pursed-lip breathing
  - HEENT - no cyanosis
  - Lungs - diffusely decreased breath sounds, prolonged expiratory phase, diffuse expiratory wheeze, no crackles
  - Cardiovascular - tachycardia, regular rhythm, no murmurs, no JVD
  - Extremities - no edema, no cyanosis
  - Neurologic - alert, oriented, anxious but appropriate
  - Labs - SpO2 86% room air, placed on 2 L/min nasal cannula, SpO2 improved to 90%
  - ABG on 2 L O2 - pH 7.33 (acidotic), PaCO2 58 mmHg (hypercapnia, elevated from baseline 50), PaO2 62 mmHg (hypoxemia), HCO3 30 mEq/L (chronic compensation)
  - Acute-on-chronic respiratory acidosis (pH 7.33, PaCO2 increased from baseline)
  - CBC - WBC 13,200/μL (mild leukocytosis), hemoglobin 15.5 g/dL (polycythemia from chronic hypoxemia), platelets normal
  - CMP - normal electrolytes, BUN 22 mg/dL, Cr 1.1 mg/dL
  - Chest X-ray - hyperinflation, flattened diaphragms (chronic COPD findings), no focal infiltrate (no pneumonia), no pneumothorax, no pulmonary edema
  - EKG - sinus tachycardia 108 bpm, no acute ischemic changes
  - Diagnosis - COPD EXACERBATION, moderate-severe (Anthonisen Type I - all 3 cardinal symptoms)
  - Increased dyspnea, increased sputum volume, increased sputum purulence
  - Likely precipitated by viral upper respiratory infection with secondary bacterial superinfection
  - Acute-on-chronic respiratory acidosis (pH 7.33, PaCO2 58 elevated from baseline 50)
  - Hypoxemia (PaO2 62, SpO2 86% room air)
  - Requires hospital admission (moderate-severe, hypoxemia, respiratory acidosis)
  - Admitted to medical floor (not ICU - pH 7.33 not severe, alert and oriented, no intubation needed)
  - Treatment initiated
  - Oxygen therapy - 2 L/min nasal cannula, target SpO2 88-92%
  - Avoid excessive oxygen (risk worsening CO2 retention)
  - Bronchodilators - aggressive
  - Albuterol/ipratropium (DuoNeb) nebulizer 3 mL every 4 hours
  - Continue maintenance tiotropium (Spiriva) and fluticasone/salmeterol (Advair)
  - Systemic corticosteroids
  - Prednisone 40 mg PO daily x 5 days
  - Antibiotics - purulent sputum indicates bacterial infection
  - Amoxicillin/clavulanate 875 mg PO BID x 5 days (covers H. influenzae, S. pneumoniae, M. catarrhalis)
  - Hospital course - Day 1: Nebulizers every 4 hours, on oxygen 2 L/min
  - SpO2 89-91% (target range)
  - Still dyspneic but improved from admission
  - Day 2: Continued improvement
  - Less dyspneic, speaking in full sentences
  - Wheeze decreased
  - SpO2 90% on 2 L O2
  - Repeat ABG - pH 7.37 (improved), PaCO2 54 mmHg (improved from 58), PaO2 68 mmHg
  - Day 3: Significantly improved
  - Ambulating in hallway without increased dyspnea
  - SpO2 91% on 1 L O2
  - Cough improved, sputum less purulent
  - Trial off oxygen - SpO2 89% room air (acceptable)
  - Day 4: Stable, ready for discharge
  - Minimal dyspnea, back to baseline
  - SpO2 89-90% room air
  - Tolerating oral intake, ambulating
  - Discharged home Day 4
  - Medications - continue prednisone 40 mg (2 more days to complete 5-day course)
  - Continue amoxicillin/clavulanate (2 more days to complete 5-day course)
  - Resume maintenance inhalers - tiotropium daily, fluticasone/salmeterol BID
  - Albuterol MDI 2 puffs q4-6h PRN (taper as symptoms improve)
  - Pulmonology follow-up in 1 week
  - Smoking cessation reinforcement (quit 2 years ago, encourage continued abstinence)
  - Influenza and pneumococcal vaccination status verified (up to date)
  - 1-week follow-up - doing well
  - Dyspnea back to baseline
  - Completed prednisone and antibiotics
  - SpO2 90% room air (baseline for him)
  - Using albuterol 1-2 times daily (back to baseline)
  - Discussed pulmonary rehabilitation referral (improves exercise tolerance, quality of life, reduces future exacerbations)
  - Action plan for future exacerbations - rescue pack at home (prednisone and antibiotics to start early)
  - 3-month follow-up - stable
  - No further exacerbations
  - Enrolled in pulmonary rehabilitation program
  - Spirometry - FEV1 38% predicted (stable from baseline)
  - Continue maintenance therapy
  - Outcome - Successful treatment of moderate-severe COPD exacerbation with bronchodilators, corticosteroids, and antibiotics, full recovery to baseline
