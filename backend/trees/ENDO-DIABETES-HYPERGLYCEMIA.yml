tree_id: ENDO-DIABETES-HYPERGLYCEMIA
name: Diabetes with Hyperglycemia
family: endocrinology
specialty: Endocrinology
icd10: E11.65
snomed: 190331003
urgency: []
homeopathy: []
presentations:
  - Elevated blood glucose in known diabetic
  - Polyuria (increased urination) and polydipsia (increased thirst)
  - Fatigue and weakness
  - Blurred vision
  - Unintentional weight loss
  - Slow wound healing
  - Recurrent infections (urinary, skin, yeast)
  - Nausea without ketoacidosis
  - Medication non-adherence or missed doses
  - Recent illness, infection, or stress
workup:
  - Point-of-care glucose measurement
  - Determine severity: mild (200-300), moderate (300-400), severe (>400 mg/dL)
  - Assess for DKA or HHS (hyperglycemic hyperosmolar state)
  - Serum or urine ketones (rule out DKA)
  - Basic metabolic panel (osmolality, electrolytes, kidney function)
  - Arterial or venous blood gas if concern for acidosis
  - Hemoglobin A1c (reflects 3-month glucose control)
  - Identify precipitating factors
  - Medication non-adherence or inadequate dosing
  - Acute illness (infection, MI, stroke, pancreatitis)
  - New medications (steroids, thiazides, atypical antipsychotics)
  - Assess for complications
  - Urinalysis and culture (UTI)
  - Chest X-ray if respiratory symptoms
  - ECG if cardiac symptoms
treatment:
  - Mild to moderate hyperglycemia (outpatient management)
  - Increase or adjust current diabetes medications
  - Short-acting insulin correction doses (if not on insulin)
  - Start 0.1 units/kg for glucose >200 mg/dL
  - Hydration with water or sugar-free fluids
  - Treat underlying cause (infection, medication adjustment)
  - Severe hyperglycemia without DKA/HHS (glucose >400)
  - Consider ER evaluation or close outpatient follow-up
  - Subcutaneous rapid-acting insulin every 2-4 hours until <250 mg/dL
  - Aggressive hydration
  - Daily phone follow-up or return visit in 24-48 hours
  - DKA or HHS - immediate hospitalization required
  - IV fluids (normal saline initially)
  - IV insulin infusion
  - Electrolyte replacement (especially potassium)
  - ICU admission if severe
  - Medication optimization after resolution
  - Intensify basal insulin or add basal insulin if not on insulin
  - Add or increase prandial insulin if A1c not at goal
  - Consider GLP-1 agonist or SGLT2 inhibitor as adjunct
  - Diabetes education reinforcement
clinical_pearls:
  - "Hyperglycemia in diabetes most commonly due to medication non-adherence or intercurrent illness"
  - "DKA rare in type 2 diabetes unless severe stressor - more common in type 1"
  - "HHS (hyperosmolar hyperglycemic state) occurs in type 2 - glucose often >600, severe dehydration, altered mental status"
  - "Steroid-induced hyperglycemia peaks 4-8 hours after dose, may require insulin"
  - "SGLT2 inhibitors can cause euglycemic DKA (normal glucose with ketoacidosis)"
  - "Infection most common precipitant - UTI, pneumonia, skin/soft tissue"
  - "Persistent hyperglycemia increases risk of complications: retinopathy, nephropathy, neuropathy"
referrals:
  - Emergency department if glucose >400 with symptoms, suspected DKA/HHS, or unable to tolerate oral intake
  - Endocrinology if recurrent hyperglycemia despite medication adjustment
  - Diabetes educator for medication adherence counseling
  - Social work if financial barriers to medication access
differentials:
  - Diabetic ketoacidosis (DKA) - ketones present, anion gap acidosis
  - Hyperosmolar hyperglycemic state (HHS) - glucose >600, severe dehydration, altered mental status
  - Medication non-adherence or inadequate dosing
  - Infection or acute illness (UTI, pneumonia, MI, stroke)
  - Steroid-induced hyperglycemia
  - Pancreatitis (can cause or result from hyperglycemia)
  - New-onset diabetes (undiagnosed previously)
trace:
  source: ADA Standards of Care in Diabetes 2024, AACE Guidelines on Glycemic Control
  version: '1.0'
  last_updated: '2025-12-26'
