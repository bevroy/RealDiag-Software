tree_id: RHEUM-REACTIVE-ARTHRITIS
name: Reactive Arthritis (Reiter Syndrome)
family: Rheumatology
specialty: Rheumatology
chief_complaint: Joint pain after stomach infection
description: Sterile inflammatory arthritis developing 1-4 weeks after GI or GU infection, classic triad of arthritis, urethritis, and conjunctivitis. HLA-B27 positive in 60-80%, usually self-limited but can be chronic. NSAIDs first-line, antibiotics do NOT help established arthritis.
icd10: M02.9
snomed: 129133007
presentations:
  - Asymmetric oligoarthritis
  - Enthesitis (Achilles, plantar fascia)
  - Conjunctivitis, uveitis
  - Urethritis, cervicitis
  - Preceding infection (GI or GU)
  - HLA-B27 association
  - Classic triad: arthritis, urethritis, conjunctivitis
urgency: routine

workup:
  - Clinical diagnosis: acute asymmetric oligoarthritis (fewer than 5 joints) 1-4 weeks after infection
  - Preceding infection:
  - GI infection (most common): Salmonella, Shigella, Campylobacter, Yersinia
  - Genitourinary infection: Chlamydia trachomatis (sexually transmitted)
  - History of diarrhea or urethritis 1-4 weeks before joint symptoms
  - Joint involvement: lower extremity predominant (knees, ankles, feet), asymmetric oligoarthritis
  - Enthesitis: Achilles tendinitis, plantar fasciitis (50% of cases)
  - Dactylitis: sausage toe or finger
  - Extra-articular manifestations (classic triad - only 33% have all three):
  - Arthritis (100%)
  - Urethritis (50-90%): dysuria, urethral discharge
  - Conjunctivitis (30-60%): bilateral, non-purulent, painless
  - Skin manifestations:
  - Keratoderma blennorrhagicum: hyperkeratotic lesions on soles and palms (resembles pustular psoriasis)
  - Circinate balanitis: painless shallow ulcers on glans penis
  - Oral ulcers: painless ulcers on palate or tongue
  - Acute anterior uveitis: painful eye, photophobia (more severe than conjunctivitis)
  - HLA-B27: positive in 60-80% (associated with more severe and chronic disease)
  - Labs: elevated ESR and CRP, negative RF and anti-CCP (seronegative)
  - Synovial fluid: inflammatory (WBC 2000-50000), culture negative (sterile arthritis)
  - Rule out septic arthritis: joint aspiration if monoarthritis with effusion
  - Testing for triggering infection:
  - Stool culture: if recent diarrhea (often negative by time of arthritis)
  - Chlamydia PCR: urine or urethral swab
  - Serology: may show elevated antibodies to Chlamydia, Yersinia, Salmonella
  - X-rays: usually normal early, may show periostitis or erosions if chronic

treatment:
  - NSAIDs (first-line): high-dose for acute arthritis
  - Indomethacin 50 mg TID or naproxen 500 mg BID
  - Most cases self-limited, resolve in 3-6 months
  - Antibiotics for active infection:
  - Treat active Chlamydia: doxycycline 100 mg BID x7 days or azithromycin 1 g single dose
  - Treat sexual partners to prevent reinfection
  - Antibiotics do NOT help established arthritis (sterile inflammation)
  - Intra-articular corticosteroids: for persistent monoarthritis or oligoarthritis
  - Systemic corticosteroids: prednisone 20-40 mg daily for severe polyarthritis, taper over weeks
  - DMARDs for chronic disease (symptoms over 6 months):
  - Sulfasalazine 2-3 g daily: first choice for chronic reactive arthritis
  - Methotrexate 15-25 mg weekly: if sulfasalazine ineffective
  - TNF inhibitors: for refractory chronic disease (rare)
  - Physical therapy: maintain range of motion, strengthen muscles
  - Treat conjunctivitis: usually self-limited, artificial tears
  - Ophthalmology referral: if painful eye (uveitis requires topical steroids and cycloplegics)
  - Prognosis: 50% resolve completely in 6 months, 20% develop chronic arthritis, 30% have recurrent episodes

clinical_pearls:
  - Asymmetric oligoarthritis 1-4 weeks after GI or GU infection
  - Classic triad: arthritis, urethritis, conjunctivitis (only 33% have all three)
  - Cannot always walk, cannot see, cannot pee (mnemonic)
  - Lower extremity predominant, enthesitis common (heel pain)
  - HLA-B27 positive in 60-80%, associated with chronic disease
  - Antibiotics treat active infection but do NOT help established arthritis
  - Most self-limited (resolve 3-6 months) but 20% become chronic
  - Sterile arthritis (joint cultures negative)

differentials:
  - Septic arthritis: monoarthritis, purulent joint fluid, positive culture, more systemically ill
  - Gonococcal arthritis: migratory polyarthritis, tenosynovitis, pustular skin lesions, positive GC culture
  - Psoriatic arthritis: psoriasis, dactylitis, nail changes, no preceding infection
  - Ankylosing spondylitis: axial predominant, gradual onset, no preceding infection
  - Lyme arthritis: oligoarthritis after tick bite, positive Lyme serology, responds to antibiotics

trace: |
  A 32-year-old man presented with 1 week of severe right knee pain and swelling, left ankle pain, and right heel pain. Three weeks ago had severe diarrhea x5 days after eating undercooked chicken (likely Salmonella or Campylobacter). One week after diarrhea resolved developed burning with urination and mild urethral discharge. Two days ago eyes became red and irritated bilaterally (non-painful). Then joint pain started. Cannot bear weight on right leg. Sexually active, last partner 2 months ago. Exam showed right knee large effusion warm and tender, left ankle synovitis, right Achilles tendon thickened and tender (enthesitis), bilateral non-purulent conjunctivitis. Arthrocentesis right knee: WBC 18000 (inflammatory), no crystals, Gram stain negative, culture pending (sterile). Labs: ESR 52, CRP 38, HLA-B27 positive, RF negative, anti-CCP negative. Urinalysis: 15 WBC (urethritis). Urine Chlamydia PCR: negative. Stool culture: negative (infection already cleared). Diagnosed with reactive arthritis (classic presentation: asymmetric oligoarthritis with enthesitis 1-4 weeks after GI infection, urethritis, conjunctivitis - classic triad, HLA-B27 positive, sterile joint fluid). Started indomethacin 50 mg TID for anti-inflammatory effect. No antibiotics indicated (infection already cleared, antibiotics do not help established arthritis). At 1 week knee swelling improved 50%, able to walk with limp. At 4 weeks knee 80% improved, ankle resolved, heel pain persists. Continued indomethacin, physical therapy. At 8 weeks conjunctivitis resolved, urethritis resolved, heel pain improved. At 3 months right knee 95% improved, heel pain minimal. Tapered off indomethacin. At 6 months complete resolution of arthritis (self-limited course in 50%). Counseled that 30% have recurrent episodes, avoid GI infections, practice safe sex. If symptoms persist beyond 6 months would consider sulfasalazine.
