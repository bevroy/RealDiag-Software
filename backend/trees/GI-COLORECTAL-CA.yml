tree_id: GI-COLORECTAL-CA
name: Colorectal Cancer
family: Gastroenterology
specialty: Gastroenterology
icd10:
- C18.9
- C20
snomed:
- '363406005'
urgency: medium
description: Comprehensive evaluation and management of Colorectal Cancer
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Change in bowel habits
- Rectal bleeding or melena
- Abdominal pain
- Unintentional weight loss
- Iron deficiency anemia
- Palpable mass
workup:
- Colonoscopy with biopsy (diagnostic, allows tissue diagnosis and polypectomy)
- CT chest/abdomen/pelvis with IV contrast (staging, assess for metastases)
- Carcinoembryonic antigen (CEA) - tumor marker for surveillance
- MRI pelvis if rectal cancer (local staging)
- 'Molecular testing: MSI (microsatellite instability), KRAS, NRAS, BRAF (guides therapy)'
treatment:
- 'Guideline-based treatment options for Colorectal Cancer include:'
- 'Surgical resection: Hemicolectomy (right or left), low anterior resection, abdominoperineal
  resection (ACG 2023)'
- 'Adjuvant chemotherapy: FOLFOX (5-FU + leucovorin + oxaliplatin) for Stage III or
  high-risk Stage II (ACG 2023)'
- 'Metastatic: Systemic chemotherapy+ biologics (bevacizumab, cetuximab) (ACG 2023)'
- 'Rectal cancer: Neoadjuvant chemoradiation before surgery if T3-4 or node-positive
  (ACG 2023)'
- 'Surveillance: Colonoscopy at 1 year, then every 3-5 years; CEA every 3-6 months
  x 2 years (ACG 2023)'
clinical_pearls:
- Third most common cancer, second leading cause of cancer death in US
- 'Screening: Colonoscopy every 10 years starting age 45 (or 40 if African American
  or family history)'
- 'Right-sided: Iron deficiency anemia, occult bleeding (cecum has large caliber,
  no obstruction)'
- 'Left-sided: Bright red blood per rectum, obstruction, pencil-thin stools (descending
  colon narrow)'
- 'Staging: CT chest/abdomen/pelvis, CEA level'
- '5-year survival: Stage I (90%), Stage II (80%), Stage III (70%), Stage IV (14%)'
referrals:
- Gastroenterology for colonoscopy (diagnosis)
- Colorectal surgery for resection
- Medical oncology for chemotherapy (Stage III, IV, or high-risk Stage II)
- Radiation oncology if rectal cancer
differentials: []
