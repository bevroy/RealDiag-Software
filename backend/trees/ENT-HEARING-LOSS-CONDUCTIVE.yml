tree_id: ENT-HEARING-LOSS-CONDUCTIVE
name: Conductive Hearing Loss
family: Ent
specialty: Ent
icd10:
- H90.2
snomed:
- 44057004
urgency: medium
description: Comprehensive evaluation and management of Conductive Hearing Loss
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Difficulty hearing
- Abnormal Rinne test (bone conduction > air conduction)
- Weber lateralizes to affected ear
- Causes - cerumen impaction, otitis media, otosclerosis, TM perforation
- May be reversible with treatment of underlying cause
workup:
- Otoscopy to visualize ear canal and TM (cerumen, effusion, perforation, cholesteatoma)
- Rinne and Weber tuning fork tests (512 Hz) - bedside screening
- 'Audiometry: Air and bone conduction thresholds (air-bone gap >10 dB = conductive
  loss)'
- 'Tympanometry: Flat Type B curve (OME, perforation), Type As (stiffness/otosclerosis)'
treatment:
- 'Guideline-based treatment options for Conductive Hearing Loss include:'
- 'Cerumen impaction: Irrigation (warm water, contraindicated if TM perforation) OR
  manual removal with curette/suction (AAO-HNS 2023)'
- 'OME (effusion): Observation 3 months, then myringotomy + tubes if persistent or
  bilateral with hearing loss >25 dB (AAO-HNS 2023)'
- 'TM perforation: Most heal spontaneously in 2-3 months. Keep dry (ear plugs when
  swimming). If >3 months, tympanoplasty (AAO-HNS 2023)'
- 'Otosclerosis: Stapedectomy (surgical - removes fixed stapes, replaces with prosthesis,
  90% success) OR hearing aid (AAO-HNS 2023)'
- 'Cholesteatoma: Surgical excision (can erode ossicles, mastoid, cause complications)
  (AAO-HNS 2023)'
clinical_pearls:
- Problem in outer/middle ear preventing sound transmission to inner ear - often reversible
- 'Rinne test: Tuning fork on mastoid (bone conduction) then near ear canal (air).
  Normally AC > BC. If BC > AC = conductive loss'
- 'Weber test: Tuning fork on forehead. Lateralizes TO affected ear in conductive
  loss (bone conduction bypasses blockage)'
- 'Causes: Cerumen (most common), OME (effusion), TM perforation, cholesteatoma, otosclerosis,
  ossicular chain disruption'
- 'Otosclerosis: Familial condition with stapes fixation, starts age 20-40, slow progressive
  loss, may hear better in noise (paracusis)'
referrals:
- 'ENT for: Persistent OME >3 months, TM perforation >3 months, suspected cholesteatoma
  or otosclerosis'
- Audiology for hearing aid evaluation if not surgical candidate
differentials:
  - Cerumen impaction
  - Otitis media
  - Tympanic perforation
  - Otosclerosis
  - Cholesteatoma
