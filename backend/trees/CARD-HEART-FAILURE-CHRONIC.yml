tree_id: CARD-HEART-FAILURE-CHRONIC
name: Chronic Heart Failure with Reduced Ejection Fraction
family: Cardiac
specialty: Cardiology
chief_complaint: Shortness of breath and leg swelling
description: Chronic inability of heart to pump sufficient blood to meet metabolic demands, causing dyspnea, fatigue, and fluid retention

icd10: I50.23

urgency: urgent

workup:
  - Clinical presentation: exertional dyspnea (NYHA class I asymptomatic, II mild exertion, III minimal exertion, IV at rest), orthopnea (dyspnea lying flat), paroxysmal nocturnal dyspnea (waking gasping for air), fatigue, lower extremity edema, weight gain
  - Exam: elevated jugular venous pressure (JVP 8-15 cm water), displaced apPMI (left ventricular dilation), S3 gallop (rapid ventricular filling), pulmonary crackles (pulmonary edema), peripheral edema, hepatomegaly, ascites (right heart failure)
  - Etiology HFrEF (heart failure with reduced ejection fraction, EF less than 40 percent): ischemic cardiomyopathy (prior MI, most common cause 60-70 percent), nonischemic dilated cardiomyopathy (idiopathic, viral myocarditis, alcohol, chemotherapy, peripartum, familial)
  - Distinguish HFrEF (reduced EF less than 40 percent) from HFpEF (preserved EF greater than or equal to 50 percent) - treatment differs significantly
  - Echocardiogram: essential to assess LV function (ejection fraction), wall motion abnormalities (ischemic if present), valve function, RV function, estimate pulmonary artery pressure
  - BNP or NT-proBNP: elevated confirms heart failure (BNP greater than 100 pg/mL, NT-proBNP greater than 300 pg/mL), higher levels indicate worse severity, useful to monitor response to treatment
  - Chest X-ray: cardiomegaly (cardiothoracic ratio greater than 0.5), pulmonary vascular congestion (cephalization), interstitial edema (Kerley B lines), pleural effusions
  - ECG: may show prior MI (Q waves), left ventricular hypertrophy, left bundle branch block, atrial fibrillation
  - Labs: CBC (anemia worsens heart failure), CMP (assess renal function, electrolytes), TSH (hypo or hyperthyroidism cause or exacerbate HF), lipid panel, hemoglobin A1c
  - Coronary angiography: if ischemic etiology suspected or new diagnosis HFrEF (revascularization may improve function if viable myocardium)

treatment:
  - Goals: improve symptoms, slow progression, reduce hospitalizations, prolong survival
  - Guideline-directed medical therapy (GDMT) four pillars for HFrEF (use all four if tolerated, proven mortality benefit): ARNI (angiotensin receptor-neprilysin inhibitor), beta-blocker, mineralocorticoid receptor antagonist, SGLT2 inhibitor
  - ARNI (preferred over ACE inhibitor): sacubitril-valsartan 24/26 mg BID titrate to 97/103 mg BID (superior to enalapril, reduces mortality and hospitalizations), if ARNI not tolerated use ACE inhibitor (lisinopril, enalapril) or ARB (losartan, valsartan)
  - Beta-blocker: carvedilol 3.125 mg BID titrate to 25-50 mg BID, or metoprolol succinate ER 12.5-25 mg daily titrate to 200 mg daily, or bisoprolol 1.25 mg daily titrate to 10 mg daily (proven mortality benefit)
  - Mineralocorticoid receptor antagonist (MRA): spironolactone 12.5-25 mg daily titrate to 50 mg daily (if creatinine less than 2.5 mg/dL and potassium less than 5.0 mEq/L), or eplerenone 25 mg daily titrate to 50 mg daily (fewer gynecomastia than spironolactone)
  - SGLT2 inhibitor: dapagliflozin 10 mg daily or empagliflozin 10 mg daily (proven to reduce HF hospitalizations and mortality, even in non-diabetics)
  - Loop diuretic: for volume overload and congestion, furosemide 20-80 mg daily (titrate to maintain euvolemia), bumetanide or torsemide alternatives, not for asymptomatic patients
  - Hydralazine plus isosorbide dinitrate: if Black race (proven mortality benefit), or if intolerant to ARNI/ACE/ARB
  - Digoxin: may reduce hospitalizations (no mortality benefit), use if symptomatic despite GDMT or atrial fibrillation with rapid rate
  - Ivabradine: if sinus rhythm, HR greater than 70 bpm despite max beta-blocker, reduces hospitalizations
  - Cardiac resynchronization therapy (CRT): if EF less than or equal to 35 percent, LBBB with QRS greater than or equal to 150 ms, NYHA class II-IV on GDMT (biventricular pacemaker improves synchrony, reduces mortality)
  - ICD (implantable cardioverter-defibrillator): primary prevention if EF less than or equal to 35 percent on GDMT x 3 months (prevents sudden cardiac death)
  - Lifestyle: sodium restriction (less than 2 grams daily), fluid restriction if severe (1.5-2 L daily), daily weights (call if gain 2-3 pounds in 1 day or 5 pounds in 1 week), exercise (cardiac rehab improves functional capacity), smoking cessation, limit alcohol
  - Avoid: NSAIDs (worsen renal function and fluid retention), thiazolidinediones (pioglitazone causes fluid retention), most calcium channel blockers (negative inotropes except amlodipine safe)

clinical_pearls:
  - HFrEF (EF less than 40 percent) has proven treatments that reduce mortality (ARNI, beta-blocker, MRA, SGLT2i - use all four)
  - ARNI (sacubitril-valsartan) superior to ACE inhibitor (enalapril) for reducing mortality
  - SGLT2 inhibitors (dapagliflozin, empagliflozin) reduce HF hospitalizations even in non-diabetics
  - CRT if LBBB with QRS greater than or equal to 150 ms and EF less than or equal to 35 percent (improves outcomes)
  - ICD for primary prevention if EF less than or equal to 35 percent on GDMT x 3 months
  - Sodium restriction less than 2 grams daily, daily weights (call if gain 2-3 pounds in 1 day)
  - BNP/NT-proBNP useful for diagnosis and monitoring

differentials:
  - COPD (dyspnea but no edema, smoking history, no elevated JVP)
  - Cirrhosis with ascites (liver disease, ascites but normal JVP)
  - Nephrotic syndrome (edema but no dyspnea or elevated JVP, massive proteinuria)
  - Venous insufficiency (leg edema but no dyspnea, stasis changes)

trace:
  - 62-year-old man with history anterior MI 2 years ago (LAD stent placed) presents with 4 months progressive dyspnea on exertion (now occurs walking 1 block, NYHA class III), orthopnea (sleeps with 3 pillows), leg edema
  - History: medication noncompliance (ran out of medications 3 months ago, did not refill)
  - Exam: JVP 12 cm (elevated), displaced PMI laterally, S3 gallop, bibasilar crackles, 2+ pitting edema bilateral lower extremities to knees, weight 198 pounds (baseline 180 pounds, gained 18 pounds)
  - Labs: BNP 1250 pg/mL (markedly elevated), creatinine 1.3 mg/dL, potassium 4.2 mEq/L, hemoglobin 12.8 g/dL (mild anemia), TSH 2.1 mIU/L (normal)
  - ECG: sinus rhythm, Q waves V1-V3 (prior anterior MI), no LBBB
  - Chest X-ray: cardiomegaly, pulmonary vascular congestion, small bilateral pleural effusions
  - Echocardiogram: EF 25 percent (severely reduced), anterior and apical akinesis (prior MI territory), moderate LV dilation, no significant valve disease
  - Diagnosis: chronic heart failure with reduced ejection fraction (HFrEF) due to ischemic cardiomyopathy (prior anterior MI), NYHA class III, volume overloaded (decompensated from medication noncompliance)
  - Admitted for diuresis and medication optimization
  - IV furosemide 40 mg BID, net negative 1-2 L daily goal
  - Restarted GDMT cautiously with uptitration plan: carvedilol 3.125 mg BID (beta-blocker), lisinopril 5 mg daily (ACE inhibitor, plan to switch to ARNI once stable), spironolactone 25 mg daily (MRA)
  - Day 3: diuresed 8 pounds (weight 190 pounds), dyspnea improved, crackles resolved, edema decreased to trace
  - Transitioned to oral furosemide 40 mg daily
  - Added dapagliflozin 10 mg daily (SGLT2 inhibitor, fourth pillar of GDMT)
  - Discharge day 4: weight 188 pounds, minimal edema, dyspnea improved to NYHA class II
  - Discharge medications: furosemide 40 mg daily, carvedilol 3.125 mg BID (plan uptitration), lisinopril 10 mg daily, spironolactone 25 mg daily, dapagliflozin 10 mg daily
  - Counseling: sodium restriction less than 2 grams daily, daily weights (call if gain 2-3 pounds in 1 day), medication adherence critical
  - Follow-up 1 week: weight stable 186 pounds, tolerating medications, uptitrated carvedilol to 6.25 mg BID
  - 2 weeks: switched lisinopril to sacubitril-valsartan 24/26 mg BID (ARNI superior to ACE inhibitor), must wait 36 hours after last ACE inhibitor dose (angioedema risk)
  - 1 month: feeling much better, walking 4-5 blocks without dyspnea (NYHA class II), weight stable 184 pounds, medications uptitrated (carvedilol 12.5 mg BID, sacubitril-valsartan 49/51 mg BID)
  - 3 months: excellent functional status, NYHA class I-II, weight 182 pounds, BNP decreased to 320 pg/mL (marked improvement), on goal-directed medical therapy (sacubitril-valsartan 97/103 mg BID, carvedilol 25 mg BID, spironolactone 25 mg daily, dapagliflozin 10 mg daily, furosemide 20 mg daily)
  - Repeat echocardiogram at 3 months: EF improved to 35 percent (reverse remodeling from GDMT)
  - Referred for ICD evaluation (EF 35 percent on GDMT x 3 months, qualifies for primary prevention ICD)
  - ICD placed at 4 months (single-chamber ICD for sudden cardiac death prevention)
  - 6 months: continues to do well, excellent medication adherence, no hospitalizations, participating in cardiac rehab
