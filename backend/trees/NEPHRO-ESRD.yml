tree_id: NEPHRO-ESRD
name: End-Stage Renal Disease
family: Nephrology
specialty: Nephrology
icd10:
- N18.6
snomed:
- '46177005'
urgency: medium
description: Comprehensive evaluation and management of End-Stage Renal Disease
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Uremic symptoms
- Requiring dialysis
- Severe fluid overload
- Metabolic acidosis
- Hyperkalemia
- Anemia
workup:
- Basic metabolic panel (Cr, K+, bicarb, calcium, phosphate) - frequent monitoring
- CBC (anemia), PTH (secondary hyperparathyroidism)
- Kt/V (dialysis adequacy measure)
- Echocardiogram (assess for uremic cardiomyopathy)
treatment:
- 'Guideline-based treatment options for End-Stage Renal Disease include:'
- 'Dialysis: Hemodialysis 3-4 hours 3x/week or peritoneal dialysis daily (KDIGO 2024)'
- Erythropoietinfor anemia (target Hgb 10-11.5 g/dL) (KDIGO 2024)
- Phosphate binders with meals (sevelamer, calcium acetate) (KDIGO 2024)
- Vitamin D supplementation (calcitriol or paricalcitol) (KDIGO 2024)
- Kidney transplant evaluation (best long-term outcomes) (KDIGO 2024)
clinical_pearls:
- CKD Stage 5 (eGFR <15 mL/min/1.73m²) or requiring dialysis
- 'Uremic symptoms: Nausea, anorexia, pruritus, metallic taste, confusion, pericarditis,
  platelet dysfunction'
- 'Dialysis indications (AEIOU): Acidosis, Electrolytes (K+ >6.5), Ingestion, Overload
  (pulmonary edema), Uremia'
- 'Three dialysis options: Hemodialysis (in-center 3x/week), peritoneal dialysis (home
  daily), or transplant (best outcomes)'
- AV fistula creation when eGFR <20 (needs 2-3 months to mature before use)
referrals:
- Nephrology managing care
- Vascular surgery for AV fistula creation
- Transplant surgery for kidney transplant evaluation (best if done before dialysis
  initiation)
- Palliative care for symptom management and goals of care discussions
differentials: []
trace:
  source: 'Kidney Disease: Improving Global Outcomes (KDIGO) Guidelines, American
    Society of Nephrology (ASN)'
