tree_id: EMERGENCY-SEPSIS-SEPTIC-SHOCK
name: Sepsis and Septic Shock
family: EMERGENCY
specialty: Emergency Medicine, Critical Care
chief_complaint: Suspected infection, fever, hypotension, altered mental status
description: Recognition and management of sepsis and septic shock using Surviving Sepsis Campaign guidelines
version: "1.0"
icd10: A41.9
author: RealDiag Clinical Team

entry_point: sepsis_screening

nodes:
  - id: sepsis_screening
    type: question
    text: "Does patient meet sepsis criteria (infection + organ dysfunction)?"
    options:
      - label: "Yes - Infection suspected/confirmed AND qSOFA ≥2 or SOFA score increase ≥2"
        next: sepsis_severity
      - label: "Suspected infection but qSOFA <2"
        next: infection_workup
      - label: "SIRS criteria only (fever, tachycardia, tachypnea) without clear infection"
        next: sirs_evaluation

  - id: sepsis_severity
    type: question
    text: "Is patient in septic shock?"
    options:
      - label: "Yes - Sepsis + hypotension requiring vasopressors (MAP ≥65) AND lactate >2 despite fluids"
        next: septic_shock
      - label: "No - Sepsis without shock (normotensive or responsive to fluids)"
        next: sepsis_management

  - id: septic_shock
    type: diagnosis
    name: "Septic Shock"
    icd10: "R65.21"
    urgency: critical
    workup:
      - Blood cultures x2 (before antibiotics)
      - Lactate (repeat if >2)
      - CBC, CMP, coagulation studies
      - Urinalysis and urine culture
      - Chest X-ray
      - Source identification (CT if indicated)
      - Arterial blood gas
      - Procalcitonin
    treatment:
      - "Hour-1 Bundle (within 1 hour of recognition):"
      - Measure lactate level (remeasure if elevated >2 mmol/L)
      - Obtain blood cultures before antibiotics
      - Administer broad-spectrum antibiotics
      - Begin rapid fluid resuscitation (30 mL/kg crystalloid for hypotension or lactate ≥4)
      - Apply vasopressors if hypotensive during or after fluid resuscitation (target MAP ≥65)
      - "Antibiotics: Broad-spectrum within 1 hour"
      - Vancomycin 15-20 mg/kg + piperacillin-tazobactam 4.5g q6h OR meropenem 1g q8h
      - Add fluconazole or micafungin if risk factors for fungal infection
      - "Fluid resuscitation: 30 mL/kg crystalloid (Lactated Ringer's or Normal Saline)"
      - "Vasopressors (if MAP <65 after fluids):"
      - Norepinephrine (first-line) 0.05-2 mcg/kg/min
      - Add vasopressin 0.03-0.04 units/min if inadequate response
      - Consider corticosteroids (hydrocortisone 200mg/day) if refractory shock
      - Source control within 12 hours (drain abscess, remove infected device)
      - ICU admission
      - Central venous access and arterial line
      - Mechanical ventilation if respiratory failure

  - id: sepsis_management
    type: diagnosis
    name: "Sepsis without Shock"
    icd10: "A41.9"
    urgency: critical
    workup:
      - Blood cultures x2
      - Lactate
      - CBC, CMP
      - Urinalysis and culture
      - Chest X-ray
      - Additional cultures based on suspected source
      - Procalcitonin
    treatment:
      - Broad-spectrum antibiotics within 1 hour
      - IV fluid resuscitation (30 mL/kg if lactate ≥2 or hypotension)
      - Frequent reassessment for shock development
      - Source identification and control
      - ICU vs telemetry admission based on severity
      - Monitor for organ dysfunction
      - De-escalate antibiotics based on culture results

  - id: infection_workup
    type: diagnosis
    name: "Suspected Infection - Low Risk for Sepsis"
    icd10: "R50.9"
    urgency: high
    workup:
      - Blood cultures if febrile
      - CBC, CMP
      - Urinalysis
      - Chest X-ray
      - Lactate if concerned
    treatment:
      - Antibiotics if bacterial infection suspected
      - IV fluids if dehydrated
      - Close monitoring for clinical deterioration
      - Admission vs discharge based on clinical stability

  - id: sirs_evaluation
    type: diagnosis
    name: "SIRS without Clear Infection"
    icd10: "R65.10"
    urgency: moderate
    workup:
      - Search for non-infectious causes (pancreatitis, trauma, burns, surgery)
      - Consider occult infection
      - CBC, CMP
      - Imaging as indicated by history
    treatment:
      - Treat underlying cause
      - Supportive care
      - Monitor for infection development
      - Avoid unnecessary antibiotics

metadata:
  evidence_based: true
  guidelines:
    - "Surviving Sepsis Campaign Guidelines 2021"
    - "SCCM/ESICM Sepsis-3 Definitions 2016"
  clinical_pearls:
    - "Sepsis-3: Life-threatening organ dysfunction (SOFA ≥2) caused by dysregulated host response to infection"
    - "Septic Shock: Sepsis + vasopressor need to maintain MAP ≥65 AND lactate >2 despite adequate fluid"
    - "qSOFA: Respiratory rate ≥22, altered mentation, SBP ≤100 (≥2 = high risk)"
    - "Time is tissue - antibiotics within 1 hour significantly reduces mortality"
    - "30 mL/kg crystalloid bolus for hypotension or lactate ≥4 (about 2L for 70kg patient)"
    - "Norepinephrine is first-line vasopressor, target MAP ≥65 mmHg"
    - "Source control critical - drain abscesses, remove infected lines/hardware"
    - "Don't delay antibiotics for cultures if patient unstable"
