tree_id: NEURO-GUILLAIN-BARRE-SYNDROME
name: Guillain-Barré Syndrome (GBS)
family: neuromuscular
specialty: Neurology
chief_complaint: Ascending weakness, paresthesias, areflexia following infection
description: Acute inflammatory demyelinating polyneuropathy causing progressive ascending weakness with areflexia
icd10: G61.0
urgency: emergency
workup:
  - Clinical presentation - classic triad: ascending weakness, areflexia, progression over days to weeks
  - Weakness - symmetric, ascending (legs before arms), progressive
  - Begins in distal lower extremities, ascends to trunk and arms
  - Nadir typically within 2-4 weeks (by definition less than 4 weeks)
  - Sensory symptoms - paresthesias, dysesthesias in hands and feet (50-70%)
  - Pain - back pain, radicular pain (50-80% of patients)
  - Autonomic dysfunction (60-70%) - tachycardia, bradycardia, blood pressure lability, ileus, urinary retention
  - Cranial nerve involvement - facial weakness (50%), bulbar weakness (dysphagia, dysarthria), ophthalmoplegia
  - Respiratory muscle weakness - life-threatening, requires monitoring
  - Preceding illness (2/3 of patients) - 1-3 weeks before onset
  - Campylobacter jejuni (30% most common), cytomegalovirus, Epstein-Barr virus, Mycoplasma pneumoniae, influenza, Zika virus
  - Physical examination
  - Symmetric flaccid weakness, proximal and distal
  - Areflexia or hyporeflexia (hallmark finding, present in 90%)
  - Sensory exam - decreased vibration/proprioception, decreased pain/temperature
  - Cranial nerves - bilateral facial weakness, difficulty swallowing
  - No upper motor neuron signs (no Babinski, no spasticity)
  - Respiratory assessment - vital capacity, negative inspiratory force
  - Laboratory studies
  - CSF analysis (lumbar puncture) - albuminocytologic dissociation
  - Elevated protein (greater than 45 mg/dL, often 100-1000 mg/dL) - classic finding
  - Normal white blood cell count (less than 10 cells/mm³)
  - Takes 7-10 days to develop, may be normal early
  - Serum testing for antecedent infections
  - Campylobacter antibodies, CMV IgM, EBV antibodies, Mycoplasma antibodies
  - Anti-ganglioside antibodies (GM1, GQ1b) - associated with specific variants
  - Electromyography (EMG) and nerve conduction studies
  - Demyelinating pattern - prolonged distal latencies, slowed conduction velocities, conduction block, prolonged F-waves
  - Takes 10-14 days to develop abnormalities
  - Axonal variant (AMAN, AMSAN) shows reduced amplitudes
  - Respiratory function monitoring - CRITICAL
  - Forced vital capacity (FVC) every 4-6 hours initially
  - Negative inspiratory force (NIF)
  - 20-30-40 rule for intubation - FVC less than 20 mL/kg, NIF less than 30 cmH2O, PO2 less than 70 mmHg on room air, or PCO2 greater than 40
treatment:
  - Immunotherapy - two equally effective first-line options (do NOT combine)
  - Intravenous immunoglobulin (IVIG) - preferred (easier administration)
  - 0.4 g/kg/day for 5 days (total dose 2 g/kg)
  - Onset of benefit 7-14 days
  - Side effects - headache, aseptic meningitis, thrombosis, renal dysfunction, hemolysis
  - Plasmapheresis (plasma exchange)
  - 5 exchanges over 7-14 days (200-250 mL/kg per exchange)
  - Slightly higher complication rate (line infections, hypotension)
  - Preferred if IVIG contraindicated (IgA deficiency) or failed
  - Corticosteroids NOT effective (do not use)
  - Supportive care - CRITICAL for outcomes
  - ICU admission if respiratory compromise, bulbar dysfunction, or autonomic instability
  - Respiratory monitoring and support
  - Intubation and mechanical ventilation if FVC less than 20 mL/kg or respiratory distress
  - 20-30% require mechanical ventilation
  - Average ventilation duration 3-4 weeks
  - Autonomic monitoring - cardiac telemetry, blood pressure monitoring
  - Treat arrhythmias cautiously (may be transient)
  - Pain management - opioids, gabapentin, carbamazepine
  - DVT prophylaxis - compression stockings, subcutaneous heparin
  - Physical and occupational therapy - prevent contractures, begin early mobilization
  - Nutritional support - enteral feeding if dysphagia
  - Bladder care - intermittent catheterization if urinary retention
  - Variants of GBS
  - Acute motor axonal neuropathy (AMAN) - pure motor, no sensory involvement, anti-GM1 antibodies, associated with Campylobacter
  - Acute motor and sensory axonal neuropathy (AMSAN) - motor and sensory axonal damage, worse prognosis
  - Miller Fisher syndrome - ophthalmoplegia, ataxia, areflexia, anti-GQ1b antibodies
  - Rehabilitation - prolonged recovery typical
  - Inpatient rehabilitation after acute phase
  - Physical therapy, occupational therapy, speech therapy
  - Recovery over months to years
clinical_pearls:
  - Incidence 1-2 per 100,000, can occur at any age, slight male predominance
  - Medical emergency - respiratory failure can occur rapidly (monitor FVC closely)
  - Classic triad - ascending weakness, areflexia, progression over days to weeks
  - Albuminocytologic dissociation (elevated CSF protein, normal WBC) pathognomonic but may be absent early
  - Molecular mimicry - antibodies against infection cross-react with peripheral nerve gangliosides
  - Campylobacter jejuni most common antecedent infection (30%), associated with worse prognosis and axonal variants
  - Nadir of weakness typically 2-4 weeks, then plateau, then gradual recovery over months
  - IVIG and plasmapheresis equally effective, shorten time to recovery and improve long-term outcomes
  - 80-85% eventually achieve full or near-full recovery
  - 5% mortality (respiratory failure, cardiac arrhythmias, pulmonary embolism, infections)
  - 10-20% have permanent residual weakness
  - Recurrence rare (3-5%)
differentials:
  - Myasthenia gravis (fluctuating weakness, improves with rest, ocular involvement, preserved reflexes)
  - Transverse myelitis (sensory level, bowel/bladder dysfunction early, upper motor neuron signs)
  - Botulism (descending paralysis, dilated pupils, food exposure)
  - Tick paralysis (ascending paralysis, tick found on body, resolves with tick removal)
  - Poliomyelitis (asymmetric weakness, fever, CSF pleocytosis)
  - Spinal cord compression (back pain, sensory level, bowel/bladder, imaging shows lesion)
  - Chronic inflammatory demyelinating polyneuropathy (CIDP) - slower progression greater than 8 weeks
  - Hypokalemia or hypophosphatemia (electrolyte abnormalities, no sensory symptoms)
trace:
  - 38-year-old woman presents to ED with 4-day history of progressive leg weakness
  - 2 weeks ago had diarrheal illness lasting 5 days (resolved)
  - 4 days ago developed tingling and numbness in feet
  - 3 days ago noticed difficulty walking, legs felt weak
  - Weakness progressively worsening, now difficulty standing from chair
  - Today developed numbness in hands, some difficulty gripping objects
  - Low back pain radiating down legs
  - No bowel or bladder incontinence, no chest pain, no shortness of breath
  - Past medical history - none, no recent vaccinations
  - Physical exam - alert, anxious, no respiratory distress
  - Vitals - temp 37.1C, HR 102, BP 140/88, RR 16, SpO2 98% room air
  - Cranial nerves - intact, no facial weakness
  - Motor - symmetric weakness, proximal and distal
  - Lower extremities 3/5 hip flexors, 3/5 knee extension, 4/5 ankle dorsiflexion
  - Upper extremities 4+/5 shoulder abduction, 4+/5 grip strength
  - Reflexes - areflexia throughout (biceps, triceps, patellar, Achilles all absent)
  - Sensory - decreased pinprick and vibration in stocking-glove distribution
  - Plantar responses flexor, no clonus
  - Gait - wide-based, unsteady, unable to walk on toes or heels
  - Respiratory - FVC 3.2 L (65% predicted), NIF -45 cmH2O (borderline)
  - Labs - CBC normal, comprehensive metabolic panel normal
  - CSF analysis - opening pressure 15 cmH2O (normal)
  - Protein 85 mg/dL (elevated, normal less than 45)
  - Glucose 65 mg/dL (normal), WBC 2 cells/mm³ (normal less than 5)
  - ALBUMINOCYTOLOGIC DISSOCIATION - classic for GBS
  - Diagnosis - Guillain-Barré syndrome, acute inflammatory demyelinating polyneuropathy
  - Admitted to ICU for monitoring
  - Neurology consultation obtained
  - Cardiac telemetry, respiratory monitoring with q4h FVC and NIF
  - Treatment initiated
  - IVIG 0.4 g/kg/day (28 g daily for 70 kg patient) for 5 days
  - First dose given Day 1
  - Pain management - gabapentin 300 mg TID, oxycodone PRN
  - DVT prophylaxis - enoxaparin 40 mg SC daily, compression stockings
  - Physical therapy consultation
  - Hospital course - Day 1-3: Continued IVIG infusions
  - Weakness progressed slightly, now upper extremities 4/5, lower extremities 2-3/5
  - FVC stable 3.0-3.2 L (monitoring closely)
  - Developed mild facial weakness bilaterally Day 3
  - Day 4: Completed IVIG course (5 days total)
  - Weakness reached nadir - unable to stand without assistance
  - Upper extremities 3-4/5, lower extremities 2/5
  - FVC decreased to 2.5 L (50% predicted) - concerning
  - Transferred to ICU, close respiratory monitoring
  - Day 5-7: FVC stabilized 2.4-2.6 L, no further decline
  - No intubation required
  - Autonomic instability - episodes tachycardia 120-140 bpm, blood pressure lability
  - Managed conservatively, self-limited episodes
  - Day 8-14: Plateau phase - weakness stable, no progression
  - FVC stable around 2.5 L
  - Pain improved with gabapentin
  - Intensive physical therapy in bed
  - EMG/NCS Day 10 - demyelinating pattern, prolonged distal latencies, slowed conduction velocities, prolonged F-waves
  - Confirms diagnosis
  - Day 15: Subtle improvement in strength
  - Upper extremities 4/5, lower extremities 2-3/5
  - FVC improving 2.8 L
  - Transferred out of ICU to neurology floor
  - Day 21: Continued gradual improvement
  - Able to stand with assistance, take few steps with walker
  - Facial weakness resolved
  - Discharge Day 28 to inpatient rehabilitation facility
  - Strength - upper extremities 4+/5, lower extremities 3-4/5
  - FVC 3.5 L (70% predicted)
  - Inpatient rehabilitation - 3 weeks intensive PT/OT
  - Progressive strengthening, gait training, ADL training
  - Discharge home with outpatient therapy
  - 3-month follow-up - significant improvement
  - Ambulating independently with cane for long distances
  - Strength - upper extremities 5/5, lower extremities 4+/5
  - Residual mild distal weakness in feet, mild sensory symptoms
  - 6-month follow-up - near complete recovery
  - Ambulating without assistive device
  - Strength nearly normal, mild residual foot drop right side
  - Using AFO brace for long walks
  - Returned to work
  - 1-year follow-up - excellent recovery
  - Minimal residual weakness, occasional fatigue
  - Independent in all activities
  - Outcome - Good recovery with IVIG and supportive care, minimal residual deficits
