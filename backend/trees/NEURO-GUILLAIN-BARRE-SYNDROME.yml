tree_id: NEURO-GUILLAIN-BARRE-SYNDROME
name: Guillain-Barre Syndrome
family: Neurology
specialty: Neurology
chief_complaint: Ascending weakness and areflexia
description: |
  Acute inflammatory demyelinating polyradiculoneuropathy (AIDP) most common form. Autoimmune attack on peripheral nerves.
  Often follows infection (Campylobacter jejuni, CMV, EBV, Zika) by 1-3 weeks. Progressive weakness peaks at 2-4 weeks. Most recover but 20% have residual deficits.
icd10: G61.0
urgency: High
workup:
  - Clinical diagnosis - progressive symmetric ascending weakness, areflexia or hyporeflexia, progression over days to 4 weeks
  - Sensory symptoms (paresthesias, pain) common but motor predominates
  - Lumbar puncture - albuminocytologic dissociation (elevated protein greater than 45 mg/dL with normal or mildly elevated WBC less than 10 cells/mcL), appears after 1 week
  - Nerve conduction studies and EMG - demyelinating pattern (prolonged distal latencies, slowed conduction velocities, conduction block), supportive but not required for diagnosis
  - Pulmonary function tests - forced vital capacity (FVC) and negative inspiratory force (NIF) to assess respiratory status
  - FVC less than 20 mL/kg or NIF worse than -30 cm H2O indicates need for ICU monitoring, FVC less than 15 mL/kg or NIF worse than -20 cm H2O intubation threshold
  - ECG and telemetry - autonomic dysfunction causes arrhythmias, bradycardia, labile blood pressure
  - Screen for preceding infection - stool culture (Campylobacter), serology for CMV, EBV, Mycoplasma
treatment:
  - ICU admission if respiratory compromise, bulbar weakness, or rapid progression
  - Monitor FVC and NIF every 4-6 hours, intubate if FVC less than 15 mL/kg or unable to clear secretions
  - Immunotherapy - plasma exchange (PLEX) or intravenous immunoglobulin (IVIG) equally effective, initiate within 2 weeks of symptom onset
  - IVIG 0.4 g/kg/day IV x 5 days (total 2 g/kg) - easier to administer, preferred if autonomic instability
  - Plasma exchange 5 sessions over 1-2 weeks - removes circulating antibodies
  - No benefit from combining PLEX and IVIG, or from corticosteroids
  - Supportive care - DVT prophylaxis (subcutaneous heparin), bowel/bladder management, pain control (gabapentin, opioids for neuropathic pain), physical therapy
  - Autonomic dysfunction - avoid beta-blockers (worsen bradycardia), cautious fluid management, temporary pacemaker if severe bradycardia
  - Rehabilitation after acute phase - physical therapy, occupational therapy (recovery takes months)
clinical_pearls:
  - Classic presentation ascending paralysis starting in legs, progressing to arms and face over days
  - Areflexia hallmark finding (preserved reflexes should prompt alternative diagnosis)
  - Miller Fisher variant - ophthalmoplegia, ataxia, areflexia (anti-GQ1b antibodies)
  - Respiratory failure most serious complication, occurs in 25-30%
  - Autonomic dysfunction (labile BP, arrhythmias, ileus, urinary retention) in 70%
  - Facial weakness in 50%, bulbar weakness (dysphagia, dysarthria) in 10-15%
  - Recovery begins 2-4 weeks after progression stops, continues over months, 80% achieve independent ambulation
differentials:
  - Myasthenia gravis
  - Botulism
  - Transverse myelitis
  - Chronic inflammatory demyelinating polyneuropathy (CIDP)
  - Tick paralysis
  - West Nile virus
trace:
  - 45-year-old man with progressive leg weakness x 5 days, started 2 weeks after diarrheal illness → Exam shows symmetric proximal and distal leg weakness 2/5, areflexia throughout, sensory intact → Ascending weakness now involves arms 3/5 → FVC 45% predicted, NIF -35 cm H2O → Admit to ICU → Lumbar puncture shows protein 85 mg/dL, WBC 2 cells/mcL → Diagnose Guillain-Barre syndrome → Start IVIG 0.4 g/kg/day x 5 days → Stool culture positive for Campylobacter jejuni → Progression stops by day 7, nadir weakness 1/5 in legs, 2/5 in arms → FVC remains stable, no intubation needed → Physical therapy initiated → Gradual improvement over 8 weeks, ambulates with walker at discharge → Continues outpatient rehabilitation, near-complete recovery at 6 months
