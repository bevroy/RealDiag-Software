tree_id: ENT-RHINITIS-ALLERGIC
name: Allergic Rhinitis
family: Otolaryngology
specialty: Allergy/Immunology
chief_complaint: Nasal congestion and sneezing
description: IgE-mediated inflammation of nasal mucosa from allergen exposure causing sneezing, rhinorrhea, congestion, and itching. Intranasal corticosteroids most effective, allergen avoidance and immunotherapy for persistent disease.
icd10: J30.9
urgency: non-urgent

workup:
  - Clinical diagnosis: episodic or chronic sneezing, rhinorrhea (clear), nasal congestion, nasal/ocular pruritus, postnasal drip
  - Timing: seasonal (pollen - trees spring, grass summer, ragweed fall) or perennial (dust mites, animal dander, mold)
  - Physical exam: pale boggy nasal mucosa, clear rhinorrhea, conjunctival injection, allergic shiners (dark circles under eyes), allergic salute (transverse nasal crease from rubbing)
  - Skin prick testing: identifies specific allergens (immediate wheal and flare reaction), guides avoidance and immunotherapy
  - Specific IgE blood testing: alternative to skin testing if antihistamines cannot be discontinued or severe eczema
  - Nasal endoscopy: if unilateral symptoms, nasal polyps, or atypical presentation (rule out structural abnormalities)

treatment:
  - Allergen avoidance: most important first step (dust mite covers, HEPA filters, remove pets if animal allergy, close windows during high pollen)
  - Intranasal corticosteroids (most effective): fluticasone 1-2 sprays per nostril daily, mometasone, triamcinolone, budesonide
  - Onset 12 hours, maximal effect 1-2 weeks with regular use - patient education on proper technique and daily adherence critical
  - Second-generation antihistamines: cetirizine 10 mg daily, loratadine 10 mg daily, fexofenadine 180 mg daily (less sedating than first-generation)
  - Use PRN for intermittent symptoms or daily during allergen season
  - Combination intranasal antihistamine/steroid: azelastine/fluticasone spray (very effective, faster onset than steroid alone)
  - Leukotriene receptor antagonist: montelukast 10 mg daily (less effective than intranasal steroids but alternative if steroid-averse)
  - Oral decongestants: pseudoephedrine 30-60 mg Q4-6H PRN (avoid if hypertension, may cause insomnia, tachycardia)
  - Intranasal decongestants: oxymetazoline spray (limit to 3 days - rebound congestion with prolonged use)
  - Saline nasal irrigation: neti pot or squeeze bottle with isotonic saline (rinses allergens, moisturizes)
  - Allergen immunotherapy (allergy shots or sublingual tablets): if inadequate response to medications, modifies disease by inducing tolerance (requires 3-5 years)
  - Ocular symptoms: antihistamine eye drops (ketotifen) or mast cell stabilizer drops (cromolyn)

clinical_pearls:
  - Sneezing, clear rhinorrhea, congestion, itching triggered by allergen exposure
  - Intranasal corticosteroids most effective treatment - daily use required
  - Second-generation antihistamines for mild symptoms or PRN use
  - Allergen avoidance first-line - dust mite covers, HEPA filters
  - Skin testing identifies specific allergens
  - Immunotherapy for severe persistent disease uncontrolled by medications
  - Limit intranasal decongestants to 3 days (rebound congestion)
  - Often coexists with asthma - treat both

differentials:
  - Vasomotor (non-allergic) rhinitis: triggered by irritants, weather, odors - no allergen identified, no pruritus
  - Chronic rhinosinusitis: facial pain/pressure, purulent drainage, symptoms >12 weeks, CT shows sinus opacification
  - Nasal polyps: chronic congestion, anosmia, grape-like masses on exam, associated with asthma
  - Medication-induced rhinitis: rhinitis medicamentosa from prolonged decongestant spray use

trace: |
  A 25-year-old woman presented with 5 years of seasonal symptoms every spring (March-May) consisting of paroxysmal sneezing, profuse clear rhinorrhea, nasal congestion, nasal and ocular itching, and postnasal drip significantly affecting quality of life and work productivity. No fever or facial pain. Exam showed pale boggy nasal mucosa, clear drainage, allergic shiners, transverse nasal crease. Diagnosed with seasonal allergic rhinitis. Skin prick testing positive for tree pollen allergens (oak, birch, maple). Started fluticasone nasal spray 2 sprays per nostril daily, counseled to start 2 weeks before anticipated symptom onset and continue throughout season. Cetirizine 10 mg daily for breakthrough symptoms. Allergen avoidance measures (keep windows closed, shower after outdoor activities, HEPA filter in bedroom). At 2 weeks symptoms 70% improved with daily fluticasone. At 6 weeks (peak pollen season) excellent control, rare need for cetirizine. At season end discontinued fluticasone. Following year restarted fluticasone in late February before symptom onset (pre-seasonal treatment), excellent preventive control throughout spring, minimal breakthrough symptoms, dramatically improved quality of life.
