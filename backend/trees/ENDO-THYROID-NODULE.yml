tree_id: ENDO-THYROID-NODULE
name: Thyroid Nodule
family: Endocrinology
specialty: Endocrinology
chief_complaint: Thyroid nodule or neck mass
description: |
  Discrete lesion within thyroid gland, palpable or detected on imaging. Very common (50-70% on ultrasound), but only 5-10% are malignant.
  Evaluation aims to identify malignancy risk. Risk factors for cancer include childhood radiation exposure, family history of thyroid cancer, rapid growth, vocal cord paralysis.
icd10: E04.1
urgency: Low
workup:
  - TSH first test - if suppressed (TSH less than 0.5), get thyroid uptake scan (hot nodule rarely malignant)
  - Thyroid ultrasound - assess size, echogenicity, composition, margins, calcifications
  - American Thyroid Association (ATA) sonographic patterns predict malignancy risk
  - High suspicion (70-90% malignancy risk) - solid hypoechoic with irregular margins, microcalcifications, taller than wide, extrathyroidal extension
  - Intermediate suspicion (10-20%) - hypoechoic solid nodule with smooth margins
  - Low suspicion (5-10%) - isoechoic or hyperechoic solid, partially cystic with eccentric solid areas
  - Very low suspicion (less than 3%) - spongiform or partially cystic without suspicious features
  - Benign (less than 1%) - purely cystic
  - Fine needle aspiration (FNA) biopsy indications - nodules greater than 1 cm with high or intermediate suspicion pattern, greater than 1.5 cm with low suspicion, greater than 2 cm with very low suspicion
  - FNA cytology - Bethesda classification (I nondiagnostic, II benign, III atypia of undetermined significance, IV follicular neoplasm, V suspicious for malignancy, VI malignant)
  - Molecular testing (Afirma, ThyroSeq) if indeterminate cytology (Bethesda III-IV) to refine malignancy risk
treatment:
  - Benign nodules (Bethesda II) - observation with repeat ultrasound in 1-2 years
  - If stable x 2 exams, extend surveillance interval or discharge
  - Levothyroxine suppression no longer recommended (does not reduce nodule size, increases adverse effects)
  - Malignant nodules (Bethesda VI) or suspicious (Bethesda V) - surgical referral for thyroidectomy
  - Total thyroidectomy for papillary or follicular thyroid cancer greater than 4 cm, extrathyroidal extension, lymph node metastases
  - Thyroid lobectomy sufficient for small (less than 4 cm) low-risk papillary carcinoma confined to thyroid
  - Indeterminate nodules (Bethesda III-IV) - molecular testing to guide management
  - High-risk molecular profile - surgical excision
  - Low-risk molecular profile - observation with repeat FNA or lobectomy based on clinical factors
  - Hot nodule (autonomous, suppresses TSH) - if hyperthyroid, treat with radioactive iodine or surgery
  - Cystic nodules - aspiration for symptom relief if large, high recurrence rate
  - Ethanol ablation or radiofrequency ablation for benign nodules causing compressive symptoms
clinical_pearls:
  - Most thyroid nodules asymptomatic, discovered incidentally on imaging (thyroid incidentaloma)
  - Palpable nodules detected in 5% of population, ultrasound detects in 50-70%
  - Compressive symptoms (dysphagia, dyspnea, voice changes) suggest large goiter or malignancy
  - Papillary thyroid cancer (80% of thyroid cancers) - indolent, excellent prognosis, lymph node spread common
  - Follicular thyroid cancer (10-15%) - hematogenous spread to lungs and bones
  - Medullary thyroid cancer (5%) - from C cells, produce calcitonin, 25% familial (MEN 2)
  - Anaplastic thyroid cancer (less than 2%) - aggressive, poor prognosis, elderly patients
differentials:
  - Thyroid cyst
  - Multinodular goiter
  - Thyroiditis
  - Parathyroid adenoma
  - Lymph node
  - Thyroglossal duct cyst
trace:
  - 45-year-old woman with 2 cm thyroid nodule palpated on routine exam → No symptoms, no radiation history → TSH 2.1 mIU/L (normal) → Thyroid ultrasound shows 2.2 cm solid hypoechoic nodule right lobe with irregular margins and microcalcifications (high suspicion pattern) → FNA biopsy performed → Cytology shows Bethesda VI (papillary thyroid carcinoma) → Neck ultrasound shows no suspicious lymph nodes → Refer to endocrine surgery → Total thyroidectomy with central neck dissection → Pathology confirms 2.1 cm papillary thyroid carcinoma, no extrathyroidal extension, 0/5 lymph nodes → Stage pT1bN0 → Low-risk, no radioactive iodine needed → Start levothyroxine suppression (TSH goal 0.5-2) → Monitor thyroglobulin and anti-thyroglobulin antibodies, neck ultrasound at 6-12 months → Excellent prognosis
