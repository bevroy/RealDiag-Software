tree_id: GI-CHOLELITHIASIS
name: Cholelithiasis (Gallstones)
family: gastroenterology
specialty: Gastroenterology
icd10: K80.20
snomed: 235919008
urgency: []
homeopathy: []
presentations:
  - Asymptomatic (70-80% of gallstone patients)
  - Incidental finding on imaging for other indications
  - Episodic right upper quadrant or epigastric pain
  - Biliary colic after fatty meals
  - Nausea and vomiting
  - Bloating and food intolerance
  - Family history of gallstones
  - Risk factors: female, age >40, obesity, pregnancy, rapid weight loss
workup:
  - Right upper quadrant ultrasound (first-line, 95% sensitive for gallstones)
  - Gallstones appear as echogenic foci with posterior acoustic shadowing
  - Assess gallbladder wall thickness, pericholecystic fluid, bile duct dilation
  - CT abdomen may identify gallstones but less sensitive than ultrasound
  - Laboratory tests if symptomatic: CBC, CMP, liver enzymes, bilirubin, lipase
  - Normal labs expected in uncomplicated cholelithiasis
  - HIDA scan if acalculous cholecystitis suspected
  - MRCP or endoscopic ultrasound if concern for choledocholithiasis
treatment:
  - Asymptomatic gallstones - expectant management (no surgery recommended)
  - Only 10-25% become symptomatic over lifetime
  - Lifestyle modifications - avoid high-fat foods, maintain healthy weight
  - Symptomatic cholelithiasis - laparoscopic cholecystectomy (definitive treatment)
  - Surgery recommended after first episode of biliary colic
  - Elective cholecystectomy preferred over waiting for complications
  - Same-admission cholecystectomy for biliary pancreatitis (within 48-72 hours)
  - Medical dissolution therapy (limited role)
  - Ursodeoxycholic acid (UDCA) 8-10 mg/kg/day for small cholesterol stones
  - Requires 6-12 months, only 30% success rate, high recurrence
  - Reserved for patients who refuse or cannot tolerate surgery
  - Prophylactic cholecystectomy considered in specific populations
  - Sickle cell disease, porcelain gallbladder (cancer risk), gallstones >3 cm
clinical_pearls:
  - "Most gallstones are asymptomatic and found incidentally - no treatment needed"
  - "Once symptomatic, 70% have recurrent symptoms within 2 years"
  - "Risk factors: 5 F's - Female, Forty, Fertile, Fat, Fair (but can occur in anyone)"
  - "Cholesterol stones (80%) vs pigment stones (20% - hemolysis, cirrhosis)"
  - "Complications: cholecystitis, choledocholithiasis, pancreatitis, cholangitis, gallbladder cancer (rare)"
  - "Mirizzi syndrome - stone impacted in cystic duct compressing common hepatic duct"
  - "Porcelain gallbladder (calcified wall) has 12-25% cancer risk - prophylactic cholecystectomy"
  - "Rapid weight loss increases gallstone formation - consider UDCA prophylaxis post-bariatric surgery"
referrals:
  - General Surgery for symptomatic cholelithiasis requiring cholecystectomy
  - Gastroenterology for ERCP if choledocholithiasis suspected
  - Consider surgery referral after first symptomatic episode to prevent complications
differentials:
  - Biliary colic (transient RUQ pain from temporary stone obstruction)
  - Acute cholecystitis (persistent pain >6 hours, fever, positive Murphy's sign)
  - Choledocholithiasis (jaundice, elevated bilirubin, dilated CBD on imaging)
  - Cholangitis (Charcot's triad: fever, jaundice, RUQ pain)
  - Acute pancreatitis (epigastric pain, elevated lipase, gallstone etiology 40%)
  - Peptic ulcer disease (epigastric pain, relation to meals)
  - Hepatitis (elevated transaminases, systemic symptoms)
  - Functional dyspepsia (chronic symptoms without structural abnormality)
trace:
  source: Tokyo Guidelines 2018, ACG Clinical Guidelines on Gallstone Disease 2016
  version: '1.0'
  last_updated: '2025-12-26'
