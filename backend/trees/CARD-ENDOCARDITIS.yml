description: Comprehensive evaluation of infective endocarditis
version: "1.0"
icd10: I33.0
author: RealDiag Clinical Team

entry_point: endocarditis_presentation

nodes:
  - id: endocarditis_presentation
    type: question
    text: "Clinical presentation?"
    options:
      - label: "Suspected infective endocarditis - diagnostic workup"
        next: ie_diagnosis
      - label: "Confirmed endocarditis - determine complications"
        next: ie_complications
      - label: "Prosthetic valve endocarditis"
        next: prosthetic_valve_endocarditis

  - id: ie_diagnosis
    type: diagnosis
    name: "Infective Endocarditis - Diagnosis"
    icd10: "I33.0"
    urgency: critical
    workup:
      - Modified Duke Criteria - Definite, possible, or rejected
      - Definite IE requires - 2 major OR 1 major + 3 minor OR 5 minor
      - Major criteria
      - Positive blood cultures (typical organism in 2 separate cultures - viridans strep, S. bovis, HACEK, S. aureus, enterococcus; OR persistently positive blood cultures ≥12 hours apart; OR single positive for Coxiella burnetii)
      - Evidence of endocardial involvement on echo - Vegetation, abscess, new prosthetic valve dehiscence, new valvular regurgitation
      - Minor criteria
      - Predisposing condition - Previous IE, IVDU, structural heart disease (bicuspid aortic valve, mitral valve prolapse, prosthetic valve, prior rheumatic fever)
      - Fever ≥38°C (100.4°F)
      - Vascular phenomena - Septic emboli (stroke, splenic/renal infarcts), mycotic aneurysm, conjunctival hemorrhage, Janeway lesions (painless hemorrhagic macules on palms/soles)
      - Immunologic phenomena - Osler nodes (painful nodules on finger/toe pads), Roth spots (retinal hemorrhages with pale center), glomerulonephritis (immune complex)
      - Positive blood culture not meeting major criteria
      - Clinical presentation - Fever (90%), new or changing murmur (85%), heart failure, septic emboli (stroke, splenic infarct, renal infarct), back pain (vertebral osteomyelitis)
      - Risk factors - IVDU (right-sided IE, tricuspid valve), prosthetic valve, prior IE, structural heart disease, poor dentition, recent dental/GI/GU procedure, central line, hemodialysis
      - Organisms - Native valve
      - Viridans streptococci (40-50%) - Oral flora, after dental procedures
      - Staphylococcus aureus (30-40%) - IVDU, central lines, aggressive course
      - Enterococcus (10%) - GI/GU source, older men
      - HACEK (rare <5%) - Haemophilus, Aggregatibacter, Cardiobacterium, Eikenella, Kingella - fastidious gram-negative
      - Culture-negative (5-10%) - Prior antibiotics, fastidious organisms (Bartonella, Brucella, Coxiella burnetii - Q fever, fungal)
      - Blood cultures - 3 sets from different sites before antibiotics (90% positive in first 2, 98% by third)
      - Space 1 hour apart if stable, can take immediately if septic
      - Hold for 5-7 days if HACEK suspected
      - Echocardiography
      - Transthoracic echo (TTE) - First-line, sensitivity 60-70% for vegetations
      - Transesophageal echo (TEE) - Sensitivity 95%, REQUIRED if TTE negative with high suspicion, prosthetic valve, or complications (abscess)
      - Vegetation - Mobile, echogenic mass attached to valve, irregular borders
      - Labs - CBC (leukocytosis, anemia of chronic disease), ESR/CRP (elevated), Cr (renal infarcts, immune complex GN), UA (hematuria, RBC casts), RF positive (false positive from immune complexes)
      - Other imaging - CT chest/abdomen/pelvis if embolic phenomena suspected, MRI brain if neurologic symptoms (stroke, mycotic aneurysm)
    treatment:
      - Empiric antibiotics - Start immediately if septic (do NOT wait for cultures in unstable patient)
      - Native valve - Vancomycin 15-20 mg/kg IV q12h (target trough 15-20) + ceftriaxone 2g IV q24h (covers strep, staph, enterococcus)
      - Prosthetic valve - Vancomycin + ceftriaxone + gentamicin 1 mg/kg IV q8h (broader coverage)
      - IVDU - Vancomycin + ceftriaxone (covers MRSA, which is common in IVDU)
      - Definitive antibiotics (based on organism and sensitivities) - 4-6 weeks IV
      - Viridans strep or S. bovis (penicillin-susceptible MIC ≤0.12)
      - Penicillin G 12-18 million units IV continuous or divided q4h x 4 weeks OR ceftriaxone 2g IV q24h x 4 weeks
      - Shorter course (2 weeks) - Add gentamicin 3 mg/kg q24h (synergy)
      - Penicillin-allergic - Vancomycin 15 mg/kg IV q12h x 4 weeks
      - Staphylococcus aureus (MSSA)
      - Nafcillin or oxacillin 2g IV q4h x 6 weeks (native valve, 4-6 weeks if right-sided/IVDU)
      - Add gentamicin x 3-5 days (synergy, faster clearance)
      - Staphylococcus aureus (MRSA) - Vancomycin 15 mg/kg IV q12h x 6 weeks OR daptomycin 8-10 mg/kg IV q24h (preferred by some, bactericidal)
      - Enterococcus - Ampicillin 2g IV q4h + gentamicin 1 mg/kg IV q8h x 4-6 weeks (synergy required for bactericidal effect)
      - If VRE - Daptomycin 10-12 mg/kg IV q24h or linezolid 600mg IV/PO q12h
      - HACEK - Ceftriaxone 2g IV q24h x 4 weeks
      - Culture-negative - Continue empiric vancomycin + ceftriaxone x 6 weeks, consider Bartonella (doxycycline), Q fever (doxycycline + hydroxychloroquine)
      - Supportive care - Treat heart failure (diuretics, afterload reduction), monitor for complications
      - Surgical indications (30-50% require surgery)
      - Heart failure from acute valvular regurgitation (most common indication, URGENT surgery)
      - Uncontrolled infection - Persistent bacteremia/fever >5-7 days despite appropriate antibiotics, perivalvular abscess, fistula
      - Embolic prevention - Large mobile vegetation >10mm (especially if S. aureus or fungal, prior embolic event)
      - Prosthetic valve dysfunction
      - Fungal endocarditis (medical therapy alone rarely curative)
      - Timing - URGENT (within 24-48hr) if cardiogenic shock, EARLY (within 7 days) if severe AR/MR with HF or abscess
      - Follow-up - Repeat blood cultures after 48-72hr of antibiotics (should be negative), monitor inflammatory markers, repeat TEE at end of treatment, dental prophylaxis for future procedures

  - id: ie_complications
    type: diagnosis
    name: "Infective Endocarditis - Complications"
    icd10: "I33.0"
    urgency: critical
    workup:
      - Cardiac complications (most common cause of death)
      - Acute valvular regurgitation - Aortic or mitral, causes acute heart failure (dyspnea, pulmonary edema, shock)
      - Perivalvular abscess - Especially aortic valve, S. aureus, or prosthetic valve
      - Fever despite antibiotics, new conduction abnormalities (heart block), PR prolongation
      - TEE shows perivalvular thickening, cavity, fistula
      - Requires surgery + prolonged antibiotics (6-8 weeks)
      - Heart failure - From acute regurgitation, leading cause of death
      - Mycotic aneurysm - Infected emboli seed arterial wall, aneurysm formation, risk rupture (intracranial most dangerous)
      - Extracardiac complications
      - Septic emboli (20-50%) - Left-sided IE → systemic emboli (brain, spleen, kidney, extremities); Right-sided IE → pulmonary emboli (cavitary lung lesions in IVDU)
      - Stroke (15-20%) - Ischemic (emboli) or hemorrhagic (mycotic aneurysm rupture)
      - Splenic abscess or infarct - Left upper quadrant pain, splenic rupture rare but life-threatening
      - Renal complications - Septic emboli (infarcts), immune complex GN, abscess
      - Vertebral osteomyelitis - Back pain, epidural abscess (neurologic emergency if cord compression)
      - Neurologic - Stroke, intracranial hemorrhage (mycotic aneurysm rupture), brain abscess, meningitis, toxic encephalopathy
    treatment:
      - Acute heart failure from valvular regurgitation - URGENT cardiac surgery (valve replacement)
      - Diuretics, afterload reduction temporizing (nitroprusside, ACE inhibitors), avoid beta-blockers initially (may worsen acute regurgitation)
      - Inotropes if cardiogenic shock (dobutamine)
      - Surgery - Valve replacement, cannot wait weeks for antibiotics to complete
      - Perivalvular abscess - Surgery (debride abscess, reconstruct) + prolonged antibiotics 6-8 weeks
      - Stroke - If hemorrhagic, delay surgery if possible (4 weeks ideal, but may need earlier if HF), anticoagulation contraindicated
      - If ischemic stroke, can proceed with surgery after few days if no hemorrhagic conversion on imaging
      - Mycotic aneurysm - Antibiotics, monitor with serial imaging (CT angiography), consider endovascular or surgical repair if enlarging or high rupture risk
      - If intracranial, neurosurgery consult URGENT
      - Splenic abscess - Antibiotics, may need splenectomy or percutaneous drainage if large or not responding
      - Vertebral osteomyelitis/epidural abscess - MRI spine, neurosurgery consult if cord compression (emergency decompression), prolonged antibiotics 6-8 weeks

  - id: prosthetic_valve_endocarditis
    type: diagnosis
    name: "Prosthetic Valve Endocarditis (PVE)"
    icd10: "T82.6"
    urgency: critical
    workup:
      - Higher mortality than native valve (40% vs 20%), more complications (abscess, dehiscence)
      - Early PVE (<1 year post-op, especially <2 months) - Nosocomial organisms
      - Coagulase-negative staph (most common - epidermidis), S. aureus, gram-negatives, fungal (Candida, Aspergillus)
      - Often from surgical site contamination or central lines
      - Late PVE (>1 year post-op) - Similar to native valve (viridans strep, S. aureus, enterococcus)
      - Diagnosis - Duke criteria apply, but TEE MANDATORY (TTE inadequate, prosthetic valve obscures view)
      - Look for vegetations, abscess, dehiscence (rocking motion, perivalvular leak)
      - Blood cultures - 3 sets, hold 5-7 days if culture-negative suspected
    treatment:
      - Empiric antibiotics - Vancomycin + gentamicin + rifampin (rifampin has biofilm penetration)
      - Definitive therapy - Based on organism, but generally more aggressive and longer (6 weeks minimum)
      - Coagulase-negative staph - Vancomycin 15 mg/kg q12h + rifampin 300mg PO q8h + gentamicin 1 mg/kg q8h (first 2 weeks) x 6 weeks
      - S. aureus (MRSA) - Vancomycin + rifampin x 6 weeks + gentamicin x 2 weeks
      - Streptococcus - Penicillin or ceftriaxone + gentamicin x 6 weeks
      - Fungal - Amphotericin B + surgery (medical therapy alone fails)
      - Surgery - More often required than native valve (50-80%)
      - Indications - Heart failure, abscess, persistent infection, fungal, large vegetation, prosthetic valve dehiscence
      - Explant infected prosthetic, debride, replace with new prosthetic or homograft
