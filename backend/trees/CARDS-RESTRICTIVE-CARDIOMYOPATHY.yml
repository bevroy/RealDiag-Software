tree_id: CARDS-RESTRICTIVE-CARDIOMYOPATHY
name: Restrictive Cardiomyopathy
family: Cardiology
specialty: Cardiology
chief_complaint: Shortness of breath and swelling with preserved heart pump function
description: Impaired ventricular filling from stiff myocardium causing diastolic heart failure with preserved EF, normal or small LV cavity. Infiltrative diseases most common (amyloid, sarcoid, hemochromatosis). Difficult to distinguish from constrictive pericarditis. Poor prognosis, limited treatment options.
icd10: I42.5
urgency: urgent

workup:
  - Symptoms: right and left heart failure with preserved systolic function
  - Dyspnea: exertional dyspnea, orthopnea, PND
  - Fatigue: low cardiac output from impaired filling
  - Peripheral edema: elevated filling pressures
  - Ascites: often out of proportion to dyspnea (right heart failure predominant)
  - Exercise intolerance: limited cardiac output reserve
  - Physical exam:
  - Elevated JVP: prominent x and y descents (steep dips)
  - Kussmaul sign: JVP rises with inspiration (may be present)
  - S3 or S4 gallop
  - Hepatomegaly, ascites, peripheral edema
  - Hypotension: low cardiac output
  - Macroglossia: if amyloidosis (enlarged tongue)
  - Periorbital purpura: if amyloidosis (raccoon eyes)
  - Distinguishing from constrictive pericarditis (challenging - both cause diastolic dysfunction):
  - Restrictive: normal pericardium, infiltrated myocardium, no septal bounce
  - Constriction: thickened pericardium, normal myocardium, septal bounce, ventricular discordance
  - Causes:
  - Infiltrative (most common):
  - Amyloidosis: AL (primary) or ATTR (transthyretin), most common cause of restrictive CM
  - Sarcoidosis: granulomatous infiltration, heart block common
  - Hemochromatosis: iron deposition, reversible with treatment
  - Storage diseases: Gaucher, Fabry
  - Endomyocardial fibrosis: eosinophilic, hypereosinophilic syndrome, Loeffler endocarditis
  - Post-radiation: mediastinal radiation
  - Idiopathic: rare
  - Echocardiogram:
  - Normal or small LV cavity size (vs dilated in DCM)
  - Preserved or mildly reduced systolic function (EF usually over 50%)
  - Severe diastolic dysfunction: restrictive filling pattern (short deceleration time, E/A ratio over 2)
  - Biatrial enlargement: both atria dilated from elevated filling pressures
  - Increased wall thickness: if infiltrative (amyloid, sarcoid)
  - Granular sparkling appearance: if amyloidosis (classic finding)
  - No septal bounce: distinguishes from constriction
  - Cardiac catheterization:
  - Equalization of diastolic pressures (similar to constriction)
  - Dip and plateau: rapid early filling then abrupt halt (square root sign)
  - No ventricular discordance: RV and LV pressures move together with respiration (vs constriction)
  - LVEDP over 5 mmHg higher than RVEDP favors restriction (vs equal in constriction)
  - ECG: low voltage (infiltrative diseases), conduction abnormalities (heart block in sarcoid or amyloid), pseudoinfarct pattern (Q waves without MI in amyloid)
  - Cardiac MRI: normal pericardium, myocardial infiltration, late gadolinium enhancement pattern (global subendocardial in amyloid)
  - Endomyocardial biopsy: gold standard for diagnosis, shows infiltrative process (amyloid deposits, granulomas, iron, eosinophils)
  - Specific workup based on suspected cause:
  - Amyloidosis: serum and urine protein electrophoresis, free light chains, fat pad biopsy, bone scan (technetium pyrophosphate for ATTR)
  - Sarcoidosis: PET scan, serum ACE level, endomyocardial biopsy
  - Hemochromatosis: ferritin, iron saturation, genetic testing
  - Labs: BNP very elevated (often over 1000), troponin mildly elevated in amyloid

treatment:
  - Limited effective treatments (poor prognosis):
  - Diuretics (symptom relief): furosemide for volume overload
  - Cautious diuresis (avoid overdiuresis - filling-dependent cardiac output)
  - High doses often needed
  - Avoid vasodilators and ACE inhibitors: poorly tolerated (hypotension)
  - Beta blockers and calcium channel blockers: poorly tolerated (impair compensatory tachycardia)
  - Digoxin: avoid in amyloidosis (binds to amyloid fibrils, increases toxicity)
  - Anticoagulation: if atrial fibrillation (common)
  - Rate control in AFib challenging (limited tolerance of rate-controlling drugs)
  - Treat underlying disease (if possible):
  - AL amyloidosis: chemotherapy (melphalan, bortezomib, daratumumab), autologous stem cell transplant
  - ATTR amyloidosis: tafamidis (stabilizes transthyretin, slows progression), liver transplant for hereditary
  - Sarcoidosis: corticosteroids plus immunosuppression (methotrexate, azathioprine)
  - Hemochromatosis: phlebotomy, iron chelation (potentially reversible)
  - Eosinophilic: corticosteroids
  - Pacemaker: if heart block (common in sarcoid and amyloid)
  - ICD: if ventricular arrhythmias or high risk
  - Heart transplantation: definitive treatment for end-stage restrictive CM
  - Amyloidosis: AL requires chemotherapy before transplant, ATTR may recur in transplant
  - Prognosis: poor, median survival 2-5 years depending on cause
  - AL amyloidosis: worst prognosis, median survival 6 months to 2 years without treatment
  - ATTR amyloidosis: median survival 3-5 years
  - Sarcoidosis: variable, may improve with immunosuppression

clinical_pearls:
  - Diastolic heart failure with preserved EF, normal or small LV cavity, biatrial enlargement
  - Infiltrative diseases most common cause (amyloid, sarcoid, hemochromatosis)
  - Distinguish from constrictive pericarditis (both have diastolic dysfunction and equalized pressures)
  - Low voltage ECG with increased wall thickness on echo suggests infiltrative disease
  - Amyloid: granular sparkling echo, pseudoinfarct pattern ECG, periorbital purpura
  - Cardiac MRI and biopsy help distinguish from constriction
  - Limited treatment options, poor prognosis
  - Heart transplant definitive therapy if eligible

differentials:
  - Constrictive pericarditis: thickened pericardium, septal bounce, ventricular discordance, no infiltration
  - Hypertrophic cardiomyopathy: asymmetric hypertrophy, hyperdynamic systolic function, LVOT obstruction
  - Hypertensive heart disease: concentric hypertrophy from hypertension, diastolic dysfunction
  - Heart failure with preserved EF (HFpEF): similar symptoms but less severe diastolic dysfunction

trace: |
  A 68-year-old man presented with 6 months of progressive dyspnea and lower extremity edema. Shortness of breath with minimal exertion, orthopnea, significant fatigue. Marked peripheral edema despite diuretics. History of carpal tunnel syndrome both hands x2 years (red flag for amyloidosis). Exam: BP 90/60 (low), HR 95, elevated JVP 18 cm, S3 gallop, hepatomegaly, massive ascites, 3+ pitting edema to thighs, periorbital purpura (raccoon eyes - classic for amyloidosis), macroglossia (enlarged tongue). ECG: low voltage QRS in limb leads (below 5 mm total in all limb leads), pseudoinfarct pattern with Q waves in V1-V3 without history of MI (classic amyloid pattern). BNP 2400 (very elevated), troponin 0.08 (mildly elevated). Echocardiogram: normal LV cavity size (not dilated), preserved systolic function EF 55%, increased LV wall thickness 16 mm (infiltrative), granular sparkling appearance of myocardium (classic for amyloid), severe diastolic dysfunction with restrictive filling pattern (E/A ratio 3.5, deceleration time 110 ms very short), biatrial enlargement (LA 5.5 cm, RA 5.2 cm), moderate pericardial effusion, normal pericardial thickness. Diagnosed with restrictive cardiomyopathy, high suspicion for cardiac amyloidosis (low voltage ECG with increased wall thickness paradox, granular sparkling echo, periorbital purpura, macroglossia, bilateral carpal tunnel). Workup for amyloidosis: serum protein electrophoresis showed monoclonal spike, serum free light chains kappa elevated (kappa/lambda ratio 15 abnormal), urine protein electrophoresis positive for monoclonal protein. Bone marrow biopsy: 15% plasma cells (increased). Fat pad biopsy: Congo red stain positive for amyloid deposits with apple-green birefringence under polarized light. Confirmed AL (primary) amyloidosis with cardiac involvement. Cardiac MRI: increased wall thickness, global subendocardial late gadolinium enhancement (classic pattern for amyloid), normal pericardium (ruled out constrictive pericarditis). Right heart catheterization: elevated filling pressures, RVEDP 18 mmHg, LVEDP 24 mmHg (LVEDP 6 mmHg higher than RVEDP favors restriction over constriction), dip and plateau pattern, no ventricular discordance (favors restriction). Diagnosed with AL cardiac amyloidosis causing restrictive cardiomyopathy (poor prognosis, median survival 6 months without treatment). Started furosemide 80 mg BID for volume overload (high doses needed, cautious diuresis). Referred to hematology-oncology: started chemotherapy with bortezomib, cyclophosphamide, dexamethasone (VCD regimen) targeting plasma cell clone producing amyloid light chains. Discussed autologous stem cell transplant if responds to chemotherapy. At 3 months: free light chains decreased 70% (hematologic response), heart failure symptoms improved 40%, continues diuretics and chemotherapy. At 6 months: underwent autologous stem cell transplant. At 12 months: complete hematologic response (no monoclonal protein), cardiac biomarkers improved (BNP 800, troponin normal), echo: wall thickness decreased slightly to 14 mm, EF stable 55%, diastolic function remains impaired. Functional status improved NYHA class IV to II. Survival prolonged with treatment but cardiac amyloidosis still carries poor long-term prognosis. Annual monitoring with echo, biomarkers, free light chains.
