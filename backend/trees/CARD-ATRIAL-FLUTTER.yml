tree_id: CARD-ATRIAL-FLUTTER
name: Atrial Flutter
family: Cardiac
specialty: Cardiology
chief_complaint: Palpitations and dyspnea
description: Regular atrial tachycardia typically 250-350 bpm with sawtooth flutter waves on ECG, commonly 2:1 AV conduction resulting in ventricular rate 150 bpm

icd10: I48.92

urgency: urgent

workup:
  - Clinical presentation: palpitations (often sudden onset), dyspnea, lightheadedness, chest discomfort, fatigue, may be asymptomatic if rate-controlled
  - Hemodynamic stability: stable (most common) vs unstable (hypotension, angina, acute heart failure, altered mental status) - determines treatment approach
  - Risk factors: similar to atrial fibrillation (hypertension, heart failure, valvular disease, CAD, hyperthyroidism, COPD, sleep apnea, obesity, alcohol)
  - ECG diagnostic: regular narrow-complex tachycardia typically 130-160 bpm, sawtooth flutter waves best seen in inferior leads (II, III, aVF) and V1, atrial rate 250-350 bpm, most commonly 2:1 AV conduction (ventricular rate 150 bpm), negative flutter waves in inferior leads (typical counterclockwise flutter)
  - Distinguish from other SVTs: atrial flutter has characteristic sawtooth pattern, no isoelectric baseline between P waves (unlike sinus tach or AVNRT)
  - Types: typical (counterclockwise around tricuspid annulus, flutter waves negative in inferior leads) vs atypical (other circuits)
  - Evaluate underlying cause: TSH (hyperthyroidism), echocardiogram (structural heart disease, valvular disease, LV function), sleep study if obesity or snoring (sleep apnea)
  - Labs: CBC, CMP, TSH, troponin if chest pain
  - Thromboembolic risk: same as atrial fibrillation (use CHA2DS2-VASc score), requires anticoagulation if duration greater than 48 hours or unknown duration

