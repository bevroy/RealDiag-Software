treatment:
  - Hemodynamically unstable: immediate synchronized cardioversion starting at 50-100 J (higher success rate than atrial fibrillation)
  - Hemodynamically stable acute management: rate control vs rhythm control
  - Rate control: beta-blocker (metoprolol 5 mg IV bolus, repeat every 5 minutes up to 3 doses, then oral metoprolol 25-100 mg BID) or non-dihydropyridine calcium channel blocker (diltiazem 0.25 mg/kg IV bolus over 2 minutes, then 5-15 mg/hr infusion), goal heart rate less than 110 bpm
  - Caution AV nodal blockers: can paradoxically increase ventricular rate if 2:1 block converts to 1:1 conduction (atrial rate 300 bpm leads to ventricular rate 300 bpm - dangerous)
  - Rhythm control (cardioversion): if symptoms persist despite rate control or patient prefers rhythm control, requires anticoagulation same as atrial fibrillation
  - Cardioversion approach: if duration less than 48 hours can cardiovert immediately, if duration greater than 48 hours or unknown need either 3 weeks anticoagulation before cardioversion OR TEE to rule out thrombus then immediate cardioversion with anticoagulation after
  - Electrical cardioversion: synchronized DC cardioversion 50-100 J (more effective than chemical for flutter)
  - Chemical cardioversion: ibutilide 1 mg IV over 10 minutes (60 percent effective for atrial flutter, requires continuous ECG monitoring for QT prolongation and torsades risk), dofetilide (requires hospital admission for QT monitoring)
  - Anticoagulation: same guidelines as atrial fibrillation, CHA2DS2-VASc score greater than or equal to 2 in men or greater than or equal to 3 in women requires oral anticoagulation (DOAC preferred over warfarin)
  - Long-term management: catheter ablation HIGHLY effective for typical atrial flutter (success rate greater than 90 percent, cure), first-line for recurrent typical flutter, ablate cavotricuspid isthmus
  - Antiarrhythmic drugs: less effective than ablation, options include dofetilide, sotalol, amiodarone (similar to atrial fibrillation management)
  - Treat underlying conditions: heart failure optimization, hypertension control, weight loss, sleep apnea treatment, avoid alcohol

clinical_pearls:
  - Regular narrow-complex tachycardia at 150 bpm think atrial flutter with 2:1 conduction
  - Sawtooth flutter waves in inferior leads (II, III, aVF) diagnostic
  - Atrial rate typically 250-350 bpm with 2:1 conduction gives ventricular rate 130-175 bpm
  - Synchronized cardioversion highly effective (50-100 J)
  - Catheter ablation cure rate greater than 90 percent for typical flutter (first-line for recurrent)
  - Same thromboembolic risk as atrial fibrillation (use CHA2DS2-VASc score for anticoagulation)
  - Caution with AV nodal blockers (can increase ventricular rate if 2:1 converts to 1:1)

differentials:
  - Atrial fibrillation (irregularly irregular rhythm, no organized P waves, more common)
  - AVNRT (paroxysmal SVT, sudden onset/offset, no flutter waves, terminates with adenosine)
  - Atrial tachycardia (organized P waves but different morphology, not sawtooth)
  - Sinus tachycardia (regular but P waves upright in II, isoelectric baseline)

trace:
  - 62-year-old man presents to ED with 4 hours palpitations (sudden onset), mild dyspnea, lightheadedness with standing
  - History: hypertension, obesity (BMI 34), occasional alcohol use
  - Exam: alert, mildly anxious, BP 128/82, HR 145 regular, RR 18, SpO2 97 percent room air, JVP normal, lungs clear, cardiac regular rapid rate no murmur, no edema
  - ECG: regular narrow-complex tachycardia at 150 bpm, sawtooth flutter waves best seen in leads II, III, aVF (negative deflections), V1 shows positive flutter waves, atrial rate approximately 300 bpm with 2:1 AV conduction
  - Diagnosis: typical atrial flutter with 2:1 AV conduction (ventricular rate 150 bpm)
  - Hemodynamically stable (normal BP, no chest pain, no acute heart failure)
  - Labs: troponin negative, TSH 2.1 mIU/L (normal), CMP normal
  - Duration: 4 hours (known duration less than 48 hours)
  - Admitted for rate control and cardioversion
  - Attempted vagal maneuvers (carotid massage) - no effect
  - Given metoprolol 5 mg IV x 2 doses (heart rate decreased to 110 bpm but remains in flutter)
  - Symptoms persist despite rate control (patient still feels palpitations)
  - Decision: cardioversion (duration less than 48 hours, can cardiovert without prolonged anticoagulation)
  - Synchronized cardioversion performed: 50 J successful, converted to normal sinus rhythm (rate 72 bpm)
  - Post-cardioversion ECG: normal sinus rhythm, no flutter waves
  - CHA2DS2-VASc score: 2 (hypertension 1, age 1) - requires anticoagulation
  - Started apixaban 5 mg twice daily (DOAC for stroke prevention)
  - Continued metoprolol 50 mg twice daily for rate control if recurs
  - Echocardiogram: normal LV function (EF 60 percent), mild left atrial enlargement, no valvular disease
  - Discharge day 2 in normal sinus rhythm
  - Counseling: atrial flutter often recurs, catheter ablation highly effective cure (greater than 90 percent success)
  - Follow-up 1 week: remains in normal sinus rhythm, tolerating apixaban and metoprolol well
  - 1 month: recurrent flutter episode (palpitations, HR 150 bpm, same sawtooth pattern on ECG)
  - Referred to electrophysiology for catheter ablation
  - Catheter ablation performed: cavotricuspid isthmus ablation for typical atrial flutter, procedure successful, bidirectional block confirmed
  - 6 months post-ablation: no recurrent flutter, apixaban continued (CHA2DS2-VASc 2), excellent quality of life
