tree_id: OBGYN-CERVICITIS
name: Cervicitis
family: obstetrics_gynecology
specialty: Gynecology/Primary Care/Infectious Disease
applies_to: female
icd10: N72
snomed: 37610005
urgency: []
homeopathy: []
presentations:
  - Abnormal vaginal discharge (mucopurulent, yellow or green)
  - Postcoital bleeding (bleeding after intercourse)
  - Intermenstrual bleeding (bleeding between periods)
  - Pelvic pain or discomfort
  - Dysuria (painful urination)
  - Dyspareunia (painful intercourse)
  - May be asymptomatic (detected on routine pelvic exam or Pap smear)
  - New sexual partner or multiple partners
  - History of sexually transmitted infection
workup:
  - Sexual history
  - Number of sexual partners, new partners
  - Condom use
  - Previous STI history
  - Partner symptoms or STI diagnosis
  - Date of last sexual encounter
  - Symptoms history
  - Onset and duration of discharge, bleeding, pain
  - Characteristics of discharge (color, odor, amount)
  - Associated symptoms (fever, abdominal pain)
  - Physical examination
  - Vital signs (fever suggests upper genital tract infection - PID)
  - Abdominal examination (tenderness, guarding)
  - External genitalia inspection
  - Speculum examination
  - Visualize cervix
  - Mucopurulent discharge from cervical os
  - Cervical friability (easily induced bleeding with gentle touch)
  - Cervical erythema and edema
  - Bimanual examination
  - Cervical motion tenderness
  - Uterine or adnexal tenderness (suggests PID)
  - Laboratory evaluation
  - Nucleic acid amplification testing (NAAT) - GOLD STANDARD
  - Chlamydia trachomatis
  - Neisseria gonorrhoeae
  - Can test cervical swab, vaginal swab, or urine (urine less sensitive for women)
  - Vaginal swab preferred for self-collection
  - Wet mount microscopy (if discharge present)
  - Saline wet prep: clue cells (bacterial vaginosis), motile trichomonads
  - KOH prep: pseudohyphae and budding yeast (candidiasis)
  - Whiff test: fishy odor with KOH (bacterial vaginosis)
  - Vaginal pH
  - "Normal: 4.0-4.5"
  - "Greater than 4.5: bacterial vaginosis or trichomoniasis"
  - Additional testing
  - HIV screening (all patients with STI)
  - Syphilis screening (RPR or VDRL)
  - Hepatitis B and C screening (if risk factors)
  - Pregnancy test if indicated
  - Urinalysis if dysuria present (rule out UTI)
  - Pap smear if due for cervical cancer screening
treatment:
  - Empiric treatment for chlamydia and gonorrhea (do NOT wait for test results)
  - Indications for empiric therapy
  - Mucopurulent cervical discharge
  - Cervical friability
  - STI exposure or high-risk sexual behavior
  - Patient unlikely to return for follow-up
  - Recommended regimens (2021 CDC STI Treatment Guidelines)
  - For chlamydia
  - Doxycycline 100 mg PO twice daily for 7 days (FIRST-LINE)
  - Alternative: azithromycin 1 g PO single dose (if compliance concern, but resistance increasing)
  - For gonorrhea
  - Ceftriaxone 500 mg IM single dose (1 g if weight greater than 150 kg)
  - If ceftriaxone not available: cefixime 800 mg PO single dose
  - Dual therapy no longer required if treating with ceftriaxone alone
  - For both chlamydia AND gonorrhea (empiric treatment)
  - Ceftriaxone 500 mg IM single dose PLUS doxycycline 100 mg PO BID for 7 days
  - Trichomoniasis (if trichomonads seen on wet mount)
  - Metronidazole 500 mg PO twice daily for 7 days (PREFERRED)
  - Alternative: tinidazole 2 g PO single dose or metronidazole 2 g PO single dose
  - Avoid alcohol during treatment and 24 hours after metronidazole (72 hours after tinidazole)
  - Herpes simplex virus (if herpetic lesions on cervix)
  - Acyclovir 400 mg PO TID for 7-10 days (primary episode)
  - Valacyclovir 1 g PO BID for 7-10 days (primary episode)
  - Shorter course for recurrent episodes
  - Partner management
  - Expedited partner therapy (EPT) - provide prescription or medication for partner(s)
  - Treat all sexual partners from past 60 days
  - Abstain from sexual intercourse for 7 days after single-dose therapy or until completion of 7-day regimen
  - Advise partners to be tested for HIV, syphilis, hepatitis
  - Follow-up
  - Test of cure NOT routinely recommended for chlamydia or gonorrhea if treated with first-line regimens
  - Test of cure at 3 weeks if
  - Pregnant
  - Symptoms persist
  - Alternative regimen used
  - Reinfection screening at 3 months (high reinfection rates)
  - Repeat testing for chlamydia and gonorrhea
  - Prevention counseling
  - Condom use for all sexual encounters
  - Reduce number of sexual partners
  - Abstinence or mutual monogamy
  - Annual STI screening for sexually active women under age 25
  - HPV vaccination if not previously vaccinated (Gardasil 9)
clinical_pearls:
  - 'Cervicitis most commonly caused by Chlamydia trachomatis (40%) and Neisseria gonorrhoeae (30-40%)'
  - 'Empiric treatment for both chlamydia and gonorrhea recommended - do not wait for test results'
  - 'Doxycycline 100 mg BID for 7 days now preferred over azithromycin 1 g for chlamydia (rising azithromycin resistance)'
  - 'Ceftriaxone 500 mg IM alone sufficient for gonorrhea - dual therapy no longer required per 2021 CDC guidelines'
  - 'Cervical friability (easily induced bleeding) highly specific for cervicitis - warrants testing and treatment'
  - 'Expedited partner therapy (EPT) reduces reinfection rates - provide medication for partner(s) without examination'
  - 'Reinfection rates high (20% within 3 months) - rescreen at 3 months after treatment'
  - 'Untreated cervicitis can ascend to pelvic inflammatory disease (PID) causing infertility and chronic pelvic pain'
referrals:
  - Gynecology if cervicitis refractory to treatment or recurrent infections
  - Infectious disease for complicated STI, HIV coinfection, or treatment failure
  - PID requiring hospitalization (if fever, severe pain, tubo-ovarian abscess)
  - Sexual health clinic for comprehensive STI screening and partner services
differentials:
  - Chlamydial cervicitis (mucopurulent discharge, friability, positive NAAT)
  - Gonococcal cervicitis (mucopurulent discharge, friability, positive NAAT)
  - Trichomoniasis (yellow-green frothy discharge, strawberry cervix, motile trichomonads on wet mount)
  - Herpes simplex virus cervicitis (vesicles or ulcers on cervix, severe pain)
  - Bacterial vaginosis (thin gray discharge, fishy odor, clue cells - but does NOT cause cervicitis)
  - Candidiasis (thick white discharge, pruritus, pseudohyphae - does NOT cause cervicitis)
  - Mycoplasma genitalium (emerging pathogen, can cause persistent urethritis/cervicitis)
  - Pelvic inflammatory disease (cervicitis with upper genital tract involvement - fever, adnexal tenderness)
  - Cervical ectropion (physiologic - columnar epithelium on ectocervix, can cause discharge and bleeding)
trace:
  source: CDC STI Treatment Guidelines 2021, ACOG Practice Bulletins, UpToDate
  version: '1.0'
  last_updated: '2025-12-27'

