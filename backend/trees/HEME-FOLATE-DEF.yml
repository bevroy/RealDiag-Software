tree_id: HEME-FOLATE-DEF
name: Folate Deficiency Anemia
family: Hematology Oncology
specialty: Hematology Oncology
icd10:
- D52.9
snomed:
- 41841004
urgency: medium
description: Comprehensive evaluation and management of Folate Deficiency Anemia
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Macrocytic anemia (MCV > 100)
- Fatigue, weakness
- No neurologic symptoms (unlike B12 deficiency)
- Low folate level
- Normal methylmalonic acid
workup:
- 'CBC: Macrocytic anemia (MCV >100), hypersegmented neutrophils'
- Serum folate <3 ng/mL (low sensitivity - changes rapidly with diet)
- RBC folate <150 ng/mL (better reflects body stores)
- Elevated homocysteine (like B12 deficiency), normal methylmalonic acid (unlike B12
  deficiency)
treatment:
- 'Guideline-based treatment options for Folate Deficiency Anemia include:'
- Folic acid 1mg PO daily × 1-4 months (until stores repleted) (ASH 2023)
- Higher doses (5mg daily) if malabsorption or drug-induced (methotrexate) (ASH 2023)
- 'IMPORTANT: Rule out B12 deficiency first - giving folate alone can worsen B12 neurologic
  symptoms (ASH 2023)'
- 'Pregnancy: 400-800 mcg daily preconception through first trimester (prevents neural
  tube defects) (ASH 2023)'
- 'Alcoholics: Thiamine + folate + multivitamin (often multiple deficiencies) (ASH
  2023)'
clinical_pearls:
- NO neurologic symptoms (key difference from B12 deficiency) - folate doesn't affect
  myelin
- 'Causes: Malnutrition (alcoholics, elderly), malabsorption (celiac, Crohn''s), medications
  (methotrexate, phenytoin, TMP-SMX)'
- Pregnancy increases folate requirements 5-10x - neural tube defects if deficient
  in first trimester
- Homocysteine elevated in folate deficiency (like B12) but methylmalonic acid is
  NORMAL (differentiates)
- Rare in US due to folate fortification of grains since 1998
referrals:
- Hematology if unclear cause, refractory to treatment, or other cytopenias
- Gastroenterology if malabsorption suspected (celiac, Crohn's)
differentials:
  - B12 deficiency
  - Malnutrition
  - Alcohol abuse
  - Malabsorption
  - Medication effect
trace:
  source: National Comprehensive Cancer Network (NCCN) Guidelines, American Society
    of Hematology (ASH) Guidelines
  version: 0.1.0
