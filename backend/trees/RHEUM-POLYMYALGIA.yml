tree_id: RHEUM-POLYMYALGIA
name: Polymyalgia Rheumatica
family: Rheumatology
specialty: Rheumatology
icd10:
- M35.3
snomed:
- '399130002'
urgency: medium
description: Comprehensive evaluation and management of Polymyalgia Rheumatica
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Bilateral shoulder and hip girdle pain (symmetric, proximal muscles)
- Morning stiffness >1 hour, worse in morning
- Age >50 years (average age 70, rare <50)
- Difficulty rising from chair, getting out of bed, raising arms overhead
- Constitutional symptoms - fatigue, malaise, low-grade fever, weight loss
- Elevated ESR (typically >40 mm/hr, often >50) and CRP
- Dramatic response to low-dose prednisone (15-20mg) within 24-48 hours
- 'No muscle weakness: Can perform movements if pain relieved (vs myopathy)'
- 'Association with giant cell arteritis: 15% have GCA, screen for headache/jaw claudication/vision
  changes'
- Female predominance (2:1), northern European ancestry
- Symmetric involvement - bilateral shoulders and hips affected equally
- Normal CPK and aldolase (distinguishes from polymyositis)
workup:
- 'ESR: Typically >40 mm/hr, often >50 (sensitive but not specific)'
- 'CRP: Elevated, correlates with disease activity'
- 'CBC: Mild anemia of chronic disease, normal or elevated platelets'
- 'CPK: Normal (vs polymyositis which has elevated CPK)'
- 'Screen for GCA: Ask about new headache, jaw claudication, vision changes - if present,
  start prednisone 60mg and get temporal artery biopsy'
treatment:
- 'Guideline-based treatment options for Polymyalgia Rheumatica include:'
- 'Prednisone 15-20mg daily: Start dose, should see dramatic improvement within 48-72
  hours (ACR 2023)'
- 'Slow taper: After 2-4 weeks, taper by 2.5mg every 2-4 weeks to 10mg, then 1mg every
  4-8 weeks. Total duration 1-2 years (ACR 2023)'
- 'Monitor ESR/CRP: Check every 2-4 weeks during taper - if rising or symptoms return,
  increase prednisone back up (ACR 2023)'
- 'Steroid-sparing agents: Methotrexate 10-15mg weekly if unable to taper prednisone
  below 10mg or frequent relapses (ACR 2023)'
- 'Bone protection: Calcium 1200mg + vitamin D 800-1000 IU daily, bisphosphonate (alendronate
  70mg weekly) if long-term steroids (ACR 2023)'
clinical_pearls:
- Inflammatory condition of proximal muscles - age >50 years (average 70), female
  2:1, northern European ancestry
- Bilateral shoulder and hip girdle pain/stiffness (symmetric) - 'can't raise arms
  to comb hair, can't get out of chair'
- 'Dramatic response to prednisone: 70% improve within 24-48 hours (diagnostic feature)'
- 'Association with giant cell arteritis: 15% of PMR have GCA, 50% of GCA have PMR
  - screen for GCA symptoms (headache, jaw claudication, vision changes)'
- ESR >40 mm/hr typical (often >50) - if normal ESR, reconsider diagnosis
referrals:
- 'Rheumatology if: Atypical features (age <60, asymmetric, normal ESR), not responding
  to prednisone, difficulty tapering'
- Most PMR managed by primary care with prednisone taper over 1-2 years
differentials: []
