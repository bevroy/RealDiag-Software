tree_id: ORTHO-OSTEONECROSIS
name: Osteonecrosis (Avascular Necrosis)
family: orthopedics
specialty: Orthopedics
icd10: M87.9
snomed: 41967000
urgency: []
homeopathy: []
presentations:
  - Progressive joint pain, often insidious onset
  - Pain worse with weight-bearing
  - Hip most commonly affected (femoral head), then knee, shoulder, ankle
  - Initial pain intermittent, becomes constant as disease progresses
  - Limited range of motion of affected joint
  - May progress to secondary osteoarthritis
  - Risk factors present in 80-90% of cases
  - Corticosteroid use (most common) - risk increases with dose and duration
  - Alcohol abuse (chronic, heavy use)
  - Trauma (hip fracture, hip dislocation)
  - Other: sickle cell disease, SLE, Gaucher disease, radiation, chemotherapy, HIV, decompression sickness (caisson disease)
workup:
  - Clinical assessment
  - History of risk factors (corticosteroids, alcohol, trauma, medical conditions)
  - Joint pain pattern (mechanical, progressive)
  - Physical examination
  - Limited range of motion, especially internal rotation (hip)
  - Pain with weight-bearing and range of motion
  - Normal exam early in disease
  - Laboratory tests
  - Usually normal (not diagnostic)
  - May check CBC, CMP, ESR/CRP to rule out infection or inflammatory arthritis
  - Imaging (essential for diagnosis)
  - X-rays of affected joint(s)
  - May be normal early in disease (Stage 0-I)
  - Later stages show subchondral lucency ("crescent sign"), collapse, sclerosis, secondary OA
  - MRI - most sensitive for early detection (gold standard)
  - 90-95% sensitive for early osteonecrosis
  - Shows bone marrow edema before X-ray changes
  - Double line sign on T2-weighted images characteristic
  - Bilateral in 50-80% of cases (image contralateral joint even if asymptomatic)
  - Bone scan or CT scan alternative if MRI contraindicated
  - Staging: Ficat-Arlet classification Stage 0 (asymptomatic, normal X-ray), Stage I (symptomatic, normal X-ray), Stage II (X-ray shows sclerosis/cysts, no collapse), Stage III (subchondral collapse), Stage IV (secondary osteoarthritis)
treatment:
  - Risk factor modification
  - Minimize or discontinue corticosteroids if possible
  - Alcohol cessation
  - Optimize management of underlying condition
  - Non-operative management (early stages 0-II)
  - Limited weight-bearing (crutches) to reduce stress on affected joint
  - NSAIDs for pain control
  - Physical therapy to maintain range of motion and muscle strength
  - Bisphosphonates (alendronate) may slow progression (limited evidence)
  - Anticoagulation (enoxaparin) in very early disease (theoretical benefit)
  - Success rate poor once collapse occurs (Stage III-IV)
  - Surgical management - joint preservation procedures (Stage I-II)
  - Core decompression
  - Drill holes to decompress bone, stimulate revascularization
  - 60-80% success in pre-collapse stages (I-II)
  - Most common procedure for early AVN
  - Bone grafting (vascularized or non-vascularized fibular graft)
  - Osteotomy (rotate necrotic segment away from weight-bearing area)
  - Success depends on stage and lesion size
  - Surgical management - joint replacement (Stage III-IV with collapse)
  - Total hip arthroplasty (THA) for advanced femoral head AVN
  - Total knee or shoulder replacement for advanced disease
  - Definitive treatment for late-stage disease with collapse
  - Excellent pain relief and functional outcomes
  - Natural history without treatment
  - 80-90% progress to collapse and secondary OA within 2-5 years
  - Early diagnosis and intervention critical
clinical_pearls:
  - "Femoral head AVN most common site - 60% of all osteonecrosis cases"
  - "Corticosteroids most common risk factor - dose-dependent (greater than 20 mg/day prednisone for more than 3 months)"
  - "50-80% bilateral - always image contralateral hip even if asymptomatic"
  - "MRI most sensitive - can detect months before X-ray changes"
  - "Once femoral head collapses (Stage III), joint replacement inevitable"
  - "Core decompression most effective in early pre-collapse stages (60-80% success Stage I-II)"
  - "Natural history: 80-90% progress to collapse without treatment"
  - "High index of suspicion in anyone on chronic corticosteroids with new hip/knee pain"
referrals:
  - Orthopedic joint specialist for all confirmed or suspected osteonecrosis
  - Urgent referral for early stages (0-II) - joint preservation procedures time-sensitive
  - Rheumatology if underlying inflammatory condition (SLE, vasculitis)
differentials:
  - Osteonecrosis (AVN - risk factors, progressive pain, MRI diagnostic)
  - Hip osteoarthritis (older age, groin pain, X-ray shows joint space narrowing)
  - Femoral neck stress fracture (acute onset, severe pain, high-risk population)
  - Transient osteoporosis of hip (self-limited, resolves in 6-12 months, younger patients, pregnant women)
  - Inflammatory arthritis (RA, ankylosing spondylitis - elevated inflammatory markers)
  - Septic arthritis (fever, acute onset, joint effusion, elevated WBC)
  - Bone tumor (primary or metastatic)
  - Paget disease of bone (older age, elevated alkaline phosphatase)
