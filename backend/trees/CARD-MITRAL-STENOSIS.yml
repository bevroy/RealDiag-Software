tree_id: CARD-MITRAL-STENOSIS
name: Mitral Stenosis
family: Cardiology
specialty: Cardiology
chief_complaint: Shortness of breath, palpitations, fatigue
description: Narrowing of mitral valve orifice impairing left atrial emptying into left ventricle, most commonly due to rheumatic heart disease
icd10: I05.0
urgency: medium
workup:
  - Pathophysiology - Obstruction to flow from LA to LV
  - Normal mitral valve area 4-6 cm²
  - Mild stenosis 1.5-2.5 cm², moderate 1-1.5 cm², severe <1 cm²
  - Increased LA pressure → pulmonary venous congestion → pulmonary hypertension → RV failure
  - Etiology
  - Rheumatic heart disease (RF) - Most common cause worldwide (>90% cases), latent period 10-30 years after acute RF
  - Commissural fusion, leaflet fibrosis, chordal thickening/fusion
  - Fish mouth or buttonhole appearance on echo
  - Congenital (rare) - Parachute mitral valve, supravalvular ring
  - Other - Severe mitral annular calcification (MAC, elderly), SLE, carcinoid, amyloid (very rare)
  - Clinical presentation - Depends on severity and chronicity
  - Dyspnea on exertion (most common) - Progresses from exertional to orthopnea, PND (pulmonary congestion)
  - Fatigue - Reduced cardiac output (fixed CO, cannot increase with activity)
  - Palpitations - Atrial fibrillation (LA dilation, occurs 30-40% patients, increases stroke risk)
  - Hemoptysis - Pulmonary venous rupture (sudden), chronic hemoptysis (bronchial vein dilation)
  - Hoarseness (Ortner syndrome) - Enlarged LA compresses left recurrent laryngeal nerve
  - Embolic events - Systemic embolism if AF present (stroke, mesenteric, limb ischemia)
  - Physical exam
  - Inspection - Malar flush (mitral facies, CO2 retention from pulmonary congestion)
  - Palpation - Diastolic thrill at apex (palpable P2 if pulmonary HTN), RV heave (RV hypertrophy)
  - Auscultation
  - S1 loud and snapping (mobile leaflets, sudden tensing), diminished if calcified
  - Opening snap (OS) after A2 - High-frequency early diastolic sound (stiff valve opens suddenly)
  - S2-OS interval inversely proportional to severity (shorter interval = worse stenosis, higher LA pressure)
  - Low-pitched mid-diastolic rumble at apex (turbulent flow, best heard left lateral decubitus, bell of stethoscope)
  - Presystolic accentuation (if NSR, absent if AF due to loss of atrial contraction)
  - P2 accentuated if pulmonary HTN
  - Signs of RV failure - Elevated JVP, hepatomegaly, ascites, peripheral edema
  - Electrocardiogram
  - LA enlargement - P mitrale (broad notched P wave in lead II, biphasic P in V1 with prominent negative terminal deflection)
  - RV hypertrophy - R wave in V1, right axis deviation (if pulmonary HTN)
  - Atrial fibrillation - Common (30-40%)
  - Chest X-ray
  - LA enlargement - Straightening left heart border, double density right heart border, splaying of carina (carina angle >90°), posterior displacement of esophagus on lateral (barium swallow)
  - Pulmonary congestion - Cephalization (upper lobe vessel prominence), Kerley B lines (septal edema, horizontal lines at costophrenic angles), alveolar edema if severe
  - Calcification - Mitral valve calcification visible (best on lateral, fluoroscopy)
  - RV enlargement - If long-standing pulmonary HTN
  - Echocardiography - GOLD STANDARD for diagnosis and severity assessment
  - 2D echo - Thickened, doming ("hockey stick") anterior leaflet in diastole, reduced leaflet excursion, LA enlargement, thrombus in LA/LAA
  - Valve area - Planimetry (trace valve orifice in short-axis), pressure half-time (PHT, time for transmitral gradient to halve, PHT 220/valve area)
  - Doppler - Mean transmitral gradient (normal <5 mmHg, mild 5-10, moderate 10-15, severe >15), peak velocity increased
  - Wilkins score - Assess suitability for percutaneous balloon valvuloplasty (PBMV)
  - Grade 1-4 (leaflet mobility, thickening, calcification, subvalvular apparatus), total score 0-16
  - Score ≤8 favorable for PBMV, >8 unfavorable (consider surgery)
  - Pulmonary artery systolic pressure - Estimate from TR jet velocity
  - TEE - Detect LA/LAA thrombus (must rule out before PBMV or cardioversion), assess mitral regurgitation
  - Cardiac catheterization - Usually not needed (echo sufficient), consider if discrepancy between symptoms and echo
  - Simultaneous LA (via transseptal puncture or PCWP) and LV pressure - Diastolic pressure gradient across mitral valve
  - Exercise hemodynamics - If symptoms-severity mismatch
treatment:
  - Medical management - Does NOT alter disease progression, but improves symptoms and prevents complications
  - Asymptomatic mild-moderate - No treatment needed, periodic monitoring (echo every 1-3 years)
  - Diuretics - Reduce pulmonary congestion (furosemide, bumetanide), mainstay symptom control
  - Rate control - If atrial fibrillation (beta-blockers, diltiazem, verapamil, digoxin), goal resting HR 60-80, <110 with activity
  - Anticoagulation - ESSENTIAL if AF (warfarin INR 2-3, or DOAC), consider if LA thrombus, LA dimension >5.5 cm, spontaneous echo contrast, prior embolism
  - Rhythm control - Cardioversion if AF recent onset (<48 hrs or anticoagulated 3 weeks), long-term success poor if LA very dilated
  - Endocarditis prophylaxis - NOT routinely recommended (2007 AHA guidelines), only high-risk cardiac conditions
  - Pregnancy - High risk (cannot increase CO, pulmonary edema), beta-blockers, diuretics, close monitoring, PBMV if severe symptomatic
  - Interventional - Percutaneous balloon mitral valvuloplasty (PBMV, mitral valvotomy)
  - Indications - Symptomatic severe MS (valve area <1.5 cm²) with favorable valve morphology (Wilkins score ≤8), no LA thrombus, no/mild MR
  - Asymptomatic severe MS if pulmonary HTN (PASP >50 mmHg at rest or >60 mmHg with exercise)
  - Technique - Inoue balloon catheter via transseptal puncture, inflate balloon across valve, split fused commissures
  - Outcomes - Success 80-95% (valve area increase to >1.5 cm²), symptom improvement, low mortality (<1%)
  - Complications - MR (10-20%, severe MR 2-10% requires urgent surgery), ASD (5-10%, usually small and hemodynamically insignificant), tamponade, stroke
  - Restenosis - 10-year freedom from restenosis 50-60%, can repeat PBMV or proceed to surgery
  - Surgical - Mitral valve surgery
  - Indications
  - Symptomatic severe MS with unfavorable valve anatomy (Wilkins score >8) or contraindication to PBMV (LA thrombus, moderate-severe MR)
  - Asymptomatic severe MS with severe pulmonary HTN (PASP >60 mmHg at rest) if not PBMV candidate
  - Options
  - Open mitral commissurotomy (OMC) - Preferred if valve suitable (no heavy calcification), preserves native valve, durable results
  - Mitral valve replacement (MVR) - If valve heavily calcified, significant MR, failed prior PBMV/OMC
  - Mechanical valve (lifelong anticoagulation) vs bioprosthetic valve (no long-term anticoagulation, but limited durability 10-15 years, preferred if age >65, contraindication to anticoagulation, or women desiring pregnancy)
  - Perioperative mortality 1-5% (higher if NYHA IV, RV dysfunction, pulmonary HTN)
clinical_pearls:
  - Rheumatic MS has latency 10-30 years, most patients present age 40-60 despite acute RF in childhood
  - Opening snap distinguishes MS from other causes of diastolic murmur, short S2-OS interval indicates severe stenosis
  - Pregnancy is high risk - cannot increase CO, consider PBMV (safest intervention if needed)
  - Always rule out LA thrombus with TEE before PBMV or cardioversion (30% thrombi in LAA)
  - Atrial fibrillation increases stroke risk 5-7 fold, anticoagulation essential
  - Severe MS defined by valve area <1 cm², mean gradient >10 mmHg, or PASP >50 mmHg
differentials:
  - CARD-ATRIAL-MYXOMA
  - CARD-TRICUSPID-STENOSIS
  - CARD-ATRIAL-SEPTAL-DEFECT
  - CARD-COR-PULMONALE
trace:
  - Dyspnea, fatigue, hemoptysis
  - Diastolic rumble at apex, opening snap
  - Echo shows mitral stenosis with doming leaflets
  - TEE to rule out LA thrombus before intervention
