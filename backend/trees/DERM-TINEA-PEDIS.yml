tree_id: DERM-TINEA-PEDIS
name: Tinea Pedis (Athlete's Foot)
family: Dermatology
specialty: Dermatology/Primary Care
chief_complaint: Itchy, scaly feet with peeling skin
description: Dermatophyte fungal infection of the feet, most common fungal infection in adults. Three clinical patterns - interdigital (most common), moccasin-type (chronic hyperkeratotic), and vesiculobullous (acute inflammatory). Responds well to topical antifungals.
icd10: B35.3
snomed: 6020002
presentations:
  - Interdigital maceration and scaling (between toes)
  - Pruritus
  - Fissuring, especially 4th web space
  - Moccasin pattern (soles and sides of feet)
  - Vesicles or bullae (inflammatory type)
  - Malodor
  - Often bilateral but may be asymmetric
urgency: routine
referrals:
  emergency:
    - Secondary bacterial infection with systemic signs (fever, ascending lymphangitis)
  urgent:
    - Rapidly spreading infection
    - Immunocompromised with extensive disease
  routine:
    - Refractory to treatment
    - Recurrent infections

workup:
  - Clinical diagnosis based on appearance and distribution
  - Three clinical patterns
  - Interdigital (toe web) type - most common (70%)
  - Maceration, scaling, fissuring between toes, especially 4th web space (4th-5th toes)
  - Pruritus, sometimes malodor
  - Often starts in one web space, spreads to others
  - May have secondary bacterial infection (gram-negative or Staphylococcus)
  - Moccasin type (chronic hyperkeratotic plantar)
  - Chronic, bilateral but often asymmetric
  - Diffuse scaling and mild erythema of soles, sides, and heels
  - "Moccasin" distribution
  - Hyperkeratosis may cause fissuring
  - Minimal inflammation, less pruritic than other types
  - Often associated with onychomycosis (toenail fungus)
  - Vesiculobullous (acute inflammatory) type
  - Acute onset, highly inflammatory
  - Vesicles and bullae on instep, medial foot
  - Intense pruritus
  - May be allergic reaction to dermatophyte ("id reaction")
  - Physical examination
  - Interdigital scaling, maceration, erythema
  - Check all web spaces
  - Examine soles for scaling, hyperkeratosis (moccasin pattern)
  - Vesicles or bullae if inflammatory type
  - Toenail examination (onychomycosis commonly coexists - 30-40%)
  - Check for secondary bacterial infection - purulence, increased pain, lymphangitis
  - "Two feet, one hand" syndrome - tinea pedis with unilateral tinea manuum suggests dermatophyte
  - Laboratory diagnosis - usually not needed for typical cases
  - KOH preparation - scrape scale from active border, add KOH solution, microscopy shows branching hyphae and spores
  - Useful if diagnosis uncertain or treatment failures
  - From interdigital scale, roof of vesicle, or sole
  - Fungal culture - if KOH negative but high suspicion, or to identify species
  - Takes 2-4 weeks, not routinely needed
  - Bacterial culture - if signs of secondary bacterial infection (purulence, increased erythema, pain)
  - Risk factors - occlusive footwear, sweating, communal bathing/swimming, immunosuppression, diabetes
  - Causative organisms - Trichophyton rubrum (most common, 70%), T. mentagrophytes, Epidermophyton floccosum
treatment:
  - Topical antifungal therapy - first-line for most cases
  - Interdigital and moccasin type
  - Terbinafine 1% cream twice daily x 2 weeks (most effective)
  - Alternative - butenafine 1% cream once daily x 2 weeks (also very effective)
  - Azoles (clotrimazole 1%, miconazole 2%, ketoconazole 2%) twice daily x 4 weeks - less expensive, longer treatment
  - Apply to affected areas and 1-2 cm beyond
  - Vesiculobullous type
  - Acute phase - dry out lesions first
  - Burow's solution (aluminum acetate) compresses 2-3 times daily x 3-5 days
  - Topical corticosteroid (triamcinolone 0.1% cream twice daily x 1 week) to reduce inflammation
  - Then topical antifungal as above once acute inflammation resolves
  - Oral antifungal therapy - for extensive, moccasin-type, or refractory cases
  - Terbinafine 250 mg daily x 2-6 weeks (most effective oral agent)
  - Alternative - itraconazole 200 mg twice daily x 1 week, or 200 mg once daily x 2-4 weeks
  - Fluconazole 150 mg once weekly x 3-6 weeks (less effective than terbinafine)
  - Consider if extensive disease, moccasin type, treatment failure with topicals, concomitant onychomycosis
  - Adjunctive measures - essential for treatment success and prevention
  - Keep feet dry - dry thoroughly between toes after bathing
  - Absorbent powder (tolnaftate powder, miconazole powder, or plain cornstarch) daily
  - Wear breathable footwear - leather or canvas shoes, avoid occlusive shoes
  - Change socks daily, moisture-wicking socks preferred
  - Rotate shoes - allow shoes to dry completely (24-48 hours) between wearings
  - Antifungal powder in shoes
  - Avoid walking barefoot in public areas (pools, locker rooms, showers) - wear sandals or shower shoes
  - Treat onychomycosis if present (reservoir for reinfection)
  - Secondary bacterial infection - requires antibiotics
  - If maceration, purulence, increased pain, or lymphangitis
  - Gram-negative bacteria or Staphylococcus common
  - Ciprofloxacin 500 mg twice daily x 7-10 days (covers both), or
  - Cephalexin 500 mg four times daily x 7-10 days (if only gram-positive suspected)
  - Continue antifungal therapy concurrently
  - Prophylaxis for recurrent infections
  - Maintenance antifungal powder (tolnaftate, miconazole) once or twice weekly
  - Aggressive foot hygiene measures as above
  - Treat onychomycosis if present
clinical_pearls:
  - Most common fungal infection worldwide, affects 10-15% of population
  - Highly contagious - spread by direct contact or fomites in communal areas
  - "Two feet, one hand" syndrome (tinea pedis bilateral, tinea manuum unilateral) classic for dermatophyte
  - Moccasin-type often chronic and harder to treat - may require oral therapy
  - Onychomycosis coexists in 30-40% - serves as reservoir for recurrence, should be treated
  - T. rubrum most common organism (70%), causes moccasin-type and onychomycosis
  - Secondary bacterial infection common with interdigital type - gram-negative (Pseudomonas, Proteus) or Staphylococcus
  - Terbinafine most effective topical (2 weeks) and oral agent
  - Azoles cheaper but require longer treatment (4 weeks topical)
  - Relapse common if predisposing factors not addressed (occlusive footwear, wet feet)
  - Diabetic patients at higher risk - check feet regularly, prevent secondary infections
  - Prevention key - keep feet dry, breathable shoes, avoid walking barefoot in public areas
differentials:
  - Contact dermatitis (irritant or allergic) - history of exposure, KOH negative, may be bilateral symmetric
  - Dyshidrotic eczema - vesicles on sides of fingers and toes, soles, palms, very pruritic, KOH negative
  - Psoriasis (plantar) - well-demarcated plaques with silvery scale, often with nail changes, KOH negative
  - Pitted keratolysis - bacterial (Corynebacterium) infection, punched-out pits on weight-bearing surfaces, malodor, not pruritic
  - Juvenile plantar dermatosis - shiny, glazed appearance of soles in children, fissuring, affects forefeet, KOH negative
  - Erythrasma (interdigital) - bacterial (Corynebacterium minutissimum), coral-red fluorescence with Wood's lamp
trace:
  - 42-year-old man presents with 3-month history of itchy, scaly feet
  - Itching between toes, especially right 4th and 5th toes, worse at night
  - Noticed white, peeling skin between toes that sometimes cracks
  - Occasional malodor
  - Works in construction, wears work boots 10 hours daily
  - Wears same boots every day, feet often sweaty
  - No prior treatment attempted
  - Past medical history - none, no diabetes
  - Medications - none
  - Physical examination - interdigital maceration, scaling, and fissuring in bilateral 4th web spaces (right worse than left), mild erythema, some white debris between toes
  - Examination of soles shows mild fine scaling on right sole, no hyperkeratosis
  - Toenails appear normal, no discoloration or thickening
  - No purulence, no lymphangitis
  - KOH preparation from right 4th web space shows branching septate hyphae (confirms tinea pedis)
  - Diagnosis - Tinea pedis, interdigital type, bilateral
  - Treatment plan - terbinafine 1% cream twice daily x 2 weeks to affected areas and 1 cm beyond
  - Extensive counseling on foot hygiene - dry thoroughly between toes after showering, apply absorbent powder (tolnaftate powder) to feet and in shoes daily
  - Rotate shoes - purchased second pair of work boots, alternate daily to allow shoes to dry out
  - Wear moisture-wicking socks, change socks during day if feet sweaty
  - Wear sandals or shower shoes in gym locker room
  - At 2 weeks - significant improvement, pruritus 80% better, maceration resolved, minimal residual scaling
  - Continued terbinafine for additional 1 week to ensure complete clearance
  - At 4 weeks - complete resolution, skin between toes normal, no scaling on soles
  - Advised to continue preventive measures - daily powder, rotate shoes, keep feet dry
  - At 6 months - no recurrence, continues preventive foot hygiene

citations:
  - AAD (American Academy of Dermatology) Guidelines for Management of Tinea Pedis
  - British Association of Dermatologists Guidelines
  - UpToDate - Dermatology
