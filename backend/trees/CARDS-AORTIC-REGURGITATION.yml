tree_id: CARDS-AORTIC-REGURGITATION
name: Aortic Regurgitation
family: Cardiology
specialty: Cardiology
chief_complaint: Shortness of breath and pounding heartbeat
description: Backflow from aorta to LV during diastole causing volume overload, bounding pulses, and wide pulse pressure. Chronic AR compensated for years until LV dysfunction develops. Acute AR from endocarditis or dissection causes cardiogenic shock. Valve replacement indicated when symptomatic or LV dilation develops.
icd10: I35.1
urgency: urgent

workup:
  - Chronic AR (most common): insidious onset, compensated for years until LV failure
  - Acute AR: sudden onset, cardiogenic shock, surgical emergency
  - Symptoms (late manifestations):
  - Dyspnea: exertional dyspnea, orthopnea, PND (heart failure from volume overload)
  - Palpitations: pounding sensation from hyperdynamic circulation
  - Angina: exertional chest pain (decreased diastolic coronary perfusion)
  - Physical exam (chronic AR - dramatic findings):
  - Wide pulse pressure: systolic elevated, diastolic very low (e.g., 160/40)
  - Bounding pulses: Corrigan pulse (water hammer pulse), prominent carotid pulsations
  - Head bobbing: de Musset sign (head bobs with each heartbeat)
  - Nail bed pulsations: Quincke sign (capillary pulsations)
  - Femoral bruit: Duroziez sign (to-and-fro femoral artery murmur with compression)
  - Early diastolic decrescendo murmur: high-pitched, blowing, at left sternal border with patient leaning forward
  - Austin Flint murmur: mid-diastolic rumble at apex (AR jet impinges on anterior mitral leaflet mimicking MS)
  - S3 gallop: volume overload
  - Displaced and hyperdynamic apical impulse: LV dilatation
  - Acute AR exam: different from chronic
  - Soft diastolic murmur (short duration)
  - Normal pulse pressure (LV not yet dilated)
  - Tachycardia, hypotension, pulmonary edema (cardiogenic shock)
  - Causes:
  - Chronic: bicuspid aortic valve, rheumatic heart disease, connective tissue disorders (Marfan, Ehlers-Danlos), ankylosing spondylitis, syphilis (rare), aortic root dilation
  - Acute: infective endocarditis (valve destruction), aortic dissection (type A), trauma
  - Echocardiogram:
  - Visualize regurgitant jet: color Doppler shows backflow from aorta to LV
  - Severity grading: vena contracta width, regurgitant volume, regurgitant fraction
  - Severe AR: vena contracta over 0.6 cm, regurgitant volume over 60 mL, regurgitant fraction over 50%
  - LV size: end-systolic dimension (ESD) and end-diastolic dimension (EDD)
  - LV systolic function: EF (compensated initially over 50%, decompensated below 50%)
  - Aortic root size: dilated root may cause AR
  - Chest X-ray: cardiomegaly (boot-shaped heart), pulmonary edema if decompensated
  - ECG: LV hypertrophy with strain pattern (volume overload)

treatment:
  - Chronic AR medical management (asymptomatic with normal LV function):
  - Vasodilators: ACE inhibitors or ARBs reduce afterload, may delay need for surgery
  - Nifedipine: alternative vasodilator
  - Beta blockers: avoid or use cautiously (slow heart rate prolongs diastole, worsens regurgitation)
  - Diuretics: if mild volume overload symptoms
  - Serial echocardiograms: every 6-12 months to monitor LV size and function
  - Surgical aortic valve replacement (definitive treatment):
  - Indications: symptomatic severe AR (dyspnea, angina, heart failure), asymptomatic with LV systolic dysfunction (EF below 50%), asymptomatic with severe LV dilatation (ESD over 50 mm or EDD over 70 mm), undergoing other cardiac surgery
  - Operate BEFORE EF declines below 50% (LV dysfunction may be irreversible if too late)
  - Mechanical vs bioprosthetic valve: same considerations as AS
  - Aortic root replacement: if root dilation (Bentall procedure - valve and ascending aorta)
  - Acute AR treatment (medical emergency):
  - Cardiogenic shock: hypotension, pulmonary edema
  - Medical stabilization: vasodilators (nitroprusside) and inotropes (dobutamine) to reduce afterload and augment forward flow
  - Avoid beta blockers: worsen shock
  - IABP contraindicated: worsens regurgitation
  - Emergent surgical valve replacement: only definitive treatment, do NOT delay
  - Treat underlying cause: antibiotics for endocarditis, emergent surgery for aortic dissection
  - Activity restriction: avoid strenuous exercise if severe AR
  - Antibiotic prophylaxis: NOT recommended for native valve AR (only prosthetic valves)

clinical_pearls:
  - Wide pulse pressure (e.g., 160/40) with bounding pulses and head bobbing
  - Early diastolic decrescendo murmur at left sternal border (patient leaning forward)
  - Austin Flint murmur at apex (AR jet impinges on mitral valve)
  - Multiple eponymous signs: Corrigan, de Musset, Quincke, Duroziez
  - Chronic AR compensated for years until LV dysfunction develops
  - Operate BEFORE EF drops below 50% (irreversible LV dysfunction if too late)
  - Acute AR from endocarditis or dissection is surgical emergency (cardiogenic shock)
  - Vasodilators (ACE inhibitors) may delay progression in chronic AR

differentials:
  - Mitral stenosis: diastolic murmur at apex but opening snap, narrow pulse pressure, not bounding
  - Pulmonary regurgitation: diastolic murmur at left upper sternal border, not wide pulse pressure
  - Patent ductus arteriosus: continuous machinery murmur, wide pulse pressure, bounding pulses
  - Aortic stenosis: systolic murmur, narrow pulse pressure, delayed carotid upstroke

trace: |
  A 52-year-old man with known bicuspid aortic valve presented with 6 months of progressive dyspnea on exertion. Previously asymptomatic, echo 2 years ago showed mild AR. Now short of breath climbing stairs, palpitations (pounding heartbeat sensation), occasional exertional chest discomfort. Exam: BP 165/45 (wide pulse pressure - systolic elevated, diastolic very low), HR 85, bounding carotid and radial pulses (Corrigan water hammer pulse), head bobbing with heartbeat (de Musset sign), early diastolic decrescendo murmur 3/4 at left sternal border with patient leaning forward (classic AR murmur), mid-diastolic rumble at apex (Austin Flint murmur from AR jet on mitral valve), S3 gallop, apical impulse displaced to anterior axillary line (LV dilatation) and hyperdynamic. Fingernail capillary pulsations present (Quincke sign). Echocardiogram: bicuspid aortic valve with severe aortic regurgitation, vena contracta 0.8 cm (severe over 0.6), regurgitant volume 75 mL (severe over 60), LV severely dilated with end-diastolic dimension 72 mm (normal below 55, surgical threshold 70 mm), end-systolic dimension 52 mm (surgical threshold 50 mm), LV systolic function EF 48% (borderline low, normal over 50% - early LV dysfunction). Dilated ascending aorta 4.8 cm. ECG: LV hypertrophy with strain pattern. CXR: cardiomegaly, boot-shaped heart. Diagnosed with symptomatic severe chronic aortic regurgitation with early LV dysfunction and severe LV dilatation (multiple surgical indications: symptomatic, EF 48% below 50%, ESD 52 mm over 50 mm threshold). Coronary angiography: normal coronaries. Cardiothoracic surgery consultation: age 52, bicuspid valve, dilated root. Underwent aortic valve replacement with mechanical valve and ascending aorta replacement (Bentall procedure - composite graft with valve and aorta). Post-operative course uncomplicated. Started warfarin for mechanical valve (INR goal 2.5-3.5). At 2 weeks echocardiogram: well-functioning mechanical valve, no AR, LV size decreased EDD 65 mm (down from 72 - reverse remodeling), ESD 46 mm (improved from 52), EF 52% (improved from 48 - LV function recovering). At 3 months dramatic symptom improvement: no dyspnea, able to exercise, no palpitations. Echo: continued reverse remodeling, LV dimensions normalizing, EF 55%. At 1 year: LV size normalized EDD 58 mm, EF 58%, excellent functional status. Operated at right time before irreversible LV dysfunction developed. Annual echo monitoring, lifelong warfarin for mechanical valve.
