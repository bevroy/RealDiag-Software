tree_id: CARDS-AORTIC-REGURGITATION
name: Aortic Regurgitation
family: Cardiology
specialty: Cardiology
chief_complaint: Dyspnea and palpitations with wide pulse pressure
description: Diastolic flow of blood from aorta back into LV causing volume overload. Acute AR (from endocarditis, dissection) presents with cardiogenic shock. Chronic AR is often asymptomatic until LV dilation and dysfunction develop. Classic signs include wide pulse pressure, bounding pulses, diastolic murmur. Severe AR defined by echo criteria. Surgery indicated if symptomatic or asymptomatic with EF under 50% or LV dilation.
icd10: I35.1
snomed: 60234000
presentations:
  - Often asymptomatic for years (chronic AR)
  - Exertional dyspnea and fatigue (early symptoms)
  - Orthopnea, paroxysmal nocturnal dyspnea (heart failure)
  - Palpitations (awareness of forceful heartbeat)
  - Chest pain (atypical angina from reduced coronary perfusion)
  - Acute AR: sudden dyspnea, pulmonary edema, cardiogenic shock
  - Wide pulse pressure, bounding pulses, head bobbing with pulse
urgency: urgent

workup:
  - Clinical presentation:
  - Acute AR (medical emergency):
  - Sudden dyspnea, pulmonary edema, cardiogenic shock
  - From endocarditis, aortic dissection, traumatic valve injury
  - Cannot compensate, rapid decompensation
  - Chronic AR (gradual onset):
  - Asymptomatic for years (LV compensation with eccentric hypertrophy)
  - Dyspnea on exertion (late symptom when LV dysfunction develops)
  - Palpitations (increased stroke volume)
  - Angina (reduced diastolic coronary perfusion)
  - Etiology:
  - Aortic root dilation (most common, from hypertension, Marfan syndrome, bicuspid valve, aging)
  - Valve leaflet disease (endocarditis, rheumatic heart disease, bicuspid valve)
  - Aortic dissection (acute presentation)
  - Physical exam (classic peripheral signs from wide pulse pressure):
  - Diastolic decrescendo murmur at left sternal border (best heard with patient sitting forward, end-expiration)
  - Widened pulse pressure (elevated systolic, reduced diastolic, over 60 mmHg difference)
  - Bounding pulses (Corrigan pulse, water-hammer pulse)
  - Head bobbing with each heartbeat (de Musset sign)
  - Nail bed pulsations (Quincke sign)
  - Femoral bruit (pistol shot sound, Traube sign)
  - Austin Flint murmur (mid-diastolic rumble at apex from AR jet hitting anterior mitral leaflet)
  - S3 gallop if LV dysfunction
  - Imaging:
  - Echocardiogram (diagnostic):
  - Severity grading:
  - Mild AR (jet width under 25% LVOT, vena contracta under 0.3 cm)
  - Moderate AR (jet width 25-64% LVOT, vena contracta 0.3-0.6 cm)
  - Severe AR (jet width over 65% LVOT, vena contracta over 0.6 cm, holodiastolic flow reversal in descending aorta)
  - LV size assessment (LVESD and LVEDD)
  - EF assessment
  - Aortic root dimensions (if dilated, may need root replacement)
  - Chest X-ray (cardiomegaly, dilated aortic knob)
  - ECG (LV hypertrophy)
  - Cardiac MRI (if echo inadequate, assess LV volumes precisely)
  - CT angiography or TEE (if aortic dissection suspected)

treatment:
  - Acute severe AR (emergency):
  - Medical stabilization (ICU):
  - Vasodilators (nitroprusside) to reduce afterload and regurgitant fraction
  - Inotropes (dobutamine) if hypotension
  - Avoid beta blockers (reduce compensatory tachycardia and worsen forward flow)
  - IABP contraindicated (worsens regurgitation)
  - Emergent surgery (aortic valve replacement with or without root replacement)
  - Chronic AR medical management:
  - Vasodilators (ACE inhibitor or ARB):
  - If hypertensive or symptomatic
  - Reduce afterload and slow LV dilation
  - Avoid if normotensive and asymptomatic
  - Diuretics if congestion
  - Rate control if AFib
  - Endocarditis prophylaxis if valve abnormality
  - Serial monitoring if asymptomatic:
  - Severe AR with normal EF and LV size every 6 months
  - Moderate AR annually
  - Mild AR every 2-3 years
  - Surgery indications (aortic valve replacement):
  - Symptomatic severe AR (class I indication)
  - Asymptomatic severe AR with EF under 50% (LV systolic dysfunction)
  - Asymptomatic severe AR with severe LV dilation (LVESD over 50 mm or LVEDD over 65 mm)
  - Severe AR undergoing other cardiac surgery
  - Aortic root dilation over 5.5 cm (or 5.0 cm if bicuspid valve or Marfan syndrome)
  - Surgical options:
  - Aortic valve replacement (mechanical or bioprosthetic)
  - Aortic valve repair (selected cases)
  - Aortic root replacement (Bentall procedure if root dilated)
  - Post-operative management:
  - Anticoagulation if mechanical valve (warfarin INR 2-3)
  - Antiplatelet if bioprosthetic valve (aspirin 81 mg)
  - Serial echo to assess prosthetic valve function

clinical_pearls:
  - Acute severe AR is medical emergency requiring emergent surgery
  - Chronic AR often asymptomatic for years until LV dysfunction develops
  - Wide pulse pressure and bounding pulses classic exam findings
  - Severe AR criteria include vena contracta over 0.6 cm, holodiastolic flow reversal in descending aorta
  - Surgery indicated if symptomatic, EF under 50%, or severe LV dilation (LVESD over 50 mm)
  - IABP contraindicated in AR (worsens regurgitation)
  - Asymptomatic severe AR requires close monitoring every 6 months

differentials:
  - Mitral regurgitation (holosystolic murmur at apex)
  - Pulmonary regurgitation (Graham Steell murmur, pulmonary hypertension)
  - Patent ductus arteriosus (continuous machine-like murmur)
  - Aortic stenosis (systolic ejection murmur)

trace: |
  A 58-year-old man with history of bicuspid aortic valve presented with 6 months progressive dyspnea on exertion. Previously asymptomatic despite known moderate AR. Now dyspneic climbing stairs (NYHA class II). Palpitations at night. No chest pain or syncope. Exam: BP 160/50 (wide pulse pressure 110 mmHg - over 60 diagnostic for significant AR), bounding radial pulses (Corrigan pulse), head bobbing with each heartbeat (de Musset sign), high-pitched diastolic decrescendo murmur at left sternal border grade 3/6 (heard best sitting forward), mid-diastolic rumble at apex (Austin Flint murmur from AR jet hitting mitral valve), S3 gallop (volume overload). ECG: LV hypertrophy with strain. Chest X-ray: cardiomegaly (dilated LV from chronic volume overload). Echocardiogram: bicuspid aortic valve with severe regurgitation (vena contracta 0.8 cm - over 0.6 is severe, holodiastolic flow reversal in descending aorta - severe AR), regurgitant jet width 75% of LVOT (over 65% is severe), severe LV dilation with LVEDD 72 mm (normal under 55 mm, over 65 mm is severe dilation), LVESD 48 mm (normal under 35 mm, over 50 mm is surgical indication), EF 52% (still preserved but borderline low - normal over 55%). Aortic root 4.2 cm (mildly dilated but under 5.5 cm threshold). Diagnosed with severe chronic aortic regurgitation, now symptomatic with dyspnea and LV dilation approaching surgical thresholds. Key findings triggering intervention: symptomatic (dyspnea NYHA class II) plus severe LV dilation (LVEDD 72 mm over 65 mm threshold) plus LVESD 48 mm approaching 50 mm threshold. Even though EF still 52%, symptoms and severe LV dilation are class I indications for surgery. Referred to cardiac surgery. Given bicuspid valve (not suitable for repair) and age 58 (needs durable valve), discussed mechanical vs bioprosthetic. Patient chose mechanical valve (longer durability, acceptable anticoagulation). Underwent aortic valve replacement with mechanical bileaflet valve (23mm St. Jude). Intraoperative findings: bicuspid valve with prolapsing leaflet causing severe AR. Replaced with mechanical valve in normal position. Post-operative course: uneventful, extubated on POD 0. Started warfarin with heparin bridge. Discharge POD 5 on warfarin (target INR 2-3 for aortic position), aspirin 81 mg x3 months (then stop, warfarin alone), metoprolol, lisinopril, atorvastatin. At 6 weeks: outpatient follow-up, symptoms resolved. No dyspnea, walking without limitation. INR therapeutic 2.5. Exam: mechanical valve click audible, no murmur (no residual AR). Echo: prosthetic valve functioning normally, trace physiologic regurgitation only (expected for mechanical valve), LV size decreased from 72 mm to 65 mm (reverse remodeling after eliminating volume overload), EF improved to 58% (improved with normal loading conditions). At 6 months: continued improvement, LVEDD decreased further to 61 mm (continued reverse remodeling), EF 60%. NYHA class I, asymptomatic. At 1 year: excellent functional capacity, stable prosthetic valve function, INR consistently therapeutic. This case demonstrates severe chronic AR with classic exam findings (wide pulse pressure, bounding pulses, head bobbing, diastolic murmur, Austin Flint murmur) and progression from asymptomatic moderate AR to symptomatic severe AR with LV dilation. Surgical indications met: symptomatic plus severe LV dilation (LVEDD 72 mm over 65 mm threshold). Early surgery before EF significantly drops (EF 52% still preserved) important for optimal outcomes. Post-operative reverse remodeling with LV size reduction and EF improvement demonstrates benefit of timely intervention.
