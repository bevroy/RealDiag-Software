tree_id: NEURO-MULTIPLE-SCLEROSIS
name: Multiple Sclerosis
family: Neurologic
specialty: Neurology
chief_complaint: Vision loss and numbness
description: Chronic autoimmune demyelinating disease of CNS causing relapsing-remitting or progressive neurologic deficits separated in time and space

icd10: G35

urgency: urgent

workup:
  - Clinical presentation: neurologic symptoms separated in time (multiple episodes) and space (different CNS locations), young adults (20-40 years), female predominance 2-3:1
  - Common presentations: optic neuritis (unilateral vision loss, eye pain with movement, afferent pupillary defect), sensory symptoms (numbness, paresthesias), motor weakness, diplopia (internuclear ophthalmoplegia from MLF lesion), ataxia, bladder dysfunction, Lhermitte sign (electric shock sensation down spine with neck flexion)
  - Exam findings: decreased visual acuity/color vision, relative afferent pupillary defect (Marcus Gunn pupil), internuclear ophthalmoplegia (impaired adduction one eye with nystagmus abducting eye), weakness, spasticity, hyperreflexia, Babinski sign, sensory deficits, ataxia, cognitive impairment
  - McDonald criteria for diagnosis: requires dissemination in time (DIT) and space (DIS) - 2 or more clinical attacks with 2 or more objective lesions, or 2 attacks with 1 lesion plus DIS on MRI, or 1 attack with 2 lesions plus DIT
  - MRI brain and spine with contrast: periventricular white matter lesions (Dawson fingers perpendicular to lateral ventricles), juxtacortical lesions, infratentorial lesions, spinal cord lesions, gadolinium enhancement indicates active inflammation (new lesions), DIS requires 2 or more lesions in different CNS areas
  - Lumbar puncture: oligoclonal bands in CSF (not serum) 95 percent sensitive, elevated IgG index, mild lymphocytic pleocytosis (5-50 cells/microL), normal glucose/protein
  - Evoked potentials: visual evoked potentials (VEP) delayed if optic nerve involvement, somatosensory or brainstem auditory evoked potentials
  - Exclude mimics: vitamin B12 deficiency (check B12), neuromyelitis optica (NMO-IgG/aquaporin-4 antibodies positive, longitudinally extensive spinal cord lesions), Lyme disease (Lyme serology), sarcoidosis (ACE level, chest CT)
  - MS subtypes: relapsing-remitting (85 percent, discrete attacks with recovery), secondary progressive (RRMS transitions to progressive disability), primary progressive (15 percent, progressive from onset without relapses), progressive-relapsing (rare)

treatment:
  - Acute relapse treatment: high-dose IV methylprednisolone 1 gram daily x 3-5 days (hastens recovery, no effect on long-term disability), oral prednisone taper alternative, plasma exchange if refractory to steroids
  - Disease-modifying therapies (DMT) reduce relapse rate and slow disability progression: start after first clinical attack with MRI evidence MS or after second attack
  - First-line DMTs: injectable (interferon beta-1a 30 mcg IM weekly or 44 mcg SC TIW, glatiramer acetate 20-40 mg SC daily), oral (dimethyl fumarate 240 mg BID, teriflunomide 14 mg daily), infusion (natalizumab 300 mg IV every 4 weeks - very effective but PML risk)
  - High-efficacy DMTs for aggressive MS: ocrelizumab 600 mg IV every 6 months (B-cell depleting, also approved for primary progressive MS), alemtuzumab, cladribine, siponimod
  - Monitoring DMTs: MRI brain annually to assess new lesions (treatment failure if new activity), CBC and LFTs for oral agents, JC virus testing before natalizumab (PML risk)
  - Symptomatic treatment: spasticity (baclofen 5-20 mg TID, tizanidine 2-8 mg TID), bladder dysfunction (oxybutynin, intermittent catheterization), fatigue (amantadine 100 mg BID, modafinil 200 mg daily), neuropathic pain (gabapentin, duloxetine), depression (SSRIs)
  - Physical therapy, occupational therapy, speech therapy for rehabilitation
  - Avoid triggers: heat exacerbates symptoms (Uhthoff phenomenon), smoking worsens MS progression (strongly advise cessation)

clinical_pearls:
  - Young women with neurologic symptoms separated in time and space (different episodes, different CNS locations)
  - Optic neuritis common presenting symptom (unilateral vision loss with eye pain)
  - MRI shows periventricular white matter lesions (Dawson fingers), gadolinium enhancement indicates active lesions
  - Oligoclonal bands in CSF (not serum) 95 percent sensitive for MS
  - High-dose IV methylprednisolone for acute relapses (hastens recovery)
  - Disease-modifying therapies reduce relapse rate and slow progression (start early)
  - Relapsing-remitting most common subtype (85 percent)

differentials:
  - Neuromyelitis optica (NMO) - aquaporin-4 antibodies positive, longitudinally extensive transverse myelitis, bilateral optic neuritis, different treatment
  - Acute disseminated encephalomyelitis (ADEM) - monophasic post-infectious, children, diffuse white matter lesions
  - CNS vasculitis (multiple infarcts, elevated ESR/CRP, angiography abnormal)
  - Lyme disease (history tick exposure, Lyme serology positive, responds to antibiotics)
  - Vitamin B12 deficiency (subacute combined degeneration, low B12, macrocytic anemia)

trace:
  - 28-year-old woman presents with 3 days progressive vision loss right eye, pain with eye movement, colors appear washed out
  - History: 1 year ago had episode of numbness right leg lasting 2 weeks that resolved spontaneously (did not seek care at that time)
  - Exam: visual acuity right eye 20/200 (left 20/20), decreased color vision right eye (red desaturation), relative afferent pupillary defect right eye (Marcus Gunn pupil), fundoscopy shows mild optic disc edema right eye, motor/sensory/reflexes normal otherwise
  - Diagnosis: optic neuritis right eye, concerning for multiple sclerosis given prior episode numbness
  - MRI brain with and without contrast: multiple periventricular white matter lesions (Dawson fingers), juxtacortoral lesions, no enhancement (no active inflammation currently), total 15 lesions greater than 3 mm
  - MRI cervical spine: 2 lesions cervical cord
  - Lumbar puncture: oligoclonal bands present in CSF (not serum), IgG index elevated 0.9 (normal less than 0.7), WBC 8 cells/microL (normal), glucose/protein normal
  - Labs: vitamin B12 895 pg/mL (normal), Lyme antibody negative
  - Diagnosis: multiple sclerosis relapsing-remitting type (optic neuritis current attack, numbness 1 year ago prior attack, MRI shows DIS with multiple lesions in different locations, oligoclonal bands positive)
  - Acute treatment: IV methylprednisolone 1 gram daily x 5 days
  - Vision improved significantly by day 3, pain resolved
  - 1 week post-steroids: vision 20/30 right eye (improved from 20/200), color vision improved, continues to recover
  - Counseling: chronic condition, relapses common without treatment, disease-modifying therapy reduces relapses and slows progression
  - Started dimethyl fumarate 240 mg BID (oral DMT, well-tolerated first-line agent)
  - Monitored: CBC and LFTs at baseline then every 3 months
  - 3 months: vision recovered to 20/25 right eye (near baseline), tolerating dimethyl fumarate well (mild flushing first week resolved), no new symptoms
  - Repeat MRI brain at 1 year: no new lesions, no gadolinium enhancement (excellent response to DMT, no disease activity)
  - 2 years: remains relapse-free on dimethyl fumarate, annual MRI stable, excellent quality of life
