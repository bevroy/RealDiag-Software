tree_id: NEURO-MULTIPLE-SCLEROSIS
name: Multiple Sclerosis
family: Neurology
specialty: Neurology
chief_complaint: Neurologic symptoms with relapsing-remitting pattern
description: |
  Autoimmune demyelinating disease of CNS. Inflammation causes plaques in white matter.
  Four types - relapsing-remitting (85-90% at onset), secondary progressive, primary progressive, progressive relapsing. Peak onset age 20-40, more common in women (3:1).
icd10: G35
urgency: Moderate
workup:
  - MRI brain and spine with gadolinium (gold standard) - shows demyelinating plaques (T2 hyperintense lesions), periventricular white matter involvement, enhancement indicates active inflammation
  - McDonald criteria for diagnosis - dissemination in space (2 or more CNS locations) and time (2 or more episodes or new MRI lesions)
  - Lumbar puncture - CSF shows oligoclonal bands (present in 90-95%), elevated IgG index, mild lymphocytic pleocytosis
  - Visual evoked potentials if optic neuritis suspected (prolonged P100 latency)
  - Rule out mimics - Lyme disease, vitamin B12 deficiency, sarcoidosis, vasculitis (check Lyme serology, B12, ACE, ESR, ANA)
treatment:
  - Acute relapse treatment - high-dose IV methylprednisolone 1000 mg daily x 3-5 days (shortens attack duration)
  - Plasma exchange if severe relapse not responding to steroids
  - Disease-modifying therapies (DMTs) to reduce relapse rate and slow progression
  - Injectable DMTs - interferon beta-1a (Avonex, Rebif) 30 mcg IM weekly or 44 mcg SC TIW, glatiramer acetate 20-40mg SC daily
  - Oral DMTs - fingolimod 0.5mg daily, dimethyl fumarate 240mg BID, teriflunomide 14mg daily
  - Infusion DMTs - natalizumab 300mg IV monthly (risk of PML, requires JCV antibody monitoring), ocrelizumab 600mg IV q6 months
  - High-efficacy DMTs (natalizumab, ocrelizumab, alemtuzumab) for aggressive disease
  - Symptomatic treatment - baclofen or tizanidine for spasticity, gabapentin for neuropathic pain, modafinil for fatigue, oxybutynin for bladder dysfunction
  - Physical therapy, occupational therapy, cognitive rehabilitation
clinical_pearls:
  - Classic presentation includes optic neuritis (painful vision loss, Marcus Gunn pupil), transverse myelitis, brainstem syndromes (diplopia, ataxia), Lhermitte sign (neck flexion causes electric shock sensation down spine)
  - Uhthoff phenomenon - symptoms worsen with heat (hot shower, exercise, fever)
  - Charcot triad - nystagmus, intention tremor, scanning speech (advanced disease)
  - Clinically isolated syndrome (CIS) is first episode, 60-80% develop MS within 10 years if abnormal MRI
  - Progression independent of relapse activity (PIRA) occurs even in treated patients
  - Early treatment with high-efficacy DMTs improves long-term outcomes
differentials:
  - Neuromyelitis optica spectrum disorder (NMOSD)
  - Acute disseminated encephalomyelitis (ADEM)
  - Lyme disease
  - Sarcoidosis
  - CNS vasculitis
  - Vitamin B12 deficiency
trace:
  - 28-year-old woman with sudden vision loss and pain in right eye x 3 days → Exam shows decreased visual acuity, RAPD, pain with eye movement → MRI brain shows multiple periventricular white matter T2 hyperintense lesions, enhancing right optic nerve → CSF shows oligoclonal bands → Diagnose relapsing-remitting multiple sclerosis with optic neuritis → IV methylprednisolone 1000mg daily x 5 days → Vision improves to baseline → Start ocrelizumab 300mg IV, repeat in 2 weeks, then 600mg q6 months → No relapses over 2 years, stable MRI
