tree_id: PSYCH-GENERALIZED-ANXIETY-DISORDER
name: Generalized Anxiety Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Excessive worry and restlessness
description: |
  Chronic excessive worry about multiple concerns for ≥6 months causing distress or impairment.
  Lifetime prevalence 5-6%, twice as common in women. Often comorbid with depression (60%).
icd10: F41.1
urgency: Low
workup:
  - Clinical diagnosis using DSM-5 criteria - excessive anxiety/worry most days for ≥6 months about multiple events
  - Associated with 3 or more symptoms - restlessness, fatigue, difficulty concentrating, irritability, muscle tension, sleep disturbance
  - GAD-7 screening tool (score ≥10 suggests GAD, 89% sensitivity and specificity)
  - Rule out medical causes - hyperthyroidism (check TSH), pheochromocytoma, cardiac arrhythmia, substance use/withdrawal
  - Screen for depression with PHQ-9 (high comorbidity)
  - Assess for substance use (alcohol, benzodiazepines, caffeine)
treatment:
  - First-line psychotherapy - cognitive behavioral therapy (CBT) most evidence-based
  - First-line medications - SSRIs (escitalopram 10-20mg, sertraline 50-200mg, paroxetine 20-50mg)
  - Alternative SNRI (venlafaxine XR 75-225mg, duloxetine 60-120mg)
  - Buspirone 10-15mg TID alternative if SSRI/SNRI contraindicated (takes 2-4 weeks to work, no dependence risk)
  - Benzodiazepines only for short-term use (<2-4 weeks) due to dependence risk (avoid if history of substance abuse)
  - Combination CBT plus medication more effective than either alone
  - Adequate trial requires 4-8 weeks at therapeutic dose before switching
  - Continue medication 6-12 months after remission, then taper slowly
  - Lifestyle modifications - regular exercise, sleep hygiene, limit caffeine/alcohol, mindfulness meditation
clinical_pearls:
  - GAD characterized by chronic, pervasive worry (versus panic disorder with discrete attacks)
  - Physical symptoms common including palpitations, sweating, trembling, GI distress, dizziness
  - Avoid benzodiazepines as first-line (effective acutely but high dependence potential)
  - SSRIs may initially increase anxiety (start low dose, warn patients)
  - Treatment-resistant cases consider augmentation with buspirone or atypical antipsychotic (quetiapine)
  - Screen for suicide risk (anxiety disorders increase suicide risk 10-fold)
differentials:
  - Panic disorder
  - Social anxiety disorder
  - Obsessive-compulsive disorder
  - Post-traumatic stress disorder
  - Major depressive disorder
  - Hyperthyroidism
trace:
  - Excessive worry about work, family, health for 8 months → Restless, fatigued, difficulty concentrating, muscle tension → GAD-7 score 14 → Check TSH (normal) → PHQ-9 shows mild depression → Diagnose generalized anxiety disorder → Initiate escitalopram 10mg daily plus refer to CBT → Reassess at 4 weeks, partial improvement → Increase to 20mg daily → 8-week follow-up, symptoms significantly improved → Continue therapy and medication 6-12 months
