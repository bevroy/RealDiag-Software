tree_id: PSYCH-GENERALIZED-ANXIETY-DISORDER
name: Generalized Anxiety Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Excessive worry and restlessness
description: |
  Chronic excessive anxiety and worry about multiple events or activities, difficult to control, causing significant distress or impairment. Affects 5-6% of population, women 2:1.
  Different from normal worry by being excessive, persistent (greater than 6 months), and impairing function. Often comorbid with depression (60%), other anxiety disorders, substance abuse. Combination of psychotherapy and medication most effective.
icd10: F41.1
snomed: 21897009
presentations:
  - Excessive anxiety most days for ≥6 months
  - Worry about multiple domains
  - Restlessness, fatigue
  - Irritability, muscle tension
  - Sleep disturbance
  - Difficulty concentrating
  - Significant distress or impairment
urgency: Low
workup:
  - DSM-5 diagnostic criteria
  - Excessive anxiety and worry about multiple events/activities, more days than not for at least 6 months
  - Difficult to control the worry
  - At least 3 of 6 symptoms (only 1 in children) - restlessness/on edge, easily fatigued, difficulty concentrating, irritability, muscle tension, sleep disturbance
  - Causes significant distress or functional impairment
  - Not attributable to substance, medical condition, or other psychiatric disorder
  - Distinguish from other anxiety disorders
  - Panic disorder - discrete panic attacks with physical symptoms
  - Social anxiety disorder - anxiety specific to social situations
  - Specific phobia - anxiety about specific object/situation
  - OCD - obsessions and compulsions
  - PTSD - anxiety after traumatic event
  - Medical workup to exclude organic causes
  - TSH (hyperthyroidism), glucose (hypoglycemia), CBC (anemia)
  - ECG if palpitations
  - Toxicology screen, caffeine intake assessment
  - Medications causing anxiety - stimulants, steroids, thyroid hormone, bronchodilators
  - GAD-7 questionnaire - validated screening tool (score 0-21)
  - 0-4 minimal, 5-9 mild, 10-14 moderate, 15-21 severe
  - Screen for comorbidities - PHQ-9 (depression), AUDIT (alcohol), substance use
  - Assess suicide risk - persistent worry about death can include suicidal ideation
treatment:
  - Psychotherapy first-line for mild-moderate GAD
  - Cognitive behavioral therapy (CBT) most evidence - identify and challenge maladaptive thoughts, relaxation techniques, exposure
  - 12-16 weekly sessions, sustained benefit
  - Mindfulness-based stress reduction, acceptance and commitment therapy alternatives
  - Pharmacotherapy for moderate-severe GAD or if psychotherapy inadequate/unavailable
  - SSRIs first-line - sertraline 50-200mg daily, escitalopram 10-20mg daily, paroxetine 20-50mg daily
  - Takes 4-8 weeks for full effect, start low and titrate
  - Side effects - nausea, sexual dysfunction, weight gain, activation (increased anxiety initially)
  - Continue x 12 months after remission before considering taper
  - SNRIs alternative - venlafaxine XR 75-225mg daily, duloxetine 60-120mg daily
  - Effective for GAD plus comorbid depression or chronic pain
  - Buspirone 15-60mg daily in divided doses - anxiolytic with no sedation, addiction, or withdrawal
  - Takes 2-4 weeks to work, less effective than SSRIs
  - Benzodiazepines - short-term only (less than 2-4 weeks) for severe symptoms while starting SSRI
  - Clonazepam 0.25-2mg BID, lorazepam 0.5-2mg TID
  - Rapid onset (30-60 minutes) but tolerance, dependence, withdrawal, cognitive impairment
  - Avoid long-term use (greater than 1 month)
  - Pregabalin 150-600mg daily - effective but controlled substance, sedation
  - Hydroxyzine 25-100mg TID-QID - antihistamine, PRN use for breakthrough anxiety
  - Beta-blockers (propranolol 10-40mg PRN) for physical symptoms (tremor, palpitations) but not core anxiety
  - TCAs (imipramine) effective but side effects limit use
  - Combination therapy - SSRI plus CBT superior to either alone
  - Lifestyle interventions - regular exercise (reduces anxiety 30-40%), limit caffeine/alcohol, adequate sleep, stress management, mindfulness meditation
  - Avoid substances - alcohol (temporary relief followed by rebound anxiety), benzodiazepines long-term (dependence)
  - Treatment-resistant GAD - augment with atypical antipsychotic (quetiapine 50-300mg nightly), switch to different SSRI or SNRI, intensify psychotherapy
  - Taper medication slowly after 12 months remission - 25% decrease every 1-2 months (rapid taper causes withdrawal and relapse)
clinical_pearls:
  - GAD chronic and fluctuating course - symptoms wax and wane but persist years without treatment
  - Most patients have comorbid depression (60%) - SSRIs treat both
  - Worry content shifts over time (finances, health, relationships, world events) but excessive worry pattern consistent
  - Physical symptoms prominent - muscle tension (headache, back pain), GI symptoms (IBS overlap), fatigue
  - Children with GAD - excessive worry about performance, perfectionism, need reassurance
  - Distinguish from adjustment disorder (anxiety within 3 months of stressor, resolves within 6 months of stressor ending)
  - SSRI withdrawal syndrome - dizziness, paresthesias, flu-like symptoms (taper slowly to avoid)
differentials:
  - Major depressive disorder
  - Panic disorder
  - Social anxiety disorder
  - Obsessive-compulsive disorder
  - Hyperthyroidism
  - Substance use or withdrawal
trace:
  - 35-year-old woman presents with 18 months of constant worry about multiple things (finances, health, children's safety, work performance) → Worries most days, difficult to control → Feels on edge, fatigued, difficulty sleeping, muscle tension (neck and shoulders), difficulty concentrating at work → No specific triggers, not limited to social situations → GAD-7 score 16 (severe) → PHQ-9 score 14 (moderate depression) - comorbid MDD → TSH normal, no medical causes identified → Diagnose generalized anxiety disorder and major depressive disorder → Start sertraline 50mg daily → Refer to CBT therapist → Educate on 4-6 week lag for medication effect → Prescribe clonazepam 0.5mg BID PRN x 2 weeks for severe symptoms while SSRI takes effect → Follow-up 2 weeks - tolerating medication, used clonazepam 5 times, starting CBT → Increase sertraline to 100mg daily at week 4 → Discontinue clonazepam → GAD-7 score 9 (mild) and PHQ-9 score 7 (mild) at 8 weeks → Continues CBT weekly x 12 sessions → GAD-7 score 4 (minimal) at 6 months → Continues sertraline 100mg daily, uses CBT techniques for residual symptoms → Plans to continue medication x 12 months then taper
