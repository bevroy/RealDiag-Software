tree_id: CARDS-CARDIAC-TAMPONADE
name: Cardiac Tamponade
family: Cardiology
specialty: Cardiology
chief_complaint: Shortness of breath with low blood pressure
description: Life-threatening compression of heart by pericardial fluid causing decreased cardiac output and shock. Beck triad of hypotension, elevated JVP, and muffled heart sounds. Pulsus paradoxus diagnostic. Emergent pericardiocentesis life-saving.
icd10: I31.4
snomed: 35304003
urgency: emergent

workup:
  - Clinical presentation: hypotension, tachycardia, dyspnea, shock
  - Beck triad (classic but present in only 33%):
  - Hypotension: systolic BP below 90 mmHg
  - Elevated JVP: distended neck veins
  - Muffled heart sounds: fluid dampens heart sounds
  - Pulsus paradoxus (most specific finding):
  - Systolic BP drops over 10 mmHg with inspiration (exaggerated normal physiology)
  - Measure with BP cuff: inflate above systolic, slowly deflate, note pressure when first Korotkoff sounds heard only during expiration, continue deflating until sounds heard throughout respiratory cycle, difference over 10 mmHg diagnostic
  - Normal pulsus paradoxus below 10 mmHg
  - Tachycardia: compensatory response to maintain cardiac output
  - Tachypnea and dyspnea: pulmonary congestion
  - Causes:
  - Malignancy: lung, breast, lymphoma, melanoma (most common cause overall 50%)
  - Iatrogenic: post-cardiac catheterization, pacemaker lead perforation, central line
  - Aortic dissection: rupture into pericardium
  - Post-cardiac surgery: bleeding into pericardium
  - Uremia: end-stage renal disease
  - Myocardial rupture: post-MI (free wall rupture)
  - Trauma: penetrating or blunt chest trauma
  - Idiopathic pericarditis: large effusion progressing to tamponade
  - TB pericarditis: in endemic areas
  - Echocardiogram (diagnostic):
  - Large pericardial effusion (circumferential)
  - Right atrial collapse in systole (early sign)
  - Right ventricular collapse in diastole (more specific, later sign)
  - Plethoric IVC with no respiratory collapse
  - Exaggerated respiratory variation in mitral and tricuspid inflow (over 25%)
  - Swinging heart: heart moves within fluid
  - Electrical alternans on ECG: alternating QRS amplitude (heart swinging in fluid), low voltage
  - Right heart catheterization: equalization of diastolic pressures (RA = RV = PCWP), blunted y descent

treatment:
  - EMERGENT pericardiocentesis (life-saving):
  - Remove fluid to relieve pressure on heart
  - Subxiphoid approach (safest, ultrasound or fluoroscopy guided)
  - Immediate improvement in BP and cardiac output with even small volume removed (50-100 mL)
  - Send fluid for: cell count, Gram stain and culture, cytology, glucose, protein, LDH, adenosine deaminase (if TB suspected)
  - Leave pigtail catheter in place for continuous drainage
  - IV fluids (temporizing until pericardiocentesis):
  - Aggressive volume resuscitation: normal saline boluses
  - Increases preload, helps maintain cardiac output temporarily
  - Avoid positive pressure ventilation if possible: increases intrathoracic pressure, worsens tamponade
  - If intubation required, use lowest PEEP possible
  - Inotropes: dobutamine if hypotension persists, but NOT as effective as drainage
  - Surgical pericardial window: if recurrent tamponade, loculated effusion, or hemorrhagic effusion
  - Create opening in pericardium to drain fluid into pleural space or peritoneum
  - More definitive than pericardiocentesis for malignant effusions
  - Treat underlying cause:
  - Malignancy: chemotherapy, radiation, systemic therapy
  - TB: anti-TB therapy
  - Uremia: dialysis
  - Post-surgical bleeding: return to OR for exploration
  - Avoid diuretics: reduce preload, worsen hypotension

clinical_pearls:
  - Life-threatening emergency requiring urgent pericardiocentesis
  - Beck triad: hypotension, elevated JVP, muffled heart sounds (only 33% have all three)
  - Pulsus paradoxus over 10 mmHg most specific finding
  - RV diastolic collapse on echo highly specific
  - Malignancy most common cause (50%)
  - Even small fluid removal (50 mL) dramatically improves hemodynamics
  - IV fluids temporizing - definitive treatment is drainage
  - Electrical alternans on ECG (alternating QRS amplitude)
  - Amount of fluid does NOT correlate with tamponade (rapid accumulation of 200 mL worse than slow 2 L)

differentials:
  - Constrictive pericarditis: chronic, elevated JVP but NO pulsus paradoxus, pericardial thickening
  - Cardiogenic shock: hypotension but normal pericardium, wall motion abnormalities
  - Massive PE: hypotension, elevated JVP, but no pericardial effusion, RV strain on echo
  - Tension pneumothorax: hypotension, elevated JVP, absent breath sounds, hyperresonance
  - Septic shock: hypotension, tachycardia, but warm extremities, normal echo

trace: |
  A 62-year-old woman with metastatic lung cancer presented to ED with 2 days of progressive dyspnea and lightheadedness. Sitting upright in bed, appears distressed. BP 82/55 (hypotensive), HR 128 (tachycardic), RR 28 (tachypneic), O2 sat 92% on room air. Exam: elevated JVP 16 cm, distant muffled heart sounds, lungs clear, cool extremities (shock). Pulsus paradoxus measured: BP cuff inflated to 100 mmHg, slowly deflated, Korotkoff sounds first heard only during expiration at 82 mmHg, heard throughout respiratory cycle at 66 mmHg, pulsus paradoxus 16 mmHg (over 10 mmHg diagnostic for tamponade). ECG: sinus tachycardia, low voltage QRS, electrical alternans (alternating QRS amplitude beat-to-beat from heart swinging in fluid). STAT bedside echocardiogram: large circumferential pericardial effusion, right atrial collapse during systole, right ventricular diastolic collapse (highly specific for tamponade), plethoric IVC with no respiratory variation, exaggerated respiratory variation in mitral inflow over 40%. Diagnosed with cardiac tamponade from malignant pericardial effusion (known lung cancer, Beck triad, pulsus paradoxus 16 mmHg, RV collapse on echo). MEDICAL EMERGENCY. Bolused 1 L normal saline rapidly while preparing for pericardiocentesis. Urgent pericardiocentesis performed at bedside under ultrasound guidance (subxiphoid approach). Initial 100 mL bloody fluid removed: immediate improvement in BP to 105/68, HR decreased to 98, patient felt better instantly (even small volume relieves tamponade). Total 800 mL bloody fluid drained. Pigtail catheter left in place. Fluid studies: bloody, RBC 500000, exudative (protein 5.2, LDH 650), cytology positive for adenocarcinoma cells (malignant effusion from lung cancer). At 24 hours BP stable 118/75, HR 82, JVP normalized, no pulsus paradoxus. Repeat echo: minimal residual effusion, no tamponade physiology, RV no longer collapsed. Pigtail drained additional 300 mL over 24 hours then output minimal. Catheter removed at 48 hours. Oncology consulted: started systemic chemotherapy for lung cancer to prevent recurrence. Discussed pericardial window if recurrent tamponade (common with malignant effusions). At 1 week no reaccumulation on echo. Pericardiocentesis life-saving for cardiac tamponade.
