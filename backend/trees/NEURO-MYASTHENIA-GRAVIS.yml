tree_id: NEURO-MYASTHENIA-GRAVIS
name: Myasthenia Gravis
family: Neurology
specialty: Neurology
chief_complaint: Fluctuating muscle weakness, ptosis, diplopia
description: Autoimmune disorder causing muscle weakness due to antibodies blocking acetylcholine receptors at neuromuscular junction
icd10: G70.00
urgency: routine-to-emergency
workup:
  - Clinical presentation - fluctuating fatigable weakness
  - Ocular symptoms (85% present initially, 50% remain purely ocular)
  - Ptosis (droopy eyelids) - worse with sustained upgaze
  - Diplopia (double vision) - worse at end of day
  - Bulbar symptoms
  - Dysarthria (slurred speech), hypophonia (weak voice)
  - Dysphagia (difficulty swallowing) - risk of aspiration
  - Facial weakness (weak smile, difficulty closing eyes)
  - Limb weakness (proximal more than distal)
  - Difficulty lifting arms overhead, climbing stairs
  - Respiratory muscle weakness (myasthenic crisis) - life-threatening
  - Weakness fluctuates throughout day (worse with activity, improves with rest)
  - No sensory symptoms, no bowel/bladder involvement
  - Physical examination
  - Ptosis that worsens with sustained upgaze (60 seconds)
  - Fatigue with repetitive muscle testing
  - Normal reflexes (distinguishes from motor neuron disease)
  - Ice pack test - ptosis improves after placing ice on eyelid for 2 minutes (70% sensitive)
  - Laboratory studies
  - Acetylcholine receptor (AChR) antibodies - positive in 85% of generalized MG, 50% of ocular MG
  - Highly specific (greater than 98%)
  - MuSK (muscle-specific kinase) antibodies - positive in 40% of AChR-negative MG
  - LRP4 antibodies - another subset of seronegative MG
  - Thyroid function tests (hypothyroid or hyperthyroid can coexist)
  - Electrophysiologic testing
  - Repetitive nerve stimulation (RNS) - greater than 10% decrement in amplitude with 3 Hz stimulation (positive in 50-70%)
  - Single fiber EMG - most sensitive test (95%), shows increased jitter and blocking
  - Edrophonium (Tensilon) test - rarely used now (replaced by antibody testing)
  - Short-acting acetylcholinesterase inhibitor, improves symptoms within 1-2 minutes
  - Imaging
  - CT chest or MRI chest - evaluate for thymoma (10-15% of MG patients) or thymic hyperplasia (65%)
  - Thymoma present in 10-15% (higher risk if older, male, AChR antibody positive)
  - Pulmonary function testing if bulbar or respiratory symptoms
  - Forced vital capacity (FVC), negative inspiratory force (NIF) - assess respiratory strength
treatment:
  - Symptomatic treatment - acetylcholinesterase inhibitors
  - Pyridostigmine (Mestinon) 30-60 mg every 4-6 hours PO
  - Start 30 mg TID, titrate up to 60-120 mg 4-5 times daily (max 480-600 mg/day)
  - Improves symptoms within 30-60 minutes, duration 3-4 hours
  - Side effects - cholinergic (diarrhea, abdominal cramps, salivation, bradycardia)
  - Immunosuppressive therapy - for disease modification
  - Corticosteroids (prednisone) - first-line immunosuppression
  - Start 20 mg daily and increase gradually to 40-60 mg daily OR high-dose 60-80 mg daily
  - May cause initial worsening of weakness (avoid starting with high dose as outpatient)
  - Taper to lowest effective dose once remission achieved (usually 5-15 mg daily maintenance)
  - Steroid-sparing agents (for long-term control, reduce steroid exposure)
  - Azathioprine 2-3 mg/kg/day (100-200 mg daily) - takes 6-12 months for full effect
  - Mycophenolate mofetil 1000-1500 mg BID - alternative to azathioprine
  - Cyclosporine 3-5 mg/kg/day in divided doses
  - Tacrolimus 3-5 mg daily
  - Rapid immunomodulatory therapies (for exacerbations or preoperatively)
  - Intravenous immunoglobulin (IVIG) 2 g/kg total dose over 2-5 days
  - Onset of action 3-7 days, duration 4-8 weeks
  - Plasmapheresis - 5 exchanges over 7-14 days
  - Onset 1-3 days, duration 2-4 weeks
  - Thymectomy - recommended for patients age 15-65 with non-thymomatous MG
  - Improves outcomes, increases remission rate
  - Essential if thymoma present (tumor removal)
  - Novel biologics
  - Rituximab (anti-CD20) - for refractory MG, especially MuSK-positive
  - Eculizumab (complement inhibitor) - FDA approved for refractory AChR-positive generalized MG
  - Myasthenic crisis management (respiratory failure, FVC less than 15 mL/kg, NIF less than 20 cmH2O)
  - ICU admission, mechanical ventilation if needed
  - IVIG or plasmapheresis urgently
  - Hold or reduce cholinesterase inhibitors temporarily
  - Identify and treat triggers (infection most common)
  - Avoid medications that worsen MG - aminoglycosides, fluoroquinolones, beta-blockers, magnesium
clinical_pearls:
  - Prevalence 150-250 per million, female-to-male ratio 3:2, bimodal age distribution (20-40 and 60-80 years)
  - Hallmark - fluctuating fatigable weakness that worsens with activity and improves with rest
  - Ocular symptoms almost always present at some point (90% of patients)
  - Purely ocular MG (50% of cases) - if remains ocular only for 2 years, unlikely to generalize
  - Myasthenic crisis - 15-20% of patients, mortality 5% with modern care
  - Triggers for exacerbation - infections, surgery, medications, pregnancy, thyroid dysfunction
  - Associated autoimmune diseases common - thyroid disease (10%), lupus, rheumatoid arthritis
  - Thymoma associated with more severe disease and other autoimmune conditions (Good syndrome)
  - Seronegative MG (15%) - negative AChR and MuSK antibodies, diagnosis clinical and EMG
  - Avoid drugs that worsen MG - aminoglycosides, fluoroquinolones, macrolides, beta-blockers, magnesium, d-penicillamine
  - Neonatal MG - transient weakness in 10-20% of babies born to mothers with MG (maternal antibodies cross placenta)
differentials:
  - Lambert-Eaton myasthenic syndrome (LEMS) - proximal weakness improves with activity, reduced reflexes, associated with small cell lung cancer
  - Botulism (descending paralysis, dilated pupils, recent canned food exposure)
  - Amyotrophic lateral sclerosis (ALS) - fasciculations, upper and lower motor neuron signs, no fluctuation
  - Multiple sclerosis (sensory symptoms, internuclear ophthalmoplegia, white matter lesions on MRI)
  - Brain stem stroke (sudden onset, associated symptoms, imaging findings)
  - Thyroid ophthalmopathy (exophthalmos, abnormal thyroid function)
  - Chronic progressive external ophthalmoplegia (CPEO) - mitochondrial myopathy, no fluctuation
  - Oculopharyngeal muscular dystrophy (late age of onset, dysphagia, family history)
trace:
  - 32-year-old woman presents with 4-month history of droopy eyelids and double vision
  - Ptosis bilateral but asymmetric, right worse than left
  - Symptoms worse at end of day, better in morning after sleep
  - Double vision particularly problematic when driving in evening
  - Recent onset of difficulty chewing food during meals (jaw fatigue)
  - Voice becomes nasal and slurred when talking for prolonged periods
  - Denies limb weakness, no difficulty walking or climbing stairs
  - No dysphagia, no shortness of breath
  - Past medical history - hypothyroidism on levothyroxine
  - Family history - mother has rheumatoid arthritis
  - Physical exam - appears well, normal vitals
  - Cranial nerves - bilateral ptosis right greater than left, worsens with sustained upgaze for 60 seconds
  - Diplopia on lateral gaze
  - Facial weakness (unable to bury eyelashes, weak smile)
  - Slurred speech after counting to 100
  - Motor - strength 5/5 all extremities, normal bulk and tone
  - Reflexes 2+ symmetric, plantar responses flexor
  - No sensory deficits, coordination intact
  - Ice pack test - ptosis improved significantly after 2 minutes ice on right eyelid
  - Labs - acetylcholine receptor (AChR) antibody positive, elevated titer 45 nmol/L (normal less than 0.4)
  - TSH 2.4 mIU/L (normal), free T4 normal
  - Repetitive nerve stimulation - 15% decrement with 3 Hz stimulation on facial nerve (positive for neuromuscular junction disorder)
  - CT chest with contrast - thymic hyperplasia, no thymoma
  - Diagnosis - Myasthenia gravis, generalized (ocular plus bulbar symptoms)
  - Treatment initiated
  - Pyridostigmine 60 mg TID, increase to QID if needed
  - Prednisone 20 mg daily (low-dose initiation to avoid initial worsening)
  - Azathioprine 100 mg daily started concurrently as steroid-sparing agent
  - Neurology follow-up in 2 weeks
  - 2-week follow-up - significant improvement with pyridostigmine
  - Ptosis much better, double vision occasional
  - Tolerating medications, mild diarrhea from pyridostigmine (manageable)
  - Increase prednisone to 40 mg daily
  - Continue azathioprine, monitor CBC and LFTs monthly
  - 6-week follow-up - continued improvement
  - Ptosis minimal, no double vision
  - Speech and chewing normal
  - No side effects from medications
  - Continue current regimen
  - 3-month follow-up - near complete resolution of symptoms
  - Able to work full day without symptoms
  - Begin prednisone taper - decrease to 35 mg daily
  - Continue azathioprine (takes 6-12 months for full effect)
  - 6-month follow-up - excellent control, minimal symptoms
  - Prednisone tapered to 15 mg daily
  - Azathioprine at full effect now
  - Pyridostigmine reduced to 60 mg TID
  - 1-year follow-up - in clinical remission (minimal manifestation status)
  - Prednisone 10 mg daily maintenance
  - Azathioprine 100 mg daily
  - Pyridostigmine PRN only (uses 1-2 times per week)
  - Discussed thymectomy - patient elects to defer given excellent control
  - Outcome - Excellent response to medical therapy, in remission
