nodes:
  - id: pulmonary_hypertension_presentation
    type: question
    text: "Clinical classification?"
    options:
      - label: "Group 1 - Pulmonary arterial hypertension (PAH)"
        next: pah_management
      - label: "Group 2 - PH due to left heart disease"
