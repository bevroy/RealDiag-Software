tree_id: DERM-SEBORRHEIC-DERMATITIS
name: Seborrheic Dermatitis
family: Dermatology
specialty: Dermatology
chief_complaint: Scaly rash on scalp and face
description: Chronic inflammatory skin condition affecting sebaceous gland-rich areas (scalp, face, chest) causing greasy yellowish scales and erythema. Antifungal shampoos and topical steroids control symptoms but condition tends to recur.
icd10: L21.9
snomed: 86708008
presentations:
  - Greasy, yellowish scales
  - Erythematous plaques
  - Scalp (dandruff), face (eyebrows, nasolabial folds), chest
  - Pruritus variable
  - Chronic, relapsing course
  - Worse in winter, stress
urgency: non-urgent

referrals:
  emergency:
    - Suspected necrotizing fasciitis
    - Stevens-Johnson syndrome/TEN
    - Anaphylaxis
  urgent:
    - Suspected melanoma
    - Rapidly growing lesion
    - Severe drug reaction
    - Suspected malignancy
  routine:
    - Chronic dermatitis management
    - Acne unresponsive to treatment
    - Cosmetic concerns
    - Mole surveillance

workup:
  - Clinical diagnosis: greasy yellowish scales with erythema in sebaceous gland-rich areas
  - Common locations: scalp (dandruff), eyebrows, nasolabial folds, ears, central chest, intertriginous areas
  - Scalp: flaking and scaling (dandruff), may have erythema and pruritus
  - Face: erythematous patches with greasy scales in eyebrows, nasolabial folds, glabella
  - Infants: cradle cap (thick greasy yellow scales on scalp)
  - Associated with: Malassezia yeast overgrowth (normal skin flora), worsened by stress, cold dry weather, neurologic conditions (Parkinson disease)
  - Chronic relapsing course: symptoms wax and wane, often worse in winter
  - No lab testing needed: clinical diagnosis
  - Biopsy: only if diagnosis uncertain (shows spongiosis, parakeratosis)
  - Rule out psoriasis: well-demarcated plaques with silvery scales (vs greasy yellow scales)

treatment:
  - Scalp treatment (first-line): medicated shampoos used 2-3 times weekly
  - Ketoconazole 2% shampoo: antifungal most effective (targets Malassezia yeast), lather and leave on 5 minutes then rinse
  - Selenium sulfide 2.5% shampoo: antifungal and keratolytic
  - Zinc pyrithione 1-2% shampoo: antifungal (over-the-counter, Head & Shoulders)
  - Coal tar shampoo: anti-inflammatory and keratolytic (Neutrogena T/Gel)
  - Salicylic acid shampoo: keratolytic helps remove scales
  - Rotate shampoos if one loses effectiveness
  - Facial treatment: gentle cleansing, avoid harsh soaps
  - Ketoconazole 2% cream: apply to affected areas twice daily x2-4 weeks
  - Topical corticosteroids: hydrocortisone 1% cream (face) or desonide 0.05% cream twice daily x1-2 weeks for flares (short-term only, avoid long-term on face)
  - Calcineurin inhibitors: tacrolimus 0.1% or pimecrolimus 1% cream twice daily (steroid-sparing, safe for long-term facial use)
  - Body/chest: ketoconazole 2% shampoo used as body wash or selenium sulfide lotion
  - Maintenance: continue medicated shampoos 1-2 times weekly to prevent recurrence
  - Lifestyle: manage stress, adequate sleep, sunlight may improve (UV has anti-inflammatory effect)

clinical_pearls:
  - Greasy yellowish scales in sebaceous areas (scalp, eyebrows, nasolabial folds, chest)
  - Chronic relapsing condition - maintenance therapy needed
  - Ketoconazole 2% shampoo most effective - lather and leave on 5 minutes
  - Use medicated shampoos 2-3 times weekly for treatment, 1-2 times weekly for maintenance
  - Topical steroids short-term for flares only - avoid chronic facial use
  - Calcineurin inhibitors safe for long-term facial use
  - Worse in winter, stress, Parkinson disease
  - Dandruff is mild form affecting scalp only

differentials:
  - Psoriasis: well-demarcated thick plaques with silvery scales, extensor surfaces (elbows, knees), nail pitting
  - Atopic dermatitis: flexural involvement, personal/family history atopy, dry skin, intense pruritus
  - Tinea capitis: focal hair loss, broken hairs, KOH prep shows fungal hyphae, more common children
  - Contact dermatitis: pruritic, acute onset after exposure to allergen or irritant, distribution matches exposure

trace: |
  A 35-year-old man presented with 2 years of scalp flaking and facial rash. Scalp showed diffuse fine white flakes (dandruff) with mild erythema. Face showed erythematous patches with greasy yellowish scales in eyebrows bilaterally, nasolabial folds, and glabella. Mild pruritus. Symptoms worse in winter months. Using regular shampoo and over-the-counter dandruff shampoo with minimal improvement. Exam confirmed seborrheic dermatitis scalp and face. Started ketoconazole 2% shampoo three times weekly (lather, leave on scalp 5 minutes, rinse). Ketoconazole 2% cream to facial lesions twice daily. Hydrocortisone 1% cream to face twice daily x1 week for inflammation then discontinue. At 2 weeks scalp flaking reduced 70%, facial lesions improved 60%. At 4 weeks scalp clear, facial lesions 90% resolved. Continued ketoconazole shampoo twice weekly maintenance, discontinued facial cream. At 3 months scalp remains clear, face occasional mild flare in winter managed with short course ketoconazole cream. Counseled on chronic relapsing nature and importance of maintenance medicated shampoo to prevent recurrence.

