tree_id: PEDS-AUTISM
name: Autism Spectrum Disorder (Encounter)
family: pediatrics
specialty: Pediatrics/Developmental-Behavioral Pediatrics/Psychiatry
icd10: F84.0
snomed: 408856003
urgency:
  - Self-injurious behavior causing harm
  - Severe aggression toward others
  - Elopement (running away) with safety concerns
  - Suicidal ideation (older children and adolescents)
  - Severe regression with loss of skills
homeopathy: []
presentations:
  - Social communication deficits (persistent across contexts)
  - Reduced or absent eye contact
  - Not responding to name when called
  - Limited social-emotional reciprocity (lack of back-and-forth conversation)
  - Difficulty understanding and using nonverbal communication (gestures, facial expressions)
  - Difficulty developing and maintaining peer relationships
  - Lack of interest in sharing interests or achievements with others
  - Limited imaginative or pretend play
  - Restricted, repetitive patterns of behavior, interests, or activities
  - Repetitive motor movements (hand flapping, spinning, rocking)
  - Insistence on sameness, inflexible adherence to routines
  - Distress with changes or transitions
  - Highly restricted, fixated interests (abnormal in intensity or focus)
  - Hyper- or hypo-reactivity to sensory input (covering ears, seeking sensory input, indifferent to pain/temperature)
  - Delayed or absent speech development
  - Echolalia (repeating words or phrases)
  - Unusual prosody (monotone, sing-song speech)
  - Parental concerns about development or behavior
  - Regression (loss of previously acquired language or social skills) in 25-30% of cases
  - Symptoms present in early developmental period (usually recognized by age 2-3 years)
  - Family history of autism or developmental delays
workup:
  - Autism-specific screening
  - Universal autism screening at 18 and 24 months per AAP guidelines
  - Modified Checklist for Autism in Toddlers, Revised with Follow-Up (M-CHAT-R/F)
  - 20-item parent questionnaire
  - Positive screen requires follow-up interview
  - Sensitivity 85%, specificity 99%
  - Screen earlier if parental concerns or developmental surveillance concerning
  - Screen siblings of children with autism (recurrence risk 10-20%)
  - Positive screen requires comprehensive diagnostic evaluation
  - Developmental and medical history
  - Onset of concerns (early onset versus regressive)
  - Regression: loss of language or social skills (25-30% of cases, typically 15-24 months)
  - Social-communication development
  - Response to name, eye contact, social smile, joint attention (pointing to share interest)
  - Babbling, first words, phrase speech
  - Imaginative play, imitation of others
  - Peer relationships
  - Repetitive behaviors and restricted interests
  - Repetitive motor movements (flapping, spinning, toe-walking)
  - Preoccupation with specific topics or objects (trains, letters, spinning wheels)
  - Routines and rituals, distress with changes
  - Sensory sensitivities (covers ears, avoids textures, seeks movement)
  - Prenatal and perinatal history
  - Maternal infections, medications, complications
  - Prematurity, birth asphyxia
  - Advanced parental age (increased risk)
  - Associated features
  - Intellectual disability (comorbid in 30-40%)
  - ADHD symptoms (comorbid in 50-70%)
  - Anxiety (common)
  - Sleep problems (insomnia, frequent night wakings)
  - Feeding problems (food selectivity, texture aversion)
  - GI symptoms (constipation, diarrhea) - more common in autism
  - Seizures (epilepsy in 20-30%, especially if intellectual disability)
  - Family history
  - Autism (recurrence risk 10-20% for siblings, 50% for monozygotic twins)
  - Developmental delays, intellectual disability
  - Psychiatric disorders (ADHD, anxiety, depression)
  - School and social history
  - Daycare or school performance and behavior
  - Special education services or supports
  - Peer interactions and friendships
  - Family stressors and supports
  - Physical examination
  - Growth parameters (head circumference - macrocephaly in 20%, associated with regression)
  - Dysmorphic features (if present, consider genetic syndrome)
  - Fragile X: large ears, long face, macroorchidism post-puberty
  - Tuberous sclerosis: ash-leaf spots, shagreen patches, facial angiofibromas
  - Skin examination (neurocutaneous stigmata)
  - Neurologic examination
  - Assess for hypotonia, hyperreflexia, toe-walking
  - Look for tics, stereotypies
  - Behavioral observation during visit (CRITICAL)
  - Observe social interaction with parent and examiner
  - Eye contact, response to name, joint attention
  - Language use (verbal versus nonverbal, echolalia)
  - Play skills (functional versus repetitive)
  - Response to changes or transitions during visit
  - Repetitive behaviors (hand flapping, spinning)
  - Hearing evaluation (ESSENTIAL)
  - Rule out hearing loss as cause of language delay
  - Comprehensive audiology evaluation
  - Do NOT assume child has autism without checking hearing
  - Diagnostic criteria (DSM-5)
  - Persistent deficits in social communication and social interaction (all 3 required)
  - Deficits in social-emotional reciprocity
  - Deficits in nonverbal communicative behaviors
  - Deficits in developing/maintaining relationships
  - Restricted, repetitive patterns of behavior, interests, or activities (at least 2 of 4)
  - Stereotyped or repetitive motor movements, speech, or use of objects
  - Insistence on sameness, inflexible routines, ritualized patterns
  - Highly restricted, fixated interests abnormal in intensity or focus
  - Hyper- or hypo-reactivity to sensory input
  - Symptoms present in early developmental period (may not fully manifest until social demands exceed capacities)
  - Symptoms cause clinically significant impairment
  - Not better explained by intellectual disability or global developmental delay (though can co-occur)
  - Severity levels (based on support needs)
  - Level 1: Requiring support
  - Level 2: Requiring substantial support
  - Level 3: Requiring very substantial support
  - Diagnostic evaluation
  - Comprehensive diagnostic evaluation by experienced clinician (developmental-behavioral pediatrician, child psychiatrist, psychologist)
  - Gold standard diagnostic tools (requires specialized training)
  - Autism Diagnostic Observation Schedule, Second Edition (ADOS-2) - structured play-based assessment
  - Autism Diagnostic Interview-Revised (ADI-R) - structured parent interview
  - Childhood Autism Rating Scale (CARS-2)
  - Cognitive and adaptive testing
  - IQ testing (assess for intellectual disability - comorbid in 30-40%)
  - Adaptive behavior assessment (Vineland-3, ABAS-3)
  - Speech-language evaluation (language and communication skills)
  - Occupational therapy evaluation (sensory processing, fine motor, daily living skills)
  - Medical workup for autism
  - Hearing evaluation (comprehensive audiology) - MANDATORY
  - Lead screening if not done or risk factors
  - Genetic testing (recommended for all with autism)
  - Chromosomal microarray (first-line, diagnostic yield 10-15%)
  - Fragile X testing (especially boys, family history)
  - Consider whole exome sequencing if microarray negative
  - Genetic counseling and evaluation if dysmorphic features
  - MRI brain NOT routinely indicated
  - Consider if microcephaly, macrocephaly, focal neurologic signs, regression, seizures
  - EEG NOT routinely indicated
  - Consider if history of seizures, staring spells, or regression
  - Metabolic testing NOT routinely indicated
  - Consider if developmental regression, family history, or specific clinical features
treatment:
  - Early intensive behavioral interventions (MOST IMPORTANT)
  - Applied Behavior Analysis (ABA) - evidence-based, gold standard
  - Intensive (20-40 hours/week optimal)
  - Discrete trial training, natural environment teaching
  - Positive reinforcement, structured teaching
  - Improves language, social skills, adaptive behavior, reduces problem behaviors
  - Start as early as possible (age 2-3 years ideal)
  - Early intervention services (birth to age 3 years)
  - Federal mandate (IDEA Part C) for children with developmental delays
  - Multidisciplinary services in natural environment
  - Speech therapy, occupational therapy, developmental therapy
  - Individualized Family Service Plan (IFSP)
  - Transition to preschool special education at age 3 years
  - School-based services (age 3 years and older)
  - Individualized Education Program (IEP) under IDEA (autism eligibility category)
  - Free appropriate public education in least restrictive environment
  - Special education, speech-language therapy, occupational therapy, social skills groups
  - Autism-specific classrooms or inclusion with supports
  - Speech-language therapy
  - Augmentative and alternative communication (AAC) if nonverbal or minimally verbal
  - Picture Exchange Communication System (PECS)
  - Speech-generating devices
  - Pragmatic language skills (social communication)
  - Occupational therapy
  - Sensory integration therapy
  - Fine motor skills, self-care skills
  - Social skills training
  - Structured social skills groups
  - Peer-mediated interventions
  - Video modeling
  - Parent training and support
  - Parent-mediated interventions (teach parents to use behavioral strategies)
  - Parent support groups
  - Respite care
  - Medication (for comorbid symptoms, NOT core autism symptoms)
  - NO FDA-approved medications for core social-communication deficits
  - Irritability, aggression, self-injury
  - Risperidone (FDA-approved for irritability in autism, age 5-16 years)
  - Starting dose: 0.25-0.5 mg/day, titrate to 0.5-3 mg/day divided 1-2 times
  - Side effects: weight gain, sedation, hyperprolactinemia, metabolic syndrome
  - Monitor: weight, BMI, prolactin, glucose, lipids
  - Aripiprazole (FDA-approved for irritability in autism, age 6-17 years)
  - Starting dose: 2 mg/day, titrate to 5-15 mg/day
  - Side effects: similar to risperidone but less weight gain
  - ADHD symptoms (comorbid in 50-70%)
  - Stimulants (methylphenidate, amphetamine) - lower response rate than typical ADHD, more side effects
  - Atomoxetine, guanfacine, clonidine
  - Anxiety
  - SSRIs (fluoxetine, sertraline) - use cautiously, may cause activation
  - CBT (if verbal and cognitively able)
  - Sleep problems
  - Melatonin 1-6 mg at bedtime (evidence-based for sleep onset insomnia in autism)
  - Sleep hygiene, behavioral interventions
  - Complementary and alternative therapies
  - Many tried by families, limited evidence
  - Melatonin for sleep (evidence-based)
  - Omega-3 fatty acids, probiotics (minimal benefit)
  - Avoid unproven therapies: chelation, hyperbaric oxygen, stem cells (potentially harmful)
  - Gluten-free casein-free diet not supported by evidence
  - Addressing comorbidities
  - Treat seizures (antiepileptic medications)
  - Manage GI symptoms (constipation common)
  - Address feeding problems (feeding therapy)
  - Transition planning (adolescence)
  - Vocational training, life skills
  - Guardianship and future planning
  - Adult services and supports
clinical_pearls:
  - 'Autism is clinical diagnosis: persistent social-communication deficits + restricted/repetitive behaviors present in early development'
  - 'Screen all children at 18 and 24 months with M-CHAT-R/F per AAP - early identification critical'
  - 'Hearing evaluation MANDATORY for any child with speech delay or suspected autism - rule out hearing loss first'
  - 'Early intensive behavioral interventions (ABA, 20-40 hours/week) are evidence-based and improve outcomes - start as early as age 2'
  - 'Genetic testing (chromosomal microarray, fragile X) recommended for all children diagnosed with autism - diagnostic yield 10-15%'
  - 'High comorbidity: intellectual disability (30-40%), ADHD (50-70%), anxiety, seizures (20-30%)'
  - 'NO medications treat core social-communication deficits - medications only for comorbid symptoms (irritability, ADHD, anxiety, sleep)'
  - 'Regression (loss of language or social skills) occurs in 25-30% of children with autism, typically 15-24 months'
referrals:
  - Developmental-behavioral pediatrics or child psychiatry for comprehensive diagnostic evaluation (ADOS-2, ADI-R)
  - Audiology for comprehensive hearing evaluation (MANDATORY)
  - Early intervention program (birth to age 3 years) for multidisciplinary services
  - Applied Behavior Analysis (ABA) provider for intensive behavioral intervention
  - Speech-language pathology for communication evaluation and therapy, AAC if needed
  - Occupational therapy for sensory processing and adaptive skills evaluation
  - Genetics and genetic counseling for genetic testing and counseling
  - Neurology if seizures, regression, or abnormal neurologic exam
differentials:
  - Autism spectrum disorder (social-communication deficits + restricted/repetitive behaviors)
  - Global developmental delay (delay in multiple domains without specific autism features)
  - Intellectual disability (low IQ and adaptive functioning, but social skills relatively preserved)
  - Speech-language disorder (isolated language delay without social deficits or repetitive behaviors)
  - Hearing loss (can mimic autism - always rule out)
  - Social (pragmatic) communication disorder (social-communication deficits WITHOUT repetitive behaviors)
  - ADHD (inattention, hyperactivity, impulsivity, but social reciprocity intact)
  - Anxiety disorder (social avoidance due to anxiety, but desire for social interaction present)
  - Selective mutism (speaks in certain settings, not pervasive communication deficit)
  - Reactive attachment disorder (social neglect/deprivation, improves with nurturing environment)
  - Genetic syndromes: fragile X (most common single-gene cause), tuberous sclerosis, Rett syndrome (girls with regression)
