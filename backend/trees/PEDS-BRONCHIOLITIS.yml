tree_id: PEDS-BRONCHIOLITIS
name: Bronchiolitis
family: Pulmonology
specialty: Pediatrics
chief_complaint: Cough, wheezing, respiratory distress in infant
description: Viral lower respiratory tract infection causing inflammation and obstruction of small airways in infants
icd10: J21.9
snomed: 4120002
presentations:
  - Respiratory distress in infant <2 years
  - Wheezing, crackles
  - Tachypnea, retractions
  - Feeding difficulty
  - Preceding URI symptoms
  - Respiratory syncytial virus (RSV) most common
urgency: urgent-to-emergency
referrals:
  emergency:
    - Respiratory distress
    - Altered mental status
    - Sepsis
    - Severe dehydration
    - Status epilepticus
  urgent:
    - Failure to thrive
    - Suspected child abuse
    - Developmental delay
    - New-onset seizure
  routine:
    - Well-child care
    - ADHD management
    - Asthma management
    - Growth concerns

workup:
  - Clinical diagnosis based on history and physical examination
  - Age less than 2 years (peak 2-6 months)
  - Prodrome of upper respiratory symptoms (rhinorrhea, cough) followed by wheezing, tachypnea, respiratory distress
  - Physical examination - tachypnea, retractions (subcostal, intercostal, suprasternal), nasal flaring, wheezing, crackles
  - Respiratory rate assessment (normal 0-2 mo less than 60, 2-12 mo less than 50, 1-5 yr less than 40 breaths/min)
  - Pulse oximetry - oxygen saturation (hypoxemia if less than 90%)
  - Assess hydration status (decreased oral intake, urine output)
  - Respiratory syncytial virus (RSV) testing by PCR or rapid antigen (not required for management but useful for cohorting)
  - Chest X-ray only if atypical presentation, severe disease, or concern for complication
  - Findings - hyperinflation, peribronchial thickening, atelectasis, patchy infiltrates
  - Viral panel (influenza, coronavirus, metapneumovirus, parainfluenza) if indicated
  - ABG only if severe respiratory failure
  - No routine laboratory testing needed for typical bronchiolitis
treatment:
  - Supportive care is mainstay - hydration and oxygenation
  - Supplemental oxygen if SpO2 less than 90% (or less than 92% if high risk)
  - Nasal suctioning (bulb or mechanical) before feeds and as needed
  - Hydration - encourage oral feeds if tolerating, IV fluids if dehydrated or unable to feed
  - Close monitoring for worsening respiratory distress
  - Admission criteria - SpO2 less than 90% on room air, respiratory distress (moderate-severe retractions, RR greater than 70), dehydration, apnea, age less than 3 months, prematurity, chronic lung/heart disease, immunodeficiency
  - High-flow nasal cannula (HFNC) for moderate-severe respiratory distress not responding to standard oxygen
  - CPAP or mechanical ventilation for respiratory failure
  - Trial of nebulized albuterol or epinephrine acceptable (continue only if clear response)
  - NO proven benefit - corticosteroids, antibiotics (unless bacterial superinfection), chest physiotherapy
  - Hypertonic saline nebulization may reduce hospital stay (3% saline nebulized)
  - Antipyretics for fever (acetaminophen, ibuprofen if greater than 6 months)
  - Prevention - palivizumab (Synagis) prophylaxis for high-risk infants during RSV season
  - Premature infants less than 29 weeks, chronic lung disease, hemodynamically significant heart disease
clinical_pearls:
  - Most common lower respiratory infection in infants, peak age 2-6 months
  - RSV causes 50-80% of cases, others - rhinovirus, metapneumovirus, parainfluenza, influenza
  - Seasonal pattern - winter months (November-March in northern hemisphere)
  - Most cases mild and self-limited, 2-3% require hospitalization
  - Apnea can occur especially in young infants less than 2 months or premature infants
  - Wheezing in infant less than 12 months with viral URI = bronchiolitis until proven otherwise
  - First episode of wheezing in previously healthy infant - bronchiolitis most likely
  - Recurrent wheezing episodes suggest alternative diagnosis (asthma, aspiration, cardiac disease)
  - No benefit from bronchodilators, corticosteroids, or antibiotics in typical bronchiolitis
  - Duration - symptoms peak at day 3-5, most improve by 7-10 days, cough can persist 2-4 weeks
differentials:
  - Asthma exacerbation (older child, recurrent episodes, family history, response to bronchodilators)
  - Pneumonia (fever, focal findings, infiltrate on X-ray)
  - Foreign body aspiration (sudden onset, unilateral wheezing, history of choking)
  - Congestive heart failure (tachycardia out of proportion, hepatomegaly, murmur)
  - Pertussis (paroxysmal cough, post-tussive emesis, inspiratory whoop)
  - Cystic fibrosis (failure to thrive, chronic symptoms, recurrent infections)
  - Aspiration (feeding difficulties, recurrent episodes)
trace:
  - 4-month-old previously healthy infant presents to ED with 3-day history of cough and difficulty breathing
  - Started with runny nose and low-grade fever 5 days ago
  - Over last 2 days developed worsening cough, wheezing, poor feeding (taking 50% of usual volume)
  - Parents report rapid breathing, appears to be working hard to breathe
  - No vomiting, normal urine output so far, no apnea episodes
  - Born full-term, no prenatal or birth complications, up to date on vaccinations
  - Older sibling has cold symptoms
  - Physical exam - vitals temp 38.1C, HR 165, RR 68, SpO2 88% on room air
  - Appears moderate distress, nasal flaring, subcostal and intercostal retractions
  - Lungs - diffuse expiratory wheezing bilaterally, scattered crackles, prolonged expiratory phase
  - No stridor, good air entry bilaterally
  - Cardiovascular exam normal, no hepatomegaly
  - Mucous membranes moist, anterior fontanelle soft and flat
  - RSV PCR positive
  - Diagnosis - Moderate bronchiolitis due to RSV
  - Admission criteria met (age less than 6 months, SpO2 less than 90%, tachypnea, moderate distress, decreased oral intake)
  - Admitted to pediatric ward
  - Treatment - supplemental oxygen via nasal cannula to maintain SpO2 greater than 90%
  - Nasogastric tube placed for hydration and nutrition (unable to feed adequately)
  - Frequent nasal suctioning before NG feeds
  - Trial of nebulized epinephrine 0.5 mL of racemic epinephrine - minimal response, not continued
  - Supportive care with close monitoring
  - Day 2 of hospitalization - continued tachypnea RR 60-70, SpO2 92-94% on 1L nasal cannula
  - Day 3 - slight improvement, RR 55-60, weaned to 0.5L oxygen, taking some PO feeds
  - Day 4 - significant improvement, RR 50, SpO2 95% on room air, tolerating full PO feeds
  - Discharged home day 5 with close outpatient follow-up
  - 2-week follow-up - complete resolution, back to baseline
  - Outcome - Typical course of moderate bronchiolitis, full recovery with supportive care
