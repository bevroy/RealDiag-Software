tree_id: ID-TRICHOMONIASIS
name: Trichomoniasis (Trichomonas vaginalis)
family: infectious_disease
specialty: Infectious Disease
icd10: A59.9
snomed: 79782009
urgency: []
homeopathy: []
presentations:
  - Copious frothy yellow-green vaginal discharge
  - Vulvovaginal irritation and pruritus
  - Dysuria or urinary frequency
  - Vaginal odor (foul-smelling)
  - Dyspareunia (painful intercourse)
  - Strawberry cervix (colpitis macularis) on exam
  - Vulvar erythema and edema
  - Asymptomatic in 70% of men, 50% of women
  - Male partners may have urethritis or prostatitis
  - Post-coital spotting
workup:
  - NAAT (nucleic acid amplification test) - most sensitive (95% sensitivity)
  - Vaginal swab, endocervical swab, or urine (women)
  - Urine or urethral swab (men)
  - Wet mount microscopy - motile trichomonads (sensitivity only 50-70%)
  - Vaginal pH typically >4.5 (normal 3.8-4.5)
  - Point-of-care rapid antigen tests available (moderate sensitivity)
  - Culture if available (high sensitivity but slow, 3-7 days)
  - Test for co-infections: gonorrhea, chlamydia, HIV, syphilis
  - Pregnancy test in women of reproductive age
treatment:
  - First-line: Metronidazole 2 g PO single dose
  - Alternative: Tinidazole 2 g PO single dose (better efficacy, fewer side effects)
  - Alternative: Metronidazole 500 mg PO BID x 7 days (if single dose fails)
  - Pregnancy: Metronidazole 2 g PO single dose (safe in all trimesters)
  - Avoid alcohol during treatment and 24 hours after metronidazole (72 hours after tinidazole)
  - Treat all sexual partners simultaneously (even if asymptomatic)
  - Abstain from sexual activity until patient and partners complete treatment
  - Test of cure 3-4 weeks after treatment in women (high recurrence rate)
  - Reinfection common (17% within 3 months) - retest at 3 months
  - Treatment failure: Metronidazole 500 mg PO BID x 7 days or Tinidazole 2 g PO daily x 7 days
  - Persistent failure: Consider susceptibility testing and ID consultation
clinical_pearls:
  - "Most common non-viral STI worldwide (156 million new cases/year)"
  - "Increases risk of HIV acquisition 2-3 fold and facilitates HIV transmission"
  - "Associated with adverse pregnancy outcomes (preterm birth, low birth weight, PROM)"
  - "Strawberry cervix (punctate hemorrhages) pathognomonic but only seen in 2% of cases"
  - "Men are usually asymptomatic carriers but can transmit infection"
  - "Routine screening not recommended except in high-risk populations (HIV+, incarcerated women)"
  - "Metronidazole resistance rare (<5%) but increasing"
  - "Trichomonas can persist in male urethra and prostate - treat partners even if asymptomatic"
  - "Whiff test may be positive (fishy odor) but less specific than for bacterial vaginosis"
  - "Copious discharge differentiates from bacterial vaginosis (thin discharge) and candidiasis (thick discharge)"
referrals:
  - Infectious Disease for treatment failures or resistant infections
  - Gynecology for recurrent infections or complications
  - Public Health for partner notification (some jurisdictions)
  - HIV testing and counseling services if HIV-positive
differentials:
  - Bacterial vaginosis (thin gray discharge, pH >4.5, clue cells, less inflammation)
  - Vulvovaginal candidiasis (thick white discharge, pH <4.5, severe pruritus)
  - Gonorrhea or chlamydia cervicitis (mucopurulent discharge, test simultaneously)
  - Aerobic vaginitis (purulent discharge, severe inflammation, parabasal cells)
  - Atrophic vaginitis (postmenopausal, thin vaginal mucosa, pH >5.0)
  - Foreign body (retained tampon) - foul odor, non-infectious
trace:
  source: CDC Sexually Transmitted Infections Treatment Guidelines 2021
