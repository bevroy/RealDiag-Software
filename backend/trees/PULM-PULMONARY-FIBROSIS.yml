tree_id: PULM-PULMONARY-FIBROSIS
name: Pulmonary Fibrosis (Idiopathic Pulmonary Fibrosis)
family: pulmonology
specialty: Pulmonology
icd10: J84.112
snomed: 28168000
urgency: moderate
homeopathy: []
presentations:
  - Progressive exertional dyspnea (cardinal symptom)
  - Chronic dry cough (non-productive)
  - Fatigue and exercise intolerance
  - Inspiratory crackles (Velcro-like) on lung auscultation (bilateral basilar)
  - Digital clubbing (25-50% of patients)
  - Cyanosis in advanced disease
  - Weight loss
  - Typical patient - age >50, male, smoking history
  - Symptoms insidious onset over months to years
  - Family history of interstitial lung disease (5-20% familial)
workup:
  - High-resolution CT chest (diagnostic test of choice)
  - Usual interstitial pneumonia (UIP) pattern diagnostic for IPF
  - Subpleural, basilar predominant fibrosis
  - Honeycombing (cystic spaces)
  - Traction bronchiectasis
  - Absence of features suggesting alternative diagnosis (nodules, ground-glass, lymphadenopathy)
  - Pulmonary function tests
  - Restrictive pattern - reduced TLC, FVC, and FEV1 (FEV1/FVC ratio normal or increased)
  - Reduced DLCO (diffusion capacity) - earliest and most sensitive finding
  - Severity staging based on FVC and DLCO
  - Six-minute walk test - assess functional capacity and desaturation
  - Arterial blood gas - assess for hypoxemia and A-a gradient
  - Complete blood count, comprehensive metabolic panel
  - Autoimmune serology - ANA, RF, anti-CCP, myositis panel (rule out CTD-ILD)
  - Surgical lung biopsy (VATS) if HRCT pattern indeterminate
  - Shows UIP pattern histologically
  - Generally avoided if typical UIP pattern on HRCT in appropriate clinical context
  - Echocardiogram - assess for pulmonary hypertension (complication)
treatment:
  - Antifibrotic therapy (slows disease progression, doesn't reverse fibrosis)
  - Nintedanib 150mg PO BID (tyrosine kinase inhibitor)
  - Reduces FVC decline by 50%
  - Side effects - diarrhea (60%), nausea, elevated liver enzymes
  - Pirfenidone 801mg PO TID (anti-inflammatory and antifibrotic)
  - Reduces FVC decline and mortality
  - Side effects - nausea, photosensitivity, rash
  - Both drugs show similar efficacy, choice based on side effect profile
  - Supportive care
  - Supplemental oxygen for hypoxemia (maintain SpO2 >90%)
  - Home oxygen if resting SpO2 ≤88% or exercise desaturation
  - Pulmonary rehabilitation - improves exercise tolerance and quality of life
  - Influenza and pneumococcal vaccination
  - Aggressive management of GERD (common comorbidity, may worsen IPF)
  - Avoid immunosuppression (steroids, azathioprine) - ineffective and harmful
  - Lung transplantation evaluation for appropriate candidates
  - Referral if age <65, FVC <80%, or DLCO <40%
  - Median survival 3-5 years after transplant
  - Palliative care for symptom management and end-of-life planning
  - Opioids for dyspnea, cough suppressants, anxiolytics
clinical_pearls:
  - IPF is most common idiopathic interstitial pneumonia (IIP)
  - Median survival 3-5 years from diagnosis without treatment
  - Acute exacerbations occur in 10-15% annually (rapid respiratory decline, high mortality 50-90%)
  - Triggered by infection, aspiration, procedures, or idiopathic
  - Treatment - high-dose steroids, supportive care, often futile
  - Smoking increases IPF risk 2-fold (but not contraindication to antifibrotics)
  - Lung cancer risk 7x higher in IPF patients (annual low-dose CT screening)
  - Pulmonary hypertension develops in 30-50%, poor prognostic sign
  - Ground-glass opacities NOT typical for IPF - suggests alternative ILD
  - Honeycomb cysts differentiate IPF from other fibrotic lung diseases
  - Poor prognostic factors - older age, male sex, severe physiologic impairment, pulmonary hypertension
referrals:
  - Pulmonology for diagnosis confirmation and initiation of antifibrotic therapy
  - ILD specialist at tertiary center for complex cases
  - Lung transplant center if age <65 and progressive disease
  - Palliative care for symptom management and goals of care discussion
  - Pulmonary rehabilitation program
differentials:
  - Idiopathic pulmonary fibrosis (UIP pattern)
  - Connective tissue disease-ILD (scleroderma, rheumatoid arthritis, myositis)
  - Hypersensitivity pneumonitis (exposure history, centrilobular nodules)
  - Non-specific interstitial pneumonia (NSIP) - better prognosis than IPF
  - Sarcoidosis (lymphadenopathy, upper lobe predominance)
  - Drug-induced pneumonitis (amiodarone, methotrexate, nitrofurantoin)
  - Asbestosis (occupational exposure, pleural plaques)
  - Radiation pneumonitis (history of chest radiation)
  - Chronic aspiration (GERD, dysphagia)
