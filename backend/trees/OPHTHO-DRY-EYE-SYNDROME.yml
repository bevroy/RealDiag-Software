trace:
  - 62-year-old woman presents with 6-month history of gritty, burning eyes, worse at end of day and with computer use. Slit-lamp exam shows reduced tear meniscus and corneal punctate staining. Schirmer test shows 6mm in 5 minutes bilaterally. Diagnose moderate dry eye syndrome. Start preservative-free artificial tears q3h and lubricating ointment at bedtime. Recommend warm compresses for meibomian gland dysfunction. Symptoms improve 50% in 2 weeks. Continue artificial tears maintenance therapy.
