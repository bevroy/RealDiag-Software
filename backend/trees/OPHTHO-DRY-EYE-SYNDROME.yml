tree_id: OPHTHO-DRY-EYE-SYNDROME
name: Dry Eye Syndrome (Keratoconjunctivitis Sicca)
version: '1.0'
status: draft
family: ophthalmology
specialty: Ophthalmology
secondary_specialties:
  - Primary Care
urgency: routine
urgency_explanation: ''
chief_complaint: Dry, gritty eyes, eye discomfort
description: |
  Dry eye syndrome results from inadequate tear production or excessive tear evaporation leading to ocular surface inflammation.
  Common causes include aging, medications, autoimmune diseases (Sjögren's syndrome), environmental factors, and meibomian gland dysfunction.
applies_to:
  sex: null
  age_min: null
  age_max: null
codes:
  icd10:
    - H04.12
  snomed:
    - '46152009'
  icpc2: []
sources:
  - text: American Academy of Ophthalmology Dry Eye Guidelines
    origin: citations
  - text: UpToDate - Ophthalmology
    origin: citations
presentations:
  - Dry, gritty sensation in eyes
  - Burning or stinging eyes
  - Foreign body sensation
  - Eye redness
  - Blurred vision (improves with blinking)
  - Excessive tearing (paradoxical reflex tearing)
  - Eye fatigue
  - Sensitivity to light (photophobia)
  - Difficulty wearing contact lenses
  - Symptoms worse at end of day or with prolonged screen use
differentials:
  - Blepharitis
  - Conjunctivitis
  - Meibomian gland dysfunction
  - Sjögren's syndrome
  - Medication side effect
  - Environmental factors
workup:
  - History - duration, symptoms, aggravating factors, medications, medical conditions
  - Slit-lamp examination - tear film quality, corneal staining with fluorescein
  - Schirmer test - measure tear production (abnormal less than 10mm in 5 minutes)
  - Tear breakup time - assess tear film stability (abnormal less than 10 seconds)
  - Meibomian gland evaluation - check for gland dysfunction
  - Screen for systemic disease - Sjögren's syndrome (SS-A, SS-B antibodies, ANA, RF)
treatment:
  first_line:
    - Artificial tears - preservative-free preferred, use q2-4h as needed
    - Lubricating ointment at bedtime
    - Environmental modifications - humidifier, reduce screen time, take breaks, avoid wind/fans
    - Warm compresses and eyelid hygiene for meibomian gland dysfunction
  second_line:
    - Cyclosporine 0.05% ophthalmic emulsion (Restasis) BID - reduces inflammation
    - Lifitegrast 5% ophthalmic solution (Xiidra) BID - inhibits inflammation
    - Omega-3 fatty acid supplements
  advanced:
    - Punctal plugs - block tear drainage to retain tears on ocular surface
    - Autologous serum eye drops
    - Scleral contact lenses
  treat_underlying_cause:
    - Adjust medications if possible (antihistamines, decongestants, antidepressants)
    - Manage autoimmune disease
clinical_pearls:
  - Very common condition, especially in older adults and postmenopausal women
  - Paradoxical tearing occurs because poor tear quality triggers reflex tearing
  - Screen time and low humidity environments worsen symptoms
  - Many medications cause or worsen dry eye
  - Sjögren's syndrome should be considered in severe cases or with systemic symptoms
  - Artificial tears are first-line but need frequent application
