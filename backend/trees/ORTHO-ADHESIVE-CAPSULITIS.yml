tree_id: ORTHO-ADHESIVE-CAPSULITIS
name: Adhesive Capsulitis (Frozen Shoulder)
family: orthopedics
specialty: Orthopedics
icd10: M75.00
snomed: 399114005
urgency: []
homeopathy: []
presentations:
  - Progressive loss of both active and passive shoulder range of motion
  - Severe shoulder pain, especially at night
  - Inability to reach overhead, behind back, or across body
  - Difficulty with daily activities (dressing, reaching, grooming)
  - External rotation most limited, then abduction, then internal rotation
  - Insidious onset over weeks to months
  - Three phases: freezing (pain), frozen (stiffness), thawing (gradual improvement)
  - Risk factors: diabetes (20-30% prevalence), thyroid disease, prolonged immobilization
  - More common in women age 40-60
workup:
  - Clinical diagnosis based on characteristic loss of passive range of motion
  - Physical examination
  - Restricted passive range of motion (key diagnostic feature)
  - External rotation most affected (often <30 degrees)
  - Abduction limited (<90 degrees)
  - Internal rotation limited (unable to reach behind back)
  - Pain at end range of motion
  - No weakness (strength testing limited by pain and stiffness)
  - Glenohumeral joint feels "frozen" with passive movement
  - Imaging
  - X-rays (AP, axillary, scapular Y) to rule out other pathology
  - Usually normal in adhesive capsulitis
  - Rules out arthritis, calcific tendinitis, tumor
  - MRI rarely needed but shows thickened joint capsule, contracted axillary recess
  - Laboratory tests
  - Fasting glucose or HbA1c (screen for diabetes if not already diagnosed)
  - TSH (screen for thyroid disease)
treatment:
  - Conservative management (mainstay of treatment)
  - Physical therapy
  - Gentle stretching exercises (pendulum, wall walks, pulley exercises)
  - Avoid aggressive stretching early (worsens inflammation)
  - Progress gradually as pain improves
  - Focus on maintaining range, not forcing it initially
  - Home exercise program essential (2-3 times daily)
  - NSAIDs for pain control
  - Ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Most effective during painful "freezing" phase
  - Heat before stretching, ice after exercises
  - Intra-articular corticosteroid injection
  - Very effective for pain relief in freezing phase
  - Allows better participation in PT
  - Triamcinolone 40 mg or methylprednisolone 80 mg into glenohumeral joint
  - Can repeat in 4-6 weeks if partial response
  - Best results in first 6 months (freezing phase)
  - Oral corticosteroids
  - Prednisone taper for refractory pain (20-30 mg daily x 2-3 weeks)
  - Short-term use in selected patients
  - Advanced interventions (if conservative fails)
  - Hydrodilatation (distension arthrography) - inject saline to distend capsule
  - Manipulation under anesthesia (MUA) - forced passive stretching
  - Arthroscopic capsular release - surgical division of contracted capsule
  - Reserved for refractory cases >6-12 months
  - Natural history: self-limited, resolves in 18-24 months (avg) without treatment
  - Earlier treatment accelerates recovery
clinical_pearls:
  - "Adhesive capsulitis is 'frozen shoulder' - restricted passive and active ROM"
  - "Three phases: freezing (painful), frozen (stiff), thawing (recovery) - 12-18 months total"
  - "Diabetes major risk factor - 20-30% of diabetics develop frozen shoulder"
  - "Loss of passive external rotation is hallmark finding (most sensitive test)"
  - "Distinguish from impingement: impingement has painful arc but normal passive ROM"
  - "Self-limited condition - most resolve in 18-24 months, but recovery can be slow"
  - "Corticosteroid injection most helpful in early freezing phase (first 6 months)"
  - "Aggressive early stretching may worsen inflammation - start gentle"
referrals:
  - Physical therapy for stretching and range of motion exercises (essential)
  - Orthopedic shoulder specialist if no improvement after 3-6 months of PT
  - Consider referral earlier if refractory pain or rapid loss of motion
  - Endocrinology if newly diagnosed diabetes
differentials:
  - Adhesive capsulitis (restricted passive ROM, gradual onset, no specific trauma)
  - Rotator cuff tear (weakness, may have full passive ROM)
  - Shoulder impingement (painful arc, normal passive ROM)
  - Glenohumeral arthritis (X-ray shows joint space narrowing, osteophytes)
  - Calcific tendinitis (severe pain, calcium deposit on X-ray)
  - Cervical radiculopathy (neck pain, neurologic deficits)
  - Brachial plexopathy (neurologic deficits, weakness)
  - Malignancy (Pancoast tumor) - progressive symptoms, constitutional symptoms
trace:
  source: AAOS Clinical Practice Guidelines on Adhesive Capsulitis 2019, Cochrane Review on Frozen Shoulder
  version: '1.0'
  last_updated: '2025-12-26'
