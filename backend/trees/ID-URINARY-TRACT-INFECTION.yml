tree_id: ID-URINARY-TRACT-INFECTION
name: Urinary Tract Infection
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Dysuria and urinary frequency
description: Bacterial infection of urinary tract causing dysuria, frequency, urgency, and suprapubic pain, most commonly caused by Escherichia coli

icd10: N39.0

urgency: urgent

workup:
  - Clinical presentation uncomplicated cystitis (bladder infection): dysuria, urinary frequency, urgency, suprapubic discomfort, hematuria, no fever or flank pain, women of childbearing age most common
  - Clinical presentation pyelonephritis (kidney infection): fever, chills, flank pain, CVA tenderness, nausea, vomiting, may have dysuria/frequency (lower tract symptoms)
  - Risk factors: female sex (short urethra), sexual activity, diaphragm/spermicide use, menopause, pregnancy, diabetes, urinary catheter, anatomic abnormalities, recent antibiotics
  - Complicated UTI: male, pregnancy, immunosuppression, urinary tract abnormality, catheter-associated, recent instrumentation, hospital-acquired
  - Urinalysis: pyuria (WBC greater than 10 per HPF), bacteriuria, positive leukocyte esterase, positive nitrites (gram-negative bacteria), hematuria common
  - Urine culture: not needed for uncomplicated cystitis in women (treat empirically), indicated if pyelonephritis, complicated UTI, pregnancy, treatment failure, recurrent UTI
  - Urine culture results: greater than 100,000 CFU/mL diagnostic, 1000-100,000 CFU/mL with symptoms significant, Escherichia coli most common (80 percent), also Klebsiella, Proteus, Enterococcus, Staphylococcus saprophyticus
  - Blood cultures if pyelonephritis or sepsis
  - Imaging: not routinely needed, renal ultrasound or CT if pyelonephritis not improving after 48-72 hours antibiotics (rule out abscess or obstruction)

treatment:
  - Uncomplicated cystitis in women: oral antibiotics x 3-5 days, nitrofurantoin 100 mg BID x 5 days (first-line, low resistance), trimethoprim-sulfamethoxazole DS BID x 3 days (if local resistance less than 20 percent), fosfomycin 3 grams single dose, fluoroquinolones (ciprofloxacin 250 mg BID x 3 days, levofloxacin 250 mg daily x 3 days) reserve for complicated UTI due to resistance concerns and side effects
  - Phenazopyridine (urinary analgesic) 200 mg TID x 2 days PRN for dysuria (does NOT treat infection, symptomatic relief only)
  - Cystitis in men (always considered complicated): oral antibiotics x 7 days, fluoroquinolone (ciprofloxacin 500 mg BID or levofloxacin 500 mg daily) or trimethoprim-sulfamethoxazole DS BID, obtain urine culture
  - Pregnancy: nitrofurantoin 100 mg BID x 5-7 days (avoid in first trimester and near term), amoxicillin-clavulanate 500/125 mg BID x 5-7 days, cephalexin 500 mg QID x 5-7 days, obtain urine culture
  - Asymptomatic bacteriuria: do NOT treat (except pregnancy and before urologic procedures), treatment increases resistance without benefit
  - Acute uncomplicated pyelonephritis outpatient: fluoroquinolone (ciprofloxacin 500 mg BID x 7 days or levofloxacin 750 mg daily x 5 days) or ceftriaxone 1 gram IV/IM single dose followed by oral cephalosporin or fluoroquinolone x 7 days total
  - Acute pyelonephritis requiring hospitalization: IV antibiotics (ceftriaxone 1-2 grams daily, ciprofloxacin 400 mg every 12 hours, cefepime 1-2 grams every 12 hours if Pseudomonas risk, add ampicillin if Enterococcus suspected), switch to oral when afebrile x 24-48 hours, total 7-14 days
  - Catheter-associated UTI: remove or change catheter if possible, antibiotics x 7 days if symptomatic (dysuria, fever, flank pain), do NOT treat asymptomatic bacteriuria with catheter
  - Recurrent UTI (3 or more UTIs per year): consider prophylaxis (nitrofurantoin 50-100 mg daily or TMP-SMX SS daily or post-coital), topical estrogen if postmenopausal, evaluate for anatomic abnormalities if recurrent pyelonephritis

clinical_pearls:
  - Dysuria plus frequency plus urgency in women classic for cystitis
  - Escherichia coli causes 80 percent of UTIs
  - Uncomplicated cystitis in women treat empirically without culture (nitrofurantoin first-line x 5 days)
  - Pyelonephritis has fever and flank pain (requires 7-14 days antibiotics, may need hospitalization)
  - UTI in men always complicated (requires 7 days antibiotics and urine culture)
  - Do NOT treat asymptomatic bacteriuria (except pregnancy and before urologic procedures)
  - Fluoroquinolones increasingly resistant, reserve for complicated UTI or pyelonephritis

differentials:
  - Urethritis (STI) - dysuria but no frequency/urgency, urethral discharge, sexually active, test for gonorrhea/chlamydia
  - Vaginitis (yeast, bacterial vaginosis, trichomoniasis) - dysuria external, vaginal discharge, pruritus, no frequency
  - Interstitial cystitis (painful bladder syndrome) - chronic pelvic pain, frequency, urgency, sterile urine
  - Nephrolithiasis (kidney stone) - severe flank pain, hematuria, no fever, CT shows stone

trace:
  - 32-year-old healthy woman presents with 1 day dysuria, urinary frequency (every hour), urgency, suprapubic discomfort, denies fever, flank pain, vaginal discharge
  - History: sexually active, no recent antibiotics, no prior UTIs
  - Exam: afebrile, suprapubic tenderness, no CVA tenderness, pelvic exam normal (no discharge)
  - Urinalysis: WBC 50-100 per HPF (pyuria), positive leukocyte esterase, positive nitrites, moderate bacteria, RBC 10-25 per HPF (hematuria)
  - Diagnosis: acute uncomplicated cystitis
  - Urine culture not sent (uncomplicated cystitis in woman, treat empirically)
  - Started nitrofurantoin 100 mg BID x 5 days, phenazopyridine 200 mg TID x 2 days PRN dysuria
  - Counseling: complete full antibiotic course, increase fluids, urinate after intercourse (reduces UTI risk)
  - 24 hours: dysuria significantly improved, frequency decreased
  - 3 days: symptoms 90 percent resolved, completed antibiotics day 5
  - Follow-up call day 7: complete resolution, no further symptoms
  - Counseling prevention: hydration, urinate after intercourse, consider post-coital prophylaxis if recurrent
  - No recurrence at 6 months
