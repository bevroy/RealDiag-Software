tree_id: CARDS-WPW-SYNDROME
name: Wolff-Parkinson-White Syndrome (WPW)
family: Cardiology
specialty: Cardiology
chief_complaint: Rapid regular heart rate with palpitations
description: Accessory pathway causing pre-excitation (delta wave, short PR, wide QRS) and predisposing to AVRT and atrial fibrillation with rapid ventricular response. Risk of sudden death if AFib conducts rapidly down accessory pathway. Catheter ablation curative.
icd10: I45.6
snomed: 74390002
urgency: urgent

workup:
  - Symptoms: from tachyarrhythmias using accessory pathway
  - Palpitations: AVRT (AV reentrant tachycardia) most common
  - Dyspnea, chest discomfort, lightheadedness during tachycardia
  - Syncope: if very rapid AFib with pre-excitation
  - Sudden cardiac death: rare but possible if AFib conducts rapidly down accessory pathway (over 250 bpm) degenerates to VF
  - Often asymptomatic: WPW pattern on ECG without symptoms (no tachycardia episodes)
  - ECG in sinus rhythm (diagnostic WPW pattern):
  - Short PR interval: under 120 ms (accessory pathway conducts faster than AV node)
  - Delta wave: slurred upstroke of QRS from ventricular pre-excitation
  - Wide QRS: over 120 ms (fusion of pre-excited and normal conduction)
  - Pseudo-infarction pattern: Q waves or poor R wave progression (mimics old MI)
  - Accessory pathway location determines delta wave polarity:
  - Left lateral: most common, positive delta in V1
  - Posterior septal: negative delta in II, III, aVF
  - Right lateral: negative delta in I, aVL
  - Arrhythmias:
  - AVRT (AV reentrant tachycardia): 90% of tachycardias in WPW
  - Orthodromic: narrow complex, antegrade down AV node, retrograde up accessory pathway (most common 90%)
  - Antidromic: wide complex, antegrade down accessory pathway, retrograde up AV node (10%, mimics VT)
  - Atrial fibrillation: 10-30% of WPW patients
  - Pre-excited AFib: irregular wide complex tachycardia with varying QRS morphology (accessory pathway conducts AFib rapidly)
  - Shortest pre-excited RR interval under 250 ms indicates high-risk pathway (risk sudden death)
  - Atrial flutter: less common
  - Risk stratification:
  - High risk: aborted sudden death, syncope, shortest pre-excited RR under 250 ms, multiple accessory pathways
  - Symptomatic: recurrent AVRT
  - Asymptomatic: incidental WPW pattern, no tachycardia episodes
  - EP study: map accessory pathway, assess refractory period, risk stratification

treatment:
  - Acute management of AVRT:
  - Orthodromic AVRT (narrow complex):
  - Vagal maneuvers: Valsalva, carotid massage
  - Adenosine 6-12 mg IV: terminates by blocking AV node (safe in orthodromic)
  - Calcium channel blockers or beta blockers
  - Cardioversion if unstable
  - Antidromic AVRT (wide complex):
  - DO NOT give adenosine if unsure (may precipitate AFib)
  - Procainamide: blocks accessory pathway
  - Cardioversion if unstable
  - Pre-excited atrial fibrillation (irregular wide complex):
  - DO NOT use AV nodal blockers: adenosine, beta blockers, calcium channel blockers, digoxin
  - Blocking AV node increases conduction down accessory pathway, can accelerate to VF
  - Procainamide or ibutilide: block accessory pathway (first-line)
  - Cardioversion: if unstable
  - Catheter ablation (definitive treatment):
  - Curative in over 95% (gold standard)
  - Indications:
  - Class I: symptomatic WPW (AVRT episodes)
  - Class I: high-risk features (aborted sudden death, syncope, pre-excited AFib)
  - Class IIa: asymptomatic WPW with high-risk occupation (pilot, driver) or athlete
  - Class IIb: asymptomatic WPW (individualized decision)
  - Procedure: map and ablate accessory pathway with radiofrequency energy
  - Success rate over 95%, recurrence under 5%
  - Complications: AV block (1% risk for septal pathways), tamponade, stroke (rare)
  - Chronic medical management (if ablation not pursued):
  - Antiarrhythmics: flecainide, propafenone (block accessory pathway)
  - Avoid digoxin alone: shortens accessory pathway refractory period (dangerous if AFib develops)
  - Beta blockers or calcium channel blockers: for orthodromic AVRT but do NOT prevent pre-excited AFib
  - Asymptomatic WPW:
  - Risk stratification: EP study or exercise stress test (loss of delta wave with exercise suggests low-risk pathway)
  - Young patients and athletes: consider ablation
  - Older asymptomatic patients: observation acceptable

clinical_pearls:
  - Short PR (under 120 ms), delta wave (slurred QRS upstroke), wide QRS
  - AVRT most common arrhythmia (narrow complex orthodromic 90%)
  - Pre-excited AFib dangerous: irregular wide complex, do NOT give AV nodal blockers (use procainamide)
  - Catheter ablation curative over 95% success
  - Ablate if symptomatic or high-risk features
  - Avoid adenosine, beta blockers, calcium channel blockers, digoxin in pre-excited AFib (can accelerate to VF)

differentials:
  - Bundle branch block: wide QRS but no short PR or delta wave
  - Ventricular tachycardia: wide complex tachycardia but no accessory pathway on baseline ECG
  - AVNRT: narrow complex tachycardia but no pre-excitation on baseline ECG
  - LGL syndrome: short PR but no delta wave (different accessory pathway)

trace: |
  A 22-year-old college student presented to ED with palpitations x2 hours. Sudden onset rapid regular heart rate (abrupt onset - classic for AVRT), chest discomfort, dyspnea, anxiety. Similar episodes x3 times over past 2 years, previously self-terminated. No syncope, no family history sudden death. Exam: BP 110/75, HR 185 regular, no murmurs, no heart failure signs. ECG during tachycardia: regular narrow complex tachycardia rate 185 bpm, no visible P waves (buried in QRS or T wave - consistent with orthodromic AVRT). Attempted vagal maneuvers (modified Valsalva): no response. Adenosine 6 mg IV rapid push: transient AV block, tachycardia terminated immediately (confirms diagnosis of AVRT involving AV node in circuit). Converted to normal sinus rhythm rate 75 bpm. Post-conversion ECG: short PR interval 90 ms (normal 120-200, under 120 diagnostic), prominent delta wave (slurred upstroke of QRS - ventricular pre-excitation), wide QRS 130 ms, positive delta wave in V1 (suggests left lateral accessory pathway - most common location). Diagnosed with Wolff-Parkinson-White syndrome (short PR, delta wave, wide QRS = WPW pattern) with orthodromic AVRT (narrow complex tachycardia terminated by adenosine). Symptomatic WPW with recurrent AVRT episodes. Risk stratification discussed: no syncope or cardiac arrest (lower risk), but symptomatic with recurrent tachycardia (quality of life impaired), young and active college student. Catheter ablation curative treatment recommended (class I indication for symptomatic WPW, over 95% success rate). Patient prefers definitive treatment over daily medications. Admitted for EP study and ablation. EP study: confirmed left lateral accessory pathway (consistent with ECG), orthodromic AVRT easily induced, shortest pre-excited RR interval during induced AFib 320 ms (over 250 ms lower risk - accessory pathway refractory period over 250 ms unlikely to cause sudden death even if AFib develops). Underwent radiofrequency catheter ablation: mapped left lateral accessory pathway at mitral annulus, successful ablation. Post-ablation: no inducible AVRT, loss of delta wave and pre-excitation on ECG (successful ablation). PR interval normalized to 160 ms, QRS narrowed to 90 ms (no longer pre-excited). Procedure uncomplicated, discharged same day. At 1 week: no palpitations, ECG shows normal PR interval and no delta wave (cured). At 1 month: asymptomatic, no recurrence. At 1 year: no AVRT episodes, no palpitations, completely cured. Ablation success rate over 95%, recurrence under 5%. Excellent outcome, no medications needed, can participate in all activities without restrictions. WPW cured by catheter ablation.
