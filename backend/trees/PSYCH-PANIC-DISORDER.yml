tree_id: PSYCH-PANIC-DISORDER
name: Panic Disorder
family: Psychiatry
specialty: Psychiatry
icd10:
- F41.0
- F40.01
snomed:
- '371631005'
urgency: medium
description: Comprehensive evaluation and management of Panic Disorder
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Recurrent unexpected panic attacks: Sudden surge of intense fear/discomfort, peaks
  within minutes'
- Palpitations, sweating, trembling, shortness of breath, chest pain
- Nausea, dizziness, chills, paresthesias
- Fear of losing control, "going crazy," or dying
- Derealization (feeling of unreality) or depersonalization
- Persistent concern about additional panic attacks or consequences (≥1 month)
- Avoidance of situations that might trigger attacks (agoraphobia common)
workup:
- ECG (rule out arrhythmia)
- TSH (hyperthyroidism)
- Urine drug screen (stimulants, caffeine excess)
- 'Consider: Holter monitor if palpitations, metanephrines (pheochromocytoma)'
treatment:
- 'Guideline-based treatment options for Panic Disorder include:'
- 'SSRI: Sertraline 50-200mg daily or paroxetine 20-60mg daily (first-line) (APA 2022)'
- 'Benzodiazepine PRN: Clonazepam 0.5-1mg or alprazolam 0.5-1mg (acute attacks only,
  avoid daily use) (APA 2022)'
- 'CBT: Exposure therapy, interoceptive exposure, cognitive restructuring (12-16 sessions)
  (APA 2022)'
- 'Breathing techniques: Slow diaphragmatic breathing during attacks (APA 2022)'
- Taper benzos after SSRI effective (4-6 weeks) (APA 2022)
clinical_pearls:
- 'Rule out medical causes: Hyperthyroidism, arrhythmia, pheochromocytoma, substance
  use'
- 'SSRIs first-line: Sertraline, paroxetine, fluoxetine (take 4-6 weeks for effect)'
- 'Benzodiazepines PRN for acute attacks: Clonazepam 0.5-1mg or alprazolam 0.5-1mg
  (short-term only)'
- 'CBT very effective: Interoceptive exposure (deliberately induce physical sensations),
  cognitive restructuring'
- '30-50% develop agoraphobia: Avoidance of public places where escape difficult'
referrals:
- Psychiatry if treatment-resistant or severe agoraphobia
- Psychologist for CBT
differentials:
  - Generalized anxiety disorder
  - Cardiac arrhythmia
  - Hyperthyroidism
  - Asthma
  - PTSD
trace:
  source: American Psychiatric Association (APA) Practice Guidelines, DSM-5-TR Diagnostic
    Criteria
