name: Endometriosis Evaluation
family: OBSTETRICS_GYNECOLOGY
specialty: Gynecology, Reproductive Endocrinology
chief_complaint: Pelvic Pain, Dysmenorrhea, Dyspareunia, Infertility
description: Evaluation and management of endometriosis
