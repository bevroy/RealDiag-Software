tree_id: OBGYN-ENDOMETRIOSIS
name: Endometriosis
family: Obstetrics and Gynecology
specialty: Gynecology
chief_complaint: Pelvic pain and painful periods
description: Presence of endometrial-like tissue outside the uterus causing chronic pelvic pain, dysmenorrhea, dyspareunia, and infertility. Medical suppression or surgical excision improve symptoms and fertility.
icd10: N80.9
snomed: 129103003
presentations:
  - Cyclic pelvic pain (worse with menses)
  - Dysmenorrhea, dyspareunia
  - Infertility
  - Dyschezia (painful bowel movements)
  - Chronic pelvic pain
  - Adnexal masses (endometriomas)
urgency: non-urgent

workup:
  - Clinical diagnosis: classic triad of dysmenorrhea (painful periods), dyspareunia (painful intercourse), and chronic pelvic pain in reproductive-age woman
  - Laparoscopy with biopsy: gold standard for definitive diagnosis, visualize endometrial implants (powder-burn lesions, chocolate cysts), obtain histologic confirmation
  - Pelvic exam: may reveal fixed retroverted uterus, nodularity in posterior cul-de-sac, adnexal masses
  - Transvaginal ultrasound: detect endometriomas (ovarian chocolate cysts), deep infiltrating endometriosis
  - MRI: superior for deep infiltrating disease, rectovaginal involvement, presurgical planning
  - CA-125: often elevated but nonspecific, not useful for diagnosis but may track disease activity
  - Rule out other causes: STI testing, urinalysis (exclude infection), consider pelvic inflammatory disease, ovarian cysts
  - Empiric medical trial reasonable: if clinical suspicion high, can treat empirically without laparoscopy

treatment:
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID for pain (first-line for mild symptoms)
  - Combined oral contraceptives: continuous or extended cycle (skip placebo weeks) suppresses menstruation and reduces pain
  - Progestins: norethindrone 5 mg daily, medroxyprogesterone 10 mg daily, or depot medroxyprogesterone 150 mg IM every 3 months (very effective)
  - GnRH agonists: leuprolide 3.75 mg IM monthly or 11.25 mg every 3 months creates medical menopause, add-back therapy (estrogen/progestin) reduces bone loss and hot flashes, limit 6-12 months
  - GnRH antagonist: elagolix daily oral, fewer side effects than agonists
  - Levonorgestrel IUD (Mirena): local progestin effect reduces dysmenorrhea and bleeding
  - Laparoscopic surgery: excision or ablation of endometriotic lesions, lysis of adhesions, ovarian cystectomy for endometriomas (improves pain and fertility)
  - Surgery indications: failed medical management, large endometriomas >4 cm, severe symptoms, infertility
  - Hysterectomy with bilateral salpingo-oophorectomy: definitive treatment if childbearing complete and refractory to other treatments
  - Infertility management: surgical excision improves natural conception, IVF very effective

clinical_pearls:
  - Classic triad: dysmenorrhea, dyspareunia, chronic pelvic pain in reproductive-age woman
  - Laparoscopy with biopsy gold standard but can treat empirically if high clinical suspicion
  - Medical management first-line: NSAIDs, continuous OCPs, or progestins
  - GnRH agonists very effective but limit 6-12 months (bone loss), use add-back therapy
  - Surgery if medical management fails or infertility
  - Endometriomas (chocolate cysts) classic ovarian finding
  - 30-50% of infertile women have endometriosis
  - Symptoms improve with pregnancy and menopause (estrogen-dependent disease)

differentials:
  - Adenomyosis: endometrial tissue within myometrium, diffusely enlarged tender uterus, heavy menstrual bleeding
  - Pelvic inflammatory disease: acute pelvic pain, fever, cervical motion tenderness, STI risk factors
  - Ovarian cysts: usually asymptomatic, may cause acute pain if rupture or torsion
  - Irritable bowel syndrome: abdominal pain and bloating, bowel habit changes, no dysmenorrhea or dyspareunia

trace: |
  A 32-year-old nulliparous woman presented with 5 years of progressively worsening pelvic pain, severe dysmenorrhea requiring days off work, deep dyspareunia, and 18 months of infertility. Pain worst during and after menses, some relief with ibuprofen but inadequate. Pelvic exam revealed tender nodularity in posterior cul-de-sac. Transvaginal ultrasound showed 4 cm right ovarian endometrioma. Diagnosed with presumed endometriosis. Initially tried continuous combined OCPs for 6 months with some improvement but persistent moderate pain. Patient desired pregnancy, so referred to gynecologic surgeon for diagnostic laparoscopy which confirmed stage III endometriosis with bilateral endometriomas, peritoneal implants, and adhesions. Underwent laparoscopic excision of endometriotic lesions, right ovarian cystectomy, left ovarian drainage, adhesiolysis. Pathology confirmed endometriosis. Postoperatively pain significantly improved. At 3 months attempting conception. At 8 months conceived naturally, successful pregnancy and delivery. At 18 months postpartum on Mirena IUD for contraception and endometriosis suppression, minimal pain, excellent quality of life.
