tree_id: ORTHO-TRIGGER-FINGER
name: Trigger Finger (Stenosing Tenosynovitis)
family: Orthopedics
specialty: Orthopedics
chief_complaint: Finger catches and locks when bending
description: Flexor tendon sheath inflammation causing finger to catch or lock with flexion and extension. Corticosteroid injection curative in 60-90%, surgery definitive if injection fails.
icd10: M65.30
snomed: 367566005
presentations:
  - Finger catching, locking, snapping
  - Painful clicking with flexion/extension
  - Tender nodule over A1 pulley (palm)
  - Morning stiffness
  - Difficulty extending finger
  - Most common: thumb, ring, middle fingers
urgency: non-urgent

referrals:
  emergency:
    - Open fracture
    - Compartment syndrome
    - Neurovascular injury
  urgent:
    - Closed fracture
    - Joint dislocation
    - Septic arthritis
  routine:
    - Chronic joint pain
    - Osteoarthritis
    - Sports injury

workup:
  - Clinical diagnosis: finger catches or locks with flexion and extension, requires other hand to straighten finger
  - Painful clicking or snapping: felt at base of affected finger or thumb
  - Palpable nodule: thickened A1 pulley at metacarpophalangeal joint (base of finger)
  - Tenderness: volar aspect of MCP joint
  - Severity grading: Grade I (pain, history of catching), Grade II (demonstrable catching), Grade III (locking, passively correctable), Grade IV (fixed flexion contracture)
  - Most common: ring finger, followed by thumb, middle finger
  - Risk factors: diabetes mellitus (30% of diabetics develop trigger finger), rheumatoid arthritis, age 40-60, repetitive gripping, women more than men
  - Bilateral involvement: common especially in diabetics
  - No imaging needed: clinical diagnosis
  - X-ray only if trauma suspected or to rule out other pathology

treatment:
  - Conservative management (mild cases): rest, activity modification, splinting
  - Splinting: MCP joint in neutral or slight extension (blocks flexion that causes triggering), wear at night x6 weeks
  - NSAIDs: limited benefit (not primarily inflammatory condition)
  - Corticosteroid injection (first-line definitive treatment): most effective non-surgical option
  - Inject into flexor tendon sheath at A1 pulley, methylprednisolone 40 mg or triamcinolone 40 mg with lidocaine 1%
  - Success rate: 60-90% with single injection (higher in non-diabetics, lower in diabetics)
  - Response time: improvement within 1-3 weeks, maximal benefit by 4-6 weeks
  - Repeat injection: if partial response, can repeat once after 6 weeks (maximum 2-3 injections)
  - Risk with repeated injections: tendon rupture (rare but serious), skin depigmentation
  - Surgical release (definitive): if failed injections or Grade IV fixed contracture
  - Percutaneous or open A1 pulley release (division of A1 pulley to decompress tendon)
  - Success rate 95-100%, immediate relief, performed under local anesthesia
  - Return to full activity in 2-4 weeks post-surgery
  - Complications surgery: digital nerve injury (rare), infection, bowstringing (if too much pulley released)

clinical_pearls:
  - Finger catches or locks with flexion, requires other hand to straighten
  - Palpable nodule and tenderness at base of finger (A1 pulley)
  - Most common: ring finger and thumb
  - Corticosteroid injection 60-90% effective first-line treatment
  - Lower success rate in diabetics (50-60% vs 90% non-diabetics)
  - Surgery 95-100% curative if injection fails
  - Splinting MCP joint in extension at night may help mild cases
  - Bilateral involvement common especially in diabetes

differentials:
  - Dupuytren contracture: painless fixed flexion contracture of MCP and PIP joints, palpable cord in palm, no triggering
  - Flexor tendon rupture: sudden inability to flex finger, no triggering, history of trauma or chronic inflammation
  - Arthritis (MCP joint): joint swelling, stiffness, no triggering, X-ray shows joint space narrowing

trace: |
  A 58-year-old woman with diabetes presented with 3 months of right ring finger catching and locking. Finger gets stuck in flexed position upon awakening in morning, requires left hand to straighten it. Painful clicking at base of finger with gripping activities. Interfering with daily activities (difficulty gripping steering wheel, opening jars). Exam showed palpable tender nodule at base of right ring finger over A1 pulley, demonstrable catching with active finger flexion-extension (Grade II), full passive range of motion. Diagnosed with trigger finger (stenosing tenosynovitis). Offered corticosteroid injection vs splinting. Patient chose injection given significant symptoms. Performed corticosteroid injection: methylprednisolone 40 mg with lidocaine 1% into flexor tendon sheath at A1 pulley. Immediate pain relief from local anesthetic. At 2 weeks catching episodes reduced by 60%, still occasional locking. At 6 weeks 80% improved, rare catching only with forceful gripping. At 3 months 90% improved, minimal symptoms. Counseled that if symptoms recur can consider repeat injection or surgical release. At 12 months symptoms remain controlled, no recurrence, no surgery needed. Advised that diabetic patients have higher recurrence rate and may eventually need surgery.

