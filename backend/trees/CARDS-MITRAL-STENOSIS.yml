tree_id: CARDS-MITRAL-STENOSIS
name: Mitral Stenosis
family: Cardiology
specialty: Cardiology
chief_complaint: Dyspnea and palpitations with opening snap
description: Narrowing of mitral valve causing impaired LV filling and elevated left atrial pressure. Almost always from rheumatic heart disease (history of rheumatic fever). Classic auscultation includes loud S1, opening snap, diastolic rumble. Severe MS defined as valve area under 1.5 cm², mean gradient over 10 mmHg. AFib common (enlarged LA). Symptomatic severe MS requires intervention with PMBC (percutaneous mitral balloon commissurotomy) if suitable anatomy or surgical valve replacement.
icd10: I05.0
snomed: 79619009
presentations:
  - Dyspnea on exertion (earliest symptom)
  - Orthopnea, PND
  - Hemoptysis
  - Palpitations (atrial fibrillation common)
  - Embolic events (stroke, peripheral embolism)
  - Diastolic rumble at apex, opening snap
urgency: urgent

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Clinical presentation:
  - Dyspnea on exertion (most common, from elevated LA pressure and pulmonary congestion)
  - Orthopnea and PND
  - Palpitations (from atrial fibrillation - very common in MS)
  - Hemoptysis (from pulmonary hypertension, ruptured bronchial veins)
  - Hoarseness (Ortner syndrome from enlarged LA compressing left recurrent laryngeal nerve)
  - Systemic embolism (from LA thrombus, especially if AFib)
  - Etiology:
  - Rheumatic heart disease (almost all cases, history of rheumatic fever 10-20 years prior)
  - Rare causes include congenital MS, calcific MS in elderly, carcinoid, SLE
  - Physical exam (classic findings):
  - Loud S1 (forceful closure of stenotic valve)
  - Opening snap after S2 (stenotic valve opens abruptly, shorter S2-OS interval indicates more severe stenosis)
  - Low-pitched diastolic rumble at apex (best heard in left lateral decubitus position with bell)
  - Accentuated with exercise or leg raise (increased flow across valve)
  - Presystolic accentuation if sinus rhythm (atrial contraction)
  - RV heave if pulmonary hypertension (from chronic elevated LA pressure)
  - Mitral facies (malar flush from low cardiac output and chronic hypoxemia)
  - Imaging:
  - Echocardiogram (diagnostic):
  - Severity grading:
  - Mild MS (valve area over 2.0 cm², mean gradient under 5 mmHg, PA pressure under 30 mmHg)
  - Moderate MS (valve area 1.5-2.0 cm², mean gradient 5-10 mmHg, PA pressure 30-50 mmHg)
  - Severe MS (valve area under 1.5 cm², mean gradient over 10 mmHg, PA pressure over 50 mmHg)
  - Very severe MS (valve area under 1.0 cm²)
  - Valve morphology (Wilkins score for PMBC suitability, score under 8 favorable)
  - LA size (often dilated)
  - LA thrombus (contraindication to PMBC)
  - MR assessment (significant MR may preclude PMBC)
  - PA pressure (assess pulmonary hypertension)
  - TEE (if transthoracic echo inadequate, assess LA thrombus before PMBC)
  - Chest X-ray:
  - LA enlargement (straightening of left heart border, double density, elevated left main bronchus)
  - Pulmonary congestion or edema
  - ECG:
  - P mitrale (broad notched P waves in lead II from LA enlargement)
  - Atrial fibrillation (very common)
  - RVH if pulmonary hypertension

treatment:
  - Medical management (symptom control):
  - Diuretics for congestion (furosemide)
  - Rate control if AFib (beta blocker or diltiazem, goal HR 60-80 to maximize diastolic filling time)
  - Anticoagulation:
  - If AFib, LA thrombus, or prior embolism (warfarin with INR 2-3)
  - Consider even if sinus rhythm with severe MS and LA enlargement over 55 mm
  - Endocarditis prophylaxis
  - Avoid excessive activity if severe MS
  - Serial monitoring if asymptomatic:
  - Severe MS annually
  - Moderate MS every 1-2 years
  - Mild MS every 3-5 years
  - Intervention indications:
  - Symptomatic severe MS (NYHA class II-IV symptoms)
  - Asymptomatic severe MS with new-onset AFib or pulmonary hypertension (PA pressure over 50 mmHg)
  - PMBC (percutaneous mitral balloon commissurotomy):
  - First-line therapy if suitable anatomy
  - Criteria for PMBC:
  - Favorable valve morphology (Wilkins score under 8, pliable leaflets, minimal calcification, minimal subvalvular thickening)
  - No or mild MR (greater than 2+ MR contraindication)
  - No LA thrombus on TEE
  - Balloon inflated across valve to separate fused commissures
  - Avoids open-heart surgery
  - Success rate 80-90% with excellent long-term results
  - Surgical mitral valve replacement or repair:
  - If unfavorable anatomy for PMBC (Wilkins score over 8, heavily calcified, significant MR, LA thrombus)
  - Valve replacement with mechanical or bioprosthetic valve
  - Valve repair (commissurotomy) if suitable
  - Post-intervention management:
  - Anticoagulation if mechanical valve (warfarin INR 2.5-3.5 for mitral position)
  - Antiplatelet if bioprosthetic valve (aspirin)
  - Continue rate control if AFib persists
  - Serial echo to assess valve function

clinical_pearls:
  - MS almost always from rheumatic heart disease (rheumatic fever 10-20 years prior)
  - Classic auscultation (loud S1, opening snap, diastolic rumble at apex)
  - Shorter S2-OS interval indicates more severe stenosis
  - AFib very common (enlarged LA)
  - Severe MS defined as valve area under 1.5 cm², mean gradient over 10 mmHg
  - PMBC first-line therapy if suitable anatomy (Wilkins score under 8, no significant MR, no LA thrombus)
  - Anticoagulation if AFib, LA thrombus, or prior embolism

differentials:
  - Mitral regurgitation (holosystolic murmur, not diastolic rumble)
  - Tricuspid stenosis (similar diastolic rumble but at left lower sternal border)
  - Left atrial myxoma (similar symptoms but tumor plop, not opening snap)
  - Aortic regurgitation (Austin Flint murmur similar to MS rumble)

trace: |
  A 52-year-old woman from India presented with 1 year progressive dyspnea on exertion. Now dyspneic walking half block (NYHA class III). Orthopnea, PND. Palpitations daily (irregular rhythm). History of rheumatic fever at age 12 (40 years ago - classic for MS). No prior cardiac evaluation. Exam: irregularly irregular rhythm (atrial fibrillation), BP 110/75, loud S1 (forceful closure of stenotic valve), opening snap shortly after S2 (short S2-OS interval indicates severe stenosis), low-pitched diastolic rumble at apex heard best in left lateral decubitus position with bell, accentuated with leg raise (increased flow). RV heave palpable (pulmonary hypertension from chronic elevated LA pressure). Malar flush (mitral facies). ECG: atrial fibrillation with ventricular rate 110 bpm (rapid, poor diastolic filling time), RVH (pulmonary hypertension). Chest X-ray: LA enlargement (straightening of left heart border, double density sign, elevated left main bronchus), pulmonary vascular congestion. Echocardiogram: rheumatic mitral stenosis with thickened doming leaflets (classic appearance), severe stenosis with valve area 0.9 cm² (very severe MS - under 1.0), mean gradient 14 mmHg (severe MS - over 10), PA systolic pressure 65 mmHg (severe pulmonary hypertension - over 50). Severely enlarged LA (6.2 cm - normal under 4 cm). Wilkins score 6 (favorable for PMBC: pliable leaflets, minimal calcification, minimal subvalvular disease). Trace MR only (no significant MR - good for PMBC). Diagnosed with severe rheumatic mitral stenosis with AFib and pulmonary hypertension. Symptomatic NYHA class III is class I indication for intervention. TEE performed to assess for LA thrombus before PMBC: no thrombus seen (safe to proceed with PMBC). Given favorable valve morphology (Wilkins score 6 under 8), minimal MR, no LA thrombus, patient is excellent PMBC candidate. Started anticoagulation with heparin (bridging for AFib), metoprolol 50 mg BID (rate control for AFib, goal HR 60-80 to maximize diastolic filling), furosemide 40 mg daily (diuresis for congestion). Underwent PMBC (percutaneous mitral balloon commissurotomy). Procedure: transseptal puncture to access LA, advanced balloon catheter across mitral valve, inflated balloon to separate fused commissures. Immediate improvement in hemodynamics. Post-procedure echo: valve area increased from 0.9 cm² to 2.1 cm² (excellent result - normal over 1.5), mean gradient decreased from 14 mmHg to 4 mmHg (excellent), PA pressure decreased from 65 mmHg to 45 mmHg (improved). Trace to 1+ MR (acceptable increase, under 2+ MR is acceptable). No complications. Discharged on day 2 with warfarin (target INR 2-3 for AFib), metoprolol continued (rate control), furosemide. At 2 weeks: outpatient follow-up, symptoms dramatically improved. Walking without dyspnea, no orthopnea. INR therapeutic 2.4. At 1 month: NYHA class I, asymptomatic. HR controlled 70-80 bpm on metoprolol. Repeat echo: valve area stable 2.0 cm² (maintained excellent result), mean gradient 5 mmHg, PA pressure 40 mmHg (continued improvement as LA pressure normalized). At 6 months: remains asymptomatic, excellent exercise tolerance. At 1 year: stable valve function, no restenosis. AFib persists (often does not convert after PMBC even with improved hemodynamics). This case demonstrates severe rheumatic mitral stenosis with classic history (rheumatic fever 40 years prior), classic exam findings (loud S1, opening snap, diastolic rumble), severe hemodynamics (valve area 0.9 cm², mean gradient 14 mmHg, PA pressure 65 mmHg), and AFib with pulmonary hypertension. PMBC first-line therapy with favorable anatomy (Wilkins score 6, minimal MR, no LA thrombus), excellent immediate and long-term results. PMBC preferred over surgery (less invasive, excellent outcomes, faster recovery).

