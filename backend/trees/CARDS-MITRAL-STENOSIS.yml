tree_id: CARDS-MITRAL-STENOSIS
name: Mitral Stenosis
family: Cardiology
specialty: Cardiology
chief_complaint: Shortness of breath and palpitations
description: Narrowing of mitral valve causing obstruction to LV filling and elevated left atrial pressure, almost always rheumatic in origin. Classic opening snap and diastolic rumble at apex. Atrial fibrillation common complication worsens symptoms. Percutaneous balloon valvuloplasty or surgical commissurotomy for severe symptomatic MS.
icd10: I05.0
urgency: urgent

workup:
  - Symptoms:
  - Dyspnea: exertional dyspnea, orthopnea, PND (elevated LA pressure causing pulmonary congestion)
  - Palpitations: atrial fibrillation develops in 30-40% (enlarged LA substrate)
  - Hemoptysis: pulmonary venous hypertension causes rupture of bronchial veins
  - Hoarseness: Ortner syndrome (enlarged LA compresses left recurrent laryngeal nerve)
  - Thromboembolic events: LA stasis and AFib increase stroke risk
  - Physical exam:
  - Diastolic rumbling murmur at apex: low-pitched, best heard with bell, patient in left lateral decubitus position
  - Opening snap (OS): high-pitched early diastolic sound after S2 from abrupt opening of stenotic valve
  - Shorter S2-OS interval indicates more severe stenosis (higher LA pressure forces valve open earlier)
  - Loud S1: from forceful valve closure (mobile leaflets snap shut)
  - In severe MS: S1 soft (calcified immobile valve), no OS (immobile)
  - Diastolic thrill at apex: palpable in severe MS
  - Right ventricular heave: pulmonary hypertension from chronic LA pressure elevation
  - Malar flush: peripheral cyanosis from low cardiac output
  - Causes:
  - Rheumatic heart disease (95%): only significant cause, latency 20-40 years after acute rheumatic fever
  - Rare causes: severe mitral annular calcification, congenital, carcinoid
  - Echocardiogram (diagnostic):
  - Mitral valve area (MVA): normal 4-6 cm², mild 1.5-2 cm², moderate 1-1.5 cm², severe below 1 cm²
  - Mean gradient: mild below 5 mmHg, moderate 5-10 mmHg, severe over 10 mmHg
  - Valve morphology: thickened leaflets, commissural fusion, restricted motion, calcification
  - Wilkins score: grades leaflet mobility, thickening, calcification, subvalvular apparatus (score 0-16, score below 8 favorable for balloon valvuloplasty)
  - Left atrial enlargement: LA diameter often over 5 cm
  - Pulmonary hypertension: elevated PA systolic pressure (PASP)
  - Exclude mitral regurgitation: must be absent or mild for balloon valvuloplasty candidacy
  - Exclude LA thrombus: TEE before intervention
  - ECG: left atrial enlargement (P mitrale - notched P in lead II), atrial fibrillation (30-40%), right ventricular hypertrophy if pulmonary hypertension
  - Chest X-ray: straightening of left heart border (enlarged LA), double density (LA behind RV), Kerley B lines (pulmonary edema)

treatment:
  - Medical management (symptom relief, does NOT alter stenosis):
  - Diuretics: furosemide for pulmonary congestion
  - Beta blockers: slow heart rate, prolongs diastolic filling time (metoprolol)
  - Critical in AFib (rapid ventricular rate shortens diastole worsening symptoms)
  - Digoxin: rate control in AFib
  - Anticoagulation: warfarin if atrial fibrillation (INR 2-3) or prior embolism, reduces stroke risk
  - Rate vs rhythm control in AFib: rate control usually preferred (MS makes cardioversion difficult)
  - Percutaneous mitral balloon valvuloplasty (PMBV) - first-line intervention:
  - Indications: symptomatic severe MS (MVA below 1.5 cm² and symptoms) with favorable valve morphology (Wilkins score below 8)
  - Technique: transseptal puncture, balloon inflation at valve splits fused commissures
  - Success rate 80-90% if favorable anatomy
  - Increases MVA by 1-2 cm² typically
  - Contraindications: moderate-severe MR, LA thrombus (do TEE first), heavily calcified valve (Wilkins over 8)
  - Complications: mitral regurgitation (most common), atrial septal defect, cardiac perforation (rare)
  - Durability: 10-year freedom from reintervention 50-70%
  - Surgical mitral valve repair or replacement:
  - Indications: severe MS not candidate for PMBV (unfavorable anatomy, heavy calcification, moderate-severe MR)
  - Open mitral commissurotomy: surgical splitting of fused commissures (if pliable valve)
  - Mitral valve replacement: mechanical or bioprosthetic (if heavily calcified or failed PMBV)
  - Rheumatic fever prophylaxis: secondary prevention with penicillin if history of rheumatic fever (prevent recurrence)
  - Pregnancy: MS poorly tolerated (increased blood volume worsens pulmonary congestion), PMBV safe in pregnancy if severe symptomatic

clinical_pearls:
  - Diastolic rumbling murmur at apex with opening snap - pathognomonic for MS
  - Almost always rheumatic in origin (95%), latency 20-40 years after ARF
  - Shorter S2-OS interval indicates more severe stenosis
  - Atrial fibrillation in 30-40% worsens symptoms dramatically (loss of atrial kick and rapid rate)
  - Severe MS: MVA below 1 cm², mean gradient over 10 mmHg
  - PMBV first-line intervention if favorable anatomy (Wilkins score below 8)
  - Anticoagulation essential if AFib (LA stasis and AFib increase stroke risk)
  - Beta blockers critical to slow heart rate and prolong diastolic filling time

differentials:
  - Aortic regurgitation: Austin Flint murmur mimics MS (diastolic rumble at apex) but wide pulse pressure
  - Tricuspid stenosis: diastolic murmur at left lower sternal border, increases with inspiration
  - Left atrial myxoma: diastolic murmur changes with position, tumor plop sound
  - Mitral regurgitation: holosystolic murmur radiating to axilla, not diastolic

trace: |
  A 48-year-old woman from India presented with 1 year of progressive dyspnea on exertion and palpitations. History of rheumatic fever in childhood (age 8). Previously asymptomatic until last year. Now short of breath climbing stairs, orthopnea, PND. Palpitations started 2 months ago (atrial fibrillation). Episode of hemoptysis 1 week ago (pulmonary venous hypertension). Exam: irregularly irregular rhythm (AFib), HR 110, low-pitched diastolic rumbling murmur at apex best heard with bell in left lateral decubitus position, opening snap 0.06 seconds after S2 (short S2-OS interval indicates severe stenosis), loud S1, diastolic thrill palpable at apex, right ventricular heave (pulmonary hypertension), malar flush. ECG: atrial fibrillation with rapid ventricular response 110 bpm, right ventricular hypertrophy. CXR: straightening of left heart border (enlarged LA), double density behind sternum (enlarged LA), Kerley B lines (pulmonary edema). Echocardiogram: severe mitral stenosis, mitral valve area 0.9 cm² (severe below 1.0), mean gradient 14 mmHg (severe over 10), thickened mitral leaflets with commissural fusion, Wilkins score 6 (favorable for balloon valvuloplasty - below 8), no significant mitral regurgitation (trace only), LA severely enlarged 6.2 cm, pulmonary hypertension PASP 55 mmHg. Transesophageal echo (TEE): no LA thrombus (must exclude before intervention). Diagnosed with severe symptomatic rheumatic mitral stenosis with atrial fibrillation (classic presentation: dyspnea, AFib, opening snap, rheumatic origin). Started metoprolol 50 mg BID for rate control (slow heart rate prolongs diastole improves filling), furosemide 40 mg daily for pulmonary congestion, warfarin for AFib (INR goal 2-3, stroke prevention). At 1 week heart rate controlled 70s, symptoms improved 30%. Candidate for percutaneous mitral balloon valvuloplasty (PMBV): symptomatic severe MS with favorable valve anatomy (Wilkins 6), no LA thrombus, minimal MR. Underwent PMBV: transseptal puncture, balloon inflation at mitral valve, heard pop as commissures split. Post-procedure echocardiogram: MVA increased from 0.9 to 2.3 cm² (excellent result, target over 1.5), mean gradient decreased from 14 to 4 mmHg, mild mitral regurgitation (acceptable), no ASD. At 24 hours dramatic symptom improvement: dyspnea resolved, able to walk without shortness of breath. Discharged on metoprolol, furosemide (lower dose), warfarin (continue lifelong for AFib). At 1 month no dyspnea, AFib rate-controlled, excellent functional status. At 6 months back to baseline activity. PMBV successful treatment for rheumatic mitral stenosis. 10-year freedom from reintervention 50-70%. Annual echo monitoring.
