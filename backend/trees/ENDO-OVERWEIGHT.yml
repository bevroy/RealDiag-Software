tree_id: ENDO-OVERWEIGHT
name: Overweight
family: endocrinology
specialty: Endocrinology
icd10: E66.3
snomed: 238131007
urgency: []
homeopathy: []
presentations:
  - BMI 25.0-29.9 kg/m² (overweight classification)
  - Weight gain over time
  - Increased waist circumference (central adiposity)
  - May be asymptomatic or minimally symptomatic
  - Risk factors: sedentary lifestyle, high-calorie diet, family history
  - Early metabolic changes: prediabetes, dyslipidemia, elevated blood pressure
  - Difficulty with physical activity or exercise tolerance
  - Psychosocial concerns (body image, self-esteem)
workup:
  - Anthropometric measurements
  - Calculate BMI: weight (kg) / height (m)²
  - BMI 25.0-29.9 = overweight; ≥30 = obesity
  - Waist circumference: men >40 inches, women >35 inches indicates central obesity
  - Screen for metabolic complications
  - Fasting glucose or hemoglobin A1c (screen for prediabetes/diabetes)
  - Lipid panel (LDL, HDL, triglycerides)
  - Blood pressure measurement
  - Liver enzymes (screen for fatty liver disease)
  - Assess for secondary causes
  - TSH (hypothyroidism)
  - Medication review (steroids, antipsychotics, antidepressants, insulin, sulfonylureas)
  - Consider Cushing syndrome if clinical features present (striae, moon facies, proximal weakness)
  - Evaluate cardiovascular risk
  - 10-year ASCVD risk calculator
  - ECG if cardiovascular symptoms
treatment:
  - Lifestyle modifications (cornerstone of treatment)
  - Diet
  - Calorie deficit: 500-1000 kcal/day reduction (1-2 lbs/week weight loss)
  - Mediterranean diet, DASH diet, or low-carbohydrate diet
  - Portion control, reduce sugar-sweetened beverages
  - Increase vegetables, fruits, whole grains, lean protein
  - Exercise
  - 150-300 minutes/week moderate-intensity aerobic activity (brisk walking, cycling)
  - Resistance training 2-3 times/week
  - Reduce sedentary time (stand, walk breaks)
  - Behavioral interventions
  - Self-monitoring (food diary, weight tracking)
  - Goal setting and accountability
  - Cognitive behavioral therapy if emotional eating
  - Group-based programs (Weight Watchers, etc.)
  - Treat metabolic complications
  - Metformin if prediabetes with BMI ≥35
  - Statin if dyslipidemia and elevated ASCVD risk
  - Antihypertensive if BP ≥130/80
  - Pharmacotherapy generally not indicated for overweight (reserved for obesity BMI ≥30)
  - May consider if BMI ≥27 with comorbidities and lifestyle failure
  - Bariatric surgery not indicated for overweight alone (requires BMI ≥35-40)
clinical_pearls:
  - "Overweight affects 31% of US adults - precursor to obesity"
  - "5-10% weight loss significantly improves metabolic health"
  - "Central adiposity (waist circumference) more predictive of metabolic risk than BMI alone"
  - "Weight gain of 5-10% increases diabetes risk by 50-100%"
  - "Preventing progression to obesity is more effective than treating established obesity"
  - "Muscle mass increases metabolic rate - resistance training crucial"
  - "Many medications cause weight gain - review and modify if possible"
  - "BMI limitations: doesn't distinguish muscle from fat, may underestimate risk in Asian populations"
referrals:
  - Registered dietitian for medical nutrition therapy
  - Endocrinology if secondary causes suspected (thyroid, Cushing syndrome)
  - Behavioral health if disordered eating patterns
  - Exercise physiologist or physical therapy for exercise prescription
differentials:
  - Primary overweight (excess caloric intake, sedentary lifestyle)
  - Hypothyroidism (weight gain, fatigue, cold intolerance)
  - Medication-induced weight gain (steroids, antipsychotics, antidepressants, insulin)
  - Cushing syndrome (central obesity, striae, moon facies, hypertension)
  - Polycystic ovary syndrome (PCOS) - irregular menses, hirsutism
  - Genetic syndromes (Prader-Willi, rare)
