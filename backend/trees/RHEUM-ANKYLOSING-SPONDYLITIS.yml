tree_id: RHEUM-ANKYLOSING-SPONDYLITIS
name: Ankylosing Spondylitis
family: Rheumatology
specialty: Rheumatology
chief_complaint: Lower back pain worse in morning, better with exercise
description: Inflammatory arthritis of axial skeleton causing chronic back pain with morning stiffness that improves with exercise. HLA-B27 positive in 90%, sacroiliitis on imaging diagnostic, NSAIDs and TNF inhibitors effective treatments.
icd10: M45.9
snomed: 9631008
presentations:
  - Inflammatory back pain (insidious onset, age <40)
  - Morning stiffness >30 minutes
  - Improves with exercise, worse with rest
  - Alternating buttock pain
  - Limited spinal mobility
  - Uveitis, enthesitis
  - HLA-B27 positive
urgency: routine

referrals:
  emergency:
    - Giant cell arteritis with vision changes
    - Acute vasculitis with organ involvement
    - Severe flare with organ damage
  urgent:
    - Suspected rheumatoid arthritis
    - Suspected lupus
    - Crystal arthropathy
    - PMR
  routine:
    - Osteoarthritis
    - Chronic inflammatory arthritis management
    - Fibromyalgia
    - Gout prevention

workup:
  - Inflammatory back pain characteristics (at least 4 of 5 criteria):
  - Age of onset below 40 years (typically teens to 30s)
  - Insidious onset over months
  - Improvement with exercise (distinguishes from mechanical back pain)
  - No improvement with rest (vs mechanical pain improves with rest)
  - Pain at night with improvement upon getting up
  - Morning stiffness lasting over 30 minutes (often 1-2 hours)
  - Sacroiliac joint pain: buttock pain alternating sides, pain radiating to posterior thigh
  - Decreased spinal mobility: reduced lumbar flexion (Schober test), reduced chest expansion
  - Enthesitis: inflammation at tendon/ligament insertion sites (Achilles, plantar fascia, costochondral junctions)
  - Extra-articular manifestations: acute anterior uveitis 25-40% (eye pain, redness, photophobia), aortitis, pulmonary fibrosis
  - Inflammatory markers: elevated ESR and CRP in 50-70% (normal does NOT rule out)
  - HLA-B27: positive in 90% of AS patients (but only 5% of HLA-B27+ people develop AS)
  - Imaging sacroiliac joints: MRI most sensitive shows bone marrow edema (early), X-ray shows erosions and fusion (late)
  - X-ray spine: bamboo spine (late finding, syndesmophytes bridging vertebrae), squaring of vertebral bodies
  - Rule out: mechanical back pain (worse with activity, improves with rest), disc herniation (radicular symptoms)

treatment:
  - Physical therapy (cornerstone): daily stretching and strengthening exercises, maintain posture and spinal mobility
  - Exercise: swimming, yoga, pilates - maintain flexibility and prevent fusion in poor posture
  - NSAIDs (first-line pharmacologic): continuous dosing (not PRN) reduces inflammation and symptoms
  - Naproxen 500 mg BID or indomethacin 75 mg BID (indomethacin particularly effective for AS)
  - Continuous NSAID use may slow radiographic progression
  - TNF inhibitors (for active disease despite NSAIDs): highly effective, disease-modifying
  - Adalimumab (Humira) 40 mg SC every 2 weeks
  - Etanercept (Enbrel) 50 mg SC weekly
  - Infliximab (Remicade) 5 mg/kg IV at weeks 0, 2, 6 then every 6-8 weeks
  - Reduces pain, stiffness, improves function and quality of life
  - Screen for TB before starting (PPD or IGRA)
  - IL-17 inhibitors: secukinumab (Cosentyx) alternative to TNF inhibitors
  - Sulfasalazine: 2-3 g daily for peripheral arthritis (NOT effective for axial disease)
  - Methotrexate: NOT effective for axial AS
  - Avoid prolonged bed rest: worsens stiffness and promotes fusion
  - Smoking cessation: smoking associated with worse disease progression
  - Monitor for uveitis: urgent ophthalmology if eye pain or redness
  - Osteoporosis screening: DEXA scan, increased fracture risk from spinal fusion

clinical_pearls:
  - Chronic back pain onset before age 40 that improves with exercise worsens with rest
  - Morning stiffness over 30 minutes improves with activity
  - HLA-B27 positive in 90% but low specificity (only 5% HLA-B27+ develop AS)
  - MRI sacroiliac joints shows early bone marrow edema before X-ray changes
  - NSAIDs first-line - continuous dosing not PRN
  - TNF inhibitors highly effective for active disease
  - Physical therapy and exercise critical to maintain mobility prevent fusion
  - Screen for acute anterior uveitis (25-40%)
  - Male predominance 3:1

differentials:
  - Mechanical back pain: worse with activity improves with rest, onset older age, no morning stiffness
  - Disc herniation: radicular pain down leg, positive straight leg raise, MRI shows disc
  - Diffuse idiopathic skeletal hyperostosis (DISH): flowing ossification, older age, HLA-B27 negative
  - Psoriatic arthritis: psoriasis, dactylitis, peripheral joint involvement
  - Inflammatory bowel disease-associated arthritis: IBD symptoms, similar axial involvement

trace: |
  A 28-year-old man presented with 2 years of progressive lower back and buttock pain. Onset gradual in early 20s. Pain worse in morning with severe stiffness lasting 2 hours, must move around to loosen up. Improves with exercise and throughout day. Worsens with prolonged sitting or rest. Awakens at night with pain, must get up and walk. Right heel pain (Achilles enthesitis). Episode of right eye pain with redness 6 months ago (acute anterior uveitis). No peripheral joint swelling. Father has AS. Exam showed reduced lumbar flexion (Schober test 3 cm vs normal 5+ cm), reduced chest expansion 3 cm (normal 5+ cm), FABER test positive bilaterally (sacroiliac joint tenderness). Normal strength and sensation, negative straight leg raise. Labs: ESR 42, CRP 18 (elevated inflammatory markers), HLA-B27 positive. MRI sacroiliac joints showed bilateral sacroiliitis with bone marrow edema and erosions (diagnostic for AS). X-ray spine showed early squaring of vertebral bodies. Diagnosed with ankylosing spondylitis (inflammatory back pain onset before 40, improves with exercise, HLA-B27 positive, sacroiliitis on MRI). Referred to physical therapy for daily stretching and posture exercises. Started naproxen 500 mg BID continuous dosing (not PRN). Counseled on smoking cessation (non-smoker). At 6 weeks pain improved 40%, morning stiffness reduced to 45 minutes. At 3 months still significant symptoms despite NSAIDs and PT. Started adalimumab (Humira) 40 mg SC every 2 weeks after negative TB screen. At 8 weeks on TNF inhibitor dramatic improvement: pain improved 80%, morning stiffness 15 minutes, excellent functional improvement. At 6 months ESR 12, CRP 4, maintaining exercise program and biologics. At 1 year excellent disease control on adalimumab, continues daily stretching to maintain spinal mobility. Annual monitoring for uveitis, DEXA scan showed normal bone density.

