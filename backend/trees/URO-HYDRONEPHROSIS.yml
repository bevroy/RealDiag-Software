tree_id: URO-HYDRONEPHROSIS
name: Hydronephrosis
family: urology
specialty: Urology/Nephrology
icd10: N13.30
snomed: 43064006
urgency: []
homeopathy: []
presentations:
  - Often asymptomatic (discovered incidentally on imaging)
  - Flank pain (dull ache or sharp colicky pain if acute obstruction)
  - Decreased urine output if bilateral or solitary kidney
  - Symptoms of urinary tract infection if concurrent (fever, dysuria)
  - Nausea and vomiting
  - Hematuria (gross or microscopic)
  - Palpable flank mass in severe cases
  - Symptoms of renal failure if bilateral or chronic (fatigue, edema, nausea)
workup:
  - Renal ultrasound (INITIAL imaging of choice)
  - Detects fluid collection in renal pelvis and calyces
  - Grading of hydronephrosis
  - Mild: pelvic dilatation only
  - Moderate: pelvic and calyceal dilatation
  - Severe: marked dilatation with cortical thinning
  - Assess kidney size and cortical thickness
  - Identify level of obstruction if visible
  - Safe in pregnancy and renal insufficiency
  - Laboratory evaluation
  - Basic metabolic panel (BUN, creatinine) - assess kidney function
  - Acute kidney injury if bilateral obstruction or solitary kidney
  - Complete blood count
  - Urinalysis and urine culture
  - Hematuria common
  - Pyuria if concurrent infection (urgent - infected obstructed system)
  - CT urogram (if ultrasound shows hydronephrosis)
  - Definitive imaging to identify cause and level of obstruction
  - Shows stones, masses, strictures
  - Assesses degree of obstruction
  - Delayed excretion or no excretion if severe
  - Determine etiology of obstruction
  - Intrinsic causes
  - Kidney stones (ureter or renal pelvis) - most common cause
  - Ureter stricture (post-surgical, radiation, inflammatory)
  - Blood clots
  - Ureteropelvic junction (UPJ) obstruction - congenital
  - Ureteral tumor (transitional cell carcinoma)
  - Extrinsic compression
  - Benign prostatic hyperplasia (BPH) - men
  - Pregnancy - physiologic (resolves postpartum)
  - Pelvic masses (ovarian, uterine fibroids)
  - Retroperitoneal fibrosis
  - Malignancy (cervical, prostate, colorectal, lymphoma)
  - Functional obstruction
  - Neurogenic bladder
  - Vesicoureteral reflux
  - Voiding cystourethrogram (VCUG) if concern for reflux (pediatric cases)
  - Nuclear renography (MAG3 scan) to assess kidney function and drainage
  - Differentiates obstructive from non-obstructive dilatation
treatment:
  - Treat based on underlying cause and severity
  - Emergent decompression indications (URGENT urology consultation)
  - Infected obstructed system (pyonephrosis) - life-threatening, sepsis risk
  - Bilateral obstruction or obstruction in solitary kidney with AKI
  - Complete anuria
  - Decompression methods
  - Foley catheter if bladder outlet obstruction (BPH, urethral stricture)
  - Percutaneous nephrostomy tube (drain kidney directly through skin)
  - Retrograde ureteral stent (endoscopic placement)
  - Antibiotics if infection present
  - Broad-spectrum (ceftriaxone 1-2 g IV daily or piperacillin-tazobactam 3.375-4.5 g IV every 6-8 hours)
  - Adjust based on cultures
  - Definitive treatment based on cause
  - Kidney stones
  - Expectant management if small (less than 5 mm) and mild hydronephrosis
  - Ureteroscopy with laser lithotripsy for larger stones or failed passage
  - Extracorporeal shock wave lithotripsy (ESWL)
  - Benign prostatic hyperplasia
  - Alpha-blocker (tamsulosin 0.4 mg daily)
  - 5-alpha reductase inhibitor (finasteride 5 mg daily) for large prostate
  - Transurethral resection of prostate (TURP) if medical therapy fails
  - UPJ obstruction
  - Pyeloplasty (surgical repair) if symptomatic or declining renal function
  - Ureteral stricture
  - Endoscopic balloon dilation or laser incision
  - Ureteral stent placement
  - Open surgical repair if endoscopic fails
  - Malignancy
  - Oncology referral for chemotherapy/radiation
  - Nephrostomy or stent for palliation
  - Pregnancy-related hydronephrosis
  - Usually physiologic, more common on right side
  - Resolves postpartum
  - Conservative management unless symptomatic or infected
  - Monitor kidney function
  - Serial creatinine if bilateral or declining function
  - Repeat imaging to assess for resolution after treating cause
clinical_pearls:
  - "Hydronephrosis is FINDING not diagnosis - always identify underlying cause of obstruction"
  - "Infected obstructed kidney (pyonephrosis) is urologic emergency - requires urgent decompression and antibiotics"
  - "Bilateral hydronephrosis or unilateral in solitary kidney can cause acute kidney injury"
  - "Most common causes: kidney stones (adults), UPJ obstruction (children), BPH (older men), pregnancy (women)"
  - "Physiologic hydronephrosis of pregnancy common (80% on right side) - resolves postpartum"
  - "Chronic severe hydronephrosis leads to irreversible kidney damage - cortical thinning on imaging suggests permanent loss"
  - "Post-obstructive diuresis can occur after relieving obstruction - monitor fluids and electrolytes carefully"
  - "CT urogram is gold standard for identifying cause and level of obstruction"
referrals:
  - Urology EMERGENT for infected obstructed system, bilateral obstruction with AKI, or anuria
  - Urology urgent for symptomatic unilateral hydronephrosis or declining renal function
  - Nephrology for management of acute kidney injury from obstruction
differentials:
  - Obstructive hydronephrosis (kidney stone, tumor, stricture, BPH - requires intervention)
  - Non-obstructive hydronephrosis (vesicoureteral reflux, pregnancy - often resolves spontaneously)
  - Pyonephrosis (infected hydronephrosis - EMERGENCY)
  - Congenital UPJ obstruction (children, intermittent flank pain)
  - Polycystic kidney disease (bilateral cystic kidneys, no obstruction)
  - Renal cyst (simple fluid collection, not connected to collecting system)
