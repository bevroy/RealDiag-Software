presentations:
  - Honey-colored crusted lesions
  - Pruritic sores around nose and mouth
  - Vesicles that rupture easily
  - Highly contagious
  - Common in children
  - No systemic symptoms typically
differentials:
  - Cellulitis
  - Herpes simplex
  - Eczema
  - Contact dermatitis
  - Folliculitis
workup: []
treatment:
  - 'Localized (few lesions): Topical mupirocin 2% ointment TID x5-7 days OR retapamulin 1% ointment BID x5 days'
  - 'Widespread or bullous impetigo: Oral antibiotics - cephalexin 25-50mg/kg/day divided QID x7 days OR dicloxacillin 25mg/kg/day divided QID'
  - 'If MRSA suspected (not responding to beta-lactam): Clindamycin 10-20mg/kg/day divided TID x7 days OR TMP-SMX 8-12mg/kg/day (of TMP component) divided BID x7 days'
  - 'Patient advice: Hygiene measures - keep lesions covered, wash hands frequently, separate towels and linens, trim fingernails'
  - 'Patient advice: Return to school/daycare after 24 hours of antibiotics and lesions covered'
  - 'Treat nasal carriage if recurrent: Mupirocin 2% nasal ointment BID x5 days'
