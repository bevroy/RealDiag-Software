tree_id: PED-IMPETIGO
name: Impetigo
family: Pediatrics
specialty: Pediatrics
icd10:
- L01.0
snomed:
- 48277006
urgency: medium
description: Comprehensive evaluation and management of Impetigo
version: '1.0'
citations:
  - AAP (American Academy of Pediatrics) Clinical Practice Guidelines
  - NICE (National Institute for Health and Care Excellence) Pediatric Guidelines
  - UpToDate - Pediatrics
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Honey-colored crusted lesions
- Pruritic sores around nose and mouth
- Vesicles that rupture easily
- Highly contagious
- Common in children
- No systemic symptoms typically
workup: []
treatment:
  - 'Localized (few lesions): Topical mupirocin 2% ointment TID x5-7 days OR retapamulin 1% ointment BID x5 days'
  - 'Widespread or bullous impetigo: Oral antibiotics - cephalexin 25-50mg/kg/day divided QID x7 days OR dicloxacillin 25mg/kg/day divided QID'
  - 'If MRSA suspected (not responding to beta-lactam): Clindamycin 10-20mg/kg/day divided TID x7 days OR TMP-SMX 8-12mg/kg/day (of TMP component) divided BID x7 days'
  - 'Hygiene measures - keep lesions covered, wash hands frequently, separate towels and linens, trim fingernails'
  - 'Return to school/daycare after 24 hours of antibiotics and lesions covered'
  - 'Treat nasal carriage if recurrent: Mupirocin 2% nasal ointment BID x5 days'
clinical_pearls: []
referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy
differentials:
  - Cellulitis
  - Herpes simplex
  - Eczema
  - Contact dermatitis
  - Folliculitis
