tree_id: ENT-TONSILLITIS
name: Acute Tonsillitis
family: Ent
specialty: Ent
icd10:
- J03.90
snomed:
- 90176007
urgency: urgent
description: Comprehensive evaluation and management of Acute Tonsillitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Severe sore throat
- Fever
- Enlarged, erythematous tonsils with exudates
- Dysphagia
- Tender cervical lymphadenopathy
- Muffled voice (hot potato voice)
- May progress to peritonsillar abscess
workup:
- Rapid strep test + throat culture to confirm bacterial etiology
- Monospot if severe pharyngitis + fatigue + splenomegaly (EBV)
- CT neck with contrast if concern for abscess (unilateral swelling, trismus, uvular
  deviation)
treatment:
- 'Guideline-based treatment options for Acute Tonsillitis include:'
- 'If bacterial suspected (exudates, fever, anterior cervical nodes, no cough): Rapid
  strep test (AAO-HNS 2023)'
- 'Antibiotics if strep positive: Penicillin V 500mg BID or amoxicillin 500mg TID
  × 10 days (AAO-HNS 2023)'
- 'If severe/unable to swallow: Dexamethasone 10mg IM/PO × 1 (reduces pain, speeds
  recovery) (AAO-HNS 2023)'
- 'Pain control: NSAIDs (ibuprofen 600-800mg q6-8h), opioidsif severe (AAO-HNS 2023)'
- Hydration critical - IV fluids if unable to tolerate PO (AAO-HNS 2023)
clinical_pearls:
- Usually bacterial (Group A Strep most common) but can be viral (EBV, adenovirus)
- 'Grading: 0 (within tonsillar fossa), 1+ (beyond pillars), 2+ (midline), 3+ (midline
  touching), 4+ (kissing tonsils)'
- 'Hot potato voice: Muffled quality suggests peritonsillar involvement or abscess'
- 'Recurrent tonsillitis: ≥7 episodes in 1 year OR ≥5/year for 2 years OR ≥3/year
  for 3 years = tonsillectomy indication'
- 'Complications: Peritonsillar abscess (most common), retropharyngeal abscess, Lemierre
  syndrome (internal jugular thrombophlebitis)'
referrals:
- 'ENT if: Recurrent tonsillitis meeting criteria for tonsillectomy'
- 'Hospital admission if: Unable to swallow/dehydrated, respiratory compromise, suspected
  abscess'
- 'Emergency department if: Trismus, drooling, respiratory distress, unilateral tonsillar
  swelling'
differentials:
  - Pharyngitis
  - Mononucleosis
  - Peritonsillar abscess
  - Scarlet fever
  - Diphtheria
