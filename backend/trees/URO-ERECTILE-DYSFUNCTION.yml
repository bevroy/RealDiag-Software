tree_id: URO-ERECTILE-DYSFUNCTION
name: Erectile Dysfunction
family: urology
specialty: Urology/Primary Care
icd10: N52.9
snomed: 397803000
urgency: []
homeopathy: []
presentations:
  - Persistent inability to achieve or maintain erection sufficient for satisfactory sexual performance
  - Decreased rigidity of erections
  - Reduced frequency of morning erections
  - Loss of erections during intercourse
  - Symptoms present for at least 3 months
  - May have decreased libido (suggests hypogonadism or psychological cause)
  - Affects 40-50% of men over 40 years, increases with age
workup:
  - Comprehensive sexual history
  - Onset (sudden vs gradual), duration, severity
  - Ability to achieve vs maintain erections
  - Presence of morning erections (suggests psychogenic if present)
  - Libido (decreased suggests testosterone deficiency)
  - Relationship issues, stress, depression
  - International Index of Erectile Function (IIEF-5) questionnaire
  - 5-question validated tool, score 0-25
  - "Score 22-25: no ED"
  - "Score 17-21: mild"
  - "Score 12-16: mild-moderate"
  - "Score 8-11: moderate"
  - "Score 5-7: severe"
  - Identify risk factors and causes
  - Vascular (most common): hypertension, diabetes, hyperlipidemia, smoking, atherosclerosis
  - Neurogenic: diabetes, spinal cord injury, pelvic surgery (prostatectomy), multiple sclerosis
  - Hormonal: hypogonadism (low testosterone), hyperprolactinemia, thyroid disorder
  - Medications: antihypertensives (beta-blockers, thiazides), antidepressants (SSRIs), antipsychotics, anti-androgens
  - Psychogenic: performance anxiety, depression, relationship issues
  - Lifestyle: obesity, sedentary, alcohol, illicit drugs
  - Medication review (many drugs cause ED)
  - Beta-blockers, thiazide diuretics, spironolactone
  - SSRIs, tricyclic antidepressants
  - Finasteride, dutasteride
  - Antihistamines, H2-blockers (cimetidine)
  - Physical examination
  - Blood pressure, BMI
  - Cardiovascular exam
  - Genital exam: penile abnormalities (Peyronie's plaque), testicular size
  - Prostate exam (BPH or cancer)
  - Peripheral pulses (vascular disease)
  - Laboratory evaluation
  - Fasting glucose and hemoglobin A1c (diabetes)
  - Lipid panel (hyperlipidemia)
  - Morning total testosterone (8-10 AM) - ESSENTIAL
  - "Less than 300 ng/dL: hypogonadism"
  - If low, repeat plus free testosterone, LH, FSH, prolactin
  - TSH (thyroid)
  - Consider: PSA if over 40 years
  - Specialized testing (rarely needed)
  - Nocturnal penile tumescence testing (assesses nighttime erections - if present, suggests psychogenic)
  - Penile Doppler ultrasound (assess vascular flow)
  - Only if considering vascular surgery
treatment:
  - Lifestyle modifications (foundational for all patients)
  - Weight loss if overweight (improves ED in 30-40%)
  - Regular exercise (150 min/week moderate aerobic)
  - Smoking cessation (improves vascular function)
  - Limit alcohol (less than 2 drinks/day)
  - Optimize diabetes control, blood pressure, lipids
  - Treat underlying conditions
  - Testosterone replacement if hypogonadism (testosterone less than 300 ng/dL)
  - Testosterone gel (AndroGel, Testim) 50-100 mg daily
  - Testosterone injections (cypionate 75-100 mg IM weekly or 150-200 mg every 2 weeks)
  - Monitor PSA, hematocrit
  - Contraindications: prostate cancer, severe BPH, polycythemia
  - Change medications if causing ED (with prescriber approval)
  - Switch beta-blockers to alternative antihypertensive
  - Switch SSRI to bupropion or mirtazapine
  - Counseling if psychogenic component
  - Cognitive behavioral therapy
  - Sex therapy
  - Relationship counseling
  - First-line pharmacotherapy: PDE5 inhibitors
  - Sildenafil (Viagra) 25-100 mg taken 1 hour before sex
  - Vardenafil (Levitra) 5-20 mg taken 1 hour before sex
  - Tadalafil (Cialis) 5-20 mg taken 30 min before sex (long-acting 36 hours)
  - Avanafil (Stendra) 50-200 mg taken 15-30 min before sex (fastest onset)
  - Daily low-dose tadalafil 2.5-5 mg for spontaneity
  - Mechanism: enhance NO-mediated vasodilation, improve blood flow
  - Efficacy: 60-70% effective
  - Side effects: headache, flushing, nasal congestion, dyspepsia
  - Contraindications: nitrates (risk of severe hypotension), severe heart disease
  - Caution: alpha-blockers (hypotension risk)
  - Second-line treatments
  - Intraurethral alprostadil (MUSE) 125-1000 mcg suppository
  - Insert into urethra 5-10 min before sex
  - 40-50% effective
  - Side effects: penile pain, urethral burning
  - Intracavernosal injection (ICI) therapy
  - Alprostadil (Caverject) 2.5-40 mcg injected into penis
  - Combination therapy (alprostadil + papaverine + phentolamine)
  - 70-80% effective
  - Side effects: priapism (1-5%), fibrosis, pain
  - Vacuum erection device (VED)
  - Mechanical device creates vacuum, draws blood into penis
  - Place constriction ring at base to maintain erection
  - 60-70% effective
  - Non-invasive, no systemic effects
  - Third-line treatment: penile prosthesis (surgical)
  - Indications: failed all medical therapies or prefer permanent solution
  - Inflatable prosthesis (3-piece most natural)
  - Malleable/semi-rigid rods
  - 90-95% satisfaction rate
  - Risks: infection (1-3%), mechanical failure, erosion
clinical_pearls:
  - "ED affects 40-50% of men over 40, 70% over 70 - very common, often under-reported"
  - "ED is often first manifestation of cardiovascular disease - ED and heart disease share risk factors"
  - "PDE5 inhibitors (Viagra, Cialis) are first-line treatment - 60-70% effective"
  - "Always check morning testosterone - low testosterone contributes to ED in 30%"
  - "PDE5 inhibitors CONTRAINDICATED with nitrates - can cause life-threatening hypotension"
  - "Tadalafil (Cialis) lasts 36 hours vs sildenafil (Viagra) 4-6 hours - allows spontaneity"
  - "Psychogenic ED: sudden onset, situational, morning erections preserved"
  - "Vascular ED: gradual onset, progressive, no morning erections"
referrals:
  - Urology for failed PDE5 inhibitors or consideration of injections/prosthesis
  - Endocrinology for hypogonadism management
  - Cardiology if concern for underlying cardiovascular disease
  - Sex therapy/counseling for psychogenic ED
differentials:
  - Vascular ED (most common - gradual onset, risk factors: diabetes, hypertension, smoking)
  - Neurogenic ED (spinal cord injury, diabetes neuropathy, pelvic surgery)
  - Hormonal ED (hypogonadism - low libido, low testosterone)
  - Medication-induced ED (antihypertensives, antidepressants, antiandrogens)
  - Psychogenic ED (sudden onset, situational, relationship issues, depression)
  - Peyronie's disease (penile curvature, plaque, painful erections)
trace:
  source: American Urological Association Guidelines on Erectile Dysfunction, European Association of Urology Guidelines, UpToDate
