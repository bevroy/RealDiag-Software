tree_id: URO-ERECTILE-DYSFUNCTION
name: Erectile Dysfunction (ED)
family: Urology
specialty: Urology
icd10:
- N52.9
snomed:
- 397803000
urgency: medium
description: Comprehensive evaluation and management of Erectile Dysfunction (ED)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Inability to achieve or maintain erection
- Decreased libido
- Causes - vascular, neurologic, hormonal, psychogenic, medications
- Risk factors - diabetes, hypertension, heart disease, obesity
- May be early sign of cardiovascular disease
workup:
- 'History: Morning erections (psychogenic if present), medications, cardiovascular
  risk factors'
- 'Total testosterone: Check AM level (low if <300 ng/dL). Repeat if low to confirm'
- 'Fasting glucose or HbA1c: Screen for diabetes'
- 'Lipid panel: Cardiovascular risk assessment'
- 'TSH: If symptoms of hypothyroidism'
- 'Prolactin: If low libido, gynecomastia, or low testosterone (pituitary tumor)'
treatment:
- 'Guideline-based treatment options for Erectile Dysfunction (ED) include:'
- 'Lifestyle modification: Weight loss, exercise, smoking cessation, reduce alcohol
  - improves ED in 30% (AUA 2023)'
- 'PDE5 inhibitors (first-line): Sildenafil 50mg, tadalafil 10mg, vardenafil 10mg
  - take 1 hour before sex (AUA 2023)'
- 'Contraindications to PDE5 inhibitors: Nitrates (absolute - causes fatal hypotension),
  alpha-blockers (relative, can use with caution) (AUA 2023)'
- 'Testosterone replacement: If low testosterone (<300 ng/dL) AND symptoms (fatigue,
  decreased libido). Check AM total testosterone x2 (AUA 2023)'
- 'Second-line: Vacuum erection device, intraurethral alprostadil, intracavernosal
  injection (alprostadil), penile prosthesis (AUA 2023)'
clinical_pearls:
- 40% of men age 40, 70% age 70 - vascular causes most common (endothelial dysfunction)
- 'Sentinel for cardiovascular disease: ED symptoms often precede MI/stroke by 3-5
  years (same endothelial dysfunction)'
- 'Psychogenic vs organic: Morning erections present = psychogenic. Absent = organic
  vascular/neurologic'
- 'Medication causes: Antihypertensives (beta-blockers, thiazides), antidepressants
  (SSRIs), antiandrogens (finasteride), antipsychotics'
- 'Diabetes: 50% have ED (neuropathy, vascular disease, low testosterone)'
referrals:
- 'Urology if: Failed PDE5 inhibitors, low testosterone needs evaluation, considering
  second-line therapies (injection, prosthesis)'
- 'Cardiology if: No cardiovascular workup in past 5 years (ED may be first sign of
  CAD)'
differentials: []
trace:
  source: American Urological Association (AUA) Guidelines, European Association of
    Urology (EAU) Guidelines
