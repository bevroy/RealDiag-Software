tree_id: URO-ERECTILE-DYSFUNCTION
name: Erectile Dysfunction
family: Urology
specialty: Urology
chief_complaint: Inability to achieve or maintain erection
description: Persistent inability to achieve or maintain erection sufficient for sexual intercourse. PDE5 inhibitors highly effective first-line treatment, address underlying cardiovascular and psychological factors.
icd10: N52.9
urgency: non-urgent

workup:
  - Clinical history: duration, severity, nocturnal/morning erections (present suggests psychogenic), relationship factors, libido
  - Sexual Health Inventory for Men (SHIM/IIEF-5): quantifies severity (1-7 severe, 8-11 moderate, 12-21 mild, 22-25 normal)
  - Identify causes: vascular (most common - atherosclerosis, diabetes, hypertension), neurogenic (diabetes, spinal cord injury), hormonal (low testosterone), medications (antihypertensives, antidepressants, antipsychotics), psychogenic (performance anxiety, depression, relationship issues)
  - Cardiovascular risk assessment: ED often early manifestation of cardiovascular disease (shared risk factors)
  - Labs: fasting glucose (diabetes), lipid panel (dyslipidemia), morning total testosterone and free testosterone (hypogonadism if total <300), TSH if symptoms
  - Morning testosterone: if low (<300), repeat with LH, FSH, prolactin to distinguish primary vs secondary hypogonadism
  - Specialized testing rarely needed: nocturnal penile tumescence, duplex ultrasound, arteriography (only if considering vascular surgery)

treatment:
  - Lifestyle modifications: weight loss if obese, exercise, smoking cessation, limit alcohol, stress reduction
  - Optimize chronic diseases: diabetes control, BP management, lipid control
  - Medication review: discontinue or substitute offending medications if possible
  - PDE5 inhibitors (first-line): highly effective 70-80% response
  - Sildenafil (Viagra) 50-100 mg 1 hour before activity (lasts 4 hours), tadalafil (Cialis) 10-20 mg PRN or 5 mg daily (lasts 36 hours), vardenafil 10-20 mg
  - Contraindications: nitrates (absolute contraindication - profound hypotension), recent MI/stroke, uncontrolled hypertension, severe heart failure
  - Side effects: headache, flushing, dyspepsia, nasal congestion, transient vision changes
  - Testosterone replacement: if hypogonadism confirmed (total testosterone <300 on two morning samples), improves libido and erectile function
  - Testosterone formulations: topical gel daily, IM injection every 1-2 weeks, or pellet implant every 3-6 months
  - Monitor testosterone therapy: CBC (polycythemia risk), PSA (prostate cancer screening), DRE
  - Vacuum erection device: alternative if PDE5 inhibitor contraindicated or ineffective, non-invasive
  - Intraurethral alprostadil (MUSE) or intracavernosal injection (alprostadil, papaverine, phentolamine): second-line if PDE5 inhibitors fail
  - Penile prosthesis: surgical option for refractory cases, high satisfaction rates
  - Psychotherapy/couples counseling: if psychogenic component

clinical_pearls:
  - Persistent inability to achieve/maintain erection diagnostic
  - PDE5 inhibitors first-line - sildenafil or tadalafil highly effective 70-80%
  - Absolute contraindication with nitrates - can cause fatal hypotension
  - ED early marker of cardiovascular disease - assess CV risk factors
  - Check morning testosterone - if low consider replacement therapy
  - Lifestyle modifications important - weight loss, exercise, smoking cessation
  - Optimize diabetes and hypertension control
  - Often multifactorial - address vascular, hormonal, psychological factors

differentials:
  - Hypogonadism: low libido, fatigue, decreased muscle mass, low testosterone
  - Psychogenic ED: sudden onset, preserved nocturnal erections, situational, normal physical exam
  - Peyronie disease: penile curvature, plaques, painful erections
  - Premature ejaculation: ejaculation occurs too quickly, different from ED

trace: |
  A 58-year-old man with type 2 diabetes, hypertension, and dyslipidemia presented with 2 years progressive erectile dysfunction. Unable to achieve erection sufficient for intercourse despite desire. No morning erections. SHIM score 8 (moderate ED). Affecting relationship with wife. Medications: metformin, lisinopril, atorvastatin. Labs showed HbA1c 7.8%, fasting glucose 152, lipids LDL 95, morning total testosterone 420 (normal), TSH normal. No nitrate use. Diagnosed with erectile dysfunction secondary to vascular disease (diabetes, hypertension). Counseled on lifestyle modifications including weight loss (BMI 32), exercise, improved diabetes control. Started sildenafil 50 mg one hour before sexual activity. At 2 weeks reported successful intercourse 3 of 4 attempts (75% success), minimal side effects (mild headache). At 6 weeks increased to sildenafil 100 mg with improved success rate 90%. At 3 months excellent response, relationship improved significantly. Lost 12 pounds with exercise and diet. HbA1c improved to 7.2%. At 12 months continues sildenafil 100 mg PRN with consistent success, excellent quality of life, improved cardiovascular risk profile.
