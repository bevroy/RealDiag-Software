tree_id: NEURO-HEADACHE-MIGRAINE
name: Migraine Headache
family: Neurologic
specialty: Neurology
chief_complaint: Severe throbbing headache
description: Recurrent episodic severe headache with associated symptoms (nausea, photophobia, phonophobia), often unilateral and pulsating

icd10: G43.909

urgency: routine

workup:
  - Diagnostic criteria: at least 5 attacks lasting 4-72 hours with at least 2 of 4 pain characteristics (unilateral, pulsating, moderate-severe intensity, aggravated by physical activity) AND at least 1 associated symptom (nausea/vomiting, photophobia and phonophobia)
  - Migraine with aura: reversible focal neurologic symptoms (visual most common - scintillating scotoma, zigzag lines), sensory (paresthesias), speech/language, develops gradually over 5-20 minutes, lasts less than 60 minutes, followed by headache within 60 minutes
  - Migraine without aura: more common (75 percent), no preceding neurologic symptoms
  - Triggers: stress, sleep changes (too much or too little), hormonal changes (menstruation, oral contraceptives), certain foods (aged cheese, chocolate, red wine, MSG, artificial sweeteners), caffeine withdrawal, weather changes, bright lights, strong odors
  - Typical presentation: unilateral throbbing headache (can be bilateral), photophobia (light sensitivity), phonophobia (sound sensitivity), nausea/vomiting, osmophobia (odor sensitivity), desire to lie in dark quiet room
  - Exam: normal neurologic exam between attacks, during attack patient appears uncomfortable, may have allodynia (scalp tenderness)
  - Red flags requiring imaging: sudden severe headache (thunderclap), new headache age greater than 50, progressive worsening headache, headache with fever and neck stiffness, focal neurologic deficits, papilledema, change in headache pattern, headache after head trauma
  - Neuroimaging: MRI brain if red flags present, not needed for typical migraine with normal exam
  - Distinguish from other headaches: tension headache (bilateral band-like pressure, no nausea or photophobia), cluster headache (severe unilateral periorbital pain with lacrimation and rhinorrhea, shorter duration 15-180 minutes, multiple attacks per day)

treatment:
  - Acute treatment: treat early in attack (within 30-60 minutes of onset for best efficacy)
  - Mild-moderate migraine: NSAIDs (ibuprofen 400-800 mg, naproxen 500-1000 mg, aspirin 1000 mg) or acetaminophen 1000 mg plus caffeine (analgesic combination more effective)
  - Moderate-severe migraine: triptans first-line (sumatriptan 50-100 mg PO or 6 mg SC or 20 mg nasal spray, rizatriptan 10 mg ODT, eletriptan 40-80 mg, zolmitriptan), take at onset, can repeat once after 2 hours if needed, contraindications (cardiovascular disease, uncontrolled hypertension, hemiplegic migraine, basilar migraine)
  - Antiemetics: metoclopramide 10 mg PO/IV or prochlorperazine 10 mg PO/IM/IV (treats nausea and has independent analgesic effect)
  - Avoid opioids (not effective, cause medication overuse headache, dependence)
  - Status migrainosus (migraine lasting greater than 72 hours): IV fluids, IV metoclopramide or prochlorperazine, IV magnesium sulfate 2 grams, nerve block (occipital nerve block), IV valproate or corticosteroids
  - Preventive therapy indications: 4 or more migraine days per month, severe disability, contraindication to acute therapy, medication overuse headache, patient preference
  - First-line preventive medications: propranolol 80-240 mg daily (beta-blocker, contraindicated in asthma), topiramate 50-200 mg daily (anticonvulsant, weight loss side effect, avoid in pregnancy), amitriptyline 25-100 mg HS (tricyclic antidepressant, also helps sleep), valproate 500-1500 mg daily (avoid in women of childbearing potential, teratogenic)
  - CGRP antagonists: newer preventive medications, erenumab 70-140 mg SC monthly, fremanezumab, galcanezumab (monoclonal antibodies targeting CGRP pathway, very effective 50 percent reduction in migraine days, well-tolerated, expensive)
  - OnabotulinumtoxinA (Botox): for chronic migraine (15 or more headache days per month), 155-195 units injected every 12 weeks in specific head/neck sites, reduces migraine frequency
  - Lifestyle modifications: regular sleep schedule, regular meals, hydration, exercise, stress management, identify and avoid triggers, headache diary
  - Medication overuse headache: rebound headache from overuse of acute medications (greater than 10 days per month for triptans, greater than 15 days per month for NSAIDs), treatment requires discontinuation of overused medication (may worsen initially for 2-4 weeks before improving) plus preventive therapy

clinical_pearls:
  - Unilateral throbbing headache with nausea and photophobia/phonophobia classic
  - Aura (visual, sensory) develops over 5-20 minutes, lasts less than 60 minutes
  - Triptans first-line for moderate-severe (sumatriptan 50-100 mg)
  - Preventive therapy if 4 or more migraine days per month
  - First-line preventives: propranolol, topiramate, amitriptyline
  - CGRP antagonists very effective for prevention (erenumab monthly injection)
  - Avoid opioids and avoid medication overuse (rebound headache)

differentials:
  - Tension-type headache (bilateral band-like pressure, no nausea or photophobia, milder)
  - Cluster headache (severe unilateral periorbital, lacrimation, rhinorrhea, 15-180 minutes duration)
  - Subarachnoid hemorrhage (thunderclap headache, worst headache of life, sudden onset)
  - Meningitis (headache with fever, neck stiffness, photophobia)
  - Giant cell arteritis (age greater than 50, temporal headache, jaw claudication, elevated ESR)

trace:
  - 32-year-old woman presents to neurology clinic with recurrent severe headaches occurring 5-6 times per month x past year
  - Headache description: unilateral (usually left temporal), throbbing, severity 8/10, lasts 24-48 hours, preceded by visual aura (zigzag lines in right visual field lasting 15 minutes), associated with nausea, vomiting, extreme light and sound sensitivity (must lie in dark room), physical activity worsens pain
  - Triggers: menstruation (migraine worsens during period), stress at work, poor sleep, red wine
  - Current treatment: ibuprofen 400 mg provides minimal relief
  - History: started having migraines age 16 (menarche), worsened past year (new stressful job), mother has migraines, not taking daily medications
  - Exam: normal neurologic exam, BP 118/72, weight 140 pounds
  - Diagnosis: migraine with aura, episodic (5-6 attacks per month), inadequately treated
  - Headache diary started to track frequency, triggers, response to treatment
  - Acute treatment prescribed: sumatriptan 100 mg tablets, take at onset of headache (after aura), can repeat once after 2 hours if needed, max 200 mg per day, ondansetron 4 mg ODT for nausea
  - Preventive therapy discussed: frequency 5-6 per month (greater than 4) indicates need for prevention
  - Patient preference: wants to avoid weight gain, concerned about side effects
  - Started propranolol 40 mg BID (beta-blocker for prevention, generally well-tolerated)
  - Lifestyle counseling: regular sleep schedule (7-8 hours nightly), avoid red wine, stress management techniques, regular exercise, adequate hydration
  - Follow-up 1 month: using sumatriptan for 5 migraines (excellent relief if taken early within 30 minutes of headache onset, minimal relief if delayed), migraine frequency reduced to 4 per month (propranolol helping)
  - Increased propranolol to 60 mg BID
  - 3 months: migraine frequency reduced to 2-3 per month (50 percent reduction, excellent response), severity decreased to 5/10 when occur, sumatriptan very effective when taken early
  - 6 months: continues propranolol 60 mg BID, migraine frequency 2 per month (well-controlled), quality of life significantly improved, able to work without missing days
  - Discussed long-term: continue preventive therapy x 6-12 months then consider slow taper (may be able to discontinue if migraine-free or very infrequent)
