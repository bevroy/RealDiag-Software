tree_id: PSYCH-DEMENTIA-BEHAVIORAL-DISTURBANCE
name: Dementia with Behavioral Disturbance
family: psychiatry
specialty: Psychiatry/Geriatrics/Neurology
icd10: F03.91
snomed: 429998004
urgency: []
homeopathy: []
presentations:
  - Established diagnosis of dementia with superimposed behavioral or psychological symptoms
  - Agitation, aggression, or combativeness
  - Wandering or pacing
  - Verbal disruption (yelling, repetitive questioning, screaming)
  - Resistance to care (refusing bathing, medications, eating)
  - Sleep disturbance (day-night reversal, sundowning)
  - Psychotic symptoms (hallucinations, delusions, paranoia)
  - Depression, anxiety, or apathy
  - Disinhibition or inappropriate sexual behavior
  - Symptoms cause significant distress or impairment
workup:
  - Confirm underlying dementia diagnosis and type
  - Alzheimer disease (most common, 60-70%)
  - Vascular dementia
  - Lewy body dementia (visual hallucinations, parkinsonism)
  - Frontotemporal dementia (behavioral variant)
  - Assess behavioral symptoms systematically
  - Type, frequency, severity, triggers
  - Neuropsychiatric Inventory (NPI)
  - Cohen-Mansfield Agitation Inventory (CMAI)
  - Cornell Scale for Depression in Dementia
  - Rule out reversible medical causes of behavioral change (CRITICAL)
  - Delirium (infection, medication, metabolic disturbance)
  - Pain or discomfort
  - Urinary tract infection (common trigger in elderly)
  - Constipation or urinary retention
  - Medication side effects or toxicity
  - Hypoxia, hypoglycemia
  - Physical examination
  - Vital signs (fever suggests infection)
  - Focused exam for sources of pain or discomfort
  - Neurological exam for acute changes
  - Environmental and psychosocial assessment
  - Caregiver stress and capability
  - Environmental triggers (overstimulation, understimulation)
  - Unmet needs (hunger, thirst, toileting, social interaction)
  - Recent changes in routine or environment
  - Laboratory evaluation if acute change
  - Urinalysis and culture (UTI very common)
  - CBC, CMP
  - Consider chest X-ray if respiratory symptoms
treatment:
  - Non-pharmacological interventions FIRST-LINE (most effective and safest)
  - Identify and address unmet needs
  - Pain management
  - Ensure adequate nutrition and hydration
  - Assist with toileting needs
  - Provide meaningful activities and social interaction
  - Environmental modifications
  - Reduce noise, clutter, and overstimulation
  - Adequate lighting (reduces sundowning)
  - Consistent daily routine
  - Safe wandering areas
  - Behavioral interventions
  - Validation therapy (acknowledge emotions)
  - Redirection and distraction
  - Music therapy
  - Pet therapy
  - Caregiver education and support
  - Education on dementia behaviors
  - Stress management for caregivers
  - Respite care
  - Pharmacological treatment (only after non-pharmacological approaches fail)
  - Treat underlying depression/anxiety if present
  - SSRIs: citalopram 10-20 mg (most evidence), sertraline 25-100 mg
  - Avoid tricyclic antidepressants (anticholinergic effects worsen cognition)
  - For psychosis or severe agitation (use cautiously)
  - Atypical antipsychotics (BLACK BOX WARNING: increased mortality in dementia)
  - Risperidone 0.25-1 mg daily (most evidence)
  - Quetiapine 25-100 mg daily (more sedating)
  - Use lowest dose, shortest duration, frequent reassessment
  - Avoid typical antipsychotics (haloperidol) - higher side effects
  - For Lewy body dementia psychosis
  - Pimavanserin 34 mg daily (FDA-approved for Parkinson's psychosis)
  - Cholinesterase inhibitors may help (rivastigmine, donepezil)
  - Avoid benzodiazepines (worsen confusion, falls, paradoxical agitation)
  - Sleep disturbance
  - Melatonin 3-10 mg at bedtime (safest)
  - Trazodone 25-50 mg at bedtime
  - Avoid antihistamines (anticholinergic)
  - Avoid physical restraints (increase agitation, injury, mortality)
clinical_pearls:
  - "Behavioral symptoms affect 90% of dementia patients at some point - NOT normal aging"
  - "Always assume delirium (reversible) until proven otherwise - UTI, constipation, pain most common triggers"
  - "Non-pharmacological interventions first-line and most effective - medications have limited benefit and significant risks"
  - "Antipsychotics have BLACK BOX WARNING in dementia - increased mortality risk (1.6-1.7x) and stroke"
  - "Use antipsychotics only for severe symptoms after non-pharmacological approaches fail - lowest dose, shortest duration"
  - "Behavioral symptoms often represent unmet needs - pain, hunger, thirst, toileting, boredom, overstimulation"
  - "Sundowning (late afternoon/evening agitation) affects 20-45% - increase daytime light exposure, consistent routine"
  - "Caregiver education and support critical - reduces behavioral symptoms and delays nursing home placement"
referrals:
  - Geriatric psychiatry for medication management and complex behavioral symptoms
  - Neurology for dementia diagnosis confirmation or progression
  - Geriatrics for comprehensive dementia management
  - Social work for caregiver support, resources, placement planning
  - Palliative care for advanced dementia
differentials:
  - Dementia with behavioral disturbance (chronic cognitive impairment with behavioral symptoms)
  - Delirium superimposed on dementia (acute change, fluctuating, reversible cause)
  - Major depressive disorder in dementia (apathy, withdrawal, pseudodementia)
  - Lewy body dementia (visual hallucinations, parkinsonism, fluctuating cognition)
  - Frontotemporal dementia (early behavioral changes, disinhibition, language problems)
  - Vascular dementia (stepwise decline, cardiovascular risk factors)
  - Medication-induced behavioral changes (anticholinergics, benzodiazepines, opioids)
  - Pain or medical illness (causes behavioral changes in cognitively impaired)
trace:
  source: American Geriatrics Society Beers Criteria, APA Practice Guidelines on Alzheimer Disease, Cochrane Review on Antipsychotics in Dementia
  version: '1.0'
  last_updated: '2025-12-26'
