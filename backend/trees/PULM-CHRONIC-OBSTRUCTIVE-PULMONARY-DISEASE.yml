tree_id: PULM-CHRONIC-OBSTRUCTIVE-PULMONARY-DISEASE
name: Chronic Obstructive Pulmonary Disease
family: Pulmonology
specialty: Pulmonology
chief_complaint: Chronic dyspnea and productive cough
description: |
  Progressive airflow limitation from chronic bronchitis and/or emphysema. Primarily caused by smoking (85-90%).
  Fourth leading cause of death worldwide. Characterized by irreversible airflow obstruction.
icd10: J44.9
urgency: Moderate
workup:
  - Spirometry diagnostic - FEV1/FVC ratio less than 0.7 confirms airflow obstruction
  - Severity by FEV1 percent predicted - GOLD 1 (greater than 80%), GOLD 2 (50-79%), GOLD 3 (30-49%), GOLD 4 (less than 30%)
  - Chest X-ray shows hyperinflation, flattened diaphragm, increased AP diameter (barrel chest)
  - High-resolution CT chest if considering surgery or uncertain diagnosis (shows emphysema distribution)
  - Alpha-1 antitrypsin level if early-onset COPD (less than 45 years) or minimal smoking history
  - ABG if severe exacerbation or hypoxemia (assess for hypercapnia and respiratory acidosis)
  - 6-minute walk test and BODE index (Body mass, Obstruction, Dyspnea, Exercise) predict mortality
treatment:
  - Smoking cessation most important intervention (slows disease progression)
  - Short-acting bronchodilators for all symptomatic patients - albuterol 2 puffs q4-6h PRN or ipratropium 2 puffs QID
  - Long-acting bronchodilators for persistent symptoms - LABA (formoterol, salmeterol) or LAMA (tiotropium, umeclidinium)
  - Combination LABA/LAMA preferred if inadequate response to monotherapy
  - Inhaled corticosteroids (ICS) added if frequent exacerbations (2 or more per year) or eosinophilia - fluticasone/salmeterol or budesonide/formoterol
  - Triple therapy (ICS/LABA/LAMA) for severe COPD with frequent exacerbations
  - Supplemental oxygen if resting SpO2 less than 88% or PaO2 less than 55 mmHg (improves survival)
  - Pulmonary rehabilitation improves functional capacity and quality of life
  - Vaccinations - influenza annually, pneumococcal (PPSV23 and PCV20), COVID-19
  - Lung volume reduction surgery or bronchoscopic valve placement for severe emphysema
clinical_pearls:
  - Chronic bronchitis defined clinically - productive cough for 3 months in 2 consecutive years
  - Emphysema defined pathologically - destruction of alveolar walls with permanent airspace enlargement
  - Pink puffers (emphysema-predominant) - thin, tachypneic, minimal cyanosis, low DLCO
  - Blue bloaters (chronic bronchitis-predominant) - obese, cyanotic, peripheral edema, elevated PaCO2
  - COPD exacerbation triggers include infections (viral or bacterial), air pollution, non-adherence to medications
  - Cor pulmonale (right heart failure from pulmonary hypertension) occurs in advanced COPD
differentials:
  - Asthma
  - Bronchiectasis
  - Heart failure
  - Interstitial lung disease
  - Lung cancer
  - Bronchiolitis obliterans
trace:
  - Progressive dyspnea on exertion x 3 years, productive cough most mornings, 40 pack-year smoking history → Spirometry shows FEV1/FVC 0.55, FEV1 52% predicted (GOLD 2) → Chest X-ray shows hyperinflation → Diagnose moderate COPD → Smoking cessation counseling → Tiotropium 18mcg daily plus albuterol PRN → Influenza and pneumococcal vaccines → Pulmonary rehabilitation referral → Symptoms improve, continue LAMA therapy
