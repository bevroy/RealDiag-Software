snomed:
- '240131006'
urgency: medium
description: Comprehensive evaluation and management of Rhabdomyolysis
version: '1.0'
citations:
  - KDIGO (Kidney Disease: Improving Global Outcomes) Guidelines
  - NKF (National Kidney Foundation) Clinical Practice Guidelines
  - UpToDate - Nephrology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Muscle pain, swelling, weakness (myalgias)
- Dark (tea-colored) urine (myoglobinuria)
- Markedly elevated CK (>5,000 U/L, often >10,000)
- AKI (Cr rising, oliguria from myoglobin-induced ATN)
- Hyperkalemia, hyperphosphatemia, hypocalcemia (acute), hyperuricemia
- 'Causes: Trauma, prolonged immobilization, seizures, statins, cocaine, heat stroke,
  severe exercise'
workup:
- CK (markedly elevated >5,000, often >10,000)
- Basic metabolic panel (Cr, K+, PO4, Ca2+)
- Urinalysis (myoglobin, no RBCs on microscopy)
- Urine myoglobin (if available)
- Liver function tests (transaminases often elevated from muscle injury)
treatment:
- 'Guideline-based treatment options for Rhabdomyolysis include:'
- 'Aggressive IV fluid resuscitation: NS or LR 200-300 mL/hr (goal UOP 200-300 mL/hr)
  (KDIGO 2024)'
- Target urine output 3 mL/kg/hr to flush myoglobin (KDIGO 2024)
- 'Correct electrolytes: Treat hyperkalemia (Ca, insulin/glucose), hold calcium initially
  (hypocalcemia) (KDIGO 2024)'
- Monitor CK daily until trending down (KDIGO 2024)
- 'Dialysis if: AKI with oliguria, refractory hyperkalemia, severe acidosis (KDIGO
  2024)'
clinical_pearls:
- Myoglobin precipitates in renal tubules → ATN
- Urine dipstick positive for blood but no RBCs on microscopy (detects myoglobin)
- CK >15,000 or rapidly rising → high risk for AKI
- Aggressive IV hydration (200-300 mL/hr) is KEY to prevent AKI
- 'Compartment syndrome: Tense, swollen compartment + pain with passive stretch →
  needs fasciotomy'
referrals:
- Nephrology if AKI developing
- ICU if severe (CK >50,000, AKI, severe electrolyte abnormalities)
- Orthopedic surgery if compartment syndrome suspected
differentials:
  - Crush injury
  - Prolonged immobilization
  - Drug/toxin
  - Infection
  - Electrolyte imbalance
