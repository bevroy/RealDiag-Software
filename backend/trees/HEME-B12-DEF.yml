presentations:
  - Macrocytic anemia (MCV > 100)
  - Fatigue, weakness
  - Fatigue
  - Neurologic symptoms (peripheral neuropathy, ataxia, dementia)
  - Peripheral neuropathy
  - Numbness and tingling in hands and feet
  - Numbness in extremities
  - Tingling or paresthesias
  - Ataxia or gait instability
  - Gait instability or balance problems
  - Unsteady walking
  - Difficulty walking
  - Cognitive impairment or memory problems
  - Dementia or confusion
  - Glossitis (smooth, beefy red tongue)
  - Sore tongue
  - Low B12 level
  - Elevated methylmalonic acid and homocysteine
differentials:
  - Folate deficiency
  - Hypothyroidism
  - Alcoholism
  - Hemolysis
  - Myelodysplastic syndrome
workup:
  - 'CBC: Macrocytic anemia (MCV >100), hypersegmented neutrophils (>5 lobes)'
  - 'B12 level: <200 pg/mL diagnostic. If borderline, check methylmalonic acid and homocysteine (both elevated in B12 deficiency)'
  - Anti-intrinsic factor antibodies (specific for pernicious anemia, 50% sensitive)
  - Anti-parietal cell antibodies (90% sensitive but less specific for pernicious anemia)
treatment:
  - 'Guideline-based treatment options for Vitamin B12 Deficiency Anemia include:'
  - 'Parenteral B12 (initial): Cyanocobalamin 1000 mcg IM daily × 1 week, then weekly × 4 weeks, then monthly lifelong (ASH 2023)'
  - 'Oral B12 (if not pernicious anemia or severe): 1000-2000 mcg PO daily (high dose overcomes malabsorption) (ASH 2023)'
  - 'Pernicious anemia: Lifelong IM injections (oral insufficient due to lack of intrinsic factor) (ASH 2023)'
  - 'Monitor: Reticulocytosis in 3-5 days, neurologic symptoms may take 6-12 months to improve (ASH 2023)'
  - Check for potassium drop first week of treatment (hypokalemia from rapid cell production) (ASH 2023)
clinical_pearls:
  - Neurologic damage from B12 deficiency is IRREVERSIBLE if untreated - treat even if anemia not severe
  - 'Causes: Pernicious anemia (anti-IF antibodies, 60%), malabsorption (post-gastric bypass, Crohn''s), strict vegan diet'
  - 'Peripheral neuropathy: Stocking-glove paresthesias. Subacute combined degeneration: Posterior columns + lateral corticospinal tracts'
  - B12 level <200 pg/mL = deficient. 200-300 = borderline (check MMA and homocysteine)
  - Folate replacement WITHOUT B12 in combined deficiency can worsen neurologic symptoms
red_flags: []
disposition_guidance: {}
referrals:
  - 'Hematology if: Severe pancytopenia, unclear cause of macrocytosis, or refractory to treatment'
  - Neurology if severe neurologic symptoms or subacute combined degeneration
  - Gastroenterology if concern for malabsorption (Crohn's, celiac)
