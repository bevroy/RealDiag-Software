tree_id: EMERGENCY-PULMONARY-EMBOLISM
name: Pulmonary Embolism
family: Emergency Medicine
specialty: Emergency Medicine, Pulmonology, Critical Care
chief_complaint: Chest Pain, Shortness of Breath, Hypoxia
description: Risk stratification and management of acute pulmonary embolism using evidence-based protocols
version: "1.0"
icd10: I26.99
author: RealDiag Clinical Team

entry_point: pe_screening

nodes:
  - id: pe_screening
    type: question
    text: "Clinical suspicion for pulmonary embolism?"
    options:
      - label: "Massive PE - Hypotension/shock OR cardiac arrest"
        next: massive_pe
      - label: "High probability - Dyspnea, tachycardia, chest pain with risk factors"
        next: pe_workup
      - label: "Low probability - Mild symptoms, low risk score"
        next: low_probability_pe

  - id: massive_pe
    type: diagnosis
    name: "Massive Pulmonary Embolism with Hemodynamic Instability"
    icd10: "I26.02"
    urgency: critical
    workup:
      - STAT bedside echo (RV strain, D-sign, McConnell's sign)
      - Portable chest X-ray
      - ECG (S1Q3T3, right heart strain, tachycardia)
      - Troponin, BNP/NT-proBNP (elevated suggests RV strain)
      - ABG (hypoxemia, respiratory alkalosis)
      - CBC, CMP, coagulation studies (PT/INR, PTT)
      - D-dimer (not needed if high clinical suspicion and unstable)
      - CT angiography chest IF patient stable enough for transport
      - DO NOT delay treatment for imaging if patient unstable
    treatment:
      - IMMEDIATE RESUSCITATION
      - 100% oxygen, intubation if needed
      - Aggressive IV fluids (500-1000 mL NS bolus) - but avoid overload (can worsen RV)
      - Vasopressors if needed (norepinephrine preferred)
      - THROMBOLYSIS - EMERGENT if hemodynamically unstable - tPA 100 mg IV over 2 hours OR tPA 50 mg IV bolus if extreme instability - Contraindications include active bleeding, recent surgery under 2 weeks, stroke under 3 months, brain lesion
      - Anticoagulation - Heparin bolus 80 units/kg IV then 18 units/kg/hr OR Enoxaparin 1 mg/kg SC q12h if not getting thrombolytics
      - Consider catheter-directed thrombolysis if available
      - Consider surgical embolectomy if thrombolysis contraindicated
      - ICU admission
      - Cardiothoracic surgery consultation
      - IVC filter if anticoagulation contraindicated
    prognosis: "High mortality (30-50%) if untreated; thrombolysis reduces mortality to 10-15%"

  - id: pe_workup
    type: question
    text: "Calculate Wells Score and assess pretest probability"
    options:
      - label: "Wells >4 OR high clinical suspicion"
        next: ct_angiography
      - label: "Wells ≤4 AND D-dimer available"
        next: d_dimer_test
      - label: "Pregnancy - cannot do CT"
        next: pregnancy_pe

  - id: ct_angiography
    type: diagnosis
    name: "Acute Pulmonary Embolism (Confirmed)"
    icd10: "I26.99"
    urgency: emergency
    workup:
      - CT angiography chest (GOLD STANDARD)
        - Direct visualization of thrombus in pulmonary arteries
        - "Assess RV/LV ratio (greater than 1.0 suggests RV strain)"
      - Troponin, BNP (risk stratification)
      - ECG
      - ABG or pulse oximetry
      - Lower extremity venous duplex ultrasound
      - Consider sPESI or PESI score for risk stratification
    treatment:
      - Risk Stratification for Treatment Location
        - High risk (sPESI ≥1, RV dysfunction, troponin elevated) → ICU
        - Intermediate risk → Telemetry/step-down
        - Low risk (sPESI 0, no RV dysfunction) → Consider outpatient if good support
      - "Anticoagulation (START IMMEDIATELY) - Option 1: Apixaban 10 mg PO BID x7 days then 5 mg PO BID, Option 2: Rivaroxaban 15 mg PO BID x21 days then 20 mg daily, Option 3: Enoxaparin 1 mg/kg SC q12h bridged to warfarin (INR 2-3), Option 4: Heparin IV (80 units/kg bolus, 18 units/kg/hr) if high bleeding risk or renal failure"
      - "Duration of anticoagulation - Provoked (surgery, trauma, estrogen) 3 months, Unprovoked 3-6 months minimum consider indefinite, Recurrent PE indefinite, Cancer-associated LMWH or DOAC indefinitely"
      - Supportive care
        - "Supplemental oxygen to maintain SpO2 greater than 90%"
        - Pain control
        - Avoid dehydration
      - IVC filter if:
        - Absolute contraindication to anticoagulation
        - Recurrent PE despite adequate anticoagulation
        - Free-floating IVC/iliofemoral thrombus
      - Thrombolysis if submassive with clinical deterioration
        - RV dysfunction + troponin elevation + worsening
        - tPA 100 mg over 2 hours
      - Thrombophilia workup (in select patients)
        - "Unprovoked PE at young age (under 50)"
        - Recurrent VTE
        - Family history
        - "Test for Factor V Leiden, Prothrombin G20210A, Protein C/S, Antithrombin, Antiphospholipid antibodies"
    prognosis: "Mortality 2-10% acute phase; excellent with proper anticoagulation"

  - id: d_dimer_test
    type: question
    text: "D-dimer result?"
    options:
      - label: "D-dimer negative (<500 ng/mL)"
        next: pe_ruled_out
      - label: "D-dimer positive"
        next: ct_angiography

  - id: pe_ruled_out
    type: diagnosis
    name: "Pulmonary Embolism Ruled Out"
    icd10: "R06.02"
    urgency: low
    workup:
      - Consider alternative diagnoses
      - Chest X-ray if not done
      - ECG
    treatment:
      - Evaluate for other causes of symptoms
      - Reassurance if low risk
      - Return precautions
    prognosis: "Excellent"

  - id: low_probability_pe
    type: diagnosis
    name: "Low Probability PE - Further Workup Needed"
    icd10: "R06.02"
    urgency: moderate
    workup:
      - D-dimer
      - If negative - PE essentially ruled out
      - If positive - proceed to CT angiography
    treatment:
      - Based on workup results
    prognosis: "Good"

  - id: pregnancy_pe
    type: diagnosis
    name: "Pulmonary Embolism in Pregnancy"
    icd10: "O88.219"
    urgency: emergency
    workup:
      - Lower extremity venous duplex (if positive, treat for PE without further imaging)
      - If duplex negative AND high suspicion:
        - V/Q scan preferred over CT (less fetal radiation)
        - CT angiography with shielding if V/Q unavailable
      - D-dimer unreliable in pregnancy (often elevated)
    treatment:
      - LMWH (enoxaparin 1 mg/kg SC q12h) - preferred in pregnancy
      - Continue throughout pregnancy and 6 weeks postpartum
      - Switch to UFH before delivery for easier reversal
      - NO warfarin (teratogenic)
      - DOACs not studied in pregnancy
      - Thrombolysis only if life-threatening
    prognosis: "Good with proper treatment; increased risk postpartum"

clinical_pearls:
  - "Wells Score: DVT sx (3), PE most likely dx (3), HR>100 (1.5), immobilization/surgery (1.5), prior PE/DVT (1.5), hemoptysis (1), cancer (1)"
  - "sPESI: Age >80, cancer, CHF, COPD, HR≥110, SBP<100, O2<90% (0 = low risk for outpatient)"
  - "S1Q3T3 pattern seen in <20% of PE cases"
  - "RV/LV ratio >1.0 on CT indicates RV strain"
  - "Saddle embolus (main PA bifurcation) has high mortality"
  - "DOACs (apixaban, rivaroxaban) now first-line for most patients"
  - "Cancer patients should get LMWH or DOAC, not warfarin"

red_flags:
  - "Hypotension or shock (massive PE)"
  - "Severe hypoxemia (SpO2 <90% on room air)"
  - "RV dysfunction on echo"
  - "Elevated troponin and BNP"
  - "Syncope (suggests large clot burden)"
  - "Signs of DVT"
  - "Recent surgery, immobilization, or long travel"
