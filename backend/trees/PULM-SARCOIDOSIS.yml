tree_id: PULM-SARCOIDOSIS
name: Pulmonary Sarcoidosis
family: Pulmonology
specialty: Pulmonology
icd10:
- D86.0
- D86.9
snomed:
- '31541009'
urgency: medium
description: Comprehensive evaluation and management of Pulmonary Sarcoidosis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Dyspnea
- Dry cough
- Chest discomfort
- Bilateral hilar lymphadenopathy on imaging
- Systemic symptoms (fatigue, weight loss)
workup:
- 'Chest X-ray: Bilateral hilar lymphadenopathy (Stage I-II), reticulonodular infiltrates'
- 'CT chest: Perilymphatic nodules along bronchovascular bundles'
- 'Tissue biopsy: Transbronchial biopsy (EBUS-guided if mediastinal nodes), or skin/lymph
  node if accessible'
- 'PFTs: Restrictive or obstructive, reduced DLCO'
- 'Labs: ACE level (elevated 60%, not specific), elevated calcium (10%), lymphopenia'
- Ophthalmology exam (uveitis in 25%), ECG (arrhythmias, heart block)
treatment:
- 'Guideline-based treatment options for Pulmonary Sarcoidosis include:'
- 'Asymptomatic Stage I: Observation (50% spontaneous resolution) (ATS 2023)'
- 'Symptomatic pulmonary: Prednisone 20-40mg daily x 1-2 months, then taper over 6-12
  months (ATS 2023)'
- 'Steroid-sparing agents if relapse or prolonged treatment: Methotrexate 10-15mg
  weekly or azathioprine (ATS 2023)'
- 'Cardiac sarcoid: High-dose steroids (prednisone 40-60mg), ICD if high-risk arrhythmias
  (ATS 2023)'
- 'Neurosarcoidosis: High-dose steroids + immunosuppression (ATS 2023)'
clinical_pearls:
- Multisystem granulomatous disease, lungs involved in 90%, also skin, eyes, heart,
  CNS
- Bilateral hilar lymphadenopathy + erythema nodosum + arthritis = Löfgren syndrome
  (acute, good prognosis)
- 'Diagnosis: Compatible clinical/radiologic + non-caseating granulomas on biopsy
  + exclusion of other causes'
- 'Stages: I (hilar LAD only), II (LAD + infiltrates), III (infiltrates only), IV
  (fibrosis)'
- 50% resolve spontaneously without treatment (especially Stage I and Löfgren)
- 'Cardiac sarcoid: Arrhythmias, heart block - needs PET, cardiac MRI, EP study, may
  need ICD'
referrals:
- Pulmonology for diagnosis (bronchoscopy, biopsy) and treatment
- Cardiology if cardiac symptoms (palpitations, syncope) - needs PET, cardiac MRI,
  EP study
- Ophthalmology for uveitis screening
- Neurology if CNS involvement (cranial neuropathy, seizures)
differentials:
  - Tuberculosis
  - Lymphoma
  - Fungal infection
  - Pneumoconiosis
  - Hypersensitivity pneumonitis
trace:
  source: American Thoracic Society (ATS) Guidelines, Global Initiative for Chronic
    Obstructive Lung Disease (GOLD)
