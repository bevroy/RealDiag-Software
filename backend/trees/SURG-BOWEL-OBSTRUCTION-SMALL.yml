description: Comprehensive evaluation and management of Small Bowel Obstruction (SBO)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Cramping, colicky abdominal pain (intermittent)
- Nausea and vomiting (bilious, high volume, early symptom)
- Abdominal distension
- 'Obstipation: No passage of stool or flatus'
- High-pitched, tinkling bowel sounds (early) → absent (late)
- Dehydration from third-spacing and vomiting
- 'Causes: Adhesions (60%, prior surgery), hernia (20%), malignancy, Crohn''s'
- 'CT: Dilated small bowel >3cm with transition point, air-fluid levels on X-ray'
workup: []
treatment:
- 'Guideline-based treatment options for Small Bowel Obstruction (SBO) include:'
- 'Immediate: NPO, NGT decompression (continuous suction), IV fluids (NS or LR 100-200
  mL/hr) (ACS 2023)'
- 'Labs: CBC (leukocytosis = strangulation), BMP (check K+ from vomiting), lactate
  (ischemia) (ACS 2023)'
- 'CT abdomen/pelvis with IV contrast: Identify transition point, rule out ischemia/strangulation
  (ACS 2023)'
- 'Conservative management: NGT, IV fluids, serial exams if partial SBO and no strangulation
  signs (ACS 2023)'
- 'Surgery consult: If complete obstruction, closed-loop, strangulation signs, virgin
  abdomen, or fails conservative therapy (ACS 2023)'
clinical_pearls:
- Adhesions = most common cause (60%), especially if prior abdominal surgery
- 'Complete vs partial: Complete SBO (no gas in colon), partial (some gas passes through)'
- 'CT findings: Transition point, small bowel feces sign, closed-loop obstruction
  (surgical emergency)'
- 'NGT decompression: Decreases vomiting, aspiration risk, helps conservative management'
- 'Surgery indications: Strangulation signs (fever, tachycardia, leukocytosis, peritonitis),
  closed-loop, no improvement 3-5 days'
- Virgin abdomen (no prior surgery) SBO = more likely needs surgery (hernia, malignancy)
