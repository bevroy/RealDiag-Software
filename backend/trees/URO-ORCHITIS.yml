tree_id: URO-ORCHITIS
name: Orchitis (Testicular Inflammation)
family: urology
specialty: Urology/Infectious Disease
icd10: N45.2
snomed: 197983000
urgency: []
homeopathy: []
presentations:
  - Testicular pain and swelling (unilateral or bilateral)
  - Scrotal erythema and warmth
  - Fever and malaise
  - Nausea and vomiting
  - Lower abdominal pain
  - Dysuria (if concurrent urinary tract infection)
  - Parotid swelling if mumps orchitis (20-30% of post-pubertal males with mumps)
  - Hydrocele may develop (fluid accumulation around testicle)
  - Pain with walking or movement
workup:
  - History
  - Onset and duration of symptoms
  - Recent viral illness (mumps, other viral infections)
  - Mumps vaccination status
  - Sexual activity, urethral discharge (STI risk)
  - Urinary symptoms (dysuria, frequency)
  - Recent urologic procedures or instrumentation
  - Physical examination
  - Testicular examination: tender, swollen, firm testicle
  - Epididymis typically normal (vs epididymitis where epididymis is primary site)
  - Scrotal skin: erythema, warmth
  - Cremasteric reflex present (vs absent in torsion)
  - Parotid gland examination if mumps suspected
  - Transillumination if hydrocele suspected
  - Doppler ultrasound
  - INCREASED blood flow to affected testicle (hyperemia)
  - Distinguishes from testicular torsion (decreased flow)
  - Testicular enlargement, heterogeneous echotexture
  - Hydrocele may be present
  - Urinalysis and urine culture
  - Usually NEGATIVE in isolated viral orchitis
  - Pyuria/bacteriuria if bacterial or concurrent epididymo-orchitis
  - STI testing if sexually active
  - Gonorrhea and chlamydia NAAT (urine or urethral swab)
  - Laboratory tests
  - CBC: leukocytosis if bacterial, mild elevation if viral
  - Mumps serology (IgM and IgG) if mumps suspected
  - Blood cultures if systemically ill or concern for bacteremia
treatment:
  - Management based on etiology
  - Viral orchitis (most common: mumps)
  - Supportive care is mainstay
  - NSAIDs for pain and inflammation (ibuprofen 600 mg every 6 hours, naproxen 500 mg twice daily)
  - Scrotal elevation and support (athletic supporter or rolled towel under scrotum)
  - Ice packs (15-20 minutes at a time)
  - Rest, avoid heavy lifting and sexual activity
  - No specific antiviral treatment for mumps
  - Symptoms typically resolve in 3-10 days
  - Bacterial orchitis or epididymo-orchitis
  - If STI suspected (sexually active, younger than 35, urethral discharge)
  - Ceftriaxone 500 mg IM single dose PLUS doxycycline 100 mg twice daily for 10 days
  - If UTI/enteric organism suspected (older than 35, urinary symptoms)
  - Levofloxacin 500 mg daily for 10-14 days OR trimethoprim-sulfamethoxazole DS twice daily for 10-14 days
  - Severe or systemic infection
  - Hospitalization for IV antibiotics (ceftriaxone, gentamicin, ampicillin)
  - Complications
  - Testicular abscess: requires surgical drainage or orchiectomy
  - Testicular infarction: may require orchiectomy if non-viable
  - Chronic pain: NSAIDs, nerve blocks, pelvic floor physical therapy
  - Testicular atrophy: no specific treatment, monitor testosterone if bilateral
  - Prevention (mumps orchitis)
  - MMR vaccination (measles, mumps, rubella)
  - Two doses: first at 12-15 months, second at 4-6 years
  - Highly effective (88% efficacy after 2 doses)
clinical_pearls:
  - "Orchitis is inflammation of testicle itself (vs epididymitis where epididymis is primary site)"
  - "Mumps orchitis occurs in 20-30% of post-pubertal males with mumps, rarely before puberty"
  - "Bilateral orchitis in 10-30% of cases"
  - "Testicular atrophy occurs in 30-50% after mumps orchitis, but infertility uncommon (less than 15%)"
  - "Mumps orchitis typically occurs 4-8 days after parotitis onset"
  - "Increased blood flow on Doppler distinguishes orchitis from testicular torsion (decreased flow)"
  - "Bacterial orchitis is rare in isolation - usually accompanies epididymitis (epididymo-orchitis)"
  - "Post-pubertal males with mumps should be monitored for orchitis development"
  - "MMR vaccination has dramatically reduced incidence of mumps orchitis in developed countries"
referrals:
  - Urology if no improvement after 3-5 days of appropriate antibiotics
  - Urology urgent if concern for abscess, testicular rupture, or infarction
  - Urology if chronic pain develops or testicular atrophy with fertility concerns
  - Infectious disease if atypical organism suspected (tuberculosis, brucellosis, syphilis)
differentials:
  - Epididymitis (tenderness primarily in epididymis posterior to testicle, relief with elevation)
  - Epididymo-orchitis (combined inflammation of epididymis and testicle, most common bacterial scenario)
  - Testicular torsion (sudden onset, absent cremasteric reflex, decreased blood flow on Doppler - EMERGENCY)
  - Testicular tumor (painless or dull ache, firm mass, does not transilluminate)
  - Testicular trauma (history of injury, ecchymosis)
  - Hydrocele (scrotal swelling, transilluminates, usually painless)
  - Inguinal hernia (mass in inguinal canal, increases with Valsalva)
  - Mumps (parotitis with orchitis)
  - Tuberculosis orchitis (rare, chronic course, constitutional symptoms)
