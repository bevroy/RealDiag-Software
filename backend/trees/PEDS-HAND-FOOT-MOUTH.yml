tree_id: PEDS-HAND-FOOT-MOUTH
name: Hand-Foot-and-Mouth Disease
family: pediatrics
specialty: Pediatrics/Infectious Disease
icd10: B08.4
snomed: 266119009
urgency:
  - Severe dehydration from inability to drink (painful oral lesions)
  - Signs of aseptic meningitis (severe headache, neck stiffness, altered mental status)
  - Acute flaccid paralysis or muscle weakness
  - Myocarditis or pericarditis (chest pain, dyspnea, tachycardia out of proportion to fever)
  - Respiratory distress or pulmonary edema
homeopathy: []
presentations:
  - Fever (typically 101-103°F/38-39°C) for 1-2 days
  - Painful oral lesions or sores (mouth ulcers)
  - Decreased oral intake due to mouth pain
  - Drooling
  - Characteristic vesicular rash on hands, feet, and buttocks
  - Vesicles on palms and soles (pathognomonic)
  - Irritability or fussiness
  - Sore throat
  - Malaise or decreased activity
  - Age typically 6 months to 5 years (peak incidence)
  - Sick contacts or daycare exposure
  - Summer and early fall seasonality (in temperate climates)
  - Usually mild self-limited illness
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Fever pattern (typically precedes rash by 1-2 days)
  - Oral pain and decreased oral intake
  - Rash distribution and evolution
  - Starts as red macules, progresses to vesicles
  - Typically on hands, feet, mouth, buttocks
  - Sick contacts or known hand-foot-mouth disease exposure
  - Daycare attendance
  - Recent travel or community outbreak
  - Hydration status (urine output, last void time)
  - Associated symptoms (headache, neck stiffness, muscle weakness - rare complications)
  - Physical examination
  - Vital signs (temperature, heart rate, respiratory rate, blood pressure)
  - General appearance (playful, irritable, lethargic)
  - Hydration assessment
  - Mucous membranes (moist versus dry)
  - Capillary refill, skin turgor
  - Fontanelle if infant
  - Oral examination (CHARACTERISTIC)
  - Painful vesicles or shallow ulcers
  - Distribution: tongue, buccal mucosa, palate, gingiva, lips
  - Ulcers have red halo, 2-5 mm size
  - May see only ulcers (vesicles rupture quickly)
  - Number varies (few to many)
  - Erythematous pharynx
  - Skin examination (CHARACTERISTIC)
  - Vesicular rash on erythematous base
  - 'Distribution: palms, soles, buttocks (diaper area)'
  - '"Football-shaped" or oval vesicles oriented along skin lines'
  - Vesicles on palms and soles highly characteristic
  - May also involve dorsal hands/feet, legs, arms
  - Rash non-pruritic (unlike chickenpox)
  - Different stages may coexist (macules, papules, vesicles)
  - Coxsackievirus A6 strain: more extensive rash, involves arms/legs/face, onychomadesis (nail shedding) 4-6 weeks later
  - Lymphadenopathy (cervical or submandibular)
  - Neurologic examination
  - Assess for meningismus (neck stiffness, Kernig/Brudzinski signs)
  - Muscle strength and tone (rare complication: acute flaccid paralysis)
  - Cardiovascular examination (tachycardia, murmur - rare myocarditis)
  - Respiratory examination (rare pulmonary edema)
  - Distinguish from other vesicular exanthems
  - Hand-foot-mouth: vesicles on palms/soles/mouth, non-pruritic, age less than 5 years
  - Varicella (chickenpox): pruritic, generalized, different stages, involves trunk first
  - Herpes gingivostomatitis: severe painful oral lesions, gingival involvement, no hand/foot lesions
  - Herpangina: vesicles/ulcers on soft palate and tonsillar pillars only, no hand/foot lesions
  - Diagnostic testing
  - Clinical diagnosis - testing NOT routinely needed
  - Classic presentation (oral ulcers + vesicles on hands/feet) is diagnostic
  - Consider testing if:
  - Atypical presentation or diagnostic uncertainty
  - Severe disease or complications
  - Outbreak investigation
  - Viral culture or PCR from vesicle fluid or throat swab
  - Enterovirus PCR (coxsackievirus A16, A6, enterovirus 71)
  - CSF analysis if concern for aseptic meningitis (enteroviral PCR, cell count, glucose, protein)
  - Tzanck smear or HSV PCR if considering HSV gingivostomatitis (negative in hand-foot-mouth)
treatment:
  - Supportive care - NO specific antiviral treatment available
  - Pain control (MOST IMPORTANT - facilitate oral intake)
  - Oral analgesia
  - Acetaminophen 15 mg/kg/dose every 4-6 hours (max 75 mg/kg/day) OR
  - Ibuprofen 10 mg/kg/dose every 6 hours (max 40 mg/kg/day)
  - Topical oral anesthetics (use cautiously, may worsen dysphagia)
  - '"Magic mouthwash" (diphenhydramine + antacid +/- lidocaine)'
  - Lidocaine 2% viscous solution or gel (age greater than 2 years, apply sparingly)
  - Risk systemic absorption and toxicity if overused
  - Avoid benzocaine in infants (methemoglobinemia risk)
  - Hydration
  - Encourage oral fluids (CRITICAL to prevent dehydration)
  - Cold liquids (popsicles, ice cream, cold milk, smoothies) may be soothing
  - Avoid acidic or spicy foods (orange juice, tomatoes - worsen pain)
  - Avoid salty or rough-textured foods (chips, crackers)
  - Soft bland diet (yogurt, pudding, mashed potatoes, applesauce)
  - Frequent small sips better than large volumes
  - IV hydration if unable to maintain oral intake and dehydrated
  - Fever management
  - Acetaminophen or ibuprofen (doses above)
  - Encourage fluids, light clothing
  - Skin care
  - Keep lesions clean and dry
  - Avoid breaking vesicles (increases infection risk and viral shedding)
  - No specific topical treatment needed
  - Rash typically non-pruritic, but if itching present: calamine lotion, oatmeal baths
  - Isolation and infection control
  - Highly contagious (fecal-oral and respiratory transmission)
  - Viral shedding in stool for weeks after symptoms resolve
  - Exclude from daycare/school until fever resolves and mouth sores are healed
  - Some policies allow return after 24 hours afebrile
  - Strict hand hygiene (most important prevention measure)
  - Disinfect surfaces, toys, changing tables
  - Avoid sharing cups, utensils, towels
  - No vaccine available
  - Disposition
  - Most cases managed outpatient with supportive care
  - Admit if severe dehydration, inability to tolerate oral fluids, or complications
  - Complications (rare)
  - Dehydration (most common)
  - Aseptic meningitis (enterovirus 71 more common cause)
  - Encephalitis
  - Acute flaccid paralysis (polio-like syndrome)
  - Myocarditis or pericarditis
  - Pulmonary edema (especially with enterovirus 71)
  - Onychomadesis (nail shedding) 4-6 weeks after infection (benign, nails regrow)
  - Natural history
  - Fever resolves in 2-3 days
  - Oral ulcers heal in 5-7 days
  - Rash resolves in 7-10 days (vesicles crust and peel)
  - Full recovery expected in 7-10 days
clinical_pearls:
  - 'Hand-foot-mouth disease classic triad: painful oral ulcers + vesicular rash on palms/soles + fever'
  - 'Caused by enteroviruses, most commonly coxsackievirus A16 and enterovirus 71 - no specific antiviral treatment'
  - 'Vesicles on palms and soles (pathognomonic) distinguish from other viral exanthems'
  - 'Pain control and hydration are mainstays of treatment - cold liquids (popsicles) well-tolerated'
  - 'Self-limited illness, resolves in 7-10 days - complications rare but include dehydration, aseptic meningitis'
  - 'Highly contagious via fecal-oral and respiratory routes - viral shedding in stool for weeks'
  - 'Coxsackievirus A6 strain causes more extensive rash and onychomadesis (nail shedding) 4-6 weeks later'
  - 'Avoid acidic or spicy foods and drinks (worsen oral pain) - offer soft bland cold foods'
referrals:
  - Pediatric infectious disease if severe disease, complications (meningitis, encephalitis, myocarditis), or immunocompromised host
  - Pediatric neurology if acute flaccid paralysis, encephalitis, or persistent neurologic symptoms
  - Pediatric cardiology if suspected myocarditis or pericarditis (chest pain, dyspnea, arrhythmia)
  - Hospital admission if severe dehydration, inability to tolerate oral intake, or systemic complications
differentials:
  - Hand-foot-mouth disease (coxsackievirus A16, A6, enterovirus 71) - vesicles on palms/soles/mouth, age less than 5 years
  - Herpangina (coxsackievirus) - vesicles/ulcers on soft palate and tonsillar pillars only, NO hand/foot lesions
  - Herpes simplex gingivostomatitis (HSV-1) - severe painful oral lesions, gingival involvement, fever, cervical adenopathy, NO hand/foot rash
  - Varicella (chickenpox) - generalized pruritic vesicles in different stages, starts on trunk, involves scalp
  - Aphthous stomatitis (canker sores) - painful oral ulcers, NO fever, NO hand/foot rash, recurrent
  - Erythema multiforme - target lesions, palms/soles involved, mucosal involvement, associated with HSV or medications
  - Stevens-Johnson syndrome - severe mucosal involvement, fever, systemic toxicity, medication trigger
  - Behçet disease (rare in children) - recurrent oral and genital ulcers, uveitis
  - Enteroviral exanthem - non-specific maculopapular rash, fever, summer/fall seasonality
  - Kawasaki disease - fever greater than 5 days, conjunctivitis, polymorphous rash, strawberry tongue, extremity changes
