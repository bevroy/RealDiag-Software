presentations:
  - Incarcerated hernia with vascular compromise
  - Severe pain at hernia site
  - Erythema and warmth of overlying skin
  - Systemic signs (fever, tachycardia)
  - Peritoneal signs if bowel necrosis
  - Requires emergency surgery
differentials:
  - Incarcerated hernia
  - Bowel obstruction
  - Abscess
  - Lipoma
workup: []
treatment:
  - Surgical emergency - immediate surgery consultation
  - NPO, aggressive IV resuscitation (often hypovolemic from third-spacing)
  - Nasogastric tube decompression
  - Broad-spectrum antibiotics - cefazolin 2g IV + metronidazole 500mg IV (anticipate bowel resection)
  - Emergency hernia repair with bowel inspection
  - Resect nonviable bowel - primary anastomosis if contamination minimal
  - Primary repair without mesh if contaminated (bowel resection)
  - ICU postop if septic or bowel resection
  - Mortality 5-15% (higher in elderly)
