tree_id: ORTHO-SHOULDER-IMPINGEMENT
name: Shoulder Impingement Syndrome
family: orthopedics
specialty: Orthopedics
icd10: M75.40
snomed: 19939008
urgency: []
homeopathy: []
presentations:
  - Anterolateral shoulder pain
  - Pain with overhead activities (reaching, lifting, throwing)
  - Pain when lying on affected shoulder
  - Painful arc of motion (pain between 60-120 degrees of abduction)
  - Night pain (may wake from sleep)
  - Weakness with overhead activities
  - Gradual onset over weeks to months
  - Common in repetitive overhead workers (painters, athletes)
  - May have clicking or catching sensation
workup:
  - Clinical diagnosis based on history and physical examination
  - Physical examination
  - Painful arc test (pain with active abduction 60-120 degrees)
  - Neer impingement sign (pain with passive forward flexion >90 degrees)
  - Hawkins-Kennedy test (pain with shoulder flexion 90° + internal rotation)
  - Empty can test (Jobe test) - weakness/pain with resisted arm elevation
  - Assess rotator cuff strength (supraspinatus, infraspinatus, subscapularis)
  - Evaluate for scapular dyskinesis (abnormal scapular movement)
  - Assess cervical spine (rule out referred pain)
  - Imaging
  - X-rays (AP, axillary, scapular Y views) to rule out bony pathology
  - Look for acromial spur, AC joint arthritis, calcific tendinitis
  - Ultrasound can assess rotator cuff tear, subacromial bursitis
  - MRI if refractory to treatment or concern for full-thickness rotator cuff tear
  - Diagnostic/therapeutic subacromial injection
  - Lidocaine injection into subacromial space
  - If pain significantly improves, confirms impingement diagnosis
treatment:
  - Non-pharmacologic (first-line)
  - Activity modification
  - Avoid overhead activities, repetitive reaching
  - Modify work ergonomics (lower work surface height)
  - Physical therapy (most important intervention)
  - Rotator cuff strengthening exercises
  - Scapular stabilization exercises (address scapular dyskinesis)
  - Posterior capsule stretching (sleeper stretch)
  - Correct posture and biomechanics
  - Typically 6-12 weeks of dedicated PT
  - Ice after activities 15-20 minutes
  - Pharmacologic
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Reduce pain and inflammation
  - Use for 2-3 weeks during acute phase
  - Subacromial corticosteroid injection
  - Very effective for pain relief (60-80% improve)
  - Methylprednisolone 40-80 mg or triamcinolone 40 mg + lidocaine
  - Allows patient to participate in PT more effectively
  - May repeat once after 6 weeks if partial response
  - Limit to 3-4 per year
  - Surgical management (if conservative treatment fails >3-6 months)
  - Arthroscopic subacromial decompression
  - Remove inflamed bursa, shave acromial spur
  - 70-80% success rate
  - Indications: refractory symptoms despite 3-6 months conservative treatment
clinical_pearls:
  - "Painful arc 60-120 degrees is classic - pain at extremes of motion suggests other pathology"
  - "Impingement is compression of rotator cuff tendons under acromion during overhead activity"
  - "Neer and Hawkins tests have high sensitivity (80-90%) but low specificity"
  - "Subacromial injection both diagnostic and therapeutic - significant relief confirms diagnosis"
  - "Physical therapy is cornerstone - strengthens rotator cuff and addresses scapular dyskinesis"
  - "Many patients with impingement have underlying rotator cuff tendinopathy or partial tears"
  - "80-90% improve with conservative treatment (PT + injection)"
  - "Surgery reserved for refractory cases - results best when conservative treatment truly maximized"
referrals:
  - Physical therapy for rotator cuff strengthening and scapular stabilization (first-line)
  - Orthopedic shoulder specialist if no improvement after 3-6 months of conservative treatment
  - Sports medicine for ultrasound-guided injection if needed
differentials:
  - Shoulder impingement syndrome (painful arc, positive impingement tests)
  - Rotator cuff tendinopathy or tear (weakness, positive lag signs)
  - Subacromial bursitis (overlaps with impingement)
  - AC joint arthritis (pain localized to AC joint, positive cross-body adduction test)
  - Adhesive capsulitis (frozen shoulder) - restricted passive range of motion
  - Biceps tendinitis (anterior shoulder pain, positive Speed test)
  - Cervical radiculopathy (neck pain, neurologic deficits, dermatomal pattern)
  - Labral tear (young athletes, clicking, instability symptoms)
trace:
  source: AAOS Clinical Practice Guidelines on Rotator Cuff Problems 2019, Cochrane Review on Shoulder Impingement
  version: '1.0'
  last_updated: '2025-12-26'
