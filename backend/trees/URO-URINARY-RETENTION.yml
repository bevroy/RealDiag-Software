presentations:
  - Inability to urinate despite full bladder
  - Severe suprapubic pain
  - Palpable distended bladder
  - Causes - BPH, medications, neurologic, urethral stricture
  - Medical emergency requiring catheterization
  - Post-void residual > 300 mL
differentials:
  - BPH
  - Prostate cancer
  - Urethral stricture
  - Neurogenic bladder
  - Medication effect
workup:
  - 'Bladder scan: Volume >300 mL confirms retention (normal <50 mL)'
  - 'Palpation/percussion: Distended bladder palpable above pubic symphysis, dull to percussion'
  - 'Post-catheterization volume: Document volume drained (if >1L, monitor for post-obstructive diuresis)'
  - 'UA with culture after catheterization: Rule out UTI (catheterization introduces bacteria)'
  - 'Creatinine: If chronic retention, check for obstructive uropathy/hydronephrosis'
treatment:
  - 'Guideline-based treatment options for Acute Urinary Retention include:'
  - 'Immediate catheterization: Urethral catheter (16-18 Fr) with sterile technique. If unable, suprapubic catheter by urology (AUA 2023)'
  - 'Start alpha-blocker: Tamsulosin 0.4mg daily immediately after catheterization (improves voiding trial success) (AUA 2023)'
  - 'Trial without catheter: After 1-3 days on alpha-blocker, remove catheter in AM, monitor voiding. Success if PVR <200 mL (AUA 2023)'
  - 'If failed voiding trial: Replace catheter, continue alpha-blocker, add 5-ARI if BPH, refer urology for definitive management (AUA 2023)'
  - 'Stop causative medications: Anticholinergics, opioids, decongestants (AUA 2023)'
clinical_pearls:
  - Complete inability to void with painful distended bladder - URGENT, requires immediate catheterization
  - 'Causes: BPH (most common, 50%), anticholinergics/opioids/sympathomimetics, neurologic (spinal cord injury, diabetic neuropathy), infection, urethral stricture'
  - 'Post-obstructive diuresis: After catheterization, can have massive diuresis (>200 mL/hr) from retained urea/solutes - monitor fluids, electrolytes'
  - 'Bladder decompression: If >1L retained, drain slowly or in stages (clamp catheter after 500 mL, unclamp 15 min later) - rapid decompression may cause hematuria, hypotension'
  - 'Trial without catheter: 50-70% success rate after alpha-blocker initiation, remove catheter after 1-3 days'
red_flags: []
disposition_guidance: {}
referrals:
  - Urology within 24-48 hours for failed voiding trial or catheter placement difficulties
  - If chronic retention (>1L residual), renal ultrasound to assess hydronephrosis
