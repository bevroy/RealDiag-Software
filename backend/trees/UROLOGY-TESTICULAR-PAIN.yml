id: UROLOGY-TESTICULAR-PAIN
title: Testicular Pain (Scrotal Pain) Diagnostic Tree
specialty: Urology/Emergency Medicine
version: 1.0
icd10: A64
last_updated: 2025-11-20
evidence_level: AUA Guidelines, EAU Guidelines
entry: initial_assessment

clinical_pearls:
  - Testicular torsion is a surgical emergency (<6 hours salvageable)
  - Absent cremasteric reflex highly suggestive of torsion (99% sensitive)
  - Epididymitis most common in sexually active young men and older men with BPH
  - Prehn sign (pain relief with elevation) suggests epididymitis, but unreliable
  - Ultrasound with Doppler confirms diagnosis but should NOT delay surgery if high suspicion
  - Manual detorsion can be attempted while awaiting OR

red_flags:
  - Sudden onset severe pain (torsion until proven otherwise)
  - Nausea and vomiting (torsion)
  - Absent cremasteric reflex (torsion)
  - High-riding transverse testis (torsion)
  - History of similar episodes that resolved (intermittent torsion)
  - Prepubertal or adolescent boy (peak age for torsion)

nodes:
- id: initial_assessment
  when: {}
  description: Initial scrotal pain evaluation
  tests:
  - History
    - Onset (sudden vs gradual)
    - Duration
    - Severity
    - Associated symptoms (nausea, vomiting, fever, urinary symptoms)
    - Recent trauma, sexual activity, STI exposure
    - Prior similar episodes
  - Physical exam
    - Inspection (erythema, swelling, position of testis)
    - Palpation (testis, epididymis, spermatic cord)
    - Cremasteric reflex (stroke inner thigh, testis should elevate)
    - Testicular lie (vertical normal, horizontal abnormal)
    - Transillumination (if scrotal mass)
  - Urinalysis (pyuria suggests epididymitis, but can be normal in torsion)
  suggest_dx: []
  next:
  - when:
      all_of:
      - onset: sudden
      - duration: '<24 hours'
      - cremasteric_reflex: absent
    go: testicular_torsion_emergency
  - when:
      all_of:
      - onset: sudden
      - nausea_vomiting: present
      - high_riding_testis: true
    go: testicular_torsion_emergency
  - when:
      history: trauma
    go: traumatic_injury
  - when:
      all_of:
      - onset: gradual
      - fever_or_urinary_symptoms: present
    go: infectious_epididymitis
  - default: differential_diagnosis_workup

- id: testicular_torsion_emergency
  when:
    symptoms_contains_any:
    - sudden_severe_pain
    - absent_cremasteric_reflex
    - high_riding_testis
    - nausea_vomiting
  description: Testicular torsion - SURGICAL EMERGENCY
  tests:
  - Clinical diagnosis (do NOT delay surgery for imaging if high suspicion)
  - Cremasteric reflex - ABSENT in torsion (99% sensitive)
  - Testicular lie - horizontal (bell-clapper deformity)
  - High-riding testis
  - Ultrasound with Doppler (if diagnosis uncertain)
    - Decreased or absent blood flow to affected testis
    - Whirlpool sign (twisted spermatic cord)
    - Do NOT delay surgery if high clinical suspicion
  - Urinalysis (usually normal, but can have pyuria)
  suggest_dx:
  - Testicular torsion (N44.0)
  - Intravaginal torsion (most common, puberty/adolescence)
  - Extravaginal torsion (neonates)
  - Bell-clapper deformity (horizontal testicular lie, bilateral risk)
  referrals:
  - Urology STAT (call while patient in ED)
  - Operating room immediately
  - Do NOT wait for ultrasound if high clinical suspicion
  management:
  - EMERGENT scrotal exploration and detorsion (goal detorsion within 6 hours, salvage rates - <6 hours 90-100%, 6-12 hours 50%, 12-24 hours 10-25%, >24 hours <10%)
  - Manual detorsion (attempt while awaiting OR)
    - Testicles typically torse medially (inward)
    - Detorse laterally (outward) - "open the book"
    - Rotate affected testis 180-360° away from midline
    - Success = immediate pain relief
    - If pain worsens, rotate opposite direction
    - Still requires surgical fixation even if successful
  - Surgical detorsion and bilateral orchiopexy
    - Untwist torsed testis, assess viability
    - Orchiopexy (fix both testes to prevent recurrence)
    - Orchiectomy if non-viable (black, necrotic)
    - Bell-clapper deformity is bilateral (fix both sides)
  - NPO (for surgery)
  - IV access, analgesia (avoid masking symptoms before diagnosis)
  prognosis:
  - Salvage depends on time to detorsion
  - Fertility usually preserved (contralateral testis)
  - Bilateral orchiopexy prevents recurrence
  complications:
  - Testicular loss (if delayed >12 hours)
  - Atrophy (even if salvaged, may atrophy over months)
  - Impaired fertility (if bilateral or contralateral atrophy)
  - Recurrence (if not fixed bilaterally)
  next:
  - default: null

- id: traumatic_injury
  when:
    history: scrotal_trauma
  description: Traumatic scrotal injury
  tests:
  - Exam - ecchymosis, swelling, hematoma
  - Ultrasound (assess testicular integrity)
    - Testicular rupture (discontinuity of tunica albuginea)
    - Hematocele (blood in tunica vaginalis)
    - Testicular fracture
  - Urinalysis (if concern for urethral injury)
  suggest_dx:
  - Testicular contusion (most common)
  - Testicular rupture
  - Hematocele
  - Testicular dislocation (rare, severe trauma)
  referrals:
  - Urology if rupture or large hematocele
  management:
  - Testicular contusion (intact testis)
    - Supportive care
    - Ice packs
    - Scrotal support (jockstrap, tight underwear)
    - NSAIDs or acetaminophen
    - Rest
  - Testicular rupture
    - Surgical exploration and repair
    - Debridement of necrotic tissue
    - Primary closure of tunica albuginea
    - Orchiectomy if non-salvageable
  - Hematocele
    - Small (<3x normal size) - observation
    - Large or symptomatic - surgical drainage
  prognosis:
  - Contusion - full recovery
  - Rupture - 80-90% salvage if repaired within 72 hours
  next:
  - default: null

- id: infectious_epididymitis
  when:
    symptoms_contains_any:
    - gradual_onset
    - urinary_symptoms
    - fever
  description: Epididymitis evaluation
  tests:
  - Exam
    - Tender, swollen epididymis (posterior testis)
    - Prehn sign (pain relief with elevation) - unreliable
    - Cremasteric reflex present
  - Urinalysis - pyuria, bacteriuria
  - Urine culture
  - Nucleic acid amplification test (NAAT) for GC/Chlamydia
  - Ultrasound with Doppler (if diagnosis uncertain)
    - Increased blood flow to epididymis
    - Epididymal enlargement
    - Rules out torsion (decreased flow)
  suggest_dx: []
  next:
  - when:
      age: '<35'
    go: epididymitis_young_men
  - when:
      age: '>=35'
    go: epididymitis_older_men
  - default: epididymitis_young_men

- id: epididymitis_young_men
  when:
    age: '<35'
  description: Epididymitis in sexually active young men
  tests:
  - NAAT for Neisseria gonorrhoeae and Chlamydia trachomatis (first-void urine)
  - Urinalysis and culture
  - HIV, syphilis testing (if STI confirmed)
  - Contact tracing and partner treatment
  suggest_dx:
  - Epididymitis (N45.1)
  - Chlamydia trachomatis (most common in young men)
  - Neisseria gonorrhoeae
  - E. coli (less common)
  referrals:
  - Urology if abscess, Fournier gangrene, or not improving in 3 days
  management:
  - Antibiotics (treat empirically for GC and Chlamydia)
    - Ceftriaxone 500mg IM single dose (if <150 kg)
    - PLUS doxycycline 100mg PO BID x 10 days
  - If severely ill, high fever, or toxic
    - Admit for IV antibiotics
    - Ceftriaxone 1g IV daily + doxycycline 100mg PO/IV BID
  - Supportive care
    - Bed rest (48-72 hours)
    - Scrotal elevation and support
    - Ice packs (first 24 hours)
    - NSAIDs (ibuprofen 600mg TID)
  - Sexual abstinence until treatment completed and partner treated
  - Partner notification and treatment
    - Treat partners empirically (ceftriaxone + doxycycline)
  patient_education:
  - STI most common cause in young men
  - Partners must be treated
  - Return if symptoms worsen or fever develops
  - Pain may take weeks to fully resolve
  - Safe sex practices
  follow_up:
  - Return in 3 days if not improving
  - Test of cure for gonorrhea (NAAT 2 weeks after treatment)
  next:
  - default: null

- id: epididymitis_older_men
  when:
    age: '>=35'
  description: Epididymitis in older men
  tests:
  - Urinalysis and culture
  - DRE (assess prostate - BPH, prostatitis)
  - Post-void residual (if obstructive symptoms)
  - Consider STI testing if risk factors
  suggest_dx:
  - Epididymitis
  - E. coli (most common in older men)
  - Other gram-negative rods
  - Enterococcus
  - Associated with BPH, urinary retention, instrumentation
  referrals:
  - Urology if recurrent, abscess, or not improving
  management:
  - Antibiotics (empiric for gram-negatives)
    - Levofloxacin 500mg PO daily x 10 days
    - Or ciprofloxacin 500mg PO BID x 10 days
    - If recent instrumentation or catheter (Pseudomonas risk)
      - Ciprofloxacin or levofloxacin
  - If severely ill or unable to tolerate PO
    - Admit for IV antibiotics
    - Ceftriaxone 1g IV daily
    - Or ciprofloxacin 400mg IV q12h
  - Supportive care (same as young men)
    - Bed rest, scrotal support, ice, NSAIDs
  - Treat underlying cause
    - BPH - alpha-blocker (tamsulosin)
    - Prostatitis - extend antibiotics to 4-6 weeks
  patient_education:
  - Usually from urinary bacteria
  - Complete full antibiotic course
  - Pain may persist for weeks
  - Follow-up if recurrent
  follow_up:
  - Return in 3 days if not improving
  - Urology if recurrent episodes
  next:
  - default: null

- id: differential_diagnosis_workup
  when: {}
  description: Other causes of testicular pain
  tests:
  - Ultrasound (if diagnosis uncertain)
  - Urinalysis
  - Assess for inguinal hernia (reducible mass, transillumination)
  - Examine kidneys (referred pain from stones)
  suggest_dx: []
  next:
  - when:
      ultrasound_findings: hydrocele
    go: hydrocele
  - when:
      ultrasound_findings: varicocele
    go: varicocele
  - when:
      ultrasound_findings: testicular_mass
    go: testicular_mass
  - when:
      exam_findings: inguinal_hernia
    go: inguinal_hernia
  - default: other_causes

- id: hydrocele
  when:
    ultrasound_findings: fluid_around_testis
  description: Hydrocele
  tests:
  - Transillumination (fluid lights up)
  - Ultrasound (confirm fluid, rule out underlying mass)
  suggest_dx:
  - Hydrocele (N43.3)
  - Communicating (infants, communicates with peritoneum)
  - Non-communicating (adults, idiopathic or reactive)
  referrals:
  - Urology if large, symptomatic, or concern for underlying pathology
  management:
  - Observation (if small and asymptomatic)
  - Surgical repair (hydrocelectomy) if
    - Large, symptomatic
    - Tense, uncomfortable
    - Concern for underlying testicular mass
  - Aspiration not recommended (high recurrence rate)
  patient_education:
  - Usually benign, no treatment needed unless symptomatic
  - Communicating hydroceles in infants often resolve by age 1-2
  next:
  - default: null

- id: varicocele
  when:
    exam_findings: bag_of_worms
  description: Varicocele
  tests:
  - Exam - "bag of worms" feeling on palpation
    - More prominent when standing, Valsalva
    - Decreases when supine
  - Ultrasound with Doppler (if diagnosis uncertain)
    - Dilated veins >3mm
    - Reflux with Valsalva
  - Semen analysis (if fertility concerns)
  suggest_dx:
  - Varicocele (I86.1)
  - Left-sided (90%) - left testicular vein drains to left renal vein
  - Bilateral (10%)
  - Right-sided varicocele (rare, concerning for IVC or renal vein obstruction - get imaging)
  referrals:
  - Urology if
    - Symptomatic pain
    - Infertility with abnormal semen analysis
    - Testicular atrophy
    - Adolescent with size discrepancy >20%
  - If right-sided varicocele, get CT or MRI (rule out retroperitoneal mass)
  management:
  - Observation (if asymptomatic and no fertility concerns)
  - Surgical repair (varicocelectomy) if
    - Persistent pain
    - Infertility with abnormal semen parameters
    - Testicular atrophy
  - Surgical options
    - Microscopic inguinal or subinguinal approach (preferred)
    - Laparoscopic
    - Percutaneous embolization (interventional radiology)
  patient_education:
  - Very common (15% of men)
  - Usually benign, no treatment unless symptomatic or affecting fertility
  - May contribute to infertility (impairs spermatogenesis)
  next:
  - default: null

- id: testicular_mass
  when:
    exam_findings: testicular_mass
  description: Testicular mass or tumor
  tests:
  - Ultrasound (characterize mass)
    - Intratesticular vs extratesticular
    - Solid vs cystic
    - Vascularity
  - Tumor markers (if solid intratesticular mass)
    - AFP (alpha-fetoprotein)
    - Beta-hCG (human chorionic gonadotropin)
    - LDH (lactate dehydrogenase)
  - CT chest/abdomen/pelvis (staging if malignancy confirmed)
  suggest_dx:
  - Testicular cancer (germ cell tumor)
    - Seminoma (most common, 30s-40s)
    - Non-seminomatous germ cell tumor (NSGCT - mixed, embryonal, teratoma, choriocarcinoma, yolk sac)
  - Epididymal cyst (spermatocele)
  - Testicular cyst (simple, benign)
  referrals:
  - Urology urgently (within days)
  - Oncology if cancer confirmed
  management:
  - Radical inguinal orchiectomy (testis + spermatic cord)
    - Do NOT perform scrotal biopsy (alters lymphatic drainage)
  - Sperm banking (before orchiectomy or chemotherapy)
  - Staging CT chest/abdomen/pelvis
  - Treatment depends on histology and stage
    - Seminoma - surveillance, radiation, or chemotherapy
    - NSGCT - surveillance, RPLND (retroperitoneal lymph node dissection), or chemotherapy
  - Excellent prognosis (cure rate >95% for localized disease)
  patient_education:
  - Most curable cancer if caught early
  - Self-exams monthly (check for lumps)
  - Fertility preserved with one testis
  next:
  - default: null

- id: inguinal_hernia
  when:
    exam_findings: inguinal_mass
  description: Inguinal hernia with scrotal extension
  tests:
  - Exam - reducible mass in inguinal canal or scrotum
  - Increases with Valsalva or standing
  - Ultrasound (if diagnosis uncertain)
  suggest_dx:
  - Indirect inguinal hernia (scrotal extension)
  referrals:
  - General surgery for repair
  - Emergent if incarcerated or strangulated
  management:
  - Elective hernia repair (mesh or primary repair)
  - Emergent repair if
    - Incarcerated (unable to reduce)
    - Strangulated (compromised blood supply - red, tender)
  next:
  - default: null

- id: other_causes
  when: {}
  description: Other causes of testicular/scrotal pain
  tests:
  - Abdominal exam (referred pain from kidneys, appendix)
  - Urinalysis (kidney stones)
  - CT abdomen/pelvis (if suspect kidney stone or appendicitis)
  suggest_dx:
  - Referred pain
    - Kidney stone (ipsilateral flank pain radiating to groin)
    - Appendicitis (right-sided referred pain)
    - Inguinal hernia
  - Orchitis (testicular inflammation, often viral)
  - Torsion of appendix testis (hydatid of Morgagni)
  - Spermatic cord lipoma
  - Vasitis (inflammation of vas deferens)
  - Idiopathic scrotal pain (chronic orchialgia)
  referrals:
  - Urology if chronic pain, no identifiable cause
  management:
  - Orchitis
    - Viral (mumps) - supportive care
    - Bacterial - antibiotics (same as epididymitis)
  - Torsion of appendix testis
    - Supportive care (rest, ice, NSAIDs)
    - Self-limited (1-2 weeks)
  - Chronic orchialgia (no identifiable cause)
    - NSAIDs, scrotal support
    - Tricyclic antidepressants or gabapentin
    - Spermatic cord block (lidocaine injection)
    - Denervation surgery (last resort)
  next:
  - default: null

differential_diagnosis:
  emergent:
    - Testicular torsion (EMERGENCY <6 hours)
    - Fournier gangrene (necrotizing fasciitis)
    - Incarcerated/strangulated hernia
    - Testicular rupture
  infectious:
    - Epididymitis (Chlamydia, gonorrhea, E. coli)
    - Orchitis (viral, bacterial)
    - Prostatitis (referred pain)
    - Fournier gangrene (polymicrobial)
  anatomic:
    - Hydrocele
    - Varicocele
    - Inguinal hernia
    - Spermatocele (epididymal cyst)
  neoplastic:
    - Testicular cancer (seminoma, NSGCT)
  traumatic:
    - Testicular contusion
    - Testicular rupture
    - Hematocele
  other:
    - Torsion of appendix testis
    - Referred pain (kidney stone, appendicitis)
    - Vasectomy (post-operative pain)
    - Chronic orchialgia (idiopathic)

disposition_guidance:
  emergent:
    - Testicular torsion - OR immediately
    - Fournier gangrene - OR for debridement, ICU
    - Strangulated hernia - OR for repair
  admit:
    - Severe epididymitis/orchitis with systemic toxicity
    - Unable to tolerate PO antibiotics
    - Abscess requiring drainage
  discharge:
    - Epididymitis (antibiotics, supportive care)
    - Hydrocele, varicocele (urology follow-up)
    - Traumatic contusion (minor)
    - Return if worsening pain, fever, or inability to void
  follow_up:
    - Epididymitis - return in 3 days if not improving
    - Testicular mass - urology within days
    - Varicocele - urology if fertility concerns
    - Post-torsion - urology in 1-2 weeks

references:
  - Sharp VJ et al. Testicular Torsion - Diagnosis, Evaluation, and Management. Am Fam Physician. 2013.
  - Trojian TH et al. Epididymitis and Orchitis - An Overview. Am Fam Physician. 2009.
  - CDC STI Treatment Guidelines - Epididymitis. MMWR. 2021.
  - Molokwu CN et al. Acute Scrotum - A Review of 160 Cases. Ann R Coll Surg Engl. 2011.
