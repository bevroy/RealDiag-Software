tree_id: URO-VARICOCELE
name: Varicocele
family: Urology
specialty: Urology
icd10:
- I86.1
snomed:
- 13015003
urgency: medium
description: Comprehensive evaluation and management of Varicocele
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Scrotal swelling (feels like bag of worms)
- Dull aching pain in scrotum
- Worsens with standing, improves when lying down
- More common on left side
- May cause infertility (decreased sperm count)
- Disappears when supine
workup:
- 'Physical exam: Bag of worms palpable above testicle, more prominent with standing/Valsalva,
  disappears when supine'
- 'Valsalva maneuver: Increases intra-abdominal pressure - varicocele becomes more
  prominent (venous filling)'
- 'Scrotal ultrasound with Doppler: Shows dilated pampiniform veins >3mm, venous reflux
  with Valsalva'
- 'Semen analysis: If infertility concern - varicocele causes low count, poor motility,
  abnormal morphology'
- 'Testicular volume: Varicocele can cause atrophy (smaller testicle on affected side)'
treatment:
- 'Guideline-based treatment options for Varicocele include:'
- 'Observation: If asymptomatic and no infertility - most varicoceles don''t require
  treatment (AUA 2023)'
- 'Indications for repair: Infertility (abnormal semen analysis) + palpable varicocele,
  pain unresponsive to conservative measures, testicular atrophy (AUA 2023)'
- 'Surgical repair: Varicocelectomy (ligate dilated veins) - laparoscopic, open inguinal,
  or subinguinal approach. 70% improve sperm parameters (AUA 2023)'
- 'Percutaneous embolization: Interventional radiology - coil embolization of testicular
  vein. 90% success, less invasive than surgery (AUA 2023)'
- 'Conservative: Scrotal support, NSAIDs for pain (AUA 2023)'
clinical_pearls:
- Dilated pampiniform venous plexus - 15% of men, 40% of infertile men, left side
  85% (left testicular vein drains to renal vein at 90° angle, higher pressure)
- 'Bag of worms: Classic description of varicocele on palpation - dilated tortuous
  veins above testicle'
- 'Infertility: Varicocele causes increased scrotal temperature (venous pooling),
  impairs spermatogenesis. Repair improves sperm in 70%'
- 'Right-sided varicocele: Rare (<5%) - suggests retroperitoneal mass compressing
  IVC (renal cell carcinoma, lymphoma) - needs imaging'
- 'Varicocele grades: I (palpable with Valsalva), II (palpable at rest), III (visible
  through scrotal skin)'
referrals:
- 'Urology if: Infertility (abnormal semen analysis), significant pain, testicular
  atrophy, right-sided varicocele (needs imaging for mass)'
- Asymptomatic varicoceles can be observed
differentials: []
trace:
