tree_id: CARDS-TRICUSPID-REGURGITATION
name: Tricuspid Regurgitation
family: Cardiology
specialty: Cardiology
chief_complaint: Lower extremity edema and ascites with systolic murmur
description: Backward flow from RV to RA during systole causing RV volume overload and systemic congestion. Most commonly secondary (functional) from RV dilation or pulmonary hypertension. Primary TR from leaflet disease (endocarditis, rheumatic, trauma). Severe TR causes peripheral edema, ascites, hepatic congestion. Often well-tolerated until severe. Surgery considered if severe symptomatic TR or if undergoing left-sided valve surgery.
icd10: I07.1
snomed: 111287006
presentations:
  - Often asymptomatic
  - Peripheral edema, ascites
  - Hepatomegaly, pulsatile liver
  - Jugular venous distension with prominent V wave
  - Fatigue, reduced exercise tolerance
  - Secondary to left heart disease or pulmonary hypertension
urgency: routine

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Clinical presentation:
  - Often asymptomatic until severe
  - Peripheral edema (lower extremities, sacral)
  - Ascites (from hepatic congestion)
  - Right upper quadrant pain (hepatic congestion)
  - Fatigue, exercise intolerance
  - Pulsatile neck veins
  - Etiology:
  - Secondary (functional) TR (most common over 80%):
  - RV dilation from RV dysfunction (RV infarction, ARVC)
  - Pulmonary hypertension (from left heart disease, pulmonary disease, pulmonary embolism)
  - Tricuspid annular dilation (from chronic AFib, RV pacing)
  - Primary TR (leaflet disease):
  - Endocarditis (especially IV drug use)
  - Rheumatic heart disease (usually with mitral or aortic involvement)
  - Carcinoid syndrome (serotonin causes valve thickening and regurgitation)
  - Pacemaker/ICD leads (mechanical interference with leaflet closure)
  - Trauma (chest trauma, biopsy complication)
  - Physical exam:
  - Holosystolic murmur at left lower sternal border (increases with inspiration - Carvallo sign, increased venous return to right heart)
  - Pulsatile liver (from transmitted systolic pressure wave)
  - Prominent V waves in JVP (elevated with prominent systolic pulsations)
  - Peripheral edema (pitting edema of lower extremities)
  - Ascites
  - RV heave if RV enlargement
  - Signs of underlying cause (pulmonary hypertension, mitral stenosis, etc)
  - Imaging:
  - Echocardiogram (diagnostic):
  - Severity grading:
  - Mild TR (vena contracta under 0.7 cm, jet area under 5 cm²)
  - Moderate TR (vena contracta 0.7-1.0 cm, jet area 5-10 cm²)
  - Severe TR (vena contracta over 1.0 cm, jet area over 10 cm², systolic flow reversal in hepatic veins)
  - Mechanism (primary vs secondary, leaflet coaptation, annular dilation)
  - RV size and function
  - PA pressure (assess pulmonary hypertension)
  - RA size (often dilated)
  - Identify underlying cause (LV dysfunction, mitral valve disease, pulmonary disease)
  - Chest X-ray (cardiomegaly, RA/RV enlargement)
  - ECG (RA enlargement - tall peaked P waves in lead II, RVH if chronic, AFib common)
  - Right heart catheterization (if severe TR, assess PA pressures and cardiac output)

treatment:
  - Treat underlying cause (most important):
  - Pulmonary hypertension (treat left heart disease, pulmonary disease, consider pulmonary vasodilators)
  - LV dysfunction (optimize GDMT)
  - Mitral valve disease (repair or replacement)
  - AFib (rate control, rhythm control consideration, anticoagulation)
  - Medical management (symptom control):
  - Diuretics (furosemide, spironolactone for edema and ascites)
  - May require high doses for refractory edema
  - Salt restriction
  - Avoid excessive diuresis (preload-dependent)
  - Serial monitoring if asymptomatic:
  - Severe TR with normal RV function every 6-12 months
  - Moderate TR annually
  - Surgery indications:
  - Severe primary TR with symptoms (class IIa)
  - Severe TR (primary or secondary) undergoing left-sided valve surgery (class I)
  - Progressive RV dilation or dysfunction despite medical therapy (class IIb)
  - Isolated severe secondary TR rarely treated surgically (high operative risk, often improves with treating underlying cause)
  - Surgical options:
  - Tricuspid valve repair (preferred):
  - Annuloplasty (ring or suture)
  - Leaflet repair
  - Repair preferred over replacement (avoids prosthetic valve, better outcomes)
  - Tricuspid valve replacement:
  - If repair not feasible (severe leaflet destruction, carcinoid)
  - Usually bioprosthetic valve (mechanical valve in tricuspid position has higher thrombosis risk)
  - Transcatheter options (emerging):
  - TriClip (edge-to-edge repair similar to MitraClip)
  - Transcatheter tricuspid valve replacement (TTVR)
  - For high surgical risk patients
  - Post-operative management:
  - Anticoagulation if mechanical valve (warfarin INR 2.5-3.5)
  - Antiplatelet if bioprosthetic valve or repair (aspirin 81 mg)
  - Diuretics as needed for residual congestion

clinical_pearls:
  - Most TR is secondary (functional) from RV dilation or pulmonary hypertension
  - Treat underlying cause (pulmonary hypertension, left heart disease) most important
  - Holosystolic murmur at left lower sternal border increases with inspiration (Carvallo sign)
  - Severe TR criteria include vena contracta over 1.0 cm, systolic flow reversal in hepatic veins
  - Often well-tolerated until severe
  - Surgery typically performed when undergoing left-sided valve surgery, not isolated
  - Repair preferred over replacement

differentials:
  - Mitral regurgitation (holosystolic murmur at apex radiating to axilla, not left lower sternal border)
  - VSD (holosystolic murmur with thrill at left sternal border)
  - Pulmonic regurgitation (diastolic murmur)
  - Right heart failure from other causes (without murmur)

trace: |
  A 72-year-old woman with history of severe mitral stenosis (rheumatic heart disease) presented with 6 months progressive lower extremity edema and abdominal distension (ascites). Dyspnea on exertion NYHA class III. History of mitral valve replacement 15 years ago (bioprosthetic valve). Exam: irregularly irregular rhythm (atrial fibrillation), elevated JVP 16 cm H2O with prominent V waves (systolic pulsations from TR), holosystolic murmur grade 3/6 at left lower sternal border increasing with inspiration (Carvallo sign - pathognomonic for TR), pulsatile liver edge (transmitted RV systolic pressure), 3+ pitting edema to thighs (anasarca), tense ascites, RV heave (enlarged RV). ECG: atrial fibrillation, RA enlargement (tall peaked P waves previously when in sinus rhythm). Chest X-ray: cardiomegaly (enlarged RA and RV). Echo: bioprosthetic mitral valve with mild stenosis (mean gradient 8 mmHg, valve area 1.8 cm² - mild MS but contributing to pulmonary hypertension), severe tricuspid regurgitation with vena contracta 1.3 cm (over 1.0 is severe), large regurgitant jet area over 10 cm² (severe), systolic flow reversal in hepatic veins (severe TR), severely dilated RV and RA (from chronic TR and volume overload), tricuspid annular dilation 5.2 cm (marked dilation), flail or prolapsing anterior tricuspid leaflet (possible endocarditis or degeneration), PA systolic pressure 60 mmHg (severe pulmonary hypertension from mitral valve disease). Diagnosed with severe primary tricuspid regurgitation (leaflet abnormality) plus secondary component (annular dilation, RV dilation, pulmonary hypertension from mitral valve disease). Multiple contributing factors: failed bioprosthetic mitral valve with recurrent stenosis causing pulmonary hypertension, chronic AFib causing annular dilation, RV dilation from chronic volume overload. Severe symptomatic TR with NYHA class III symptoms (edema, ascites, dyspnea). Given both mitral valve dysfunction (bioprosthetic valve failure with recurrent MS) and severe TR, surgical candidate for redo mitral valve replacement plus tricuspid valve repair (class I indication: severe TR undergoing left-sided valve surgery). Started aggressive diuresis: furosemide 80 mg IV BID plus spironolactone 50 mg daily, diuresed 15 pounds over 5 days. Repeat echo post-diuresis: TR still severe (annular dilation and leaflet abnormality persist). Referred to cardiac surgery. Given age 72, redo sternotomy risk (higher risk than first-time surgery), and bioprosthetic valve failure, discussed options. Underwent redo mitral valve replacement with new bioprosthetic valve (27mm) plus tricuspid valve repair (DeVega annuloplasty with 32mm annuloplasty ring). Intraoperative findings: severely calcified failed bioprosthetic mitral valve (leaflets restricted), tricuspid valve with dilated annulus and flail anterior leaflet (repaired with annuloplasty and leaflet repair). Post-operative TEE: new mitral valve functioning well (no stenosis or regurgitation), tricuspid repair successful with trace TR only (excellent result). Post-operative course: prolonged intubation 2 days (expected for redo sternotomy), extubated POD 2. Continued diuresis. Discharge POD 10 on warfarin (target INR 2-3 for AFib), furosemide 40 mg daily, spironolactone 25 mg daily, metoprolol. At 6 weeks: outpatient follow-up, symptoms dramatically improved. No edema, no ascites, dyspnea improved to NYHA class I-II. Exam: JVP 8 cm H2O (normalized), no pulsations (no TR), soft systolic murmur (prosthetic mitral valve, no TR murmur), liver not palpable (decompressed), trace edema only. Echo: mitral prosthetic valve functioning normally (mean gradient 5 mmHg), durable tricuspid repair with trace-mild TR only (vena contracta 0.5 cm - mild at most, excellent result), RV size decreased (reverse remodeling after eliminating volume overload), RA size decreased from 6.5 cm to 5.2 cm, PA pressure 45 mmHg (improved from 60 mmHg with new mitral valve). At 6 months: continued improvement, minimal TR (trace only), RV normalized in size, no edema or ascites, NYHA class II. This case demonstrates severe TR (both primary leaflet disease and secondary annular dilation from RV dilation and pulmonary hypertension) in setting of failed bioprosthetic mitral valve. Combined mitral valve replacement and tricuspid valve repair (class I indication when undergoing left-sided valve surgery) with excellent outcomes. Tricuspid repair when performed concomitantly with mitral surgery prevents progression of TR and improves outcomes. Isolated severe TR rarely treated surgically unless extremely symptomatic.
