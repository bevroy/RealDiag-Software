tree_id: CARDS-TRICUSPID-REGURGITATION
name: Tricuspid Regurgitation
family: Cardiology
specialty: Cardiology
chief_complaint: Swollen legs and abdominal distension
description: Backflow from RV to RA causing right heart failure symptoms, holosystolic murmur at left lower sternal border increasing with inspiration. Most commonly functional from RV dilatation secondary to left heart disease or pulmonary hypertension. Surgery indicated if severe symptomatic or undergoing left-sided valve surgery.
icd10: I07.1
urgency: routine

workup:
  - Symptoms: right heart failure predominant
  - Peripheral edema: lower extremity swelling, ascites
  - Hepatomegaly: tender liver from congestion
  - Abdominal distension: ascites from elevated RA pressure
  - Dyspnea: if coexisting left heart disease or pulmonary hypertension
  - Fatigue: low cardiac output
  - Physical exam:
  - Holosystolic murmur: at left lower sternal border (4th-5th intercostal space)
  - Increases with inspiration (Carvallo sign - specific for TR)
  - Inspiration increases venous return to RV, increases regurgitant volume and murmur intensity
  - Prominent jugular venous pulsations: large CV wave (regurgitant wave), blunted y descent
  - Pulsatile liver: hepatomegaly with systolic pulsations (transmitted from RA)
  - S3 gallop: right-sided S3
  - Peripheral edema, ascites
  - Classification:
  - Primary (organic) TR: intrinsic valve disease (rare)
  - Rheumatic heart disease, endocarditis (especially IV drug users), carcinoid, pacemaker lead trauma, congenital (Ebstein anomaly)
  - Secondary (functional) TR: structurally normal valve, most common (80-90%)
  - RV dilatation from pulmonary hypertension (left heart disease, pulmonary disease, pulmonary embolism)
  - RV dilatation from RV infarction
  - Annular dilatation prevents leaflet coaptation
  - Causes of secondary TR:
  - Left-sided heart disease: mitral regurgitation, mitral stenosis, left heart failure (most common)
  - Pulmonary hypertension: from any cause (COPD, ILD, PE, primary PAH)
  - RV infarction: inferior MI with RV involvement
  - Echocardiogram:
  - Visualize regurgitant jet: color Doppler shows backflow from RV to RA
  - Severity grading: vena contracta width, jet area, hepatic vein flow reversal
  - Severe TR: vena contracta over 0.7 cm, dense continuous wave Doppler signal, systolic flow reversal in hepatic veins
  - RV size and function: dilated RV common in functional TR
  - RA size: enlargement from chronic volume overload
  - Estimate PA systolic pressure: from TR jet velocity (helps determine if TR primary or secondary to PH)
  - Tricuspid annular plane systolic excursion (TAPSE): RV systolic function (normal over 17 mm)
  - Mechanism: functional (annular dilatation, leaflet tethering from RV dilatation), organic (leaflet destruction, prolapse)

treatment:
  - Treat underlying cause (most important for secondary TR):
  - Left heart disease: treat mitral valve disease, optimize heart failure therapy
  - Pulmonary hypertension: treat underlying lung disease, pulmonary vasodilators if PAH
  - Many patients with secondary TR improve when underlying cause treated
  - Medical management:
  - Diuretics: furosemide for volume overload, edema, ascites (mainstay of symptom relief)
  - Often require high doses and combination (furosemide plus spironolactone)
  - ACE inhibitors or ARBs: if left heart disease or hypertension
  - Pulmonary vasodilators: if primary pulmonary hypertension contributing
  - Tricuspid valve surgery:
  - Indications: severe symptomatic primary TR, severe TR undergoing left-sided valve surgery (concomitant repair), severe TR with progressive RV dilatation or dysfunction
  - Tricuspid valve repair (preferred):
  - Annuloplasty ring or band (De Vega annuloplasty)
  - Preserves valve, lower morbidity
  - Often performed concomitantly with mitral valve surgery
  - Tricuspid valve replacement:
  - If primary TR with destroyed valve (endocarditis, rheumatic)
  - Bioprosthetic valve preferred (mechanical valve high thrombosis risk in tricuspid position)
  - High operative mortality (8-10%) if isolated tricuspid surgery (often sicker patients)
  - Timing controversy: operate early before irreversible RV dysfunction vs conservative medical management
  - Many guidelines recommend repair if severe TR at time of left-sided valve surgery (even if asymptomatic)
  - Percutaneous edge-to-edge repair (TriClip): transcatheter therapy for high surgical risk patients with severe symptomatic TR
  - Prognosis: severe TR associated with increased mortality even after correcting for other factors, progressive RV dysfunction

clinical_pearls:
  - Holosystolic murmur at left lower sternal border increasing with inspiration (Carvallo sign)
  - Most commonly functional from RV dilatation secondary to left heart disease or pulmonary hypertension
  - Right heart failure symptoms: peripheral edema, ascites, hepatomegaly with pulsations
  - Prominent CV wave and pulsatile liver from regurgitant wave
  - Treat underlying cause most important (left heart disease, pulmonary hypertension)
  - Diuretics mainstay for symptom relief (often high doses needed)
  - If severe TR at time of left-sided valve surgery, perform concomitant tricuspid repair
  - Isolated tricuspid surgery has high operative mortality (8-10%)

differentials:
  - Mitral regurgitation: holosystolic at apex radiating to axilla, does not increase with inspiration
  - Ventricular septal defect: holosystolic at left sternal border with thrill, does not increase with inspiration
  - Pulmonic regurgitation: diastolic murmur at left upper sternal border
  - Tricuspid stenosis: diastolic murmur at left lower sternal border, rare

trace: |
  A 68-year-old woman with history of mitral regurgitation s/p mitral valve replacement 5 years ago presented with 1 year of progressive lower extremity edema and abdominal distension. Shortness of breath with minimal exertion. Exam: BP 105/70, HR 88, elevated JVP 16 cm with prominent CV waves (regurgitant waves), holosystolic 3/6 murmur at left lower sternal border increasing with inspiration (Carvallo sign - specific for TR), pulsatile hepatomegaly (liver pulsates with systole from transmitted RA pressure), massive ascites, 3+ pitting edema to thighs. Echocardiogram: bioprosthetic mitral valve well-seated and functioning normally, severe tricuspid regurgitation with vena contracta 0.9 cm (severe over 0.7), systolic flow reversal in hepatic veins (severe TR), RV severely dilated, RA severely enlarged 6.5 cm, TAPSE 12 mm (reduced, normal over 17 - RV dysfunction), mild pulmonary hypertension PASP 45 mmHg. Diagnosed with severe functional tricuspid regurgitation secondary to prior mitral valve disease causing RV dilatation (most common mechanism). Medical management: increased furosemide to 80 mg BID plus spironolactone 50 mg daily (high-dose diuretics for refractory volume overload). At 2 weeks lost 20 pounds fluid, edema improved 50%, ascites decreased but still symptomatic. Continued aggressive diuresis. Cardiothoracic surgery consultation: discussed tricuspid valve repair but isolated tricuspid surgery has high operative mortality 8-10% and she has reduced RV function (higher risk). Ideally would have repaired tricuspid valve at time of mitral replacement 5 years ago (concomitant repair has lower risk). Deemed high surgical risk. Referred for consideration of percutaneous TriClip (transcatheter edge-to-edge repair for high surgical risk patients). Underwent TriClip procedure: clip placed approximating anterior and septal leaflets. Post-procedure echo: TR reduced from severe to moderate, vena contracta 0.5 cm, no hepatic vein flow reversal. At 1 month significant symptom improvement: diuretic requirement decreased to furosemide 40 mg daily, edema resolved 80%, ascites minimal, able to walk without dyspnea. At 6 months stable moderate TR on TriClip, improved functional status, quality of life improved. Not cured but palliative improvement. Counseled that severe TR associated with increased mortality even with treatment. Continues diuretics, annual echo monitoring.
