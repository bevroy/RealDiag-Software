tree_id: OB-PREGNANCY-NORMAL-SUPERVISION
name: Pregnancy, Normal Supervision
family: obstetrics_gynecology
specialty: Obstetrics/Family Medicine
icd10: Z34.90
snomed: 289908002
urgency: []
homeopathy: []
presentations:
  - Confirmed pregnancy with positive home pregnancy test or serum beta-hCG
  - Missed menstrual period (amenorrhea)
  - Early pregnancy symptoms (nausea, breast tenderness, fatigue, urinary frequency)
  - Last menstrual period (LMP) known for dating
  - No significant risk factors or complications
  - Seeking routine prenatal care
  - First prenatal visit typically at 8-10 weeks gestation
  - Multiparity or primigravida presentation
workup:
  - Confirm pregnancy and establish gestational age
  - Serum beta-hCG if needed (doubles every 48-72 hours in early pregnancy)
  - "Less than 5 mIU/mL: not pregnant"
  - "Greater than 25 mIU/mL: pregnant"
  - Transvaginal ultrasound at 6-8 weeks
  - Confirm intrauterine pregnancy (rule out ectopic)
  - Establish accurate gestational age and estimated due date (EDD)
  - Assess fetal cardiac activity (visible at 6 weeks)
  - Dating by LMP (Naegele's rule: LMP + 7 days - 3 months + 1 year)
  - First trimester ultrasound most accurate for dating (crown-rump length)
  - Initial prenatal laboratory evaluation (first visit)
  - Complete blood count (screen for anemia)
  - Blood type and Rh factor (critical for Rh incompatibility)
  - Antibody screen (indirect Coombs)
  - Rubella immunity (IgG)
  - Hepatitis B surface antigen (HBsAg)
  - Syphilis screening (RPR or VDRL)
  - HIV screening (opt-out screening recommended)
  - Urinalysis and urine culture (asymptomatic bacteriuria screening)
  - Pap smear if due for cervical cancer screening
  - Gonorrhea and chlamydia screening (women under 25 or at risk)
  - Varicella immunity (if no history of chickenpox or vaccination)
  - Tuberculosis screening (PPD or QuantiFERON if high risk)
  - Hemoglobin electrophoresis (if African, Mediterranean, Southeast Asian ancestry)
  - First trimester screening (10-13 weeks)
  - Nuchal translucency ultrasound + serum markers (PAPP-A, free beta-hCG)
  - Screen for Down syndrome (trisomy 21) and trisomy 18
  - Cell-free fetal DNA (cfDNA/NIPT) option for high-risk women
  - Second trimester screening and anatomy scan
  - Maternal serum alpha-fetoprotein (MSAFP) at 15-20 weeks (neural tube defects)
  - Quad screen (AFP, hCG, estriol, inhibin A) for aneuploidy if first trimester screen not done
  - Anatomy ultrasound at 18-22 weeks (detailed fetal survey)
  - Glucose screening for gestational diabetes (24-28 weeks)
  - 1-hour glucose challenge test (50g oral glucose)
  - "Less than 140 mg/dL: negative screen"
  - "Greater than 140 mg/dL: proceed to 3-hour glucose tolerance test"
  - Group B streptococcus (GBS) screening (35-37 weeks)
  - Vaginal-rectal swab culture
  - If positive, give intrapartum antibiotics to prevent neonatal infection
  - Third trimester evaluation
  - Repeat hemoglobin/hematocrit (check for anemia)
  - Fetal growth assessment (fundal height, ultrasound if indicated)
  - Fetal movement counting (kick counts)
  - Non-stress test (NST) if indicated (post-term, high-risk)
treatment:
  - Prenatal visit schedule
  - Every 4 weeks until 28 weeks gestation
  - Every 2 weeks from 28-36 weeks
  - Weekly from 36 weeks until delivery
  - Prenatal vitamins and supplements
  - Folic acid 400-800 mcg daily (start preconception, continue through first trimester)
  - Reduces neural tube defects by 70%
  - Iron supplementation 27-30 mg elemental iron daily
  - Calcium 1000 mg daily
  - Vitamin D 600 IU daily
  - DHA (omega-3) 200-300 mg daily (optional, supports fetal brain development)
  - Immunizations during pregnancy
  - Tdap vaccine at 27-36 weeks (each pregnancy - protects newborn from pertussis)
  - Influenza vaccine (any trimester during flu season)
  - COVID-19 vaccine recommended
  - Avoid live vaccines (MMR, varicella)
  - Rh immunoglobulin (RhoGAM) if Rh-negative mother
  - 300 mcg at 28 weeks gestation (prevents Rh sensitization)
  - Repeat within 72 hours after delivery if baby is Rh-positive
  - Lifestyle and dietary counseling
  - Weight gain recommendations
  - "Underweight (BMI less than 18.5): 28-40 lbs total"
  - "Normal weight (BMI 18.5-24.9): 25-35 lbs total"
  - "Overweight (BMI 25-29.9): 15-25 lbs total"
  - "Obese (BMI greater than 30): 11-20 lbs total"
  - Avoid alcohol, tobacco, and illicit drugs
  - Limit caffeine to less than 200 mg daily (one 12-oz coffee)
  - Avoid high-mercury fish (shark, swordfish, king mackerel)
  - Eat low-mercury fish 2-3 times weekly (salmon, tilapia, shrimp)
  - Avoid unpasteurized dairy, deli meats (listeriosis risk), raw/undercooked meat
  - Exercise: 150 minutes moderate aerobic activity weekly (walking, swimming)
  - Avoid contact sports, activities with fall risk
  - Common pregnancy symptom management
  - Nausea/vomiting: small frequent meals, ginger, vitamin B6 25 mg TID, doxylamine 10 mg
  - Heartburn: avoid triggers, elevate head of bed, antacids (calcium carbonate), ranitidine if needed
  - Constipation: increase fiber and fluids, docusate sodium, polyethylene glycol if needed
  - Back pain: prenatal yoga, pelvic support belt, acetaminophen (avoid NSAIDs)
  - Leg cramps: stretch calves, magnesium supplementation
  - Hemorrhoids: increase fiber, sitz baths, topical hydrocortisone
  - Safe medications during pregnancy
  - Acetaminophen for pain/fever (avoid NSAIDs after 20 weeks - can cause oligohydramnios)
  - Penicillins, cephalosporins, azithromycin for infections
  - Avoid tetracyclines, fluoroquinolones, ACE inhibitors, statins, isotretinoin
  - Fetal monitoring
  - Kick counts starting at 28 weeks (10 movements in 2 hours is reassuring)
  - Non-stress testing if high-risk or post-dates
  - Biophysical profile if indicated
clinical_pearls:
  - 'First prenatal visit should occur by 10 weeks - early care improves outcomes'
  - 'Folic acid 400-800 mcg daily reduces neural tube defects by 70% - start preconception if possible'
  - 'Tdap vaccine at 27-36 weeks each pregnancy protects newborn from pertussis in first months of life'
  - 'RhoGAM at 28 weeks and within 72 hours postpartum prevents Rh alloimmunization in Rh-negative mothers'
  - 'Gestational age dating most accurate by first trimester ultrasound (crown-rump length)'
  - 'Cell-free fetal DNA (NIPT) has 99% sensitivity for Down syndrome - can be done at 10 weeks'
  - 'GBS screening at 35-37 weeks - intrapartum antibiotics reduce neonatal early-onset GBS disease by 80%'
  - 'Acetaminophen safe throughout pregnancy; avoid NSAIDs after 20 weeks (premature ductus closure, oligohydramnios)'
referrals:
  - Maternal-fetal medicine for high-risk pregnancies (chronic hypertension, diabetes, prior preterm birth, multiples)
  - Genetic counseling if abnormal screening tests or family history of genetic disorders
  - Perinatology for fetal anomalies detected on ultrasound
  - Obstetric anesthesia consultation if complex medical history or desired pain management discussion
differentials:
  - Normal pregnancy (routine prenatal care, no complications)
  - High-risk pregnancy (maternal medical conditions, previous pregnancy complications, fetal anomalies)
  - Ectopic pregnancy (first trimester - abdominal pain, bleeding, no intrauterine gestational sac)
  - Threatened abortion (vaginal bleeding in first trimester with viable pregnancy)
  - Gestational trophoblastic disease (markedly elevated hCG, no fetal cardiac activity, snowstorm ultrasound appearance)
