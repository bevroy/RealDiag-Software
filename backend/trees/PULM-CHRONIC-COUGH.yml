tree_id: PULM-CHRONIC-COUGH
name: Chronic Cough
family: pulmonology
specialty: Pulmonology
icd10: R05.3
snomed: 68154008
urgency: routine
homeopathy: []
presentations:
  - Cough lasting >8 weeks (definition of chronic cough)
  - Dry or productive cough
  - Worse at night or in specific positions
  - Throat clearing
  - Hoarseness
  - Postnasal drip sensation
  - Heartburn or sour taste (GERD)
  - Cough triggered by talking, laughing, exercise, cold air
  - Otherwise healthy patient (no fever, weight loss, dyspnea at rest)
  - May significantly impact quality of life
workup:
  - Detailed history - duration, character, triggers, associated symptoms
  - Medication review - ACE inhibitors most common drug cause (10-20% of patients)
  - Physical examination - oropharynx, lung auscultation, cardiac exam
  - Chest X-ray - rule out malignancy, infection, interstitial lung disease
  - Empiric treatment trial often diagnostic and therapeutic
  - If CXR normal and not on ACE inhibitor, evaluate for common causes (triad)
  - Upper airway cough syndrome (postnasal drip)
  - Asthma/cough-variant asthma
  - Gastroesophageal reflux disease (GERD)
  - Spirometry with bronchodilator if asthma suspected
  - Consider methacholine challenge test if spirometry normal but asthma suspected
  - Consider sinus CT if upper airway cough syndrome/chronic rhinosinusitis suspected
  - Esophageal pH monitoring or empiric PPI trial for GERD
  - High-resolution CT chest if CXR abnormal or refractory cough
  - Bronchoscopy if hemoptysis, smoker, or concern for endobronchial lesion
  - Consider laryngoscopy for vocal cord dysfunction or laryngeal hypersensitivity
treatment:
  - Treat underlying cause (sequential empiric trials often needed)
  - ACE inhibitor-induced cough
  - Discontinue ACE inhibitor (switch to ARB)
  - Cough resolves in 1-4 weeks after stopping
  - Upper airway cough syndrome / postnasal drip
  - First-generation antihistamine/decongestant (chlorpheniramine + pseudoephedrine)
  - Intranasal corticosteroid (fluticasone, mometasone)
  - Nasal saline irrigation
  - Antibiotics if bacterial sinusitis suspected
  - Asthma / cough-variant asthma
  - Inhaled corticosteroids (fluticasone, budesonide) for 6-8 weeks
  - Trial of bronchodilator (albuterol)
  - May need high-dose ICS or add LABA if no response
  - GERD-related cough
  - PPI (omeprazole 40mg BID or equivalent) for 2-3 months
  - Lifestyle modifications - elevate head of bed, avoid late meals, weight loss
  - H2 blocker addition if partial response
  - If refractory to above, consider
  - Gabapentin 300-1800mg daily for neuropathic/hypersensitivity cough
  - Speech therapy for paradoxical vocal cord motion
  - Codeine or other opioid cough suppressants (limited duration due to side effects)
  - Behavioral cough suppression therapy
clinical_pearls:
  - Most common causes (90%) - upper airway cough syndrome, asthma, GERD (often >1 cause)
  - ACE inhibitor cough - dry, tickling, more common in women, can occur anytime during treatment
  - Cough-variant asthma - cough is only symptom, normal spirometry, positive methacholine challenge
  - GERD-related cough may not have heartburn (25% no GI symptoms)
  - Eosinophilic bronchitis - normal spirometry, sputum eosinophilia, responds to ICS
  - Chronic cough can persist due to hypersensitivity of cough reflex (sensitization)
  - Red flags - hemoptysis, weight loss, smoking history, abnormal CXR, immunosuppression
  - Sequential empiric trials last 2-3 months each before moving to next cause
  - Combination therapy often needed (treat all contributing factors)
  - Psychogenic cough rare - diagnosis of exclusion after thorough workup
referrals:
  - Pulmonology for refractory cough despite treatment trials or abnormal imaging
  - ENT for chronic rhinosinusitis, laryngoscopy evaluation
  - Gastroenterology for refractory GERD or need for pH monitoring
  - Speech therapy for paradoxical vocal cord motion or habit cough
  - Allergy/immunology if allergic component suspected
differentials:
  - Upper airway cough syndrome (postnasal drip syndrome)
  - Asthma or cough-variant asthma
  - Gastroesophageal reflux disease (GERD)
  - ACE inhibitor-induced cough
  - Chronic bronchitis (smoking history)
  - Eosinophilic bronchitis
  - Bronchiectasis
  - Interstitial lung disease
  - Lung cancer (especially if smoker, weight loss, hemoptysis)
  - Post-infectious cough (usually resolves in 8 weeks)
  - Laryngeal hypersensitivity syndrome
  - Psychogenic or habit cough
