treatment:
  - Oral antibiotics - penicillin V 250mg PO TID x10 days (children <27kg) or 500mg TID x10 days (children ≥27kg)
  - 'Alternative: Amoxicillin 50mg/kg once daily (max 1000mg) x10 days - better compliance'
  - 'Penicillin allergy: Azithromycin 12mg/kg once daily x5 days (max 500mg) OR cephalexin 25-50mg/kg/day divided BID-QID x10 days (if not anaphylactic)'
  - 'Severe penicillin allergy: Clindamycin 20mg/kg/day divided TID x10 days'
  - 'Single-dose IM option: Benzathine penicillin G 600,000 units IM (<27kg) or 1.2 million units IM (≥27kg) - ensures compliance'
  - Symptomatic relief - acetaminophen or ibuprofen for fever and sore throat, cold fluids, throat lozenges (age >4)
  - Isolation until 24 hours of antibiotics completed
  - MUST complete full 10-day course to prevent acute rheumatic fever and glomerulonephritis
  - No need for follow-up culture unless recurrent infections or concerns for rheumatic fever
