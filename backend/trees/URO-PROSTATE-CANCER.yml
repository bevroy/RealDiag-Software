nodes:
  - id: prostate_cancer_evaluation
    type: diagnosis
    name: "Prostate Cancer"
    icd10: "C61"
    urgency: medium
    workup:
      - Most common cancer in men (excluding skin), second leading cause cancer death (after lung)
      - Risk factors - Age (median 66 years), African American race (2x risk), family history
      - Screening - Controversial (USPSTF Grade C, shared decision-making ages 55-69)
      - PSA (prostate-specific antigen) - Not cancer-specific (elevated with BPH, prostatitis, age)
      - Normal <4 ng/mL, gray zone 4-10, >10 higher cancer risk
      - Age-adjusted PSA - <2.5 age 40-49, <3.5 age 50-59, <4.5 age 60-69, <6.5 age 70-79
      - PSA velocity (rate of rise >0.75 ng/mL/year) and PSA density (PSA/prostate volume >0.15) increase suspicion
      - Digital rectal exam (DRE) - Palpable nodule, asymmetry, induration suspicious
      - Diagnosis - Transrectal ultrasound (TRUS)-guided biopsy or MRI-fusion biopsy (12+ core samples)
      - Gleason score - Histologic grade (pattern 1-5, sum of two most common patterns)
      - Gleason 6 (3+3) - Low-grade, indolent
      - Gleason 7 (3+4 or 4+3) - Intermediate-grade, 4+3 worse than 3+4
      - Gleason 8-10 - High-grade, aggressive
      - Staging - TNM (T1-T4 local extent, N lymph nodes, M metastases)
      - T1 - Incidental (TURP), non-palpable
      - T2 - Confined to prostate
      - T3 - Extracapsular extension, seminal vesicle invasion
      - T4 - Invades adjacent structures (bladder, rectum)
      - Metastatic workup if high-risk - Bone scan (bone mets most common), CT/MRI abdomen-pelvis (nodes), newer PSMA PET scan (more sensitive)
      - Risk stratification (D'Amico or NCCN)
      - Very low/Low - T1-T2a, Gleason ≤6, PSA <10
      - Intermediate - T2b-T2c OR Gleason 7 OR PSA 10-20
      - High - T3 OR Gleason 8-10 OR PSA >20
    treatment:
      - Localized prostate cancer (T1-T2, no mets)
      - Active surveillance - Very low/low-risk, life expectancy <10 years or older/comorbid
      - Monitor PSA q6-12 months, DRE, repeat biopsy q1-3 years
      - Delay treatment (avoid side effects), intervene if progression
      - Radical prostatectomy - Surgery, remove prostate + seminal vesicles
      - Open, laparoscopic, or robotic-assisted
      - Complications - ED (30-70%), urinary incontinence (5-20% long-term, higher short-term), strictures
      - Curative intent, pathologic staging
      - Radiation therapy - External beam (IMRT, stereotactic) or brachytherapy (radioactive seed implants)
      - Similar oncologic outcomes to surgery (10-year survival ~90-95% localized disease)
      - Complications - Bowel dysfunction (diarrhea, rectal bleeding), urinary symptoms, ED (50-60%)
      - Androgen deprivation therapy (ADT) - Add to radiation for intermediate/high-risk (improves outcomes)
      - Locally advanced/high-risk (T3, high Gleason, PSA >20)
      - Radiation + ADT (2-3 years) - Superior to RT alone
      - Radical prostatectomy + pelvic lymph node dissection - Alternative
      - Adjuvant/salvage radiation if positive margins or extracapsular extension
      - Metastatic prostate cancer
      - Androgen deprivation therapy (ADT) - Backbone, castrate testosterone levels
      - LHRH agonists - Leuprolide, goserelin (chemical castration), initial flare (co-administer antiandrogen 2 weeks)
      - LHRH antagonists - Degarelix (no flare)
      - Bilateral orchiectomy - Surgical castration, immediate
      - Antiandrogens - Bicalutamide, enzalutamide (blocks androgen receptor)
      - Combination - Abiraterone (CYP17 inhibitor blocks testosterone synthesis) + prednisone + ADT (LATITUDE, STAMPEDE trials improve survival newly diagnosed metastatic)
      - Chemotherapy - Docetaxel (first-line metastatic castrate-resistant), cabazitaxel (second-line)
      - Bone-targeted therapy - Zoledronic acid or denosumab (reduce skeletal-related events, bone pain)
      - Radium-223 - Alpha-emitter for bone metastases (improves survival)
      - PARP inhibitors - Olaparib, rucaparib (if BRCA1/2 or DNA repair gene mutations)
      - Immunotherapy - Sipuleucel-T (vaccine, modest survival benefit asymptomatic/minimally symptomatic mCRPC)
      - Castrate-resistant prostate cancer (CRPC) - Progression despite ADT
      - Continue ADT + add enzalutamide, abiraterone, docetaxel, or radium-223
      - Sequencing depends on prior treatments, metastatic burden, symptoms
      - Prognosis - Localized disease 5-year survival ~100%, regional 100%, distant ~31% (but prolonged survival with treatment, median 5-7 years metastatic hormone-sensitive)
