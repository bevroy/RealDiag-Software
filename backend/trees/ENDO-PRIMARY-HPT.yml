presentations:
  - Often asymptomatic (discovered on routine labs)
  - Kidney stones (nephrolithiasis) in 20% of patients
  - Bone pain and osteoporosis
  - Fatigue and weakness
  - Depression and cognitive dysfunction
  - Polyuria and polydipsia
  - Constipation
  - Nausea and peptic ulcer disease
  - Hypertension
  - Consistently elevated serum calcium on multiple measurements
  - Inappropriately normal or elevated PTH in setting of hypercalcemia
differentials:
  - Familial hypocalciuric hypercalcemia
  - Malignancy
  - Vitamin D toxicity
  - Tertiary hyperparathyroidism
workup:
  - Calcium (elevated, check ionized or albumin-corrected), PTH (elevated or inappropriately normal)
  - 24-hour urine calcium and creatinine (exclude familial hypocalciuric hypercalcemia if calcium/creatinine clearance ratio <0.01)
  - Vitamin D 25-OH (often low - repletion may worsen hypercalcemia, use caution)
  - DEXA scan for bone density, renal ultrasound or CT for kidney stones
  - Sestamibi scan or 4D CT pre-op to localize adenoma
treatment:
  - 'Guideline-based treatment options for Primary hyperparathyroidism include:'
  - 'Parathyroidectomy (curative) if: Symptomatic, age <50, calcium >1 mg/dL above normal, eGFR <60, osteoporosis, kidney stones (ADA 2024)'
  - 'Observation if asymptomatic and doesn''t meet surgical criteria: Monitor calcium, bone density, renal function annually (ADA 2024)'
  - 'Medical management if surgery contraindicated: Cinacalcet 30-90mg BID (calcimimetic, lowers PTH and calcium) (ADA 2024)'
  - Hydration, avoid thiazide diuretics (increase calcium), avoid prolonged immobilization (ADA 2024)
  - Bisphosphonates if osteoporosis present (treats bone loss but doesn't lower calcium) (ADA 2024)
clinical_pearls:
  - Most common cause of hypercalcemia in outpatients (malignancy is most common in inpatients)
  - 85% solitary parenchymal adenoma, 15% multigland hyperplasia, <1% parathyroid carcinoma
  - Often asymptomatic - discovered incidentally on routine labs (elevated calcium)
  - 'Complications: Kidney stones (20%), osteoporosis/fractures, hypercalciuria, peptic ulcer disease'
  - 'MEN1 and MEN2A syndromes: Familial hyperparathyroidism (multigland disease, younger age)'
