presentations:
  - Asymptomatic (found on screening lipid panel)
  - Elevated LDL cholesterol (>100 mg/dL)
  - Low HDL cholesterol (<40 mg/dL in men, <50 mg/dL in women)
  - Elevated triglycerides (>150 mg/dL)
  - Xanthomas (cholesterol deposits in tendons, skin) if severe familial dyslipidemia
  - Xanthelasmata (yellowish plaques around eyelids)
  - Corneal arcus (white ring around cornea) in young patients suggests familial hypercholesterolemia
  - Risk factors: family history, obesity, diabetes, metabolic syndrome, sedentary lifestyle
differentials:
  - Primary dyslipidemia (polygenic, familial hypercholesterolemia, familial combined hyperlipidemia)
  - Secondary dyslipidemia (diabetes, hypothyroidism, nephrotic syndrome, obesity)
  - Metabolic syndrome (abdominal obesity, hypertension, hyperglycemia, low HDL, high triglycerides)
  - Medication-induced (thiazides, beta-blockers, steroids, atypical antipsychotics, protease inhibitors)
workup:
  - Fasting lipid panel (preferred) or non-fasting
  - Total cholesterol, LDL cholesterol, HDL cholesterol, triglycerides
  - Calculate non-HDL cholesterol (total cholesterol - HDL) - useful if triglycerides elevated
  - Fasting required if triglycerides >400 mg/dL
  - Assess cardiovascular risk
  - 10-year ASCVD (atherosclerotic cardiovascular disease) risk calculator
  - Pooled Cohort Equations (age, sex, race, cholesterol, BP, diabetes, smoking)
  - 'Less than 5%: low risk; 5-7.5%: borderline; 7.5-20%: intermediate; greater than 20%: high risk'
  - Rule out secondary causes
  - Fasting glucose or HbA1c (diabetes)
  - TSH (hypothyroidism)
  - Liver enzymes (hepatic steatosis)
  - Urinalysis (nephrotic syndrome)
  - Medication review (thiazides, beta-blockers, steroids, atypical antipsychotics)
  - Consider familial hypercholesterolemia if LDL >190 mg/dL or strong family history
  - Calculate LDL cholesterol if not directly measured (Friedewald equation)
  - LDL = Total cholesterol - HDL - (Triglycerides/5) [if TG <400]
treatment:
  - Lifestyle modifications (all patients)
  - Diet: Mediterranean diet, reduce saturated fat (<7% calories), increase fiber
  - Exercise: 150 min/week moderate-intensity aerobic + resistance training
  - Weight loss if overweight (5-10% reduces triglycerides, increases HDL)
  - Smoking cessation
  - Limit alcohol (excess increases triglycerides)
  - Statin therapy indications (primary prevention)
  - LDL ≥190 mg/dL: high-intensity statin
  - Diabetes age 40-75: moderate-intensity statin
  - ASCVD risk ≥7.5%: moderate to high-intensity statin
  - ASCVD risk 5-7.5% with risk enhancers: consider moderate-intensity statin
  - Statin therapy (secondary prevention) - established ASCVD
  - High-intensity statin for all (atorvastatin 40-80 mg, rosuvastatin 20-40 mg)
  - Goal LDL <70 mg/dL (or <55 mg/dL if very high risk)
  - Statin intensity definitions
  - High-intensity: atorvastatin 40-80 mg, rosuvastatin 20-40 mg (lowers LDL ≥50%)
  - Moderate-intensity: atorvastatin 10-20 mg, rosuvastatin 5-10 mg, simvastatin 20-40 mg (lowers LDL 30-50%)
  - Additional therapies if LDL not at goal on maximally tolerated statin
  - Ezetimibe 10 mg daily (lowers LDL 15-20%)
  - PCSK9 inhibitors (evolocumab, alirocumab) - injectable, expensive, for very high risk
  - Bempedoic acid 180 mg daily (if statin intolerant)
  - Elevated triglycerides (≥500 mg/dL) - risk of pancreatitis
  - Fibrates (fenofibrate 145 mg daily) or omega-3 fatty acids (icosapent ethyl 2-4 g daily)
  - Monitor and adjust
  - Repeat lipid panel 4-12 weeks after statin initiation, then every 3-12 months
  - Check ALT at baseline and if symptoms (statin-induced hepatotoxicity rare)
  - Monitor for statin side effects (myalgias, rarely rhabdomyolysis)
clinical_pearls:
  - LDL cholesterol most important target - directly causes atherosclerosis
  - Statins reduce ASCVD events by 25-35% and are cornerstone of therapy
  - High-intensity statin reduces LDL by ≥50% - use for secondary prevention
  - Non-HDL cholesterol useful when triglycerides elevated (includes VLDL and remnants)
  - 'Familial hypercholesterolemia: LDL >190, family history, tendon xanthomas - needs aggressive treatment'
  - Triglycerides ≥500 mg/dL increase pancreatitis risk - lower TG first priority
  - HDL <40 mg/dL (men) or <50 (women) is cardiovascular risk factor
  - Statin-associated muscle symptoms common (10-15%) but true rhabdomyolysis rare (<0.1%)
