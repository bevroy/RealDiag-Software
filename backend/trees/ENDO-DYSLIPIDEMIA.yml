referrals:
  - Cardiology if very high risk ASCVD or complex dyslipidemia
  - Lipid specialist or preventive cardiology if refractory hyperlipidemia or suspected familial hypercholesterolemia
  - Endocrinology if secondary causes (diabetes, thyroid disease)
