tree_id: CARD-PERICARDITIS
name: Acute Pericarditis
family: Cardiology
specialty: Cardiology
chief_complaint: Sharp chest pain worse with lying flat
description: |
  Inflammation of pericardium causing chest pain and pericardial friction rub. Most commonly idiopathic or viral (coxsackie, echovirus).
  Other causes include post-MI (Dressler syndrome), uremia, autoimmune diseases, tuberculosis, malignancy. Complications include recurrence (15-30%), cardiac tamponade, constrictive pericarditis.
icd10: I30.9
urgency: Moderate
workup:
  - Clinical diagnosis based on at least 2 of 4 criteria - chest pain (sharp, pleuritic, relieved by sitting forward), pericardial friction rub, ECG changes, pericardial effusion
  - Chest pain characteristics - sharp, pleuritic, worse lying flat, relieved by sitting up and leaning forward, may radiate to trapezius ridge
  - Pericardial friction rub - high-pitched scratching sound, best heard at left sternal border with patient leaning forward, present in 30-50%
  - ECG - diffuse ST elevation (concave upward) and PR depression in multiple leads (except aVR), evolutionary changes over days-weeks
  - Stage 1 (acute) - diffuse ST elevation and PR depression; Stage 2 - ST normalizes; Stage 3 - T wave inversions; Stage 4 - resolution
  - Distinguish from STEMI - ST elevation in STEMI convex upward, reciprocal changes, limited to vascular territory
  - Echocardiogram - assess for pericardial effusion (present in 60%, usually small), evaluate for tamponade physiology
  - Labs - elevated inflammatory markers (ESR, CRP), troponin may be mildly elevated (myopericarditis), CBC, BUN/creatinine
  - Additional workup based on suspected etiology - ANA (lupus), tuberculin skin test or QuantiFERON, viral serologies rarely helpful
  - Pericardial fluid analysis if large effusion requiring drainage - cell count, glucose, protein, LDH, cytology, cultures (bacterial, fungal, AFB)
treatment:
  - NSAIDs first-line - ibuprofen 600-800mg TID or indomethacin 25-50mg TID, continue until pain resolves and CRP normalizes
  - Colchicine added to NSAIDs reduces recurrence by 50% - 0.6mg daily (less than 70 kg) or 0.6mg BID (greater than 70 kg) x 3 months
  - Gastroprotection with PPI if high-dose NSAIDs
  - Avoid corticosteroids in initial episode (increases recurrence risk) unless autoimmune etiology or contraindication to NSAIDs
  - If steroid-dependent or recurrent pericarditis - prednisone 0.25-0.5 mg/kg/day, slow taper over 2-3 months plus colchicine
  - Refractory recurrent pericarditis - IL-1 inhibitors (anakinra 100mg SC daily, rilonacept), azathioprine, IVIG
  - Exercise restriction until symptoms resolve and CRP normalizes (3 months for athletes)
  - Hospitalize if high-risk features - fever greater than 38C, subacute onset, large effusion (greater than 20 mm), tamponade, immunosuppression, trauma, oral anticoagulation, myopericarditis (troponin elevation with wall motion abnormality)
  - Urgent pericardiocentesis if cardiac tamponade - Beck triad (hypotension, muffled heart sounds, JVD), pulsus paradoxus greater than 10 mmHg
  - Pericardiectomy for constrictive pericarditis (chronic complication)
clinical_pearls:
  - Dressler syndrome (post-MI pericarditis) occurs 2-10 weeks after MI, now rare due to early reperfusion
  - Uremic pericarditis indicates need for urgent dialysis
  - Tuberculous pericarditis in endemic areas or immunocompromised - thick effusion, constrictive physiology
  - Recurrent pericarditis frustrating condition, colchicine dramatically reduces recurrence
  - Myopericarditis if troponin elevated - treat same as pericarditis, usually benign course, exclude STEMI
  - Post-pericardiotomy syndrome after cardiac surgery - similar presentation and treatment
differentials:
  - Acute coronary syndrome
  - Pulmonary embolism
  - Pneumonia with pleurisy
  - Aortic dissection
  - Costochondritis
  - Esophageal spasm
trace:
  - 28-year-old man with sharp chest pain x 2 days, worse lying flat, relieved sitting forward, preceded by upper respiratory infection → Vitals stable, afebrile → Exam shows triphasic friction rub at left sternal border → ECG shows diffuse ST elevation with PR depression, no reciprocal changes → Echo shows small pericardial effusion 5 mm, no tamponade → Troponin 0.8 ng/mL (mildly elevated), CRP 85 mg/L, ESR 45 mm/hr → Diagnose acute pericarditis with myopericarditis → Start ibuprofen 600mg TID and colchicine 0.6mg BID, omeprazole 20mg daily → Activity restriction for 3 months → Pain resolves by day 5 → Repeat echo at 1 week shows stable small effusion → CRP normalizes at 3 weeks → Continue ibuprofen x 4 weeks total, colchicine x 3 months → No recurrence at 6-month follow-up
