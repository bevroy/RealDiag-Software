tree_id: TRAUMA-WOUND-INFECTION
name: Wound Infection (Encounter)
family: emergency
specialty: Emergency Medicine, Primary Care, Infectious Disease
chief_complaint: Infected wound, wound drainage
description: |
  Wound infection is bacterial infection of traumatic or non-surgical wound.
  Presents with increasing pain, erythema, purulent drainage, and systemic signs.
  Risk factors include contamination, delayed treatment, poor wound care, immunocompromise.
icd10: L08.9
snomed: "416462003"
presentations:
  - Increasing wound pain (after initial improvement)
  - Erythema and warmth spreading beyond wound edges
  - Purulent drainage (yellow, green, or cloudy)
  - Swelling and induration
  - Red streaking (lymphangitis)
  - Fever and chills if systemic
  - Foul odor
  - Wound dehiscence
  - Usually develops 2-5 days after injury
urgency: High
referrals:
  emergency:
    - Systemic signs (fever, hypotension, altered mental status)
    - Rapidly spreading cellulitis
    - Necrotizing soft tissue infection
  surgery:
    - Deep space infection requiring surgical drainage
    - Necrotizing fasciitis
workup:
  - History of original wound and treatment
  - Time since injury
  - Wound care provided
  - Systemic symptoms - fever, chills, malaise
  - Examine wound - purulence, erythema extent, fluctuance, crepitus
  - Lymphangitis (red streaking)
  - Regional lymphadenopathy
  - Wound culture if moderate-severe infection or not responding to empiric therapy
  - Blood cultures if febrile or systemic signs
  - X-ray if concern for foreign body, gas in tissues, or osteomyelitis
  - Labs if systemic - CBC, BMP, lactate
treatment:
  local_wound_care:
    - Remove sutures/staples if present
    - Open wound to allow drainage
    - Irrigate with saline
    - Pack if deep cavity
    - Daily dressing changes
    - Warm compresses TID
  antibiotics:
    mild_infection:
      - Cephalexin 500mg QID x 7 days
      - Or amoxicillin-clavulanate 875mg BID x 7 days
    moderate_severe_infection:
      - Cover MRSA if risk factors (recent hospitalization, injection drug use, MRSA history)
      - TMP-SMX DS BID + cephalexin 500mg QID
      - Or doxycycline 100mg BID
      - Or clindamycin 300-450mg TID
    systemic_infection:
      - IV antibiotics - vancomycin + piperacillin-tazobactam
      - Hospitalization
  specific_organisms:
    streptococcus:
      - Rapidly spreading erythema, lymphangitis
      - Penicillin or amoxicillin
    staphylococcus_mssa:
      - Cephalexin or dicloxacillin
    mrsa:
      - TMP-SMX, doxycycline, or clindamycin
    anaerobes:
      - Foul odor, necrotic tissue
      - Amoxicillin-clavulanate or clindamycin
    pseudomonas:
      - Puncture wounds through shoe, diabetic wounds
      - Ciprofloxacin
  tetanus:
    - Update if >5 years since last dose
clinical_pearls:
  - Infection typically develops 2-5 days after wound
  - Erythema within 2cm of wound in first 48 hours often normal inflammatory response
  - Purulent drainage and spreading erythema are hallmarks of infection
  - MRSA now common community-acquired pathogen
  - Streptococcus causes rapidly spreading cellulitis with lymphangitis
  - Opening wound for drainage may be more important than antibiotics alone
  - Animal bites have high infection risk (especially cats)
  - Puncture wounds through shoes at risk for Pseudomonas
differentials:
  - Cellulitis
  - Abscess
  - Lymphangitis
  - Necrotizing fasciitis
  - Gas gangrene
  - Osteomyelitis (if bone exposed)
  - Foreign body reaction
trace:
  - 40-year-old with laceration repaired 4 days ago, now with increasing pain, purulent drainage, and erythema extending 5cm beyond wound. Fever 38.5°C. Remove sutures, irrigate wound, leave open. Wound culture obtained. Start amoxicillin-clavulanate 875mg BID. Culture grows MSSA. Continue antibiotics. Wound heals by secondary intention over 3 weeks.
citations:
  - Infectious Diseases Society of America Guidelines
  - UpToDate - Infectious Disease and Emergency Medicine
