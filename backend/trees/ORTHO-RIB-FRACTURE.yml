tree_id: ORTHO-RIB-FRACTURE
name: Rib Fracture (Suspected/Confirmed)
family: orthopedics
specialty: Orthopedics, Emergency Medicine, Trauma Surgery
chief_complaint: Chest pain after trauma or injury
description: |
  Rib fractures result from blunt chest trauma. Most heal with conservative management.
  Concern for complications: pneumothorax, hemothorax, pulmonary contusion, flail chest.
  Pain control and pulmonary hygiene critical to prevent pneumonia.
icd10: S22.39XA
snomed: "33737001"
presentations:
  - Chest wall pain after blunt trauma
  - Pain worse with deep breathing, coughing, movement
  - Point tenderness over rib(s)
  - Crepitus if displaced fracture
  - Splinting (shallow breathing) due to pain
  - Mechanism - fall, motor vehicle collision, assault, sports injury
  - Elderly may fracture ribs from minor trauma (osteoporosis) or severe coughing
urgency: High
referrals:
  emergency:
    - Flail chest (paradoxical chest wall movement)
    - Pneumothorax or hemothorax
    - Respiratory distress
    - Multiple rib fractures (>3)
    - First or second rib fracture (high-energy mechanism, associated injuries)
  trauma_surgery:
    - Severe chest trauma
    - Associated injuries requiring surgical intervention
  thoracic_surgery:
    - Flail chest may require surgical stabilization
    - Large pneumothorax or hemothorax requiring chest tube
workup:
  - History of trauma mechanism and timing
  - Assess respiratory status - rate, oxygen saturation, work of breathing
  - Physical exam
    - Inspect for chest wall deformity, paradoxical movement (flail chest)
    - Palpate ribs for point tenderness, crepitus, step-off
    - Auscultate lungs for decreased breath sounds (pneumothorax, hemothorax)
    - Assess for subcutaneous emphysema
  - Imaging
    - Chest X-ray (PA and lateral)
      - Identifies fractures (though may miss some)
      - Rules out pneumothorax, hemothorax, pulmonary contusion
      - First rib fracture suggests high-energy trauma
    - CT chest if
      - Severe trauma or multiple injuries
      - Suspected underlying lung injury
      - Elderly patients (more likely to have complications)
      - Fractures of first/second ribs or sternum
    - Rib series X-rays NOT routinely recommended (does not change management)
treatment:
  pain_control:
    - Adequate analgesia critical to prevent splinting and pneumonia
    - Multimodal approach
      - NSAIDs - ibuprofen 600-800mg q6-8h or ketorolac 10-30mg IV/IM q6h
      - Acetaminophen 1000mg q6h (scheduled, not PRN)
      - Opioids if needed - oxycodone 5-10mg q4-6h PRN severe pain
      - Tramadol 50-100mg q6h PRN (alternative to stronger opioids)
    - Regional anesthesia for severe pain
      - Intercostal nerve block (injection at fracture site)
      - Thoracic epidural for multiple rib fractures (inpatient)
    - Avoid rib belts or chest wrapping (restricts breathing, increases pneumonia risk)
  pulmonary_hygiene:
    - Incentive spirometry every 1-2 hours while awake (prevents atelectasis)
    - Deep breathing exercises
    - Coughing with pillow splinting (hold pillow against chest)
    - Early mobilization
    - Chest physical therapy if high risk
  activity_modification:
    - Rest from strenuous activity for 4-6 weeks
    - Avoid contact sports until healed (6-8 weeks)
    - Gradual return to activity as pain allows
  disposition:
    - Outpatient management for
      - 1-2 simple rib fractures
      - Adequate pain control on oral medications
      - Good pulmonary function
      - Able to cough and deep breathe
      - Reliable follow-up
    - Admit for
      - >3 rib fractures
      - Inadequate pain control
      - Oxygen requirement
      - Elderly age (>65 years)
      - COPD or other lung disease
      - Pneumothorax or hemothorax
      - Associated injuries
  follow_up:
    - Outpatient follow-up in 1 week
    - Return precautions for worsening shortness of breath, fever, productive cough (pneumonia)
    - Healing time 6-8 weeks
    - Most do not require repeat imaging if improving clinically
clinical_pearls:
  - Adequate pain control is most important treatment - prevents pneumonia
  - Rib fractures increase pneumonia risk 3-4 fold in elderly
  - ">3 rib fractures or age >65 strongly consider admission (high complication rate)"
  - First or second rib fractures indicate high-energy mechanism - assess for vascular injury (aorta, subclavian)
  - Flail chest (≥3 adjacent ribs fractured in ≥2 places) causes paradoxical chest movement - may need mechanical ventilation
  - Lower rib fractures (9-12) may injure spleen or liver - check for abdominal tenderness
  - Sternal fractures suggest significant anterior impact - assess for cardiac contusion (troponin, ECG)
  - Displaced rib fractures rarely need surgery - most heal with conservative care
  - Pathologic fracture from coughing raises concern for osteoporosis or metastatic disease
  - Never wrap or tape ribs (restricts breathing)
  - Intercostal nerve runs along inferior border of each rib - nerve blocks performed just inferior to rib
differentials:
  - Simple rib fracture (1-2 ribs)
  - Multiple rib fractures (≥3)
  - Flail chest
  - Rib fracture with pneumothorax
  - Rib fracture with hemothorax
  - Rib fracture with pulmonary contusion
  - Costochondritis (no trauma, tender at costochondral junction)
  - Muscle strain
trace: |
  42-year-old man fell off ladder from 8 feet, landed on right side. Immediate sharp right lateral chest pain, worse with breathing. Presented to ED 1 hour post-fall. Exam showed point tenderness over right ribs 6-7 in mid-axillary line, no crepitus, no visible deformity, breathing non-labored, oxygen saturation 98% on room air. Lungs clear bilaterally, no decreased breath sounds. No subcutaneous emphysema. Vitals stable. Chest X-ray PA and lateral showed minimally displaced fractures of right ribs 6 and 7, no pneumothorax, no hemothorax, lungs clear. Diagnosed with two simple rib fractures. Pain control initiated: ketorolac 30mg IV in ED provided good relief. Prescribed ibuprofen 800mg q8h and oxycodone 5mg q6h PRN for severe pain. Acetaminophen 1000mg q6h scheduled. Instructed on incentive spirometry every 1-2 hours, deep breathing exercises, coughing with pillow splint. Provided incentive spirometer to take home. Strict return precautions for shortness of breath, fever, worsening pain. Rest from work x 1 week (construction). Outpatient follow-up in 1 week. Patient discharged home. At 1 week follow-up, pain significantly improved, using only ibuprofen, performing IS exercises q2h, no complications. At 4 weeks minimal residual pain, full deep breaths without discomfort. At 6 weeks cleared to return to full work duty. Complete healing, no sequelae.
