tree_id: ORTHO-RIB-FRACTURE
name: Rib Fracture (Suspected/Confirmed)
family: orthopedics
specialty: Emergency Medicine, Trauma Surgery, Primary Care
chief_complaint: Chest wall pain after trauma
description: |
  Rib fracture is break in one or more ribs from blunt trauma.
  Most heal conservatively but require aggressive pain control to prevent respiratory complications.
  Multiple rib fractures can cause flail chest or pneumothorax.
icd10: S22.39XA
snomed: "33737001"
presentations:
  - Sharp chest wall pain worse with breathing, coughing, movement
  - Point tenderness over affected rib(s)
  - History of blunt chest trauma (fall, MVA, assault)
  - Splinting with breathing (shallow breaths)
  - Crepitus if severe displacement
urgency: High
referrals:
  trauma_surgery:
    - Multiple rib fractures (≥3)
    - Flail chest (paradoxical movement)
    - Associated pneumothorax, hemothorax, or pulmonary contusion
    - Elderly patients with multiple fractures
  emergency:
    - Respiratory distress
    - Hemodynamic instability
workup:
  - Mechanism and location of trauma
  - Physical exam - point tenderness, crepitus, respiratory effort, splinting
  - Chest X-ray PA and lateral - may miss fractures (25-50% sensitivity)
  - CT chest if concern for complications or negative X-ray with high clinical suspicion
  - Assess for complications - pneumothorax, hemothorax, pulmonary contusion, cardiac injury
  - Incentive spirometry baseline
treatment:
  pain_management_priority:
    - Adequate analgesia critical to prevent atelectasis and pneumonia
    - NSAIDs - ibuprofen 600mg TID or ketorolac 30mg IM/IV then 10mg PO Q6h
    - Opioids - oxycodone 5-10mg Q4-6h PRN for severe pain
    - Consider rib blocks or intercostal nerve blocks for severe pain
    - Avoid rib belts or wrapping (restricts breathing)
  respiratory_care:
    - Incentive spirometry every 1-2 hours while awake
    - Deep breathing exercises
    - Encourage coughing with pillow splinting
    - Early mobilization
  monitoring:
    - Watch for complications - pneumonia, atelectasis, pneumothorax
    - Pulse oximetry
    - Admission if elderly, multiple fractures, inadequate pain control, or respiratory compromise
  specific_complications:
    pneumothorax:
      - Chest tube placement
    flail_chest:
      - Positive pressure ventilation
      - Possible surgical stabilization
clinical_pearls:
  - X-rays miss 25-50% of rib fractures - clinical diagnosis acceptable
  - Adequate pain control is most important treatment to prevent respiratory complications
  - Incentive spirometry and deep breathing essential to prevent atelectasis/pneumonia
  - Most heal in 6 weeks without intervention
  - Elderly and patients with multiple fractures at high risk for pneumonia
  - Ribs 1-3 and 9-12 fractures more likely to have associated injuries
  - Never tape or wrap ribs (restricts breathing)
differentials:
  - Simple rib fracture
  - Multiple rib fractures
  - Flail chest
  - Costochondritis
  - Rib contusion
  - Pneumothorax
  - Pulmonary contusion
trace:
  - 45-year-old MVA with left lateral chest impact. Severe pain with breathing. X-ray shows fractures of ribs 5-7 without displacement. No pneumothorax. Diagnose multiple rib fractures. Oxycodone 10mg Q4h, ibuprofen 600mg TID. Incentive spirometry Q2h. Pain improves over 2 weeks. Fully healed at 6 weeks.
citations:
  - Eastern Association for the Surgery of Trauma Guidelines
  - UpToDate - Trauma Surgery
