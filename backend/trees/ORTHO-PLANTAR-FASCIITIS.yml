tree_id: ORTHO-PLANTAR-FASCIITIS
name: Plantar Fasciitis
family: Orthopedics
specialty: Orthopedics
icd10:
- M72.2
snomed:
- 202882003
urgency: medium
description: Comprehensive evaluation and management of Plantar Fasciitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Heel pain, especially with first steps in morning
- Pain worse after prolonged standing or activity
- Tenderness at medial calcaneal tuberosity
- Pain improves with rest
- X-ray may show heel spur (not diagnostic)
workup:
- 'Clinical diagnosis: Point tenderness at medial calcaneal tuberosity (origin of
  plantar fascia), pain with passive dorsiflexion of toes'
- 'Windlass test: Passively dorsiflex great toe. Reproduces heel pain = positive (stretches
  plantar fascia)'
- 'X-ray foot (lateral, AP): Rule out stress fracture, calcaneal spur (present in
  50% but not diagnostic)'
- 'MRI or ultrasound: Only if diagnosis unclear - shows thickened plantar fascia (>4mm),
  edema. NOT routinely needed'
treatment:
- 'Guideline-based treatment options for Plantar Fasciitis include:'
- 'Conservative (first-line): Plantar fascia stretching exercises (towel stretch,
  wall calf stretch) x10 reps TID, ice massage, NSAIDs (AAOS 2023)'
- 'Orthotics: Over-the-counter arch supports or custom orthotics (provide cushioning,
  reduce tension on plantar fascia) (AAOS 2023)'
- 'Night splint: Dorsiflexion splint prevents plantar fascia contracture overnight
  - effective but compliance poor (uncomfortable) (AAOS 2023)'
- 'Steroid injection: Methylprednisolone 40mg + 1 mL lidocaine at medial calcaneal
  tuberosity - 70% improve but 50% recur, max 3 injections (risk plantar fascia rupture)
  (AAOS 2023)'
- 'Extracorporeal shockwave therapyor platelet-rich plasma: If failed 6-12 months
  conservative treatment (AAOS 2023)'
clinical_pearls:
- Most common cause of heel pain in adults - degenerative process (not inflammatory
  fasciitis), 10% of population affected
- Pain maximal with first steps in morning (post-static dyskinesia) - improves with
  walking, worsens with prolonged activity
- 'Risk factors: Pes planus (flat feet), limited ankle dorsiflexion, obesity, prolonged
  standing, running'
- 'Heel spur on X-ray: Present in 50% with plantar fasciitis AND 15% without symptoms
  - NOT causative, just association'
- 'Natural history: 80-90% resolve with conservative treatment in 6-12 months (very
  slow resolution)'
referrals:
- Podiatry or orthopedic foot/ankle if failed 6-12 months conservative treatment (stretching,
  orthotics, NSAIDs)
- Most cases resolve with stretching exercises and orthotics - surgery (plantar fascia
  release) rarely needed (<5%)
differentials:
  - Stress fracture
  - Tarsal tunnel syndrome
  - Fat pad syndrome
  - Heel spur
  - Achilles tendinitis
