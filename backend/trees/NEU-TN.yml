presentations:
  - sudden severe unilateral facial pain
  - electric shock-like sensations
  - triggered by touch, chewing, or talking
  - Intense stabbing pain lasting seconds to 2 minutes
  - Affects V2 (maxillary) or V3 (mandibular) divisions most commonly
  - 'Trigger zones: Light touch to face, wind, brushing teeth'
  - Unilateral facial spasm may accompany pain
differentials:
  - Dental pain
  - TMJ disorder
  - Atypical facial pain
  - Multiple sclerosis
  - Cluster headache
workup:
  - 'MRI brain with FIESTA or CISS sequence: Visualize neurovascular compression, rule out MS, tumor'
  - 'Clinical diagnosis: Typical triggers, brief electric shock pain, normal neuro exam'
  - 'Carbamazepine level: Therapeutic 4-12 mcg/mL'
  - 'CBC, CMP: Baseline and periodic monitoring on carbamazepine (hyponatremia, bone marrow suppression)'
treatment:
  - 'Guideline-based treatment options for Trigeminal neuralgia include:'
  - 'First-line: Carbamazepine 200mg BID, titrate to 400-800mg BID (check levels, aim 4-12 mcg/mL) (AAN 2024)'
  - 'Alternative: Oxcarbazepine 300mg BID (fewer side effects than carbamazepine), gabapentin, pregabalin (AAN 2024)'
  - 'Monitor: CBC, CMP (carbamazepine can cause hyponatremia, bone marrow suppression) (AAN 2024)'
  - 'Baclofen: Add-on if inadequate response to carbamazepine (10mg TID, titrate to 60-80mg/day) (AAN 2024)'
  - 'Surgical: Microvascular decompressionif refractory to meds - 70-80% long-term pain-free (AAN 2024)'
clinical_pearls:
  - 'Classic (idiopathic) TN: Vascular compression of trigeminal nerve root (90%)'
  - 'Secondary TN: MS (2-5% of MS patients), tumor, vascular malformation - younger age, bilateral'
  - 'Carbamazepine 200mg BID: First-line treatment, 70-80% response rate'
  - 'MRI brain with FIESTA sequence: Rule out MS plaques, tumor, vascular compression'
  - 'Surgical options if refractory: Microvascular decompression (70-80% long-term cure)'
red_flags: []
disposition_guidance: {}
referrals:
  - 'Neurology for: Atypical features (age <40, bilateral, sensory loss), refractory to first-line therapy'
  - 'Neurosurgery if: Failed medical management, consider microvascular decompression'
