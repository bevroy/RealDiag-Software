tree_id: GI-DIVERTICULOSIS
name: Diverticulosis
family: gastroenterology
specialty: Gastroenterology
icd10: K57.30
snomed: 39722000
urgency: []
homeopathy: []
presentations:
  - Asymptomatic (most patients - 70-80%)
  - Incidental finding on colonoscopy or CT scan
  - Vague abdominal discomfort or bloating
  - Irregular bowel habits (constipation more common)
  - Painless rectal bleeding (diverticular bleeding)
  - Bright red or maroon blood per rectum
  - Increased prevalence with age (>60% of patients >80 years)
  - Risk factors: age, low-fiber diet, obesity, smoking
workup:
  - Often incidental finding on imaging or colonoscopy
  - Colonoscopy - visualizes diverticula, rules out other pathology
  - CT abdomen/pelvis - shows diverticula, no inflammation or complications
  - Diverticula appear as outpouchings of colonic wall
  - Most commonly in sigmoid colon in Western populations
  - No laboratory tests needed unless complications suspected
  - If acute bleeding, consider colonoscopy vs CT angiography vs tagged RBC scan
treatment:
  - Asymptomatic diverticulosis - no specific treatment required
  - High-fiber diet (25-30 g/day) recommended to prevent complications
  - Fiber supplementation (psyllium, methylcellulose) if dietary fiber inadequate
  - Adequate hydration (6-8 glasses water daily)
  - Regular physical activity
  - Avoid smoking cessation counseling
  - No need to avoid nuts, seeds, or popcorn (previous myth debunked)
  - Diverticular bleeding management (separate from diverticulitis)
  - Most bleeding stops spontaneously (70-80%)
  - Resuscitation with IV fluids and blood products if needed
  - Colonoscopy for diagnosis and potential hemostasis if bleeding persists
  - Consider interventional radiology or surgery if refractory bleeding
  - Symptomatic uncomplicated diverticular disease (SUDD)
  - Fiber supplementation and antispasmodics (dicyclomine, hyoscyamine)
  - Rifaximin 400 mg BID may reduce symptoms in some patients
  - Probiotics have limited evidence but may be beneficial
clinical_pearls:
  - "Diverticulosis prevalence increases with age - 30% by age 60, >60% by age 80"
  - "Most patients remain asymptomatic throughout life - only 10-25% develop complications"
  - "Complications: diverticulitis (10-25%), diverticular bleeding (5-15%)"
  - "High-fiber diet prevents complications - recommended for all patients"
  - "No evidence that nuts, seeds, or popcorn increase risk of diverticulitis"
  - "Left-sided diverticula (sigmoid) more common in West, right-sided more common in Asia"
  - "Diverticular bleeding is most common cause of lower GI bleeding in elderly"
  - "Bleeding usually self-limited but rebleeding rate 20-40%"
referrals:
  - Gastroenterology for colonoscopy if new diagnosis or bleeding
  - General Surgery if recurrent diverticular bleeding requiring intervention
  - Emergency evaluation if signs of acute diverticulitis (fever, LLQ pain, leukocytosis)
differentials:
  - Uncomplicated diverticulosis (asymptomatic or mild symptoms)
  - Symptomatic uncomplicated diverticular disease (SUDD) - chronic symptoms without inflammation
  - Acute diverticulitis (fever, LLQ pain, elevated WBC, CT findings)
  - Colorectal cancer (weight loss, change in bowel habits, anemia)
  - Irritable bowel syndrome (functional disorder, normal imaging)
  - Inflammatory bowel disease (Crohn's, ulcerative colitis)
  - Ischemic colitis (acute onset, thumbprinting on imaging)
  - Segmental colitis associated with diverticulosis (SCAD)
trace:
  source: AGA Clinical Practice Guidelines on Diverticular Disease 2015, World Gastroenterology Guidelines 2020
  version: '1.0'
  last_updated: '2025-12-26'
