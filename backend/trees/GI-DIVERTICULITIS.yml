tree_id: GI-DIVERTICULITIS
name: Diverticulitis
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Left lower quadrant abdominal pain
description: |
  Inflammation or infection of colonic diverticula (outpouchings). Most common in sigmoid colon.
  Diverticulosis (presence of diverticula) affects 50% of people over 60. Diverticulitis develops in 4-15% with diverticulosis.
icd10: K57.92
urgency: Moderate
workup:
  - Clinical diagnosis with left lower quadrant tenderness, fever, leukocytosis
  - CT abdomen/pelvis with IV contrast (gold standard, 98% sensitivity) shows colonic wall thickening, fat stranding, abscess
  - Complete blood count (leukocytosis), basic metabolic panel, urinalysis (rule out UTI)
  - Classify severity - uncomplicated (no abscess, perforation, or obstruction) vs complicated (abscess, perforation, fistula, obstruction)
  - Hinchey classification for complicated disease (stage I microperforation, II pelvic abscess, III purulent peritonitis, IV fecal peritonitis)
  - Avoid colonoscopy during acute episode (risk of perforation)
  - Follow-up colonoscopy 6-8 weeks after resolution to rule out malignancy
treatment:
  - Uncomplicated mild diverticulitis outpatient - liquid diet, oral antibiotics not routinely needed per recent guidelines
  - Antibiotics if immunocompromised, severe symptoms, or comorbidities - ciprofloxacin 500mg BID plus metronidazole 500mg TID x 7-10 days
  - Alternative regimen - amoxicillin-clavulanate 875mg BID or moxifloxacin 400mg daily
  - Complicated or severe diverticulitis - hospital admission, NPO, IV fluids, IV antibiotics
  - IV antibiotics - ceftriaxone 1g daily plus metronidazole 500mg IV q8h, or piperacillin-tazobactam 3.375g IV q6h
  - Abscess less than 4cm managed with antibiotics, abscess greater than 4cm requires percutaneous drainage
  - Surgery indicated for perforation with peritonitis, obstruction, fistula, or recurrent episodes (elective sigmoid colectomy)
  - High-fiber diet after resolution to prevent recurrence
clinical_pearls:
  - Left-sided appendicitis (similar presentation but left-sided)
  - Right-sided diverticulitis more common in Asian populations
  - Avoid nuts and seeds myth debunked (no evidence they increase risk)
  - Most episodes (85%) are uncomplicated and resolve with conservative management
  - Recurrence rate 20-30% after first episode, higher after complicated episode
  - Elective surgery considered after 2 uncomplicated episodes or 1 complicated episode
differentials:
  - Colorectal cancer
  - Inflammatory bowel disease
  - Ischemic colitis
  - Appendicitis
  - Urinary tract infection
  - Ovarian pathology (cyst, torsion)
trace:
  - Left lower quadrant pain and fever x 2 days → Tender LLQ on exam, fever 100.8F → CT abdomen shows sigmoid colonic wall thickening, fat stranding, no abscess → Diagnose uncomplicated diverticulitis → Liquid diet, ciprofloxacin 500mg BID plus metronidazole 500mg TID x 7 days → Pain improving day 3 → Advance to low-residue diet → Complete antibiotics → High-fiber diet after resolution → Colonoscopy in 6 weeks (normal)
