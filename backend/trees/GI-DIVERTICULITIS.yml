tree_id: GI-DIVERTICULITIS
name: Acute Diverticulitis
family: Gastrointestinal
specialty: Gastroenterology
chief_complaint: Left lower quadrant abdominal pain
description: Inflammation or infection of colonic diverticula (outpouchings of colonic mucosa through muscle layer), most commonly in sigmoid colon

icd10: K57.92

urgency: urgent

workup:
  - Clinical presentation: acute onset left lower quadrant pain (most common), fever, nausea, change in bowel habits (constipation or diarrhea), anorexia
  - Exam: left lower quadrant tenderness, guarding, rebound tenderness if peritonitis, palpable mass if abscess or phlegmon, fever, tachycardia
  - Laboratory: CBC (leukocytosis with left shift), CRP elevated (marker of inflammation), urinalysis (may have pyuria from bladder irritation, exclude UTI)
  - CT abdomen/pelvis with IV contrast: diagnostic test of choice, shows colonic wall thickening (greater than 4 mm), pericolic fat stranding, diverticula, complications (abscess, perforation, fistula), sensitivity/specificity greater than 95 percent
  - Hinchey classification for severity: Stage 0 (mild uncomplicated), Stage I (pericolic abscess or phlegmon), Stage II (pelvic/distant abscess), Stage III (purulent peritonitis from perforation), Stage IV (fecal peritonitis)
  - Complications: abscess (10-20 percent), perforation (1-2 percent causing peritonitis), fistula (colovesical most common - pneumaturia, fecaluria), obstruction (stricture from chronic inflammation), bleeding (rare in acute diverticulitis, more common with diverticulosis)
  - Colonoscopy contraindicated in acute phase (risk perforation) - defer 6-8 weeks after resolution to exclude colorectal cancer

treatment:
  - Mild uncomplicated diverticulitis (Hinchey 0): outpatient management if tolerating oral intake, no significant comorbidities, reliable patient with follow-up
  - Outpatient antibiotics: amoxicillin-clavulanate 875/125 mg BID x 7-10 days, or ciprofloxacin 500 mg BID plus metronidazole 500 mg TID x 7-10 days (covers gram-negatives and anaerobes), recent evidence suggests selective cases may not require antibiotics if mild
  - Clear liquid diet initially, advance as tolerated
  - Oral analgesics: acetaminophen preferred (avoid NSAIDs and opioids if possible)
  - Follow-up in 2-3 days to ensure improving
  - Moderate-severe or complicated diverticulitis: hospitalize if severe pain, unable to tolerate oral intake, immunosuppressed, significant comorbidities, complications on imaging
  - Inpatient management: NPO or clear liquids, IV fluids, IV antibiotics (ceftriaxone 1-2 grams daily or ciprofloxacin 400 mg every 12 hours plus metronidazole 500 mg every 8 hours, or piperacillin-tazobactam 3.375 grams every 6 hours), analgesics
  - Abscess less than 3 cm: antibiotics alone usually sufficient
  - Abscess 3 cm or more: percutaneous drainage plus antibiotics (CT-guided), drain output typically decreases over days, remove when output minimal
  - Surgery indications: perforation with peritonitis (Hinchey III-IV), clinical deterioration despite medical therapy, inability to exclude cancer, recurrent episodes (elective)
  - Emergency surgery: Hinchey III (purulent peritonitis) or IV (fecal peritonitis) - sigmoid colectomy with primary anastomosis if feasible, or Hartmann procedure (sigmoid colectomy with end colostomy, rectal stump closure) if unstable
  - Elective surgery (after resolution): consider after 2 or more episodes of uncomplicated diverticulitis or 1 episode complicated, sigmoid colectomy laparoscopic approach, schedule 6-8 weeks after acute episode
  - Prevention recurrence after first episode: high-fiber diet (25-30 grams daily), adequate hydration, regular exercise, maintain healthy weight, no evidence that avoiding nuts/seeds/popcorn prevents recurrence

clinical_pearls:
  - Left lower quadrant pain and fever classic presentation (left-sided appendicitis)
  - CT abdomen/pelvis diagnostic test of choice (sensitivity/specificity greater than 95 percent)
  - Mild uncomplicated can treat outpatient with oral antibiotics x 7-10 days
  - Abscess 3 cm or more requires percutaneous drainage plus antibiotics
  - Colonoscopy contraindicated acutely (defer 6-8 weeks to exclude cancer)
  - Elective surgery consider after 2 or more episodes or 1 complicated episode
  - High-fiber diet after resolution may reduce recurrence

differentials:
  - Appendicitis (right lower quadrant pain, McBurney point tenderness, but can have pelvic appendix with left-sided pain)
  - Colitis (inflammatory bowel disease, infectious, ischemic) - diarrhea more prominent, diffuse colonic inflammation on CT
  - Colorectal cancer (chronic symptoms, weight loss, anemia, mass on CT, older age)
  - Ovarian pathology (women) - ovarian cyst, torsion, PID - pelvic ultrasound helpful
  - Urinary tract infection or nephrolithiasis (dysuria, hematuria, CVA tenderness, urinalysis positive)

trace:
  - 58-year-old woman presents to ED with 2 days left lower quadrant abdominal pain, progressive, constant, fever to 100.8 F, nausea, no vomiting, constipation x 2 days, no urinary symptoms
  - No prior episodes, no known history of diverticulosis
  - Exam: temp 100.6 F, HR 92, BP 132/78, left lower quadrant tenderness with guarding, no rebound, no rigidity, bowel sounds present, no masses palpable
  - Labs: WBC 14.2K with 82 percent neutrophils (left shift), CRP 8.5 mg/dL (elevated), urinalysis 5-10 WBC (likely bladder irritation from adjacent inflammation), negative nitrites/bacteria
  - CT abdomen/pelvis with IV contrast: sigmoid colon wall thickening 8 mm, extensive pericolic fat stranding, multiple diverticula throughout colon, 2.5 cm pericolic fluid collection consistent with small abscess or phlegmon (Hinchey Stage I)
  - Diagnosis: acute diverticulitis, moderate severity, Hinchey Stage I (pericolic abscess/phlegmon less than 3 cm)
  - Decision to hospitalize given fever, significant pain, and abscess on imaging
  - Started NPO, IV fluids lactated Ringer 125 mL/hr, IV ciprofloxacin 400 mg every 12 hours plus metronidazole 500 mg every 8 hours, IV acetaminophen 1 gram every 6 hours PRN pain
  - Day 2: fever resolved, pain improved, tolerating clear liquids, transitioned to oral ciprofloxacin 500 mg BID plus metronidazole 500 mg TID
  - Day 3: significant improvement, advancing diet to low-residue, pain mild, afebrile x 36 hours, discharged home to complete 10-day antibiotic course
  - Outpatient follow-up 1 week: symptoms resolved, tolerating regular diet, completed antibiotics
  - Colonoscopy scheduled 8 weeks after episode: pandiverticulosis (diverticula throughout colon, most prominent sigmoid), no masses/polyps/cancer, confirms diagnosis diverticular disease
  - Counseling: increase dietary fiber (25-30 grams daily), adequate hydration, regular exercise, high recurrence risk (20-30 percent), elective surgery consideration if recurrent episodes
  - 1 year: no recurrent episodes, continues high-fiber diet, asymptomatic
