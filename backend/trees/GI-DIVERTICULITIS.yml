tree_id: GI-DIVERTICULITIS
name: Diverticulitis
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Left lower quadrant abdominal pain and fever
description: |
  Inflammation or infection of colonic diverticula (outpouchings in colon wall). Diverticulosis (presence of diverticula) affects 50% over age 60, but only 10-25% develop diverticulitis.
  Most common in sigmoid colon. Complications include abscess, perforation, fistula (colovesical most common), stricture. Recurrence rate 20-30% after first episode.
icd10: K57.92
urgency: High
workup:
  - Clinical presentation - left lower quadrant (LLQ) pain (93%), fever, nausea, change in bowel habits (diarrhea or constipation)
  - Right-sided diverticulitis less common (5-10%), more common in Asians
  - Physical exam - LLQ tenderness, guarding, rebound if peritonitis, palpable mass if abscess or phlegmon
  - Labs - leukocytosis with left shift, elevated CRP
  - CT abdomen/pelvis with IV contrast - gold standard (98% sensitivity and specificity)
  - Findings - bowel wall thickening (greater than 4 mm), pericolic fat stranding, diverticula
  - Complications - abscess (localized fluid collection), perforation (free air, extraluminal contrast), fistula
  - Hinchey classification based on CT
  - Stage 0 - uncomplicated diverticulitis
  - Stage Ia - confined pericolic abscess
  - Stage Ib - distant abscess (pelvic, retroperitoneal)
  - Stage II - pelvic abscess
  - Stage III - purulent peritonitis (ruptured abscess)
  - Stage IV - fecal peritonitis (free perforation)
  - Ultrasound alternative if CT contraindicated (pregnancy) - less sensitive
  - Colonoscopy contraindicated in acute phase (risk of perforation) - perform 6-8 weeks after resolution to rule out malignancy, IBD
  - Urinalysis if colovesical fistula suspected - pneumaturia, fecaluria, recurrent UTIs
treatment:
  - Uncomplicated diverticulitis (Hinchey 0) - outpatient management if mild, tolerating oral intake, reliable
  - Clear liquid diet initially, advance as tolerated
  - Oral antibiotics x 7-10 days covering anaerobes and Gram-negatives
  - Metronidazole 500mg TID plus ciprofloxacin 500mg BID or levofloxacin 750mg daily
  - Amoxicillin-clavulanate 875/125mg BID
  - Recent data suggests antibiotics may not be necessary for uncomplicated diverticulitis in immunocompetent patients
  - Complicated diverticulitis (abscess, perforation, obstruction) - hospital admission
  - NPO, IV fluids, bowel rest
  - IV antibiotics - piperacillin-tazobactam 3.375g q6h, ampicillin-sulbactam 3g q6h, or ciprofloxacin plus metronidazole
  - Abscess greater than 3-4 cm - CT-guided percutaneous drainage plus antibiotics
  - Small abscesses (less than 3 cm) - antibiotics alone may suffice
  - Hinchey III-IV (purulent or fecal peritonitis) - emergency surgery
  - Hartmann procedure (sigmoid resection with end colostomy, rectal stump) traditional
  - Primary resection with anastomosis with or without diverting ileostomy in selected patients
  - Laparoscopic peritoneal lavage alternative for Hinchey III in select cases
  - Elective sigmoid colectomy indications
  - Two or more episodes of uncomplicated diverticulitis (controversial, individualized)
  - Complicated episode (abscess requiring drainage, fistula, stricture, obstruction)
  - Immunocompromised patients
  - Inability to exclude malignancy
  - Chronic symptoms
  - Prevention of recurrence - high-fiber diet (25-30g daily), adequate hydration, regular exercise, avoid smoking
  - Nuts, seeds, popcorn do NOT increase diverticulitis risk (myth)
  - Rifaximin 400mg BID x 7 days per month may reduce recurrence in some studies
clinical_pearls:
  - Beer and red meat increase risk, physical activity and fiber decrease risk
  - Right-sided (cecal) diverticulitis mimics appendicitis
  - Colovesical fistula classic triad - pneumaturia, fecaluria, recurrent UTIs
  - CT findings can take 3-6 weeks to resolve after successful treatment
  - Colonoscopy mandatory 6-8 weeks after acute episode to exclude colon cancer (up to 10% have underlying malignancy)
  - Younger patients (less than 50) and immunocompromised have more aggressive disease
  - Recurrence risk highest within first year after initial episode
differentials:
  - Appendicitis (right-sided diverticulitis)
  - Colorectal cancer
  - Inflammatory bowel disease (Crohn's, UC)
  - Ischemic colitis
  - Infectious colitis
  - Ovarian pathology (cyst, torsion)
trace:
  - 62-year-old man with 3 days of worsening LLQ pain, fever, and constipation → No prior episodes → Exam shows LLQ tenderness, guarding, fever 38.3°C → Labs - WBC 14,500, CRP 85 mg/L → CT abdomen/pelvis with contrast shows sigmoid colon wall thickening 8 mm, pericolic fat stranding, multiple diverticula, 2 cm pericolic abscess (Hinchey Ia) → Admit to hospital → NPO, IV fluids → IV ciprofloxacin 400mg q12h and metronidazole 500mg q8h → Abscess small, manage with antibiotics alone (no drainage) → Tolerating liquids by day 3, advance diet → Transition to oral antibiotics day 4, discharge home day 5 → Complete 10-day antibiotic course → Colonoscopy at 8 weeks shows extensive diverticulosis, no malignancy → High-fiber diet, increased water intake → No recurrence at 2-year follow-up
