presentations:
  - Left lower quadrant (LLQ) abdominal pain
  - LLQ abdominal pain or left-sided abdominal pain
  - Fever, chills (signs of infection/inflammation)
  - Fever
  - Change in bowel habits (constipation or diarrhea)
  - Nausea, vomiting, anorexia
  - Tenderness and guarding in LLQ
  - Leukocytosis (elevated WBC count)
  - 'CT findings: Colonic wall thickening, pericolic fat stranding, inflamed diverticula'
  - Diverticulosis common (50% by age 60); 10-25% develop diverticulitis
  - May have urinary symptoms (frequency, urgency) from bladder irritation
  - Occult blood in stool possible (avoid colonoscopy during acute episode)
  - 'Hinchey classification: I (phlegmon), II (abscess), III (purulent), IV (fecal peritonitis)'
  - Risk factors - low fiber diet, obesity, lack of exercise, NSAIDs
differentials:
  - Appendicitis
  - IBD
  - Colorectal cancer
  - Ischemic colitis
  - Ovarian pathology
workup:
  - CT abdomen/pelvis with IV contrast (bowel wall thickening, pericolic fat stranding, abscess)
  - CBC (leukocytosis), CRP elevated
  - Urinalysis (rule out UTI, may have mild pyuria from adjacent inflammation)
  - Colonoscopy 6-8 weeks after resolution (rule out colon cancer if >50 years or not up-to-date)
treatment:
  - 'Guideline-based treatment options for Acute Diverticulitis include:'
  - 'Uncomplicated (outpatient): Ciprofloxacin 500mg BID + metronidazole 500mg TID x 7-10 days, clear liquids (ACG 2023)'
  - 'Complicated (admission): NPO or clear liquids, IV antibiotics (ACG 2023)'
  - 'Abscess >3cm: Percutaneous drainage + antibiotics (ACG 2023)'
  - 'Surgery (sigmoid resection) if: Perforation, obstruction, refractory symptoms, or recurrent episodes (ACG 2023)'
  - Elective surgery after 2nd episode (or 1st in immunocompromised) (ACG 2023)
clinical_pearls:
  - Diverticulosis common (50% by age 60), most asymptomatic; 10-25% develop diverticulitis
  - 'Hinchey classification: I (phlegmon), II (abscess), III (purulent peritonitis), IV (fecal peritonitis)'
  - CT abdomen/pelvis is diagnostic test of choice (sensitivity 98%)
  - 'Uncomplicated: Outpatient antibiotics + clear liquids; complicated: Admission + IV antibiotics'
  - Avoid colonoscopy during acute episode (risk perforation) - wait 6-8 weeks
  - High-fiber diet after resolution may reduce recurrence
red_flags: []
disposition_guidance: {}
referrals:
  - 'Surgery if: Complicated diverticulitis (perforation, obstruction), abscess needs drainage, recurrent episodes'
  - Gastroenterology for colonoscopy 6-8 weeks post-resolution
  - Interventional radiology if abscess >3cm needs drainage
