tree_id: ORTHO-ROTATOR-CUFF-TENDINOPATHY
name: Rotator Cuff Tendinopathy
family: Orthopedics
specialty: Orthopedics
chief_complaint: Shoulder pain worse with overhead activities
description: Degenerative or inflammatory condition of rotator cuff tendons causing shoulder pain and weakness with overhead activities. Conservative management with physical therapy effective in 70-90% of cases.
icd10: M75.10
snomed: 428971000124102
presentations:
  - Shoulder pain (anterolateral)
  - Pain with overhead activities
  - Night pain
  - Weakness with abduction, external rotation
  - Painful arc (60-120 degrees)
  - Positive impingement signs
urgency: non-urgent

workup:
  - Clinical diagnosis: shoulder pain worse with overhead activities, difficulty reaching behind back, pain at night lying on affected shoulder
  - Painful arc: pain between 60-120 degrees of abduction (subacromial impingement)
  - Special tests: Neer test (forced forward flexion), Hawkins-Kennedy test (internal rotation with arm flexed 90 degrees), painful arc test, empty can test (supraspinatus)
  - Weakness: resisted external rotation (infraspinatus, teres minor), resisted internal rotation (subscapularis), resisted abduction (supraspinatus)
  - Atrophy: supraspinatus or infraspinatus fossa atrophy suggests chronic full-thickness tear
  - Risk factors: age above 40, repetitive overhead activities, sports (swimming, tennis, baseball), manual labor
  - X-ray shoulder: AP and lateral views to rule out fracture, dislocation, arthritis, os acromiale
  - MRI shoulder: gold standard for rotator cuff tear (full-thickness vs partial-thickness), tendinopathy, labral pathology
  - Order MRI if: no improvement with 6 weeks conservative treatment, significant weakness, suspected full-thickness tear, considering surgery
  - Ultrasound: dynamic imaging, operator-dependent, can visualize rotator cuff tears and tendinopathy

treatment:
  - Conservative management (first-line): effective in 70-90% of partial tears and tendinopathy
  - Rest and activity modification: avoid overhead activities and heavy lifting temporarily (2-4 weeks), gradual return to activities
  - NSAIDs: ibuprofen 400-600 mg TID or naproxen 500 mg BID x2-4 weeks for pain and inflammation
  - Physical therapy (most important): strengthening rotator cuff and scapular stabilizers, stretching exercises, posture correction
  - Therapy 6-12 weeks typically needed for significant improvement
  - Exercises: external rotation strengthening, scapular retraction, pendulum exercises, stretching tight posterior capsule
  - Subacromial corticosteroid injection: if failed NSAIDs and therapy after 6 weeks, triamcinolone 40 mg or methylprednisolone 40 mg with lidocaine
  - Provides temporary relief, allows participation in physical therapy
  - Maximum 3 injections per year (tendon weakening with repeated injections)
  - Surgery (arthroscopic): if failed conservative treatment after 3-6 months
  - Subacromial decompression: remove bone spur and inflamed bursa (controversial efficacy)
  - Rotator cuff repair: if full-thickness tear with significant symptoms (success rate 80-90% for small-medium tears)
  - Natural history: partial tears and tendinopathy often improve with conservative treatment, full-thickness tears do not heal without surgery

clinical_pearls:
  - Shoulder pain worse with overhead activities and lying on affected side at night
  - Painful arc 60-120 degrees abduction suggests subacromial impingement
  - Physical therapy rotator cuff strengthening most important treatment
  - 70-90% improve with conservative management (NSAIDs, PT, injections)
  - MRI if no improvement after 6 weeks conservative treatment
  - Subacromial injection provides temporary relief, facilitates PT
  - Full-thickness tears do not heal without surgery
  - Atrophy of supraspinatus or infraspinatus fossa suggests chronic tear

differentials:
  - Adhesive capsulitis (frozen shoulder): global loss of active and passive range of motion, severe stiffness
  - Glenohumeral arthritis: chronic pain, crepitus, loss of motion, X-ray shows joint space narrowing
  - Acromioclavicular joint arthritis: pain localized to AC joint, tenderness over AC joint, positive cross-body adduction test
  - Cervical radiculopathy: neck pain radiating to shoulder and arm, dermatomal pattern, decreased reflexes

trace: |
  A 55-year-old man who works as construction worker presented with 4 months of right shoulder pain (dominant arm). Pain worse with overhead activities (reaching high shelves), difficulty reaching behind back to tuck in shirt, awakens at night when rolling onto right shoulder. No acute injury. Exam showed painful arc 70-110 degrees abduction, positive Neer and Hawkins-Kennedy tests, mild weakness with resisted external rotation compared to left, full passive range of motion, no atrophy. X-ray showed no fracture or significant arthritis. Diagnosed with rotator cuff tendinopathy. Started ibuprofen 600 mg TID with meals x3 weeks. Referred to physical therapy for rotator cuff strengthening program. Activity modification: avoid heavy lifting and overhead work temporarily. At 3 weeks pain improved 30%, continuing PT. At 6 weeks pain improved 50% but still limiting work activities. Given subacromial corticosteroid injection (triamcinolone 40 mg with lidocaine) - immediate pain relief. Continued aggressive PT. At 10 weeks pain improved 80%, returning to full work duties with modifications. At 4 months 90% improved, minimal pain only with prolonged overhead activities. No surgery needed. Continues home exercise program for rotator cuff and scapular strengthening to prevent recurrence.
