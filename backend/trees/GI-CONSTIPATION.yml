urgency: non-urgent
description: Comprehensive evaluation and treatment of acute and chronic constipation

homeopathy:
  - remedy: Nux vomica 30C
    indications: Frequent ineffectual urging, feels incomplete evacuation, worse after rich food/alcohol, irritable
  - remedy: Bryonia 30C
    indications: Large, hard, dry stools, no urge to stool, worse movement, great thirst
  - remedy: Alumina 30C
    indications: No urge even with full rectum, straining, stools like clay, elderly patients
  - remedy: Lycopodium 30C
    indications: Constipation alternating with diarrhea, bloating, worse 4-8 PM, incomplete evacuation
  - remedy: Opium 30C
    indications: Complete inactivity of intestines, hard round balls, no urge, after surgery or opioids

presentations:
  - Infrequent bowel movements (<3 per week)
  - Hard or lumpy stools
  - Straining with defecation
  - Sensation of incomplete evacuation
  - Feeling of anorectal obstruction
  - Need for manual maneuvers to evacuate
  - Constipation alternating with diarrhea

differentials:
  - IBS-C
  - Medication effect
  - Hypothyroidism
  - Bowel obstruction
  - Colorectal cancer

workup:
  - "RED FLAGS requiring further evaluation: new onset constipation age >50, unintentional weight loss, rectal bleeding, iron deficiency anemia, family history colon cancer, positive fecal occult blood, abdominal mass, severe pain, acute constipation with vomiting (bowel obstruction)"
  - "History: stool frequency, consistency (Bristol Stool Chart), onset (acute vs chronic), straining, incomplete evacuation, manual maneuvers needed, diet (fiber/fluid intake), medications (opioids, anticholinergics, calcium, iron), medical history (hypothyroidism, diabetes, neurologic disorders), alarm symptoms"
  - "Rome IV criteria for functional constipation: ≥2 of following in ≥25% of defecations - straining, lumpy/hard stools, incomplete evacuation, anorectal obstruction, manual maneuvers, <3 bowel movements/week, for ≥3 months"
  - "Physical exam: abdominal exam (distension, masses, tenderness), rectal exam (hemorrhoids, fissures, masses, stool in vault, sphincter tone)"
  - "Labs if chronic or red flags: TSH (hypothyroidism), glucose/HbA1c (diabetes), calcium (hypercalcemia), CBC (anemia)"
  - "Colonoscopy if: age ≥50 and due for screening, red flags present (bleeding, weight loss, anemia, family history), new onset constipation age >50"
  - "Additional testing if refractory: anorectal manometry (evaluate pelvic floor dysfunction), colonic transit study, defecography"

treatment:
  - "Lifestyle first-line: increase dietary fiber gradually to 25-30 g/day (fruits, vegetables, whole grains, legumes), adequate fluid intake (6-8 glasses water daily), regular exercise, establish routine toilet time (preferably after meals when gastrocolic reflex active)"
  - "Fiber supplementation: psyllium (Metamucil) 1 tablespoon BID, methylcellulose (Citrucel) 1 tablespoon BID, start low and increase gradually to minimize bloating, need adequate water intake"
  - "Osmotic laxatives (safe for long-term use): polyethylene glycol 3350 (Miralax) 17 g daily, lactulose 15-30 mL daily-BID, magnesium hydroxide (Milk of Magnesia) 30-60 mL daily"
  - "Stimulant laxatives (use intermittently, not daily): senna 17.2 mg 1-2 tablets at bedtime, bisacodyl 5-10 mg daily, avoid long-term daily use"
  - "Stool softeners: docusate 100-300 mg daily (minimal evidence of efficacy but safe), helpful post-surgery or with hemorrhoids/fissures"
  - "Rescue therapy for fecal impaction: manual disimpaction, enemas (Fleet enema, tap water enema), glycerin suppositories"
  - "Chronic constipation refractory to above: linaclotide (Linzess) 145-290 mcg daily, lubiprostone (Amitiza) 24 mcg BID, prucalopride (Motegrity) 2 mg daily"
  - "Opioid-induced constipation: aggressive bowel regimen (osmotic laxative + stimulant), peripheral opioid antagonists (methylnaltrexone, naloxegol) if refractory"
  - "Address underlying causes: optimize thyroid if hypothyroid, manage diabetes, review medications (discontinue or adjust anticholinergics, calcium, iron if possible)"

clinical_pearls:
  - "Normal bowel frequency ranges from 3 times/day to 3 times/week - 'constipation' is subjective and varies by patient"
  - "Fiber supplementation needs 2-4 weeks to see effect - counsel patient on gradual increase to minimize gas/bloating"
  - "Stimulant laxatives (senna, bisacodyl) don't cause 'lazy bowel' despite old myth, but best used intermittently rather than daily"
  - "Patients on chronic opioids need prophylactic bowel regimen - start at same time as opioid, not after constipation develops"
  - "New constipation in patient >50 = colon cancer until proven otherwise - needs colonoscopy"
  - "Bristol Stool Chart: Type 1-2 = constipated, Type 3-4 = normal, Type 5-7 = diarrhea"
  - "Fecal impaction presentation: 'paradoxical diarrhea' - liquid stool leaking around impaction, elderly patient suddenly incontinent"
  - "Hypothyroidism is overdiagnosed as cause of constipation - only significant if TSH very elevated"

referrals:
  - Gastroenterology for: refractory constipation despite optimal medical therapy, concern for slow transit or pelvic floor dysfunction, need for colonoscopy (if age ≥50 or red flags), consideration for prescription medications (linaclotide, prucalopride)
  - Colorectal surgery for: fecal impaction requiring endoscopic disimpaction, surgical causes (stricture, obstruction), consideration for colectomy in severe refractory slow transit constipation
  - Pelvic floor physical therapy for: dyssynergic defecation (pelvic floor dysfunction), need for biofeedback training

citations:
  - "American Gastroenterological Association Medical Position Statement on Constipation. Gastroenterology. 2013."
  - "Ford AC, Moayyedi P, Lacy BE, et al. American College of Gastroenterology monograph on the management of irritable bowel syndrome and chronic idiopathic constipation. Am J Gastroenterol. 2014;109 Suppl 1:S2-26."
  - "Bharucha AE, Lacy BE. Mechanisms, Evaluation, and Management of Chronic Constipation. Gastroenterology. 2020;158(5):1232-1249."
