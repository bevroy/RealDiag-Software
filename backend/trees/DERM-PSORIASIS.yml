tree_id: DERM-PSORIASIS
name: Plaque Psoriasis
family: Dermatologic
specialty: Dermatology
chief_complaint: Scaly skin rash
description: Chronic immune-mediated inflammatory skin disease characterized by well-demarcated erythematous plaques with silvery scale

icd10: L40.0

urgency: routine

workup:
  - Clinical diagnosis: well-demarcated erythematous plaques with silvery scale, extensor surfaces (elbows, knees) common, scalp involvement frequent, Auspitz sign (pinpoint bleeding when scale removed), Koebner phenomenon (lesions at sites of trauma)
  - Distribution: symmetric, extensor surfaces > flexor, scalp, sacrum, nails (pitting, onycholysis, oil spots)
  - Guttate psoriasis: small droplet-like lesions, often triggered by streptococcal pharyngitis (children/young adults)
  - Skin biopsy if uncertain: parakeratosis, acanthosis, neutrophils in stratum corneum (Munro microabscesses)
  - Assess severity: BSA (body surface area) affected, PASI (Psoriasis Area and Severity Index) - mild <3% BSA, moderate 3-10% BSA, severe >10% BSA or involvement of hands/feet/face/genitals
  - Screen for psoriatic arthritis: joint pain/stiffness/swelling (occurs in 30% of psoriasis patients)
  - Comorbidities: increased risk cardiovascular disease, metabolic syndrome, depression, IBD

treatment:
  - Topical therapy for mild disease (<3% BSA): high-potency corticosteroids (clobetasol 0.05% BID x 2 weeks then taper) - avoid long-term use face/intertriginous areas, vitamin D analogs (calcipotriene 0.005% BID), combination corticosteroid + vitamin D (calcipotriene/betamethasone) more effective than either alone
  - Scalp: corticosteroid solution/foam (clobetasol foam), tar shampoo, salicylic acid (keratolytic)
  - Phototherapy for moderate disease: narrowband UVB 3x/week - very effective, PUVA alternative
  - Systemic therapy for moderate-severe disease (>3% BSA or inadequate topical response):
  - Methotrexate 7.5-25 mg weekly with folic acid 1 mg daily (first-line systemic) - monitor CBC/LFTs every 8-12 weeks, avoid pregnancy
  - Biologic DMARDs highly effective: TNF inhibitors (etanercept 50 mg SC weekly, adalimumab 40 mg SC every 2 weeks, infliximab 5 mg/kg IV at 0/2/6 weeks then every 8 weeks), IL-17 inhibitors (secukinumab, ixekizumab - most effective, rapid onset), IL-23 inhibitors (guselkumab, risankizumab), screen for latent TB before starting TNF inhibitors
  - Oral small molecules: apremilast (PDE4 inhibitor) 30 mg BID if prefer oral agent, JAK inhibitors (deucravacitinib)
  - Cyclosporine 2.5-5 mg/kg/day for severe refractory disease - short-term only (nephrotoxicity)
  - Acitretin 25-50 mg daily (oral retinoid) for pustular/erythrodermic psoriasis
  - Lifestyle: avoid triggers (stress, infections, trauma, alcohol, smoking), maintain healthy weight, emollients for dry skin

clinical_pearls:
  - Well-demarcated erythematous plaques with silvery scale on extensor surfaces pathognomonic
  - Auspitz sign (pinpoint bleeding when scale removed) classic finding
  - Koebner phenomenon (lesions at trauma sites) occurs in 25%
  - Screen all patients for psoriatic arthritis (occurs in 30%)
  - Biologics (IL-17/IL-23 inhibitors) highly effective - achieve PASI 90-100 in majority
  - Increased cardiovascular risk - screen for metabolic syndrome
  - Guttate psoriasis triggered by streptococcal pharyngitis

differentials:
  - Eczema/atopic dermatitis (poorly demarcated, pruritic, flexor surfaces, lichenification, no silvery scale)
  - Seborrheic dermatitis (scalp/face/intertriginous areas, greasy yellow scale, not well-demarcated)
  - Tinea corporis (ringworm) (annular with central clearing, KOH positive for hyphae, expands outward)
  - Cutaneous lupus (discoid lesions, photosensitivity, atrophy/scarring, positive ANA)

trace:
  - 38-year-old man presents with 5 years chronic scaly rash elbows/knees, worsening past 6 months now involving trunk/scalp, itching mild, tried OTC hydrocortisone without benefit, no joint pain
  - Family history: father with psoriasis
  - Exam: well-demarcated erythematous plaques with thick silvery scale on bilateral elbows (5 x 8 cm), knees (6 x 10 cm), multiple smaller plaques on trunk, scalp with thick scale and erythema, nails with pitting and onycholysis, Auspitz sign positive (pinpoint bleeding when scale removed)
  - BSA affected approximately 8% (moderate psoriasis)
  - Diagnosis: chronic plaque psoriasis, moderate severity
  - Started clobetasol 0.05% ointment BID x 2 weeks to plaques then taper to daily, calcipotriene 0.005% ointment BID (continue long-term), clobetasol foam to scalp daily
  - 4 weeks: some improvement but still significant disease, referred to dermatology
  - Dermatology started narrowband UVB phototherapy 3x/week
  - 8 weeks phototherapy: 50% improvement but plateaued
  - Started methotrexate 15 mg weekly with folic acid 1 mg daily (systemic therapy for moderate-severe disease)
  - 12 weeks: marked improvement, BSA <2% with only residual plaques elbows/knees, stopped phototherapy, continues methotrexate maintenance with topicals PRN
  - 6 months: well-controlled on methotrexate, PASI improvement 75%, labs CBC/LFTs normal, continues long-term maintenance therapy
