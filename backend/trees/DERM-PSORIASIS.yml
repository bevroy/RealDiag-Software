presentations:
  - Well-demarcated erythematous plaques
  - Silvery scale
  - Extensor surface involvement
  - Nail pitting or onycholysis
  - Koebner phenomenon
differentials:
  - Eczema
  - Seborrheic dermatitis
  - Fungal infection
  - Lichen planus
  - Pityriasis rosea
workup:
  - Clinical diagnosis (usually no tests needed)
  - Skin biopsy if diagnosis uncertain
  - Rheumatoid factor and anti-CCP if arthritis suspected (usually negative in psoriatic arthritis)
  - Baseline labs before systemic therapy (CBC, LFTs, Cr, TB test)
treatment:
  - 'Guideline-based treatment options for Psoriasis include:'
  - 'Mild: Topical corticosteroids (clobetasol 0.05%) + vitamin D analog (calcipotriene) (AAD 2023)'
  - 'Moderate: Add phototherapy (narrowband UVB 3x/week) (AAD 2023)'
  - 'Severeor psoriatic arthritis: Systemic therapy (methotrexate, biologics like adalimumab) (AAD 2023)'
  - 'Scalp: Tar shampoos, topical steroids in solution form (AAD 2023)'
  - Coal tar or salicylic acid for thick plaques (AAD 2023)
clinical_pearls:
  - 'Auspitz sign: Pinpoint bleeding when scale removed'
  - 'Koebner phenomenon: New lesions at sites of trauma'
  - 'Nail changes in 50%: Pitting, oil spots, onycholysis, subungual hyperkeratosis'
  - 'Psoriatic arthritis in 30%: Screen with joint exam, consider TNF inhibitors'
  - 'Avoid triggers: Stress, infections (strep throat), medications (beta-blockers, lithium), alcohol'
red_flags: []
disposition_guidance: {}
referrals:
  - Dermatology for moderate-severe disease or systemic therapy
  - Rheumatology if psoriatic arthritis
