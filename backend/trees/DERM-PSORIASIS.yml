tree_id: DERM-PSORIASIS
name: Psoriasis
family: Dermatology
specialty: Dermatology
chief_complaint: Scaly red plaques on elbows and knees
description: |
  Chronic immune-mediated inflammatory skin disease with hyperproliferation of keratinocytes. Affects 2-3% population.
  Multiple variants - plaque psoriasis (90%), guttate, inverse, pustular, erythrodermic. Associated with psoriatic arthritis (30%), metabolic syndrome, cardiovascular disease.
icd10: L40.0
urgency: Low
workup:
  - Clinical diagnosis based on appearance - well-demarcated erythematous plaques with silvery-white scale
  - Distribution - extensor surfaces (elbows, knees), scalp, sacrum, nails
  - Auspitz sign - pinpoint bleeding when scale removed (not routinely performed)
  - Koebner phenomenon - new lesions at sites of trauma
  - Skin biopsy if diagnosis uncertain - shows epidermal hyperplasia, parakeratosis, neutrophils in stratum corneum (Munro microabscesses)
  - Nail changes - pitting, oil drop discoloration, onycholysis, subungual hyperkeratosis
  - Screen for psoriatic arthritis - joint pain, swelling, dactylitis (sausage digits), enthesitis
  - Severity assessment - body surface area (BSA) involved, Psoriasis Area and Severity Index (PASI)
  - Mild (less than 3% BSA), moderate (3-10% BSA), severe (greater than 10% BSA)
treatment:
  - Mild disease - topical therapies sufficient
  - Topical corticosteroids first-line - high-potency (clobetasol 0.05%) for body, low-potency (hydrocortisone 1-2.5%) for face and intertriginous areas
  - Vitamin D analogs - calcipotriene 0.005% cream/ointment BID (can combine with topical steroid)
  - Calcineurin inhibitors - tacrolimus 0.1% or pimecrolimus 1% for face and intertriginous (steroid-sparing)
  - Moderate to severe disease - phototherapy or systemic agents
  - Narrowband UVB phototherapy 3 times weekly (first-line for moderate-severe)
  - Systemic traditional agents - methotrexate 7.5-25mg weekly (monitor CBC, LFTs), cyclosporine 2.5-5 mg/kg/day (short-term), acitretin 25-50mg daily (teratogenic)
  - Biologic therapy for moderate-severe disease - TNF inhibitors (adalimumab 40mg SC q2 weeks, etanercept 50mg SC weekly), IL-17 inhibitors (secukinumab 300mg SC monthly, ixekizumab), IL-23 inhibitors (guselkumab 100mg SC q8 weeks, risankizumab)
  - IL-23 inhibitors most effective with longest dosing intervals
  - Treat comorbidities - screen for metabolic syndrome, cardiovascular disease, depression
clinical_pearls:
  - Triggers include stress, infections (strep throat precedes guttate psoriasis), medications (beta-blockers, lithium, antimalarials), trauma
  - Scalp psoriasis often first manifestation, can be difficult to treat
  - Inverse psoriasis (intertriginous areas) - smooth red plaques without scale
  - Erythrodermic and pustular psoriasis medical emergencies (systemic toxicity)
  - Psoriatic arthritis patterns - symmetric polyarthritis (RA-like), asymmetric oligoarthritis, DIP joint involvement, spondylitis, arthritis mutilans
  - Clear skin improves quality of life and reduces cardiovascular risk
differentials:
  - Eczema (atopic dermatitis)
  - Seborrheic dermatitis
  - Tinea corporis
  - Cutaneous lupus
  - Pityriasis rosea
  - Cutaneous T-cell lymphoma
trace:
  - 35-year-old with red scaly plaques on elbows, knees, scalp x 6 months → Exam shows well-demarcated erythematous plaques with silvery scale, nail pitting → BSA 8% (moderate psoriasis) → Start clobetasol 0.05% ointment BID to body, calcipotriene 0.005% solution to scalp → Partial improvement after 4 weeks → Add narrowband UVB phototherapy 3x weekly → Significant improvement after 12 weeks → Maintenance with topical therapy and intermittent phototherapy → Develop joint pain and swelling in fingers → Diagnose psoriatic arthritis → Start adalimumab 40mg SC q2 weeks → Skin clears and joint symptoms resolve
