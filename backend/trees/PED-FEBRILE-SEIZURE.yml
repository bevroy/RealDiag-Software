tree_id: PED-FEBRILE-SEIZURE
name: Febrile Seizure
family: Pediatrics
specialty: Pediatrics
icd10:
- R56.00
- R56.01
snomed:
- 41497008
urgency: medium
description: Comprehensive evaluation and management of Febrile Seizure
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Seizure associated with fever (temp ≥38°C/100.4°F)
- Age 6 months to 5 years (peak 12-18 months)
- No CNS infection (meningitis, encephalitis ruled out)
- No prior afebrile seizures (not epilepsy)
- 'Simple febrile seizure (90%): Generalized tonic-clonic, <15 minutes, single episode
  in 24hr'
- 'Complex febrile seizure (10%): Focal features, >15 minutes, or multiple in 24hr'
- Usually occurs early in febrile illness (first 24hr)
- 'Post-ictal period: Brief drowsiness, then rapid return to baseline'
workup: []
treatment:
- 'Guideline-based treatment options for Febrile Seizure include:'
- 'During seizure: Protect from injury, position on side, maintain airway, do NOT
  restrain (AAP 2023)'
- 'If seizure >5 minutes: Benzodiazepine (AAP 2023)'
- 'Workup: Identify source of fever (otitis, URI, UTI, etc.), NO routine CT/EEG/labs
  for simple FS (AAP 2023)'
- 'LP if: Age <12 months, clinical concern for meningitis, complex features, or antibiotics
  given before presentation (AAP 2023)'
- 'Disposition: Discharge if simple FS, reassure parents, fever management education,
  recurrence precautions (AAP 2023)'
clinical_pearls:
- 'Simple febrile seizure: NO routine labs, CT, EEG, or LP needed (clinical diagnosis)'
- 'LP indications: Age <12 months (meningitis symptoms subtle), concern for meningitis,
  complex features'
- 'Recurrence risk: 30-40% overall, higher if age <18 months, lower fever, or family
  history'
- 'Long-term outcomes: Excellent, no increased risk of epilepsy (only 2-4% develop
  epilepsy vs 1% general population)'
- 'Do NOT routinely prescribe anticonvulsants: No benefit in preventing recurrence'
- Antipyretics (acetaminophen, ibuprofen) do NOT prevent febrile seizures
referrals: []
differentials:
  - Meningitis
  - Encephalitis
  - Epilepsy
  - Metabolic disorder
  - Intoxication
