tree_id: RHEUM-GIANT-CELL-ARTERITIS
name: Giant Cell Arteritis (Temporal Arteritis)
family: Rheumatology
specialty: Rheumatology
chief_complaint: New headache with jaw pain when chewing
description: Granulomatous vasculitis of medium and large arteries causing headache, jaw claudication, and risk of irreversible vision loss. High-dose corticosteroids emergently prevent blindness, temporal artery biopsy confirms diagnosis but do not delay treatment.
icd10: M31.6
urgency: emergent

workup:
  - Clinical diagnosis: new headache in patient over 50 with jaw claudication, vision changes, scalp tenderness, or PMR symptoms
  - Age: almost always over 50 years (average 70 years), same as PMR
  - Classic triad: new headache, jaw claudication, vision abnormalities
  - Headache: new onset or new type, temporal region, severe, persistent
  - Jaw claudication: pain in jaw/tongue when chewing (most specific symptom 90% specific), fatigue while eating
  - Vision loss: sudden painless vision loss (monocular), amaurosis fugax (transient), diplopia
  - VISION LOSS MEDICAL EMERGENCY: irreversible if not treated urgently
  - Scalp tenderness: pain when combing hair or lying on pillow
  - Temporal artery: tender, thickened, reduced or absent pulse (not always present)
  - PMR symptoms: 50% have concurrent polymyalgia rheumatica (bilateral shoulder/hip pain and stiffness)
  - ESR and CRP: markedly elevated (ESR typically over 50, often over 100)
  - Normal ESR does NOT rule out GCA (5-10% have normal ESR)
  - Platelets: often elevated (thrombocytosis)
  - Temporal artery biopsy: gold standard for diagnosis, skip lesions common (biopsy 2-3 cm segment)
  - Perform within 2 weeks of starting steroids (pathology changes persist), do NOT delay steroids waiting for biopsy
  - Ultrasound temporal arteries: halo sign (vessel wall edema), non-invasive alternative if biopsy not available

treatment:
  - EMERGENT high-dose corticosteroids: do NOT delay treatment waiting for biopsy
  - Vision loss or imminent: methylprednisolone 1000 mg IV daily x3 days then oral prednisone
  - No vision loss: prednisone 40-60 mg daily PO immediately (higher dose than PMR)
  - Start treatment same day as clinical suspicion (even before labs return)
  - Dramatic improvement in symptoms within 24-48 hours
  - Temporal artery biopsy: perform within 2 weeks of starting steroids (changes persist, do not delay treatment)
  - Urgent ophthalmology referral: if any vision changes for comprehensive exam
  - Taper: after 2-4 weeks at high dose, slow taper by 10% every 2 weeks
  - Goal: lowest dose maintaining disease control, typically 5-10 mg daily maintenance
  - Duration: most require 1-2 years or longer
  - Monitor ESR/CRP: trend with symptoms, rising may indicate disease flare
  - Low-dose aspirin 81 mg daily: reduces ischemic complications (stroke, vision loss)
  - Steroid side effect prevention: calcium, vitamin D, bisphosphonate, PPI, diabetes screening (same as PMR)
  - Tocilizumab (IL-6 inhibitor): FDA-approved for GCA, steroid-sparing, consider if difficult taper or relapse
  - Methotrexate: steroid-sparing agent, 15-25 mg weekly
  - Relapse: 50% relapse during taper, increase steroids and slow taper

clinical_pearls:
  - New headache with jaw claudication in patient over 50 - medical emergency
  - Vision loss irreversible if not treated urgently - do NOT delay steroids
  - Start prednisone 40-60 mg immediately on clinical suspicion
  - Temporal artery biopsy within 2 weeks confirms but do NOT delay treatment
  - Jaw claudication most specific symptom (90% specific)
  - 50% have concurrent polymyalgia rheumatica
  - Markedly elevated ESR/CRP but 5-10% have normal ESR
  - Low-dose aspirin reduces ischemic complications
  - Most require 1-2 years of treatment with slow taper

differentials:
  - Polymyalgia rheumatica: bilateral shoulder/hip pain without headache or jaw claudication, lower prednisone dose (15-20 mg)
  - Migraine: younger age, recurrent pattern, visual aura, normal ESR, no jaw claudication
  - Trigeminal neuralgia: brief lancinating facial pain triggered by touch, normal ESR
  - Tension headache: bilateral band-like pressure, normal ESR, no jaw claudication

trace: |
  A 75-year-old woman presented to ED with 1 week of severe right temporal headache and 2 days of pain in jaw when eating (jaw claudication). Difficulty finishing meals due to jaw fatigue. Scalp tender when brushing hair. No vision changes currently but had brief episode of vision blurring in right eye yesterday lasting 5 minutes (amaurosis fugax - warning sign). Also has bilateral shoulder pain and morning stiffness x1 month (PMR symptoms). Exam showed tender thickened right temporal artery with reduced pulse, scalp tenderness right temporal region, limited shoulder range of motion. URGENT labs showed ESR 102, CRP 68 (markedly elevated), platelets 520 (thrombocytosis). Clinical diagnosis: giant cell arteritis with polymyalgia rheumatica - VISION LOSS MEDICAL EMERGENCY given jaw claudication and amaurosis fugax. Started prednisone 60 mg PO immediately in ED without waiting for confirmatory testing. URGENT ophthalmology consult: dilated exam showed no acute ischemic changes (treated before permanent vision loss). Admitted for observation. Temporal artery biopsy scheduled within 1 week. Low-dose aspirin 81 mg daily started. At 24 hours dramatic improvement: headache 80% better, no jaw claudication, no vision changes. At 1 week temporal artery biopsy showed granulomatous inflammation with giant cells (confirmed GCA diagnosis). Started calcium, vitamin D, alendronate for bone protection during prolonged steroid therapy. At 4 weeks ESR 18, CRP 4, symptoms controlled. Started slow taper: 50 mg daily. At 3 months tapered to 30 mg daily. At 6 months on 15 mg daily, no vision loss prevented by prompt treatment. Continues slow taper over 18-24 months.
