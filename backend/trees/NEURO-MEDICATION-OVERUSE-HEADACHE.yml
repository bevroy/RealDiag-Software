    indications: "Headache from overindulgence, irritability, digestive upset, worse morning, caffeine dependence"
  - remedy: "Coffea cruda 30C"
    indications: "Headache from caffeine withdrawal, oversensitivity, mind racing, insomnia"
  - remedy: "Gelsemium 30C"
