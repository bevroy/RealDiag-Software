presentations:
  - Daily or near-daily headache (15 or more days per month)
  - Frequent acute medication use (10-15+ days per month for 3+ months)
  - Headache worsening with medication overuse
  - Morning headache (rebound from overnight medication gap)
  - Loss of medication efficacy over time
  - Escalating medication doses needed
  - Anxiety about running out of medication
  - Reduced quality of life and function
  - Concurrent depression or anxiety
  - Medication withdrawal symptoms when doses missed

workup:
  - Diagnostic criteria: headache 15 or more days per month in patient with pre-existing primary headache disorder, regular overuse of acute headache medications for more than 3 months, headache developed or worsened during medication overuse
  - Medication overuse thresholds: simple analgesics (aspirin, acetaminophen, NSAIDs) 15 or more days per month, triptans 10 or more days per month, opioids 10 or more days per month, combination analgesics (butalbital, caffeine combinations) 10 or more days per month, any combination of medications 10 or more days per month
  - Detailed headache history: pre-existing primary headache type (migraine, tension-type), frequency and severity before medication overuse, current headache frequency (days per month), medication diary (types, doses, frequency all medications used)
  - Identify at-risk medications: triptans (sumatriptan, rizatriptan), NSAIDs (ibuprofen, naproxen), acetaminophen, combination analgesics (Excedrin, Fioricet, Fiorinal with butalbital), opioids (codeine, oxycodone, hydrocodone), ergotamines, caffeine-containing products
  - Rule out secondary headaches: red flags (thunderclap onset, new headache over age 50, fever or systemic illness, focal neurologic deficits, papilledema, change in headache pattern), neuroimaging (MRI or CT brain) if red flags or atypical features or never imaged, normal exam if typical MOH without red flags
  - Assess comorbidities: depression screening (PHQ-9), anxiety screening (GAD-7), sleep disorders (insomnia common in MOH), substance use (caffeine intake, tobacco, alcohol), medication dependence concerns (especially opioids, butalbital)
  - Labs if indicated: CBC, CMP, TSH (rule out anemia, metabolic causes, thyroid), ESR/CRP if giant cell arteritis suspected (age over 50, temporal tenderness, jaw claudication)
  - Keep headache diary: document headache days, severity (0-10 scale), medications taken (type, dose, frequency), disability (missed work/activities), triggers

treatment:
  - Education critical: explain MOH pathophysiology (rebound cycle, medication making headaches worse), prognosis (headaches improve 2-4 weeks after withdrawal in 70-80 percent), importance of complete withdrawal from overused medications, need for preventive therapy
  - Medication withdrawal (cornerstone of treatment): abrupt cessation preferred for most medications (better outcomes than gradual taper), exception opioids and butalbital (taper to avoid severe withdrawal - seizures with butalbital, withdrawal syndrome with opioids), expect headache worsening first 2-10 days (withdrawal headache peaks day 2-10 then improves), nausea, anxiety, sleep disturbance common during withdrawal
  - Withdrawal strategies: outpatient withdrawal (most patients, close follow-up, supportive care), inpatient withdrawal (severe dependence, failed outpatient attempts, comorbid psychiatric conditions, high-dose opioids or butalbital - medically supervised taper)
  - Bridge therapy during withdrawal: short course steroids (prednisone 60-100 mg daily x 5 days then stop - reduces withdrawal headache severity), or DHE protocol (dihydroergotamine 0.5-1 mg SC/IM/IV every 8 hours x 2-3 days), or IV fluids and antiemetics (metoclopramide 10 mg IV, prochlorperazine 10 mg IV for nausea), or nerve blocks (greater occipital nerve block with lidocaine/steroid - temporary relief)
  - Preventive medication (start immediately during withdrawal): migraine preventives if underlying migraine (topiramate 25-100 mg daily, amitriptyline 25-75 mg at bedtime, propranolol 80-160 mg daily, candesartan 16 mg daily), tension-type headache preventives (amitriptyline 25-50 mg at bedtime most effective), select based on comorbidities (topiramate if obesity, amitriptyline if insomnia/depression, propranolol if anxiety, avoid in asthma)
  - Rescue medication (limited use): establish clear rules (limit to 2 days per week maximum, no more than 8-10 days per month), triptans acceptable as rescue if not overused medication (sumatriptan 50-100 mg, maximum 2 doses per day, limit 9 days per month), NSAIDs acceptable (naproxen 500 mg, ibuprofen 600-800 mg, limit 2 days per week), avoid combination analgesics and opioids permanently
  - Non-pharmacologic interventions: cognitive behavioral therapy (CBT for pain management, address catastrophizing, improve coping), biofeedback and relaxation training, regular exercise (30 minutes moderate activity 5 days per week - reduces headache frequency), sleep hygiene (regular schedule, 7-8 hours nightly), hydration (8 glasses water daily), avoid triggers (identify and modify)
  - Address comorbidities: treat depression (SSRI - sertraline, escitalopram, or SNRI - venlafaxine, duloxetine which also treat pain), treat anxiety (CBT, SSRI, avoid benzodiazepines), treat insomnia (sleep hygiene, CBT-I, consider melatonin 3-5 mg or trazodone 25-50 mg, avoid chronic sedatives)
  - Follow-up: frequent initially (weekly x 4 weeks during withdrawal and early prevention), review headache diary, assess adherence to medication limits, adjust preventive dosing, screen for depression/anxiety, then monthly x 3-6 months, goal 50 percent reduction in headache days

clinical_pearls:
  - MOH affects 1-2 percent of general population, most common in those with migraine or chronic tension-type headache
  - Medication overuse threshold: simple analgesics 15+ days/month, triptans/opioids/combinations 10+ days/month
  - Complete withdrawal from overused medication is cornerstone of treatment - 70-80 percent improve
  - Headaches worsen first 2-10 days after withdrawal (withdrawal headache) then improve
  - Bridge therapy (prednisone taper, DHE, nerve block) can ease withdrawal but not essential
  - Start preventive medication immediately during withdrawal (don't wait for headaches to improve)
  - Limit rescue medication to 2 days per week maximum after MOH resolves (prevent recurrence)
  - Butalbital-containing medications (Fioricet, Fiorinal) particularly problematic - high addiction potential
  - Recurrence common (30-40 percent) especially if return to frequent acute medication use
  - Education about rebound cycle improves adherence to treatment plan

referrals:
  - Neurology or headache specialist for refractory cases, complex medication regimens, or need for specialized withdrawal protocols
  - Pain management or addiction medicine if opioid or butalbital dependence (supervised taper, buprenorphine if opioid use disorder)
  - Psychiatry or psychology for comorbid depression, anxiety, or substance use disorder
  - Inpatient headache treatment center if severe MOH, multiple failed outpatient withdrawal attempts, or psychiatric comorbidity
  - Physical therapy for myofascial pain, posture training, biofeedback training

differentials:
  - Chronic migraine (15+ headache days per month without medication overuse)
  - Chronic tension-type headache (frequent bilateral headache without medication overuse)
  - New daily persistent headache (NDPH - sudden onset daily headache from onset, no medication overuse)
  - Cervicogenic headache (neck source, worse with neck movements, responds to neck treatment)
  - Temporomandibular joint disorder (TMJ pain, jaw clicking, worse with chewing)
  - Giant cell arteritis (age over 50, temporal tenderness, elevated ESR/CRP, jaw claudication)
  - Idiopathic intracranial hypertension (papilledema, visual changes, pulsatile tinnitus)
  - Depression (may present with chronic headache, assess mood and neurovegetative symptoms)

trace:
  - 38-year-old woman presents for evaluation of daily headaches x 2 years, progressively worsening
  - History: started having migraines age 25 (episodic, 4-6 days per month, unilateral throbbing, nausea, photophobia), initially treated with sumatriptan 100 mg as needed (effective relief), over past 3 years headaches increased in frequency, started using sumatriptan more often, now having headache almost every day
  - Current pattern: headache 25-28 days per month, wakes with headache most mornings (dull, bilateral, pressure-like different from previous migraines), takes sumatriptan 100 mg 15-20 days per month (no longer very effective, used to work reliably), also uses Excedrin (acetaminophen/aspirin/caffeine combination) 10-15 days per month, ibuprofen 800 mg several days per week
  - Medication diary review: averages 18-20 days per month triptan use, 12-15 days per month combination analgesic use, total acute medication use 25+ days per month
  - Impact: missed 3-4 work days per month due to headache, reduced social activities, feels anxious when medication supply running low, quality of life severely affected
  - Past medical history: no other significant medical problems, no prior head trauma
  - Medications: sumatriptan 100 mg PRN, Excedrin PRN, ibuprofen 800 mg PRN, oral contraceptive pill
  - Social: works as accountant (desk job, computer use), married with two children, stress at work and home, sleeps 5-6 hours nightly (often wakes with headache)
  - Exam: vital signs normal, general and neurologic exam normal, no papilledema, no focal deficits, mild trapezius muscle tenderness bilaterally
  - MRI brain (done 1 year ago): normal, no mass or structural lesion
  - Assessment: medication overuse headache (MOH) with underlying chronic migraine, overusing triptans (15-20 days/month, threshold 10 days/month) and combination analgesics (12-15 days/month, threshold 10 days/month) for more than 3 months, transformation from episodic migraine to chronic daily headache associated with medication overuse
  - PHQ-9 depression screening: score 12 (moderate depression - likely reactive to chronic headache and disability)
  - Diagnosis confirmed: Medication Overuse Headache (MOH) secondary to triptan and combination analgesic overuse, with underlying chronic migraine
  - Treatment plan discussed: extensive education about MOH (rebound cycle, medications making headaches worse), prognosis (70-80 percent improve with withdrawal), explained withdrawal headache expected first 2-10 days
  - Medication withdrawal: abrupt cessation of sumatriptan and Excedrin (no taper needed for these medications), instructed to stop immediately and not use any acute headache medications for 4 weeks
  - Bridge therapy: prednisone 60 mg daily x 5 days starting day 1 of withdrawal (no taper, just stop after 5 days - helps reduce withdrawal headache severity)
  - Preventive medication: topiramate 25 mg at bedtime started immediately (titrate up by 25 mg weekly to target 100 mg daily - chosen for migraine prevention and potential weight benefit)
  - Rescue plan after withdrawal period: after 4 weeks, can use sumatriptan maximum 2 days per week (9 days per month maximum), track strictly with diary, if exceeds limit need to contact clinic
  - Non-pharmacologic: instructed sleep hygiene (goal 7-8 hours nightly), regular exercise (30 min walking 5 days per week), hydration (8 glasses water daily), keep detailed headache diary
  - Depression: sertraline 50 mg daily started (SSRI for comorbid depression)
  - Follow-up plan: weekly phone calls x 4 weeks to monitor withdrawal, then office visit week 4
  - Week 1 withdrawal: patient reports severe headache worsening (expected withdrawal headache), nausea, difficulty concentrating, "worst week of my life", prednisone helped some but still very difficult, continued to abstain from triptans and Excedrin (strong willpower with support)
  - Week 2 withdrawal: headaches still present but starting to improve slightly, less nausea, sleep improving, still no acute medications used
  - Week 4 office visit: headaches significantly improved, now 15 days per month (down from 25-28 days), severity decreased from 7-8/10 to 4-5/10, able to function at work, mood improving, very encouraged
  - Topiramate increased to 75 mg daily (tolerating well, mild paresthesias only)
  - Instructed can now use sumatriptan as rescue but strict limit 2 days per week maximum
  - 3-month follow-up: headache frequency 8-10 days per month (major improvement), using sumatriptan only 4-6 days per month (well within limits), quality of life dramatically better, back to full function at work and home, PHQ-9 score improved to 4 (minimal depression)
  - Topiramate 100 mg daily (target dose reached), tolerating well, lost 8 pounds (appreciated)
  - Patient expresses gratitude: "I can't believe the medications were making my headaches worse. I wish I had known about this years ago. My life is completely different now."
  - 6-month follow-up: maintaining improvement, headaches 6-8 days per month, resembles original episodic migraine pattern, sumatriptan effective again when used (works reliably now with limited use), no medication overuse, no depression, excellent quality of life
  - Plan: continue topiramate indefinitely (may attempt taper after 12-24 months stable), maintain strict medication limits (2 days per week rescue maximum), continue headache diary, monitor for any increase in acute medication frequency (early warning of recurrence)
