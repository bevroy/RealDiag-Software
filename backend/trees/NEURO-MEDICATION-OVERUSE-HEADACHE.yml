tree_id: NEURO-MEDICATION-OVERUSE-HEADACHE
name: Medication Overuse Headache
family: Neurology
specialty: Neurology/Primary Care
chief_complaint: Daily or near-daily headaches with frequent analgesic use
description: Secondary headache disorder caused by regular overuse of acute headache medications, resulting in chronic daily headache and reduced medication efficacy

icd10: G44.40
snomed: "398057008"

urgency: routine

