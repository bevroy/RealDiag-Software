tree_id: OPTH-BLEPHARITIS
name: Blepharitis
family: Ophthalmology
specialty: Ophthalmology
chief_complaint: Crusty eyelids and burning eyes
description: Chronic inflammation of eyelid margins causing crusting, redness, and irritation. Warm compresses and eyelid hygiene (lid scrubs) mainstay of treatment, chronic condition requires ongoing maintenance.
icd10: H01.009
snomed: 47180009
urgency: non-urgent

workup:
  - Clinical diagnosis: bilateral eyelid margin inflammation with crusting, redness, burning, foreign body sensation
  - Types: anterior blepharitis (eyelash follicles and skin), posterior blepharitis (meibomian glands - most common)
  - Anterior blepharitis: crusts and scales at base of eyelashes, may have collarettes (sleeves around lashes)
  - Staphylococcal: hard scales, eyelash loss, ulcerations
  - Seborrheic: greasy soft scales, associated with seborrheic dermatitis of scalp and face
  - Posterior blepharitis (meibomian gland dysfunction): thickened lid margins, inspissated meibomian gland secretions, frothy tear film, telangiectasias
  - Symptoms: burning, itching, foreign body sensation, crusting (especially upon awakening), red eyelid margins, tearing
  - Associated conditions: dry eye syndrome (70% overlap), rosacea, seborrheic dermatitis, demodex mites
  - Complications: chalazion (blocked meibomian gland), hordeolum (stye), corneal involvement (keratitis)
  - Examination: slit lamp shows eyelid margin erythema, telangiectasias, foam in tear film, meibomian gland dysfunction

treatment:
  - Eyelid hygiene (most important): warm compresses plus lid scrubs daily (mainstay of treatment)
  - Warm compresses: apply warm washcloth to closed eyelids 5-10 minutes BID (liquefies meibomian gland secretions)
  - Lid scrubs: gentle scrubbing of eyelid margins with diluted baby shampoo or commercial lid scrub pads BID (removes debris and bacteria)
  - Technique: mix baby shampoo with warm water, apply to closed eyelids with clean washcloth or cotton swab, scrub along lash line, rinse thoroughly
  - Artificial tears: preservative-free lubricating drops QID PRN for dry eye symptoms
  - Topical antibiotics: if moderate-severe or not responding to hygiene alone
  - Erythromycin or bacitracin ointment to eyelid margins at bedtime x2-4 weeks (targets Staphylococcus)
  - Azithromycin 1% ophthalmic solution BID x2 days then daily x10 days (anti-inflammatory effect)
  - Oral antibiotics: for severe posterior blepharitis or rosacea-associated
  - Doxycycline 100 mg daily or 50 mg BID x6-12 weeks (anti-inflammatory and improves meibomian gland secretion)
  - Omega-3 fatty acids: 1000-2000 mg daily (improves tear film quality, anti-inflammatory)
  - Treat underlying conditions: seborrheic dermatitis (ketoconazole shampoo), rosacea (topical metronidazole)
  - Demodex treatment: if suspected (tea tree oil lid scrubs or ivermectin cream)
  - Chronic condition: requires ongoing eyelid hygiene maintenance to prevent flares

clinical_pearls:
  - Bilateral chronic eyelid margin inflammation with crusting and burning
  - Warm compresses plus lid scrubs (baby shampoo) mainstay of treatment
  - Posterior blepharitis (meibomian gland dysfunction) most common type
  - 70% overlap with dry eye syndrome
  - Chronic relapsing condition - requires daily eyelid hygiene maintenance
  - Doxycycline for severe posterior blepharitis (anti-inflammatory effect)
  - Associated with rosacea and seborrheic dermatitis
  - Complications: chalazion, hordeolum, keratitis

differentials:
  - Conjunctivitis: conjunctival injection and discharge (not primarily lid margin), acute onset
  - Chalazion: painless eyelid nodule (blocked meibomian gland), localized swelling not diffuse lid inflammation
  - Hordeolum (stye): acute painful localized eyelid swelling (infected gland or follicle)
  - Allergic conjunctivitis: bilateral itching, watery discharge, chemosis, seasonal pattern

trace: |
  A 52-year-old woman presented with 6 months of bilateral burning, gritty sensation in eyes worse in morning. Eyelids crusty upon awakening. Uses artificial tears multiple times daily with minimal relief. History of rosacea on face. Exam showed bilateral eyelid margin erythema with telangiectasias, thickened meibomian gland orifices with inspissated secretions (toothpaste-like), collarettes at base of several lashes, no conjunctival injection. Diagnosed with chronic blepharitis (anterior and posterior types). Initiated eyelid hygiene regimen: warm compresses to closed eyelids 5-10 minutes twice daily followed immediately by lid scrubs with diluted baby shampoo (1:1 with warm water) scrubbing gently along lash line with clean washcloth, rinse thoroughly. Preservative-free artificial tears QID. Started doxycycline 50 mg BID x8 weeks for posterior blepharitis and rosacea (anti-inflammatory effect improves meibomian gland function). At 2 weeks symptoms improved 40%, crusting decreased significantly. At 6 weeks burning improved 70%, lid margins less inflamed. At 8 weeks completed doxycycline, symptoms 80% improved. Continues daily warm compresses and lid scrubs as maintenance (chronic condition requires ongoing care). At 6 months maintains good control with daily eyelid hygiene, occasional flares managed with increased frequency of warm compresses. Counseled that lifelong eyelid hygiene maintenance needed to prevent recurrence.
