  - id: acute_variceal_bleeding
    type: diagnosis
    name: "Acute Variceal Bleeding"
    icd10: "I85.01"
    urgency: critical
    workup:
      - Variceal bleeding - Life-threatening complication of portal hypertension
      - Mortality 15-20% per episode despite advances in management
      - 6-week rebleeding rate 30-40% without prophylaxis
      - Portal hypertension - Hepatic venous pressure gradient (HVPG) >10 mmHg (normal 3-5 mmHg), varices develop when HVPG >10-12 mmHg, bleeding risk when >12 mmHg
      - Causes - Cirrhosis most common (alcohol, viral hepatitis, NASH), portal vein thrombosis, Budd-Chiari syndrome, schistosomiasis, congenital hepatic fibrosis
      - Esophageal varices - Portosystemic collaterals (dilated submucosal veins in distal esophagus), 50% of cirrhotics have varices at diagnosis, 5-15% per year develop varices if none initially
      - Risk factors for bleeding - Large varices (>5 mm), "red wale" signs (longitudinal red streaks on varices, indicate high tension), Child-Pugh class C (decompensated cirrhosis), active alcohol use
      - Clinical presentation
      - Hematemesis - Bright red blood or coffee-ground emesis (massive volume)
      - Melena or hematochezia if brisk bleeding
      - Signs of cirrhosis/portal hypertension - Jaundice, ascites, splenomegaly, spider angiomata, caput medusae
      - Hypovolemic shock - Tachycardia, hypotension, altered mental status
      - Precipitating factors - Increased portal pressure (constipation, large meals), aspirin/NSAIDs, trauma
      - Labs
      - CBC - Anemia (baseline chronic anemia in cirrhosis vs acute blood loss), thrombocytopenia (splenomegaly from portal HTN)
      - Coagulation - PT/INR elevated (liver synthetic dysfunction), NOT necessarily bleeding risk in cirrhosis (balanced hemostasis)
      - CMP - Renal function (HRS risk), hyponatremia, hypoglycemia
      - LFTs - Transaminases, bilirubin, albumin (assess liver function)
      - Type and cross - Prepare blood products
      - Lactate - Perfusion, shock
    treatment:
      - Resuscitation - ABC, large-bore IV access (2 sites), ICU admission
      - Restrictive transfusion strategy - Target Hgb 7-8 g/dL (NOT 10), over-transfusion increases portal pressure, rebleeding risk
      - 1-2 units PRBCs, reassess
      - Correct coagulopathy cautiously - INR does NOT predict bleeding in cirrhosis (balanced hemostasis), only transfuse FFP/platelets if active bleeding AND severely low
      - Platelets if <50K and active bleeding
      - Avoid aggressive correction (increases portal pressure)
      - Airway protection - Intubate if massive hematemesis (aspiration risk), altered mental status, or pre-EGD if high risk
      - Octreotide - Splanchnic vasoconstriction, reduces portal pressure
      - 50 mcg IV bolus, then 50 mcg/hr continuous infusion x 2-5 days
      - Start immediately (even before EGD)
      - Reduces bleeding, improves outcomes, few side effects
      - Antibiotics - CRITICAL, reduce mortality 30%, prevent spontaneous bacterial peritonitis (SBP), bacteremia
      - Ceftriaxone 1 g IV daily x 7 days - First-line (superior to quinolones, covers resistant bacteria)
      - OR norfloxacin 400 mg PO BID x 7 days if oral tolerated and low risk
      - Cirrhotic patients with GI bleed have 20-30% risk of bacterial infection
      - Urgent EGD - Within 12 hours (ideally 6 hours) of presentation, after resuscitation
      - Diagnose source of bleeding (varices vs other - PUD, Mallory-Weiss, portal hypertensive gastropathy)
      - Endoscopic band ligation (EBL) - First-line treatment for esophageal varices
      - Place elastic bands around varices, strangulate, cause thrombosis and obliteration
      - Controls bleeding 80-90%, fewer complications than sclerotherapy
      - Endoscopic sclerotherapy - Alternative if EBL not feasible (massive bleeding, poor visualization)
      - Inject sclerosant (ethanolamine, sodium tetradecyl sulfate) into or around varix
      - Higher complication rate (strictures, ulcers, perforation)
      - Gastric varices - Cyanoacrylate glue injection (not FDA-approved US, but used), thrombin injection, or consider TIPS
      - Balloon tamponade - Rescue therapy if uncontrolled bleeding despite EBL and medical therapy
      - Sengstaken-Blakemore tube (esophageal + gastric balloons) or Minnesota tube (+ esophageal aspiration port)
      - Inflate gastric balloon (250-300 mL), pull back to gastroesophageal junction (tamponade), inflate esophageal balloon if continued bleeding (30-40 mmHg)
      - Temporizing measure (controls bleeding 80-90%), bridge to definitive therapy (TIPS, transplant)
      - Complications - Aspiration (intubate first), esophageal rupture (rare, catastrophic), rebleeding when deflated
      - Maximum 24-48 hours (tissue necrosis risk)
      - TIPS (Transjugular Intrahepatic Portosystemic Shunt) - Interventional radiology procedure
      - Creates shunt between portal vein and hepatic vein, decompresses portal system
      - Indications - Refractory variceal bleeding (failed EBL, balloon tamponade), recurrent bleeding despite prophylaxis, gastric varices
      - Contraindications - Severe hepatic encephalopathy, right heart failure, polycystic liver disease, severe liver failure (may push to transplant instead)
      - Complications - Hepatic encephalopathy (30-50%, shunts blood away from liver), shunt stenosis/occlusion, liver failure, infection
      - Covered stents reduce stenosis
      - Surgery - Portocaval shunt, devascularization procedures (rarely done now, TIPS replaced surgical shunts)
      - Liver transplantation - Definitive treatment for decompensated cirrhosis with variceal bleeding
      - Evaluate for transplant if Child-Pugh B/C or MELD >15

  - id: primary_prophylaxis
    type: diagnosis
    name: "Primary Prophylaxis (Prevent First Bleed)"
    icd10: "I85.00"
    urgency: medium
    workup:
      - Goal - Prevent first variceal bleed in patients with known varices
      - Screening - All patients with cirrhosis should undergo screening EGD at diagnosis
      - If no varices - Repeat EGD every 2-3 years (low risk)
      - If small varices (<5 mm) - Repeat EGD every 1-2 years
      - If medium/large varices (≥5 mm) or "red wale" signs - Prophylaxis indicated
      - Decompensated cirrhosis (Child-Pugh B/C) - Prophylaxis even if small varices
      - Risk of bleeding - 10-15% per year if medium/large varices without prophylaxis
    treatment:
      - Non-selective beta-blockers (NSBB) - First-line
      - Propranolol 20-40 mg PO BID, titrate to max tolerated (up to 160 mg BID) OR
      - Nadolol 40 mg PO daily, titrate up to 160 mg daily OR
      - Carvedilol 6.25-12.5 mg PO daily (alpha + beta blocker, more potent portal pressure reduction)
      - Goal - Reduce resting heart rate 25% from baseline (or ~55-60 bpm), correlates with decreased HVPG
      - Mechanism - Beta-1 blockade reduces cardiac output, beta-2 blockade causes splanchnic vasoconstriction (reduces portal inflow)
      - Contraindications - Asthma, decompensated heart failure, bradycardia, hypotension, peripheral vascular disease
      - Side effects - Fatigue, impotence, bronchospasm
      - Reduces bleeding risk 40-50%, mortality benefit
      - Continue indefinitely (lifelong unless liver transplant)
      - Endoscopic band ligation (EBL) - Alternative if beta-blockers contraindicated or not tolerated
      - Repeat sessions every 1-2 weeks until varices obliterated (usually 3-4 sessions)
      - Surveillance EGD 3-6 months after obliteration, then yearly (varices can recur)
      - Equivalent efficacy to beta-blockers for preventing first bleed
      - Combination beta-blockers + EBL - NOT superior to either alone for primary prophylaxis (higher adverse events)
      - Do NOT use both
      - Treatment of choice
      - Medium/large varices - NSBB OR EBL (patient/physician preference)
      - Small varices + high-risk features (Child-Pugh C, red wale signs) - NSBB
      - Small varices + compensated cirrhosis (Child-Pugh A, no red signs) - Observation, repeat EGD 1-2 years, OR NSBB

  - id: secondary_prophylaxis
    type: diagnosis
    name: "Secondary Prophylaxis (Prevent Rebleeding)"
    icd10: "I85.01"
    urgency: high
    workup:
      - Goal - Prevent rebleeding in patients who survived variceal hemorrhage
      - Risk of rebleeding - 60-70% within 1 year without prophylaxis, mortality 30-40% with each rebleeding episode
      - High-risk period - First 6 weeks after initial bleed (30-40% rebleed)
    treatment:
      - Combination therapy - Beta-blockers + EBL, superior to either alone for secondary prophylaxis
      - Non-selective beta-blockers - Propranolol, nadolol, or carvedilol (doses as above)
      - Start within 5 days of acute bleed (once stable)
      - Continue indefinitely
      - PLUS
      - Endoscopic band ligation - Repeat sessions every 1-2 weeks until varices obliterated
      - Surveillance EGD 3 months after obliteration, then every 6-12 months (recurrence)
      - Reduces rebleeding 30-40%, mortality benefit
      - TIPS - If rebleeding despite combination therapy (refractory), or high-risk features
      - Early preemptive TIPS - Consider within 72 hours of admission for very high-risk patients (Child-Pugh C <14 points or Child-Pugh B + active bleeding at EGD)
      - Reduces rebleeding and mortality in high-risk patients
      - Liver transplantation - Definitive, evaluate if decompensated cirrhosis
