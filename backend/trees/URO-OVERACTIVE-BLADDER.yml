tree_id: URO-OVERACTIVE-BLADDER
name: Overactive Bladder
family: urology
specialty: Urology/Primary Care
icd10: N32.81
snomed: 442972004
urgency: []
homeopathy: []
presentations:
  - Urgency (sudden compelling desire to urinate that is difficult to defer) - HALLMARK symptom
  - Frequency (voiding greater than 8 times in 24 hours)
  - Nocturia (waking 2 or more times at night to urinate)
  - With or without urgency urinary incontinence
  - OAB "dry" (without incontinence): urgency and frequency only
  - OAB "wet" (with incontinence): urgency with leakage episodes
  - Symptoms present for at least 3 months
  - Absence of urinary tract infection or other obvious pathology
  - Affects 15-20% of adults, increases with age (30-40% over age 75)
workup:
  - Clinical diagnosis based on symptoms
  - Urgency is key diagnostic criterion
  - Must rule out other causes before diagnosing OAB
  - Voiding diary for 3 days minimum
  - Record times, volumes, urgency episodes, incontinence episodes
  - Typically shows: increased frequency (greater than 8/day), nocturia (greater than 2/night), small voided volumes
  - Urinalysis and urine culture
  - Rule out urinary tract infection (most important differential)
  - Rule out glycosuria (diabetes)
  - Rule out hematuria (bladder cancer)
  - Post-void residual (PVR) urine measurement
  - Bladder scan or catheterization after voiding
  - "PVR less than 50 mL: normal (pure OAB)"
  - "PVR greater than 200 mL: significant retention (not OAB, likely overflow incontinence)"
  - Physical examination
  - Abdominal exam (masses, bladder distention)
  - Neurological screening (cognitive function, focal deficits, reflexes)
  - Pelvic exam in women (assess for prolapse, atrophy)
  - Prostate exam in men (BPH can coexist with OAB)
  - Urodynamic testing (NOT required for initial diagnosis)
  - Reserved for: failed treatment, unclear diagnosis, considering surgery
  - Detrusor overactivity: involuntary bladder contractions during filling
  - Cystoscopy if hematuria, recurrent UTIs, pelvic pain, or cancer risk factors
treatment:
  - First-line: behavioral therapies (try for 6-12 weeks before medications)
  - Bladder retraining/scheduled voiding
  - Void on schedule (every 2-3 hours) whether or not urge present
  - Gradually increase intervals by 15-30 min every 1-2 weeks
  - Goal: 3-4 hour intervals
  - Suppress urges using relaxation, distraction, pelvic floor contraction
  - 60-75% improvement
  - Pelvic floor muscle exercises (Kegels)
  - Quick pelvic floor contraction to suppress urge
  - 10 repetitions, 3 times daily
  - 50-60% improvement
  - Lifestyle and dietary modifications
  - Reduce caffeine, alcohol, carbonated drinks, artificial sweeteners, spicy/acidic foods
  - Adequate but not excessive fluid intake (don't restrict fluids)
  - Weight loss if overweight (10% weight loss reduces symptoms 50%)
  - Avoid evening fluids to reduce nocturia
  - Treat constipation (can worsen OAB)
  - Second-line: pharmacotherapy (if behavioral therapy insufficient)
  - Antimuscarinic/anticholinergic agents
  - Oxybutynin ER 5-15 mg daily
  - Tolterodine ER 2-4 mg daily
  - Solifenacin 5-10 mg daily
  - Darifenacin 7.5-15 mg daily
  - Fesoterodine 4-8 mg daily
  - Trospium 20 mg twice daily or ER 60 mg daily
  - Mechanism: block muscarinic receptors, reduce detrusor contractions
  - Efficacy: reduce urgency episodes 50-60%, reduce incontinence 60-70%
  - Side effects: dry mouth (most common), constipation, blurred vision, cognitive impairment
  - Caution in elderly (cognitive side effects), avoid if narrow-angle glaucoma, urinary retention
  - Beta-3 adrenergic agonist
  - Mirabegron 25-50 mg daily
  - Relaxes detrusor via beta-3 receptors
  - Similar efficacy, fewer anticholinergic side effects
  - Side effects: hypertension, tachycardia
  - Monitor blood pressure
  - Combination: antimuscarinic + mirabegron for refractory symptoms
  - Vaginal estrogen (postmenopausal women)
  - Estrogen cream 0.5 g intravaginally 2-3 times weekly
  - Improves urogenital atrophy
  - Third-line: invasive treatments (if 6-12 weeks behavioral + medication fail)
  - Onabotulinumtoxin A (Botox) intravesical injection
  - 100-200 units injected into detrusor muscle via cystoscopy
  - 70-80% improvement, lasts 6-12 months
  - Repeat injections needed
  - Side effects: urinary retention (6-10%), UTI, need for self-catheterization
  - Sacral neuromodulation (InterStim)
  - Implanted device stimulates S3 sacral nerve
  - 60-70% improvement in refractory OAB
  - Reversible, adjustable
  - Requires surgical implantation
  - Percutaneous tibial nerve stimulation (PTNS)
  - Weekly 30-min electrical stimulation sessions (12 weeks)
  - 60% improvement
  - Less invasive, but requires ongoing treatments
clinical_pearls:
  - "OAB affects 15-20% of adults, up to 30-40% over age 75 - major quality of life impact"
  - "Urgency is hallmark symptom - sudden compelling desire to urinate that is difficult to defer"
  - "OAB 'dry' (no leakage) and OAB 'wet' (with urgency incontinence) - same underlying condition"
  - "Bladder training alone improves symptoms in 60-75% - should always be tried first"
  - "Antimuscarinics effective (60-70% improvement) but high discontinuation rate (30-40% stop due to side effects)"
  - "Mirabegron causes less dry mouth but can elevate BP - monitor blood pressure"
  - "Avoid antimuscarinics in elderly with cognitive impairment - worsen dementia and delirium"
  - "Botox injections highly effective for refractory OAB but require cystoscopy and repeat treatments"
referrals:
  - Urology if refractory to behavioral therapy and first-line medications
  - Urology for consideration of Botox injections or neuromodulation
  - Urogynecology for women with pelvic organ prolapse contributing to symptoms
differentials:
  - Overactive bladder (urgency, frequency, nocturia, with/without urgency incontinence)
  - Urinary tract infection (dysuria, pyuria, fever - MUST RULE OUT)
  - Interstitial cystitis/bladder pain syndrome (suprapubic pain, urgency, frequency, no infection)
  - Diabetes mellitus (polyuria from hyperglycemia, glycosuria)
  - Bladder cancer (hematuria, irritative symptoms, older age, smoking history)
  - Neurogenic bladder (multiple sclerosis, spinal cord injury, Parkinson's disease)
  - Benign prostatic hyperplasia in men (obstructive and irritative LUTS)
  - Stress urinary incontinence (leakage with exertion, no urgency)
