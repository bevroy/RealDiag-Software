tree_id: OBGYN-PREECLAMPSIA
name: Preeclampsia
family: Obstetrics Gynecology
specialty: Obstetrics Gynecology
icd10:
- O14.90
- O14.12
snomed:
- '398254007'
urgency: medium
description: Comprehensive evaluation and management of Preeclampsia
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- New-onset hypertension after 20 weeks gestation (BP ≥140/90 on 2 occasions 4hr apart)
- Proteinuria (≥300 mg/24hr or protein/Cr ratio ≥0.3) OR end-organ dysfunction
- 'Severe features: BP ≥160/110, thrombocytopenia (<100K), Cr >1.1, elevated LFTs,
  pulmonary edema, visual symptoms, RUQ pain'
- Headache (severe, persistent), visual changes (scotomata, blurred vision)
- Right upper quadrant or epigastric pain (liver capsule distension)
- Sudden weight gain, edema (hands, face - not specific but common)
workup:
- BP monitoring (≥140/90 diagnostic)
- Urinalysis (protein), 24hr urine protein or protein/Cr ratio
- CBC (platelets), CMP (Cr, LFTs)
- Uric acid (elevated in preeclampsia)
- Fetal monitoring (NST, biophysical profile)
treatment:
- 'Guideline-based treatment options for Preeclampsia include:'
- Deliver if ≥37 weeks or severe features at ≥34 weeks (ACOG 2024)
- 'Magnesium sulfate: 4-6g IV load over 15-20min, then 2g/hr infusion (seizure prophylaxis)
  (ACOG 2024)'
- 'Antihypertensives if ≥160/110: Labetalol 20mg IV (double q10min) or hydralazine
  5-10mg IV (ACOG 2024)'
- Betamethasone 12mg IM x2 doses 24hr apart if <34 weeks (fetal lung maturity) (ACOG
  2024)
- 'Postpartum: Continue mag sulfate 24hr, monitor BP closely (can develop preeclampsia
  postpartum) (ACOG 2024)'
clinical_pearls:
- 'Delivery is definitive treatment: Only cure for preeclampsia'
- 'Severe preeclampsia: Deliver at ≥34 weeks, give betamethasone if <34 weeks'
- 'Magnesium sulfate: Seizure prophylaxis (prevents eclampsia), load 4-6g IV, then
  2g/hr'
- 'Blood pressure control: Labetalol or hydralazine if ≥160/110 (goal 140-150/90-100)'
- 'HELLP syndrome: Hemolysis, Elevated Liver enzymes, Low Platelets (severe form of
  preeclampsia)'
referrals:
- OB/GYN for all preeclampsia
- Maternal-fetal medicine if severe or <34 weeks
- ICU if HELLP syndrome, eclampsia, or severe features
differentials: []
trace:
  source: American College of Obstetricians and Gynecologists (ACOG) Practice Bulletins,
    Society for Maternal-Fetal Medicine (SMFM)
  version: 0.1.0
