tree_id: RHEUM-GOUT-PROPHYLAXIS
name: Gout Prophylaxis (Chronic Management)
family: Rheumatology
specialty: Rheumatology
chief_complaint: Recurrent gout attacks
description: Chronic uric acid lowering therapy prevents recurrent gout attacks and tophaceous deposits. Allopurinol first-line lowers uric acid below 6 mg/dL target, dramatically reduces attack frequency.
icd10: M1A.9
urgency: non-urgent

workup:
  - Indications for urate-lowering therapy (ULT): two or more gout attacks per year, tophi, chronic kidney disease, urolithiasis
  - Serum uric acid: goal below 6 mg/dL (below saturation point prevents crystal formation), check baseline before starting ULT
  - Single gout attack: treat acute attack, no prophylaxis needed unless risk factors (CKD, tophi)
  - Assess for secondary causes: thiazide diuretics, loop diuretics, low-dose aspirin, cyclosporine (consider alternatives)
  - Baseline labs before starting allopurinol: CBC, CMP (renal function), LFTs, HLA-B*5801 (if Asian descent, high-risk allele for severe hypersensitivity)
  - Imaging: ultrasound or X-ray if tophi suspected (subcutaneous deposits, joint erosions)

treatment:
  - Allopurinol (xanthine oxidase inhibitor) first-line: start 100 mg daily, titrate by 100 mg every 2-4 weeks until uric acid below 6 mg/dL
  - Target dose often 300-600 mg daily, maximum 800 mg daily
  - Start low go slow: reduces risk of precipitating acute gout flare during initiation
  - Renal dose adjustment: start 50 mg daily if CrCl below 30, titrate slowly
  - Anti-inflammatory prophylaxis during ULT initiation: colchicine 0.6 mg daily or NSAIDs for 3-6 months (prevents flares triggered by uric acid mobilization)
  - Febuxostat 40-80 mg daily: alternative xanthine oxidase inhibitor if allopurinol intolerant or contraindicated (may have cardiovascular risk)
  - Probenecid 500-1000 mg BID: uricosuric agent (increases renal excretion), only if normal renal function (CrCl above 50) and no history urolithiasis
  - Pegloticase IV infusion: recombinant uricase for severe refractory tophaceous gout (dramatically lowers uric acid, expensive, infusion reactions)
  - Lifestyle modifications: weight loss, limit alcohol (especially beer), limit high-purine foods (organ meats, shellfish, red meat), avoid high-fructose corn syrup
  - Hydration: maintain adequate hydration (helps uric acid excretion)
  - Medication review: discontinue thiazide diuretics if possible, consider alternative antihypertensives (losartan has mild uricosuric effect)
  - Monitor: check uric acid every 2-4 weeks during titration, then every 6 months once at goal
  - Allopurinol hypersensitivity syndrome: rare (1%) but severe reaction with rash, fever, eosinophilia, hepatitis, renal failure (higher risk in HLA-B*5801)

clinical_pearls:
  - Start ULT if two or more attacks per year, tophi, or CKD
  - Allopurinol first-line - start 100 mg daily, titrate to uric acid below 6 mg/dL
  - Start low go slow - prevents precipitating acute flare
  - Colchicine 0.6 mg daily prophylaxis x3-6 months during ULT initiation
  - Target uric acid below 6 mg/dL prevents crystal formation and attacks
  - Continue ULT lifelong - stopping causes uric acid rebound
  - Allopurinol hypersensitivity rare but severe - rash, fever, hepatitis, renal failure
  - Lifestyle: weight loss, limit alcohol, hydration

differentials:
  - Pseudogout (CPPD): calcium pyrophosphate crystals (positive birefringent vs negative in gout), chondrocalcinosis on X-ray
  - Septic arthritis: monoarticular hot joint with fever, synovial fluid WBC above 50000, positive culture
  - Rheumatoid arthritis: symmetric polyarthritis, morning stiffness, positive RF and anti-CCP
  - Osteoarthritis: chronic joint pain, Heberden and Bouchard nodes, no inflammatory markers

trace: |
  A 55-year-old man with history of 4 gout attacks in past 18 months (podagra affecting great toe) presented for discussion of prevention. Last attack 6 weeks ago treated with NSAIDs. Between attacks asymptomatic. On hydrochlorothiazide for hypertension. BMI 32 (obese), drinks 3-4 beers most nights. Serum uric acid 9.2 mg/dL (elevated). Creatinine 1.1 (normal renal function). Diagnosed with recurrent gout, candidate for urate-lowering therapy. Switched hydrochlorothiazide to losartan 50 mg daily (uricosuric effect). Counseled on lifestyle modifications: weight loss, reduce alcohol, hydration. Started allopurinol 100 mg daily with colchicine 0.6 mg daily for flare prophylaxis. At 4 weeks uric acid 7.8, increased allopurinol to 200 mg daily. At 8 weeks uric acid 6.8, increased to 300 mg daily. At 12 weeks uric acid 5.4 (at goal below 6), maintained allopurinol 300 mg daily. Discontinued colchicine prophylaxis after 6 months. Lost 15 pounds, reduced alcohol intake. At 12 months on allopurinol 300 mg daily, uric acid stable 5.2, NO gout attacks in past year (previously 4 attacks per year), dramatically improved quality of life. Continues allopurinol indefinitely.
