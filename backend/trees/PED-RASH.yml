tree_id: PED-RASH
name: Rash (Pediatric)
family: pediatrics
specialty: Pediatrics/Dermatology/Family Medicine
icd10: R21
snomed: 271807003
urgency: []
homeopathy: []
presentations:
  - Skin eruption or discoloration
  - Itching (pruritus)
  - Fever (may or may not be present)
  - Associated symptoms depend on etiology (cough, congestion, sore throat)
  - Recent illness or sick contacts
  - New medications or exposures
  - Distribution pattern (localized versus generalized)
  - Morphology varies (macular, papular, vesicular, petechial, purpuric)
workup:
  - Clinical history
  - Onset and duration
  - Distribution and progression
  - Associated symptoms (fever, itching, pain, respiratory, GI)
  - Recent illnesses (viral prodrome)
  - New medications (drug reaction)
  - Exposures (plants, chemicals, animals, new products)
  - Sick contacts or daycare outbreaks
  - Immunization status
  - Travel history
  - Personal or family history of atopy
  - Physical examination
  - Vital signs (fever, hemodynamic stability)
  - General appearance (well versus ill-appearing, toxic)
  - Rash characterization
  - Morphology (macules, papules, vesicles, pustules, petechiae, purpura)
  - Distribution (central versus peripheral, flexor versus extensor)
  - Configuration (discrete, confluent, linear, dermatomal)
  - Color (erythematous, violaceous, hypopigmented)
  - Assess for non-blanching lesions (petechiae/purpura - concern for meningococcemia)
  - Associated findings (mucous membrane involvement, conjunctivitis, lymphadenopathy)
  - Laboratory and diagnostic testing
  - Usually NOT needed for viral exanthems
  - Indications for testing
  - Ill-appearing or toxic child
  - Petechial or purpuric rash (blood culture, CBC, coagulation studies)
  - Suspicion of Kawasaki disease (ESR, CRP, CBC, metabolic panel, echocardiogram)
  - Concern for bacterial infection (strep test, culture)
  - Uncertain diagnosis with systemic symptoms
treatment:
  - Management based on etiology
  - Viral exanthems (most common) - supportive care
  - Roseola: antipyretics for fever, supportive care (self-limited)
  - Fifth disease: usually no treatment needed
  - Hand-foot-mouth: supportive care, pain relief for oral lesions
  - Varicella (chickenpox): supportive care, antihistamines for itching, acyclovir if high-risk
  - Bacterial infections
  - Scarlet fever: amoxicillin 50 mg/kg/day divided BID for 10 days
  - Impetigo: topical mupirocin or oral antibiotics (cephalexin)
  - Cellulitis: oral or IV antibiotics based on severity
  - Atopic dermatitis/eczema
  - Emollients and moisturizers (frequent application)
  - Topical corticosteroids (hydrocortisone 1% mild, triamcinolone 0.1% moderate)
  - Avoid triggers (fragrances, harsh soaps)
  - Contact dermatitis
  - Remove offending agent
  - Topical corticosteroids
  - Antihistamines for pruritus
  - Urticaria (hives)
  - Antihistamines (cetirizine, loratadine, diphenhydramine)
  - Avoid known triggers
  - Epinephrine if angioedema or anaphylaxis
  - Symptomatic treatment for most rashes
  - Antihistamines for pruritus (diphenhydramine, cetirizine)
  - Calamine lotion or colloidal oatmeal baths
  - Keep nails short to prevent excoriation
  - Cool compresses
  - Emergent conditions requiring immediate evaluation
  - Petechial/purpuric rash with fever (meningococcemia)
  - Stevens-Johnson syndrome (mucosal involvement, blistering, recent medication)
  - Kawasaki disease (fever greater than 5 days, conjunctivitis, mucositis, extremity changes)
clinical_pearls:
  - 'Most pediatric rashes are viral exanthems - self-limited, supportive care only'
  - 'Non-blanching petechial or purpuric rash with fever is meningococcemia until proven otherwise - medical emergency'
  - 'Roseola classic presentation: high fever 3-5 days, then rash as fever resolves (not contagious once rash appears)'
  - 'Scarlet fever: sandpaper-textured rash, strawberry tongue, circumoral pallor - treat with penicillin'
  - 'Kawasaki disease: fever greater than 5 days plus 4 of 5 criteria (rash, conjunctivitis, mucositis, extremity changes, lymphadenopathy)'
  - 'Drug rashes typically appear 7-14 days after medication started - common culprits: amoxicillin, sulfa drugs'
  - 'Varicella (chickenpox) is vesicular rash (dewdrop on rose petal) in crops with different stages present simultaneously'
  - 'Contact dermatitis has linear or geometric distribution matching exposure pattern (poison ivy linear streaks)'
referrals:
  - Emergency department if petechial/purpuric rash with fever, toxic appearance, or hemodynamic instability
  - Dermatology if uncertain diagnosis, severe eczema, or refractory rash
  - Cardiology if concern for Kawasaki disease (requires echocardiogram and IVIG treatment)
  - Allergy/immunology if recurrent urticaria or concern for anaphylaxis
differentials:
  - Viral exanthems (roseola, fifth disease, hand-foot-mouth, varicella)
  - Scarlet fever (sandpaper rash, strawberry tongue, positive strep test)
  - Atopic dermatitis (itchy, flexural surfaces, personal or family history atopy)
  - Contact dermatitis (geometric or linear pattern, history of exposure)
  - Urticaria (hives - transient raised wheals, pruritic, migratory)
  - Impetigo (honey-crusted lesions, face and extremities)
  - Drug reaction (recent medication, morbilliform or urticarial)
  - Kawasaki disease (fever greater than 5 days, conjunctivitis, mucositis, extremity changes)
  - Meningococcemia (petechiae/purpura, fever, ill-appearing, meningeal signs)
