tree_id: INFECTIOUS-HEPATITIS-C
name: Hepatitis C
family: Infectious Disease
specialty: Infectious Disease/Gastroenterology
chief_complaint: Often asymptomatic, found on screening, or symptoms of chronic liver disease
description: Viral infection of liver caused by hepatitis C virus (HCV) leading to chronic hepatitis
icd10: B18.2
snomed: 50711007
presentations:
  - Often asymptomatic for decades
  - Fatigue, malaise
  - Discovered on screening or elevated transaminases
  - Chronic liver disease, cirrhosis
  - Extrahepatic: cryoglobulinemia, glomerulonephritis
urgency: routine
workup:
  - Hepatitis C antibody (anti-HCV) screening test - indicates current or past infection
  - If positive, confirm with HCV RNA (PCR) - detects active infection
  - Positive HCV RNA confirms chronic hepatitis C (present greater than 6 months)
  - HCV genotype testing - determines treatment regimen (genotypes 1-6)
  - Genotype 1 most common in US (75%)
  - Baseline laboratory studies
  - Complete blood count (thrombocytopenia suggests cirrhosis)
  - Comprehensive metabolic panel (elevated transaminases, bilirubin)
  - ALT/AST typically 2-10x upper limit of normal, may be normal in early disease
  - Coagulation studies (PT/INR - synthetic liver function)
  - Hepatitis A and B serology (vaccinate if not immune)
  - HIV testing (coinfection common in IVDU)
  - Assess for cirrhosis
  - FIB-4 score or APRI score (non-invasive fibrosis markers)
  - Transient elastography (FibroScan) - measures liver stiffness
  - Greater than 12.5 kPa suggests cirrhosis
  - Liver biopsy if uncertainty (rarely needed now)
  - HCV viral load (HCV RNA quantitative) - baseline before treatment
  - Screening for hepatocellular carcinoma if cirrhosis (ultrasound plus AFP every 6 months)
  - Upper endoscopy for esophageal varices if cirrhosis
treatment:
  - Direct-acting antivirals (DAAs) - cure rate greater than 95%
  - Treatment duration typically 8-12 weeks depending on regimen and presence of cirrhosis
  - Pangenotypic regimens (effective against all genotypes)
  - Sofosbuvir/velpatasvir (Epclusa) 400/100 mg daily x 12 weeks
  - Glecaprevir/pibrentasvir (Mavyret) 100/40 mg (3 tablets) daily x 8-12 weeks
  - Sofosbuvir/velpatasvir/voxilaprevir (Vosevi) 400/100/100 mg daily x 12 weeks (for treatment-experienced)
  - Genotype-specific regimens
  - Ledipasvir/sofosbuvir (Harvoni) 90/400 mg daily x 12 weeks (genotype 1,4,5,6)
  - Elbasvir/grazoprevir (Zepatier) 50/100 mg daily x 12 weeks (genotype 1,4)
  - Treatment-naive vs treatment-experienced regimens differ
  - Monitor for drug interactions (DAAs have many interactions)
  - Check resistance-associated substitutions (RAS) if prior treatment failure
  - Sustained virologic response (SVR) = cure
  - Undetectable HCV RNA at 12 weeks post-treatment (SVR12)
  - Greater than 95% cure rate with modern DAAs
  - Lifestyle modifications
  - Alcohol abstinence (accelerates fibrosis)
  - Weight loss if obesity/fatty liver disease
  - Vaccinate against hepatitis A and B
  - If cirrhosis - HCC surveillance, variceal screening, monitor for decompensation
  - Liver transplantation for decompensated cirrhosis
clinical_pearls:
  - Most common bloodborne infection in US, 2.4 million infected
  - Transmission - injection drug use (most common), blood transfusion pre-1992, needlestick, birth to infected mother, less commonly sexual transmission
  - 75-85% develop chronic infection (most do NOT spontaneously clear)
  - Silent disease - 70-80% asymptomatic until advanced liver disease develops
  - Takes 20-30 years to develop cirrhosis in 20-30% of chronic cases
  - Once cirrhosis develops, 1-5% per year risk of hepatocellular carcinoma
  - CDC recommends one-time screening for all adults born 1945-1965 (baby boomers) - highest prevalence
  - Universal screening now recommended for all adults age 18 and older at least once
  - No vaccine available for hepatitis C (unlike hepatitis A and B)
  - Reinfection possible after cure - continue risk reduction counseling
  - SVR (cure) reduces but does not eliminate HCC risk in cirrhosis patients
differentials:
  - Hepatitis B (HBsAg positive, anti-HBc positive)
  - Alcoholic liver disease (AST:ALT ratio greater than 2:1, alcohol history)
  - Non-alcoholic fatty liver disease (metabolic syndrome, normal viral serology)
  - Autoimmune hepatitis (ANA, ASMA positive, elevated IgG, interface hepatitis on biopsy)
  - Hemochromatosis (elevated ferritin, transferrin saturation, HFE mutation)
  - Wilson disease (low ceruloplasmin, Kayser-Fleischer rings, age less than 40)
  - Drug-induced liver injury (temporal relationship to medication)
  - Alpha-1 antitrypsin deficiency (low AAT level, PiZZ genotype)
trace:
  - 58-year-old man presents to establish primary care, no acute complaints
  - Born in 1965, no significant past medical history
  - Admits to IV heroin use in his 20s (30 years ago), sober for 25 years
  - No history of blood transfusions, no tattoos
  - Physical exam - vitals normal, BMI 28
  - No jaundice, no stigmata of chronic liver disease, no spider angiomas
  - Abdomen soft, liver edge not palpable, no splenomegaly
  - Routine screening labs ordered including hepatitis C antibody per CDC guidelines (born 1945-1965)
  - Labs - anti-HCV positive (reactive)
  - Reflex HCV RNA positive 2.3 million IU/mL (confirms chronic active infection)
  - ALT 85 U/L (elevated), AST 72 U/L (elevated), alkaline phosphatase normal, bilirubin normal
  - Platelet count 165 K/uL (low-normal), albumin 4.0 g/dL, INR 1.0
  - HCV genotype 1a
  - Additional workup - hepatitis A and B serology (immune to A, never exposed to B)
  - HIV negative
  - FIB-4 score 2.1 (suggests significant fibrosis)
  - FibroScan ordered - liver stiffness 9.8 kPa (F2-F3 fibrosis, not cirrhotic)
  - Diagnosis - Chronic hepatitis C, genotype 1a, moderate fibrosis (F2-F3)
  - Hepatology referral for treatment
  - Started on glecaprevir/pibrentasvir (Mavyret) 3 tablets daily for 8 weeks
  - Medication review - no significant drug interactions
  - Counseled on alcohol abstinence, harm reduction if any current drug use
  - Vaccinated for hepatitis B (series of 3 vaccines)
  - Week 4 of treatment - HCV RNA undetectable
  - Completed 8 weeks of therapy, well tolerated, no side effects
  - Week 12 post-treatment (SVR12) - HCV RNA undetectable - CURED
  - Follow-up labs - ALT 32 U/L (normalized), AST 28 U/L (normalized)
  - Given non-cirrhotic status, no need for ongoing HCC surveillance
  - Annual monitoring of liver function recommended
  - Counseled on reinfection risk if returns to IV drug use
  - Outcome - Successfully cured of hepatitis C with 8-week DAA regimen
