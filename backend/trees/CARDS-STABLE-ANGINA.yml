tree_id: CARDS-STABLE-ANGINA
name: Stable Angina Pectoris
family: Cardiology
specialty: Cardiology
chief_complaint: Chest pressure with exertion
description: Predictable chest discomfort from myocardial ischemia during exertion or stress, relieved by rest or nitroglycerin within 5-10 minutes. Fixed coronary stenosis limiting blood flow during increased demand. Medical therapy or revascularization based on symptoms and anatomy.
icd10: I20.9
snomed: 194828000
presentations:
  - Predictable chest discomfort with exertion
  - Relieved by rest or nitroglycerin within 5-10 minutes
  - Substernal pressure, tightness, or heaviness
  - May radiate to arm, jaw, back
  - Not increasing in frequency or severity
urgency: urgent

workup:
  - Symptoms: predictable exertional chest discomfort
  - Character: pressure, tightness, squeezing, heaviness (not sharp or stabbing)
  - Location: substernal, may radiate to left arm, jaw, back, epigastrium
  - Triggers: exertion, emotional stress, cold weather, heavy meals
  - Duration: 2-10 minutes (if over 20 minutes consider ACS)
  - Relief: rest or sublingual nitroglycerin within 5-10 minutes (if not relieved consider ACS)
  - Reproducible: same level of exertion triggers symptoms (predictable)
  - Canadian Cardiovascular Society (CCS) angina classification:
  - Class I: angina with strenuous exertion only (walking uphill, climbing stairs)
  - Class II: slight limitation, angina with walking over 2 blocks or climbing over 1 flight
  - Class III: marked limitation, angina with walking 1-2 blocks or climbing 1 flight
  - Class IV: angina at rest or with minimal activity
  - Physical exam: often normal
  - May have S4 gallop (chronic hypertension, LV hypertrophy)
  - Signs of atherosclerosis: carotid bruits, diminished pulses, xanthelasmas
  - Resting ECG: often normal
  - May show Q waves (prior MI), LV hypertrophy, ST-T abnormalities
  - Cannot diagnose ischemia from resting ECG
  - Stress testing (functional assessment):
  - Exercise ECG: first-line if able to exercise and normal baseline ECG
  - Positive: ST depression over 1 mm, angina, hypotension, arrhythmias
  - Duke treadmill score: risk stratification
  - Exercise stress echo or nuclear: if baseline ECG abnormal (LBBB, LV hypertrophy, digoxin) or equivocal exercise ECG
  - Pharmacologic stress: if unable to exercise (dobutamine echo or vasodilator nuclear)
  - Coronary CT angiography: exclude CAD if low pretest probability
  - Coronary angiography: gold standard, if high-risk stress test or refractory symptoms
  - Echocardiogram: assess LV function, regional wall motion abnormalities (prior MI)

treatment:
  - Acute symptom relief:
  - Sublingual nitroglycerin: 0.4 mg Q5min up to 3 doses
  - If not relieved after 3 doses: call 911 (possible ACS)
  - Can use prophylactically before exertion
  - Medical therapy (reduce ischemia and improve prognosis):
  - Antiplatelet: aspirin 81 mg daily (reduce MI and death)
  - Beta blockers (first-line): metoprolol 50-200 mg daily or atenolol 50-100 mg daily
  - Reduce heart rate and myocardial oxygen demand
  - Proven mortality benefit post-MI
  - Target resting heart rate 55-60 bpm
  - Calcium channel blockers: if beta blockers contraindicated or inadequate
  - Diltiazem 180-360 mg daily or amlodipine 5-10 mg daily
  - Long-acting nitrates: isosorbide mononitrate 30-120 mg daily
  - Add to beta blocker or CCB if symptoms persist
  - Nitrate-free interval required (avoid tolerance)
  - Ranolazine: 500-1000 mg BID, add-on therapy if refractory symptoms
  - Statin: high-intensity (atorvastatin 40-80 mg or rosuvastatin 20-40 mg)
  - LDL goal under 70 mg/dL (or 50% reduction)
  - Reduce plaque progression and events
  - ACE inhibitor or ARB: if EF under 40%, diabetes, hypertension
  - Revascularization (PCI or CABG):
  - Indications:
  - Refractory symptoms despite optimal medical therapy
  - High-risk anatomy: left main stenosis, 3-vessel disease, proximal LAD stenosis
  - Large area of ischemia on stress test (over 10% myocardium)
  - Reduced LV function with viable myocardium
  - PCI: single or 2-vessel disease, less invasive
  - CABG: left main, 3-vessel disease, diabetes with multivessel disease (superior outcomes)
  - Risk factor modification (critical):
  - Smoking cessation: most important modifiable risk factor
  - Blood pressure: goal under 130/80
  - LDL cholesterol: under 70 mg/dL with high-intensity statin
  - Diabetes: HbA1c under 7%
  - Weight loss: BMI under 25
  - Exercise: 30-60 minutes moderate intensity most days
  - Diet: Mediterranean diet, limit saturated fat
  - Cardiac rehabilitation: structured exercise program

clinical_pearls:
  - Predictable exertional chest discomfort relieved by rest or nitroglycerin within 5-10 minutes
  - Stable pattern over weeks to months (if changing pattern consider unstable angina)
  - Beta blockers first-line for symptom relief and mortality benefit
  - High-intensity statin regardless of baseline LDL
  - Aspirin 81 mg daily reduces MI and death
  - Stress testing to assess ischemia and risk stratify
  - Revascularization if refractory symptoms or high-risk anatomy

differentials:
  - Unstable angina: crescendo pattern, rest angina, new-onset severe angina
  - GERD: burning, worse after meals, relieved by antacids
  - Musculoskeletal: reproducible with palpation, sharp pain
  - Costochondritis: tenderness at costochondral junctions

trace: |
  A 65-year-old man presented with 3 months of exertional chest pressure. Pressure in center of chest when walking uphill or climbing 2 flights of stairs (reproducible with same exertion level), lasts 5 minutes, resolves with rest (classic stable angina). No symptoms at rest. Denies radiation. CCS class II angina (slight limitation, angina with walking over 2 blocks). Risk factors: hypertension, hyperlipidemia, family history CAD (father MI at 58), former smoker (quit 5 years ago). Exam: BP 142/88, HR 72, lungs clear, S4 gallop (LV hypertrophy from chronic hypertension), no murmurs, distal pulses 2+ bilaterally. Resting ECG: normal sinus rhythm, LV hypertrophy by voltage criteria, no acute changes. Diagnosed with suspected stable angina. Pretest probability moderate (age, risk factors, typical symptoms). Exercise stress ECG: Bruce protocol, exercised 7 minutes (adequate), peak HR 135 (87% age-predicted max), chest pressure at 6 minutes, horizontal ST depression 2 mm in V4-V6 and II, III, aVF at peak exercise (positive for ischemia), ST depressions resolved at 3 minutes recovery. Duke treadable score: -5 (intermediate risk). Diagnosed with stable angina with positive stress test (extensive ischemia - inferior and lateral leads). Started medical therapy: aspirin 81 mg daily (antiplatelet), metoprolol 50 mg BID (beta blocker first-line), atorvastatin 80 mg daily (high-intensity statin), lisinopril 10 mg daily (hypertension and diabetes), sublingual nitroglycerin 0.4 mg as needed for angina. Counseled on risk modification: BP control, LDL goal under 70, weight loss, exercise. Given positive stress test with extensive ischemia and CCS class II symptoms, referred for coronary angiography. Angiography: severe 85% stenosis proximal LAD (explains anterior ischemia), 80% stenosis RCA (explains inferior ischemia), mild disease LCx. 2-vessel disease with proximal LAD involvement (high-risk anatomy). Discussed revascularization options: PCI (less invasive, good for 2-vessel disease) vs CABG (more durable, better for multivessel disease with diabetes). Patient chose PCI. Underwent PCI: drug-eluting stents to LAD and RCA, excellent results. Post-PCI angina-free. Continued aspirin 81 mg daily plus ticagrelor 90 mg BID (DAPT x12 months post-PCI), metoprolol 50 mg BID, atorvastatin 80 mg, lisinopril. At 2 weeks: no angina, able to climb stairs and walk uphill without symptoms (successful revascularization). At 3 months: LDL decreased from 135 to 62 mg/dL on statin (goal under 70 achieved), BP 128/78 (controlled), no angina, exercise tolerance excellent. Enrolled in cardiac rehab. At 12 months: completed DAPT, transitioned to aspirin monotherapy, remains angina-free, excellent functional status. Stable angina successfully managed with revascularization and optimal medical therapy.
