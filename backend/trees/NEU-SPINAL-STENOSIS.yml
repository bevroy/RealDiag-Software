tree_id: NEU-SPINAL-STENOSIS
name: Lumbar Spinal Stenosis
family: Neurology
specialty: Neurology
icd10:
- M48.06
snomed:
- '18347007'
urgency: medium
description: Comprehensive evaluation and management of Lumbar Spinal Stenosis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- back pain radiating to legs
- neurogenic claudication (pain worse with walking, standing)
- relief with sitting or leaning forward
- numbness in legs
- typically older adults
- 'Neurogenic claudication: Leg pain/weakness with walking, relieved by sitting/flexion'
- 'Shopping cart sign: Relief when leaning forward on cart (flexion opens canal)'
- Bilateral leg symptoms common (vs unilateral in disc herniation)
- 'Degenerative: Facet joint hypertrophy, ligamentum flavum thickening, disc bulge'
workup:
- 'MRI lumbar spine: Shows canal diameter, nerve root compression, ligamentum flavum
  thickening'
- 'Clinical diagnosis: Neurogenic claudication, relief with flexion, older age'
- 'X-ray lumbar spine: Standing AP/lateral shows degenerative changes, spondylolisthesis'
treatment:
- 'Guideline-based treatment options for Lumbar Spinal Stenosis include:'
- 'Physical therapy: Core strengthening, flexion-based exercises, aerobic conditioning
  (aquatic therapy ideal) (AAN 2024)'
- 'NSAIDs: Ibuprofen 600-800mg TID or naproxen 500mg BID for pain (AAN 2024)'
- 'Gabapentin: 300-900mg TID for neuropathic leg pain (AAN 2024)'
- 'Epidural steroid injection: If radicular symptoms prominent, provides 3-6 months
  relief in 50% (AAN 2024)'
- 'Surgical decompression (laminectomy): If failed conservative therapy >6 months
  and significant disability (AAN 2024)'
clinical_pearls:
- 'Neurogenic vs vascular claudication: Neurogenic (relieved by flexion, worse downhill),
  vascular (relieved by rest, worse uphill)'
- 'Conservative management first: 50-60% improve with PT, NSAIDs, epidural steroid
  injections'
- 'Red flags: Cauda equina (saddle anesthesia, bowel/bladder dysfunction, severe weakness)
  - emergency surgery'
- 'MRI lumbar spine: Shows stenosis degree, but correlation with symptoms variable
  (many asymptomatic stenosis)'
- 'Surgery: Laminectomy if conservative fails and significant functional impairment'
referrals:
- 'Neurosurgery or orthopedic spine if: Failed conservative therapy >6 months, significant
  disability, cauda equina'
- 'Physical therapy: First-line conservative management'
- 'Pain management: For epidural steroid injections'
differentials: []
