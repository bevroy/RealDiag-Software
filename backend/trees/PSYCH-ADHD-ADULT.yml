tree_id: PSYCH-ADHD-ADULT
name: Attention-Deficit/Hyperactivity Disorder (Adult)
family: psychiatry
specialty: Psychiatry, Primary Care
chief_complaint: Difficulty concentrating, inattention, impulsivity, restlessness
description: |
  ADHD in adults is a neurodevelopmental disorder characterized by persistent patterns of inattention and/or hyperactivity-impulsivity.
  Often diagnosed in childhood but may persist into adulthood or be newly diagnosed. Affects 4-5% of adults.
  Symptoms must have been present before age 12 and cause significant impairment in multiple settings.
icd10: F90.2
snomed: "406506008"
presentations:
  - Difficulty sustaining attention or concentrating
  - Easily distracted
  - Forgetfulness in daily activities
  - Difficulty organizing tasks
  - Procrastination
  - Frequently loses items
  - Difficulty completing tasks or projects
  - Restlessness or feeling "on edge"
  - Difficulty relaxing
  - Interrupts others or blurts out answers
  - Impulsive decision-making
  - Difficulty waiting turn
  - Academic or occupational underachievement
  - Relationship difficulties
  - Low self-esteem
urgency: Low
referrals:
  psychiatry:
    - Severe symptoms affecting function
    - Comorbid psychiatric conditions (depression, anxiety, substance use)
    - Need for comprehensive evaluation and medication management
  psychology:
    - Psychological testing for formal diagnosis
    - Cognitive behavioral therapy
workup:
  - Clinical diagnosis based on DSM-5 criteria
  - DSM-5 criteria - at least 5 symptoms of inattention and/or hyperactivity-impulsivity for 6+ months
  - Symptoms present before age 12
  - Symptoms present in 2+ settings (work, home, social)
  - Clear evidence symptoms interfere with functioning
  - Symptoms not better explained by another mental disorder
  - Structured assessment tools - Adult ADHD Self-Report Scale (ASRS), Conners Adult ADHD Rating Scales
  - Collateral history from family members or childhood records helpful
  - Rule out other causes - thyroid disorder (TSH), sleep disorders, substance use, medication side effects
  - Screen for comorbidities - depression (PHQ-9), anxiety (GAD-7), substance use
  - No objective diagnostic test (no blood test, brain scan)
  - Psychological testing may be helpful but not required
treatment:
  non_pharmacologic:
    - Psychoeducation about ADHD
    - Cognitive behavioral therapy (CBT) for ADHD-specific strategies
    - Organizational skills training
    - Time management strategies
    - Environmental modifications (reduce distractions, structured routines)
    - Regular exercise and adequate sleep
    - Mindfulness and meditation
  pharmacologic_stimulants_first_line:
    - Methylphenidate extended-release (Concerta) 18-54mg daily in AM
    - Methylphenidate (Ritalin) 5-20mg BID-TID
    - Amphetamine/dextroamphetamine (Adderall) 5-40mg daily (divided or XR)
    - Lisdexamfetamine (Vyvanse) 30-70mg daily in AM
    - Start low and titrate to effect
    - Monitor heart rate and blood pressure
    - Controlled substances - require monitoring and prescribing regulations
  pharmacologic_non_stimulants_second_line:
    - Atomoxetine (Strattera) 40-100mg daily (not a controlled substance)
    - Bupropion (Wellbutrin) 150-450mg daily (also treats depression)
    - Guanfacine XR (Intuniv) 1-4mg daily
    - Clonidine XR (Kapvay) 0.1-0.4mg daily
    - Non-stimulants have slower onset but useful if stimulants contraindicated or substance use concerns
  medication_considerations:
    - Stimulants are most effective (70-80% response rate)
    - Non-stimulants may take 4-6 weeks to see effect
    - Avoid stimulants in active substance use disorder, uncontrolled hypertension, cardiovascular disease
    - Screen for cardiac risk factors before starting stimulants
    - Regular follow-up to assess efficacy and side effects
clinical_pearls:
  - Diagnosis requires symptoms present before age 12, even if not formally diagnosed until adulthood
  - ADHD often coexists with depression, anxiety, substance use disorders
  - Many adults with ADHD have developed coping mechanisms but still struggle
  - Stimulant medications are highly effective but controlled substances
  - Non-pharmacologic interventions should always be part of treatment plan
  - ADHD is underdiagnosed in adults, especially in women
  - Symptoms may be less overt in adults (less physical hyperactivity, more internal restlessness)
  - Impairment in functioning is key to diagnosis, not just symptom presence
  - Beware of adults seeking stimulants for performance enhancement or diversion
differentials:
  - Major depressive disorder (poor concentration, low motivation)
  - Generalized anxiety disorder (difficulty concentrating due to worry)
  - Bipolar disorder (impulsivity, distractibility during mood episodes)
  - Substance use disorder (stimulants, cannabis)
  - Sleep disorders (fatigue, poor concentration)
  - Thyroid disorder (hyperthyroidism can mimic hyperactivity)
  - Medication side effects
  - Normal variation in attention and organizational skills
  - Adjustment disorder or stress reaction
trace:
  - 28-year-old presents with lifelong difficulty concentrating, frequent job changes, relationship problems. Reports being called "spacey" as a child. Review childhood report cards noting "does not pay attention." Meets DSM-5 criteria with 6 inattention symptoms present since childhood. PHQ-9 score 8 (mild depression). Diagnose Adult ADHD predominantly inattentive type. Start methylphenidate ER 18mg daily. Refer for CBT. Follow-up in 2 weeks. Titrate to 36mg daily with good response. Depression improves with treatment. Continues on maintenance therapy with regular monitoring.
citations:
  - DSM-5 Diagnostic Criteria for ADHD
  - American Academy of Pediatrics ADHD Guidelines (applicable to adults)
  - UpToDate - Psychiatry and Primary Care
