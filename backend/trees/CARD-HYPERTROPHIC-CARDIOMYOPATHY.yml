tree_id: CARD-HYPERTROPHIC-CARDIOMYOPATHY
name: Hypertrophic Cardiomyopathy
family: Cardiology
specialty: Cardiology
chief_complaint: Exertional dyspnea and chest pain
description: |
  Genetic disorder causing inappropriate left ventricular hypertrophy (LVH) without underlying cause. Autosomal dominant inheritance in 50%, sarcomere protein mutations.
  Most common cause of sudden cardiac death in young athletes. Left ventricular outflow tract (LVOT) obstruction in 70%.
icd10: I42.1
urgency: Moderate
workup:
  - Transthoracic echocardiogram (TTE) diagnostic - LV wall thickness greater than 15 mm (or greater than 13 mm with family history), asymmetric septal hypertrophy classic
  - Measure LVOT gradient at rest and with Valsalva - gradient greater than 30 mmHg obstructive HCM
  - Systolic anterior motion (SAM) of mitral valve causes obstruction and mitral regurgitation
  - ECG shows LVH with deep Q waves, T wave inversions, left atrial enlargement
  - Cardiac MRI - better defines extent and pattern of hypertrophy, identifies apical variant, detects late gadolinium enhancement (scar, higher arrhythmia risk)
  - 24-48 hour Holter monitor - detect non-sustained ventricular tachycardia (NSVT)
  - Exercise stress test - assess symptoms, blood pressure response (failure to increase or drop suggests high risk), provoke LVOT obstruction
  - Genetic testing for family screening
  - Risk stratification for sudden cardiac death - family history SCD, unexplained syncope, NSVT, LV wall thickness greater than 30 mm, abnormal BP response to exercise, extensive late gadolinium enhancement
treatment:
  - Beta-blockers first-line for symptoms - metoprolol 100-200mg daily, propranolol 160-320mg daily (negative inotrope reduces LVOT gradient)
  - Calcium channel blockers alternative - verapamil 240-480mg daily (avoid in severe obstruction)
  - Disopyramide for refractory symptoms despite beta-blocker (negative inotrope)
  - Avoid vasodilators, diuretics, digoxin (worsen obstruction)
  - Septal reduction therapy for severe symptoms refractory to medications with LVOT gradient greater than 50 mmHg - surgical septal myectomy (gold standard) or alcohol septal ablation
  - Implantable cardioverter-defibrillator (ICD) for sudden death prevention - indicated if cardiac arrest survivor, sustained VT, high-risk features (2 or more risk factors)
  - Lifestyle modifications - avoid dehydration, competitive sports, intense exercise (risk of sudden death)
  - Treat atrial fibrillation aggressively - rate control with beta-blocker, anticoagulation (high stroke risk)
  - Genetic counseling and family screening - first-degree relatives need echo and ECG
clinical_pearls:
  - Classic presentation exertional dyspnea, chest pain, syncope, palpitations - symptoms worse with dehydration or vasodilation
  - Physical exam shows sustained PMI, loud S4, harsh crescendo-decrescendo murmur at left sternal border (increases with Valsalva, standing; decreases with squatting, handgrip)
  - Bisferiens pulse (double peak) and brisk carotid upstroke
  - Sudden cardiac death risk highest in adolescents and young adults
  - Avoid nitrates, ACE inhibitors, afterload reducers (worsen obstruction)
  - Atrial fibrillation poorly tolerated (loss of atrial kick in stiff ventricle)
differentials:
  - Athletic heart (physiologic hypertrophy)
  - Hypertensive heart disease
  - Aortic stenosis
  - Infiltrative cardiomyopathy (amyloidosis)
  - Fabry disease
  - Glycogen storage disease
trace:
  - 19-year-old athlete with exertional dyspnea and presyncope during basketball → Exam shows harsh systolic murmur increasing with Valsalva → ECG shows LVH, deep septal Q waves → Echo shows asymmetric septal hypertrophy 22 mm, SAM, LVOT gradient 65 mmHg → Cardiac MRI confirms, shows late gadolinium enhancement → Holter shows NSVT → Family history of sudden death in uncle at age 30 → High-risk features (family history SCD, NSVT, extensive LGE) → Start metoprolol 100mg BID → Place ICD for primary prevention → Discontinue competitive sports → Symptoms improve, no arrhythmias on ICD interrogation
