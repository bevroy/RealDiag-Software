tree_id: DERM-INGROWN-TOENAIL
name: Ingrown Toenail (Onychocryptosis)
family: Dermatology
specialty: Podiatry
chief_complaint: Painful red swollen toe
description: Nail plate penetrates lateral nail fold causing pain, inflammation, and infection. Conservative management with proper nail trimming and cotton wick insertion for mild cases, partial nail avulsion with phenol matrixectomy curative for recurrent cases.
icd10: L60.0
snomed: 74430001
presentations:
  - Pain at lateral nail fold
  - Erythema, swelling
  - Purulent drainage if infected
  - Nail edge penetrating skin
  - Difficulty wearing shoes
  - Usually great toe
urgency: routine

referrals:
  emergency:
    - Suspected necrotizing fasciitis
    - Stevens-Johnson syndrome/TEN
    - Anaphylaxis
  urgent:
    - Suspected melanoma
    - Rapidly growing lesion
    - Severe drug reaction
    - Suspected malignancy
  routine:
    - Chronic dermatitis management
    - Acne unresponsive to treatment
    - Cosmetic concerns
    - Mole surveillance

workup:
  - Clinical diagnosis: pain, erythema, and swelling of lateral or medial nail fold, nail plate penetrating into soft tissue
  - Stages: Stage I (erythema, edema, pain), Stage II (infection, drainage, granulation tissue), Stage III (chronic with lateral nail fold hypertrophy)
  - Most common: great toe lateral nail fold (hallux)
  - Granulation tissue (proud flesh): red friable tissue overgrowing nail fold (Stage II-III)
  - Drainage: purulent if infected (Staphylococcus aureus most common)
  - Risk factors: improper nail trimming (cutting corners too short or rounding edges), tight-fitting shoes, hyperhidrosis, genetics (curved nails), trauma
  - Complications: cellulitis, abscess, osteomyelitis (rare, diabetes and immunocompromised)

treatment:
  - Conservative management (Stage I - mild inflammation, no infection):
  - Proper nail trimming: cut nails straight across (not rounded), leave edges slightly beyond soft tissue
  - Cotton wick insertion: gently lift lateral nail edge and insert small wisp of cotton under corner to separate nail from nail fold
  - Warm soaks: 15-20 minutes in warm soapy water TID-QID
  - Proper footwear: avoid tight shoes, wear open-toed sandals if possible
  - Success rate 50-70% for Stage I
  - Antibiotics: if infected (Stage II with purulent drainage or spreading cellulitis)
  - Topical mupirocin ointment BID if localized infection
  - Oral antibiotics: cephalexin 500 mg QID or dicloxacillin 500 mg QID x7-10 days if cellulitis
  - Partial nail avulsion (PNA): for Stage II-III or recurrent ingrown toenails
  - Under local anesthesia (digital block), remove lateral 3-5 mm strip of nail plate to nail matrix
  - Phenol matrixectomy: apply 88% phenol to exposed lateral nail matrix x2-3 minutes (destroys matrix cells, prevents nail regrowth)
  - Success rate 90-95%, recurrence rate only 5-10%
  - Alternative to phenol: electrocautery or surgical excision of lateral nail matrix
  - Recovery: 2-4 weeks, wear open-toed shoes, daily dressing changes with antibiotic ointment
  - Total nail avulsion: rarely indicated (only if entire nail abnormal or chronic paronychia)
  - Prevention: cut nails straight across, avoid tight shoes, keep feet dry

clinical_pearls:
  - Painful red swollen lateral nail fold with nail plate penetrating soft tissue
  - Conservative treatment (proper trimming, cotton wick, warm soaks) for Stage I
  - Partial nail avulsion with phenol matrixectomy 90-95% curative for recurrent cases
  - Cut nails straight across (not rounded) to prevent recurrence
  - Most common location: great toe lateral nail fold
  - Granulation tissue indicates chronic Stage II-III
  - Recurrence rate only 5-10% with phenol matrixectomy

differentials:
  - Paronychia: infection of nail fold without ingrown nail, acute tender erythema, responds to antibiotics
  - Subungual hematoma: trauma history, black-blue discoloration under nail, painful pressure
  - Subungual melanoma: pigmented lesion under nail, does not blanch, biopsy needed
  - Gout: acute monoarticular arthritis of great toe (podagra), affects joint not nail fold

trace: |
  A 25-year-old man presented with 4 days of increasing pain and swelling of right great toe. Difficulty wearing shoes. Prior history of ingrown toenails treated conservatively. Exam showed right great toe lateral nail fold erythema, edema, tenderness, nail plate embedded in lateral soft tissue, small amount of purulent drainage, granulation tissue present (Stage II). Diagnosed with ingrown toenail with infection. Given severity and recurrent nature, recommended partial nail avulsion with phenol matrixectomy for definitive treatment. Patient consented. Performed digital block with lidocaine 1% without epinephrine. Applied tourniquet to base of toe. Removed lateral 4 mm strip of nail plate to nail matrix. Applied 88% phenol to exposed lateral nail matrix x3 minutes to destroy matrix cells (prevents regrowth). Irrigated thoroughly with alcohol to neutralize phenol. Applied antibiotic ointment and dressing. Prescribed cephalexin 500 mg QID x7 days for infection. Pain control with ibuprofen 600 mg Q6H. Instructions: keep elevated x48 hours, daily warm soaks and dressing changes with mupirocin ointment, wear open-toed sandals. At 1 week pain resolved, drainage stopped, healing well. At 2 weeks granulation tissue resolved, lateral nail fold normal. At 6 weeks lateral nail growing normally (narrower nail plate as intended), no recurrence. At 1 year no recurrence, advised to cut nails straight across to prevent future ingrown toenails.

