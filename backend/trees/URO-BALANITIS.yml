tree_id: URO-BALANITIS
name: Balanitis (Glans Penis Inflammation)
family: urology
specialty: Urology/Infectious Disease/Dermatology
applies_to: male
icd10: N48.1
snomed: 44882003
urgency: []
homeopathy: []
presentations:
  - Erythema and swelling of glans penis
  - Pain, tenderness, or itching of glans
  - Discharge (purulent or malodorous)
  - Difficulty retracting foreskin (secondary phimosis from swelling)
  - Dysuria (pain with urination)
  - Ulceration or erosions on glans
  - Foul odor
  - Inguinal lymphadenopathy if severe infection
  - Balanoposthitis if foreskin also inflamed (combined inflammation of glans and foreskin)
  - Systemic symptoms rare (fever, malaise) unless severe infection
workup:
  - History
  - Onset and duration of symptoms
  - Recent sexual activity (STI risk)
  - Hygiene practices (poor hygiene major risk factor)
  - Diabetes mellitus status (predisposes to candida)
  - Use of irritants (soaps, condoms, spermicides)
  - Recurrent episodes
  - Immunosuppression (HIV, medications)
  - Physical examination
  - Inspect glans and foreskin
  - Erythema, edema, discharge
  - Ulceration, erosions, plaques
  - Foreskin retractability (may have secondary phimosis)
  - Inguinal lymph node examination
  - Urethral meatus examination
  - Laboratory and microbiologic testing
  - Gram stain and culture of discharge
  - Identifies bacterial pathogens (Streptococcus, Staphylococcus)
  - KOH preparation and fungal culture
  - Candida most common fungal cause (budding yeast, pseudohyphae)
  - STI testing if sexually active
  - Gonorrhea and chlamydia NAAT
  - Syphilis serology, HSV PCR if ulcers present
  - HIV testing if risk factors
  - Wet mount if Trichomonas suspected
  - Glucose or HbA1c if recurrent candidal balanitis (screen for diabetes)
  - Biopsy if chronic, refractory, or concern for malignancy
  - Plasma cell balanitis (Zoon's balanitis)
  - Lichen sclerosus, lichen planus
  - Squamous cell carcinoma
treatment:
  - Management based on etiology
  - General measures (all cases)
  - Improve hygiene: wash daily with water, pat dry
  - Avoid irritants (harsh soaps, fragrances)
  - Retract foreskin daily and clean if possible
  - Saline soaks or sitz baths
  - Consider circumcision if recurrent episodes
  - Candidal balanitis (most common)
  - Topical antifungals
  - Clotrimazole 1% cream twice daily for 7-14 days
  - Miconazole 2% cream twice daily for 7-14 days
  - Nystatin cream four times daily for 7-14 days
  - Oral fluconazole 150 mg single dose if severe or recurrent
  - Treat diabetes if present (improves outcomes)
  - Bacterial balanitis
  - Topical antibiotics if mild
  - Mupirocin 2% ointment three times daily for 7 days
  - Oral antibiotics if moderate to severe
  - Cephalexin 500 mg four times daily for 7 days
  - Amoxicillin-clavulanate 875/125 mg twice daily for 7 days
  - Anaerobic coverage (clindamycin, metronidazole) if foul odor suggests anaerobes
  - STI-related balanitis
  - Gonorrhea: ceftriaxone 500 mg IM single dose
  - Chlamydia: doxycycline 100 mg twice daily for 7 days OR azithromycin 1 g single dose
  - Syphilis: benzathine penicillin G 2.4 million units IM single dose (primary/secondary)
  - Herpes: valacyclovir 1 g twice daily for 7-10 days (primary episode)
  - Treat partner(s) if STI identified
  - Dermatologic causes
  - Lichen sclerosus: clobetasol 0.05% cream twice daily for 8-12 weeks, consider circumcision
  - Lichen planus: topical corticosteroids, immunosuppressants
  - Plasma cell balanitis (Zoon's): topical corticosteroids, circumcision curative
  - Psoriasis: topical corticosteroids, calcipotriene
  - Contact dermatitis: avoid irritant, topical corticosteroids
  - Refractory or recurrent balanitis
  - Consider circumcision (definitive treatment, prevents recurrence)
  - Re-evaluate for underlying conditions (diabetes, immunosuppression)
clinical_pearls:
  - "Candida is most common cause (30-35%), especially in diabetics and uncircumcised men"
  - "Poor hygiene and diabetes are major risk factors"
  - "Uncircumcised men 3-10 times more likely than circumcised"
  - "Recurrent candidal balanitis should prompt diabetes screening"
  - "Balanoposthitis is combined inflammation of glans AND foreskin"
  - "Zoon's balanitis (plasma cell balanitis): chronic, shiny red plaques, more common in older uncircumcised men, circumcision curative"
  - "Always consider STIs in sexually active patients"
  - "Circumcision is definitive treatment for recurrent balanitis (eliminates foreskin environment)"
  - "Fixed drug eruption can mimic balanitis - ask about recent medications"
referrals:
  - Urology if recurrent episodes despite appropriate treatment (consider circumcision)
  - Urology if concern for malignancy, chronic refractory lesions
  - Dermatology if dermatologic cause suspected (lichen sclerosus, lichen planus, psoriasis)
  - Infectious disease if atypical organism or immunocompromised patient
differentials:
  - Candidal balanitis (erythema, white plaques, satellite lesions, diabetics)
  - Bacterial balanitis (purulent discharge, Streptococcus/Staphylococcus)
  - STI-related (gonorrhea, chlamydia, syphilis chancre, herpes ulcers, HPV warts)
  - Contact dermatitis (irritant or allergic, recent exposure to soaps/condoms)
  - Lichen sclerosus (white scarred plaques, steroid-resistant, may cause phimosis)
  - Lichen planus (violaceous plaques, Wickham striae)
  - Psoriasis (well-demarcated red plaques, may lack typical scales on glans)
  - Plasma cell balanitis (Zoon's balanitis - shiny red/orange plaques, chronic)
  - Fixed drug eruption (dusky red plaque, recurs same site with drug re-exposure)
  - Squamous cell carcinoma (chronic non-healing lesion, older men, biopsy to confirm)
