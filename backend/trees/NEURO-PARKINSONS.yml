tree_id: NEURO-PARKINSONS
name: Parkinson's Disease Evaluation and Management
family: Neurology
specialty: Neurology, Movement Disorders
chief_complaint: Tremor, Rigidity, Slowness, Balance Problems
description: Comprehensive evaluation and management of Parkinson's disease
version: "1.0"
icd10: G20
author: RealDiag Clinical Team

entry_point: parkinsons_presentation

nodes:
  - id: parkinsons_presentation
    type: question
    text: "Presentation type?"
    options:
      - label: "Newly diagnosed or suspected Parkinson's disease"
        next: parkinsons_diagnosis
      - label: "Established Parkinson's with motor fluctuations/complications"
        next: parkinsons_complications

  - id: parkinsons_diagnosis
    type: diagnosis
    name: "Parkinson's Disease - New Diagnosis"
    icd10: "G20"
    urgency: medium
    workup:
      - Clinical diagnosis based on motor features
      - Cardinal features (need 2 of 4 for diagnosis)
      - Bradykinesia (slowness of movement) - REQUIRED plus one or more of following
      - Resting tremor (4-6 Hz, "pill-rolling", decreases with action)
      - Rigidity (cogwheel or lead-pipe)
      - Postural instability (late finding, not caused by visual, vestibular, cerebellar, or proprioceptive dysfunction)
      - Supportive features - Unilateral onset, progressive, excellent response to levodopa, persistent asymmetry
      - Red flags suggesting alternative diagnosis (Parkinson-plus syndromes)
      - Early falls, poor levodopa response, symmetric onset, rapid progression, early cognitive impairment, supranuclear gaze palsy (PSP), prominent autonomic failure (MSA), hallucinations before levodopa
      - Physical exam - Assess all cardinal features, gait (shuffling, reduced arm swing, freezing), facial expression (hypomimia/masked facies), handwriting (micrographia)
      - MRI brain - Usually NORMAL in Parkinson's (rule out structural causes, vascular parkinsonism, normal pressure hydrocephalus)
      - DaTscan (dopamine transporter imaging) - Shows reduced striatal dopamine uptake in Parkinson's, helps distinguish from essential tremor or drug-induced parkinsonism (not routinely needed if classic presentation)
      - Labs - Thyroid function (hypothyroidism can mimic), ceruloplasmin (Wilson disease if age <40), consider genetic testing if young-onset (<50 years)
      - Rule out drug-induced parkinsonism - Antipsychotics (especially typical), metoclopramide, prochlorperazine, valproic acid (stop offending agent, symptoms may take months to resolve)
    treatment:
      - Initiate symptomatic therapy when functional impairment occurs
      - No treatment needed if symptoms mild and not bothersome
      - Age <60-65 and good functional status - Start with dopamine agonist (delays motor complications) OR MAO-B inhibitor
      - Dopamine agonists - Pramipexole 0.125mg TID, titrate slowly to 1-1.5mg TID OR ropinirole 0.25mg TID, titrate to 3-8mg TID
      - Side effects - Nausea (take with food, domperidone if needed), orthostatic hypotension, somnolence, impulse control disorders (gambling, hypersexuality, compulsive shopping - warn patients), hallucinations
      - MAO-B inhibitors - Rasagiline 0.5-1mg daily OR selegiline 5mg BID
      - Modest symptomatic benefit, well-tolerated, may have neuroprotective effect
      - Age >65 or significant disability - Start with carbidopa/levodopa (most effective)
      - Immediate-release carbidopa/levodopa 25/100mg - Start 1 tab TID, titrate by 1 tab every week to effect (typical dose 25/100mg 3-6 tabs/day divided)
      - Gold standard, most effective symptomatic treatment
      - Side effects - Nausea (improves with time, take with food or add carbidopa 25mg alone), dyskinesias (involuntary movements develop after 5-10 years in ~50%)
      - Take 30-60 min before meals (protein competes for absorption)
      - Adjunctive medications
      - Anticholinergics (trihexyphenidyl, benztropine) - For tremor-predominant, age <70 (avoid in elderly - cognitive side effects)
      - Amantadine - Mild benefit for motor symptoms, treats dyskinesias
      - Non-motor symptoms (common, often overlooked)
      - Depression (30-40%) - SSRIs (sertraline, escitalopram), pramipexole also helps mood
      - Anxiety - SSRIs, benzodiazepines cautiously
      - Cognitive impairment - Rivastigmine (cholinesterase inhibitor) for PD dementia
      - Psychosis/hallucinations - Pimavanserin 34mg daily (5-HT2A inverse agonist, no worsening of motor symptoms) OR quetiapine 12.5-50mg (low dose), avoid typical antipsychotics
      - Constipation (very common) - Fiber, polyethylene glycol (Miralax)
      - Orthostatic hypotension - Midodrine, fludrocortisone, compression stockings, increase salt/fluid intake
      - Sleep disturbances (insomnia, REM sleep behavior disorder) - Melatonin, clonazepam
      - Neuroprotection - No proven disease-modifying therapy yet, exercise important (may slow progression)
      - Physical therapy - Gait training, balance exercises, LSVT (Lee Silverman Voice Treatment) for speech
      - Neurology or movement disorders specialist referral
      - Patient education - Progressive disease, symptoms worsen over years, medications manage symptoms but don't stop progression

  - id: parkinsons_complications
    type: diagnosis
    name: "Parkinson's Disease with Motor Complications"
    icd10: "G20"
    urgency: medium
    workup:
      - Motor fluctuations (develop in ~50% after 5 years of levodopa)
      - Wearing-off - Symptoms return before next levodopa dose (shortened duration of benefit)
      - On-off fluctuations - Unpredictable rapid switches between good motor function and severe symptoms
      - Delayed-on or no-on - Doses don't work or take too long to kick in
      - Dyskinesias - Involuntary movements (chorea, dystonia) at peak levodopa levels (peak-dose dyskinesias) or during rise/fall (biphasic dyskinesias)
      - Assess medication timing, food intake (protein delays levodopa absorption), and symptom patterns (use diary)
    treatment:
      - Wearing-off management
      - Increase levodopa frequency (shorter intervals, e.g., q3-4h instead of TID-QID)
      - Add COMT inhibitor - Entacapone 200mg with each levodopa dose (extends levodopa duration) OR switch to carbidopa/levodopa/entacapone combination (Stalevo)
      - Add MAO-B inhibitor (rasagiline, selegiline) if not already on
      - Add dopamine agonist if not already on (pramipexole, ropinirole)
      - Extended-release carbidopa/levodopa for nighttime symptoms
      - Dyskinesia management
      - Reduce levodopa dose (if possible without worsening off-time)
      - Amantadine 100mg TID (reduces dyskinesias)
      - Fractionalize levodopa (smaller more frequent doses)
      - Add adjunct medications to reduce levodopa requirement
      - Advanced therapies (for motor fluctuations refractory to oral medications)
      - Deep brain stimulation (DBS) - Subthalamic nucleus (STN) or globus pallidus interna (GPi) stimulation
      - Excellent for motor fluctuations and dyskinesias, reduces medication needs by 50%
      - Candidates - Good levodopa response, disabling motor fluctuations/dyskinesias, cognitively intact, no major psychiatric disease
      - Surgical risks - ICH, infection, hardware malfunction
      - Carbidopa/levodopa intestinal gel (Duopa) - Continuous jejunal infusion via PEG-J tube, bypasses gastric emptying issues, smooths fluctuations
      - Apomorphine - Subcutaneous injections (rescue for off periods) or continuous infusion pump
      - Freezing of gait (FOG)
      - Sudden inability to move feet (especially doorways, turns)
      - Cueing strategies (visual cues like lines on floor, auditory metronome)
      - MAO-B inhibitors may help
      - Avoid typical antipsychotics (worsen parkinsonism)
      - Falls - Physical therapy, walker, home safety evaluation
      - Parkinson's dementia - Rivastigmine 6-12mg daily (cholinesterase inhibitor)
      - Palliative care referral if advanced disease
