tree_id: CARD-AORTIC-DISSECTION
name: Acute Aortic Dissection
version: '1.0'
status: draft
family: Cardiology
specialty: Cardiology
secondary_specialties:
  - Cardiothoracic Surgery
  - Vascular Surgery
  - Emergency Medicine
urgency: emergent
urgency_explanation: 'Acute aortic syndrome: high early mortality; type A dissection is a surgical emergency (2022 ACC/AHA Aortic Disease Guideline §7.4.1).'
chief_complaint: 'Chest pain, back pain, abdominal pain: abrupt, severe, sharp, stabbing, tearing or ripping'
description: Acute aortic syndrome due to dissection of the aortic wall (Stanford type A involves the ascending aorta; type B does not). Evaluation and management per the 2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease.
applies_to:
  sex: null
  age_min: null
  age_max: null
