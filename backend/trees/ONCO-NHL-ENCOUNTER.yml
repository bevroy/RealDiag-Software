tree_id: ONCO-NHL-ENCOUNTER
name: Non-Hodgkin Lymphoma (Encounter)
family: Hematology Oncology
specialty: Hematology Oncology
chief_complaint: Painless lymphadenopathy, B symptoms
description: Diverse group of lymphoid malignancies originating from B-cells, T-cells, or NK cells, excluding Hodgkin lymphoma. Over 30 subtypes with varying aggressiveness and treatment approaches.
icd10: C85.90
snomed: 118600007
presentations:
  - Painless lymphadenopathy (cervical, axillary, inguinal)
  - B symptoms (fever, night sweats, weight loss greater than 10%)
  - Extranodal involvement (GI tract, skin, bone marrow, CNS)
  - Abdominal fullness or pain (hepatosplenomegaly)
  - Dyspnea, cough (mediastinal mass)
  - Superior vena cava syndrome (bulky mediastinal disease)
  - Presentation varies by subtype
urgency: urgent
referrals:
  emergency:
    - Superior vena cava syndrome
    - Spinal cord compression
    - Tumor lysis syndrome
    - Airway compromise from bulky disease
    - CNS involvement with seizures or focal deficits
  urgent:
    - Suspected lymphoma with biopsy confirmation needed
    - Rapidly enlarging lymph nodes
    - B symptoms present
    - Cytopenias from marrow involvement
  routine:
    - Surveillance visits
    - Post-treatment monitoring

workup:
  - NHL heterogeneous group - over 30 subtypes, broadly classified as indolent vs aggressive
  - Indolent NHL (follicular, marginal zone, CLL/SLL) - slow-growing, often incurable but long survival (years to decades)
  - Aggressive NHL (DLBCL, Burkitt, mantle cell) - rapidly progressive, potentially curable with intensive chemotherapy
  - Clinical presentation
  - Painless lymphadenopathy (80-90%) - cervical, supraclavicular, axillary, inguinal
  - Firm, rubbery, non-tender nodes
  - Progressive enlargement over weeks to months
  - B symptoms (30-40%) - fever (greater than 38°C), drenching night sweats, unintentional weight loss (greater than 10% in 6 months)
  - More common in aggressive subtypes, indicates advanced stage
  - Extranodal involvement (40%) - NHL can arise in any tissue
  - GI tract (stomach, small bowel) - MALT lymphoma associated with H. pylori
  - Waldeyer ring (tonsils, nasopharynx)
  - Skin - cutaneous T-cell lymphoma (mycosis fungoides)
  - CNS - primary CNS lymphoma (PCNSL) in immunosuppressed
  - Bone marrow, liver, spleen
  - Physical examination
  - Peripheral lymphadenopathy - assess size, texture, fixation, distribution
  - Waldeyer ring examination (tonsils, base of tongue)
  - Hepatomegaly, splenomegaly (advanced disease)
  - Skin lesions (cutaneous lymphoma)
  - Testicular mass (primary testicular lymphoma)
  - Laboratory studies
  - Complete blood count - anemia, thrombocytopenia (bone marrow involvement), lymphocytosis (leukemic phase)
  - Comprehensive metabolic panel - elevated LDH (tumor burden, prognostic marker), uric acid (tumor lysis risk)
  - Liver function tests (hepatic involvement)
  - Beta-2 microglobulin - prognostic marker (elevated worse prognosis)
  - HIV, hepatitis B and C serologies - infections increase NHL risk, reactivation risk with chemotherapy
  - Tissue diagnosis - excisional lymph node biopsy gold standard
  - Core needle biopsy acceptable if excisional not feasible
  - Fine needle aspiration (FNA) inadequate - need architecture for diagnosis
  - Histopathology - architecture (follicular vs diffuse), cell morphology
  - Immunohistochemistry - B-cell (CD19, CD20) vs T-cell (CD3, CD5) markers
  - Flow cytometry - immunophenotyping, clonality assessment
  - Cytogenetics and molecular testing - prognostic and therapeutic targets
  - FISH for specific translocations - t(14;18) (follicular), t(11;14) (mantle cell), MYC rearrangements (Burkitt)
  - Common NHL subtypes
  - Diffuse Large B-Cell Lymphoma (DLBCL, 30%) - most common, aggressive, potentially curable
  - Follicular lymphoma (20%) - indolent, incurable but long survival (10-15 years median)
  - Marginal zone lymphoma (MALT, 8%) - indolent, often extranodal (stomach, salivary glands, thyroid)
  - Mantle cell lymphoma (6%) - aggressive, intermediate prognosis (3-5 years median)
  - Burkitt lymphoma (2%) - highly aggressive, rapidly growing, often pediatric, endemic (Africa, EBV-associated) vs sporadic
  - Primary CNS lymphoma (PCNSL) - aggressive, associated with immunosuppression (HIV, transplant)
  - Staging - Ann Arbor system (I-IV)
  - Stage I - single lymph node region
  - Stage II - two or more lymph node regions, same side of diaphragm
  - Stage III - lymph nodes both sides of diaphragm
  - Stage IV - disseminated disease (bone marrow, liver, lung)
  - A (no B symptoms) vs B (fever, night sweats, weight loss)
  - Imaging
  - CT chest/abdomen/pelvis with contrast - lymphadenopathy, organomegaly, extranodal involvement
  - PET-CT - gold standard for staging, assesses metabolic activity, distinguishes active disease from fibrosis
  - MRI brain if CNS symptoms or high-risk histology (testicular, sinus, HIV)
  - Bone marrow biopsy - for staging if advanced stage or indolent lymphoma
  - Prognostic indices
  - International Prognostic Index (IPI) for DLBCL - age, LDH, performance status, stage, extranodal sites (0-5 points, higher worse)
  - FLIPI for follicular lymphoma
treatment:
  - Treatment varies widely by histology and stage
  - Diffuse Large B-Cell Lymphoma (DLBCL) - aggressive but curable
  - R-CHOP (rituximab + cyclophosphamide, doxorubicin, vincristine, prednisone) x 6 cycles (21 days each)
  - Cure rate 60-70% with R-CHOP
  - CNS prophylaxis (intrathecal chemotherapy) if high-risk (testicular, renal, adrenal, paranasal sinus involvement)
  - Radiation for localized stage I-II after chemotherapy
  - Refractory/relapsed - salvage chemotherapy + autologous stem cell transplant
  - CAR-T cell therapy (axicabtagene, tisagenlecleucel) for relapsed/refractory after 2+ lines
  - Follicular lymphoma - indolent, watch and wait vs treatment
  - Asymptomatic stage I-II - watch and wait (deferring treatment does not worsen survival)
  - Symptomatic or bulky disease - rituximab + chemotherapy (bendamustine or CHOP) +/- maintenance rituximab
  - Median survival 10-15 years, relapses common but typically respond to treatment
  - MALT lymphoma
  - Gastric MALT (H. pylori positive) - antibiotics first-line (PPI + amoxicillin + clarithromycin x 14 days) - 70% remission
  - H. pylori negative or non-gastric - rituximab +/- chemotherapy, radiation for localized disease
  - Mantle cell lymphoma - aggressive, poor prognosis
  - Young fit patients - intensive chemotherapy (R-HyperCVAD or Nordic regimen) + autologous stem cell transplant in first remission
  - Older patients - R-CHOP or bendamustine-rituximab + maintenance rituximab
  - BTK inhibitors (ibrutinib, acalabrutinib) for relapsed/refractory disease
  - Median survival 3-5 years, improving with newer therapies
  - Burkitt lymphoma - highly aggressive, requires urgent intensive chemotherapy
  - R-HyperCVAD or CODOX-M/IVAC (dose-adjusted EPOCH) - multiple cycles, includes CNS prophylaxis
  - Cure rate 70-90% if treated promptly
  - Tumor lysis syndrome prophylaxis mandatory (rasburicase, aggressive hydration, monitor electrolytes)
  - Primary CNS lymphoma (PCNSL)
  - High-dose methotrexate-based chemotherapy
  - Avoid steroids before biopsy (can cause lymphoma regression, non-diagnostic biopsy)
  - Radiation if chemotherapy insufficient (risk of neurotoxicity)
  - Stem cell transplant - autologous HSCT for eligible relapsed/refractory aggressive NHL in chemotherapy-sensitive disease
  - Novel therapies
  - CAR-T cell therapy - genetically engineered T-cells targeting CD19, for relapsed/refractory DLBCL, high-grade B-cell lymphoma
  - Bispecific antibodies - glofitamab (CD20xCD3), for relapsed/refractory DLBCL
  - Supportive care
  - Tumor lysis syndrome prophylaxis (allopurinol or rasburicase, hydration) for aggressive lymphomas with high tumor burden
  - G-CSF (pegfilgrastim) after chemotherapy to reduce neutropenia
  - PCP prophylaxis (trimethoprim-sulfamethoxazole) during chemotherapy
  - Surveillance after remission - physical exam, labs, CT or PET-CT every 3-6 months x 2 years, then annually
clinical_pearls:
  - NHL encompasses over 30 subtypes - treatment and prognosis vary dramatically by histology
  - DLBCL most common NHL (30%) - aggressive but curable with R-CHOP (60-70%)
  - Follicular lymphoma indolent - watch and wait if asymptomatic, not curable but excellent survival (10-15 years)
  - MALT lymphoma (gastric) often cured with H. pylori eradication (antibiotics alone) - only lymphoma curable with antibiotics
  - Mantle cell lymphoma aggressive with poor prognosis - median survival 3-5 years
  - Burkitt lymphoma medical emergency - doubling time 24 hours, requires urgent intensive chemo, high cure rate if treated
  - Excisional lymph node biopsy required - FNA inadequate for NHL diagnosis
  - PET-CT gold standard for staging NHL (distinguishes active disease from fibrosis)
  - LDH elevated in high tumor burden - strong prognostic marker
  - B symptoms (fever, night sweats, weight loss) indicate advanced disease, worse prognosis
  - CAR-T cell therapy revolutionized relapsed/refractory DLBCL - 40% durable remission
  - CNS prophylaxis required for high-risk NHL (testicular, renal, paranasal sinus) to prevent CNS relapse
  - Richter transformation - CLL/SLL transforms to DLBCL (poor prognosis)
  - Immunosuppression increases NHL risk - HIV (EBV-driven), post-transplant lymphoproliferative disorder
  - Extranodal NHL common (40%) - stomach, skin, CNS, bone, testis
  - Ann Arbor staging I-IV (I = single region, IV = disseminated)
differentials:
  - Hodgkin lymphoma (Reed-Sternberg cells, contiguous nodal spread, better prognosis)
  - Reactive lymphadenopathy (infection, autoimmune - tender, resolves with treatment)
  - Infectious mononucleosis (EBV) - atypical lymphocytes, positive heterophile antibody
  - Metastatic carcinoma to lymph nodes (breast, lung, melanoma - history of primary tumor)
  - Sarcoidosis (non-caseating granulomas, bilateral hilar lymphadenopathy)
  - Cat-scratch disease (Bartonella henselae) - regional lymphadenopathy after cat scratch
  - Kikuchi disease (histiocytic necrotizing lymphadenitis) - tender nodes, fever, self-limited
trace:
  - 62-year-old woman presents with 3-month history of progressively enlarging right neck mass
  - Initially thought it was a cyst, but continued to grow
  - No pain, no fever, no night sweats, no weight loss
  - Noticed another smaller lump in left armpit 2 weeks ago
  - No recent infections, no cat exposures, no travel
  - Past medical history - hypertension, no prior cancers
  - Medications - amlodipine 5 mg daily
  - Physical examination - 4 cm firm, rubbery, non-tender right cervical lymph node, 2 cm left axillary lymph node, no hepatosplenomegaly
  - Laboratory studies - CBC normal (WBC 6.8, Hgb 13.5, platelets 245), LDH 220 U/L (slightly elevated), CMP normal, HIV negative, hepatitis B/C negative
  - Excisional biopsy of right cervical lymph node performed
  - Pathology - effacement of nodal architecture by follicular proliferation of small cleaved cells (centrocytes) mixed with larger centroblasts, grade 1-2 (low-grade)
  - Immunohistochemistry - CD20+, CD10+, BCL-6+, BCL-2+ (abnormal)
  - FISH - t(14;18) translocation (BCL-2 rearrangement) positive
  - Diagnosis - Follicular Lymphoma, Grade 1-2
  - Staging workup - PET-CT shows multiple enlarged hypermetabolic lymph nodes in neck, axilla, mediastinum, retroperitoneum, splenomegaly, no bone marrow involvement on biopsy
  - Stage III-A (both sides of diaphragm, no B symptoms)
  - FLIPI score calculated - age 62 (greater than 60 = 1), LDH elevated (1), stage III (1), Hgb greater than 12 (0), nodes 5+ regions (1) = FLIPI 4 (intermediate-high risk)
  - Asymptomatic with low tumor burden - discussed watch and wait vs treatment
  - Patient prefers treatment given multiple sites of disease
  - Treatment plan - bendamustine 90 mg/m² IV days 1-2 + rituximab 375 mg/m² IV day 1, every 28 days x 6 cycles
  - Tolerated treatment well, mild fatigue and nausea
  - Post-treatment PET-CT - complete metabolic response, residual small nodes but not FDG-avid
  - Started maintenance rituximab 375 mg/m² IV every 8 weeks x 2 years (prolongs remission)
  - Surveillance - physical exam and labs every 3 months, CT scans every 6 months
  - At 2 years, remains in remission, completed maintenance rituximab
  - At 4 years, still in remission, surveillance continues

