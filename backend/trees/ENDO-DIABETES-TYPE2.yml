tree_id: ENDO-DIABETES-TYPE2
name: Type 2 Diabetes Mellitus
family: Endocrine-Metabolic
specialty: Endocrinology
chief_complaint: Elevated blood sugar
description: Chronic metabolic disorder characterized by hyperglycemia from insulin resistance and progressive beta-cell dysfunction

icd10: E11.9

urgency: routine

workup:
  - Diagnostic criteria (any one): fasting glucose ≥126 mg/dL (on two occasions), HbA1c ≥6.5%, 2-hour glucose ≥200 mg/dL during OGTT, random glucose ≥200 mg/dL with symptoms
  - Prediabetes: fasting glucose 100-125 mg/dL, HbA1c 5.7-6.4%, 2-hour OGTT 140-199 mg/dL (high risk for progression to diabetes)
  - Initial evaluation: HbA1c baseline and every 3 months until goal then every 6 months, lipid panel, creatinine/eGFR, urine albumin/creatinine ratio (screen for nephropathy), TSH (thyroid dysfunction common)
  - Screen for complications at diagnosis: dilated retinal exam (diabetic retinopathy), foot exam (neuropathy, peripheral vascular disease), cardiovascular risk assessment
  - Screen for atherosclerotic cardiovascular disease (ASCVD): history of CAD/stroke/PAD

treatment:
  - Lifestyle first-line: weight loss 5-10% if overweight, Mediterranean diet, regular exercise 150 min/week moderate-intensity, smoking cessation
  - Metformin first-line pharmacologic therapy: start 500 mg daily or BID with meals, titrate to 1000 mg BID (max 2550 mg/day), check B12 annually, contraindicated if eGFR <30
  - If HbA1c not at goal after 3 months on metformin, add second agent based on comorbidities:
  - ASCVD or high CV risk: add GLP-1 RA (semaglutide 0.5-1 mg SC weekly, dulaglutide 1.5 mg SC weekly - proven CV benefit) or SGLT2 inhibitor (empagliflozin 10-25 mg daily, dapagliflozin 10 mg daily - proven CV/renal benefit)
  - Heart failure or CKD: SGLT2 inhibitor preferred (reduces HF hospitalizations and CKD progression)
  - Weight loss priority: GLP-1 RA (semaglutide causes 10-15% weight loss)
  - Cost concern: sulfonylurea (glipizide 5-20 mg daily, glimepiride 1-8 mg daily) or DPP-4 inhibitor (sitagliptin 100 mg daily)
  - Insulin if HbA1c >10% or glucose >300 mg/dL or symptomatic hyperglycemia: basal insulin (glargine, degludec) start 10 units or 0.1-0.2 units/kg at bedtime, titrate to fasting glucose 80-130 mg/dL
  - Glycemic targets: HbA1c <7% general goal (individualize based on age, comorbidities, hypoglycemia risk), fasting glucose 80-130 mg/dL, postprandial <180 mg/dL
  - Complication screening: annual dilated eye exam, annual foot exam, annual urine albumin/creatinine, monitor eGFR
  - Cardiovascular risk reduction: statin for age >40 or ASCVD or LDL >70, aspirin 75-162 mg daily if ASCVD, BP target <130/80

clinical_pearls:
  - Type 2 diabetes from insulin resistance + beta-cell dysfunction (vs type 1 autoimmune beta-cell destruction)
  - Metformin first-line unless contraindicated - proven CV benefit, weight neutral, low hypoglycemia risk
  - GLP-1 RA and SGLT2 inhibitors have proven ASCVD and renal benefits beyond glucose lowering
  - SGLT2 inhibitors reduce HF hospitalizations and slow CKD progression - preferred if HF or CKD
  - Individualize HbA1c goals: <7% general, <6.5% if young/healthy, <8% if elderly/limited life expectancy
  - Screen for complications at diagnosis (retinopathy, nephropathy, neuropathy) - often present at diagnosis
  - Diabetes increases ASCVD risk 2-4 fold - aggressive risk factor management

differentials:
  - Type 1 diabetes (autoimmune beta-cell destruction, insulin deficiency, young age at onset, lean body habitus, positive GAD65/IA-2/ZnT8 antibodies, low/absent C-peptide)
  - MODY (monogenic diabetes, young age <25, strong family history, lean, often misdiagnosed as type 1, genetic testing)
  - Secondary diabetes (medications - glucocorticoids/thiazides/atypical antipsychotics, pancreatitis, pancreatic cancer, hemochromatosis, Cushing syndrome, acromegaly)
  - Prediabetes (fasting glucose 100-125, HbA1c 5.7-6.4%, high risk for progression, lifestyle intervention prevents diabetes)

trace:
  - 52-year-old obese man (BMI 34) presents for health maintenance, no symptoms but concerned about family history (father and brother with diabetes)
  - Exam: BP 138/88, waist circumference 44 inches, acanthosis nigricans posterior neck (insulin resistance), normal foot exam with intact monofilament sensation
  - Labs: fasting glucose 156 mg/dL, HbA1c 7.8%, lipid panel total cholesterol 220, LDL 145, HDL 38, triglycerides 185, creatinine 0.9 (eGFR >90), urine albumin/creatinine 18 mg/g (normal <30), TSH 2.1 mIU/L
  - Diagnosis: type 2 diabetes mellitus (fasting glucose ≥126, HbA1c ≥6.5%), dyslipidemia, overweight/obesity, prehypertension
  - Counseling: diet (reduce simple carbs/sugars, increase vegetables/fiber), exercise (30 min moderate 5 days/week), weight loss goal 10% (current 240 pounds, goal 216)
  - Started metformin 500 mg BID with meals, atorvastatin 20 mg nightly (ASCVD risk reduction), aspirin 81 mg daily
  - Ophthalmology referral for dilated eye exam (no retinopathy found)
  - 3 months: weight 225 pounds (15-pound loss), BP 128/82, HbA1c 7.1% (improved but not at goal), fasting glucose 118 mg/dL
  - Increased metformin to 1000 mg BID, added empagliflozin 10 mg daily (SGLT2 inhibitor - CV/renal benefit)
  - 6 months: weight 218 pounds, HbA1c 6.4% (at goal), fasting glucose 102 mg/dL, LDL 88 mg/dL (at goal), excellent tolerability
  - 1 year: sustained HbA1c 6.3%, weight 215 pounds (25-pound loss from baseline), BP 122/78, repeat urine albumin/creatinine normal, foot exam normal, continues maintenance therapy, annual eye exam scheduled
