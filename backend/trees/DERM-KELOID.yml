tree_id: DERM-KELOID
name: Keloid
family: Dermatology
specialty: Dermatology
chief_complaint: Raised scar growing beyond original wound
description: Abnormal wound healing with excessive collagen deposition causing raised firm scar extending beyond original injury boundaries. Intralesional corticosteroid injections first-line treatment, surgical excision alone has high recurrence rate (50-80%), combination therapy most effective.
icd10: L91.0
snomed: 40791000
presentations:
  - Raised, firm scar extending beyond original injury
  - Shiny, hairless surface
  - Pruritus, tenderness
  - Pink to dark brown color
  - Predilection in darker skin types
  - Ears, chest, shoulders common sites
urgency: non-urgent

referrals:
  emergency:
    - Suspected necrotizing fasciitis
    - Stevens-Johnson syndrome/TEN
    - Anaphylaxis
  urgent:
    - Suspected melanoma
    - Rapidly growing lesion
    - Severe drug reaction
    - Suspected malignancy
  routine:
    - Chronic dermatitis management
    - Acne unresponsive to treatment
    - Cosmetic concerns
    - Mole surveillance

workup:
  - Clinical diagnosis: firm, raised, smooth, shiny scar extending beyond boundaries of original wound
  - Distinguishes from hypertrophic scar: keloid extends beyond original wound (hypertrophic stays within wound boundaries)
  - Appearance: firm rubbery papule or plaque, pink to dark brown, smooth surface, may be tender or pruritic
  - Growth: continues to grow over months to years (vs hypertrophic scar stabilizes within 6 months)
  - Common sites: earlobes (piercings), chest, shoulders, upper back (areas of high skin tension)
  - Triggers: trauma (surgery, piercings, acne, burns, vaccinations), may arise spontaneously
  - Risk factors: African, Asian, or Hispanic descent (10-15 times higher risk), age 10-30 years, family history, location (chest, shoulders, earlobes)
  - Symptoms: cosmetic concern, tenderness, pruritus, occasionally painful
  - Natural history: continues to enlarge over time if untreated, rarely regresses spontaneously
  - No biopsy needed: clinical diagnosis, biopsy may worsen keloid

treatment:
  - Intralesional corticosteroid injection (first-line): triamcinolone 10-40 mg/mL
  - Inject into center and periphery of keloid until blanching occurs
  - Repeat every 4-6 weeks until flattening (typically requires 3-6 injections)
  - Response rate 50-90% (flattening, softening, decreased symptoms)
  - Side effects: skin atrophy, hypopigmentation, telangiectasias
  - Surgical excision: high recurrence rate 50-80% if used alone
  - Must combine with adjuvant therapy: intralesional steroids starting 2-4 weeks post-op OR radiation OR pressure therapy
  - Excision plus immediate intralesional steroid at closure reduces recurrence to 20-30%
  - Cryotherapy: liquid nitrogen applied to keloid surface (causes tissue destruction)
  - 2-3 freeze-thaw cycles every 3-4 weeks, may cause hypopigmentation (problematic in dark skin)
  - Often combined with intralesional steroids
  - Silicone gel sheeting: topical silicone applied daily x12-24 hours for 3-6 months
  - Modest benefit for prevention and small keloids, well-tolerated, over-the-counter
  - 5-Fluorouracil injection: chemotherapy agent injected intralesionally
  - Weekly injections, often combined with triamcinolone (more effective than either alone)
  - Laser therapy: pulsed dye laser targets blood vessels, reduces redness and bulk
  - Multiple sessions required, adjuvant to other therapies
  - Radiation therapy: after surgical excision reduces recurrence to 10-20%
  - Reserved for problematic keloids due to radiation risk
  - Prevention: avoid elective procedures and piercings in keloid-prone individuals, pressure therapy for 6-12 months after surgery or burns

clinical_pearls:
  - Raised firm scar extending beyond original wound boundaries
  - Distinguish from hypertrophic scar: keloid grows beyond wound, hypertrophic stays within
  - Much more common in African, Asian, Hispanic descent (10-15 times higher risk)
  - Intralesional triamcinolone first-line - repeat every 4-6 weeks x3-6 sessions
  - Surgical excision alone has 50-80% recurrence - must combine with adjuvant therapy
  - Common sites: earlobes (piercings), chest, shoulders, upper back
  - Prevent by avoiding elective procedures in keloid-prone individuals
  - Combination therapy most effective (surgery plus steroids or radiation)

differentials:
  - Hypertrophic scar: raised scar confined to original wound boundaries, stabilizes within 6 months, may regress
  - Dermatofibroma: firm dermal nodule, dimples when pinched, not related to trauma
  - Dermatofibrosarcoma protuberans: slow-growing firm nodule or plaque, malignant, requires wide excision and Mohs surgery

trace: |
  A 24-year-old African American woman presented with 18 months of growing raised scar on chest after acne lesion. Cosmetically bothersome, occasionally itchy. Exam showed firm, smooth, shiny pink plaque 3 cm diameter on mid-chest extending well beyond original acne site (keloid extending beyond wound boundaries vs hypertrophic scar). Tender to palpation. Diagnosed with keloid. Discussed treatment options: intralesional corticosteroid injections first-line, surgical excision high recurrence without adjuvant therapy. Patient chose conservative approach with steroid injections. Performed intralesional triamcinolone 40 mg/mL injection into multiple sites across keloid until blanching. Significant pain during injection (warned patient). At 6 weeks keloid softer and flatter, reduced 30%, tenderness improved. Second injection performed. At 12 weeks additional 30% reduction. Third injection performed. At 18 weeks keloid 70% flattened, much softer, no tenderness, cosmetically improved significantly. Patient very satisfied. At 24 weeks stable, no further treatment needed. Counseled to avoid elective piercings or procedures on chest given keloid-prone tendency. Advised that if keloid recurs or enlarges can repeat injections. At 1 year stable, no recurrence.
