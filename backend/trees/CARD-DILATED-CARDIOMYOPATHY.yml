tree_id: CARD-DILATED-CARDIOMYOPATHY
name: Dilated Cardiomyopathy (DCM)
family: Cardiology
specialty: Cardiology
icd10:
- I42.0
snomed:
- '195021003'
urgency: medium
description: Comprehensive evaluation and management of Dilated Cardiomyopathy (DCM)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Progressive dyspnea, orthopnea, lower extremity edema (heart failure symptoms)
- Fatigue, reduced exercise tolerance
- May present with arrhythmias (AFib, VT) or thromboembolic events
- 'Echocardiogram: LV dilation, reduced EF (<40%), global hypokinesis'
- 'Etiologies: Idiopathic (most common), ischemic, alcohol, viral (coxsackie, parvovirus),
  peripartum, genetic'
workup:
- Echocardiogram (LV size, EF, wall motion)
- Coronary angiography (rule out ischemic etiology)
- ECG (nonspecific ST-T changes, LBBB)
- BNP, troponin
- 'Consider: Cardiac MRI (fibrosis assessment), genetic testing, viral serologies'
treatment:
- 'Guideline-based treatment options for Dilated Cardiomyopathy (DCM) include:'
- 'Guideline-directed medical therapyfor HFrEF: (ACC/AHA 2023)'
- Sacubitril-valsartan 24/26mg BID → 97/103mg BID (ACC/AHA 2023)
- 'Beta-blocker: Carvedilol 3.125mg BID → 25mg BID (ACC/AHA 2023)'
- Spironolactone 12.5-25mg daily (ACC/AHA 2023)
- 'SGLT2 inhibitor: Dapagliflozin 10mg daily (ACC/AHA 2023)'
- Diuretics for volume management, avoid alcohol, sodium restriction (ACC/AHA 2023)
clinical_pearls:
- 'Ischemic vs nonischemic: Coronary angiography to differentiate'
- 'Alcohol-induced DCM: Complete abstinence may reverse in 50%'
- 'Peripartum cardiomyopathy: Last month pregnancy to 5 months postpartum'
- Consider genetic testing if family history or age <50
- 'High risk for sudden cardiac death: ICD if EF ≤35%'
referrals:
- Cardiology for all new diagnoses
- Heart failure clinic
- Consider genetic counseling if familial
- Advanced HF team if refractory (LVAD, transplant)
differentials: []
trace:
