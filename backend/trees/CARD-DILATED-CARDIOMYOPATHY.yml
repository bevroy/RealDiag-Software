tree_id: CARD-DILATED-CARDIOMYOPATHY
name: Dilated Cardiomyopathy (DCM)
family: cardiovascular
specialty: Cardiology
chief_complaint: Progressive dyspnea, fatigue, lower extremity edema
description: Disease of heart muscle causing ventricular dilation and impaired systolic function (reduced ejection fraction)
icd10: I42.0
urgency: routine-to-urgent
workup:
  - Clinical presentation - heart failure symptoms
  - Dyspnea on exertion progressing to dyspnea at rest
  - Orthopnea, paroxysmal nocturnal dyspnea
  - Fatigue, exercise intolerance
  - Lower extremity edema
  - Abdominal distension (ascites if severe)
  - Chest pain (atypical, not typical angina)
  - Palpitations (arrhythmias common)
  - Syncope or near-syncope (ventricular arrhythmias)
  - Physical examination
  - Vitals - tachycardia, hypotension if advanced, elevated JVP
  - Cardiac - S3 gallop (volume overload), S4 (decreased compliance)
  - Displaced PMI (laterally and inferiorly from ventricular dilation)
  - Mitral regurgitation murmur (secondary to annular dilation)
  - Lungs - crackles (pulmonary edema)
  - Extremities - pitting edema, cool extremities (poor perfusion)
  - Laboratory studies
  - BNP or NT-proBNP - elevated (proportional to severity)
  - BNP greater than 400 pg/mL or NT-proBNP greater than 900 pg/mL suggests heart failure
  - Complete blood count (rule out anemia)
  - Comprehensive metabolic panel - assess renal function, electrolytes
  - Thyroid function tests (hypo/hyperthyroidism can cause DCM)
  - Iron studies (hemochromatosis), ferritin
  - HIV testing (HIV cardiomyopathy)
  - Troponin (may be mildly elevated in acute decompensation)
  - Echocardiography - KEY diagnostic test
  - Left ventricular dilation (LV end-diastolic dimension greater than 55-60 mm)
  - Reduced left ventricular ejection fraction (LVEF less than 40%)
  - Global hypokinesis (reduced wall motion throughout)
  - Increased LV end-systolic and end-diastolic volumes
  - Secondary mitral regurgitation (functional MR from annular dilation)
  - May have LV thrombus (especially if EF very low)
  - Electrocardiogram
  - Sinus tachycardia, atrial fibrillation common
  - Left ventricular hypertrophy, poor R-wave progression
  - Left bundle branch block (30-40% of patients)
  - Q waves may be present without prior MI
  - Ventricular arrhythmias
  - Chest X-ray
  - Cardiomegaly (cardiothoracic ratio greater than 0.5)
  - Pulmonary vascular congestion, pleural effusions
  - Cardiac MRI - if diagnosis uncertain or to assess etiology
  - Quantifies LV volumes and function precisely
  - Late gadolinium enhancement (scar pattern helps identify etiology)
  - Mid-wall fibrosis pattern suggests non-ischemic DCM
  - Coronary angiography - to rule out ischemic cardiomyopathy
  - Indicated if risk factors for CAD or age greater than 40
  - Exclude coronary disease as cause of LV dysfunction
  - Endomyocardial biopsy - rarely needed
  - Consider if suspect specific etiology (sarcoidosis, giant cell myocarditis, hemochromatosis)
  - Genetic testing - if family history or suspect familial DCM
  - 30-40% of idiopathic DCM has genetic basis
  - Screen first-degree relatives with echocardiography
treatment:
  - Identify and treat underlying cause if possible
  - Alcohol cessation (alcoholic cardiomyopathy - may improve with abstinence)
  - Thiamine supplementation if nutritional deficiency
  - Control thyroid disease, treat HIV, remove cardiotoxic drugs (chemotherapy, cocaine)
  - Heart failure with reduced ejection fraction (HFrEF) medical therapy - GDMT
  - ACE inhibitors or ARBs - reduce mortality, improve symptoms
  - Lisinopril 5-40 mg daily, enalapril 10-20 mg BID
  - Losartan 25-100 mg daily, valsartan 80-160 mg BID
  - ARNI (angiotensin receptor-neprilysin inhibitor) - sacubitril-valsartan 24/26 to 97/103 mg BID
  - Superior to ACE/ARB if tolerated, reduce mortality and hospitalization
  - Beta-blockers (evidence-based beta-blockers only)
  - Carvedilol 3.125-25 mg BID, metoprolol succinate 12.5-200 mg daily, bisoprolol 1.25-10 mg daily
  - Reduce mortality, improve EF
  - Start low dose, titrate slowly every 2 weeks
  - Mineralocorticoid receptor antagonists (MRA)
  - Spironolactone 12.5-25 mg daily, eplerenone 25-50 mg daily
  - Reduce mortality if EF less than 35% and NYHA class II-IV
  - Monitor potassium and renal function
  - SGLT2 inhibitors - dapagliflozin 10 mg daily, empagliflozin 10 mg daily
  - Reduce hospitalization and mortality regardless of diabetes status
  - Diuretics - for symptom relief (fluid overload)
  - Furosemide 20-240 mg daily, torsemide 10-100 mg daily
  - Titrate to relieve congestion
  - Monitor electrolytes and renal function
  - Digoxin 0.125-0.25 mg daily - for rate control in AF, may reduce hospitalizations
  - Anticoagulation
  - Warfarin or DOAC if atrial fibrillation
  - Consider if EF less than 30% even in sinus rhythm (risk of LV thrombus)
  - Device therapy
  - Implantable cardioverter-defibrillator (ICD) - if EF less than or equal to 35% despite 3 months optimal medical therapy
  - Primary prevention of sudden cardiac death
  - Cardiac resynchronization therapy (CRT) - if LVEF less than or equal to 35%, NYHA II-IV, and LBBB with QRS greater than 150 ms
  - Biventricular pacing improves synchrony, symptoms, and mortality
  - Advanced therapies for end-stage disease
  - Inotropic support - dobutamine, milrinone (temporary, bridge to transplant)
  - Mechanical circulatory support - left ventricular assist device (LVAD)
  - Heart transplantation - definitive treatment for refractory disease
  - Lifestyle modifications
  - Sodium restriction (less than 2-3 g daily)
  - Fluid restriction (less than 2 L daily if severe)
  - Daily weights (alert MD if increase greater than 2-3 pounds)
  - Avoid alcohol
  - Cardiac rehabilitation
clinical_pearls:
  - Most common cardiomyopathy, prevalence 1 in 250-500, mean age 50 years, male-to-female ratio 3:1
  - Causes - idiopathic (50%), ischemic (25%), familial/genetic (30-40%), alcohol (3-5%), viral myocarditis, chemotherapy (anthracyclines), peripartum, tachycardia-induced
  - GDMT (guideline-directed medical therapy) cornerstone - ACE/ARB or ARNI, beta-blocker, MRA, SGLT2 inhibitor
  - Medical therapy can improve EF - 30-40% of patients have significant improvement in EF with GDMT
  - Left bundle branch block poor prognostic sign but CRT can dramatically improve outcomes
  - Sudden cardiac death risk high (up to 30-50% of deaths) - ICD indicated for primary prevention
  - 5-year mortality 50% without treatment, significantly improved with GDMT and devices
  - Atrial fibrillation common (20-30%), worsens prognosis
  - Family screening important - echo first-degree relatives (30-40% genetic)
differentials:
  - Ischemic cardiomyopathy (history of MI, regional wall motion abnormalities, CAD on angiography)
  - Hypertrophic cardiomyopathy (LV hypertrophy, preserved or hyperdynamic EF, SAM, genetic)
  - Restrictive cardiomyopathy (normal LV size, diastolic dysfunction, infiltrative diseases)
  - Valvular heart disease (murmurs, valvular lesions on echo)
  - Myocarditis (recent viral illness, chest pain, elevated troponin, may have acute onset)
  - Stress-induced cardiomyopathy (Takotsubo - acute onset, apical ballooning, emotional stressor)
  - Peripartum cardiomyopathy (last month pregnancy to 5 months postpartum)
trace:
  - 52-year-old man presents with 6-month history of progressive shortness of breath
  - Initially dyspnea only with heavy exertion (climbing stairs)
  - Gradually worsening, now dyspneic with minimal exertion (walking across room)
  - Wakes at night short of breath, needs 3 pillows to sleep
  - Lower extremity swelling bilateral for 2 months
  - Fatigue, cannot perform usual activities
  - 15-pound weight gain (fluid retention)
  - No chest pain, occasional palpitations
  - Past medical history - hypertension (poorly controlled), former smoker
  - Medications - amlodipine 10 mg daily, hydrochlorothiazide 25 mg daily
  - Family history - father died age 58 from "heart failure"
  - Social - no alcohol, quit smoking 5 years ago (30 pack-year history)
  - Physical exam - appears dyspneic at rest
  - Vitals - temp 36.8C, HR 108, BP 105/68, RR 22, SpO2 94% room air
  - JVP elevated 12 cm
  - Cardiac - PMI displaced laterally to anterior axillary line
  - S3 gallop present, holosystolic murmur at apex (mitral regurgitation)
  - Lungs - bibasilar crackles
  - Abdomen - hepatomegaly 2 cm below costal margin, mild ascites
  - Extremities - 3+ pitting edema to knees bilaterally, cool feet
  - Labs - BNP 1850 pg/mL (markedly elevated, normal less than 100)
  - Creatinine 1.6 mg/dL (elevated from baseline 1.0), BUN 45 mg/dL
  - Sodium 132 mEq/L (hyponatremia from volume overload)
  - Potassium 4.8 mEq/L, normal liver enzymes
  - Hemoglobin 12.5 g/dL (mild anemia)
  - TSH 2.1 mIU/L (normal), troponin 0.08 ng/mL (mildly elevated)
  - ECG - sinus tachycardia 108 bpm, left bundle branch block (QRS 156 ms), poor R-wave progression
  - Chest X-ray - marked cardiomegaly (CTR 0.65), bilateral pulmonary vascular congestion, small pleural effusions
  - Echocardiography - severely dilated left ventricle (LV end-diastolic dimension 68 mm)
  - Severely reduced LVEF 20% (normal greater than 55%)
  - Global hypokinesis
  - Moderate-severe mitral regurgitation (functional, secondary to annular dilation)
  - No LV thrombus visualized
  - Mild right ventricular dysfunction
  - Diagnosis - Dilated cardiomyopathy with acute decompensated heart failure, NYHA class IV
  - Admitted to cardiology service
  - Coronary angiography ordered to rule out ischemic cause
  - Showed minimal CAD (20-30% stenoses), no significant obstructive disease
  - Confirms non-ischemic dilated cardiomyopathy
  - Cardiac MRI - dilated LV with EF 22%, mid-wall fibrosis pattern (consistent with non-ischemic DCM)
  - Treatment initiated - aggressive diuresis and GDMT
  - Furosemide 80 mg IV BID for diuresis
  - Goal negative 1-2 liters daily
  - Carvedilol 3.125 mg BID (evidence-based beta-blocker, start low dose)
  - Lisinopril 5 mg daily (ACE inhibitor)
  - Spironolactone 25 mg daily (MRA)
  - Sodium and fluid restriction
  - Hospital course - Days 1-5: Aggressive diuresis
  - Net negative 8 liters over 5 days
  - Dyspnea significantly improved
  - Weight decreased 18 pounds
  - Creatinine stable 1.4-1.6 mg/dL
  - Transitioned furosemide to PO 80 mg BID
  - Carvedilol increased to 6.25 mg BID (tolerated well)
  - Lisinopril increased to 10 mg daily
  - Day 6: Clinically euvolemic
  - No dyspnea at rest, trace pedal edema only
  - Repeat BNP 480 pg/mL (down from 1850)
  - Discharge planning - home with close follow-up
  - Discharged Day 7
  - Furosemide 80 mg daily PO, carvedilol 6.25 mg BID, lisinopril 10 mg daily, spironolactone 25 mg daily
  - Dapagliflozin 10 mg daily added (SGLT2 inhibitor for HFrEF)
  - Sodium restriction less than 2 g daily, fluid restriction less than 2 L daily
  - Daily weights, call if increase greater than 3 pounds
  - Cardiology follow-up 1 week
  - 1-week follow-up - doing well, no dyspnea, weight stable
  - Carvedilol increased to 12.5 mg BID
  - Lisinopril increased to 20 mg daily
  - Plan uptitration every 2 weeks
  - 6-week follow-up - significant improvement
  - NYHA class II (dyspnea with moderate exertion only)
  - Carvedilol 25 mg BID, lisinopril 40 mg daily (target doses)
  - Spironolactone 25 mg daily, dapagliflozin 10 mg daily
  - Furosemide 40 mg daily (dose reduced)
  - 3-month follow-up - continued improvement
  - Repeat echocardiogram - LVEF improved to 30% (up from 20%)
  - LV size slightly smaller (EF improvement with GDMT)
  - Mitral regurgitation now mild-moderate
  - Remains LVEF less than 35% despite optimal medical therapy for 3 months
  - ICD placement indicated for primary prevention sudden cardiac death
  - Has LBBB with QRS 156 ms - CRT-D indicated (cardiac resynchronization therapy with defibrillator)
  - CRT-D implanted (biventricular ICD)
  - 6-month follow-up - excellent response to CRT
  - NYHA class I-II, minimal symptoms
  - Echocardiogram - LVEF improved to 40% (significant improvement with CRT)
  - LV reverse remodeling (decreased size)
  - Mitral regurgitation now mild
  - 1-year follow-up - maintained improvement
  - LVEF stable 38-40%, functional capacity excellent
  - Continues GDMT, CRT-D functioning appropriately
  - Outcome - Excellent response to GDMT and CRT, significant improvement in EF and symptoms
