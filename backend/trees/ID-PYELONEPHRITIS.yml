tree_id: ID-PYELONEPHRITIS
name: Acute Pyelonephritis  
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Fever, flank pain, and dysuria
description: Acute bacterial infection of renal parenchyma and collecting system, typically ascending from lower urinary tract. Most commonly caused by E. coli (80-90%). Clinical triad of fever, flank pain, and costovertebral angle tenderness. More severe than uncomplicated cystitis and requires hospitalization if severe, immunocompromised, pregnant, or unable to tolerate oral intake. Outpatient treatment with fluoroquinolone or cephalosporin for 7-14 days if uncomplicated. Inpatient treatment with IV antibiotics and transition to oral when improving. Complications include renal abscess, emphysematous pyelonephritis, sepsis, and chronic kidney disease. Imaging with CT or ultrasound if not improving after 48-72 hours of antibiotics.
icd10: N10
urgency: urgent

workup:
  - Clinical presentation (classic triad):
    - Fever (over 100.4°F or 38°C):
      - Often high-grade fever with rigors
      - Acute onset over hours to days
      - May have night sweats
    - Flank pain (unilateral or bilateral):
      - Dull constant ache in costovertebral angle region
      - Radiates anteriorly to lower abdomen
      - Worse with movement or palpation
    - Dysuria and urinary symptoms:
      - Burning or pain with urination
      - Urinary frequency and urgency
      - Suprapubic discomfort
      - May have gross hematuria
      - Symptoms often precede fever and flank pain by 1-2 days
    - Systemic symptoms:
      - Nausea and vomiting (common)
      - Anorexia
      - Malaise and fatigue
      - Confusion (especially elderly, may be only presenting symptom)
  - Risk factors for pyelonephritis:
    - Female gender (shorter urethra, proximity to anus)
    - Sexual activity (new partner, frequent intercourse)
    - Pregnancy (physiologic hydronephrosis, increased risk)
    - Urinary tract obstruction (stones, stricture, BPH)
    - Vesicoureteral reflux (retrograde flow of urine)
    - Urinary catheter or recent instrumentation
    - Diabetes mellitus (glucosuria promotes bacterial growth, impaired immunity)
    - Immunosuppression (transplant, chemotherapy, HIV)
    - Neurogenic bladder (incomplete emptying, stasis)
    - Anatomic abnormalities (polycystic kidneys, horseshoe kidney)
  - Physical examination:
    - Vital signs:
      - Fever over 100.4°F (may be absent in elderly or immunosuppressed)
      - Tachycardia (compensatory response to fever and dehydration)
      - Hypotension if septic (concerning for urosepsis)
    - Costovertebral angle (CVA) tenderness:
      - Positive if pain with percussion or fist palpation over kidney
      - Unilateral CVA tenderness suggests affected side
      - Highly suggestive of pyelonephritis (but can be absent)
    - Abdominal exam:
      - Suprapubic tenderness (concurrent cystitis)
      - Flank tenderness to palpation
      - Guarding if severe or peritonitis
    - Assess for sepsis (altered mental status, hypotension, tachypnea)
  - Laboratory evaluation:
    - Urinalysis (key diagnostic test):
      - Pyuria (WBCs in urine, over 10 WBC/hpf)
      - Bacteriuria (bacteria on microscopy)
      - WBC casts (pathognomonic for pyelonephritis, indicates renal parenchymal involvement)
      - Hematuria (RBCs in urine)
      - Positive leukocyte esterase and nitrites on dipstick
      - Proteinuria (mild)
    - Urine culture and sensitivities (obtain before antibiotics):
      - Over 100,000 CFU/mL diagnostic (or over 10,000 if symptoms)
      - Identify organism (E. coli 80-90%, Klebsiella, Proteus, Enterococcus, Staph saprophyticus)
      - Guide antibiotic therapy based on sensitivities
      - Repeat culture if not improving after 48-72 hours
    - Blood cultures (if hospitalized or septic):
      - Positive in 20-30% of pyelonephritis cases
      - Indicates bacteremia and higher severity
    - CBC:
      - Leukocytosis with left shift (elevated WBC with increased bands)
      - May have bandemia indicating severe infection
    - CMP (renal function and electrolytes):
      - Creatinine elevation suggests acute kidney injury
      - Hyponatremia if dehydrated or SIADH from infection
      - Monitor electrolytes if vomiting or unable to tolerate PO
    - Inflammatory markers:
      - ESR and CRP elevated (non-specific)
      - Procalcitonin if concern for sepsis
  - Imaging (not routinely needed for uncomplicated cases):
    - Indications for imaging:
      - Not improving after 48-72 hours of appropriate antibiotics
      - Recurrent pyelonephritis (rule out anatomic abnormality)
      - Suspected complication (abscess, obstruction, emphysematous)
      - Immunocompromised or diabetic (higher complication risk)
      - Toxic appearance or septic
    - CT abdomen/pelvis with contrast (imaging modality of choice):
      - Identifies complications (abscess, emphysematous pyelonephritis, perinephric fat stranding)
      - Assess for obstruction (stones, hydronephrosis)
      - Evaluate for anatomic abnormalities
    - Renal ultrasound (alternative if cannot do CT):
      - Assess for hydronephrosis (obstruction)
      - Identify stones or masses
      - Less sensitive than CT for abscess or emphysematous changes
    - VCUG (voiding cystourethrogram) after resolution:
      - In children with recurrent UTIs to assess for vesicoureteral reflux
      - Not acutely indicated

treatment:
  - Disposition and severity assessment:
    - Outpatient management if:
      - Mild to moderate symptoms
      - Able to tolerate oral intake and medications
      - Immunocompetent
      - No complications (not pregnant, no obstruction, no abscess)
      - Adequate follow-up available
      - Reliable patient
    - Inpatient management if:
      - Severe symptoms (high fever over 103°F, severe pain, toxic appearance)
      - Unable to tolerate oral intake or medications (persistent vomiting)
      - Signs of sepsis (hypotension, altered mental status, hypoxemia)
      - Pregnancy (all pregnant patients with pyelonephritis require admission)
      - Immunocompromised (diabetes, transplant, chemotherapy, HIV)
      - Suspected obstruction or complication
      - Failed outpatient therapy
      - Poor social situation or inability to follow up
      - Elderly or frail patients
  - Antibiotic therapy (adjust based on local resistance patterns):
    - Outpatient oral therapy (7-14 days total):
      - Fluoroquinolone (first-line if resistance under 10% locally):
        - Ciprofloxacin 500 mg PO BID for 7 days
        - Or levofloxacin 750 mg PO daily for 5-7 days
      - Cephalosporin alternatives:
        - Cefpodoxime 200 mg PO BID for 10-14 days
        - Cefditoren 400 mg PO BID for 10 days
      - If fluoroquinolone-resistant or contraindicated:
        - TMP-SMX DS (160/800 mg) PO BID for 14 days (if susceptible)
        - Consider single dose IV ceftriaxone 1-2g followed by oral agent
      - Avoid nitrofurantoin and fosfomycin (inadequate tissue penetration for pyelonephritis)
    - Inpatient IV therapy (transition to oral when improving):
      - Fluoroquinolone:
        - Ciprofloxacin 400 mg IV q12h
        - Levofloxacin 750 mg IV daily
      - Third-generation cephalosporin:
        - Ceftriaxone 1-2g IV daily
        - Cefotaxime 1-2g IV q8h
      - Extended-spectrum penicillin:
        - Piperacillin-tazobactam 3.375-4.5g IV q6h
      - Carbapenem if resistant organism or severely ill:
        - Meropenem 1g IV q8h
        - Ertapenem 1g IV daily
      - Aminoglycoside (add if septic or ESBL organism):
        - Gentamicin 5-7 mg/kg IV daily (monitor levels and renal function)
        - Avoid if baseline renal insufficiency
    - Duration of therapy:
      - 7 days for fluoroquinolones (short course effective)
      - 10-14 days for beta-lactams and TMP-SMX
      - Longer duration if complicated (obstruction, abscess, bacteremia)
    - Transition to oral therapy when:
      - Afebrile for 24-48 hours
      - Tolerating oral intake
      - Clinically improving (decreased pain, nausea, improved labs)
      - Continue antibiotics to complete 10-14 day course total
  - Supportive care:
    - IV fluids for hydration (especially if vomiting or febrile)
    - Pain control (NSAIDs, acetaminophen, opioids if severe)
    - Antiemetics for nausea (ondansetron, promethazine)
    - Antipyretics for fever
    - Encourage oral hydration (6-8 glasses water daily)
  - Management of complications:
    - Obstructive uropathy (stone, stricture causing hydronephrosis):
      - Requires emergent urologic consultation
      - Percutaneous nephrostomy or ureteral stent placement
      - Antibiotics alone inadequate if obstruction present
    - Renal abscess or perinephric abscess:
      - Requires prolonged antibiotics (4-6 weeks)
      - May require percutaneous or surgical drainage if large (over 5 cm)
      - Urology or interventional radiology consultation
    - Emphysematous pyelonephritis (gas-forming infection, mostly diabetics):
      - Life-threatening, high mortality
      - Requires aggressive IV antibiotics
      - May require nephrectomy if severe or not responding
      - ICU monitoring
    - Urosepsis (sepsis from urinary source):
      - ICU admission for close monitoring
      - Aggressive IV fluids and vasopressor support
      - Broad-spectrum IV antibiotics
      - Source control (drainage if obstruction or abscess)
  - Follow-up and prevention:
    - Clinical follow-up in 48-72 hours (outpatient) or 7-14 days (post-discharge)
    - Repeat urine culture if not improving (test of cure NOT routinely needed if improving)
    - Address modifiable risk factors:
      - Post-coital voiding
      - Adequate hydration
      - Avoid spermicides and diaphragms
      - Treat constipation
    - Prophylactic antibiotics if recurrent pyelonephritis (over 2 episodes per year):
      - TMP-SMX SS daily or 3x weekly
      - Nitrofurantoin 50-100 mg daily
      - Consider after addressing structural abnormalities
    - Imaging to evaluate for structural abnormalities if:
      - Recurrent pyelonephritis
      - Male patient (less common, higher likelihood of abnormality)
      - Persistent symptoms despite treatment
      - Atypical organisms (Proteus suggests stones, Staph aureus suggests hematogenous spread)

clinical_pearls:
  - Classic triad: fever, flank pain, and CVA tenderness (but all three may not always be present)
  - WBC casts in urine are pathognomonic for pyelonephritis (indicates renal parenchymal involvement)
  - E. coli causes 80-90% of community-acquired pyelonephritis
  - Nitrofurantoin and fosfomycin are NOT appropriate for pyelonephritis (inadequate tissue levels)
  - ALL pregnant patients with pyelonephritis require hospital admission (risk of preterm labor and sepsis)
  - Fluoroquinolones are first-line for outpatient treatment if local resistance under 10%
  - If not improving after 48-72 hours of antibiotics, obtain imaging (CT) to rule out abscess or obstruction
  - Blood cultures positive in 20-30% of cases, indicating bacteremia and more severe infection
  - Emphysematous pyelonephritis is gas-forming infection in diabetics with high mortality - requires aggressive treatment
  - Obstructive pyelonephritis is urologic emergency requiring drainage (antibiotics alone inadequate)
  - Short-course fluoroquinolone therapy (5-7 days) is as effective as longer courses
  - Men with pyelonephritis should have urologic evaluation (less common, suggests anatomic abnormality or prostatitis)

presentations:
  - Fever and chills
  - Flank pain
  - Costovertebral angle tenderness
  - Dysuria
  - Urinary frequency
  - Urinary urgency
  - Nausea and vomiting
  - Malaise and fatigue
  - Hematuria
  - Suprapubic pain
  - Confusion (elderly)
  - Rigors

