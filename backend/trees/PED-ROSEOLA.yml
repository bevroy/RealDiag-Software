presentations:
  - High fever for 3-4 days
  - Fever resolves then rash appears
  - Rose-pink maculopapular rash
  - Starts on trunk, spreads to extremities
  - Age 6-24 months
  - Child appears well despite high fever
differentials:
  - Fifth disease
  - Measles
  - Scarlet fever
  - Drug rash
  - Viral exanthem
workup: []
treatment:
  - Supportive care only - self-limited viral illness (HHV-6)
  - Antipyretics - acetaminophen 10-15mg/kg/dose Q4-6H or ibuprofen 10mg/kg/dose Q6-8H for fever (often high, 103-105°F)
  - Hydration - encourage fluids, monitor for dehydration
  - Febrile seizure management if occurs - reassure parents, seizures typically brief and benign
  - No antiviral treatment indicated for immunocompetent children
  - Isolation not necessary - most children already exposed by age 2
  - Reassure parents that rash signals end of contagious period and recovery
