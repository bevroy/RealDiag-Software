tree_id: NEURO-COGNITIVE-IMPAIRMENT-UNSPECIFIED
name: Cognitive Impairment, Unspecified
family: Neurology
specialty: Neurology/Geriatrics/Primary Care
chief_complaint: Cognitive difficulties not meeting criteria for specific dementia or MCI diagnosis
description: Non-specific cognitive decline or dysfunction requiring evaluation, may represent early stages of neurodegenerative disease, delirium, reversible causes, or subjective complaints without objective impairment

icd10: R41.9
snomed: "386807006"

urgency: routine

