presentations:
  - Subjective memory complaints (patient or family concern)
  - Difficulty concentrating or focusing
  - Mental fogginess or clouded thinking
  - Slower processing or response time
  - Word-finding difficulty
  - Difficulty with complex tasks
  - Forgetting recent events or conversations
  - Difficulty learning new information
  - Preserved independence in daily activities (unlike dementia)
  - May have normal cognitive screening tests

workup:
  - Comprehensive history essential: onset (acute vs gradual), duration, progression (stable, worsening, fluctuating), specific cognitive complaints (memory, attention, language, executive function), functional impact (work, ADLs, IADLs, driving, finances), informant history critical (family perspective often more accurate than patient self-report)
  - Distinguish presentations: subjective cognitive decline (SCD - complaints without objective impairment on testing, may be anxiety/depression or very early preclinical stage), mild cognitive impairment (MCI - objective impairment on testing but ADLs preserved), dementia (objective impairment in multiple domains with functional decline), delirium (acute fluctuating confusion with inattention)
  - Cognitive screening: Mini-Mental State Exam (MMSE 0-30, less than 24 suggests impairment), Montreal Cognitive Assessment (MoCA 0-30, less than 26 suggests impairment, more sensitive than MMSE), clock draw test, verbal fluency (animal naming, FAS letters), Mini-Cog (3-word recall plus clock draw - quick screen)
  - Rule out delirium first (acute medical emergency): acute onset (hours to days), fluctuating course, inattention (cannot focus, easily distracted), disorganized thinking, altered consciousness, assess for underlying cause (infection, metabolic, medications, hypoxia)
  - Screen for reversible causes: depression (pseudodementia - PHQ-9 score, poor effort on testing, pervasive sadness, responds to antidepressants), hypothyroidism (TSH, fatigue, weight gain, cold intolerance), vitamin B12 deficiency (B12 level, methylmalonic acid, macrocytic anemia, neuropathy), medications (anticholinergics, benzodiazepines, opioids, antihistamines, muscle relaxants), sleep disorders (sleep apnea causes cognitive impairment - screen with Epworth Sleepiness Scale, STOP-BANG questionnaire), substance use (alcohol, illicit drugs)
  - Medication review critical: anticholinergic medications (diphenhydramine, oxybutynin, tricyclic antidepressants, first-generation antihistamines) worsen cognition, benzodiazepines impair memory and attention, opioids cause sedation and cognitive slowing, polypharmacy (5+ medications increases risk)
  - Labs (all patients): CBC (anemia), CMP (electrolytes, renal function, liver function, glucose), TSH (hypothyroidism), vitamin B12 and folate, consider RPR/VDRL if risk factors (syphilis), HIV if risk factors, heavy metals if exposure, thiamine if alcohol use
  - Neuroimaging: MRI brain preferred (or CT if MRI contraindicated), rule out structural lesions (tumor, subdural hematoma, normal pressure hydrocephalus), assess for stroke or white matter disease (vascular cognitive impairment), assess atrophy patterns (medial temporal atrophy suggests Alzheimer), small vessel disease
  - Formal neuropsychological testing if: diagnosis unclear after screening, need to distinguish MCI from normal aging, establish baseline for monitoring, assess specific cognitive domains, differentiate depression from dementia, medicolegal purposes (capacity evaluation)
  - Assess mood and psychiatric symptoms: depression screening (PHQ-9), anxiety screening (GAD-7), depression and cognitive impairment often coexist (may be cause, effect, or both), treat depression aggressively (may improve cognition)
  - Sleep evaluation: screen for sleep apnea (snoring, witnessed apneas, obesity, daytime sleepiness - refer for polysomnography if positive), insomnia (impairs cognition - treat with sleep hygiene, CBT-I), circadian rhythm disorders
  - Assess vascular risk factors: hypertension, diabetes, hyperlipidemia, smoking, prior stroke/TIA - treat to prevent vascular cognitive impairment
  - Monitor over time: repeat cognitive screening 6-12 months, assess for progression (stable suggests benign or reversible cause, worsening suggests neurodegenerative disease), may evolve to MCI or dementia diagnosis with time

treatment:
  - Identify and treat underlying causes: depression (SSRI - sertraline 50-100 mg, escitalopram 10-20 mg, cognitive improvement may occur with treatment), hypothyroidism (levothyroxine), vitamin B12 deficiency (1000 mcg daily or monthly injections), discontinue cognitive-impairing medications (anticholinergics, benzodiazepines if possible), sleep apnea (CPAP therapy improves cognition significantly), alcohol or substance use (cessation, rehabilitation)
  - Vascular risk factor optimization: blood pressure control (target less than 130/80 reduces dementia risk), statin for hyperlipidemia (atorvastatin 20-40 mg), diabetes control (HbA1c target less than 8 percent in elderly), smoking cessation, antiplatelet if stroke/TIA history
  - Lifestyle interventions (strong evidence): regular exercise (150 minutes/week moderate aerobic activity - reduces cognitive decline risk 30-40 percent, improves cognition even in those with impairment), cognitive stimulation (mentally stimulating activities, learn new skills, social engagement), Mediterranean or MIND diet (vegetables, berries, nuts, olive oil, fish, whole grains - reduces dementia risk), social engagement (reduces isolation and depression)
  - Sleep hygiene: regular sleep schedule, adequate duration (7-8 hours), avoid alcohol and caffeine evening, treat insomnia (CBT-I first-line, melatonin 3-5 mg, trazodone 25-50 mg if needed, avoid diphenhydramine)
  - Cognitive training: brain training programs (limited evidence of generalization), occupational therapy for compensatory strategies (calendars, reminders, lists, routines), memory strategies
  - Address comorbidities: treat pain adequately (untreated pain impairs cognition, but avoid chronic opioids), manage chronic diseases (heart failure, COPD, diabetes - poor control affects cognition), optimize medications (reduce polypharmacy)
  - No medications specifically for unspecified cognitive impairment: cholinesterase inhibitors only if clear dementia diagnosis (not for SCD or vague complaints), avoid "brain supplements" with limited evidence (ginkgo biloba not effective)
  - Reassurance if subjective cognitive decline: if testing normal and no functional impairment, reassure patient, may be normal aging or anxiety/stress, encourage healthy lifestyle, monitor over time (annual screening)
  - Monitor and follow-up: cognitive screening every 6-12 months, assess for progression, functional status, mood, may evolve to MCI or dementia (10-15 percent per year for MCI), some remain stable or improve (especially if reversible cause)
  - Safety: assess driving safety (if concerns refer for formal evaluation), financial capacity (protect from exploitation), home safety, avoid wandering if confusion present

clinical_pearls:
  - "Cognitive impairment, unspecified" is diagnosis of exclusion or temporary diagnosis pending workup
  - Always rule out reversible causes first: depression, hypothyroidism, B12 deficiency, medications, sleep apnea
  - Anticholinergic medications (diphenhydramine, oxybutynin, tricyclics) worsen cognition - discontinue if possible
  - Subjective cognitive decline (complaints but normal testing) may represent anxiety, depression, or very early preclinical stage
  - Depression can cause "pseudodementia" - treat aggressively with antidepressants (cognition may improve)
  - Sleep apnea causes significant cognitive impairment - screen and treat with CPAP
  - MoCA more sensitive than MMSE for detecting mild impairment (MMSE often normal in MCI)
  - Lifestyle interventions have strongest evidence: exercise, Mediterranean diet, cognitive/social engagement
  - Monitor over time - may evolve to MCI or dementia diagnosis, or may improve if reversible cause
  - Formal neuropsychological testing helpful if diagnosis unclear or need baseline

referrals:
  - Neurology or geriatrics if progressive symptoms, concern for dementia, or complex workup
  - Neuropsychology for formal cognitive testing if diagnosis unclear or establish baseline
  - Psychiatry if primary mood disorder suspected or complex psychiatric symptoms
  - Sleep medicine if sleep apnea suspected (polysomnography)
  - Endocrinology if thyroid disorder requiring management
  - Primary care for ongoing management and monitoring if mild symptoms

differentials:
  - Subjective cognitive decline (complaints without objective impairment - may be anxiety or early preclinical)
  - Mild cognitive impairment (objective impairment but ADLs preserved, 10-15 percent/year progress to dementia)
  - Dementia (Alzheimer's, vascular, Lewy body, frontotemporal - multiple domains impaired, ADL decline)
  - Delirium (acute fluctuating confusion, inattention, underlying medical cause)
  - Depression (pseudodementia - poor effort, pervasive sadness, improves with antidepressants)
  - Normal aging (mild forgetfulness, no functional impairment, test performance normal for age)
  - Medication side effects (anticholinergics, benzodiazepines, opioids)
  - Sleep disorders (sleep apnea, insomnia - impairs cognition, improves with treatment)
  - Hypothyroidism (fatigue, weight gain, responds to thyroid replacement)
  - Vitamin B12 deficiency (macrocytic anemia, neuropathy, improves with supplementation)

trace:
  - 58-year-old woman presents with concerns about memory x 6 months, worried about early dementia
  - Chief complaint: "I'm forgetting things more often and I'm worried I'm getting Alzheimer's disease like my mother."
  - History: past 6 months noticed increased forgetfulness (misplaces keys, forgets names of acquaintances, walks into room and forgets why), difficulty concentrating at work (takes longer to complete tasks, easily distracted), "brain fog" feeling, worries constantly about memory
  - Functional status: manages all activities independently (works full-time as nurse, pays bills, manages medications, drives, cooks, shops), no decline in function, no getting lost
  - Sleep: difficulty falling asleep (worries about memory), wakes frequently, sleeps only 5-6 hours nightly, wakes unrefreshed
  - Mood: worries excessively about memory and health, feels stressed, irritable, not depressed
  - Past medical history: hypertension (well-controlled), no stroke or head trauma
  - Medications: lisinopril 20 mg daily, diphenhydramine 50 mg at bedtime PRN for sleep (uses 3-4 nights per week x 2 years)
  - Family history: mother diagnosed with Alzheimer disease age 72, currently in nursing home (patient very worried about this)
  - Social: works full-time as registered nurse (high-stress job), married, two adult children, no alcohol or tobacco
  - Exam: vital signs normal, general and neurologic exam completely normal, MMSE 29/30 (lost 1 point on delayed recall but recalled all 3 words with category cuing), clock draw normal, MoCA 27/30 (lost points on delayed recall and attention - mild)
  - Assessment: subjective cognitive complaints with minimal objective findings on screening, functional status intact, risk factors identified: chronic poor sleep, anticholinergic medication use (diphenhydramine), anxiety about family history, high stress
  - Labs: CBC normal, CMP normal, TSH 2.4 mIU/L (normal), vitamin B12 456 pg/mL (normal), fasting glucose 94 mg/dL (normal)
  - MRI brain: normal brain parenchyma, no atrophy, no stroke, no white matter disease, no mass
  - Sleep history: insomnia x 2 years, using diphenhydramine frequently (anticholinergic - worsens cognition), no snoring or apnea symptoms
  - PHQ-9 depression screening: score 6 (minimal depression, not clinically significant)
  - GAD-7 anxiety screening: score 14 (moderate anxiety, especially health anxiety related to family history)
  - Diagnosis: Cognitive Impairment, Unspecified (R41.9) - subjective cognitive complaints with minimal objective findings, likely multifactorial: chronic sleep deprivation, anticholinergic medication use (diphenhydramine), anxiety, stress, does not meet criteria for MCI (testing near-normal) or dementia (no functional decline)
  - Discussed findings: reassured patient that testing essentially normal for age, MRI normal, likely contributing factors identified that are treatable, does not have dementia, family history increases risk but many people with family history do not develop Alzheimer disease
  - Treatment plan - address modifiable factors:
    • Discontinue diphenhydramine immediately (anticholinergic worsens cognition, chronic use associated with dementia risk)
    • Sleep hygiene counseling: regular sleep schedule, avoid screens before bed, relaxation techniques, cognitive behavioral therapy for insomnia (CBT-I) referral
    • Non-anticholinergic sleep aid: melatonin 3 mg at bedtime started (safer alternative to diphenhydramine)
    • Anxiety management: cognitive behavioral therapy (CBT) referral for health anxiety, relaxation techniques, mindfulness meditation
    • Stress management: work-life balance, regular exercise (reduces stress and improves cognition)
    • Lifestyle interventions: instructed regular aerobic exercise 30 min most days (reduces dementia risk), Mediterranean diet, cognitive engagement (reading, puzzles, social activities)
  - Counseling: explained that anxiety and poor sleep can significantly impair cognition (reversible), diphenhydramine likely contributing to "brain fog", encouraged healthy lifestyle to reduce dementia risk
  - Follow-up 6 weeks: discontinued diphenhydramine (no longer using any sleep aids, melatonin helps some), sleep improved to 6.5-7 hours nightly with CBT-I techniques, "brain fog" significantly improved, concentration better at work, anxiety reduced with CBT (GAD-7 score now 8), memory subjectively improved
  - Follow-up 3 months: sustained improvement, sleeping 7-8 hours nightly consistently, concentration and memory subjectively much better, anxiety well-controlled, exercising 4 days per week (walking 30 minutes), reading more, less worried about dementia
  - Repeat MoCA: 28/30 (improved from 27, recalled all 5 words on delayed recall this time, only lost points on trails and abstraction - within normal limits)
  - Assessment: improvement in cognitive symptoms with discontinuation of anticholinergic medication, improved sleep, anxiety management, and healthy lifestyle - confirms that symptoms were multifactorial and reversible rather than neurodegenerative
  - Patient relieved: "I feel so much better. I didn't realize the sleep medication was making my memory worse. My concentration is back to normal and I'm not worried all the time anymore."
  - Plan: continue healthy lifestyle (exercise, sleep hygiene, Mediterranean diet, cognitive engagement), annual cognitive screening (MMSE or MoCA) to monitor, no medications for cognition needed, encourage patient to return if any new concerning symptoms or functional decline
  - 1-year follow-up: doing well, no cognitive complaints, functioning normally, MMSE 30/30 (perfect score), sleep excellent, anxiety controlled, continues healthy lifestyle
  - Diagnosis revised: Resolved cognitive impairment secondary to anticholinergic medication use, sleep deprivation, and anxiety - no evidence of neurodegenerative disease
