tree_id: NEU-PERIPHERAL-NEUROPATHY
name: Peripheral Neuropathy
family: Neurology
specialty: Neurology
icd10:
- G62.9
snomed:
- '42658009'
urgency: medium
description: Comprehensive evaluation and management of Peripheral Neuropathy
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- numbness, tingling, burning in hands/feet
- weakness
- loss of reflexes
- stocking-glove distribution
- often due to diabetes, alcohol, or medications
- 'Sensory > motor: Paresthesias, dysesthesias, numbness'
- 'Neuropathic pain: Burning, shooting, electric shock pain'
- 'Distal symmetric polyneuropathy: Stocking-glove distribution (feet before hands)'
workup:
- 'Diabetes: HbA1c, fasting glucose'
- 'B12 level: <200 pg/mL deficient, methylmalonic acid if borderline'
- 'Thyroid: TSH (hypothyroidism)'
- 'SPEP with immunofixation: Paraproteinemia, amyloidosis'
- 'EMG/NCS: Distinguish axonal (reduced amplitude) vs demyelinating (slow velocity,
  prolonged latencies)'
- 'Consider: HIV, RPR, Lyme, heavy metals (lead, arsenic), ANA if idiopathic'
treatment:
- 'Guideline-based treatment options for Peripheral Neuropathy include:'
- 'Treat underlying cause: Glycemic control (diabetes), B12 replacement, stop toxin
  (alcohol, meds) (AAN 2024)'
- 'Neuropathic pain: Gabapentin 300mg TID titrate to 900-3600mg/day, or pregabalin
  75mg BID titrate to 300mg BID (AAN 2024)'
- 'Alternative: Duloxetine 60mg daily, amitriptyline 25-75mg qhs (AAN 2024)'
- 'Topical: Lidocaine 5% patches, capsaicin cream for localized pain (AAN 2024)'
- 'Foot care: Daily inspection, proper footwear, podiatry (diabetics at high ulcer/amputation
  risk) (AAN 2024)'
clinical_pearls:
- Diabetes most common cause (50%), followed by alcohol, B12 deficiency, medications
- 'Length-dependent: Starts feet, ascends to knees before affecting hands (longest
  nerves affected first)'
- 'Screen for causes: HbA1c, B12, TSH, SPEP, HIV, heavy metals, Lyme'
- 'Diabetic neuropathy: Screen annually with 10g monofilament, vibration (128 Hz tuning
  fork)'
- 'Neuropathic pain: Gabapentin, pregabalin, duloxetine, or tricyclics (amitriptyline)'
- 'CIDP (chronic inflammatory demyelinating polyneuropathy): Acquired immune-mediated,
  treatable with IVIG'
referrals:
- 'Neurology if: Rapid progression, asymmetric, motor > sensory, demyelinating pattern
  on EMG'
- 'Podiatry for: Diabetic neuropathy (ulcer prevention, foot care)'
- 'Pain management if: Refractory neuropathic pain'
differentials: []
