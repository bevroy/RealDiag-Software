tree_id: PSYCH-AGITATION
name: Agitation (Behavioral)
family: psychiatry
specialty: Psychiatry/Emergency Medicine
icd10: R45.1
snomed: 24199005
urgency: []
homeopathy: []
presentations:
  - Excessive motor activity associated with internal tension
  - Restlessness, pacing, inability to sit still
  - Verbal aggression (yelling, threatening, verbally abusive)
  - Physical aggression toward objects or people
  - Irritability and emotional lability
  - Impulsivity and poor judgment
  - Disinhibition
  - May escalate rapidly without intervention
  - Often triggered by perceived threat, frustration, or overstimulation
workup:
  - Immediate safety assessment (patient, staff, others)
  - De-escalation environment (quiet, low-stimulation, sufficient space)
  - Staff safety protocols
  - Identify underlying cause (essential for appropriate treatment)
  - Medical causes (50% of agitation in elderly)
  - Delirium (infection, metabolic, medication)
  - Hypoxia, hypoglycemia
  - Intoxication (alcohol, stimulants, synthetic cannabinoids)
  - Withdrawal (alcohol, benzodiazepines, opioids)
  - Pain
  - Urinary retention, constipation (especially elderly)
  - Neurological (stroke, seizure, head injury, dementia)
  - Psychiatric causes
  - Psychosis (schizophrenia, bipolar mania, depression with psychotic features)
  - Acute mania or mixed episode
  - Severe anxiety or panic
  - PTSD with hyperarousal
  - Personality disorders (borderline, antisocial)
  - Developmental disorders (autism, intellectual disability)
  - Vital signs and focused physical examination
  - Temperature (infection, neuroleptic malignant syndrome)
  - Blood pressure and heart rate (sympathetic activation, intoxication)
  - Oxygen saturation
  - Neurological exam
  - Laboratory and diagnostic tests (based on clinical suspicion)
  - Fingerstick glucose (hypoglycemia)
  - Urine drug screen
  - Blood alcohol level
  - CBC, CMP, urinalysis (infection, metabolic derangements)
  - Ammonia if hepatic encephalopathy suspected
  - CT head if trauma, altered mental status, or focal neurological signs
  - EEG if seizure suspected
treatment:
  - Verbal de-escalation (FIRST-LINE, always attempt before medication or restraints)
  - Maintain calm, non-threatening demeanor
  - Use simple, clear language
  - Offer choices and maintain patient autonomy when possible
  - Set clear limits and expectations
  - Adequate personal space (at least arm's length)
  - Environment modification
  - Reduce stimulation (noise, lights, number of people)
  - Remove potential weapons or dangerous objects
  - Ensure adequate space and escape route for staff
  - Treat underlying medical cause if identified
  - Correct hypoglycemia, hypoxia
  - Treat infection
  - Manage pain
  - Discontinue offending medications
  - Pharmacological intervention (if de-escalation fails)
  - Oral medication preferred (less coercive, faster onset than IM)
  - First-generation antipsychotics
  - Haloperidol 5-10 mg PO/IM (may repeat in 30-60 min)
  - Monitor for dystonia, QT prolongation
  - Second-generation antipsychotics (preferred, lower EPS risk)
  - Olanzapine 10 mg PO/IM
  - Risperidone 2-4 mg PO
  - Ziprasidone 10-20 mg IM
  - Benzodiazepines (alternative or adjunct)
  - Lorazepam 1-2 mg PO/IM
  - Midazolam 5 mg IM
  - Avoid in elderly, delirium, respiratory compromise
  - Combination therapy often effective
  - Haloperidol 5 mg + lorazepam 2 mg IM
  - Olanzapine 10 mg + lorazepam 2 mg PO
  - Physical restraints (LAST RESORT only when imminent danger)
  - Must follow legal and regulatory requirements
  - Continuous monitoring required
  - Release as soon as safe
  - Document thoroughly
clinical_pearls:
  - "Always attempt verbal de-escalation before medication or restraints - successful in 50-75% of cases"
  - "Rule out medical causes first - delirium, hypoglycemia, hypoxia, pain common in elderly"
  - "Agitation affects 10-30% of psychiatric emergency presentations"
  - "Combination therapy (antipsychotic + benzodiazepine) often more effective than monotherapy"
  - "Oral medication as effective as IM with faster onset - offer oral first"
  - "Physical restraints associated with serious risks: injury, cardiac arrest, rhabdomyolysis - use only when imminent danger"
  - "Akathisia (medication-induced restlessness) can mimic or worsen agitation"
  - "In elderly, assume delirium until proven otherwise - agitation often first sign"
referrals:
  - Psychiatry consultation for underlying psychiatric disorder
  - Neurology if seizure, stroke, or neurological cause
  - Medical admission if delirium or medical cause requiring treatment
  - Transfer to psychiatric facility if psychiatric cause and medically stable
differentials:
  - Delirium (acute confusion, fluctuating mental status, medical cause)
  - Psychosis (hallucinations, delusions, disorganized behavior)
  - Mania (elevated mood, grandiosity, decreased need for sleep, increased goal-directed activity)
  - Substance intoxication (stimulants, synthetic cannabinoids, PCP)
  - Substance withdrawal (alcohol, benzodiazepines - life-threatening)
  - Akathisia (medication-induced restlessness from antipsychotics)
  - Anxiety disorders (severe panic, PTSD hyperarousal)
  - Personality disorders (borderline, antisocial with impulsivity)
  - Dementia with behavioral disturbance (chronic cognitive impairment)
  - Neurological emergencies (seizure, stroke, traumatic brain injury)
