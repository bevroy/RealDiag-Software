nodes:
  - id: tamponade_evaluation
    type: diagnosis
    name: "Cardiac Tamponade"
    icd10: "I31.4"
    urgency: critical
    workup:
      - Cardiac tamponade - Life-threatening accumulation of fluid in pericardial space → increased pericardial pressure → impaired cardiac filling → decreased cardiac output → cardiogenic shock
      - MEDICAL EMERGENCY - Requires urgent drainage
      - Pathophysiology - Pericardial fluid accumulation → increased intrapericardial pressure → compression of cardiac chambers (especially right atrium/ventricle with lower pressures) → decreased venous return → decreased stroke volume → decreased cardiac output → hypotension → shock
      - Speed of accumulation determines clinical presentation
      - Acute tamponade - Rapid accumulation (100-200 mL can cause tamponade), no time for pericardium to stretch
      - Subacute/chronic - Slow accumulation (1-2 L tolerated if gradual), pericardium stretches over time
      - Etiology
      - Malignancy (most common cause chronic effusions) - Lung cancer, breast cancer, lymphoma, melanoma, metastatic disease
      - Idiopathic/viral pericarditis - Coxsackie, echovirus, HIV
      - Uremia - Renal failure (uremic pericarditis)
      - Post-cardiac surgery - Early (bleeding) or late (Dressler syndrome, autoimmune)
      - Post-MI - Free wall rupture (acute), Dressler syndrome (weeks later, autoimmune)
      - Trauma - Penetrating (stab, gunshot), blunt (steering wheel injury, aortic dissection with hemopericardium)
      - Iatrogenic - Central line placement (perforation), cardiac catheterization, pacemaker lead perforation, cardiac biopsy
      - Bacterial pericarditis - TB (most common worldwide), purulent (S. aureus, S. pneumoniae)
      - Autoimmune - SLE, rheumatoid arthritis, scleroderma
      - Hypothyroidism - Myxedema
      - Aortic dissection - Type A with hemopericardium
      - Anticoagulation - With pericarditis (contraindicated)
      - Clinical presentation - Beck triad (classic but only present 10-40%)
      - Beck triad (10-40% have all three)
      - Hypotension - Decreased cardiac output
      - Elevated JVP - Increased right atrial pressure
      - Muffled heart sounds - Fluid surrounding heart
      - Dyspnea (85-90%) - Most common symptom, progressive
      - Chest pain/discomfort (75%) - Pleuritic or dull
      - Tachycardia (77-90%) - Compensatory response to decreased stroke volume
      - Tachypnea - Compensatory, air hunger
      - Pulsus paradoxus (75-80%) - HALLMARK physical exam finding
      - Exaggerated drop in systolic BP >10 mmHg during inspiration
      - Mechanism - Inspiration → increased venous return to right heart → septal shift leftward → decreased LV filling → decreased LV stroke volume → decreased systolic BP
      - Measure - BP cuff, inflate above systolic, slowly deflate, note first Korotkoff sound (heard only during expiration), continue deflating until sounds heard throughout respiratory cycle, difference >10 mmHg = positive
      - Not specific (also COPD exacerbation, PE, obesity, severe asthma)
      - Physical exam
      - Vital signs - Tachycardia (>100 bpm), hypotension (systolic <90 mmHg), narrow pulse pressure
      - Jugular venous distension (JVD) - Elevated JVP, prominent x descent (atrial relaxation), absent y descent (impaired ventricular filling)
      - Muffled/distant heart sounds
      - Pulsus paradoxus - >10 mmHg drop in systolic BP with inspiration
      - Tachypnea, dyspnea, accessory muscle use
      - Signs of shock - Cool extremities, altered mental status, oliguria
      - Diagnostic evaluation
      - ECG - Low voltage QRS (<5 mm limb leads, <10 mm precordial), electrical alternans (beat-to-beat QRS amplitude variation from swinging heart), sinus tachycardia
      - Electrical alternans - Highly specific (90-95%) but low sensitivity (20-30%)
      - May show pericarditis findings (PR depression, diffuse ST elevation) if underlying pericarditis
      - Chest X-ray - Enlarged cardiac silhouette ("water bottle" heart if >250 mL fluid), but can be normal with acute tamponade
      - Echocardiography - DIAGNOSTIC TEST OF CHOICE, bedside
      - Pericardial effusion - Circumferential fluid, echo-free space around heart
      - Small (<10 mm), moderate (10-20 mm), large (>20 mm)
      - Right atrial collapse (diastole) - Early sign, 85% sensitive, 80% specific
      - Right ventricular collapse (diastole) - More specific (90%), occurs when intrapericardial pressure > RV diastolic pressure
      - IVC plethora - Dilated IVC (>2 cm) with <50% inspiratory collapse (elevated right atrial pressure)
      - Respiratory variation - Exaggerated respiratory variation in mitral inflow (>25%) and tricuspid inflow (>40%)
      - Swinging heart - Heart moves within pericardial sac (corresponds to electrical alternans)
      - Hemodynamic findings (right heart catheterization) - Equalization of diastolic pressures
      - RA pressure = RV diastolic pressure = pulmonary artery diastolic pressure = PCWP (within 5 mmHg)
      - Elevated and equal diastolic pressures (12-15 mmHg)
      - Not routinely performed (diagnosis made by echo)
      - Labs - Not diagnostic but assess etiology
      - CBC - Infection, anemia
      - BUN/creatinine - Uremia
      - Troponin - Myocarditis, MI
      - TSH - Hypothyroidism
      - Pericardial fluid analysis (after drainage) - Cell count, culture, cytology, glucose, protein, LDH, adenosine deaminase (TB)
      - Differential diagnosis - Other causes obstructive shock (tension pneumothorax, massive PE), constrictive pericarditis (chronic, different hemodynamics), restrictive cardiomyopathy, cardiogenic shock from MI/myocarditis
    treatment:
      - URGENT/EMERGENT TREATMENT - Tamponade is life-threatening
      - Stabilization - While preparing for drainage
      - IV fluids - Aggressive volume resuscitation (1-2 L NS bolus)
      - Increases preload → partially compensates for decreased filling
      - Temporizing measure only (buys time for definitive drainage)
      - Avoid diuretics (worsen hypotension)
      - Avoid positive pressure ventilation if possible (intubation worsens hemodynamics, increases intrathoracic pressure → further decreases venous return)
      - If intubation necessary - Minimize PEEP, cautious with sedatives (may worsen hypotension)
      - Vasopressors - If hypotensive despite fluids (norepinephrine, dopamine)
      - Temporizing only, does NOT replace drainage
      - Definitive treatment - URGENT PERICARDIAL DRAINAGE
      - Pericardiocentesis - Percutaneous needle drainage
      - Indications - Hemodynamically significant tamponade (emergent), large effusion with tamponade physiology
      - Approach - Subxiphoid (most common), apical, parasternal
      - Echo or fluoroscopy guidance (reduces complications)
      - Technique - Insert needle at subxiphoid region, 30-45° angle toward left shoulder, advance under negative pressure until fluid aspirated
      - Drain as much fluid as possible (even 50-100 mL can improve hemodynamics dramatically)
      - Leave pigtail catheter in place (continued drainage, prevent reaccumulation)
      - Success rate 95-97%
      - Complications (5-10%) - Coronary artery laceration, cardiac perforation (hemopericardium), arrhythmias, pneumothorax, liver laceration
      - Contraindications (relative) - Aortic dissection (surgery preferred), purulent pericarditis (surgery preferred), traumatic hemopericardium with suspected cardiac injury (surgery preferred), loculated effusion (difficult to drain percutaneously)
      - Surgical drainage - If pericardiocentesis fails, contraindicated, or recurrent effusions
      - Pericardial window (subxiphoid or thoracoscopic) - Create opening in pericardium → continuous drainage into pleural or peritoneal space
      - Indications - Recurrent effusions (malignant pericarditis), purulent/bacterial pericarditis, traumatic hemopericardium, aortic dissection with hemopericardium, loculated effusions
      - Advantages - Allows biopsy (malignancy, TB), prevents recurrence
      - Emergency department thoracotomy - Traumatic arrest with suspected tamponade
      - Open pericardium, evacuate clot, identify bleeding source
      - Last resort, poor outcomes unless performed immediately after arrest
      - Post-drainage management
      - Monitor hemodynamics - BP, heart rate, JVP (should normalize)
      - Repeat echo - Confirm fluid removal, assess for reaccumulation
      - Pericardial drain management - Leave in place until drainage <25-50 mL/24 hours
      - Treat underlying cause
      - Malignant pericarditis - Systemic chemotherapy, intrapericardial sclerosis (tetracycline, bleomycin), pericardial window (recurrent)
      - Uremic pericarditis - Intensive dialysis (daily until resolution)
      - Bacterial/purulent pericarditis - Antibiotics + surgical drainage
      - TB pericarditis - Antituberculous therapy (RIPE) + corticosteroids (reduce constrictive pericarditis risk)
      - Post-cardiac surgery - Usually self-limited, may require drainage if hemodynamically significant
      - Autoimmune/idiopathic - NSAIDs, colchicine, corticosteroids
      - Prognosis
      - Depends on etiology and speed of treatment
      - Acute tamponade - High mortality if untreated (>50%), excellent outcomes if drained promptly
      - Malignant pericarditis - Poor prognosis (median survival 3-6 months, reflects underlying malignancy)
      - Uremic pericarditis - Resolves with intensive dialysis
      - Purulent pericarditis - High mortality (30-40%) even with treatment
      - Recurrence - 10-30% (especially malignant or idiopathic), consider pericardial window
