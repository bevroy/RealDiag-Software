tree_id: CARD-CARDIAC-TAMPONADE
name: Cardiac Tamponade
family: Cardiology
specialty: Cardiology
icd10:
- I31.4
snomed:
- '35304003'
urgency: medium
description: Comprehensive evaluation and management of Cardiac Tamponade
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Beck''s triad: Hypotension, elevated JVP (distended neck veins), muffled heart
  sounds'
- 'Pulsus paradoxus: SBP drops >10 mmHg with inspiration (>10 mmHg decrease)'
- Tachycardia (compensatory response to maintain cardiac output)
- Dyspnea and orthopnea
- Chest pain or discomfort
- 'Signs of shock: Cool extremities, altered mental status, pallor'
- Tachypnea
- Electrical alternans on ECG (alternating QRS amplitude - beat-to-beat variation)
- Pericardial friction rub may be present
- 'Echocardiogram: Pericardial effusion with RA/RV collapse in diastole'
- 'Causes: Pericarditis, trauma, aortic dissection, malignancy, post-cardiac surgery,
  uremia, post-MI (free wall rupture)'
workup:
- Echocardiogram STAT (diagnostic)
- ECG (electrical alternans, low voltage)
- Chest X-ray (enlarged cardiac silhouette)
- Pericardial fluid analysis (cell count, culture, cytology)
treatment:
- 'Guideline-based treatment options for Cardiac Tamponade include:'
- 'Emergent pericardiocentesis: Needle aspiration via subxiphoid approach (ACC/AHA
  2023)'
- 'IV fluids: Aggressive resuscitation while preparing for drainage (ACC/AHA 2023)'
- Avoid positive pressure ventilation (decreases venous return) (ACC/AHA 2023)
- Drain 50-100mL often dramatic improvement (ACC/AHA 2023)
- 'Send fluid: Cell count, culture, cytology (ACC/AHA 2023)'
clinical_pearls:
- Medical emergency requiring immediate pericardiocentesis
- Don't wait for full Beck's triad - high suspicion with 2/3 findings + echo
- Fluids temporize but definitive treatment is drainage
- Echo shows RA collapse (early), then RV collapse (more specific)
- 'Post-drainage: Monitor for recurrence (malignant effusions)'
referrals:
- Cardiology/interventional for pericardiocentesis STAT
- Cardiac surgery if traumatic or post-operative
- ICU admission
differentials: []
