tree_id: OPHT-EYE-PAIN
name: Eye Pain (Encounter)
family: ophthalmology
specialty: Ophthalmology, Emergency Medicine, Primary Care
chief_complaint: Eye pain, eye discomfort
description: |
  Eye pain can result from ocular surface problems, intraocular pathology, or referred pain from surrounding structures.
  Red flags include vision changes, severe pain, photophobia, and trauma. Requires prompt evaluation to rule out serious conditions.
icd10: H57.1
snomed: "41652007"
presentations:
  - Eye pain (sharp, dull, aching, or burning)
  - Foreign body sensation
  - Photophobia (light sensitivity)
  - Tearing or discharge
  - Redness
  - Vision changes (blurred, decreased)
  - Headache
  - Pain with eye movement
urgency: High
referrals:
  emergency:
    - Sudden severe eye pain with vision loss
    - Suspected acute angle-closure glaucoma
    - Chemical injury to eye
    - Severe trauma
  urgent_ophthalmology:
    - Moderate to severe eye pain
    - Pain with vision changes
    - Eye pain not responding to treatment
workup:
  - History - onset, quality, associated symptoms, trauma, contact lens use
  - Visual acuity testing
  - External eye exam - lids, conjunctiva, sclera
  - Pupil exam - check for afferent pupillary defect
  - Fluorescein staining - identify corneal abrasion or ulcer
  - Intraocular pressure if glaucoma suspected
  - Slit-lamp examination if available
treatment:
  depends_on_cause:
    corneal_abrasion:
      - Topical antibiotic (erythromycin ointment or fluoroquinolone drops)
      - Cycloplegic for pain relief (cyclopentolate)
      - Pain control with NSAIDs or acetaminophen
      - No eye patch (delays healing)
    conjunctivitis:
      - Bacterial - topical antibiotic (erythromycin, fluoroquinolone)
      - Viral - supportive care, artificial tears
      - Allergic - antihistamine drops, mast cell stabilizers
    acute_angle_closure_glaucoma:
      - Emergency - immediate ophthalmology consultation
      - Lower IOP - acetazolamide, topical beta-blocker, alpha-agonist
      - Definitive treatment - laser peripheral iridotomy
    uveitis:
      - Topical corticosteroids (prednisolone acetate)
      - Cycloplegic (atropine)
      - Ophthalmology referral for monitoring
clinical_pearls:
  - Red eye with severe pain and vision changes is emergency
  - Acute angle-closure glaucoma - severe pain, mid-dilated pupil, steamy cornea, hard eye
  - Contact lens wearers with eye pain require urgent evaluation for corneal ulcer
  - Foreign body sensation with normal exam may be corneal abrasion
  - Iritis/uveitis - pain with photophobia, small pupil, circumlimbal injection
differentials:
  - Corneal abrasion
  - Foreign body
  - Conjunctivitis
  - Keratitis or corneal ulcer
  - Acute angle-closure glaucoma
  - Uveitis/iritis
  - Scleritis/episcleritis
  - Optic neuritis
  - Referred pain (sinusitis, migraine, cluster headache)
trace:
  - 25-year-old contact lens wearer presents with severe right eye pain, photophobia, decreased vision. Exam shows ciliary injection, hazy cornea, small irregular pupil. Fluorescein shows corneal infiltrate. Diagnose bacterial keratitis. Refer immediately to ophthalmology. Started on fortified topical antibiotics hourly. Culture grows Pseudomonas. Treated aggressively. Vision recovers with small corneal scar.
citations:
  - American Academy of Ophthalmology Guidelines
  - UpToDate - Emergency Medicine and Ophthalmology
