  snomed:
    - '441742003'
  icpc2: []
sources:
  - text: UpToDate - Laboratory Medicine
    origin: citations
  - text: American Family Physician Guidelines
    origin: citations
presentations:
  - Incidental abnormal lab finding
  - Targeted testing with abnormal result
  - Screening test abnormality
differentials:
  - Laboratory error
  - Benign or physiologic variation
  - Medication effect
  - Underlying disease requiring treatment
  - Requires specialist evaluation
workup:
  general_approach:
    - Review specific abnormal results
    - Assess clinical significance (mild vs severe abnormality)
    - Determine if acute or chronic
    - Correlate with symptoms and clinical context
    - Check for laboratory error (hemolysis, improper collection)
    - Review medications that could cause abnormality
    - Repeat if borderline or unexplained
  common_abnormalities:
    anemia:
      - CBC with indices, reticulocyte count
      - Iron studies, B12, folate
      - Peripheral smear
    thrombocytopenia:
      - Repeat CBC, peripheral smear
      - Rule out pseudothrombocytopenia
      - Hematology referral if persistent
    elevated_liver_enzymes:
      - Hepatitis panel, autoimmune markers
      - Abdominal ultrasound
      - Review medications and alcohol use
    elevated_creatinine:
      - Repeat BMP, urinalysis
      - Calculate GFR
      - Renal ultrasound if concern for obstruction
    hyperglycemia:
      - Repeat fasting glucose or A1c
      - Diabetes workup
    electrolyte_abnormalities:
      - Repeat to confirm
      - Assess severity and symptoms
      - Identify underlying cause
treatment:
  approach:
    - Treat underlying cause of abnormality
    - Adjust or discontinue offending medications
    - Repeat testing to monitor trend
    - Refer to specialist if appropriate
  mild_abnormalities:
    - Often can observe with repeat testing
    - Address modifiable factors
  moderate_to_severe_abnormalities:
    - May require urgent intervention
    - Specialist referral
    - Hospitalization if severe
clinical_pearls:
  - Not all abnormalities are clinically significant
  - Always repeat borderline results before extensive workup
  - Consider laboratory error or specimen issues
  - Correlate lab findings with clinical picture
  - Trending values over time more informative than single result
  - Document discussion of results with patient
