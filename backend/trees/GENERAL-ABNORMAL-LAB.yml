tree_id: GENERAL-ABNORMAL-LAB
name: Abnormal Lab Result (Encounter)
version: '1.0'
status: draft
family: general
specialty: Primary Care
secondary_specialties:
  - Internal Medicine
urgency: routine
urgency_explanation: ''
chief_complaint: Abnormal lab results, follow-up of test results
description: |
  Encounter to evaluate and manage abnormal laboratory test results.
  Approach depends on specific abnormality - may require repeat testing, additional workup, or referral.
applies_to:
  sex: null
  age_min: null
  age_max: null
