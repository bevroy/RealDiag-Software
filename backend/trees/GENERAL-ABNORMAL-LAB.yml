trace:
  - 40-year-old asymptomatic woman with elevated ALT 85, AST 72 on routine screening. BMI 32. No alcohol use. Negative viral hepatitis panel. Ultrasound shows hepatic steatosis. Diagnose non-alcoholic fatty liver disease (NAFLD). Counsel on weight loss and exercise. Repeat LFTs in 3 months show improvement to ALT 58. Continue lifestyle modifications.
