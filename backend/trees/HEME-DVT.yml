trace:
  - Patient presents with unilateral leg swelling
  - Calculate Wells score
  - If low/moderate probability: Order D-dimer
  - If high probability or positive D-dimer: Compression ultrasound
  - If DVT confirmed: Initiate anticoagulation
  - Risk stratify for recurrence and determine treatment duration
