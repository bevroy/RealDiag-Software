tree_id: DERM-ONYCHOMYCOSIS
name: Onychomycosis (Fungal Nail Infection)
family: Dermatology
specialty: Dermatology
chief_complaint: Thick discolored toenails
description: Fungal infection of nail plate causing thickening, discoloration, and onycholysis. Oral terbinafine most effective treatment (70-80% cure rate), topical therapy less effective, prolonged treatment required due to slow nail growth.
icd10: B35.1
snomed: 414941008
presentations:
  - Thickened, discolored nails (yellow-brown)
  - Brittle, crumbling nails
  - Subungual debris
  - Onycholysis (nail separation)
  - Usually toenails > fingernails
  - Painless unless secondary infection
urgency: non-urgent

referrals:
  emergency:
    - Suspected necrotizing fasciitis
    - Stevens-Johnson syndrome/TEN
    - Anaphylaxis
  urgent:
    - Suspected melanoma
    - Rapidly growing lesion
    - Severe drug reaction
    - Suspected malignancy
  routine:
    - Chronic dermatitis management
    - Acne unresponsive to treatment
    - Cosmetic concerns
    - Mole surveillance

workup:
  - Clinical diagnosis: thickened, yellow-brown discolored nails with onycholysis (nail separation from nail bed)
  - Distribution: toenails much more common than fingernails (80% toenails, often great toe)
  - Types: distal lateral subungual (most common 90% - starts at distal nail and spreads proximally), white superficial (chalky white patches on nail surface), proximal subungual (rare, associated with immunosuppression)
  - Appearance: yellow or brown discoloration, thickening, subungual debris, onycholysis, nail plate crumbling
  - Risk factors: older age, diabetes, peripheral vascular disease, immunosuppression, tinea pedis, trauma, occlusive footwear
  - Confirm diagnosis before treatment: KOH prep or fungal culture (especially before starting oral therapy)
  - KOH preparation: nail clippings from affected area, treat with potassium hydroxide, visualize hyphae under microscopy
  - Fungal culture: more sensitive but takes 2-4 weeks, identifies species
  - PAS stain on nail clipping: most sensitive test if KOH negative
  - Lab confirmation important: only 50% of dystrophic nails are fungal (other causes include psoriasis, trauma, lichen planus)

treatment:
  - Oral antifungals (most effective): terbinafine first-line
  - Terbinafine 250 mg daily x12 weeks (toenails) or x6 weeks (fingernails)
  - Cure rate 70-80% (mycological cure), higher for fingernails than toenails
  - Monitor LFTs at baseline and 6 weeks (rare hepatotoxicity 1-2%)
  - Itraconazole 200 mg daily x12 weeks or pulse dosing 200 mg BID x1 week per month x3-4 months
  - Less effective than terbinafine, more drug interactions
  - Topical therapy: less effective (5-10% cure rate), only for mild disease or oral contraindication
  - Ciclopirox 8% lacquer daily x48 weeks (long treatment duration, low cure rate)
  - Efinaconazole 10% solution daily x48 weeks (newer, more effective than ciclopirox 15-20% cure)
  - Debridement: filing down thick nails improves penetration of topical therapy
  - Combination therapy: oral plus topical may improve cure rates
  - Laser therapy: emerging treatment, expensive, not covered by insurance, limited data
  - Surgical nail removal: rarely indicated, for painful dystrophic nails refractory to treatment
  - Prevention: treat tinea pedis, keep feet dry, breathable footwear, avoid walking barefoot in public areas
  - Recurrence common: 20-50% within 5 years (reinfection vs relapse)
  - Realistic expectations: slow nail growth (toenails grow 1 mm per month), full cure takes 12-18 months after completing treatment

clinical_pearls:
  - Thick yellow-brown discolored toenails with onycholysis
  - Confirm with KOH prep or culture before starting oral treatment
  - Terbinafine 250 mg daily x12 weeks most effective (70-80% cure rate)
  - Monitor LFTs at baseline and 6 weeks on terbinafine
  - Topical therapy only 5-10% cure rate (mild disease or oral contraindication)
  - Full cure takes 12-18 months due to slow nail growth
  - Recurrence common 20-50% within 5 years
  - Only 50% of dystrophic nails are fungal (confirm before treating)

differentials:
  - Psoriatic nails: pitting, oil drop sign (yellow-brown discoloration), onycholysis, associated with psoriasis plaques
  - Traumatic nail dystrophy: history of trauma, affects one nail typically, no fungal elements on KOH
  - Lichen planus: thinning of nail plate, pterygium formation (scarring), affects multiple nails
  - Yellow nail syndrome: slow-growing thick yellow nails, associated with lymphedema and pleural effusions

trace: |
  A 62-year-old man with diabetes presented with 5 years of progressive thickening and yellowing of right great toenail. No pain but difficult to trim, embarrassed to go barefoot. Exam showed right great toenail markedly thickened, yellow-brown discoloration, onycholysis involving distal 60% of nail, subungual debris. Other toenails mildly affected. Diagnosed with onychomycosis clinically. Obtained nail clippings from under distal nail plate and sent for KOH prep and fungal culture (confirm before starting oral therapy). KOH prep positive for fungal hyphae, culture pending. Baseline LFTs normal. Started terbinafine 250 mg daily x12 weeks. At 6 weeks LFTs rechecked - normal, continues treatment. At 12 weeks completed terbinafine course. Nail appearance unchanged (expected - nail grows slowly 1 mm per month). Fungal culture grew Trichophyton rubrum (dermatophyte - confirmed diagnosis). At 6 months post-treatment nail growing out from proximal nail fold appears clear and healthy, distal 40% still affected. At 12 months healthy nail grown out to 70%, trimmed off dystrophic distal portion. At 18 months nail 95% clear, significantly improved cosmetically. Counseled on recurrence risk, advised to keep feet dry, treat tinea pedis if develops, breathable footwear.
