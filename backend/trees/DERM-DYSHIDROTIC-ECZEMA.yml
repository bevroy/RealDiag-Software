tree_id: DERM-DYSHIDROTIC-ECZEMA
name: Dyshidrotic Eczema (Pompholyx)
family: Dermatology
specialty: Dermatology
chief_complaint: Itchy blisters on hands and feet
description: Recurrent vesicular eruption on palms, soles, and sides of fingers causing intense pruritus. High-potency topical corticosteroids control acute flares, chronic relapsing condition requiring maintenance therapy.
icd10: L30.1
urgency: non-urgent

workup:
  - Clinical diagnosis: small deep-seated vesicles on palms, soles, and lateral aspects of fingers
  - Appearance: clear fluid-filled vesicles 1-2 mm ("tapioca pudding"), grouped or scattered, intensely pruritic
  - Distribution: sides of fingers, palms, soles (spares dorsal hands)
  - Course: vesicles appear over 1-2 weeks, rupture and form erosions, desquamation and crusting, then resolution over 2-3 weeks
  - Chronic recurrent: most patients have repeated episodes triggered by stress, heat, humidity, sweating, allergen exposure
  - Bilateral symmetric: usually affects both hands
  - Triggers: emotional stress, sweating (hot humid weather), contact allergens (nickel, fragrances, preservatives), atopy
  - Associated conditions: atopic dermatitis (50% have personal/family history), allergic contact dermatitis, hyperhidrosis
  - Patch testing: consider if recurrent to identify contact allergen triggers
  - KOH prep: if diagnosis uncertain, rule out tinea manuum/pedis (fungal infection)
  - Complications: secondary bacterial infection (Staphylococcus aureus) if vesicles become pustular

treatment:
  - High-potency topical corticosteroids (first-line): most effective for acute flares
  - Clobetasol 0.05% cream or ointment twice daily x2-3 weeks to affected areas
  - Palms and soles tolerate high potency (thick skin, low absorption)
  - Taper to mid-potency after acute phase: triamcinolone 0.1% cream
  - Emollients: frequent application after hand washing, prevent dryness and cracking
  - Wet wraps: for severe flares, apply topical steroid then wrap with wet gauze overnight (increases penetration)
  - Oral corticosteroids: if severe extensive disease
  - Prednisone 40-60 mg daily x5-7 days then taper (short course for acute flare)
  - Antihistamines: for pruritus, hydroxyzine 25 mg Q6H or cetirizine 10 mg daily
  - Phototherapy: if chronic recurrent and not responding to topical therapy
  - Hand and foot PUVA (psoralen plus UVA) or narrowband UVB 3 times weekly x8-12 weeks
  - Immunosuppressants: for severe refractory cases
  - Methotrexate, cyclosporine, azathioprine (dermatology referral)
  - Botulinum toxin injections: if triggered by hyperhidrosis (reduces sweating)
  - Avoid triggers: identify and avoid contact allergens (nickel in jewelry, fragrances), stress management, keep hands cool and dry
  - Infection treatment: if secondary bacterial infection, add topical mupirocin or oral antibiotics (cephalexin)
  - Maintenance: hand care with frequent emollients, avoid harsh soaps and irritants, cotton gloves under vinyl gloves for wet work

clinical_pearls:
  - Small deep-seated vesicles on sides of fingers, palms, and soles
  - Intensely pruritic, bilateral symmetric distribution
  - High-potency topical steroids (clobetasol) first-line for acute flares
  - Chronic relapsing condition triggered by stress, heat, sweating, allergens
  - 50% have personal or family history of atopy
  - Palms and soles tolerate high-potency steroids (thick skin)
  - Consider patch testing if recurrent to identify contact allergen
  - Spares dorsal hands (vs contact dermatitis affects dorsal hands)

differentials:
  - Tinea manuum/pedis: asymmetric, annular scaling, KOH prep shows hyphae, responds to antifungals
  - Allergic contact dermatitis: acute onset after allergen exposure, affects dorsal hands more than palms, patch testing positive
  - Bullous impetigo: honey-crusted lesions, superficial bullae, bacterial culture positive, responds to antibiotics
  - Palmoplantar pustulosis: sterile pustules on palms and soles, associated with smoking and psoriasis

trace: |
  A 32-year-old woman with history of atopic dermatitis presented with 1 week of intensely itchy blisters on both hands. Started on sides of fingers, spreading to palms. Works as nurse with frequent hand washing. Recent high stress at work. Exam showed bilateral hands with multiple small deep-seated clear vesicles on lateral aspects of fingers and palms, sparing dorsal hands, excoriations from scratching, no pustules. Diagnosed with dyshidrotic eczema (pompholyx). Prescribed clobetasol 0.05% ointment twice daily to affected areas x3 weeks (high-potency steroid safe for palms). Hydroxyzine 25 mg at bedtime for pruritus and sleep. Emollient cream (CeraVe) frequently after hand washing. Advised to wear cotton gloves under vinyl gloves at work for wet work (hands constantly wet triggering flares). Stress management counseling. At 1 week pruritus improved 50%, vesicles drying. At 3 weeks significant improvement 80%, tapered to triamcinolone 0.1% cream daily maintenance. At 6 weeks clear, discontinued topical steroid, continues emollients. At 3 months recurrent flare during stressful period - restarted clobetasol for 2 weeks with rapid improvement. Counseled on chronic relapsing nature, keep clobetasol on hand for flares, stress management important, continue hand care with frequent emollients.
