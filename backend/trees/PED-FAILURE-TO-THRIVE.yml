urgency: medium
description: Comprehensive evaluation and management of Failure to Thrive
version: '1.0'
citations:
  - AAP (American Academy of Pediatrics) Clinical Practice Guidelines
  - NICE (National Institute for Health and Care Excellence) Pediatric Guidelines
  - UpToDate - Pediatrics
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Weight < 3rd percentile or crossing percentiles
- Inadequate weight gain
- Poor feeding or feeding difficulties
- Developmental delays may be present
- Organic or non-organic causes
workup: []
treatment:
  - 'Address underlying cause - nutritional, medical, or psychosocial'
  - 'Nutritional intervention - increase caloric density of feeds, high-calorie supplements (Pediasure, Boost Kid Essentials)'
  - 'Infants: Increase formula concentration gradually (22-24 cal/oz vs standard 20 cal/oz), more frequent feeds'
  - 'Add calorie boosters - MCT oil, butter, cream, avocado, nut butters (if age appropriate)'
  - 'Multivitamin with iron supplementation'
  - 'Feeding therapy if oral aversion or dysphagia - occupational or speech therapy referral'
  - 'Treat underlying medical conditions - GERD, celiac disease, cystic fibrosis, thyroid disorder, infections'
  - 'Address psychosocial factors - ensure food security, WIC referral, assess for neglect or food insecurity'
  - 'Close follow-up - weekly weight checks initially, goal weight gain 20-30g/day infants, 200-300g/week toddlers'
  - 'Consider NG or G-tube if severe malnutrition and oral feeding inadequate despite intervention'
  - 'Hospitalization if severe malnutrition (weight <3% for age), dehydration, or concerning psychosocial situation'
clinical_pearls: []
