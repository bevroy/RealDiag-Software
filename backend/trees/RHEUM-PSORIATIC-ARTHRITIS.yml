tree_id: RHEUM-PSORIATIC-ARTHRITIS
name: Psoriatic Arthritis
family: Rheumatology
specialty: Rheumatology
chief_complaint: Joint pain and swollen fingers with psoriasis
description: Inflammatory arthritis associated with psoriasis causing joint pain, dactylitis (sausage digits), and enthesitis. Multiple patterns including oligoarthritis, polyarthritis, and spondylitis. TNF inhibitors and IL-17/IL-23 inhibitors treat both skin and joints.
icd10: L40.50
urgency: routine

workup:
  - Psoriasis: 85% have skin disease before arthritis develops (but 15% have joint symptoms first)
  - Look for psoriatic plaques: scalp, extensor surfaces (elbows, knees), intergluteal cleft, nails
  - Nail changes: pitting, onycholysis (separation from nail bed), oil spots, subungual hyperkeratosis (highly specific for PsA)
  - Five patterns of joint involvement:
  - Oligoarthritis (70%): fewer than 5 joints, asymmetric, most common pattern
  - Polyarthritis (15%): 5 or more joints, symmetric, resembles rheumatoid arthritis but RF/anti-CCP negative
  - Distal interphalangeal (DIP) predominant (5%): DIP joints of hands, associated with nail disease
  - Spondylitis (5%): axial involvement similar to ankylosing spondylitis
  - Arthritis mutilans (5%): severe destructive arthritis with telescoping digits (rare)
  - Dactylitis: sausage digit (entire finger or toe swollen), highly specific for PsA
  - Enthesitis: inflammation at tendon insertions (Achilles, plantar fascia, lateral epicondyle), present in 30-50%
  - Inflammatory back pain: similar to AS if axial involvement
  - Labs: ESR and CRP elevated in active disease
  - Rheumatoid factor and anti-CCP: negative (seronegative arthritis)
  - HLA-B27: positive in 50% with axial involvement
  - X-rays: erosions with adjacent bone formation (pencil-in-cup deformity), periostitis, ankylosis, sacroiliitis if axial
  - Ultrasound or MRI: early synovitis, enthesitis, dactylitis

treatment:
  - NSAIDs (mild disease): naproxen 500 mg BID or ibuprofen 600-800 mg TID
  - Intra-articular corticosteroids: for oligoarthritis involving few joints
  - DMARDs (moderate disease):
  - Methotrexate 15-25 mg weekly with folic acid: first-line DMARD, treats joints more than skin
  - Monitor CBC and LFTs every 8-12 weeks
  - Sulfasalazine 2-3 g daily: for peripheral arthritis (not effective for axial or skin)
  - Leflunomide 20 mg daily: alternative to methotrexate
  - TNF inhibitors (first-line biologic for moderate-severe disease):
  - Adalimumab (Humira) 40 mg SC every 2 weeks
  - Etanercept (Enbrel) 50 mg SC weekly
  - Infliximab (Remicade) 5 mg/kg IV
  - Highly effective for joints, skin, enthesitis, dactylitis, and axial disease
  - Screen for TB before starting
  - IL-17 inhibitors (excellent for skin and joints):
  - Secukinumab (Cosentyx) 150-300 mg SC
  - Ixekizumab (Taltz) 80 mg SC every 2-4 weeks
  - Particularly effective for enthesitis, dactylitis, and axial disease
  - IL-23 inhibitors: guselkumab (Tremfya), risankizumab (Skyrizi) - excellent for skin, effective for joints
  - JAK inhibitors: tofacitinib (Xeljanz), upadacitinib (Rinvoq) - oral alternatives
  - Apremilast (Otezla): PDE4 inhibitor, oral medication, less effective than biologics but safer profile
  - Treat skin with dermatology: topical steroids, vitamin D analogs, phototherapy
  - Physical therapy: maintain joint mobility, strengthen muscles

clinical_pearls:
  - Psoriasis with inflammatory arthritis - look for nail changes (pitting, onycholysis)
  - Dactylitis (sausage digit) and enthesitis highly specific for PsA
  - Oligoarthritis (fewer than 5 joints, asymmetric) most common pattern
  - Seronegative arthritis (negative RF and anti-CCP)
  - DIP joint involvement classic (vs RA spares DIPs)
  - 15% have joint symptoms before skin disease appears
  - TNF inhibitors and IL-17 inhibitors treat both joints and skin
  - Screen for psoriatic plaques in scalp, intergluteal cleft, behind ears

differentials:
  - Rheumatoid arthritis: symmetric polyarthritis, positive RF or anti-CCP, spares DIP joints, no dactylitis
  - Osteoarthritis: DIP and PIP involvement but no inflammatory features, Heberden and Bouchard nodes
  - Gout: acute monoarthritis, crystal-proven, tophi, elevated uric acid
  - Reactive arthritis: oligoarthritis after infection, conjunctivitis, urethritis
  - Ankylosing spondylitis: axial predominant, no peripheral arthritis or dactylitis

trace: |
  A 38-year-old woman with psoriasis presented with 6 months of progressive joint pain and swelling. Right index finger and left great toe swollen like sausages (dactylitis). Left knee and right ankle swollen and painful. Morning stiffness 1 hour. History of psoriasis x10 years with plaques on elbows, knees, and scalp. Nails show multiple pits and onycholysis (nail separation). Right heel pain when walking (Achilles enthesitis). Exam showed dactylitis of right index finger and left great toe (entire digits swollen), left knee effusion, right ankle synovitis, psoriatic plaques on extensor surfaces, nail pitting and onycholysis both hands. Labs: ESR 38, CRP 22 (elevated), RF negative, anti-CCP negative (seronegative arthritis). X-ray hands showed erosions in right index finger PIP with adjacent periostitis (characteristic of PsA). Diagnosed with psoriatic arthritis oligoarticular pattern (fewer than 5 joints with dactylitis, enthesitis, nail disease, seronegative). Started methotrexate 15 mg weekly with folic acid 1 mg daily. Referred to dermatology for skin management. At 6 weeks minimal improvement in joints. Increased methotrexate to 20 mg weekly. At 3 months still active synovitis and dactylitis. Started adalimumab (Humira) 40 mg SC every 2 weeks after negative TB screen (PPD negative). At 8 weeks on TNF inhibitor significant improvement: dactylitis resolved, synovitis improved 70%, skin lesions improved, heel pain resolved. At 6 months ESR 12, CRP 4, excellent control of joints and skin on adalimumab plus methotrexate. Continues combination therapy. Annual ophthalmology screening for uveitis (can occur with PsA). Counseled that PsA chronic condition requiring ongoing treatment to prevent joint damage.
