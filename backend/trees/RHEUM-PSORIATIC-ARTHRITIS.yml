tree_id: RHEUM-PSORIATIC-ARTHRITIS
name: Psoriatic Arthritis
family: musculoskeletal
specialty: Rheumatology
chief_complaint: Joint pain and swelling with psoriasis
description: Inflammatory arthritis associated with psoriasis affecting joints, entheses, and spine
icd10: L40.50
urgency: routine
workup:
  - Clinical diagnosis based on inflammatory arthritis with psoriasis
  - CASPAR criteria (Classification Criteria for Psoriatic Arthritis) - inflammatory arthritis plus 3 or more points
  - Psoriasis (current 2 pts, history 1 pt, family history 1 pt), nail dystrophy (1 pt), negative RF (1 pt), dactylitis (1 pt), juxta-articular new bone formation on X-ray (1 pt)
  - Complete joint examination - assess for swelling, tenderness, dactylitis (sausage digits)
  - Skin examination - look for psoriatic plaques (may be hidden in scalp, umbilicus, gluteal cleft, nails)
  - Nail examination - pitting, onycholysis, oil spots, subungual hyperkeratosis
  - Enthesitis assessment - Achilles tendon, plantar fascia insertion, lateral epicondyle
  - X-rays of affected joints - erosions, periostitis, pencil-in-cup deformity, ankylosis
  - Axial involvement - sacroiliitis (unilateral or bilateral), syndesmophytes
  - ESR and CRP (elevated in active disease, but can be normal)
  - Rheumatoid factor (RF) and anti-CCP antibody (negative, distinguishes from RA)
  - Complete blood count (mild anemia of chronic disease)
  - Comprehensive metabolic panel (baseline before starting medications)
  - HLA-B27 (positive in 50% with axial disease, not required for diagnosis)
  - Screening for tuberculosis (PPD or IGRA) before starting biologics
  - Hepatitis B and C screening before immunosuppression
  - Ultrasound or MRI for early detection of synovitis, enthesitis, erosions
treatment:
  - Treat both skin and joint manifestations
  - NSAIDs (naproxen 500 mg BID, indomethacin 25-50 mg TID) for mild disease
  - Intra-articular corticosteroid injections for single joint involvement
  - DMARDs for moderate-severe disease or inadequate response to NSAIDs
  - Methotrexate 15-25 mg weekly (first-line DMARD) with folic acid 1 mg daily
  - Sulfasalazine 2-3 g daily (alternative, better for peripheral arthritis than axial)
  - Leflunomide 20 mg daily (alternative)
  - Biologic DMARDs for inadequate response to conventional DMARDs or severe disease
  - TNF inhibitors - adalimumab 40 mg SC every 2 weeks, etanercept 50 mg SC weekly, infliximab 5 mg/kg IV at 0,2,6 weeks then every 8 weeks
  - IL-17 inhibitors - secukinumab 150-300 mg SC monthly, ixekizumab 80 mg SC every 4 weeks (very effective for skin and joints)
  - IL-12/23 inhibitor - ustekinumab 45-90 mg SC at 0,4 weeks then every 12 weeks
  - IL-23 inhibitors - guselkumab 100 mg SC at 0,4 weeks then every 8 weeks
  - JAK inhibitors - tofacitinib 5 mg BID (oral option)
  - Physical therapy and occupational therapy
  - Treat skin psoriasis (topical steroids, vitamin D analogs, phototherapy)
  - Monitor for complications - cardiovascular disease, metabolic syndrome, depression
  - Vaccinations before starting biologics (pneumococcal, influenza, hepatitis B)
clinical_pearls:
  - 30% of psoriasis patients develop psoriatic arthritis, usually skin disease precedes joint disease
  - 15% develop arthritis before skin psoriasis (difficult diagnosis)
  - Five patterns - asymmetric oligoarticular (most common 70%), symmetric polyarthritis (RA-like 15%), DIP predominant (5%), arthritis mutilans (5%), spondylitis (5%)
  - Dactylitis (sausage digit) in 30-50% - hallmark feature, entire digit swollen
  - Enthesitis in 30-50% - inflammation at tendon/ligament insertion, Achilles most common
  - DIP joint involvement distinguishes from RA (RA spares DIPs)
  - Nail disease in 80-90% of PsA patients (vs 50% with psoriasis alone) - strong association
  - Radiographic features - periostitis (fluffy new bone formation), pencil-in-cup deformity, ankylosis
  - RF and anti-CCP negative (seronegative spondyloarthropathy)
  - IL-17 inhibitors very effective for both skin and joints in PsA
differentials:
  - Rheumatoid arthritis - symmetric polyarthritis, RF/anti-CCP positive, spares DIP joints
  - Osteoarthritis - DIP and PIP involvement but non-inflammatory (no swelling), Heberden/Bouchard nodes
  - Reactive arthritis - asymmetric oligoarthritis after infection, conjunctivitis, urethritis
  - Gout - acute monoarthritis, negatively birefringent crystals, elevated uric acid
  - Ankylosing spondylitis - axial disease, HLA-B27 positive, no psoriasis
  - Enteropathic arthritis - associated with IBD (Crohn, UC)
trace:
  - 38-year-old man with 10-year history of plaque psoriasis presents with 6-month history of joint pain and swelling
  - Bilateral hand pain and swelling, right knee swelling, left heel pain
  - Morning stiffness lasting 90 minutes
  - Right 3rd finger swollen entire digit (dactylitis)
  - Psoriasis treated with topical steroids, affects scalp, elbows, knees (5% BSA)
  - Physical exam - swollen and tender right 2nd, 3rd, 4th PIP and DIP joints, left 3rd DIP joint
  - Right knee effusion, tenderness
  - Dactylitis of right 3rd finger (sausage digit)
  - Enthesitis at left Achilles tendon insertion
  - Skin - psoriatic plaques on scalp, elbows, knees
  - Nail pitting bilateral, onycholysis on several nails
  - Labs - ESR 42 mm/hr (elevated), CRP 18 mg/L (elevated)
  - RF negative, anti-CCP negative
  - HLA-B27 negative
  - CBC and CMP normal
  - X-rays hands - erosions at right 3rd PIP and DIP joints, periostitis, no pencil-in-cup yet
  - X-ray right knee - joint space narrowing, small erosion
  - Quantiferon-TB negative
  - Hepatitis B and C negative
  - Diagnosis - Psoriatic arthritis, moderate severity
  - CASPAR criteria - inflammatory arthritis plus current psoriasis (2 pts), nail dystrophy (1 pt), negative RF (1 pt), dactylitis (1 pt) = 5 points (meets criteria)
  - Started methotrexate 15 mg weekly with folic acid 1 mg daily
  - Naproxen 500 mg BID for symptomatic relief
  - Dermatology co-management for skin psoriasis
  - 3-month follow-up - minimal improvement, still significant pain and swelling
  - ESR 38 mm/hr, CRP 15 mg/L
  - Inadequate response to methotrexate, added TNF inhibitor adalimumab 40 mg SC every 2 weeks
  - 6-month follow-up on combination therapy - dramatic improvement
  - Joint pain and swelling markedly reduced, dactylitis resolved
  - Skin psoriasis 90% improved (1% BSA)
  - ESR 12 mm/hr, CRP 3 mg/L (normalized)
  - Continued combination therapy (methotrexate plus adalimumab)
  - 2-year follow-up - sustained remission, no new erosions on repeat X-rays
  - Outcome - Excellent response to biologic therapy, good functional status
