tree_id: ENDO-ADDISONS-DISEASE
name: Addison's Disease (Primary Adrenal Insufficiency)
family: Endocrinology
specialty: Endocrinology
chief_complaint: Fatigue, weight loss, and hypotension
description: |
  Destruction of adrenal cortex causing deficiency of cortisol and aldosterone. Most common cause autoimmune (70-90%).
  Other causes include tuberculosis, hemorrhage, metastatic cancer, HIV. Addisonian crisis is life-threatening acute presentation with shock.
icd10: E27.1
urgency: High
workup:
  - Morning cortisol (8 AM) less than 3 mcg/dL suggests adrenal insufficiency, greater than 18 mcg/dL rules out
  - ACTH stimulation test (cosyntropin test) diagnostic - give synthetic ACTH 250 mcg IV/IM, measure cortisol at 0 and 60 minutes
  - Normal response cortisol rises to greater than 18-20 mcg/dL at 60 minutes, failure to rise confirms adrenal insufficiency
  - ACTH level elevated in primary adrenal insufficiency (greater than 100 pg/mL), low-normal in secondary
  - Basic metabolic panel - hyponatremia, hyperkalemia, hypoglycemia, elevated creatinine
  - Aldosterone low, renin elevated (primary AI affects both cortisol and aldosterone)
  - Adrenal antibodies (21-hydroxylase antibodies) positive in autoimmune etiology
  - CT adrenal glands if non-autoimmune cause suspected (hemorrhage, infection, metastases)
treatment:
  - Glucocorticoid replacement - hydrocortisone 15-25 mg/day divided (10-15 mg morning, 5-10 mg afternoon mimics diurnal rhythm)
  - Alternative prednisone 5-7.5 mg daily or dexamethasone 0.5-0.75 mg daily
  - Mineralocorticoid replacement - fludrocortisone 0.05-0.2 mg daily (replace aldosterone)
  - Adjust doses based on symptoms, electrolytes, blood pressure, and renin levels
  - Stress dose steroids during illness, surgery, trauma - hydrocortisone 50-100 mg IV q6-8h
  - Patient education - wear medical alert bracelet, carry emergency hydrocortisone injection, sick day rules (double or triple dose during illness)
  - Addisonian crisis (acute adrenal insufficiency) - immediate treatment before confirmation
  - Crisis treatment - hydrocortisone 100 mg IV bolus, then 50 mg IV q6h, aggressive IV fluid resuscitation (normal saline 1-2L), dextrose if hypoglycemic, treat precipitating cause
clinical_pearls:
  - Classic presentation includes fatigue, weakness, weight loss, hypotension, hyperpigmentation (ACTH stimulates melanocytes)
  - Hyperpigmentation in palmar creases, buccal mucosa, pressure points (not seen in secondary AI)
  - Salt craving from aldosterone deficiency
  - Acute crisis precipitated by infection, surgery, trauma, or abrupt steroid withdrawal
  - Always give stress dose steroids before surgery (even minor procedures)
  - Screen for other autoimmune diseases (thyroid, diabetes, vitiligo) - polyglandular autoimmune syndrome
differentials:
  - Secondary adrenal insufficiency (pituitary/hypothalamic)
  - Chronic fatigue syndrome
  - Depression
  - Anorexia nervosa
  - Hyperthyroidism
  - Sepsis
trace:
  - Progressive fatigue, weakness, weight loss 15 lbs over 6 months, darkening skin → Orthostatic hypotension, hyperpigmentation in palmar creases → Sodium 128 mEq/L, potassium 5.6 mEq/L, glucose 62 mg/dL → Morning cortisol 2.1 mcg/dL → ACTH stimulation test, cortisol fails to rise (peak 8 mcg/dL at 60 min) → ACTH 450 pg/mL (elevated) → Diagnose primary adrenal insufficiency → Start hydrocortisone 20 mg AM, 10 mg early afternoon, fludrocortisone 0.1 mg daily → Symptoms improve, electrolytes normalize → Patient education on stress dosing and emergency treatment
