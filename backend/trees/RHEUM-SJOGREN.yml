tree_id: RHEUM-SJOGREN
name: Sjögren's Syndrome
family: Rheumatology
specialty: Rheumatology
icd10:
- M35.00
- M35.09
snomed:
- '83901003'
urgency: medium
description: Comprehensive evaluation and management of Sjögren's Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Dry eyes (keratoconjunctivitis sicca)
- Dry mouth (xerostomia)
- Parotid gland enlargement
- Dental caries
- Positive anti-SSA/SSB
workup:
- 'Anti-SSA (Ro) antibodies: 70% sensitive, 95% specific for primary Sjögren''s'
- 'Anti-SSB (La) antibodies: 40% sensitive, 98% specific - if positive, almost always
  has anti-SSA too'
- 'ANA: Positive in 80%, RF positive in 50%'
- 'Schirmer test: <5mm wetting of filter paper in 5 minutes = dry eyes (normal >15mm)'
- 'Salivary gland biopsy (minor salivary glands in lip): Focal lymphocytic sialadenitis
  - gold standard but rarely needed'
treatment:
- 'Guideline-based treatment options for Sjögren''s Syndrome include:'
- 'Dry eyes: Artificial tears (preservative-free) q2-4h, cyclosporine 0.05% drops
  BID (increases tear production), punctal plugs if severe (ACR 2023)'
- 'Dry mouth: Sugar-free gum, sips of water, saliva substitutes, pilocarpine 5mg QID
  or cevimeline 30mg TID (stimulate secretions) (ACR 2023)'
- 'Dental care: Fluoride rinses, frequent dental cleanings, avoid sugary foods (ACR
  2023)'
- 'Systemic symptoms: Hydroxychloroquine 200-400mg daily for arthritis/fatigue (ACR
  2023)'
- 'Monitor for lymphoma: Annual exam for persistent parotid swelling, lymphadenopathy,
  constitutional symptoms (ACR 2023)'
clinical_pearls:
- Autoimmune exocrinopathy - lymphocytic infiltration of lacrimal and salivary glands,
  female 9:1
- 'Primary Sjögren''s (50%): Isolated dry eyes/mouth. Secondary (50%): Associated
  with RA, SLE, scleroderma'
- 'Extraglandular: Arthritis (60%), interstitial lung disease, renal tubular acidosis,
  peripheral neuropathy, lymphoma risk (5-10%, 40x general population)'
- 'Dental complications: Rampant caries, candidiasis from dry mouth - needs aggressive
  dental prevention'
- 'Parotid enlargement: Bilateral, recurrent - if unilateral/hard, consider lymphoma
  (MALT)'
referrals:
- Rheumatology for diagnosis confirmation and management
- Ophthalmology for dry eye management (punctal plugs, cyclosporine drops)
- Dentistry for preventive care
differentials:
  - Dry mouth from medications
  - Sicca syndrome from other cause
  - Lupus
  - RA
  - Lymphoma
trace:
  source: American College of Rheumatology (ACR) Guidelines, European League Against
    Rheumatism (EULAR)
