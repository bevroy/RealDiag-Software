tree_id: PED-STREP-THROAT
name: Streptococcal Pharyngitis (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/Infectious Disease
icd10: J02.0
snomed: 43878008
urgency: []
homeopathy: []
presentations:
  - Sore throat (acute onset)
  - Painful swallowing (odynophagia)
  - Fever (often >101°F)
  - Tonsillar erythema and exudate
  - Tender anterior cervical lymphadenopathy
  - Headache
  - Abdominal pain (especially in younger children)
  - Nausea or vomiting
  - Scarlatiniform rash (sandpaper texture, flexural accentuation)
  - ABSENCE of cough or rhinorrhea (suggests strep over viral)
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Fever pattern
  - Associated symptoms (cough, rhinorrhea, conjunctivitis suggest viral)
  - Sick contacts or strep exposure
  - Recent scarlet fever or rheumatic fever
  - Immunization status
  - Physical examination
  - Vital signs (fever common)
  - Oropharyngeal examination
  - Tonsillar erythema and hypertrophy
  - Tonsillar or pharyngeal exudate
  - Palatal petechiae (highly specific for strep)
  - Uvular edema
  - Neck examination - tender anterior cervical lymphadenopathy
  - Skin examination for scarlatiniform rash
  - Strawberry tongue (acute phase)
  - Sandpaper-textured rash (erythematous, blanching, flexural accentuation)
  - Absence of viral features (conjunctivitis, rhinorrhea, cough)
  - Modified Centor Criteria (clinical prediction)
  - Age 3-14 years: +1 point
  - Age 15-44 years: 0 points
  - Age ≥45 years: -1 point
  - Temperature >100.4°F (38°C): +1 point
  - Absence of cough: +1 point
  - Tender anterior cervical lymphadenopathy: +1 point
  - Tonsillar swelling or exudate: +1 point
  - "Score interpretation:"
  - "0-1 points: 1-2.5% risk, no testing or antibiotics"
  - "2-3 points: 11-17% risk, perform rapid strep test"
  - "4-5 points: 51-53% risk, empiric treatment OR rapid test"
  - Laboratory testing
  - Rapid antigen detection test (RADT)
  - Sensitivity 70-90%, specificity 95%
  - Results in 5-10 minutes
  - If positive: treat (no backup culture needed)
  - If negative in children/adolescents: backup throat culture recommended
  - Throat culture (gold standard)
  - Sensitivity 90-95%
  - Results in 24-48 hours
  - Positive culture confirms diagnosis
  - Testing NOT recommended if
  - Strong viral features (cough, rhinorrhea, conjunctivitis, oral ulcers)
  - Age <3 years (acute rheumatic fever very rare, GAS pharyngitis uncommon)
treatment:
  - Antibiotic therapy (ONLY if positive test - do not treat based on symptoms alone)
  - First-line: Penicillin or Amoxicillin
  - Penicillin V: 250 mg (≤27 kg) or 500 mg (>27 kg) PO twice or three times daily for 10 days
  - Amoxicillin: 50 mg/kg once daily (max 1000 mg) OR 25 mg/kg twice daily (max 500 mg per dose) for 10 days
  - Better palatability than penicillin V
  - Equivalent efficacy with once-daily dosing (improves adherence)
  - Intramuscular benzathine penicillin G: single dose if adherence concern
  - 600,000 units (<27 kg) or 1,200,000 units (≥27 kg) IM
  - Painful injection but 100% adherence
  - Penicillin allergy (non-anaphylactic)
  - Cephalexin: 20 mg/kg/dose PO twice daily (max 500 mg per dose) for 10 days
  - Cefadroxil: 30 mg/kg once daily (max 1 g) for 10 days
  - Penicillin allergy (anaphylactic or severe)
  - Azithromycin: 12 mg/kg once daily (max 500 mg) for 5 days
  - Increasing resistance in some areas
  - Clindamycin: 7 mg/kg/dose PO three times daily (max 300 mg per dose) for 10 days
  - Macrolide resistance testing if treatment failure
  - Duration: 10 days for beta-lactams (DO NOT shorten to 5 days - increases rheumatic fever risk)
  - Symptomatic treatment
  - Analgesics/antipyretics: ibuprofen 10 mg/kg every 6 hours OR acetaminophen 15 mg/kg every 4-6 hours
  - Throat lozenges or sprays (older children)
  - Soft foods and adequate hydration
  - Salt water gargles (older children)
  - Return to school/activities
  - Can return after 24 hours of antibiotics AND afebrile for 24 hours
  - Treatment goals
  - Prevent acute rheumatic fever (most important)
  - Reduce symptoms (shortens duration by ~1 day)
  - Prevent suppurative complications (peritonsillar abscess, cervical lymphadenitis)
  - Reduce transmission
  - Indications for tonsillectomy (if recurrent strep pharyngitis)
  - ≥7 episodes in 1 year
  - ≥5 episodes per year for 2 years
  - ≥3 episodes per year for 3 years
  - Episodes must be well-documented (positive tests, not just symptomatic)
clinical_pearls:
  - 'Group A strep (GAS) pharyngitis peaks age 5-15 years - rare in children <3 years (testing not recommended unless sibling or contact)'
  - 'Centor criteria help predict strep likelihood: 4-5 points = 51% risk, 0-1 points = <3% risk'
  - 'Positive rapid strep test = treat (no backup culture needed); negative in children = backup culture recommended'
  - 'Palatal petechiae highly specific for strep pharyngitis (not seen in viral pharyngitis)'
  - 'Penicillin/amoxicillin first-line (GAS never developed resistance) - 10 days duration prevents rheumatic fever'
  - 'Scarlet fever = strep pharyngitis + erythrogenic toxin rash (sandpaper texture, flexural accentuation) - same treatment as strep throat'
  - 'Can return to school after 24 hours of antibiotics (no longer contagious)'
  - 'DO NOT treat pharyngitis based on appearance alone (exudate can be viral) - testing required'
  - 'Viral pharyngitis much more common than strep - cough, rhinorrhea, conjunctivitis suggest viral (do not test)'
  - 'Treatment prevents acute rheumatic fever (primary goal) but only shortens symptoms by ~1 day'
referrals:
  - Otolaryngology (ENT) if recurrent strep pharyngitis meeting tonsillectomy criteria
  - Infectious disease if treatment failure with multiple antibiotics or suspected antibiotic resistance
  - Cardiology if concern for acute rheumatic fever (migratory polyarthritis, carditis, chorea, subcutaneous nodules, erythema marginatum)
  - Nephrology if post-streptococcal glomerulonephritis (hematuria, edema, hypertension 1-3 weeks after pharyngitis)
differentials:
  - Group A streptococcal pharyngitis (fever, exudate, palatal petechiae, NO cough, positive rapid test)
  - Viral pharyngitis (most common - cough, rhinorrhea, conjunctivitis, gradual onset, supportive care only)
  - Infectious mononucleosis (EBV - marked tonsillar hypertrophy, fatigue, hepatosplenomegaly, avoid amoxicillin - causes rash)
  - Peritonsillar abscess (unilateral tonsillar bulge, trismus, muffled voice, uvular deviation - requires drainage)
  - Retropharyngeal abscess (fever, neck stiffness, drooling, toxic appearance - requires imaging and drainage)
  - Epiglottitis (rare post-Hib vaccine - toxic, drooling, tripod positioning - airway emergency)
  - Diphtheria (pseudomembrane, bull neck, unimmunized - rare in US)
  - Candidal pharyngitis (white plaques, immunocompromised, recent antibiotics)
  - HSV pharyngitis (oral ulcers, gingivostomatitis, younger children)
