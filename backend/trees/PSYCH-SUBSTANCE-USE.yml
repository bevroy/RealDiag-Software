treatment:
  - Screen with validated tools - CAGE, AUDIT (alcohol), DAST (drugs), tobacco use assessment
  - Brief intervention - SBIRT model (Screening, Brief Intervention, Referral to Treatment) effective in primary care
  - Motivational interviewing - patient-centered counseling to enhance intrinsic motivation for change
  - 'Medication for opioid use disorder (MOUD): Buprenorphine/naloxone (Suboxone) first-line, methadone, naltrexone'
  - 'Alcohol use disorder: Naltrexone 50mg daily (reduces craving), acamprosate 666mg TID (helps abstinence), disulfiram 250mg daily (aversive)'
  - 'Tobacco: Varenicline (Chantix) 1mg BID most effective, bupropion SR 150mg BID, nicotine replacement (patch, gum, lozenge)'
  - 'Stimulant use disorder: No FDA-approved medications, behavioral therapy (contingency management, CBT)'
  - Intensive outpatient programs (IOP), partial hospitalization (PHP), residential treatment for severe cases
  - Mutual support groups - AA (alcohol), NA (narcotics), SMART Recovery (evidence-based alternative)
  - Address co-occurring psychiatric disorders - depression, anxiety, PTSD (dual diagnosis treatment)
  - Harm reduction strategies - naloxone distribution, fentanyl test strips, safe supply programs
  - Relapse prevention planning - identify triggers, coping strategies, support system
  - Long-term follow-up essential - substance use disorder is chronic relapsing condition
