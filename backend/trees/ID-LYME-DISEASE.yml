tree_id: ID-LYME-DISEASE
name: Lyme Disease
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Bull's-eye rash after tick bite
description: Tick-borne infection caused by Borrelia burgdorferi transmitted by Ixodes ticks. Early localized disease presents with erythema migrans, early disseminated with multiple lesions and neurologic/cardiac manifestations, late disease with arthritis. Doxycycline first-line treatment.
icd10: A69.20
urgency: routine

workup:
  - Three stages of Lyme disease:
  - Early localized (3-30 days after tick bite): erythema migrans, flu-like symptoms
  - Early disseminated (days to weeks): multiple erythema migrans, neurologic, cardiac
  - Late disseminated (months to years): Lyme arthritis, chronic neurologic
  - Erythema migrans (EM): pathognomonic rash in 70-80% of cases
  - Expanding red rash with central clearing (bull's-eye or target appearance)
  - Appears 3-30 days after tick bite (median 7 days)
  - Starts at site of tick bite, expands to 5 cm or larger
  - Not painful or pruritic (distinguishes from allergic reaction to bite)
  - Multiple EM lesions indicate early disseminated disease
  - Tick exposure: Ixodes scapularis (deer tick) in Northeast, Upper Midwest, or Northern California
  - Tick must be attached over 36 hours to transmit (feeding time required)
  - Patients often do not recall tick bite (nymphal ticks tiny)
  - Constitutional symptoms: fever, headache, fatigue, myalgias, arthralgias
  - Early disseminated manifestations:
  - Neurologic (15%): facial nerve palsy (bilateral in 25%), meningitis, radiculoneuritis
  - Cardiac (1%): AV block (first, second, or third degree), myopericarditis
  - Late disseminated: Lyme arthritis (60% if untreated), oligoarthritis, knee most common
  - Serologic testing: two-tier testing (ELISA then Western blot if positive)
  - Early disease (under 4 weeks): serology often negative (takes 4-6 weeks to develop antibodies)
  - Do NOT order serology if classic EM present - clinical diagnosis
  - If serology ordered: ELISA screening, if positive or equivocal confirm with Western blot
  - IgM positive: acute infection (but false positives common)
  - IgG positive: past or current infection (remains positive for life after treatment)
  - Lyme arthritis: synovial fluid inflammatory (WBC 3000-100000), PCR positive for Borrelia
  - Neuroborreliosis: CSF lymphocytic pleocytosis, elevated protein, Lyme antibodies in CSF
  - Cardiac: ECG shows AV block if cardiac involvement

treatment:
  - Early localized and early disseminated (without neurologic or cardiac):
  - Doxycycline 100 mg BID x10-21 days (first-line, 14 days typical)
  - Amoxicillin 500 mg TID x14-21 days (if doxycycline contraindicated - pregnancy, age under 8)
  - Cefuroxime 500 mg BID x14-21 days (alternative)
  - Do NOT wait for serology if EM present - treat empirically
  - Jarisch-Herxheimer reaction: fever, chills, myalgias within 24 hours of starting antibiotics (10-15%), self-limited
  - Facial nerve palsy: oral doxycycline x14-21 days (no IV needed if no meningitis)
  - Neuroborreliosis (meningitis, encephalitis, radiculoneuritis):
  - Ceftriaxone 2 g IV daily x14-28 days
  - Lumbar puncture to confirm if suspected
  - Cardiac (AV block):
  - First-degree or second-degree Mobitz I: oral doxycycline x14-21 days
  - High-degree AV block (second-degree Mobitz II or third-degree): ceftriaxone 2 g IV daily x14-21 days, may require temporary pacemaker
  - Lyme arthritis:
  - Oral doxycycline 100 mg BID x28 days (first-line)
  - If persistent after 28 days, repeat 28-day course
  - If still persistent, consider IV ceftriaxone x14-28 days (10% require IV)
  - Tick removal: grasp with fine-tipped tweezers close to skin, pull straight up, do NOT twist
  - Prophylaxis after tick bite: single dose doxycycline 200 mg within 72 hours if tick attached over 36 hours in endemic area (NOT routinely recommended)
  - Post-treatment Lyme disease syndrome: 10-20% have persistent fatigue or arthralgias after treatment, prolonged antibiotics NOT helpful

clinical_pearls:
  - Erythema migrans (bull's-eye rash) pathognomonic - do NOT wait for serology to treat
  - Tick must be attached over 36 hours to transmit Lyme
  - Doxycycline 100 mg BID x14 days first-line for early disease
  - Serology negative first 4 weeks (do not order if EM present)
  - Bilateral facial nerve palsy classic for Lyme (25% of Lyme facial palsies)
  - Lyme arthritis affects knee most commonly, oligoarthritis
  - Most patients do not recall tick bite (nymphal ticks tiny)
  - Endemic areas: Northeast, Upper Midwest, Northern California

differentials:
  - Erythema migrans vs cellulitis: EM not painful, expands over days, central clearing, cellulitis painful, red, warm
  - Southern tick-associated rash illness (STARI): similar rash, Amblyomma tick, milder illness, does not cause arthritis
  - Rocky Mountain spotted fever: petechial rash starts on wrists/ankles, spreads centrally, severely ill
  - Bell palsy: unilateral facial palsy (but Lyme can cause bilateral)
  - Viral meningitis: similar CSF findings, negative Lyme testing

trace: |
  A 45-year-old woman presented with 5 days of expanding red rash on right thigh. Went hiking in Connecticut 10 days ago (endemic area). Noticed small red spot on thigh 5 days after hike, has been expanding daily, now 8 cm diameter with central clearing (classic erythema migrans - bull's-eye appearance). Also has fever, headache, myalgias, fatigue. Did not notice tick bite. Exam showed annular erythematous patch with central clearing 8 cm diameter on right thigh, not painful or warm (not cellulitis). No lymphadenopathy. Diagnosed with early localized Lyme disease (clinical diagnosis based on erythema migrans in endemic area after outdoor exposure - pathognomonic rash). Do NOT need serology (serology often negative in first 4 weeks, treat based on clinical diagnosis). Started doxycycline 100 mg BID x14 days immediately. At 24 hours fever and chills worsened briefly (Jarisch-Herxheimer reaction from bacterial die-off, self-limited). At 3 days fever resolved, rash started fading. At 1 week rash 90% resolved, constitutional symptoms resolved. Completed 14-day course. At 4 weeks complete resolution, no complications. Counseled on tick prevention: wear long sleeves and pants in woods, use DEET, check for ticks after outdoor activities, remove ticks promptly within 24 hours to prevent transmission. Serology at 6 weeks showed positive IgG (confirms diagnosis, will remain positive for life).
