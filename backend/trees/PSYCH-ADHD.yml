tree_id: PSYCH-ADHD
name: ADHD Evaluation
family: PSYCHIATRY
specialty: Psychiatry, Pediatrics, Neurology
chief_complaint: Inattention, Hyperactivity, Impulsivity, Poor Focus
description: Evaluation and management of attention-deficit/hyperactivity disorder
version: "1.0"
author: RealDiag Clinical Team

entry_point: adhd_evaluation

nodes:
  - id: adhd_evaluation
    type: question
    text: "ADHD subtype?"
    options:
      - label: "Predominantly inattentive"
        next: inattentive_type
      - label: "Predominantly hyperactive-impulsive"
        next: hyperactive_type
      - label: "Combined type"
        next: combined_type

  - id: inattentive_type
    type: diagnosis
    name: "ADHD - Predominantly Inattentive"
    icd10: "F90.0"
    urgency: low
    workup:
      - ADHD - Neurodevelopmental disorder, persistent pattern of inattention and/or hyperactivity-impulsivity
      - Prevalence - 5-10% children, 2-5% adults
      - Onset - Symptoms present before age 12 (DSM-5 criteria)
      - Neurobiological - Dopamine/norepinephrine dysregulation, prefrontal cortex hypofunction
      - Genetic component strong (heritability 70-80%)
      - Inattentive type - ≥6 inattention symptoms (≥5 if age ≥17)
      - Symptoms - Fails to give close attention to details (careless mistakes), difficulty sustaining attention (tasks, conversations), does not seem to listen when spoken to directly, does not follow through on instructions (fails to finish tasks), difficulty organizing tasks/activities, avoids tasks requiring sustained mental effort (homework, paperwork), loses things (keys, phone, paperwork), easily distracted by extraneous stimuli, forgetful in daily activities
      - Fewer than 6 hyperactive-impulsive symptoms
      - Presentation - "Daydreamer," poor academic/work performance, disorganized, forgetful
      - More common in girls (vs. hyperactive type more common boys)
      - Often diagnosed later (less disruptive than hyperactive type)
      - Differential diagnosis
      - Learning disabilities - Dyslexia, dyscalculia (specific deficits, ADHD global inattention)
      - Anxiety/depression - Can cause inattention (treat underlying mood disorder)
      - Sleep disorders - Sleep apnea, insufficient sleep (daytime inattention)
      - Substance use - Cannabis, alcohol
      - Medical - Thyroid disorder, anemia, lead poisoning
      - Medications - Antihistamines, benzodiazepines
      - DSM-5 diagnostic criteria - Requires
      - ≥6 inattention symptoms (≥5 if age ≥17) present ≥6 months
      - Symptoms present before age 12
      - Symptoms present in ≥2 settings (home, school/work, social)
      - Clear evidence symptoms interfere with functioning
      - Not better explained by another disorder
      - Assessment
      - Clinical interview - Patient and collateral (parents, teachers, spouse)
      - Rating scales - Vanderbilt (children), Conners, ADHD Rating Scale IV, Adult ADHD Self-Report Scale (ASRS)
      - School/work performance - Report cards, evaluations
      - Rule out comorbidities - Oppositional defiant disorder (50%), learning disabilities (30%), anxiety (30%), depression (20%)
      - Medical workup - NOT routinely required (thyroid, lead if clinically indicated)
    treatment:
      - Behavioral therapy - First-line for preschool age (<6 years), adjunct for all ages
      - Parent training (positive reinforcement, structure, routines)
      - Behavioral classroom interventions (organizational skills, homework support)
      - CBT (adults, adolescents) - Time management, organization, emotional regulation
      - Pharmacotherapy - First-line for school-age children, adolescents, adults
      - Stimulants - MOST EFFECTIVE (70-80% respond)
      - Methylphenidate - Ritalin (short-acting 3-4 hours), Concerta (long-acting 12 hours), Daytrana (patch)
      - Start 5-10 mg BID (short-acting) or 18 mg daily (long-acting)
      - Titrate to effect (typical dose 0.5-1 mg/kg/day)
      - Amphetamines - Adderall (mixed amphetamine salts 4-6 hours), Adderall XR (12 hours), Vyvanse (lisdexamfetamine, prodrug 12-14 hours)
      - Start 5-10 mg daily, titrate to 20-60 mg
      - Mechanism - Increase dopamine/norepinephrine release
      - Side effects - Decreased appetite (growth concerns children, monitor height/weight), insomnia (take morning/afternoon, NOT evening), irritability/"rebound" (when wears off), headache, stomach ache, increased heart rate/BP (monitor BP), tics (usually mild, 10%)
      - Rare - Sudden cardiac death (no increased risk in healthy individuals, but screen for cardiac disease, family history sudden death)
      - Contraindications - Severe cardiovascular disease, uncontrolled hypertension, hyperthyroidism, glaucoma, concurrent MAOI
      - Caution - Tics (may worsen, but often transient), substance use disorder (diversion risk, consider non-stimulants)
      - Non-stimulants - Second-line (if stimulant failed, contraindication, substance use risk, preference)
      - Atomoxetine (Strattera) - Norepinephrine reuptake inhibitor
      - 0.5 mg/kg/day initially, increase to 1.2 mg/kg/day (max 100 mg)
      - Takes 4-6 weeks full effect (vs. stimulants work day 1)
      - Advantages - Not controlled substance (no abuse potential), 24-hour coverage, helps anxiety
      - Side effects - Decreased appetite, GI upset, fatigue, dizziness
      - Black box warning - Suicidal ideation children/adolescents (rare, monitor)
      - Guanfacine XR (Intuniv), clonidine XR (Kapvay) - Alpha-2 agonists
      - Lower blood pressure, reduce hyperactivity/impulsivity (less effect on inattention)
      - Useful adjunct to stimulants, or monotherapy
      - Side effects - Sedation, hypotension, bradycardia, rebound hypertension if stopped abruptly
      - Bupropion (Wellbutrin) - Off-label, norepinephrine-dopamine reuptake inhibitor
      - 150-300 mg daily
      - Modest efficacy, useful if comorbid depression
      - Monitoring - Follow-up every 3-6 months, assess symptom control, side effects, growth (children), BP/HR, diversion concerns
      - Combination therapy - Stimulant + behavioral therapy superior to either alone
      - Adults - Stimulants first-line (methylphenidate or amphetamines), non-stimulants if contraindication
      - Prognosis - 50-80% children continue symptoms into adulthood (may be less impairing)
      - Increased risk - Academic underachievement, unemployment, relationship difficulties, substance use disorders, motor vehicle accidents
      - Treatment improves outcomes

  - id: hyperactive_type
    type: diagnosis
    name: "ADHD - Predominantly Hyperactive-Impulsive"
    icd10: "F90.1"
    urgency: low
    workup:
      - Hyperactive-impulsive type - ≥6 hyperactive-impulsive symptoms (≥5 if age ≥17), fewer than 6 inattention symptoms
      - Symptoms hyperactivity - Fidgets with hands/feet or squirms in seat, leaves seat when remaining seated expected, runs about/climbs excessively (restless in adults), unable to play quietly, "on the go" or acts as if "driven by a motor," talks excessively
      - Symptoms impulsivity - Blurts out answers before question completed, difficulty waiting turn, interrupts or intrudes on others
      - Presentation - Disruptive, "can't sit still," talks excessively, interrupts
      - More common boys (3:1 vs. girls)
      - Often diagnosed earlier (more disruptive than inattentive)
      - Comorbidities - Oppositional defiant disorder 50%, conduct disorder 20%
    treatment:
      - Same as inattentive type - Behavioral therapy + stimulants first-line
      - Alpha-2 agonists (guanfacine, clonidine) particularly helpful for hyperactivity/impulsivity

  - id: combined_type
    type: diagnosis
    name: "ADHD - Combined Type"
    icd10: "F90.2"
    urgency: low
    workup:
      - Combined type - ≥6 inattention symptoms AND ≥6 hyperactive-impulsive symptoms (most common subtype)
      - Symptoms - Mix of inattention + hyperactivity/impulsivity (see above)
      - Presentation - Disorganized, forgetful, restless, impulsive
      - Most impairing subtype
    treatment:
      - Same as above - Behavioral therapy + stimulants
      - May require combination pharmacotherapy (stimulant + alpha-2 agonist) for comprehensive symptom control
