tree_id: PEDS-RASH
name: Rash (Pediatric)
family: pediatrics
specialty: Pediatrics/Dermatology
icd10: R21
snomed: 271807003
urgency:
  - Petechiae or purpura with fever (meningococcemia, sepsis)
  - Erythroderma or widespread blistering (Stevens-Johnson syndrome, toxic epidermal necrolysis)
  - Angioedema or signs of anaphylaxis
  - Fever with rash and ill appearance (sepsis, Kawasaki disease, toxic shock syndrome)
  - Vesicular rash in immunocompromised child (disseminated varicella, HSV)
  - Nikolsky sign positive (skin sloughing with pressure)
homeopathy: []
presentations:
  - Acute or chronic skin eruption
  - Pruritic (itchy) versus non-pruritic
  - Erythematous (red) patches or plaques
  - Papules (small raised bumps)
  - Vesicles (small fluid-filled blisters) or bullae (large blisters)
  - Maculopapular (flat red areas with some raised bumps)
  - Petechiae (pinpoint non-blanching red spots) or purpura (larger non-blanching purple areas)
  - Distribution pattern (generalized, localized, sun-exposed areas, flexural areas)
  - Associated symptoms (fever, URI symptoms, joint pain, lymphadenopathy)
  - Recent illness, medication exposure, or sick contacts
  - Diaper area involvement (diaper dermatitis)
workup:
  - Clinical history
  - Onset and duration of rash (acute less than 6 weeks versus chronic greater than 6 weeks)
  - Initial location and pattern of spread
  - Evolution of rash (started as what, changed to what)
  - Associated symptoms
  - Fever (suggests infectious or inflammatory etiology)
  - Pruritus (itching) - common with allergic, atopic, or parasitic causes
  - Pain or burning (Stevens-Johnson, cellulitis)
  - URI symptoms (viral exanthem)
  - Joint pain or swelling (viral, Kawasaki, HSP)
  - Abdominal pain, vomiting, diarrhea
  - Recent exposures
  - New medications (drug eruption - typically starts 7-14 days after initiation)
  - New topical products (soaps, lotions, detergents)
  - Contact with plants (poison ivy, oak, sumac)
  - Sick contacts or known contagious illness exposure
  - Travel history
  - Daycare attendance
  - Family history of atopic disease (eczema, asthma, allergies)
  - Previous similar episodes
  - Physical examination
  - Vital signs (fever, tachycardia - may indicate serious infection)
  - General appearance (well-appearing versus ill, toxic)
  - Skin examination - systematically describe rash
  - Primary lesion type
  - Macule (flat discoloration, less than 1 cm)
  - Patch (flat discoloration, greater than 1 cm)
  - Papule (raised lesion, less than 1 cm)
  - Plaque (raised lesion, greater than 1 cm)
  - Vesicle (fluid-filled, less than 0.5 cm)
  - Bulla (fluid-filled, greater than 0.5 cm)
  - Pustule (pus-filled)
  - Petechiae/purpura (non-blanching)
  - Distribution and pattern
  - Generalized versus localized
  - Symmetrical versus asymmetrical
  - Extensor surfaces versus flexor surfaces
  - Sun-exposed areas versus covered areas
  - Dermatomal distribution (suggests herpes zoster)
  - Blanching versus non-blanching (apply pressure with glass slide)
  - Non-blanching suggests vasculitis or bleeding into skin
  - Secondary changes (excoriation, lichenification, scaling, crusting)
  - Mucous membrane involvement (oral, conjunctival, genital)
  - Hair and nail examination
  - Lymphadenopathy (regional or generalized)
  - Complete physical examination
  - HEENT (pharyngitis, conjunctivitis, strawberry tongue)
  - Cardiovascular (murmur, gallop - Kawasaki disease)
  - Respiratory (wheezing - anaphylaxis)
  - Abdominal (hepatosplenomegaly)
  - Musculoskeletal (joint swelling, arthritis)
  - Common pediatric rashes (pattern recognition)
  - Viral exanthems
  - Roseola (HHV-6): high fever 3-5 days, rash as fever resolves, age 6-24 months
  - Erythema infectiosum (fifth disease, parvovirus B19): slapped cheek appearance, lacy reticular rash on trunk/extremities
  - Hand-foot-mouth disease (coxsackievirus): vesicles on hands, feet, mouth ulcers
  - Varicella (chickenpox): pruritic vesicles in crops, different stages, starts on trunk
  - Eczema (atopic dermatitis): pruritic, flexural areas (antecubital, popliteal), chronic relapsing
  - Contact dermatitis: pruritic, distribution corresponds to contactant exposure, may have vesicles
  - Urticaria (hives): pruritic wheals, transient (individual lesions resolve within 24 hours), blanching
  - Diaper dermatitis: irritant (shiny red, spares creases) versus Candida (beefy red, satellite lesions, involves creases)
  - Impetigo: honey-crusted lesions, contagious, commonly perioral
  - Scarlet fever (group A Strep): sandpaper-texture rash, circumoral pallor, strawberry tongue
  - Kawasaki disease: polymorphous rash, conjunctivitis, mucositis, extremity changes, lymphadenopathy, fever greater than 5 days
  - Diagnostic testing
  - Usually NOT needed - most rashes diagnosed clinically
  - Viral culture or PCR if vesicular rash (varicella, HSV)
  - Rapid strep test or throat culture if scarlet fever suspected
  - KOH preparation if fungal infection suspected (tinea)
  - Bacterial culture if impetigo or cellulitis
  - Skin biopsy rarely needed (if diagnostic uncertainty, vasculitis concern, or chronic rash)
  - Allergy testing (skin prick, specific IgE) if urticaria recurrent or atopic dermatitis
  - Complete blood count if petechiae/purpura (assess platelets)
treatment:
  - Treat underlying cause
  - Viral exanthems: supportive care, symptomatic treatment, self-limited
  - Bacterial infections: antibiotics (see below)
  - Atopic dermatitis (eczema)
  - Moisturizers (emollients) - cornerstone, apply liberally twice daily
  - Thick creams/ointments better than lotions (Aquaphor, Eucerin, Cetaphil)
  - Apply immediately after bathing (soak and seal)
  - Topical corticosteroids for flares
  - Low potency (hydrocortisone 1-2.5%) for face, neck, groin, axillae
  - Medium potency (triamcinolone 0.1%) for trunk and extremities
  - Apply once or twice daily until clear, then taper
  - Short courses to avoid side effects (skin atrophy, striae)
  - Topical calcineurin inhibitors (tacrolimus, pimecrolimus)
  - Non-steroidal option for face, sensitive areas
  - Avoid triggers (fragrances, harsh soaps, wool)
  - Bleach baths if recurrent skin infections (1/4 cup bleach per full tub, twice weekly)
  - Contact dermatitis
  - Identify and remove offending agent
  - Topical corticosteroids (medium-high potency) for 1-2 weeks
  - Oral antihistamines for pruritus
  - Severe: oral corticosteroids (prednisone 1 mg/kg/day for 5-7 days, taper if longer course)
  - Urticaria (hives)
  - Oral antihistamines
  - First-line: cetirizine 0.25 mg/kg/day (max 10 mg) or loratadine 0.25 mg/kg/day (max 10 mg)
  - Diphenhydramine 1 mg/kg/dose every 6 hours (max 50 mg) for acute severe
  - Avoid trigger if identified
  - Epinephrine 0.01 mg/kg IM (max 0.3-0.5 mg) if anaphylaxis (angioedema, respiratory distress, hypotension)
  - Diaper dermatitis
  - Frequent diaper changes, air exposure when possible
  - Barrier cream (zinc oxide, petrolatum) with each change
  - If Candida suspected: topical antifungal (nystatin, clotrimazole) four times daily
  - Avoid baby wipes (use water and soft cloth)
  - Impetigo (bacterial skin infection)
  - Localized: topical mupirocin ointment three times daily for 5-7 days
  - Widespread or not responding: oral antibiotics
  - Cephalexin 25-50 mg/kg/day divided four times daily for 7 days OR
  - Dicloxacillin 25 mg/kg/day divided four times daily for 7 days OR
  - If MRSA suspected: trimethoprim-sulfamethoxazole 8-12 mg/kg/day (trimethoprim component) divided twice daily
  - Scarlet fever (group A Strep)
  - Penicillin VK 25-50 mg/kg/day divided 2-3 times daily for 10 days OR
  - Amoxicillin 50 mg/kg/day divided twice daily for 10 days OR
  - If penicillin allergy: azithromycin 12 mg/kg day 1 (max 500 mg), then 6 mg/kg days 2-5 (max 250 mg)
  - Varicella (chickenpox)
  - Symptomatic care: antihistamines for itch, calamine lotion, oatmeal baths
  - Keep fingernails short to prevent scratching and secondary infection
  - Acyclovir 20 mg/kg/dose PO four times daily for 5 days (max 800 mg/dose)
  - Consider if age greater than 12 years, chronic skin/lung disease, or immunocompromised
  - Most effective if started within 24 hours of rash onset
  - Isolate until all lesions crusted (usually 5-7 days)
  - Symptomatic treatment (for pruritic rashes)
  - Oral antihistamines (cetirizine, loratadine, diphenhydramine)
  - Calamine lotion
  - Colloidal oatmeal baths (Aveeno)
  - Cool compresses
  - Keep fingernails short
clinical_pearls:
  - 'Pattern recognition key to diagnosis - distribution, morphology, and associated symptoms help narrow differential'
  - 'Petechiae/purpura (non-blanching) with fever and ill appearance requires urgent evaluation for meningococcemia or sepsis'
  - 'Kawasaki disease criteria: fever greater than 5 days plus 4 of 5 (rash, conjunctivitis, mucositis, extremity changes, cervical lymphadenopathy) - early treatment prevents coronary aneurysms'
  - 'Most viral exanthems are self-limited and require only symptomatic care - antibiotics not helpful'
  - 'Moisturizers (emollients) are cornerstone of eczema treatment - apply liberally and frequently'
  - 'Individual urticarial lesions resolve within 24 hours - if lasting longer, consider urticarial vasculitis'
  - 'Scarlet fever is group A Strep pharyngitis with rash - sandpaper texture, circumoral pallor, strawberry tongue'
  - 'Hand-foot-mouth disease (coxsackievirus) causes vesicles on hands, feet, buttocks, and oral ulcers - supportive care only'
referrals:
  - Pediatric dermatology if diagnostic uncertainty, severe or refractory eczema, chronic urticaria, or blistering disorders
  - Pediatric rheumatology if concern for Kawasaki disease, vasculitis, or connective tissue disease
  - Pediatric cardiology if Kawasaki disease confirmed (coronary artery assessment)
  - Allergy/immunology if recurrent urticaria, severe atopic dermatitis, or suspected food/environmental allergies
differentials:
  - Viral exanthem (roseola, fifth disease, enterovirus) - fever followed by rash, maculopapular, self-limited
  - Atopic dermatitis (eczema) - chronic pruritic rash, flexural areas, family history of atopy
  - Contact dermatitis - pruritic, corresponds to contactant exposure, vesicles possible
  - Urticaria (hives) - transient pruritic wheals, individual lesions resolve in 24 hours
  - Impetigo - honey-crusted lesions, contagious, often perioral or on extremities
  - Scarlet fever - group A Strep with sandpaper rash, strawberry tongue, circumoral pallor
  - Kawasaki disease - fever greater than 5 days, polymorphous rash, conjunctivitis, mucositis, extremity changes, lymphadenopathy
  - Drug eruption - temporal relationship to medication (7-14 days after starting), maculopapular most common
  - Henoch-Schönlein purpura (HSP) - palpable purpura on lower extremities/buttocks, abdominal pain, arthritis
  - Varicella (chickenpox) - pruritic vesicles in crops, different stages, generalized
