tree_id: ENT-SINUSITIS-ACUTE
name: Acute Sinusitis
family: Otolaryngology
specialty: Primary Care
chief_complaint: Facial pain and nasal congestion
description: Inflammation of paranasal sinuses typically following viral upper respiratory infection. Most cases viral and self-limited, antibiotics only if bacterial (symptoms longer than 10 days, severe, or worsening after initial improvement).
icd10: J01.90
urgency: routine

workup:
  - Clinical diagnosis: purulent nasal discharge, nasal obstruction, facial pain/pressure/fullness, decreased sense of smell
  - Acute rhinosinusitis: symptoms less than 4 weeks
  - Viral vs bacterial distinction: viral improves within 10 days (most common), bacterial persists longer than 10 days without improvement OR severe symptoms (fever above 102°F, purulent discharge, facial pain) OR worsening after initial improvement (double sickening)
  - Physical exam: purulent nasal discharge, facial tenderness over affected sinuses (maxillary, frontal, ethmoid)
  - No imaging needed: uncomplicated acute sinusitis is clinical diagnosis
  - CT sinus: only if complications suspected (orbital cellulitis, meningitis, intracranial abscess) or refractory to treatment
  - Red flags for complications: severe headache, vision changes, periorbital edema, altered mental status, cranial nerve deficits

treatment:
  - Viral sinusitis (symptoms less than 10 days): symptomatic treatment only, no antibiotics
  - Intranasal corticosteroids: fluticasone, mometasone 2 sprays per nostril daily (reduces inflammation, improves drainage)
  - Saline nasal irrigation: neti pot or squeeze bottle with isotonic saline BID-QID (effective symptom relief)
  - Oral decongestants: pseudoephedrine 30-60 mg Q4-6H PRN (caution in hypertension)
  - Intranasal decongestants: oxymetazoline spray (limit 3 days - rebound congestion)
  - Analgesics: acetaminophen or ibuprofen for pain and fever
  - Antibiotics (if bacterial): amoxicillin-clavulanate 875/125 mg BID x5-7 days (first-line, covers resistant S. pneumoniae and H. influenzae)
  - Alternative antibiotics: doxycycline 100 mg BID or levofloxacin 750 mg daily if penicillin allergy
  - Indications for antibiotics: symptoms longer than 10 days without improvement, severe symptoms (fever above 102°F, severe pain), or double sickening (worsening after initial improvement)
  - Antibiotic duration: 5-7 days adequate (shorter courses as effective as 10-14 days)
  - Complications requiring urgent ENT referral: orbital cellulitis (periorbital edema, decreased vision, ophthalmoplegia), intracranial extension (severe headache, altered mental status, cranial nerve deficits)

clinical_pearls:
  - Most acute sinusitis viral - improves within 10 days without antibiotics
  - Antibiotics only if symptoms longer than 10 days, severe, or worsening after improvement
  - Amoxicillin-clavulanate first-line antibiotic x5-7 days
  - Intranasal steroids plus saline irrigation effective symptomatic treatment
  - Imaging NOT needed for uncomplicated acute sinusitis
  - Complications rare but serious - orbital cellulitis, meningitis, intracranial abscess
  - Limit intranasal decongestants to 3 days (rebound congestion)

differentials:
  - Viral upper respiratory infection: nasal congestion and discharge without facial pain or pressure, improves within 7-10 days
  - Allergic rhinitis: clear rhinorrhea, sneezing, nasal itching, triggered by allergens, no facial pain
  - Chronic rhinosinusitis: symptoms longer than 12 weeks, nasal polyps, CT shows chronic changes
  - Migraine or tension headache: headache without purulent nasal discharge

trace: |
  A 35-year-old woman presented with 12 days of nasal congestion, purulent yellow-green nasal discharge, facial pressure over maxillary sinuses, and postnasal drip following upper respiratory infection 2 weeks ago. Initially improving days 3-7, then worsened over past 5 days with increased facial pain and thicker discharge. No fever. Exam showed purulent drainage in nasal passages, tenderness to palpation over maxillary sinuses bilaterally. Diagnosed with acute bacterial rhinosinusitis (double sickening pattern - worsening after initial improvement). Started amoxicillin-clavulanate 875/125 mg BID x7 days. Fluticasone nasal spray 2 sprays per nostril daily. Saline nasal irrigation twice daily. Ibuprofen 400 mg Q6H PRN for pain. At 3 days facial pain improved 50%, discharge decreased. At 7 days completed antibiotics, symptoms 90% resolved, minimal residual congestion. Continued saline irrigation and nasal steroid for 2 more weeks. At 3 weeks complete resolution. No complications.
