tree_id: ENT-ACUTE-OTITIS-MEDIA
name: Acute Otitis Media
family: Otolaryngology
specialty: ENT
chief_complaint: Ear pain and fever
description: |
  Bacterial or viral infection of the middle ear. Most common in children 6-24 months.
  Causative organisms: S. pneumoniae (30%), H. influenzae (20%), M. catarrhalis (15%), viruses (25%).
icd10: H66.90
urgency: Moderate
workup:
  - Otoscopic examination: bulging, erythematous, opaque tympanic membrane with decreased mobility
  - Pneumatic otoscopy (gold standard): impaired tympanic membrane mobility indicates middle ear effusion
  - Assess for middle ear effusion, air-fluid level, or perforation with purulent drainage
  - Evaluate for complications: mastoiditis (post-auricular swelling, tenderness), facial nerve palsy
  - Tympanocentesis if severe, immunocompromised, or failed multiple antibiotics (for culture)
treatment:
  - Observation for 48-72 hours appropriate if: age >6 months, non-severe symptoms, reliable follow-up
  - First-line antibiotic: amoxicillin 80-90 mg/kg/day divided BID x 5-10 days (10 days if <2 years, 5-7 days if ≥2 years)
  - Amoxicillin-clavulanate if failed amoxicillin, recent antibiotic use (<30 days), or severe symptoms
  - Alternative if penicillin allergy: cefdinir, cefuroxime, or azithromycin
  - Analgesia: ibuprofen or acetaminophen for pain relief
  - Tympanostomy tubes if: ≥3 episodes in 6 months, ≥4 in 12 months, or persistent effusion >3 months with hearing loss
  - Avoid decongestants and antihistamines (not effective)
clinical_pearls:
  - Diagnosis requires: acute onset, middle ear effusion, and signs of inflammation
  - Viral URIs precede 70% of AOM cases (Eustachian tube dysfunction allows bacterial superinfection)
  - Spontaneous perforation relieves pain but indicates severe infection
  - Recurrent AOM defined as ≥3 episodes in 6 months or ≥4 in 12 months
  - Pneumococcal vaccination (PCV13) reduces AOM incidence by 6-7%
  - Breastfeeding, avoiding tobacco smoke, and limiting pacifier use reduce risk
differentials:
  - Otitis externa (swimmer's ear)
  - Otitis media with effusion (no infection)
  - Mastoiditis
  - Temporomandibular joint disorder
  - Referred pain from pharyngitis
  - Foreign body in ear canal
trace:
  - Ear pain and fever → Otoscopic examination shows bulging, erythematous tympanic membrane → Pneumatic otoscopy confirms decreased mobility → Diagnose acute otitis media → Consider observation if >6 months and non-severe → Amoxicillin 80-90 mg/kg/day if treatment indicated → Reassess in 48-72 hours → Switch to amoxicillin-clavulanate if no improvement → Consider tympanostomy tubes if recurrent
