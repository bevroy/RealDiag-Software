tree_id: NEURO-HEADACHE
name: Headache - General Evaluation
family: Neurology
specialty: Neurology
icd10:
  - R51.9
  - G44.1
snomed:
  - 25064002
  - 37796009
urgency: non-urgent
description: Comprehensive evaluation of acute and chronic headache with red flag assessment

homeopathy:
  - remedy: Belladonna 30C
    indications: Throbbing headache, worse with light/noise, sudden onset, flushed face
  - remedy: Bryonia 30C
    indications: Headache worse with movement, better with pressure, irritable
  - remedy: Gelsemium 30C
    indications: Heavy, band-like headache, droopy eyelids, weakness, visual disturbances
  - remedy: Natrum muriaticum 30C
    indications: Headache like hammers beating, worse sun exposure, emotional trigger
  - remedy: Spigelia 30C
    indications: Left-sided headache, stabbing pain over left eye, worse with movement

presentations:
  - Acute headache
  - Chronic daily headache
  - Tension-type headache
  - Headache with visual changes
  - Headache with neck pain
  - Post-traumatic headache
  - Headache with fever

differentials:
  - Tension headache
  - Migraine
  - Cluster headache
  - Sinusitis
  - Intracranial pathology

workup:
  - "RED FLAGS requiring immediate workup: sudden severe 'thunderclap' headache, new headache after age 50, headache with fever/stiff neck, altered mental status, focal neurological deficits, headache after head trauma, progressive worsening despite treatment"
  - "History: onset (sudden vs gradual), location (unilateral vs bilateral), quality (throbbing, pressure, sharp), duration, frequency, triggers, associated symptoms (nausea, photophobia, phonophobia, aura)"
  - "Physical exam: vital signs (especially blood pressure), neurological exam (cranial nerves, motor/sensory, reflexes, gait), fundoscopic exam (papilledema), palpate temporal arteries (GCA if >50 years)"
  - "Tension headache features: bilateral, pressing/tightening quality, mild-moderate intensity, not aggravated by routine physical activity, no nausea/vomiting, may have photophobia OR phonophobia (not both)"
  - "Imaging indications: red flags present, abnormal neurologic exam, atypical features, headache refractory to treatment - obtain CT head (if acute) or MRI brain (if subacute/chronic)"
  - "Labs if indicated: ESR/CRP if concern for temporal arteritis (age >50 + new headache), LP if concern for SAH (thunderclap) or meningitis (fever/stiff neck)"

treatment:
  - "Acute tension headache: NSAIDs (ibuprofen 400-600 mg, naproxen 500 mg) or acetaminophen 1000 mg, may combine with caffeine"
  - "Chronic tension headache prevention: amitriptyline 10-25 mg at bedtime (titrate to effect), stress management, physical therapy for neck/shoulder tension"
  - "Migraine treatment: see NEURO-MIGRAINE tree for comprehensive migraine management"
  - "Medication overuse headache: taper analgesics if using >10 days/month (NSAIDs) or >4 days/month (triptans/opioids), bridge with preventive therapy"
  - "Non-pharmacologic: sleep hygiene, regular meals, hydration, exercise, stress reduction, biofeedback, trigger avoidance"
  - "Avoid opioids and butalbital compounds - high risk of medication overuse headache and dependency"

clinical_pearls:
  - "Most headaches are primary (tension, migraine, cluster) - not caused by serious pathology"
  - "Red flag 'SNOOP': Systemic symptoms (fever, weight loss), Neurologic deficit, Onset sudden, Older age (new headache >50), Pattern change (worse/different than usual)"
  - "Thunderclap headache = subarachnoid hemorrhage until proven otherwise - needs immediate CT head"
  - "Temporal arteritis in patients >50 with new headache, jaw claudication, visual changes - check ESR/CRP, start prednisone if high suspicion (don't wait for biopsy)"
  - "Medication overuse headache is common - ask about analgesic frequency, not just severity"
  - "Normal neurologic exam makes serious secondary cause unlikely but doesn't rule it out completely"

referrals:
  - Neurology for: refractory headaches despite treatment, concern for secondary headache, atypical features, frequent severe headaches affecting quality of life
  - Ophthalmology for: visual changes, papilledema on fundoscopic exam, concern for acute angle-closure glaucoma
  - Rheumatology for: suspected temporal arteritis for temporal artery biopsy
  - Emergency department for: red flag features, thunderclap headache, altered mental status, focal neurologic deficits

citations:
  - "Headache Classification Committee of the International Headache Society (IHS). International Classification of Headache Disorders, 3rd edition. Cephalalgia. 2018;38(1):1-211."
  - "American Academy of Neurology. Evidence-based guideline update: NSAIDs and other complementary treatments for episodic migraine prevention in adults. Neurology. 2012."
  - "American College of Radiology Appropriateness Criteria: Headache. 2019."
