tree_id: ID-ORAL-CANDIDIASIS
name: Oral Candidiasis (Thrush)
family: infectious_disease
specialty: Primary Care
chief_complaint: White patches in mouth
description: Candida albicans overgrowth causing white patches on tongue and oral mucosa. Common in immunocompromised patients, infants, and inhaled corticosteroid users. Antifungal treatment curative, address underlying risk factors to prevent recurrence.
icd10: B37.0
snomed: 78048006
presentations:
  - White plaques on tongue, buccal mucosa
  - Plaques scrape off leaving erythema
  - Soreness, altered taste
  - Dysphagia if esophageal involvement
  - Immunocompromised host
urgency: routine

referrals:
  emergency:
    - Sepsis
    - Meningitis
    - Necrotizing infection
  urgent:
    - Suspected endocarditis
    - HIV/OI
    - Resistant infection
  routine:
    - HIV management
    - Hepatitis care
    - Travel medicine

workup:
  - Clinical diagnosis: white patches or plaques on tongue, buccal mucosa, palate that scrape off leaving erythematous base
  - Pseudomembranous candidiasis (thrush): removable white plaques (most common type)
  - Erythematous candidiasis: red patches without white coating (often seen with dentures or after antibiotics)
  - Angular cheilitis: painful fissures and erythema at corners of mouth (Candida plus Staphylococcus)
  - Risk factors: immunosuppression (HIV, chemotherapy, diabetes), inhaled corticosteroids (asthma), antibiotics (disrupt normal flora), dentures, dry mouth, infants
  - HIV: oral thrush may be presenting sign of AIDS (CD4 below 200)
  - KOH prep: scraping shows budding yeasts and pseudohyphae (confirms diagnosis but usually not needed)
  - Culture: rarely needed, Candida albicans (most common species)
  - Rule out leukoplakia: white patches that do NOT scrape off (premalignant, needs biopsy)

treatment:
  - Topical antifungals (first-line for mild cases): clotrimazole troches 10 mg dissolved in mouth 5 times daily x7-14 days
  - Nystatin suspension: swish and swallow 5 mL (500,000 units) QID x7-14 days (less effective than clotrimazole, bad taste)
  - Systemic antifungals (for moderate-severe or esophageal involvement): fluconazole 200 mg loading dose then 100 mg daily x7-14 days
  - Fluconazole more convenient and effective than topical therapy
  - Immunocompromised patients: often require longer treatment (14 days) and higher doses (fluconazole 100-200 mg daily)
  - Esophageal candidiasis: fluconazole 200 mg daily x14-21 days (presents with odynophagia, dysphagia)
  - Address underlying causes: rinse mouth after inhaled corticosteroid use, control diabetes, clean dentures daily, discontinue unnecessary antibiotics
  - Angular cheilitis: topical nystatin or clotrimazole plus hydrocortisone 1% cream to corners of mouth BID
  - HIV patients with low CD4: start antiretroviral therapy (immune reconstitution prevents recurrence)
  - Recurrent thrush: investigate for underlying immunosuppression (check HIV, diabetes, consider immunodeficiency workup)
  - Prophylaxis: fluconazole 100 mg weekly if frequent recurrences in immunocompromised

clinical_pearls:
  - White patches on tongue and oral mucosa that scrape off leaving red base
  - Common risk factors: inhaled steroids, antibiotics, immunosuppression, dentures
  - Clotrimazole troches or fluconazole curative
  - Rinse mouth after inhaled corticosteroid use prevents thrush
  - HIV: thrush may indicate advanced disease (CD4 below 200)
  - Distinguish from leukoplakia: leukoplakia does NOT scrape off (premalignant)
  - Angular cheilitis: Candida plus Staph at mouth corners
  - Esophageal candidiasis causes odynophagia (painful swallowing)

differentials:
  - Oral leukoplakia: white patches do NOT scrape off, premalignant, biopsy needed, associated with tobacco and alcohol
  - Oral hairy leukoplakia: white corrugated patches on lateral tongue (Epstein-Barr virus), does not scrape off, seen in HIV
  - Lichen planus: white lacy reticular patches on buccal mucosa, does not scrape off, autoimmune condition
  - Geographic tongue: benign inflammatory condition with red patches and white borders, migrates over time

trace: |
  A 65-year-old woman with asthma on fluticasone inhaler 500 mcg BID presented with 1 week of white patches on tongue and inside cheeks. Mild mouth discomfort when eating. Recently completed amoxicillin course for bronchitis 2 weeks ago. Exam showed multiple white plaques on dorsal tongue and buccal mucosa bilaterally that scraped off with tongue blade leaving erythematous base. Diagnosed with oral candidiasis (thrush). Risk factors: inhaled corticosteroid use without mouth rinsing and recent antibiotic course. Prescribed fluconazole 200 mg loading dose today followed by 100 mg daily x7 days (chose systemic therapy over topical for convenience and efficacy). Counseled extensively on rinsing mouth with water and spitting out after each inhaler use to prevent recurrence (most important preventive measure). At 4 days white patches resolved completely, mouth discomfort gone. Completed 7-day fluconazole course. At 2 weeks exam showed normal oral mucosa, no recurrence. Patient now consistently rinses mouth after inhaler use. At 3 months no recurrence, continues proper inhaler technique with mouth rinsing.

