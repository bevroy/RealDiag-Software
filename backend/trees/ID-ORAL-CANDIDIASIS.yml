tree_id: ID-ORAL-CANDIDIASIS
name: Oral Candidiasis (Thrush)
family: infectious
specialty: Infectious Disease
chief_complaint: White patches in mouth, sore tongue, altered taste
description: Fungal infection of oral mucosa caused by Candida species, typically Candida albicans
icd10: B37.0
urgency: routine
workup:
  - Clinical presentation - varies by type
  - Pseudomembranous candidiasis (classic thrush) - most common
  - White plaques on tongue, buccal mucosa, palate
  - Plaques can be wiped off leaving erythematous base
  - May cause pain, burning, altered taste
  - Erythematous (atrophic) candidiasis
  - Red patches on tongue (dorsal surface), palate, buccal mucosa
  - Burning sensation, painful, especially with acidic/spicy foods
  - Loss of papillae on tongue (smooth red appearance)
  - Angular cheilitis
  - Painful fissures and erythema at corners of mouth
  - Often associated with denture use or nutritional deficiency
  - Hyperplastic (chronic) candidiasis
  - White patches that cannot be wiped off (hyperkeratotic)
  - Risk factors - assess for underlying predisposing conditions
  - Immunosuppression - HIV/AIDS (CD4 less than 200), chemotherapy, corticosteroids, immunosuppressive drugs
  - Medications - inhaled corticosteroids, broad-spectrum antibiotics, proton pump inhibitors
  - Diabetes mellitus (poor glycemic control)
  - Dentures (poor hygiene, ill-fitting)
  - Xerostomia (dry mouth - medications, Sjogren syndrome, radiation therapy)
  - Nutritional deficiencies (iron, B12, folate)
  - Smoking
  - Extremes of age (infants, elderly)
  - Physical examination
  - Oral cavity - white plaques, red patches, angular fissures
  - Attempt to scrape plaques with tongue blade (pseudomembranous form scrapes off)
  - Assess dentition, denture fit
  - Examine pharynx, esophagus involvement (odynophagia suggests esophageal candidiasis)
  - Diagnostic testing - usually clinical diagnosis
  - KOH preparation - scrape lesion, add 10% KOH, microscopy shows budding yeast and pseudohyphae
  - Fungal culture if atypical or refractory - identifies species, guides therapy if non-albicans
  - Biopsy rarely needed (if hyperplastic form or concern for malignancy)
  - Assess for underlying conditions
  - HIV testing if not previously done (thrush can be AIDS-defining illness)
  - Hemoglobin A1c (assess diabetes control)
  - Consider nutritional labs (iron, B12, folate) if recurrent
treatment:
  - Topical antifungal therapy - first-line for mild-moderate localized disease
  - Clotrimazole troches 10 mg - dissolve slowly in mouth 5 times daily for 7-14 days
  - Nystatin suspension 400,000-600,000 units (4-6 mL) swish and swallow QID for 7-14 days
  - Less effective than clotrimazole, requires frequent dosing
  - Miconazole mucoadhesive buccal tablet 50 mg - apply to gum once daily for 14 days
  - Systemic antifungal therapy - for moderate-severe disease, immunocompromised, or refractory cases
  - Fluconazole 100-200 mg PO daily for 7-14 days (first-line systemic)
  - Most effective, well-tolerated
  - Loading dose 200 mg Day 1, then 100 mg daily
  - Itraconazole oral solution 200 mg daily for 7-14 days (if fluconazole-resistant)
  - Posaconazole 400 mg BID for 1 day, then 400 mg daily (for refractory cases)
  - IV antifungals for severe refractory cases
  - Amphotericin B, echinocandins (caspofungin, micafungin)
  - Angular cheilitis
  - Topical antifungal cream (clotrimazole, nystatin) to corners of mouth BID-TID
  - May add topical corticosteroid (hydrocortisone 1%) if severe inflammation
  - Address underlying causes
  - Optimize diabetes control (target HbA1c less than 7%)
  - Rinse mouth after inhaled corticosteroid use
  - Denture care - remove at night, clean daily, soak in denture cleaner
  - Treat underlying immunosuppression if possible
  - Correct nutritional deficiencies
  - Saliva substitutes for xerostomia
  - Smoking cessation
  - Prevention of recurrence
  - Good oral hygiene
  - Denture hygiene if applicable
  - Rinse mouth after meals and inhaled steroids
  - Sugar-free gum or lozenges to stimulate saliva
  - Prophylactic antifungals if recurrent (fluconazole 100-200 mg weekly)
  - HIV/AIDS patients - fluconazole prophylaxis if CD4 less than 100 and recurrent thrush
clinical_pearls:
  - Most common opportunistic fungal infection, Candida albicans in 80-90%
  - Normal oral flora but becomes pathogenic when host defenses impaired
  - In healthy adults, thrush suggests underlying immunosuppression - investigate for HIV, diabetes, steroid use
  - Inhaled corticosteroids common cause - educate on rinsing mouth after use
  - Esophageal candidiasis presents with odynophagia - requires systemic therapy (fluconazole 200-400 mg daily for 14-21 days)
  - Fluconazole resistance increasing, especially in HIV patients with recurrent infections
  - Non-albicans species (C. glabrata, C. krusei) may be fluconazole-resistant - requires culture and alternative agents
  - Recurrent thrush warrants investigation for underlying disease (HIV, diabetes, malignancy)
  - Denture-associated candidiasis very common in elderly - denture hygiene essential
differentials:
  - Oral hairy leukoplakia (white patches on lateral tongue, cannot scrape off, EBV-related, HIV patients)
  - Oral lichen planus (white lacy reticular pattern, erosions, autoimmune)
  - Geographic tongue (benign, migratory erythematous patches, usually asymptomatic)
  - Leukoplakia (white patch cannot scrape off, premalignant, biopsy needed)
  - Oral squamous cell carcinoma (ulcerated lesion, indurated, does not respond to antifungals)
  - Milk/food residue (wipes off easily, no erythematous base, no symptoms)
  - Aphthous ulcers (painful ulcers without white plaques)
  - Herpes simplex stomatitis (vesicles, painful ulcers, viral culture positive)
trace:
  - 68-year-old woman with COPD presents with 1-week history of white patches in mouth and sore tongue
  - Noticed white coating on tongue 1 week ago, thought it was food residue
  - Tried to brush it off but returned
  - Tongue painful, burning sensation especially with hot or acidic foods
  - Altered taste, food doesn't taste right
  - Difficulty swallowing due to pain
  - Recently completed course of antibiotics (amoxicillin-clavulanate) for COPD exacerbation 2 weeks ago
  - Uses inhaled corticosteroid (fluticasone) and long-acting beta-agonist for COPD
  - Past medical history - COPD, type 2 diabetes (HbA1c 8.5% 3 months ago, suboptimal control), hypertension
  - Medications - fluticasone/salmeterol inhaler BID, albuterol PRN, metformin 1000 mg BID, lisinopril 20 mg daily
  - Denies HIV risk factors, no immunosuppressive medications beyond inhaled steroids
  - Physical exam - vitals normal
  - Oral cavity examination
  - White plaques on dorsal tongue, buccal mucosa, and soft palate
  - Plaques scrape off with tongue blade leaving erythematous base underneath
  - No pharyngeal exudates
  - Mild angular cheilitis (fissures at corners of mouth)
  - Dentition - poor, missing several teeth
  - No cervical lymphadenopathy
  - Diagnosis - Oral candidiasis (pseudomembranous candidiasis, thrush)
  - Risk factors - recent antibiotics, inhaled corticosteroids, poorly controlled diabetes
  - Clinical diagnosis based on appearance and ability to scrape off plaques
  - KOH prep performed - shows budding yeast and pseudohyphae (confirms Candida)
  - No need for culture (immunocompetent patient, uncomplicated)
  - Check HbA1c - 8.8% (poor diabetes control contributing)
  - Treatment plan
  - Fluconazole 200 mg PO x1 dose (loading), then 100 mg PO daily for 14 days
  - Systemic therapy chosen given extent of disease and diabetes
  - Clotrimazole cream BID to corners of mouth for angular cheilitis
  - Education on inhaled steroid technique
  - Rinse mouth with water and spit after each inhaled steroid dose
  - Optimize diabetes control - increase metformin to 1000 mg TID (if tolerated) and add glipizide 5 mg daily
  - Target HbA1c less than 7%
  - Good oral hygiene - brush teeth and tongue BID, use antiseptic mouthwash
  - Follow-up in 2 weeks
  - 2-week follow-up - significant improvement
  - White plaques resolved
  - Tongue still slightly red but no longer painful
  - Angular cheilitis healing
  - Completed fluconazole course
  - Adhering to rinsing mouth after inhaler use
  - Glucose control improving (home glucose log shows values 120-180 mg/dL, down from 200-300)
  - 3-month follow-up - resolution maintained
  - No recurrence of thrush
  - Continues good oral hygiene and mouth rinsing
  - Repeat HbA1c 7.2% (improved glucose control)
  - No further antifungal therapy needed
  - Outcome - Complete resolution with fluconazole, no recurrence with preventive measures and improved diabetes control
