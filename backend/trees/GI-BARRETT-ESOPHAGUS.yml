tree_id: GI-BARRETT-ESOPHAGUS
name: Barrett Esophagus
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Chronic heartburn and screening abnormality
description: Intestinal metaplasia of distal esophagus from chronic GERD exposure, premalignant condition requiring surveillance for esophageal adenocarcinoma. PPI therapy controls symptoms and may slow progression, regular endoscopic surveillance based on dysplasia grade.
icd10: K22.70
snomed: 196611002
presentations:
  - Often asymptomatic
  - Chronic GERD symptoms: heartburn, regurgitation
  - Dysphagia (if stricture develops)
  - Discovered on endoscopy
  - Risk factor for esophageal adenocarcinoma
urgency: routine

referrals:
  emergency:
    - GI bleeding with instability
    - Acute liver failure
    - Perforated viscus
    - Cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting
  routine:
    - IBS management
    - GERD treatment
    - Screening colonoscopy

workup:
  - Definition: replacement of normal squamous esophageal epithelium with intestinal columnar epithelium (goblet cells) due to chronic GERD
  - Diagnosis: endoscopy with biopsy showing intestinal metaplasia (goblet cells on histology)
  - Salmon-colored mucosa: extends above gastroesophageal junction on endoscopy
  - Prague classification: circumferential extent (C) and maximal extent (M) in centimeters above GEJ
  - Risk factors: chronic GERD (most important), obesity, smoking, age above 50, male, Caucasian, hiatal hernia
  - Cancer risk: 0.3% per year progression to esophageal adenocarcinoma (30-60 times higher than general population)
  - Dysplasia grades: no dysplasia (low risk), low-grade dysplasia (LGD), high-grade dysplasia (HGD), intramucosal carcinoma
  - Screening: EGD in men above 50 with chronic GERD (longer than 5 years) plus additional risk factors (obesity, smoking, family history)
  - Not all GERD patients need screening - only high-risk individuals
  - Four-quadrant biopsies: every 1-2 cm of Barrett segment to detect dysplasia

treatment:
  - PPI therapy: high-dose twice daily (omeprazole 40 mg BID, esomeprazole 40 mg BID, lansoprazole 30 mg BID)
  - Controls GERD symptoms, may slow progression, does NOT reverse Barrett (metaplasia is irreversible)
  - Surveillance endoscopy: frequency based on dysplasia grade
  - No dysplasia: every 3-5 years (if Barrett segment below 3 cm can extend to 5 years)
  - Low-grade dysplasia (LGD): repeat EGD in 6 months with expert pathology confirmation, then annually if LGD persists
  - High-grade dysplasia (HGD): endoscopic eradication therapy (radiofrequency ablation) to prevent progression to cancer
  - Radiofrequency ablation (RFA): heat destroys Barrett mucosa, replaced by normal squamous epithelium, success rate 80-90% for complete eradication
  - Endoscopic mucosal resection (EMR): for visible nodules or lesions before RFA
  - Cryotherapy: alternative ablation technique using extreme cold
  - Lifestyle modifications: weight loss, avoid late meals, elevate head of bed, smoking cessation
  - Aspirin: emerging data suggests NSAIDs may reduce cancer risk but not standard recommendation
  - Esophagectomy: for invasive esophageal adenocarcinoma (high-risk surgery, major morbidity)

clinical_pearls:
  - Intestinal metaplasia of distal esophagus from chronic GERD
  - Cancer risk 0.3% per year - requires surveillance
  - Diagnosis requires biopsy showing goblet cells (intestinal metaplasia)
  - High-dose PPI therapy does not reverse Barrett but may slow progression
  - Surveillance frequency: no dysplasia every 3-5 years, LGD annually, HGD needs ablation
  - Radiofrequency ablation 80-90% eradicates HGD preventing cancer
  - Screen high-risk patients: men above 50 with chronic GERD plus risk factors
  - Metaplasia is irreversible even with aggressive PPI therapy

differentials:
  - Erosive esophagitis: inflammation and erosions from GERD, no intestinal metaplasia, heals with PPI
  - Gastric metaplasia: cardiac or fundic type metaplasia without goblet cells (not premalignant)
  - Inlet patch: ectopic gastric mucosa in cervical esophagus (not related to GERD)
  - Esophageal adenocarcinoma: mass or ulceration on endoscopy, biopsy shows invasive carcinoma

trace: |
  A 58-year-old obese man (BMI 34) with 15 years of chronic heartburn presented for upper endoscopy for GERD evaluation. Takes omeprazole 20 mg daily with partial symptom control. Smokes half pack per day. No alarm symptoms (dysphagia, weight loss, bleeding). Endoscopy showed 4 cm segment of salmon-colored mucosa extending above gastroesophageal junction (Prague C2M4 - circumferential 2 cm, maximal 4 cm). Four-quadrant biopsies every 1-2 cm obtained. Histology confirmed Barrett esophagus with intestinal metaplasia (goblet cells present), no dysplasia. Diagnosed with Barrett esophagus without dysplasia. Increased omeprazole to 40 mg BID for aggressive acid suppression. Counseled on lifestyle modifications: weight loss goal 10% body weight, smoking cessation program referral, avoid eating 3 hours before bedtime, elevate head of bed 6 inches. Explained cancer risk (0.3% per year low but requires surveillance). Scheduled surveillance endoscopy in 3 years. At 3 years repeat EGD showed stable 4 cm Barrett segment, biopsies again showed no dysplasia. Continues omeprazole 40 mg BID, quit smoking, lost 25 pounds. Next surveillance in 3-5 years. Will continue indefinite surveillance given Barrett diagnosis (premalignant condition).
