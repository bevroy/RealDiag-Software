id: OBGYN-PELVIC-PAIN
title: Pelvic Pain Diagnostic Tree
specialty: Obstetrics and Gynecology/Emergency Medicine
version: 1.0
last_updated: 2025-11-20
evidence_level: ACOG Guidelines, ASRM Guidelines
entry: initial_assessment

clinical_pearls:
  - Ectopic pregnancy is the most dangerous cause - always get pregnancy test
  - Ovarian torsion = surgical emergency within 4-6 hours to salvage ovary
  - PID triples risk of ectopic pregnancy and causes chronic pelvic pain
  - Endometriosis affects 10% of reproductive-age women, delays diagnosis avg 7-10 years
  - Right-sided pain consider appendicitis, left-sided consider diverticulitis
  - Mittelschmerz (ovulation pain) is mid-cycle, unilateral, brief (<24h)

red_flags:
  - Positive pregnancy test with pain (ectopic until proven otherwise)
  - Peritoneal signs (ruptured ectopic, ovarian torsion, appendicitis)
  - Fever with pain (PID, TOA, appendicitis, pyelonephritis)
  - Sudden severe pain (torsion, rupture, infarction)
  - Hypotension or tachycardia (hemorrhagic shock from ruptured ectopic/cyst)
  - Vaginal bleeding with pain in pregnancy (miscarriage, ectopic, abruption)

nodes:
- id: initial_assessment
  when: {}
  description: Initial pelvic pain evaluation
  tests:
  - History
    - Onset (sudden vs gradual)
    - Location (unilateral vs bilateral, radiation)
    - Character (sharp, cramping, pressure)
    - Severity (1-10 scale)
    - Duration (acute <24h, subacute days-weeks, chronic >6 months)
    - Associated symptoms (nausea, vomiting, fever, vaginal bleeding, discharge)
    - Last menstrual period, cycle regularity
    - Sexual history, contraception, STI risk
    - Prior surgeries, endometriosis, fibroids
  - Vital signs (fever, hypotension, tachycardia)
  - Abdominal exam (tenderness, rebound, guarding, masses)
  - Pelvic exam
    - External genitalia inspection
    - Speculum exam (cervical discharge, bleeding, lesions)
    - Bimanual exam (cervical motion tenderness, adnexal masses/tenderness, uterine size)
  - Pregnancy test (urine beta-hCG) - MANDATORY in all reproductive-age women
  - Urinalysis (rule out UTI, pyelonephritis, kidney stones)
  suggest_dx: []
  next:
  - when:
      pregnancy_test: positive
    go: pregnancy_related_pain
  - when:
      all_of:
      - peritoneal_signs: present
      - vital_signs: unstable
    go: surgical_emergency
  - when:
      fever: present
    go: infectious_cause
  - when:
      pain_onset: sudden_severe
    go: acute_pain_no_fever
  - when:
      pain_duration: chronic
    go: chronic_pelvic_pain
  - default: acute_pain_no_fever

- id: pregnancy_related_pain
  when:
    pregnancy_test: positive
  description: Pelvic pain with positive pregnancy test - ECTOPIC UNTIL PROVEN OTHERWISE
  tests:
  - Quantitative beta-hCG
  - Pelvic ultrasound (transvaginal preferred)
    - Intrauterine pregnancy (IUP) vs extrauterine
    - Gestational sac, fetal pole, cardiac activity
    - Adnexal masses (ectopic)
    - Free fluid (rupture)
  - CBC
  - Blood type and Rh
  suggest_dx:
  - Ectopic pregnancy (most dangerous)
  - Spontaneous abortion (threatened, inevitable, incomplete)
  - Corpus luteum cyst (physiologic, benign)
  - Normal early pregnancy (round ligament pain)
  referrals:
  - OB/GYN immediately
  management:
  - If ectopic confirmed or suspected → see OBGYN-VAGINAL-BLEEDING tree
  - If ruptured ectopic (peritoneal signs, unstable) → emergency surgery
  - If threatened abortion → pelvic rest, follow-up ultrasound
  - If corpus luteum cyst → observation, resolves spontaneously
  next:
  - when:
      all_of:
      - peritoneal_signs: present
      - hemodynamic_instability: present
    go: surgical_emergency
  - default: null

- id: surgical_emergency
  when:
    peritoneal_signs: present
  description: Acute abdomen requiring emergency intervention
  tests:
  - Vital signs continuously
  - CBC, CMP, lactate
  - Pregnancy test
  - Type and crossmatch (if bleeding suspected)
  - Pelvic ultrasound STAT (or CT abdomen/pelvis if ultrasound non-diagnostic)
  - Surgical consultation immediately
  suggest_dx:
  - Ruptured ectopic pregnancy
  - Ovarian torsion (twisted ovary)
  - Ruptured ovarian cyst with hemorrhage
  - Ruptured tubo-ovarian abscess (TOA)
  - Appendicitis
  - Bowel perforation or ischemia
  referrals:
  - OB/GYN STAT or General Surgery STAT
  - OR immediately if unstable
  management:
  - NPO
  - 2 large-bore IVs
  - IV fluid resuscitation
  - Type and crossmatch
  - Broad-spectrum antibiotics if infection suspected (ceftriaxone 2g IV + metronidazole 500mg IV)
  - Emergency laparoscopy or laparotomy
    - Ruptured ectopic - salpingectomy
    - Ovarian torsion - detorsion, ovarian preservation if viable
    - Ruptured TOA - drainage, possible salpingo-oophorectomy, hysterectomy
    - Appendicitis - appendectomy
  - Do NOT delay surgery for imaging if peritonitis and unstable
  next:
  - default: null

- id: infectious_cause
  when:
    fever: present
  description: Pelvic pain with fever suggests infection
  tests:
  - Vital signs (fever, tachycardia)
  - Pelvic exam - cervical motion tenderness, adnexal tenderness, purulent discharge
  - Cervical cultures (Chlamydia NAAT, gonorrhea NAAT)
  - Wet mount microscopy (if vaginal discharge)
  - Pregnancy test
  - CBC (leukocytosis)
  - Urinalysis and urine culture
  - Pelvic ultrasound (if severe pain, suspect TOA)
  suggest_dx: []
  next:
  - when:
      all_of:
      - cervical_motion_tenderness: present
      - adnexal_tenderness: present
    go: pelvic_inflammatory_disease
  - when:
      ultrasound: tubo_ovarian_abscess
    go: tubo_ovarian_abscess
  - when:
      urinalysis: pyuria
    go: urinary_tract_infection
  - default: pelvic_inflammatory_disease

- id: pelvic_inflammatory_disease
  when:
    all_of:
    - cervical_motion_tenderness: present
    - fever_or_elevated_WBC: present
  description: Pelvic inflammatory disease (PID)
  tests:
  - Minimum diagnostic criteria (at least 1 present)
    - Cervical motion tenderness
    - Uterine tenderness
    - Adnexal tenderness
  - Additional supportive criteria
    - Fever >38.3°C (101°F)
    - Mucopurulent cervical discharge
    - Abundant WBCs on wet mount
    - Elevated ESR or CRP
    - Laboratory-confirmed Chlamydia or gonorrhea
  - Cervical NAAT (Chlamydia, gonorrhea)
  - Pregnancy test (exclude ectopic)
  - HIV testing (offer to all)
  - Pelvic ultrasound (if severe, rule out TOA)
  suggest_dx:
  - Pelvic inflammatory disease (Chlamydia trachomatis, Neisseria gonorrhoeae, anaerobes, Mycoplasma genitalium)
  referrals:
  - Admit if
    - Surgical emergency not excluded (appendicitis, ectopic)
    - Tubo-ovarian abscess
    - Pregnancy
    - Severe illness (high fever, nausea/vomiting)
    - Unable to tolerate oral antibiotics
    - Failed outpatient treatment
    - Immunocompromised (HIV)
  - Otherwise outpatient treatment with close follow-up
  management:
  - Outpatient regimen (mild-moderate PID)
    - Ceftriaxone 500mg IM single dose (1g if weight ≥150 kg) PLUS
    - Doxycycline 100mg PO BID x 14 days PLUS
    - Metronidazole 500mg PO BID x 14 days (for anaerobic coverage, BV)
    - Alternative - Cefoxitin 2g IM + probenecid 1g PO single dose, then doxycycline
  - Inpatient regimen (severe PID, TOA)
    - Cefotetan 2g IV q12h or Cefoxitin 2g IV q6h PLUS Doxycycline 100mg PO/IV q12h
    - OR Clindamycin 900mg IV q8h PLUS Gentamicin 5mg/kg IV daily
    - Transition to oral after 24h clinical improvement
    - Continue total 14 days
  - Treat sexual partners empirically (Chlamydia/GC treatment)
  - Pelvic rest (no intercourse until treatment complete and partner treated)
  - Follow-up in 48-72 hours (ensure clinical improvement)
  patient_education:
  - Serious infection can cause infertility, ectopic pregnancy, chronic pain if untreated
  - Must treat partners to prevent reinfection
  - Future ectopic pregnancy risk triples
  - Use condoms to prevent STIs
  next:
  - default: null

- id: tubo_ovarian_abscess
  when:
    ultrasound: complex_adnexal_mass
  description: Tubo-ovarian abscess (TOA) - complication of PID
  tests:
  - Pelvic ultrasound (complex adnexal mass, thick-walled, fluid-debris level)
  - CT abdomen/pelvis (if ultrasound non-diagnostic)
  - CBC (leukocytosis)
  - Blood cultures if septic
  - Cervical cultures
  suggest_dx:
  - Tubo-ovarian abscess (polymicrobial - Chlamydia, gonorrhea, anaerobes, E. coli)
  referrals:
  - OB/GYN immediately
  - Admit for IV antibiotics
  - Interventional radiology for drainage if large (>8cm)
  management:
  - Admission required
  - IV antibiotics (same as inpatient PID regimen)
    - Clindamycin 900mg IV q8h + Gentamicin 5mg/kg IV daily
    - OR Ampicillin-sulbactam 3g IV q6h + Doxycycline 100mg PO/IV q12h
  - Image-guided drainage (if abscess >8-10cm or failed medical management after 48-72h)
  - Surgery (laparoscopy or laparotomy) if
    - Ruptured TOA (peritonitis, septic shock)
    - Failed medical management and drainage
    - Unilateral salpingo-oophorectomy (remove affected tube/ovary)
    - Hysterectomy with bilateral salpingo-oophorectomy (if bilateral, severe)
  - Total antibiotic course 14 days (switch to oral after clinical improvement)
  patient_education:
  - Severe complication of PID
  - May require surgery if antibiotics fail
  - Risk of infertility high
  next:
  - default: null

- id: urinary_tract_infection
  when:
    urinalysis: pyuria_or_bacteriuria
  description: Urinary tract infection or pyelonephritis
  tests:
  - Urinalysis (WBCs, bacteria, nitrites)
  - Urine culture
  - Consider renal ultrasound or CT if pyelonephritis (rule out abscess, obstruction)
  suggest_dx:
  - Cystitis (lower UTI)
  - Pyelonephritis (upper UTI, kidney infection)
  - Urethritis (Chlamydia, gonorrhea)
  referrals:
  - Urology if recurrent UTIs, obstruction, abscess
  management:
  - Cystitis (uncomplicated)
    - Nitrofurantoin 100mg PO BID x 5 days
    - OR Trimethoprim-sulfamethoxazole DS PO BID x 3 days (if local resistance <20%)
    - OR Fosfomycin 3g PO single dose
  - Pyelonephritis
    - Outpatient - Ciprofloxacin 500mg PO BID x 7 days or Levofloxacin 750mg daily x 5-7 days
    - Inpatient - Ceftriaxone 1-2g IV daily, transition to oral when afebrile
  - Urethritis (STI)
    - Ceftriaxone 500mg IM + Doxycycline 100mg PO BID x 7 days
  next:
  - default: null

- id: acute_pain_no_fever
  when:
    all_of:
    - pain_onset: sudden_or_acute
    - fever: absent
  description: Acute pelvic pain without fever
  tests:
  - Pregnancy test
  - Pelvic ultrasound with Doppler
    - Ovarian size, masses, cysts
    - Ovarian blood flow (absent or diminished = torsion)
    - Free fluid
  - CBC
  - Urinalysis (kidney stones)
  suggest_dx: []
  next:
  - when:
      ultrasound: ovarian_enlargement_absent_flow
    go: ovarian_torsion
  - when:
      ultrasound: ovarian_cyst
    go: ovarian_cyst
  - when:
      timing: mid_cycle_unilateral
    go: mittelschmerz
  - default: ovarian_cyst

- id: ovarian_torsion
  when:
    all_of:
    - pain: sudden_severe_unilateral
    - ultrasound: enlarged_ovary_decreased_flow
  description: Ovarian torsion - SURGICAL EMERGENCY within 4-6 hours
  tests:
  - Pelvic ultrasound with Doppler
    - Enlarged edematous ovary (>4cm)
    - Decreased or absent blood flow (but presence does NOT exclude torsion)
    - Free fluid
    - Twisted pedicle ("whirlpool sign")
  - CT or MRI if ultrasound non-diagnostic (but do NOT delay surgery)
  suggest_dx:
  - Ovarian torsion (twisting of ovary on vascular pedicle)
  - Risk factors - ovarian mass/cyst >5cm, ovarian hyperstimulation, pregnancy, long infundibulopelvic ligament
  referrals:
  - OB/GYN STAT
  - OR emergently (within 4-6 hours to salvage ovary)
  management:
  - NPO
  - IV access
  - Pain control (opioids)
  - Emergency laparoscopy
    - Detorsion (untwist ovary)
    - Assess viability (color, peristalsis)
    - Ovarian preservation preferred (even if appears necrotic, may recover)
    - Oophorectomy only if clearly necrotic after detorsion
    - Oophoropexy (fix ovary to prevent recurrence) if recurrent torsion
  - Do NOT delay surgery waiting for imaging if high clinical suspicion
  patient_education:
  - Time-sensitive emergency
  - Most ovaries salvageable if surgery within 6 hours
  - Risk of recurrence 10% (higher if long ligament)
  next:
  - default: null

- id: ovarian_cyst
  when:
    ultrasound: ovarian_cyst_present
  description: Ovarian cyst evaluation
  tests:
  - Pelvic ultrasound
    - Size, characteristics (simple vs complex)
    - Simple cyst - thin-walled, anechoic, no septations or solid components
    - Complex cyst - thick walls, septations, solid components, internal echoes
  - Tumor markers if postmenopausal or concerning features (CA-125, CEA, AFP, beta-hCG, LDH)
  suggest_dx:
  - Functional cyst (follicular or corpus luteum) - most common, benign, resolve spontaneously
  - Hemorrhagic cyst (ruptured functional cyst with bleeding)
  - Endometrioma (chocolate cyst, endometriosis)
  - Dermoid cyst (mature cystic teratoma, benign)
  - Cystadenoma (serous or mucinous, benign)
  - Ovarian cancer (solid components, ascites, postmenopausal, elevated CA-125)
  referrals:
  - OB/GYN if
    - Postmenopausal with any cyst
    - Premenopausal with complex features or size >10cm
    - Persistent cyst after 6-8 weeks observation
    - Elevated tumor markers
  management:
  - Simple cyst <5cm in reproductive-age woman
    - Observation (most resolve within 6-8 weeks)
    - Repeat ultrasound in 6-8 weeks
    - Oral contraceptives may prevent recurrence but do not speed resolution
  - Hemorrhagic cyst (ruptured)
    - Pain management (NSAIDs)
    - Observation if hemodynamically stable
    - Surgery if hemorrhage continues, hemodynamic instability
  - Large cyst (>5-10cm) or complex features
    - Surgical removal (cystectomy, ovarian preservation if possible)
    - Laparoscopy vs laparotomy
  - Postmenopausal cyst
    - Surgical removal (higher malignancy risk)
  patient_education:
  - Most ovarian cysts benign and resolve on their own
  - Follow-up imaging important to ensure resolution
  - Return if severe pain, fever, dizziness (rupture/torsion)
  next:
  - default: null

- id: mittelschmerz
  when:
    all_of:
    - timing: mid_cycle
    - pain: unilateral_mild_to_moderate
    - duration: '<24_hours'
  description: Mittelschmerz (ovulation pain)
  tests:
  - Clinical diagnosis based on timing and characteristics
  - Ultrasound may show ruptured follicle, small amount free fluid (physiologic)
  suggest_dx:
  - Mittelschmerz (mid-cycle ovulatory pain, benign)
  referrals:
  - None if classic presentation
  management:
  - Reassurance
  - NSAIDs for pain (ibuprofen 400-600mg)
  - Oral contraceptives prevent ovulation if recurrent and bothersome
  patient_education:
  - Normal physiologic process
  - Occurs mid-cycle (day 14 of 28-day cycle)
  - Brief, self-limited
  - Can alternate sides month-to-month
  next:
  - default: null

- id: chronic_pelvic_pain
  when:
    pain_duration: '>6_months'
  description: Chronic pelvic pain (>6 months)
  tests:
  - Detailed history
    - Pain characteristics, exacerbating/relieving factors
    - Menstrual association
    - GI symptoms (IBS)
    - Urinary symptoms (interstitial cystitis)
    - Sexual dysfunction, dyspareunia
    - Prior surgeries, trauma, abuse history
  - Pelvic exam (tenderness, masses, nodularity)
  - Pelvic ultrasound (fibroids, ovarian masses, adenomyosis)
  - STI testing (chronic PID)
  - Consider laparoscopy (endometriosis, adhesions)
  suggest_dx: []
  next:
  - when:
      pain_pattern: cyclic_with_menses
    go: endometriosis_adenomyosis
  - when:
      uterus_enlarged_tender: present
    go: fibroids_adenomyosis
  - when:
      pain_triggers: intercourse_or_bowel_movements
    go: endometriosis_adenomyosis
  - default: endometriosis_adenomyosis

- id: endometriosis_adenomyosis
  when:
    pain_pattern: cyclic_dysmenorrhea
  description: Endometriosis or adenomyosis
  tests:
  - Pelvic ultrasound or MRI
    - Endometriomas (chocolate cysts)
    - Thickened uterine wall (adenomyosis)
  - CA-125 (may be elevated but non-specific)
  - Definitive diagnosis - laparoscopy with biopsy (endometriosis)
  suggest_dx:
  - Endometriosis (endometrial tissue outside uterus - ovaries, peritoneum, ligaments, bowel)
  - Adenomyosis (endometrial tissue within uterine muscle)
  referrals:
  - OB/GYN or Reproductive Endocrinology
  management:
  - Medical management (first-line)
    - NSAIDs (ibuprofen 600-800mg TID during menses)
    - Combined oral contraceptives (continuous, skip placebo week)
    - Progestins (norethindrone acetate 5mg daily, or depot medroxyprogesterone)
    - GnRH agonists (leuprolide) - induce medical menopause, add-back estrogen/progestin to minimize bone loss, limit 6-12 months
  - Surgical management
    - Laparoscopic excision or ablation of endometriosis (improves pain in 70-80%)
    - Hysterectomy with bilateral salpingo-oophorectomy (definitive if family complete, severe disease)
  - Adenomyosis
    - Medical management (hormonal suppression)
    - Uterine artery embolization
    - Hysterectomy (definitive)
  - Multidisciplinary approach
    - Physical therapy (pelvic floor)
    - Pain management
    - Psychological support
  patient_education:
  - Chronic condition requiring long-term management
  - Infertility common (30-50% with endometriosis)
  - Symptoms may improve with pregnancy, worsen after
  - Multiple treatment options available
  next:
  - default: null

- id: fibroids_adenomyosis
  when:
    uterus: enlarged_or_irregular
  description: Uterine fibroids (leiomyomas)
  tests:
  - Pelvic ultrasound
    - Intramural, submucosal, or subserosal fibroids
    - Size and location
  - MRI (if surgical planning needed)
  - CBC (anemia from heavy bleeding)
  suggest_dx:
  - Uterine fibroids (leiomyomas, benign smooth muscle tumors)
  - Adenomyosis (if diffusely enlarged, tender uterus)
  referrals:
  - OB/GYN
  management:
  - Observation if asymptomatic
  - Medical management (if symptoms)
    - NSAIDs for pain
    - Tranexamic acid or hormonal therapy for heavy bleeding
    - GnRH agonists (shrink fibroids temporarily, preoperative)
  - Surgical options
    - Myomectomy (remove fibroids, preserve uterus, maintain fertility)
    - Uterine artery embolization (UAE) - shrink fibroids, preserve uterus, avoid surgery
    - Hysterectomy (definitive, if family complete)
    - MRI-guided focused ultrasound (non-invasive ablation)
  patient_education:
  - Very common (70-80% of women by age 50)
  - Often asymptomatic
  - Multiple treatment options depending on symptoms, size, desire for fertility
  next:
  - default: null

differential_diagnosis:
  gynecologic_emergencies:
    - Ectopic pregnancy (ruptured or unruptured)
    - Ovarian torsion (twisted ovary, ischemia)
    - Ruptured ovarian cyst with hemorrhage
    - Ruptured tubo-ovarian abscess
  gynecologic_non_emergent:
    - Pelvic inflammatory disease (PID)
    - Ovarian cyst (functional, dermoid, endometrioma)
    - Uterine fibroids (leiomyomas)
    - Endometriosis
    - Adenomyosis
    - Mittelschmerz (ovulation pain)
    - Dysmenorrhea (primary or secondary)
  pregnancy_related:
    - Ectopic pregnancy
    - Spontaneous abortion
    - Corpus luteum cyst
    - Round ligament pain (normal pregnancy)
  gastrointestinal:
    - Appendicitis
    - Diverticulitis
    - Inflammatory bowel disease (Crohn's, ulcerative colitis)
    - Irritable bowel syndrome (IBS)
    - Bowel obstruction
  urologic:
    - Urinary tract infection (cystitis, pyelonephritis)
    - Nephrolithiasis (kidney stones)
    - Interstitial cystitis
  other:
    - Musculoskeletal pain (pelvic floor dysfunction, myofascial pain)
    - Hernia (inguinal, femoral)
    - Nerve entrapment

disposition_guidance:
  admit:
    - Hemodynamic instability
    - Peritoneal signs (ruptured ectopic, torsion, appendicitis, ruptured TOA)
    - Severe PID or tubo-ovarian abscess
    - Unable to tolerate oral intake or medications
    - Pregnancy with concerning features
    - Failed outpatient management
  emergent_surgery:
    - Ruptured ectopic pregnancy
    - Ovarian torsion
    - Ruptured TOA
    - Appendicitis with peritonitis
  discharge:
    - Stable vital signs
    - Tolerating oral intake
    - Pain controlled with oral medications
    - Reliable for follow-up
    - OB/GYN or appropriate specialty follow-up arranged
  follow_up:
    - PID - recheck in 48-72 hours (ensure clinical improvement)
    - Ovarian cyst - repeat ultrasound in 6-8 weeks
    - Ectopic pregnancy on methotrexate - beta-hCG days 4 and 7
    - Chronic pelvic pain - OB/GYN within 1-2 weeks

references:
  - ACOG Practice Bulletin No. 194 - Polycystic Ovary Syndrome. Obstet Gynecol. 2018.
  - ACOG Practice Bulletin No. 114 - Management of Endometriosis. Obstet Gynecol. 2010 (Reaffirmed 2018).
  - CDC Sexually Transmitted Infections Treatment Guidelines - Pelvic Inflammatory Disease. 2021.
  - Reaffirmed ACOG Committee Opinion No. 310 - Endometriosis in Adolescents. Obstet Gynecol. 2005.
