trace:
  - Patient presents with vulvar itching and thick white discharge
  - Perform vaginal exam and obtain vaginal pH
  - Wet mount/KOH prep shows budding yeast and pseudohyphae
  - Diagnose uncomplicated vulvovaginal candidiasis
  - Treat with topical azole x7 days OR fluconazole 150mg single dose
  - If recurrent (≥4/year), consider suppressive therapy and workup for predisposing factors
