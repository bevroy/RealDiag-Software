tree_id: ID-HEPATITIS-A
name: Hepatitis A (Acute)
family: infectious_disease
specialty: Gastroenterology
icd10: B15.9
snomed: 40468003
urgency: []
homeopathy: []
presentations:
  - Abrupt onset of symptoms after 2-6 week incubation
  - Jaundice (yellowing of skin and sclera)
  - Dark urine (tea-colored) and pale stools
  - Fatigue and malaise
  - Nausea, vomiting, and anorexia
  - Right upper quadrant abdominal pain
  - Low-grade fever
  - Pruritus (from cholestasis)
  - Recent travel to endemic area
  - Exposure to contaminated food or water
workup:
  - Anti-HAV IgM - diagnostic of acute infection (positive within 1 week of symptom onset)
  - Hepatitis A total antibody (anti-HAV total) - includes IgM and IgG (immunity)
  - Liver function tests - ALT/AST elevated (often >1000 U/L)
  - Total and direct bilirubin - elevated in icteric phase
  - Alkaline phosphatase and GGT - may be elevated
  - PT/INR - assess hepatic synthetic function (prolonged suggests severe hepatitis)
  - Complete blood count - mild leukopenia common
  - Test for hepatitis B and C if risk factors present
  - Pregnancy test in women of reproductive age (vertical transmission rare)
treatment:
  - Supportive care only - no specific antiviral therapy available
  - Rest as needed; no strict bed rest required
  - Maintain adequate nutrition and hydration
  - Avoid alcohol completely during illness and for several months after
  - Avoid hepatotoxic medications (acetaminophen, NSAIDs, herbal supplements)
  - Antiemetics for nausea (ondansetron, promethazine)
  - Monitor liver function tests weekly until improving
  - Hospitalization if severe hepatitis (INR >1.5, altered mental status, intractable vomiting)
  - Post-exposure prophylaxis for close contacts (within 2 weeks of exposure)
  - HAV vaccine (preferred) or immune globulin for post-exposure prophylaxis
  - Report to health department (nationally notifiable disease)
  - Food handlers should not return to work until 1 week after jaundice onset
treatment:
  - Prevention with HAV vaccine (highly effective, 2-dose series)
  - Vaccine recommended for travelers to endemic areas, MSM, people with chronic liver disease
  - Hand hygiene and sanitation to prevent transmission
clinical_pearls:
  - "Hepatitis A is self-limited; does NOT cause chronic hepatitis or cirrhosis"
  - "Transmission: fecal-oral route via contaminated food/water or close personal contact"
  - "Incubation period 15-50 days (average 28 days); most infectious 2 weeks before symptom onset"
  - "Children <6 years often asymptomatic but can transmit virus"
  - "Adults more likely to have symptomatic disease with jaundice (70% vs 30% in children)"
  - "Acute liver failure rare (<1%) but higher risk in adults >50 and those with chronic liver disease"
  - "Cholestatic variant (prolonged jaundice and pruritus) can occur but still resolves"
  - "Relapsing hepatitis A (10-20%) - symptoms recur after initial improvement; still self-limited"
  - "Lifelong immunity after infection (IgG antibody persists)"
  - "Outbreaks associated with contaminated food (shellfish, produce), daycare centers, homeless populations"
referrals:
  - Gastroenterology/Hepatology if severe hepatitis or prolonged course
  - Hospital admission if coagulopathy, encephalopathy, or inability to maintain hydration
  - Liver transplant center if fulminant hepatic failure develops
  - Public Health for outbreak investigation and contact tracing
differentials:
  - Hepatitis B or C (check serology, HAV more acute onset)
  - Hepatitis E (similar presentation, travel to endemic areas, test if HAV negative)
  - EBV or CMV hepatitis (younger patients, atypical lymphocytes, check serology)
  - Drug-induced liver injury (medication history, eosinophilia, higher transaminases)
  - Alcoholic hepatitis (history of heavy alcohol use, AST>ALT ratio >2)
  - Autoimmune hepatitis (check autoantibodies, more insidious onset)
  - Biliary obstruction (choledocholithiasis, cholangitis) - imaging shows dilated ducts
