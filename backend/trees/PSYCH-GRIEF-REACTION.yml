presentations:
  - Recent loss of loved one (death, separation, or other significant loss)
  - Sadness, yearning, or longing for deceased
  - Preoccupation with thoughts or memories of deceased
  - Crying spells
  - Difficulty accepting the death
  - Waves of grief triggered by reminders
  - Sleep disturbance
  - Appetite changes
  - Social withdrawal
  - Symptoms fluctuate in intensity over time (comes in waves)
  - Able to experience positive emotions at times
  - Maintains self-esteem and sense of identity
  - Gradual improvement over weeks to months
differentials:
  - Normal grief/bereavement (waves of sadness, triggered by reminders, self-esteem intact, improves over time)
  - Prolonged grief disorder (intense symptoms persist beyond 12 months, significant functional impairment)
  - Major depressive disorder (persistent depressed mood, anhedonia, worthlessness, not necessarily tied to loss)
  - Adjustment disorder (stressor other than bereavement, resolves within 6 months)
  - Post-traumatic stress disorder (traumatic death with intrusion, avoidance, hyperarousal symptoms)
  - Complicated grief (difficulty accepting death, intense yearning, functional impairment beyond 12 months)
workup:
  - Clinical assessment
  - Establish timing and nature of loss
  - Assess grief symptoms and their impact on functioning
  - Normal grief trajectory varies by culture and individual
  - Distinguish normal grief from prolonged grief disorder
  - 'Prolonged grief: intense symptoms persist beyond 12 months (adults) or 6 months (children)'
  - Symptoms interfere significantly with daily functioning
  - Persistent yearning/longing, intense emotional pain
  - Preoccupation with deceased to exclusion of other activities
  - Difficulty accepting death or moving forward with life
  - Rule out major depressive disorder
  - 'In grief: symptoms tied to loss, come in waves, preserve self-esteem'
  - 'In MDD: persistent depressed mood, pervasive loss of pleasure, feelings of worthlessness/guilt'
  - Assess for complicated grief risk factors
  - Sudden or traumatic death (suicide, homicide, accident)
  - Death of child or spouse
  - Ambivalent or dependent relationship with deceased
  - History of depression or anxiety
  - Limited social support
  - Multiple losses
  - Screen for suicidal ideation (risk elevated in bereavement)
  - Assess functional impairment
  - Ability to work, maintain relationships, self-care
  - Cultural and spiritual beliefs about death and mourning
treatment:
  - Supportive care and psychoeducation (primary intervention for uncomplicated grief)
  - Normalize grief reactions ("grief is not an illness to be cured")
  - Explain trajectory of grief (acute grief peaks 6 months, gradual improvement over 1-2 years)
  - Individual variation in grief process is normal
  - Encourage healthy grieving
  - Talk about deceased and memories (both positive and difficult)
  - Allow expression of emotions without judgment
  - Maintain routine and self-care
  - 'Patient advice: Stay connected to social support'
  - Honor deceased through rituals, memorials
  - Meaning-making and finding purpose after loss
  - Bereavement support
  - Support groups for bereaved individuals
  - Faith community support if desired
  - Family involvement in grieving process
  - Psychotherapy (if prolonged or complicated grief develops)
  - Complicated grief treatment (CGT) - specialized therapy
  - Combines CBT, interpersonal therapy, and motivational interviewing
  - Focus on accepting loss and re-engaging with life
  - Cognitive Behavioral Therapy for complicated grief
  - Pharmacotherapy (NOT routinely recommended for normal grief)
  - Consider if comorbid major depression develops
  - 'SSRIs: sertraline 50-200 mg, escitalopram 10-20 mg'
  - Avoid benzodiazepines (interfere with grief processing, addiction risk)
  - Short-term sleep aids if severe insomnia
  - Monitor for prolonged grief disorder
  - Reassess at 6-12 months if symptoms not improving
clinical_pearls:
  - Normal grief is not a mental disorder - most bereaved individuals do not require professional treatment
  - Acute grief typically peaks around 6 months, with gradual improvement over 1-2 years
  - Complicated/Prolonged grief disorder affects 10-20% of bereaved - persistent intense symptoms beyond 12 months
  - 'Key difference from depression: in grief, pain comes in waves (triggered by reminders), self-esteem preserved; in MDD, persistent low mood and feelings of worthlessness'
  - Stages of grief (denial, anger, bargaining, depression, acceptance) not linear - individuals move back and forth
  - Avoid premature medicalization of grief - antidepressants NOT indicated for normal grief
  - Suicide risk elevated in first year after bereavement - always assess
  - Cultural variation in grief expression - assess within cultural context
