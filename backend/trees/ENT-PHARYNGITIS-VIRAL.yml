urgency: medium
description: Comprehensive evaluation and management of Viral Pharyngitis
version: '1.0'
citations:
  - AAO-HNS (American Academy of Otolaryngology–Head and Neck Surgery) Clinical Practice Guidelines
  - British Society of Otology Guidelines
  - UpToDate - Otolaryngology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sore throat
- Usually associated with other URI symptoms (cough, rhinorrhea)
- Low-grade or no fever
- Pharyngeal erythema without exudates
- Gradual onset
- Self-limited course
workup:
- Clinical diagnosis - testing NOT needed if viral features present (cough, rhinorrhea,
  conjunctivitis)
- Rapid strep test only if Centor score ≥2-3 to rule out bacterial infection
- 'EBV testing (Monospot, EBV VCA IgM) if: Severe pharyngitis + fatigue + posterior
  cervical nodes + splenomegaly'
treatment:
- 'Guideline-based treatment options for Viral Pharyngitis include:'
- 'Symptomatic treatment only: NSAIDs (ibuprofen 400-600mg q6h), acetaminophen 650-1000mg
  q6h (AAO-HNS 2023)'
- Throat lozenges with benzocaine or menthol, warm salt water gargles (1/2 tsp salt
  in 8oz water) (AAO-HNS 2023)
- Increase oral fluids, rest, humidified air (AAO-HNS 2023)
- 'If EBV (mono): Avoid contact sports for 3-4 weeks (risk of splenic rupture), corticosteroids
  if severe tonsillar enlargement (AAO-HNS 2023)'
- 'Duration: Usually resolves in 5-7 days (AAO-HNS 2023)'
clinical_pearls:
- Most common cause of pharyngitis (85-95%) - adenovirus, rhinovirus, coronavirus,
  EBV, influenza
- 'Infectious mononucleosis (EBV): Severe pharyngitis + fatigue + posterior cervical
  nodes + splenomegaly'
- DO NOT give amoxicillin if mono suspected - causes morbilliform rash in 80-90%
- 'Herpangina (coxsackievirus): Vesicles/ulcers on posterior pharynx, common in children
  summer/fall'
- Antibiotics do NOT help viral pharyngitis and contribute to resistance - supportive
  care only
referrals:
- 'Emergency department if: Severe dysphagia with dehydration, respiratory distress,
  suspected peritonsillar abscess'
- 'Return precautions: If symptoms worsen or don''t improve in 7-10 days'
differentials:
  - Strep throat
  - Mononucleosis
  - URI
  - Allergic rhinitis
  - GERD
