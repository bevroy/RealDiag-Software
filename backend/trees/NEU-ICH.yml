tree_id: NEU-ICH
name: Spontaneous intracerebral hemorrhage
family: Neurology
specialty: Neurology
icd10:
- I61.9
snomed:
- '274100004'
urgency: medium
description: Comprehensive evaluation and management of Spontaneous intracerebral
  hemorrhage
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- sudden severe headache with focal deficits
- nausea, vomiting, altered consciousness
- hypertension common risk factor
- Markedly elevated BP (often >200/120)
- Seizures (10-15%, more common than ischemic stroke)
- 'Common locations: Basal ganglia (hypertension), lobar (amyloid angiopathy)'
workup:
- 'Noncontrast CT head: Hyperdense blood in brain parenchyma'
- 'CT angiography (CTA): If concern for vascular malformation, tumor, or secondary
  cause'
- 'MRI brain: If lobar hemorrhage (rule out amyloid angiopathy, tumor)'
- 'Coagulation studies: PT/INR, aPTT, platelet count'
treatment:
- 'Guideline-based treatment options for Spontaneous intracerebral hemorrhage include:'
- 'Immediate: Noncontrast CT head, reverse anticoagulation, BP control, neurosurgery
  consult (AAN 2024)'
- 'Reverse anticoagulation: Warfarin (PCC + vit K), DOACs (idarucizumab for dabigatran,
  andexanet for Xa inhibitors) (AAN 2024)'
- 'BP control: Nicardipine 5mg/hr IV titrated to SBP 140-160 (avoid aggressive lowering)
  (AAN 2024)'
- 'ICP management: Elevate HOB 30°, maintain CPP >60, consider mannitol/hypertonic
  saline if herniation (AAN 2024)'
- 'Disposition: ICU admission, neurosurgery evaluation for surgical evacuation vs
  observation (AAN 2024)'
clinical_pearls:
- 'Reverse anticoagulation immediately: Vitamin K 10mg IV + PCC (or FFP) for warfarin'
- 'BP lowering: Target SBP 140-160 mmHg (lower mortality, but avoid <140)'
- 'Neurosurgery consult: For cerebellar hemorrhage >3cm, hydrocephalus, mass effect'
- 'Hold tPA/anticoagulation: Contraindicated, will worsen bleeding'
- 'ICH score predicts mortality: GCS + ICH volume + IVH + age + location'
referrals:
- 'Neurosurgery URGENTLY: For cerebellar hemorrhage >3cm, hydrocephalus, significant
  mass effect'
- ICU admission for all ICH patients
differentials: []
trace:
  source: American Academy of Neurology (AAN) Practice Guidelines, American Stroke
    Association (ASA) Guidelines
