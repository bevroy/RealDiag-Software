tree_id: HEME-IMMUNE-THROMBOCYTOPENIA
name: Immune Thrombocytopenic Purpura (ITP)
family: Hematology
specialty: Hematology
chief_complaint: Petechiae, easy bruising, mucosal bleeding
description: Autoimmune disorder causing isolated thrombocytopenia from antibody-mediated platelet destruction
icd10: D69.3
snomed: 32273002
presentations:
  - Petechiae, purpura, ecchymoses
  - Mucosal bleeding (gums, nose)
  - Menorrhagia
  - May be asymptomatic (incidental finding)
  - No splenomegaly
  - Severe: CNS or GI bleeding
urgency: routine-to-emergency
referrals:
  emergency:
    - Acute leukemia
    - TTP/HUS
    - DIC
    - Hgb <7 with symptoms
  urgent:
    - New lymphadenopathy
    - Plt <20k
    - Severe anemia
  routine:
    - Mild anemia
    - Clotting disorder
    - Anticoagulation

workup:
  - Clinical presentation - bleeding symptoms correlate with platelet count
  - Platelet count 30,000-50,000/μL - minimal symptoms, easy bruising
  - Platelet count 10,000-30,000/μL - petechiae, purpura, mucosal bleeding
  - Platelet count less than 10,000/μL - risk of spontaneous bleeding, intracranial hemorrhage (rare, 0.5-1%)
  - Petechiae (pinpoint red spots on skin, non-blanching)
  - Purpura (larger purple bruises)
  - Mucosal bleeding - epistaxis, gingival bleeding, menorrhagia
  - Wet purpura (oral bleeding) - higher risk for serious bleeding
  - No systemic symptoms typically (no fever, weight loss, night sweats)
  - Physical examination
  - Skin - petechiae, purpura, ecchymoses
  - Distribution - dependent areas (legs), pressure points
  - Oral mucosa - petechiae, blood blisters
  - No splenomegaly (if splenomegaly present, consider alternative diagnosis)
  - No lymphadenopathy
  - No hepatomegaly
  - Otherwise normal exam (no bone pain, no neurologic deficits)
  - Laboratory studies - diagnosis of exclusion
  - Complete blood count with differential
  - Isolated thrombocytopenia (platelet count less than 100,000/μL)
  - Normal hemoglobin and WBC (unless bleeding causes anemia)
  - Normal WBC differential
  - Peripheral blood smear - rule out pseudothrombocytopenia (platelet clumping), assess platelet morphology
  - Large platelets (young platelets from increased bone marrow production)
  - No schistocytes (rules out TTP, HUS)
  - No blasts (rules out leukemia)
  - HIV testing (HIV-related ITP common)
  - Hepatitis C testing (HCV-related ITP)
  - H. pylori testing (stool antigen or urea breath test) - eradication may improve ITP
  - Thyroid function tests (autoimmune thyroid disease association)
  - ANA (screen for SLE)
  - Direct antiglobulin test (Coombs) - if anemia present, rule out Evans syndrome (ITP plus autoimmune hemolytic anemia)
  - Bone marrow biopsy - NOT routinely indicated
  - Consider if age greater than 60, atypical features, planned splenectomy
  - Shows increased or normal megakaryocytes
  - Rules out bone marrow failure, myelodysplasia, leukemia
  - Anti-platelet antibodies - NOT useful (poor sensitivity/specificity, not recommended)
treatment:
  - Observation if asymptomatic and platelet count greater than 30,000/μL
  - Many patients (especially children) have spontaneous remission
  - Avoid aspirin, NSAIDs, anticoagulants
  - First-line therapies - for platelet count less than 30,000/μL or bleeding symptoms
  - Corticosteroids
  - Prednisone 1 mg/kg/day (60-80 mg daily) for 2-4 weeks, then taper
  - Or dexamethasone 40 mg daily for 4 days (high-dose pulse)
  - 70-80% response rate (platelet count greater than 50,000/μL)
  - Side effects - hyperglycemia, insomnia, mood changes, weight gain
  - Intravenous immunoglobulin (IVIG)
  - 1 g/kg daily for 1-2 days OR 0.4 g/kg/day for 5 days
  - Rapid increase in platelets (within 24-72 hours)
  - Use for severe bleeding, need rapid platelet increase, or before surgery
  - Expensive, temporary effect (2-4 weeks)
  - Anti-D immunoglobulin (WinRho) - for Rh-positive, non-splenectomized patients
  - 50-75 mcg/kg IV single dose
  - Less expensive than IVIG, effective 70-80%
  - Causes mild hemolysis (intentional, blocks splenic clearance)
  - Second-line therapies - for refractory disease or relapse
  - Thrombopoietin receptor agonists (TPO-RA) - stimulate platelet production
  - Romiplostim (Nplate) 1-10 mcg/kg SC weekly
  - Eltrombopag (Promacta) 25-75 mg PO daily
  - 70-80% response rate, well-tolerated
  - Risk of thrombosis (5%), bone marrow fibrosis (rare)
  - Splenectomy - curative for many patients
  - 60-70% achieve complete remission, another 20% partial response
  - Reserved for refractory ITP (failed medical therapy for 3-6 months)
  - Laparoscopic preferred
  - Vaccinate 2-4 weeks before surgery (pneumococcal, meningococcal, H. influenzae B)
  - Lifelong infection risk (encapsulated organisms)
  - Immunosuppressive agents
  - Rituximab (anti-CD20) 375 mg/m2 weekly for 4 weeks
  - 40-60% response rate, may have durable remission
  - Mycophenolate mofetil 1000-1500 mg BID
  - Azathioprine 1-2 mg/kg/day
  - Cyclosporine 3-5 mg/kg/day in divided doses
  - Emergency treatment for life-threatening bleeding
  - High-dose steroids - methylprednisolone 1 g IV daily for 3 days
  - IVIG 1 g/kg
  - Platelet transfusion (usually ineffective but give if life-threatening bleeding)
  - Anti-fibrinolytics - tranexamic acid 1 g IV/PO TID
  - Consider emergent splenectomy if refractory
  - H. pylori eradication if positive - may improve platelet count (50-60% response)
  - Standard triple therapy
clinical_pearls:
  - Incidence 3-4 per 100,000, bimodal age distribution (children 2-10 years, adults 20-50 years)
  - Children - acute onset, often post-viral, 70-80% spontaneous remission within 6 months
  - Adults - insidious onset, chronic course (greater than 12 months), less likely to remit spontaneously
  - Diagnosis of exclusion - must rule out other causes of thrombocytopenia
  - Splenomegaly NOT expected in ITP - if present, consider alternative diagnosis
  - Platelet count less than 10,000/μL highest risk for bleeding, but ICH rare (less than 1%)
  - Wet purpura (oral mucosal bleeding) high-risk sign requiring urgent treatment
  - Pregnancy considerations - may worsen during pregnancy, manage collaboratively with MFM
  - Risk of neonatal thrombocytopenia from transplacental antibody transfer
  - Evans syndrome - ITP plus autoimmune hemolytic anemia (10-15% of ITP patients)
  - Drug-induced thrombocytopenia mimics ITP (heparin, quinine, antibiotics) - temporal relationship key
differentials:
  - Thrombotic thrombocytopenic purpura (TTP) - fever, renal failure, neurologic symptoms, schistocytes, elevated LDH
  - Hemolytic uremic syndrome (HUS) - diarrhea prodrome (E. coli O157:H7), renal failure, schistocytes
  - Drug-induced thrombocytopenia (heparin, quinine, valproic acid, antibiotics) - temporal relationship
  - HIV-related thrombocytopenia (HIV positive, otherwise similar to ITP)
  - Hepatitis C-related thrombocytopenia
  - Systemic lupus erythematosus (positive ANA, other lupus features)
  - Bone marrow disorders (leukemia, aplastic anemia, myelodysplastic syndrome) - abnormal bone marrow biopsy
  - Hypersplenism (splenomegaly, portal hypertension, also cytopenias)
  - Pseudothrombocytopenia (platelet clumping in EDTA tube, repeat with citrate or heparin tube)
trace:
  - 32-year-old woman presents with 2-week history of easy bruising and petechiae
  - Noticed multiple small red spots on legs and feet
  - Bruises appearing with minimal trauma
  - Heavier than usual menstrual period this month
  - Gums bleeding when brushing teeth
  - No fever, no weight loss, no night sweats
  - No recent infections or new medications
  - Past medical history - none
  - Medications - oral contraceptive pill
  - Family history - no bleeding disorders
  - Physical exam - appears well, no distress
  - Vitals - normal
  - Skin - multiple petechiae on bilateral lower extremities, several purpuric lesions on arms and legs
  - Oral mucosa - few petechiae on buccal mucosa
  - No lymphadenopathy, no hepatosplenomegaly
  - Remainder of exam normal
  - Labs - CBC with differential
  - WBC 6.8 K/μL (normal), hemoglobin 12.5 g/dL (normal), platelets 18,000/μL (severely low, normal 150-400)
  - WBC differential - normal
  - Peripheral blood smear - isolated thrombocytopenia, large platelets, no schistocytes, no blasts, no platelet clumping
  - Comprehensive metabolic panel - normal
  - HIV negative, hepatitis C negative
  - H. pylori stool antigen positive
  - TSH normal, ANA negative
  - Diagnosis - Immune thrombocytopenic purpura (ITP), newly diagnosed
  - Platelet count 18,000/μL - indication for treatment (less than 30,000 plus mucosal bleeding)
  - Hematology consultation obtained
  - Treatment plan
  - Prednisone 1 mg/kg = 60 mg daily for 3 weeks
  - H. pylori eradication therapy - amoxicillin, clarithromycin, omeprazole for 14 days
  - Avoid aspirin, NSAIDs
  - Menstrual suppression - continuous OCP to avoid withdrawal bleed
  - Precautions - avoid contact sports, risk of head injury
  - Return if new bleeding, severe headache, abdominal pain
  - 1-week follow-up - significant improvement
  - No new petechiae, bruising improving
  - Menstrual bleeding controlled with continuous OCP
  - Repeat CBC - platelets 52,000/μL (significant increase, response to prednisone)
  - Continue prednisone
  - 3-week follow-up - continued improvement
  - Platelets 110,000/μL (normal range)
  - Begin prednisone taper - decrease to 40 mg daily for 1 week, then 20 mg for 1 week, then 10 mg for 1 week, then off
  - Completed H. pylori eradication (may take months to see platelet effect if any)
  - 6-week follow-up - off prednisone for 1 week
  - Platelets 95,000/μL (stable, slightly low but safe)
  - No bleeding symptoms
  - Plan observation, monitor CBC monthly
  - 3-month follow-up - platelets stable 88,000/μL
  - No symptoms, no treatment needed
  - H. pylori eradication confirmed (stool antigen negative)
  - 6-month follow-up - platelets 105,000/μL (improved)
  - H. pylori eradication may have contributed to improvement
  - Continue observation
  - 1-year follow-up - platelets stable 110-130,000/μL
  - Asymptomatic, no bleeding
  - In remission, follow-up PRN
  - Outcome - Excellent response to prednisone with sustained remission, H. pylori eradication possibly contributory
