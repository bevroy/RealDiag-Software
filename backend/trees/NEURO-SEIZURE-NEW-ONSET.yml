tree_id: NEURO-SEIZURE-NEW-ONSET
name: New-Onset Seizure
family: Neurology
specialty: Neurology
chief_complaint: Witnessed convulsion
description: First-time seizure requiring evaluation for underlying cause and determination of recurrence risk to guide treatment decisions

icd10: R56.9
snomed: 91175000
presentations:
  - First-time seizure
  - Witnessed tonic-clonic activity
  - Loss of consciousness
  - Postictal confusion, drowsiness
  - Tongue biting, incontinence
  - May have prodrome or aura
  - No prior seizure history

urgency: emergent

workup:
  - Seizure definition: abnormal excessive synchronous neuronal activity causing transient signs/symptoms
  - Generalized tonic-clonic seizure presentation: loss of consciousness, tonic stiffening followed by clonic jerking, tongue biting, urinary incontinence, post-ictal confusion and drowsiness
  - Focal seizure presentation: may have preserved awareness (formerly simple partial) or impaired awareness (formerly complex partial), motor symptoms (jerking one body part), sensory symptoms, automatisms (lip smacking, picking), may secondarily generalize
  - Post-ictal period: confusion, drowsiness, Todd paralysis (transient weakness after focal motor seizure)
  - Distinguish seizure from syncope: seizure has prolonged post-ictal confusion (syncope rapid recovery), seizure may have tongue biting lateral tongue (syncope rare), seizure has tonic-clonic movements (syncope brief myoclonic jerks only), seizure has incontinence common (syncope rare)
  - Provoked vs unprovoked: provoked seizure has acute symptomatic cause (trauma, infection, metabolic, stroke, drug withdrawal) within 7 days, unprovoked has no acute cause or remote cause (old stroke, prior TBI)
  - Laboratory: glucose (hypoglycemia causes seizure), sodium (hyponatremia less than 120 mEq/L), calcium, magnesium, CBC, toxicology screen (cocaine, amphetamines), alcohol level, pregnancy test
  - Brain imaging: non-contrast CT head emergently to rule out hemorrhage, mass, stroke, MRI brain (more sensitive for subtle lesions, cortical dysplasia, hippocampal sclerosis, tumors) - obtain within days
  - EEG: not emergently needed unless concern for non-convulsive status epilepticus (prolonged altered mental status), routine EEG within 1-2 weeks (identifies epileptiform discharges supporting diagnosis epilepsy, focal slowing suggests structural lesion), sleep-deprived EEG increases yield
  - Lumbar puncture if fever or concern for meningitis/encephalitis
  - Causes new-onset seizure adults: stroke/TIA (most common in elderly), brain tumor (primary or metastatic), traumatic brain injury (acute or remote), CNS infection (meningitis, encephalitis, abscess), metabolic (hyponatremia, hypoglycemia, hypocalcemia), drug intoxication or withdrawal (alcohol, benzodiazepines), eclampsia (pregnancy), cryptogenic (no cause found)

treatment:
  - Acute management: ABCs (airway, breathing, circulation), place patient in lateral decubitus position (prevent aspiration), protect from injury (pad head, remove dangerous objects), do NOT restrain, do NOT place objects in mouth
  - Benzodiazepines if seizure continues greater than 5 minutes (status epilepticus): lorazepam 0.1 mg/kg IV (typically 4 mg) or diazepam 10 mg IV or midazolam 10 mg IM if no IV access
  - Treat underlying cause: correct hypoglycemia (D50 50 mL IV), correct hyponatremia (hypertonic saline if severe), antibiotics if meningitis, thiamine before glucose if alcoholic or malnourished (prevent Wernicke)
  - Antiseizure medication decision: do NOT start after single unprovoked seizure if normal workup and low recurrence risk (10-year recurrence risk 40-50 percent, patient may choose observation), START antiseizure medication if recurrent seizure (2 or more unprovoked seizures defines epilepsy), structural lesion on MRI, epileptiform activity on EEG, patient preference to reduce recurrence risk
  - First-line antiseizure medications: levetiracetam 500 mg BID titrate to 1000-1500 mg BID (well-tolerated, no drug interactions, no monitoring), lamotrigine 25 mg daily titrate slowly to 200-400 mg daily (fewer side effects but slow titration), valproate 500-1000 mg daily divided (broad spectrum, but weight gain, tremor, hepatotoxicity, teratogenic)
  - Focal seizures: levetiracetam, lamotrigine, carbamazepine, or oxcarbazepine
  - Generalized seizures: levetiracetam, lamotrigine, or valproate
  - Driving restrictions: most states require seizure-free interval (typically 3-12 months) before resuming driving, discuss with patient
  - Counseling: avoid triggers (sleep deprivation, alcohol, flashing lights if photosensitive), shower instead of bath (drowning risk), avoid heights and swimming alone, wear medical alert bracelet

clinical_pearls:
  - Single unprovoked seizure with normal workup may not require antiseizure medication (observation reasonable, discuss risks/benefits)
  - Two or more unprovoked seizures defines epilepsy (start medication)
  - MRI brain more sensitive than CT for structural causes (get within days)
  - Levetiracetam first-line (well-tolerated, no drug interactions)
  - Tongue biting lateral tongue and prolonged post-ictal confusion distinguish seizure from syncope
  - Provoked seizure (metabolic, withdrawal, acute stroke) treat cause, may not need chronic antiseizure medication
  - Driving restrictions typically 3-12 months seizure-free (state-dependent)

differentials:
  - Syncope (brief loss of consciousness, rapid recovery, no post-ictal confusion)
  - Psychogenic non-epileptic seizure (PNES) - resembles seizure but no EEG correlate, psychiatric etiology
  - Transient ischemic attack (focal neurologic deficit but no loss of consciousness or convulsions)
  - Migraine with aura (visual or sensory symptoms but no loss of consciousness)

trace:
  - 32-year-old woman brought to ED by husband after witnessed generalized tonic-clonic seizure at home
  - Event description: sudden loss of consciousness while cooking dinner, fell to floor, entire body stiffened (tonic phase) for 30 seconds then rhythmic jerking both arms and legs (clonic phase) for 90 seconds, eyes rolled back, bit tongue, urinated on herself, post-ictal period confused and drowsy for 30 minutes
  - History: no prior seizures, no recent head trauma, no fevers, not pregnant, no substance use, slept only 3 hours last night (sleep-deprived), no family history epilepsy
  - Exam: alert now, oriented x 3, lateral tongue laceration (from biting), otherwise normal neurologic exam, no focal deficits
  - Labs: glucose 98 mg/dL (normal), sodium 138 mEq/L (normal), calcium 9.2 mg/dL (normal), magnesium 2.0 mEq/L (normal), CBC normal, toxicology screen negative, pregnancy test negative
  - CT head non-contrast: no hemorrhage, mass, or acute stroke
  - Diagnosis: first generalized tonic-clonic seizure, unprovoked (no acute symptomatic cause identified), possible trigger sleep deprivation
  - Observation in ED for 4 hours, remained stable, no recurrent seizure
  - MRI brain ordered outpatient (more sensitive for subtle structural lesions)
  - EEG ordered outpatient (sleep-deprived EEG increases sensitivity for epileptiform discharges)
  - Counseling: single unprovoked seizure, recurrence risk approximately 40-50 percent over 10 years, options are observation vs starting antiseizure medication
  - Patient preference: concerned about recurrence (worried about driving, job), chooses to start medication
  - Started levetiracetam 500 mg twice daily (plan to increase to 1000 mg BID after 1 week)
  - Driving restrictions: patient counseled cannot drive for 6 months per state law (seizure-free interval required)
  - MRI brain 5 days later: normal (no structural lesion, good prognosis)
  - EEG 10 days later: normal background, no epileptiform discharges
  - Follow-up 2 weeks: tolerating levetiracetam well (minimal side effects), increased to 1000 mg BID
  - 6 months: no recurrent seizures, continues levetiracetam 1000 mg BID
  - Driving restriction lifted (6 months seizure-free), returns to work and normal activities
  - 1 year: remains seizure-free on levetiracetam
  - Counseling: if remains seizure-free for 2-5 years can consider tapering medication (discuss with neurologist)
