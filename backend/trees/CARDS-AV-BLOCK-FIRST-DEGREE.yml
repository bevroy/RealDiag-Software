tree_id: CARDS-AV-BLOCK-FIRST-DEGREE
name: First-Degree AV Block
family: Cardiology
specialty: Cardiology
chief_complaint: Prolonged PR interval on ECG
description: Delay in AV conduction causing PR interval over 200 ms. Usually asymptomatic and benign. All impulses conducted to ventricles (no dropped beats). Often incidental finding. No treatment required unless symptomatic or progressive.
icd10: I44.0
snomed: 27885002
presentations:
  - Usually asymptomatic
  - Discovered incidentally on ECG
  - Occasionally reports fatigue or mild exercise intolerance
  - No syncope or significant symptoms
urgency: non-urgent

workup:
  - Symptoms: usually asymptomatic (benign finding)
  - Occasionally fatigue: if severe first-degree block (PR over 300 ms causes suboptimal AV synchrony)
  - ECG findings (diagnostic):
  - PR interval over 200 ms (normal 120-200 ms)
  - Every P wave followed by QRS (1:1 AV conduction - all impulses conducted)
  - Regular rhythm
  - Normal QRS duration (unless coexisting bundle branch block)
  - Causes:
  - Enhanced vagal tone: athletes, during sleep (physiologic)
  - Medications: beta blockers, calcium channel blockers, digoxin, amiodarone
  - Myocardial infarction: especially inferior MI (RCA supplies AV node)
  - Lyme disease: carditis with conduction abnormalities
  - Infiltrative disease: sarcoidosis, amyloidosis
  - Electrolyte abnormalities: hyperkalemia
  - Congenital heart disease
  - Idiopathic: age-related fibrosis
  - Often normal variant: no underlying disease
  - Physical exam: usually normal
  - Soft S1: if very prolonged PR (atria contract too early before ventricles, less blood to close mitral valve)
  - Workup:
  - ECG: measure PR interval
  - Review medications
  - Electrolytes: potassium, magnesium
  - Consider Lyme serology: if endemic area and recent tick exposure
  - Echocardiogram: if concern for structural disease
  - Holter monitor: if concern for progression to higher-degree block

treatment:
  - No treatment needed for isolated first-degree AV block:
  - Benign condition
  - Excellent prognosis
  - No pacemaker indicated
  - Observation: monitor for progression to higher-degree block
  - Address underlying causes:
  - Adjust medications: reduce or stop AV nodal blockers if PR very prolonged (over 300 ms)
  - Treat Lyme disease: if present (may improve conduction)
  - Correct electrolytes
  - Pacemaker rarely considered:
  - Only if severe symptoms attributed to AV dyssynchrony (PR over 300 ms)
  - Very rare indication
  - Prognosis: benign, rarely progresses to higher-degree block

clinical_pearls:
  - PR interval over 200 ms with 1:1 AV conduction
  - Usually asymptomatic and benign (incidental finding)
  - No treatment or pacemaker needed in vast majority
  - Monitor for progression to higher-degree block
  - Check medications (beta blockers, calcium channel blockers, digoxin)
  - Consider Lyme disease in endemic areas

differentials:
  - Normal PR interval: 120-200 ms
  - Second-degree AV block: some P waves not conducted (dropped beats)
  - Third-degree AV block: complete dissociation, no P waves conducted

trace: |
  A 45-year-old endurance athlete presented for routine physical. Asymptomatic, runs marathons. Exam: resting HR 52 bpm (athletic bradycardia), BP 115/70, no murmurs. ECG: sinus bradycardia rate 52 bpm, PR interval 240 ms (prolonged, over 200 ms), normal QRS duration, 1:1 AV conduction (every P wave followed by QRS). Diagnosed with first-degree AV block. Common in athletes from enhanced vagal tone (physiologic). Completely asymptomatic, no treatment needed. No medications. Reassured patient this is benign finding, no restrictions on activity, no pacemaker needed. Follow-up ECG annually to monitor for progression (rare). At 1 year: remains asymptomatic, PR interval 235 ms (stable), continues competitive running. Excellent prognosis.
