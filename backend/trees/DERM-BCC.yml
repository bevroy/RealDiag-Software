urgency: medium
description: Comprehensive evaluation and management of Basal Cell Carcinoma
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Pearly or translucent papule
- Telangiectasias
- Central ulceration
- Sun-exposed area
- Slow-growing
workup:
- Shave or punch biopsy for histologic confirmation
- No imaging needed unless extensive/invasive
treatment:
- 'Guideline-based treatment options for Basal Cell Carcinoma include:'
- Surgical excision with 4mm margins (standard treatment, ~95% cure) (AAD 2023)
- Mohs micrographic surgery for high-risk areas (face, ears, recurrent) - highest
  cure rate (AAD 2023)
- Electrodesiccation & curettage (ED&C) for small, low-risk, superficial BCCs (AAD
  2023)
- Topical imiquimod 5% or 5-FU for superficial BCCs only (AAD 2023)
- Radiation therapy for poor surgical candidates or unresectable tumors (AAD 2023)
clinical_pearls:
- Most common skin cancer (80% of non-melanoma skin cancers)
- Locally invasive but rarely metastasizes (<0.1%)
- 'Subtypes: Nodular (most common), superficial, morpheaform (sclerosing - worst prognosis)'
- Recurrence risk higher with morpheaform type and incomplete excision
- Sun exposure is main risk factor, also arsenic, radiation, immunosuppression
referrals:
- Dermatology or surgical oncology for excision
- Mohs surgeon for high-risk locations or recurrent disease
differentials: []
