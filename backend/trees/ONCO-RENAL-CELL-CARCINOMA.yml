tree_id: ONCO-RENAL-CELL-CARCINOMA
name: Renal Cell Carcinoma
family: Urology
specialty: Oncology/Urology
chief_complaint: Hematuria, flank pain, abdominal mass
description: Malignant tumor arising from renal tubular epithelium, most common type of kidney cancer in adults
icd10: C64.9
snomed: 41607009
presentations:
  - Hematuria (gross or microscopic)
  - Flank pain or fullness
  - Palpable abdominal mass
  - Weight loss, fatigue
  - Fever, night sweats
  - Hypertension
  - Often asymptomatic, incidentally found on imaging
urgency: urgent
referrals:
  emergency:
    - Massive hematuria with hemodynamic instability
    - Tumor thrombus with cardiac involvement
    - Pathologic fracture from metastases
  urgent:
    - Suspected renal mass
    - New hematuria with imaging abnormality
    - Symptomatic disease
  routine:
    - Surveillance imaging
    - Post-treatment monitoring

workup:
  - Classic triad (hematuria, flank pain, palpable mass) present in only 10-15%, usually indicates advanced disease
  - Most RCC discovered incidentally on imaging for unrelated conditions (60-70%)
  - Clinical presentation
  - Hematuria (40-60%) - gross or microscopic, intermittent
  - Flank pain (40%) - dull ache, persistent
  - Palpable abdominal mass (25-45%) - advanced disease
  - Constitutional symptoms - weight loss (30%), fever (20%), night sweats, fatigue
  - Varicocele (2-3%) - especially left-sided, does not empty when supine (due to IVC or renal vein involvement)
  - Paraneoplastic syndromes (10-40%)
  - Hypercalcemia (most common) - PTHrP production
  - Erythrocytosis (5%) - EPO production, paradoxical with renal tumors
  - Hypertension - renin production
  - Hepatic dysfunction (Stauffer syndrome) - elevated LFTs without metastases, resolves after nephrectomy
  - Physical examination - palpable flank or abdominal mass (late finding), varicocele, lower extremity edema (IVC involvement)
  - Laboratory studies
  - Urinalysis - hematuria (microscopic or gross)
  - Complete blood count - anemia (most common) or erythrocytosis (polycythemia)
  - Comprehensive metabolic panel - hypercalcemia, elevated alkaline phosphatase (bone metastases)
  - Liver function tests - elevated if hepatic metastases or Stauffer syndrome
  - Coagulation studies if planning surgery
  - Imaging
  - Renal mass protocol CT (multiphase contrast CT) or MRI - gold standard for diagnosis and staging
  - Characterizes mass (solid vs cystic), enhancement pattern, size
  - Solid renal mass with enhancement diagnostic for RCC (biopsy usually not needed before surgery)
  - Bosniak classification for cystic masses (I-IV, increasing malignancy risk)
  - Assesses local invasion, renal vein/IVC tumor thrombus, lymphadenopathy
  - CT chest - evaluate for pulmonary metastases (most common site)
  - Bone scan or CT if bone pain or elevated alkaline phosphatase (bone metastases)
  - Brain MRI if neurologic symptoms (brain metastases)
  - Renal mass biopsy - only if diagnosis uncertain, considering ablation, or planning systemic therapy without surgery
  - 90% accuracy, 5% non-diagnostic
  - Low risk of seeding or bleeding
  - Staging - TNM system
  - T1 (less than 7 cm confined to kidney), T2 (greater than 7 cm confined), T3 (extends beyond kidney or into renal vein/IVC), T4 (invades beyond Gerota fascia)
  - N1 (regional lymph nodes), M1 (distant metastases)
  - Stage I (T1N0M0), Stage II (T2N0M0), Stage III (T3 or N1), Stage IV (T4 or M1)
  - Histologic subtypes - determined on surgical pathology
  - Clear cell (70-80%) - most common, VHL gene mutation, most responsive to immunotherapy/targeted therapy
  - Papillary (10-15%) - type 1 (better prognosis) and type 2 (worse prognosis)
  - Chromophobe (5%) - best prognosis
  - Collecting duct and medullary (rare, aggressive)
treatment:
  - Localized disease (Stage I-III) - surgical resection primary treatment
  - Partial nephrectomy (nephron-sparing surgery) - preferred for T1 tumors (less than 7 cm) if technically feasible
  - Preserves renal function, equivalent cancer control to radical nephrectomy
  - Open, laparoscopic, or robotic approach
  - Radical nephrectomy - for T2 or larger, centrally located tumors, or when partial nephrectomy not feasible
  - En bloc removal of kidney, adrenal gland, Gerota fascia, regional lymph nodes
  - Laparoscopic approach preferred if no IVC thrombus
  - Thermal ablation (radiofrequency or cryoablation) - for small tumors (less than 3 cm) in poor surgical candidates
  - Higher local recurrence than surgery
  - Active surveillance - option for small renal masses (less than 2 cm) in elderly or comorbid patients
  - Slow growth rate (0.3 cm/year average), low metastatic potential
  - Adjuvant therapy - pembrolizumab (anti-PD-1) approved for high-risk localized disease post-nephrectomy (reduces recurrence by 32%)
  - High-risk defined as pT2 grade 4, pT3 any grade, pT4, or N+
  - Metastatic disease (Stage IV) - systemic therapy
  - First-line therapy depends on risk stratification (IMDC criteria)
  - Favorable risk - immune checkpoint inhibitor combinations
  - Pembrolizumab + axitinib (anti-VEGF TKI) or nivolumab + cabozantinib
  - Intermediate/poor risk - nivolumab (anti-PD-1) + ipilimumab (anti-CTLA-4)
  - Median OS 47 months vs 26 months with sunitinib alone
  - Alternative - nivolumab + cabozantinib, pembrolizumab + lenvatinib
  - Targeted therapy (VEGF inhibitors) - sunitinib, pazopanib, cabozantinib
  - Less effective than immunotherapy combinations but better tolerated
  - Second-line options - cabozantinib, nivolumab, axitinib + avelumab, lenvatinib + everolimus
  - Cytoreductive nephrectomy - removal of primary tumor in metastatic disease if good performance status, resectable primary
  - Benefit mainly in patients receiving immunotherapy
  - Metastasectomy - surgical resection of isolated metastases (lung, bone, brain) if limited disease, prolonged disease-free interval
  - Can achieve long-term survival in selected patients
  - Palliative radiation - for symptomatic bone or brain metastases
  - Surveillance after treatment
  - Stage I - CT abdomen/pelvis annually x 5 years
  - Stage II-III - CT chest/abdomen/pelvis every 3-6 months x 3 years, then annually to 5 years
  - Stage IV - imaging every 2-3 months on treatment
clinical_pearls:
  - Most common renal malignancy in adults (90% of kidney cancers), median age 64 years, male-to-female ratio 2:1
  - Risk factors - smoking (strongest, 2-fold increase), obesity, hypertension, chronic kidney disease, dialysis, VHL syndrome, tuberous sclerosis
  - Classic triad (hematuria, flank pain, mass) rare (10%), usually indicates advanced disease
  - Most cases discovered incidentally on CT/ultrasound (60-70%)
  - Solid enhancing renal mass on imaging diagnostic - biopsy not needed before surgery for localized disease
  - Clear cell histology most common (75%), associated with VHL gene mutation
  - RCC notoriously resistant to chemotherapy and radiation
  - Spontaneous regression rare but documented (less than 1%)
  - Metastases can occur years to decades after nephrectomy (late recurrence)
  - Most common metastatic sites - lung (75%), bone (20%), liver (18%), brain (8%)
  - Immunotherapy revolutionized treatment - combination regimens (nivolumab + ipilimumab, pembrolizumab + axitinib) now standard first-line
  - Partial nephrectomy preferred over radical for T1 tumors (preserves renal function with equivalent cancer control)
  - Paraneoplastic hypercalcemia from PTHrP production (not bone metastases)
  - Renal vein/IVC tumor thrombus common (4-10%), does not indicate metastatic disease, can still be resected
differentials:
  - Benign renal lesions - angiomyolipoma (fat-containing, benign), oncocytoma (central scar, benign)
  - Simple renal cyst (no enhancement, benign)
  - Complex cystic masses (Bosniak II-IV, increasing malignancy risk)
  - Renal abscess (fever, flank pain, rim enhancement)
  - Transitional cell carcinoma (urothelial cancer of renal pelvis/ureter)
  - Lymphoma (bilateral, diffuse infiltration, minimal enhancement)
  - Metastases to kidney (lung, breast, melanoma - rare)
trace:
  - 58-year-old man presents after 4 cm right renal mass discovered on CT abdomen performed for evaluation of abdominal pain (turned out to be cholecystitis)
  - Asymptomatic, no hematuria, no weight loss, no fevers
  - Past medical history - hypertension, hyperlipidemia, 30 pack-year smoking history (quit 5 years ago)
  - Medications - lisinopril, atorvastatin, aspirin
  - Physical examination - normal, no palpable masses, no varicocele, no edema
  - Laboratory studies - creatinine 1.0 (GFR 80 mL/min), hemoglobin 14.2 g/dL, calcium 9.4 mg/dL, urinalysis no hematuria, LFTs normal
  - Renal mass protocol CT - 4.2 cm solid enhancing mass in right mid-kidney, exophytic, no renal vein involvement, no lymphadenopathy, left kidney normal
  - CT chest - no pulmonary nodules or metastases
  - Clinical stage cT1bN0M0 (Stage I)
  - Referred to urology - recommended partial nephrectomy (nephron-sparing surgery) given tumor less than 7 cm and amenable to partial resection
  - Robotic-assisted laparoscopic partial nephrectomy performed
  - Intraoperative findings - 4.5 cm exophytic right renal mass, no lymphadenopathy
  - Tumor excised with negative margins, kidney reconstructed, warm ischemia time 18 minutes
  - Surgical pathology - 4.5 cm clear cell renal cell carcinoma, Fuhrman nuclear grade 2 (moderate), no lymphovascular invasion, margins negative, pT1b
  - Post-operative course uncomplicated, creatinine stable at 1.1
  - Pathology reviewed at multidisciplinary tumor board - favorable features (low grade, no adverse features), no adjuvant therapy recommended
  - Surveillance plan - CT chest/abdomen/pelvis at 6 months, then annually x 5 years
  - At 6 months - CT shows post-surgical changes, no recurrence, creatinine 1.0
  - At 1 year - CT clear, no evidence of disease
  - Continues annual surveillance imaging

