tree_id: ID-HERPES-LABIALIS
name: Herpes Labialis (Cold Sores)
family: Infectious Disease
specialty: Primary Care
chief_complaint: Painful blisters on lip
description: Herpes simplex virus type 1 reactivation causing painful vesicles on lips and perioral area. Antiviral therapy shortens duration if started early during prodrome, recurrent episodes common triggered by stress, sun, illness.
icd10: B00.1
urgency: routine

workup:
  - Clinical diagnosis: grouped vesicles on erythematous base on lips or perioral skin, preceded by tingling or burning (prodrome)
  - Progression: prodrome (tingling, itching) 6-24 hours before lesions, vesicles appear and rupture forming crusted painful erosions, heal in 7-10 days
  - Primary infection (gingivostomatitis): severe painful oral ulcers, fever, malaise, cervical lymphadenopathy (usually children, first HSV-1 exposure)
  - Recurrent herpes labialis: less severe, localized to lips, triggered by stress, sun exposure, illness, menses, immunosuppression
  - Virus remains latent in trigeminal ganglion, reactivates periodically
  - Contagious: direct contact with lesions spreads virus, avoid kissing and sharing utensils during outbreak
  - Viral culture or PCR: if diagnosis uncertain (swab vesicle fluid), but rarely needed
  - Tzanck smear: shows multinucleated giant cells (not specific for HSV vs VZV)

treatment:
  - Topical antiviral (mild cases): docosanol 10% cream (Abreva over-the-counter) applied at first sign of prodrome Q2H while awake x4-5 days
  - Modest benefit (shortens duration by 0.5-1 day)
  - Oral antiviral (most effective): if started during prodrome or within 48 hours of lesion onset
  - Valacyclovir 2000 mg BID x1 day (two 2-gram doses 12 hours apart - single-day therapy)
  - OR famciclovir 1500 mg single dose
  - OR acyclovir 400 mg 5 times daily x5 days (less convenient dosing)
  - Shortens duration by 1-2 days, reduces pain and viral shedding
  - Must start early (during prodrome) for maximum benefit
  - Suppressive therapy: for frequent recurrences (6 or more episodes per year)
  - Valacyclovir 500 mg daily or acyclovir 400 mg BID continuously
  - Reduces frequency of outbreaks by 70-80%
  - Primary gingivostomatitis: oral acyclovir 400 mg 5 times daily x7-10 days plus supportive care (hydration, pain control)
  - Sunscreen: apply to lips (SPF 30 or higher) to prevent sun-triggered reactivation
  - Avoid triggers: stress management, adequate sleep, sun protection
  - Pain relief: topical lidocaine 2% gel or benzocaine, oral analgesics (acetaminophen, ibuprofen)

clinical_pearls:
  - Grouped vesicles on lips preceded by tingling prodrome (6-24 hours before)
  - Start oral antiviral during prodrome for best effect - shortens duration 1-2 days
  - Valacyclovir 2000 mg BID x1 day convenient single-day therapy
  - Recurrent episodes triggered by stress, sun, illness
  - Suppressive therapy for 6 or more episodes per year reduces frequency 70-80%
  - Apply sunscreen to lips to prevent sun-triggered reactivation
  - Contagious - avoid direct contact during outbreak
  - Heals in 7-10 days even without treatment

differentials:
  - Impetigo: honey-crusted lesions, bacterial infection (Staphylococcus or Streptococcus), responds to antibiotics
  - Angular cheilitis: fissures and erythema at corners of mouth, Candida plus bacteria, no vesicles
  - Aphthous ulcers (canker sores): painful ulcers inside mouth (not on lips), no vesicle stage, recurrent, not contagious
  - Herpes zoster (shingles): vesicles in dermatomal distribution, unilateral, older adults, more painful

trace: |
  A 32-year-old woman presented with 12 hours of tingling and burning sensation on upper lip. No visible lesions yet but recognizes familiar prodrome (has history of cold sores 2-3 times per year triggered by stress and sun). Currently under significant work stress. Exam showed erythema on upper lip vermillion border but no vesicles yet. Diagnosed with herpes labialis in prodromal stage (ideal time to start treatment). Prescribed valacyclovir 2000 mg BID x1 day (two doses 12 hours apart - started immediately). Counseled on sun protection (apply SPF 30 lip balm daily) to prevent future sun-triggered episodes. At 24 hours developed few small vesicles that crusted quickly. At 5 days lesions nearly healed, minimal discomfort. At 10 days completely healed. Significantly shorter and milder course compared to previous untreated episodes that lasted 10-14 days. Discussed suppressive therapy option if frequency increases to 6 or more episodes per year. Patient declines suppressive therapy given current frequency of 2-3 per year, will keep valacyclovir on hand to start at first sign of prodrome for future episodes. Provided prescription for valacyclovir to have available for early treatment of next episode.
