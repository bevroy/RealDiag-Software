urgency: medium
description: Comprehensive evaluation and management of Hypertrophic Pyloric Stenosis
version: '1.0'
citations:
  - AAP (American Academy of Pediatrics) Clinical Practice Guidelines
  - NICE (National Institute for Health and Care Excellence) Pediatric Guidelines
  - UpToDate - Pediatrics
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Progressive non-bilious projectile vomiting after every feeding
- Onset 3-12 weeks of age (peak 3-5 weeks)
- Hungry after vomiting ("hungry vomiter")
- Palpable "olive-shaped" mass in epigastrium or RUQ (70%, felt after vomiting)
- Visible gastric peristaltic waves (left to right across abdomen)
- Weight loss, dehydration, failure to thrive
- First-born males (4:1 male predominance)
- Hypochloremic hypokalemic metabolic alkalosis (from losing HCl in vomit)
workup: []
treatment:
- 'Guideline-based treatment options for Hypertrophic Pyloric Stenosis include:'
- 'Immediate: NPO, NG tube for decompression, IV fluids (D5 1/2NS with 20 mEq/L KCl)
  (AAP 2023)'
- 'Correct dehydration and electrolytes: Goal Cl >100, K >3.5, normalized bicarb before
  surgery (AAP 2023)'
- 'Ultrasound: Pyloric thickness >3mm and length >15mm diagnostic (AAP 2023)'
- 'Surgery consult: Pyloromyotomy (laparoscopic preferred) once electrolytes corrected
  (AAP 2023)'
- 'Post-op: Resume feeds 4-6 hours after surgery, advance slowly, expect some vomiting
  initially (AAP 2023)'
clinical_pearls:
- 'Ultrasound diagnostic: Pyloric muscle thickness >3 mm, pyloric channel length >15
  mm'
- Palpable olive = pathognomonic (but only felt 60-80%, requires patient relaxed after
  vomiting)
- 'Electrolyte abnormalities: Hypochloremic (Cl <90), hypokalemic (K <3.5), metabolic
  alkalosis (HCO3 >30)'
- 'Fix electrolytes BEFORE surgery: Chloride must be >100, K >3.5, alkalosis corrected'
- 'Pyloromyotomy (Ramstedt procedure) = curative: Split pyloric muscle, keep mucosa
  intact'
- 'Not an emergency: Take time to fully resuscitate and correct electrolytes first'
referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy
differentials:
  - GERD
  - Gastroenteritis
  - Overfeeding
  - Milk protein allergy
  - Malrotation
