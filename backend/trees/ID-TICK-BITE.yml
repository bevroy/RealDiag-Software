tree_id: ID-TICK-BITE
name: Tick Bite Evaluation
family: infectious_disease
specialty: Emergency Medicine
icd10: S30.860A
snomed: 238634007
urgency: []
homeopathy: []
presentations:
  - Tick found attached to skin
  - Known tick exposure in past 24-48 hours
  - Erythema or local reaction at bite site
  - Concern for tick-borne disease transmission
  - Travel or outdoor activity in endemic area
  - Tick partially removed with retained mouthparts
  - Multiple tick bites
  - Immunocompromised patient with tick bite
workup:
  - Visual inspection - identify if tick still attached
  - Remove tick if still attached (fine-tipped tweezers, pull straight out)
  - Save tick for identification if possible (plastic bag or alcohol)
  - Estimate duration of attachment (engorgement suggests >36 hours)
  - Document bite location and appearance
  - Assess for signs of infection at bite site
  - Monitor for development of erythema migrans rash (Lyme disease)
  - Serologic testing NOT indicated at time of bite (antibodies take weeks to develop)
  - Consider testing if symptoms develop: Lyme serology, Ehrlichia/Anaplasma PCR, Babesia testing
  - Watch for signs of tick-borne illness over next 30 days
treatment:
  - Proper tick removal with fine-tipped tweezers
  - Grasp tick close to skin surface and pull upward with steady pressure
  - Avoid twisting or squeezing tick body
  - Clean bite area with soap and water or alcohol
  - Do NOT use petroleum jelly, nail polish, heat, or other folk remedies
  - Antibiotic prophylaxis for Lyme disease (specific criteria must be met)
  - Doxycycline 200 mg PO single dose (adults) or 4 mg/kg up to 200 mg (children ≥8 years)
  - Criteria: Ixodes scapularis tick, attached ≥36 hours, <72 hours since removal, endemic area, no contraindications
  - Local wound care - keep clean and dry
  - Monitor for signs of infection (cellulitis)
  - Educate about signs/symptoms of tick-borne diseases
  - Return precautions if fever, rash, flu-like illness develop within 30 days
treatment:
  - Prevention counseling for future tick exposure
  - Protective clothing (long sleeves, long pants, tucked in)
  - Insect repellent (DEET 20-30%, picaridin, permethrin on clothing)
  - Daily tick checks after outdoor activity in endemic areas
  - Prompt tick removal reduces transmission risk
clinical_pearls:
  - "Lyme disease transmission requires ≥36-48 hours of attachment for most cases"
  - "Prophylactic doxycycline reduces Lyme disease risk by 87% if given within 72 hours"
  - "Not all tick bites require prophylaxis - must meet all criteria (I. scapularis, endemic area, >36 hours attached)"
  - "Erythema migrans rash appears 3-30 days after bite in 70-80% of Lyme disease cases"
  - "Other tick-borne diseases: Ehrlichiosis, Anaplasmosis, Babesiosis, Rocky Mountain Spotted Fever, Tularemia"
  - "Ixodes scapularis (deer tick) transmits Lyme, Babesia, Anaplasma; Amblyomma americanum (lone star) transmits Ehrlichia"
  - "Tick must feed for several hours before becoming engorged and transmitting pathogens"
  - "If mouthparts remain embedded, leave alone - will work out over time; removal risks more damage"
  - "Alpha-gal syndrome (red meat allergy) associated with lone star tick bites"
  - "Tick testing generally not helpful - does not predict transmission, results delayed"
referrals:
  - Infectious Disease if tick-borne illness develops or high-risk patient
  - Dermatology if persistent skin reaction or uncertain rash
  - Return to clinic if fever, rash, arthralgias, or flu-like symptoms develop
differentials:
  - Lyme disease (erythema migrans, flu-like illness 3-30 days post-bite)
  - Ehrlichiosis/Anaplasmosis (fever, headache, thrombocytopenia, leukopenia 5-14 days post-bite)
  - Rocky Mountain Spotted Fever (fever, headache, petechial rash 2-14 days post-bite)
  - Babesiosis (fever, hemolytic anemia, flu-like illness in endemic areas)
  - Southern tick-associated rash illness (STARI) - erythema migrans-like rash, not Borrelia
  - Local hypersensitivity reaction (immediate or delayed at bite site)
