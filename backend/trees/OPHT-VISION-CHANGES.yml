tree_id: OPHT-VISION-CHANGES
name: Vision Changes / Visual Disturbances
family: ophthalmology
specialty: Ophthalmology
icd10_code: H53.9

presentations:
  - Blurred vision
  - Sudden vision loss (partial or complete)
  - Gradual vision decline
  - Double vision (diplopia)
  - Flashes of light (photopsia)
  - Floaters (new onset or sudden increase)
  - Visual field defects (peripheral or central)
  - Halos around lights
  - Distorted vision (metamorphopsia)
  - Difficulty with night vision
  - Loss of color perception
  - Eye pain with vision changes

workup:
  - History:
    - Onset (sudden vs gradual)
    - Unilateral vs bilateral
    - Constant vs intermittent
    - Associated symptoms (pain, headache, neurologic symptoms)
    - Trauma history
    - Medical history (diabetes, hypertension, autoimmune disease, cancer)
    - Medications (especially eye drops, hydroxychloroquine, ethambutol)
    - Family history of eye disease
  - Physical exam:
    - Visual acuity (with and without correction)
    - Pupillary examination (size, reactivity, relative afferent pupillary defect)
    - Extraocular movements
    - Confrontational visual field testing
    - Fundoscopic examination (if dilated)
    - Intraocular pressure (tonometry)
    - Slit lamp examination if available
  - Red flag symptoms requiring urgent evaluation:
    - Sudden painless vision loss
    - Curtain or shadow in vision (retinal detachment)
    - Flashes and floaters (retinal tear/detachment)
    - Eye pain with vision loss (acute angle closure glaucoma, optic neuritis)
    - Diplopia with neurologic symptoms (stroke, MS)
    - Temporal headache with vision loss age >50 (giant cell arteritis)
    - Trauma with vision changes

treatment:
  initial_management:
    - Urgent ophthalmology referral if red flags present
    - Do not delay treatment for giant cell arteritis if suspected
    - Check blood glucose if diabetic
    - Blood pressure measurement
    - Protect eye if trauma suspected
  specific_conditions:
    - Refractive error Refraction and corrective lenses
    - Cataract Cataract surgery referral
    - Glaucoma IOP-lowering medications, laser, or surgery
    - Diabetic retinopathy Glycemic control, anti-VEGF injections, laser
    - Age-related macular degeneration AREDS vitamins (dry), anti-VEGF (wet)
    - Retinal detachment Emergency surgery (pneumatic retinopexy, scleral buckle, vitrectomy)
    - Optic neuritis IV methylprednisolone, MRI brain to evaluate for MS
    - Giant cell arteritis High-dose prednisone 1mg/kg immediately, temporal artery biopsy
    - Central retinal artery occlusion Ocular massage, lower IOP, hyperbaric oxygen, TPA (limited evidence)
    - Posterior vitreous detachment Observation, watch for retinal tear/detachment
    - Migraine with aura Reassurance, triptan or preventive if frequent
    - Transient vision loss (amaurosis fugax) Stroke workup - carotid ultrasound, echocardiogram, neurology referral

clinical_pearls:
  - Sudden painless vision loss differential includes retinal artery occlusion, retinal vein occlusion, retinal detachment, vitreous hemorrhage, posterior vitreous detachment
  - New onset flashes and floaters require dilated retinal examination within 24 hours (10-15% have retinal tear)
  - Central retinal artery occlusion is ocular stroke with poor prognosis (only 20% recover useful vision)
  - Giant cell arteritis is ophthalmologic emergency - start high-dose steroids before biopsy if suspected
  - Relative afferent pupillary defect (Marcus Gunn pupil) indicates optic nerve or severe retinal disease
  - Gradual vision loss is usually benign (cataract, refractive error, AMD) but still requires evaluation
  - Binocular diplopia (resolves when one eye closed) suggests ocular misalignment or cranial nerve palsy
  - Monocular diplopia (persists with one eye closed) suggests refractive error, cataract, or corneal problem
  - Transient monocular vision loss (amaurosis fugax) is TIA until proven otherwise
  - Migraine aura typically lasts 15-30 minutes with gradual onset/offset, often bilateral and positive phenomena (lights, zigzags)
  - Hydroxychloroquine can cause irreversible retinal toxicity - requires baseline and annual screening after 5 years
  - Patients on ethambutol require baseline and monthly optic nerve evaluation
  - Visual field defects respecting vertical midline suggest neurologic cause (stroke, tumor)
  - Patients with diabetes should have dilated eye exam annually even without symptoms

trace:
  - Differential diagnosis of sudden vision loss
  - Workup and management of retinal detachment
  - Giant cell arteritis diagnosis and treatment
  - Diabetic retinopathy screening guidelines

citations:
  - Biousse V, Newman NJ. (2015). Diagnosis and management of optic neuritis. Continuum, 21(4), 1035-49.
  - Hayreh SS, Zimmerman MB. (2008). Central retinal artery occlusion: visual outcome. Am J Ophthalmol, 140(3), 376-91.
  - The American Academy of Ophthalmology. (2019). Sudden Vision Loss. Preferred Practice Pattern Guidelines.
