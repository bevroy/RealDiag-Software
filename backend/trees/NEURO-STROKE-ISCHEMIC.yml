tree_id: NEURO-STROKE-ISCHEMIC
name: Acute Ischemic Stroke
family: Neurology
specialty: Neurology
chief_complaint: Sudden weakness and speech difficulty
description: Acute focal brain ischemia from arterial occlusion causing sudden neurologic deficit, time-sensitive emergency requiring rapid evaluation and treatment

icd10: I63.9

urgency: emergent

workup:
  - Time is brain: rapid evaluation critical (treatment window narrow for thrombolysis and thrombectomy)
  - Clinical presentation: sudden onset focal neurologic deficit (weakness, numbness, speech difficulty, vision loss, ataxia, vertigo), symptoms maximal at onset (unlike TIA which resolves)
  - Cincinnati Prehospital Stroke Scale: facial droop, arm drift, speech abnormality (slurred or aphasia) - any one positive 72 percent sensitive for stroke
  - Common stroke syndromes: MCA stroke (contralateral hemiparesis and hemisensory loss, aphasia if dominant hemisphere, neglect if non-dominant), ACA stroke (contralateral leg weakness), PCA stroke (contralateral hemianopia), basilar artery (coma, quadriplegia, locked-in syndrome), lacunar stroke (pure motor, pure sensory, ataxic hemiparesis)
  - Last known normal time: critical for determining treatment eligibility (use time last seen normal, not time discovered)
  - Non-contrast CT head: emergent (rule out hemorrhage before thrombolysis), acute ischemic stroke often normal on CT initially (hyperdense vessel sign or loss of grey-white differentiation may be seen), primary purpose is to exclude hemorrhage
  - CT angiography (CTA) head and neck: identify large vessel occlusion (LVO) for thrombectomy consideration, assess for carotid stenosis
  - MRI brain with diffusion-weighted imaging (DWI): more sensitive than CT for acute infarct (shows restricted diffusion), not required before thrombolysis but helpful if diagnosis unclear
  - Labs before thrombolysis: glucose (hypoglycemia can mimic stroke), platelet count, PT/INR, consider troponin and ECG (MI can cause stroke)
  - Stroke mechanism workup: ECG (atrial fibrillation), echocardiogram (valvular disease, PFO, thrombus, wall motion abnormality), carotid ultrasound (stenosis), lipid panel, hemoglobin A1c
  - NIHSS (National Institutes of Health Stroke Scale): quantifies stroke severity (0-42, higher worse), tracks improvement or worsening

treatment:
  - Acute management: ABCs, blood pressure management (permissive hypertension initially - do NOT lower BP unless greater than 220/120 mmHg or planning thrombolysis, brain autoregulation impaired), oxygen if hypoxic, NPO (aspiration risk), aspirin 325 mg if NOT giving thrombolysis (hold 24 hours if thrombolysis given)
  - IV thrombolysis (alteplase tPA): if within 4.5 hours of symptom onset, 0.9 mg/kg (max 90 mg) - 10 percent bolus over 1 minute then 90 percent infusion over 60 minutes
  - Thrombolysis inclusion criteria: ischemic stroke with measurable deficit, onset within 4.5 hours (or wake-up stroke with MRI showing DWI-FLAIR mismatch)
  - Thrombolysis exclusion criteria: hemorrhage on CT, history intracranial hemorrhage, recent surgery/trauma (within 14 days), BP greater than 185/110 mmHg despite treatment, platelets less than 100K, INR greater than 1.7, glucose less than 50 mg/dL, rapidly improving symptoms, seizure at onset, large infarct (greater than one-third MCA territory)
  - Blood pressure during thrombolysis: maintain less than 185/110 mmHg during infusion and less than 180/105 mmHg for 24 hours after (use labetalol or nicardipine IV)
  - Mechanical thrombectomy: if large vessel occlusion (LVO) on CTA within 6 hours (up to 24 hours if perfusion mismatch on imaging), retrieve clot via endovascular catheter, very effective for LVO (60-70 percent achieve good outcome)
  - Antiplatelet therapy: aspirin 325 mg daily started 24 hours after thrombolysis (or immediately if no thrombolysis), or dual antiplatelet (aspirin 325 mg plus clopidogrel 75 mg) for 21 days then single agent if minor stroke or TIA
  - Anticoagulation: if atrial fibrillation start within 4-14 days depending on stroke size (DOAC preferred over warfarin - apixaban, rivaroxaban)
  - Secondary prevention: statin high-intensity (atorvastatin 80 mg daily), blood pressure control (goal less than 130/80 mmHg), smoking cessation, diabetes control
  - Carotid stenosis: if symptomatic severe stenosis (70-99 percent) carotid endarterectomy within 2 weeks (very effective for secondary prevention)
  - Stroke unit care: specialized stroke unit improves outcomes (organized care, early mobilization, swallow screening, DVT prophylaxis)

clinical_pearls:
  - Time is brain: last known normal time determines treatment window
  - Non-contrast CT emergently to rule out hemorrhage before thrombolysis
  - IV tPA within 4.5 hours of onset (0.9 mg/kg, max 90 mg)
  - Mechanical thrombectomy for large vessel occlusion within 6-24 hours
  - Permissive hypertension initially (do not lower BP unless greater than 220/120)
  - During tPA keep BP less than 185/110 mmHg
  - Aspirin 325 mg at 24 hours post-tPA (or immediately if no tPA)
  - Atrial fibrillation anticoagulate (DOAC preferred)

differentials:
  - Hemorrhagic stroke (similar presentation but CT shows blood)
  - Hypoglycemia (can mimic stroke, check glucose immediately)
  - Todd paralysis (post-seizure weakness, resolves over hours)
  - Hemiplegic migraine (aura with weakness, younger, history migraines)
  - Conversion disorder (non-anatomic pattern, inconsistent exam)

trace:
  - 68-year-old woman brought to ED by EMS after sudden onset right-sided weakness and inability to speak, last seen normal 90 minutes ago
  - History from husband: watching TV together, suddenly could not speak and right arm dropped, called 911 immediately, no prior stroke, hypertension, hyperlipidemia, non-smoker
  - Exam: alert but aphasic (non-fluent, comprehension impaired), right facial droop, right arm 0/5 strength (flaccid), right leg 2/5 strength, right hemineglect, NIHSS 16 (moderate-severe stroke)
  - Time: last known normal 90 minutes ago (well within 4.5-hour window for tPA)
  - Rapid labs: glucose 142 mg/dL (normal), platelets 245K (normal), INR 1.0 (normal), creatinine 0.9 mg/dL
  - Non-contrast CT head: no hemorrhage, no hypodensity, early loss of grey-white differentiation left insular ribbon (subtle early MCA stroke sign)
  - CT angiography: left M1 MCA occlusion (large vessel occlusion, thrombectomy candidate)
  - Blood pressure: 192/98 mmHg (elevated but less than 185/110, acceptable for tPA after lowering)
  - IV labetalol 10 mg given, repeat BP 176/94 mmHg (less than 185/110, now eligible for tPA)
  - Thrombolysis decision: within 4.5-hour window, disabling deficit, no exclusion criteria, LVO present (also thrombectomy candidate)
  - IV alteplase given: 0.9 mg/kg (patient 70 kg = 63 mg total) - 6.3 mg bolus over 1 minute then 56.7 mg over 60 minutes
  - Blood pressure closely monitored: maintained less than 185/110 mmHg with labetalol PRN
  - Simultaneously: interventional neuroradiology called for mechanical thrombectomy (LVO on CTA)
  - During tPA infusion: patient began to move right arm slightly (early improvement)
  - Thrombectomy performed: successful recanalization of left MCA (TICI 3 complete reperfusion)
  - Post-procedure: right arm strength improved to 4/5, right leg 4/5, still aphasic but able to say few words, NIHSS 8 (significant improvement from 16)
  - Admitted to stroke unit ICU for monitoring (blood pressure control, neurologic checks every hour x 24 hours)
  - 24 hours post-tPA: no hemorrhagic transformation on repeat CT, started aspirin 325 mg daily and atorvastatin 80 mg daily
  - Day 2: speech improving (able to speak short phrases), right strength 4+/5, ambulating with assistance, NIHSS 5
  - Stroke workup: ECG shows atrial fibrillation (cardioembolic stroke), echocardiogram normal LV function, no thrombus, carotid ultrasound no significant stenosis
  - Started apixaban 5 mg BID for atrial fibrillation (anticoagulation for secondary stroke prevention)
  - Day 5: speech near baseline (mild word-finding difficulty), right strength 5-/5, ambulating independently, NIHSS 2
  - Discharge day 7: home with outpatient speech therapy and physical therapy
  - Discharge medications: apixaban 5 mg BID, atorvastatin 80 mg daily, lisinopril 10 mg daily (blood pressure control), metoprolol 25 mg BID (rate control for atrial fibrillation)
  - 3 months: excellent recovery, minimal residual aphasia (mild word-finding), full strength, independent in all ADLs, mRS 1 (excellent outcome)
