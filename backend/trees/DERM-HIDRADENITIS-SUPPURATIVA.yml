tree_id: DERM-HIDRADENITIS-SUPPURATIVA
name: Hidradenitis Suppurativa
family: Dermatology
specialty: Dermatology
chief_complaint: Painful recurrent boils in armpits and groin
description: Chronic inflammatory condition of hair follicles and apocrine glands causing painful nodules, abscesses, and sinus tracts in intertriginous areas (axillae, groin, buttocks). Early treatment with antibiotics and TNF inhibitors prevents progression and scarring.
icd10: L73.2
snomed: 201101007
presentations:
  - Painful, deep-seated nodules and abscesses
  - Intertriginous areas (axillae, groin, buttocks)
  - Draining sinus tracts, scarring
  - Malodorous discharge
  - Recurrent, chronic course
  - Associated with obesity, smoking
urgency: routine

referrals:
  emergency:
    - Suspected necrotizing fasciitis
    - Stevens-Johnson syndrome/TEN
    - Anaphylaxis
  urgent:
    - Suspected melanoma
    - Rapidly growing lesion
    - Severe drug reaction
    - Suspected malignancy
  routine:
    - Chronic dermatitis management
    - Acne unresponsive to treatment
    - Cosmetic concerns
    - Mole surveillance

workup:
  - Clinical diagnosis: recurrent painful nodules and abscesses in intertriginous areas (axillae, groin, buttocks, inframammary)
  - Diagnostic criteria: typical lesions (painful nodules, abscesses, sinus tracts, scarring) in typical locations (axillae, groin) with recurrence (two episodes in 6 months)
  - Primary lesion: painful deep-seated nodule (inflamed hair follicle)
  - Progression: nodules enlarge and rupture draining purulent or serosanguineous fluid, form sinus tracts connecting abscesses, extensive scarring and contractures
  - Hurley staging: Stage I (single or multiple abscesses, no sinus tracts or scarring), Stage II (recurrent abscesses with sinus tracts, widely separated), Stage III (diffuse involvement, multiple interconnected sinus tracts, extensive scarring)
  - Double-ended comedones (blackheads): pathognomonic finding (two openings connected by sinus tract)
  - Chronic foul-smelling drainage: sinus tracts drain continuously
  - Risk factors: smoking (90% of patients smoke), obesity, family history (40% familial), post-pubertal onset
  - Not infectious: sterile inflammation (not caused by bacteria despite appearance)
  - No lab testing needed: clinical diagnosis
  - Bacterial culture: if superinfection suspected, but primary condition is sterile inflammation
  - Rule out pilonidal disease (sacrococcygeal area), furuncles (isolated boils)

treatment:
  - Lifestyle modifications: smoking cessation (most important), weight loss, loose-fitting clothing, antiseptic washes (chlorhexidine, benzoyl peroxide)
  - Avoid shaving affected areas (worsens inflammation)
  - Warm compresses: help abscesses drain
  - Stage I (mild): topical and oral antibiotics
  - Topical clindamycin 1% gel or solution BID long-term (anti-inflammatory effect)
  - Oral antibiotics: doxycycline 100 mg BID or minocycline 100 mg BID x3 months (anti-inflammatory doses, not for infection)
  - Combination therapy: clindamycin 300 mg plus rifampin 300 mg BID x10 weeks
  - Stage II (moderate): oral antibiotics plus biologics
  - Adalimumab (Humira) 40 mg subcutaneous weekly: TNF inhibitor, FDA-approved for HS, reduces flares by 50-60%
  - First biologic dose: loading dose 160 mg week 0, 80 mg week 2, then 40 mg weekly maintenance
  - Other biologics: infliximab, secukinumab if adalimumab fails
  - Intralesional steroids: triamcinolone 10 mg/mL into active nodules for acute flares
  - Incision and drainage: for acute abscesses (provides temporary relief but does not prevent recurrence)
  - Stage III (severe): wide surgical excision
  - Remove all affected tissue including sinus tracts, healing by secondary intention or skin grafting
  - Only definitive treatment but extensive surgery with prolonged recovery
  - Pain management: NSAIDs, acetaminophen, opioids for severe flares
  - Hormonal therapy: oral contraceptives, spironolactone may help women (anti-androgen effect)

clinical_pearls:
  - Recurrent painful nodules and abscesses in axillae, groin, buttocks
  - Double-ended comedones pathognomonic
  - Not infectious - sterile inflammation of hair follicles
  - Smoking cessation most important lifestyle modification
  - Topical clindamycin and oral doxycycline for Stage I
  - Adalimumab (TNF inhibitor) for Stage II-III reduces flares by 50-60%
  - Wide surgical excision only definitive treatment for Stage III
  - Chronic disease with significant impact on quality of life
  - Early aggressive treatment prevents progression and scarring

differentials:
  - Furunculosis: isolated boils without sinus tracts or scarring, responds to simple incision and drainage
  - Pilonidal disease: sinus tracts in sacrococcygeal area only, associated with hair in sinus tract
  - Crohn disease: may have perianal fistulas and abscesses, but also has GI symptoms, colonoscopy diagnostic
  - Lymphogranuloma venereum: inguinal lymphadenopathy, genital ulcer, positive chlamydia serology

trace: |
  A 28-year-old woman who smokes 1 pack per day presented with 3 years of recurrent painful lumps in armpits and groin. Initially occasional single boils treated with incision and drainage, now multiple lesions bilaterally in axillae with continuous foul-smelling drainage. Affecting quality of life (cannot wear sleeveless shirts, self-conscious about odor). Exam showed multiple painful erythematous nodules in bilateral axillae, several draining sinus tracts with purulent discharge, rope-like scarring, double-ended comedones (pathognomonic). Few nodules in inguinal folds. Diagnosed with hidradenitis suppurativa Stage II (Hurley). Counseled extensively on smoking cessation (most important factor - 90% of HS patients smoke). Referred to smoking cessation program. Started adalimumab (Humira) 160 mg loading dose week 0, 80 mg week 2, then 40 mg weekly maintenance (TNF inhibitor FDA-approved for HS). Topical clindamycin 1% solution to axillae BID. Chlorhexidine wash daily. Loose cotton clothing. Intralesional triamcinolone 10 mg/mL to largest nodules for immediate relief. At 4 weeks quit smoking (using nicotine replacement therapy), new nodule formation decreased 40%. At 12 weeks on adalimumab, significant improvement - drainage reduced by 60%, pain decreased, fewer flares. At 6 months 70% improved, few active lesions, scarring stable. Quality of life improved dramatically. Continues adalimumab weekly indefinitely, remains smoke-free. At 12 months sustained remission on maintenance therapy.
