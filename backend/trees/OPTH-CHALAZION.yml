tree_id: OPTH-CHALAZION
name: Chalazion
family: Ophthalmology
specialty: Ophthalmology
chief_complaint: Painless eyelid bump
description: Blocked meibomian gland causing painless chronic eyelid nodule. Warm compresses and massage resolve most cases within 4-6 weeks, intralesional steroid injection or surgical excision for persistent lesions.
icd10: H00.19
snomed: 1482004
urgency: non-urgent

workup:
  - Clinical diagnosis: painless firm nodule within eyelid (tarsal plate), develops over days to weeks
  - Location: upper or lower eyelid, within tarsal plate (not at lid margin like hordeolum)
  - Size: few millimeters to 1 cm, chronic and slowly enlarging
  - Non-tender: distinguishes from hordeolum (stye) which is acutely painful
  - No erythema: skin overlying chalazion usually normal (vs red and inflamed in hordeolum)
  - Eversion of eyelid: shows red or gray nodule on conjunctival surface
  - Associated with: blepharitis (chronic eyelid inflammation), meibomian gland dysfunction, rosacea
  - Pathophysiology: blocked meibomian gland with retained lipid secretions causing granulomatous inflammation
  - Rule out malignancy: recurrent chalazion in same location consider sebaceous cell carcinoma (rare, biopsy needed)
  - No imaging needed: clinical diagnosis

treatment:
  - Conservative management (first-line): resolves 50-75% within 4-6 weeks
  - Warm compresses: apply warm washcloth to closed eyelid 5-10 minutes QID (liquefies blocked secretions)
  - Eyelid massage: after warm compress, gently massage eyelid toward lash margin to express contents
  - Eyelid hygiene: lid scrubs with diluted baby shampoo to treat underlying blepharitis
  - No antibiotics: chalazion is sterile inflammation (not infection), antibiotics not helpful
  - Intralesional corticosteroid injection: if persistent after 4-6 weeks conservative treatment
  - Triamcinolone 10-40 mg/mL injected into center of chalazion through conjunctival surface
  - Success rate 60-80%, may require second injection, resolves over 2-4 weeks
  - Risk: skin depigmentation (temporary), rarely causes central retinal artery occlusion
  - Incision and curettage (I&C): definitive treatment for large or persistent chalazion
  - Performed under local anesthesia, incision through conjunctiva, curettage of granulomatous tissue
  - Success rate 90-95%, immediate improvement, healing 1-2 weeks
  - Send tissue to pathology if recurrent (rule out sebaceous cell carcinoma)
  - Prevention: treat underlying blepharitis with daily eyelid hygiene (warm compresses and lid scrubs)

clinical_pearls:
  - Painless chronic eyelid nodule within tarsal plate
  - Distinguish from hordeolum: chalazion painless and chronic, hordeolum acutely painful
  - Warm compresses plus massage resolve 50-75% within 4-6 weeks
  - No antibiotics needed - sterile granulomatous inflammation not infection
  - Intralesional steroid injection 60-80% effective if conservative fails
  - Incision and curettage definitive treatment 90-95% successful
  - Recurrent in same location consider malignancy (sebaceous cell carcinoma)
  - Associated with blepharitis and meibomian gland dysfunction

differentials:
  - Hordeolum (stye): acute painful red swollen eyelid nodule at lid margin (external) or within lid (internal), tender to touch
  - Sebaceous cell carcinoma: recurrent chalazion-like lesion in same location, loss of eyelashes, does not respond to treatment, biopsy diagnostic
  - Preseptal cellulitis: diffuse eyelid swelling and erythema, tender, fever, no discrete nodule
  - Dermoid cyst: congenital firm nodule near lateral brow, present since childhood

trace: |
  A 42-year-old woman presented with 6 weeks of painless bump on upper right eyelid. Initially small, slowly enlarging over past month. No pain, no vision changes. Exam showed 8 mm firm non-tender nodule within upper eyelid tarsal plate, no overlying erythema, eversion revealed grayish nodule on conjunctival surface. Diagnosed with chalazion (blocked meibomian gland). Started conservative management: warm compresses to closed eyelid 5-10 minutes four times daily immediately followed by gentle massage from mid-eyelid toward lash margin to express contents. Eyelid hygiene with diluted baby shampoo daily to treat underlying blepharitis. Counseled that antibiotics not needed (sterile inflammation not infection). At 3 weeks chalazion decreased in size by 30%, continues warm compresses. At 6 weeks still present but smaller (50% reduction). Patient desired faster resolution. Performed intralesional triamcinolone injection 40 mg/mL through conjunctival surface into center of lesion under topical anesthesia. At 2 weeks post-injection chalazion 80% resolved, small residual nodule. At 4 weeks completely resolved. Counseled on prevention: daily eyelid hygiene with warm compresses to prevent recurrence. At 6 months no recurrence.
