tree_id: DERM-ROSACEA
name: Rosacea
family: Dermatology
specialty: Dermatology
chief_complaint: Facial redness and flushing
description: Chronic inflammatory facial skin condition causing persistent erythema, flushing, papules, pustules, and telangiectasias on central face. Topical metronidazole and oral doxycycline control symptoms, avoid triggers, lifelong management required.
icd10: L71.9
urgency: non-urgent

workup:
  - Clinical diagnosis: persistent facial erythema (lasting longer than 10 minutes) plus one or more of papules/pustules, flushing, telangiectasias
  - Distribution: central face (cheeks, nose, chin, forehead), spares perioral area
  - Subtypes: erythematotelangiectatic (flushing and persistent erythema), papulopustular (papules and pustules on background erythema), phymatous (thickened skin, rhinophyma), ocular (blepharitis, conjunctivitis, keratitis)
  - Flushing: transient episodes triggered by heat, spicy foods, alcohol, stress, hot beverages
  - Papules and pustules: on background erythema (no comedones - distinguishes from acne)
  - Telangiectasias: dilated blood vessels visible on cheeks and nose
  - Rhinophyma: bulbous enlargement of nose from sebaceous gland hyperplasia (late stage, men)
  - Age: typically 30-50 years, fair-skinned individuals (Northern European descent)
  - Triggers: heat, sun exposure, spicy foods, alcohol (especially red wine), hot beverages, stress, wind, extreme temperatures
  - Ocular rosacea: 50% have eye involvement (burning, grittiness, blepharitis, conjunctivitis)
  - No lab testing needed: clinical diagnosis
  - Skin biopsy: only if diagnosis uncertain (shows perifollicular and perivascular inflammation)

treatment:
  - Trigger avoidance: identify and avoid individual triggers (most important)
  - Sun protection: daily broad-spectrum SPF 30 or higher sunscreen (critical - sun major trigger)
  - Gentle skin care: avoid harsh soaps and astringents, use gentle cleansers and moisturizers
  - Topical therapy (first-line for mild-moderate):
  - Metronidazole 0.75-1% gel or cream twice daily (anti-inflammatory, reduces papules and erythema)
  - Azelaic acid 15-20% gel twice daily (anti-inflammatory, reduces papules and erythema)
  - Ivermectin 1% cream daily (anti-inflammatory and anti-Demodex, very effective)
  - Brimonidine 0.33% gel daily (alpha-agonist vasoconstrictor, reduces erythema for 12 hours, does not treat papules)
  - Oral therapy (for moderate-severe or inadequate response to topical):
  - Doxycycline 40 mg daily (sub-antimicrobial anti-inflammatory dose) or 100 mg BID x8-12 weeks
  - Most effective for papulopustular rosacea, reduces inflammation
  - Maintenance: topical therapy after completing oral course
  - Ocular rosacea: oral doxycycline 100 mg BID x8-12 weeks plus eyelid hygiene (warm compresses and lid scrubs)
  - Laser therapy: pulsed dye laser or intense pulsed light (IPL) for persistent erythema and telangiectasias (not covered by insurance)
  - Rhinophyma: surgical or laser ablation (debulking)
  - Avoid topical steroids: may worsen rosacea (steroid-induced rosacea)
  - Chronic condition: requires lifelong management, no cure

clinical_pearls:
  - Persistent central facial erythema with papules/pustules, flushing, telangiectasias
  - No comedones (distinguishes from acne)
  - Triggers: heat, sun, spicy foods, alcohol, hot beverages, stress
  - Sun protection critical - wear sunscreen daily
  - Topical metronidazole or azelaic acid first-line for mild-moderate
  - Oral doxycycline for moderate-severe or ocular rosacea
  - Ocular involvement in 50% - blepharitis, conjunctivitis
  - Chronic condition requiring lifelong management
  - Avoid topical steroids (worsen rosacea)

differentials:
  - Acne vulgaris: comedones present (blackheads and whiteheads), affects younger age group, no flushing or telangiectasias
  - Seborrheic dermatitis: greasy yellow scales on eyebrows, nasolabial folds, scalp, no papules or telangiectasias
  - Lupus (malar rash): butterfly distribution sparing nasolabial folds (rosacea involves nasolabial folds), photosensitive, positive ANA
  - Contact dermatitis: pruritic, acute onset after exposure, no papules or telangiectasias

trace: |
  A 45-year-old fair-skinned woman presented with 2 years of persistent facial redness on cheeks and nose. Frequent flushing episodes triggered by hot beverages, spicy foods, and sun exposure. Recently developed small red bumps on cheeks. No skin care product changes. Exam showed persistent erythema on cheeks, nose, and chin with multiple small erythematous papules and pustules on background erythema (no comedones), visible telangiectasias on cheeks. Diagnosed with papulopustular rosacea. Counseled extensively on trigger avoidance: daily broad-spectrum SPF 50 sunscreen (sun protection critical), avoid hot beverages and spicy foods, gentle skin care (switch to fragrance-free gentle cleanser and moisturizer). Started topical metronidazole 0.75% gel twice daily. At 4 weeks papules improved 40%, erythema persists. Added oral doxycycline 100 mg daily for 8 weeks (anti-inflammatory dose). At 8 weeks papules 80% resolved, background erythema improved 50%, flushing episodes decreased. Stopped doxycycline, continued metronidazole gel daily maintenance. At 6 months good control on maintenance therapy, occasional mild flushing with triggers but well-managed. Considering pulsed dye laser for persistent telangiectasias. Counseled on chronic nature requiring lifelong management, continues daily sunscreen and topical therapy.
