  - Perioral dermatitis
  - Steroid-induced rosacea
workup:
  - Clinical diagnosis (no specific tests)
  - Skin biopsy only if diagnosis uncertain
treatment:
  - 'Guideline-based treatment options for Rosacea include:'
  - 'Erythematotelangiectatic: Avoid triggers, gentle skincare, topical metronidazole 0.75% BID (AAD 2023)'
  - 'Papulopustular: Topical metronidazole or azelaic acid 15% BID + oral doxycycline 40mg daily (AAD 2023)'
  - 'Severe: Oral doxycycline 100mg BID or isotretinoin (AAD 2023)'
  - 'Telangiectasias: Laser therapy (AAD 2023)'
  - 'Rhinophyma: Surgical debulking or CO2 laser (AAD 2023)'
clinical_pearls:
  - 'Four subtypes: Erythematotelangiectatic, papulopustular, phymatous, ocular'
  - No comedones (unlike acne) - helps distinguish
  - 'Ocular rosacea in 50%: Dry eyes, blepharitis, foreign body sensation'
  - 'Triggers: Sun, heat, alcohol, spicy food, stress, hot beverages'
  - Rhinophyma (bulbous nose) is late-stage complication, more common in men
