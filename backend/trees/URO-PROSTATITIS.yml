tree_id: URO-PROSTATITIS
name: Prostatitis
family: urology
specialty: Urology/Primary Care
applies_to: male
icd10: N41.9
snomed: 9713002
urgency: []
homeopathy: []
presentations:
  - Classification into 4 types (NIH criteria)
  - Type I: Acute bacterial prostatitis (sudden onset, severe, febrile)
  - Type II: Chronic bacterial prostatitis (recurrent UTIs from prostatic focus)
  - Type III: Chronic prostatitis/chronic pelvic pain syndrome (CPPS) - most common (90%)
  - Type IV: Asymptomatic inflammatory prostatitis (incidental finding)
  - Acute bacterial prostatitis (Type I) presentations
  - Sudden onset high fever, chills, rigors
  - Severe pelvic, perineal, or low back pain
  - Dysuria, urgency, frequency
  - Obstructive voiding symptoms or acute urinary retention
  - Malaise, myalgias, nausea
  - Tender, boggy, swollen prostate on DRE (do gently - vigorous exam can cause bacteremia)
  - Chronic prostatitis/CPPS (Type III) presentations
  - Pelvic pain or discomfort for at least 3 months (in at least 3 of 6 months)
  - Pain in perineum, suprapubic area, penis, testicles, or rectum
  - Pain with ejaculation or after intercourse
  - Lower urinary tract symptoms (urgency, frequency, dysuria, weak stream)
  - Erectile dysfunction may be present
  - No fever (distinguishes from acute bacterial)
workup:
  - Clinical diagnosis based on history and examination
  - Digital rectal examination
  - "Acute bacterial: extremely tender, boggy, warm prostate (examine gently)"
  - "Chronic: may be tender or normal"
  - Avoid vigorous prostatic massage in acute bacterial (risk of bacteremia/sepsis)
  - Urinalysis and urine culture
  - Acute bacterial: pyuria, bacteriuria
  - Chronic bacterial: recurrent positive cultures with same organism
  - CPPS: usually sterile or transient bacteria
  - Pre- and post-prostatic massage urine test (Meares-Stamey 4-glass test) for chronic prostatitis
  - Void 1 (VB1): initial 10 mL (urethral)
  - Void 2 (VB2): midstream (bladder)
  - Expressed prostatic secretions (EPS): after prostatic massage
  - Void 3 (VB3): post-massage urine (prostatic)
  - Chronic bacterial: bacteria and WBCs in EPS and VB3
  - CPPS: WBCs in EPS but sterile cultures
  - Complete blood count if acute bacterial prostatitis
  - Leukocytosis common
  - Blood cultures if systemically ill or septic
  - Prostate-specific antigen (PSA)
  - Elevated in acute and chronic prostatitis (NOT indicative of cancer)
  - Do NOT check during acute infection
  - Recheck 4-6 weeks after treatment if initially elevated
  - Imaging if concern for complications
  - Transrectal ultrasound or CT pelvis if prostatic abscess suspected (fever despite antibiotics)
  - Rule out urinary retention with post-void residual or bladder scan
treatment:
  - Acute bacterial prostatitis (Type I)
  - Antibiotics (fluoroquinolones preferred - excellent prostatic penetration)
  - Ciprofloxacin 500 mg PO twice daily for 4-6 weeks
  - Levofloxacin 500 mg PO daily for 4-6 weeks
  - Alternative: trimethoprim-sulfamethoxazole DS twice daily for 4-6 weeks
  - If severely ill or septic: hospitalize, IV antibiotics
  - Ceftriaxone 1-2 g IV daily plus doxycycline 100 mg IV twice daily
  - Transition to oral when improving
  - Duration: minimum 4 weeks (shorter courses have high relapse rate)
  - Supportive care: hydration, NSAIDs or acetaminophen for pain/fever, stool softeners
  - Alpha-blockers (tamsulosin 0.4 mg daily) if obstructive symptoms or retention
  - Avoid urethral catheterization if possible (risk of bacteremia) - suprapubic catheter preferred if retention
  - Chronic bacterial prostatitis (Type II)
  - Prolonged antibiotics: 6-12 weeks (prostate is sanctuary site, hard to eradicate)
  - Fluoroquinolones first-line (best prostatic penetration)
  - Ciprofloxacin 500 mg twice daily for 6-12 weeks
  - Levofloxacin 500 mg daily for 6-12 weeks
  - Alternative: trimethoprim-sulfamethoxazole DS twice daily for 6-12 weeks
  - Alpha-blocker (tamsulosin) may help voiding symptoms
  - Chronic prostatitis/CPPS (Type III) - challenging to treat
  - No single effective treatment - multimodal approach
  - Alpha-blockers (tamsulosin 0.4 mg daily) - help voiding symptoms and pain (40-50% improvement)
  - NSAIDs or acetaminophen for pain
  - Antibiotics trial (4-6 weeks) if previously untreated - may help subset with occult infection
  - 5-alpha reductase inhibitors (finasteride 5 mg daily) if large prostate
  - Pelvic floor physical therapy (myofascial trigger point release) - beneficial in many patients
  - Phytotherapy: quercetin, saw palmetto (evidence limited but may help)
  - Avoid irritants: caffeine, alcohol, spicy foods
  - Psychological support: CBT for chronic pain management
  - Reassurance: not cancer, not sexually transmitted, not progressive
clinical_pearls:
  - "Chronic prostatitis/CPPS (Type III) accounts for 90-95% of prostatitis - often no bacterial cause identified"
  - "Acute bacterial prostatitis can progress to sepsis - aggressive treatment with 4-6 weeks antibiotics required"
  - "Avoid vigorous prostatic massage in acute bacterial prostatitis - can cause bacteremia"
  - "Fluoroquinolones (ciprofloxacin, levofloxacin) first-line for bacterial prostatitis - best prostatic tissue penetration"
  - "Chronic bacterial prostatitis common source of recurrent UTIs in men - requires prolonged 6-12 week antibiotic course"
  - "CPPS is diagnosis of exclusion - sterile cultures, chronic pelvic pain, multimodal treatment"
  - "PSA elevated in all types of prostatitis - NOT indicative of cancer, recheck after treatment"
  - "Alpha-blockers (tamsulosin) help both voiding symptoms and pain in chronic prostatitis"
referrals:
  - Urology if acute prostatitis with urinary retention or sepsis
  - Urology if chronic bacterial prostatitis refractory to antibiotics
  - Urology if chronic CPPS not improving with conservative management
  - Urology if concern for prostatic abscess (persistent fever despite antibiotics)
  - Pelvic floor physical therapy for CPPS
differentials:
  - Acute bacterial prostatitis (fever, tender prostate, systemic symptoms, positive cultures)
  - Chronic bacterial prostatitis (recurrent UTIs, same organism, positive cultures)
  - Chronic prostatitis/chronic pelvic pain syndrome (chronic pain, sterile cultures)
  - Benign prostatic hyperplasia (obstructive symptoms, non-tender prostate, older men)
  - Urinary tract infection (dysuria, frequency, no prostate tenderness)
  - Epididymitis (testicular pain and swelling, tender epididymis)
  - Interstitial cystitis (bladder pain, frequency, urgency, cystoscopy findings)
  - Pelvic floor dysfunction (pelvic pain, muscle tenderness)
