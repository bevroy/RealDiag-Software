differentials:
  - Bowel obstruction
  - Lipoma
  - Abscess
  - Femoral aneurysm
workup: []
treatment:
  - Urgent surgical evaluation - risk of strangulation
  - NPO, IV fluids
  - Attempt manual reduction if no peritoneal signs - Trendelenburg position, sedation, gentle sustained pressure
  - 'If successful reduction: Elective hernia repair within days'
  - 'If cannot reduce OR signs of strangulation (fever, peritonitis, WBC elevation): Emergency surgery'
  - Emergent hernia repair with bowel inspection for ischemia
  - Resect ischemic bowel if present
  - Mesh repair if no contamination, primary repair if contaminated field
  - Antibiotics perioperative - cefazolin 2g IV
