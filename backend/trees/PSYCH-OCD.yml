urgency: medium
description: Comprehensive evaluation and management of Obsessive-Compulsive Disorder
version: '1.0'
citations:
  - APA (American Psychiatric Association) Practice Guidelines
  - NICE (National Institute for Health and Care Excellence) Mental Health Guidelines
  - UpToDate - Psychiatry
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Recurrent intrusive thoughts (obsessions)
- Repetitive behaviors (compulsions)
- Time-consuming (> 1 hour/day)
- Significant distress or impairment
- Recognition that obsessions are excessive
workup: []
treatment:
  - 'Cognitive behavioral therapy with exposure and response prevention (ERP) - first-line, most effective'
  - 'ERP therapy: Gradual exposure to feared obsessions while preventing compulsive responses, 70% response rate'
  - 'SSRI antidepressants - higher doses needed than for depression, 10-12 weeks for full effect'
  - 'Fluoxetine 40-80mg daily, sertraline 150-200mg daily, paroxetine 40-60mg daily, fluvoxamine 200-300mg divided'
  - 'If SSRI insufficient: Add low-dose antipsychotic - aripiprazole 5-15mg daily or risperidone 0.5-2mg daily'
  - 'Clomipramine 150-250mg daily - tricyclic, most effective medication but more side effects than SSRI'
  - 'Treatment duration: At least 1-2 years before considering taper, high relapse risk if stopped too early'
  - 'Severe refractory OCD: Consider glutamate modulators (memantine, riluzole), deep brain stimulation, intensive residential treatment'
  - 'Comorbidities common - treat concurrent depression, anxiety, tic disorders'
  - 'Avoid reassurance-seeking - reassurance provides temporary relief but maintains OCD cycle'
  - 'Support groups and family psychoeducation helpful'
clinical_pearls: []
