tree_id: ENDO-THYROID_CANCER
name: Thyroid carcinoma
family: Endocrinology
specialty: Endocrinology
icd10:
- C73
snomed: []
urgency: medium
description: Comprehensive evaluation and management of Thyroid carcinoma
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Palpable thyroid nodule (usually painless)
- Hard, fixed, irregular nodule on palpation
- Rapid growth of thyroid mass
- Cervical lymphadenopathy (enlarged neck lymph nodes)
- Hoarseness (recurrent laryngeal nerve involvement)
- Dysphagia (difficulty swallowing)
- Dyspnea or stridor (tracheal compression)
- Hemoptysis (rare, advanced disease)
- Often discovered on ultrasound with suspicious features
- May present with distant metastases (lung, bone)
- Family history of thyroid cancer or MEN syndrome
workup:
- FNA with cytology (Bethesda V or VI = suspicious or malignant)
- 'Pre-op: TSH, vocal cord assessment (laryngoscopy), neck ultrasound for lymph nodes'
- 'Post-op: Thyroglobulin (tumor marker), anti-thyroglobulin antibodies, RAI whole
  body scan if indicated'
- Calcitonin if medullary suspected, check RET proto-oncogene for MEN2
treatment:
- 'Guideline-based treatment options for Thyroid carcinoma include:'
- 'Papillary/follicular: Total thyroidectomy (preferred) or lobectomy if low-risk
  small tumor (ADA 2024)'
- Radioactive iodineablation post-surgery if high-risk, >4cm, lymph node involvement,
  or distant mets (ADA 2024)
- 'TSH suppression with levothyroxine: Goal TSH 0.1-0.5 for high-risk, 0.5-2.0 for
  low-risk (ADA 2024)'
- 'Surveillance: Thyroglobulin levels + neck ultrasound every 6-12 months (rising
  Tg suggests recurrence) (ADA 2024)'
- 'Anaplastic: Palliative care, consider tracheostomy if airway compromise, external
  beam radiation (ADA 2024)'
clinical_pearls:
- 'Papillary (85%): Best prognosis, lymph node spread common but survival excellent.
  Follicular (10%): Vascular invasion'
- 'Medullary (3%): From C cells, produces calcitonin, screen for MEN2 syndrome (RET
  mutation)'
- 'Anaplastic (1%): Rapidly fatal (months), presents as hard fixed mass with compressive
  symptoms'
- 'Risk stratification: Low risk (small papillary, no extrathyroidal extension), high
  risk (>4cm, distant mets, anaplastic)'
referrals:
- Endocrine surgeon (high-volume thyroidectomy surgeon) for definitive surgery
- Endocrinology for post-op RAI ablation and TSH suppression management
- Medical oncology if anaplastic or distant metastases (tyrosine kinase inhibitors)
differentials: []
trace:
