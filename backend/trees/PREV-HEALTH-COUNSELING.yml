tree_id: PREV-HEALTH-COUNSELING
name: Preventive Health Counseling (Encounter)
family: preventive
specialty: Primary Care, Family Medicine
chief_complaint: Health counseling, lifestyle modification
description: |
  Encounter focused on preventive health counseling and behavior change.
  Addresses diet, exercise, weight, smoking, alcohol, stress, sleep, and safety.
icd10: Z71.89
snomed: "409073007"
presentations:
  - Request for health advice
  - Lifestyle modification counseling
  - Risk factor reduction
  - Wellness education
urgency: Low
workup:
  - Current health behaviors assessment
  - Readiness for change (stages of change model)
  - Barriers to healthy behaviors
  - Social support system
  - Mental health screening
treatment:
  diet_and_nutrition:
    - Mediterranean diet or DASH diet
    - Increase fruits and vegetables
    - Reduce processed foods and added sugars
    - Portion control
    - Referral to dietitian if indicated
  physical_activity:
    - Goal - 150 minutes moderate activity per week
    - Or 75 minutes vigorous activity per week
    - Include strength training 2 days per week
    - Start slow and build gradually
  weight_management:
    - BMI calculation and goal setting
    - Calorie deficit for weight loss (500 cal/day = 1 lb/week)
    - Combine diet and exercise
    - Consider referral to weight management program
  smoking_cessation:
    - 5 A's - Ask, Advise, Assess, Assist, Arrange
    - Pharmacotherapy - nicotine replacement, varenicline, or bupropion
    - Behavioral counseling
    - Quitline referral (1-800-QUIT-NOW)
  alcohol_moderation:
    - Moderate drinking - ≤1 drink/day women, ≤2 drinks/day men
    - Screen for alcohol use disorder (AUDIT-C)
    - Brief intervention if risky drinking
  stress_management:
    - Identify stressors
    - Coping strategies
    - Mindfulness and relaxation techniques
    - Consider mental health referral
  sleep_hygiene:
    - 7-9 hours per night for adults
    - Consistent sleep schedule
    - Avoid screens before bed
    - Dark, cool, quiet bedroom
clinical_pearls:
  - Motivational interviewing more effective than directive counseling
  - Small, achievable goals better than overwhelming changes
  - Focus on patient's priorities and readiness
  - Multiple brief interventions over time
  - Celebrate successes and normalize setbacks
  - Address social determinants of health
differentials:
  - Health maintenance counseling
  - Specific risk factor modification (obesity, smoking, etc)
  - Mental health concerns
trace:
  - 45-year-old presents wanting to improve health. BMI 32, sedentary, poor diet. Assess readiness for change - motivated. Set goals - walk 30 min 3x/week, eliminate sugary drinks, increase vegetables. Provide written materials. Refer to dietitian. Follow-up in 4 weeks. At follow-up, lost 5 lbs and meeting exercise goals.
citations:
  - USPSTF Behavioral Counseling Recommendations
  - CDC Health Promotion Guidelines
