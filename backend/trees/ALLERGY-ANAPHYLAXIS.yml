tree_id: ALLERGY-ANAPHYLAXIS
name: Anaphylaxis Management
family: ALLERGY_IMMUNOLOGY
specialty: Allergy/Immunology, Emergency Medicine
chief_complaint: Acute Allergic Reaction, Difficulty Breathing, Urticaria, Angioedema, Hypotension
description: Comprehensive evaluation and management of anaphylaxis and severe allergic reactions
version: "1.0"
author: RealDiag Clinical Team

entry_point: anaphylaxis_presentation

nodes:
  - id: anaphylaxis_presentation
    type: question
    text: "Severity of allergic reaction?"
    options:
      - label: "Anaphylaxis (life-threatening)"
        next: anaphylaxis
      - label: "Severe allergic reaction (not anaphylaxis)"
        next: severe_allergic_reaction
      - label: "Post-stabilization management"
        next: post_anaphylaxis_management

  - id: anaphylaxis
    type: diagnosis
    name: "Anaphylaxis"
    icd10: "T78.2"
    urgency: critical
    workup:
      - Definition - Severe, life-threatening systemic hypersensitivity reaction
      - Rapid onset (minutes to hours), multi-system involvement
      - Biphasic reaction - 5-20% have second wave of symptoms 4-12 hours later (up to 72 hours)
      - Clinical criteria for anaphylaxis (ANY ONE sufficient for diagnosis)
      - Criterion 1 - Acute onset (minutes-hours) with skin/mucosal involvement (urticaria, pruritus, flushing, angioedema) PLUS at least one of:
      - Respiratory compromise (dyspnea, wheeze, stridor, hypoxia)
      - Hypotension or end-organ dysfunction (syncope, collapse, incontinence)
      - Criterion 2 - Two or more of following rapidly after likely allergen exposure:
      - Skin/mucosal (urticaria, angioedema)
      - Respiratory (wheeze, stridor)
      - Hypotension/syncope
      - GI symptoms (cramping, vomiting, diarrhea)
      - Criterion 3 - Hypotension after exposure to KNOWN allergen
      - Adults SBP <90 or >30% decrease from baseline
      - Children - Age-specific low BP or >30% decrease
      - Common triggers
      - Foods - Peanuts, tree nuts, shellfish, fish, milk, eggs, wheat, soy (accounts for 30-40% anaphylaxis)
      - Medications - Antibiotics (penicillin, cephalosporins), NSAIDs, contrast media, neuromuscular blocking agents
      - Insect stings - Hymenoptera (bees, wasps, hornets, fire ants)
      - Latex
      - Exercise-induced - Food-dependent exercise-induced anaphylaxis (FDEIA)
      - Idiopathic (20% no identified trigger)
      - Risk factors for severe/fatal anaphylaxis
      - Asthma (especially poorly controlled)
      - Cardiovascular disease
      - Mastocytosis
      - Delayed epinephrine administration
      - Beta-blocker use (impairs response to epinephrine, refractory hypotension)
      - ACE inhibitor use (worsens angioedema)
      - Clinical presentation - Rapid progression, seconds to minutes
      - Cutaneous (90%) - Urticaria (hives), angioedema, flushing, pruritus (palms/soles)
      - Respiratory (70%) - Dyspnea, wheeze, stridor (laryngeal edema), cough, rhinorrhea, sensation throat closing
      - Cardiovascular (45%) - Hypotension, tachycardia (or bradycardia), syncope, chest pain, arrhythmias, cardiac arrest
      - GI (30-45%) - Nausea, vomiting, cramping abdominal pain, diarrhea
      - Neurologic - Sense of impending doom, confusion, dizziness, headache
      - Note - 10-20% NO skin findings (anaphylaxis without urticaria/flushing, more common in hypotensive presentations)
      - Labs - NOT needed for diagnosis (clinical), do NOT delay treatment
      - Serum tryptase - Elevated 1-2 hours after symptom onset, peaks 60-90 min, returns to baseline 6-8 hours
      - Confirmatory if elevated (>11.4 ng/mL), but normal does NOT exclude
      - Histamine - Less useful (peaks 5-10 min, normalizes 30-60 min)
    treatment:
      - ABC - Airway, breathing, circulation, call for help, activate emergency response
      - Position - Supine with legs elevated (or left lateral decubitus if pregnant), do NOT sit up (sudden death from empty ventricle syndrome)
      - Epinephrine - First-line, IMMEDIATE, life-saving, NO absolute contraindications
      - IM epinephrine 1:1000 (1 mg/mL) in anterolateral thigh (vastus lateralis)
      - Adults - 0.3-0.5 mg (0.3-0.5 mL) IM
      - Children - 0.01 mg/kg (max 0.3 mg) IM, or auto-injector dose (0.15 mg if 15-30 kg, 0.3 mg if >30 kg)
      - Repeat q5-15min as needed (70% require only one dose, 20% require two doses)
      - Auto-injector (EpiPen, Auvi-Q) if available - Administer through clothing if necessary
      - IV epinephrine - If refractory to IM doses, in extremis, cardiac arrest
      - 0.1 mg (1 mL of 1:10,000 or 0.1 mL of 1:1000 in 10 mL NS) slow IV push over 5 min
      - Continuous infusion 0.1-1 mcg/kg/min if persistent hypotension (ICU)
      - Oxygen - High-flow 100% by face mask or non-rebreather
      - IV fluids - Aggressive volume resuscitation if hypotensive
      - NS or LR 1-2 L bolus adults (20 mL/kg children), repeat as needed
      - Massive fluid shifts (up to 35% intravascular volume can extravasate in 10 min)
      - Adjunctive medications (NOT substitutes for epinephrine, give AFTER epinephrine)
      - H1 antihistamine - Diphenhydramine 25-50 mg IV/IM (1 mg/kg children, max 50 mg)
      - Relieves urticaria/pruritus, minimal effect on life-threatening manifestations
      - H2 antihistamine - Ranitidine 50 mg IV or famotidine 20 mg IV (may add benefit)
      - Corticosteroids - Methylprednisolone 1-2 mg/kg IV (max 125 mg) OR hydrocortisone 5 mg/kg IV
      - May prevent biphasic reaction (controversial, evidence weak), no immediate benefit (takes 4-6 hours)
      - Bronchodilators - Albuterol 2.5-5 mg nebulized if wheezing/bronchospasm
      - Refractory hypotension despite epinephrine and fluids
      - Vasopressors - Norepinephrine, vasopressin, dopamine (ICU)
      - Glucagon - 1-5 mg IV bolus then 5-15 mcg/min infusion if on beta-blockers (bypasses beta-receptor blockade)
      - Methylene blue - Experimental for refractory shock
      - Airway management
      - Anticipate difficult airway (angioedema, laryngeal edema)
      - Early intubation if stridor, respiratory distress, angioedema progressing (do NOT delay until complete obstruction)
      - Cricothyrotomy if cannot intubate/ventilate
      - Observation period - Minimum 4-8 hours (biphasic reaction risk), 24 hours if severe
      - ICU if refractory, required vasopressors, severe asthma

  - id: severe_allergic_reaction
    type: diagnosis
    name: "Severe Allergic Reaction (Not Anaphylaxis)"
    icd10: "T78.40"
    urgency: high
    workup:
      - Allergic reactions not meeting anaphylaxis criteria
      - Urticaria and/or angioedema without respiratory/cardiovascular/GI involvement
      - Still potentially serious (angioedema can progress to airway compromise)
      - Urticaria (hives) - Pruritic, raised, erythematous wheals (blanch with pressure), transient (<24 hours any individual lesion)
      - Angioedema - Deeper swelling dermis/submucosa, non-pitting, non-pruritic, affects face (lips, tongue, periorbital), extremities, GI tract (abdominal pain)
      - Mast cell or bradykinin-mediated
      - Causes - Same triggers as anaphylaxis (foods, medications, insect stings), plus ACE inhibitors (bradykinin-mediated angioedema 0.1-0.7% patients)
    treatment:
      - Remove trigger if identifiable
      - Mild urticaria/angioedema (no airway involvement, no respiratory distress)
      - H1 antihistamines - Diphenhydramine 25-50 mg PO/IV q6h OR cetirizine 10 mg PO daily OR loratadine 10 mg PO daily
      - Non-sedating antihistamines preferred outpatient
      - H2 antihistamines - Ranitidine 150 mg PO BID or famotidine 20 mg PO BID (may add benefit)
      - Corticosteroids - Prednisone 40-60 mg PO daily x 3-5 days (prevents prolonged/recurrent urticaria)
      - Severe urticaria/angioedema or concerning for progression
      - Epinephrine 0.3-0.5 mg IM if ANY concern for airway compromise or progression to anaphylaxis
      - Threshold low to give epinephrine (safe, effective)
      - Admit for observation if angioedema involving tongue, oropharynx (airway risk)
      - ACE inhibitor-induced angioedema
      - Stop ACE inhibitor (do NOT rechallenge, switch to ARB generally safe but 5-10% cross-reactivity)
      - Antihistamines and steroids NOT effective (bradykinin-mediated, not histamine)
      - Icatibant (bradykinin B2 receptor antagonist) 30 mg SC - Approved for hereditary angioedema, used off-label for ACE inhibitor angioedema
      - FFP or C1 esterase inhibitor if severe/refractory
      - Secure airway early if tongue/pharyngeal swelling

  - id: post_anaphylaxis_management
    type: diagnosis
    name: "Post-Anaphylaxis Management"
    icd10: "T78.2"
    urgency: medium
    workup:
      - After stabilization from anaphylaxis episode
      - Goals - Identify trigger, prevent recurrence, educate patient, prescribe emergency medications
      - Trigger identification
      - Detailed history - Timing, foods, medications, insect stings, exercise, preceding viral illness
      - Allergy testing - Skin prick testing or specific IgE (serum) 4-6 weeks after event (false negatives if done too soon)
      - Foods (peanut, tree nuts, shellfish, fish, milk, egg, wheat, soy)
      - Venom (bee, wasp, hornet, yellow jacket, fire ant)
      - Medications (penicillin, cephalosporins, NSAIDs)
      - Latex
      - Tryptase baseline - If idiopathic or recurrent (screen for mastocytosis)
    treatment:
      - Avoidance - Strict avoidance of identified trigger
      - Food labels (cross-contamination risk)
      - Inform restaurants, schools, family
      - Medical alert bracelet
      - Epinephrine auto-injector - CRITICAL, prescribe 2 devices (one backup)
      - EpiPen, Auvi-Q (voice instructions), generic alternatives
      - 0.15 mg (15-30 kg children) or 0.3 mg (>30 kg, adults)
      - Teach proper use - Remove safety cap, jab into outer thigh, hold 3 seconds, massage
      - Carry at all times
      - Call 911 immediately after using
      - Expiration dates (replace yearly)
      - Written emergency action plan - When to use epinephrine (immediate for respiratory, cardiovascular symptoms or multi-system), call 911, secondary medications (antihistamines)
      - Avoid triggers - Beta-blockers (impair epinephrine response, consider alternative antihypertensives), ACE inhibitors if angioedema
      - Medical alert identification - Bracelet or necklace stating anaphylaxis trigger
      - Allergy/Immunology referral
      - Confirm trigger with testing
      - Venom immunotherapy - If insect sting anaphylaxis (highly effective, 90-95% protection after full course 3-5 years)
      - Oral immunotherapy (OIT) - Experimental for food allergies (peanut OIT FDA-approved Palforzia, desensitizes but requires ongoing daily dosing, risk anaphylaxis during treatment)
      - Omalizumab (anti-IgE mAb) - For idiopathic anaphylaxis or refractory chronic urticaria
      - Aspirin desensitization - If NSAID anaphylaxis and aspirin needed (cardiovascular disease)
      - Patient education - Recognize early symptoms, use epinephrine immediately (do NOT delay), avoid known triggers, carry epinephrine always
      - Prognosis - Recurrence risk depends on trigger avoidability (food allergies persist in 80-90% peanut/tree nut, outgrow milk/egg 50-80% by school age)
