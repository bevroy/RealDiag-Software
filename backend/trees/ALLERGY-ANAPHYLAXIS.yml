tree_id: ALLERGY-ANAPHYLAXIS
name: Anaphylaxis
family: allergic
specialty: Allergy-Immunology/Emergency Medicine
chief_complaint: Sudden onset difficulty breathing, hives, hypotension after allergen exposure
description: Severe systemic allergic reaction involving multiple organ systems, potentially life-threatening
icd10: T78.2XXA
urgency: emergency
workup:
  - Clinical diagnosis based on history and physical examination - DO NOT DELAY TREATMENT
  - Anaphylaxis criteria (NIAID/FAAN) - acute onset (minutes to hours) with involvement of skin/mucosa plus respiratory compromise OR cardiovascular compromise OR hypotension after known allergen
  - Detailed history - timing of exposure, previous reactions, current symptoms
  - Physical examination - assess airway, breathing, circulation
  - Skin - urticaria, angioedema, flushing, pruritus (80-90% of cases)
  - Respiratory - dyspnea, wheezing, stridor, throat tightness, hypoxemia
  - Cardiovascular - tachycardia, hypotension, syncope, chest pain
  - Gastrointestinal - nausea, vomiting, diarrhea, abdominal cramping
  - Neurological - dizziness, confusion, sense of impending doom
  - Vital signs - hypotension (SBP less than 90 or 30% decrease from baseline), tachycardia, tachypnea, low oxygen saturation
  - Serum tryptase (within 1-2 hours of symptom onset, elevated supports diagnosis but normal does not rule out)
  - Peak at 1-2 hours, may be helpful retrospectively
  - Consider biphasic reaction (1-20% of cases, symptoms recur 1-72 hours later)
treatment:
  - Intramuscular epinephrine 0.3-0.5 mg (1:1000 concentration) into anterolateral thigh - FIRST-LINE TREATMENT
  - Repeat every 5-15 minutes as needed for persistent symptoms
  - Pediatric dose 0.01 mg/kg (max 0.3 mg for children less than 30 kg, 0.5 mg if greater than 30 kg)
  - Call for help, activate emergency response (call 911)
  - Place patient supine with legs elevated (or position of comfort if respiratory distress)
  - High-flow oxygen via non-rebreather mask
  - IV access, aggressive fluid resuscitation with normal saline 1-2 L bolus (20 mL/kg in children)
  - Cardiac monitoring, pulse oximetry
  - Adjunctive medications (AFTER epinephrine, not substitutes)
  - H1-antihistamines - diphenhydramine 25-50 mg IV/IM or cetirizine 10 mg PO
  - H2-antihistamines - ranitidine 50 mg IV or famotidine 20 mg IV
  - Corticosteroids - methylprednisolone 125 mg IV or prednisone 60 mg PO (may prevent biphasic reaction)
  - Bronchodilators - albuterol nebulizer if bronchospasm
  - If hypotension persists despite epinephrine and fluids
  - IV epinephrine infusion 0.1-1 mcg/kg/min
  - Vasopressors (norepinephrine, dopamine)
  - Glucagon 1-2 mg IV if on beta-blockers (epinephrine may be less effective)
  - Observation period minimum 4-6 hours (longer if severe or history of biphasic reaction)
  - Discharge planning - prescribe epinephrine auto-injector (EpiPen, Auvi-Q) with training
  - Carry two auto-injectors at all times
  - Refer to allergist for identification of trigger and allergen testing
  - Medical alert bracelet
clinical_pearls:
  - Most common triggers - foods (peanuts, tree nuts, shellfish, fish, milk, eggs), medications (antibiotics, NSAIDs), insect stings (Hymenoptera), latex
  - Epinephrine is ONLY definitive treatment - antihistamines and steroids are adjuncts
  - No absolute contraindications to epinephrine in anaphylaxis
  - Intramuscular route preferred (faster absorption than subcutaneous)
  - Anterolateral thigh is optimal site (vastus lateralis muscle)
  - Delayed or absent epinephrine administration is leading cause of fatal anaphylaxis
  - Biphasic reactions occur in 1-20%, typically within 4-6 hours but can be up to 72 hours
  - Risk factors for severe/fatal anaphylaxis - asthma, delayed epinephrine, adolescents/young adults, peanut/tree nut allergy
  - Beta-blockers may attenuate response to epinephrine, may need glucagon
  - ACE inhibitors may worsen angioedema
  - Exercise-induced anaphylaxis - can be food-dependent (eat then exercise)
differentials:
  - Vasovagal syncope (bradycardia, pallor, no urticaria or respiratory symptoms)
  - Panic attack (no objective findings, no urticaria or hypotension)
  - Asthma exacerbation (respiratory symptoms only, no skin or cardiovascular involvement)
  - Hereditary angioedema (no urticaria, slower onset, C1 esterase inhibitor deficiency)
  - Scombroid fish poisoning (histamine ingestion, mimics allergy but not IgE-mediated)
  - Carcinoid syndrome (flushing, diarrhea, wheezing, elevated 5-HIAA)
  - Mastocytosis (recurrent episodes, elevated baseline tryptase)
trace:
  - 22-year-old woman with known peanut allergy accidentally ate cookie containing peanut butter at party
  - Within 5 minutes developed tingling lips and tongue, generalized itching
  - Over next 10 minutes developed hives all over body, throat tightness, difficulty breathing, dizziness
  - Friends called 911, EMS arrived within 8 minutes
  - EMS assessment - appears in distress, multiple urticarial lesions on face and trunk
  - Vitals - BP 85/50, HR 125, RR 28, SpO2 89% on room air
  - Bilateral wheezing on lung auscultation, no stridor
  - Diagnosis - Anaphylaxis due to peanut ingestion
  - EMS administered epinephrine 0.5 mg IM (1:1000) into right anterolateral thigh
  - High-flow oxygen via non-rebreather mask
  - Established IV access, started normal saline bolus
  - Transported to ED with lights and sirens
  - ED arrival (15 minutes after epinephrine) - improved but still symptomatic
  - BP 95/60, HR 115, RR 24, SpO2 94% on oxygen
  - Urticaria still present, less respiratory distress but ongoing wheezing
  - Second dose of epinephrine 0.5 mg IM given
  - Continued IV fluids, total 2 L normal saline bolus
  - Diphenhydramine 50 mg IV, famotidine 20 mg IV, methylprednisolone 125 mg IV
  - Albuterol nebulizer treatment
  - 30 minutes later - significant improvement
  - BP 110/70, HR 95, RR 18, SpO2 98% on 2L nasal cannula
  - Urticaria fading, no wheezing, breathing comfortably
  - Admitted for observation given severity and use of two epinephrine doses
  - Monitored for 12 hours, no biphasic reaction
  - Discharge planning - prescribed two epinephrine auto-injectors (EpiPen 0.3 mg)
  - Detailed teaching on when and how to use auto-injector
  - Strict peanut avoidance education, reading food labels
  - Medical alert bracelet ordered
  - Referral to allergist for formal testing and education
  - Allergist follow-up 2 weeks later - confirmed peanut allergy via skin prick testing
  - Discussed avoidance strategies, emergency action plan
  - Outcome - Patient now carries two auto-injectors at all times, has avoided peanuts successfully
