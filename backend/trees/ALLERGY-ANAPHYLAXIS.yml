tree_id: ALLERGY-ANAPHYLAXIS
name: Anaphylaxis
family: Allergy
specialty: Allergy
icd10:
- T78.2
- T78.00
snomed:
- '39579001'
urgency: medium
description: Comprehensive evaluation and management of Anaphylaxis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Acute onset (minutes to hours) of skin/mucosal involvement (urticaria, angioedema,
  flushing, pruritus)
- Respiratory compromise (dyspnea, wheezing, stridor, hypoxemia, throat tightness)
- Cardiovascular collapse (hypotension, syncope, shock, tachycardia)
- Gastrointestinal symptoms (nausea, vomiting, diarrhea, abdominal cramping)
- Sense of impending doom or anxiety
- Lightheadedness or dizziness
- Can occur without skin manifestations in 10-20% of cases
- 'Biphasic reaction in 20%: Recurrence 4-72 hours after initial episode'
- 'Common triggers: Foods (peanuts, tree nuts, shellfish, eggs), medications (penicillin,
  NSAIDs), insect stings (bee, wasp)'
- May progress rapidly to cardiovascular collapse within minutes
- Involvement of ≥2 organ systems (skin, respiratory, CV, GI) with rapid onset
workup:
- Diagnosis is clinical - do not delay treatment for testing
- Serum tryptase level if obtained within 1-2 hours can confirm diagnosis (elevated
  in 60-80%)
- 'Allergy testing after resolution: Skin prick or specific IgE to suspected triggers
  (food, venom, medications)'
- Consider serum tryptase baseline (if elevated, suggests mastocytosis)
treatment:
- 'Guideline-based treatment options for Anaphylaxis include:'
- 'FIRST-LINE: Epinephrine 0.3-0.5mg IM (1:1000) anterolateral thigh immediately (AAAAI
  2023)'
- Repeat epinephrine every 5-15 minutes if no response or worsening symptoms (AAAAI
  2023)
- Place patient supine with legs elevated (or left lateral if pregnant/vomiting) (AAAAI
  2023)
- High-flow oxygen, establish IV access, aggressive fluid resuscitation if hypotensive
  (AAAAI 2023)
- 'Adjunctive H1 antihistamine: Diphenhydramine 25-50mg IV/IM (helps pruritus, NOT
  life-saving) (AAAAI 2023)'
- 'Adjunctive H2 blocker: Ranitidine 50mg or famotidine 20mg IV (AAAAI 2023)'
- 'Corticosteroids: Methylprednisolone 125mg IV or prednisone 60mg PO (may reduce
  biphasic reaction) (AAAAI 2023)'
- 'Refractory hypotension: Epinephrine infusion 0.1-1 mcg/kg/min, glucagon 1-5mg IV
  if on beta-blockers (AAAAI 2023)'
- 'Bronchospasm refractory to epinephrine: Inhaled albuterol 2.5-5mg nebulized (AAAAI
  2023)'
- Observe minimum 4-8 hours (longer if severe or biphasic reaction concern)
- Discharge with epinephrine auto-injector x2 and anaphylaxis action plan
- Follow-up with allergist within 1-2 weeks for trigger identification and prevention
  plan
clinical_pearls:
- Life-threatening emergency requiring immediate epinephrine
- Diagnosis is clinical - do not delay treatment for testing
- 'Criteria: Involvement of ≥2 organ systems (skin, respiratory, CV, GI) with rapid
  onset'
- Can occur without skin manifestations in 10-20% of cases
- Epinephrine 0.3-0.5mg IM (1:1000) anterolateral thigh - repeat every 5-15 min if
  needed
- Early epinephrine improves outcomes - delay is associated with fatalities
- Antihistamines and steroids are adjunctive only, NOT first-line
- Observe minimum 4-8 hours due to biphasic reaction risk
- All patients should be prescribed epinephrine auto-injectors (EpiPen) and taught
  how to use
referrals:
- All patients require Allergy/Immunology referral for trigger identification and
  venom immunotherapy if indicated
- Consider if recurrent idiopathic anaphylaxis or unclear trigger
differentials: []
