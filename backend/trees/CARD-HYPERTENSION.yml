tree_id: CARD-HYPERTENSION
name: Hypertension
family: Cardiology
specialty: Cardiology
chief_complaint: Elevated blood pressure
description: Sustained elevation of systolic BP 130 or more or diastolic BP 80 or more increasing risk of cardiovascular disease, stroke, and kidney disease

icd10: I10

urgency: routine

homeopathy:
  - remedy: "Belladonna 30C"
    indications: "Throbbing sensation, flushed face, headache, sudden onset, pulsating arteries"
  - remedy: "Nux vomica 30C"
    indications: "Stress-related hypertension, Type A personality, after stimulants/alcohol"
  - remedy: "Lachesis 200C"
