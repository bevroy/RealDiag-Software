tree_id: CARDS-CAROTID-STENOSIS
name: Carotid Artery Stenosis
family: cardiology
specialty: Cardiology
icd10: I65.29
snomed: 64586002
urgency: high
homeopathy: []
presentations:
  - Asymptomatic (most common, found on screening or carotid bruit)
  - Transient ischemic attack (TIA) - temporary neurologic deficit <24 hours
  - Amaurosis fugax - transient monocular vision loss
  - Ischemic stroke - persistent neurologic deficit
  - Carotid bruit on physical examination
  - Contralateral weakness or numbness
  - Aphasia or dysarthria
  - Facial droop
  - Risk factors - smoking, hypertension, hyperlipidemia, diabetes, age >65
workup:
  - Carotid duplex ultrasound (first-line, non-invasive)
  - Stenosis grading - peak systolic velocity, end-diastolic velocity, ICA/CCA ratio
  - CT angiography (CTA) neck for surgical planning
  - MR angiography (MRA) alternative to CTA if contrast contraindicated
  - Conventional angiography gold standard but invasive
  - Brain MRI/CT if neurologic symptoms present to assess for stroke
  - Assess cardiovascular risk factors (lipid panel, HbA1c, ECG)
  - Echocardiogram to assess cardiac function and rule out cardioembolic source
  - Screen for coronary artery disease (often coexists)
treatment:
  - Medical management for all patients (symptomatic and asymptomatic)
  - Antiplatelet therapy - aspirin 81-325mg daily or clopidogrel 75mg daily
  - High-intensity statin therapy (atorvastatin 40-80mg or rosuvastatin 20-40mg)
  - Blood pressure control (goal <140/90, lower if tolerated)
  - ACE inhibitor or ARB preferred for hypertension
  - Diabetes control (HbA1c <7%)
  - Smoking cessation (critical)
  - Exercise and weight management
  - Revascularization indications
  - Symptomatic stenosis ≥50% - carotid endarterectomy (CEA) or carotid artery stenting (CAS)
  - Asymptomatic stenosis ≥70% - consider CEA if low surgical risk and life expectancy >5 years
  - CEA preferred over CAS in most patients (lower stroke risk)
  - CAS considered for high surgical risk, radiation-induced stenosis, restenosis after CEA
  - Surgery within 2 weeks of TIA/minor stroke optimal (if not on anticoagulation)
  - Dual antiplatelet therapy (aspirin + clopidogrel) 30 days post-CAS
clinical_pearls:
  - Annual stroke risk 1-2% with asymptomatic stenosis on optimal medical therapy
  - Symptomatic stenosis has 10-20% annual stroke risk without intervention
  - CEA reduces stroke risk by 50% in symptomatic stenosis ≥50%
  - Perioperative stroke/death risk should be <6% for symptomatic, <3% for asymptomatic
  - Bilateral carotid stenosis increases surgical risk
  - Contralateral occlusion is relative contraindication for CEA
  - Carotid bruit has poor sensitivity (50-70%) and specificity for stenosis
  - Screen for coronary disease - 50% have significant CAD
  - Crescendo TIAs warrant urgent evaluation and intervention
  - Medical therapy has improved - benefit of asymptomatic CEA now marginal
referrals:
  - Vascular surgery for consideration of carotid endarterectomy
  - Interventional neuroradiology for carotid artery stenting evaluation
  - Neurology for symptomatic patients or complex cases
  - Cardiology for cardiovascular risk management and CAD screening
differentials:
  - Atherosclerotic carotid stenosis (most common)
  - Fibromuscular dysplasia
  - Carotid dissection
  - Radiation-induced carotid stenosis
  - Takayasu arteritis
  - Carotid web (intimal variant FMD)
  - Cardioembolic stroke (atrial fibrillation, valve disease)
  - Vertebrobasilar insufficiency
trace:
  source: AHA/ASA Guidelines for Carotid Stenosis Management 2021
