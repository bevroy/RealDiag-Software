tree_id: NEU-RESTLESS-LEG
name: Restless Legs Syndrome
family: Neurology
specialty: Neurology
icd10:
- G25.81
snomed:
- '32914008'
urgency: medium
description: Comprehensive evaluation and management of Restless Legs Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- urge to move legs, especially at rest
- uncomfortable sensations in legs
- symptoms worse in evening/night
- relief with movement
- disrupts sleep
- Urge to move legs with uncomfortable sensations (creeping, crawling, tingling)
- Worse with rest, evening/night (circadian pattern)
- Relief with movement (walking, stretching)
- Disrupts sleep initiation and maintenance
workup:
- 'Clinical diagnosis: 4 criteria (urge to move, worse at rest, relief with movement,
  worse evening/night)'
- 'Ferritin: Check in all patients, supplement if <75 mcg/L (even if not anemic)'
- 'Polysomnography: If concurrent sleep apnea suspected, shows periodic limb movements
  (PLMs) in 80%'
treatment:
- 'Guideline-based treatment options for Restless Legs Syndrome include:'
- 'Check ferritin: If <75 mcg/L, iron supplementation (ferrous sulfate 325mg BID-TID
  + vitamin C) (AAN 2024)'
- 'Moderate-severe: Pramipexole 0.125mg 2-3h before symptoms, titrate to 0.5mg (or
  ropinirole 0.25-4mg) (AAN 2024)'
- 'Alternative: Gabapentin 300-1800mg qhs (preferred if augmentation, neuropathy,
  or anxiety) (AAN 2024)'
- 'Avoid: Dopamine antagonists (metoclopramide, prochlorperazine), SSRIs, antihistamines
  (AAN 2024)'
- 'Non-pharmacologic: Leg massage, hot bath, moderate exercise, sleep hygiene, avoid
  caffeine/alcohol (AAN 2024)'
clinical_pearls:
- 5-10% prevalence, female predominance 2:1, often family history (60% if onset <40
  years)
- 'Iron deficiency: Low ferritin (<75 mcg/L) worsens RLS, check ferritin in all patients'
- 'Secondary causes: Iron deficiency, pregnancy, ESRD, neuropathy, antidepressants
  (SSRIs)'
- 'First-line: Iron repletion if ferritin <75, then dopamine agonists (pramipexole,
  ropinirole)'
- 'Augmentation: Worsening symptoms with dopamine agonists (earlier onset, more severe)
  - switch to gabapentin'
referrals:
- 'Neurology or sleep medicine if: Refractory to first-line treatment, augmentation,
  unclear diagnosis'
differentials:
  - Peripheral neuropathy
  - Nocturnal leg cramps
  - Akathisia
  - Periodic limb movement disorder
trace:
