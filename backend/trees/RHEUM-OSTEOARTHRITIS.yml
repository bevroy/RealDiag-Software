tree_id: RHEUM-OSTEOARTHRITIS
name: Osteoarthritis
family: Rheumatology
specialty: Rheumatology
chief_complaint: Joint pain and stiffness
description: |
  Degenerative joint disease from articular cartilage breakdown. Most common arthritis (affects 50% of people >65).
  Risk factors: age, obesity, prior joint injury, repetitive joint use, genetics. Weight-bearing joints most affected (knees, hips, spine).
icd10: M19.90
urgency: Low
workup:
  - Clinical diagnosis: joint pain worsening with activity, morning stiffness <30 minutes, bony enlargement
  - X-ray of affected joint: joint space narrowing, osteophytes (bone spurs), subchondral sclerosis, subchondral cysts
  - No lab tests needed for diagnosis (normal ESR, CRP distinguishes from inflammatory arthritis)
  - Synovial fluid analysis if effusion present: non-inflammatory (<2000 WBC/mm³), negative crystals
  - Consider rheumatoid factor and anti-CCP if inflammatory features present (to rule out RA)
treatment:
  - Non-pharmacologic (first-line): weight loss if obese (5-10% reduction improves pain), physical therapy to strengthen periarticular muscles
  - Low-impact exercise: swimming, cycling, tai chi (improves function without worsening joint damage)
  - Assistive devices: cane, walker, knee brace, shoe inserts
  - Pharmacologic: acetaminophen 1000mg TID-QID for mild pain (first-line oral agent)
  - NSAIDs if inadequate acetaminophen response: ibuprofen 600-800mg TID, naproxen 500mg BID (limit duration, GI and CV risks)
  - Topical NSAIDs (diclofenac gel) for knee/hand OA if unable to tolerate oral NSAIDs
  - Intra-articular corticosteroid injections for moderate-severe pain (triamcinolone 40mg, effective 6-12 weeks)
  - Duloxetine 30-60mg daily for chronic OA pain (especially if contraindication to NSAIDs)
  - Joint replacement (total knee or hip arthroplasty) if: severe pain despite conservative treatment, functional impairment, reduced quality of life
clinical_pearls:
  - Heberden's nodes: bony enlargement of DIP joints (classic for OA, distinguishes from RA which affects MCPs and PIPs)
  - Bouchard's nodes: bony enlargement of PIP joints
  - Morning stiffness <30 minutes (vs RA where stiffness >60 minutes)
  - Glucosamine and chondroitin not recommended (ineffective per AAOS guidelines)
  - Avoid intra-articular hyaluronic acid injections (inconsistent evidence, not recommended by AAOS)
  - Opioids not recommended for chronic OA pain (risks outweigh benefits)
differentials:
  - Rheumatoid arthritis
  - Psoriatic arthritis
  - Gout
  - Pseudogout (calcium pyrophosphate deposition)
  - Septic arthritis
  - Avascular necrosis
trace:
  - Knee pain worsening with activity → Morning stiffness <30 minutes, crepitus on exam → X-ray shows joint space narrowing and osteophytes → Diagnose knee osteoarthritis → Weight loss and physical therapy → Acetaminophen 1000mg TID → Inadequate relief → Add naproxen 500mg BID → Persistent pain → Intra-articular steroid injection → Relief for 8 weeks → Recurrent severe pain, functional impairment → Refer orthopedics for total knee replacement
