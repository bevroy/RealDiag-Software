tree_id: OPHT-MACULAR-DEGENERATION
name: Age-Related Macular Degeneration
family: ophthalmology
specialty: Ophthalmology
icd10_code: H35.30

presentations:
  - Gradual central vision loss
  - Difficulty reading or recognizing faces
  - Distortion of straight lines (metamorphopsia)
  - Dark or empty area in central vision (scotoma)
  - Need for brighter light for reading
  - Difficulty adapting to low light levels
  - Decreased color perception
  - Age >50 years
  - Usually bilateral but asymmetric
  - Acute vision loss (if wet AMD with hemorrhage)

workup:
  - History:
    - Age and family history of AMD
    - Smoking history (strongest modifiable risk factor)
    - Cardiovascular disease history
    - Dietary history (antioxidant intake)
    - Current medications and supplements
    - Timeline and pattern of vision changes
  - Physical exam:
    - Best corrected visual acuity
    - Amsler grid testing (metamorphopsia, scotoma)
    - Dilated fundus examination
    - Drusen (yellow deposits under retina)
    - Retinal pigment epithelium changes
    - Geographic atrophy (dry AMD)
    - Subretinal fluid or hemorrhage (wet AMD)
    - Intraocular pressure measurement
  - Diagnostic studies:
    - Optical coherence tomography (OCT) - detects subretinal fluid, drusen, atrophy
    - Fundus autofluorescence imaging
    - Fluorescein angiography (if wet AMD suspected)
    - OCT angiography (non-invasive alternative to FA)
  - Classification:
    - Early AMD Medium drusen, no pigmentary changes
    - Intermediate AMD Large drusen and/or pigmentary changes
    - Late AMD Geographic atrophy (dry) or neovascular (wet)

treatment:
  dry_amd:
    - AREDS2 supplementation (if intermediate or advanced AMD in one eye)
    - Vitamin C 500mg, Vitamin E 400 IU, Lutein 10mg, Zeaxanthin 2mg, Zinc 80mg, Copper 2mg daily
    - Smoking cessation counseling
    - Cardiovascular risk factor management
    - Diet rich in leafy greens and fish (Mediterranean diet)
    - Regular monitoring with Amsler grid at home
    - Low vision rehabilitation if vision loss significant
  wet_amd:
    - Anti-VEGF intravitreal injections (first-line)
    - Bevacizumab (Avastin) off-label, low cost
    - Ranibizumab (Lucentis) FDA-approved
    - Aflibercept (Eylea) FDA-approved, longer duration
    - Brolucizumab (Beovu) newer agent, less frequent dosing
    - Faricimab (Vabysmo) bispecific antibody, extended intervals
    - Injection frequency initially monthly, then PRN or treat-and-extend protocols
    - Photodynamic therapy (PDT) with verteporfin (rarely used, specific cases)
    - Urgent ophthalmology referral if new wet AMD diagnosed
  monitoring:
    - Home Amsler grid daily (report new distortion immediately)
    - Dilated eye exam every 6-12 months for dry AMD
    - OCT monitoring every 1-3 months for wet AMD on treatment
    - Patient education on warning signs
  vision_rehabilitation:
    - Low vision aids (magnifiers, telescopes)
    - Increased lighting for tasks
    - Large print materials
    - Assistive technology (screen readers, voice-activated devices)
    - Occupational therapy referral
    - Support groups

clinical_pearls:
  - AMD is leading cause of irreversible blindness in developed countries, affecting >10 million Americans
  - Dry AMD accounts for 85-90% of cases, wet AMD for 10-15%
  - Wet AMD causes 90% of severe vision loss from AMD despite being minority of cases
  - Smoking increases AMD risk 2-3 fold and accelerates progression
  - Drusen are extracellular deposits between RPE and Bruch membrane
  - Anti-VEGF therapy has revolutionized wet AMD treatment, can stabilize or improve vision in 90%
  - AREDS2 formula reduces progression to advanced AMD by 25% in high-risk patients
  - Do not give beta-carotene to current/former smokers (increased lung cancer risk) - use lutein/zeaxanthin instead
  - New onset distortion or scotoma requires urgent ophthalmology evaluation (wet AMD conversion)
  - Geographic atrophy (dry AMD) currently has no proven treatment but multiple therapies in clinical trials
  - Complement factor H (CFH) and ARMS2 genetic variants increase AMD risk
  - Peripheral vision typically preserved, allowing ambulation
  - Binocular vision often maintained even with severe AMD in one eye
  - OCT has replaced fluorescein angiography for AMD diagnosis and monitoring in many cases

trace:
  - AREDS and AREDS2 trials for nutritional supplementation in AMD
  - Anti-VEGF therapy efficacy and treatment protocols for wet AMD
  - Risk factors and prevention strategies for AMD
  - OCT imaging findings in dry and wet AMD

citations:
  - Age-Related Eye Disease Study 2 Research Group. (2013). Lutein + zeaxanthin and omega-3 fatty acids for age-related macular degeneration: the AREDS2 randomized clinical trial. JAMA, 309(19), 2005-15.
  - Rosenfeld PJ, et al. (2006). Ranibizumab for neovascular age-related macular degeneration. N Engl J Med, 355(14), 1419-31.
  - Flaxel CJ, et al. (2020). Age-Related Macular Degeneration Preferred Practice Pattern®. Ophthalmology, 127(1), P1-P65.
