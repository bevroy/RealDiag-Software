tree_id: CARD-ACUTE-MI
name: Acute Myocardial Infarction and Acute Coronary Syndrome
family: Cardiology
specialty: Emergency Medicine, Cardiology
chief_complaint: Chest Pain, Suspected ACS
description: Comprehensive evaluation and management of acute coronary syndrome (STEMI, NSTEMI, unstable angina) with risk stratification and treatment protocols
version: "1.0"
icd10: I21.9
author: RealDiag Clinical Team

entry_point: acs_presentation

nodes:
  - id: acs_presentation
    type: question
    text: "Patient presentation with suspected ACS?"
    options:
      - label: "Ongoing chest pain or equivalent AND ST-elevation on ECG"
        next: stemi_diagnosis
      - label: "Chest pain with troponin elevation but no ST-elevation"
        next: nstemi_risk_stratify
      - label: "Chest pain with normal troponins but high-risk features"
        next: unstable_angina_assess

  - id: stemi_diagnosis
    type: diagnosis
    name: "ST-Elevation Myocardial Infarction (STEMI)"
    icd10: "I21.3"
    urgency: critical
    workup:
      - STAT ECG (ST-elevation ≥1mm in 2+ contiguous leads or new LBBB)
      - Troponin I or T (will be elevated)
      - CBC, CMP, coagulation studies
      - Chest X-ray (portable)
      - Echocardiogram (after reperfusion)
      - Coronary angiography
    treatment:
      - IMMEDIATE reperfusion therapy (door-to-balloon <90 min or door-to-needle <30 min)
      - Primary PCI preferred if available within 120 minutes
      - Fibrinolysis if PCI not available (tPA, tenecteplase, reteplase) - contraindications include prior ICH, recent major surgery, active bleeding
      - Dual antiplatelet therapy (Aspirin 325mg chewed + P2Y12 inhibitor - ticagrelor 180mg or prasugrel 60mg or clopidogrel 600mg)
      - Anticoagulation (heparin bolus 60 units/kg then 12 units/kg/hr OR bivalirudin)
      - Nitroglycerin IV if hypertensive or ongoing chest pain (avoid if RV infarct, hypotension, or recent PDE5 inhibitor use)
      - Beta-blocker (metoprolol 5mg IV q5min x3 then 25-50mg PO q6h) - avoid if cardiogenic shock, bradycardia, or heart block
      - Statin (atorvastatin 80mg or rosuvastatin 40mg)
      - ACE inhibitor within 24 hours if EF <40% or anterior MI
      - Oxygen only if SpO2 <90%
      - Morphine 2-4mg IV for pain (use cautiously)
      - Cardiology consultation for emergent catheterization
      - CCU admission

  - id: nstemi_risk_stratify
    type: question
    text: "NSTEMI risk stratification - High-risk features present?"
    options:
      - label: "Yes - Hemodynamic instability, ongoing chest pain, dynamic ST changes, elevated troponin >10x ULN, or GRACE score >140"
        next: high_risk_nstemi
      - label: "No - Stable with moderate troponin elevation, GRACE score 109-140"
        next: moderate_risk_nstemi
      - label: "No - Stable with minimal troponin elevation, GRACE score <109"
        next: low_risk_nstemi

  - id: high_risk_nstemi
    type: diagnosis
    name: "High-Risk NSTEMI"
    icd10: "I21.4"
    urgency: critical
    workup:
      - Serial ECGs (q15-30min if ongoing symptoms)
      - Serial troponins (0hr, 3hr, 6hr)
      - CBC, CMP, lipid panel, HbA1c
      - Chest X-ray
      - Echocardiogram (assess EF and wall motion)
      - GRACE score calculation
      - Coronary angiography within 24 hours
    treatment:
      - Dual antiplatelet therapy (Aspirin 325mg + ticagrelor 180mg or prasugrel 60mg)
      - Anticoagulation (enoxaparin 1mg/kg SC q12h OR fondaparinux 2.5mg SC daily OR heparin infusion)
      - High-intensity statin (atorvastatin 80mg daily)
      - Beta-blocker (metoprolol 25-50mg PO q6h, hold if hypotensive or HR <60)
      - ACE inhibitor or ARB
      - Nitroglycerin IV if hypertensive or ongoing chest pain
      - Early invasive strategy - cardiac catheterization within 24 hours
      - Consider GP IIb/IIIa inhibitor (eptifibatide or tirofiban) if high thrombus burden at cath
      - CCU or telemetry admission
      - Cardiology consultation

  - id: moderate_risk_nstemi
    type: diagnosis
    name: "Moderate-Risk NSTEMI"
    icd10: "I21.4"
    urgency: high
    workup:
      - Serial troponins
      - ECG monitoring (telemetry)
      - Echocardiogram
      - Stress test or coronary CT angiography if anatomy unknown
      - Lipid panel, HbA1c
      - GRACE score
    treatment:
      - Dual antiplatelet therapy (Aspirin 81-325mg + clopidogrel 300-600mg or ticagrelor 180mg)
      - Anticoagulation (enoxaparin or fondaparinux)
      - High-intensity statin
      - Beta-blocker
      - ACE inhibitor or ARB
      - Invasive strategy within 72 hours (angiography)
      - Telemetry monitoring
      - Risk factor modification counseling

  - id: low_risk_nstemi
    type: diagnosis
    name: "Low-Risk NSTEMI"
    icd10: "I21.4"
    urgency: high
    workup:
      - Serial troponins to trend
      - ECG monitoring
      - Echocardiogram
      - Stress test (exercise or pharmacologic)
      - Coronary CT angiography (alternative)
      - Lipid panel, HbA1c
    treatment:
      - Dual antiplatelet therapy (Aspirin 81mg + clopidogrel 75mg daily)
      - Beta-blocker
      - High-intensity statin
      - ACE inhibitor or ARB if EF <40% or hypertension
      - Conservative strategy with ischemia-guided approach
      - Consider elective angiography if positive stress test
      - Cardiology follow-up as outpatient
      - Aggressive risk factor modification

  - id: unstable_angina_assess
    type: question
    text: "Unstable angina assessment - High-risk features?"
    options:
      - label: "Yes - Prolonged rest pain >20 min, dynamic ECG changes, TIMI risk score ≥5"
        next: high_risk_unstable_angina
      - label: "No - Brief chest pain episodes, TIMI risk score 3-4"
        next: moderate_risk_unstable_angina
      - label: "No - Minimal symptoms, TIMI risk score 0-2"
        next: low_risk_unstable_angina

  - id: high_risk_unstable_angina
    type: diagnosis
    name: "High-Risk Unstable Angina"
    icd10: "I20.0"
    urgency: high
    workup:
      - Serial troponins (must be negative for UA diagnosis)
      - Serial ECGs
      - Stress test or coronary angiography
      - Echocardiogram
      - TIMI risk score
    treatment:
      - Dual antiplatelet therapy (Aspirin + clopidogrel or ticagrelor)
      - Anticoagulation (enoxaparin or fondaparinux)
      - Beta-blocker
      - Statin
      - Nitroglycerin SL or IV for symptoms
      - Early invasive strategy - angiography within 24-48 hours
      - Hospital admission with telemetry
      - Cardiology consultation

  - id: moderate_risk_unstable_angina
    type: diagnosis
    name: "Moderate-Risk Unstable Angina"
    icd10: "I20.0"
    urgency: high
    workup:
      - Serial troponins
      - ECG monitoring
      - Stress test (when pain-free for 12-24 hours)
      - Echocardiogram
    treatment:
      - Aspirin 81-325mg daily
      - Clopidogrel 75mg daily
      - Beta-blocker
      - Statin
      - Nitroglycerin SL PRN
      - Hospital observation unit or telemetry
      - Stress test before discharge
      - Cardiology follow-up

  - id: low_risk_unstable_angina
    type: diagnosis
    name: "Low-Risk Unstable Angina"
    icd10: "I20.0"
    urgency: medium
    workup:
      - Troponin at 0hr and 3-6hr
      - ECG
      - Stress test (exercise preferred)
      - Consider coronary CT angiography
    treatment:
      - Aspirin 81mg daily
      - Beta-blocker
      - Statin
      - Nitroglycerin SL PRN
      - Observation with early stress testing (within 72 hours)
      - Discharge if stress test negative
      - Outpatient cardiology follow-up
