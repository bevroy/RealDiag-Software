tree_id: NEURO-TRANSIENT-ISCHEMIC-ATTACK
name: Transient Ischemic Attack
family: Neurology
specialty: Neurology
chief_complaint: Brief episode of neurologic dysfunction
description: |
  Transient neurologic deficit from focal cerebral ischemia lasting less than 24 hours (typically less than 1 hour). No permanent infarction on imaging.
  Warning sign for stroke - 10-15% risk of stroke within 90 days, highest risk in first 48 hours.
icd10: G45.9
urgency: High
workup:
  - Urgent evaluation to prevent stroke - admit or evaluate in TIA clinic within 24 hours
  - MRI brain with diffusion-weighted imaging (DWI) most sensitive for acute infarction (50% of TIAs show infarct on DWI)
  - CT head without contrast if MRI unavailable (less sensitive, rule out hemorrhage)
  - Carotid ultrasound or CTA neck to assess for carotid stenosis
  - ECG and telemetry monitoring for atrial fibrillation
  - Echocardiogram (transthoracic or transesophageal) if cardiac source suspected
  - ABCD2 score predicts stroke risk (Age, Blood pressure, Clinical features, Duration, Diabetes) - score 4 or higher is high risk
  - Complete blood count, basic metabolic panel, lipid panel, HbA1c, coagulation studies
treatment:
  - Aspirin 325mg immediately (or dual antiplatelet with clopidogrel 300-600mg loading if high risk)
  - Dual antiplatelet therapy (aspirin 81mg plus clopidogrel 75mg daily) for 21 days if high-risk TIA or minor stroke, then aspirin monotherapy
  - High-intensity statin (atorvastatin 80mg or rosuvastatin 40mg) regardless of cholesterol level
  - Blood pressure control - target less than 140/90 mmHg (less than 130/80 if diabetes or CKD)
  - Anticoagulation with DOAC if atrial fibrillation (apixaban, rivaroxaban, edoxaban, dabigatran)
  - Carotid endarterectomy (CEA) or stenting if symptomatic carotid stenosis 70-99% (perform within 2 weeks)
  - Diabetes management (HbA1c target less than 7%)
  - Lifestyle modifications - smoking cessation, weight loss, exercise, Mediterranean diet
clinical_pearls:
  - Common presentations include unilateral weakness, numbness, aphasia, dysarthria, vision loss (amaurosis fugax), ataxia, vertigo
  - Crescendo TIAs (multiple episodes in short time) indicate very high stroke risk
  - Posterior circulation TIAs may present with diplopia, vertigo, ataxia, bilateral weakness
  - Mimics include migraine aura, seizure, hypoglycemia, syncope, peripheral neuropathy
  - Tissue-based definition (no infarct on imaging) replaced time-based definition (less than 24 hours)
  - Secondary stroke prevention requires addressing all modifiable risk factors
differentials:
  - Ischemic stroke
  - Migraine with aura
  - Seizure (Todd's paralysis)
  - Hypoglycemia
  - Bell's palsy
  - Multiple sclerosis
trace:
  - Right arm weakness and slurred speech x 15 minutes, resolved completely → Urgent MRI brain shows small DWI lesion in left MCA territory → Carotid ultrasound shows 40% left ICA stenosis → ECG shows sinus rhythm → Diagnose TIA → Aspirin 325mg loading, then dual antiplatelet (aspirin 81mg plus clopidogrel 75mg) x 21 days → Atorvastatin 80mg → Blood pressure control with lisinopril → Smoking cessation counseling → Neurology follow-up
