tree_id: DERM-SUNBURN
name: Sunburn
family: Dermatology
specialty: Dermatology/Primary Care/Emergency Medicine
chief_complaint: Painful red skin after sun exposure
description: Acute inflammatory reaction of the skin from excessive ultraviolet (UV) radiation exposure. Ranges from mild erythema to severe burns with blisters. Treatment is supportive. Prevention through sun protection critical to reduce skin cancer risk.
icd10: L55.9
snomed: 23346002
presentations:
  - Erythema (redness) 2-6 hours after exposure
  - Pain, tenderness
  - Edema
  - Blistering (second-degree)
  - Peeling 3-8 days later
  - Distribution matches sun-exposed areas
  - Systemic symptoms if severe (fever, chills, nausea)
urgency: routine
referrals:
  emergency:
    - Extensive second-degree burns (greater than 20% BSA)
    - Systemic symptoms (high fever, confusion, severe dehydration)
    - Signs of infection
  urgent:
    - Moderate to severe burns requiring wound care
    - Failed outpatient management
  routine:
    - Mild sunburn
    - Sun protection counseling

workup:
  - Clinical diagnosis based on history and examination
  - History
  - Recent sun exposure - duration, intensity (midday sun strongest), location (beach, pool, skiing, high altitude)
  - Protective measures used - sunscreen (SPF, reapplication), protective clothing, shade
  - Time course - erythema appears 2-6 hours post-exposure, peaks 12-24 hours, starts resolving 48-72 hours
  - Prior sunburns - history of multiple sunburns increases melanoma risk
  - Medications - photosensitizing drugs (tetracyclines, NSAIDs, thiazides, sulfonamides, fluoroquinolones)
  - Skin type (Fitzpatrick classification)
  - Type I (always burns, never tans) - pale white, red/blond hair, blue eyes, freckles
  - Type II (burns easily, tans minimally) - white, fair skin
  - Type III (burns moderately, tans uniformly) - white to olive
  - Type IV-VI (burns minimally or not at all, tans easily) - brown to black skin
  - Classification by severity
  - First-degree sunburn (superficial epidermal)
  - Erythema, pain, tenderness
  - No blisters
  - Dry, warm skin
  - Peels in 3-8 days
  - Heals without scarring
  - Second-degree sunburn (partial-thickness)
  - Intense erythema, severe pain
  - Blisters (fluid-filled vesicles or bullae)
  - Edema
  - Moist, weeping surface if blisters rupture
  - Increased risk of infection
  - Heals in 2-3 weeks, may scar if infected or picked
  - Severe sunburn (rare, extensive second-degree)
  - Large areas affected
  - Systemic symptoms - fever, chills, nausea, vomiting, headache, confusion (sun poisoning)
  - Dehydration
  - May require hospitalization
  - Physical examination
  - Erythema in sun-exposed distribution - face, neck, shoulders, arms, upper back, legs
  - Sharp demarcation where clothing covered skin
  - Tenderness to touch
  - Blisters if second-degree (intact or ruptured)
  - Edema especially facial if severe
  - Peeling/desquamation if several days post-exposure
  - Vital signs if severe - fever, tachycardia (dehydration)
  - Assessment of body surface area (BSA) involved
  - Rule of nines for adults
  - Important for determining severity and need for hospitalization
  - Complications
  - Dehydration - fluid shifts to skin, increased insensible losses
  - Infection - especially if blisters ruptured, impetiginized
  - Heat exhaustion or heat stroke - if prolonged sun exposure
  - Long-term - photoaging, solar elastosis, actinic keratosis, skin cancer (basal cell, squamous cell, melanoma)
treatment:
  - Supportive care - no cure, treatment focuses on symptom relief
  - Mild first-degree sunburn (outpatient)
  - Cool compresses - cool (not ice) water compresses to affected areas 15-20 minutes several times daily
  - Reduces heat, pain, inflammation
  - Cool baths - add colloidal oatmeal (Aveeno) or baking soda to soothe skin
  - Topical emollients/moisturizers
  - Aloe vera gel - soothes, moisturizes, anti-inflammatory properties
  - Apply liberally several times daily
  - Avoid petroleum-based products initially (trap heat)
  - Once cooling phase passed (24-48 hours), thick moisturizers (petroleum jelly, Aquaphor, CeraVe) to prevent excessive dryness and peeling
  - Topical anesthetics (limited role)
  - Lidocaine spray or gel - provides temporary pain relief
  - Avoid benzocaine (risk of methemoglobinemia, contact dermatitis)
  - Oral analgesics
  - NSAIDs (ibuprofen 400-600 mg every 6 hours, naproxen 500 mg twice daily)
  - Reduce pain and inflammation
  - Start within 24 hours of burn for maximum benefit
  - Acetaminophen alternative if NSAIDs contraindicated
  - Oral antihistamines - for pruritus during healing phase
  - Diphenhydramine 25-50 mg every 6 hours (sedating)
  - Cetirizine 10 mg daily or loratadine 10 mg daily (non-sedating)
  - Hydration
  - Encourage oral fluids - sunburn increases insensible water losses
  - Water, sports drinks (electrolytes)
  - Avoid sun - stay out of sun until healed, further exposure worsens burn
  - Second-degree sunburn (blisters)
  - Blister care
  - Leave intact blisters alone - provide natural sterile barrier
  - If blister spontaneously ruptures - gently clean with soap and water, apply antibiotic ointment (bacitracin, mupirocin), cover with non-stick dressing
  - Large tense blisters causing significant discomfort - may drain under sterile technique (not in ED unless very large)
  - Clean roof of blister intact after draining to protect underlying dermis
  - Topical antibiotics - to ruptured blisters to prevent infection (bacitracin or mupirocin)
  - Pain management - oral NSAIDs as above, may require opioids if severe
  - Systemic corticosteroids - controversial, limited evidence
  - Consider short course (prednisone 40-60 mg daily x 3-5 days) for extensive second-degree burns
  - May reduce inflammation and pain
  - Must start within 24 hours to be effective
  - Severe sunburn with systemic symptoms
  - IV hydration - if unable to tolerate oral fluids, signs of dehydration
  - Hospitalization - if greater than 20% BSA with second-degree burns, severe pain, dehydration, systemic symptoms
  - Wound care - similar to thermal burns
  - Complications management
  - Infection - if signs of infection (increasing erythema, purulence, fever, lymphangitis), oral antibiotics (cephalexin 500 mg four times daily x 7-10 days)
  - Avoid
  - Butter or petroleum jelly initially (trap heat, worsen burn)
  - Ice directly on skin (further tissue damage)
  - Topical anesthetics with benzocaine (methemoglobinemia, sensitization)
  - Breaking intact blisters unnecessarily
  - Further sun exposure during healing
  - Prevention (critical counseling)
  - Sunscreen - SPF 30 or higher, broad-spectrum (UVA and UVB), apply 15-30 minutes before exposure, reapply every 2 hours and after swimming/sweating
  - Sun-protective clothing - long sleeves, pants, wide-brimmed hat, UV-blocking sunglasses
  - Seek shade - especially during peak hours (10 AM - 4 PM)
  - Avoid tanning beds - increase melanoma risk
  - Sun protection year-round, even cloudy days (80% UV penetrates clouds)
  - Children especially vulnerable - avoid direct sun in infants under 6 months, aggressive sun protection in children
clinical_pearls:
  - Sunburn is first-degree or second-degree burn caused by UV radiation (primarily UVB)
  - Delayed onset - erythema appears 2-6 hours after exposure, peaks 12-24 hours (unlike thermal burns which are immediate)
  - Treatment is supportive - cool compresses, aloe, NSAIDs, hydration
  - Blistering indicates second-degree burn - increased infection risk
  - Leave intact blisters alone (natural barrier), apply antibiotic ointment if ruptured
  - Topical corticosteroids NOT recommended (no evidence of benefit)
  - Systemic corticosteroids controversial - consider only for extensive second-degree burns within 24 hours
  - Most sunburns heal without complications in 1-2 weeks
  - Long-term consequences - each sunburn increases skin cancer risk, especially melanoma
  - Five or more sunburns doubles melanoma risk
  - Photoaging - premature aging, wrinkles, solar elastosis from cumulative sun damage
  - Prevention critical - sunscreen SPF 30+, protective clothing, avoid peak hours
  - Photosensitizing medications increase sunburn risk - tetracyclines, NSAIDs, thiazides, sulfonamides
  - Fair-skinned individuals (Fitzpatrick I-II) most susceptible
  - Children - one blistering sunburn in childhood doubles lifetime melanoma risk
differentials:
  - Contact dermatitis (phototoxic reaction) - from photosensitizing substance (lime juice, perfumes) + sun exposure, sharper borders than typical sunburn
  - Photoallergic reaction - allergic reaction to medication + sun, eczematous, may extend beyond sun-exposed areas
  - Polymorphous light eruption - recurrent pruritic rash after sun exposure, papules/vesicles not uniform erythema
  - Lupus erythematosus (photosensitive rash) - malar or discoid rash, systemic symptoms, positive autoantibodies
  - Thermal burn - immediate onset (not delayed), clear heat source, may not match sun-exposed distribution
  - Cellulitis - more localized, tender, warmth, often unilateral, lymphangitis, fever
trace:
  - 32-year-old fair-skinned woman (Fitzpatrick type II) presents to urgent care with severe sunburn after spending 6 hours at beach yesterday
  - Forgot to reapply sunscreen after swimming
  - Noticed redness last evening around 6 PM (6 hours post-exposure), progressively worsened overnight
  - Now has severe pain, blisters on shoulders and upper back, difficulty sleeping due to pain
  - Took ibuprofen 400 mg this morning with minimal relief
  - No fever, no nausea, able to drink fluids
  - Past medical history - none
  - Medications - none
  - Physical examination - diffuse erythema on face, neck, anterior chest, shoulders, upper back, and arms in sun-exposed distribution with sharp demarcation where bathing suit covered skin
  - Multiple intact blisters (5-20 mm) on bilateral shoulders and upper back (most severe areas)
  - Skin warm, tender to light touch
  - No facial edema, no signs of infection, no lymphangitis
  - Estimate 15-20% BSA affected with second-degree burns
  - Vital signs - temp 37.8°C, BP 118/76, HR 88, well-hydrated
  - Diagnosis - Second-degree sunburn (partial-thickness) of face, neck, chest, shoulders, upper back, and arms
  - Treatment plan
  - Oral NSAIDs - ibuprofen 600 mg every 6 hours x 3-5 days (higher dose than she was taking, anti-inflammatory effect)
  - Cool compresses - apply cool wet towels to affected areas 15-20 minutes every few hours
  - Aloe vera gel - apply liberally to all affected areas 3-4 times daily
  - Blister care - leave intact blisters alone, do not pop, if spontaneously rupture clean gently and apply bacitracin ointment and cover with non-stick dressing
  - Antihistamine - diphenhydramine 25 mg at bedtime for itch and to help sleep
  - Hydration - drink plenty of water (8-10 glasses daily)
  - Avoid further sun exposure until healed
  - Return if signs of infection (increasing redness, pus, fever, red streaks)
  - At 3 days - pain improved 60%, still uncomfortable but sleeping better with diphenhydramine, some blisters on shoulders spontaneously ruptured, following blister care instructions, no signs of infection
  - Continue current regimen
  - At 1 week - pain minimal, blisters healing, peeling started on shoulders and back
  - Advised to apply thick moisturizer (Aquaphor) to peeling areas, continue sun avoidance
  - At 2 weeks - complete healing, residual hyperpigmentation on shoulders that will fade over weeks to months
  - Extensive counseling on sun protection to prevent future burns and reduce skin cancer risk - SPF 50+ sunscreen applied 30 minutes before sun exposure and reapplied every 2 hours and after swimming, wear UV-protective rashguard at beach, avoid sun from 10 AM-4 PM, annual full-body skin exam given multiple severe sunburns

citations:
  - AAD (American Academy of Dermatology) Sun Protection Guidelines
  - ABA (American Burn Association) Practice Guidelines
  - UpToDate - Dermatology
