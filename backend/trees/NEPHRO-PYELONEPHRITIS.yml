tree_id: NEPHRO-PYELONEPHRITIS
name: Acute Pyelonephritis
family: Nephrology
specialty: Nephrology
icd10:
- N10
- N12
snomed:
- '45816000'
urgency: urgent
description: Comprehensive evaluation and management of Acute Pyelonephritis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Fever and chills
- Flank pain
- CVA tenderness
- Dysuria and urinary frequency
- Nausea and vomiting
workup:
- Urinalysis (pyuria, WBC casts, bacteriuria)
- Urine culture (before antibiotics)
- Blood cultures if admitted or severe
- CT abdomen/pelvis with IV contrast if complicated or no improvement in 48-72hr (rule
  out abscess, obstruction)
- Renal ultrasound if pregnant (avoid radiation)
treatment:
- 'Guideline-based treatment options for Acute Pyelonephritis include:'
- 'Outpatient: Ciprofloxacin 500mg PO BID x 7 days or levofloxacin 750mg daily x 5
  days (KDIGO 2024)'
- 'Alternative: Ceftriaxone 1g IV/IM x 1 dose, then cefpodoxime or ciprofloxacin PO
  (KDIGO 2024)'
- 'Inpatient: Ceftriaxone 1-2g IV daily or fluoroquinolone IV (levofloxacin 750mg)
  (KDIGO 2024)'
- 'If severe/septic: Piperacillin-tazobactam 3.375g IV q6h or carbapenem (KDIGO 2024)'
- 'Duration: 7 days (fluoroquinolone) or 10-14 days (beta-lactam) (KDIGO 2024)'
clinical_pearls:
- Upper urinary tract infection (kidney), E. coli causes 80%
- WBC casts pathognomonic for pyelonephritis
- 'Uncomplicated: Young, healthy women - outpatient oral antibiotics'
- 'Complicated: Male, pregnant, catheter, obstruction, immunocompromised - admission
  for IV antibiotics'
- Imaging not needed for uncomplicated; CT if severe or no improvement in 48-72 hours
  (rule out abscess)
- Sepsis can develop rapidly - low threshold for admission
referrals:
- 'Admission if: Sepsis, pregnant, obstruction, immunocompromised, unable to tolerate
  PO, social concerns'
- Urology if obstruction or recurrent infections
- Interventional radiology if abscess needs drainage
differentials: []
trace:
  source: 'Kidney Disease: Improving Global Outcomes (KDIGO) Guidelines, American
    Society of Nephrology (ASN)'
