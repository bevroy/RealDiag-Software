tree_id: GI-PRIMARY-BILIARY-CHOLANGITIS
name: Primary Biliary Cholangitis (PBC)
family: gastroenterology
specialty: Gastroenterology/Hepatology
chief_complaint: Often asymptomatic or fatigue, pruritus
description: Chronic autoimmune cholestatic liver disease causing destruction of small intrahepatic bile ducts
icd10: K74.3
snomed: 31712002
presentations:
  - Pruritus (often first symptom)
  - Fatigue
  - Jaundice (later stages)
  - Xanthomas, xanthelasmas
  - Hepatomegaly
  - Associated autoimmune diseases
urgency: routine
referrals:
  emergency:
    - GI bleeding with instability
    - Acute liver failure
    - Perforated viscus
    - Cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting
  routine:
    - IBS management
    - GERD treatment
    - Screening colonoscopy

workup:
  - Clinical presentation - often detected on routine lab testing
  - Symptoms - fatigue (most common, 50-70%), pruritus (20-70%), jaundice (late finding)
  - Right upper quadrant discomfort, xanthomas/xanthelasmas (10-15%)
  - Laboratory studies
  - Elevated alkaline phosphatase (ALP greater than 1.5x upper limit) - hallmark finding
  - GGT elevated (parallels ALP)
  - Bilirubin initially normal, elevated in advanced disease (poor prognostic sign)
  - Transaminases (ALT/AST) mildly elevated or normal
  - Lipid panel - elevated total cholesterol (especially HDL), elevated triglycerides
  - Antimitochondrial antibody (AMA) - positive in 95% (highly specific)
  - Titer 1:40 or greater, M2 subtype most specific
  - ANA, anti-smooth muscle antibody may be positive (30%)
  - Elevated IgM (50-90% of cases)
  - Complete blood count (thrombocytopenia if portal hypertension)
  - Coagulation studies (PT/INR elevated if advanced disease)
  - Non-invasive fibrosis assessment
  - Transient elastography (FibroScan) - measure liver stiffness
  - FIB-4 or APRI scores
  - Liver biopsy - not required for diagnosis if AMA positive with cholestatic labs
  - Indicated if AMA negative or uncertainty
  - Shows granulomatous destruction of interlobular bile ducts
  - Four histologic stages - I portal, II periportal, III septal fibrosis, IV cirrhosis
  - Imaging
  - Abdominal ultrasound - rule out biliary obstruction, assess liver echotexture, portal hypertension
  - MRCP if concern for secondary causes of cholestasis
  - Screening for complications
  - Bone density (DEXA) - osteoporosis/osteopenia common
  - Fat-soluble vitamin levels (A, D, E, K) - malabsorption in advanced disease
  - Thyroid function (associated autoimmune thyroid disease in 20%)
  - Screen for hepatocellular carcinoma if cirrhosis (ultrasound plus AFP every 6 months)
  - Upper endoscopy for esophageal varices if cirrhosis
treatment:
  - Ursodeoxycholic acid (UDCA) - first-line, proven to slow progression
  - Dose 13-15 mg/kg/day in 2-3 divided doses
  - Improves liver biochemistry, delays histologic progression, improves transplant-free survival
  - Monitor response at 1 year - adequate response if ALP less than 1.67x ULN
  - Obeticholic acid (OCA) - second-line for inadequate responders or intolerant to UDCA
  - FXR agonist, dose 5-10 mg daily
  - Improves ALP and bilirubin in UDCA non-responders
  - Side effect - worsening pruritus (common)
  - Contraindicated in decompensated cirrhosis
  - Fibrates (bezafibrate, fenofibrate) - emerging therapy, reduces ALP and pruritus
  - Off-label use, 200 mg daily
  - Symptomatic management
  - Pruritus treatment (can be debilitating)
  - Cholestyramine 4-16 g daily in divided doses (first-line, bile acid sequestrant)
  - Take 4 hours apart from other medications (binds drugs)
  - Rifampin 150-300 mg BID (second-line)
  - Naltrexone 25-50 mg daily (opioid antagonist)
  - Sertraline 75-100 mg daily (SSRI)
  - Phototherapy (UVB) for refractory pruritus
  - Fatigue management - no proven therapy, trial of UDCA, modafinil off-label
  - Fat-soluble vitamin supplementation if deficiency
  - Vitamin D 800-2000 IU daily, vitamin K if coagulopathy
  - Calcium for bone health, bisphosphonates for osteoporosis
  - Management of cirrhosis complications - ascites, varices, hepatic encephalopathy
  - Liver transplantation for end-stage disease
  - Indications - refractory ascites, variceal bleeding, hepatorenal syndrome, intractable pruritus, bilirubin greater than 6 mg/dL
  - Excellent 5-year survival post-transplant 80-85%
  - Disease can recur in transplanted liver (20-30%)
clinical_pearls:
  - Predominantly affects middle-aged women (90% female), peak age 40-60 years
  - Slowly progressive disease - median survival 10-15 years if untreated
  - UDCA improves prognosis, but 30-40% have inadequate response
  - Bilirubin level most important prognostic factor - elevated bilirubin indicates advanced disease
  - Associated with other autoimmune diseases - Sjogren syndrome (50%), scleroderma (5%), thyroiditis (20%), celiac disease
  - Sicca syndrome (dry eyes, dry mouth) very common - screen for Sjogren
  - Pruritus can be severe and disabling, worse at night, palms and soles
  - No correlation between severity of pruritus and severity of liver disease
  - Hepatocellular carcinoma risk 3-4x general population once cirrhosis develops
  - AMA-negative PBC (5% of cases) - same clinical picture and prognosis, requires biopsy for diagnosis
differentials:
  - Primary sclerosing cholangitis (PSC) - associated with IBD, AMA negative, bile duct strictures on MRCP
  - Secondary biliary cirrhosis (bile duct obstruction) - imaging shows dilated ducts, stone or stricture
  - Autoimmune hepatitis (AIH) - elevated transaminases greater than ALP, ANA/ASMA positive, interface hepatitis on biopsy
  - AIH-PBC overlap syndrome (8-10% of cases) - features of both diseases
  - Drug-induced cholestasis (phenytoin, chlorpromazine) - temporal relationship, resolves off drug
  - Sarcoidosis (granulomas on biopsy, elevated ACE, hilar lymphadenopathy)
  - Non-alcoholic fatty liver disease (metabolic syndrome, AMA negative)
trace:
  - 52-year-old woman presents to PCP with 6-month history of fatigue and generalized itching
  - Fatigue significant, affecting work performance, no improvement with sleep
  - Pruritus worse at night, scratches until bleeding, no rash
  - Denies jaundice, abdominal pain, dark urine
  - No alcohol use, no risk factors for viral hepatitis
  - Past medical history - hypothyroidism on levothyroxine, osteopenia
  - Family history - mother had autoimmune thyroiditis
  - Physical exam - vitals normal, BMI 26
  - No jaundice, no stigmata of chronic liver disease
  - Multiple excoriations on arms and legs from scratching
  - No spider angiomas, no palmar erythema
  - Abdomen - liver edge palpable 2 cm below costal margin, smooth, non-tender, no splenomegaly
  - No ascites, no peripheral edema
  - Routine labs ordered
  - Alkaline phosphatase 456 U/L (markedly elevated, normal less than 120)
  - GGT 340 U/L (elevated)
  - AST 78 U/L (mildly elevated), ALT 95 U/L (mildly elevated)
  - Bilirubin 1.2 mg/dL (normal)
  - Albumin 4.0 g/dL (normal), INR 1.0 (normal)
  - Total cholesterol 280 mg/dL (elevated)
  - Platelet count 185 K/uL (normal)
  - Hepatitis panel - HBsAg negative, anti-HCV negative
  - Antimitochondrial antibody (AMA) - positive titer 1:320 (M2 subtype)
  - ANA positive 1:160 (speckled pattern)
  - IgM 450 mg/dL (elevated, normal less than 300)
  - Abdominal ultrasound - no biliary dilatation, liver normal size and echogenicity, no focal lesions, no ascites
  - Diagnosis - Primary biliary cholangitis (early stage, non-cirrhotic)
  - Referred to hepatology for management
  - Hepatology evaluation - FibroScan performed, liver stiffness 7.2 kPa (F1-F2 fibrosis, not cirrhotic)
  - DEXA scan - osteopenia confirmed (T-score -1.8 lumbar spine)
  - Vitamin D level 18 ng/mL (deficient)
  - Treatment initiated
  - Ursodeoxycholic acid (UDCA) 15 mg/kg/day = 900 mg daily in 3 divided doses (300 mg TID)
  - Cholestyramine 4 g BID for pruritus (take 4 hours apart from other meds)
  - Vitamin D3 2000 IU daily for deficiency
  - Calcium carbonate 600 mg BID for bone health
  - Hydroxyzine 25 mg at bedtime for pruritus and sleep
  - 3-month follow-up - significant improvement in pruritus (down to 2/10 from 8/10)
  - Fatigue slightly improved
  - Labs - ALP decreased to 280 U/L (improving but still elevated)
  - Continue UDCA, cholestyramine
  - 1-year follow-up - continued improvement
  - Pruritus well-controlled, fatigue improved
  - Labs - ALP 180 U/L (down from 456), still 1.5x ULN
  - Bilirubin normal 0.9 mg/dL, albumin normal, INR normal
  - UDCA response adequate (ALP less than 1.67x ULN)
  - Repeat FibroScan - stable at 7.5 kPa (no progression)
  - Continue UDCA indefinitely
  - Annual monitoring of liver function, consider repeat imaging in 2-3 years
  - Outcome - Good response to UDCA, stable disease, improved quality of life

citations:
  - ACG (American College of Gastroenterology) Clinical Guidelines
  - AGA (American Gastroenterological Association) Clinical Practice Updates
