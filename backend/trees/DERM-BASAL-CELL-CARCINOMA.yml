tree_id: DERM-BASAL-CELL-CARCINOMA
name: Basal Cell Carcinoma
family: Dermatology
specialty: Dermatology
chief_complaint: Non-healing skin lesion on sun-exposed area
description: |
  Most common skin cancer, rarely metastasizes but locally invasive. Arises from basal layer of epidermis.
  Risk factors UV exposure, fair skin, immunosuppression. Subtypes nodular (most common), superficial, morpheaform (aggressive), pigmented.
icd10: C44.91
snomed: 254701007
urgency: Low
workup:
  - Clinical diagnosis confirmed by biopsy - shave or punch biopsy of representative area
  - Classic appearance - pearly, translucent papule or nodule with rolled borders, telangiectasias, central ulceration (rodent ulcer)
  - Dermoscopy aids diagnosis - arborizing vessels, blue-gray ovoid nests, ulceration
  - Histopathology shows basaloid cells with peripheral palisading, retraction artifact
  - Determine subtype - nodular (60%), superficial (30%), morpheaform/infiltrative (5-10%, aggressive with ill-defined borders)
  - Assess size, location, depth - high-risk features include size greater than 2 cm, location on face (H-zone: central face, eyelids, ears, nose, lips), poorly defined borders, recurrent tumor, perineural invasion
  - Imaging (CT or MRI) only if concern for deep invasion or bone involvement (rare)
treatment:
  - Surgical excision first-line for most BCCs - standard excision with 4 mm margins for low-risk lesions (95-98% cure)
  - Mohs micrographic surgery for high-risk lesions - tissue-sparing with real-time margin assessment, 99% cure rate
  - Indications for Mohs - facial lesions (cosmetic/functional preservation), recurrent tumors, aggressive histologic subtypes, size greater than 2 cm, poorly defined borders
  - Electrodesiccation and curettage (ED&C) for small (less than 1 cm) low-risk nodular or superficial BCCs on trunk or extremities - 95% cure, leaves hypopigmented scar
  - Cryotherapy for small superficial BCCs - liquid nitrogen, may need multiple treatments
  - Topical therapies for low-risk superficial BCCs - imiquimod 5% cream 5x weekly x 6 weeks (80-85% clearance) or 5-fluorouracil cream BID x 4-6 weeks
  - Radiation therapy if poor surgical candidate or unresectable - 90% local control, cosmetically inferior to surgery
  - Hedgehog pathway inhibitors for locally advanced or metastatic BCC - vismodegib 150mg daily or sonidegib 200mg daily (significant side effects: muscle cramps, dysgeusia, alopecia)
  - Follow-up - skin exam every 6-12 months, 30-50% develop second BCC within 5 years
  - Sun protection - daily broad-spectrum SPF 30+, protective clothing, avoid midday sun
clinical_pearls:
  - Most common cancer worldwide, incidence increasing (UV exposure, aging population)
  - Metastasis extremely rare (less than 0.1%), but local destruction can be significant (especially near eyes, nose, ears)
  - Multiple BCCs suggest genetic syndrome (basal cell nevus syndrome/Gorlin syndrome) or immunosuppression
  - Morpheaform (sclerosing) subtype appears as flat scar-like plaque, difficult to see margins, higher recurrence
  - Pigmented BCC can mimic melanoma, diagnosis by biopsy
  - Perineural invasion indicates aggressive behavior, higher recurrence risk
differentials:
  - Squamous cell carcinoma
  - Melanoma
  - Sebaceous hyperplasia
  - Dermatofibroma
  - Seborrheic keratosis
  - Actinic keratosis
trace:
  - 68-year-old fair-skinned man with slowly growing pearly papule on nose x 1 year, occasional bleeding → Exam shows 8 mm translucent nodule with rolled borders and central ulceration on nasal tip → Dermoscopy shows arborizing vessels → Shave biopsy confirms nodular basal cell carcinoma, no aggressive features → High-risk location (nose, central face) → Refer for Mohs micrographic surgery → Mohs procedure removes tumor in 2 stages with clear margins → Cosmetic repair with local flap → Heals well, good cosmetic result → Counseled on sun protection, skin self-exams, regular dermatology follow-up every 6 months → No recurrence at 2-year follow-up
