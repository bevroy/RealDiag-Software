tree_id: ID-HIV-AIDS
name: HIV/AIDS Diagnosis and Management
family: Infectious Disease
specialty: Infectious Disease, Internal Medicine
chief_complaint: Positive HIV Test, Opportunistic Infections, Immunodeficiency
description: Comprehensive evaluation and management of HIV infection and AIDS
version: "1.0"
icd10: B20
author: RealDiag Clinical Team

entry_point: hiv_presentation

nodes:
  - id: hiv_presentation
    type: question
    text: "HIV presentation?"
    options:
      - label: "Newly diagnosed HIV - asymptomatic or mild symptoms"
        next: new_hiv_diagnosis
      - label: "AIDS-defining illness or CD4 <200 (AIDS)"
        next: aids_diagnosis
      - label: "Acute HIV infection suspected (recent exposure, seroconversion illness)"
        next: acute_hiv

  - id: acute_hiv
    type: diagnosis
    name: "Acute HIV Infection (Primary HIV)"
    icd10: "B20"
    urgency: high
    workup:
      - Clinical presentation - Flu-like illness 2-4 weeks after exposure (fever, pharyngitis, rash, lymphadenopathy, myalgias) - "mono-like" syndrome
      - HIV antibody test may be negative (window period)
      - HIV RNA (viral load) - Very high (>100,000 copies/mL, often >1 million) - diagnostic of acute infection
      - HIV 4th generation Ag/Ab combo test - Positive p24 antigen with negative or indeterminate antibody
      - Confirm with HIV-1/HIV-2 differentiation assay
      - CD4 count (may be transiently low during acute infection)
      - Resistance testing (genotype)
      - Baseline labs - CBC, CMP, LFTs, lipid panel, HbA1c
      - STI screening - Syphilis (RPR), hepatitis B and C, gonorrhea/chlamydia
      - Pregnancy test in women
    treatment:
      - START antiretroviral therapy (ART) IMMEDIATELY (same day if possible)
      - Benefits - Reduces viral load quickly, decreases transmission, preserves immune function, may reduce viral reservoir
      - Preferred ART regimens (integrase inhibitor-based, 3-drug)
      - Biktarvy (bictegravir/TAF/FTC) 1 tablet PO daily OR
      - Dovato (dolutegravir/lamivudine) 1 tablet PO daily (if HIV RNA <500k and HBV negative) OR
      - Triumeq (dolutegravir/abacavir/lamivudine) if HLA-B5701 negative
      - Infectious disease consultation
      - Partner notification and testing
      - Counsel on transmission prevention (viral load suppression = U=U, undetectable = untransmissible)
      - Close follow-up (2-4 weeks, then monthly until virally suppressed)

  - id: new_hiv_diagnosis
    type: diagnosis
    name: "Newly Diagnosed HIV (Chronic Infection)"
    icd10: "B20"
    urgency: high
    workup:
      - Confirmatory testing - HIV-1/HIV-2 differentiation, Western blot
      - Baseline CD4 count and HIV RNA viral load
      - CD4 <200 = AIDS diagnosis (high risk for opportunistic infections)
      - Resistance testing (genotype) - Guide ART selection
      - Baseline labs - CBC, CMP, LFTs, lipid panel, HbA1c, urinalysis
      - Screening tests
      - STI panel - Syphilis (RPR), gonorrhea/chlamydia, hepatitis A/B/C
      - TB screening - TST or IGRA (QuantiFERON), chest X-ray if positive
      - Toxoplasma IgG (if positive, risk of toxo encephalitis when CD4 <100)
      - CMV IgG
      - Pregnancy test
      - HLA-B5701 testing (if considering abacavir - avoid if positive due to hypersensitivity risk)
    treatment:
      - START ART immediately (same day or within days) - "rapid start" improves linkage to care and outcomes
      - Preferred first-line regimens (integrase inhibitor-based)
      - Biktarvy (bictegravir/TAF/FTC) 1 tablet PO daily (excellent efficacy, high barrier to resistance, well-tolerated) OR
      - Dovato (dolutegravir/lamivudine) 1 tablet PO daily (2-drug regimen, if VL <500k, no HBV) OR
      - Triumeq (dolutegravir/abacavir/lamivudine) 1 tablet daily (if HLA-B5701 negative)
      - Alternative - Genvoya (E/C/F/TAF) or Symtuza (darunavir/cobicistat/FTC/TAF)
      - Prophylaxis based on CD4 count
      - CD4 <200 - PCP prophylaxis (TMP-SMX DS 1 tab daily or 3x/week)
      - CD4 <100 and Toxo IgG+ - Toxoplasmosis prophylaxis (TMP-SMX DS daily covers both PCP and Toxo)
      - CD4 <50 - MAC prophylaxis (azithromycin 1200mg weekly)
      - Vaccinations (once CD4 >200 if possible)
      - Hepatitis A and B if non-immune
      - Pneumococcal (PCV20 or PCV15 + PPSV23)
      - Influenza annually
      - HPV (if age appropriate)
      - COVID-19, Tdap
      - Avoid live vaccines if CD4 <200 (MMR, varicella)
      - Monitoring - Viral load and CD4 at 4 weeks, 12 weeks, then q3-6 months once suppressed
      - Goal - Undetectable viral load (<20-50 copies/mL) by 6 months
      - Infectious disease referral
      - Counseling - Adherence critical (>95%), safe sex, U=U concept, disclosure
      - Treat comorbidities - Depression, substance use

  - id: aids_diagnosis
    type: question
    text: "AIDS-defining illness or condition?"
    options:
      - label: "Pneumocystis jirovecii pneumonia (PCP)"
        next: pcp_pneumonia
      - label: "Toxoplasma encephalitis"
        next: toxo_encephalitis
      - label: "Cryptococcal meningitis"
        next: crypto_meningitis
      - label: "CMV retinitis or other CMV disease"
        next: cmv_disease
      - label: "Mycobacterium avium complex (MAC)"
        next: mac_infection
      - label: "CD4 <200 without opportunistic infection"
        next: aids_without_oi

  - id: pcp_pneumonia
    type: diagnosis
    name: "Pneumocystis Jirovecii Pneumonia (PCP)"
    icd10: "B59"
    urgency: critical
    workup:
      - Clinical - Subacute dyspnea, dry cough, fever in HIV patient with CD4 <200
      - Chest X-ray - Bilateral interstitial infiltrates (may be normal in 20-30%)
      - CT chest - Ground-glass opacities
      - ABG - Hypoxemia, elevated A-a gradient
      - LDH - Elevated (>500, nonspecific but suggestive)
      - Induced sputum or bronchoscopy with BAL - Immunofluorescence or PCR for Pneumocystis
    treatment:
      - TMP-SMX 15-20mg/kg/day (TMP component) IV divided TID-QID x 21 days (first-line)
      - Oral TMP-SMX DS 2 tabs PO TID if mild-moderate and can tolerate PO
      - If sulfa allergy - Pentamidine 4mg/kg IV daily x 21 days OR clindamycin 600mg IV q8h + primaquine 30mg PO daily (check G6PD first) OR atovaquone 750mg PO BID (mild cases only)
      - Adjunctive corticosteroids if moderate-severe (PaO2 <70 or A-a gradient >35)
      - Prednisone 40mg PO BID x 5 days, then 40mg daily x 5 days, then 20mg daily x 11 days (total 21 days)
      - Improves survival
      - Start ART once PCP treatment initiated (within 2 weeks) - do not delay
      - Continue PCP prophylaxis after treatment (TMP-SMX DS daily) until CD4 >200 x 3 months on ART

  - id: toxo_encephalitis
    type: diagnosis
    name: "Toxoplasma Encephalitis"
    icd10: "B58.2"
    urgency: critical
    workup:
      - Clinical - Focal neurologic deficits, seizures, altered mental status, headache in HIV with CD4 <100
      - MRI brain with contrast - Multiple ring-enhancing lesions (typically basal ganglia, corticomedullary junction)
      - Toxoplasma IgG - Positive in 90% (if negative, consider other diagnoses)
      - Lumbar puncture contraindicated if mass effect
      - Brain biopsy if no response to empiric therapy after 2 weeks
    treatment:
      - Empiric treatment (do not wait for definitive diagnosis)
      - Pyrimethamine 200mg PO loading dose, then 50-75mg PO daily (if <60kg, 50mg; if >60kg, 75mg) PLUS
      - Sulfadiazine 1-1.5g PO QID PLUS
      - Leucovorin 10-25mg PO daily (to prevent pyrimethamine bone marrow toxicity)
      - Duration - 6 weeks acute treatment, then secondary prophylaxis (half-dose) until CD4 >200 x 6 months
      - If sulfa allergy - Replace sulfadiazine with clindamycin 600mg IV/PO QID
      - Alternative - TMP-SMX DS 2 tabs PO BID (less effective)
      - Anticonvulsants if seizures (levetiracetam preferred)
      - Corticosteroids (dexamethasone) only if significant mass effect/edema
      - Start ART within 2 weeks
      - Repeat MRI at 2 weeks (expect 50% improvement), brain biopsy if no response

  - id: crypto_meningitis
    type: diagnosis
    name: "Cryptococcal Meningitis"
    icd10: "B45.1"
    urgency: critical
    workup:
      - Clinical - Headache, fever, altered mental status, meningismus (may be subtle in HIV)
      - LP - Opening pressure (often elevated >25 cm H2O), CSF analysis (lymphocytic pleocytosis, low glucose, high protein), India ink stain (positive in 70%), cryptococcal antigen (CrAg, very sensitive), fungal culture
      - Serum cryptococcal antigen (positive, useful for screening)
      - Serial LPs to reduce intracranial pressure if elevated
    treatment:
      - Induction therapy (2 weeks) - Liposomal amphotericin B 3-4mg/kg IV daily + flucytosine 100mg/kg/day PO divided QID
      - Consolidation (8 weeks) - Fluconazole 400mg PO daily
      - Maintenance (lifelong or until CD4 >200 x 6 months on ART) - Fluconazole 200mg PO daily
      - Manage intracranial pressure - Serial LPs (daily if opening pressure >25) to remove CSF and reduce pressure to <20 cm H2O
      - Shunt placement if refractory elevated ICP
      - Delay ART initiation for 4-6 weeks (risk of IRIS with early ART in crypto meningitis)
      - Monitor for IRIS after ART initiation

  - id: cmv_disease
    type: diagnosis
    name: "CMV Disease (Retinitis, Colitis, Esophagitis)"
    icd10: "B25.9"
    urgency: high
    workup:
      - CMV retinitis - Fundoscopic exam (hemorrhages, white fluffy exudates, "pizza pie" appearance)
      - CMV colitis - Colonoscopy with biopsy
      - CMV esophagitis - EGD with biopsy
      - CMV viremia - CMV PCR (high viral load)
    treatment:
      - Induction (2-3 weeks) - Ganciclovir 5mg/kg IV q12h OR valganciclovir 900mg PO BID OR foscarnet 90mg/kg IV q12h (if resistant or intolerant)
      - Maintenance - Valganciclovir 900mg PO daily until CD4 >100 x 6 months on ART
      - Ophthalmology consultation for retinitis
      - Start ART

  - id: mac_infection
    type: diagnosis
    name: "Disseminated Mycobacterium Avium Complex (MAC)"
    icd10: "A31.2"
    urgency: high
    workup:
      - Clinical - Fever, night sweats, weight loss, diarrhea, hepatosplenomegaly in HIV with CD4 <50
      - Blood cultures (mycobacterial) - Positive for MAC
      - Anemia, elevated alk phos
    treatment:
      - Clarithromycin 500mg PO BID + ethambutol 15mg/kg PO daily + rifabutin 300mg PO daily (3-drug regimen)
      - Duration - Lifelong or until CD4 >100 x 6 months on ART
      - Start ART within 2 weeks

  - id: aids_without_oi
    type: diagnosis
    name: "AIDS (CD4 <200) without Opportunistic Infection"
    icd10: "B20"
    urgency: high
    workup:
      - CD4 <200 defines AIDS (even without OI)
      - Screen for subclinical infections
    treatment:
      - START ART immediately
      - PCP prophylaxis (TMP-SMX DS daily)
      - MAC prophylaxis if CD4 <50 (azithromycin 1200mg weekly)
      - Close monitoring
