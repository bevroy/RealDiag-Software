tree_id: DERM-PITYRIASIS-ROSEA
name: Pityriasis Rosea
family: Dermatology
specialty: Dermatology
chief_complaint: Widespread rash with herald patch
description: Self-limited papulosquamous eruption with characteristic herald patch followed by Christmas tree distribution on trunk. Likely viral etiology (HHV-6/7), resolves spontaneously in 6-8 weeks without treatment.
icd10: L42
snomed: 200791005
presentations:
  - Herald patch: solitary, oval, scaly plaque
  - Followed by secondary eruption (days to weeks)
  - Christmas tree pattern on back
  - Oval, salmon-colored patches with collarette scale
  - Mildly pruritic
  - Self-limited (6-8 weeks)
urgency: non-urgent

referrals:
  emergency:
    - Suspected necrotizing fasciitis
    - Stevens-Johnson syndrome/TEN
    - Anaphylaxis
  urgent:
    - Suspected melanoma
    - Rapidly growing lesion
    - Severe drug reaction
    - Suspected malignancy
  routine:
    - Chronic dermatitis management
    - Acne unresponsive to treatment
    - Cosmetic concerns
    - Mole surveillance

workup:
  - Clinical diagnosis: herald patch followed 1-2 weeks later by generalized eruption in Christmas tree pattern
  - Herald patch: solitary oval pink scaly plaque 2-5 cm, often on trunk (chest, back, abdomen), appears first
  - Fine collarette of scale: around periphery of herald patch (pathognomonic)
  - Secondary eruption: multiple smaller oval pink patches and plaques appear 1-2 weeks after herald patch
  - Distribution: trunk and proximal extremities, follows skin cleavage lines creating Christmas tree pattern on back
  - Face, hands, feet usually spared (if involved consider secondary syphilis)
  - Lesions: oval, salmon-pink, fine scale, long axis parallel to skin tension lines
  - Pruritus: variable, present in 50% (mild to moderate)
  - Preceded by viral prodrome: low-grade fever, malaise, headache in 5-10% (suggests viral etiology)
  - Likely cause: human herpesvirus 6 or 7 reactivation (not contagious)
  - Age: typically 10-35 years, rare in infants and elderly
  - Self-limited: resolves spontaneously in 6-8 weeks (range 4-12 weeks)
  - Pregnancy: rarely associated with miscarriage if occurs in first trimester
  - RPR/VDRL: if atypical features (palms/soles involved, no herald patch, mucous membranes) to rule out secondary syphilis

treatment:
  - Reassurance: self-limited condition, resolves spontaneously in 6-8 weeks without treatment or scarring
  - Symptomatic treatment: for pruritus if present
  - Topical corticosteroids: triamcinolone 0.1% cream or hydrocortisone 2.5% cream BID to pruritic lesions
  - Oral antihistamines: cetirizine 10 mg daily or hydroxyzine 25 mg Q6H PRN for itching
  - Emollients: moisturizing lotions to reduce dryness and scaling
  - UV light exposure: natural sunlight or phototherapy (UVB) may hasten resolution (controversial)
  - Avoid hot showers: can worsen pruritus
  - No antibiotics: not bacterial infection
  - No antivirals: not HSV or VZV, likely HHV-6/7 reactivation (antiviral not indicated)
  - Post-inflammatory hyperpigmentation: may persist 2-3 months after rash resolves, especially in darker skin tones
  - Natural history: new lesions appear over 2-3 weeks, then gradually fade over next 4-6 weeks

clinical_pearls:
  - Herald patch precedes generalized eruption by 1-2 weeks
  - Christmas tree pattern on back (oval lesions follow skin cleavage lines)
  - Self-limited - resolves in 6-8 weeks without treatment
  - Fine collarette of scale at periphery of lesions characteristic
  - Trunk and proximal extremities involved, face/hands/feet spared
  - If palms and soles involved consider secondary syphilis (check RPR)
  - No treatment needed - reassurance and symptomatic relief only
  - Post-inflammatory hyperpigmentation may persist 2-3 months

differentials:
  - Secondary syphilis: similar papulosquamous eruption but involves palms and soles, mucous patches, no herald patch, positive RPR/VDRL
  - Tinea corporis: annular scaling plaques, KOH prep shows hyphae, responds to antifungals
  - Guttate psoriasis: follows strep throat, small droplet-like plaques, no herald patch, more silvery scale
  - Drug eruption: history of new medication, variable morphology, no herald patch

trace: |
  A 24-year-old woman presented with 10 days of rash on trunk. Two weeks prior noticed single large scaly patch on right flank (3 cm oval pink plaque with fine peripheral scale - herald patch). One week ago developed multiple smaller similar patches on chest, back, and abdomen. Mildly itchy. No fever, no sick contacts. Not pregnant. Exam showed herald patch on right flank and numerous oval salmon-pink patches 1-2 cm on trunk and proximal arms with fine collarette of scale. Lesions arranged along skin cleavage lines in Christmas tree pattern on back. Face, palms, soles spared. Diagnosed with pityriasis rosea (classic presentation with herald patch and Christmas tree distribution). Reassured that self-limited condition resolving spontaneously in 6-8 weeks. No treatment needed given mild symptoms. Prescribed triamcinolone 0.1% cream to apply to pruritic lesions twice daily PRN and cetirizine 10 mg daily for itching. Advised to use gentle soaps and moisturize regularly, avoid hot showers (worsens itch). At 4 weeks rash stable, no new lesions appearing, mild pruritus controlled. At 8 weeks rash fading significantly, 70% resolved. At 12 weeks complete resolution with mild residual post-inflammatory hyperpigmentation (fading over next 2 months). No scarring, no recurrence.
