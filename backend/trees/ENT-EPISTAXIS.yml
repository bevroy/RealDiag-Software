presentations:
  - Bleeding from nose
  - Anterior epistaxis (90%) - visible bleeding from Little's area
  - Posterior epistaxis (10%) - blood in posterior pharynx
  - Risk factors - trauma, dry air, anticoagulation, hypertension
  - May be severe requiring packing or cauterization
differentials:
  - Trauma
  - Hypertension
  - Coagulopathy
  - Hereditary hemorrhagic telangiectasia
  - Tumor
workup:
  - Nasal endoscopy to identify bleeding source (especially posterior)
  - 'If severe or recurrent: CBC (anemia), PT/INR, PTT (coagulopathy), Type & Screen'
  - Blood pressure check (control hypertension)
treatment:
  - 'Guideline-based treatment options for Epistaxis (Nosebleed) include:'
  - 'First-aid: Pinch soft part of nose (NOT bridge) for 10-15 minutes, lean forward (prevent swallowing blood), ice to nose (AAO-HNS 2023)'
  - 'If continues: Topical vasoconstrictor (oxymetazoline spray or phenylephrine-soaked cotton) + silver nitrate cautery to bleeding site (AAO-HNS 2023)'
  - 'Anterior packing: Nasal tampon (Rapid Rhino) or petroleum gauze packing if cautery fails - remove in 2-3 days (AAO-HNS 2023)'
  - 'Posterior packing: Foley catheter or posterior pack if anterior pack fails - admit for monitoring, O2, IV antibiotics (toxic shock risk) (AAO-HNS 2023)'
  - 'Prevention: Saline gel or Vaseline to nares BID, humidifier, treat hypertension, reverse coagulopathy (AAO-HNS 2023)'
clinical_pearls:
  - 'Anterior: Kiesselbach''s plexus (Little''s area) on anterior septum - visible, easier to control'
  - 'Posterior: Woodruff''s plexus (posterior/superior nasal cavity) - more severe, harder to control, elderly patients'
  - 'Risk factors: Digital trauma (nose picking), dry air, anticoagulation, hypertension, NSAIDs, intranasal drugs (cocaine, steroid sprays)'
  - 'Hereditary hemorrhagic telangiectasia (HHT/Osler-Weber-Rendu): Recurrent epistaxis + telangiectasias + family history'
  - Hypertension doesn't cause epistaxis but makes it harder to control once started
red_flags: []
disposition_guidance: {}
referrals:
  - 'ENT if: Posterior epistaxis, refractory to anterior packing, recurrent epistaxis, or visible mass/lesion'
  - 'Hospital admission if: Posterior pack placed, severe bleeding, hemodynamically unstable, coagulopathy'
  - 'ENT may do: Endoscopic cautery or arterial ligation (sphenopalatine artery) for refractory cases'
