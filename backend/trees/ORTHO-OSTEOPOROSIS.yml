tree_id: ORTHO-OSTEOPOROSIS
name: Osteoporosis
family: Orthopedics
specialty: Orthopedics
chief_complaint: Low bone density and fracture risk
description: |
  Systemic skeletal disease with low bone mass and microarchitectural deterioration leading to increased fracture risk.
  Most common sites vertebral compression fractures, hip fractures, distal radius fractures. Silent disease until fracture occurs.
icd10: M81.0
urgency: Low
workup:
  - Dual-energy X-ray absorptiometry (DEXA) scan measures bone mineral density (BMD) at lumbar spine and hip
  - T-score compares to young adult mean - normal (greater than -1.0), osteopenia (-1.0 to -2.5), osteoporosis (less than -2.5), severe osteoporosis (less than -2.5 with fragility fracture)
  - Screening recommendations - women age 65 and older, men age 70 and older, younger if risk factors (early menopause, glucocorticoid use, fracture history)
  - FRAX score estimates 10-year probability of major osteoporotic fracture and hip fracture
  - Labs to rule out secondary causes - serum calcium, phosphate, alkaline phosphatase, 25-OH vitamin D, TSH, serum protein electrophoresis, 24-hour urine calcium
  - Testosterone in men if low bone density
  - Vertebral fracture assessment (VFA) or lateral spine X-ray to detect asymptomatic compression fractures
treatment:
  - Lifestyle modifications - weight-bearing exercise, fall prevention, smoking cessation, limit alcohol
  - Calcium 1200 mg/day (dietary plus supplement) and vitamin D 800-1000 IU daily
  - Bisphosphonates first-line - alendronate 70mg weekly or 10mg daily, risedronate 35mg weekly, zoledronic acid 5mg IV yearly
  - Take oral bisphosphonates with full glass water, remain upright 30-60 minutes, on empty stomach
  - Denosumab 60mg SC every 6 months - RANKL inhibitor, alternative to bisphosphonates (especially if renal insufficiency)
  - Anabolic agents for severe osteoporosis - teriparatide (PTH analog) 20 mcg SC daily x 2 years, romosozumab (sclerostin inhibitor) 210mg SC monthly x 12 months
  - Selective estrogen receptor modulator - raloxifene 60mg daily (postmenopausal women, reduces vertebral fractures but not hip)
  - Duration - bisphosphonates 3-5 years then drug holiday (reassess), denosumab continuous (no drug holiday due to rebound bone loss)
  - Monitor with DEXA every 1-2 years on treatment
  - Treat fragility fractures - vertebroplasty or kyphoplasty for painful compression fractures, hip fracture surgical repair
clinical_pearls:
  - Fragility fracture defined as fracture from fall from standing height or less
  - Hip fracture has highest morbidity and mortality (20% 1-year mortality)
  - Glucocorticoid-induced osteoporosis most common secondary cause (prednisone greater than 5mg daily x 3 months)
  - Bisphosphonate side effects - esophagitis (rare), atypical femoral fractures (very rare with long-term use), osteonecrosis of jaw (rare, higher risk with IV bisphosphonates and dental procedures)
  - Stop denosumab requires transition to bisphosphonate (rebound increased bone turnover and fracture risk)
  - Men with osteoporosis need testosterone level checked
differentials:
  - Osteomalacia
  - Multiple myeloma
  - Metastatic bone disease
  - Hyperparathyroidism
  - Paget disease of bone
  - Osteogenesis imperfecta
trace:
  - 68-year-old postmenopausal woman presents for routine screening → DEXA shows lumbar spine T-score -2.8, hip T-score -2.6 → Diagnose osteoporosis → Labs show vitamin D 18 ng/mL (low), calcium and other labs normal → Start alendronate 70mg weekly, calcium carbonate 600mg BID with meals, vitamin D3 2000 IU daily → Counsel on weight-bearing exercise, fall prevention → Repeat DEXA in 2 years shows stable BMD, no fractures → Continue treatment, reassess at 5 years for drug holiday
