tree_id: ENDO-TYPE2-DIABETES
name: Type 2 Diabetes Mellitus
family: Endocrinology
specialty: Endocrinology, Primary Care
chief_complaint: Elevated blood sugar, polyuria, polydipsia
description: Metabolic disorder characterized by hyperglycemia due to insulin resistance and relative insulin deficiency. Most common form of diabetes (90-95% of cases).

icd10: E11.9
snomed: ["44054006", "313435000"]

urgency: routine

homeopathy:
  - remedy: "Syzygium jambolanum 30C"
    indications: "Excessive urination, unquenchable thirst, ulcers, diabetic complications"
  - remedy: "Phosphoric acid 30C"
    indications: "Mental and physical exhaustion, frequent urination, hair loss"
  - remedy: "Uranium nitricum 30C"
    indications: "High blood sugar, excessive thirst and urination, emaciation despite eating"
  - remedy: "Gymnema sylvestre Q"
    indications: "Reduces sugar craving, supportive in glucose control"
  - remedy: "Cephalandra indica Q"
    indications: "Sugar in urine, excessive thirst, supportive remedy"

workup:
  - Diagnosis criteria (any one): fasting glucose ≥126 mg/dL (≥7.0 mmol/L) on 2 occasions, random glucose ≥200 mg/dL with symptoms, HbA1c ≥6.5% (≥48 mmol/mol), 2-hour OGTT glucose ≥200 mg/dL
  - Prediabetes: fasting glucose 100-125 mg/dL, HbA1c 5.7-6.4%, 2-hour OGTT 140-199 mg/dL
  - Initial evaluation: HbA1c, fasting glucose, comprehensive metabolic panel (renal function), lipid panel, urinalysis (microalbuminuria), TSH (higher prevalence thyroid disease)
  - Screening: all adults age ≥35, earlier if overweight/obese with risk factors (family history, hypertension, dyslipidemia, PCOS, prior gestational diabetes, physical inactivity, high-risk ethnicity)
  - Baseline assessment: BMI, blood pressure, foot exam (neuropathy), dilated eye exam (retinopathy), depression screening
  - Risk factors: obesity (especially central adiposity), family history, age >45, sedentary lifestyle, hypertension, dyslipidemia, PCOS, gestational diabetes history, metabolic syndrome

treatment:
  - Goals: HbA1c <7% for most adults (individualize based on age, comorbidities, hypoglycemia risk), fasting glucose 80-130 mg/dL, postprandial <180 mg/dL
  - Lifestyle modifications (cornerstone): weight loss 5-10% if overweight (improves insulin sensitivity), Mediterranean or low-carb diet, 150 min/week moderate aerobic exercise, resistance training 2-3x/week
  - First-line pharmacotherapy: metformin 500-2000 mg daily (start 500 mg with dinner, increase gradually to minimize GI side effects), reduces HbA1c 1-2%, contraindicated if eGFR <30
  - ASCVD or high risk: add GLP-1 agonist (semaglutide 0.25-2 mg SC weekly, dulaglutide, liraglutide) or SGLT2 inhibitor (empagliflozin 10-25 mg daily, dapagliflozin) - proven cardiovascular benefit
  - Heart failure or CKD: SGLT2 inhibitor preferred (reduces hospitalizations, slows CKD progression)
  - If HbA1c >9% or glucose >300: consider dual therapy from start (metformin + GLP-1 or SGLT2i)
  - Additional agents if inadequate control: DPP-4 inhibitors (sitagliptin 100 mg daily), sulfonylureas (glipizide, glyburide - caution hypoglycemia), TZDs (pioglitazone - avoid in heart failure), insulin (basal insulin at bedtime if HbA1c >10% despite oral agents)
  - GLP-1 agonists: weight loss benefit, reduce HbA1c 1-1.5%, nausea common, weekly injection (semaglutide), oral option available (oral semaglutide)
  - SGLT2 inhibitors: modest weight loss, reduce HbA1c 0.5-1%, UTI/genital yeast infection risk, euglycemic DKA (rare)
  - Complications screening: annual comprehensive foot exam, annual dilated eye exam, annual urine albumin-creatinine ratio, annual monofilament test
  - Comorbidity management: BP <130/80, statin therapy (atorvastatin 40-80 mg or rosuvastatin 20-40 mg) for ASCVD risk reduction, aspirin 75-162 mg if established ASCVD

clinical_pearls:
  - Type 2 DM accounts for 90-95% of diabetes cases
  - Metformin is first-line unless contraindicated (eGFR <30) or not tolerated
  - GLP-1 agonists and SGLT2 inhibitors have proven cardiovascular and renal benefits beyond glucose control
  - Weight loss is most effective non-pharmacologic intervention
  - HbA1c <7% reduces microvascular complications (retinopathy, nephropathy, neuropathy)
  - Tight BP control (<130/80) equally important as glucose control
  - All patients need statin therapy for cardiovascular risk reduction
  - Screen for retinopathy annually (leading cause of blindness in adults)
  - Screen for diabetic nephropathy annually (urine albumin-creatinine ratio)
  - Screen for neuropathy annually (monofilament test, vibration sense)
  - Bariatric surgery achieves diabetes remission in 30-60% of obese patients

referrals:
  - Endocrinology: poorly controlled despite dual/triple therapy, considering insulin, frequent hypoglycemia, pregnancy planning
  - Ophthalmology: annual dilated eye exam, more frequent if retinopathy present
  - Podiatry: foot ulcers, neuropathy, structural abnormalities
  - Nephrology: eGFR <30, urine albumin >300 mg/g (macroalbuminuria)
  - Cardiology: established ASCVD, heart failure
  - Diabetes educator: newly diagnosed, insulin initiation

presentations:
  - Polyuria (frequent urination)
  - Polydipsia (excessive thirst)
  - Polyphagia (increased hunger)
  - Unexplained weight loss (less common in Type 2 than Type 1)
  - Fatigue, weakness
  - Blurred vision
  - Slow-healing wounds
  - Recurrent infections (UTI, candidiasis)
  - Acanthosis nigricans (dark skin patches in skin folds)
  - Neuropathy (numbness, tingling in feet)
  - Often asymptomatic (found on screening)
