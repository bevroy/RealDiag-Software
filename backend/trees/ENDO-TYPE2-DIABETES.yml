tree_id: ENDO-TYPE2-DIABETES
name: Type 2 Diabetes Mellitus
family: Endocrinology
specialty: Endocrinology
chief_complaint: Polyuria, polydipsia, polyphagia, weight loss, fatigue, blurred vision
description: Chronic metabolic disorder characterized by hyperglycemia from insulin resistance and relative insulin deficiency, leading to microvascular and macrovascular complications
icd10: E11.9
urgency: routine
workup:
  - Epidemiology - 37 million Americans (11% of population), 90-95% of all diabetes is type 2, prevalence increasing with obesity epidemic, peak onset >45 years but increasing in children/adolescents
  - Pathophysiology - Insulin resistance in peripheral tissues plus progressive beta-cell dysfunction leads to hyperglycemia
  - Early phase - Insulin resistance with compensatory hyperinsulinemia (normal glucose), Late phase - Beta-cell exhaustion, insulin deficiency, overt hyperglycemia
  - Risk factors - Obesity (especially central adiposity), age >45, sedentary lifestyle, family history (first-degree relative), race/ethnicity (African American, Hispanic, Native American, Asian American, Pacific Islander), history of gestational diabetes, PCOS, prediabetes, metabolic syndrome, hypertension, dyslipidemia
  - Clinical presentation - Often asymptomatic early, gradual onset, classic symptoms are polyuria, polydipsia, polyphagia, unintentional weight loss, fatigue, blurred vision
  - Diagnostic criteria (any one) - Fasting plasma glucose ≥126 mg/dL (repeat to confirm), Random glucose ≥200 mg/dL with classic symptoms, 2-hour plasma glucose ≥200 mg/dL during 75g OGTT, HbA1c ≥6.5% (repeat to confirm)
  - Prediabetes - Fasting glucose 100-125 mg/dL, 2-hour glucose 140-199 mg/dL, HbA1c 5.7-6.4%
  - Screening - All adults age ≥35 (or earlier if overweight/obese plus 1+ risk factor), screen every 3 years if normal
  - Laboratory evaluation - HbA1c (target <7% for most, <6.5% if no hypoglycemia risk, <8% if elderly), fasting lipid panel, urine albumin-to-creatinine ratio, serum creatinine and eGFR, TSH, liver enzymes
  - Complications screening - Retinopathy (dilated eye exam annually), Nephropathy (annual UACR and eGFR), Neuropathy (annual comprehensive foot exam), Cardiovascular (assess ASCVD risk, lipids, BP)
treatment:
  - Goals - Prevent complications, individualize HbA1c target (most <7%, elderly <8%, young healthy <6.5%)
  - Lifestyle modification - FOUNDATION: Diet (Mediterranean or DASH), Weight loss (5-10% improves control), Exercise (150 min/week moderate), Smoking cessation
  - Metformin - FIRST-LINE for all type 2 DM: Start 500 mg daily or BID, titrate to 1000 mg BID (max 2550 mg/day), lowers HbA1c 1-2%, weight neutral, low hypoglycemia risk, CV benefits, avoid if eGFR <30
  - Side effects - GI (nausea, diarrhea, take with food), vitamin B12 deficiency (check annually), lactic acidosis (rare)
  - Second-line agents (if HbA1c not at goal on metformin)
  - GLP-1 receptor agonists - Preferred if ASCVD, heart failure, or need weight loss: Semaglutide 0.5-1 mg SC weekly, dulaglutide 1.5 mg SC weekly, lower HbA1c 1-1.5%, significant weight loss (5-10 kg), CV benefits, side effects are nausea, vomiting
  - SGLT2 inhibitors - Preferred if ASCVD, heart failure, or CKD: Empagliflozin 10-25 mg daily, dapagliflozin 5-10 mg daily, lower HbA1c 0.5-1%, weight loss (2-3 kg), lower BP, CV and renal benefits, side effects are genital infections, UTI, DKA (rare)
  - DPP-4 inhibitors - Sitagliptin 100 mg daily, linagliptin 5 mg daily, lower HbA1c 0.5-0.8%, weight neutral, well-tolerated, oral
  - Sulfonylureas - Glipizide 5-20 mg, lower HbA1c 1-2%, inexpensive, but hypoglycemia risk and weight gain
  - Insulin therapy - If HbA1c >10% or symptomatic hyperglycemia: Basal insulin (start 10 units daily, titrate based on fasting glucose), Bolus insulin (rapid-acting before meals if needed)
  - Cardiovascular risk reduction - Statin therapy (all diabetics age 40-75), Aspirin 81 mg daily (if ASCVD), BP control (target <130/80, ACE inhibitor or ARB first-line)
  - Nephropathy - ACE inhibitor or ARB if albuminuria, SGLT2 inhibitor (slows CKD progression)
  - Retinopathy - Optimize glycemic control, laser photocoagulation or anti-VEGF if proliferative or macular edema
  - Neuropathy - Optimize glycemic control, pain management (gabapentin, pregabalin, duloxetine), foot care education
clinical_pearls:
  - Metformin is first-line for all type 2 DM unless contraindicated (lowers HbA1c 1-2%, weight neutral, CV benefits)
  - GLP-1 agonists (semaglutide, dulaglutide) preferred if ASCVD, heart failure, or need weight loss (CV benefits)
  - SGLT2 inhibitors (empagliflozin, dapagliflozin) preferred if ASCVD, heart failure, or CKD (reduce HF hospitalization, slow CKD)
  - HbA1c target <7% for most, individualize based on age, comorbidities, life expectancy
  - Screen for complications annually (dilated eye exam, UACR, foot exam)
  - Statin therapy for all diabetics age 40-75, ACE inhibitor or ARB if hypertension or albuminuria
differentials:
  - ENDO-TYPE1-DIABETES
  - ENDO-GESTATIONAL-DIABETES
  - ENDO-CUSHING-SYNDROME
  - ENDO-HYPERTHYROIDISM
trace:
  - Polyuria, polydipsia, polyphagia, weight loss, fatigue
  - Fasting glucose ≥126 mg/dL or HbA1c ≥6.5% (repeat to confirm)
  - Start metformin 500-1000 mg BID with lifestyle modification
  - Add GLP-1 agonist if ASCVD or need weight loss, SGLT2 inhibitor if heart failure or CKD
  - Screen annually for retinopathy (eye exam), nephropathy (UACR), neuropathy (foot exam)
