tree_id: ONCO-HEPATOCELLULAR-CARCINOMA
name: Hepatocellular Carcinoma
family: Gastroenterology
specialty: Oncology/Gastroenterology/Hepatology
chief_complaint: Abdominal pain, weight loss, jaundice in cirrhotic patient
description: Primary liver cancer arising from hepatocytes, most commonly develops in setting of chronic liver disease and cirrhosis
icd10: C22.0
snomed: 109841003
presentations:
  - Right upper quadrant pain
  - Weight loss, anorexia
  - Jaundice, ascites
  - Early satiety
  - Hepatomegaly with palpable mass
  - Decompensation of previously stable cirrhosis
  - Often asymptomatic until advanced
urgency: urgent
referrals:
  emergency:
    - Ruptured HCC with hemorrhage
    - Acute liver failure
    - Oncologic emergency
  urgent:
    - New liver mass
    - Suspected HCC
    - Cirrhosis decompensation
  routine:
    - HCC surveillance
    - Cirrhosis monitoring

workup:
  - High-risk populations require surveillance (ultrasound + AFP every 6 months) - cirrhosis (any cause), chronic hepatitis B (even without cirrhosis if family history or African/Asian descent)
  - Clinical presentation - often asymptomatic in early stages, detected on surveillance
  - Symptomatic disease - RUQ pain, weight loss, early satiety, fatigue
  - Decompensation of stable cirrhosis - ascites, jaundice, encephalopathy, variceal bleeding
  - Paraneoplastic syndromes - hypercalcemia, erythrocytosis, hypoglycemia, hypercholesterolemia
  - Physical examination - hepatomegaly (firm, irregular liver edge), ascites, jaundice, cachexia, stigmata of chronic liver disease (spider angiomas, palmar erythema)
  - Laboratory studies
  - Alpha-fetoprotein (AFP) - elevated in 60-70% of HCC
  - AFP greater than 400 ng/mL highly specific for HCC in cirrhotic patients
  - Used for surveillance but not diagnostic alone
  - Liver function tests - may show elevated transaminases, alkaline phosphatase, bilirubin
  - Complete blood count - thrombocytopenia (portal hypertension), anemia
  - Coagulation studies - prolonged PT/INR (synthetic dysfunction)
  - Hepatitis serologies - HBV, HCV
  - Imaging - diagnostic and staging
  - Multiphasic contrast CT or MRI (arterial, portal venous, delayed phases)
  - Characteristic HCC - arterial hyperenhancement with washout in portal venous or delayed phase
  - Lesions greater than 1 cm with typical features on CT or MRI diagnostic without biopsy (LI-RADS 5)
  - Ultrasound for surveillance (every 6 months in cirrhosis) - detects lesions, not diagnostic
  - Biopsy rarely needed - only if imaging atypical or non-cirrhotic liver
  - Risk of tumor seeding along needle tract (1-3%)
  - Staging systems
  - Barcelona Clinic Liver Cancer (BCLC) staging - guides treatment, incorporates tumor burden, liver function (Child-Pugh), performance status
  - Very early/Early stage (0-A) - single tumor or up to 3 lesions less than 3 cm, preserved liver function - curative treatment
  - Intermediate (B) - multinodular, preserved liver function - transarterial chemoembolization
  - Advanced (C) - vascular invasion or extrahepatic spread - systemic therapy
  - Terminal (D) - end-stage liver disease, poor performance status - palliative care
  - Milan criteria for transplant - single tumor less than 5 cm or up to 3 tumors each less than 3 cm, no vascular invasion
  - Child-Pugh score - liver function assessment (A = best, C = worst)
treatment:
  - Curative-intent treatments (early stage)
  - Surgical resection - best for non-cirrhotic or well-compensated cirrhosis (Child A), single tumor, adequate liver remnant
  - 5-year survival 60-80% if resectable
  - Requires preserved liver function, no portal hypertension
  - Liver transplantation - best long-term survival for cirrhotic patients meeting Milan criteria
  - 5-year survival 70-80%
  - Treats both cancer and underlying cirrhosis
  - Limited by organ availability, requires tumor within Milan criteria
  - Ablation - percutaneous radiofrequency ablation (RFA) or microwave ablation (MWA)
  - Best for tumors less than 3 cm, not near major vessels
  - Complete response 90% for tumors less than 2 cm
  - Locoregional therapy (intermediate stage)
  - Transarterial chemoembolization (TACE) - inject chemotherapy + embolic particles into hepatic artery
  - HCC derives blood from hepatic artery, normal liver from portal vein
  - For unresectable multinodular disease with preserved liver function
  - Median survival 20-24 months
  - Contraindications - portal vein thrombosis, Child C cirrhosis, extrahepatic disease
  - Transarterial radioembolization (TARE) - Y-90 microspheres
  - Alternative to TACE, may be better tolerated
  - Systemic therapy (advanced stage)
  - First-line - atezolizumab (anti-PD-L1) + bevacizumab (anti-VEGF)
  - Median OS 19.2 months vs 13.4 months with sorafenib alone
  - Now standard of care if no contraindications to immunotherapy
  - Alternative first-line - sorafenib (multikinase inhibitor)
  - Median OS 10.7 months vs 7.9 months placebo
  - Side effects - diarrhea, hand-foot syndrome, fatigue
  - Second-line options - regorafenib, cabozantinib, ramucirumab (if AFP greater than 400), nivolumab, pembrolizumab
  - Supportive care
  - Manage cirrhosis complications - diuretics for ascites, lactulose/rifaximin for encephalopathy
  - Nutritional support
  - Pain management
  - Palliative care early integration
  - Surveillance after curative treatment - multiphasic CT or MRI every 3-4 months x 2 years, then every 6 months, AFP monitoring
clinical_pearls:
  - Most common primary liver malignancy worldwide, sixth most common cancer globally
  - 80-90% of HCC develops in setting of cirrhosis (HCV, HBV, alcohol, NASH most common)
  - Hepatitis B can cause HCC without cirrhosis - screen all chronic HBV patients
  - Surveillance reduces mortality by 37% - ultrasound + AFP every 6 months for all cirrhotic patients
  - Characteristic imaging (arterial hyperenhancement with washout) diagnostic in cirrhosis - biopsy not needed
  - AFP greater than 400 ng/mL highly specific but only 40% sensitive - normal AFP does not exclude HCC
  - BCLC staging guides treatment - resection/transplant for early stage, TACE for intermediate, systemic therapy for advanced
  - Milan criteria critical for transplant eligibility - single less than 5 cm or up to 3 each less than 3 cm
  - Immunotherapy (atezolizumab + bevacizumab) now first-line for advanced HCC
  - HCC can rupture causing acute hemoperitoneum - surgical emergency
  - Portal vein thrombosis common (30-40%) - worsens prognosis, limits treatment options
  - Fibrolamellar HCC rare variant in young patients without cirrhosis, better prognosis
differentials:
  - Hepatic hemangioma (most common benign liver lesion, peripheral nodular enhancement)
  - Focal nodular hyperplasia (central scar, homogeneous enhancement)
  - Hepatic adenoma (young women on oral contraceptives, risk of rupture)
  - Cholangiocarcinoma (intrahepatic bile duct cancer, progressive enhancement)
  - Metastases to liver (more common than primary - colon, breast, lung)
  - Regenerative nodules in cirrhosis (no arterial enhancement)
  - Abscess (fever, elevated WBC, rim enhancement)
trace:
  - 62-year-old man with chronic hepatitis C cirrhosis (Child-Pugh A) on surveillance presents with 3.2 cm liver mass found on screening ultrasound
  - No symptoms, stable weight, no new ascites or encephalopathy
  - Past medical history - hepatitis C cirrhosis diagnosed 5 years ago (treated with sofosbuvir/velpatasvir, achieved SVR), previously compensated on surveillance
  - Medications - lactulose PRN, nadolol 40 mg daily (for varices)
  - Physical examination - mild hepatomegaly, no ascites, mild spider angiomas, no jaundice, no asterixis
  - Laboratory studies - AFP 245 ng/mL (baseline 12 ng/mL), AST 68, ALT 54, alkaline phosphatase 142, bilirubin 1.2, albumin 3.6, INR 1.2, platelet 98, creatinine 0.9
  - Multiphasic liver MRI shows 3.2 cm lesion in right lobe with arterial hyperenhancement and washout on delayed phase (LI-RADS 5 - diagnostic for HCC)
  - CT chest/abdomen/pelvis - no extrahepatic disease, no portal vein thrombosis, splenomegaly and varices consistent with portal hypertension
  - Staging - BCLC stage A (single tumor less than 5 cm, Child A, ECOG 0), within Milan criteria
  - Multidisciplinary tumor board discussion - candidate for liver transplantation vs resection
  - Liver transplant evaluation initiated - listed for orthotopic liver transplant
  - Bridging therapy with radiofrequency ablation while awaiting transplant
  - RFA performed - complete ablation, post-ablation imaging shows no viable tumor
  - AFP decreases to 18 ng/mL post-ablation
  - Surveillance imaging every 3 months while on transplant list
  - At 8 months, received liver transplant from deceased donor
  - Explant pathology - 3.5 cm moderately differentiated HCC with complete ablation zone, no vascular invasion, three small satellite nodules (still within Milan), cirrhotic liver
  - Post-transplant immunosuppression - tacrolimus, mycophenolate
  - Surveillance - AFP every 3 months, CT chest/abdomen every 6 months
  - No recurrence at 3 years post-transplant

