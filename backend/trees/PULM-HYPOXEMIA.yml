tree_id: PULM-HYPOXEMIA
name: Hypoxemia
family: pulmonology
specialty: Pulmonology
icd10: R09.02
snomed: 389087006
urgency: high
homeopathy: []
presentations:
  - Dyspnea or shortness of breath
  - Tachypnea (increased respiratory rate)
  - Cyanosis (bluish discoloration of lips, nail beds)
  - Confusion or altered mental status
  - Restlessness or agitation
  - Tachycardia
  - Hypotension (if severe)
  - Diaphoresis
  - Use of accessory respiratory muscles
  - SpO2 <90% on pulse oximetry (or <88% in COPD patients)
  - May be asymptomatic if chronic and compensated
workup:
  - Pulse oximetry - continuous monitoring, SpO2 <90% indicates hypoxemia
  - Arterial blood gas (ABG) - gold standard, provides PaO2, PaCO2, pH
  - Hypoxemia defined as PaO2 <80 mmHg (normal 80-100 mmHg)
  - Assess for hypercapnia (PaCO2 >45 mmHg) and acidosis
  - Calculate A-a gradient [(FiO2 × [713]) - (PaCO2/0.8) - PaO2]
  - Normal <10-15 mmHg (increases with age)
  - Elevated A-a gradient suggests V/Q mismatch, shunt, or diffusion impairment
  - Normal A-a gradient suggests hypoventilation or low inspired O2
  - Chest X-ray - assess for pneumonia, pneumothorax, pulmonary edema, effusion
  - CT chest with PE protocol if pulmonary embolism suspected
  - Echocardiogram - assess cardiac function, pulmonary hypertension, intracardiac shunt
  - Complete blood count - anemia reduces O2 carrying capacity
  - Basic metabolic panel - assess for metabolic acidosis
  - Determine mechanism of hypoxemia (5 mechanisms)
  - Low inspired FiO2 (high altitude)
  - Hypoventilation (normal A-a gradient, elevated PaCO2)
  - V/Q mismatch (most common - COPD, pneumonia, PE)
  - Shunt (refractory to 100% O2 - ARDS, atelectasis, pneumonia)
  - Diffusion impairment (ILD, pulmonary fibrosis)
treatment:
  - Oxygen therapy (primary treatment for hypoxemia)
  - Target SpO2 ≥90% (or 88-92% in COPD with chronic hypercapnia)
  - Delivery systems based on severity
  - Nasal cannula 1-6 L/min (FiO2 24-44%)
  - Simple face mask 6-10 L/min (FiO2 40-60%)
  - Non-rebreather mask 10-15 L/min (FiO2 60-90%)
  - High-flow nasal cannula (HFNC) up to 60 L/min (FiO2 up to 100%)
  - Monitor for hyperoxia (PaO2 >120 mmHg) - can worsen hypercapnia in COPD
  - Treat underlying cause
  - Pneumonia - antibiotics
  - COPD exacerbation - bronchodilators, steroids
  - Pulmonary embolism - anticoagulation
  - Pulmonary edema/heart failure - diuretics, afterload reduction
  - Pneumothorax - chest tube
  - ARDS - lung-protective ventilation
  - Non-invasive positive pressure ventilation (BiPAP/CPAP) if hypoxemic respiratory failure
  - Particularly effective in cardiogenic pulmonary edema and COPD
  - Intubation and mechanical ventilation if NIV fails or contraindicated
  - Indications - altered mental status, inability to protect airway, refractory hypoxemia, hemodynamic instability
  - Lung-protective ventilation for ARDS (low tidal volume 6 mL/kg IBW)
  - Prone positioning for severe ARDS (PaO2/FiO2 <150)
  - ECMO (extracorporeal membrane oxygenation) for refractory hypoxemia despite maximal support
clinical_pearls:
  - SpO2 <90% roughly corresponds to PaO2 <60 mmHg (steep part of O2-Hb dissociation curve)
  - Pulse oximetry unreliable in severe hypotension, hypothermia, carbon monoxide poisoning
  - Chronic hypoxemia leads to polycythemia, pulmonary hypertension, cor pulmonale
  - Oxygen supplementation alone doesn't treat underlying cause - identify and treat etiology
  - Hypoxemia with normal A-a gradient → hypoventilation (CNS depression, neuromuscular disease)
  - Hypoxemia with elevated A-a gradient → V/Q mismatch, shunt, or diffusion problem
  - Shunt physiology - hypoxemia doesn't improve with 100% O2 (ARDS, pulmonary edema)
  - V/Q mismatch - hypoxemia improves with supplemental O2 (COPD, pneumonia)
  - Methemoglobinemia causes falsely low SpO2 (plateau at 85%) despite normal PaO2
  - Home oxygen therapy indicated if resting PaO2 ≤55 mmHg or SpO2 ≤88%
referrals:
  - Pulmonology for refractory hypoxemia, need for home oxygen, or unclear etiology
  - ICU for severe hypoxemic respiratory failure requiring mechanical ventilation
  - Cardiology if cardiac cause (heart failure, intracardiac shunt)
  - Sleep medicine if nocturnal hypoxemia from sleep apnea
differentials:
  - Pneumonia (infiltrate, fever)
  - COPD exacerbation (wheezing, hypercapnia)
  - Pulmonary embolism (sudden onset, pleuritic pain)
  - Heart failure/pulmonary edema (elevated JVP, crackles, BNP)
  - ARDS (bilateral infiltrates, recent insult)
  - Pneumothorax (decreased breath sounds)
  - Pleural effusion (dullness to percussion)
  - Interstitial lung disease (chronic, restrictive pattern)
  - Anemia (reduced O2 carrying capacity, normal PaO2)
  - High altitude (low inspired FiO2)
  - Hypoventilation (CNS depression, neuromuscular disease)
