tree_id: ENDO-POLYCYSTIC-OVARY-SYNDROME
name: Polycystic Ovary Syndrome
family: Endocrinology
specialty: Endocrinology
chief_complaint: Irregular periods, hirsutism, and acne
description: |
  Most common endocrine disorder in women of reproductive age, affects 5-10% of population. Characterized by hyperandrogenism, ovulatory dysfunction, polycystic ovaries.
  Associated with insulin resistance, metabolic syndrome, increased cardiovascular risk. Long-term complications include type 2 diabetes, endometrial cancer.
icd10: E28.2
urgency: Low
workup:
  - Rotterdam criteria (2 of 3 required) - hyperandrogenism (clinical or biochemical), ovulatory dysfunction, polycystic ovaries on ultrasound
  - Clinical hyperandrogenism - hirsutism (modified Ferriman-Gallwey score greater than 8), acne, male-pattern baldness
  - Biochemical hyperandrogenism - elevated total or free testosterone, androstenedione, DHEA-S
  - Ovulatory dysfunction - oligomenorrhea (cycles longer than 35 days) or amenorrhea
  - Pelvic ultrasound - 12 or more follicles 2-9 mm diameter in one ovary, or ovarian volume greater than 10 mL
  - Rule out other causes of hyperandrogenism - 17-hydroxyprogesterone (nonclassic congenital adrenal hyperplasia), TSH (thyroid disorders), prolactin (hyperprolactinemia), consider Cushing syndrome if clinical features
  - Assess metabolic complications - fasting glucose and insulin (insulin resistance), 2-hour oral glucose tolerance test, HbA1c, lipid panel
  - HOMA-IR (homeostatic model assessment) calculates insulin resistance
treatment:
  - Lifestyle modifications first-line - weight loss 5-10% improves ovulation, insulin sensitivity, reduces testosterone
  - Regular exercise and dietary modification (low glycemic index diet)
  - Hormonal contraceptives for menstrual irregularity and hyperandrogenism - combined oral contraceptives (ethinyl estradiol/norgestimate or drospirenone) suppress androgens, regulate cycles, reduce hirsutism and acne
  - Metformin 500-2000mg daily (with meals) improves insulin sensitivity, may restore ovulation, reduces diabetes risk
  - Antiandrogens for hirsutism - spironolactone 50-200mg daily (blocks androgen receptors, takes 6 months for effect), finasteride 5mg daily (5-alpha reductase inhibitor, teratogenic)
  - Combine OCPs with spironolactone for better hirsutism control (OCP prevents pregnancy on spironolactone)
  - Local hair removal - laser therapy, electrolysis
  - Topical eflornithine cream for facial hirsutism
  - Ovulation induction for infertility - clomiphene citrate 50-150mg days 5-9 of cycle, letrozole 2.5-7.5mg days 3-7 (first-line, higher live birth rate), gonadotropins if refractory
  - Endometrial protection - if not on OCPs and amenorrheic greater than 3 months, give progestin (medroxyprogesterone 10mg x 10 days) every 3 months to prevent endometrial hyperplasia
  - Screen for complications - diabetes screening (OGTT) every 2-3 years, lipid panel, blood pressure, assess for depression/anxiety
clinical_pearls:
  - PCOS spectrum disorder with variable presentation - some have all features, others minimal
  - Anovulation causes unopposed estrogen, increasing endometrial cancer risk (10-fold if amenorrhea)
  - Acanthosis nigricans (velvety hyperpigmentation in skin folds) marker of insulin resistance
  - Cardiovascular risk increased independent of obesity
  - Prevalence of obstructive sleep apnea higher in PCOS
  - First-degree relatives have 50% risk of PCOS or glucose intolerance
differentials:
  - Hypothyroidism
  - Hyperprolactinemia
  - Nonclassic congenital adrenal hyperplasia
  - Cushing syndrome
  - Androgen-secreting tumor
  - Idiopathic hirsutism
trace:
  - 26-year-old woman with irregular periods since menarche (cycles 45-90 days), excess facial and chest hair, acne → BMI 32, acanthosis nigricans, Ferriman-Gallwey score 14 → Labs show total testosterone 78 ng/dL (elevated), LH/FSH ratio 3:1, prolactin and TSH normal → Fasting glucose 105 mg/dL, 2-hour OGTT 165 mg/dL (impaired glucose tolerance), lipids show elevated triglycerides → Pelvic ultrasound shows bilateral polycystic ovaries (15+ follicles each ovary) → Diagnose PCOS (hyperandrogenism, ovulatory dysfunction, polycystic ovaries) plus prediabetes → Counsel on lifestyle modification, target 10% weight loss → Start metformin 500mg daily, titrate to 1000mg BID, combined oral contraceptive (ethinyl estradiol/drospirenone) → Add spironolactone 100mg daily for hirsutism → After 6 months, regular monthly cycles, hirsutism improved, weight loss 18 lbs, fasting glucose normalizes
