tree_id: RHEUM-ARTHRITIS-RHEUMATOID
name: Rheumatoid Arthritis
family: Rheumatology
specialty: Rheumatology
chief_complaint: Joint pain and swelling
description: Chronic autoimmune inflammatory arthritis causing symmetric polyarthritis primarily affecting small joints of hands and feet with progressive joint destruction if untreated. Early aggressive DMARD therapy prevents irreversible damage.
icd10: M05.9
urgency: non-urgent

workup:
  - Clinical diagnosis: symmetric polyarthritis involving small joints (MCPs, PIPs, wrists, MTPs) lasting >6 weeks with morning stiffness >1 hour
  - RF (rheumatoid factor): positive in 70-80% (not specific - also elevated in other conditions)
  - Anti-CCP (anti-cyclic citrullinated peptide): highly specific 95% (more specific than RF, prognostic for erosive disease)
  - Inflammatory markers: ESR and CRP elevated (correlate with disease activity)
  - Hand and foot X-rays: early periarticular osteopenia, later joint space narrowing and erosions (irreversible)
  - Ultrasound or MRI: detect synovitis and erosions earlier than X-ray
  - Screen for comorbidities: hepatitis B/C, tuberculosis (before biologics), lipids, BMD

treatment:
  - Early aggressive DMARD therapy: start within 3 months of symptom onset to prevent joint damage
  - Methotrexate first-line: 15-25 mg PO or SC weekly plus folic acid 1 mg daily (reduces side effects)
  - If inadequate response add or switch: hydroxychloroquine, sulfasalazine, leflunomide
  - Biologic DMARDs if MTX fails: TNF inhibitors (etanercept, adalimumab, infliximab), or non-TNF (rituximab, tocilizumab, abatacept)
  - JAK inhibitors: tofacitinib, baricitinib (oral, as effective as biologics)
  - Bridge therapy: low-dose prednisone 5-10 mg daily or NSAIDs for symptom relief while DMARDs take effect (6-12 weeks)
  - Treat to target: goal DAS28 remission or low disease activity
  - Monitor: CBC, CMP, LFTs every 8-12 weeks on methotrexate (check for myelosuppression and hepatotoxicity)
  - Avoid live vaccines on immunosuppression
  - Cardiovascular risk reduction: statins, BP control (increased CV risk)

clinical_pearls:
  - Symmetric polyarthritis small joints with morning stiffness >1 hour classic presentation
  - Anti-CCP highly specific 95% and prognostic for erosive disease
  - Start methotrexate within 3 months to prevent irreversible joint damage
  - Folic acid 1 mg daily reduces methotrexate side effects
  - TNF inhibitors if methotrexate inadequate response
  - Increased cardiovascular disease risk - aggressive CV risk factor management
  - Extra-articular manifestations: rheumatoid nodules, interstitial lung disease, pericarditis, Felty syndrome

differentials:
  - Psoriatic arthritis: DIP involvement, nail pitting, psoriasis, asymmetric oligoarthritis, dactylitis
  - Systemic lupus erythematosus: malar rash, photosensitivity, ANA positive, non-erosive arthritis
  - Osteoarthritis: DIP and first CMC involvement, Heberden and Bouchard nodes, no inflammatory markers
  - Polymyalgia rheumatica: older age >50, shoulder and hip girdle stiffness, elevated ESR/CRP, responds dramatically to low-dose prednisone

trace: |
  A 42-year-old woman presented with 4 months of bilateral hand and wrist pain and swelling with 2 hours of morning stiffness. Exam showed symmetric synovitis of bilateral MCPs, PIPs, and wrists with decreased grip strength. Labs showed RF 156 (positive), anti-CCP 248 (strongly positive), ESR 48, CRP 3.2. Hand X-rays showed periarticular osteopenia without erosions (early disease). Diagnosed with early rheumatoid arthritis and started methotrexate 15 mg weekly plus folic acid 1 mg daily with prednisone 10 mg daily bridge therapy. At 6 weeks synovitis improved, prednisone tapered off. At 3 months increased methotrexate to 20 mg weekly. At 6 months achieved DAS28 remission with ESR 12, CRP 0.4, no active synovitis. Annual X-rays stable without new erosions. Remains in remission on methotrexate monotherapy at 2 years with excellent functional status.
