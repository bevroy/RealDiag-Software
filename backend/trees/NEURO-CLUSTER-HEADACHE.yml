tree_id: NEURO-CLUSTER-HEADACHE
name: Cluster Headache
family: Neurology
specialty: Neurology
chief_complaint: Severe unilateral orbital/periorbital pain with autonomic features
description: Primary headache disorder characterized by severe unilateral pain with ipsilateral autonomic symptoms in cyclical clusters
icd10: G44.009
urgency: urgent
workup:
  - Clinical diagnosis based on characteristic features (ICHD-3 criteria)
  - Headache characteristics - hallmark severe unilateral orbital/periorbital pain
  - Strictly unilateral (always same side during cluster period)
  - Severity 9-10/10, excruciating, "worst pain imaginable"
  - Orbital, supraorbital, temporal location
  - Quality - boring, stabbing, burning
  - Duration 15-180 minutes untreated (typically 45-90 minutes)
  - Frequency 1-8 attacks per day during cluster period
  - Circadian pattern - often same time each day, frequently nocturnal (1-2 AM)
  - Ipsilateral autonomic features (at least one required for diagnosis)
  - Conjunctival injection (red eye)
  - Lacrimation (tearing)
  - Nasal congestion
  - Rhinorrhea (clear nasal drainage)
  - Eyelid edema
  - Facial sweating
  - Miosis (constricted pupil)
  - Ptosis (droopy eyelid)
  - Partial Horner syndrome (miosis plus ptosis)
  - Behavioral features - restlessness, agitation during attack
  - Cannot lie still (unlike migraine where patients prefer stillness)
  - Pacing, rocking, head-banging
  - Cluster patterns
  - Episodic cluster headache (85-90%) - cluster periods lasting 7 days to 1 year, separated by pain-free remission periods of at least 3 months
  - Chronic cluster headache (10-15%) - attacks for greater than 1 year without remission, or remission lasting less than 3 months
  - Cluster period triggers - alcohol (provokes attack within 30-60 minutes during cluster), vasodilators (nitroglycerin), histamine
  - Physical examination
  - During attack - unilateral autonomic signs (conjunctival injection, lacrimation, nasal congestion, Horner signs)
  - Patient restless, agitated, unable to sit still
  - Between attacks - neurologic exam normal
  - Imaging - to rule out secondary causes (structural lesions)
  - MRI brain with and without contrast - rule out pituitary tumor, cavernous sinus lesion, aneurysm, AVM
  - Indicated if atypical features, first episode, changed pattern, abnormal neurologic exam
  - MRA or CTA - if concern for vascular abnormality
treatment:
  - Acute abortive therapy - terminate ongoing attack
  - High-flow oxygen - first-line, extremely effective
  - 100% oxygen at 12-15 liters per minute via non-rebreather mask for 15-20 minutes
  - 70-80% abort attack within 15 minutes
  - No side effects, safe, can use multiple times daily
  - Triptans (5-HT1B/1D agonists)
  - Sumatriptan 6 mg subcutaneous - most effective triptan route
  - Onset 10-15 minutes, 75% effective
  - Can repeat once after 1 hour (max 12 mg/day)
  - Sumatriptan 20 mg intranasal spray - alternative
  - Zolmitriptan 5-10 mg intranasal - alternative
  - Oral triptans NOT effective (too slow onset)
  - Contraindications - uncontrolled hypertension, coronary artery disease, recent stroke
  - Intranasal lidocaine 4% - second-line
  - 1 mL instilled in nostril on affected side
  - Octreotide 100 mcg SC - alternative for patients with triptan contraindications
  - Preventive (prophylactic) therapy - reduce frequency and severity of attacks during cluster period
  - Verapamil - first-line preventive
  - Start 80 mg TID, increase every 2 weeks by 80 mg
  - Effective dose typically 240-480 mg/day (divided TID or QID)
  - Up to 960 mg/day may be needed
  - Monitor EKG (risk of heart block at higher doses) - baseline and after dose increases
  - Takes 1-2 weeks to become effective
  - Taper slowly when cluster period ends (sudden stop can cause rebound)
  - Corticosteroids - bridge therapy while verapamil takes effect
  - Prednisone 60-80 mg daily for 5-7 days, then rapid taper over 2-3 weeks
  - Rapid onset (2-3 days), temporary effect
  - Avoid long-term use
  - Lithium - for chronic cluster headache
  - 300 mg BID or TID, target level 0.6-1.2 mEq/L
  - Monitor lithium levels, renal function, thyroid function
  - Side effects - tremor, polyuria, weight gain, hypothyroidism
  - Galcanezumab (CGRP monoclonal antibody) - FDA approved for episodic cluster
  - 300 mg SC monthly
  - Reduces attack frequency
  - Nerve blocks
  - Greater occipital nerve block - lidocaine plus steroid injection
  - Can provide temporary relief, bridge therapy
  - Transitional (bridge) therapy - for start of cluster period
  - Prednisone 60-80 mg daily taper over 2-3 weeks PLUS
  - Verapamil titration (takes time to work)
  - Greater occipital nerve block
  - Refractory chronic cluster headache - interventional options
  - Sphenopalatine ganglion stimulation (implanted neurostimulator)
  - Occipital nerve stimulation
  - Deep brain stimulation of hypothalamus (last resort, experimental)
  - Lifestyle modifications during cluster period
  - Avoid alcohol completely (strong trigger)
  - Avoid vasodilators (nitroglycerin, sildenafil)
  - Maintain regular sleep schedule
  - Avoid daytime naps (can trigger attacks)
clinical_pearls:
  - Prevalence 0.1%, male-to-female ratio 3-4:1, onset typically 20-40 years
  - Called "cluster" because attacks cluster in time (cluster periods)
  - Called "alarm clock headache" due to nocturnal timing (1-2 AM common)
  - Most painful condition known to medicine - "suicide headache"
  - Strictly unilateral (always same side during cluster period) - if alternates sides, reconsider diagnosis
  - Restlessness/agitation pathognomonic (distinguishes from migraine where patients lie still)
  - Alcohol reliably triggers attacks during cluster period but NOT during remission
  - Smoking strongly associated (80-90% of patients are smokers)
  - High-flow oxygen extremely effective, underutilized (patients need home oxygen tanks)
  - Verapamil first-line preventive, requires high doses (much higher than for hypertension)
  - Cluster periods often seasonal (spring and fall common)
  - Men affected more than women but gap narrowing
  - Not life-threatening but severely impacts quality of life
differentials:
  - Trigeminal neuralgia (brief lancinating pain seconds to 2 minutes, triggered by touch, no autonomic features)
  - Paroxysmal hemicrania (similar to cluster but shorter duration 2-30 minutes, more frequent, responds to indomethacin)
  - SUNCT/SUNA syndrome (short-lasting unilateral neuralgiform headache - very brief attacks seconds to minutes, many per hour)
  - Migraine (longer duration 4-72 hours, bilateral or unilateral, photophobia/phonophobia, prefer quiet dark room)
  - Carotid or vertebral artery dissection (sudden onset, Horner syndrome, imaging shows dissection)
  - Pituitary tumor (persistent symptoms, visual field defects, MRI shows mass)
  - Temporal arteritis (older patient greater than 50, elevated ESR/CRP, jaw claudication)
  - Cavernous sinus thrombosis (fever, proptosis, ophthalmoplegia, imaging shows thrombosis)
trace:
  - 35-year-old man presents to ED with severe right eye pain for past 45 minutes
  - Pain came on suddenly around midnight while sleeping
  - Woke him from sleep with excruciating right-sided head pain
  - Located around and behind right eye, severity 10/10
  - Feels like "ice pick stabbing through eye"
  - Right eye tearing profusely, red, swollen eyelid
  - Right nostril running with clear discharge
  - Cannot sit still, pacing around room, holding head
  - Similar episode last night at 1 AM, lasted about 1 hour, resolved spontaneously
  - 3 weeks ago started having these episodes almost daily, 1-3 times per day
  - Always right-sided, often wake him at night
  - Had similar cluster of headaches 1 year ago in spring, lasted 8 weeks then stopped completely
  - Past medical history - none
  - Medications - ibuprofen (not helpful)
  - Tobacco - 1 pack per day for 15 years
  - Physical exam - during attack, patient pacing, agitated, in severe distress
  - Cannot sit still for examination
  - Right eye - conjunctival injection (red), tearing, eyelid edema
  - Right pupil slightly smaller than left (miosis)
  - Slight right ptosis (partial Horner syndrome)
  - Right nostril - clear rhinorrhea
  - Neurologic exam otherwise normal
  - During attack - administered 100% oxygen 15 L/min via non-rebreather mask
  - After 12 minutes - pain significantly decreased
  - After 20 minutes - pain resolved, patient calm
  - Autonomic features resolving
  - Diagnosis - Cluster headache, episodic, in active cluster period
  - Current cluster period approximately 3 weeks duration, attacks 1-3 per day
  - Pattern consistent with episodic cluster headache (had similar cluster 1 year ago)
  - Treatment plan
  - Acute abortive therapy
  - Prescribed home oxygen (100% oxygen with regulator, non-rebreather mask)
  - 12-15 L/min at onset of attack for 15-20 minutes
  - Sumatriptan 6 mg subcutaneous injection - provide 2 pens
  - Use if oxygen unavailable or not effective
  - Can use 1 injection per attack, max 2 per day
  - Preventive therapy to reduce attack frequency
  - Prednisone 60 mg daily for 1 week (bridge therapy)
  - Then taper - 40 mg for 3 days, 20 mg for 3 days, 10 mg for 3 days, then stop
  - Verapamil 80 mg TID (start low)
  - Increase to 120 mg TID in 1 week, then 160 mg TID in 2 weeks
  - Target dose 480 mg/day (160 mg TID)
  - Baseline EKG obtained - normal
  - Plan repeat EKG after dose increases
  - Lifestyle modifications
  - Avoid alcohol completely during cluster period (strong trigger)
  - Maintain regular sleep schedule
  - Smoking cessation counseling
  - Neurology referral for ongoing management
  - 1-week follow-up - significant improvement
  - Attacks decreased from 2-3 per day to 1 per day
  - Oxygen very effective - aborts most attacks within 15 minutes
  - Used sumatriptan twice when away from home (effective)
  - Prednisone helping
  - Verapamil increased to 120 mg TID
  - Repeat EKG - normal
  - Continue plan
  - 3-week follow-up - continued improvement
  - Attacks now every other day, less severe
  - Verapamil increased to 160 mg TID (target dose 480 mg/day)
  - Prednisone taper completed
  - Repeat EKG - normal (no heart block)
  - 6-week follow-up - cluster period ending
  - No attacks for past 5 days
  - Continue verapamil for another 2 weeks then begin slow taper
  - Keep oxygen and sumatriptan available in case of recurrence
  - 8-week follow-up - cluster period resolved
  - No attacks for 3 weeks
  - Begin verapamil taper - decrease by 80 mg every week
  - Anticipate next cluster period may occur in 6-12 months (based on prior history)
  - At that time can restart verapamil prophylaxis
  - Patient educated on recognizing cluster period onset
  - Restart verapamil at first sign of attacks
  - 1-year follow-up - new cluster period started 2 days ago
  - Patient restarted verapamil 240 mg/day immediately (saved medication)
  - Using oxygen for attacks
  - Prescribed prednisone bridge therapy
  - Will manage current cluster period with same approach
  - Outcome - Excellent response to oxygen and verapamil, effective management of cluster periods
