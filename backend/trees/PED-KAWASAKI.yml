tree_id: PED-KAWASAKI
name: Kawasaki Disease
family: Pediatrics
specialty: Pediatrics
icd10:
- M30.3
snomed:
- '75053002'
urgency: medium
description: Comprehensive evaluation and management of Kawasaki Disease
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Fever ≥5 days (high, persistent, often >39°C/102°F)
- Bilateral non-exudative conjunctival injection (red eyes, no discharge)
- 'Oral changes: Strawberry tongue, cracked red lips, erythematous pharynx'
- 'Polymorphous rash: Maculopapular, diffuse truncal rash (not vesicular)'
- 'Cervical lymphadenopathy: Usually unilateral, >1.5 cm'
- 'Extremity changes: Erythema/edema of hands/feet (acute), periungual desquamation
  (2-3 weeks later)'
- Peak age 6 months to 5 years (80% <5 years), more common in Asian descent
- 'Incomplete Kawasaki: <4 criteria but high suspicion, still treat if cardiac involvement'
workup: []
treatment:
- 'Guideline-based treatment options for Kawasaki Disease include:'
- 'Immediate: Cardiology consult, echocardiogram, labs (CBC, CRP, ESR, liver enzymes)
  (AAP 2023)'
- IVIG 2 g/kg IV over 10-12 hours as single dose (within 10 days of fever onset) (AAP
  2023)
- 'Aspirin: High-dose 80-100 mg/kg/day divided QID until afebrile 48-72hr, then low-dose
  3-5 mg/kg daily ×6-8 weeks (AAP 2023)'
- 'If IVIG resistant: 2nd dose IVIG 2 g/kg or add methylprednisolone 2 mg/kg/day (AAP
  2023)'
- 'Disposition: Admit for IVIG infusion, follow-up echo at 6-8 weeks, long-term cardiology
  follow-up if aneurysms (AAP 2023)'
clinical_pearls:
- 'Diagnosis: Fever ≥5 days + 4 of 5 criteria (eyes, mouth, rash, lymph nodes, extremities)'
- 'IVIG 2 g/kg over 10-12 hours within 10 days of fever onset: Reduces coronary aneurysm
  risk from 25% to 4%'
- High-dose aspirin 80-100 mg/kg/day divided QID during acute phase, then low-dose
  3-5 mg/kg once daily
- 'Echocardiogram at diagnosis and 6-8 weeks: Screen for coronary artery aneurysms
  (most serious complication)'
- 'IVIG resistance (10-20%): Persistent fever >36hr after IVIG, may need 2nd dose
  IVIG or steroids'
- Do NOT give live vaccines for 11 months after IVIG (antibody interference)
referrals: []
differentials:
  - Scarlet fever
  - Toxic shock syndrome
  - Staphylococcal scalded skin
  - Viral exanthem
  - Stevens-Johnson
