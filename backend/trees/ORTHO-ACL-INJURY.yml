tree_id: ORTHO-ACL-INJURY
name: ACL Injury (Anterior Cruciate Ligament)
family: orthopedics
specialty: Orthopedics
icd10: S83.509A
snomed: 427939000
urgency: []
homeopathy: []
presentations:
  - Acute knee pain after non-contact pivoting or deceleration injury
  - Audible "pop" at time of injury (classic finding)
  - Immediate knee swelling within 2-6 hours (hemarthrosis)
  - Feeling of knee instability or "giving way"
  - Difficulty bearing weight or walking
  - Unable to continue playing sports after injury
  - Sensation that knee will buckle with pivoting or cutting
  - Common in basketball, soccer, football, skiing
  - More common in female athletes (2-8x higher risk)
workup:
  - Clinical diagnosis based on mechanism, exam, and imaging
  - Mechanism of injury (highly suggestive)
  - Non-contact deceleration or pivoting
  - Sudden direction change or landing from jump
  - Direct blow to knee in hyperextension
  - Physical examination
  - Large knee effusion (hemarthrosis in 70-80% of acute ACL tears)
  - Lachman test - most sensitive (85-95% sensitive, 95% specific)
  - Anterior drawer test - less sensitive acutely due to swelling
  - Pivot shift test - most specific (98% specific) but difficult acutely
  - Assess for associated injuries (meniscus, collateral ligaments)
  - Neurovascular exam (popliteal pulse, peroneal nerve)
  - Imaging
  - Knee X-rays to rule out fracture (Segond fracture suggests ACL tear)
  - MRI knee - gold standard for diagnosis
  - 90-95% sensitive and specific for ACL tear
  - Assesses for partial vs complete tear
  - Identifies associated meniscal and ligament injuries
  - Bone bruising pattern (lateral femoral condyle and posterolateral tibia)
  - Assess for associated injuries (common)
  - Meniscal tears (50-70% of ACL tears, especially medial meniscus)
  - MCL sprain (30% - "unhappy triad" with medial meniscus)
  - Bone bruises, chondral injuries
treatment:
  - Acute management (first 2-4 weeks)
  - RICE protocol: rest, ice, compression, elevation
  - Crutches if unable to bear weight
  - Knee brace or immobilizer for comfort initially
  - NSAIDs for pain and inflammation
  - Early range of motion exercises (gentle flexion/extension)
  - Quad sets and straight leg raises to prevent atrophy
  - Non-operative management (selective patients)
  - Indications: low-demand lifestyle, older age, partial tears, sedentary
  - Hinged knee brace initially
  - Physical therapy: quad strengthening, hamstring strengthening, proprioception
  - Activity modification (avoid pivoting, cutting sports)
  - 50-60% report satisfactory function, but higher risk of meniscal tears and OA
  - Operative management - ACL reconstruction (most active patients)
  - Indications
  - Young, active patients who want to return to sports
  - Pivoting sports (soccer, basketball, football, skiing)
  - Combined injuries (repairable meniscus tear)
  - Persistent instability despite PT
  - Timing: typically 2-6 weeks after injury (allow swelling to resolve, regain ROM)
  - Graft options
  - Bone-patellar tendon-bone autograft (gold standard for athletes)
  - Hamstring tendon autograft (less anterior knee pain)
  - Allograft (cadaver tissue) - older patients, revision surgery
  - Arthroscopic reconstruction - minimally invasive
  - Postoperative rehabilitation
  - Phase 1 (0-6 weeks): ROM, quad activation, weight-bearing progression
  - Phase 2 (6-12 weeks): strengthening, proprioception
  - Phase 3 (3-6 months): running, agility, sport-specific training
  - Phase 4 (6-12 months): return to sport clearance
  - Return to sport typically 9-12 months post-op
clinical_pearls:
  - "ACL tear classic triad: pop, immediate swelling (hemarthrosis), instability"
  - "Lachman test most sensitive for ACL tear (85-95%) - perform in 20-30° flexion"
  - "Female athletes 2-8x higher ACL injury risk (anatomy, hormones, biomechanics)"
  - "75% of ACL tears are non-contact injuries (pivoting, deceleration, landing)"
  - "Segond fracture (lateral tibial rim avulsion) on X-ray pathognomonic for ACL tear"
  - "50-70% have associated meniscal tear - medial more common than lateral"
  - "Without surgery, 50-80% report instability with activities within 5 years"
  - "ACL tear increases risk of knee OA 10-20 years later (even with reconstruction)"
referrals:
  - Orthopedic sports medicine for all suspected ACL tears
  - MRI recommended before orthopedic consult
  - Emergency orthopedics if knee dislocation or neurovascular compromise
  - Physical therapy for pre-operative (prehab) and post-operative rehabilitation
differentials:
  - ACL tear (pop, hemarthrosis, positive Lachman, MRI confirmation)
  - PCL tear (posterior drawer, dashboard injury, less common)
  - Meniscal tear (joint line tenderness, mechanical symptoms)
  - MCL sprain (valgus mechanism, medial pain, valgus stress laxity)
  - Patellar dislocation (lateral patellar displacement, young females)
  - Tibial plateau fracture (high-energy trauma, visible on X-ray)
  - Bone contusion (MRI shows bone bruising without ligament tear)
