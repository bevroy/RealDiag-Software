tree_id: CARDS-HYPERLIPIDEMIA
name: Hyperlipidemia
family: cardiology
specialty: Cardiology
icd10: E78.5
snomed: 55822004
urgency: routine
homeopathy: []
presentations:
  - Asymptomatic, found on screening labs
  - Xanthomas (cholesterol deposits in skin)
  - Xanthelasma (deposits around eyelids)
  - Corneal arcus (white ring around cornea)
  - Family history of premature cardiovascular disease
  - Known coronary artery disease or stroke
  - Diabetes mellitus or metabolic syndrome
  - Peripheral arterial disease
workup:
  - Fasting lipid panel (total cholesterol, LDL, HDL, triglycerides)
  - Non-fasting lipid panel acceptable for screening
  - Calculate ASCVD (atherosclerotic cardiovascular disease) 10-year risk score
  - Assess for secondary causes (thyroid function, HbA1c, renal function, liver function)
  - Screen for familial hyperlipidemia if LDL >190 mg/dL
  - Lipid panel q3-12 months after starting therapy to monitor response
treatment:
  - Lifestyle modifications (first-line for all patients)
  - Diet - Mediterranean or DASH diet, reduce saturated fat <7% calories
  - Exercise - 150 minutes moderate aerobic activity per week
  - Weight loss if overweight (goal 5-10% reduction)
  - Smoking cessation
  - Statin therapy based on ASCVD risk score and LDL level
  - High-intensity statins (atorvastatin 40-80mg or rosuvastatin 20-40mg) for ASCVD ≥7.5% or LDL ≥190
  - Moderate-intensity statins for diabetes age 40-75 or ASCVD 5-7.5%
  - Ezetimibe 10mg daily if statin intolerant or inadequate response
  - PCSK9 inhibitors (evolocumab, alirocumab) for familial hyperlipidemia or high-risk with inadequate response
  - Icosapent ethyl 2g BID for triglycerides 150-499 on statin therapy
  - Fibrates (fenofibrate) for severe hypertriglyceridemia >500 mg/dL
  - Niacin rarely used due to side effects and lack of outcomes benefit
  - Bile acid sequestrants (colesevelam) as adjunct therapy
clinical_pearls:
  - Goal LDL <70 mg/dL for very high risk (established ASCVD), <100 for high risk
  - Statins reduce cardiovascular events by 25-30% and all-cause mortality
  - Check CK and hepatic function before starting statins, repeat if symptoms develop
  - Statin-associated muscle symptoms occur in 10-15% (true myopathy <0.1%)
  - Consider coenzyme Q10 for statin-related myalgias
  - Avoid grapefruit juice with atorvastatin and simvastatin (CYP3A4 interaction)
  - Hypertriglyceridemia >1000 mg/dL increases acute pancreatitis risk
  - Non-HDL cholesterol (total - HDL) is better predictor than LDL when TG >200
  - Lipoprotein(a) is independent risk factor not affected by statins
  - Familial hypercholesterolemia screening indicated if LDL >190 mg/dL or premature CAD
referrals:
  - Cardiology for established cardiovascular disease or LDL >190 despite therapy
  - Lipid specialist for refractory hyperlipidemia or familial forms
  - Dietitian for medical nutrition therapy
  - Endocrinology if secondary dyslipidemia due to diabetes or thyroid disease
differentials:
  - Familial hypercholesterolemia (LDL >190, family history, premature CAD)
  - Familial combined hyperlipidemia (elevated LDL and triglycerides)
  - Hypertriglyceridemia (TG >150 mg/dL, associated with metabolic syndrome)
  - Secondary dyslipidemia (hypothyroidism, nephrotic syndrome, cholestasis)
  - Metabolic syndrome (dyslipidemia with HTN, obesity, insulin resistance)
