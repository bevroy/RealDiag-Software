tree_id: NEU-STATUS-EPILEPTICUS
name: Status epilepticus
family: Neurology
specialty: Neurology
icd10:
- G41.9
snomed:
- '230456007'
urgency: medium
description: Comprehensive evaluation and management of Status epilepticus
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- prolonged seizure >5 minutes or recurrent seizures without recovery
- medical emergency requiring immediate treatment
- Generalized tonic-clonic (most common) or focal with impaired awareness
- Altered consciousness, coma
- High mortality (10-20%) if treatment delayed
- 'Causes: Medication noncompliance, CNS infection, metabolic, withdrawal'
workup:
- 'Glucose: Fingerstick immediately (hypoglycemia can cause seizures)'
- 'Labs: CBC, CMP (lytes, Ca, Mg), AED levels if on meds, tox screen'
- 'LP: If fever or concern for meningitis/encephalitis (after CT if focal deficits)'
- 'MRI brain: After stabilization to rule out structural cause'
- 'EEG: Continuous monitoring if refractory status or persistent altered mental status'
treatment:
- 'Guideline-based treatment options for Status epilepticus include:'
- '0-5 min: ABCs, O2, IV access, check glucose, give thiamine if indicated (AAN 2024)'
- '5-10 min: Lorazepam 4mg IV (may repeat once) or midazolam 10mg IM (AAN 2024)'
- '10-20 min: Fosphenytoin 20 PE/kg IV or levetiracetam 60mg/kg IV (max 4500mg) (AAN
  2024)'
- '20-40 min: Refractory status - intubate, propofol/midazolam drip, ICU, EEG (AAN
  2024)'
- 'Workup: Labs (CBC, CMP, tox screen, AED levels), LP if concern for infection, MRI
  brain (AAN 2024)'
clinical_pearls:
- 'Time is brain: Start treatment at 5 minutes, not 30 minutes (old definition outdated)'
- 'Benzodiazepines FIRST: Lorazepam 0.1mg/kg IV (or diazepam, midazolam IM)'
- 'If benzos fail (refractory): Fosphenytoin 20 PE/kg IV or levetiracetam 60mg/kg
  IV'
- 'If still seizing: Intubation + propofol or midazolam infusion, EEG monitoring'
- Check glucose immediately (hypoglycemia can mimic seizure)
- Thiamine 100mg IV before dextrose if malnourished/alcoholic
referrals:
- Neurology STAT for refractory status epilepticus
- ICU admission for all status epilepticus requiring >1 dose of benzos
differentials: []
trace:
