- L40.59
- M07.60
snomed:
- '33339001'
urgency: medium
description: Comprehensive evaluation and management of Psoriatic Arthritis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Joint pain and swelling
- Psoriatic skin lesions
- Nail pitting or onycholysis
- Dactylitis (sausage digits)
- Enthesitis
workup:
- 'RF and anti-CCP: Negative (seronegative arthritis)'
- 'ESR/CRP: Elevated in 50%'
- 'X-ray: Pencil-in-cup deformity (severe erosions), periostitis (new bone formation),
  ankylosis'
- 'Psoriasis: Look at scalp, elbows, knees, umbilicus, gluteal cleft, nails (pitting,
  onycholysis, oil spots)'
- 'Nail changes: 80% with psoriatic arthritis have nail involvement (vs 40% with psoriasis
  without arthritis)'
treatment:
- 'Guideline-based treatment options for Psoriatic Arthritis include:'
- 'NSAIDs: Ibuprofen 600mg TID or naproxen 500mg BID for mild disease (ACR 2023)'
- 'DMARDs: Methotrexate 15-25mg weekly (treats both skin and joints) - first-line
  (ACR 2023)'
- 'Anti-TNF biologics: If failed methotrexate. Etanercept, adalimumab, infliximab,
  certolizumab, golimumab - very effective for joints and skin (ACR 2023)'
- 'IL-17 inhibitors: Secukinumab, ixekizumab - excellent for skin, effective for joints
  (ACR 2023)'
- 'IL-12/23 inhibitor: Ustekinumab - effective for skin and joints (ACR 2023)'
- 'Topical steroids for skin: Betamethasone 0.05% BID, coal tar, vitamin D analogs
  (ACR 2023)'
clinical_pearls:
- Inflammatory arthritis associated with psoriasis - 30% of psoriasis patients develop
  arthritis (usually skin lesions precede arthritis by 10 years)
- 'DIP joint involvement: Classic feature distinguishing from RA (RA spares DIP).
  Nail changes (pitting, onycholysis) correlate with DIP arthritis'
- 'Dactylitis (sausage digit): Entire finger/toe swollen - pathognomonic for psoriatic
  arthritis or reactive arthritis'
- 'Enthesitis: Inflammation at tendon/ligament insertion (Achilles, plantar fascia)
  - distinguishes spondyloarthropathies from RA'
- 'Five patterns: DIP (5%), asymmetric oligoarticular (70%), symmetric polyarticular
  (15%, RA-like), spondylitis (5%), arthritis mutilans (5%, very destructive)'
referrals:
- Rheumatology for all psoriatic arthritis - early DMARD/biologic prevents joint damage
- Dermatology for psoriasis management
differentials: []
