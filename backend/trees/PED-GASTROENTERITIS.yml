tree_id: PED-GASTROENTERITIS
name: Gastroenteritis (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine
icd10: A09
snomed: 25374005
urgency: []
homeopathy: []
presentations:
  - Diarrhea (loose or watery stools, increased frequency)
  - Vomiting
  - Abdominal cramping or pain
  - Fever (low-grade to moderate)
  - Decreased appetite
  - Nausea
  - Signs of dehydration (dry mucous membranes, decreased tears, decreased urine output)
  - Irritability or lethargy in infants
  - Recent sick contacts or daycare exposure
  - Symptoms typically last 3-7 days for viral causes
workup:
  - Clinical history
  - Onset, duration, and frequency of diarrhea and vomiting
  - Stool characteristics
  - Consistency (watery, mucoid, bloody)
  - Frequency (number of stools per day)
  - Presence of blood or mucus
  - Volume
  - Vomiting pattern and severity
  - Fever pattern
  - Oral intake and urine output (assess dehydration)
  - Associated symptoms (abdominal pain, tenesmus, urgency)
  - Exposures
  - Sick contacts, daycare attendance
  - Recent travel (domestic or international)
  - Contaminated food or water
  - Antibiotic use (C. difficile risk)
  - Camping, well water, swimming in lakes
  - Animal exposures (reptiles - Salmonella)
  - Physical examination
  - Vital signs (fever, tachycardia, orthostatic changes)
  - Hydration status (see dehydration assessment)
  - Weight (compare to baseline if available)
  - Abdominal examination
  - Distension, tenderness, guarding
  - Bowel sounds (hyperactive versus absent)
  - Assess for peritoneal signs
  - Hepatosplenomegaly
  - Rectal examination (if bloody stools or severe pain)
  - Perianal skin breakdown
  - Assess general appearance (well versus ill-appearing, toxic)
  - Laboratory evaluation
  - Not routinely needed for uncomplicated viral gastroenteritis
  - Indications for stool studies
  - Bloody diarrhea
  - Severe dehydration
  - Immunocompromised patient
  - Recent antibiotic use (test for C. difficile)
  - Travel to endemic area
  - Symptoms greater than 7 days
  - Daycare or food-borne outbreak investigation
  - Stool testing options
  - Stool culture (Salmonella, Shigella, Campylobacter, E. coli O157:H7)
  - Stool PCR panel (rapid, detects multiple pathogens - viral, bacterial, parasitic)
  - C. difficile toxin assay if recent antibiotics
  - Ova and parasites if travel history or prolonged symptoms
  - Fecal leukocytes or lactoferrin (suggests bacterial or inflammatory cause)
  - Basic metabolic panel if moderate to severe dehydration or electrolyte concerns
  - Additional testing if indicated
  - Complete blood count if bloody diarrhea or concern for HUS
  - Blood culture if systemically ill or bacteremia suspected
treatment:
  - Oral rehydration therapy (MAINSTAY of treatment)
  - See PED-DEHYDRATION tree for detailed ORT protocol
  - Oral rehydration solution (Pedialyte) for rehydration
  - Small frequent volumes (5 mL every 5 minutes, increase as tolerated)
  - Replace ongoing losses
  - "10 mL/kg for each diarrheal stool"
  - "2 mL/kg for each vomiting episode"
  - Feeding recommendations
  - Continue breastfeeding throughout illness
  - Resume age-appropriate diet as soon as tolerated (within 24 hours)
  - Early feeding reduces duration of diarrhea
  - No need for BRAT diet (outdated)
  - Normal formula (lactose-free NOT necessary for most)
  - Avoid high-sugar foods and drinks (worsens osmotic diarrhea)
  - Probiotics
  - Lactobacillus GG (Culturelle) or Saccharomyces boulardii
  - May reduce duration of diarrhea by 1 day
  - Dose: 10 billion CFU daily
  - Safe and well-tolerated
  - Antiemetics
  - Ondansetron (Zofran) 0.15 mg/kg PO (max 8 mg) single dose
  - May reduce vomiting and facilitate oral rehydration
  - Use selectively in persistent vomiting interfering with ORT
  - Antibiotic therapy - RARELY indicated
  - Most cases viral or self-limited bacterial - antibiotics NOT needed
  - Consider antibiotics if
  - Shigella (especially if dysentery) - azithromycin 12 mg/kg day 1, then 6 mg/kg days 2-5
  - Campylobacter (if severe or early in course) - azithromycin
  - C. difficile (if moderate-severe) - metronidazole or vancomycin
  - Giardia - metronidazole or tinidazole
  - Traveler's diarrhea (bacterial) - azithromycin
  - Salmonella: do NOT treat (prolongs carrier state) unless
  - Age less than 3 months
  - Immunocompromised
  - Bacteremia or severe illness
  - Medications to AVOID
  - Loperamide (Imodium) - contraindicated in children (risk ileus, CNS toxicity)
  - Bismuth subsalicylate (Pepto-Bismol) - avoid in children (Reye syndrome risk)
  - Routine antibiotics without indication (worsen outcomes, promote resistance)
  - Admission criteria
  - Severe dehydration requiring IV fluids
  - Failed outpatient oral rehydration therapy
  - Bilious vomiting or concern for obstruction
  - Severe abdominal pain or peritoneal signs
  - Bloody diarrhea with hemodynamic instability
  - Age less than 3 months with fever and ill-appearing
  - Immunocompromised patient
  - Prevention and infection control
  - Hand hygiene (most important prevention)
  - Wash hands with soap and water (alcohol gel less effective for norovirus)
  - Exclude from daycare until diarrhea-free for 24 hours
  - Rotavirus vaccine (prevents 85-98% of severe rotavirus gastroenteritis)
  - Food safety education
  - Discharge instructions and return precautions
  - Continue ORS for ongoing losses
  - Resume normal diet
  - Return if
  - Signs of severe dehydration (no urine 8+ hours, very dry mouth, lethargic)
  - Bloody stools
  - High fever (greater than 102°F) or fever more than 3 days
  - Severe abdominal pain
  - Vomiting bile or blood
  - Symptoms not improving after 7 days
clinical_pearls:
  - 'Viral gastroenteritis most common cause in children - rotavirus, norovirus, adenovirus (supportive care only)'
  - 'Oral rehydration therapy cornerstone of management - as effective as IV fluids for mild-moderate dehydration'
  - 'Resume normal age-appropriate diet within 24 hours - early feeding reduces diarrhea duration (BRAT diet outdated)'
  - 'Antibiotics NOT indicated for most cases - only treat specific bacterial pathogens causing severe illness'
  - 'Loperamide (Imodium) contraindicated in children - risk of ileus, toxic megacolon, and CNS toxicity'
  - 'Probiotics (Lactobacillus GG) may reduce diarrhea duration by 1 day - safe adjunctive therapy'
  - 'Rotavirus vaccine dramatically reduced hospitalizations for gastroenteritis (85-98% effective against severe disease)'
  - 'Blood in stool warrants stool culture to identify Shigella, Campylobacter, E. coli O157:H7, or Salmonella'
referrals:
  - Emergency department if severe dehydration, altered mental status, peritoneal signs, or hemodynamic instability
  - Gastroenterology if chronic diarrhea (greater than 14 days), failure to thrive, or concern for malabsorption
  - Infectious disease if immunocompromised patient with severe gastroenteritis
differentials:
  - Viral gastroenteritis (rotavirus, norovirus, adenovirus - watery diarrhea, vomiting, self-limited 3-7 days)
  - Bacterial gastroenteritis (Salmonella, Shigella, Campylobacter, E. coli - bloody diarrhea, fever, abdominal pain)
  - Food poisoning (S. aureus, B. cereus - rapid onset vomiting/diarrhea after contaminated food)
  - Parasitic infection (Giardia, Cryptosporidium - prolonged diarrhea, travel or camping history)
  - C. difficile colitis (recent antibiotics, severe diarrhea, abdominal pain)
  - Appendicitis (RLQ pain, anorexia, fever, peritoneal signs, diarrhea less prominent)
  - Intussusception (colicky abdominal pain, currant jelly stools, palpable mass, lethargy)
  - Malabsorption (chronic diarrhea, failure to thrive, fatty stools)
  - Lactose intolerance (watery diarrhea, bloating, gas after dairy ingestion)
