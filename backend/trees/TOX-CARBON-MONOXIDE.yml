urgency: medium
description: Comprehensive evaluation and management of Carbon Monoxide Poisoning
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Headache
- Nausea, vomiting
- Dizziness, confusion
- Dyspnea
- Cherry-red skin (late finding, rare)
- Elevated carboxyhemoglobin level
- History of exposure (house fire, enclosed space with combustion)
- Treatment - 100% oxygen, hyperbaric oxygen if severe
workup: []
treatment: []
clinical_pearls: []
referrals:
  emergency:
    - Altered mental status from toxin
    - Severe poisoning
    - Drug overdose with respiratory depression
    - Serotonin syndrome
  urgent:
    - Toxic ingestion without symptoms
    - Suspected toxic exposure
    - Drug overdose stable
  routine:
    - Substance use disorder treatment
    - Chronic exposure evaluation
    - Lead screening
differentials:
  - Viral illness
  - Stroke
  - Migraine
  - Hypoglycemia
  - Metabolic acidosis
