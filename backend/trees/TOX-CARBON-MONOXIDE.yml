presentations:
  - Headache
  - Nausea, vomiting
  - Dizziness, confusion
  - Dyspnea
  - Cherry-red skin (late finding, rare)
  - Elevated carboxyhemoglobin level
  - History of exposure (house fire, enclosed space with combustion)
  - Treatment - 100% oxygen, hyperbaric oxygen if severe
differentials:
  - Viral illness
  - Stroke
  - Migraine
  - Hypoglycemia
  - Metabolic acidosis
workup: []
treatment:
  - Remove from exposure immediately - move to fresh air
  - High-flow 100% oxygen via non-rebreather mask - first-line treatment, reduces COHb half-life from 4-6 hours to 60-90 minutes
  - Continue normobaric oxygen until COHb <5% AND symptoms resolve (typically 4-6 hours)
  - 'Hyperbaric oxygen (HBO) indications: COHb >25%, pregnancy with COHb >15%, loss of consciousness, cardiac ischemia, severe metabolic acidosis, neurologic deficits'
  - 'HBO benefits: Reduces COHb half-life to 15-30 minutes, may reduce delayed neurologic sequelae'
  - 'HBO treatment: 2.5-3 ATA for 60-90 minutes, consider repeat sessions if persistent symptoms'
  - 'Pregnant patients: Lower threshold for HBO (fetal hemoglobin has higher CO affinity, fetus at higher risk)'
  - Cardiac monitoring - ECG, troponin if chest pain or ECG changes
  - Treat concurrent cyanide toxicity if house fire (hydroxocobalamin 5g IV over 15 min)
  - Supportive care - IV fluids if needed, treat seizures with benzodiazepines
  - Monitor for delayed neurologic sequelae (DNS) - occurs in 10-30% at 2-40 days post-exposure (cognitive impairment, personality changes, parkinsonism)
  - Psychiatric evaluation - many exposures are suicide attempts
  - Identify and eliminate source - inspect home for CO leak, recommend CO detectors
