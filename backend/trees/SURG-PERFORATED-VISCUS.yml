presentations:
  - Sudden severe abdominal pain
  - Rigid abdomen (board-like)
  - Peritonitis
  - Free air under diaphragm on upright CXR
  - History of PUD or recent GI procedure
  - Requires emergency surgery
differentials:
  - Peritonitis
  - Bowel obstruction
  - Pancreatitis
  - Ischemic bowel
  - Abscess
workup: []
treatment:
  - Surgical emergency - immediate surgical consultation
  - NPO, aggressive IV fluid resuscitation (2-3L crystalloid)
  - Broad-spectrum antibiotics - piperacillin-tazobactam 4.5g IV Q6H OR cefepime 2g IV Q8H + metronidazole 500mg IV Q8H
  - NG tube decompression
  - Upright CXR or CT abdomen/pelvis - look for free air
  - Emergency exploratory laparotomy - repair perforation, washout peritoneal cavity
  - 'Perforated peptic ulcer: Graham patch (omental patch), PPI IV'
  - 'Perforated diverticulitis: Hartmann procedure (resection + end colostomy)'
  - 'Perforated appendicitis: Appendectomy + washout'
  - Postop ICU care, prolonged antibiotics (4-7 days)
  - Mortality 10-40% depending on age and comorbidities
