tree_id: GI-CHRONIC-DIARRHEA
name: Chronic Diarrhea
family: gastroenterology
specialty: Gastroenterology
icd10: K59.1
snomed: 236071009
urgency: []
homeopathy: []
presentations:
  - Diarrhea lasting >4 weeks (by definition)
  - Increased stool frequency (>3 bowel movements per day)
  - Loose or watery stools
  - Urgency or fecal incontinence
  - Abdominal cramping or bloating
  - Weight loss (suggests malabsorption or inflammatory cause)
  - Bloody stools (suggests inflammatory or infectious cause)
  - Nocturnal diarrhea (suggests organic rather than functional cause)
  - Recent travel, medication use, or dietary changes
workup:
  - Detailed history: onset, duration, frequency, stool characteristics, triggers
  - Medication review (antibiotics, NSAIDs, metformin, colchicine, magnesium)
  - Dietary history (lactose, sorbitol, caffeine, alcohol)
  - Classify diarrhea: watery vs fatty vs inflammatory
  - Initial laboratory tests: CBC, CMP, TSH, celiac serology (tTG-IgA)
  - Stool studies: fecal calprotectin or lactoferrin (inflammatory vs non-inflammatory)
  - Stool culture and O&P if infectious etiology suspected
  - Fecal elastase if pancreatic insufficiency suspected (chronic pancreatitis, cystic fibrosis)
  - 72-hour fecal fat collection if steatorrhea suspected (gold standard for malabsorption)
  - Colonoscopy with biopsies - essential for most patients with chronic diarrhea
  - Consider upper endoscopy with duodenal biopsies if celiac disease or Giardia suspected
  - Hydrogen breath test for lactose intolerance or small intestinal bacterial overgrowth (SIBO)
treatment:
  - Treat underlying cause when identified
  - Empiric therapy based on diarrhea type
  - Watery diarrhea (osmotic or secretory)
  - Osmotic: eliminate offending agent (lactose, sorbitol, medications)
  - Secretory: loperamide 2-4 mg after each loose stool (max 16 mg/day)
  - Consider bile acid sequestrants if bile acid diarrhea (cholestyramine 4 g BID-TID)
  - Inflammatory diarrhea - treat underlying IBD, infection, or microscopic colitis
  - Fatty diarrhea (malabsorption) - pancreatic enzyme replacement, treat celiac disease
  - Irritable bowel syndrome (IBS-D) - dietary modification (low FODMAP), rifaximin, eluxadoline
  - Symptomatic management
  - Adequate hydration and electrolyte replacement
  - Probiotics may help in some cases (Lactobacillus, Saccharomyces boulardii)
  - Avoid dairy if lactose intolerance, gluten if celiac disease
clinical_pearls:
  - "Chronic diarrhea defined as >4 weeks duration (vs acute <2 weeks, persistent 2-4 weeks)"
  - "Three major categories: watery (osmotic or secretory), fatty (malabsorption), inflammatory"
  - "Osmotic diarrhea improves with fasting, secretory diarrhea persists with fasting"
  - "Nocturnal diarrhea or weight loss suggests organic disease, not IBS"
  - "Fecal calprotectin >50 μg/g suggests inflammatory bowel disease"
  - "Most common causes: IBS, medication side effect, lactose intolerance, celiac disease"
  - "Less common but important: microscopic colitis (especially in older women on NSAIDs/PPIs)"
  - "Alarm features requiring endoscopy: age >50, rectal bleeding, weight loss, anemia, family history IBD"
referrals:
  - Gastroenterology for diagnostic evaluation (endoscopy) and management
  - Dietitian for medical nutrition therapy and dietary modifications
  - Consider GI referral if no clear cause identified or alarm features present
differentials:
  - Irritable bowel syndrome (IBS-D) - most common functional cause
  - Celiac disease (malabsorption, positive serology, villous atrophy)
  - Inflammatory bowel disease (Crohn's, ulcerative colitis) - bloody diarrhea, weight loss
  - Microscopic colitis (watery diarrhea, normal colonoscopy, biopsy diagnosis)
  - Lactose intolerance (bloating, gas after dairy)
  - Small intestinal bacterial overgrowth (SIBO) - bloating, malabsorption
  - Chronic pancreatitis (pancreatic insufficiency, steatorrhea)
  - Bile acid diarrhea (post-cholecystectomy, ileal resection)
  - Medication-induced (antibiotics, metformin, NSAIDs, PPIs)
  - Hyperthyroidism (weight loss, palpitations, heat intolerance)
