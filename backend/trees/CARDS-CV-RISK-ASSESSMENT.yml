tree_id: CARDS-CV-RISK-ASSESSMENT
name: Cardiovascular Risk Factors Assessment and Counseling
family: cardiology
specialty: Cardiology
icd10: Z13.6
snomed: 275914006
urgency: routine
homeopathy: []
presentations:
  - Health maintenance visit for cardiovascular risk assessment
  - Patient with multiple cardiovascular risk factors
  - Family history of premature cardiovascular disease
  - Request for preventive cardiology consultation
  - Asymptomatic patient seeking risk stratification
  - Pre-participation sports physical
  - Employment or insurance physical examination
  - Patient interested in primary prevention strategies
workup:
  - Comprehensive cardiovascular risk assessment
  - Blood pressure measurement (multiple visits for diagnosis)
  - Lipid panel (total cholesterol, LDL, HDL, triglycerides)
  - Fasting glucose or HbA1c for diabetes screening
  - BMI and waist circumference measurement
  - Calculate 10-year ASCVD risk score (ACC/AHA calculator)
  - For adults 40-75 years without diabetes or known ASCVD
  - Pooled Cohort Equations - incorporates age, sex, race, cholesterol, BP, diabetes, smoking
  - Family history assessment
  - Premature CVD (men <55, women <65)
  - Sudden cardiac death in first-degree relative
  - Inherited conditions (familial hypercholesterolemia, hypertrophic cardiomyopathy)
  - Social history - smoking, alcohol, illicit drug use, physical activity, diet
  - Additional testing based on risk (not routine)
  - High-sensitivity CRP for intermediate risk patients
  - Coronary artery calcium (CAC) score for risk refinement
  - Ankle-brachial index if PAD suspected
  - Consider screening for subclinical atherosclerosis in high-risk patients
treatment:
  - Risk factor modification counseling (cornerstone of prevention)
  - Smoking cessation
  - Most important modifiable risk factor
  - Counseling at every visit, offer pharmacotherapy (varenicline, bupropion, NRT)
  - Refer to cessation programs
  - Diet and nutrition counseling
  - Mediterranean diet or DASH diet
  - Reduce saturated fat <7%, trans fat <1%
  - Increase fruits, vegetables, whole grains, fish
  - Limit sodium <2.3g/day (1.5g if hypertension)
  - Physical activity
  - 150 minutes moderate-intensity aerobic exercise weekly
  - Or 75 minutes vigorous-intensity
  - Muscle-strengthening activities ≥2 days/week
  - Weight management - goal BMI 18.5-24.9, waist <40" men, <35" women
  - Alcohol moderation - ≤2 drinks/day men, ≤1 drink/day women
  - Stress management techniques
  - Medical management based on risk
  - Statin therapy for ASCVD risk ≥7.5% or LDL ≥190
  - Hypertension treatment if BP ≥130/80 (ACC/AHA) or ≥140/90 (JNC-8)
  - Diabetes management if HbA1c ≥6.5%
  - Aspirin for primary prevention controversial (consider if ASCVD risk >10% and low bleeding risk)
  - Annual or biannual follow-up for monitoring
clinical_pearls:
  - ASCVD risk categories - low <5%, borderline 5-7.4%, intermediate 7.5-19.9%, high ≥20%
  - Lifestyle modifications reduce cardiovascular events by 30-40%
  - Smoking cessation - 50% reduction in CHD risk within 1 year
  - Physical activity reduces all-cause mortality by 20-30%
  - Mediterranean diet associated with 30% reduction in cardiovascular events
  - Statin therapy reduces major cardiovascular events by 25-30%
  - Framingham Risk Score underestimates risk in South Asians, overestimates in Hispanics
  - Coronary calcium score of 0 suggests low risk (<5% over 10 years)
  - Family history of premature CVD increases risk not captured by traditional calculators
  - Diabetes considered CHD risk equivalent (high risk category)
referrals:
  - Cardiology for high-risk patients or abnormal screening tests
  - Lipid clinic for LDL >190 or suspected familial hypercholesterolemia
  - Dietitian for medical nutrition therapy
  - Exercise physiologist for structured exercise program
  - Smoking cessation program
  - Behavioral health for stress management or health behavior change
differentials:
  - Low cardiovascular risk (<5% 10-year ASCVD risk)
  - Borderline cardiovascular risk (5-7.4%)
  - Intermediate cardiovascular risk (7.5-19.9%)
  - High cardiovascular risk (≥20%)
  - Established atherosclerotic cardiovascular disease (secondary prevention)
  - Metabolic syndrome (3+ of - abdominal obesity, high TG, low HDL, HTN, high glucose)
  - Familial hypercholesterolemia
