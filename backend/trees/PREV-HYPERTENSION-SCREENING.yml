tree_id: PREV-HYPERTENSION-SCREENING
name: Hypertension Screening Encounter
family: general
specialty: Primary Care, Cardiology
chief_complaint: Blood pressure check, hypertension screening
description: |
  Screening for hypertension (high blood pressure) in adults.
  Hypertension is major risk factor for cardiovascular disease, stroke, and kidney disease.
icd10: Z13.6
snomed: "171222001"
presentations:
  - Routine BP screening
  - Follow-up of elevated BP reading
urgency: Low
workup:
  screening_recommendations:
    - Screen all adults age ≥18
    - Frequency - annual if BP 120-129/<80, every 3-5 years if optimal
    - Obtain BP in both arms at first visit
    - Use proper technique - seated 5 minutes, back supported, feet flat, arm at heart level
  blood_pressure_classification_acc_aha:
    normal:
      - <120/<80
    elevated:
      - 120-129/<80
    stage_1_hypertension:
      - 130-139 or 80-89
    stage_2_hypertension:
      - ≥140 or ≥90
  confirmation:
    - Repeat BP measurements on 2-3 separate occasions before diagnosis
    - Or ambulatory BP monitoring (ABPM) - gold standard
    - Or home BP monitoring
treatment:
  normal:
    - Rescreen annually or per guidelines
    - Encourage healthy lifestyle
  elevated:
    - Lifestyle modifications
    - Recheck in 3-6 months
  stage_1_hypertension:
    - Calculate 10-year ASCVD risk
    - If <10% risk - lifestyle modifications, recheck in 3-6 months
    - If ≥10% risk or existing CVD - lifestyle modifications PLUS medication
  stage_2_hypertension:
    - Lifestyle modifications PLUS medication
    - Goal BP <130/80 for most adults
  lifestyle_modifications:
    - Weight loss if overweight (1 mmHg per kg lost)
    - DASH diet - rich in fruits, vegetables, low-fat dairy
    - Sodium restriction <2300 mg/day (ideally <1500 mg/day)
    - Regular aerobic exercise 90-150 min/week
    - Limit alcohol - ≤2 drinks/day men, ≤1 drink/day women
  initial_medication:
    - Thiazide diuretic, ACE inhibitor, ARB, or calcium channel blocker
    - Choice based on age, race, comorbidities
clinical_pearls:
  - White coat hypertension common - confirm with ABPM or home monitoring
  - Masked hypertension - normal in office, elevated at home
  - Proper BP measurement technique essential
  - Lifestyle modifications can lower BP 5-10 mmHg
  - Most patients require 2-3 medications for BP control
differentials:
  - Normal BP
  - Elevated BP
  - Stage 1 hypertension
  - Stage 2 hypertension
  - White coat hypertension
  - Secondary hypertension (if young, resistant, or sudden onset)
trace:
  - 58-year-old man with BP 148/92 at visit. Repeat BP 146/90 and 144/88 on subsequent visits. No diabetes or CVD. 10-year ASCVD risk 12%. Diagnose Stage 2 hypertension. Lifestyle counseling. Start lisinopril 10mg daily. Home BP monitoring. Follow-up in 4 weeks - BP 128/80. Continue medication.
citations:
  - ACC/AHA Hypertension Guidelines
  - USPSTF Hypertension Screening Recommendations
