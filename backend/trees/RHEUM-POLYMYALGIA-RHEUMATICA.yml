tree_id: RHEUM-POLYMYALGIA-RHEUMATICA
name: Polymyalgia Rheumatica
family: Rheumatology
specialty: Rheumatology
chief_complaint: Bilateral shoulder and hip pain and stiffness
description: |
  Inflammatory condition causing bilateral proximal muscle pain and stiffness in patients over 50 years. Often associated with giant cell arteritis (15-20%).
  Responds dramatically to corticosteroids. More common in women (2:1), Northern European descent. Average age of onset 70 years.
icd10: M35.3
urgency: Moderate
workup:
  - Clinical criteria - age greater than 50, bilateral shoulder and/or hip girdle pain/stiffness lasting at least 4 weeks, morning stiffness greater than 45 minutes, elevated inflammatory markers
  - ESR typically greater than 40 mm/hr (often greater than 100), CRP elevated
  - Normal or mildly elevated creatine kinase (not true myopathy, no muscle weakness)
  - CBC may show anemia of chronic disease, thrombocytosis
  - Rule out other causes - rheumatoid factor and anti-CCP (rheumatoid arthritis), ANA (lupus, other CTD), TSH (hypothyroidism), serum and urine protein electrophoresis (multiple myeloma)
  - Physical exam - tenderness of shoulder and hip girdles, full range of motion (may be limited by pain), normal muscle strength
  - Ultrasound shoulders/hips shows bursitis, tenosynovitis if diagnosis uncertain
  - Screen for giant cell arteritis (GCA) - new headache, scalp tenderness, jaw claudication, visual symptoms, temporal artery tenderness or decreased pulse
  - If GCA symptoms present, start high-dose steroids immediately and obtain temporal artery biopsy within 1-2 weeks
treatment:
  - Prednisone 15-20mg daily (dramatic response within 24-72 hours diagnostic)
  - Lack of rapid improvement should prompt reconsideration of diagnosis
  - Taper slowly over 12-18 months to minimize relapse
  - Reduce by 2.5mg every 2-4 weeks until 10mg daily, then 1mg every 4-8 weeks
  - Monitor ESR/CRP monthly initially, then every 3 months - increase dose if symptoms recur or markers rise
  - Many patients require low-dose maintenance (5-7.5mg daily) for extended periods
  - Steroid-sparing agents if unable to taper below 10mg or frequent relapses - methotrexate 10-25mg weekly (modest benefit), tocilizumab 162mg SC weekly or q2 weeks (IL-6 inhibitor, more effective)
  - Bone protection - calcium 1200mg daily, vitamin D 800-1000 IU daily, bisphosphonate (alendronate 70mg weekly) if high fracture risk or prolonged steroid use expected
  - PPI for GI protection if risk factors for ulcer
  - Screen for steroid complications - diabetes (glucose monitoring), hypertension, cataracts, glaucoma
  - Physical therapy and exercise to maintain strength and function
clinical_pearls:
  - Dramatic response to prednisone characteristic - patients feel remarkably better within days
  - Symptoms worse in morning, improve with activity (opposite of osteoarthritis)
  - True muscle weakness absent (can distinguish from polymyositis, which has weakness and very high CK)
  - High relapse rate (50%) during steroid taper - require extended treatment
  - Giant cell arteritis coexists in 15-20%, consider temporal artery biopsy if any GCA symptoms
  - Average disease duration 3-4 years, some remit within 2 years, others require prolonged treatment
differentials:
  - Rheumatoid arthritis (RA)
  - Hypothyroidism
  - Polymyositis
  - Multiple myeloma
  - Paraneoplastic syndrome
  - Rotator cuff tendinitis
trace:
  - 72-year-old woman with 6-week history of bilateral shoulder and hip pain and stiffness, worse in morning x 2 hours → Difficulty raising arms overhead, getting out of chair → No muscle weakness, no headache or visual symptoms → ESR 95 mm/hr, CRP 65 mg/L → CK 85 U/L (normal), RF negative, TSH normal → Exam shows tenderness over shoulder girdles, full ROM, strength 5/5 throughout → Diagnose polymyalgia rheumatica → Start prednisone 15mg daily → Dramatic improvement within 48 hours, able to perform daily activities → ESR decreases to 20 mm/hr at 1 month → Begin slow taper, reduce to 12.5mg at 6 weeks, 10mg at 12 weeks → Symptoms recur at 7.5mg, increase back to 10mg → Add methotrexate 15mg weekly as steroid-sparing agent → Able to taper to 5mg prednisone with good control → Continue low-dose prednisone and methotrexate, bone protection with alendronate
