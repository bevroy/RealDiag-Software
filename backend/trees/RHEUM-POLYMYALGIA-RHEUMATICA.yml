tree_id: RHEUM-POLYMYALGIA-RHEUMATICA
name: Polymyalgia Rheumatica (PMR)
family: musculoskeletal
specialty: Rheumatology
chief_complaint: Bilateral shoulder and hip pain, morning stiffness
description: Inflammatory condition causing muscle pain and stiffness in shoulders and hips
icd10: M35.3
urgency: routine
workup:
  - Clinical diagnosis based on characteristic features
  - Age greater than 50 years (peak incidence 70-80 years)
  - Bilateral shoulder and/or hip girdle pain and stiffness for greater than 4 weeks
  - Morning stiffness greater than 45 minutes
  - Elevated inflammatory markers - ESR greater than 40 mm/hr (usually greater than 50) and/or CRP greater than 10 mg/L
  - Complete blood count (normocytic anemia common)
  - Comprehensive metabolic panel (rule out renal insufficiency before starting NSAIDs)
  - Creatine kinase (CK) normal (distinguishes from polymyositis)
  - Rheumatoid factor (RF) and anti-CCP antibody (usually negative, helps exclude RA)
  - TSH (hypothyroidism can mimic symptoms)
  - Vitamin D level
  - Screen for giant cell arteritis (GCA) - associated in 15-20% of PMR cases
  - Ask about headache, jaw claudication, vision changes, scalp tenderness
  - Temporal artery ultrasound or biopsy if GCA suspected
  - MRI or ultrasound of shoulders/hips shows bursitis, synovitis (not required for diagnosis)
treatment:
  - Prednisone 15-20 mg daily - dramatic response within 24-72 hours (diagnostic)
  - If no improvement within 1 week, reconsider diagnosis
  - Continue initial dose for 2-4 weeks until symptoms controlled and ESR/CRP normalize
  - Taper prednisone gradually by 2.5 mg every 2-4 weeks to 10 mg daily
  - Then taper by 1 mg every 4-8 weeks as tolerated
  - Total treatment duration typically 1-2 years, some require longer
  - Monitor ESR/CRP every 4-6 weeks during taper, increase dose if flare
  - NSAIDs may help but insufficient as monotherapy
  - Methotrexate 10-15 mg weekly if steroid-sparing agent needed or difficulty tapering
  - Calcium 1200 mg daily and vitamin D 800-1000 IU for bone protection
  - Consider bisphosphonate (alendronate 70 mg weekly) if prolonged steroid use expected
  - Screen and treat for osteoporosis with DEXA scan
  - Monitor for diabetes, hypertension, weight gain from steroids
  - Low-dose aspirin 81 mg daily may reduce GCA risk (controversial)
clinical_pearls:
  - Classic presentation - elderly patient with severe bilateral shoulder/hip pain, unable to get out of bed or lift arms
  - Dramatic response to low-dose prednisone (15-20 mg) virtually diagnostic - should see improvement in 1-3 days
  - ESR often very elevated (greater than 50, can be greater than 100 mm/hr)
  - Proximal muscle pain WITHOUT weakness (normal strength on exam distinguishes from myositis)
  - Morning stiffness lasting hours, improves with activity
  - Constitutional symptoms common - fatigue, low-grade fever, weight loss, depression
  - 15-20% develop giant cell arteritis (GCA) - requires higher steroid dose (40-60 mg prednisone)
  - Relapse common during steroid taper (30-50%), increase dose and taper more slowly
  - Normal CK distinguishes from polymyositis, normal TSH excludes hypothyroidism
  - Self-limited disease but requires prolonged treatment - median duration 2 years
differentials:
  - Rheumatoid arthritis - hand/wrist involvement, RF/anti-CCP positive, erosions on X-ray
  - Polymyositis/dermatomyositis - proximal muscle weakness, elevated CK, abnormal EMG
  - Hypothyroidism - elevated TSH, fatigue, weight gain, bradycardia
  - Fibromyalgia - normal ESR/CRP, widespread pain, tender points
  - Rotator cuff tear - unilateral, traumatic, weakness on specific testing
  - Cervical spondylosis - neck pain, radicular symptoms, MRI abnormalities
  - Paraneoplastic syndrome - weight loss, anemia, occult malignancy screening
  - Giant cell arteritis - headache, jaw claudication, vision symptoms, requires higher prednisone dose
  - Multiple myeloma - older patient, anemia, elevated calcium, lytic bone lesions
trace:
  - 72-year-old woman presents with 6-week history of bilateral shoulder and hip pain
  - Pain started gradually, now severe 8/10, worse in morning
  - Morning stiffness lasting 3-4 hours, difficulty getting out of bed without assistance
  - Cannot lift arms above shoulders to brush hair or reach overhead
  - Difficulty rising from chair without using arms
  - Denies joint swelling, no hand or wrist pain
  - Constitutional symptoms - fatigue, 10-pound unintentional weight loss, low-grade fever
  - Denies headache, vision changes, jaw claudication
  - No muscle weakness on exam, can resist against resistance once past initial pain
  - Past medical history - hypertension, osteopenia on recent DEXA
  - Physical exam - vitals normal, appears fatigued
  - Decreased active ROM of shoulders and hips due to pain, full passive ROM
  - No synovitis, no muscle tenderness, normal muscle strength
  - Normal neurological exam
  - Labs - WBC 9.5 K/uL, Hgb 11.2 g/dL (normocytic anemia), platelets 380 K/uL
  - ESR 78 mm/hr (markedly elevated), CRP 45 mg/L (elevated)
  - CK 95 U/L (normal), TSH 2.4 mIU/L (normal)
  - RF negative, anti-CCP negative
  - Comprehensive metabolic panel normal
  - Diagnosis - Polymyalgia rheumatica
  - Started prednisone 15 mg daily
  - Calcium carbonate 600 mg BID, vitamin D3 1000 IU daily, alendronate 70 mg weekly
  - Follow-up in 1 week - dramatic improvement, pain reduced to 2/10, morning stiffness 30 minutes
  - ESR decreased to 25 mm/hr
  - Continued prednisone 15 mg for 4 weeks, then began taper
  - Tapered by 2.5 mg every 2-4 weeks, monitored ESR/CRP every 4-6 weeks
  - Minor flare at prednisone 7.5 mg (pain returned), increased to 10 mg with resolution
  - At 18 months - tapered to prednisone 3 mg daily, minimal symptoms, normal ESR/CRP
  - Outcome - Good control, continued slow taper, expected to discontinue steroids by 2 years
