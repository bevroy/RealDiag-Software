nodes:
  - id: pmr_gca_evaluation
    type: question
    text: "Clinical presentation?"
    options:
      - label: "Polymyalgia rheumatica (PMR)"
        next: polymyalgia_rheumatica
      - label: "Giant cell arteritis (GCA)"
        next: giant_cell_arteritis
