tree_id: RHEUM-POLYMYALGIA-RHEUMATICA
name: Polymyalgia Rheumatica (PMR)
family: rheumatology
specialty: Rheumatology
chief_complaint: Bilateral shoulder and hip pain with morning stiffness
description: Inflammatory condition causing bilateral shoulder and hip girdle pain and stiffness in patients over 50. Dramatic response to low-dose prednisone diagnostic, associated with giant cell arteritis in 15-20%.
icd10: M35.3
snomed: 55819004
presentations:
  - Bilateral shoulder/hip girdle pain and stiffness
  - Morning stiffness >45 minutes
  - Age >50 years
  - Constitutional symptoms: fatigue, low-grade fever, weight loss
  - Elevated ESR, CRP
  - Rapid response to low-dose corticosteroids
urgency: urgent

referrals:
  emergency:
    - Giant cell arteritis with vision changes
    - Acute vasculitis with organ involvement
    - Severe flare with organ damage
  urgent:
    - Suspected rheumatoid arthritis
    - Suspected lupus
    - Crystal arthropathy
    - PMR
  routine:
    - Osteoarthritis
    - Chronic inflammatory arthritis management
    - Fibromyalgia
    - Gout prevention

workup:
  - Clinical diagnosis: bilateral shoulder and hip girdle pain and stiffness in patient over 50 years
  - Hallmark: severe morning stiffness lasting over 1 hour, difficulty getting out of bed or raising arms
  - Age: almost always over 50 years (average 70 years), rare before 50
  - Symmetric: both shoulders and/or both hips
  - Systemic symptoms: fatigue, malaise, low-grade fever, weight loss (50%)
  - Rapid onset: develops over days to weeks
  - ESR and CRP: markedly elevated (ESR typically over 40-50, often over 100)
  - Normal CK: muscle enzymes normal (not muscle disease)
  - Mild normocytic anemia: anemia of chronic inflammation common
  - Associated with giant cell arteritis (GCA): 15-20% develop GCA, screen for symptoms (headache, jaw claudication, vision changes)
  - Rule out other causes: rheumatoid arthritis (RF, anti-CCP), infection, malignancy (age-appropriate cancer screening)
  - Ultrasound shoulders/hips: may show bursitis and synovitis (not required for diagnosis)

treatment:
  - Prednisone (first-line): dramatic response within 24-72 hours diagnostic
  - Initial dose: 15-20 mg daily (lower than GCA dosing)
  - Dramatic improvement in symptoms within 1-3 days confirms diagnosis
  - If no improvement by 1 week, reconsider diagnosis
  - Taper slowly: after 2-4 weeks at initial dose, taper by 2.5 mg every 2-4 weeks
  - Goal: lowest dose that controls symptoms, typically 5-10 mg daily maintenance
  - Duration: most require 1-2 years of treatment, some longer
  - Monitor ESR/CRP: trend with symptoms during taper, if rising may indicate flare
  - Screen for GCA: assess for temporal artery tenderness, jaw claudication, vision changes at every visit
  - If GCA symptoms develop: increase prednisone immediately to 40-60 mg daily, urgent ophthalmology referral
  - Steroid side effect prevention: calcium 1200 mg daily, vitamin D 800-1000 IU, bisphosphonate (alendronate) for osteoporosis prevention, PPI if history of ulcers, diabetes screening
  - NSAIDs: insufficient as monotherapy, may provide adjunctive benefit
  - Methotrexate: steroid-sparing agent if difficult taper or prolonged course, 10-15 mg weekly
  - Tocilizumab (IL-6 inhibitor): FDA-approved for refractory PMR or steroid-dependent, reduces steroid requirement

clinical_pearls:
  - Bilateral shoulder and hip girdle pain with severe morning stiffness in patient over 50
  - Markedly elevated ESR (often over 50-100) and CRP
  - Dramatic response to prednisone 15-20 mg within 24-72 hours diagnostic
  - If no improvement by 1 week reconsider diagnosis
  - Associated with giant cell arteritis 15-20% - screen at every visit
  - Most require 1-2 years of treatment with slow taper
  - Normal muscle enzymes (vs polymyositis which has elevated CK)
  - Rare before age 50

differentials:
  - Rheumatoid arthritis: hand and wrist involvement, positive RF or anti-CCP, erosions on X-ray
  - Polymyositis: proximal muscle weakness (not just pain), elevated CK and aldolase, muscle biopsy abnormal
  - Rotator cuff disease: unilateral shoulder pain, normal ESR/CRP, no hip involvement
  - Giant cell arteritis: headache, jaw claudication, vision changes, requires higher prednisone dose 40-60 mg

trace: |
  A 72-year-old woman presented with 3 weeks of severe bilateral shoulder and hip pain with profound morning stiffness. Difficulty getting out of bed in morning (takes 2 hours for stiffness to improve), cannot raise arms above shoulders to brush hair. No joint swelling. Low-grade fevers, fatigue, lost 8 pounds. No headache, no vision changes, no jaw pain with chewing. Exam showed limited active range of motion shoulders and hips due to pain, full passive range, no synovitis, no temporal artery tenderness. Labs showed ESR 88, CRP 45 (both markedly elevated), normal CK, mild anemia (Hgb 11.2), negative RF and anti-CCP. Diagnosed with polymyalgia rheumatica (classic presentation: bilateral girdle pain, morning stiffness, age over 50, markedly elevated inflammatory markers). Started prednisone 20 mg daily. Screened for giant cell arteritis symptoms (negative). Calcium 1200 mg and vitamin D 1000 IU daily, scheduled DEXA scan. At 48 hours dramatic improvement - morning stiffness reduced from 2 hours to 15 minutes, pain improved 80%, able to raise arms and get out of bed easily. Confirmed PMR diagnosis with dramatic steroid response. At 4 weeks ESR 22, CRP 8, symptoms controlled. Started taper: decreased to 17.5 mg daily. At 3 months tapered to 12.5 mg daily, excellent control. At 6 months on 7.5 mg daily. At 12 months on 5 mg daily, no flares. Continues slow taper with goal to discontinue by 18-24 months. Monitored closely for GCA symptoms at every visit.

