tree_id: CARD-VALVE-AR
name: Aortic Regurgitation
family: Cardiology
specialty: Cardiology
icd10:
- I35.1
snomed:
- '60234000'
urgency: medium
description: Comprehensive evaluation and management of Aortic Regurgitation
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- dyspnea on exertion
- diastolic murmur
- wide pulse pressure
- bounding pulses (waterhammer pulse)
- 'Chronic AR: Gradual dyspnea, palpitations, angina (even without CAD)'
- 'Acute AR: Sudden pulmonary edema, cardiogenic shock (endocarditis, dissection)'
- 'Diastolic decrescendo murmur: Best heard at left sternal border, leaning forward'
- 'Wide pulse pressure: SBP elevated, DBP low (e.g., 160/40)'
- 'Bounding pulses: Waterhammer pulse, Corrigan pulse, de Musset sign (head bobbing)'
workup:
- 'Echocardiogram: Assess severity (vena contracta, regurgitant volume), LV size/function'
- 'Chest X-ray: Cardiomegaly, prominent ascending aorta'
- 'ECG: LVH with strain pattern (chronic AR)'
- 'Cardiac catheterization: If echo equivocal or assess CAD pre-surgery'
treatment:
- 'Guideline-based treatment options for Aortic Regurgitation include:'
- 'Chronic AR: Afterload reduction, avoid beta-blockers (ACC/AHA 2023)'
- 'Surgery: If symptomatic, EF <50%, LVESD >50mm, or progressive LV dilation (ACC/AHA
  2023)'
- 'Acute severe AR: Emergent surgery (endocarditis, dissection), inotropes, nitroprusside,
  avoid IABP (ACC/AHA 2023)'
- 'Endocarditis: 6 weeks antibiotics + early surgery if valve destruction (ACC/AHA
  2023)'
- 'Serial echo: Every 6-12 months for moderate-severe AR (ACC/AHA 2023)'
clinical_pearls:
- 'Chronic AR: LV adapts (eccentric hypertrophy), asymptomatic for years'
- 'Acute AR: No time for LV adaptation, rapid pulmonary edema/cardiogenic shock'
- 'Surgery indicated: Symptomatic, EF <50%, LVESD >50mm, or LV dilation'
- 'Afterload reduction: ACEi/ARB/hydralazine helps chronic AR (reduces regurgitant
  volume)'
- 'Avoid beta-blockers: Bradycardia prolongs diastole, increases regurgitant volume'
referrals:
- Cardiology for all moderate-severe AR
- 'Cardiac surgery if: Symptomatic, EF <50%, or LVESD >50mm'
- Emergent surgery if acute severe AR
differentials: []
trace:
  source: American College of Cardiology (ACC/AHA) Clinical Practice Guidelines, European
    Society of Cardiology (ESC) Guidelines
  version: 0.1.0
