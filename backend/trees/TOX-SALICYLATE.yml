tree_id: TOX-SALICYLATE
name: Salicylate Toxicity (Aspirin Overdose)
family: Toxicology
specialty: Toxicology
icd10:
- T39.011A
- T39.012A
snomed:
- '292044008'
urgency: medium
description: Comprehensive evaluation and management of Salicylate Toxicity (Aspirin
  Overdose)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Tinnitus, hearing loss (earliest symptoms, occur at therapeutic levels 20-30 mg/dL)
- Nausea, vomiting, epigastric pain
- Tachypnea, hyperpnea (respiratory alkalosis from direct medullary stimulation)
- Altered mental status, confusion, agitation, lethargy
- Fever, diaphoresis (uncouples oxidative phosphorylation)
- 'Mixed acid-base disorder: Respiratory alkalosis (early) + metabolic acidosis (late,
  severe)'
- 'Chronic toxicity: Elderly, subtle symptoms, higher mortality'
- 'Toxic level: >30 mg/dL (acute), >20 mg/dL (chronic)'
workup: []
treatment:
- 'Guideline-based treatment options for Salicylate Toxicity (Aspirin Overdose) include:'
- 'Immediate: Salicylate level, VBG (pH), BMP (anion gap), glucose, activated charcoal
  if <1hr, consider whole bowel irrigation if sustained-release (AAPCC 2023)'
- 'Urine alkalinization: 3 amps (150 mEq) NaHCO3 in 1L D5W at 150-250 mL/hr, target
  urine pH 7.5-8 (AAPCC 2023)'
- 'Avoid intubation if possible: Hypoventilation worsens acidosis and increases CNS
  salicylate (AAPCC 2023)'
- 'Hemodialysis: If level >100, pH <7.2, altered mental status, pulmonary edema, or
  refractory despite alkalinization (AAPCC 2023)'
- 'Disposition: ICU if severe, nephrology for dialysis, serial levels until downtrending
  (AAPCC 2023)'
clinical_pearls:
- 'Mixed acid-base disorder = hallmark: Respiratory alkalosis + anion gap metabolic
  acidosis'
- 'Urine alkalinization (pH 7.5-8): Traps ionized salicylate in urine, increases renal
  clearance'
- 'Hemodialysis indications: Level >100 mg/dL, severe acidosis (pH <7.2), altered
  mental status, pulmonary edema, renal failure'
- 'Chronic toxicity more dangerous: Lower levels cause more toxicity (>20 mg/dL),
  often missed diagnosis'
- Do NOT give aspirin-containing products for symptom relief (obviously)
- 'Check serial levels q2-4h: Delayed absorption with enteric-coated or sustained-release
  formulations'
referrals:
  emergency:
    - Altered mental status from toxin
    - Severe poisoning
    - Drug overdose with respiratory depression
    - Serotonin syndrome
  urgent:
    - Toxic ingestion without symptoms
    - Suspected toxic exposure
    - Drug overdose stable
  routine:
    - Substance use disorder treatment
    - Chronic exposure evaluation
    - Lead screening
differentials:
  - DKA
  - Sepsis
  - Methanol poisoning
  - Ethylene glycol poisoning
  - Lactic acidosis
trace:
  source: American College of Medical Toxicology (ACMT) Guidelines, American Association
