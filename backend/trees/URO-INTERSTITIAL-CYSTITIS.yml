tree_id: URO-INTERSTITIAL-CYSTITIS
name: Interstitial Cystitis (Bladder Pain Syndrome)
family: urology
specialty: Urology
icd10: N30.10
snomed: 197834003
urgency: []
homeopathy: []
presentations:
  - Chronic pelvic pain, pressure, or discomfort related to bladder for at least 6 weeks
  - Pain increases as bladder fills, relieved temporarily after voiding
  - Urinary urgency (sudden compelling need to void)
  - Urinary frequency (voiding greater than 8 times per day, often 20-40 times)
  - Nocturia (waking multiple times to urinate, often 5-10+ times)
  - Dyspareunia (painful intercourse)
  - Symptom exacerbation with certain foods/drinks (acidic foods, caffeine, alcohol, spicy foods)
  - Absence of UTI or other identifiable cause
  - More common in women (female:male ratio 10:1)
  - Chronic relapsing-remitting course with flares and remissions
workup:
  - Clinical diagnosis of exclusion (rule out other causes first)
  - Symptom assessment
  - O'Leary-Sant Symptom and Problem Index (ICSI/ICPI)
  - Pelvic Pain and Urgency/Frequency (PUF) questionnaire
  - Visual Analog Scale for pain
  - Voiding diary for 3 days
  - Typically shows very high frequency (20-40 voids/day, small volumes)
  - Nocturia often prominent (5-10+ times/night)
  - Urinalysis and urine culture
  - Must be negative (rule out UTI)
  - Microscopic hematuria may be present
  - Sterile pyuria occasionally present
  - Urine cytology if hematuria or risk factors for bladder cancer (age greater than 50, smoking)
  - Rule out carcinoma in situ
  - Post-void residual
  - Typically normal (less than 50 mL)
  - Elevated PVR suggests other diagnosis
  - Physical examination
  - Abdominal examination: suprapubic tenderness common
  - Pelvic examination: assess for pelvic floor tenderness, levator spasm
  - May have anterior vaginal wall tenderness (bladder base)
  - Rule out endometriosis, pelvic inflammatory disease
  - Cystoscopy with hydrodistention under anesthesia (GOLD STANDARD for diagnosis)
  - Indications: confirm diagnosis when uncertain, severe symptoms, hematuria, rule out cancer
  - Findings suggestive of IC
  - Glomerulations (pinpoint petechial hemorrhages after bladder distention)
  - Hunner's lesions (ulcerative lesions) - seen in 5-10%, more severe disease
  - Reduced bladder capacity under anesthesia (less than 350-400 mL)
  - Bladder biopsy: rule out malignancy, confirm inflammation
  - Potassium sensitivity test (rarely used now)
  - Instill potassium chloride solution - IC patients have pain, urgency
  - Not specific, painful, rarely performed
treatment:
  - Multimodal approach (no single cure, goal is symptom management)
  - First-line therapies (conservative, start here)
  - Education and reassurance
  - Chronic condition, not cancer, not infectious
  - Waxing and waning course
  - Stress management, relaxation techniques
  - Dietary modifications (identify and avoid triggers)
  - Common triggers: acidic foods (citrus, tomatoes), caffeine, alcohol, artificial sweeteners, spicy foods, chocolate
  - IC Diet (elimination then reintroduction to identify triggers)
  - Increase water intake
  - Pelvic floor physical therapy
  - Myofascial release, trigger point therapy
  - Many IC patients have pelvic floor dysfunction
  - 50-60% improvement
  - Bladder training (timed voiding, urge suppression)
  - Second-line therapies (oral medications)
  - Pentosan polysulfate (Elmiron) 100 mg three times daily
  - Restores bladder GAG (glycosaminoglycan) layer
  - Takes 3-6 months for effect
  - 30-50% improvement
  - Side effect: retinal toxicity (need ophthalmology screening)
  - Amitriptyline 10-75 mg at bedtime
  - Tricyclic antidepressant, analgesic and anticholinergic effects
  - 50-60% improvement
  - Side effects: dry mouth, constipation, drowsiness
  - Hydroxyzine 25-75 mg at bedtime (antihistamine)
  - Reduces mast cell activation
  - 30-40% improvement
  - Cimetidine 400 mg twice daily (H2-blocker)
  - Reduces histamine effects on bladder
  - Third-line therapies (intravesical treatments)
  - DMSO (dimethyl sulfoxide) bladder instillations
  - 50 mL instilled weekly for 6 weeks, then monthly maintenance
  - 50-70% improvement
  - Heparin or lidocaine bladder instillations ("bladder cocktail")
  - Combination of heparin 10,000 units + lidocaine 2% + sodium bicarbonate
  - Instill and hold 30 min
  - Can do 2-3 times weekly
  - Fourth-line therapies (invasive)
  - Cystoscopy with hydrodistention
  - Distend bladder under anesthesia
  - 50-60% improve for 3-6 months
  - Fulguration of Hunner's lesions if present
  - Onabotulinumtoxin A (Botox) injection into bladder
  - 100 units injected into detrusor
  - 60-70% improvement
  - Sacral neuromodulation (InterStim)
  - For refractory cases
  - 50-60% improvement
  - Surgical options (last resort)
  - Urinary diversion with cystectomy for severe refractory disease
  - Rarely performed
clinical_pearls:
  - "Interstitial cystitis affects 3-8 million people in US, 90% women - chronic debilitating condition"
  - "Diagnosis of exclusion - must rule out UTI, overactive bladder, bladder cancer, endometriosis"
  - "Key feature: bladder pain that worsens with filling and improves temporarily after voiding"
  - "Cystoscopy with hydrodistention shows glomerulations (petechial hemorrhages) in 90%, Hunner's lesions in 5-10%"
  - "No single effective treatment - multimodal approach combining diet, physical therapy, and medications"
  - "Pentosan polysulfate (Elmiron) takes 3-6 months to work - requires patience and compliance"
  - "Dietary modification helps 50-90% - identify triggers through elimination diet"
  - "Many IC patients have pelvic floor dysfunction - pelvic floor PT beneficial in 50-60%"
referrals:
  - Urology for diagnosis confirmation and cystoscopy
  - Pelvic floor physical therapy (essential component of treatment)
  - Pain management specialist for refractory pain
  - Mental health support for chronic pain and quality of life
differentials:
  - Interstitial cystitis/bladder pain syndrome (chronic bladder pain, frequency, urgency, sterile urine, cystoscopy findings)
  - Overactive bladder (urgency, frequency, no pain - KEY difference)
  - Urinary tract infection (dysuria, fever, pyuria, bacteriuria)
  - Bladder cancer (hematuria, older age, smoking, cystoscopy shows tumor)
  - Endometriosis (cyclic pelvic pain, dysmenorrhea, dyspareunia)
  - Chronic pelvic pain syndrome/chronic prostatitis in men (pelvic pain, voiding symptoms)
  - Pelvic floor dysfunction (pelvic pain, muscle tenderness, no bladder-specific symptoms)
  - Radiation cystitis (history of pelvic radiation)
