entry_point: typhoid_evaluation

nodes:
  - id: typhoid_evaluation
    type: diagnosis
    name: "Typhoid Fever"
    icd10: "A01.0"
    urgency: high
    workup:
      - Typhoid fever (enteric fever) - Systemic infection caused by Salmonella enterica serotype Typhi (or paratyphi)
      - Fecal-oral transmission (contaminated food/water)
      - Endemic areas - South Asia (India, Pakistan, Bangladesh 80% cases), sub-Saharan Africa, Southeast Asia, Latin America
      - Incidence - 11-21 million cases/year worldwide, 200,000 deaths/year
      - US - 300-400 cases/year (80% travel-related)
      - Pathophysiology - Ingestion S. Typhi → survive gastric acid → invade small intestine (M cells Peyer patches) → phagocytosed by macrophages (survive intracellularly) → disseminate via lymphatics/blood → reticuloendothelial system (liver, spleen, bone marrow) → bacteremia → systemic illness
      - Incubation period - 6-30 days (average 10-14 days)
      - Clinical presentation - Stepwise fever pattern (classically described, but only 60% have typical presentation)
      - Week 1 - Fever (gradual onset, stepwise increase "stepladder fever," peaks 39-40°C), headache, malaise, dry cough, abdominal pain/discomfort
      - Week 2 - High sustained fever (40-41°C), relative bradycardia (pulse-temperature dissociation, pulse slower than expected for degree of fever)
      - Rose spots (30-50%) - Salmon-colored blanching maculopapular rash 2-4 mm, trunk/abdomen (fleeting, only 5-10 lesions, disappear in 2-5 days)
      - Hepatosplenomegaly (50%)
      - Abdominal distension, constipation or diarrhea (diarrhea more common in children, HIV)
      - Confusion, lethargy ("typhoid state")
      - Week 3 - Complications (if untreated) - Intestinal bleeding (10-20%), intestinal perforation (1-3%, usually terminal ileum), shock
      - Week 4 - Gradual defervescence (resolution), but relapses occur 5-10% (2-3 weeks after initial illness)
      - Paratyphoid fever (S. Paratyphi A, B, C) - Clinically similar but milder, shorter duration
      - Physical exam - Fever, relative bradycardia, altered mental status ("typhoid state"), hepatosplenomegaly, abdominal tenderness, rose spots (rare)
      - Labs
      - WBC - Leukopenia or normal (NOT leukocytosis, distinguishes from other bacterial infections)
      - Anemia, thrombocytopenia (mild)
      - Transaminases - Elevated (hepatitis), 2-3x ULN
      - Blood cultures - Positive 40-80% (highest yield week 1, before antibiotics)
      - Gold standard diagnosis
      - Multiple sets (2-3) increase yield
      - Bone marrow culture - Most sensitive (90%, higher yield than blood, especially if antibiotics started), but invasive
      - Stool culture - Positive 30-40% week 1, 60% week 3 (less sensitive than blood early, more sensitive late)
      - Urine culture - Positive 25% (lower yield)
      - Serologic tests - Widal test (anti-O and anti-H antibodies)
      - Low sensitivity/specificity (cross-reactivity, endemic areas have baseline antibodies)
      - NOT recommended (obsolete)
      - PCR, antigen detection - Emerging (limited availability)
      - Imaging - CT abdomen if suspect complications (perforation, abscess)
      - Differential diagnosis - Malaria (similar fever pattern endemic areas, do malaria smear), dengue fever, rickettsial infections, brucellosis, leptospirosis, infectious mononucleosis, viral hepatitis, HIV acute retroviral syndrome
      - Complications
      - Intestinal perforation (1-3%) - Occurs week 3 (ulceration Peyer patches), presents acute abdomen (sudden worsening abdominal pain, peritonitis, free air)
      - Surgical emergency (laparotomy, bowel resection, mortality 10-30%)
      - GI bleeding (10-20%) - Usually mild, resolves with supportive care; massive hemorrhage rare (requires transfusion, surgery)
      - Encephalopathy (10-40%) - "Typhoid state" confusion, delirium, stupor, seizures, meningitis (rare)
      - Myocarditis (1-5%) - Arrhythmias, heart failure
      - Hepatitis, cholecystitis (chronic carriage)
      - Splenic abscess, osteomyelitis (sickle cell disease), pneumonia
      - Relapse (5-10%) - 2-3 weeks after initial treatment (shorter antibiotic courses higher relapse)
      - Chronic carrier state (1-4%) - Asymptomatic shedding stool >1 year (reservoir for transmission)
      - Chronic colonization gallbladder (may have gallstones)
      - Higher risk - Women, age >50, gallbladder disease, H. pylori (carriers should be screened/treated)
    treatment:
      - Antibiotic therapy - ESSENTIAL (reduces mortality from 20% to <1%, shortens illness)
      - Empiric treatment - Start while awaiting cultures (especially if severely ill)
      - Choice depends on resistance pattern (geographic area)
      - Fully susceptible S. Typhi (rare now)
      - Fluoroquinolones - Ciprofloxacin 500 mg PO BID or levofloxacin 500 mg PO daily x 7-10 days (defervescence in 3-5 days)
      - Ceftriaxone 2 g IV daily x 7-14 days
      - Azithromycin 1 g PO day 1, then 500 mg daily x 6 days (total 7 days)
      - Multidrug-resistant (MDR) S. Typhi - Resistant to chloramphenicol, ampicillin, trimethoprim-sulfamethoxazole (common South Asia)
      - Fluoroquinolones OR ceftriaxone (still usually susceptible)
      - Fluoroquinolone-resistant (nalidixic acid-resistant) S. Typhi - Increasing, South Asia 90% isolates
      - High-level resistance to ciprofloxacin
      - Ceftriaxone 2 g IV daily x 10-14 days (first-line)
      - Azithromycin 1 g day 1, then 500 mg x 6 days (alternative, PO option)
      - Extensively drug-resistant (XDR) S. Typhi - Resistant to fluoroquinolones, third-generation cephalosporins, MDR drugs
      - Emerging, outbreaks Pakistan 2016-present
      - Azithromycin (first-line for XDR)
      - Carbapenems (meropenem 1 g IV q8h) if azithromycin-resistant
      - Duration - 10-14 days (reduce relapse risk, shorter courses 5-7 days higher relapse 15-20%)
      - Longer (14-21 days) if complications (perforation, abscess, severe disease)
      - Supportive care
      - Hydration - IV fluids if unable to tolerate PO, dehydration
      - Fever control - Acetaminophen (avoid NSAIDs if bleeding risk)
      - Nutrition - Soft diet initially, avoid high fiber (reduce bowel perforation risk)
      - Monitor - Vital signs, mental status, abdominal exam (watch for perforation)
      - Complications management
      - Intestinal perforation - Surgical emergency (exploratory laparotomy, bowel resection or primary repair, peritoneal lavage)
      - Broad-spectrum antibiotics (cover anaerobes)
      - GI bleeding - Transfusion if severe, surgery rarely needed
      - Encephalopathy - Supportive, dexamethasone 3 mg/kg IV loading then 1 mg/kg q6h x 48 hours (CONTROVERSIAL, only if severe obtundation/shock)
      - Chronic carrier treatment - If shedding >1 year, occupation high-risk (food handler, healthcare), immunocompromised
      - Ciprofloxacin 750 mg PO BID x 28 days (cure 80%)
      - Ceftriaxone 2 g IV daily x 14 days
      - Azithromycin 500 mg PO daily x 28 days
      - Cholecystectomy - If gallstones present AND antibiotic failure (cure 85%)
      - Prevention
      - Vaccination - Travelers to endemic areas, laboratory workers, household contacts of carriers
      - Ty21a (Vivotif) - Live attenuated oral vaccine, 4 doses over 1 week, efficacy 50-70%, lasts 5-7 years
      - Avoid if immunocompromised, antibiotics (kill vaccine strain)
      - Vi polysaccharide (Typhim Vi) - Inactivated IM injection, single dose, efficacy 50-70%, lasts 2-3 years
      - Conjugate Vi vaccine (Typbar-TCV) - Newer, single dose, approved age >6 months, longer duration
      - Vaccination does NOT provide 100% protection (still need food/water precautions)
      - Food/water safety - "Boil it, cook it, peel it, or forget it"
      - Avoid raw vegetables, fruits (unless peeled), ice cubes, tap water, street food
      - Prognosis
      - With treatment - Mortality <1%, defervescence 3-5 days, full recovery 2-4 weeks
      - Without treatment - Mortality 10-20% (complications)
      - Relapse 5-10%, chronic carrier 1-4%
