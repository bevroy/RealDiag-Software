tree_id: GI-CIRRHOSIS
name: Cirrhosis
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Ascites and jaundice
description: |
  End-stage liver disease with fibrosis and nodular regeneration. Irreversible architectural distortion.
  Common causes include alcohol (40%), hepatitis C (30%), NAFLD (20%), hepatitis B (10%). Complications include portal hypertension, ascites, hepatic encephalopathy, variceal bleeding.
icd10: K74.60
urgency: Moderate
workup:
  - Liver enzymes (AST, ALT, alkaline phosphatase, bilirubin) - AST greater than ALT suggests alcohol
  - Albumin and INR assess synthetic function
  - Complete blood count (thrombocytopenia from portal hypertension and hypersplenism)
  - Abdominal ultrasound with Doppler (assess for hepatocellular carcinoma, portal vein thrombosis, ascites)
  - Child-Pugh score or MELD score to assess severity and prognosis
  - Upper endoscopy to screen for esophageal varices
  - Hepatitis B and C serology, autoimmune hepatitis panel, iron studies (hemochromatosis), ceruloplasmin (Wilson disease)
  - Alpha-fetoprotein and liver imaging every 6 months to screen for hepatocellular carcinoma
treatment:
  - Treat underlying cause (alcohol cessation, antiviral therapy for hepatitis B/C, weight loss for NAFLD)
  - Ascites management - sodium restriction less than 2g/day, diuretics (spironolactone 100mg plus furosemide 40mg daily)
  - Large-volume paracentesis if tense ascites (albumin 6-8g per liter removed if greater than 5L)
  - Spontaneous bacterial peritonitis prophylaxis - norfloxacin 400mg daily or ciprofloxacin 750mg weekly if history of SBP or ascitic protein less than 1.5 g/dL
  - Beta-blocker (propranolol or carvedilol) for primary or secondary variceal bleeding prophylaxis
  - Hepatic encephalopathy treatment - lactulose 30mL TID to achieve 2-3 soft bowel movements daily, rifaximin 550mg BID
  - Nutrition - high-protein diet (1-1.5 g/kg/day), zinc and multivitamin supplementation
  - Avoid hepatotoxins (alcohol, NSAIDs, certain antibiotics)
  - Liver transplant evaluation if decompensated cirrhosis (MELD score 15 or higher)
clinical_pearls:
  - Compensated cirrhosis may be asymptomatic or have fatigue, pruritus
  - Decompensated cirrhosis presents with ascites, variceal bleeding, hepatic encephalopathy, jaundice
  - Child-Pugh score assesses severity using bilirubin, albumin, INR, ascites, encephalopathy (Class A best, C worst)
  - MELD score predicts 3-month mortality and used for transplant prioritization
  - Signs of portal hypertension include splenomegaly, thrombocytopenia, varices, ascites, caput medusae
  - Hepatorenal syndrome is AKI from renal vasoconstriction in advanced cirrhosis (poor prognosis, needs transplant)
differentials:
  - Alcoholic liver disease
  - Nonalcoholic fatty liver disease
  - Chronic hepatitis B or C
  - Autoimmune hepatitis
  - Primary biliary cholangitis
  - Hemochromatosis
trace:
  - Abdominal distension and leg swelling x 2 months → Jaundice, spider angiomata, palmar erythema on exam → Ultrasound shows cirrhotic liver, splenomegaly, ascites → Paracentesis shows SAAG greater than 1.1 (portal hypertension), no SBP → Hepatitis C antibody positive, HCV RNA detectable → Child-Pugh Class B, MELD 15 → Start spironolactone 100mg plus furosemide 40mg → Upper endoscopy shows medium varices, start propranolol 20mg BID → Treat hepatitis C with sofosbuvir/velpatasvir → Refer for liver transplant evaluation
