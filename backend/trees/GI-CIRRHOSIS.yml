workup:
  - Liver ultrasound (nodular liver, splenomegaly, ascites, portal vein patency)
  - Liver function tests (albumin, bilirubin, PT/INR, transaminases)
  - Hepatitis serologies (HBsAg, anti-HCV), iron studies (ferritin, TIBC), ANA/ASMA (autoimmune)
  - EGD (screen for varices)
  - Ultrasound + AFP every 6 months (HCC screening)
treatment:
  - 'Guideline-based treatment options for Liver Cirrhosis include:'
  - 'Treat underlying cause: Alcohol cessation, antiviral therapy (HBV with tenofovir, HCV with DAAs) (ACG 2023)'
  - 'Ascites: Sodium restriction (<2g/day), spironolactone 100mg + furosemide 40mg (2:1 ratio) (ACG 2023)'
  - 'Hepatic encephalopathy: Lactulose 30mL TID (goal 2-3 soft stools/day) + rifaximin 550mg BID (ACG 2023)'
  - 'Variceal prophylaxis: Propranolol 20mg BID (titrate to HR 55-60) or nadolol, or EGD banding (ACG 2023)'
  - Liver transplant evaluation if decompensated (ascites, variceal bleed, encephalopathy) or MELD >15 (ACG 2023)
clinical_pearls:
  - End-stage liver disease with fibrosis and regenerative nodules
  - 'Causes: Alcohol (most common US), hepatitis C, NAFLD, hepatitis B, autoimmune, hemochromatosis'
  - Child-Pugh score (A, B, C) and MELD score predict mortality
  - 'Screen for HCC: Ultrasound + AFP every 6 months (cirrhosis increases HCC risk 100-fold)'
  - 'Variceal screening: EGD at diagnosis, if large varices start propranolol prophylaxis'
  - 'Hepatorenal syndrome: Renal failure in cirrhosis (high mortality without transplant)'
red_flags: []
disposition_guidance: {}
referrals:
  - Gastroenterology/hepatology for all cirrhosis patients
  - Transplant hepatology if decompensated (ascites, variceal bleed, encephalopathy) or MELD >15
  - Addiction medicine for alcohol use disorder
