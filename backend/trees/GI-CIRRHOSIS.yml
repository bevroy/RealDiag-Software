tree_id: GI-CIRRHOSIS
name: Cirrhosis
family: Gastrointestinal
specialty: Gastroenterology
chief_complaint: Abdominal distension
description: End-stage liver disease with irreversible fibrosis and nodular regeneration causing portal hypertension and hepatic dysfunction

icd10: K74.60

urgency: routine_urgent

workup:
  - Clinical presentation compensated: often asymptomatic, incidental lab abnormalities, or nonspecific (fatigue, anorexia, weight loss)
  - Clinical presentation decompensated: ascites, variceal hemorrhage, hepatic encephalopathy, jaundice (indicates decompensation and worse prognosis)
  - Exam: spider angiomata, palmar erythema, gynecomastia, testicular atrophy, jaundice, ascites, splenomegaly, caput medusae, asterixis (hepatic encephalopathy)
  - Laboratory: CBC (thrombocytopenia from splenomegaly/portal hypertension, anemia), CMP (hypoalbuminemia, hyperbilirubinemia, elevated transaminases AST/ALT - AST greater than ALT suggests alcohol, prolonged PT/INR from synthetic dysfunction), ammonia if encephalopathy
  - Etiology workup: hepatitis B surface antigen, hepatitis C antibody with RNA, iron studies (ferritin, transferrin saturation for hemochromatosis), ceruloplasmin (Wilson disease if age less than 40), ANA/anti-smooth muscle antibody (autoimmune hepatitis), alpha-1 antitrypsin level
  - Imaging ultrasound with Doppler: nodular liver, increased echogenicity, portal vein patency and direction of flow, splenomegaly, ascites
  - Fibroscan (transient elastography): assess degree of fibrosis noninvasively, liver stiffness greater than 12.5 kPa suggests cirrhosis
  - Liver biopsy: gold standard for diagnosis and staging (Metavir or Ishak score) but often not needed if clinical/lab/imaging consistent
  - Screen for complications: EGD (esophageal varices screening), ultrasound with AFP every 6 months (hepatocellular carcinoma surveillance), CT or MRI if liver mass
  - Child-Pugh score: classifies severity using bilirubin, albumin, INR, ascites, encephalopathy - Class A (5-6 points, 1-year survival 100 percent), Class B (7-9 points, 80 percent), Class C (10-15 points, 45 percent)
  - MELD score: predicts 3-month mortality, used for transplant allocation, calculated from bilirubin, INR, creatinine

treatment:
  - Treat underlying cause: alcohol abstinence (improves survival), antiviral therapy for hepatitis B (tenofovir, entecavir) or C (sofosbuvir/velpatasvir cure rates over 95 percent), immunosuppression for autoimmune hepatitis, phlebotomy for hemochromatosis, copper chelation for Wilson disease
  - Ascites management: sodium restriction (2 grams daily), diuretics (spironolactone 100-400 mg daily plus furosemide 40-160 mg daily - start spironolactone first, maintain ratio 100:40), large-volume paracentesis if tense ascites (remove up to 5 L, give albumin 6-8 grams per liter removed if more than 5 L)
  - Spontaneous bacterial peritonitis (SBP) treatment: ceftriaxone 2 grams IV daily or cefotaxime 2 grams every 8 hours x 5 days, plus albumin 1.5 grams/kg day 1 and 1 gram/kg day 3 (reduces renal dysfunction/mortality), SBP prophylaxis if prior SBP or ascites protein less than 1.5 grams/dL (norfloxacin 400 mg daily or ciprofloxacin 500 mg daily)
  - Hepatic encephalopathy: lactulose 15-30 mL TID titrate to 2-3 soft bowel movements daily (reduces ammonia), rifaximin 550 mg BID (adjunct to lactulose, reduces recurrence), identify precipitants (GI bleed, infection, constipation, medications)
  - Variceal bleeding prevention: nonselective beta-blockers (propranolol, nadolol, carvedilol) reduce portal pressure, goal HR 55-60 bpm or 25 percent reduction, endoscopic band ligation if large varices or beta-blocker intolerance
  - Acute variceal hemorrhage: resuscitation (2 large-bore IVs, blood products), octreotide 50 mcg bolus then 50 mcg/hr infusion (reduces portal pressure), ceftriaxone 1 gram daily (prophylaxis), emergent EGD for band ligation or sclerotherapy, TIPS if refractory
  - Hepatocellular carcinoma surveillance: ultrasound with AFP every 6 months, curative options if early-stage (resection, transplant, ablation)
  - Liver transplant evaluation if decompensated (Child-Pugh B/C or MELD greater than 15) - definitive treatment

clinical_pearls:
  - Most common causes alcohol (30 percent), hepatitis C (25 percent), NAFLD (20 percent)
  - Compensated cirrhosis often asymptomatic, decompensation (ascites, variceal bleed, encephalopathy, jaundice) indicates poor prognosis
  - Thrombocytopenia and splenomegaly suggest portal hypertension
  - Screen for varices with EGD, HCC with ultrasound plus AFP every 6 months
  - SBP diagnosed by ascitic fluid PMN count 250 or more cells/microL, treat with ceftriaxone plus albumin
  - MELD score predicts mortality and guides transplant listing
  - Alcohol abstinence improves survival even with established cirrhosis

differentials:
  - Acute liver failure (rapid onset hepatic dysfunction with coagulopathy and encephalopathy within weeks, no prior chronic liver disease)
  - Cardiac cirrhosis (right heart failure causing hepatic congestion, elevated JVP, leg edema, echo shows RV dysfunction)
  - Budd-Chiari syndrome (hepatic vein thrombosis, acute abdominal pain, hepatomegaly, ascites, Doppler shows occluded hepatic veins)
  - Portal vein thrombosis (acute or chronic, causes portal hypertension without cirrhosis, imaging shows thrombus)

trace:
  - 58-year-old man with 30-year history alcohol use disorder (drinking stopped 3 months ago) presents with progressive abdominal distension x 1 month, leg swelling, easy bruising
  - Exam: jaundice, spider angiomata chest, palmar erythema, distended abdomen with shifting dullness (ascites), splenomegaly, 2+ pitting edema legs, no asterixis, alert and oriented
  - Labs: platelet 72K (thrombocytopenia), albumin 2.6 grams/dL (low), bilirubin 3.2 mg/dL (elevated), AST 98, ALT 45 (AST:ALT ratio greater than 2 suggests alcohol), INR 1.8 (prolonged), ammonia 45 mcmol/L (normal)
  - Hepatitis B surface antigen negative, hepatitis C antibody negative (exclude viral hepatitis)
  - Ultrasound: nodular liver consistent with cirrhosis, patent portal vein with hepatopetal flow, splenomegaly, moderate ascites
  - Diagnostic paracentesis: SAAG (serum-ascites albumin gradient) 1.8 (greater than 1.1 confirms portal hypertension), ascitic fluid protein 1.1 grams/dL, WBC 150 cells/microL with 60 PMNs (no SBP), Gram stain/culture negative
  - EGD: medium esophageal varices, no bleeding
  - Child-Pugh score: bilirubin 3.2 (2 points), albumin 2.6 (3 points), INR 1.8 (2 points), moderate ascites (2 points), no encephalopathy (1 point) = 10 points Class C
  - MELD score: 19 (high risk, transplant evaluation indicated)
  - Diagnosis: decompensated cirrhosis (alcoholic) with ascites, thrombocytopenia, coagulopathy, Child-Pugh Class C
  - Started spironolactone 100 mg daily, furosemide 40 mg daily, sodium restriction 2 grams daily, propranolol 20 mg BID (variceal prophylaxis titrate up)
  - Alcohol cessation counseling, referred to addiction services
  - Referred to transplant center for liver transplant evaluation
  - 2 weeks: losing fluid, weight decreased 10 pounds, ascites improved, continues diuretics
  - Started HCC surveillance ultrasound with AFP every 6 months
  - Listed for liver transplant, MELD 19, awaiting donor
