tree_id: HEME-DEEP-VEIN-THROMBOSIS
name: Deep Vein Thrombosis
family: Hematology
specialty: Hematology
chief_complaint: Unilateral leg swelling and pain
description: |
  Blood clot in deep venous system, most commonly lower extremity. Risk factors include immobility, surgery, malignancy, pregnancy, oral contraceptives, thrombophilia.
  Complications include pulmonary embolism (most serious) and post-thrombotic syndrome. Virchow triad includes stasis, endothelial injury, hypercoagulability.
icd10: I82.40
urgency: High
workup:
  - Wells criteria to assess pretest probability - active cancer (1 point), paralysis/recent cast (1), bedridden greater than 3 days or major surgery within 4 weeks (1), tenderness along deep veins (1), entire leg swollen (1), calf swelling greater than 3 cm (1), pitting edema (1), collateral superficial veins (1), alternative diagnosis likely (-2)
  - Low probability (0 or less) 5% DVT, moderate (1-2) 17%, high (3 or more) 53%
  - D-dimer if low or moderate probability (negative rules out DVT, sensitivity 95%)
  - Compression ultrasound with Doppler (gold standard) - non-compressible vein diagnostic, 95% sensitive for proximal DVT
  - Repeat ultrasound in 1 week if initial negative but high suspicion
  - CT or MRI venography if pelvic or IVC thrombus suspected
treatment:
  - Anticoagulation to prevent clot propagation and PE
  - DOAC preferred first-line - apixaban 10mg BID x 7 days then 5mg BID, rivaroxaban 15mg BID x 3 weeks then 20mg daily, edoxaban 60mg daily (after 5 days parenteral anticoagulation)
  - Alternative parenteral anticoagulation - enoxaparin 1 mg/kg SC q12h or fondaparinux, then transition to warfarin (overlap until INR 2-3 for 24 hours)
  - Duration - provoked DVT (surgery, temporary risk factor) 3 months, unprovoked DVT at least 3 months (consider indefinite if low bleeding risk), recurrent DVT or cancer indefinite
  - IVC filter if anticoagulation contraindicated (active bleeding, recent surgery) - retrievable filter preferred
  - Compression stockings 30-40 mmHg to reduce post-thrombotic syndrome
  - Early mobilization encouraged (bed rest not beneficial)
  - Thrombolysis reserved for massive iliofemoral DVT causing limb-threatening ischemia (phlegmasia cerulea dolens)
clinical_pearls:
  - Homans sign (dorsiflexion causing calf pain) unreliable and not recommended
  - Proximal DVT (popliteal, femoral, iliac) higher risk of PE than distal calf DVT
  - Cancer-associated thrombosis treat with LMWH or DOAC (rivaroxaban or apixaban)
  - Provoked DVT has lower recurrence risk (5-10%) than unprovoked (30% at 5 years)
  - Screen for inherited thrombophilia (protein C/S deficiency, factor V Leiden, prothrombin mutation) only if unprovoked VTE at young age, recurrent VTE, or strong family history
  - Post-thrombotic syndrome (chronic leg pain, swelling, skin changes) occurs in 20-50% despite anticoagulation
differentials:
  - Superficial thrombophlebitis
  - Cellulitis
  - Ruptured Baker cyst
  - Muscle strain or tear
  - Lymphedema
  - Chronic venous insufficiency
trace:
  - Left leg swelling and pain x 2 days, recent 8-hour flight → Wells score 4 (high probability) → Compression ultrasound shows non-compressible left popliteal and femoral veins → Diagnose proximal DVT → Start apixaban 10mg BID x 7 days → Transition to 5mg BID → 30-40 mmHg compression stocking → No prior VTE, no malignancy, provoked by travel → Continue anticoagulation 3 months → Repeat ultrasound shows recanalization → Stop anticoagulation after 3 months
