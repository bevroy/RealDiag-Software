tree_id: DERM-ERYTHEMA-NODOSUM
name: Erythema Nodosum
family: Dermatology
specialty: Dermatology
chief_complaint: Painful red bumps on shins
description: Panniculitis causing tender subcutaneous nodules on anterior shins, reactive phenomenon with multiple potential triggers including infections, medications, sarcoidosis, IBD. Self-limited in most cases, NSAIDs and rest primary treatment, identify and treat underlying cause.
icd10: L52
snomed: 238838007
presentations:
  - Tender, erythematous nodules
  - Bilateral pretibial location (shins)
  - Warm to touch, bruise-like discoloration
  - Fever, malaise, arthralgias
  - Associated with infections, IBD, sarcoidosis
  - Self-limited (3-6 weeks)
urgency: routine

referrals:
  emergency:
    - Suspected necrotizing fasciitis
    - Stevens-Johnson syndrome/TEN
    - Anaphylaxis
  urgent:
    - Suspected melanoma
    - Rapidly growing lesion
    - Severe drug reaction
    - Suspected malignancy
  routine:
    - Chronic dermatitis management
    - Acne unresponsive to treatment
    - Cosmetic concerns
    - Mole surveillance

workup:
  - Clinical presentation: acute tender erythematous subcutaneous nodules
  - Location: bilateral anterior shins (classic), occasionally thighs or arms
  - Appearance: raised, firm, warm, tender nodules 1-5 cm diameter, red to violaceous
  - Evolution: do NOT ulcerate (vs erythema induratum which ulcerates), resolve over 3-6 weeks leaving bruise-like appearance
  - Crop pattern: new lesions appear as old ones resolve over weeks
  - Associated symptoms: fever, malaise, arthralgias (50%), arthritis
  - More common in women (3-6:1), peak age 20-40 years
  - Common triggers and causes:
  - Streptococcal pharyngitis (most common infectious cause): recent sore throat
  - Medications: oral contraceptives (most common drug cause), antibiotics (sulfonamides, penicillins)
  - Sarcoidosis: 10-20% of sarcoidosis patients develop EN, bilateral hilar lymphadenopathy on CXR (Löfgren syndrome)
  - Inflammatory bowel disease: Crohn disease or ulcerative colitis
  - Pregnancy: first trimester (increased estrogen)
  - Infections: tuberculosis, coccidioidomycosis (Valley fever), histoplasmosis, Yersinia
  - Idiopathic: 30-50% no cause identified
  - Workup for underlying cause:
  - Strep testing: throat culture or rapid strep, ASO titer (anti-streptolysin O antibodies)
  - Chest X-ray: bilateral hilar lymphadenopathy (sarcoidosis), infiltrates (TB, fungal)
  - PPD or IGRA: tuberculosis screening if risk factors
  - Pregnancy test: if reproductive age woman
  - ESR: elevated (non-specific inflammatory marker)
  - CBC: may show leukocytosis
  - Stool studies: if GI symptoms (rule out IBD, Yersinia)
  - Biopsy: rarely needed (classic clinical appearance diagnostic), shows septal panniculitis without vasculitis
  - Sarcoidosis workup if CXR shows hilar lymphadenopathy: ACE level, ophthalmology exam

treatment:
  - Identify and treat underlying cause:
  - Treat strep pharyngitis: penicillin VK 500 mg BID x10 days or amoxicillin 500 mg TID x10 days
  - Discontinue offending medications: especially OCPs, sulfonamides
  - Treat underlying sarcoidosis, IBD, or infection
  - Symptomatic treatment (most important):
  - NSAIDs (first-line): ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Reduces pain and inflammation
  - Rest and leg elevation: decreases pain and swelling
  - Compression stockings: support may reduce discomfort
  - Cool compresses: soothing to lesions
  - Potassium iodide (SSKI): 300-900 mg daily divided TID, effective but rarely used (GI upset, metallic taste)
  - Systemic corticosteroids: prednisone 40-60 mg daily taper over 2-4 weeks for severe cases
  - Only if infection ruled out (do NOT give steroids if TB suspected)
  - Reserve for disabling symptoms or severe systemic illness
  - Colchicine: 0.6 mg BID, alternative for recurrent cases
  - Natural course: self-limited, resolves in 3-6 weeks even without treatment
  - No scarring or ulceration (distinguishes from other panniculitides)
  - Recurrence: 10-20% have recurrent episodes

clinical_pearls:
  - Tender red subcutaneous nodules on bilateral anterior shins
  - Do NOT ulcerate (vs erythema induratum ulcerates)
  - Most common causes: strep infection, OCPs, sarcoidosis, IBD
  - Self-limited, resolves in 3-6 weeks with bruise-like appearance
  - NSAIDs and rest primary treatment
  - Chest X-ray to rule out sarcoidosis (hilar lymphadenopathy)
  - Rule out TB before giving steroids
  - More common in women 20-40 years
  - 30-50% idiopathic (no cause found)

differentials:
  - Erythema induratum (nodular vasculitis): posterior calves, ulcerates, associated with TB
  - Cellulitis: unilateral, spreading erythema, more diffuse, responds to antibiotics
  - Nodular vasculitis: similar appearance but ulcerates
  - Superficial thrombophlebitis: follows vein, cord-like, more superficial

trace: |
  A 28-year-old woman on oral contraceptive pills presented with 1 week of painful red bumps on both shins. Started with 3-4 tender nodules on anterior lower legs, now has 8-10 lesions. Lesions warm, tender, making walking difficult. Low-grade fever, malaise, joint aches in knees and ankles. Two weeks ago had sore throat that resolved on its own. Exam showed multiple tender erythematous subcutaneous nodules 2-4 cm diameter on bilateral anterior shins (classic location), warm, firm, raised, violaceous. No ulceration. Some older lesions with yellowish-green discoloration (bruise-like, resolving stage). Bilateral knee and ankle tenderness without effusions. Labs: ESR 60 (elevated), WBC 11500 (mild leukocytosis), ASO titer elevated at 640 (indicates recent streptococcal infection). Pregnancy test negative. Chest X-ray normal (ruled out sarcoidosis). Diagnosed with erythema nodosum triggered by recent streptococcal pharyngitis and possibly oral contraceptives. Treated preceding strep infection with amoxicillin 500 mg TID x10 days even though throat symptoms resolved. Discontinued oral contraceptive pills (common trigger). Started ibuprofen 800 mg TID for pain and inflammation. Counseled on rest with leg elevation, avoid prolonged standing. At 1 week pain improved 50%, no new lesions appearing. At 3 weeks existing lesions resolving with bruise-like appearance (yellow-green-brown), no new lesions. At 6 weeks complete resolution, no scarring (EN does not scar or ulcerate). Counseled on self-limited nature (3-6 weeks), 10-20% recurrence risk. Switched to barrier contraception method.
