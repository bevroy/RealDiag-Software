tree_id: RHEUM-SYSTEMIC-LUPUS-ERYTHEMATOSUS
name: Systemic Lupus Erythematosus
family: Rheumatology
specialty: Rheumatology
chief_complaint: Multi-system symptoms with photosensitive rash
description: |
  Chronic autoimmune disease with multi-organ involvement. Autoantibodies against nuclear antigens cause inflammation.
  More common in women (9:1), African Americans, Hispanics, Asians. Peak onset 15-45 years. Flares and remissions characteristic.
icd10: M32.9
urgency: Moderate
workup:
  - Antinuclear antibodies (ANA) screening - positive in 95-98% (sensitive but not specific)
  - If ANA positive, reflex to specific antibodies - anti-dsDNA (60-70% sensitive, highly specific), anti-Smith (25% sensitive, very specific)
  - Complement levels (C3, C4) - low during active disease, reflects consumption
  - Complete blood count - anemia, leukopenia, thrombocytopenia common
  - Comprehensive metabolic panel - assess kidney function (lupus nephritis)
  - Urinalysis - proteinuria, hematuria, cellular casts indicate nephritis
  - 24-hour urine protein or spot protein-to-creatinine ratio if proteinuria present
  - Anti-cardiolipin antibodies, anti-beta-2-glycoprotein I, lupus anticoagulant (antiphospholipid syndrome)
  - ESR elevated (CRP often normal or mildly elevated)
  - Renal biopsy if lupus nephritis suspected (determines class and guides treatment)
  - SLICC or ACR/EULAR classification criteria for diagnosis
treatment:
  - Hydroxychloroquine 200-400mg daily (all patients, reduces flares and organ damage)
  - NSAIDs for arthritis and serositis
  - Topical corticosteroids for skin manifestations
  - Systemic corticosteroids for moderate to severe disease - prednisone 0.5-1 mg/kg/day, taper as tolerated
  - Immunosuppressants for severe organ involvement - mycophenolate mofetil 1-3g/day (lupus nephritis), azathioprine 1-2 mg/kg/day, methotrexate 15-25mg weekly
  - Cyclophosphamide IV monthly x 6 months for severe nephritis or CNS lupus
  - Belimumab (B-cell inhibitor) 10 mg/kg IV monthly or 200mg SC weekly for active disease despite standard therapy
  - Rituximab for refractory disease
  - Anticoagulation if antiphospholipid syndrome
  - Sun protection (SPF 50+, protective clothing) - UV exposure triggers flares
  - Vaccinations (pneumococcal, influenza, Tdap) before starting immunosuppression
clinical_pearls:
  - Classic malar (butterfly) rash spares nasolabial folds, worsens with sun exposure
  - SLICC criteria include clinical (11 items) and immunologic (6 items) - need 4 criteria with at least 1 clinical and 1 immunologic
  - Drug-induced lupus (hydralazine, procainamide, isoniazid) - anti-histone antibodies positive, resolves with drug discontinuation
  - Lupus nephritis occurs in 50% of patients, most common classes III (focal), IV (diffuse), V (membranous)
  - CNS lupus presents with seizures, psychosis, cognitive dysfunction
  - Discoid lupus causes scarring alopecia and hypopigmented plaques
differentials:
  - Mixed connective tissue disease
  - Rheumatoid arthritis
  - Sjogren syndrome
  - Drug-induced lupus
  - Antiphospholipid syndrome
  - Vasculitis
trace:
  - 28-year-old woman with photosensitive facial rash, joint pain, fatigue x 6 months → Exam shows malar rash sparing nasolabial folds, synovitis in MCPs → ANA 1:640 speckled pattern, anti-dsDNA positive, anti-Smith positive → Low C3 42 mg/dL and C4 8 mg/dL → CBC shows WBC 3200, platelets 98000 → Urinalysis shows 2+ protein, RBC casts → 24-hour urine protein 2.8 g → Renal biopsy shows Class IV lupus nephritis → Start prednisone 60mg daily, mycophenolate mofetil 2g daily, hydroxychloroquine 400mg daily → Cyclophosphamide 750 mg/m2 IV monthly x 6 months → Proteinuria improves, complement normalizes → Taper prednisone, continue mycophenolate and hydroxychloroquine long-term
