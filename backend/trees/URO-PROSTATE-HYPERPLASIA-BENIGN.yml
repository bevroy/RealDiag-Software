tree_id: URO-PROSTATE-HYPERPLASIA-BENIGN
name: Benign Prostatic Hyperplasia
family: Urology
specialty: Urology
chief_complaint: Difficulty urinating
description: Age-related non-malignant enlargement of prostate gland causing bladder outlet obstruction with urinary symptoms. Medical therapy or minimally invasive procedures improve quality of life.
icd10: N40.1
snomed: 253875009
presentations:
  - Lower urinary tract symptoms (LUTS)
  - Urinary hesitancy, weak stream
  - Frequency, nocturia
  - Incomplete emptying
  - Urgency, incontinence
  - Enlarged prostate on DRE
urgency: non-urgent

workup:
  - Clinical diagnosis: lower urinary tract symptoms (LUTS) in older men - obstructive (weak stream, hesitancy, incomplete emptying) and irritative (frequency, urgency, nocturia)
  - International Prostate Symptom Score (IPSS): 0-7 mild, 8-19 moderate, 20-35 severe (guides treatment)
  - Digital rectal exam: enlarged smooth prostate (estimate size), rule out nodules or induration suggesting cancer
  - Urinalysis: exclude UTI and hematuria
  - PSA: rule out prostate cancer (BPH alone does not significantly elevate PSA, but larger prostates produce more PSA)
  - Post-void residual (PVR): bladder scan after voiding, >200 mL significant retention
  - Uroflowmetry: Qmax <10 mL/sec suggests obstruction
  - Renal function: check creatinine if severe symptoms or retention (hydronephrosis from chronic retention)
  - Cystoscopy: if hematuria, stricture suspected, or planning surgery

treatment:
  - Watchful waiting: if mild symptoms IPSS <8 and not bothersome
  - Alpha-blockers (first-line for moderate-severe symptoms): tamsulosin 0.4 mg daily or alfuzosin 10 mg daily - relax prostatic smooth muscle, rapid symptom improvement within days
  - 5-alpha reductase inhibitors: finasteride 5 mg daily or dutasteride 0.5 mg daily - shrink prostate over 6-12 months, best for large prostates >40 grams, lower PSA by 50%
  - Combination therapy: alpha-blocker plus 5-ARI more effective than monotherapy for large prostates
  - Anticholinergics or beta-3 agonists: add if persistent irritative symptoms despite alpha-blocker
  - Phosphodiesterase-5 inhibitors: tadalafil 5 mg daily improves LUTS (also treats erectile dysfunction)
  - Minimally invasive procedures: prostatic urethral lift (UroLift), water vapor thermal therapy (Rezum), temporary implantable nitinol device (iTIND)
  - Surgery indications: refractory retention, recurrent UTIs, bladder stones, renal insufficiency from obstruction, refractory symptoms despite medical therapy
  - TURP (transurethral resection of prostate): gold standard surgery, 75% symptom improvement
  - Avoid decongestants (worsen obstruction), anticholinergics (worsen retention), limit fluids before bed (reduce nocturia)

clinical_pearls:
  - LUTS in older men - obstructive (weak stream, hesitancy) and irritative (frequency, urgency, nocturia)
  - IPSS quantifies severity and guides treatment
  - Alpha-blockers first-line - rapid symptom improvement within days
  - 5-ARI shrink prostate over 6-12 months, best for large glands
  - Combination therapy for large prostates and moderate-severe symptoms
  - Check PSA to exclude cancer, 5-ARI lowers PSA by 50%
  - Surgery if retention, recurrent UTI, stones, renal dysfunction, or refractory symptoms

differentials:
  - Prostate cancer: nodule or induration on DRE, elevated PSA, biopsy for diagnosis
  - Bladder outlet obstruction from urethral stricture: history of catheterization or STI, cystoscopy diagnostic
  - Neurogenic bladder: diabetes, spinal cord disease, medications causing retention
  - Urinary tract infection: dysuria, urgency, pyuria, positive culture

trace: |
  A 67-year-old man presented with 2 years of progressive urinary symptoms including weak stream, hesitancy, incomplete emptying, frequency every 2 hours during day, and nocturia 4 times per night affecting sleep and quality of life. IPSS score 21 (severe symptoms). DRE showed enlarged smooth prostate estimated 60 grams. PSA 4.8 (mildly elevated for age, consistent with BPH). PVR 180 mL. Urinalysis normal. Started tamsulosin 0.4 mg daily at bedtime (immediate symptom relief) plus finasteride 5 mg daily (long-term prostate shrinkage). Counseled on avoiding evening fluids. At 2 weeks urinary stream improved, nocturia reduced to 2-3 times. At 3 months IPSS improved to 12 (moderate), PVR 80 mL. At 12 months IPSS 8 (mild), nocturia 1-2 times, PSA 2.4 (50% reduction from finasteride expected). Excellent symptom control on combination therapy, avoids surgery.
