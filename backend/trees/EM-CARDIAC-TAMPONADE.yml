tree_id: EM-CARDIAC-TAMPONADE
name: Cardiac Tamponade
family: Emergency Medicine
specialty: Emergency Medicine
icd10:
- I31.4
snomed:
- '35304003'
urgency: medium
description: Comprehensive evaluation and management of Cardiac Tamponade
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Beck''s triad: Hypotension, elevated JVP (distended neck veins), muffled heart
  sounds'
- 'Pulsus paradoxus: SBP drops >10 mmHg with inspiration (>10 mmHg decrease)'
- Tachycardia (compensatory response to maintain cardiac output)
- Dyspnea and orthopnea
- Chest pain or discomfort
- 'Signs of shock: Cool extremities, altered mental status, pallor'
- Tachypnea
- Electrical alternans on ECG (alternating QRS amplitude - beat-to-beat variation)
- Pericardial friction rub may be present
- 'Echocardiogram: Pericardial effusion with RA/RV collapse in diastole'
- 'Causes: Pericardial effusion (malignancy, uremia, infection), trauma, post-MI (free
  wall rupture), aortic dissection'
workup:
- 'Bedside ultrasound (RUSH exam): Circumferential pericardial effusion, RV diastolic
  collapse (80% sensitive), RA systolic collapse (best predictor)'
- 'IVC ultrasound: Plethoric (dilated >2cm, <50% collapse with inspiration) - indicates
  elevated CVP'
- 'ECG: Low voltage QRS (<5mm in limb leads), electrical alternans (pathognomonic
  but rare 20%)'
- 'CXR: Enlarged cardiac silhouette (water bottle heart) - needs >250 mL effusion,
  often normal in acute tamponade'
- 'Pericardial fluid analysis: Cell count, Gram stain, culture, cytology, glucose,
  protein, LDH'
treatment:
- 'Guideline-based treatment options for Cardiac Tamponade include:'
- 'Immediate: IV access (two large-bore), aggressive fluid resuscitation (preload),
  oxygen, bedside ultrasound (ACEP 2023)'
- 'Fluids: NS bolus 1-2L to increase preload (temporizing measure - buys time for
  pericardiocentesis) (ACEP 2023)'
- 'Avoid: Positive pressure ventilation (worsens preload), diuretics (worsens preload)
  (ACEP 2023)'
- 'Emergent pericardiocentesis: Subxiphoid or parasternal approach, ultrasound-guided,
  aspirate fluid (send for culture, cytology, Gram stain) (ACEP 2023)'
- 'Disposition: ICU after pericardiocentesis, cardiothoracic surgery consult if traumatic/post-MI,
  pericardial drain placement (ACEP 2023)'
clinical_pearls:
- Accumulation of pericardial fluid compresses heart, prevents ventricular filling,
  decreases cardiac output
- 'Beck''s triad (hypotension, JVD, muffled heart sounds): Classic but only 10-40%
  have all three'
- 'Pulsus paradoxus: Exaggerated drop in SBP >10 mmHg during inspiration (normal <10
  mmHg) - 80% sensitive'
- 'Electrical alternans: Beat-to-beat variation in QRS amplitude (heart swinging in
  fluid) - pathognomonic but rare'
- 'RUSH exam (bedside ultrasound): Circumferential pericardial effusion + IVC plethora
  + RV diastolic collapse'
- Pericardiocentesis is both diagnostic and therapeutic - immediate life-saving intervention
referrals:
- Cardiology EMERGENTLY for pericardiocentesis - can be performed at bedside by emergency
  or cardiology
- 'Cardiothoracic surgery if: Traumatic tamponade, post-MI free wall rupture, recurrent
  effusion after drainage'
differentials: []
