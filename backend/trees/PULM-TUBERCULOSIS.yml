tree_id: PULM-TUBERCULOSIS
name: Tuberculosis
family: Pulmonology
specialty: Pulmonology
icd10:
- A15.0
- A15.9
- A16.9
snomed:
- '56717001'
urgency: medium
description: Comprehensive evaluation and management of Tuberculosis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Chronic cough > 3 weeks
- Hemoptysis
- Night sweats
- Fever and weight loss
- Exposure history or high-risk population
workup:
- Sputum AFB smear x 3 (quick, low sensitivity), culture (gold standard, takes 6-8
  weeks)
- GeneXpert MTB/RIF (PCR, rapid, detects rifampin resistance in 2 hours)
- 'Chest X-ray: Upper lobe cavitary lesions, hilar lymphadenopathy, miliary pattern'
- TST (tuberculin skin test) or IGRA (interferon-gamma release assay) - screen for
  LTBI
- 'Baseline: LFTs, creatinine, visual acuity (ethambutol), HIV test'
treatment:
- 'Guideline-based treatment options for Tuberculosis include:'
- 'Active TB: RIPE therapy - Rifampin 600mg, Isoniazid 300mg, Pyrazinamide 1500mg,
  Ethambutol 1200mg daily x 2 months (ATS 2023)'
- 'Continuation phase: Rifampin 600mg + isoniazid 300mg daily x 4 months (total 6
  months) (ATS 2023)'
- Add pyridoxine (vitamin B6) 25-50mg daily to prevent isoniazid neuropathy (ATS 2023)
- 'Latent TB: Isoniazid 300mg daily x 9 months OR rifampin 600mg daily x 4 months
  (ATS 2023)'
- Respiratory isolation until 3 negative sputum AFB smears (if hospitalized) (ATS
  2023)
clinical_pearls:
- 'Latent TB (LTBI): Positive test, no symptoms, not contagious - treat to prevent
  active disease'
- 'Active pulmonary TB: Upper lobe cavitary lesions, AFB smear positive, contagious'
- 'HIV patients: Atypical CXR (lower lobes, miliary), higher risk dissemination'
- RIPE therapy x 2 months (intensive), then rifampin + isoniazid x 4 months (continuation)
  = 6 months total
- Directly observed therapy (DOT) improves adherence and reduces resistance
- 'Drug resistance: MDR-TB (resistant to rifampin + isoniazid), XDR-TB (+ fluoroquinolone
  + injectable)'
referrals:
- Public health department (reportable disease, contact tracing, DOT)
- Infectious disease for all active TB (treatment monitoring, drug resistance)
- Pulmonology for bronchoscopy if unable to produce sputum
differentials: []
trace:
  source: American Thoracic Society (ATS) Guidelines, Global Initiative for Chronic
    Obstructive Lung Disease (GOLD)
