tree_id: TRAUMA-CONTUSION
name: Contusion (Bruise)
family: emergency
specialty: Emergency Medicine, Primary Care, Sports Medicine
chief_complaint: Bruise, contusion after blunt trauma
description: |
  Contusion is a closed traumatic injury causing damage to blood vessels and soft tissue without breaking the skin.
  Results in ecchymosis (bruising), pain, and swelling. Most contusions resolve spontaneously with conservative care.
icd10: S00.93XA
snomed: "125667009"
presentations:
  - Blunt trauma to soft tissue
  - Pain and tenderness at impact site
  - Swelling and edema
  - Ecchymosis (bruising) - appears within 24-48 hours
  - Color evolution - red/purple initially, then green/yellow as hemoglobin breaks down
  - Limited range of motion if near joint
  - Mechanism - fall, direct blow, sports injury, assault
urgency: Low
referrals:
  emergency:
    - Suspicion for compartment syndrome (severe pain, pallor, paresthesias, pulselessness)
    - Large expanding hematoma
    - Head trauma with neurological symptoms
  orthopedics:
    - Associated fracture
    - Muscle or tendon injury
    - Severe muscle contusion with functional impairment
workup:
  - Detailed history of mechanism and timing of injury
  - Assess for loss of consciousness (if head trauma)
  - Physical examination
    - Inspect for ecchymosis, swelling, skin integrity
    - Palpate for tenderness, hematoma, bony tenderness
    - Assess range of motion and strength
    - Neurovascular exam distal to injury
  - Red flags requiring imaging
    - Severe pain out of proportion
    - Bony point tenderness (possible fracture)
    - Inability to bear weight or use affected limb
    - Neurovascular compromise
    - Large expanding hematoma
  - Imaging if indicated
    - X-ray to rule out fracture if bony tenderness or significant mechanism
    - Ultrasound to assess hematoma size if large or expanding
    - CT or MRI rarely needed unless concern for deeper injury
  - Labs rarely indicated unless
    - Taking anticoagulation (check INR, CBC)
    - Recurrent bruising without trauma (coagulation studies)
treatment:
  acute_phase:
    - RICE protocol (Rest, Ice, Compression, Elevation)
    - Rest - avoid activities that worsen pain for 48-72 hours
    - Ice - apply for 15-20 minutes every 2-3 hours for first 48-72 hours (reduces swelling and pain)
    - Compression - elastic bandage to reduce swelling (not too tight)
    - Elevation - keep injured area above heart level when possible
  pain_management:
    - NSAIDs - ibuprofen 400-600mg q6-8h or naproxen 500mg q12h
    - Acetaminophen 650-1000mg q6h if NSAIDs contraindicated
    - Avoid aspirin in acute phase (increases bleeding)
  rehabilitation_phase:
    - After 48-72 hours, transition from ice to heat (promotes healing)
    - Gentle range of motion exercises to prevent stiffness
    - Gradual return to activity as pain allows
    - Physical therapy if significant functional limitation
  special_considerations:
    - Anticoagulated patients
      - Hold anticoagulation if appropriate and safe (discuss with prescribing provider)
      - More aggressive monitoring for expanding hematoma
      - Consider reversal if life-threatening bleeding
    - Large hematomas
      - May require drainage if causing significant pain or functional impairment
      - Risk of infection if drained
      - Most resolve spontaneously over 2-4 weeks
clinical_pearls:
  - Ecchymosis follows gravity - bruising may appear distant from impact site
  - Color evolution predictable - red/purple (0-5 days), green (5-7 days), yellow (7-10 days), brown (10-14 days), then fades
  - Periorbital ecchymosis ("raccoon eyes") after head trauma suggests basilar skull fracture
  - Battle sign (mastoid ecchymosis) also suggests basilar skull fracture
  - Muscle contusions can cause myositis ossificans (heterotopic bone formation) if mobilized too aggressively early
  - Aggressive early stretching can worsen muscle contusion - gentle ROM only for first week
  - Quadriceps contusion (charley horse) can be severe - risk of compartment syndrome or myositis ossificans
  - Easy bruising without trauma warrants coagulation studies (von Willebrand, platelet dysfunction, factor deficiency)
  - Bruising in non-ambulatory children raises concern for non-accidental trauma
differentials:
  - Simple contusion (soft tissue)
  - Muscle contusion with hematoma
  - Hematoma requiring drainage
  - Compartment syndrome (emergency)
  - Underlying fracture
  - Coagulopathy (easy bruising pattern)
  - Non-accidental trauma (pediatrics)
trace: |
  28-year-old recreational soccer player sustained direct blow to right thigh during game. Immediate pain and difficulty continuing play. Evaluated 2 hours post-injury. Exam showed 8x6 cm area of tenderness over lateral thigh, mild swelling, no ecchymosis yet (too early), full but painful range of motion at hip and knee, normal neurovascular exam, able to bear weight with limp. No bony tenderness. X-ray not indicated based on mechanism and exam. Diagnosed with moderate quadriceps contusion. Prescribed ibuprofen 600mg q8h, instructed RICE protocol - rest from sports x 3-5 days, ice 20 minutes q2-3h for 48 hours, compression wrap, elevate when sitting. Gentle ROM exercises only (no aggressive stretching to avoid myositis ossificans). Return precautions given for signs of compartment syndrome (severe increasing pain, numbness, pale/cool leg). At 48 hours re-evaluated, large purple bruise visible, swelling improved, pain better. Transitioned to heat therapy, continue NSAIDs. At 7 days bruise turning green, minimal pain, full ROM. Cleared for light jogging. At 2 weeks bruise fading, no pain, full strength, cleared for return to full sports activity. No complications, complete resolution.
citations:
  - UpToDate - Sports Medicine and Trauma
  - American College of Sports Medicine Guidelines
  - Wheeless' Textbook of Orthopaedics
