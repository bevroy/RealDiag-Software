tree_id: TRAUMA-CONTUSION
name: Contusion
family: emergency
specialty: Emergency Medicine, Primary Care, Orthopedics
chief_complaint: Bruise, soft tissue injury
description: |
  Contusion is a blunt trauma injury causing bleeding into soft tissues without break in skin.
  Most are minor, but severe contusions can indicate underlying injury or compartment syndrome.
icd10: S00.93XA
snomed: "125667009"
presentations:
  - Ecchymosis (bruising) - purple/blue initially, then green/yellow
  - Swelling and tenderness at injury site
  - Pain with movement or pressure
  - Possible decreased range of motion
  - History of blunt trauma
urgency: Low
referrals:
  emergency:
    - Large expanding hematoma
    - Compartment syndrome signs (severe pain, tense swelling, neurovascular compromise)
  orthopedics:
    - Severe muscle contusion with functional impairment
    - Associated fracture
workup:
  - History of mechanism and timing of injury
  - Assess for underlying fracture - palpate for bony tenderness, crepitus, deformity
  - Check neurovascular status
  - X-ray if concern for fracture
  - Consider bleeding disorder workup if minimal trauma or recurrent easy bruising
treatment:
  acute_phase_first_48_hours:
    - RICE protocol - Rest, Ice, Compression, Elevation
    - Ice 20 minutes every 2-3 hours for first 48 hours
    - Compression wrap if extremity
    - Elevate above heart level
    - Avoid heat initially (increases bleeding)
  pain_management:
    - Acetaminophen 1000mg every 6 hours
    - NSAIDs - ibuprofen 400-600mg every 6 hours (caution - may increase bleeding)
  after_48_hours:
    - Continue elevation and compression as needed
    - Gentle active range of motion exercises
    - Heat may help after 48-72 hours
    - Gradual return to activity as tolerated
  large_hematomas:
    - Consider aspiration if large, tense, and causing significant pain or dysfunction (usually after 48 hours)
    - Surgical evacuation if compartment syndrome
clinical_pearls:
  - Most contusions resolve in 2-4 weeks
  - Color progression - red/purple (acute) to blue/green (days 5-7) to yellow (days 7-10) as hemoglobin breaks down
  - Ecchymosis may track distally with gravity
  - Severe contusions can lead to myositis ossificans (heterotopic bone formation)
  - Anticoagulated patients at higher risk for severe hematomas
  - Child abuse consideration if multiple bruises in various stages, unusual locations, or inconsistent history
differentials:
  - Simple contusion
  - Underlying fracture
  - Compartment syndrome
  - Large hematoma
  - Muscle strain/tear
  - Bleeding disorder
  - Non-accidental trauma (abuse)
trace:
  - 35-year-old fell and struck thigh on table edge. Large ecchymosis and swelling to lateral thigh. No bony tenderness, normal neurovascular exam. X-ray negative for fracture. Diagnose soft tissue contusion. RICE protocol. Ibuprofen 600mg TID. Bruising resolves over 3 weeks without complications.
citations:
  - UpToDate - Orthopedics and Sports Medicine
  - American Academy of Orthopaedic Surgeons
