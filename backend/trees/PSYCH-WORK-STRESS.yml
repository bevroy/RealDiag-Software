tree_id: PSYCH-WORK-STRESS
name: Work-Related Stress
family: psychiatry
specialty: Psychiatry/Occupational Medicine
icd10: Z56.6
snomed: 38003003
urgency: []
homeopathy: []
presentations:
  - Physical, emotional, or mental strain related to work environment or demands
  - Feeling overwhelmed by job responsibilities
  - Difficulty concentrating or making decisions at work
  - Irritability or frustration with colleagues/supervisors
  - Fatigue despite adequate sleep
  - Physical symptoms: headaches, muscle tension, GI symptoms
  - Sleep disturbance (difficulty falling asleep, ruminating about work)
  - Reduced job satisfaction and motivation
  - Increased absenteeism or presenteeism (at work but unproductive)
  - Common stressors: excessive workload, time pressure, lack of control, job insecurity, interpersonal conflicts, poor work-life balance
workup:
  - Comprehensive occupational history
  - Job description and responsibilities
  - Work hours and schedule (overtime, shift work, on-call)
  - Recent changes at work (new job, promotion, reorganization, layoffs)
  - Workplace relationships and conflicts
  - Job satisfaction and career goals
  - Identify specific work stressors
  - Quantitative demands (workload, time pressure)
  - Qualitative demands (emotional labor, complexity)
  - Job control and autonomy
  - Social support at work
  - Organizational factors (culture, leadership, fairness)
  - Work-life balance
  - Assess stress symptoms and severity
  - Perceived Stress Scale (PSS)
  - Depression Anxiety Stress Scales (DASS-21)
  - Maslach Burnout Inventory (if burnout suspected)
  - Impact on functioning
  - Work performance and productivity
  - Relationships (family, friends)
  - Physical health
  - Rule out psychiatric disorders that may require specific treatment
  - Major depressive disorder
  - Generalized anxiety disorder
  - Adjustment disorder (if work stressor is primary)
  - Panic disorder
  - PTSD (if traumatic workplace event)
  - Rule out medical conditions exacerbated by stress
  - Hypertension, cardiovascular disease
  - Gastrointestinal disorders (IBS, peptic ulcer)
  - Chronic pain conditions
  - Sleep disorders
  - Assess for burnout (distinct from general stress)
  - Emotional exhaustion
  - Depersonalization/cynicism
  - Reduced sense of personal accomplishment
treatment:
  - Individual-level interventions
  - Stress management education
  - Recognize stress signs and triggers
  - Develop healthy coping strategies
  - Cognitive Behavioral Therapy (CBT)
  - Challenge negative thoughts about work
  - Problem-solving skills
  - Time management and prioritization
  - Relaxation techniques
  - Progressive muscle relaxation
  - Deep breathing exercises
  - Mindfulness meditation
  - Mindfulness-Based Stress Reduction (MBSR) programs
  - Lifestyle modifications
  - Regular physical exercise (reduces stress hormones, improves mood)
  - Adequate sleep (7-9 hours)
  - Healthy diet
  - Limit caffeine and alcohol
  - Work-life balance strategies
  - Set boundaries between work and personal time
  - Take regular breaks during workday
  - Use vacation time
  - Engage in hobbies and social activities
  - Organizational/workplace interventions (if possible)
  - Discuss concerns with supervisor or HR
  - Request workload adjustment or redistribution
  - Clarify job expectations and role
  - Improve communication and conflict resolution
  - Flexible work arrangements (remote work, flexible hours)
  - Employee Assistance Program (EAP) referral
  - Pharmacotherapy (if underlying psychiatric disorder present)
  - SSRIs for depression or anxiety
  - Escitalopram 10-20 mg daily
  - Sertraline 50-150 mg daily
  - Short-term sedatives for severe insomnia (2-4 weeks maximum)
  - Not indicated for work stress alone without psychiatric disorder
  - Consider job change if chronic severe stress and other interventions fail
clinical_pearls:
  - "Work-related stress affects 40-50% of workers at some point - leading cause of occupational health problems"
  - "Chronic work stress increases risk of cardiovascular disease, diabetes, depression, and anxiety"
  - "Job strain model: high demands + low control = highest stress and health risks"
  - "Burnout distinct from stress - characterized by exhaustion, cynicism, and reduced efficacy"
  - "Early intervention prevents progression to depression, anxiety disorders, or burnout"
  - "Individual coping strategies AND organizational changes often needed for sustained improvement"
  - "Employee Assistance Programs (EAPs) underutilized but highly effective - free, confidential"
  - "Work-life balance protective factor - regular breaks, vacation use associated with better outcomes"
referrals:
  - Mental health therapist for CBT or stress management counseling
  - Employee Assistance Program (EAP) for workplace counseling
  - Psychiatry if major depression or anxiety disorder develops
  - Occupational medicine if physical health concerns
  - Human resources for workplace accommodations or conflict resolution
differentials:
  - Work-related stress (job-related stressors, symptoms improve when away from work)
  - Adjustment disorder with anxiety or depressed mood (if work stressor is primary, symptoms within 3 months)
  - Generalized anxiety disorder (chronic worry not limited to work)
  - Major depressive disorder (persistent symptoms not limited to work context)
  - Burnout (emotional exhaustion, depersonalization, reduced accomplishment)
  - PTSD (if traumatic workplace event occurred)
  - Medical conditions (thyroid disorder, anemia, sleep apnea)
  - Substance use (alcohol or drugs to cope with stress)
trace:
  source: National Institute for Occupational Safety and Health (NIOSH) Stress Guidelines, WHO Healthy Workplace Framework, American Psychological Association Work Stress Resources
