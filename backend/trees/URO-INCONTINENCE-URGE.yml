tree_id: URO-INCONTINENCE-URGE
name: Urinary Incontinence (Urge)
family: urology
specialty: Urology/Primary Care
icd10: N39.41
snomed: 373067005
urgency: []
homeopathy: []
presentations:
  - Involuntary urine leakage preceded by sudden strong urge to urinate
  - Urgency (sudden compelling need to urinate that is difficult to defer)
  - Frequency (greater than 8 voids in 24 hours)
  - Nocturia (waking 2 or more times at night to urinate)
  - Unable to reach toilet in time after feeling urge (urge precedes leak)
  - Leakage triggered by running water, cold weather, arriving home (key in lock)
  - Moderate to large volume leakage (vs small amounts in stress incontinence)
  - More common in elderly, often associated with overactive bladder syndrome
workup:
  - Clinical history and voiding diary
  - 3-day bladder diary: record time, volume, urgency, leakage episodes
  - Urge incontinence: urgency precedes leakage
  - Typically greater than 8 voids per day, greater than 2 at night
  - Assess symptom severity and impact on quality of life
  - Medication review (diuretics, caffeine, alcohol worsen symptoms)
  - Urinalysis
  - Rule out urinary tract infection (dysuria, pyuria, bacteriuria)
  - Rule out glycosuria (diabetes causes polyuria and frequency)
  - Rule out hematuria (bladder cancer can present with urgency)
  - Post-void residual (PVR) urine volume
  - Bladder scan or catheterization after voiding
  - "PVR less than 50 mL: normal"
  - "PVR greater than 200 mL: significant retention (suggests overflow, not urge incontinence)"
  - Physical examination
  - Abdominal exam (bladder distention, masses)
  - Neurological exam (assess for CNS or spinal cord lesions)
  - Pelvic exam in women (atrophy, prolapse)
  - Consider urodynamic testing if diagnosis unclear or before invasive treatment
  - Cystometry: detrusor overactivity (involuntary bladder contractions during filling)
  - Not required for initial diagnosis in straightforward cases
treatment:
  - Behavioral and lifestyle modifications FIRST-LINE
  - Bladder training (timed voiding with gradually increasing intervals)
  - Start voiding every 1-2 hours whether or not urge present
  - Suppress urge by relaxation, distraction, pelvic floor contraction
  - Gradually increase intervals by 15-30 minutes every 1-2 weeks
  - Goal: 3-4 hour voiding intervals
  - 60-75% improvement
  - Dietary modifications
  - Avoid bladder irritants: caffeine, alcohol, carbonated beverages, artificial sweeteners, acidic foods, spicy foods
  - Adequate but not excessive fluid intake (avoid restricting fluids)
  - Weight loss if overweight
  - Fluid management: avoid large fluid intake before bedtime
  - Pelvic floor muscle exercises (Kegels)
  - Strengthen pelvic floor and teach urge suppression technique
  - Contract pelvic floor when urge occurs to suppress detrusor contraction
  - 50-60% improvement
  - Pharmacotherapy (antimuscarinic/anticholinergic medications)
  - First-line medications
  - Oxybutynin immediate-release 2.5-5 mg 2-3 times daily or extended-release 5-15 mg daily
  - Tolterodine immediate-release 1-2 mg twice daily or extended-release 2-4 mg daily
  - Solifenacin 5-10 mg daily
  - Darifenacin 7.5-15 mg daily
  - Trospium 20 mg twice daily or extended-release 60 mg daily
  - Fesoterodine 4-8 mg daily
  - Mechanism: block muscarinic receptors in bladder, reduce detrusor contractions
  - Efficacy: 60-70% improvement in symptoms
  - Side effects: dry mouth (most common), constipation, blurred vision, cognitive impairment (especially elderly), urinary retention
  - Avoid in elderly with cognitive impairment (worsens dementia)
  - Beta-3 adrenergic agonist
  - Mirabegron 25-50 mg daily
  - Relaxes detrusor muscle via beta-3 receptors
  - Similar efficacy to antimuscarinics, fewer anticholinergic side effects
  - Side effects: hypertension, tachycardia, UTI
  - Avoid if uncontrolled hypertension
  - Combination therapy: antimuscarinic + mirabegron for refractory cases
  - Vaginal estrogen for postmenopausal women
  - Estrogen cream 0.5 g intravaginally 2-3 times weekly
  - Improves urethral and bladder mucosa
  - Third-line treatments (if behavioral + pharmacotherapy fail)
  - Onabotulinumtoxin A (Botox) injection into bladder
  - 100-200 units injected cystoscopically into detrusor muscle
  - 70-80% improvement, lasts 6-12 months
  - Side effects: urinary retention (5-10%), UTI, need for repeat injections
  - Sacral neuromodulation (InterStim)
  - Implanted device stimulates sacral nerves (S3)
  - Modulates bladder control pathways
  - 60-70% improvement
  - Requires surgical implantation
  - Percutaneous tibial nerve stimulation (PTNS)
  - Weekly 30-minute sessions of electrical stimulation of posterior tibial nerve
  - 60% improvement
  - Less invasive than sacral neuromodulation
clinical_pearls:
  - "Urge incontinence accounts for 40-50% of incontinence in women, most common type in elderly"
  - "Key feature: urgency precedes leakage (vs stress incontinence where leakage with exertion)"
  - "Bladder training alone improves symptoms in 60-75% - should be tried before medications"
  - "Antimuscarin

ics improve symptoms in 60-70% but high discontinuation due to side effects (30-40% stop within 6 months)"
  - "Avoid anticholinergics in elderly with cognitive impairment - worsen dementia"
  - "Mirabegron has fewer side effects than antimuscarinics but can elevate blood pressure"
  - "Botox bladder injections highly effective (70-80%) for refractory overactive bladder"
  - "Always rule out UTI before diagnosing urge incontinence"
referrals:
  - Urology for refractory symptoms despite behavioral therapy and medications
  - Urology for consideration of Botox injections or neuromodulation
  - Urogynecology for women with pelvic organ prolapse
differentials:
  - Urge urinary incontinence/overactive bladder (urgency precedes leakage, frequency, nocturia)
  - Stress urinary incontinence (leakage with exertion, no urgency)
  - Mixed incontinence (both stress and urge components)
  - Urinary tract infection (dysuria, pyuria, bacteriuria)
  - Interstitial cystitis/bladder pain syndrome (suprapubic pain, urgency, frequency)
  - Diabetes mellitus (polyuria, glycosuria)
  - Bladder cancer (hematuria, irritative symptoms)
  - Neurogenic bladder (spinal cord injury, MS, Parkinson's)
