tree_id: GI-UPPER-GI-BLEED
name: Upper Gastrointestinal Bleeding
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Hematemesis, melena, or coffee-ground emesis
description: Bleeding proximal to ligament of Treitz (esophagus, stomach, duodenum). Presents with hematemesis (vomiting blood), coffee-ground emesis, or melena (black tarry stools). Most common causes are peptic ulcer disease (60%), esophageal varices (14%), Mallory-Weiss tear (7%), and erosive esophagitis. Risk stratification using Glasgow-Blatchford score determines need for intervention. Hemodynamically unstable patients require resuscitation with blood products and emergent endoscopy. Proton pump inhibitor infusion for non-variceal bleeds. Variceal bleeds require octreotide, antibiotics, and endoscopic band ligation or sclerotherapy. Mortality 5-10% overall, higher in elderly and cirrhotic patients.
icd10: K92.2
urgency: emergent

workup:
  - Clinical presentation:
    - Hematemesis (vomiting bright red blood):
      - Indicates active brisk bleeding
      - Suggests source proximal to ligament of Treitz
      - Large volume suggests variceal or arterial source
    - Coffee-ground emesis (dark brown vomitus):
      - Blood partially digested by gastric acid
      - Suggests slower bleeding or time since bleeding
      - Still indicates upper GI source
    - Melena (black tarry foul-smelling stools):
      - Upper GI bleed most common cause (90%)
      - Requires at least 50-100 mL blood loss
      - Transit time 8-24 hours from upper GI tract
      - Can also occur from right colon or small bowel bleeding
    - Hematochezia (bright red blood per rectum):
      - Usually indicates lower GI source
      - But 10-15% of brisk upper GI bleeds present with hematochezia
      - Suggests massive upper GI bleed with rapid transit
    - Syncope or presyncope (indicates significant blood loss)
    - Dyspepsia or epigastric pain (suggests peptic ulcer)
    - Dysphagia or odynophagia (esophageal source)
  - Common etiologies:
    - Peptic ulcer disease (60% of upper GI bleeds):
      - Gastric or duodenal ulcer
      - Risk factors: NSAIDs, H. pylori, aspirin, steroids, smoking
      - Forrest classification guides endoscopic therapy
    - Esophageal varices (14%, mostly cirrhotics):
      - Portal hypertension from cirrhosis
      - High mortality (15-30%)
      - Often associated with other stigmata of liver disease
    - Mallory-Weiss tear (7%):
      - Mucosal tear at gastroesophageal junction
      - From forceful vomiting or retching
      - Usually self-limited, rarely requires intervention
    - Erosive esophagitis or gastritis (10-15%):
      - Often from GERD, NSAIDs, alcohol, stress
      - Usually mild bleeding
    - Dieulafoy lesion (1-2%):
      - Aberrant submucosal artery that erodes through mucosa
      - Small visible defect but can cause massive bleeding
      - Difficult to identify, often requires repeat endoscopy
    - Aortoenteric fistula (rare but life-threatening):
      - Communication between aorta and GI tract
      - Occurs in patients with prior aortic graft repair
      - Sentinel bleed followed by massive hemorrhage
      - Requires emergent surgery
    - Malignancy (gastric or esophageal cancer)
    - Vascular malformations (angiodysplasia, Dieulafoy)
  - Risk factors for bleeding:
    - NSAIDs or aspirin use (most common modifiable risk)
    - Anticoagulation (warfarin, DOACs, heparin)
    - Dual antiplatelet therapy (aspirin + clopidogrel)
    - H. pylori infection (increases PUD risk 3-6 fold)
    - Prior history of GI bleeding
    - Cirrhosis with portal hypertension
    - Critical illness or stress (stress gastritis in ICU patients)
    - Heavy alcohol use
    - Smoking
  - Initial assessment and resuscitation:
    - ABCs and vital signs (assess hemodynamic stability):
      - Tachycardia (HR over 100 suggests volume loss)
      - Hypotension (SBP under 100 suggests over 20% blood volume loss)
      - Orthostatic vitals (20 bpm increase or 10 mmHg drop suggests hypovolemia)
      - Altered mental status (severe shock)
    - Establish large-bore IV access (two 18-gauge or larger)
    - Hemodynamic resuscitation:
      - Crystalloid bolus (1-2 liters NS or LR rapidly)
      - Type and cross-match for 4-6 units PRBCs
      - Transfuse PRBCs if Hgb under 7 g/dL (restrictive strategy)
      - Transfuse at Hgb under 8-9 if active bleeding or cardiovascular disease
      - Massive transfusion protocol if ongoing hemorrhage (1:1:1 ratio PRBC:FFP:platelets)
      - Platelets if platelet count under 50k or active bleeding
      - FFP if INR over 1.5-2.0 or on warfarin
      - Consider reversal agents (vitamin K, PCC for warfarin, idarucizumab for dabigatran)
    - Airway protection:
      - Intubate if massive hematemesis, altered mental status, or unable to protect airway
      - Risk of aspiration with active vomiting
  - Physical examination:
    - Vital signs (tachycardia, hypotension, orthostatic changes)
    - Assess for stigmata of chronic liver disease (cirrhosis and varices):
      - Jaundice, spider angiomas, palmar erythema
      - Gynecomastia, testicular atrophy
      - Ascites, splenomegaly, caput medusae
    - Abdominal exam:
      - Epigastric tenderness (peptic ulcer)
      - Hepatosplenomegaly (cirrhosis, portal hypertension)
      - Ascites (cirrhosis)
    - Rectal exam (assess stool color, confirm melena or hematochezia)
    - Skin (pallor, diaphoresis, petechiae or ecchymoses)
  - Laboratory evaluation:
    - CBC:
      - Hemoglobin and hematocrit (may be normal initially before equilibration)
      - Repeat every 4-6 hours to assess ongoing bleeding
      - Platelets (thrombocytopenia increases bleeding risk)
    - Type and cross-match (4-6 units PRBCs)
    - Coagulation studies:
      - PT/INR (assess for coagulopathy or warfarin effect)
      - aPTT (heparin or intrinsic pathway defects)
    - CMP:
      - BUN and creatinine (BUN:Cr ratio over 30 suggests upper GI bleed)
      - Liver function tests (assess for cirrhosis)
    - Lactate (elevated in shock or tissue hypoperfusion)
  - Risk stratification (guides management):
    - Glasgow-Blatchford Score (GBS) - predicts need for intervention:
      - BUN, hemoglobin, SBP, HR, melena, syncope, liver disease, heart failure
      - Score 0-1: Very low risk, consider discharge with outpatient endoscopy
      - Score 2-5: Low risk, admit for observation and early endoscopy
      - Score 6 or higher: High risk, requires resuscitation and urgent endoscopy
    - Rockall Score (predicts mortality, calculated post-endoscopy):
      - Age, shock, comorbidities, endoscopic diagnosis, stigmata of recent hemorrhage
      - Score over 5 associated with high mortality
  - Nasogastric tube placement (controversial):
    - Can confirm upper GI source if blood or coffee-grounds aspirated
    - Clear aspirate does NOT exclude upper GI bleed (25% false negative)
    - May help clear stomach before endoscopy
    - Not routinely required, may cause patient discomfort
    - Avoid in suspected variceal bleeding (can worsen bleeding)

treatment:
  - Pharmacologic management:
    - Proton pump inhibitor (PPI) therapy for non-variceal bleeds:
      - High-dose IV PPI bolus then continuous infusion:
        - Pantoprazole or esomeprazole 80 mg IV bolus, then 8 mg/hr infusion x 72 hours
        - Reduces rebleeding and need for surgery in high-risk ulcers
        - Start immediately, do not wait for endoscopy
      - Transition to high-dose oral PPI BID after 72 hours, then daily
      - Continue PPI for 4-8 weeks to allow ulcer healing
    - H2 receptor antagonists (famotidine, ranitidine):
      - Inferior to PPIs for acute bleeding
      - May use for maintenance if PPI not tolerated
    - Octreotide for variceal bleeding (vasoconstriction of splanchnic circulation):
      - 50 mcg IV bolus, then 50 mcg/hr continuous infusion
      - Start immediately if suspected varices (cirrhosis, stigmata of liver disease)
      - Continue for 2-5 days
      - Reduces rebleeding and mortality in variceal bleeds
    - Antibiotics for variceal bleeding:
      - Ceftriaxone 1-2 g IV daily (preferred, covers SBP prophylaxis)
      - Or norfloxacin 400 mg PO BID
      - Reduces bacterial infections and mortality in cirrhotic patients
      - Start immediately and continue for 7 days
    - Erythromycin (prokinetic to clear stomach before endoscopy):
      - 250 mg IV 30-60 minutes before endoscopy
      - Improves visualization by promoting gastric emptying
      - Optional, not routinely used
  - Endoscopy (diagnostic and therapeutic):
    - Timing:
      - Urgent endoscopy (within 12 hours) for high-risk patients:
        - Hemodynamic instability despite resuscitation
        - Active hematemesis
        - Suspected variceal bleeding
        - High Glasgow-Blatchford score (over 12)
      - Early endoscopy (within 24 hours) for most patients
      - Very low-risk patients (GBS 0-1) can have outpatient endoscopy
    - Endoscopic findings and interventions:
      - Peptic ulcer with high-risk stigmata (Forrest classification):
        - Forrest Ia (active arterial spurting): Endoscopic hemostasis required
        - Forrest Ib (active oozing): Endoscopic hemostasis required
        - Forrest IIa (visible vessel): Endoscopic hemostasis required
        - Forrest IIb (adherent clot): Consider endoscopic hemostasis
        - Forrest IIc (flat pigmented spot): Low rebleed risk, no intervention
        - Forrest III (clean-based ulcer): Very low risk, no intervention
      - Endoscopic hemostasis techniques:
        - Epinephrine injection (1:10,000 dilution)
        - Thermal coagulation (bipolar or heater probe)
        - Hemoclips
        - Combination therapy preferred (epinephrine + thermal or clip)
      - Variceal bleeding:
        - Esophageal varices: Band ligation preferred over sclerotherapy
        - Gastric varices: Cyanoacrylate glue injection
        - Balloon tamponade (Sengstaken-Blakemore or Minnesota tube) if uncontrolled bleeding as bridge to TIPS
  - Interventional radiology (if endoscopic therapy fails):
    - Angiography with embolization of bleeding vessel
    - TIPS (transjugular intrahepatic portosystemic shunt) for refractory variceal bleeding
  - Surgery (last resort if endoscopic and IR therapies fail):
    - Oversewing of bleeding ulcer
    - Partial gastrectomy for refractory ulcer bleeding
    - High mortality (10-30%) in emergency setting
  - Management of underlying causes:
    - H. pylori eradication if positive (triple or quadruple therapy):
      - Reduces ulcer recurrence from 60% to under 5%
      - Test all patients with PUD for H. pylori
    - Discontinue NSAIDs, aspirin if possible
    - If antiplatelet needed for cardiovascular disease:
      - Resume aspirin 3-5 days after hemostasis achieved
      - Add PPI for gastroprotection
    - Anticoagulation management:
      - Hold initially to achieve hemostasis
      - Resume when bleeding controlled (typically 1-7 days depending on indication)
      - Higher thrombotic risk (mechanical valve, recent stent) resume earlier
    - Secondary prophylaxis for variceal bleeding:
      - Non-selective beta blocker (propranolol or nadolol) to reduce portal pressures
      - Endoscopic variceal ligation every 2-4 weeks until varices obliterated
      - TIPS if recurrent bleeding despite medical and endoscopic therapy
  - Disposition and monitoring:
    - ICU admission if:
      - Hemodynamic instability or massive hemorrhage
      - Active bleeding requiring massive transfusion
      - Variceal bleeding
      - Need for intubation or mechanical ventilation
      - Multiple comorbidities or high Rockall score
    - Floor admission with telemetry for most patients
    - Serial hemoglobin checks every 4-6 hours initially
    - Nil per os (NPO) until endoscopy performed
    - Advance diet after successful endoscopic therapy

clinical_pearls:
  - BUN:Cr ratio over 30 suggests upper GI bleed (blood in GI tract increases BUN absorption)
  - Glasgow-Blatchford Score 0-1 predicts very low risk - consider discharge with outpatient endoscopy
  - High-dose PPI infusion (80 mg bolus then 8 mg/hr) reduces rebleeding in high-risk ulcers
  - Octreotide and antibiotics (ceftriaxone) are first-line for suspected variceal bleeding
  - Endoscopy within 12 hours for high-risk patients (hemodynamic instability, variceal bleed)
  - Combination endoscopic therapy (epinephrine + thermal/clip) superior to monotherapy
  - H. pylori eradication reduces ulcer recurrence from 60% to under 5%
  - Transfuse to Hgb 7 g/dL (restrictive strategy) unless active bleeding or cardiovascular disease
  - Forrest Ia, Ib, IIa ulcers have high rebleed risk and require endoscopic hemostasis
  - Aortoenteric fistula is rare but life-threatening - suspect in patients with prior aortic surgery
  - Hematochezia can be from massive upper GI bleed (10-15% of cases) - still requires upper endoscopy
  - TIPS is definitive therapy for refractory variceal bleeding

presentations:
  - Hematemesis
  - Coffee-ground emesis
  - Melena
  - Hematochezia (if massive)
  - Syncope or presyncope
  - Lightheadedness
  - Dyspnea
  - Chest pain (if anemic)
  - Tachycardia
  - Hypotension
  - Pallor
  - Epigastric pain
  - Abdominal distension

