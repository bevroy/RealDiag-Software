tree_id: TOX-TRICYCLIC-ANTIDEPRESSANT
name: Tricyclic Antidepressant (TCA) Overdose
family: Toxicology
specialty: Toxicology
icd10:
- T43.011A
- T43.012A
snomed:
- '292044008'
urgency: medium
description: Comprehensive evaluation and management of Tricyclic Antidepressant (TCA)
  Overdose
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Anticholinergic toxidrome: Dry mouth, mydriasis (dilated pupils), urinary retention,
  decreased bowel sounds, hyperthermia'
- 'CNS: Altered mental status, agitation → sedation → seizures → coma'
- 'Cardiac toxicity (MOST DANGEROUS): Wide QRS (>100ms), prolonged QT, ventricular
  arrhythmias (VT, VF), hypotension'
- 'ECG findings: QRS >100ms, terminal R wave in aVR >3mm, rightward QRS axis'
- Seizures (10-20%, often precede cardiac arrest)
- 'Rapid deterioration: Can go from awake to arrest in minutes'
workup: []
treatment:
- 'Guideline-based treatment options for Tricyclic Antidepressant (TCA) Overdose include:'
- 'Immediate: Continuous cardiac monitoring, IV access, 12-lead ECG (AAPCC 2023)'
- 'Sodium bicarbonate: 1-2 mEq/kg (1-2 amps) IV bolus if QRS >100ms or arrhythmias,
  repeat until QRS <100ms (AAPCC 2023)'
- 'Target serum pH 7.50-7.55: Start NaHCO3 infusion (3 amps in 1L D5W at 150-200 mL/hr)
  (AAPCC 2023)'
- 'Seizures: Benzodiazepines, avoid phenytoin (AAPCC 2023)'
- 'Disposition: ICU admission, continuous telemetry for 24hr after QRS normalizes,
  psychiatry consult if intentional (AAPCC 2023)'
clinical_pearls:
- QRS >100ms = HIGH RISK for arrhythmias and seizures, requires sodium bicarbonate
- Terminal R wave in aVR >3mm = specific for TCA toxicity
- 'Sodium bicarbonate = FIRST-LINE for cardiac toxicity: Give for QRS >100ms or arrhythmias'
- 'NaHCO3 mechanism: Overcomes sodium channel blockade (alkalinization + sodium loading)'
- 'Avoid Class Ia/Ic antiarrhythmics: Worsen sodium channel blockade (procainamide,
  quinidine)'
- 'Seizures: Benzodiazepines first-line, avoid phenytoin (also blocks sodium channels)'
referrals:
  emergency:
    - Altered mental status from toxin
    - Severe poisoning
    - Drug overdose with respiratory depression
    - Serotonin syndrome
  urgent:
    - Toxic ingestion without symptoms
    - Suspected toxic exposure
    - Drug overdose stable
  routine:
    - Substance use disorder treatment
    - Chronic exposure evaluation
    - Lead screening
differentials:
  - Anticholinergic toxicity
  - Sodium channel blocker toxicity
  - Septic shock
  - Cardiogenic shock
trace:
  source: American College of Medical Toxicology (ACMT) Guidelines, American Association
    of Poison Control Centers (AAPCC)
