tree_id: ENDO-ACROMEGALY
name: Acromegaly
family: Endocrinology
specialty: Endocrinology
icd10:
- E22.0
snomed:
- '74107003'
urgency: medium
description: Comprehensive evaluation and management of Acromegaly
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- enlarged hands, feet, facial features
- coarse facial features, prognathism
- headaches, visual field defects
- elevated IGF-1
- pituitary adenoma
workup:
- IGF-1 (elevated for age/sex) - initial screening test
- 'Oral glucose tolerance test (OGTT): GH should suppress to <1 ng/mL after glucose
  load (fails to suppress in acromegaly)'
- Pituitary MRI with contrast to visualize adenoma (macroadenoma >1cm in 75%)
- Formal visual field testing if macroadenoma (assess optic chiasm compression)
- 'Screen other pituitary hormones: Prolactin (co-secretion in 25%), TSH, LH/FSH,
  cortisol'
treatment:
- 'Guideline-based treatment options for Acromegaly include:'
- 'Transsphenoidal surgery (first-line): 60-70% cure if microadenoma, 40-50% if macroadenoma
  (ADA 2024)'
- 'Medical therapy if surgery incomplete: Somatostatin analogs (octreotide LAR 20-30mg
  IM monthly or lanreotide) (ADA 2024)'
- GH receptor antagonist (pegvisomant 10-30mg SQ daily) if somatostatin analogs fail
  - normalizes IGF-1 (ADA 2024)
- Radiation therapy for residual tumor after surgery + medical therapy (ADA 2024)
- 'Screen for complications: OGTT, echocardiogram, sleep study, colonoscopy (ADA 2024)'
clinical_pearls:
- Growth hormone (GH) excess from pituitary adenoma (99%) - slow progression, diagnosis
  delayed 7-10 years
- 'Complications: Cardiomyopathy (60%), hypertension (40%), diabetes (25%), sleep
  apnea (60%), colon polyps (30%)'
- 'Macroadenoma with mass effect: Bitemporal hemianopsia, headaches, hypopituitarism'
- 'IGF-1 screening: More reliable than GH (GH is pulsatile, IGF-1 reflects integrated
  GH secretion)'
- 'Compare old photos: Ring size increase, jaw growth, brow prominence help establish
  diagnosis'
referrals:
- Endocrinology for diagnosis confirmation and medical management
- Neurosurgery (pituitary surgeon, high-volume center) for transsphenoidal resection
- Ophthalmology if visual field defects present
differentials: []
trace:
