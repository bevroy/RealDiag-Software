tree_id: NEPHRO-GOODPASTURE-SYNDROME
name: Goodpasture Syndrome (Anti-GBM Disease)
family: Nephrology
specialty: Nephrology
chief_complaint: Hemoptysis, acute kidney injury, dyspnea
description: Rapidly progressive glomerulonephritis with pulmonary hemorrhage caused by anti-glomerular basement membrane antibodies
icd10: M31.0
snomed: 50581000
presentations:
  - Hemoptysis (pulmonary hemorrhage)
  - Dyspnea, cough
  - Hematuria, proteinuria
  - Rapidly progressive glomerulonephritis
  - Acute kidney injury
  - Young males, smokers
urgency: emergency
referrals:
  emergency:
    - AKI with K>6.5
    - Severe acidosis
    - Uremia needing dialysis
  urgent:
    - Rapidly progressive GN
    - AKI rising Cr
    - Nephrotic syndrome
  routine:
    - CKD management
    - Proteinuria
    - Stone prevention

workup:
  - Clinical presentation - classic pulmonary-renal syndrome
  - Hemoptysis (coughing up blood) - 90% of cases
  - Dyspnea, cough, chest pain
  - Acute kidney injury with rapidly rising creatinine
  - Hematuria (gross or microscopic), proteinuria
  - Constitutional symptoms - fatigue, weight loss, fever
  - Risk factors - smoking (triggers pulmonary hemorrhage), recent respiratory infection, hydrocarbon exposure
  - Physical examination
  - Tachypnea, crackles on lung auscultation (pulmonary hemorrhage)
  - Hypertension, edema (renal failure)
  - Pallor (anemia from blood loss)
  - Laboratory studies
  - Complete blood count - anemia (from pulmonary and renal blood loss)
  - Basic metabolic panel - elevated creatinine and BUN (acute kidney injury)
  - Urinalysis - hematuria, RBC casts, proteinuria (1-3+ typically non-nephrotic)
  - Anti-GBM antibodies (ELISA) - highly specific (greater than 95%), diagnostic
  - ANCA testing - p-ANCA/MPO positive in 10-30% (dual-positive disease, worse prognosis)
  - Complement levels (C3, C4) - normal (distinguishes from lupus, cryoglobulinemia)
  - Arterial blood gas - hypoxemia
  - Chest X-ray - bilateral patchy alveolar infiltrates (pulmonary hemorrhage)
  - CT chest - ground-glass opacities, consolidation
  - Renal ultrasound - normal-sized kidneys (distinguishes from chronic kidney disease)
  - Kidney biopsy - gold standard for diagnosis
  - Light microscopy - crescentic glomerulonephritis (greater than 50% glomeruli with crescents)
  - Immunofluorescence - linear IgG staining along glomerular basement membrane (pathognomonic)
  - Electron microscopy - no immune complex deposits
  - Pulmonary function testing - elevated DLCO (due to hemorrhage into alveoli)
treatment:
  - Medical emergency requiring immediate aggressive treatment
  - Triple therapy - plasmapheresis plus corticosteroids plus cyclophosphamide
  - Plasmapheresis (plasma exchange) - removes circulating anti-GBM antibodies
  - Daily or every other day for 14 days (until antibodies undetectable)
  - Each session exchanges 4 liters plasma with albumin or FFP replacement
  - CRITICAL for preserving renal function and stopping pulmonary hemorrhage
  - High-dose corticosteroids
  - Methylprednisolone 7-15 mg/kg IV (500-1000 mg) daily for 3 days (pulse therapy)
  - Then prednisone 1 mg/kg daily (60-80 mg) PO for 4-6 weeks
  - Gradual taper over 6-12 months
  - Cyclophosphamide (alkylating agent) - prevents new antibody production
  - 2 mg/kg/day PO (100-200 mg daily) for 2-3 months
  - OR pulse IV cyclophosphamide 0.5-1 g/m2 monthly for 6 months
  - Monitor CBC weekly (risk of leukopenia, infections)
  - Rituximab (anti-CD20) - alternative for refractory disease or cyclophosphamide intolerance
  - 375 mg/m2 IV weekly for 4 weeks or 1000 mg at 0 and 2 weeks
  - Supportive care
  - Dialysis if severe renal failure (creatinine greater than 5-6 mg/dL, uremia, hyperkalemia)
  - Mechanical ventilation if severe pulmonary hemorrhage with respiratory failure
  - Transfusion for severe anemia
  - Smoking cessation absolutely critical (smoking triggers pulmonary hemorrhage)
  - Avoid nephrotoxic drugs
  - Monitor for complications
  - Infections (opportunistic due to immunosuppression) - PCP prophylaxis (TMP-SMX), antifungal prophylaxis
  - Hemorrhagic cystitis from cyclophosphamide - mesna, adequate hydration
  - Long-term management
  - Transition from cyclophosphamide to azathioprine 2 mg/kg/day after 2-3 months for maintenance (12-18 months total)
  - Monitor anti-GBM antibodies every 3 months (recurrence rare but possible if antibodies return)
  - Renal transplantation if end-stage renal disease
  - Wait until anti-GBM antibodies undetectable for 6-12 months (recurrence in graft if transplant too early)
clinical_pearls:
  - Rare disease, incidence 0.5-1 per million, bimodal age distribution (20-30 years and 60-70 years)
  - Fulminant course - without treatment, 90% mortality or end-stage renal disease within weeks
  - Outcome depends on renal function at presentation
  - Creatinine less than 5.7 mg/dL - 90% renal recovery with treatment
  - Creatinine greater than 5.7 mg/dL or dialysis-dependent - less than 10% renal recovery
  - Crescents on biopsy greater than 85% - poor renal prognosis
  - Pulmonary hemorrhage can be life-threatening (more acute risk than renal failure)
  - Smoking major risk factor - 80% of patients with pulmonary hemorrhage are smokers
  - Dual-positive (anti-GBM plus ANCA) worse prognosis, higher relapse rate
  - Linear IgG on immunofluorescence is pathognomonic - diagnostic
  - Recurrence rare after successful treatment (5% if antibodies remain undetectable)
  - Early aggressive treatment critical - delays result in irreversible kidney damage
differentials:
  - ANCA-associated vasculitis (granulomatosis with polyangiitis, microscopic polyangiitis) - ANCA positive, no linear IgG on biopsy
  - Systemic lupus erythematosus (low complement, positive anti-dsDNA, granular immune deposits)
  - Diffuse alveolar hemorrhage from other causes (cocaine, mitral stenosis, anticoagulation)
  - IgA nephropathy (mesangial IgA deposits, usually less acute)
  - Post-infectious glomerulonephritis (follows infection, low C3, granular deposits)
  - Hemolytic uremic syndrome (thrombocytopenia, schistocytes, no pulmonary hemorrhage)
trace:
  - 28-year-old man presents to ED with 3-day history of coughing up blood and shortness of breath
  - Hemoptysis increasing in volume, now several tablespoons with each episode
  - Dyspnea at rest, worse with exertion
  - Dark urine for past 2 days
  - Fatigue, loss of appetite, no fever
  - Recent upper respiratory infection 2 weeks ago
  - Smoker 1 pack per day for 10 years
  - Past medical history - none
  - Medications - none
  - Physical exam - appears acutely ill, tachypneic
  - Vitals - temp 37.2C, HR 105, BP 155/95, RR 28, SpO2 89% on room air
  - Lungs - diffuse bilateral crackles
  - Cardiovascular - tachycardia, no murmurs
  - Extremities - trace pedal edema bilaterally
  - Labs - WBC 13.5 K/uL, Hemoglobin 8.5 g/dL (anemia), platelets 385 K/uL
  - Creatinine 5.8 mg/dL (baseline 1.0 mg/dL 6 months ago - acute kidney injury)
  - BUN 68 mg/dL, potassium 5.8 mEq/L (hyperkalemia)
  - Urinalysis - large blood 3+, protein 2+, 100+ RBCs per HPF, RBC casts present
  - ABG - pH 7.32, pCO2 38, pO2 62 (hypoxemia, metabolic acidosis)
  - Chest X-ray - bilateral patchy alveolar infiltrates
  - Anti-GBM antibody - strongly positive 156 units (normal less than 20) - DIAGNOSTIC
  - ANCA panel - MPO-ANCA positive (dual-positive disease)
  - ANA negative, complement C3 and C4 normal
  - Diagnosis - Goodpasture syndrome (anti-GBM disease) with pulmonary-renal syndrome, severe acute kidney injury
  - MEDICAL EMERGENCY - immediate treatment initiated
  - Admitted to ICU
  - Oxygen supplementation 4 L nasal cannula, maintaining SpO2 greater than 92%
  - IV access, continuous cardiac monitoring
  - Nephrology and pulmonology consultations urgent
  - Triple therapy initiated immediately
  - Plasmapheresis - started same day, daily sessions scheduled for 14 days
  - First session exchanged 4 liters plasma
  - Methylprednisolone 1000 mg IV daily for 3 days (pulse steroids)
  - Cyclophosphamide 150 mg daily PO (2 mg/kg)
  - Dialysis catheter placed given severe kidney injury and hyperkalemia
  - Hemodialysis initiated for uremia and hyperkalemia
  - Supportive care
  - TMP-SMX DS three times weekly for PCP prophylaxis
  - Pantoprazole 40 mg daily for GI protection
  - Strict smoking cessation counseling
  - Hospital course - Day 1-3: Pulse methylprednisolone, daily plasmapheresis, intermittent hemodialysis
  - Hemoptysis decreased significantly by Day 3
  - Day 4: Transitioned to prednisone 60 mg daily PO
  - Day 5-14: Continued daily plasmapheresis (total 14 sessions)
  - Hemoptysis resolved by Day 7
  - Dyspnea improved, oxygen weaned off by Day 10
  - Urine output increased starting Day 8
  - Day 14: Repeat anti-GBM antibody - undetectable (plasmapheresis effective)
  - Creatinine improved to 3.2 mg/dL (still elevated but improving)
  - No longer requiring dialysis
  - Kidney biopsy performed Day 10 (delayed due to bleeding risk)
  - Pathology - crescentic glomerulonephritis 60% of glomeruli, linear IgG staining on immunofluorescence (confirms diagnosis)
  - Day 16: Discharged home, creatinine 2.8 mg/dL
  - Prednisone 60 mg daily, cyclophosphamide 150 mg daily
  - Close nephrology follow-up
  - Outpatient monitoring - CBC weekly (monitor for cyclophosphamide leukopenia)
  - 4-week follow-up - creatinine 2.1 mg/dL (continued improvement)
  - Anti-GBM antibodies remain undetectable
  - No hemoptysis recurrence
  - Continue immunosuppression
  - 3-month follow-up - creatinine stabilized at 1.8 mg/dL (GFR 45 mL/min - CKD stage 3a)
  - Transitioned from cyclophosphamide to azathioprine 150 mg daily for maintenance
  - Begin prednisone taper
  - 1-year follow-up - creatinine stable 1.9 mg/dL, off prednisone, on azathioprine alone
  - Anti-GBM antibodies remain undetectable
  - No pulmonary symptoms, quit smoking successfully
  - Outcome - Partial renal recovery with stabilization CKD stage 3a, complete pulmonary recovery, in remission

citations:
  - KDIGO (Kidney Disease: Improving Global Outcomes) Guidelines
  - NKF (National Kidney Foundation) Clinical Practice Guidelines
  - UpToDate - Nephrology
