tree_id: ORTHO-WRIST-SPRAIN
name: Wrist Sprain
family: orthopedics
specialty: Orthopedics
icd10: S63.509A
snomed: 263204007
urgency: []
homeopathy: []
presentations:
  - Wrist pain after fall on outstretched hand (FOOSH injury)
  - Swelling and tenderness over wrist
  - Pain with wrist movement, especially extension
  - Difficulty bearing weight on hand or gripping
  - Bruising may develop after 24-48 hours
  - Limited range of motion due to pain
  - May have clicking or popping sensation
  - Mild to moderate sprains: able to move wrist, some function preserved
workup:
  - Clinical assessment
  - Mechanism of injury (fall on outstretched hand most common)
  - Assess for anatomic snuffbox tenderness (scaphoid fracture)
  - Palpate distal radius, ulna, carpal bones for tenderness
  - Assess range of motion (flexion, extension, radial/ulnar deviation)
  - Test grip strength
  - Neurovascular exam (radial pulse, sensation in median/ulnar/radial nerve distributions)
  - Imaging
  - Wrist X-rays (PA, lateral, oblique) to rule out fracture
  - Scaphoid views if snuffbox tenderness
  - Ottawa wrist rules guide need for X-rays
  - X-ray indicated if: age >55, unable to move wrist through ROM, or bone tenderness at specific sites
  - MRI or CT if occult fracture suspected (especially scaphoid)
  - Ultrasound can assess ligament injury
  - Grading wrist sprains
  - Grade 1 (mild): ligament stretch, no tear, minimal swelling, full ROM
  - Grade 2 (moderate): partial ligament tear, moderate swelling, decreased ROM, some instability
  - Grade 3 (severe): complete ligament tear, significant swelling, marked instability
treatment:
  - Acute management (first 48-72 hours) - RICE protocol
  - Rest: avoid aggravating activities
  - Ice: 15-20 minutes every 2-3 hours
  - Compression: elastic bandage wrap
  - Elevation: above heart level to reduce swelling
  - Grade 1 (mild) sprain
  - Buddy taping or elastic wrap for comfort
  - Early range of motion exercises (24-48 hours)
  - Return to activities as tolerated (1-2 weeks)
  - Grade 2 (moderate) sprain
  - Wrist splint or brace for 2-4 weeks
  - Removable for gentle ROM exercises after first week
  - Physical therapy for strengthening when pain-free
  - Return to activities in 4-6 weeks
  - Grade 3 (severe) sprain
  - Immobilization in splint or cast for 4-6 weeks
  - May require surgical ligament repair if significant instability
  - Physical therapy for 6-12 weeks after immobilization
  - Return to full activities 3-6 months
  - Pain management
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Acetaminophen 1000 mg TID if NSAIDs contraindicated
  - Rehabilitation
  - Early ROM exercises when pain allows (flexion, extension, deviations)
  - Progressive strengthening (grip, wrist curls, resistance exercises)
  - Proprioception training
  - Gradual return to sport/activity
clinical_pearls:
  - "FOOSH (fall on outstretched hand) most common mechanism"
  - "Always assess anatomic snuffbox - tenderness suggests scaphoid fracture (X-ray may be negative initially)"
  - "Scaphoid fractures often missed initially - re-image at 2 weeks if persistent snuffbox tenderness"
  - "Ottawa wrist rules reduce unnecessary X-rays by 30% without missing fractures"
  - "Scapholunate ligament injury most common wrist ligament injury"
  - "Grade 1-2 sprains usually heal well with conservative treatment"
  - "Persistent pain >6 weeks may indicate occult fracture or ligament tear - needs MRI"
  - "TFCC (triangular fibrocartilage complex) tears common - ulnar-sided wrist pain, clicking"
referrals:
  - Hand surgery or orthopedics if Grade 3 sprain with instability
  - Immediate orthopedic referral if suspected scaphoid fracture (high risk nonunion)
  - Hand surgery if persistent pain/instability >6-8 weeks despite conservative treatment
  - Physical therapy for ROM and strengthening exercises
differentials:
  - Wrist sprain (ligament injury, normal X-rays)
  - Scaphoid fracture (snuffbox tenderness, FOOSH mechanism, may have negative initial X-ray)
  - Distal radius fracture (Colles, Smith fractures - visible on X-ray)
  - Ulnar styloid fracture (ulnar-sided tenderness)
  - TFCC tear (ulnar-sided pain, clicking with rotation)
  - Scapholunate ligament tear (dorsal wrist pain, gap between scaphoid and lunate on X-ray)
  - Carpal bone fracture (hamate, triquetrum, lunate)
  - Tendinitis (de Quervain, flexor carpi radialis)
