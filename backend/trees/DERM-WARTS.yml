tree_id: DERM-WARTS
name: Verruca (Warts)
family: Dermatology
specialty: Dermatology/Primary Care
chief_complaint: Painless growths on hands or feet
description: Benign epithelial proliferations caused by human papillomavirus (HPV). Common warts (verruca vulgaris) on hands, plantar warts on feet. Many treatment options, but spontaneous resolution common especially in children. Resistant to treatment, often require multiple modalities.
icd10: B07.9
snomed: 240217005
presentations:
  - Hyperkeratotic papules or plaques
  - Rough, irregular surface
  - Black dots (thrombosed capillaries)
  - Plantar warts on weight-bearing surfaces (painful)
  - Common warts on hands, fingers
  - Flat warts on face (smooth, flat-topped)
  - Filiform warts (finger-like projections)
urgency: routine
referrals:
  emergency:
    - None typically
  urgent:
    - Rapidly growing lesions (rule out malignancy)
    - Extensive warts in immunocompromised
  routine:
    - Refractory to multiple treatments
    - Warts in sensitive areas (face, genitals)

workup:
  - Clinical diagnosis based on appearance and location
  - Types of warts
  - Common warts (verruca vulgaris)
  - Firm, raised, hyperkeratotic papules with rough surface
  - 1-10 mm diameter
  - Dome-shaped or cauliflower-like
  - Thrombosed capillaries appear as black dots
  - Most common on hands (dorsal), fingers (periungual), knees
  - HPV types 1, 2, 4, 27, 57
  - Plantar warts (verruca plantaris)
  - On weight-bearing surfaces of feet (heels, metatarsal heads, toes)
  - Tender or painful with pressure (walking, standing)
  - May appear flat due to pressure, with central black dots
  - Hyperkeratotic, may be mistaken for callus
  - Distinguish from callus - paring reveals pinpoint bleeding (thrombosed capillaries), callus does not bleed
  - Interrupt dermatoglyphics (skin lines), callus preserves skin lines
  - May be solitary or mosaic pattern (clustered)
  - Flat warts (verruca plana)
  - Small (2-4 mm), smooth, flat-topped papules
  - Skin-colored, pink, or light brown
  - Most common on face, arms, dorsal hands
  - May be numerous (dozens to hundreds)
  - HPV types 3, 10, 28, 49
  - Filiform warts
  - Finger-like projections
  - Most common on face (eyelids, lips, neck)
  - Periungual warts
  - Around nail folds
  - May cause nail dystrophy
  - Difficult to treat
  - Physical examination
  - Inspect lesion - hyperkeratotic, rough surface, black dots
  - Paring with scalpel blade - plantar warts bleed with paring (pinpoint bleeding from thrombosed capillaries), calluses do not bleed
  - Dermatoglyphics (skin lines) - warts disrupt lines, calluses and corns preserve lines
  - Tenderness - plantar warts tender with direct pressure, not with lateral pinching (vs Morton's neuroma tender with lateral pinching)
  - Check for additional warts - multiple sites common
  - Laboratory/biopsy - rarely needed
  - Usually clinical diagnosis
  - Biopsy if atypical appearance, refractory to treatment, or concern for malignancy
  - HPV typing not routinely done for cutaneous warts
  - Natural history
  - Spontaneous resolution common - 65% resolve within 2 years without treatment, 90% within 5 years
  - Higher resolution rate in children than adults
  - Recurrence common even after treatment (30-50%)
  - Immunocompromised patients - more extensive, resistant to treatment
treatment:
  - General approach - many warts resolve spontaneously, observation reasonable especially in children
  - Treatment indications - pain (plantar warts), cosmetic concerns, functional impairment, spreading
  - No single treatment universally effective - combination therapy often needed
  - First-line therapies
  - Salicylic acid (keratolytic) - over-the-counter, patient-applied
  - 17-40% salicylic acid liquid or gel (Compound W, Duofilm)
  - Apply daily after soaking in warm water and paring dead tissue
  - Cover with duct tape or bandage (occlusion enhances efficacy)
  - May take 12+ weeks for resolution
  - Cure rate 50-70% with consistent use
  - Cryotherapy (liquid nitrogen) - office-based
  - Freeze wart for 10-30 seconds, thaw, repeat (double freeze-thaw cycle)
  - May cause pain, blistering
  - Repeat every 2-4 weeks until resolution
  - Cure rate 50-70%, may require multiple treatments
  - More effective for common warts than plantar warts
  - Combination salicylic acid + cryotherapy more effective than either alone
  - Second-line therapies - for refractory warts
  - Cantharidin (topical blister agent) - office-based
  - Causes blister formation, separates wart from skin
  - Apply to wart, cover with tape, wash off in 6-24 hours
  - Blister forms in 24-48 hours
  - Minimal pain during application (unlike cryotherapy)
  - Repeat every 2-4 weeks
  - Not FDA approved but commonly used
  - Imiquimod 5% cream (immunomodulator)
  - Apply 3-5 times per week at bedtime
  - Stimulates local immune response
  - Effective for flat warts and recalcitrant common warts
  - May cause irritation
  - 5-Fluorouracil 5% cream
  - Apply daily or twice daily under occlusion
  - For refractory warts, especially periungual
  - May cause significant irritation
  - Tretinoin 0.05% cream
  - For flat warts on face
  - Apply nightly
  - Candida antigen injection (immunotherapy)
  - Intralesional injection of Candida antigen
  - Stimulates cell-mediated immune response
  - May cause clearance of treated and distant warts
  - For refractory multiple warts
  - Third-line therapies
  - Surgical excision or curettage
  - Immediate removal
  - Risk of scarring, recurrence, pain (especially plantar)
  - Reserved for refractory, large, or solitary warts
  - Electrodesiccation or cautery
  - Burn wart tissue
  - Risk of scarring
  - Laser therapy (pulsed dye laser, CO2 laser)
  - For refractory warts
  - Expensive, requires special equipment
  - Bleomycin intralesional injection
  - Cytotoxic agent injected into wart
  - Painful, risk of Raynaud's phenomenon if used in digits
  - Reserved for very refractory cases
  - Home remedies (some evidence)
  - Duct tape occlusion - cover wart with duct tape continuously, remove weekly, pare dead tissue, reapply
  - Unclear efficacy (mixed study results)
  - Inexpensive, no harm
  - Specific scenarios
  - Plantar warts - salicylic acid + cryotherapy, painful so consider cantharidin (less painful)
  - Flat warts on face - tretinoin or imiquimod (avoid aggressive treatments that cause scarring)
  - Periungual warts - difficult, consider imiquimod or 5-FU under occlusion, avoid aggressive treatments near nail matrix
  - Multiple widespread warts - Candida antigen immunotherapy may clear distant warts
  - Prevention
  - Avoid direct contact with warts (own or others')
  - Avoid walking barefoot in public areas (pools, locker rooms)
  - Do not pick or scratch warts (autoinoculation)
  - Keep hands and feet dry
clinical_pearls:
  - Caused by human papillomavirus (HPV) - over 100 types, low-risk types cause cutaneous warts (not cancer)
  - Very common - 10% of population, 20% of school-age children
  - Transmission by direct contact or fomites, autoinoculation common
  - Spontaneous resolution 65% within 2 years without treatment (higher in children)
  - No treatment universally effective - combination therapy often needed, recurrence common (30-50%)
  - Black dots (thrombosed capillaries) classic for warts
  - Plantar warts disrupt dermatoglyphics (skin lines), calluses preserve lines
  - Plantar warts bleed with paring (pinpoint bleeding), calluses do not bleed
  - Salicylic acid requires patient compliance (daily application for months) but effective if used consistently
  - Duct tape occlusion possibly effective - cheap, harmless, worth trying
  - Aggressive treatments (excision, laser) risk scarring - often not warranted given high spontaneous resolution rate
  - Immunocompromised patients (HIV, transplant) - extensive, treatment-resistant warts
  - Flat warts on face - use gentle treatments (tretinoin, imiquimod), avoid scarring
  - HPV vaccine (Gardasil-9) protects against genital wart types (6, 11) but not cutaneous wart types
differentials:
  - Callus or corn - preserves dermatoglyphics, no black dots, does not bleed with paring, on pressure points
  - Molluscum contagiosum - smooth, dome-shaped, central umbilication, no black dots
  - Seborrheic keratosis - "stuck on" appearance, waxy, horn pseudocysts, not on palms/soles
  - Squamous cell carcinoma - in elderly or immunosuppressed, non-healing, atypical features, biopsy if uncertain
  - Acrochordon (skin tag) - soft, pedunculated, no hyperkeratosis
  - Condyloma acuminatum (genital warts) - anogenital area, HPV types 6, 11
trace:
  - 28-year-old woman presents with painful growth on right heel for 6 months
  - Started as small bump, gradually enlarged, now painful with walking and standing
  - Tried over-the-counter wart remover (salicylic acid) for 3 weeks without improvement (inconsistent application)
  - No history of warts elsewhere
  - Past medical history - none
  - Medications - none
  - Physical examination - 8 mm hyperkeratotic plaque on plantar aspect of right heel (weight-bearing surface), rough surface with multiple black dots centrally, tender to direct pressure, dermatoglyphics disrupted
  - Pared superficial keratin with scalpel blade - reveals pinpoint bleeding from thrombosed capillaries (confirms wart, not callus)
  - No other warts on feet or hands
  - Diagnosis - Plantar wart (verruca plantaris), solitary
  - Treatment plan
  - Office cryotherapy - liquid nitrogen applied for 20 seconds, thaw 2 minutes, repeat freeze-thaw cycle (double freeze-thaw)
  - Counseled that blister may form, pop blister if painful
  - Home treatment - salicylic acid 40% gel (Duofilm) nightly after soaking foot in warm water and paring dead tissue with pumice stone or emery board, cover with duct tape
  - Return in 3 weeks for repeat cryotherapy if not resolved
  - Avoid walking barefoot in gym locker room
  - At 3 weeks - wart smaller (5 mm), less painful, patient has been compliant with nightly salicylic acid
  - Repeat cryotherapy
  - At 6 weeks - wart significantly flatter, 3 mm, minimal pain
  - Repeat cryotherapy third time
  - At 9 weeks - wart nearly flat, no black dots visible, no pain with walking
  - Advised to continue salicylic acid for 2 more weeks
  - At 12 weeks - complete resolution, normal skin on heel, no pain, normal dermatoglyphics restored
  - Counseled that recurrence possible (30% chance), return if recurs

citations:
  - AAD (American Academy of Dermatology) Guidelines for Warts
  - Cochrane Database Systematic Review - Warts Treatment
  - UpToDate - Dermatology
