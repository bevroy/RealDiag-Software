tree_id: NEU-BELL-PALSY
name: Bell's Palsy
family: Neurology
specialty: Neurology
icd10:
- G51.0
snomed:
- '193093009'
urgency: medium
description: Comprehensive evaluation and management of Bell's Palsy
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- sudden unilateral facial weakness or paralysis
- inability to close eye on affected side
- loss of taste on anterior tongue
- hyperacusis
- often preceded by viral illness
- 'Complete hemifacial weakness: Forehead involved (vs stroke which spares forehead)'
- Periauricular pain (50%) may precede weakness
- 'House-Brackmann grade I-VI: I (normal) to VI (complete paralysis)'
workup:
- 'Clinical diagnosis: Acute unilateral facial weakness including forehead, normal
  neuro exam otherwise'
- 'No imaging if typical: Sudden onset, complete hemifacial weakness, no other neuro
  deficits'
- 'MRI brain with contrast: If atypical (gradual onset, other cranial nerves, bilateral,
  not improving)'
- 'EMG (after 2-3 weeks): Nerve conduction studies predict prognosis if no clinical
  improvement'
treatment:
- 'Guideline-based treatment options for Bell''s Palsy include:'
- Prednisone 60mg daily x5 days, taper over 5 days (10 days total) - START WITHIN
  72 HOURS (AAN 2024)
- Acyclovir 400mg 5x daily x7 days (or valacyclovir 1g TID x7 days) - if severe or
  Ramsay Hunt (AAN 2024)
- 'Eye protection: Artificial tears q2h during day, lacrilube ointment at night, tape
  eyelid closed if incomplete closure (AAN 2024)'
- 'Physical therapy: Facial exercises after 2-3 weeks (avoid early to prevent synkinesis)
  (AAN 2024)'
- 'Recheck: 1-2 weeks to assess for improvement, consider EMG if no recovery by 3
  months (AAN 2024)'
clinical_pearls:
- Idiopathic facial nerve palsy (CN VII) - diagnosis of exclusion
- 'Forehead involvement: Distinguishes from stroke (stroke spares forehead due to
  bilateral UMN innervation)'
- 'Prednisone + acyclovir: Start within 72 hours, improves recovery to 90-95%'
- 'Eye protection critical: Artificial tears, eye ointment at night, tape eyelid closed
  (prevent corneal abrasion)'
- 'Recovery: 70% complete in 6 months without treatment, 85% with steroids, 30% have
  mild residual weakness'
- 'Ramsay Hunt syndrome: Herpes zoster of geniculate ganglion (vesicles in ear canal,
  worse prognosis)'
referrals:
- 'Ophthalmology if: Incomplete eye closure, corneal abrasion, persistent lagophthalmos'
- 'Neurology if: Atypical features (bilateral, recurrent, other cranial nerves, no
  improvement 3 months)'
- 'ENT if: Ramsay Hunt syndrome, chronic facial paralysis (consider surgical decompression)'
differentials: []
trace:
