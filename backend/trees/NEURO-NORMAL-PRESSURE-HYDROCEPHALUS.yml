presentations:
  - Gait disturbance (magnetic gait - feet stuck to floor, shuffling, wide-based)
  - Urinary urgency, frequency, or incontinence
  - Cognitive impairment (psychomotor slowing, executive dysfunction, apathy)
  - Classic triad: gait apraxia, urinary incontinence, dementia (mnemonic "Wet, Wacky, Wobbly")
  - Gait usually first symptom, incontinence second, dementia last
  - Symptoms progressive over months to years
  - May have history of subarachnoid hemorrhage, meningitis, or head trauma
  - Enlarged ventricles on imaging out of proportion to sulcal atrophy

workup:
  - Clinical triad assessment: gait disturbance (earliest and most common - magnetic gait, shuffling, wide-based, difficulty initiating gait, freezing, falls), urinary symptoms (urgency, frequency, incontinence - detrusor overactivity), cognitive impairment (psychomotor slowing, executive dysfunction, apathy, memory relatively preserved compared to Alzheimer)
  - Gait examination critical: observe initiation (difficulty starting to walk), step height (shuffling, feet barely lift off ground), base (wide-based for stability), turning (multiple small steps, en bloc turns), freezing episodes, tandem gait impaired, ask patient to walk - characteristic magnetic gait (feet appear stuck to floor)
  - Distinguish from Parkinson gait: NPH gait is magnetic/apraxic with wide base, Parkinson gait is festinating (forward-leaning, narrow base, shuffling) with tremor and rigidity, NPH lacks resting tremor and cogwheel rigidity of Parkinson
  - Neuroimaging essential (MRI preferred): ventriculomegaly (enlarged lateral ventricles, third ventricle, fourth ventricle may be normal), Evans index greater than 0.3 (ratio maximal frontal horn width to maximal brain width on axial image), disproportionately enlarged subarachnoid space hydrocephalus (DESH) - tight high convexity sulci with dilated sylvian fissures and basal cisterns, minimal cortical atrophy (ventricles large but sulci not proportionately widened), periventricular T2/FLAIR hyperintensities (transependymal CSF flow), aqueductal flow void on T2 (hyperdynamic CSF flow), callosal angle less than 90 degrees (acute angle of corpus callosum)
  - Lumbar puncture: opening pressure normal or mildly elevated (less than 250 mm H2O - hence "normal pressure"), remove 30-50 mL CSF (high-volume tap), assess gait and cognition before and after tap (positive tap test - improvement in gait after tap suggests shunt responsiveness), CSF analysis (cell count, protein, glucose) to rule out infection or inflammation
  - Tap test (CSF removal test): baseline gait assessment (timed up-and-go test, 10-meter walk test, number of steps), cognitive testing (MMSE or MoCA), remove 30-50 mL CSF via LP, repeat gait and cognitive testing 2-4 hours after and next day, positive test defined as improvement in gait time greater than 10-20 percent or improvement in gait stability/stride, sensitivity 50-70 percent (negative test does not rule out NPH)
  - Extended lumbar drainage (if tap test negative but high suspicion): place lumbar drain, remove 150-200 mL CSF per day x 3 days (continuous external drainage), monitor gait and cognition daily, more sensitive than single tap test (80-90 percent sensitivity), requires inpatient admission, risks CSF leak, infection, subdural hematoma
  - Cognitive testing: formal neuropsychological assessment shows executive dysfunction and psychomotor slowing out of proportion to memory (differs from Alzheimer disease), frontal/subcortical pattern, apathy common
  - Rule out alternative diagnoses: vascular dementia (stepwise decline, multiple infarcts, white matter disease), Parkinson disease (resting tremor, rigidity, asymmetric onset, response to levodopa), Alzheimer disease (memory predominant, medial temporal atrophy, no gait disturbance early), multi-system atrophy (parkinsonism plus autonomic failure), cerebral atrophy with ex-vacuo ventriculomegaly (ventricles and sulci both enlarged proportionately)
  - Identify secondary NPH causes: prior subarachnoid hemorrhage (blood impairs CSF reabsorption), prior meningitis (scarring of arachnoid villi), prior head trauma, prior intracranial surgery, intracranial hemorrhage
  - Shunt response predictors (positive indicators): classic triad present, gait disturbance prominent and early, positive tap test or extended drainage, identifiable cause (secondary NPH), DESH pattern on MRI, symptom duration less than 2 years, lack of significant white matter disease or cortical atrophy

treatment:
  - Ventriculoperitoneal (VP) shunt surgery: definitive treatment for NPH, diverts CSF from lateral ventricle to peritoneal cavity, programmable valve allows adjustment of opening pressure, success rate 60-80 percent for idiopathic NPH (higher 80-90 percent for secondary NPH with identifiable cause), gait improvement most consistent (70-90 percent), urinary symptoms improve 60-80 percent, cognitive improvement variable (50-70 percent)
  - Surgical candidacy: positive tap test or extended drainage (best predictor of response), classic triad present, imaging consistent (ventriculomegaly, DESH pattern), no contraindications (advanced Alzheimer or Parkinson as primary diagnosis, severe comorbidities precluding surgery)
  - Shunt procedure: neurosurgical procedure under general anesthesia, catheter placed in lateral ventricle connected to programmable valve in scalp connected to peritoneal catheter tunneled subcutaneously to abdomen, programmable valve allows non-invasive adjustment of drainage rate (can adjust with external magnet if symptoms of over-drainage or under-drainage)
  - Post-shunt management: initial valve setting typically medium pressure (10-12 cm H2O), follow-up 2-4 weeks assess gait and cognition, adjust valve if under-draining (symptoms persist - lower pressure to increase drainage) or over-draining (postural headaches, subdural hematoma - raise pressure to decrease drainage), physical therapy for gait training after shunt
  - Shunt complications (10-20 percent): infection (1-5 percent - shunt removal and replacement needed, prophylactic antibiotics at surgery), subdural hematoma or hygroma (over-drainage - raise valve pressure, evacuate if large or symptomatic), shunt malfunction (catheter obstruction, disconnection - requires revision), seizures (rare), intraventricular hemorrhage (rare)
  - Alternative shunt: ventriculoatrial (VA) shunt (drains to right atrium) if peritoneal not feasible, lumboperitoneal (LP) shunt (from lumbar thecal sac to peritoneum) alternative approach
  - Monitor for shunt failure: symptoms return (gait worsening, incontinence, cognitive decline), may occur months to years after shunt placement, causes include catheter obstruction (debris, choroid plexus), valve failure, disconnection, peritoneal catheter migration, evaluate with CT head (ventricle size increased if under-draining), shunt series X-rays (assess hardware integrity), nuclear medicine shunt patency study
  - Non-surgical management: if patient declines surgery or poor surgical candidate, medical management limited (acetazolamide 250-500 mg BID or furosemide 20-40 mg daily to reduce CSF production - limited efficacy), physical therapy for gait training, prompted voiding for incontinence, walker or assistive device for falls prevention, progressive disease without shunt
  - Prognosis with shunt: 60-80 percent improve (some dramatically), gait improvement most consistent and earliest (often within days to weeks), continence improves over weeks to months, cognition may improve over months (less predictable), earlier treatment better outcomes (symptom duration less than 2 years better than chronic cases), some patients return to near-normal function

clinical_pearls:
  - NPH is potentially reversible cause of dementia - always consider in elderly with gait/incontinence/dementia triad
  - Classic triad: gait apraxia (magnetic gait), urinary incontinence, dementia - mnemonic "Wet, Wacky, Wobbly"
  - Gait disturbance usually first and most prominent symptom
  - Imaging: ventriculomegaly out of proportion to sulcal atrophy (Evans index greater than 0.3)
  - Normal CSF opening pressure (less than 250 mm H2O) distinguishes from high-pressure hydrocephalus
  - Tap test (30-50 mL CSF removal) - improvement in gait suggests shunt responsiveness (50-70 percent sensitive)
  - VP shunt definitive treatment - success rate 60-80 percent (gait improves most consistently)
  - Earlier treatment better outcomes - don't delay if diagnosis suspected
  - Secondary NPH (post-SAH, meningitis, trauma) responds better to shunt than idiopathic NPH
  - Shunt complications include infection (1-5 percent), subdural hematoma (over-drainage), malfunction

referrals:
  - Neurosurgery for shunt evaluation and surgery (all suspected NPH cases should be evaluated)
  - Neurology for diagnosis, tap test, and co-management
  - Physical therapy for gait training pre- and post-shunt
  - Urology if urinary symptoms prominent or persistent after shunt
  - Neuropsychology for cognitive assessment and monitoring response to shunt
  - Rehabilitation medicine for comprehensive functional assessment

differentials:
  - Parkinson disease (resting tremor, rigidity, narrow-based festinating gait, asymmetric, responds to levodopa)
  - Vascular dementia (stepwise decline, multiple infarcts, white matter disease, no classic triad)
  - Alzheimer disease (memory predominant, medial temporal atrophy, no early gait disturbance)
  - Lewy body dementia (visual hallucinations, fluctuations, REM sleep behavior disorder)
  - Multi-system atrophy (parkinsonism, autonomic failure, cerebellar signs, poor prognosis)
  - Progressive supranuclear palsy (vertical gaze palsy, axial rigidity, backward falls, no response to treatment)
  - Cerebral atrophy ex-vacuo (ventricles and sulci both enlarged proportionately, no improvement with tap test)
  - Chronic subdural hematoma (headache, fluctuating symptoms, history of fall, crescent on CT)

trace:
  - 76-year-old man presents with 18-month history of progressive gait difficulty, urinary urgency, and cognitive slowing
  - "History: 18 months ago family noticed subtle gait changes (slower walking, shorter steps), 12 months ago developed urinary urgency and frequency (wakes 3-4 times nightly, occasional incontinence), 6 months ago wife noticed cognitive slowing (takes longer to respond to questions, less motivated, apathetic, forgets recent conversations), progressive worsening all symptoms"
  - "Current symptoms: severe gait disturbance (feels like feet stuck to floor, shuffling steps, wide-based, multiple falls past 3 months, uses walker indoors), urinary incontinence daily (wears briefs), cognitive slowing (apathetic, slower processing, memory for remote events good but recent memory impaired)"
  - "Wife reports: gait was first symptom noticed, then bladder problems, then cognitive changes (sequence typical of NPH), personality change (more passive, less interested in activities he enjoyed)"
  - "Past medical history: hypertension (well-controlled), 20 years ago had traumatic subarachnoid hemorrhage from motor vehicle accident (hospitalized 2 weeks, recovered fully at that time)"
  - "Medications: lisinopril 20 mg daily, atorvastatin 40 mg nightly"
  - "Family history: father had Parkinson disease"
  - "Exam: alert, follows commands but slow to respond, MMSE 24/30 (lost points on attention, delayed recall, but could recall words with cuing), affect flat (apathetic), normal strength all extremities, no tremor, no rigidity (not Parkinson), reflexes brisk and symmetric, Babinski signs absent, gait remarkable - magnetic gait (difficulty initiating steps, feet appear stuck to floor, shuffling with very short steps, wide-based, turning requires multiple small steps, freezing episodes, uses walker)"
  - "Timed Up-and-Go test: 42 seconds (normal less than 12 seconds - markedly impaired), 10-meter walk test: 28 steps and 35 seconds (normal 15-20 steps and 10-15 seconds)"
  - "MRI brain: marked ventriculomegaly (lateral ventricles, third ventricle dilated, fourth ventricle normal size), Evans index 0.38 (elevated, normal less than 0.3), DESH pattern (disproportionately enlarged subarachnoid space - tight high convexity sulci with dilated sylvian fissures), minimal cortical atrophy (sulci not proportionately enlarged), periventricular T2/FLAIR hyperintensities (transependymal CSF flow), aqueductal flow void (hyperdynamic CSF flow), corpus callosum angle 70 degrees (acute angle - positive sign)"
  - "Assessment: imaging highly suggestive of NPH (ventriculomegaly out of proportion to atrophy, DESH pattern, acute callosal angle), history of SAH 20 years ago (secondary NPH - CSF reabsorption impaired by prior hemorrhage)"
  - 'Lumbar puncture performed: opening pressure 16 cm H2O (normal - hence "normal pressure hydrocephalus"), CSF clear and colorless, cell count 1 WBC (normal), protein 42 mg/dL (normal), glucose 68 mg/dL (normal), removed 40 mL CSF for tap test'
  - "Tap test results: baseline Timed Up-and-Go 42 seconds, 4 hours post-tap 32 seconds (24 percent improvement), next day 28 seconds (33 percent improvement - significant), baseline 10-meter walk 28 steps, post-tap 22 steps (21 percent improvement), gait stability subjectively improved (wife noted \"He's walking better, not shuffling as much\"), MMSE unchanged 24/30"
  - Positive tap test (gait improvement greater than 20 percent) - highly predictive of shunt responsiveness
  - "Diagnosis: Normal Pressure Hydrocephalus, secondary (post-traumatic from SAH 20 years ago), with classic triad (gait apraxia, urinary incontinence, cognitive impairment) and positive tap test"
  - "Discussed treatment: VP shunt surgery recommended (high likelihood of improvement 80-90 percent given secondary NPH, positive tap test, classic triad), explained procedure, risks (infection 1-5 percent, subdural hematoma 5-10 percent, malfunction 10-20 percent), benefits (gait improvement likely, continence may improve, cognition may improve)"
  - Patient and family elected to proceed with shunt surgery
  - Neurosurgery consultation: agreed with diagnosis, good shunt candidate, scheduled ventriculoperitoneal shunt placement
  - Surgery performed: right frontal approach, ventricular catheter placed in right lateral ventricle, programmable valve (Codman Hakim) set at medium pressure (10 cm H2O), peritoneal catheter tunneled subcutaneously to abdomen, uncomplicated procedure
  - Post-operative day 1: ambulating with walker, gait already noticeably improved from pre-op (less shuffling, better initiation), Timed Up-and-Go 24 seconds (dramatic improvement from 42 seconds), no complications
  - Post-operative day 3: discharged home, instructed no heavy lifting x 6 weeks, follow-up 2 weeks
  - 2-week follow-up: gait dramatically improved (Timed Up-and-Go 18 seconds, walking without walker at home, only uses cane outside), urinary urgency improved (wakes only 1-2 times nightly, no incontinence past week), cognition slightly improved (MMSE 26/30, wife reports more engaged and motivated), valve setting unchanged (10 cm H2O), incision healed well
  - Physical therapy started for gait training and strengthening
  - 6-week follow-up: continued improvement, Timed Up-and-Go 14 seconds (near-normal), walking without assistive device, urinary symptoms resolved (no incontinence, nocturia 1-2 times normal for age), cognition improved (MMSE 27/30, back to usual personality per wife, more active and social), patient and family thrilled with outcome
  - 3-month follow-up: sustained improvement, essentially back to baseline function from before symptom onset 18 months ago, walking normally (no magnetic gait, normal step height and base), continent, cognitively sharp
  - Patient states: "I can't believe the difference. Six months ago I could barely walk and needed diapers. Now I'm back to normal. I only wish we had figured this out sooner."
  - 1-year follow-up: sustained excellent outcome, no complications, valve setting unchanged, CT head shows appropriate ventricle size (smaller than pre-shunt but not collapsed), annual follow-up planned to monitor for late shunt malfunction
  - Counseling: instructed to seek care immediately if symptoms recur (may indicate shunt malfunction - obstruction, disconnection), avoid strong magnets (MRI safe but may change valve setting - need re-programming after MRI), carry shunt card at all times

