tree_id: NEURO-NORMAL-PRESSURE-HYDROCEPHALUS
name: Normal Pressure Hydrocephalus
family: Neurology
specialty: Neurology/Neurosurgery
chief_complaint: Triad of gait disturbance, urinary incontinence, and cognitive decline with enlarged ventricles
description: Potentially reversible cause of dementia characterized by communicating hydrocephalus with ventriculomegaly, normal CSF opening pressure, and classic triad of symptoms

icd10: G91.2
snomed: "230745008"

urgency: routine

