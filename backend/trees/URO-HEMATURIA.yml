presentations:
  - Blood in urine (visible or microscopic)
  - May be painless or associated with dysuria
  - Causes - UTI, stones, trauma, malignancy, glomerular disease
  - Requires evaluation to rule out malignancy
  - Cystoscopy and imaging often indicated
differentials:
  - UTI
  - Nephrolithiasis
  - Glomerulonephritis
  - Bladder cancer
  - Trauma
workup:
  - 'UA with microscopy: ≥3 RBC/HPF diagnostic. Look for RBC casts (glomerular), WBCs (infection), dysmorphic RBCs (glomerular)'
  - 'Urine cytology: Detects high-grade urothelial carcinoma (bladder cancer) - 40% sensitive'
  - 'CT urogram: Gold standard imaging - shows renal masses, stones, ureteral tumors'
  - 'Cystoscopy: Direct visualization of bladder and urethra - detects bladder tumors, urethral lesions'
  - 'Renal function: Creatinine - if elevated with RBC casts, suggests glomerulonephritis'
treatment:
  - 'Guideline-based treatment options for Hematuria (Gross or Microscopic) include:'
  - 'Treat UTI if present: Antibiotics, then repeat UA in 6 weeks - if hematuria resolves, no further workup needed (AUA 2023)'
  - 'Cystoscopy: For age >35, gross hematuria, or risk factors (smoking, occupational exposures) - evaluates bladder and urethra for tumor (AUA 2023)'
  - 'CT urogram: Imaging of choice - contrast CT during excretory phase, evaluates kidneys/ureters/bladder for stones, masses, strictures (AUA 2023)'
  - 'If glomerular (RBC casts, proteinuria): Refer nephrology - glomerulonephritis workup (ANA, ANCA, complement, renal biopsy) (AUA 2023)'
  - 'Anticoagulation: Does NOT cause hematuria - if on warfarin/DOACs and have hematuria, still needs full workup (AUA 2023)'
clinical_pearls:
  - Gross hematuria (visible blood) vs microscopic (≥3 RBC/HPF on UA) - both need evaluation for malignancy if age >35
  - 'Glomerular vs non-glomerular: Glomerular (RBC casts, dysmorphic RBCs, proteinuria) suggests nephrology. Non-glomerular (normal RBCs, clots) suggests urologic'
  - 'Malignancy risk: 5% of gross hematuria, 0.5% of microscopic hematuria have bladder cancer (higher risk if age >35, smoking, occupational exposures)'
  - 'Painless hematuria: More concerning for malignancy (bladder cancer, renal cell carcinoma). Painful suggests stones, UTI'
  - 'Exercise-induced hematuria: Can occur after strenuous exercise, resolves within 48-72 hours, benign'
red_flags: []
disposition_guidance: {}
referrals:
  - 'Urology for: Age >35 with microscopic hematuria, any gross hematuria, abnormal CT or cytology'
  - 'Nephrology if: RBC casts, proteinuria >500mg/day, elevated creatinine (glomerular disease)'
