tree_id: URO-INCONTINENCE-STRESS
name: Urinary Incontinence (Stress)
family: urology
specialty: Urology/Gynecology/Primary Care
icd10: N39.3
snomed: 48340000
urgency: []
homeopathy: []
presentations:
  - Involuntary urine leakage with physical exertion or increased abdominal pressure
  - Leakage with coughing, sneezing, laughing
  - Leakage with exercise, lifting, jumping, running
  - Leakage when standing up from sitting
  - No urgency preceding leakage (distinguishes from urge incontinence)
  - Typically small volume leakage (drops to small amounts)
  - More common in women (female-to-male ratio 2:1)
  - Risk factors: childbirth, menopause, obesity, chronic cough, pelvic surgery, high-impact sports
workup:
  - Clinical history
  - Onset, duration, frequency, severity
  - Voiding diary for 3 days (record voids, leaks, triggers)
  - Provocative maneuvers during examination
  - Impact on quality of life
  - Obstetric history (parity, mode of delivery, birth weight)
  - Medical history (diabetes, neurological disease, prior pelvic surgery)
  - Medications (diuretics, alpha-blockers, ACE inhibitors can worsen)
  - Physical examination
  - Abdominal exam (masses, bladder distention)
  - Pelvic exam in women
  - Assess for pelvic organ prolapse (cystocele, rectocele, uterine prolapse)
  - Assess pelvic floor muscle strength (Kegel exam)
  - Assess vaginal atrophy (if postmenopausal)
  - Cough stress test: ask patient to cough with full bladder, observe for leakage
  - Genitourinary exam in men (prostate size, urethral abnormalities)
  - Neurological exam (assess for neurogenic causes)
  - Urinalysis
  - Rule out urinary tract infection (can worsen or mimic incontinence)
  - Rule out hematuria (suggests malignancy)
  - Rule out glycosuria (uncontrolled diabetes causes polyuria)
  - Post-void residual (PVR) urine volume
  - Bladder scan or catheterization immediately after voiding
  - "PVR less than 50 mL: normal (pure stress incontinence unlikely to have retention)"
  - "PVR greater than 200 mL: significant retention (suggests overflow incontinence)"
  - Additional testing if diagnosis unclear or considering surgery
  - Urodynamic testing (cystometry)
  - Measures bladder pressure during filling and voiding
  - Confirms stress incontinence (leakage without detrusor contraction)
  - Rules out mixed incontinence (stress + urge)
  - Indicated before surgery if diagnosis uncertain
  - Cystoscopy if hematuria, recurrent UTIs, or prior pelvic radiation
treatment:
  - Conservative management FIRST-LINE (before considering surgery)
  - Lifestyle modifications
  - Weight loss if overweight (5-10% weight loss reduces incontinence by 50%)
  - Avoid bladder irritants (caffeine, alcohol, acidic foods, spicy foods)
  - Smoking cessation (chronic cough worsens stress incontinence)
  - Fluid management (avoid excessive intake, don't restrict)
  - Timed voiding (urinate every 2-3 hours)
  - Pelvic floor muscle training (Kegel exercises) - FIRST-LINE
  - Contract pelvic floor muscles for 3-5 seconds, relax for 3-5 seconds
  - Perform 10 repetitions, 3 times daily
  - Proper technique essential (avoid contracting abdomen, buttocks, thighs)
  - Pelvic floor physical therapy for supervised training
  - 50-70% improvement with 3-6 months consistent practice
  - Vaginal pessary (for women with pelvic organ prolapse)
  - Mechanical device supports bladder neck and urethra
  - 50-70% improve or cured
  - Requires fitting and periodic cleaning/replacement
  - Vaginal estrogen (for postmenopausal women)
  - Estrogen cream 0.5 g intravaginally 2-3 times weekly
  - Improves vaginal and urethral tissue tone
  - Does NOT increase systemic estrogen risks
  - Medications (limited efficacy for pure stress incontinence)
  - Duloxetine 40 mg twice daily (SNRI, increases urethral sphincter tone)
  - Not FDA-approved in US for this indication, used in Europe
  - 50% reduction in leakage episodes
  - Side effects: nausea, dry mouth, fatigue
  - Surgical intervention (if conservative measures fail after 3-6 months)
  - Indications: failed conservative therapy, severe symptoms, patient preference
  - Mid-urethral sling procedures (gold standard surgery)
  - Tension-free vaginal tape (TVT) or transobturator tape (TOT)
  - 80-90% cure or significant improvement
  - Minimally invasive, outpatient procedure
  - Complications: urinary retention (5-10%), mesh erosion (1-3%), voiding dysfunction
  - Bulking agents (injectable collagen, calcium hydroxylapatite)
  - Inject periurethrally to increase urethral closure
  - 60-70% improvement, less effective than slings
  - Can be repeated
  - Option for poor surgical candidates or mild symptoms
  - Artificial urinary sphincter (for severe incontinence, especially men after prostate surgery)
  - Implantable device, highly effective but complex
  - Complications: infection, mechanical failure, erosion
clinical_pearls:
  - "Stress incontinence most common type in women, accounts for 50% of female incontinence"
  - "Pelvic floor muscle training (Kegels) is first-line treatment - 50-70% improvement with consistent practice"
  - "Weight loss of 5-10% can reduce incontinence episodes by 50%"
  - "Childbirth is major risk factor - vaginal delivery increases risk 2-3x over C-section"
  - "Cough stress test has 90% sensitivity and specificity for stress incontinence"
  - "Mid-urethral slings (TVT/TOT) are gold standard surgery - 80-90% cure rate"
  - "Always rule out urinary tract infection before diagnosing incontinence"
  - "Mixed incontinence (stress + urge) is common - treat most bothersome component first"
referrals:
  - Urogynecology or urology for failed conservative therapy or desire for surgery
  - Pelvic floor physical therapy for supervised Kegel training
  - Urology if hematuria, recurrent UTIs, or male patient with incontinence
differentials:
  - Stress urinary incontinence (leakage with exertion, no urgency, cough stress test positive)
  - Urge urinary incontinence (overactive bladder - urgency precedes leakage, detrusor overactivity on urodynamics)
  - Mixed incontinence (both stress and urge components)
  - Overflow incontinence (urinary retention with dribbling, elevated PVR)
  - Functional incontinence (mobility or cognitive impairment prevents timely toileting)
  - Urinary tract infection (dysuria, frequency, urgency, pyuria)
  - Urethral diverticulum (anterior vaginal mass, post-void dribbling)
  - Vesicovaginal fistula (continuous leakage, history of pelvic surgery or radiation)
