tree_id: NEURO-ENCEPHALITIS
name: Encephalitis Evaluation
family: Neurology
specialty: Neurology, Infectious Disease
chief_complaint: Fever, Altered Mental Status, Seizures, Headache
description: Evaluation and management of encephalitis
version: "1.0"
icd10: G04.90
author: RealDiag Clinical Team

entry_point: encephalitis_evaluation

nodes:
  - id: encephalitis_evaluation
    type: diagnosis
    name: "Encephalitis"
    icd10: "G04.90"
    urgency: critical
    workup:
      - Encephalitis - Inflammation of brain parenchyma, altered mental status REQUIRED for diagnosis
      - vs. Meningitis (inflammation of meninges, normal mental status initially)
      - Incidence - 5-10 per 100,000, but often undiagnosed
      - Causes identified only 40-60% cases
      - Infectious - 50-60%
      - Viral - Most common
      - Herpes simplex virus (HSV-1) - Most common sporadic encephalitis, 10-20% all cases, adults
      - Temporal lobe predilection (hemorrhagic necrosis)
      - Varicella-zoster virus (VZV) - Immunocompromised, post-zoster (can occur without rash)
      - Enteroviruses - Children, summer/fall (coxsackie, echovirus, enterovirus D68, EV-A71)
      - Arboviruses - Mosquito-borne, geographic/seasonal
      - West Nile virus (WNV) - Most common arboviral in US, late summer/fall
      - Eastern equine encephalitis (EEE) - Eastern US, severe (30-70% mortality)
      - La Crosse, St. Louis, Japanese encephalitis, Zika
      - Rabies - Exposure to bats, raccoons, skunks, foxes; FATAL once symptomatic
      - HIV, CMV, EBV, HHV-6, adenovirus, influenza, measles, mumps
      - Bacterial - Listeria monocytogenes (immunocompromised, neonates, elderly), Mycoplasma, TB, Borrelia (Lyme), Bartonella, syphilis
      - Fungal - Cryptococcus (HIV, CD4 <100), Histoplasma, Coccidioides
      - Parasitic - Toxoplasma (HIV, ring-enhancing lesions), malaria, cysticercosis
      - Autoimmune/paraneoplastic - 20-30%
      - Anti-NMDA receptor encephalitis - Young women, ovarian teratoma 50%, psychiatric symptoms prominent (psychosis, paranoia, hallucinations), seizures, dyskinesias (orofacial), autonomic instability, decreased consciousness
      - Anti-LGI1, anti-CASPR2 - Limbic encephalitis, seizures (faciobrachial dystonic seizures characteristic LGI1), hyponatremia
      - Anti-GAD, anti-AMPA, anti-GABA-B - Limbic encephalitis
      - Paraneoplastic - Anti-Hu (SCLC), anti-Ma2 (testicular), anti-CRMP5
      - Clinical presentation - Altered mental status (confusion, disorientation, personality change, decreased consciousness) + fever + headache
      - Seizures (50-70%, especially HSV)
      - Focal neurologic deficits (hemiparesis, aphasia, visual field defects)
      - Behavioral/psychiatric symptoms (psychosis, hallucinations, especially anti-NMDA)
      - Movement disorders (dyskinesias, tremor)
      - Temporal lobe involvement - Memory impairment, behavior changes, olfactory hallucinations (HSV classic)
      - Physical exam - Fever, altered mental status, meningismus (if meningoencephalitis), focal deficits, seizures
      - Rash (VZV, enteroviruses, WNV), parotitis (mumps), pharyngitis (enterovirus), hydrophobia (rabies)
      - Lumbar puncture - ESSENTIAL (if no contraindication)
      - Opening pressure - Normal or elevated
      - WBC - Pleocytosis (lymphocytic predominance 10-500 cells/μL)
      - Neutrophilic early (first 24-48 hours) then lymphocytic (especially viral)
      - Protein - Elevated (50-100 mg/dL)
      - Glucose - Normal (distinguishes from bacterial meningitis)
      - Low in TB, fungal, lymphomatous meningitis
      - RBCs - Elevated in HSV (hemorrhagic encephalitis)
      - PCR - HSV PCR (sensitivity 95%, specificity 98%, MUST SEND), VZV, enterovirus, WNV, other viruses
      - CSF antibodies - Anti-NMDA, anti-LGI1, paraneoplastic panel
      - Bacterial/fungal cultures, cryptococcal antigen, TB PCR
      - Imaging
      - MRI brain with contrast - BEST (more sensitive than CT)
      - HSV - T2/FLAIR hyperintensity medial temporal lobes (bilateral or asymmetric), hemorrhage
      - Limbic encephalitis - T2/FLAIR hyperintensity medial temporal lobes, hippocampus
      - WNV - Basal ganglia, thalamus, brainstem
      - EEE - Basal ganglia, thalamus
      - May be NORMAL early (negative MRI does not rule out)
      - EEG - Abnormal 90% (diffuse slowing, focal abnormalities, seizures)
      - HSV - Periodic lateralized epileptiform discharges (PLEDs) temporal lobe (but only 20%, not sensitive)
      - Serology - Acute and convalescent titers (arbovirus IgM, HIV, VZV, Mycoplasma)
      - Nasopharyngeal swab - Influenza, enterovirus PCR
      - Blood cultures - If bacterial suspected
    treatment:
      - Empiric treatment - START IMMEDIATELY (do NOT wait for diagnostic confirmation)
      - Acyclovir 10 mg/kg IV q8h - HSV/VZV coverage, MUST START ASAP
      - HSV encephalitis FATAL if untreated (70% mortality), treatment reduces to 20-30%
      - Duration 14-21 days (HSV), 10-14 days (VZV)
      - Start even if HSV PCR pending (takes 24-48 hours)
      - Can discontinue if HSV PCR negative AND alternative diagnosis confirmed
      - Antibiotics - If bacterial meningitis cannot be excluded (overlapping presentation)
      - Vancomycin + ceftriaxone + ampicillin (ampicillin covers Listeria, age >50 or immunocompromised)
      - Discontinue once bacterial cultures negative, CSF profile supports viral
      - Anti-seizure medications - If seizures occur (levetiracetam, phenytoin)
      - Supportive care - ICU monitoring, airway protection (intubate if GCS <8), ICP management if elevated
      - Targeted therapy - Based on specific etiology
      - VZV - Acyclovir 10-15 mg/kg IV q8h
      - CMV - Ganciclovir 5 mg/kg IV q12h or foscarnet
      - Toxoplasma (HIV) - Pyrimethamine + sulfadiazine + leucovorin
      - Cryptococcus - Amphotericin B + flucytosine
      - TB - Rifampin, isoniazid, pyrazinamide, ethambutol (RIPE) + dexamethasone
      - Listeria - Ampicillin + gentamicin
      - West Nile, enteroviruses - Supportive only (no specific antiviral)
      - Autoimmune encephalitis
      - Immunotherapy - Corticosteroids (methylprednisolone 1 g IV daily x 3-5 days) + IVIG 2 g/kg over 2-5 days + plasma exchange
      - First-line - Steroids + IVIG or PLEX
      - Second-line (if refractory) - Rituximab (anti-CD20) or cyclophosphamide
      - Anti-NMDA - Tumor removal if present (ovarian teratoma), immunotherapy
      - 70-80% recover (may take months)
      - Complications - Seizures, increased ICP (herniation risk), SIADH, respiratory failure
      - Prognosis
      - HSV - Mortality 20-30% with treatment (70% untreated), 50% survivors have neurologic sequelae (memory impairment, personality change, seizures)
      - Early treatment critical (within 48 hours best outcomes)
      - WNV - 10% mortality, neurologic sequelae 50%
      - EEE - 30-70% mortality, severe sequelae survivors
      - Autoimmune - 70-80% good recovery with treatment (but prolonged, months to years)
      - Prevention - Mosquito avoidance (arbovirus), post-exposure rabies prophylaxis (if bite), vaccination (Japanese encephalitis for travelers)
