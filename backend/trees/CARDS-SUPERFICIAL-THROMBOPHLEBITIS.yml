tree_id: CARDS-SUPERFICIAL-THROMBOPHLEBITIS
name: Superficial Thrombophlebitis
family: cardiology
specialty: Cardiology
icd10: I80.00
snomed: 64156001
urgency: moderate
homeopathy: []
presentations:
  - Painful, tender, palpable cord along superficial vein
  - Erythema and warmth along vein
  - Induration
  - Sudden onset over hours to days
  - Most commonly in lower extremities (great saphenous vein)
  - Upper extremity involvement if IV catheter or IVDU
  - May see superficial varicose veins
  - Low-grade fever possible
  - Risk factors - varicose veins, pregnancy, oral contraceptives, trauma, malignancy, thrombophilia
workup:
  - Clinical diagnosis based on history and physical examination
  - Venous duplex ultrasound recommended in most cases
  - Rule out deep vein thrombosis (20-40% have concomitant DVT)
  - Assess thrombus extent and proximity to saphenofemoral junction
  - DVT risk high if thrombus within 3cm of SFJ or >5cm length
  - D-dimer if DVT suspected (high sensitivity)
  - CBC if infection suspected (septic thrombophlebitis)
  - Blood cultures if systemic signs (fevers, rigors)
  - Consider hypercoagulability workup if unprovoked or recurrent
  - Factor V Leiden, prothrombin G20210A, protein C/S, antithrombin
  - Antiphospholipid antibodies
  - Malignancy screening if age-appropriate and unprovoked (Trousseau syndrome)
treatment:
  - Outpatient management for uncomplicated cases
  - NSAIDs for pain and inflammation (ibuprofen 400-600mg TID, naproxen 500mg BID)
  - Warm compresses
  - Ambulation encouraged (bed rest not recommended)
  - Leg elevation when at rest
  - Compression stockings 30-40 mmHg may provide symptom relief
  - Anticoagulation for extensive superficial thrombophlebitis
  - Indications - thrombus >5cm length, within 3cm of deep system, severe symptoms
  - Fondaparinux 2.5mg SC daily x 45 days (proven benefit)
  - LMWH (enoxaparin 40mg daily or 1mg/kg daily) x 4-6 weeks alternative
  - Rivaroxaban 10mg daily alternative
  - Full anticoagulation if concomitant DVT or PE
  - Surgical options rarely needed
  - Ligation of saphenofemoral junction if rapid progression toward deep system
  - Thrombectomy for very symptomatic cases
  - Antibiotics if septic thrombophlebitis (blood cultures positive)
  - Remove IV catheter if catheter-related
clinical_pearls:
  - Migratory thrombophlebitis suggests underlying malignancy (Trousseau syndrome)
  - Concomitant DVT present in 20-40% of cases
  - Risk of DVT/PE progression 10% without anticoagulation if extensive
  - Upper extremity superficial thrombophlebitis often related to IV access
  - Mondor disease - superficial thrombophlebitis of chest wall veins (breast/axilla)
  - Septic thrombophlebitis from IV drug use requires antibiotics + anticoagulation
  - S. aureus most common organism in septic thrombophlebitis
  - Buerger disease (thromboangiitis obliterans) can present with migratory superficial thrombophlebitis
  - Most resolve in 2-3 weeks with treatment
  - Lower recurrence risk than DVT
referrals:
  - Vascular surgery if thrombus rapidly extending toward saphenofemoral junction
  - Hematology for unprovoked or recurrent thrombophlebitis (thrombophilia workup)
  - Oncology if Trousseau syndrome suspected
  - Infectious disease if septic thrombophlebitis
differentials:
  - Superficial thrombophlebitis (primary)
  - Deep vein thrombosis (ultrasound differentiates)
  - Cellulitis (more diffuse erythema, no palpable cord)
  - Lymphangitis (red streaks, tender lymph nodes)
  - Erythema nodosum (nodular, bilateral shins, no cord)
  - Septic thrombophlebitis (systemic symptoms, positive cultures)
  - Mondor disease (chest wall variant)
  - Buerger disease (thromboangiitis obliterans)
