tree_id: GI-ASCITES
name: Ascites
family: gastroenterology
specialty: Gastroenterology
icd10: R18.8
snomed: 389026000
urgency: []
homeopathy: []
presentations:
  - Abdominal distension and increased girth
  - Weight gain despite poor oral intake
  - Shifting dullness on abdominal percussion
  - Fluid wave on physical examination
  - Dyspnea or early satiety from abdominal pressure
  - Lower extremity edema
  - Umbilical or inguinal hernia development
  - Known liver disease or cirrhosis
  - New onset ascites requiring diagnostic evaluation
workup:
  - Diagnostic paracentesis (essential for new-onset ascites)
  - Send ascitic fluid for cell count with differential, albumin, total protein, culture
  - Calculate serum-ascites albumin gradient (SAAG)
  - SAAG ≥1.1 g/dL indicates portal hypertension (cirrhosis, heart failure)
  - SAAG <1.1 g/dL suggests non-portal hypertension causes (malignancy, infection, pancreatitis)
  - Ascitic fluid PMN count >250 cells/mm³ diagnostic of spontaneous bacterial peritonitis
  - Consider cytology if malignancy suspected (SAAG <1.1, bloody fluid)
  - Abdominal ultrasound to confirm ascites and assess liver morphology
  - CT abdomen/pelvis if malignancy or other non-hepatic cause suspected
  - Laboratory tests: CBC, CMP, PT/INR, hepatitis panel, AFP (if cirrhosis)
treatment:
  - Sodium restriction (2 g/day) - cornerstone of management
  - Diuretic therapy for cirrhotic ascites
  - Spironolactone 100 mg daily (start dose) - potassium-sparing diuretic
  - Add furosemide 40 mg daily if inadequate response (maintain 100:40 ratio)
  - Titrate doses together (up to spironolactone 400 mg, furosemide 160 mg)
  - Monitor electrolytes, renal function weekly initially
  - Goal weight loss 0.5-1 kg/day (without edema) or 0.5 kg/day (with edema only)
  - Large-volume paracentesis (LVP) for tense ascites or respiratory compromise
  - Albumin infusion after LVP if >5 L removed (8 g albumin per L removed)
  - Spontaneous bacterial peritonitis treatment: ceftriaxone 2 g IV daily x 5-7 days
  - Secondary prophylaxis: norfloxacin 400 mg daily or ciprofloxacin 750 mg weekly
  - TIPS (transjugular intrahepatic portosystemic shunt) for refractory ascites
  - Liver transplant evaluation for appropriate candidates
clinical_pearls:
  - "Most common cause of ascites is cirrhosis (80%), followed by malignancy (10%) and heart failure (3%)"
  - "SAAG is more accurate than protein-based criteria for determining portal hypertension"
  - "Spironolactone-furosemide ratio 100:40 maintains normokalemia"
  - "SBP occurs in 10-30% of hospitalized cirrhotic patients with ascites"
  - "Third-space fluid accumulation indicates advanced liver disease with poor prognosis"
  - "Refractory ascites defined as ascites unresponsive to high-dose diuretics or with complications"
  - "TIPS improves survival in refractory ascites but risk of hepatic encephalopathy"
  - "Tense ascites can cause respiratory compromise and requires urgent therapeutic paracentesis"
  - "Always perform diagnostic paracentesis before starting diuretics in new-onset ascites"
referrals:
  - Gastroenterology/Hepatology for new-onset or refractory ascites
  - Interventional Radiology for large-volume paracentesis or TIPS evaluation
  - Liver transplant center for appropriate candidates (MELD score >15)
  - Oncology if malignant ascites confirmed
differentials:
  - Cirrhosis (most common, SAAG ≥1.1, stigmata of chronic liver disease)
  - Malignant ascites (peritoneal carcinomatosis, SAAG <1.1, positive cytology)
  - Heart failure (right heart failure, SAAG ≥1.1, elevated JVP)
  - Spontaneous bacterial peritonitis (PMN >250, fever, abdominal pain)
  - Nephrotic syndrome (hypoalbuminemia, proteinuria, edema)
  - Pancreatitis (elevated amylase in fluid, SAAG <1.1)
  - Tuberculosis (lymphocytic ascites, endemic areas, fever, night sweats)
  - Budd-Chiari syndrome (hepatic vein thrombosis, acute liver failure)
trace:
  source: AASLD Practice Guidelines on Management of Adult Patients with Ascites 2021
  version: '1.0'
  last_updated: '2025-12-26'
