tree_id: URO-NEPHROLITHIASIS
name: Nephrolithiasis (Kidney Stone)
family: urology
specialty: Urology/Emergency Medicine
icd10: N20.0
snomed: 95570007
urgency: []
homeopathy: []
presentations:
  - Acute severe colicky flank pain radiating to groin (renal colic when stone obstructing)
  - Hematuria (microscopic or gross) in 85-90% of cases
  - Nausea and vomiting
  - Urinary urgency and frequency
  - Dysuria if stone at ureterovesical junction
  - Inability to find comfortable position (writhes in pain)
  - May be asymptomatic if non-obstructing (incidental finding on imaging)
  - Fever and chills if concurrent infection (pyelonephritis - urgent complication)
  - History of prior kidney stones (50% recurrence rate within 5-10 years)
workup:
  - Urinalysis (essential)
  - Hematuria present in 85-90% (absence does NOT rule out stone)
  - Check pH: acidic (less than 5.5) suggests uric acid stones, alkaline (greater than 7.5) suggests struvite stones
  - Crystals may be visible (calcium oxalate, uric acid, struvite)
  - WBCs and bacteria suggest concurrent infection (urgent if obstructing stone)
  - Imaging (to confirm diagnosis and assess size/location)
  - Non-contrast CT abdomen/pelvis (GOLD STANDARD)
  - Sensitivity/specificity greater than 95%
  - Measures stone size and location
  - Assesses degree of hydronephrosis
  - Identifies secondary signs (perinephric stranding)
  - Renal ultrasound alternative if CT contraindicated (pregnancy, contrast allergy)
  - Less sensitive for small stones but detects hydronephrosis
  - Good for follow-up imaging
  - KUB (kidney-ureter-bladder X-ray) limited utility
  - Only detects radiopaque stones (70-80%: calcium stones visible, uric acid radiolucent)
  - Laboratory evaluation
  - Basic metabolic panel (BUN, creatinine, electrolytes)
  - Complete blood count if concern for infection
  - Stone size and location determines management
  - Less than 5 mm: 90% pass spontaneously
  - 5-10 mm: 50% pass spontaneously
  - Greater than 10 mm: rarely pass, usually require intervention
  - Location: distal ureteral stones more likely to pass than proximal
  - 24-hour urine collection for metabolic evaluation (for recurrent stones or high-risk patients)
  - Urine volume, calcium, oxalate, citrate, uric acid, cystine, sodium, pH
  - Identifies metabolic abnormalities predisposing to stone formation
  - Stone analysis if stone retrieved (identify composition to guide prevention)
treatment:
  - Acute pain management
  - NSAIDs FIRST-LINE (more effective than opioids for renal colic)
  - Ketorolac 30 mg IV or 60 mg IM
  - Ibuprofen 600-800 mg PO every 6-8 hours
  - Reduce ureteral spasm and inflammation
  - Opioids if NSAIDs contraindicated or insufficient
  - Morphine 4-8 mg IV or hydromorphone 0.5-1 mg IV
  - Antiemetics: ondansetron 4-8 mg IV/PO
  - Medical expulsive therapy (MET) for stones 5-10 mm
  - Alpha-blockers (tamsulosin 0.4 mg daily) relax ureteral smooth muscle
  - Increases stone passage rate by 25-30%
  - Particularly effective for distal ureteral stones
  - Nifedipine 30 mg daily alternative
  - Hydration: encourage oral fluids (2-3 L/day)
  - Excessive IV hydration NOT beneficial and may worsen pain
  - Expectant management (watchful waiting) if stone less than 10 mm, no infection, tolerable pain
  - Trial of passage 4-6 weeks with pain control and MET
  - Follow-up imaging to confirm passage
  - Strain urine to capture stone for analysis
  - Urgent intervention indications
  - Obstructing stone with infection (pyonephrosis - sepsis risk, urologic emergency)
  - Bilateral obstructing stones or obstruction in solitary kidney (acute kidney injury)
  - Intractable pain or vomiting despite medications
  - Stone greater than 10 mm unlikely to pass
  - Intervention options
  - Extracorporeal shock wave lithotripsy (ESWL): shock waves fragment stones less than 20 mm
  - Ureteroscopy with laser lithotripsy: endoscopic stone fragmentation, higher success rate than ESWL
  - Percutaneous nephrolithotomy (PCNL): for large stones (greater than 20 mm) or staghorn calculi
  - Stone prevention (for recurrent stone formers)
  - Increase fluid intake (goal urine output 2.5 L/day)
  - Dietary modifications
  - Limit sodium (less than 2300 mg/day)
  - Limit animal protein (less than 1 g/kg/day)
  - Adequate calcium intake (1000-1200 mg/day) - do NOT restrict calcium
  - Limit oxalate-rich foods (spinach, nuts, chocolate, tea)
  - Medications based on stone type and metabolic abnormalities
  - Calcium stones with hypercalciuria: thiazide diuretics (hydrochlorothiazide 25 mg daily)
  - Calcium stones with hypocitraturia: potassium citrate 10-20 mEq twice daily
  - Uric acid stones: potassium citrate (alkalinize urine to pH 6.5-7.0), allopurinol if hyperuricemia
  - Struvite stones: treat underlying infection, may require surgical removal
  - Cystine stones: aggressive hydration, potassium citrate, alpha-mercaptopropionylglycine if refractory
clinical_pearls:
  - "Kidney stones affect 10% of population, lifetime risk 12% in men and 6% in women"
  - "50% recurrence rate within 5-10 years without preventive measures"
  - "Most common stone type: calcium oxalate (80%)"
  - "NSAIDs more effective than opioids for renal colic pain - reduce ureteral inflammation"
  - "Tamsulosin increases stone passage by 25-30% for 5-10 mm stones"
  - "Stone size most important predictor of spontaneous passage: less than 5 mm (90% pass), 5-10 mm (50%), greater than 10 mm (rarely pass)"
  - "Obstructing stone with infection (pyonephrosis) is urologic emergency - requires urgent decompression and antibiotics"
  - "Do NOT restrict dietary calcium - low calcium diet increases stone risk by increasing oxalate absorption"
referrals:
  - Urology urgent consultation if obstructing stone with infection, bilateral obstruction, or intractable symptoms
  - Urology non-urgent referral for stones greater than 10 mm or failure to pass after 4-6 weeks
  - Nephrology for metabolic evaluation and prevention strategies in recurrent stone formers
differentials:
  - Nephrolithiasis (CT shows stone, hematuria common)
  - Pyelonephritis (fever, CVA tenderness, pyuria, no stone on imaging)
  - Renal cell carcinoma (hematuria, flank mass, constitutional symptoms)
  - Abdominal aortic aneurysm (older patients, pulsatile mass, may rupture - emergent)
  - Musculoskeletal pain (reproducible on palpation, no hematuria)
  - Appendicitis (RLQ pain, fever, nausea)
  - Ectopic pregnancy (women of childbearing age, positive pregnancy test)
  - Diverticulitis (LLQ pain, fever, diarrhea)
