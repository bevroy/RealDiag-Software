tree_id: URO-NEPHROLITHIASIS
name: Nephrolithiasis (Kidney Stones)
family: Urology
specialty: Urology
icd10:
- N20.0
snomed:
- 95570007
urgency: medium
description: Comprehensive evaluation and management of Nephrolithiasis (Kidney Stones)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden severe colicky flank pain radiating to groin (follows ureter course)
- Pain comes in waves (colicky), crescendo-decrescendo pattern
- Hematuria (microscopic or gross, 90% of cases)
- Nausea and vomiting (from visceral pain and autonomic response)
- Restlessness, inability to find comfortable position (vs peritonitis where patient
  stays still)
- CVA tenderness on affected side
- 'CT scan: Stone visible, may show hydronephrosis (backup of urine)'
- 'Stone types: Calcium oxalate (80%), uric acid (9%), struvite/infection (10%), cystine
  (1%)'
- 'Stone size predicts passage: <5mm (90% pass), 5-10mm (50% pass), >10mm (unlikely,
  needs intervention)'
- 'Infection stone (struvite): Urease-producing bacteria, staghorn calculus, needs
  removal'
- 'Risk factors: Dehydration, high sodium/protein diet, family history, hyperparathyroidism'
- 'Recurrence: 50% within 5-10 years without prevention strategies'
workup:
- 'CT abdomen/pelvis without contrast (GOLD STANDARD): 95% sensitive, shows stone
  size/location, hydronephrosis'
- 'Ultrasound: If pregnant or avoiding radiation - detects hydronephrosis but misses
  small stones'
- 'UA: Hematuria (90% - if absent, reconsider diagnosis), pH (low <5.5 = uric acid,
  high >7 = struvite), crystals'
- 'Strain urine: Catch stone for analysis (guides prevention)'
- 'Metabolic workup if recurrent: 24-hour urine (calcium, oxalate, citrate, uric acid,
  volume), serum calcium, PTH'
treatment:
- 'Guideline-based treatment options for Nephrolithiasis (Kidney Stones) include:'
- 'Pain control: NSAIDssuperior to opioids. Opioids PRN (morphine 4-8mg IV q2-4h)
  (AUA 2023)'
- 'Antiemetics: Ondansetron 4mg IV/PO (AUA 2023)'
- 'Medical expulsive therapy: Tamsulosin 0.4mg daily - relaxes ureter, increases passage
  rate 30% for 5-10mm stones (AUA 2023)'
- 'Hydration: 2-3 L fluid daily - increases urine volume, flushes stones. No benefit
  to aggressive IV hydration (AUA 2023)'
- 'Urologic intervention: Shock wave lithotripsy, ureteroscopy, or percutaneous nephrolithotomy
  if >10mm, infection, obstruction, failed conservative (AUA 2023)'
clinical_pearls:
- 10-15% lifetime risk - calcium oxalate (80%), calcium phosphate (10%), uric acid
  (9%), struvite (10% - infection stones), cystine (1%)
- 'Stone size predicts passage: <5mm (90% pass spontaneously), 5-10mm (50% pass),
  >10mm (unlikely to pass - needs intervention)'
- 'Renal colic: Colicky flank pain radiating to groin (follows ureter course), patient
  writhing in pain (vs peritonitis where patient still)'
- 'Infection stone (struvite): Urease-producing bacteria (Proteus, Klebsiella), staghorn
  calculus, needs antibiotics + stone removal'
- 'Recurrence: 50% within 5-10 years if no prevention - diet modification and medication
  reduce recurrence 50%'
referrals:
- 'Urology URGENTLY if: Infected obstructed kidney (fever + hydronephrosis = sepsis
  risk), solitary kidney, bilateral obstruction, renal insufficiency, intractable
  pain'
- 'Urology routine if: Stone >10mm, failed passage after 4-6 weeks, patient preference
  for intervention'
differentials: []
