tree_id: GI-IBD-CROHNS
name: Inflammatory Bowel Disease - Crohn's and Ulcerative Colitis
family: GASTROENTEROLOGY
specialty: Gastroenterology
chief_complaint: Abdominal Pain, Diarrhea, Bloody Stools, Weight Loss
description: Comprehensive evaluation and management of IBD
version: "1.0"
author: RealDiag Clinical Team

entry_point: ibd_presentation

nodes:
  - id: ibd_presentation
    type: question
    text: "Type of IBD and severity?"
    options:
      - label: "Acute severe ulcerative colitis (fulminant colitis)"
        next: acute_severe_uc
      - label: "Crohn's disease evaluation or flare"
        next: crohns_disease
      - label: "Ulcerative colitis - mild to moderate"
        next: ulcerative_colitis

  - id: acute_severe_uc
    type: diagnosis
    name: "Acute Severe Ulcerative Colitis"
    icd10: "K51.00"
    urgency: critical
    workup:
      - Truelove and Witts criteria (all 3 required for severe)
      - ≥6 bloody stools per day AND
      - At least 1 of - Fever >37.8°C, HR >90, Hgb <10.5, ESR >30
      - Clinical - Severe bloody diarrhea, abdominal pain, urgency, tenesmus, fever, tachycardia, weight loss
      - Complications to rule out - Toxic megacolon (colon diameter >6 cm on X-ray, systemic toxicity), perforation, massive hemorrhage
      - Labs - CBC (anemia, leukocytosis), CMP (electrolyte abnormalities, hypoalbuminemia), ESR/CRP markedly elevated, fecal calprotectin very high, stool culture and C. diff toxin (rule out infection), CMV PCR if steroid-refractory
      - Abdominal X-ray - Rule out toxic megacolon (colonic distension >6 cm), free air (perforation), thumbprinting (severe edema)
      - CT abdomen/pelvis with IV contrast - If concern for perforation or abscess
      - Flexible sigmoidoscopy - Can assess severity, obtain biopsies, but AVOID in toxic megacolon (perforation risk)
    treatment:
      - Hospital admission, GI consultation
      - NPO initially, IV fluids and electrolyte repletion
      - IV corticosteroids - Methylprednisolone 60mg IV daily or hydrocortisone 100mg IV q8h (preferred, has mineralocorticoid activity)
      - Assess response at 3-5 days
      - Corticosteroid-responsive (60-70%) - Transition to oral prednisone taper, start maintenance therapy (see UC management)
      - Corticosteroid-refractory - Add rescue therapy
      - Infliximab 5 mg/kg IV at 0, 2, 6 weeks (TNF inhibitor) - Response rate 65-70%
      - Cyclosporine 2-4 mg/kg/day IV continuous infusion - Alternative to infliximab, response rate 80%, but high toxicity (nephrotoxicity, seizures, infection), bridge to surgery or thiopurine
      - Colectomy - If no response to medical therapy by 7-10 days, or complications (toxic megacolon, perforation, massive hemorrhage)
      - Total colectomy with end ileostomy or ileal pouch-anal anastomosis (IPAA/J-pouch)
      - Curative for ulcerative colitis (disease limited to colon)
      - Supportive care - Transfuse if Hgb <7, broad-spectrum antibiotics if toxic megacolon or perforation suspected, VTE prophylaxis (high risk), nutritional support
      - Avoid - Opioids (increase toxic megacolon risk), NSAIDs (worsen colitis), colonoscopy (perforation risk in severe colitis)

  - id: crohns_disease
    type: diagnosis
    name: "Crohn's Disease"
    icd10: "K50.90"
    urgency: medium
    workup:
      - Clinical features - Transmural inflammation, skip lesions, can affect anywhere from mouth to anus (most common terminal ileum and colon)
      - Symptoms - Abdominal pain (RLQ if terminal ileum), diarrhea (usually non-bloody), weight loss, fever, perianal disease (fissures, fistulas, abscesses)
      - Extra-intestinal manifestations - Arthritis (peripheral, axial/AS), erythema nodosum, pyoderma gangrenosum, episcleritis/uveitis, primary sclerosing cholangitis, nephrolithiasis
      - Labs - CBC (anemia, thrombocytosis, leukocytosis), CMP (hypoalbuminemia), ESR/CRP elevated, fecal calprotectin >250 mcg/g (inflammation marker), vitamin B12 (malabsorption if terminal ileum involved), iron studies, vitamin D
      - Stool studies - Culture, ova and parasites, C. diff toxin (rule out infection)
      - Ileocolonoscopy with biopsies - Gold standard for diagnosis, assesses location and severity, obtain biopsies (transmural inflammation, non-caseating granulomas 30%, crypt distortion)
      - CT or MRI enterography - Assess small bowel (ileocolonoscopy only sees colon and terminal ileum), look for strictures, fistulas, abscesses, bowel wall thickening
      - Assess disease severity - Harvey-Bradshaw Index or Crohn's Disease Activity Index (CDAI)
    treatment:
      - Mild-moderate disease (outpatient, no complications)
      - Induction - Budesonide 9mg PO daily x 8 weeks (ileal/right colon disease, fewer systemic side effects than prednisone) OR prednisone 40mg daily taper over 8-12 weeks
      - Maintenance - Start at induction
      - Thiopurines - Azathioprine 2-2.5 mg/kg/day or 6-mercaptopurine 1-1.5 mg/kg/day (takes 3-4 months to work, monitor CBC, LFTs, TPMT activity)
      - Methotrexate 25mg SC weekly (alternative if thiopurine intolerant)
      - Moderate-severe disease or failed corticosteroids
      - Biologic therapy (TNF inhibitors first-line)
      - Infliximab 5 mg/kg IV at 0, 2, 6 weeks then q8 weeks OR
      - Adalimumab 160mg SC then 80mg at week 2, then 40mg q2 weeks OR
      - Certolizumab 400mg SC at 0, 2, 4 weeks then 400mg q4 weeks
      - Often combined with thiopurine (synergistic effect, reduces antibody formation)
      - Alternative biologics - Vedolizumab (gut-selective integrin inhibitor, fewer systemic side effects), ustekinumab (IL-12/23 inhibitor)
      - Perianal fistulizing disease - Infliximab or adalimumab (most effective), surgical drainage if abscess, consider seton placement
      - Stricturing disease - Endoscopic balloon dilation if short, surgical resection if symptomatic obstruction
      - Smoking cessation - CRITICAL (smoking worsens Crohn's)
      - Nutritional support - Correct vitamin deficiencies (B12, D, iron), high-calorie diet, enteral nutrition if malnourished
      - Surgery - NOT curative (disease recurs), indicated for complications (obstruction, perforation, abscess, fistula not responding to medical therapy)
      - Ileocecal resection most common
      - Postoperative recurrence common (60-70% at 10 years)

  - id: ulcerative_colitis
    type: diagnosis
    name: "Ulcerative Colitis - Mild to Moderate"
    icd10: "K51.90"
    urgency: medium
    workup:
      - Clinical features - Continuous inflammation starting in rectum, extends proximally, superficial mucosal disease (not transmural)
      - Extent - Proctitis (rectum only), left-sided (up to splenic flexure), extensive/pancolitis (entire colon)
      - Symptoms - Bloody diarrhea, urgency, tenesmus, crampy abdominal pain
      - Labs - Same as severe UC (CBC, CMP, ESR/CRP, fecal calprotectin, stool studies)
      - Colonoscopy - Continuous mucosal inflammation, loss of vascular pattern, friability, ulcerations, pseudopolyps
      - Assess severity - Truelove and Witts or Mayo score
    treatment:
      - Treatment based on extent and severity
      - Proctitis (disease limited to rectum)
      - Mesalamine suppository 1000mg PR QHS OR mesalamine enema 4g PR QHS
      - Very effective for distal disease
      - Left-sided colitis
      - Mesalamine enema 4g PR QHS + oral mesalamine 2.4-4.8g daily
      - Extensive colitis/pancolitis - Mild to moderate
      - Oral mesalamine (5-ASA) 2.4-4.8g daily (divided BID-TID) - Delayed-release formulations (Asacol, Lialda, Pentasa)
      - Corticosteroid taper if moderate symptoms (prednisone 40mg daily taper over 8-12 weeks)
      - Maintenance therapy (prevent relapse after induction)
      - Continue mesalamine indefinitely
      - Thiopurines (azathioprine, 6-MP) - If frequent relapses or steroid-dependent
      - Biologic therapy - If refractory to mesalamine and steroids, or steroid-dependent
      - TNF inhibitors - Infliximab, adalimumab, golimumab
      - Vedolizumab - Gut-selective, good safety profile
      - Tofacitinib - JAK inhibitor, oral
      - Colectomy - Curative, indications: refractory disease, dysplasia/cancer, acute severe colitis not responding to medical therapy
      - Surveillance - Colonoscopy q1-2 years after 8-10 years of disease (cancer risk increases with duration and extent)
      - Extra-intestinal manifestations - Treat underlying IBD, some respond to IBD therapy, some independent (PSC)
