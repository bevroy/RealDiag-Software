tree_id: GI-GASTROPARESIS
name: Gastroparesis
family: gastroenterology
specialty: Gastroenterology
icd10: K31.84
snomed: 235675006
urgency: []
homeopathy: []
presentations:
  - Nausea and vomiting (often postprandial)
  - Early satiety and postprandial fullness
  - Bloating and abdominal distension
  - Epigastric or upper abdominal discomfort
  - Unintentional weight loss
  - Poor glycemic control in diabetic patients
  - Vomiting of undigested food hours after eating
  - Symptoms worse with high-fat, high-fiber meals
  - Known risk factors: diabetes, prior gastric surgery, neurologic disorders
workup:
  - Upper endoscopy (EGD) to rule out mechanical obstruction
  - Look for gastric outlet obstruction, peptic ulcer, mass, bezoar
  - Retained food in stomach after 8-12 hour fast suggests gastroparesis
  - Gastric emptying study (scintigraphy) - diagnostic gold standard
  - Radiolabeled meal (solid phase), imaging at 0, 1, 2, 4 hours
  - Delayed emptying: greater than 10% retention at 4 hours (or greater than 60% at 2 hours, greater than 35% at 3 hours)
  - Must be off prokinetics and medications that slow motility for 48-72 hours
  - Alternative tests if scintigraphy unavailable
  - Wireless motility capsule (SmartPill) - measures gastric emptying time
  - Gastric emptying breath test (stable isotope)
  - Laboratory tests: HbA1c (diabetes), thyroid function, electrolytes (especially if vomiting)
  - Rule out rumination syndrome, cannabinoid hyperemesis, cyclic vomiting syndrome
treatment:
  - Dietary modifications (first-line)
  - Small, frequent meals (5-6 per day)
  - Low-fat diet (<50 g/day), low-fiber diet
  - Puree or liquid diet if severe symptoms
  - Avoid carbonated beverages and alcohol
  - Optimize glycemic control in diabetics (HbA1c <7%)
  - Prokinetic medications
  - Metoclopramide 5-10 mg PO TID-QID before meals (FDA black box warning - tardive dyskinesia)
  - Use lowest effective dose, limit duration <12 weeks if possible
  - Domperidone 10-20 mg TID-QID (available through FDA expanded access, less CNS effects)
  - Antiemetics
  - Ondansetron 4-8 mg TID, promethazine 12.5-25 mg TID-QID
  - Mirtazapine 7.5-15 mg at bedtime (antidepressant with antiemetic properties)
  - Advanced therapies for refractory cases
  - Gastric electrical stimulation (Enterra device) - reduces nausea and vomiting
  - Pyloroplasty or pyloric botulinum toxin injection (limited evidence)
  - Jejunal feeding tube if severe malnutrition
  - Hospitalization for refractory symptoms: IV fluids, electrolyte repletion, TPN if needed
clinical_pearls:
  - "Most common causes: diabetes (30%), idiopathic (35%), post-surgical (10-15%)"
  - "Diabetic gastroparesis more common with long-standing diabetes and neuropathy"
  - "Symptoms often fluctuate - good days and bad days"
  - "Metoclopramide most effective prokinetic but risk of tardive dyskinesia limits use"
  - "Gastric emptying study must be done off prokinetics to be accurate"
  - "Bezoars (food accumulation in stomach) can occur - treat with endoscopic fragmentation or surgery"
  - "Cannabinoid hyperemesis syndrome mimics gastroparesis - history of chronic marijuana use, relief with hot showers"
  - "Cyclic vomiting syndrome: episodic, stereotypical episodes with well periods in between"
referrals:
  - Gastroenterology for diagnostic evaluation and management
  - Endocrinology if diabetic for optimal glucose control
  - Dietitian for meal planning and nutritional counseling
  - Advanced gastroenterology or surgery center if considering gastric electrical stimulation
differentials:
  - Gastroparesis (delayed gastric emptying on testing)
  - Gastric outlet obstruction (mechanical obstruction on endoscopy)
  - Peptic ulcer disease (especially pyloric channel ulcer)
  - Functional dyspepsia (normal gastric emptying study)
  - Cyclic vomiting syndrome (episodic, stereotypical attacks)
  - Cannabinoid hyperemesis syndrome (chronic marijuana use, relief with hot showers)
  - Rumination syndrome (effortless regurgitation, behavioral component)
  - Superior mesenteric artery syndrome (postprandial vomiting, weight loss)
  - Chronic pancreatitis (epigastric pain, pancreatic insufficiency)
  - Eating disorder (bulimia, anorexia nervosa)
trace:
  source: ACG Clinical Guidelines on Gastroparesis 2013, AGA Medical Position Statement on Gastroparesis
