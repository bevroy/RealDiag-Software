tree_id: PEDS-DEVELOPMENTAL-DELAY
name: Developmental Delay (Encounter)
family: pediatrics
specialty: Pediatrics/Developmental-Behavioral Pediatrics
icd10: F88
snomed: 229740001
urgency:
  - Loss of previously acquired developmental milestones (regression)
  - Seizure activity or signs of neurologic deterioration
  - Severe hypotonia (floppy infant) or hypertonia
  - Microcephaly with deceleration of head growth
  - Failure to thrive with developmental delay
homeopathy: []
presentations:
  - Delay in achieving developmental milestones
  - Not meeting age-appropriate gross motor milestones (sitting, crawling, walking)
  - Delayed fine motor skills (reaching, grasping, self-feeding)
  - Speech and language delay (not babbling, no words by 18 months, limited vocabulary)
  - Social-emotional delay (poor eye contact, not responding to name, limited social interaction)
  - Cognitive delay (problem-solving, play skills)
  - Parental concerns about development (always take seriously)
  - Teacher or daycare provider concerns
  - Regression or loss of skills (concerning for neurodegenerative disorder or autism)
  - Asymmetric motor development (concerning for cerebral palsy or hemiparesis)
  - Family history of developmental delays, intellectual disability, genetic syndromes
workup:
  - Developmental screening and surveillance
  - Routine developmental screening at well-child visits (9, 18, 24, 30 months per AAP)
  - Standardized screening tools
  - Ages and Stages Questionnaire (ASQ-3)
  - Parents' Evaluation of Developmental Status (PEDS)
  - Denver Developmental Screening Test (Denver II)
  - Modified Checklist for Autism in Toddlers (M-CHAT-R/F) at 18 and 24 months
  - Surveillance at every well-child visit (birth to age 5 years)
  - Elicit parental concerns
  - Review developmental milestones achieved
  - Observe child's development during visit
  - Identify risk factors
  - Developmental milestones by age (key red flags)
  - 2 months: not smiling socially, no tracking with eyes
  - 4 months: no cooing, not bringing hands to mouth, not holding head steady
  - 6 months: not rolling over, poor head control, no babbling
  - 9 months: not sitting independently, no stranger anxiety, not bearing weight on legs
  - 12 months: not crawling, no babbling ("mama" "dada"), not responding to name
  - 15 months: not walking, no single words, not pointing to show interest
  - 18 months: not walking well, fewer than 6 words, not imitating actions
  - 24 months: not running, no 2-word phrases, fewer than 50 words
  - 36 months: not speaking in sentences, frequent falling, cannot jump, not toilet training
  - Global delay: delay in 2 or more domains (motor, language, cognitive, social-emotional)
  - Clinical history
  - Detailed developmental history
  - Age at which milestones achieved (sitting, crawling, walking, first words, phrases)
  - Current abilities in each domain (gross motor, fine motor, language, social-emotional, cognitive)
  - Regression or loss of skills (red flag for autism or neurodegenerative disorder)
  - Prenatal and perinatal history
  - Maternal infections during pregnancy (TORCH)
  - Alcohol or drug exposure in utero (fetal alcohol syndrome)
  - Prematurity (gestational age, birth weight) - adjust milestones for prematurity until age 2 years
  - Birth complications (hypoxia, HIE, ICH, NICU stay)
  - Past medical history
  - Seizures, neurologic problems
  - Hearing or vision problems
  - Chronic medical conditions
  - Hospitalizations or surgeries
  - Growth history (failure to thrive suggests underlying syndrome or metabolic disorder)
  - Feeding difficulties (may indicate oral-motor dysfunction, aspiration)
  - Family history
  - Developmental delays, intellectual disability
  - Autism, ADHD, learning disabilities
  - Genetic syndromes, consanguinity
  - Social history
  - Home environment, primary language
  - Daycare or school attendance
  - Exposure to lead or toxins
  - Neglect or abuse concerns
  - Access to stimulation and learning opportunities
  - Physical examination
  - Growth parameters (height, weight, head circumference) - plot on growth charts
  - Microcephaly or macrocephaly (genetic syndromes, brain malformations)
  - Failure to thrive (metabolic disorder, syndrome, neglect)
  - Dysmorphic features (genetic syndromes)
  - Facial features (Down syndrome, fetal alcohol syndrome, fragile X)
  - Ear anomalies, cleft palate
  - Single palmar crease, clinodactyly
  - Skin examination (neurocutaneous disorders)
  - Café-au-lait spots (neurofibromatosis)
  - Ash-leaf spots or shagreen patches (tuberous sclerosis)
  - Port-wine stain (Sturge-Weber syndrome)
  - Comprehensive neurologic examination
  - Mental status and behavior
  - Cranial nerves
  - Motor: tone (hypotonia versus hypertonia), strength, symmetry
  - Asymmetric motor findings suggest cerebral palsy or structural lesion
  - Deep tendon reflexes (hyperreflexia suggests upper motor neuron lesion)
  - Primitive reflexes (persistence beyond expected age)
  - Coordination and gait (if walking)
  - Ophthalmologic examination
  - Red reflex (cataracts, retinoblastoma)
  - Strabismus (may indicate neurologic problem)
  - Hearing assessment (critical - hearing loss major cause of speech delay)
  - Behavioral observation during visit
  - Eye contact, social engagement, response to name
  - Play skills, attention span
  - Language use and comprehension
  - Diagnostic evaluation
  - Hearing evaluation (ESSENTIAL for any speech delay)
  - Audiology referral for comprehensive hearing test
  - Otoacoustic emissions (OAE) or auditory brainstem response (ABR)
  - Rule out sensorineural or conductive hearing loss
  - Vision evaluation (if concerns for visual impairment)
  - Ophthalmology referral
  - Lead screening (if risk factors or not previously screened)
  - Venous lead level (capillary screening may have false positives)
  - Elevated lead associated with developmental and cognitive delays
  - Thyroid function tests (TSH, free T4)
  - Hypothyroidism causes global delay, hypotonia, constipation
  - Genetic testing (if dysmorphic features, family history, or unexplained global delay)
  - Chromosomal microarray (first-line genetic test) - detects copy number variants
  - Fragile X testing (especially boys with ID, autism features, large ears/head)
  - Specific gene testing if clinical suspicion (e.g., Rett syndrome - MECP2)
  - Whole exome sequencing if microarray negative and strong suspicion
  - Metabolic screening (if concerning features: regression, seizures, hepatomegaly, dysmorphic)
  - Plasma amino acids, urine organic acids
  - Lactate, pyruvate, ammonia
  - Very long chain fatty acids, lysosomal enzymes
  - Neuroimaging (MRI brain)
  - Indications: microcephaly, macrocephaly, focal neurologic signs, regression, seizures
  - NOT routinely indicated for isolated mild speech delay or isolated mild motor delay
  - EEG (if seizures or regression)
  - Creatine kinase (if hypotonia and concern for muscular dystrophy)
  - Karyotype (if dysmorphic features and microarray negative)
treatment:
  - Early intervention services (CRITICAL - evidence-based)
  - Federal law (IDEA Part C) mandates early intervention for children birth to age 3 years with developmental delays
  - Referral to state early intervention program
  - Contact local program (varies by state)
  - Eligibility evaluation (typically within 45 days)
  - No physician order required - parents can self-refer
  - Services provided in natural environment (home-based preferred)
  - Comprehensive evaluation by multidisciplinary team
  - Individualized Family Service Plan (IFSP) developed
  - Early intervention therapies
  - Physical therapy (PT) - gross motor delays
  - Occupational therapy (OT) - fine motor, self-care, sensory processing
  - Speech-language therapy (SLP) - language delay, articulation, oral-motor skills
  - Developmental therapy or special instruction
  - Intensity based on degree of delay (weekly or more frequent)
  - Family-centered, coaching parents
  - School-age services (age 3 years and older)
  - Transition from early intervention to preschool special education at age 3
  - Individualized Education Program (IEP) through school district
  - Free appropriate public education (FAPE) in least restrictive environment
  - Specialty referrals based on etiology
  - Developmental-behavioral pediatrics
  - Comprehensive developmental evaluation
  - Diagnostic clarification (autism, ADHD, intellectual disability)
  - Management and care coordination
  - Pediatric neurology
  - If seizures, regression, abnormal neurologic exam, or microcephaly/macrocephaly
  - Genetic counseling and clinical genetics
  - If dysmorphic features, family history, unexplained global delay
  - Interpretation of genetic testing results
  - Audiology (hearing evaluation for speech delay)
  - Ophthalmology (vision evaluation if concerns)
  - Medical management of underlying condition
  - Treat identified causes (hypothyroidism, lead poisoning, hearing loss)
  - Manage associated conditions (seizures, spasticity, feeding problems)
  - Nutritional support if feeding difficulties or failure to thrive
  - Addressing social determinants of health
  - If environmental deprivation or neglect suspected
  - Social work referral, home visiting programs, parent education
  - Optimize home learning environment
  - Encourage parent-child interaction, reading, play
  - Monitoring and follow-up
  - Regular developmental monitoring at well-child visits
  - Reassess milestones, response to interventions
  - Re-screen with standardized tools
  - Communication with early intervention providers and therapists
  - Adjust therapy intensity and goals as needed
clinical_pearls:
  - 'Take parental concerns seriously - parents are often first to recognize developmental delays, sensitivity of parental concern 70-80%'
  - 'Early intervention services (birth to age 3) are evidence-based, improve outcomes - refer early, do not "wait and see"'
  - 'Hearing evaluation ESSENTIAL for any child with speech delay - rule out hearing loss first'
  - 'Adjust milestones for prematurity until age 2 years (use corrected age for ex-preemies)'
  - 'Global delay (2 or more domains) warrants comprehensive evaluation including genetic testing (chromosomal microarray first-line)'
  - 'Loss of developmental milestones (regression) is RED FLAG - evaluate urgently for neurodegenerative disorder, autism, seizures'
  - 'Isolated mild speech delay in 18-24 month old with normal hearing and comprehension often resolves with speech therapy - "late talker"'
  - 'Refer to early intervention even while pursuing diagnostic workup - do not delay therapy waiting for diagnosis'
referrals:
  - Early intervention program (birth to age 3 years) - ALL children with developmental delays
  - Developmental-behavioral pediatrics for comprehensive developmental evaluation and diagnostic clarification
  - Pediatric neurology if abnormal neurologic exam, seizures, regression, micro/macrocephaly, hypotonia/hypertonia
  - Audiology for comprehensive hearing evaluation (ESSENTIAL for speech delay)
  - Genetics and genetic counseling if dysmorphic features, family history, unexplained global delay
  - Ophthalmology if vision concerns or abnormal eye exam
differentials:
  - Global developmental delay (delay in 2 or more domains) - genetic syndromes, chromosomal abnormalities, brain malformations
  - Intellectual disability (if age greater than 5 years, global delay persists, IQ less than 70)
  - Cerebral palsy (motor delay, abnormal tone, hyperreflexia, history of perinatal brain injury)
  - Autism spectrum disorder (social-communication delay, restricted interests, regression possible)
  - Isolated speech delay ("late talker") - language delay only, normal hearing and cognition, family history
  - Hearing loss (sensorineural or conductive) - speech delay, not responding to name
  - Environmental deprivation or neglect (lack of stimulation, inadequate parent-child interaction)
  - Prematurity (correct age for prematurity until age 2 years)
  - Genetic syndromes: Down syndrome, fragile X, Rett syndrome, Angelman, Prader-Willi
  - Neurodegenerative disorders (regression, loss of skills) - leukodystrophies, mitochondrial, lysosomal storage
