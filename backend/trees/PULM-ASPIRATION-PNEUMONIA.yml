tree_id: PULM-ASPIRATION-PNEUMONIA
name: Aspiration Pneumonia
family: pulmonology
specialty: Pulmonology
icd10: J69.0
snomed: 233607000
urgency: high
homeopathy: []
presentations:
  - Witnessed aspiration event or risk factors for aspiration
  - Cough (may be productive with foul-smelling sputum)
  - Fever and chills
  - Dyspnea
  - Pleuritic chest pain
  - Tachypnea and tachycardia
  - Hypoxemia
  - Crackles or bronchial breath sounds on auscultation
  - Risk factors - dysphagia, stroke, seizure, altered mental status, alcohol intoxication, sedation, general anesthesia, mechanical ventilation, GERD, poor dentition
  - Insidious onset over days (vs sudden aspiration event)
workup:
  - Chest X-ray (first-line imaging)
  - Infiltrate typically in dependent lung segments
  - Right lower lobe most common (right mainstem bronchus more vertical)
  - Superior segments of lower lobes or posterior segments of upper lobes if supine aspiration
  - May show cavitation or abscess formation
  - Pulse oximetry and arterial blood gas if hypoxemia
  - CBC with differential - leukocytosis
  - Basic metabolic panel - assess for renal function, electrolytes
  - Blood cultures x2 if sepsis or hospitalized patient
  - Sputum culture (limited utility due to oral flora contamination)
  - CT chest if diagnosis uncertain, concern for abscess, or empyema
  - Swallow evaluation (speech pathology) to assess aspiration risk
  - Video fluoroscopic swallow study or fiberoptic endoscopic evaluation of swallowing (FEES)
  - Consider bronchoscopy if foreign body suspected or recurrent aspiration
treatment:
  - Antibiotic selection based on community vs healthcare setting and severity
  - Community-acquired aspiration pneumonia
  - Ampicillin-sulbactam 3g IV q6h (covers anaerobes + streptococci)
  - Amoxicillin-clavulanate 875mg PO BID (outpatient)
  - Clindamycin 600mg IV/PO q8h (alternative, excellent anaerobic coverage)
  - Moxifloxacin 400mg PO/IV daily (alternative)
  - Healthcare-associated or hospital-acquired aspiration pneumonia
  - Cover for MRSA and Pseudomonas
  - Vancomycin 15mg/kg IV q12h + piperacillin-tazobactam 4.5g IV q6h
  - Or vancomycin + cefepime 2g IV q8h
  - Adjust based on local antibiogram and patient risk factors
  - Supportive care
  - Oxygen to maintain SpO2 >90%
  - IV fluids for hydration
  - Chest physiotherapy
  - Elevate head of bed 30-45 degrees
  - NPO if severe dysphagia until swallow evaluation
  - Treatment of underlying predisposing condition
  - Aspiration precautions - thickened liquids, pureed diet, supervised meals
  - PPI for GERD
  - Dental care for poor dentition
  - Duration - typically 7-10 days (longer if abscess or slow response)
clinical_pearls:
  - Aspiration syndromes spectrum - chemical pneumonitis (Mendelson syndrome), bacterial aspiration pneumonia, airway obstruction
  - Chemical pneumonitis from gastric acid causes acute respiratory distress (ARDS-like) without infection
  - Bacterial aspiration pneumonia develops over days with mixed oral flora (anaerobes + aerobes)
  - Anaerobic organisms - Peptostreptococcus, Prevotella, Bacteroides, Fusobacterium
  - Foul-smelling or putrid sputum suggests anaerobic infection
  - Cavitation and lung abscess more common than typical CAP
  - High mortality in elderly and institutionalized patients (20-30%)
  - Silent aspiration common in stroke patients (50% aspirate, only 25% cough)
  - Repeat imaging at 6 weeks to ensure resolution and rule out underlying malignancy
  - Prevention key - swallow evaluation, aspiration precautions, treat underlying cause
referrals:
  - Pulmonology for lung abscess, empyema, or recurrent aspiration
  - Speech pathology for swallow evaluation and therapy
  - Gastroenterology for severe GERD requiring advanced management
  - ENT for structural abnormalities or Zenker diverticulum
  - Surgery if lung abscess requires drainage or empyema needs decortication
differentials:
  - Bacterial aspiration pneumonia
  - Chemical pneumonitis (Mendelson syndrome) - acute, sterile, ARDS-like
  - Community-acquired pneumonia (typical or atypical)
  - Lung abscess (cavitation on imaging)
  - Empyema (pleural fluid infection)
  - Bronchiectasis with recurrent infections
  - Achalasia or esophageal motility disorder
  - Tracheoesophageal fistula
