tree_id: OBGYN-POLYCYSTIC-OVARY-SYNDROME
name: Polycystic Ovary Syndrome
family: Obstetrics and Gynecology
specialty: Endocrinology
chief_complaint: Irregular periods and hirsutism
description: Most common endocrine disorder in reproductive-age women causing irregular ovulation, hyperandrogenism, and metabolic dysfunction. Lifestyle modification, combined oral contraceptives, and metformin improve symptoms and reduce long-term complications.
icd10: E28.2
urgency: non-urgent

workup:
  - Clinical diagnosis (Rotterdam criteria - need 2 of 3): (1) oligo-ovulation or anovulation (irregular periods >35 days apart or <8 per year), (2) hyperandrogenism clinical (hirsutism, acne) or biochemical (elevated testosterone), (3) polycystic ovaries on ultrasound
  - Labs: total testosterone (mildly elevated 50-150), DHEAS, free testosterone, 17-hydroxyprogesterone (rule out nonclassic CAH)
  - Rule out other causes: TSH (thyroid dysfunction), prolactin (hyperprolactinemia), 17-OHP early morning (nonclassic congenital adrenal hyperplasia if >200)
  - Metabolic screening: fasting glucose and insulin (insulin resistance common), lipid panel, oral glucose tolerance test if prediabetes suspected
  - Pelvic ultrasound: polycystic ovaries (≥12 follicles 2-9 mm per ovary or ovarian volume >10 mL) - not required if other criteria met
  - Screen for complications: HbA1c (increased diabetes risk), BP (hypertension risk), depression screening

treatment:
  - Lifestyle modification (first-line): weight loss 5-10% improves ovulation, insulin sensitivity, and symptoms (most important intervention)
  - Combined oral contraceptives (if not desiring pregnancy): regulate cycles, reduce androgens, prevent endometrial hyperplasia (from unopposed estrogen)
  - Antiandrogens: spironolactone 50-200 mg daily for hirsutism (takes 6 months for effect, must use contraception - teratogenic)
  - Metformin 1500-2000 mg daily: improves insulin resistance, may restore ovulation, reduces diabetes risk
  - Topical therapy for hirsutism: eflornithine cream, laser hair removal, electrolysis
  - Infertility treatment: letrozole 2.5-7.5 mg days 3-7 (first-line ovulation induction, superior to clomiphene), or clomiphene 50-150 mg days 3-7
  - If clomiphene resistance: add metformin, or gonadotropin injections, or IVF
  - Endometrial protection: if not on OCPs and amenorrheic, give progestin withdrawal (medroxyprogesterone 10 mg x10 days) every 3 months to prevent endometrial hyperplasia
  - Acne treatment: topical retinoids, OCPs, spironolactone
  - Screen for complications: glucose intolerance annually, lipids every 2 years, endometrial cancer screening if abnormal bleeding

clinical_pearls:
  - Rotterdam criteria: 2 of 3 (oligo-ovulation, hyperandrogenism, polycystic ovaries)
  - Weight loss 5-10% most effective treatment - improves ovulation and metabolic profile
  - OCPs first-line if not desiring pregnancy - regulate cycles and reduce androgens
  - Spironolactone for hirsutism takes 6 months, must use contraception (teratogenic)
  - Letrozole first-line for ovulation induction (superior to clomiphene)
  - Metformin improves insulin resistance and may restore ovulation
  - Increased risk diabetes, endometrial cancer, cardiovascular disease - screening important
  - If amenorrheic give progestin withdrawal every 3 months to prevent endometrial hyperplasia

differentials:
  - Thyroid dysfunction: check TSH (hypothyroidism causes irregular cycles)
  - Hyperprolactinemia: check prolactin (pituitary adenoma causes amenorrhea and galactorrhea)
  - Nonclassic congenital adrenal hyperplasia: elevated 17-OHP >200, more severe virilization
  - Cushing syndrome: central obesity, striae, moon facies, proximal weakness

trace: |
  A 24-year-old woman presented with irregular periods since menarche (cycles 45-90 days apart), hirsutism (facial hair requiring shaving, Ferriman-Gallwey score 14), acne, and inability to conceive after 14 months. BMI 32 (obese). Labs showed total testosterone 68 (mildly elevated), TSH 2.1 (normal), prolactin 12 (normal), 17-OHP 80 (normal). Fasting glucose 104 (impaired), fasting insulin 28 (elevated - insulin resistance), lipids normal. Transvaginal ultrasound showed bilateral polycystic ovaries (right ovary 18 follicles, left 15 follicles). Met Rotterdam criteria for PCOS (oligo-ovulation + hyperandrogenism + polycystic ovaries). Counseled extensively on lifestyle modification - diet and exercise for weight loss. Started metformin 500 mg daily, titrated to 1000 mg BID over 3 weeks. At 3 months lost 12 pounds (5% weight loss), started having spontaneous periods every 35-40 days. Added letrozole 5 mg days 3-7 for ovulation induction. At 5 months conceived naturally. Successful pregnancy and delivery. Postpartum restarted OCPs (drospirenone/ethinyl estradiol) for cycle regulation and started spironolactone 100 mg daily for persistent hirsutism. At 12 months postpartum weight maintained, cycles regular on OCPs, hirsutism significantly improved, acne resolved.
