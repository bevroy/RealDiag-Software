tree_id: INFECTIOUS-HIV-AIDS
name: HIV/AIDS
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: HIV positive status or AIDS-defining illness
description: |
  Chronic viral infection causing progressive immunodeficiency by depleting CD4 T-cells. AIDS defined as CD4 count less than 200 or AIDS-defining opportunistic infection.
  Transmitted through sexual contact, blood exposure, vertical transmission. Antiretroviral therapy (ART) suppresses viral replication, restores immune function, prevents transmission.
icd10: B20
urgency: High
workup:
  - HIV screening - 4th generation antigen/antibody test (detects HIV-1/2 antibodies and p24 antigen)
  - Positive screening confirmed with HIV-1/HIV-2 differentiation immunoassay
  - If acute HIV suspected (negative antibody but high-risk exposure) - HIV RNA viral load (detects virus before antibody seroconversion)
  - Baseline CD4 count and CD4 percentage - normal greater than 500 cells/mcL, AIDS defined as less than 200
  - HIV RNA viral load (copies/mL) - assess disease progression and treatment response
  - Resistance testing (genotype) before starting ART - identifies transmitted drug resistance
  - HLA-B5701 testing before abacavir (hypersensitivity reaction if positive)
  - Screening for coinfections - hepatitis A, B, C serology (vaccinate if not immune), syphilis (RPR), tuberculosis (QuantiFERON or PPD), toxoplasma IgG
  - Baseline labs - CBC, CMP, lipids, urinalysis, pregnancy test in women
  - Screen for opportunistic infections if CD4 less than 200 - chest X-ray
treatment:
  - Start ART immediately regardless of CD4 count (treat all HIV-positive patients)
  - Integrase strand transfer inhibitor (INSTI) based regimen preferred - two nucleoside reverse transcriptase inhibitors (NRTIs) plus INSTI
  - Biktarvy (bictegravir/tenofovir alafenamide/emtricitabine) one tablet daily - highly effective, well-tolerated, high barrier to resistance
  - Alternative regimens - dolutegravir/abacavir/lamivudine, dolutegravir plus tenofovir/emtricitabine
  - Goals - undetectable viral load (less than 20-50 copies/mL) within 6 months, maintain suppression
  - Monitor viral load at 4-8 weeks, then every 3-6 months; CD4 count every 3-6 months
  - Adherence critical - greater than 95% adherence needed to prevent resistance
  - Opportunistic infection prophylaxis based on CD4 count
  - CD4 less than 200 - TMP-SMX DS daily (Pneumocystis and Toxoplasma prophylaxis), alternative dapsone 100mg daily or atovaquone 1500mg daily
  - CD4 less than 50 - add azithromycin 1200mg weekly (MAC prophylaxis)
  - Can discontinue prophylaxis when CD4 greater than 200 x 3 months on ART (immune reconstitution)
  - Vaccinations - pneumococcal, hepatitis A/B (if not immune), influenza annual, Tdap, HPV (if age appropriate)
  - Screen for complications - cardiovascular disease, bone density, kidney function, malignancies
  - U=U (Undetectable equals Untransmittable) - viral suppression prevents sexual transmission
  - Pre-exposure prophylaxis (PrEP) for HIV-negative high-risk individuals - tenofovir/emtricitabine daily or cabotegravir 600mg IM q2 months
clinical_pearls:
  - Acute HIV syndrome (2-4 weeks post-exposure) - fever, pharyngitis, rash, lymphadenopathy, often mistaken for mononucleosis
  - Window period (eclipse phase) - first 10-14 days after infection, even RNA may be negative
  - AIDS-defining illnesses - PCP, CMV retinitis, disseminated MAC, cryptococcal meningitis, toxoplasma encephalitis, Kaposi sarcoma, CNS lymphoma, progressive multifocal leukoencephalopathy, esophageal candidiasis
  - Immune reconstitution inflammatory syndrome (IRIS) - paradoxical worsening when starting ART due to restored immune response
  - Drug interactions common - check before prescribing new medications (protease inhibitors major CYP interactions)
  - Aging HIV population - increased cardiovascular disease, malignancies, neurocognitive disorders
differentials:
  - Mononucleosis (acute HIV)
  - Viral syndrome
  - Secondary syphilis
  - Drug reaction
  - Lymphoma (if lymphadenopathy)
trace:
  - 32-year-old man presents with fever, sore throat, rash x 1 week → Reports unprotected sex 3 weeks ago → Exam shows diffuse maculopapular rash, pharyngitis, generalized lymphadenopathy → 4th generation HIV test positive → HIV RNA 850000 copies/mL, CD4 480 cells/mcL → HIV-1/2 differentiation confirms HIV-1 → Diagnose acute HIV infection → Resistance testing shows no mutations → HLA-B5701 negative, hepatitis B and C negative (vaccinate for hep A and B), RPR negative, QuantiFERON negative → Start bictegravir/tenofovir/emtricitabine (Biktarvy) one tablet daily → Counsel on adherence, safe sex, U=U concept → Viral load undetectable at 8 weeks → CD4 increases to 650 at 6 months → Continue ART lifelong, excellent adherence and viral suppression maintained
