presentations:
  - Persistent headache (tension-type or migraine-like)
  - Dizziness or balance problems
  - Cognitive difficulties (memory, concentration, processing speed)
  - Fatigue and low energy
  - Sleep disturbance (insomnia or hypersomnia)
  - Sensitivity to light (photophobia) or noise (phonophobia)
  - Irritability or mood changes
  - Anxiety or depression
  - Blurred vision or visual disturbances
  - Tinnitus (ringing in ears)
  - Symptoms lasting beyond 3 months post-injury

workup:
  - Diagnostic criteria (ICD-10): history of head trauma with loss of consciousness, amnesia, or disorientation, three or more symptoms from list (headache, dizziness, fatigue, irritability, insomnia, concentration/memory difficulty, intolerance of stress/emotion/alcohol), symptoms persist for more than 3 months after injury, symptoms cause significant impairment in functioning
  - Acute concussion history: mechanism of injury (sports, motor vehicle accident, fall, assault), loss of consciousness (if so, duration - typically seconds to minutes in concussion), post-traumatic amnesia (retrograde or anterograde), confusion or disorientation at time of injury, initial symptoms (immediate headache, dizziness, nausea common)
  - Timing: typical concussion recovery 7-14 days (80-90 percent recover within 2 weeks), post-concussion syndrome diagnosed when symptoms persist beyond 3 months (some use 1 month threshold), earlier intervention may prevent chronicity
  - Symptom assessment: use validated tool (Post-Concussion Symptom Scale - PCSS, Rivermead Post-Concussion Symptoms Questionnaire), assess severity and impact on daily function, track symptoms over time (improvement vs persistent)
  - Cognitive testing: neuropsychological evaluation (computerized testing like ImPACT or formal neuropsych battery), assess domains (processing speed, reaction time, memory, attention), compare to baseline if available (athletes often have pre-injury baseline), identify specific deficits for targeted rehabilitation
  - Vestibular/balance assessment: Vestibular Ocular Motor Screening (VOMS), Balance Error Scoring System (BESS), cervical range of motion, assess for benign paroxysmal positional vertigo (BPPV - Dix-Hallpike test), assess for vestibular dysfunction (may need vestibular therapy)
  - Vision assessment: assess convergence, accommodation, smooth pursuits, saccades, visual motion sensitivity (many post-concussion patients have vision dysfunction)
  - Screen for comorbidities: depression screening (PHQ-9 - very common in PCS 20-40 percent), anxiety screening (GAD-7), PTSD screening if traumatic event (PCL-5), pre-existing conditions (prior concussions, migraines, ADHD, depression/anxiety - risk factors for prolonged recovery)
  - Cervical spine evaluation: assess for whiplash-associated disorder (often concurrent with concussion), cervical range of motion, tenderness, muscle spasm, cervicogenic headache may complicate PCS
  - Neuroimaging usually normal: CT head acutely if high-risk features (rule out bleed, skull fracture), MRI brain if persistent symptoms or neurologic deficits (may show microhemorrhages on gradient echo or SWI sequences, but often normal), normal imaging does not rule out PCS (concussion is functional injury not structural)
  - Rule out alternative diagnoses: medication overuse headache (if frequent analgesic use), sleep apnea (if severe fatigue, snoring), mood disorder (primary depression/anxiety vs secondary to PCS), vestibular migraine, cervicogenic headache

treatment:
  - Education and reassurance: explain post-concussion syndrome (real condition, not imagining symptoms), prognosis (majority improve over 3-12 months with treatment, though some have persistent symptoms), validate symptoms (believing patient critical - symptoms real even if imaging normal), gradual return to activity important (not complete rest)
  - Initial rest period (acute phase 24-48 hours): relative cognitive and physical rest (limit screen time, reading, strenuous activity), then gradual return to activity as tolerated (complete rest beyond 48 hours may worsen outcomes)
  - Graduated return to activity: start with light aerobic exercise below symptom threshold (walking, stationary bike 10-20 minutes at 60-70 percent max HR), gradually increase intensity if no symptom exacerbation, Buffalo Concussion Treadmill Test protocol (determine exercise threshold), sub-symptom threshold exercise may speed recovery
  - Targeted symptom management: headache (treat as migraine if throbbing unilateral with nausea/photophobia - sumatriptan, preventives like amitriptyline 25-50 mg, topiramate 50-100 mg, or propranolol 80-120 mg if frequent, NSAIDs or acetaminophen for tension-type, limit acute medications to prevent MOH), dizziness (vestibular rehabilitation therapy - habituation exercises, gaze stabilization, balance training, Epley maneuver if BPPV), sleep disturbance (sleep hygiene, melatonin 3-5 mg at bedtime, consider trazodone 25-50 mg or amitriptyline 25 mg if persistent)
  - Cognitive rehabilitation: if persistent cognitive symptoms, formal cognitive rehabilitation therapy (attention training, memory strategies, compensatory techniques), occupational therapy for return to work/school modifications, gradual cognitive loading (increase mental activity incrementally)
  - Vision therapy: if convergence insufficiency or accommodation dysfunction, vision therapy with neuro-optometrist (convergence exercises, accommodation training), may significantly improve symptoms
  - Psychological support: cognitive behavioral therapy (CBT) for anxiety, depression, catastrophizing (common in PCS and prolongs recovery), acceptance and commitment therapy (ACT), address fear-avoidance behaviors, mindfulness-based stress reduction
  - Medications for mood: if comorbid depression (SSRI - sertraline 50-100 mg, escitalopram 10-20 mg), if comorbid anxiety (SSRI or SNRI - duloxetine 30-60 mg also treats pain), avoid benzodiazepines (worsen cognition)
  - Avoid alcohol and sedatives: alcohol worsens symptoms and prolongs recovery, benzodiazepines impair cognition
  - Return to work/school: gradual return with accommodations (reduced hours, frequent breaks, extended time on tasks, reduced workload initially), coordinate with employer/school (may need letter outlining limitations and accommodations)
  - Return to sport: only after medical clearance and symptom resolution at rest, gradual return-to-play protocol (6 stages over minimum 6 days - light aerobic, sport-specific, non-contact drills, full-contact practice, game play), must be asymptomatic at each stage before progressing
  - Multidisciplinary approach: coordinate care among neurology, sports medicine, physical therapy (vestibular), occupational therapy (cognitive), psychology, neuro-optometry
  - Prognosis: most patients improve over 3-12 months with appropriate treatment, 15-20 percent have symptoms beyond 1 year, early aggressive rehabilitation may reduce chronicity

clinical_pearls:
  - Post-concussion syndrome diagnosed when symptoms persist beyond expected 2-week recovery, typically defined as 3+ months
  - Symptoms are real even though imaging typically normal (concussion is functional not structural injury)
  - Risk factors for prolonged recovery: female sex, prior concussions, history of migraines, pre-existing depression/anxiety/ADHD
  - Complete rest beyond 48 hours may worsen outcomes - gradual return to activity important
  - Sub-symptom threshold aerobic exercise may speed recovery (Buffalo protocol)
  - Multidisciplinary approach most effective: vestibular therapy, vision therapy, cognitive rehabilitation, psychological support
  - Screen for comorbid depression/anxiety (common 20-40 percent) and treat aggressively
  - Vestibular and vision dysfunction very common and treatable with targeted therapy
  - Cervicogenic headache often coexists (treat neck separately with PT)
  - Avoid alcohol, limit caffeine, prioritize sleep (critical for recovery)

referrals:
  - Neurology or concussion specialist for persistent symptoms beyond 4-6 weeks or complex cases
  - Sports medicine physician for athletes and return-to-play decisions
  - Physical therapy (vestibular specialist) for dizziness, balance problems, or vestibular dysfunction
  - Neuro-optometry for vision problems (convergence insufficiency, accommodation dysfunction)
  - Neuropsychology for cognitive testing and cognitive rehabilitation
  - Occupational therapy for cognitive rehabilitation and return-to-work/school planning
  - Psychology or psychiatry for comorbid depression, anxiety, PTSD
  - Headache specialist if persistent severe headaches

differentials:
  - Typical concussion recovery (symptoms resolve within 2 weeks - not PCS)
  - Chronic migraine or medication overuse headache (may be triggered by concussion but persists independently)
  - Cervicogenic headache (from whiplash injury concurrent with concussion)
  - Vestibular migraine (vertigo, motion sensitivity, may be triggered by head trauma)
  - Depression or anxiety disorder (primary mood disorder vs secondary to PCS)
  - PTSD (especially if traumatic mechanism - assault, severe accident)
  - Sleep apnea (fatigue, cognitive dysfunction, screen with sleep study)
  - Chronic fatigue syndrome (fatigue, cognitive dysfunction, but no head trauma history)
  - Malingering or secondary gain (rare, but consider if litigation pending, symptom magnification)

trace:
  - 28-year-old male college soccer player presents 4 months after concussion with persistent symptoms
  - Injury mechanism: head-to-head collision during game, immediate onset headache and dizziness, did not lose consciousness but had 10-15 minute period of confusion (asked same questions repeatedly), left field and did not return to game
  - Acute evaluation: emergency department same day, CT head normal (no bleed or fracture), diagnosed with concussion, instructed to rest 1-2 days then gradual return to activity
  - Initial course: rested 2 days, symptoms improved, attempted return to classes after 1 week but severe headache and difficulty concentrating, attempted return to light practice at 2 weeks but symptoms worsened significantly with exertion
  - Current symptoms (4 months post-injury): persistent daily headache (bilateral, pressure-like, 5-6/10 severity, worse with mental/physical exertion), dizziness especially with head movements, difficulty concentrating (takes much longer to read and study, "brain fog"), fatigue (exhausted by midday), sleep disturbance (trouble falling asleep, wakes frequently), photophobia (wears sunglasses indoors), irritability (short temper, not like him), anxiety about symptoms (worries will never recover)
  - Impact: missed entire soccer season, struggling academically (grades dropped from A's to C's), reduced social activities (avoids loud places, stopped going to parties), feels depressed about situation
  - Past medical history: 2 prior concussions (ages 16 and 24, both resolved within 2 weeks), no other medical problems
  - Family history: mother has migraines
  - Exam: vital signs normal, general exam normal, neurologic exam normal (strength, sensation, reflexes, cranial nerves, coordination all intact), gait normal, no papilledema, mild cervical paraspinal muscle tenderness, cervical range of motion mildly limited by discomfort
  - MRI brain: a few punctate foci of susceptibility on gradient echo sequences in frontal lobes consistent with microhemorrhages (old traumatic axonal injury), otherwise normal brain parenchyma, no mass or acute findings
  - Post-Concussion Symptom Scale (PCSS): score 68 out of 132 (moderate-severe symptom burden), highest scores in headache, dizziness, fatigue, concentration difficulty, photophobia, irritability
  - ImPACT computerized cognitive testing: processing speed and reaction time below expected for age and education level (suggest cognitive processing deficits), memory scores normal
  - Vestibular Ocular Motor Screening (VOMS): positive for symptom provocation with smooth pursuits and vestibular ocular reflex (VOR) testing (suggests vestibular component)
  - Vision assessment: convergence insufficiency identified (near point of convergence 15 cm, normal less than 6 cm), accommodation dysfunction
  - PHQ-9 depression screening: score 14 (moderate depression)
  - Diagnosis: Post-Concussion Syndrome (symptoms persisting 4 months post-concussion with significant functional impairment)
  - "Assessment: multiple contributing factors identified: persistent headaches (likely post-traumatic migraine), vestibular dysfunction, vision dysfunction (convergence insufficiency), cognitive deficits (processing speed), cervicogenic component (neck pain), comorbid depression/anxiety, prior concussions and family history of migraine are risk factors for prolonged recovery"
  - Treatment plan - multimodal approach:
    • Education: extensive discussion about PCS, prognosis (expect gradual improvement over 3-6 months with treatment), importance of active rehabilitation (not complete rest)
    • Headache management: amitriptyline 25 mg at bedtime started (migraine prophylaxis, also helps sleep and mood), sumatriptan 50 mg for severe headaches (limit to 2 days per week), avoid ibuprofen overuse
    • Vestibular rehabilitation: referred to PT with vestibular specialty, started habituation exercises and gaze stabilization exercises
    • Vision therapy: referred to neuro-optometrist for convergence insufficiency treatment (pencil push-ups, convergence exercises)
    • Cognitive rehabilitation: referred to occupational therapy for cognitive strategies and return-to-school planning
    • Graduated aerobic exercise: started Buffalo Concussion Treadmill Protocol (identify exercise threshold, prescribed sub-symptom aerobic exercise 20 min daily at 60-70 percent max HR)
    • Depression treatment: sertraline 50 mg daily started for comorbid depression and anxiety
    • Sleep hygiene: counseling on sleep schedule, limit screens before bed, melatonin 3 mg added at bedtime
    • Academic accommodations: letter written to school requesting extended time on exams, reduced course load, frequent breaks during classes, quiet testing environment, note-taking assistance
  - Follow-up 6 weeks: gradual improvement noted, headaches decreased in frequency (now 15 days per month vs daily), tolerating 20 min aerobic exercise without significant symptom exacerbation, vestibular therapy helping with dizziness (50 percent improved), vision therapy progressing, concentration improving slowly, mood better on sertraline, still cannot return to contact sports
  - Amitriptyline increased to 50 mg at bedtime (further headache prevention)
  - 3-month follow-up (7 months post-injury): significant improvement, headaches now 6-8 days per month (manageable), dizziness resolved, cognitive function near baseline (grades back to B+ average), mood much better (PHQ-9 score 5 - minimal depression), able to exercise at moderate-high intensity without symptoms
  - ImPACT repeat testing: processing speed and reaction time normalized (back to baseline level)
  - Discussed return to sport: still 1-2 symptoms with high-intensity exertion, not yet ready for contact
  - 5-month follow-up (9 months post-injury): essentially asymptomatic at rest and with moderate-high intensity exercise, headaches occasional (2-3 per month, well-controlled with sumatriptan), no dizziness, vision normalized, cognitive function baseline, mood excellent, returned to full academic load with excellent performance
  - Cleared for graduated return to sport protocol: 6-stage progression (light aerobic, sport-specific drills, non-contact practice, limited contact, full practice, game play), instructed must be asymptomatic at each stage before advancing
  - 6-month follow-up (10 months post-injury): completed return-to-sport protocol successfully, playing in games, no symptom recurrence, feeling "back to normal"
  - Counseling: discussed risk of future concussions (third concussion may take longer to recover), importance of reporting symptoms immediately, proper tackling technique to reduce head impacts, consider baseline ImPACT testing annually
  - Plan: taper amitriptyline slowly after 12 months symptom-free, continue sertraline 6-12 months then reassess, annual follow-up or sooner if recurrent symptoms

