tree_id: NEURO-POST-CONCUSSION-SYNDROME
name: Post-Concussion Syndrome
family: Neurology
specialty: Neurology/Sports Medicine/Rehabilitation
chief_complaint: Persistent symptoms following mild traumatic brain injury lasting beyond expected recovery
description: Complex disorder characterized by physical, cognitive, and psychological symptoms persisting for weeks to months after concussion, beyond typical 7-14 day recovery period

icd10: F07.81
snomed: "82271004"

urgency: routine

