tree_id: CARD-TRICUSPID-REGURGITATION
name: Tricuspid Regurgitation
family: cardiovascular
specialty: Cardiology
chief_complaint: Peripheral edema, ascites, fatigue, right heart failure symptoms
description: Backward flow of blood from right ventricle to right atrium during systole due to incomplete tricuspid valve closure
icd10: I07.1
urgency: routine
workup:
  - Clinical presentation - symptoms of right heart failure
  - Lower extremity edema (bilateral, pitting)
  - Abdominal distension (ascites)
  - Right upper quadrant discomfort (hepatic congestion)
  - Fatigue, exercise intolerance
  - Dyspnea on exertion (less common than with left-sided disease)
  - Anorexia, early satiety (from hepatomegaly, ascites)
  - Pulsatile neck veins
  - Often asymptomatic if mild-moderate
  - Etiologies of tricuspid regurgitation
  - Secondary (functional) TR - 80-90% of cases
  - Right ventricular dilation from pulmonary hypertension
  - Left heart disease (mitral valve disease, LV dysfunction)
  - Annular dilation without leaflet pathology
  - Primary (organic) TR - 10-20% of cases
  - Rheumatic heart disease (usually with mitral disease)
  - Endocarditis (IV drug use, pacemaker/ICD leads)
  - Carcinoid syndrome (plaque-like deposits)
  - Ebstein anomaly (congenital, apically displaced septal leaflet)
  - Flail leaflet from trauma, papillary muscle rupture
  - Pacemaker/ICD lead impingement
  - Physical examination
  - Jugular venous distention (elevated JVP)
  - Prominent V waves in JVP (systolic pulsations, giant V waves if severe TR)
  - Hepatojugular reflux positive
  - Cardiac auscultation
  - Holosystolic murmur at left lower sternal border
  - Increases with inspiration (Carvallo sign - increased venous return)
  - May be soft or absent if severe TR with low flow
  - Pulsatile liver (systolic pulsations from transmitted RV pressure)
  - Hepatomegaly (smooth, tender liver edge)
  - Ascites
  - Peripheral edema (pitting, bilateral lower extremities)
  - Laboratory studies
  - Comprehensive metabolic panel - elevated liver enzymes (AST, ALT), elevated bilirubin (hepatic congestion)
  - Elevated alkaline phosphatase
  - BNP or NT-proBNP - elevated (right heart failure)
  - Albumin - low if chronic (protein-losing enteropathy from venous congestion)
  - Electrocardiogram
  - Right atrial enlargement (tall P waves in lead II greater than 2.5 mm)
  - Right ventricular hypertrophy
  - Atrial fibrillation common
  - Chest X-ray
  - Right atrial enlargement
  - Right ventricular enlargement
  - Pleural effusions
  - Echocardiography - KEY diagnostic test
  - Tricuspid valve morphology (leaflets, annulus, chordae)
  - Color Doppler - regurgitant jet
  - Quantitative assessment of TR severity
  - Vena contracta width (severe if greater than 7 mm)
  - Effective regurgitant orifice area (EROA) - severe if greater than 40 mm²
  - Regurgitant volume - severe if greater than 45 mL
  - Hepatic vein flow - systolic flow reversal (severe TR)
  - Right atrial size (RA area greater than 18 cm² indicates enlargement)
  - Right ventricular size and function
  - Estimate pulmonary artery systolic pressure
  - Assess for left-sided valve disease
  - Cardiac catheterization - if considering surgery
  - Right heart catheterization - measure pulmonary artery pressures
  - Assess for pulmonary hypertension
  - Left heart catheterization - assess coronary arteries if age greater than 40 or risk factors
treatment:
  - Medical management - treat underlying cause and symptoms
  - Diuretics - cornerstone of symptom management
  - Loop diuretics - furosemide 40-240 mg daily or torsemide 20-100 mg daily
  - Add thiazide (metolazone 2.5-10 mg) if refractory edema
  - Aggressive diuresis for congestion
  - Sodium restriction less than 2 g daily
  - Daily weights
  - Treat underlying left heart disease if present
  - Optimize heart failure therapy (ACE/ARB, beta-blockers) for LV dysfunction
  - Treat atrial fibrillation - rate or rhythm control, anticoagulation
  - Treat pulmonary hypertension if present
  - Pulmonary arterial hypertension therapies (sildenafil, endothelin receptor antagonists)
  - Anticoagulation if atrial fibrillation
  - Surgical intervention - for severe symptomatic TR
  - Indications for surgery
  - Severe TR undergoing left-sided valve surgery (repair TR at same time)
  - Severe symptomatic TR refractory to medical therapy
  - Progressive RV dilation despite medical therapy
  - Tricuspid valve repair preferred over replacement (when feasible)
  - Annuloplasty ring (DeVega annuloplasty or ring annuloplasty)
  - Leaflet repair if primary leaflet pathology
  - Better outcomes than replacement, lower mortality
  - Tricuspid valve replacement - if repair not feasible
  - Bioprosthetic valve preferred (lower thrombotic risk)
  - Mechanical valve if young patient and already on anticoagulation
  - Transcatheter tricuspid valve interventions - emerging therapies
  - Tricuspid edge-to-edge repair (T-TEER, TriClip)
  - Transcatheter annuloplasty systems
  - Transcatheter valve replacement
  - For high surgical risk patients with severe symptomatic TR
  - Treat endocarditis if present
  - IV antibiotics 4-6 weeks
  - Surgical excision of vegetations and valve repair/replacement if large vegetations, heart failure, or persistent infection
clinical_pearls:
  - Prevalence 0.9-1.6% in general population, increases with age
  - Often overlooked "forgotten valve" - undertreated compared to left-sided valvular disease
  - Functional (secondary) TR most common (80-90%) - due to RV dilation from pulmonary hypertension or left heart disease
  - Atrial fibrillation present in 50-60% of severe TR patients
  - Carvallo sign (murmur increases with inspiration) is classic but insensitive (50%)
  - Severe TR may have soft or absent murmur (low flow paradox)
  - Isolated severe TR has poor outcomes if left untreated - 5-year mortality 40-50%
  - Surgery for severe TR has high operative mortality (8-10%) especially if isolated TR repair
  - Best outcomes when TR repaired during left-sided valve surgery
  - Transcatheter therapies emerging as alternative for high-risk surgical patients
  - Pacemaker/ICD leads can cause or worsen TR - consider leadless pacemaker if severe TR
differentials:
  - Pulmonic regurgitation (diastolic murmur at left upper sternal border)
  - Mitral regurgitation (holosystolic murmur at apex, radiates to axilla, does not increase with inspiration)
  - Ventricular septal defect (holosystolic murmur with thrill, step-up in oxygen saturation on RHC)
  - Right ventricular dysfunction without significant TR (RV failure, no murmur)
  - Constrictive pericarditis (elevated JVP, pericardial thickening on imaging, no significant TR)
  - Restrictive cardiomyopathy (elevated filling pressures, infiltrative on biopsy)
  - Hepatic disease causing ascites/edema (abnormal liver function, no cardiac findings)
trace:
  - 62-year-old woman presents with 6-month history of progressive leg swelling and abdominal distension
  - Bilateral leg edema worsening over months, now up to knees
  - Abdomen progressively distended, clothes no longer fit
  - Right upper quadrant discomfort
  - Fatigue, limited exercise tolerance
  - Mild dyspnea with exertion
  - Known history of rheumatic fever as child, mitral valve disease
  - Had mitral valve replacement (bioprosthetic) 10 years ago, did well until recently
  - Past medical history - rheumatic heart disease, mitral valve replacement, atrial fibrillation, hypertension
  - Medications - warfarin, furosemide 40 mg daily, metoprolol 50 mg BID, lisinopril 10 mg daily
  - Physical exam - appears uncomfortable, abdominal distension
  - Vitals - temp 36.8C, HR 88 (irregular), BP 125/75, RR 18, SpO2 96% room air
  - JVP elevated 14 cm with prominent V waves (systolic pulsations)
  - Cardiac - irregularly irregular rhythm (AF)
  - Holosystolic murmur at left lower sternal border, increases with inspiration (Carvallo sign)
  - Mechanical click from prosthetic mitral valve
  - Abdomen - distended, fluid wave positive (ascites), liver edge palpable 4 cm below costal margin, pulsatile
  - Extremities - 3+ pitting edema bilateral lower extremities to knees
  - Cool feet
  - Labs - BNP 850 pg/mL (elevated)
  - Creatinine 1.4 mg/dL (elevated from baseline 0.9), BUN 42 mg/dL
  - Sodium 134 mEq/L (hyponatremia from volume overload)
  - AST 120 U/L, ALT 95 U/L (elevated, hepatic congestion)
  - Total bilirubin 2.1 mg/dL (elevated)
  - Alkaline phosphatase 180 U/L (elevated)
  - Albumin 3.0 g/dL (low)
  - INR 2.8 (therapeutic on warfarin)
  - ECG - atrial fibrillation with ventricular rate 88 bpm, right atrial enlargement
  - Chest X-ray - cardiomegaly, enlarged right atrium, small bilateral pleural effusions
  - Echocardiography - prosthetic mitral valve well-seated, normal function
  - SEVERE tricuspid regurgitation
  - Torrential regurgitant jet on color Doppler
  - Vena contracta 9 mm (severe greater than 7 mm)
  - Systolic flow reversal in hepatic veins (severe TR)
  - Tricuspid annular dilation 50 mm (normal less than 40 mm)
  - Right atrium severely enlarged (RA area 32 cm²)
  - Right ventricle dilated, moderate RV dysfunction
  - Estimated PA systolic pressure 45 mmHg (moderate pulmonary hypertension)
  - Diagnosis - Severe functional tricuspid regurgitation secondary to annular dilation and RV dilation
  - Likely developed after mitral valve replacement (RV remodeling)
  - Right heart failure symptoms refractory to medical therapy
  - Admitted for aggressive diuresis
  - Cardiology and cardiac surgery consultations
  - Hospital management - IV diuresis
  - Furosemide 80 mg IV BID
  - Goal negative 1-2 L daily
  - Metolazone 5 mg daily added Day 2 for refractory edema
  - Therapeutic paracentesis Day 3 - removed 3 liters ascitic fluid (symptomatic relief)
  - Net negative 8 L over 5 days
  - Weight decreased 18 pounds
  - Creatinine stable 1.3-1.5 mg/dL
  - Edema improved to trace, ascites markedly reduced
  - Cardiac surgery evaluation
  - Reviewed echocardiography - severe TR with annular dilation
  - RV dysfunction moderate but not end-stage
  - Decision - proceed with tricuspid valve repair
  - STS risk score 8% (moderate-high risk given RV dysfunction, redo sternotomy)
  - Discussed risks/benefits with patient
  - Surgery performed Day 7
  - Redo sternotomy, cardiopulmonary bypass
  - Tricuspid valve repair with annuloplasty ring (34 mm ring)
  - All three leaflets coapting well after repair
  - Intraoperative TEE - trace-mild residual TR (excellent result)
  - Operative time 4 hours, estimated blood loss 400 mL
  - Postoperative course - ICU x2 days
  - Extubated postop Day 1
  - Required inotropic support (milrinone) x 48 hours for RV support
  - Transitioned to oral diuretics Day 3
  - Transferred to floor Day 3
  - Ambulating, eating well
  - Discharge Day 10
  - Furosemide 80 mg daily, metoprolol 50 mg BID, lisinopril 10 mg daily, warfarin
  - Cardiac rehabilitation referral
  - Follow-up in 2 weeks
  - 2-week follow-up - doing well
  - Minimal edema, no ascites
  - Repeat echocardiogram - trace-mild TR (marked improvement from severe)
  - Annuloplasty ring well-seated
  - RV size decreased, RV function improved
  - 3-month follow-up - excellent recovery
  - No edema, no ascites
  - Functional capacity markedly improved, walking 30 minutes daily
  - Repeat echo - stable trace-mild TR
  - Liver enzymes normalized (AST 35, ALT 28)
  - Furosemide reduced to 40 mg daily
  - 1-year follow-up - sustained improvement
  - NYHA class I, minimal symptoms
  - Echo - stable mild TR, RV function normal
  - Outcome - Excellent result with tricuspid valve repair, resolution of right heart failure
