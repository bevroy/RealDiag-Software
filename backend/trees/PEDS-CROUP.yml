tree_id: PEDS-CROUP
name: Croup (Laryngotracheobronchitis)
family: pediatrics
specialty: Pediatrics/Emergency Medicine
age_max: 12
icd10: J05.0
snomed: 71186008
urgency:
  - Severe respiratory distress
  - Stridor at rest
  - Cyanosis
  - Altered mental status
homeopathy: []
presentations:
  - Barky or seal-like cough (characteristic feature)
  - Inspiratory stridor (high-pitched sound on inspiration)
  - Hoarseness or voice changes
  - Preceding upper respiratory infection symptoms (rhinorrhea, cough, low-grade fever) for 1-2 days
  - Symptoms typically worse at night
  - Age 6 months to 3 years (peak incidence)
  - Fall and winter seasonality
  - Symptoms usually last 3-7 days with peak severity at 48 hours
  - May have mild to moderate respiratory distress
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Characteristic barky cough
  - Stridor present (at rest or only with agitation/crying)
  - Preceding URI symptoms
  - Fever pattern
  - Previous episodes of croup
  - Immunization status (rule out diphtheria if unimmunized)
  - Recent choking episode or foreign body ingestion (rule out foreign body aspiration)
  - Sudden onset versus gradual (sudden suggests foreign body or epiglottitis)
  - Drooling, difficulty swallowing, toxic appearance (suggests epiglottitis or retropharyngeal abscess)
  - Physical examination
  - Assess severity using Westley Croup Score
  - Stridor: none (0), with agitation (1), at rest (2)
  - Retractions: none (0), mild (1), moderate (2), severe (3)
  - Air entry: normal (0), decreased (1), markedly decreased (2)
  - Cyanosis: none (0), with agitation (4), at rest (5)
  - Level of consciousness: normal (0), altered (5)
  - Score interpretation: less than or equal to 2 mild, 3-7 moderate, greater than or equal to 8 severe
  - Vital signs
  - Temperature (usually low-grade fever less than 101°F/38.3°C)
  - Respiratory rate (tachypnea indicates distress)
  - Heart rate (tachycardia with hypoxia or distress)
  - Oxygen saturation (usually normal unless severe)
  - General appearance
  - Level of distress, alertness
  - Ability to speak or cry (muffled voice suggests severe obstruction)
  - Position preference (tripod positioning suggests severe obstruction or epiglottitis)
  - Respiratory examination
  - Stridor (inspiratory in croup, biphasic if severe)
  - Work of breathing (retractions - suprasternal, intercostal, subcostal)
  - Air entry bilaterally
  - Presence of wheeze (suggests concomitant bronchospasm)
  - Head and neck examination
  - Avoid if concern for epiglottitis (can precipitate complete airway obstruction)
  - Pharynx examination (if safe to do so)
  - Assess for drooling, difficulty swallowing
  - Diagnostic testing
  - Usually clinical diagnosis - NO testing required for typical croup
  - Lateral neck X-ray (NOT routinely recommended)
  - '"Steeple sign" (subglottic narrowing) - classic but not sensitive or specific'
  - Consider if diagnosis uncertain or concern for foreign body, epiglottitis, or retropharyngeal abscess
  - Order only if does not delay treatment
  - Pulse oximetry if moderate to severe symptoms
  - COVID-19 or influenza testing based on clinical suspicion
treatment:
  - Outpatient management (mild croup)
  - Single dose dexamethasone 0.6 mg/kg PO (max 10 mg) - ALWAYS give for any degree of croup
  - Benefits last 48-72 hours
  - Reduces return visits and hospitalizations
  - Oral and IM equally effective
  - Cool mist or humidification (commonly used but limited evidence)
  - Adequate hydration
  - Anticipatory guidance on when to return (worsening stridor, respiratory distress, inability to drink)
  - Emergency department or inpatient management (moderate to severe croup)
  - Dexamethasone 0.6 mg/kg PO or IM (max 10 mg)
  - Nebulized racemic epinephrine 0.5 mL of 2.25% solution in 2.5 mL normal saline
  - Alternative: L-epinephrine 0.5 mL/kg (max 5 mL) of 1:1000 solution nebulized
  - Onset of action 10-30 minutes, duration 2 hours
  - Observe for 2-4 hours after epinephrine (watch for rebound stridor)
  - Repeat epinephrine every 2 hours as needed
  - Can discharge home if no stridor at rest after 2-4 hours of observation AND dexamethasone given
  - Supplemental oxygen if hypoxic (SpO2 less than 92%)
  - Heliox (helium-oxygen mixture) for severe refractory croup (reduces work of breathing)
  - Hospital admission indications
  - Stridor at rest after treatment
  - Significant respiratory distress or retractions
  - Hypoxia requiring supplemental oxygen
  - Need for repeated epinephrine treatments
  - Inability to maintain hydration
  - Concern for progression or uncertain diagnosis
  - Age less than 6 months
  - Toxic appearance or altered mental status
  - ICU admission and airway management
  - Progressive respiratory failure despite medical management
  - Altered mental status, cyanosis
  - Prepare for difficult airway - have experienced personnel available
  - Avoid agitation of child (can precipitate complete obstruction)
  - Intubation may be required (use endotracheal tube 0.5-1.0 size smaller than predicted)
  - Ineffective or contraindicated treatments
  - Antibiotics NOT indicated (viral illness - most commonly parainfluenza virus)
  - Cough suppressants NOT recommended
  - Corticosteroids other than dexamethasone (budesonide) less commonly used
  - Budesonide 2 mg nebulized can be used as alternative if dexamethasone unavailable
clinical_pearls:
  - 'Croup clinical diagnosis based on barky cough and inspiratory stridor - imaging NOT needed for typical presentation'
  - 'Dexamethasone 0.6 mg/kg single dose (max 10 mg) cornerstone of treatment - give for ANY degree of croup, even mild'
  - 'Nebulized epinephrine for moderate-severe croup - rapid onset but lasts only 2 hours, observe for rebound'
  - 'Stridor at rest indicates moderate-severe croup requiring ED evaluation and treatment with epinephrine'
  - 'Most croup caused by parainfluenza virus - antibiotics NOT indicated'
  - 'Symptoms typically worse at night - counsel parents on when to return to ED'
  - 'Cool mist traditionally recommended but limited evidence of benefit - dexamethasone far more effective'
  - 'Sudden onset with drooling, tripod positioning, and toxic appearance suggests epiglottitis - do NOT examine throat, call anesthesia/ENT'
referrals:
  - ENT consultation if recurrent croup (3+ episodes) - consider subglottic stenosis or other anatomic abnormality
  - Pediatric pulmonology if recurrent croup or atypical features
  - Anesthesia and ENT for suspected epiglottitis or impending airway obstruction
  - Bronchoscopy if recurrent croup to evaluate for anatomic abnormality
differentials:
  - Viral croup (laryngotracheobronchitis - most common, barky cough, inspiratory stridor, gradual onset after URI)
  - Epiglottitis (drooling, tripod positioning, toxic appearance, muffled voice, abrupt onset - RARE with Hib vaccine)
  - Bacterial tracheitis (croup-like but toxic appearance, high fever, purulent secretions, does not respond to croup treatment)
  - Foreign body aspiration (sudden onset choking, unilateral decreased air entry, history of choking episode)
  - Retropharyngeal or peritonsillar abscess (drooling, dysphagia, neck stiffness, fever)
  - Anaphylaxis (acute onset after exposure, urticaria, wheeze, hypotension)
  - Spasmodic croup (recurrent nocturnal barky cough without URI prodrome - allergic/reactive component)
  - Diphtheria (unimmunized, gray pseudomembrane in pharynx, "bull neck" - VERY RARE)
