tree_id: ORTHO-MEDIAL-EPICONDYLITIS
name: Medial Epicondylitis (Golfer's Elbow)
family: orthopedics
specialty: Orthopedics
icd10: M77.00
snomed: 202855006
urgency: []
homeopathy: []
presentations:
  - Medial elbow pain over medial epicondyle
  - Pain with gripping, wrist flexion, or forearm pronation
  - Tenderness to palpation 1-2 cm distal to medial epicondyle
  - Pain worse with lifting objects, shaking hands, or turning doorknobs
  - Weakness with grip strength
  - Gradual onset over weeks to months
  - Common in golfers, racquet sports, throwing athletes, manual laborers
  - May have numbness/tingling in ring and small fingers (ulnar nerve symptoms)
workup:
  - Clinical diagnosis based on history and physical examination
  - Physical examination
  - Point tenderness over medial epicondyle (origin of flexor-pronator mass)
  - Pain with resisted wrist flexion and forearm pronation
  - Pain with resisted middle finger flexion
  - Assess grip strength (often reduced compared to contralateral side)
  - Assess for ulnar nerve involvement
  - Tinel sign at cubital tunnel (elbow flexion reproduces paresthesias)
  - Elbow flexion test (sustained flexion >60 seconds reproduces symptoms)
  - Ulnar nerve subluxation with elbow flexion/extension
  - Normal elbow range of motion
  - Imaging
  - Usually not needed for diagnosis
  - Elbow X-rays if chronic symptoms or trauma
  - May show calcification at medial epicondyle in chronic cases
  - Ultrasound can show tendon thickening, tears, peritendinous fluid
  - MRI if diagnosis uncertain or planning surgery
  - Assess for contributing factors (biomechanics, technique errors)
treatment:
  - Activity modification (first-line)
  - Relative rest - avoid aggravating activities
  - Modify technique (golf swing, throwing mechanics)
  - Reduce repetitive gripping, wrist flexion, pronation
  - Continue activities that don't cause pain
  - Physical therapy
  - Eccentric strengthening exercises for wrist flexors
  - Wrist flexor and pronator stretching
  - Progressive loading protocol
  - Address technique and biomechanical issues
  - Counterforce brace (forearm strap)
  - Worn 1-2 inches distal to elbow
  - Reduces strain on tendon origin
  - Use during activities
  - Ice after activities 15-20 minutes
  - Pharmacologic
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Use for 2-3 weeks during acute phase
  - Topical NSAIDs (diclofenac gel) alternative with less systemic effects
  - Corticosteroid injection
  - Effective for short-term pain relief (4-12 weeks)
  - Triamcinolone 20-40 mg or methylprednisolone 40 mg + lidocaine
  - Injected at point of maximal tenderness
  - Use caution - avoid ulnar nerve, inject superficially
  - May repeat once if partial response
  - Limit to 2-3 per year
  - Advanced therapies (if conservative fails >6 months)
  - Platelet-rich plasma (PRP) injections (emerging evidence)
  - Extracorporeal shockwave therapy (ESWT)
  - Surgical management (rarely needed)
  - Debridement of degenerated tendon, reattachment
  - Ulnar nerve decompression if nerve symptoms
  - Indications: failed conservative treatment >6-12 months
clinical_pearls:
  - "Medial epicondylitis less common than lateral epicondylitis (10:1 ratio)"
  - "Golfer's elbow misnomer - more common in non-golfers (manual laborers, throwers)"
  - "Tendinopathy, not tendinitis - degenerative process with failed healing"
  - "25-50% have associated ulnar nerve symptoms (cubital tunnel syndrome)"
  - "Point tenderness 1-2 cm distal to medial epicondyle, not directly on epicondyle"
  - "Recovery slower than lateral epicondylitis - often 6-12 months"
  - "80-90% improve with conservative treatment"
  - "Counterforce brace reduces strain on flexor-pronator origin"
referrals:
  - Physical therapy for eccentric exercise program and technique modification
  - Sports medicine or orthopedics if refractory to conservative treatment >3-6 months
  - Hand surgery or orthopedics if considering surgery or significant ulnar nerve symptoms
differentials:
  - Medial epicondylitis (medial elbow pain, tender flexor-pronator origin)
  - Cubital tunnel syndrome (ulnar nerve entrapment, paresthesias in ring/small fingers)
  - Ulnar collateral ligament (UCL) injury (throwing athletes, valgus instability)
  - Medial epicondyle avulsion fracture (adolescents, acute trauma)
  - Flexor-pronator strain (acute injury, muscle belly tenderness)
  - Cervical radiculopathy C8 (neck pain, radiating arm pain, dermatomal pattern)
  - Pronator teres syndrome (median nerve compression at elbow)
  - Elbow arthritis (older age, decreased range of motion, X-ray changes)
trace:
  source: AAOS Clinical Practice Guidelines, American Journal of Sports Medicine Literature on Epicondylitis
