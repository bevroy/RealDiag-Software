tree_id: OB-POSTPARTUM-CARE
name: Postpartum Care (Encounter)
family: obstetrics_gynecology
specialty: Obstetrics/Family Medicine
icd10: Z39.2
snomed: 133906008
urgency: []
homeopathy: []
presentations:
  - Recent delivery (vaginal or cesarean section)
  - Routine postpartum follow-up visit at 4-6 weeks
  - Earlier presentation for complications (fever, heavy bleeding, pain)
  - Breastfeeding concerns (engorgement, mastitis, poor latch)
  - Perineal pain or wound concerns (episiotomy, laceration repair, C-section incision)
  - Postpartum mood changes (baby blues, postpartum depression)
  - Contraception counseling request
  - Sexual health and resumption of intercourse questions
workup:
  - Comprehensive postpartum assessment
  - Review of labor and delivery course
  - Mode of delivery (vaginal, operative vaginal, cesarean)
  - Complications during delivery (hemorrhage, lacerations, shoulder dystocia)
  - Estimated blood loss
  - Medications administered during hospitalization
  - Physical examination
  - Vital signs (blood pressure, heart rate, temperature)
  - Screen for postpartum hypertension (can occur up to 6 weeks postpartum)
  - "BP greater than 140/90: postpartum preeclampsia workup"
  - Breast examination (engorgement, mastitis, abscess)
  - Abdominal examination (uterine involution, C-section incision healing)
  - Fundal height (should be non-palpable by 2 weeks postpartum)
  - Perineal examination (laceration healing, episiotomy site, hemorrhoids)
  - Cesarean incision inspection (if applicable - assess for infection, dehiscence)
  - Lochia assessment (normal progression: rubra days 1-3, serosa days 4-10, alba weeks 2-6)
  - Extremity examination (calf tenderness, Homan's sign for DVT)
  - Laboratory evaluation (if indicated)
  - Hemoglobin/hematocrit if significant blood loss during delivery or symptoms of anemia
  - "Hb less than 10 g/dL: iron supplementation or transfusion if symptomatic"
  - Thyroid function tests if symptoms of thyroid dysfunction (postpartum thyroiditis in 5-10%)
  - Glucose screening if gestational diabetes (75g OGTT at 6-12 weeks postpartum)
  - Mental health screening
  - Edinburgh Postnatal Depression Scale (EPDS) for postpartum depression
  - "Score greater than 10: likely depression, further evaluation needed"
  - Screen for postpartum anxiety, OCD, psychosis
  - Assess for suicidal or homicidal ideation
  - Infant feeding assessment
  - Breastfeeding evaluation (latch, milk supply, infant weight gain)
  - Formula feeding if not breastfeeding or supplementing
  - Contraception discussion
  - Assess plans for future pregnancies and desired interpregnancy interval
  - Discuss immediate postpartum contraception options
treatment:
  - Normal postpartum recovery education
  - Lochia will continue for 4-6 weeks (decrease in amount over time)
  - Cramping normal as uterus involutes (afterpains, worse with breastfeeding due to oxytocin)
  - Avoid tampons and sexual intercourse for 4-6 weeks (infection risk)
  - Pelvic rest until bleeding stops and perineum healed
  - Pain management
  - Perineal pain (vaginal delivery)
  - Ice packs first 24 hours
  - Sitz baths 2-3 times daily
  - Witch hazel pads (Tucks)
  - Topical lidocaine spray or ointment
  - Acetaminophen 650 mg every 6 hours or ibuprofen 600 mg every 6 hours
  - Cesarean incision pain
  - Acetaminophen-ibuprofen alternating regimen
  - Opioids (oxycodone 5-10 mg every 4-6 hours) if needed for severe pain - short course only
  - Avoid NSAIDs if concerns for bleeding
  - Uterine cramping: ibuprofen 600 mg every 6 hours (more effective than acetaminophen)
  - Hemorrhoid management: fiber, stool softeners, sitz baths, topical hydrocortisone
  - Anemia treatment
  - Iron supplementation: ferrous sulfate 325 mg daily (continue prenatal vitamin)
  - Increase dietary iron (red meat, spinach, fortified cereals)
  - Take with vitamin C to enhance absorption
  - Transfusion if symptomatic with Hb less than 7 g/dL
  - Breastfeeding support
  - Encourage exclusive breastfeeding for first 6 months if possible
  - Proper latch technique (baby's mouth wide open, areola in mouth, not just nipple)
  - Feed on demand (8-12 times per 24 hours for newborns)
  - Engorgement management: frequent feeding, cold compresses, hand expression
  - Mastitis treatment: continue breastfeeding, warm compresses, antibiotics if needed
  - "Dicloxacillin 500 mg PO QID or cephalexin 500 mg PO QID for 10-14 days"
  - Lactation consultant referral for breastfeeding difficulties
  - Contraception options
  - Lactational amenorrhea method (LAM): 98% effective if exclusive breastfeeding, less than 6 months postpartum, no menses
  - Progestin-only methods safe with breastfeeding
  - Progestin-only pill (norethindrone 0.35 mg daily - start immediately)
  - Depo-Provera injection (150 mg IM every 3 months - can start immediately)
  - Etonogestrel implant (Nexplanon - can insert before hospital discharge)
  - Levonorgestrel IUD (Mirena, Skyla - insert at 6 weeks postpartum)
  - Barrier methods: condoms, diaphragm (refit at 6 weeks - cervix changes)
  - Combined hormonal contraception: wait until 6 weeks postpartum if breastfeeding (reduces milk supply)
  - Permanent sterilization: tubal ligation (can perform immediately postpartum or at cesarean)
  - Postpartum depression management
  - Baby blues (50-80% of women): peaks at 3-5 days, resolves by 2 weeks - reassurance and support
  - Postpartum depression (10-15%): persistent sadness, anxiety, hopelessness beyond 2 weeks
  - Treatment: psychotherapy (CBT), SSRIs (sertraline 50-200 mg daily - safe with breastfeeding)
  - Postpartum psychosis (0.1%): psychiatric emergency - hallucinations, delusions, thoughts of harming baby
  - Requires immediate psychiatric hospitalization
  - Activity and exercise
  - Gradual return to normal activities as tolerated
  - Avoid heavy lifting (greater than 10-15 lbs) for 2 weeks after vaginal, 6 weeks after cesarean
  - Walking encouraged as soon as comfortable
  - Return to exercise program gradually (wait 6 weeks for high-impact exercise)
  - Kegel exercises to strengthen pelvic floor (reduce incontinence risk)
  - Sexual health
  - Resume intercourse when bleeding stopped and comfortable (typically 4-6 weeks)
  - Vaginal dryness common (especially if breastfeeding) - use lubricant
  - Dyspareunia may occur - related to perineal healing, hormonal changes
  - Return to work and childcare planning
  - Immunizations
  - MMR and varicella if non-immune (contraindicated during pregnancy - can give postpartum)
  - Tdap if not given during pregnancy
  - Influenza vaccine if in season
clinical_pearls:
  - 'Postpartum visit should occur at 4-6 weeks, but earlier contact (phone or visit) within 3 weeks recommended by ACOG'
  - 'Screen all women for postpartum depression using Edinburgh Postnatal Depression Scale (EPDS) - PPD affects 10-15%'
  - 'Breastfeeding is 98% effective contraception (LAM) if exclusive, amenorrheic, and less than 6 months postpartum'
  - 'Progestin-only contraception safe with breastfeeding; wait 6 weeks for combined hormonal (estrogen reduces milk supply)'
  - 'Postpartum preeclampsia can occur up to 6 weeks after delivery - check BP at postpartum visits'
  - 'Sertraline (Zoloft) is preferred SSRI for postpartum depression - minimal infant exposure via breast milk'
  - 'Postpartum psychosis is psychiatric emergency requiring immediate hospitalization - risk of infanticide/suicide'
  - 'IUD insertion at 6 weeks postpartum has lower expulsion rate than immediate postpartum insertion'
referrals:
  - Psychiatry or perinatal mental health specialist for postpartum depression not responding to SSRIs or postpartum psychosis
  - Lactation consultant for breastfeeding difficulties (poor latch, low milk supply, nipple pain)
  - Pelvic floor physical therapy for persistent perineal pain, urinary/fecal incontinence, dyspareunia
  - Urogynecology for significant pelvic organ prolapse
  - Endocrinology if gestational diabetes screen abnormal at postpartum visit
differentials:
  - Normal postpartum recovery (lochia, cramping, perineal discomfort resolving)
  - Postpartum hemorrhage (excessive bleeding greater than 500 mL vaginal or 1000 mL cesarean)
  - Endometritis (fever, uterine tenderness, foul-smelling lochia)
  - Wound infection (cesarean incision or perineal laceration - erythema, purulent drainage, fever)
  - Postpartum preeclampsia (hypertension, headache, visual changes up to 6 weeks postpartum)
  - Mastitis (breast pain, fever, erythema, flu-like symptoms)
  - Postpartum depression (persistent sadness, anxiety, anhedonia beyond 2 weeks)
  - Postpartum thyroiditis (hyperthyroid phase followed by hypothyroid phase at 3-6 months)
  - Deep vein thrombosis (calf pain, swelling, positive Homan's sign)
