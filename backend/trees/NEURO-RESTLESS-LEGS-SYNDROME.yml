tree_id: NEURO-RESTLESS-LEGS-SYNDROME
name: Restless Legs Syndrome
family: Neurology
specialty: Neurology
chief_complaint: Uncomfortable leg sensations and urge to move
description: Sensorimotor disorder causing uncomfortable leg sensations with irresistible urge to move, worse at rest and evening, relieved by movement, causing significant sleep disturbance. Iron supplementation and dopamine agonists highly effective.
icd10: G25.81
urgency: non-urgent

workup:
  - Clinical diagnosis based on 5 essential criteria: (1) urge to move legs with uncomfortable sensations, (2) worse at rest, (3) relieved by movement, (4) worse in evening/night (circadian pattern), (5) not explained by another condition
  - Iron studies: ferritin, iron, TIBC, transferrin saturation (low iron common trigger, treat if ferritin <75)
  - Consider polysomnography: if significant sleep disturbance, to quantify periodic limb movements of sleep (PLMS) often coexists
  - Screen for secondary causes: renal function (uremia), pregnancy, medications (antidepressants, antihistamines, antipsychotics can worsen)
  - Rule out peripheral neuropathy, venous insufficiency, nocturnal leg cramps (different presentations)

treatment:
  - Iron supplementation if ferritin <75: ferrous sulfate 325 mg with vitamin C daily, recheck in 3 months (goal ferritin >75)
  - Non-pharmacologic: avoid caffeine and alcohol, regular exercise (but not close to bedtime), leg massage, warm bath
  - Dopamine agonists (first-line for moderate-severe): pramipexole 0.125-0.5 mg 2 hours before symptoms (start low, titrate slowly), or ropinirole 0.25-4 mg
  - Caution: augmentation (worsening symptoms, earlier onset, spread to arms) occurs in 30-50% with long-term dopamine agonist use
  - Alpha-2-delta ligands (alternative first-line or if augmentation): gabapentin 300-1800 mg 2 hours before bedtime, or pregabalin 75-300 mg
  - Gabapentin enacarbil (extended-release): 600 mg at 5 PM specifically FDA-approved for RLS
  - Opioids: low-dose tramadol or oxycodone if refractory to other treatments
  - Rotigotine patch: transdermal dopamine agonist, may have lower augmentation risk
  - Avoid medications that worsen RLS: antihistamines (diphenhydramine), SSRIs, SNRIs, antipsychotics, metoclopramide
  - Pregnant patients: iron supplementation first, avoid medications in first trimester, low-dose opioids if severe

clinical_pearls:
  - 5 essential criteria: urge to move with uncomfortable sensations, worse at rest, relieved by movement, worse evening/night, not explained by other condition
  - Check ferritin - if <75 supplement iron with vitamin C (highly effective if iron deficient)
  - Dopamine agonists first-line - pramipexole start 0.125 mg 2 hours before symptoms
  - Alpha-2-delta ligands (gabapentin, pregabalin) alternative, especially if augmentation concern
  - Augmentation common complication dopamine agonists - symptoms worsen, occur earlier, spread to arms
  - Avoid antihistamines, SSRIs, antipsychotics - can worsen RLS
  - Often familial - 50% have affected first-degree relative

differentials:
  - Peripheral neuropathy: constant tingling/numbness, not relieved by movement, absent ankle reflexes
  - Nocturnal leg cramps: sudden painful muscle contractions, localized, not relieved by walking
  - Akathisia: inner restlessness from antipsychotics, whole body not just legs, no circadian pattern
  - Periodic limb movement disorder: repetitive limb jerking during sleep without wakeful symptoms

trace: |
  A 45-year-old woman presented with 5 years of uncomfortable crawling sensations deep in both legs every evening while sitting watching TV or lying in bed, with irresistible urge to move legs. Symptoms worse at night, relieved by walking around, causing difficulty falling asleep and significant fatigue. No symptoms during day. Family history of mother with similar symptoms. Ferritin 42 (low), iron 45, normal renal function. Met all 5 diagnostic criteria for restless legs syndrome. Started ferrous sulfate 325 mg with vitamin C daily. At 6 weeks mild improvement but still symptomatic. Added pramipexole 0.125 mg at 8 PM (2 hours before bedtime). At 2 weeks symptoms 80% improved, falling asleep easily. At 3 months ferritin improved to 82, continued pramipexole same dose. At 12 months excellent symptom control, sleeping well, improved quality of life. Counseled on augmentation risk, monitoring for earlier symptom onset or spread to arms.
