tree_id: NEURO-RESTLESS-LEGS-SYNDROME
name: Restless Legs Syndrome (Willis-Ekbom Disease)
family: Neurology
specialty: Neurology
chief_complaint: Uncomfortable urge to move legs at night
description: Sensorimotor disorder causing uncomfortable leg sensations with irresistible urge to move, worse at rest and evening. Iron supplementation if ferritin low, dopamine agonists or gabapentin effective for moderate-severe symptoms.
icd10: G25.81
urgency: non-urgent

workup:
  - Clinical diagnosis: 5 essential criteria (URGE mnemonic)
  - Urge to move legs usually accompanied by uncomfortable sensations
  - Rest worsens symptoms (sitting, lying down)
  - Gets better with movement (walking, stretching provides temporary relief)
  - Evening and night symptoms worse (circadian pattern)
  - Symptoms not better explained by another condition
  - Sensations: crawling, tingling, burning, aching, pulling deep inside legs (not on skin surface)
  - Irresistible urge to move: must get up and walk to relieve symptoms
  - Sleep disturbance: difficulty falling asleep, periodic limb movements during sleep (80%)
  - Impact: insomnia, daytime fatigue, impaired quality of life
  - Check ferritin: low iron major cause, check serum ferritin (not just hemoglobin)
  - Ferritin below 50-75 ng/mL worsens RLS even if hemoglobin normal
  - Rule out secondary causes: iron deficiency, pregnancy, uremia (end-stage renal disease), peripheral neuropathy
  - Medications that worsen RLS: antidepressants (SSRIs, SNRIs), antihistamines (diphenhydramine), antipsychotics, metoclopramide
  - Sleep study: if severe symptoms or suspected sleep apnea, shows periodic limb movements

treatment:
  - Non-pharmacologic (mild symptoms):
  - Leg massage, warm baths, heating pads or ice packs
  - Moderate exercise: avoid intense exercise close to bedtime (may worsen)
  - Sleep hygiene: regular sleep schedule, avoid caffeine and alcohol
  - Iron supplementation: if ferritin below 50-75 ng/mL (even if not anemic)
  - Ferrous sulfate 325 mg with vitamin C 100-200 mg to enhance absorption, taken on empty stomach
  - Goal ferritin above 75-100 ng/mL
  - Recheck ferritin in 3 months, may take 3-6 months to improve symptoms
  - Avoid medications that worsen RLS: discontinue if possible (antidepressants, antihistamines)
  - Dopamine agonists (first-line for moderate-severe):
  - Pramipexole (Mirapex) 0.125-0.5 mg 2-3 hours before symptoms (usually evening)
  - Ropinirole (Requip) 0.25-4 mg 1-2 hours before symptoms
  - Start low dose, titrate slowly to minimize side effects
  - Side effects: nausea, dizziness, impulse control disorders (gambling, hypersexuality), augmentation
  - Augmentation: paradoxical worsening with long-term use (symptoms earlier in day, more severe, spread to arms)
  - Alpha-2-delta ligands (alternative first-line, no augmentation risk):
  - Gabapentin 300-1800 mg at bedtime or divided
  - Pregabalin (Lyrica) 75-450 mg at bedtime
  - Preferred if comorbid insomnia, pain, or anxiety
  - Opioids: low-dose for refractory cases (tramadol, oxycodone), use cautiously
  - Pregnancy: symptoms common in third trimester, iron supplementation, avoid medications, usually resolves postpartum

clinical_pearls:
  - Urge to move legs with uncomfortable sensations worse at rest and evening
  - Movement temporarily relieves symptoms - must walk to get relief
  - Check ferritin - supplement if below 50-75 even if not anemic
  - Avoid medications that worsen: antidepressants, antihistamines, antipsychotics
  - Dopamine agonists or gabapentin first-line for moderate-severe symptoms
  - Augmentation risk with long-term dopamine agonists (symptoms worsen)
  - 80% have periodic limb movements during sleep
  - Common in pregnancy third trimester - resolves postpartum

differentials:
  - Peripheral neuropathy: numbness and tingling in stocking-glove distribution, not relieved by movement, no circadian pattern
  - Nocturnal leg cramps: sudden painful muscle contractions, brief duration, no urge to move
  - Akathisia: medication-induced (antipsychotics), inner restlessness, generalized not just legs
  - Peripheral artery disease: claudication with walking (vs RLS relieved by walking), abnormal pulses

trace: |
  A 55-year-old woman presented with 5 years of uncomfortable leg sensations at night preventing sleep. Describes deep crawling pulling sensation inside calves and thighs starting when sitting to watch TV or lying in bed. Irresistible urge to get up and walk around room to relieve symptoms (temporary relief with movement). Symptoms worse 8 PM to midnight. Awakens multiple times nightly with sensations, must get out of bed and pace. Exhausted during day. No leg pain with walking during day. On sertraline 100 mg for depression. Exam: normal strength, sensation, reflexes, pulses. Labs: CBC normal, ferritin 22 ng/mL (low - major contributing factor even though not anemic). Diagnosed with restless legs syndrome (meets all 5 criteria: urge to move with sensations, worse at rest, relieved by movement, worse evening/night, not explained by other condition). Started ferrous sulfate 325 mg with vitamin C 200 mg daily on empty stomach to increase ferritin above 75. Sleep hygiene counseling. Discussed sertraline may worsen RLS but continue given depression control. Started pramipexole 0.125 mg 2 hours before bedtime for moderate-severe symptoms. At 2 weeks symptoms improved 40%, sleeping better. Increased pramipexole to 0.25 mg. At 6 weeks symptoms improved 70%, sleep significantly better. At 3 months ferritin improved to 68, pramipexole 0.25 mg nightly, excellent symptom control. At 6 months ferritin 88 (goal above 75 achieved), attempted to reduce pramipexole but symptoms returned, continues 0.25 mg nightly maintenance. Counseled on augmentation risk with long-term dopamine agonist use (monitor for earlier symptoms or spreading to arms).
