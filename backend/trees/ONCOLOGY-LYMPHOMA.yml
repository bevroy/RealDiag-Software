tree_id: ONCOLOGY-LYMPHOMA
name: Lymphoma Diagnosis and Workup
family: Oncology
specialty: Oncology, Hematology
chief_complaint: Lymphadenopathy, B symptoms, abnormal labs
description: Evaluation and diagnosis of Hodgkin and non-Hodgkin lymphoma
version: "1.0"
icd10: C85.9
author: RealDiag Clinical Team

entry_point: presentation

nodes:
  - id: presentation
    type: question
    text: "What is the presenting clinical scenario?"
    options:
      - label: "Persistent lymphadenopathy (>4 weeks, >1cm)"
        next: lymph_node_evaluation
      - label: "B symptoms (fever, night sweats, weight loss >10%)"
        next: constitutional_symptoms
      - label: "Incidental lymphadenopathy on imaging"
        next: imaging_finding

  - id: lymph_node_evaluation
    type: question
    text: "Lymph node characteristics and location?"
    options:
      - label: "Supraclavicular, mediastinal, or >2cm firm non-tender nodes"
        next: concerning_adenopathy
      - label: "Cervical, axillary, or inguinal nodes <2cm, mobile, tender"
        next: reactive_adenopathy
      - label: "Generalized lymphadenopathy (multiple regions)"
        next: generalized_adenopathy

  - id: concerning_adenopathy
    type: diagnosis
    name: "Concerning Lymphadenopathy - Biopsy Required"
    icd10: "R59.9"
    urgency: high
    workup:
      - Excisional lymph node biopsy (preferred over FNA for architecture)
      - CBC with differential
      - CMP, LDH, uric acid
      - HIV test
      - Chest X-ray
      - Consider CT chest/abdomen/pelvis
    treatment:
      - Urgent hematology/oncology referral
      - Excisional biopsy (NOT fine needle aspiration)
      - Flow cytometry, immunohistochemistry
      - If lymphoma confirmed, proceed to staging

  - id: reactive_adenopathy
    type: diagnosis
    name: "Likely Reactive Lymphadenopathy"
    icd10: "R59.9"
    urgency: low
    workup:
      - CBC with differential
      - Consider EBV, CMV serologies
      - Observation for 4-6 weeks
    treatment:
      - Reassurance
      - Re-examine in 4-6 weeks
      - If persisting or growing, proceed to biopsy
      - If resolving, continue observation

  - id: generalized_adenopathy
    type: diagnosis
    name: "Generalized Lymphadenopathy"
    icd10: "R59.1"
    urgency: high
    workup:
      - CBC with differential and peripheral smear
      - CMP, LDH
      - HIV test
      - EBV, CMV serologies
      - Consider ANA, RF (autoimmune)
      - Chest X-ray
      - CT chest/abdomen/pelvis
      - Biopsy most accessible abnormal node
    treatment:
      - Investigate for systemic disease (infection, autoimmune, lymphoma)
      - Hematology referral
      - Excisional biopsy if cause unclear

  - id: constitutional_symptoms
    type: diagnosis
    name: "B Symptoms - Lymphoma Evaluation"
    icd10: "R50.9"
    urgency: high
    workup:
      - CBC with differential
      - CMP, LDH, ESR
      - Chest X-ray
      - CT chest/abdomen/pelvis
      - Lymph node biopsy if adenopathy present
      - Consider bone marrow biopsy
    treatment:
      - Urgent oncology referral
      - B symptoms indicate advanced disease
      - Tissue diagnosis essential
      - Stage workup

  - id: imaging_finding
    type: diagnosis
    name: "Incidental Lymphadenopathy on Imaging"
    icd10: "R59.9"
    urgency: moderate
    workup:
      - Review imaging (size, location, number)
      - Physical examination
      - CBC with differential
      - Consider PET-CT if multiple enlarged nodes
      - Biopsy if nodes >1.5cm or PET-avid
    treatment:
      - If >1.5cm or metabolically active: Biopsy
      - If <1.5cm and low suspicion: Repeat imaging in 3 months
      - Oncology referral if concerning features

metadata:
  evidence_based: true
  guidelines:
    - "NCCN Guidelines for Hodgkin Lymphoma"
    - "NCCN Guidelines for Non-Hodgkin Lymphoma"
  clinical_pearls:
    - "B symptoms: Fever >38°C, drenching night sweats, unintentional weight loss >10% in 6 months"
    - "Hodgkin: Bimodal (20s and >55), painless lymphadenopathy, mediastinal mass, Reed-Sternberg cells"
    - "Non-Hodgkin: More common, diverse subtypes, extranodal involvement common"
    - "Excisional biopsy preferred - FNA inadequate for architecture and subtyping"
    - "LDH elevated in aggressive lymphomas"
    - "Supraclavicular (Virchow's) node = high malignancy risk"
    - "Ann Arbor staging: I (1 region), II (≥2 regions same side diaphragm), III (both sides), IV (extranodal)"
