tree_id: GI-ACUTE-LIVER-FAILURE
name: Acute Liver Failure Evaluation
family: Gastroenterology
specialty: Gastroenterology, Hepatology, Critical Care
chief_complaint: Jaundice, Altered Mental Status, Coagulopathy
description: Evaluation and management of acute liver failure
version: "1.0"
icd10: I50.9
author: RealDiag Clinical Team

entry_point: alf_evaluation

nodes:
  - id: alf_evaluation
    type: diagnosis
    name: "Acute Liver Failure"
    icd10: "K72.00"
    urgency: critical
    workup:
      - Acute liver failure (ALF, fulminant hepatic failure) - Rapid development hepatic dysfunction (INR ≥1.5) + hepatic encephalopathy (HE) in patient with no pre-existing liver disease, within 26 weeks of symptom onset
      - MEDICAL EMERGENCY - High mortality without liver transplantation
      - Epidemiology - Rare, 2000-3000 cases/year US, mortality 30-40% (without transplant), 60-70% survival (with transplant)
      - Classification (based on time from jaundice to encephalopathy)
      - Hyperacute - <7 days (best prognosis, 50-60% spontaneous recovery)
      - Acute - 8-28 days (intermediate prognosis)
      - Subacute - 29 days to 26 weeks (worst prognosis, <20% spontaneous recovery)
      - Etiology - US causes
      - Acetaminophen toxicity (40-50%) - Most common cause US, intentional overdose or unintentional (>4 g/day, chronic alcohol use, fasting, combined with other drugs)
      - Drug-induced liver injury (DILI, 10-15%) - Antibiotics (isoniazid, nitrofurantoin, sulfonamides), antiepileptics (phenytoin, valproate), herbal/supplements (green tea extract, kava), isoniazid, valproic acid
      - Viral hepatitis (10-15%) - Hepatitis A (developing countries), hepatitis B (US 5-10%, especially if coinfection with delta), hepatitis E (pregnant women, developing countries)
      - Ischemic hepatitis ("shock liver," 5-10%) - Hypotension, cardiac arrest, heart failure
      - Autoimmune hepatitis (5%) - Young women, hypergammaglobulinemia, positive ANA/ASMA
      - Wilson disease (2-5%) - Young patients (<40), hemolytic anemia + liver failure (Coombs negative), low ceruloplasmin, Kayser-Fleischer rings
      - Acute fatty liver of pregnancy (AFLP) - 3rd trimester, preeclampsia features
      - Budd-Chiari syndrome - Hepatic vein thrombosis, hypercoagulable states
      - Malignancy - Lymphoma, metastatic disease (diffuse infiltration)
      - Amanita phalloides (mushroom poisoning) - Delayed onset 6-12 hours
      - Indeterminate (15-20%) - No identifiable cause despite extensive workup
      - Pathophysiology - Massive hepatocyte necrosis → loss synthetic function (coagulopathy) + detoxification (encephalopathy, cerebral edema) + metabolic functions
      - Cerebral edema (50-80% ALF) - Ammonia accumulation, astrocyte swelling, increased ICP → herniation (leading cause death)
      - Multi-organ failure - Renal failure (hepatorenal syndrome, ATN), ARDS, sepsis, GI bleeding
      - Clinical presentation - TRIAD: jaundice, coagulopathy, encephalopathy
      - Jaundice - Scleral icterus, dark urine
      - Coagulopathy - Elevated PT/INR (impaired synthesis factors II, VII, IX, X), bleeding (GI, mucosal)
      - Hepatic encephalopathy - REQUIRED for ALF diagnosis
      - Grade I - Altered sleep, mild confusion, asterixis
      - Grade II - Lethargy, disorientation, asterixis
      - Grade III - Somnolent but arousable, confused, asterixis
      - Grade IV - Coma, unresponsive, no asterixis
      - RUQ pain - Hepatic capsule distension (rapid liver swelling)
      - Nausea/vomiting - Prodrome
      - Fever - Infection (common complication)
      - Physical exam
      - Jaundice - Scleral icterus, yellow skin
      - Altered mental status - Confusion, lethargy, coma
      - Asterixis - Flapping tremor (hold arms outstretched, dorsiflex wrists), absent if coma
      - Hepatomegaly or small liver - Initially enlarged (edema, congestion), then shrinks (necrosis)
      - Fetor hepaticus - Sweet musty breath odor
      - Signs of specific etiologies
      - Kayser-Fleischer rings - Wilson disease (corneal copper deposition, slit-lamp exam)
      - Track marks - IV drug use (hepatitis)
      - Stigmata chronic liver disease - Usually absent (acute process)
      - Labs - ESSENTIAL for diagnosis and etiology
      - LFTs - Markedly elevated AST/ALT (often >1000 U/L, can be >10,000), elevated bilirubin (total >10 mg/dL)
      - AST/ALT pattern
      - Very high AST/ALT (>5000) - Acetaminophen, ischemic hepatitis, acute viral hepatitis
      - Moderate elevation - Drug-induced, autoimmune, Wilson
      - INR - Elevated (≥1.5 REQUIRED for ALF diagnosis), reflects impaired synthetic function
      - Ammonia - Elevated (correlates with encephalopathy severity)
      - Acetaminophen level - CHECK IN ALL PATIENTS (even if no reported ingestion)
      - Viral serologies - Hepatitis A IgM, hepatitis B surface antigen + IgM core antibody, hepatitis C RNA, hepatitis E IgM (if risk factors)
      - Autoimmune markers - ANA, ASMA, anti-LKM, IgG (autoimmune hepatitis)
      - Ceruloplasmin - Low in Wilson disease (<20 mg/dL)
      - 24-hour urine copper - Elevated in Wilson (>100 mcg/24h)
      - Pregnancy test - Women of childbearing age (AFLP)
      - Toxicology screen - Drugs, alcohol
      - CBC - Thrombocytopenia (DIC, hypersplenism), anemia (bleeding, hemolysis if Wilson)
      - CMP - Hypoglycemia (impaired gluconeogenesis), hyponatremia, renal failure
      - Blood cultures - Sepsis (common complication)
      - Imaging
      - Ultrasound with Doppler - Hepatic vasculature (Budd-Chiari), liver size, ascites
      - CT head (non-contrast) - If altered mental status, evaluate for cerebral edema (loss gray-white differentiation, sulcal effacement, small ventricles)
      - Liver biopsy - Usually NOT performed (coagulopathy, rarely changes management), consider if diagnosis unclear and stable enough
    treatment:
      - ICU admission - MANDATORY, high-level monitoring
      - Transplant center transfer - URGENT if not already at transplant center (ALF is time-sensitive transplant indication)
      - Supportive care - CRITICAL
      - Airway protection - Intubate if grade III-IV encephalopathy (unable to protect airway, risk aspiration)
      - Avoid sedatives (worsen encephalopathy), use propofol if needed
      - Hemodynamic monitoring - Arterial line, central line, continuous monitoring
      - Hypoglycemia prevention - D10W infusion, check glucose q1-2h (impaired gluconeogenesis)
      - Coagulopathy management - Correct only if active bleeding or before procedure
      - Vitamin K 10 mg IV daily x 3 days (replace vitamin K-dependent factors)
      - FFP - If active bleeding or pre-procedure (target INR <1.5)
      - Do NOT correct INR if no bleeding (INR is prognostic marker, correction masks severity)
      - Platelets - If <50,000 and bleeding or pre-procedure
      - Renal replacement therapy - If renal failure, CVVH preferred (avoid hypotension from intermittent HD)
      - Infection surveillance/prophylaxis - High infection risk (40-80%)
      - Low threshold for antibiotics (broad-spectrum if fever or clinical decline)
      - Surveillance cultures (blood, urine, sputum)
      - Antifungal prophylaxis if prolonged course (fluconazole)
      - Hepatic encephalopathy management
      - Lactulose 15-30 mL PO/NG q1-2h - Titrate to 2-3 soft stools/day (reduces ammonia)
      - Rifaximin 550 mg PO BID - Non-absorbable antibiotic (reduces ammonia-producing bacteria)
      - Avoid sedatives, benzodiazepines
      - Cerebral edema management - LEADING CAUSE DEATH
      - Head of bed 30°
      - Avoid hypotension (maintain CPP >50-60 mmHg)
      - Intracranial pressure monitoring - Consider if grade III-IV encephalopathy (controversial, risk bleeding)
      - Goal ICP <20 mmHg, CPP >50 mmHg
      - Treat elevated ICP
      - Mannitol 0.5-1 g/kg IV bolus (osmotic diuresis), repeat q6h PRN (goal serum osmolality <320)
      - Hypertonic saline (3%) 150 mL bolus
      - Hyperventilation (brief, temporizing, target PaCO2 25-30 mmHg)
      - Hypothermia (32-34°C) - Refractory cases
      - Etiology-specific treatment
      - Acetaminophen toxicity - N-acetylcysteine (NAC) 150 mg/kg IV over 1 hour, then 50 mg/kg over 4 hours, then 100 mg/kg over 16 hours
      - Continue NAC until INR <2 and improving mental status
      - Effective even if >24 hours post-ingestion (unlike acute overdose)
      - Improves outcomes even if non-acetaminophen ALF
      - Autoimmune hepatitis - Corticosteroids (methylprednisolone 40-60 mg IV daily)
      - Controversial (infection risk), but reasonable if strong suspicion
      - Herpes simplex hepatitis - Acyclovir 10 mg/kg IV q8h (rare cause ALF, high mortality)
      - Acute hepatitis B - Nucleoside analogue (entecavir, tenofovir)
      - Wilson disease - Urgent transplant evaluation (high mortality without transplant)
      - Amanita phalloides - Penicillin G, silymarin (limited efficacy), supportive care
      - Budd-Chiari - Anticoagulation, TIPS, transplant
      - Liver transplantation - DEFINITIVE treatment for severe ALF
      - Indications (King's College Criteria) - Predict poor prognosis without transplant
      - Acetaminophen ALF - Arterial pH <7.3 after resuscitation OR all three: INR >6.5, creatinine >3.4 mg/dL, grade III-IV encephalopathy
      - Non-acetaminophen ALF - INR >6.5 OR any three: age <10 or >40, etiology (non-A/non-B hepatitis, drug-induced), jaundice >7 days before encephalopathy, INR >3.5, bilirubin >17.5 mg/dL
      - MELD score >30
      - Emergent listing (Status 1A) - Highest priority, median wait time 1-3 days
      - Post-transplant survival - 60-80% at 5 years
      - Contraindications to transplant - Severe sepsis, multi-organ failure (irreversible), intracranial hypertension uncontrolled, severe cardiopulmonary disease
      - Prognosis
      - Overall mortality without transplant - 60-70%
      - Acetaminophen ALF - Best prognosis (50-60% spontaneous recovery with NAC)
      - Non-acetaminophen ALF - Worse prognosis (20-40% spontaneous recovery)
      - Indeterminate etiology - Very poor prognosis (<10% spontaneous recovery)
      - With transplant - 60-80% survival
      - Poor prognostic factors - Grade III-IV encephalopathy, cerebral edema, INR >6.5, bilirubin >17.5, renal failure, hypoglycemia, older age (>40), subacute presentation
