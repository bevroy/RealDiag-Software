tree_id: RHEUM-TEMPORAL-ARTERITIS
name: Giant Cell Arteritis (Temporal Arteritis)
family: Rheumatology
specialty: Rheumatology
chief_complaint: New headache, jaw claudication, vision changes in elderly patient
description: Large vessel vasculitis affecting temporal and other cranial arteries, risk of permanent vision loss
icd10: M31.6
snomed: 400130008
presentations:
  - New headache (temporal, unilateral)
  - Scalp tenderness
  - Jaw claudication
  - Visual symptoms (diplopia, vision loss)
  - Polymyalgia rheumatica symptoms
  - Palpable, tender, non-pulsatile temporal artery
  - Age >50, elevated ESR
urgency: emergency-if-vision-symptoms
referrals:
  emergency:
    - Giant cell arteritis with vision changes
    - Acute vasculitis with organ involvement
    - Severe flare with organ damage
  urgent:
    - Suspected rheumatoid arthritis
    - Suspected lupus
    - Crystal arthropathy
    - PMR
  routine:
    - Osteoarthritis
    - Chronic inflammatory arthritis management
    - Fibromyalgia
    - Gout prevention

workup:
  - Clinical diagnosis based on characteristic features in patient over age 50
  - Headache (new onset or change in pattern) in 70-90%
  - Temporal artery abnormality - tenderness, decreased pulse, nodularity, thickening
  - Jaw claudication (pain with chewing) - highly specific, 50% of cases
  - Visual symptoms - transient vision loss (amaurosis fugax), diplopia, permanent vision loss
  - Constitutional symptoms - fever, weight loss, fatigue, malaise
  - Associated polymyalgia rheumatica symptoms in 40-60%
  - Laboratory studies
  - ESR markedly elevated (typically greater than 50 mm/hr, often greater than 100)
  - CRP elevated (more sensitive than ESR)
  - Normocytic anemia, thrombocytosis common
  - Elevated alkaline phosphatase (25% of cases)
  - Temporal artery ultrasound - halo sign (hypoechoic wall thickening), stenosis, occlusion
  - Non-invasive, can be performed quickly, sensitivity 70-80%
  - Temporal artery biopsy - gold standard for diagnosis
  - 2-3 cm segment (skip lesions), unilateral usually sufficient
  - Shows transmural granulomatous inflammation with multinucleated giant cells
  - Can be positive up to 2 weeks after starting steroids - do NOT delay treatment
  - MRI or CT angiography if large vessel involvement suspected
  - Fundoscopic examination by ophthalmology - assess for ischemic optic neuropathy
  - ACR 1990 criteria (3 of 5) - age greater than 50, new headache, temporal artery abnormality, ESR greater than 50, positive biopsy
treatment:
  - High-dose corticosteroids IMMEDIATELY if GCA suspected - do NOT wait for biopsy
  - Vision loss is emergency requiring IV pulse steroids
  - Prednisone 40-60 mg daily (1 mg/kg) for uncomplicated GCA
  - Start same day as clinical suspicion, before biopsy
  - If visual symptoms present or imminent vision loss
  - Methylprednisolone 1000 mg IV daily for 3 days, then transition to high-dose oral prednisone
  - Obtain temporal artery biopsy within 1-2 weeks of starting steroids
  - Initial high dose for 2-4 weeks until symptoms resolve and inflammatory markers normalize
  - Gradual taper over 12-18 months (total treatment duration typically 1-2 years)
  - Decrease by 10% every 2 weeks initially, slower taper at lower doses
  - Monitor ESR/CRP every 2-4 weeks during taper
  - Increase dose if symptoms recur or ESR/CRP rise
  - Steroid-sparing agents for relapsing disease or to reduce steroid exposure
  - Methotrexate 10-25 mg weekly (modest benefit)
  - Tocilizumab (IL-6 receptor antagonist) 162 mg SC weekly or every other week - FDA approved, very effective
  - Bone protection
  - Calcium 1200 mg daily, vitamin D 800-1000 IU daily
  - Bisphosphonate (alendronate 70 mg weekly) for osteoporosis prevention
  - Low-dose aspirin 81 mg daily (reduces risk of ischemic complications)
  - Monitor for steroid complications - diabetes, hypertension, cataracts, glaucoma, osteoporosis
  - Ophthalmology follow-up if any visual symptoms
clinical_pearls:
  - Medical emergency - permanent vision loss occurs in 15-20% if untreated
  - Vision loss usually sudden, painless, monocular (anterior ischemic optic neuropathy)
  - Once vision lost, rarely recovers - prevention is critical
  - Median age 75 years, rarely before age 50, 2-3x more common in women
  - More common in Northern Europeans, especially Scandinavian descent
  - Polymyalgia rheumatica and GCA overlap - 15-20% of PMR develop GCA, 40-60% of GCA have PMR symptoms
  - Normal ESR does NOT rule out GCA (5-10% have normal ESR)
  - Jaw claudication most specific symptom (50% sensitive, 95% specific)
  - Temporal artery biopsy can be negative due to skip lesions (sample adequate length)
  - Dramatic response to steroids within 24-48 hours supports diagnosis
  - Relapse rate 50-60% during steroid taper - requires long treatment duration
differentials:
  - Tension headache (bilateral, band-like, no systemic symptoms, normal ESR)
  - Migraine (younger patients, aura, photophobia, family history)
  - Trigeminal neuralgia (lancinating facial pain, trigger points)
  - TMJ dysfunction (jaw pain worse with chewing but no systemic symptoms)
  - Primary CNS vasculitis (headache, stroke-like symptoms, normal temporal artery biopsy)
  - Infection (meningitis, encephalitis - fever, neck stiffness, CSF abnormalities)
  - Malignancy (older patient, weight loss, but no jaw claudication or visual symptoms)
  - Cervical spondylosis with referred headache (neck pain, radicular symptoms)
trace:
  - 74-year-old woman presents to ED with 3-week history of severe new-onset headache
  - Headache bilateral temporal region, constant throbbing 7/10
  - Scalp tenderness when brushing hair
  - Past week developed pain in jaw when eating, improves when stops chewing
  - Yesterday had brief episode of vision loss in right eye lasting 10 minutes (amaurosis fugax)
  - Today vision blurry in right eye, prompted ED visit
  - Associated symptoms - fatigue, 8-pound unintentional weight loss, low-grade fevers
  - Also shoulder and hip stiffness and pain, worse in morning
  - Past medical history - hypertension, osteopenia
  - Medications - amlodipine, calcium/vitamin D
  - Physical exam - appears tired, well-nourished
  - Vitals - temp 37.8C, BP 145/85, HR 82
  - Head exam - right temporal artery prominent, thickened, tender to palpation, decreased pulsation
  - Left temporal artery normal
  - Visual acuity - right eye 20/80 (decreased from baseline 20/30), left eye 20/25
  - Fundoscopy - right optic disc pale with blurred margins (ischemic optic neuropathy)
  - No jaw tenderness, normal ROM neck
  - Musculoskeletal - bilateral shoulder and hip tenderness, pain with active ROM
  - Labs - WBC 11.5 K/uL, Hemoglobin 11.2 g/dL (normocytic anemia), platelets 450 K/uL (thrombocytosis)
  - ESR 98 mm/hr (markedly elevated), CRP 85 mg/L (markedly elevated)
  - Comprehensive metabolic panel - alkaline phosphatase 180 U/L (elevated), otherwise normal
  - Diagnosis - Giant cell arteritis with anterior ischemic optic neuropathy (vision-threatening emergency)
  - IMMEDIATE treatment initiated
  - Methylprednisolone 1000 mg IV bolus given in ED
  - Urgent ophthalmology consultation obtained
  - Ophthalmology confirmed ischemic optic neuropathy right eye
  - Admitted for IV pulse steroids
  - Methylprednisolone 1000 mg IV daily for 3 days
  - Urgent temporal artery biopsy scheduled (within 24 hours)
  - Started aspirin 81 mg daily
  - Day 2 - temporal artery biopsy performed (right side, 3 cm segment)
  - Headache significantly improved within 24 hours of steroids
  - Vision right eye stable (not worsening)
  - Day 3 - completed pulse steroids
  - Transitioned to prednisone 60 mg daily PO
  - Temporal artery biopsy pathology - transmural granulomatous inflammation with multinucleated giant cells, consistent with giant cell arteritis
  - Diagnosis confirmed
  - Discharged on prednisone 60 mg daily with close rheumatology follow-up
  - Bone protection - alendronate 70 mg weekly added, continue calcium/vitamin D
  - Plan for slow taper over 12-18 months
  - 2-week follow-up - headache resolved, jaw claudication resolved
  - Vision right eye stable at 20/80 (permanent partial loss)
  - ESR decreased to 22 mm/hr, CRP 8 mg/L (marked improvement)
  - Began prednisone taper - decreased to 50 mg daily
  - 3-month follow-up - doing well on prednisone 30 mg daily
  - No recurrence of symptoms, ESR and CRP normal
  - Continued slow taper
  - 1-year follow-up - tapered to prednisone 7.5 mg daily
  - Added tocilizumab 162 mg SC every other week as steroid-sparing agent
  - Goal to discontinue prednisone over next 6 months
  - Outcome - Vision loss right eye permanent but no further progression, otherwise excellent control
