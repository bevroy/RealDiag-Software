tree_id: OPHT-REFRACTIVE-ERROR
name: Refractive Error (Encounter)
family: ophthalmology
specialty: Ophthalmology, Optometry, Primary Care
chief_complaint: Blurry vision, difficulty seeing clearly
description: |
  Refractive errors occur when the eye cannot properly focus light on the retina, resulting in blurred vision.
  Types include myopia (nearsightedness), hyperopia (farsightedness), astigmatism, and presbyopia.
icd10: H52.9
snomed: "39021009"
presentations:
  - Blurred vision at distance (myopia) or near (hyperopia)
  - Difficulty reading small print (presbyopia in adults over 40)
  - Eye strain or headaches with prolonged visual tasks
  - Squinting to see clearly
  - Difficulty seeing at night
  - Need to hold reading material far away or very close
urgency: Low
referrals:
  optometry_ophthalmology:
    - All patients needing vision correction
    - Comprehensive eye exam with refraction
workup:
  - Visual acuity testing - Snellen chart for distance, near card for near vision
  - Refraction - determine lens prescription for optimal vision
  - Comprehensive eye exam - rule out other causes of vision changes
treatment:
  - Eyeglasses - simplest and safest correction
  - Contact lenses - provides wider field of vision, better for sports
  - Refractive surgery - LASIK, PRK for permanent correction (adults with stable prescription)
  - Reading glasses for presbyopia
clinical_pearls:
  - Most common cause of vision impairment worldwide
  - Myopia (nearsightedness) most common in children and young adults
  - Presbyopia (age-related loss of near focus) affects everyone over 40
  - Children should have vision screening - undetected refractive error affects learning
  - Sudden vision changes require urgent evaluation to rule out serious pathology
differentials:
  - Cataracts
  - Macular degeneration
  - Diabetic retinopathy
  - Retinal detachment
  - Corneal disease
trace:
  - 10-year-old presents with difficulty seeing board at school, squinting. Visual acuity 20/80 both eyes. Refraction shows myopia requiring minus lenses. Fitted for eyeglasses. Vision corrects to 20/20 with glasses. Annual eye exams recommended.
citations:
  - American Academy of Ophthalmology Guidelines
  - UpToDate - Ophthalmology
