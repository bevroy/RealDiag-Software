tree_id: CARD-HTN
name: Hypertension
family: Cardiology
specialty: Cardiology
icd10:
- I10
snomed:
- '38341003'
urgency: medium
description: Comprehensive evaluation and management of Hypertension
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- elevated blood pressure ≥130/80 mmHg
- often asymptomatic
- risk factor for cardiovascular disease
- 'Stage 1: SBP 130-139 or DBP 80-89 mmHg'
- 'Stage 2: SBP ≥140 or DBP ≥90 mmHg'
- Usually asymptomatic (silent killer)
- 'Complications: Stroke, MI, heart failure, CKD, retinopathy'
workup:
- 'Confirm diagnosis: Repeat BP measurements on 2+ visits or home BP monitoring'
- 'Baseline labs: BMP (K, Cr), fasting glucose, lipid panel, UA, ECG'
- 'Screen for secondary causes if: Age <30, resistant HTN, hypokalemia, abdominal
  bruit'
- 'Secondary causes: Renal artery stenosis, primary aldosteronism, pheochromocytoma,
  Cushing''s'
treatment:
- 'Guideline-based treatment options for Hypertension include:'
- 'Lifestyle first if Stage 1 without ASCVD: Weight loss, DASH diet, exercise 150
  min/week, limit alcohol (ACC/AHA 2023)'
- 'Start medication if: Stage 2 OR Stage 1 with ASCVD/diabetes/CKD (ACC/AHA 2023)'
- 'First-line: Thiazide (chlorthalidone 12.5-25mg), ACEi (lisinopril 10-40mg), ARB
  (losartan 50-100mg), or CCB (amlodipine 5-10mg) (ACC/AHA 2023)'
- 'Black patients: CCB or thiazide first-line (ACEi less effective as monotherapy)
  (ACC/AHA 2023)'
- 'Combination therapy: Often need 2+ medications (ACEi/ARB + CCB or diuretic) (ACC/AHA
  2023)'
clinical_pearls:
- 'Confirm diagnosis: Home BP monitoring or 24-hour ambulatory BP (more accurate than
  office)'
- 'White coat hypertension: Elevated in office, normal at home (20-30% of diagnoses)'
- 'Target BP: <130/80 for most adults, <140/90 if age >65'
- 'First-line medications: ACEi/ARB, CCB, thiazide diuretic'
- 'Lifestyle: Weight loss 5-10 kg reduces SBP 5-20 mmHg, DASH diet, exercise, limit
  alcohol'
referrals:
- 'Nephrology if: Resistant HTN (not controlled on 3+ meds) or concern for secondary
  causes'
- 'Cardiology if: Target organ damage (LVH, CAD)'
differentials: []
trace:
  source: American College of Cardiology (ACC/AHA) Clinical Practice Guidelines, European
    Society of Cardiology (ESC) Guidelines
  version: 0.1.0
