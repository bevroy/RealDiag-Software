tree_id: HEM-ANEMIA-IRON-DEFICIENCY
name: Iron Deficiency Anemia
family: Hematology
specialty: Hematology
chief_complaint: Fatigue and pallor
description: Most common cause of anemia worldwide, resulting from inadequate iron for hemoglobin synthesis. Identify and treat underlying cause (GI blood loss most common in adults), iron supplementation corrects anemia.
icd10: D50.9
urgency: non-urgent

workup:
  - Complete blood count: low hemoglobin (men <13, women <12), low MCV <80 (microcytic), low MCHC (hypochromic)
  - Iron studies: low serum iron, low ferritin <30 (most specific), high TIBC >450, low transferrin saturation <20%
  - Peripheral smear: microcytic hypochromic RBCs, anisopoikilocytosis, possible target cells, pencil cells
  - Reticulocyte count: normal or low (inappropriately low response - bone marrow cannot compensate without iron)
  - Identify underlying cause (most important): GI blood loss (most common in adults), menstrual blood loss (premenopausal women), malabsorption (celiac disease), dietary insufficiency
  - GI evaluation: colonoscopy and upper endoscopy if no obvious source (mandatory in men and postmenopausal women to rule out GI malignancy)
  - Celiac serology: tTG-IgA if malabsorption suspected
  - Stool for occult blood: screening test but poor sensitivity for intermittent bleeding
  - Evaluate for chronic blood loss: hemoglobinuria, hematuria

treatment:
  - Treat underlying cause: most important step (stop GI bleeding source, treat celiac disease, manage menorrhagia)
  - Oral iron supplementation: ferrous sulfate 325 mg (65 mg elemental iron) TID on empty stomach with vitamin C (enhances absorption)
  - Take 1 hour before meals or 2 hours after (food decreases absorption by 40-50%)
  - Side effects common: constipation, nausea, black stools, epigastric discomfort (dose-related)
  - Alternative oral formulations: ferrous gluconate or ferrous fumarate if intolerance, polysaccharide iron complex better tolerated
  - Duration: continue 3-6 months after hemoglobin normalizes to replete iron stores (ferritin goal >50)
  - Response to therapy: reticulocytosis in 7-10 days, hemoglobin rises 1-2 g/dL per month
  - IV iron: if oral intolerance, malabsorption, ongoing blood loss exceeding replacement, severe anemia, chronic kidney disease
  - IV iron options: iron sucrose 200 mg IV over 2-5 minutes (multiple doses), ferric carboxymaltose 750 mg (faster repletion, fewer doses)
  - Transfusion: rarely needed unless symptomatic severe anemia (Hgb <7) or hemodynamically unstable
  - Follow-up: recheck CBC and iron studies at 4-6 weeks (expect Hgb improvement 1-2 g/dL), then every 2-3 months until normal

clinical_pearls:
  - Low ferritin <30 most specific for iron deficiency (but acute phase reactant - can be falsely elevated with inflammation)
  - Microcytic hypochromic anemia with low ferritin diagnostic
  - MUST identify underlying cause - GI blood loss most common in adult men and postmenopausal women (colonoscopy and EGD mandatory)
  - Oral iron ferrous sulfate 325 mg TID on empty stomach with vitamin C
  - Continue 3-6 months after Hgb normalizes to replete stores
  - Hemoglobin rises 1-2 g/dL per month with treatment
  - IV iron if oral intolerance or malabsorption
  - Thalassemia also microcytic but normal/elevated ferritin - different diagnosis

differentials:
  - Thalassemia: microcytic anemia but normal or elevated ferritin, elevated RBC count, hemoglobin electrophoresis diagnostic
  - Anemia of chronic disease: normocytic or mildly microcytic, low-normal iron, normal/elevated ferritin, low TIBC (opposite of iron deficiency)
  - Sideroblastic anemia: microcytic, ringed sideroblasts on bone marrow, elevated ferritin
  - Lead poisoning: microcytic anemia, basophilic stippling, elevated lead level

trace: |
  A 62-year-old man presented with 3 months progressive fatigue, dyspnea on exertion, and lightheadedness. No overt GI bleeding but occasional dark stools. Exam showed conjunctival pallor. Labs showed Hgb 8.2 (low), MCV 72 (microcytic), ferritin 8 (very low), iron 22 (low), TIBC 468 (high), transferrin saturation 5% (very low). Peripheral smear confirmed microcytic hypochromic RBCs. Diagnosed with severe iron deficiency anemia. Colonoscopy showed 2.5 cm cecal mass, biopsy revealed adenocarcinoma. Upper endoscopy normal. Referred to surgery for right hemicolectomy. Preoperatively started ferrous sulfate 325 mg TID with vitamin C, patient had nausea and constipation so switched to polysaccharide iron complex 150 mg daily better tolerated. Given one unit pRBCs preoperatively to Hgb 9.4. Underwent successful laparoscopic right hemicolectomy, pathology stage II colon cancer (pT3N0). Postoperatively continued iron supplementation. At 6 weeks Hgb 11.2, reticulocyte count elevated (appropriate response). At 3 months Hgb 13.8 (normalized), ferritin 65. Continued iron x3 more months. At 6 months ferritin 82 (replete), discontinued iron. Remains in cancer remission, anemia resolved, excellent energy level.
