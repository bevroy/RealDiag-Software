urgency: medium
description: Comprehensive evaluation and management of Epilepsy, unspecified
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- convulsions, loss of consciousness, altered awareness
- postictal confusion
- may have aura or automatisms
- Recurrent unprovoked seizures (≥2 seizures >24 hours apart)
- 'Generalized: Tonic-clonic, absence, myoclonic, atonic'
- 'Focal: Aware vs impaired awareness, with or without motor symptoms'
workup:
- 'EEG: Interictal spikes, sharp waves (50% first EEG, 80% after repeat)'
- 'MRI brain with epilepsy protocol: Hippocampal sclerosis, cortical dysplasia, tumors'
- 'AED levels: Phenytoin, valproate, carbamazepine (not needed for levetiracetam,
  lamotrigine)'
- 'Metabolic panel: Rule out electrolyte abnormalities triggering seizures'
treatment:
- 'Guideline-based treatment options for Epilepsy, unspecified include:'
- 'First seizure: Neuro consult, EEG, MRI brain, consider AED if high recurrence risk
  (AAN 2024)'
- 'Recurrent seizures: Start AED (levetiracetam 500mg BID or lamotrigine 25mg daily
  titrate) (AAN 2024)'
- 'Monotherapy first: Start one AED, titrate to effect, if fails try alternative monotherapy
  (AAN 2024)'
- 'Seizure precautions: No driving (state-specific, typically 3-12 months seizure-free),
  no swimming alone, no heights (AAN 2024)'
- 'Breakthrough seizure: Check AED levels, assess compliance, identify triggers (sleep
  deprivation, alcohol, meds) (AAN 2024)'
clinical_pearls:
- 'Diagnosis: ≥2 unprovoked seizures OR 1 seizure + high recurrence risk (>60% at
  10 years)'
- 'EEG: Interictal epileptiform discharges support diagnosis (50% yield, repeat improves
  to 80%)'
- 'MRI brain: Rule out structural cause (tumor, vascular malformation, hippocampal
  sclerosis)'
- 'First-line AEDs: Levetiracetam (broad spectrum, few interactions), lamotrigine,
  valproate'
- 'Focal seizures: Levetiracetam, lamotrigine, carbamazepine, oxcarbazepine'
- 'Generalized seizures: Valproate (avoid women of childbearing age), levetiracetam,
  lamotrigine'
referrals:
- 'Neurology for: New-onset seizures, medication management, refractory epilepsy'
- 'Epilepsy surgery evaluation if: Drug-resistant (failed ≥2 appropriate AEDs)'
differentials: []
