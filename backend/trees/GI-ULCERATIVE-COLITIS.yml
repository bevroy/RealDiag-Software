tree_id: GI-ULCERATIVE-COLITIS
name: Ulcerative Colitis
family: gastroenterology
specialty: Gastroenterology
icd10: K51.90
snomed: 64766004
urgency: []
homeopathy: []
presentations:
  - Bloody diarrhea (hallmark symptom)
  - Urgency and tenesmus (frequent urge to defecate)
  - Lower abdominal cramping and pain
  - Rectal bleeding and mucus in stool
  - Chronic, relapsing-remitting course
  - Weight loss and malnutrition in severe disease
  - Fever in moderate to severe flares
  - Extraintestinal manifestations: arthritis, erythema nodosum, pyoderma gangrenosum, uveitis, PSC
  - Young age of onset (peak 15-30 years, second peak 50-70 years)
workup:
  - Colonoscopy with biopsies - gold standard for diagnosis
  - Continuous mucosal inflammation starting from rectum extending proximally
  - Loss of vascular pattern, friability, erosions, ulcerations
  - Pseudopolyps in chronic disease
  - Biopsies show chronic inflammation, crypt abscesses, crypt distortion
  - Laboratory tests
  - CBC (anemia from chronic bleeding, leukocytosis in flares)
  - CMP (hypoalbuminemia, electrolyte abnormalities)
  - ESR and CRP (elevated in active disease)
  - Fecal calprotectin (>250 μg/g suggests active inflammation)
  - Stool studies to rule out infectious colitis (C. diff, E. coli O157:H7, Campylobacter)
  - Assess disease severity
  - Mild: less than 4 stools/day, minimal bleeding, no systemic symptoms
  - Moderate: 4-6 stools/day, moderate bleeding, mild systemic symptoms
  - Severe: greater than 6 bloody stools/day, fever, tachycardia, anemia, ESR greater than 30
  - CT or MRI abdomen/pelvis if concern for complications (toxic megacolon, perforation)
treatment:
  - Medical therapy based on disease extent and severity
  - Mild to moderate distal colitis (proctitis, left-sided)
  - 5-ASA suppositories (mesalamine 1000 mg PR daily) or enemas (4 g PR daily)
  - Oral 5-ASA (mesalamine 2.4-4.8 g daily) if topical insufficient
  - Mild to moderate extensive colitis
  - Oral 5-ASA (mesalamine 2.4-4.8 g daily)
  - Consider adding topical 5-ASA for faster response
  - Moderate to severe or refractory disease
  - Systemic corticosteroids: prednisone 40-60 mg daily, taper over 8-12 weeks
  - Avoid long-term steroid use (steroid-dependent defined as inability to taper below prednisone 10 mg)
  - Immunomodulators: azathioprine 2-2.5 mg/kg daily or 6-mercaptopurine (steroid-sparing)
  - Biologics for moderate-severe or steroid-dependent disease
  - Anti-TNF: infliximab, adalimumab, golimumab
  - Anti-integrin: vedolizumab (gut-selective)
  - Anti-IL12/23: ustekinumab
  - JAK inhibitors: tofacitinib (oral small molecule)
  - Severe/fulminant colitis - hospitalization required
  - IV corticosteroids (methylprednisolone 60 mg or hydrocortisone 100 mg QID)
  - If no response in 3-5 days: rescue therapy (infliximab, cyclosporine) or colectomy
  - Monitor for toxic megacolon (colon >6 cm, systemic toxicity)
  - Surgical management
  - Total colectomy with ileal pouch-anal anastomosis (IPAA) - curative
  - Indications: refractory disease, dysplasia/cancer, toxic megacolon
clinical_pearls:
  - "UC limited to colon (vs Crohn's which can affect any GI tract segment)"
  - "Continuous inflammation from rectum extending proximally (vs skip lesions in Crohn's)"
  - "Increased risk of colorectal cancer - start surveillance colonoscopy 8-10 years after diagnosis"
  - "PSC (primary sclerosing cholangitis) associated with UC in 5% - increases cancer risk"
  - "Toxic megacolon is surgical emergency - colon dilation >6 cm with systemic toxicity"
  - "Smoking protective for UC (opposite of Crohn's) - mechanism unknown"
  - "C. difficile infection common trigger for UC flares - always test in hospitalized patients"
  - "Colectomy is curative for UC but pouchitis occurs in 50% of IPAA patients"
referrals:
  - Gastroenterology for colonoscopy, diagnosis confirmation, and ongoing management
  - Colorectal surgery for refractory disease, dysplasia, or complications
  - Ophthalmology if ocular symptoms (uveitis, episcleritis)
  - Dermatology for skin manifestations (erythema nodosum, pyoderma gangrenosum)
differentials:
  - Ulcerative colitis (continuous inflammation from rectum, superficial)
  - Crohn's disease (skip lesions, transmural, can affect any GI segment, fistulas)
  - Infectious colitis (C. diff, Campylobacter, E. coli O157:H7, Salmonella, Shigella)
  - Ischemic colitis (elderly, vascular disease, thumbprinting on imaging)
  - Microscopic colitis (chronic watery diarrhea, normal colonoscopy, biopsy diagnosis)
  - Diverticulitis (left lower quadrant pain, fever, CT shows inflammation)
  - Colorectal cancer (weight loss, change in bowel habits, mass on colonoscopy)
  - Radiation colitis (history of pelvic radiation)
