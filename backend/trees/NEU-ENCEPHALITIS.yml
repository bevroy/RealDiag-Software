author: RealDiag Clinical Team
homeopathy: []
presentations:
- Altered mental status, confusion, disorientation (hallmark of encephalitis)
- Fever, headache, neck stiffness
- Seizures (focal or generalized, 50% of HSV cases)
- Focal neurologic deficits (weakness, aphasia, ataxia)
- Personality changes, behavioral abnormalities, agitation
- 'HSV encephalitis: Temporal lobe involvement on MRI (most common treatable cause)'
- 'CSF findings: Lymphocytic pleocytosis, elevated protein, normal/low glucose, RBCs
  if hemorrhagic'
- 'MRI: Temporal lobe enhancement, hemorrhagic changes (HSV); thalamic (arbovirus)'
- 'EEG: PLEDS (periodic lateralizing epileptiform discharges) suggests HSV'
- 'Viral causes: HSV-1 (most common), VZV, enteroviruses, arboviruses (West Nile),
  EBV'
- Mortality 70% if HSV untreated; 30% with acyclovir treatment
- Start empiric acyclovir immediately - do NOT wait for PCR confirmation
workup:
- 'LP: Lymphocytic pleocytosis (10-500 WBC), elevated protein (50-100), normal glucose,
  RBCs if HSV'
- 'HSV PCR (CSF): 95% sensitive after 72 hours, 98% specific (gold standard)'
- 'MRI brain: FLAIR hyperintensity in temporal lobes (HSV), thalamus (West Nile),
  basal ganglia (EV-71)'
- 'EEG: Periodic lateralized epileptiform discharges (PLEDs) in temporal lobe suggest
  HSV'
treatment:
- 'Guideline-based treatment options for Encephalitis include:'
- 'Empiric acyclovir 10mg/kg IV q8h: Start immediately if encephalitis suspected (AAN
  2024)'
- 'LP: Cell count, protein, glucose, HSV PCR, VZV PCR, bacterial culture, enterovirus
  PCR (AAN 2024)'
- 'MRI brain with contrast: Temporal lobe involvement suggests HSV (AAN 2024)'
- 'Supportive: Seizure management, ICP monitoring if needed (AAN 2024)'
- Continue acyclovir x14-21 days if HSV confirmed (21 days for severe cases) (AAN
  2024)
clinical_pearls:
- 'HSV encephalitis: Most common fatal sporadic encephalitis, temporal lobe involvement'
- 'Start acyclovir empirically if suspicion: Do NOT wait for PCR results (high mortality
  if delayed)'
- 'MRI: Temporal lobe inflammation (HSV), thalamic (arbovirus), basal ganglia (EV-71)'
- 'LP: Lymphocytic pleocytosis, elevated protein, normal glucose (viral pattern)'
- 'HSV PCR: 95% sensitive after 72 hours, may be negative early (repeat if high suspicion)'
referrals:
- Neurology STAT for diagnosis and management
- 'ICU admission for: Altered mental status, seizures, respiratory compromise'
- 'Infectious disease consult: For atypical organisms, immunocompromised'
differentials:
  - Meningitis
  - Brain abscess
  - Stroke
  - Autoimmune encephalitis
  - Metabolic encephalopathy
