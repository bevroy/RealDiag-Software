urgency: urgent
description: Comprehensive evaluation and management of Acute Angle-Closure Glaucoma
version: '1.0'
citations:
  - Clinical Practice Guidelines from relevant medical specialty societies
  - UpToDate Clinical Reference
  - Evidence-based medical literature
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden severe eye pain (deep, boring, unilateral pain)
- Blurred vision, halos around lights (from corneal edema)
- Red eye with conjunctival injection, "steamy" cloudy cornea
- Fixed mid-dilated pupil (4-6mm, unresponsive to light)
- Rock-hard eye on palpation (elevated intraocular pressure)
- Nausea, vomiting, headache (from elevated IOP and pain)
- 'IOP markedly elevated: >30 mmHg (normal 10-21), often 40-80 mmHg'
- 'Triggers: Dim lighting (pupil dilation), anticholinergic meds, emotional stress'
- 'Mechanism: Narrow anterior chamber angle, iris blocks aqueous drainage'
- 'Risk factors: Hyperopia (farsighted), Asian ancestry, age >60, family history'
- Ophthalmologic emergency - permanent vision loss within hours if untreated
- Fellow eye at 50% risk - needs prophylactic laser iridotomy
workup:
- 'IOP: Markedly elevated (40-80 mmHg) - check with tonometry'
- 'Gonioscopy: Closed angle (iris against trabecular meshwork) - do after acute attack
  resolves'
- 'Slit lamp: Corneal edema (cloudy), shallow anterior chamber, mid-dilated non-reactive
  pupil'
- 'Visual acuity: Often decreased to counting fingers or hand motion'
treatment:
- 'Guideline-based treatment options for Acute Angle-Closure Glaucoma include:'
- 'IMMEDIATE IOP lowering (goal <40 mmHg within 1 hour): Acetazolamide 500mg IV, timolol
  0.5% drops, apraclonidine 1% drops, pilocarpine 2% q15min (constricts pupil) (AAO
  2023)'
- Mannitol 1-2 g/kg IV if IOP remains >40 mmHg (osmotic diuresis) (AAO 2023)
- 'Antiemetics: Ondansetron 4mg IV (vomiting common) (AAO 2023)'
- 'Definitive: Laser peripheral iridotomywithin 24-48 hours - creates hole in iris
  for aqueous drainage (AAO 2023)'
- Prophylactic LPI in fellow eye to prevent bilateral involvement (AAO 2023)
clinical_pearls:
- OPHTHALMOLOGIC EMERGENCY - permanent vision loss within hours if untreated
- 'Mechanism: Pupillary dilation causes iris to block trabecular meshwork (narrow
  angle) - aqueous cannot drain'
- 'Risk factors: Hyperopia (farsighted), Asian ancestry, shallow anterior chamber,
  family history, age >60'
- 'Precipitants: Pupil dilation (dim lighting, anticholinergics, sympathomimetics),
  emotional stress'
- Fellow eye at 50% risk within 5-10 years - prophylactic laser iridotomy recommended
referrals:
- Ophthalmology EMERGENTLY - call immediately, patient needs laser iridotomy within
  hours
- If ophthalmology unavailable, transfer to facility with ophthalmology after starting
  medical therapy
differentials:
  - Acute uveitis
  - Migraine
  - Corneal abrasion
  - Conjunctivitis
