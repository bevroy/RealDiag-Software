id: OBGYN-VAGINAL-BLEEDING
title: Vaginal Bleeding Diagnostic Tree
family: Obstetrics and Gynecology
specialty: Obstetrics and Gynecology/Emergency Medicine
version: 1.0
icd10: R58
snomed: 289530006
presentations:
  - Abnormal uterine bleeding
  - Heavy, prolonged, or frequent periods
  - Postcoital bleeding
  - Postmenopausal bleeding
  - Associated pain, cramping
  - Hemodynamic instability if severe
last_updated: 2025-11-20
evidence_level: ACOG Guidelines, WHO Guidelines
entry: initial_assessment

treatment:
  - Ectopic pregnancy: methotrexate if stable + hCG <5000, or surgery
  - Threatened abortion: expectant management, pelvic rest
  - Miscarriage: expectant, medical (misoprostol), or surgical (D&C)
  - Menorrhagia: NSAIDs, tranexamic acid, hormonal therapy (OCPs, IUD)
  - Postmenopausal bleeding: endometrial biopsy, treat based on pathology
  - Hemorrhage: IV fluids, transfuse if unstable, uterine massage, uterotonics

clinical_pearls:
  - Always get pregnancy test in women of reproductive age with vaginal bleeding
  - Postmenopausal bleeding = endometrial cancer until proven otherwise (biopsy required)
  - Ectopic pregnancy can present with minimal bleeding but catastrophic rupture
  - Heavy menstrual bleeding (HMB) = >80mL per cycle or bleeding >7 days
  - Ovulatory bleeding = regular, predictable; anovulatory = irregular, unpredictable
  - PALM-COEIN classification for abnormal uterine bleeding

red_flags:
  - Hypotension or tachycardia (hemorrhagic shock)
  - Positive pregnancy test with abdominal pain (ectopic pregnancy)
  - Postmenopausal bleeding (endometrial cancer risk 10%)
  - Severe anemia (Hgb <7, requires transfusion)
  - Cervical mass with bleeding (cervical cancer)
  - Pregnancy with heavy bleeding (miscarriage, ectopic, molar pregnancy)

differentials:
  - Menstruation
  - Cervicitis
  - Polyps
  - Trauma
  - Malignancy

referrals:
  emergency:
    - Severe hemorrhage
    - Ectopic rupture
  urgent:
    - Heavy bleeding
    - Suspected malignancy
  routine:
    - Abnormal periods
    - Routine GYN
nodes:
- id: initial_assessment
  when: {}
  description: Initial vaginal bleeding evaluation
  tests:
  - History
    - Last menstrual period (LMP), cycle regularity
    - Quantity (pads/tampons per day, clots, flooding)
    - Duration of current episode
    - Associated symptoms (pain, fever, dizziness)
    - Sexual activity, contraception use
    - Prior pregnancies, miscarriages, STI history
  - Vital signs (orthostatic hypotension, tachycardia)
  - Abdominal exam (tenderness, masses, peritoneal signs)
  - Speculum exam (visualize cervix, source of bleeding)
  - Bimanual exam (uterine size, adnexal masses, cervical motion tenderness)
  - Pregnancy test (urine or serum beta-hCG) - MANDATORY in reproductive age
  - CBC (hemoglobin, assess anemia)
  suggest_dx: []
  next:
  - when:
      vital_signs_any:
      - hypotension
      - severe_tachycardia
      - signs_of_shock
    go: hemorrhagic_emergency
  - when:
      pregnancy_test: positive
    go: pregnancy_related_bleeding
  - when:
      patient_characteristics: postmenopausal
    go: postmenopausal_bleeding
  - when:
      age: reproductive
    go: abnormal_uterine_bleeding
  - default: abnormal_uterine_bleeding

- id: hemorrhagic_emergency
  when:
    vital_signs_any:
    - SBP: '<90'
    - HR: '>120'
    - orthostatic_hypotension: present
  description: Life-threatening vaginal hemorrhage
  tests:
  - Vital signs every 15 minutes
  - CBC, type and crossmatch (2-4 units PRBCs)
  - Coagulation studies (PT/INR, aPTT, fibrinogen)
  - BMP (creatinine)
  - Pregnancy test
  - Pelvic ultrasound (identify source)
  suggest_dx:
  - Ruptured ectopic pregnancy
  - Incomplete abortion with retained products
  - Placenta previa or abruption (if pregnant)
  - Uterine atony postpartum
  - Cervical or uterine laceration
  - Coagulopathy
  referrals:
  - OB/GYN STAT
  - Surgery if ruptured ectopic
  - ICU admission
  management:
  - Resuscitation
    - 2 large-bore IVs (16-18 gauge)
    - IV fluid bolus (1-2L NS or LR)
    - Transfuse PRBCs if Hgb <7 or hemodynamic instability
    - Massive transfusion protocol if ongoing hemorrhage
  - Uterotonic agents (if postpartum or postabortal)
    - Oxytocin 10-40 units IV infusion
    - Methylergonovine 0.2mg IM (contraindicated if hypertensive)
    - Misoprostol 800mcg rectally
  - Tranexamic acid 1g IV over 10 minutes (antifibrinolytic)
  - Emergency interventions
    - Uterine tamponade (Bakri balloon)
    - Dilation and curettage (D&C) for retained products
    - Laparoscopy/laparotomy for ruptured ectopic
    - Uterine artery embolization (interventional radiology)
    - Hysterectomy (last resort)
  - NPO for possible surgery
  next:
  - default: null

- id: pregnancy_related_bleeding
  when:
    pregnancy_test: positive
  description: Bleeding in pregnancy
  tests:
  - Quantitative beta-hCG
  - Pelvic ultrasound
    - Transvaginal preferred (better visualization early pregnancy)
    - Intrauterine gestational sac (IUP) vs extrauterine
    - Fetal cardiac activity
  - CBC
  - Blood type and Rh status
  - Progesterone level (if early pregnancy, uncertain viability)
  suggest_dx: []
  next:
  - when:
      all_of:
      - abdominal_pain: severe
      - peritoneal_signs: present
    go: ruptured_ectopic
  - when:
      ultrasound: no_IUP_and_hCG_high
    go: ectopic_pregnancy
  - when:
      ultrasound: IUP_no_cardiac_activity
    go: early_pregnancy_loss
  - when:
      all_of:
      - ultrasound: IUP_with_cardiac_activity
      - gestational_age: '<20_weeks'
    go: threatened_abortion
  - when:
      gestational_age: '>=20_weeks'
    go: third_trimester_bleeding
  - default: early_pregnancy_loss

- id: ruptured_ectopic
  when:
    all_of:
    - pregnancy_test: positive
    - peritoneal_signs: present
    - hemodynamic_instability: present
  description: Ruptured ectopic pregnancy - SURGICAL EMERGENCY
  tests:
  - Do NOT delay surgery for imaging if unstable
  - Focused assessment with sonography for trauma (FAST) - free fluid in pelvis
  - Type and crossmatch
  - CBC, coagulation studies
  suggest_dx:
  - Ruptured ectopic pregnancy (tubal most common)
  referrals:
  - OB/GYN STAT
  - OR immediately
  management:
  - Resuscitation (IVs, fluids, blood transfusion)
  - Emergency laparoscopy or laparotomy
    - Salpingectomy (remove affected tube)
    - Or salpingostomy (preserve tube if other tube absent/damaged)
  - RhoGAM 300mcg IM if Rh-negative
  - Methotrexate NOT appropriate (patient unstable)
  next:
  - default: null

- id: ectopic_pregnancy
  when:
    all_of:
    - pregnancy_test: positive
    - ultrasound: no_intrauterine_pregnancy
    - beta_hCG: elevated
  description: Ectopic pregnancy (unruptured)
  tests:
  - Serial beta-hCG (q48h, should rise >50% if viable IUP)
  - Transvaginal ultrasound
    - Adnexal mass (tubal ectopic)
    - No intrauterine gestational sac
    - Free fluid in pelvis (concerning for rupture)
  - Discriminatory zone - hCG >1500-2000, should see IUP if present
  suggest_dx:
  - Ectopic pregnancy (95% tubal, 5% ovarian/abdominal/cervical/cesarean scar)
  referrals:
  - OB/GYN urgently
  management:
  - Medical management (methotrexate) if
    - Hemodynamically stable
    - No fetal cardiac activity
    - Ectopic mass <3.5cm
    - Beta-hCG <5000 (preferably <3000)
    - Normal liver and kidney function
    - Patient reliable for follow-up
    - Methotrexate 50 mg/m² IM single dose
    - Follow-up beta-hCG on days 4 and 7 (should decrease >15%)
    - May need second dose if inadequate response
  - Surgical management if
    - Hemodynamically unstable
    - Ruptured ectopic
    - Fetal cardiac activity present
    - Beta-hCG >5000
    - Failed medical management
    - Large ectopic mass (>3.5-4cm)
    - Patient unreliable for follow-up
    - Laparoscopy (preferred) - salpingectomy or salpingostomy
  - RhoGAM 50mcg IM if Rh-negative and <12 weeks gestation
  - Pelvic rest (no intercourse, tampons)
  - Avoid NSAIDs, folic acid (interfere with methotrexate)
  patient_education:
  - Future ectopic risk 10-15%
  - Fertility preserved in most cases
  - Return immediately if severe pain, dizziness, syncope
  next:
  - default: null

- id: early_pregnancy_loss
  when:
    all_of:
    - pregnancy_test: positive
    - gestational_age: '<20_weeks'
    - fetal_cardiac_activity: absent
  description: Miscarriage (spontaneous abortion)
  tests:
  - Pelvic ultrasound
    - Empty gestational sac (anembryonic pregnancy, blighted ovum)
    - Fetal pole without cardiac activity
    - Incomplete abortion (retained products)
  - Beta-hCG level
  - CBC (assess blood loss)
  - Blood type and Rh
  suggest_dx:
  - Threatened abortion (bleeding, closed cervix, viable pregnancy)
  - Inevitable abortion (bleeding, open cervix)
  - Incomplete abortion (partial passage of products)
  - Complete abortion (full passage, closed cervix)
  - Missed abortion (retained nonviable pregnancy)
  - Anembryonic pregnancy (blighted ovum)
  referrals:
  - OB/GYN for follow-up or procedure
  management:
  - Expectant management (wait for spontaneous passage)
    - Appropriate if stable, minimal bleeding
    - 80% complete within 2-4 weeks
    - Follow-up ultrasound to confirm completion
  - Medical management
    - Misoprostol 800mcg vaginally, can repeat in 24-48h
    - 85% effective for incomplete abortion
    - Use at home or in office
  - Surgical management (D&C or aspiration)
    - Indications - heavy bleeding, hemodynamic instability, patient preference, failed medical management
    - Manual vacuum aspiration (MVA) or sharp curettage
  - RhoGAM 50mcg IM if Rh-negative and <12 weeks (300mcg if ≥12 weeks)
  - Pain management (NSAIDs, opioids if severe)
  - Contraception counseling (can conceive immediately)
  patient_education:
  - Very common (10-20% of known pregnancies)
  - Usually chromosomal abnormality (not mother's fault)
  - Can try to conceive again after 1 normal period
  - Emotional support, grief counseling available
  - Return if heavy bleeding (soaking 2 pads/hour for 2 hours), fever, severe pain
  next:
  - default: null

- id: threatened_abortion
  when:
    all_of:
    - pregnancy_test: positive
    - vaginal_bleeding: present
    - ultrasound: viable_IUP
    - cervix: closed
  description: Threatened abortion (bleeding with viable pregnancy)
  tests:
  - Pelvic ultrasound - confirm fetal cardiac activity
  - CBC
  - Blood type and Rh
  suggest_dx:
  - Threatened abortion (25% of early pregnancies, 50% progress to viable pregnancy)
  - Subchorionic hematoma
  referrals:
  - OB/GYN follow-up in 1-2 weeks
  management:
  - Pelvic rest (no intercourse, no douching, no tampons)
  - Avoid strenuous activity
  - Progesterone supplementation (controversial, may help)
    - Progesterone 200mg vaginally BID
  - RhoGAM 50mcg IM if Rh-negative and bleeding
  - Reassurance (50% will have successful pregnancy)
  - Follow-up ultrasound in 1-2 weeks
  patient_education:
  - Bed rest does NOT prevent miscarriage
  - Return if bleeding increases, severe cramping, fever
  - Most bleeding resolves and pregnancy continues
  next:
  - default: null

- id: third_trimester_bleeding
  when:
    all_of:
    - pregnancy_test: positive
    - gestational_age: '>=20_weeks'
  description: Third trimester bleeding
  tests:
  - Pelvic ultrasound - placental location (do NOT perform digital cervical exam if placenta previa suspected)
  - Fetal monitoring (continuous)
  - CBC, type and crossmatch
  - Coagulation studies (if suspect abruption)
  - Kleihauer-Betke test (fetal-maternal hemorrhage)
  suggest_dx:
  - Placenta previa (placenta covers cervical os)
  - Placental abruption (premature separation)
  - Vasa previa (fetal vessels over os)
  - Bloody show (labor)
  - Cervical lesions
  referrals:
  - OB/GYN immediately
  - Admit to labor and delivery
  management:
  - Do NOT perform digital cervical exam (can cause catastrophic hemorrhage if previa)
  - Continuous fetal monitoring
  - Bed rest
  - IV access, type and crossmatch
  - If placenta previa
    - Pelvic rest
    - Delivery by cesarean section (scheduled at 36-37 weeks or emergent if hemorrhage)
  - If placental abruption
    - Stabilize mother (fluids, transfusion)
    - Emergent cesarean if fetal distress or maternal instability
  - RhoGAM 300mcg IM if Rh-negative
  next:
  - default: null

- id: postmenopausal_bleeding
  when:
    patient_characteristics: postmenopausal
  description: Postmenopausal bleeding - endometrial cancer until proven otherwise
  tests:
  - Pelvic ultrasound - measure endometrial thickness
    - "<4mm reassuring (1% cancer risk)"
    - ≥4mm requires biopsy
  - Endometrial biopsy (in-office or OR)
  - Pap smear (if not up to date)
  - Consider hysteroscopy (visualize endometrial cavity)
  suggest_dx:
  - Endometrial atrophy (most common, benign)
  - Endometrial polyps
  - Endometrial hyperplasia (precancerous)
  - Endometrial cancer (10% of postmenopausal bleeding)
  - Hormone replacement therapy (HRT)
  - Cervical cancer
  referrals:
  - OB/GYN for biopsy and evaluation
  - Gynecologic oncology if cancer diagnosed
  management:
  - Endometrial biopsy REQUIRED (office pipelle or D&C)
  - Transvaginal ultrasound to assess endometrial thickness
  - If atrophy (benign)
    - Vaginal estrogen cream
    - Observation
  - If hyperplasia
    - Without atypia - progestin therapy (medroxyprogesterone or levonorgestrel IUD)
    - With atypia - hysterectomy (high cancer risk)
  - If endometrial cancer
    - Staging surgery (hysterectomy, bilateral salpingo-oophorectomy, lymph node sampling)
    - Chemotherapy/radiation if advanced
  patient_education:
  - Any bleeding after menopause requires evaluation
  - Most causes benign but must rule out cancer
  next:
  - default: null

- id: abnormal_uterine_bleeding
  when:
    all_of:
    - pregnancy_test: negative
    - age: reproductive
  description: Abnormal uterine bleeding (AUB) in non-pregnant reproductive-age women
  tests:
  - History - bleeding pattern (frequency, duration, volume)
  - Menstrual calendar
  - CBC (assess anemia)
  - TSH (hypothyroidism common cause)
  - Coagulation studies (if heavy bleeding since menarche, bleeding disorder suspected)
  - Pelvic ultrasound
    - Fibroids, polyps, endometrial thickness
  - Endometrial biopsy (if age >45, risk factors for endometrial cancer, failed medical management)
  - Consider prolactin, androgens (if anovulation suspected)
  suggest_dx: []
  next:
  - when:
      bleeding_pattern: heavy_regular
    go: ovulatory_heavy_bleeding
  - when:
      bleeding_pattern: irregular_unpredictable
    go: anovulatory_bleeding
  - default: ovulatory_heavy_bleeding

- id: ovulatory_heavy_bleeding
  when:
    bleeding_pattern: regular_predictable
  description: Heavy menstrual bleeding (HMB) with ovulatory cycles
  tests:
  - CBC - assess degree of anemia (ferritin)
  - TSH, coagulation studies
  - Pelvic ultrasound - fibroids, adenomyosis, polyps
  - Endometrial biopsy if age >45 or risk factors
  suggest_dx:
  - Uterine fibroids (leiomyomas)
  - Adenomyosis
  - Endometrial polyps
  - Coagulopathy (von Willebrand disease)
  - Hypothyroidism
  referrals:
  - OB/GYN if failed medical management or structural abnormalities
  management:
  - Medical management (first-line)
    - Tranexamic acid 1300mg PO TID during menses (reduces bleeding 40-50%, non-hormonal)
    - NSAIDs - ibuprofen 600-800mg TID during menses (reduce bleeding 25-30%)
    - Combined oral contraceptives (suppress endometrium)
    - Levonorgestrel IUD (Mirena) - most effective (90% reduction, first-line if no desire for pregnancy)
  - Iron supplementation (ferrous sulfate 325mg daily if anemic)
  - Surgical options if medical management fails
    - Endometrial ablation (destroys endometrium, reduces bleeding, preserves uterus)
    - Myomectomy (remove fibroids, preserve fertility)
    - Uterine artery embolization (UAE) for fibroids
    - Hysterectomy (definitive, if family complete)
  patient_education:
  - HMB = soaking pad/tampon every 1-2 hours, or bleeding >7 days
  - Not due to cancer in young women (but risk increases with age)
  - Multiple effective treatments available
  next:
  - default: null

- id: anovulatory_bleeding
  when:
    bleeding_pattern: irregular_unpredictable
  description: Anovulatory abnormal uterine bleeding
  tests:
  - TSH (hypothyroidism)
  - Prolactin (hyperprolactinemia)
  - Androgens (PCOS - testosterone, DHEAS)
  - Fasting glucose or HbA1c (diabetes, insulin resistance)
  - Pelvic ultrasound (polycystic ovaries, endometrial thickness)
  - Endometrial biopsy if age >45, prolonged unopposed estrogen, risk factors for endometrial cancer
  suggest_dx:
  - Polycystic ovary syndrome (PCOS) - most common
  - Hypothyroidism
  - Hyperprolactinemia
  - Perimenopause (transitioning to menopause)
  - Obesity (peripheral estrogen conversion)
  - Premature ovarian insufficiency
  referrals:
  - Endocrinology if thyroid or metabolic disorder
  - OB/GYN for management
  management:
  - Acute heavy bleeding
    - Combined OCP (monophasic) 1 pill TID x 7 days, then taper
    - Or medroxyprogesterone acetate 20mg PO TID x 7 days
    - Tranexamic acid 1300mg TID
  - Long-term management
    - Combined oral contraceptives (regulate cycles, protect endometrium)
    - Cyclic progestins (medroxyprogesterone 10mg x 10-14 days per month)
    - Levonorgestrel IUD (continuous progestin)
  - Treat underlying cause
    - PCOS - weight loss, metformin, OCPs
    - Hypothyroidism - levothyroxine
    - Hyperprolactinemia - cabergoline or bromocriptine
  - Endometrial protection essential (unopposed estrogen increases cancer risk)
  patient_education:
  - Irregular cycles common with anovulation
  - Birth control pills regulate cycles and reduce cancer risk
  - Weight loss improves symptoms if overweight
  next:
  - default: null

differential_diagnosis:
  pregnancy_related:
    - Ectopic pregnancy (tubal, ovarian, abdominal, cervical, cesarean scar)
    - Spontaneous abortion (threatened, inevitable, incomplete, complete, missed)
    - Molar pregnancy (complete or partial hydatidiform mole)
    - Placenta previa, placental abruption, vasa previa
    - Subchorionic hematoma
  structural_PALM:
    - Polyps (endometrial or cervical)
    - Adenomyosis (endometrium in myometrium)
    - Leiomyoma (fibroids - submucosal, intramural, subserosal)
    - Malignancy (endometrial, cervical, ovarian cancer)
  non_structural_COEIN:
    - Coagulopathy (von Willebrand, ITP, anticoagulation)
    - Ovulatory dysfunction (PCOS, hypothyroidism, perimenopause)
    - Endometrial (breakthrough bleeding, infection)
    - Iatrogenic (IUD, medications, anticoagulants)
    - Not classified (arteriovenous malformation)
  other:
    - Cervicitis (Chlamydia, gonorrhea)
    - Trauma
    - Vaginal or cervical laceration
    - Foreign body (retained tampon)

disposition_guidance:
  admit:
    - Hemodynamic instability (hemorrhagic shock)
    - Severe anemia (Hgb <7)
    - Ruptured ectopic pregnancy
    - Third trimester bleeding (placenta previa, abruption)
    - Failed outpatient management of heavy bleeding
  discharge:
    - Stable vital signs
    - Hemoglobin >7
    - Minimal ongoing bleeding
    - Reliable for follow-up
    - OB/GYN follow-up arranged
  follow_up:
    - Ectopic pregnancy (if methotrexate) - repeat beta-hCG days 4 and 7
    - Early pregnancy loss - repeat ultrasound to confirm completion
    - Postmenopausal bleeding - endometrial biopsy results
    - AUB - trial of medical management, reassess in 3 months
    - Threatened abortion - ultrasound in 1-2 weeks

references:
  - ACOG Practice Bulletin No. 128 - Diagnosis of Abnormal Uterine Bleeding in Reproductive-Aged Women. Obstet Gynecol. 2012.
  - ACOG Practice Bulletin No. 193 - Tubal Ectopic Pregnancy. Obstet Gynecol. 2018.
  - ACOG Committee Opinion No. 734 - The Role of Transvaginal Ultrasonography in Evaluating the Endometrium of Women with Postmenopausal Bleeding. Obstet Gynecol. 2018.
  - Munro MG et al. FIGO Classification System (PALM-COEIN) for Causes of Abnormal Uterine Bleeding. Int J Gynaecol Obstet. 2011.
