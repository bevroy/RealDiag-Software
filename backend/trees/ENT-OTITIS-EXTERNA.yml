presentations:
  - Ear pain, especially with movement of tragus or pinna
  - Itching in ear canal
  - Drainage from ear
  - Hearing loss
  - Swollen, erythematous ear canal
  - Pain with chewing
  - Associated with water exposure or trauma
differentials:
  - Otitis media
  - Contact dermatitis
  - Psoriasis
  - Fungal infection
  - Malignant otitis externa
workup:
  - Clinical diagnosis based on tragal tenderness + canal inflammation
  - 'Culture only if: Refractory to treatment, immunocompromised, or concern for resistant organism'
  - CT temporal bone if malignant OE suspected (diabetes + severe pain, granulation tissue, CN palsies)
treatment:
  - 'Guideline-based treatment options for Otitis Externa (Swimmer''s Ear) include:'
  - Gentle debridement of ear canal debris to allow drops to penetrate (AAO-HNS 2023)
  - 'Topical fluoroquinolone: Ciprofloxacin 0.3% + dexamethasone 0.1% otic drops 4 drops BID × 7 days (AAO-HNS 2023)'
  - 'Alternative: Ofloxacin 0.3% otic drops 5-10 drops BID × 7 days (safe if TM perforation) (AAO-HNS 2023)'
  - 'If canal too swollen for drops: Insert wick (compressed sponge) to allow medication delivery, remove in 2-3 days (AAO-HNS 2023)'
  - 'Pain control: NSAIDs (ibuprofen 400-600mg q6h), may need opioids for severe pain first 48hrs (AAO-HNS 2023)'
clinical_pearls:
  - 'Pathognomonic: Tragal tenderness (pain with pulling on tragus or pinna) - distinguishes from otitis media'
  - 'Organisms: Pseudomonas aeruginosa (50%), Staphylococcus aureus, fungi (Aspergillus in chronic cases)'
  - 'Risk factors: Swimming, high humidity, hearing aids, Q-tips (disrupts protective cerumen), diabetes'
  - 'Malignant (necrotizing) otitis externa in diabetics/immunocompromised: Life-threatening, extends to skull base'
  - 'Prevention: Acidifying drops (Swim-Ear) after swimming, avoid Q-tips'
red_flags: []
disposition_guidance: {}
referrals:
  - 'ENT if: Malignant otitis externa, refractory to treatment, extensive canal stenosis'
  - Hospital admission for IV antibiotics (ciprofloxacin or piperacillin-tazobactam) if malignant OE
