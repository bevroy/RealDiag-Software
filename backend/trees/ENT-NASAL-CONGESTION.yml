tree_id: ENT-NASAL-CONGESTION
name: Nasal Congestion (Encounter)
family: ent
specialty: ENT / Primary Care
presentations:
  - Stuffy or blocked nose
  - Difficulty breathing through nose
  - Nasal discharge (clear, yellow, or green)
  - Postnasal drip
  - Facial pressure or pain
  - Snoring
  - Mouth breathing
  - Reduced sense of smell
icd10:
  - R09.81 # Nasal congestion
  - J34.89 # Other specified disorders of nose and nasal sinuses
snomed:
  - "68235000" # Nasal congestion
urgency: Low
urgency_explanation: Usually benign; urgent if severe respiratory distress, suspected septal hematoma, or foreign body

referrals:
  ent: For chronic symptoms, suspected structural abnormality, or failed medical management
  allergy: If suspected allergic rhinitis

workup:
  history:
    - Duration (acute <4 weeks, chronic >12 weeks)
    - Unilateral vs bilateral
    - Associated symptoms: rhinorrhea, sneezing, itching, facial pain
    - Triggers: allergens, cold air, exercise, medications
    - Seasonal pattern (allergic rhinitis)
    - Prior treatments and response
    - Medication history (decongestant overuse)
  physical_examination:
    - Anterior rhinoscopy: inspect nasal mucosa, turbinates, septum
    - Assess for polyps, septal deviation, foreign body
    - Facial tenderness (sinusitis)
    - Oropharynx: postnasal drip
    - Lymph node examination
  diagnostic_testing:
    - Usually not needed for acute congestion
    - Allergy testing if suspected allergic rhinitis
    - CT sinuses if chronic rhinosinusitis suspected
    - Nasal endoscopy for chronic symptoms or structural evaluation

treatment:
  acute_congestion:
    topical_decongestants:
      - Oxymetazoline (Afrin) 0.05% spray: 2 sprays each nostril BID
      - Phenylephrine spray: 2-3 sprays each nostril q4h
      - Limit use to 3-5 days (risk of rebound congestion)
    oral_decongestants:
      - Pseudoephedrine 30-60 mg PO q4-6h (max 240 mg/day)
      - Phenylephrine 10 mg PO q4h
      - Use cautiously in hypertension, heart disease, glaucoma
    saline_irrigation:
      - Nasal saline spray or neti pot
      - Helps clear mucus and moisturize
    supportive_care:
      - Humidifier
      - Adequate hydration
      - Elevate head of bed
  allergic_rhinitis:
    - Intranasal corticosteroids (first-line): fluticasone, mometasone, budesonide
    - Oral antihistamines: cetirizine, loratadine, fexofenadine
    - Intranasal antihistamines: azelastine
    - Leukotriene inhibitors: montelukast
    - Allergen avoidance
  chronic_rhinosinusitis:
    - Intranasal corticosteroids long-term
    - Saline irrigation BID
    - Consider antibiotics if acute exacerbation
    - Refer to ENT if refractory
  vasomotor_rhinitis:
    - Intranasal corticosteroids
    - Intranasal antihistamines (azelastine)
    - Intranasal anticholinergics (ipratropium)
    - Avoid triggers
  rhinitis_medicamentosa:
    - Discontinue topical decongestants
    - Intranasal corticosteroids to help withdrawal
    - Oral decongestants short-term if needed
  structural_causes:
    - Septal deviation: septoplasty if symptomatic
    - Turbinate hypertrophy: turbinate reduction
    - Nasal polyps: medical management first, then polypectomy

clinical_pearls:
  - Most common causes: viral URI, allergic rhinitis, vasomotor rhinitis
  - Rhinitis medicamentosa from overuse of topical decongestants (>3-5 days)
  - Unilateral congestion: consider polyp, tumor, foreign body, septal deviation
  - Intranasal corticosteroids most effective for chronic congestion
  - Oral decongestants less effective than topical but no rebound risk
  - Pseudoephedrine more effective than phenylephrine
  - Saline irrigation safe and effective for all types of rhinitis
  - Pregnant women: avoid oral decongestants; use saline and intranasal corticosteroids

differentials:
  - Viral upper respiratory infection
  - Allergic rhinitis
  - Vasomotor (nonallergic) rhinitis
  - Chronic rhinosinusitis
  - Rhinitis medicamentosa
  - Septal deviation or structural abnormality
  - Nasal polyps
  - Foreign body
  - Adenoid hypertrophy (children)

trace:
  - Patient presents with nasal congestion
  - Determine duration and associated symptoms
  - Perform anterior rhinoscopy
  - If acute (<4 weeks): likely viral URI - treat symptomatically
  - If seasonal/allergen-related: allergic rhinitis - intranasal corticosteroids
  - If chronic (>12 weeks): consider chronic rhinosinusitis or structural cause - refer to ENT
  - Educate on proper use of decongestants (avoid >3-5 days)

citations:
  - "AAO-HNSF Clinical Practice Guideline: Allergic Rhinitis"
  - "AAAAI/ACAAI Practice Parameters for Allergic Rhinitis"
  - "UpToDate: Chronic nonallergic rhinitis"
  - "Clinical Practice Guidelines from relevant medical specialty societies"
