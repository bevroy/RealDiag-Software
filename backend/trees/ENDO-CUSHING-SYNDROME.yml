tree_id: ENDO-CUSHING-SYNDROME
name: Cushing Syndrome (Suspected)
family: endocrinology
specialty: Endocrinology
icd10: E24.9
snomed: 47270006
urgency: []
homeopathy: []
presentations:
  - Progressive central weight gain (truncal obesity, buffalo hump, supraclavicular fat pads)
  - Moon facies (round, plethoric face)
  - Purple striae (wide >1 cm, typically on abdomen)
  - Easy bruising and thin skin
  - Proximal muscle weakness (difficulty rising from chair, climbing stairs)
  - Hypertension (often difficult to control)
  - Hyperglycemia or new-onset diabetes
  - Menstrual irregularities or amenorrhea in women
  - Hirsutism and acne
  - Mood changes (depression, anxiety, irritability)
  - Osteoporosis and fractures
workup:
  - Initial screening tests (need at least 2 positive to confirm)
  - 24-hour urine free cortisol (>3-4x upper limit of normal)
  - Late-night salivary cortisol (elevated, loss of circadian rhythm)
  - 1 mg overnight dexamethasone suppression test (cortisol >1.8 mcg/dL abnormal)
  - Exclude pseudo-Cushing states
  - Alcohol use disorder, severe depression, obesity can cause mild hypercortisolism
  - If screening positive, determine etiology
  - ACTH level
  - ACTH <5 pg/mL: ACTH-independent (adrenal tumor)
  - ACTH 5-20 pg/mL: equivocal, repeat
  - ACTH >20 pg/mL: ACTH-dependent (pituitary or ectopic)
  - If ACTH-dependent (ACTH >20)
  - High-dose dexamethasone suppression test (8 mg overnight)
  - Pituitary MRI (Cushing disease - pituitary adenoma)
  - Inferior petrosal sinus sampling (if MRI negative or equivocal)
  - If ACTH-independent (ACTH <5)
  - Adrenal CT or MRI (adrenal adenoma or carcinoma)
  - Assess complications
  - Fasting glucose, HbA1c, lipid panel
  - DEXA scan (osteoporosis screening)
  - ECG, electrolytes (hypokalemia if ectopic ACTH)
treatment:
  - Definitive treatment depends on etiology
  - Cushing disease (pituitary adenoma, 70% of cases)
  - Transsphenoidal pituitary surgery (first-line, cure rate 70-90%)
  - Pituitary radiation if surgery unsuccessful
  - Medical therapy (ketoconazole, metyrapone, mitotane) if refractory
  - Adrenal tumor (adenoma or carcinoma, 15-20% of cases)
  - Adrenalectomy (laparoscopic or open)
  - Mitotane for adrenal carcinoma (adjuvant)
  - Ectopic ACTH syndrome (lung cancer, carcinoid, 5-10% of cases)
  - Treat underlying malignancy
  - Bilateral adrenalectomy if tumor unresectable
  - Medical therapy to control hypercortisolism
  - Ketoconazole 200-400 mg BID-TID (blocks cortisol synthesis)
  - Metyrapone 250-500 mg TID-QID
  - Mifepristone (glucocorticoid receptor blocker) for refractory cases
  - Manage complications
  - Antihypertensives, diabetes treatment, bisphosphonates for osteoporosis
  - Psychiatric support for mood disturbances
  - After treatment: lifelong hydrocortisone replacement if bilateral adrenalectomy
clinical_pearls:
  - "Cushing syndrome = chronic excess cortisol; Cushing DISEASE = pituitary adenoma (most common cause)"
  - "Classic triad: central obesity, purple striae, proximal myopathy"
  - "Exogenous glucocorticoids (prednisone, dexamethasone) most common cause of Cushing features"
  - "Loss of diurnal cortisol rhythm key feature - high late-night cortisol"
  - "Wide purple striae (>1 cm) more specific than other features (obesity alone causes pink striae)"
  - "Hypokalemic alkalosis suggests ectopic ACTH (often from small cell lung cancer)"
  - "Pituitary MRI normal in 40% of Cushing disease - microadenomas <6 mm"
  - "Inferior petrosal sinus sampling gold standard for localizing ACTH source"
referrals:
  - Endocrinology for all suspected cases - complex diagnosis and management
  - Neurosurgery for transsphenoidal pituitary surgery
  - General/endocrine surgery for adrenalectomy
  - Oncology if ectopic ACTH from malignancy
differentials:
  - Cushing disease (pituitary adenoma secreting ACTH) - 70% of cases
  - Adrenal adenoma or carcinoma (ACTH-independent) - 15-20%
  - Ectopic ACTH syndrome (lung cancer, carcinoid) - 5-10%
  - Iatrogenic Cushing syndrome (exogenous glucocorticoids) - most common overall
  - Pseudo-Cushing syndrome (alcohol, depression, obesity) - mild hypercortisolism without true disease
  - Metabolic syndrome (central obesity, hypertension, diabetes but no cortisol excess)
