tree_id: ENDO-CUSHING-SYNDROME
name: Cushing Syndrome
family: Endocrine-Metabolic
specialty: Endocrinology
chief_complaint: Weight gain and easy bruising
description: Clinical syndrome from chronic exposure to excessive glucocorticoids (cortisol) causing characteristic clinical features

icd10: E24.9

urgency: routine

workup:
  - Clinical presentation: central obesity with extremity wasting, moon face, buffalo hump, supraclavicular fat pads, wide purple striae (greater than 1 cm), easy bruising, proximal muscle weakness, hypertension, hyperglycemia, psychiatric symptoms (depression, irritability)
  - Discriminatory features suggesting pathologic hypercortisolism: purple striae, proximal myopathy, bruising without trauma, facial plethora in young patient
  - Screen for Cushing syndrome: 24-hour urine free cortisol (UFC greater than upper limit of normal on 2 collections), late-night salivary cortisol (elevated loss of circadian rhythm), low-dose dexamethasone suppression test (1 mg dexamethasone 11 PM, cortisol at 8 AM - normal less than 1.8 mcg/dL)
  - If screening positive, confirm diagnosis with second test (different modality)
  - Determine etiology once biochemically confirmed: plasma ACTH level distinguishes ACTH-dependent (ACTH elevated or inappropriately normal) from ACTH-independent (ACTH suppressed less than 5 pg/mL)
  - ACTH-dependent (80 percent): Cushing disease (pituitary adenoma 70 percent) or ectopic ACTH (small cell lung cancer, carcinoid 10 percent) - high-dose dexamethasone suppression test (8 mg overnight, cortisol suppresses greater than 50 percent suggests pituitary), CRH stimulation test, inferior petrosal sinus sampling (gold standard localizes pituitary vs ectopic)
  - ACTH-independent (20 percent): adrenal adenoma or carcinoma or bilateral hyperplasia - CT or MRI adrenals shows mass
  - Pituitary MRI with gadolinium if ACTH-dependent (detects adenoma in 50 percent, microadenomas less than 10 mm often missed)
  - Chest/abdominal CT if ectopic ACTH suspected (lung nodule, abdominal mass)
  - Exclude exogenous glucocorticoids (iatrogenic most common cause overall)

treatment:
  - Treat underlying cause for cure
  - Cushing disease (pituitary adenoma): transsphenoidal surgery (TSS) first-line, cure rate 70-90 percent for microadenomas, 50-60 percent for macroadenomas, remission defined as postoperative cortisol less than 5 mcg/dL, pituitary radiation if surgery fails or not candidate
  - Adrenal adenoma: unilateral adrenalectomy curative, laparoscopic approach preferred
  - Adrenal carcinoma: surgical resection plus mitotane (adrenolytic agent), poor prognosis
  - Ectopic ACTH: resect tumor if localized (carcinoid), often metastatic small cell lung cancer (treat underlying malignancy, palliative medical therapy for hypercortisolism)
  - Medical therapy to control hypercortisolism if not surgical candidate or awaiting surgery or persistent disease: steroidogenesis inhibitors (ketoconazole 200-400 mg BID-TID, metyrapone 250-500 mg TID-QID - both inhibit cortisol synthesis), mifepristone (glucocorticoid receptor antagonist, no cortisol monitoring available)
  - Bilateral adrenalectomy last resort for refractory Cushing disease (immediate cure but lifelong adrenal insufficiency requiring replacement)
  - Perioperative glucocorticoid replacement after surgery (hydrocortisone 10-20 mg AM, 5-10 mg afternoon) until HPA axis recovers (may take 6-18 months), gradual taper
  - Treat complications: diabetes (insulin or oral agents), hypertension (multiple agents often needed), osteoporosis (bisphosphonates, calcium/vitamin D), psychiatric symptoms (antidepressants, anxiolytics)
  - Prophylaxis against opportunistic infections if severe hypercortisolism: PCP prophylaxis (trimethoprim-sulfamethoxazole)

clinical_pearls:
  - Exogenous glucocorticoids (iatrogenic) most common cause overall, endogenous Cushing syndrome rare
  - Purple striae greater than 1 cm, proximal myopathy, easy bruising most specific features
  - Screening tests: 24-hour urine free cortisol, late-night salivary cortisol, overnight dexamethasone suppression (need 2 abnormal tests to confirm)
  - ACTH level distinguishes ACTH-dependent (pituitary or ectopic ACTH) from ACTH-independent (adrenal tumor)
  - Cushing disease (pituitary adenoma) most common cause endogenous (70 percent)
  - Transsphenoidal surgery curative for pituitary adenomas, cure rate 70-90 percent microadenomas
  - Postoperative cortisol less than 5 mcg/dL predicts remission

differentials:
  - Pseudo-Cushing syndrome (obesity, diabetes, PCOS, depression, alcohol use) causes mild hypercortisolism without true Cushing pathophysiology, resolves when underlying condition treated
  - Exogenous glucocorticoids (iatrogenic from prednisone, dexamethasone, inhaled/topical steroids) suppresses ACTH
  - Metabolic syndrome (central obesity, hypertension, diabetes) without discriminatory features of Cushing
  - PCOS (hirsutism, menstrual irregularities, but no purple striae or proximal weakness)

trace:
  - 38-year-old woman presents with 2 years progressive weight gain (50 pounds) despite diet, central obesity, round face, easy bruising, wide purple striae abdomen, fatigue, proximal muscle weakness (difficulty rising from chair), hypertension, irregular menses, depressed mood
  - Denies exogenous steroid use (no prednisone, inhalers, creams)
  - Exam: BP 158/94, central obesity with thin extremities, moon face, facial plethora, buffalo hump, supraclavicular fat pads, wide purple striae (2 cm) abdomen/thighs, extensive bruising arms, proximal muscle weakness 4/5 hip flexors, hirsutism
  - Labs: glucose 156 mg/dL (impaired fasting), potassium 3.1 mEq/L (hypokalemia from mineralocorticoid effect)
  - Screen for Cushing syndrome: 24-hour urine free cortisol 250 mcg/24hr (elevated, normal less than 50), repeat UFC 280 mcg/24hr (confirmed elevated), late-night salivary cortisol 0.8 ng/mL (elevated, normal less than 0.15)
  - Diagnosis: Cushing syndrome confirmed (2 abnormal screening tests)
  - Plasma ACTH 62 pg/mL (elevated, normal 10-60, inappropriately normal for high cortisol) - ACTH-dependent Cushing
  - High-dose dexamethasone suppression test (8 mg overnight): baseline cortisol 28 mcg/dL, post-dexamethasone cortisol 8 mcg/dL (suppressed 71 percent, greater than 50 percent suggests pituitary source)
  - Pituitary MRI with gadolinium: 6 mm hypoenhancing lesion left side pituitary (microadenoma consistent with Cushing disease)
  - Diagnosis: Cushing disease (pituitary ACTH-secreting adenoma)
  - Referred to neurosurgery for transsphenoidal surgery (TSS)
  - Underwent TSS, adenoma resected, postoperative day 1 cortisol 2.1 mcg/dL (less than 5 mcg/dL predicts remission)
  - Started hydrocortisone replacement 15 mg AM, 5 mg noon (temporary until HPA axis recovers)
  - Postoperative course: immediate improvement in symptoms, weight loss 20 pounds over 3 months, resolution of purple striae/bruising/proximal weakness, BP normalized off medications, glucose normalized
  - 6 months: morning cortisol (off hydrocortisone 24 hours) 8 mcg/dL (HPA axis recovering), reduced hydrocortisone dose
  - 12 months: morning cortisol 15 mcg/dL (normal HPA axis), stopped hydrocortisone, sustained remission
