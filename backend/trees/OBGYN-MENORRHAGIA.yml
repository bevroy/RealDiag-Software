tree_id: OBGYN-MENORRHAGIA
name: Menorrhagia
family: obstetrics_gynecology
specialty: Gynecology/Primary Care
applies_to: female
icd10: N92.0
snomed: 386692008
urgency: []
homeopathy: []
presentations:
  - Heavy menstrual bleeding (soaking through pad/tampon every 1-2 hours)
  - Menstrual periods lasting longer than 7 days
  - Passing large blood clots (greater than quarter-size)
  - Need to change pad/tampon during the night
  - Need to use double protection (pad and tampon together)
  - Fatigue and weakness (from anemia)
  - Lightheadedness or shortness of breath with exertion
  - Interference with daily activities due to heavy bleeding
workup:
  - Detailed menstrual history
  - Age of menarche and menstrual pattern
  - Cycle length, duration, and heaviness
  - Number of pads/tampons used per day
  - Presence of clots and their size
  - Associated symptoms (pain, pressure, bloating)
  - Impact on quality of life
  - Physical examination
  - Vital signs (orthostatic hypotension if significant blood loss)
  - Pallor of conjunctiva (anemia)
  - Thyroid palpation (hypothyroidism can cause menorrhagia)
  - Abdominal examination (masses, tenderness)
  - Pelvic examination
  - Cervical inspection (cervical lesions, polyps)
  - Bimanual exam (uterine size, shape, mobility, adnexal masses)
  - Assess uterine size (enlarged in fibroids, adenomyosis)
  - Laboratory evaluation
  - Complete blood count
  - Hemoglobin and hematocrit (assess for anemia)
  - "Hb less than 12 g/dL in women: anemia present"
  - Mean corpuscular volume (MCV) - low in iron deficiency
  - Platelet count (thrombocytopenia can cause bleeding)
  - Pregnancy test (beta-hCG) - rule out pregnancy complications
  - Thyroid-stimulating hormone (TSH) - hypothyroidism screening
  - Coagulation studies if suspicion for bleeding disorder
  - PT/INR, aPTT, von Willebrand factor antigen and activity
  - 10-20% of adolescents with menorrhagia have bleeding disorder
  - Ferritin (iron stores - low in iron deficiency anemia)
  - Imaging studies
  - Transvaginal ultrasound (first-line imaging)
  - Assess endometrial thickness
  - "Premenopausal: variable, typically less than 16 mm"
  - "Postmenopausal: less than 4 mm normal"
  - Identify uterine fibroids (leiomyomas)
  - Detect adenomyosis (heterogeneous myometrium, globular uterus)
  - Evaluate for ovarian masses
  - Saline infusion sonohysterography (SIS) if intracavitary lesion suspected
  - Better visualization of endometrial polyps and submucosal fibroids
  - MRI pelvis if ultrasound inconclusive or surgical planning for large fibroids
  - Endometrial sampling (biopsy)
  - Indications
  - Age greater than 45 years with abnormal uterine bleeding
  - Age less than 45 with risk factors for endometrial cancer
  - Obesity, PCOS, diabetes, chronic anovulation, tamoxifen use
  - Failed medical management
  - Endometrial thickness greater than 4 mm in postmenopausal women
  - Methods: office endometrial biopsy (Pipelle), dilation and curettage (D&C)
  - Hysteroscopy if focal lesion suspected or endometrial biopsy insufficient
  - Direct visualization of uterine cavity
  - Can diagnose and treat polyps, submucosal fibroids
treatment:
  - Medical management (FIRST-LINE)
  - Hormonal treatments
  - Levonorgestrel IUD (Mirena) - MOST EFFECTIVE medical therapy
  - 20 mcg levonorgestrel released daily
  - Reduces menstrual blood loss by 90% at 12 months
  - 50% develop amenorrhea by 1 year
  - Combined oral contraceptive pills
  - Reduce menstrual blood loss by 40-50%
  - Cyclic or continuous regimens
  - Contraindicated if smoking and age greater than 35, history of VTE
  - Oral progestins
  - Norethindrone 5 mg daily on days 5-26 of cycle
  - Medroxyprogesterone acetate 10 mg daily for 10-14 days per month
  - Less effective than levonorgestrel IUD or combined OCPs
  - Non-hormonal treatments
  - Tranexamic acid (Lysteda) - antifibrinolytic
  - 1300 mg PO three times daily during menses (up to 5 days)
  - Reduces menstrual blood loss by 40-50%
  - No hormonal side effects
  - Contraindicated in thromboembolic disease
  - NSAIDs (reduce prostaglandins)
  - Mefenamic acid 500 mg TID during menses
  - Ibuprofen 600-800 mg TID during menses
  - Reduce menstrual blood loss by 20-30%
  - Also reduce dysmenorrhea
  - Anemia treatment
  - Iron supplementation
  - Ferrous sulfate 325 mg daily (or 65 mg elemental iron)
  - Take with vitamin C to enhance absorption
  - Continue for 3-6 months to replete iron stores
  - Iron IV infusion if oral iron not tolerated or severe anemia
  - Blood transfusion if hemodynamically unstable or Hb less than 7 g/dL
  - Treat underlying cause
  - Fibroids: see surgical options below
  - Adenomyosis: hormonal suppression, hysterectomy definitive
  - Polyps: hysteroscopic polypectomy
  - Hypothyroidism: levothyroxine replacement
  - Bleeding disorders: hematology consultation, desmopressin (DDAVP) for von Willebrand disease
  - Surgical and interventional management (if medical therapy fails)
  - Endometrial ablation
  - Destroys endometrial lining (reduces/eliminates menstruation)
  - 80-90% report decreased bleeding, 30-50% develop amenorrhea
  - Outpatient procedure, quick recovery
  - Not suitable if desire future pregnancy
  - Methods: thermal balloon, radiofrequency, cryoablation, microwave
  - Uterine artery embolization (UAE)
  - For symptomatic fibroids
  - Blocks blood supply to fibroids, causing shrinkage
  - 85-90% report improvement in bleeding
  - Preserves uterus but pregnancy outcomes uncertain
  - Myomectomy
  - Surgical removal of fibroids, preserves uterus
  - For women desiring future fertility
  - Can be hysteroscopic, laparoscopic, or open depending on fibroid location/size
  - Fibroids may recur (10-25% within 5 years)
  - Hysterectomy (DEFINITIVE treatment)
  - Indicated for failed medical/conservative surgical therapy
  - Adenomyosis refractory to treatment
  - Large symptomatic fibroids
  - Options: vaginal, laparoscopic, abdominal approach
  - Consider ovarian preservation if premenopausal and ovaries normal
clinical_pearls:
  - 'Menorrhagia defined as menstrual blood loss greater than 80 mL per cycle (soaking pad/tampon hourly for several hours)'
  - 'Levonorgestrel IUD (Mirena) most effective medical treatment - reduces bleeding by 90% and 50% achieve amenorrhea'
  - 'Always rule out pregnancy and thyroid dysfunction in women with menorrhagia - common and treatable causes'
  - 'Endometrial sampling required for women over 45 or under 45 with risk factors (obesity, PCOS, anovulation) to rule out cancer'
  - '10-20% of adolescents with menorrhagia have underlying bleeding disorder (von Willebrand most common)'
  - 'Tranexamic acid highly effective (40-50% reduction) with no hormonal side effects - good option if contraception not desired'
  - 'Iron deficiency anemia common with menorrhagia - replete iron stores with 3-6 months supplementation'
  - 'Endometrial ablation effective for women who completed childbearing but want to avoid hysterectomy'
referrals:
  - Gynecology for failed medical management, consideration of endometrial ablation or hysterectomy
  - Hematology if suspected bleeding disorder (von Willebrand, platelet dysfunction)
  - Interventional radiology for uterine artery embolization if symptomatic fibroids
  - Reproductive endocrinology if menorrhagia with infertility or desire for fertility-sparing fibroid treatment
differentials:
  - Uterine fibroids (leiomyomas - enlarged uterus, firm, irregular contour on exam)
  - Adenomyosis (diffusely enlarged, tender uterus, worsens with age, often coexists with fibroids)
  - Endometrial polyp (focal intracavitary lesion on ultrasound or hysteroscopy)
  - Endometrial hyperplasia or cancer (postmenopausal bleeding, risk factors, thickened endometrium)
  - Coagulopathy (von Willebrand disease, thrombocytopenia, anticoagulation therapy)
  - Hypothyroidism (fatigue, weight gain, elevated TSH)
  - Anovulatory bleeding (PCOS, irregular cycles, unopposed estrogen)
  - Pregnancy complications (threatened abortion, ectopic pregnancy - positive pregnancy test)
