tree_id: PULM-PULMONARY-EMBOLISM
name: Pulmonary Embolism
family: Pulmonology
specialty: Pulmonology/Cardiology
chief_complaint: Sudden onset shortness of breath and chest pain
description: |
  Blood clot in pulmonary arteries, usually from deep vein thrombosis (DVT). Third most common cardiovascular disease after MI and stroke. Affects 600,000 annually in US, 10-30% mortality if untreated.
  Risk factors - Virchow triad (stasis, hypercoagulability, endothelial injury). Presentation ranges from asymptomatic to massive PE with hemodynamic collapse. Anticoagulation prevents recurrence and mortality.
icd10: I26.99
urgency: Critical
workup:
  - Clinical presentation - sudden dyspnea (most common), pleuritic chest pain, cough, hemoptysis, syncope (massive PE)
  - Tachypnea, tachycardia often present; hypoxia less common than expected
  - Massive PE - hypotension, shock, cardiac arrest
  - Submassive PE - normotensive but RV strain on echo or elevated troponin/BNP
  - Risk factors - recent surgery/trauma, immobilization, malignancy, pregnancy, oral contraceptives, prior VTE, thrombophilia, long flight
  - Wells score for PE probability
  - Clinical signs of DVT (3 points), PE most likely diagnosis (3), HR greater than 100 (1.5), immobilization/surgery in past 4 weeks (1.5), prior DVT/PE (1.5), hemoptysis (1), malignancy (1)
  - Score less than 2 low probability, 2-6 moderate, greater than 6 high
  - D-dimer - if low pretest probability (Wells less than 2), negative D-dimer (less than 500 ng/mL) rules out PE (high sensitivity, low specificity)
  - Elevated D-dimer nonspecific (pregnancy, infection, malignancy, advanced age) - requires imaging
  - CT pulmonary angiography (CTPA) - gold standard, 95% sensitivity and specificity
  - Shows filling defects in pulmonary arteries, can assess RV size (RV/LV ratio greater than 0.9 suggests strain)
  - Segmental or larger PE clinically significant, subsegmental significance uncertain
  - V/Q scan alternative if contrast contraindicated (renal failure, allergy) - high probability scan diagnostic
  - Lower extremity venous duplex ultrasound - if DVT found, no further testing needed (treat as PE)
  - ECG - often normal or sinus tachycardia, classic S1Q3T3 pattern (large S in I, Q in III, inverted T in III) uncommon but specific
  - Right heart strain - RBBB, T wave inversions V1-V4
  - ABG - hypoxemia, respiratory alkalosis, increased A-a gradient (but can be normal)
  - Labs - troponin (RV strain), BNP (RV dysfunction), CBC, CMP
  - Echocardiogram if massive or submassive PE - assess RV function, McConnell sign (RV free wall hypokinesis with apical sparing), elevated PA pressures
treatment:
  - Anticoagulation - cornerstone of treatment, prevents clot propagation and recurrence
  - Hemodynamically stable - start anticoagulation immediately (even before imaging if high suspicion)
  - DOAC (direct oral anticoagulant) preferred over warfarin
  - Apixaban 10mg BID x 7 days then 5mg BID
  - Rivaroxaban 15mg BID x 21 days then 20mg daily
  - Edoxaban 60mg daily (requires 5-10 days LMWH/UFH lead-in)
  - Dabigatran 150mg BID (requires 5-10 days LMWH/UFH lead-in)
  - Advantages - fixed dosing, no monitoring, rapid onset, fewer drug/food interactions
  - Warfarin if DOAC contraindicated (mechanical valve, antiphospholipid syndrome) - overlap with LMWH until INR 2-3 x 2 days, maintain INR 2-3
  - LMWH (enoxaparin 1 mg/kg SC q12h or 1.5 mg/kg daily) or UFH (heparin infusion) if DOAC/warfarin contraindicated
  - Duration of anticoagulation
  - Provoked PE (surgery, trauma, temporary risk factor) - 3 months
  - Unprovoked PE (no identifiable risk factor) - 3-6 months minimum, consider indefinite if low bleeding risk
  - Recurrent unprovoked VTE - indefinite anticoagulation
  - Active cancer - indefinite (LMWH preferred over DOAC/warfarin)
  - Massive PE (hemodynamic instability, shock) - systemic thrombolysis
  - Alteplase (tPA) 100mg IV over 2 hours or 0.6 mg/kg bolus (max 50mg)
  - Contraindications - recent surgery, active bleeding, prior ICH, ischemic stroke less than 3 months
  - If thrombolysis contraindicated - catheter-directed therapy or surgical embolectomy
  - Submassive PE (RV strain but normotensive) - controversial, consider thrombolysis if low bleeding risk and significant RV dysfunction
  - IVC filter if anticoagulation contraindicated (active bleeding, high bleeding risk) or recurrent PE despite anticoagulation
  - Retrievable filters preferred (remove when safe to anticoagulate)
  - Supportive care - supplemental oxygen, IV fluids (if hypotensive, but avoid overload in RV failure), vasopressors if shock
  - Thrombophilia testing if unprovoked PE, age less than 50, family history, recurrent VTE - factor V Leiden, prothrombin G20210A, protein C/S, antithrombin III, antiphospholipid antibodies
  - Test after acute phase (not during anticoagulation)
  - Prevention - VTE prophylaxis in hospitalized patients (LMWH, UFH, or sequential compression devices)
clinical_pearls:
  - PE often missed - maintain high index of suspicion in dyspneic patients with risk factors
  - Normal oxygen saturation does not rule out PE
  - Hampton hump (wedge-shaped opacity) and Westermark sign (oligemia) on CXR rare but specific
  - Saddle embolus (thrombus at bifurcation of main pulmonary artery) high mortality
  - Paradoxical embolism - DVT crosses patent foramen ovale causing stroke
  - Pregnancy - CTPA safe (lower radiation to fetus than V/Q), LMWH preferred anticoagulant (warfarin/DOACs contraindicated)
  - Subsegmental PE - unclear significance, consider anticoagulation if risk factors present
differentials:
  - Myocardial infarction
  - Pneumonia
  - Pneumothorax
  - Aortic dissection
  - Pericarditis
  - Anxiety/panic attack
trace:
  - 58-year-old woman 2 weeks post total hip replacement presents with sudden dyspnea and pleuritic chest pain → Tachypneic RR 24, tachycardic HR 110, BP 128/78, oxygen saturation 92% on room air → No signs of DVT on exam (calf swelling, tenderness) → Wells score 4.5 (surgery in past month 1.5, HR greater than 100 1.5, PE likely diagnosis 3) - moderate probability → D-dimer 1820 ng/mL (elevated) → CTPA shows filling defects in right lower lobe pulmonary arteries (segmental PE) → Troponin normal, no RV strain on ECG → Hemodynamically stable → Start rivaroxaban 15mg BID x 21 days → Admit for monitoring overnight → Oxygen saturation improves to 95% on room air → Discharge on rivaroxaban, transition to 20mg daily after 21 days → Provoked PE (post-surgery) - plan 3 months anticoagulation → Lower extremity ultrasound shows small non-occlusive DVT right popliteal vein → Continue anticoagulation, compression stockings → Repeat ultrasound at 3 months shows resolved DVT → Complete 3 months anticoagulation, discontinue (provoked event, low recurrence risk)
