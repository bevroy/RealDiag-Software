tree_id: PULM-PULMONARY-EMBOLISM
name: Pulmonary Embolism
family: Pulmonology
specialty: Pulmonology
chief_complaint: Sudden shortness of breath, chest pain, cough, hemoptysis
description: Obstruction of pulmonary arterial system by thromboemboli, most commonly from deep vein thrombosis in lower extremities, can cause respiratory failure and hemodynamic instability
icd10: I26.99
urgency: critical
workup:
  - Pathophysiology - Thrombus embolizes to pulmonary circulation
  - Source - 90% from proximal DVT (iliofemoral, popliteal veins), rarely upper extremity DVT, pelvic veins, right heart thrombus
  - Consequences - Increased pulmonary vascular resistance, increased RV afterload, RV strain/failure, V/Q mismatch, hypoxemia, infarction (if complete arterial occlusion)
  - Massive PE - Hemodynamic instability (hypotension, shock), high mortality
  - Submassive PE - RV dysfunction on echo/CT but hemodynamically stable
  - Risk factors (Virchow triad) - Stasis, hypercoagulability, endothelial injury
  - Acquired - Surgery (especially orthopedic), trauma, immobilization (bed rest >3 days, long flight >8 hours), malignancy (adenocarcinoma, pancreatic, lung, GI most thrombogenic), pregnancy/postpartum, oral contraceptives/HRT, obesity, smoking, CHF, prior VTE
  - Inherited thrombophilias - Factor V Leiden (most common), prothrombin G20210A mutation, antithrombin deficiency, protein C/S deficiency, antiphospholipid syndrome
  - Epidemiology
  - Annual incidence 60-70 per 100,000 (600,000 cases/year US)
  - 10-30% mortality if untreated, <5% mortality if treated promptly
  - Recurrence risk 30% at 10 years
  - Clinical presentation - Highly variable, can be asymptomatic to sudden death
  - Classic triad (only 20%) - Dyspnea, pleuritic chest pain, hemoptysis
  - Symptoms
  - Dyspnea - Most common (80%), sudden onset, often at rest
  - Pleuritic chest pain - Sharp, worse with inspiration (pleural irritation, infarction)
  - Cough - Dry or productive
  - Hemoptysis - Pulmonary infarction (10-15%)
  - Syncope - Massive PE (sudden RV failure, decreased cardiac output)
  - Palpitations - Tachycardia, arrhythmia
  - Leg pain/swelling - Concurrent DVT (50% have DVT if looked for)
  - Signs
  - Tachypnea - Most common vital sign abnormality (>20 breaths/min)
  - Tachycardia - HR >100
  - Hypoxemia - Low SpO2, increased A-a gradient
  - Hypotension - Massive PE (systolic BP <90 mmHg or drop >40 mmHg)
  - Fever - Low-grade if pulmonary infarction
  - Signs of DVT - Unilateral leg swelling, calf tenderness, Homan sign (unreliable)
  - RV strain - Jugular venous distention, loud P2, tricuspid regurgitation murmur, right-sided S3
  - Clinical decision rules - Assess pre-test probability
  - Wells score for PE
  - Clinical signs DVT (3 points), PE more likely than alternative (3), HR >100 (1.5), immobilization/surgery past 4 weeks (1.5), prior DVT/PE (1.5), hemoptysis (1), malignancy (1)
  - Score 0-1 low risk, 2-6 moderate, >6 high
  - PERC rule (Pulmonary Embolism Rule-out Criteria) - If all 8 negative in low-risk patients, PE excluded (no further testing)
  - Age <50, HR <100, SpO2 >94%, no hemoptysis, no estrogen use, no prior VTE, no unilateral leg swelling, no surgery/trauma requiring hospitalization in past 4 weeks
  - Laboratory evaluation
  - D-dimer - Fibrin degradation product, highly sensitive but not specific
  - Negative D-dimer (<500 ng/mL) effectively rules out PE in low-moderate risk (high negative predictive value >95%)
  - Positive D-dimer - Non-specific (elevated in many conditions - infection, malignancy, pregnancy, post-op, trauma, DIC), requires imaging
  - Do NOT order if high pre-test probability (will be positive but not helpful)
  - ABG - Hypoxemia (low PaO2), hypocapnia (low PaCO2 from hyperventilation), increased A-a gradient, respiratory alkalosis
  - Troponin, BNP - Elevated if RV strain (submassive/massive PE), prognostic marker
  - CBC - Rule out anemia (alternative cause dyspnea), thrombocytosis (malignancy)
  - ECG - Often normal or non-specific, may show sinus tachycardia
  - Classic findings (rare, <20%) - S1Q3T3 (S wave in lead I, Q wave and inverted T in lead III), right axis deviation, new RBBB, right atrial enlargement (peaked P waves), anterior T wave inversions (V1-V4)
  - Chest X-ray - Usually normal (useful to exclude other diagnoses)
  - Westermark sign - Focal oligemia (decreased vascular markings)
  - Hampton hump - Wedge-shaped pleural-based opacity (pulmonary infarction)
  - Fleischner sign - Enlarged pulmonary artery (rare)
  - Imaging - Confirm diagnosis
  - CT pulmonary angiography (CTPA) - GOLD STANDARD, first-line test
  - Sensitivity 83-90%, specificity 95%, visualizes thrombus in pulmonary arteries
  - Filling defect, RV dilation (RV:LV ratio >1 suggests RV strain)
  - Contraindications - Renal insufficiency (contrast), pregnancy (radiation), contrast allergy
  - V/Q scan (ventilation-perfusion scintigraphy) - Alternative if CTPA contraindicated
  - Perfusion defects with normal ventilation (V/Q mismatch) suggest PE
  - High probability scan (2+ large mismatched defects) diagnostic
  - Low/intermediate probability - Non-diagnostic, need further testing
  - Normal scan rules out PE
  - Preferred in pregnancy (lower radiation than CTPA), young patients, CKD
  - Lower extremity ultrasound - Doppler ultrasound for DVT
  - If positive, treat as PE (source identified, same treatment)
  - If negative, does NOT exclude PE (thrombus may have completely embolized)
  - Echocardiography - Assess RV function (submassive/massive PE)
  - RV dilation, hypokinesis, McConnell sign (akinetic RV free wall with apical sparing)
  - Tricuspid regurgitation, interventricular septal flattening (D-sign)
  - Pulmonary angiography - Gold standard historically, now rarely used (invasive, CTPA replaced it)
treatment:
  - Anticoagulation - MAINSTAY, prevents clot propagation and recurrent VTE
  - Immediate anticoagulation if high suspicion (start BEFORE imaging if delay expected)
  - First-line options (choose based on patient factors, hemodynamic stability, bleeding risk)
  - DOACs (direct oral anticoagulants) - Preferred for most patients (easier, no monitoring)
  - Apixaban 10 mg BID x 7 days, then 5 mg BID
  - Rivaroxaban 15 mg BID x 21 days, then 20 mg daily
  - Edoxaban 60 mg daily (after 5-10 days LMWH/UFH)
  - Dabigatran 150 mg BID (after 5-10 days LMWH/UFH)
  - Advantages - Oral, rapid onset, no INR monitoring, fewer drug-food interactions
  - Avoid if - CrCl <30, mechanical heart valve, antiphospholipid syndrome
  - LMWH (low molecular weight heparin) - Enoxaparin 1 mg/kg SC q12h or 1.5 mg/kg daily
  - Preferred if cancer-associated VTE (LMWH superior to warfarin in malignancy)
  - Bridge to warfarin if warfarin chosen
  - Dose adjust if CrCl <30
  - Unfractionated heparin (UFH) - IV bolus 80 units/kg, then infusion 18 units/kg/hr, titrate to aPTT 1.5-2.5x control
  - Preferred if hemodynamically unstable (massive PE, may need thrombolysis), severe renal impairment (CrCl <30), high bleeding risk (short half-life, reversible)
  - Warfarin - Start 5-10 mg daily, overlap with LMWH/UFH minimum 5 days until INR 2-3 x 2 consecutive days
  - Narrow therapeutic window, INR monitoring, drug-food interactions
  - Less commonly used now (DOACs preferred)
  - Duration of anticoagulation
  - Provoked PE (transient risk factor - surgery, trauma, immobilization) - 3 months
  - Unprovoked PE (no identifiable risk factor) - Minimum 3 months, consider indefinite if low bleeding risk
  - Recurrent VTE - Indefinite anticoagulation
  - Active cancer - Indefinite (as long as cancer active)
  - Thrombolysis - Dissolve clot rapidly (alteplase, tenecteplase)
  - Indications
  - Massive PE - Hemodynamically unstable (hypotension, shock, cardiac arrest)
  - Submassive PE with clinical deterioration (worsening RV function, hypoxemia, shock risk)
  - Alteplase 100 mg IV over 2 hours OR 50 mg IV bolus if cardiac arrest
  - Contraindications - Active bleeding, recent surgery/trauma <14 days, hemorrhagic stroke ever, ischemic stroke <3 months, intracranial neoplasm
  - Risk - Major bleeding 10-20%, intracranial hemorrhage 1-3%
  - Embolectomy - Surgical or catheter-directed
  - Surgical embolectomy - Open heart surgery, remove clot from pulmonary arteries
  - Reserved for massive PE refractory to thrombolysis, contraindication to thrombolysis, shock
  - Catheter-directed therapy - Catheter-directed thrombolysis or mechanical thrombectomy
  - Lower dose thrombolytic delivered directly to clot, reduced systemic bleeding risk
  - Consider submassive PE with RV dysfunction if thrombolysis contraindicated
  - IVC filter - Mechanical barrier to prevent embolization
  - Indications - Contraindication to anticoagulation (active bleeding, recent neurosurgery), recurrent PE despite therapeutic anticoagulation, free-floating proximal DVT
  - Retrievable filters preferred (remove when no longer needed, typically <3 months)
  - Complications - IVC thrombosis, filter migration, increased long-term DVT risk
  - NOT a substitute for anticoagulation (anticoagulate when bleeding risk resolves)
  - Supportive care
  - Supplemental oxygen - Target SpO2 >90%
  - IV fluids - If hypotensive (caution, RV preload-dependent but excessive fluid worsens RV strain)
  - Avoid aggressive fluid resuscitation (may worsen RV failure)
  - Vasopressors - Norepinephrine if persistent hypotension despite fluids
  - Mechanical ventilation - If respiratory failure (low tidal volume protective strategy)
clinical_pearls:
  - Dyspnea and tachypnea are most common signs, absence of tachycardia or hypoxemia does not exclude PE
  - Negative D-dimer rules out PE in low-moderate risk patients (do not order if high risk)
  - CTPA is gold standard for diagnosis, start anticoagulation immediately if high suspicion
  - DOACs (apixaban, rivaroxaban) are first-line for most patients (no INR monitoring needed)
  - Thrombolysis for massive PE with hemodynamic instability, surgical embolectomy if thrombolysis fails
  - Duration of anticoagulation - 3 months if provoked, indefinite if unprovoked or recurrent
differentials:
  - CARD-ACUTE-CORONARY-SYNDROME
  - CARD-AORTIC-DISSECTION
  - PULM-PNEUMONIA
  - PULM-PNEUMOTHORAX
  - CARD-PERICARDITIS
  - CARD-HEART-FAILURE
trace:
  - Sudden dyspnea, pleuritic chest pain, tachypnea, hypoxemia
  - Wells score and D-dimer if low-moderate risk
  - CTPA to confirm diagnosis (filling defect in pulmonary artery)
  - Start anticoagulation immediately (DOACs or LMWH)
  - Thrombolysis if massive PE with hemodynamic instability
