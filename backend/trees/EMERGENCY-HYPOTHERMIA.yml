tree_id: EMERGENCY-HYPOTHERMIA
name: Accidental Hypothermia
family: Emergency Medicine
specialty: Emergency Medicine
chief_complaint: Core body temperature below 35°C (95°F) with altered mental status and cold exposure
description: Accidental hypothermia is defined as unintentional drop in core body temperature below 35°C (95°F). Classified as mild (32-35°C), moderate (28-32°C), or severe (under 28°C). Occurs from environmental cold exposure, often in combination with risk factors like alcohol intoxication, homelessness, elderly age, or underlying illness. Clinical manifestations progress from shivering and confusion in mild cases to loss of shivering, bradycardia, hypotension, arrhythmias, and coma in severe cases. J waves (Osborn waves) on ECG are pathognomonic. Rewarming is mainstay of treatment - passive external rewarming for mild, active external rewarming for moderate, and active internal (core) rewarming for severe hypothermia. ECMO or cardiopulmonary bypass is most effective rewarming for severe hypothermia with cardiac arrest. Mortality increases with severity - mild hypothermia under 5%, severe hypothermia over 40%. "No one is dead until warm and dead" - aggressive resuscitation indicated even with prolonged cardiac arrest.
icd10: T68
urgency: emergent

differentials:
  - Sepsis
  - Hypothyroidism
  - Hypoglycemia
  - Adrenal insufficiency
  - Intoxication

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Core temperature measurement (CRITICAL):
    - Use core temperature probe (esophageal, bladder, rectal)
    - Esophageal probe most accurate (place in lower third of esophagus)
    - Rectal temperature lags behind core temperature during rewarming
    - Standard oral or tympanic thermometers often cannot read below 34°C
    - DO NOT use axillary temperature (inaccurate)
  - Hypothermia classification by core temperature:
    - "Mild hypothermia (32-35°C or 89.6-95°F)":
      - Conscious but confused
      - Shivering present (body's compensatory mechanism)
      - Tachycardia and tachypnea
      - Cold diuresis
    - "Moderate hypothermia (28-32°C or 82.4-89.6°F)":
      - Altered mental status (lethargy, confusion, disorientation)
      - Loss of shivering (ominous sign, heat production ceases)
      - Bradycardia and hypotension
      - Hypoventilation
      - Atrial fibrillation common
      - Pupillary dilation
    - "Severe hypothermia (under 28°C or 82.4°F)":
      - Coma or unresponsive
      - Appears dead (fixed dilated pupils, no pulse, apnea)
      - Ventricular fibrillation or asystole
      - Rigidity of muscles
      - J waves (Osborn waves) on ECG
      - Paradoxical undressing (irrational behavior before collapse)
  - Clinical presentation:
    - Neurologic symptoms (progressive with severity):
      - Mild: Confusion, poor judgment, amnesia, dysarthria, ataxia
      - Moderate: Lethargy, stupor, hallucinations
      - Severe: Coma, fixed dilated pupils (not brain death!)
    - Cardiovascular:
      - Tachycardia (mild hypothermia, compensatory)
      - Bradycardia (moderate-severe, often refractory to atropine)
      - Hypotension (decreased cardiac output, vasodilation during rewarming)
      - Arrhythmias:
        - Atrial fibrillation (most common, usually converts with rewarming)
        - Ventricular fibrillation (often refractory until temp over 30°C)
        - Asystole (poorest prognosis)
      - J waves (Osborn waves) on ECG: Positive deflection at J point
    - Respiratory:
      - Tachypnea (mild, compensatory)
      - Hypoventilation (moderate-severe)
      - Apnea (severe)
      - Aspiration risk (decreased gag reflex)
      - Non-cardiogenic pulmonary edema (rewarming complication)
    - Metabolic:
      - Shivering thermogenesis (mild-moderate, generates heat)
      - Loss of shivering (temp under 32°C, ominous)
      - Decreased oxygen consumption
      - Metabolic acidosis (lactate accumulation)
    - Renal:
      - Cold diuresis (early, from peripheral vasoconstriction)
      - Oliguria or anuria (later, from hypovolemia and hypotension)
    - Gastrointestinal:
      - Decreased GI motility
      - Ileus
      - Pancreatitis (elevation of amylase/lipase common, often non-specific)
    - Hematologic:
      - Hemoconcentration (cold diuresis causes fluid loss)
      - Coagulopathy (decreased enzyme function at low temp)
      - Thrombocytopenia (platelet sequestration)
    - Skin:
      - Cold, pale skin
      - Frostbite may be present (especially extremities)
      - Paradoxical undressing (remove clothes irrationally, end-stage behavior)
  - Risk factors and precipitants:
    - Environmental exposure:
      - Cold weather exposure (especially with wind, wet clothing)
      - Cold water immersion (accelerated heat loss)
      - Avalanche burial
      - Inadequate clothing or shelter
    - Social factors:
      - Homelessness
      - Alcohol intoxication (vasodilation, impaired judgment)
      - Drug use (impaired thermoregulation)
      - Mental illness
      - Elderly living alone (poor heating, decreased mobility)
    - Medical conditions:
      - Endocrine: Hypothyroidism, hypoadrenalism, hypopituitarism
      - Neurologic: Stroke, spinal cord injury, Parkinson disease
      - Trauma (immobility, exposure)
      - Sepsis
      - Burns
      - Malnutrition
      - Dermatologic conditions (psoriasis, burns - increased heat loss)
    - Medications:
      - Alcohol (vasodilation, impaired judgment)
      - Sedatives (decreased shivering, impaired thermoregulation)
      - Antipsychotics
      - Beta-blockers (impaired thermogenesis)
      - Vasodilators
  - Physical examination:
    - Vital signs:
      - Core temperature (esophageal, bladder, or rectal)
      - Heart rate (bradycardia common)
      - Blood pressure (hypotension)
      - Respiratory rate (hypoventilation or apnea)
      - Oxygen saturation (may be falsely elevated due to leftward shift of O2-hemoglobin curve)
    - General:
      - Cold skin
      - Level of consciousness (GCS)
      - Shivering (presence or absence)
    - Neurologic:
      - Mental status
      - Pupillary response (may be dilated and sluggish even if not brain dead)
      - Reflexes (decreased or absent)
    - Cardiovascular:
      - Pulses (may be very weak or absent)
      - Cardiac auscultation (bradycardia, irregular if AF)
    - Respiratory:
      - Lung auscultation (aspiration, pulmonary edema)
      - Respiratory effort
    - Skin:
      - Assess for frostbite (fingers, toes, nose, ears)
      - Wounds or trauma
  - Laboratory evaluation:
    - Arterial blood gas:
      - Metabolic acidosis common (lactate)
      - Respiratory acidosis if hypoventilation
      - Note: Lab machines warm blood to 37°C, so results may not reflect true pH/gases at patient's temperature
    - Basic metabolic panel:
      - Hyperkalemia (K+ shifts out of cells during hypothermia, normalizes with rewarming)
      - Hypokalemia during rewarming (K+ shifts back into cells, requires replacement)
      - Hyperglycemia or hypoglycemia
      - Acute kidney injury (elevated BUN/Cr)
    - Complete blood count:
      - Hemoconcentration (elevated Hct from cold diuresis)
      - Thrombocytopenia (platelet sequestration)
      - WBC may be elevated or decreased
    - Coagulation studies (PT/PTT):
      - Coagulopathy (cold impairs clotting cascade)
    - Lactate:
      - Elevated (tissue hypoperfusion, anaerobic metabolism)
    - Creatine kinase:
      - Elevated if rhabdomyolysis (from prolonged immobility, shivering)
    - Thyroid function tests:
      - TSH, free T4 (rule out hypothyroidism as precipitant)
    - Cortisol (if adrenal insufficiency suspected)
    - Toxicology screen:
      - Alcohol level
      - Urine drug screen
    - Amylase and lipase (often elevated, non-specific in hypothermia)
  - ECG findings:
    - J waves (Osborn waves):
      - Pathognomonic for hypothermia
      - Positive deflection at J point (junction of QRS and ST segment)
      - Best seen in lateral precordial leads (V4-V6)
      - Appear at temp under 32°C, more prominent at lower temps
    - Arrhythmias:
      - Sinus bradycardia (most common)
      - Atrial fibrillation with slow ventricular response
      - Ventricular fibrillation (temp under 28°C)
      - Asystole
    - Prolonged intervals:
      - PR prolongation
      - QRS widening
      - QT prolongation
    - ST segment and T wave abnormalities
  - Imaging:
    - Chest X-ray:
      - Aspiration pneumonia
      - Pulmonary edema (ARDS, rewarming complication)
    - CT head (if trauma suspected or altered mental status unexplained by hypothermia)

treatment:
  - Initial stabilization (ABCs):
    - Airway:
      - Position airway (jaw thrust, avoid head tilt if C-spine injury)
      - Consider intubation if GCS under 8, apnea, or unable to protect airway
      - Use warmed, humidified oxygen if intubated
      - Gentle handling (myocardium irritable, rough movement can precipitate VF)
    - Breathing:
      - Supplemental oxygen (warm, humidified if possible)
      - Ventilation support if hypoventilation or apnea
    - Circulation:
      - Pulse check for 60 seconds (bradycardia and weak pulses can be missed)
      - If no pulse: Start CPR (see below for modifications in hypothermia)
      - IV access (two large-bore IVs)
      - Cardiac monitoring
  - Handle patient gently (rough handling can trigger VF in hypothermic myocardium)
  - Remove wet clothing and insulate from further heat loss
  - Rewarming strategy (depends on severity):
    - Mild hypothermia (32-35°C):
      - Passive external rewarming:
        - Remove wet clothing
        - Dry patient
        - Insulate with blankets
        - Warm environment (room temp 25-30°C)
        - Patient generates own heat through shivering and metabolism
        - Rewarming rate: 0.5-2°C per hour
      - May add active external rewarming if available (see below)
    - Moderate hypothermia (28-32°C):
      - Active external rewarming:
        - Forced-air warming blankets (Bair Hugger): Most effective external method
        - Warm IV fluids (38-42°C)
        - Warm humidified oxygen
        - Heating pads or warm water bottles (avoid direct skin contact, risk burns)
        - Warm water immersion (37-40°C bath, rarely used clinically)
        - Rewarming rate: 1-2°C per hour
      - Consider active internal rewarming if cardiovascular instability
    - Severe hypothermia (under 28°C) OR hemodynamic instability:
      - Active internal (core) rewarming (in addition to external):
        - Warm IV fluids (38-42°C) through rapid infuser
        - Heated humidified oxygen (40-45°C) via ventilator
        - Peritoneal lavage with warm saline (40-45°C):
          - Rewarming rate 1-3°C per hour
          - Less effective than ECMO
        - Pleural lavage with warm saline (via chest tubes)
        - Bladder/gastric lavage (minimal efficacy, not recommended as sole method)
        - ECMO or cardiopulmonary bypass (MOST EFFECTIVE):
          - Rewarming rate 5-10°C per hour
          - Preferred method for severe hypothermia with cardiac arrest
          - Provides circulatory support during rewarming
          - Consult cardiac surgery or ECMO team early
          - Survival up to 50% even after prolonged cardiac arrest
        - Hemodialysis with warm dialysate (alternative if ECMO unavailable)
  - IV fluid resuscitation:
    - Normal saline or lactated Ringer's (warmed to 38-42°C)
    - Initial bolus 500 mL-1 L (cautious, risk of fluid overload)
    - Hypothermia causes cold diuresis → volume depletion
    - During rewarming: Vasodilation → relative hypovolemia
    - Monitor for fluid overload and pulmonary edema during rewarming
  - Medication considerations:
    - Metabolism decreased at low temperatures → drug clearance impaired
    - Avoid medications until core temp over 30°C if possible
    - Glucose: Check and treat hypoglycemia (D50W 1 amp IV if glucose under 60)
    - Thiamine: 100 mg IV before glucose if alcoholic or malnourished
    - Avoid atropine (ineffective for bradycardia in hypothermia)
    - Avoid vasopressors until temp over 30°C (ineffective when cold)
    - Avoid antiarrhythmics (may worsen arrhythmias)
    - Levothyroxine: Consider if hypothyroidism suspected (T4 100-300 mcg IV)
    - Hydrocortisone: Consider if adrenal insufficiency suspected (100 mg IV)
  - Cardiac arrest management in hypothermia:
    - "No one is dead until warm and dead"
    - Continue CPR until core temp at least 32-35°C (some recommend 32°C, others 35°C)
    - CPR modifications:
      - Pulse check for 60 seconds (bradycardia and weak pulse)
      - CPR as per standard ACLS guidelines (no dose changes)
    - Defibrillation:
      - Attempt defibrillation (single shock) for VF/VT
      - If VF/VT persists and temp under 30°C:
        - Defer further shocks until core temp over 30°C
        - VF often refractory to defibrillation when cold
        - Focus on rewarming and CPR
      - Once temp over 30°C, resume standard ACLS (defibrillation every 2 min)
    - Medications:
      - Epinephrine and other ACLS drugs:
        - Some guidelines: Withhold until temp over 30°C
        - Some guidelines: Give but double dosing interval (e.g., epi q6-10min instead of q3-5min)
        - Once temp over 30°C, resume standard ACLS dosing
    - ECMO is treatment of choice for refractory cardiac arrest in severe hypothermia
    - Survival possible even after hours of CPR if hypothermic
  - Monitoring during rewarming:
    - Continuous cardiac monitoring (telemetry or ICU)
    - Core temperature every 15-30 minutes
    - Vital signs (BP, HR, RR) every 15-30 minutes
    - Neurologic status (GCS)
    - Serial labs:
      - Electrolytes (K+, Mg, Ca) every 2-4 hours (K+ shifts during rewarming)
      - ABG as needed
      - Glucose (hypoglycemia or hyperglycemia)
  - Rewarming complications:
    - Afterdrop phenomenon:
      - Core temperature continues to decrease initially despite rewarming
      - Mechanism: Cold blood from periphery returns to core
      - Can precipitate arrhythmias
      - Minimize with core rewarming techniques
    - Rewarming acidosis:
      - Lactate washes out from periphery during rewarming
      - Monitor pH and lactate
    - Hypokalemia:
      - K+ shifts back into cells during rewarming
      - Monitor and replace potassium aggressively
    - Hypotension:
      - Vasodilation during rewarming → relative hypovolemia
      - Give IV fluids cautiously
      - Vasopressors if needed once temp over 30°C
    - Arrhythmias:
      - May occur during rewarming
      - Most resolve with continued rewarming
    - Pulmonary edema (ARDS):
      - Non-cardiogenic, from capillary leak
      - Manage with supportive care, mechanical ventilation if needed
    - Rhabdomyolysis:
      - Monitor CK, treat with IV fluids
  - Prognosis and termination of resuscitation:
    - Poor prognostic factors:
      - Asystole (worse than VF)
      - Potassium over 10 mEq/L (suggests prolonged anoxia)
      - Core temp under 20°C
      - Asphyxia or trauma as cause (vs environmental exposure)
      - Prolonged burial (avalanche over 35 minutes with airway obstruction)
    - Consider terminating resuscitation if:
      - Core temp over 32-35°C AND asystole persists
      - K+ over 10 mEq/L (suggests cell death)
      - Obvious fatal injuries
    - No one is dead until warm and dead (err on side of aggressive resuscitation)
  - Disposition:
    - ICU admission for moderate-severe hypothermia, cardiac arrest, hemodynamic instability
    - Telemetry for mild hypothermia with no complications after rewarming
    - Discharge for mild hypothermia if rewarm to over 35°C, stable, able to maintain temperature
  - Prevention education:
    - Appropriate clothing and shelter
    - Avoid alcohol in cold environments
    - Early recognition and intervention

clinical_pearls:
  - Hypothermia classified as mild (32-35°C), moderate (28-32°C), severe (under 28°C)
  - Use core temperature probe (esophageal, bladder, rectal), oral/tympanic unreliable
  - J waves (Osborn waves) on ECG are pathognomonic, appear at temp under 32°C
  - Shivering ceases at temp under 32°C (ominous sign, heat production stops)
  - Handle patient gently, rough movement can trigger VF in hypothermic myocardium
  - Pulse check for 60 seconds (bradycardia and weak pulses easily missed)
  - No one is dead until warm and dead, continue CPR until temp at least 32°C
  - VF often refractory to defibrillation until temp over 30°C
  - ECMO or cardiopulmonary bypass is most effective rewarming for severe hypothermia with cardiac arrest
  - Rewarming rates are passive external 0.5-2°C/hr, active external 1-2°C/hr, ECMO 5-10°C/hr
  - Potassium shifts include hyperkalemia during hypothermia, hypokalemia during rewarming (requires replacement)
  - Afterdrop means core temp continues to drop initially despite rewarming (cold blood from periphery)
  - Atropine ineffective for bradycardia, vasopressors ineffective until temp over 30°C
  - Mortality mild hypothermia under 5%, severe hypothermia over 40%
  - K+ over 10 mEq/L suggests prolonged anoxia (poor prognosis)

presentations:
  - Confusion or altered mental status
  - Shivering (mild hypothermia)
  - Loss of shivering (moderate-severe)
  - Cold exposure history
  - Bradycardia
  - Hypotension
  - Hypoventilation or apnea
  - Coma
  - Cardiac arrest (VF or asystole)
  - Cold skin
  - J waves on ECG
  - Atrial fibrillation
  - Paradoxical undressing
  - Frostbite

