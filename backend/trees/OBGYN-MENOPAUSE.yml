tree_id: OBGYN-MENOPAUSE
name: Menopause
family: Obstetrics and Gynecology
specialty: Gynecology
chief_complaint: Hot flashes and irregular periods
description: Permanent cessation of menstruation marking end of reproductive life, diagnosed after 12 consecutive months of amenorrhea. Hormone therapy effectively treats vasomotor symptoms, non-hormonal options available.
icd10: N95.1
urgency: non-urgent

workup:
  - Clinical diagnosis: age above 45 with 12 months amenorrhea plus menopausal symptoms (vasomotor symptoms, vaginal dryness, sleep disturbance, mood changes)
  - No lab testing needed if typical presentation (age, symptoms, amenorrhea)
  - FSH level: if diagnosis uncertain (age below 45, atypical symptoms) - elevated FSH above 30-40 suggests ovarian insufficiency
  - Rule out pregnancy: urine or serum hCG if age below 50 and amenorrhea
  - TSH: if symptoms overlap with thyroid dysfunction (fatigue, weight changes, mood)
  - Average age menopause: 51 years (range 45-55)
  - Perimenopause: transition period with irregular cycles, fluctuating estrogen, symptoms begin (lasts 4-8 years before final period)
  - Premature menopause: age below 40 (primary ovarian insufficiency)

treatment:
  - Menopausal hormone therapy (MHT): most effective for vasomotor symptoms (hot flashes, night sweats)
  - Estrogen-progestin combined: if intact uterus (progestin protects endometrium from unopposed estrogen)
  - Conjugated estrogens 0.3-0.625 mg plus medroxyprogesterone 2.5 mg daily, or estradiol patch 0.025-0.05 mg twice weekly plus oral progestin
  - Estrogen alone: if hysterectomy (no uterus, no endometrial cancer risk)
  - Benefits: reduces hot flashes 75-90%, improves sleep, mood, vaginal symptoms, prevents bone loss
  - Risks: small increased risk venous thromboembolism, stroke (oral estrogen), breast cancer with prolonged use (longer than 5 years combined therapy)
  - Contraindications: personal history breast cancer, undiagnosed vaginal bleeding, active VTE, coronary disease, stroke
  - Lowest effective dose shortest duration: start low dose, reassess annually, consider stopping after 3-5 years
  - Non-hormonal options for vasomotor symptoms: SSRIs/SNRIs (paroxetine 7.5 mg, venlafaxine 75 mg, escitalopram 10-20 mg reduce hot flashes 50-60%), gabapentin 300-900 mg daily, or fezolinetant (neurokinin-3 receptor antagonist)
  - Vaginal estrogen: for genitourinary syndrome of menopause (vaginal dryness, dyspareunia, urinary symptoms) - estradiol vaginal cream/tablet/ring, very low systemic absorption, safe even in breast cancer survivors
  - Vaginal moisturizers: non-hormonal (Replens, hyaluronic acid) if estrogen contraindicated
  - Bone health: calcium 1200 mg daily, vitamin D 800-1000 IU, weight-bearing exercise, DEXA at age 65 or earlier if risk factors
  - Lifestyle: dress in layers, cool environment, avoid triggers (spicy foods, alcohol, caffeine), regular exercise

clinical_pearls:
  - 12 months amenorrhea in woman above 45 with symptoms diagnostic - no testing needed
  - Menopausal hormone therapy most effective for hot flashes - reduces by 75-90%
  - Combined estrogen-progestin if intact uterus, estrogen alone if hysterectomy
  - Use lowest dose shortest duration - reassess annually
  - Non-hormonal alternatives: SSRIs/SNRIs reduce hot flashes 50-60%
  - Vaginal estrogen safe and effective for genitourinary symptoms
  - Screen for osteoporosis at age 65 or earlier if risk factors
  - Average age menopause 51 years

differentials:
  - Pregnancy: rule out with hCG if age below 50 and amenorrhea
  - Primary ovarian insufficiency: menopause age below 40, elevated FSH, low estradiol
  - Hypothyroidism: fatigue, weight gain, cold intolerance, irregular periods, elevated TSH
  - Hyperprolactinemia: amenorrhea, galactorrhea, elevated prolactin, pituitary adenoma

trace: |
  A 52-year-old woman presented with 14 months amenorrhea and severe vasomotor symptoms consisting of 15-20 hot flashes per day and 4-5 night sweats nightly causing sleep disruption and daytime fatigue. Vaginal dryness causing dyspareunia. No personal or family history of breast cancer, no VTE history. Last menstrual period 14 months ago. Diagnosed with menopause. Discussed risks and benefits of menopausal hormone therapy. Patient desired treatment given severity of symptoms. Started estradiol patch 0.05 mg twice weekly plus micronized progesterone 100 mg nightly (if intact uterus protects endometrium). At 2 weeks hot flashes reduced to 5-6 per day, night sweats 1-2 per night, sleep improved significantly. At 6 weeks hot flashes rare (1-2 per day), night sweats resolved, vaginal symptoms improved. At 3 months excellent symptom control, quality of life dramatically improved. Counseled on annual reassessment, plan to use lowest effective dose for 3-5 years then reassess need. Started calcium 1200 mg daily and vitamin D 1000 IU for bone health. At 12 months continues hormone therapy with excellent control, scheduled for DEXA scan at age 65.
