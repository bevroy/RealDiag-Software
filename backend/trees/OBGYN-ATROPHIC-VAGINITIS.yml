tree_id: OBGYN-ATROPHIC-VAGINITIS
name: Atrophic Vaginitis
family: obstetrics_gynecology
specialty: Gynecology/Primary Care
icd10: N95.2
snomed: 237091009
urgency: []
homeopathy: []
presentations:
  - Vaginal dryness
  - Dyspareunia (painful intercourse)
  - Vaginal burning or irritation
  - Vaginal itching
  - Increased vaginal discharge (thin, watery)
  - Vaginal bleeding or spotting (especially after intercourse)
  - Urinary symptoms (frequency, urgency, dysuria, recurrent UTIs)
  - Postmenopausal women (most common)
  - Premenopausal with hypoestrogenism (breastfeeding, chemotherapy, GnRH agonists)
  - Symptoms worsen over time without treatment
workup:
  - Clinical history
  - Menopausal status (age, last menstrual period)
  - Time since menopause
  - Hormone replacement therapy use
  - Breastfeeding status
  - Medications (GnRH agonists, aromatase inhibitors, chemotherapy)
  - Sexual activity and impact on quality of life
  - Urinary symptoms
  - Physical examination
  - External genitalia inspection
  - Loss of labial fullness, thinning of labia
  - Loss of pubic hair
  - Introital narrowing or stenosis
  - Fissures or excoriations
  - Speculum examination (use small speculum if stenosis)
  - Vaginal mucosa pale, dry, thin, with loss of rugae
  - Petechiae or ecchymoses (fragile mucosa)
  - Sparse or absent discharge
  - Vaginal pH measurement
  - "Premenopausal: pH 4.0-4.5"
  - "Postmenopausal/atrophic: pH greater than 5.0-6.0"
  - Loss of lactobacilli increases pH
  - Wet mount microscopy
  - Parabasal cells (immature epithelial cells)
  - Decreased lactobacilli
  - Increased white blood cells
  - Absence of clue cells, trichomonads, yeast (rules out infection)
  - Pelvic examination
  - Bimanual exam to assess for masses or tenderness
  - Additional evaluation if postmenopausal bleeding
  - Transvaginal ultrasound (measure endometrial thickness)
  - "Endometrial thickness less than 4 mm: low risk for hyperplasia/cancer"
  - "Greater than 4 mm: consider endometrial biopsy"
  - Endometrial biopsy if persistent or recurrent bleeding
treatment:
  - Vaginal estrogen therapy (FIRST-LINE treatment)
  - Most effective treatment for vulvovaginal atrophy
  - Low-dose local estrogen has minimal systemic absorption
  - Safe in most women, including breast cancer survivors (discuss with oncologist)
  - Vaginal estrogen preparations
  - Estradiol vaginal cream (Estrace)
  - 0.5 g (0.5 mg estradiol) intravaginally nightly for 2 weeks, then 1-3 times weekly maintenance
  - Conjugated estrogen vaginal cream (Premarin)
  - 0.5 g intravaginally nightly for 2 weeks, then 1-3 times weekly
  - Estradiol vaginal tablet (Vagifem)
  - 10 mcg tablet intravaginally nightly for 2 weeks, then twice weekly
  - Convenient, less messy than cream
  - Estradiol vaginal ring (Estring)
  - 2 mg ring inserted intravaginally, releases 7.5 mcg/day for 90 days
  - Replace every 3 months
  - Stays in place during intercourse
  - Symptom improvement typically within 2-4 weeks
  - Continue long-term as symptoms recur if stopped
  - Non-hormonal treatments
  - Vaginal moisturizers (long-acting, not just for intercourse)
  - Hyaluronic acid-based products (Revaree, Hyalo Gyn)
  - Polycarbophil-based (Replens) - use 2-3 times weekly
  - Adhere to vaginal walls, provide sustained moisture
  - Vaginal lubricants (water-based or silicone-based, for intercourse)
  - Use during sexual activity to reduce friction
  - Avoid oil-based lubricants (damage condoms, increase infection risk)
  - Ospemifene (Osphena) - oral selective estrogen receptor modulator (SERM)
  - 60 mg PO daily
  - Estrogen agonist effect on vagina, antagonist on breast and endometrium
  - Alternative for women who cannot or prefer not to use vaginal estrogen
  - Side effects: hot flashes, increased risk VTE (similar to oral estrogen)
  - Prasterone (Intrarosa) - vaginal DHEA
  - 6.5 mg intravaginal suppository nightly
  - Converted to estrogen and testosterone locally
  - Minimal systemic absorption
  - For moderate to severe dyspareunia
  - Systemic hormone replacement therapy (if menopausal symptoms present)
  - Oral or transdermal estrogen-progestin (if uterus intact)
  - Improves vulvovaginal atrophy AND vasomotor symptoms
  - Higher systemic absorption than vaginal estrogen
  - Risks: VTE, stroke, breast cancer (with prolonged use)
  - Lifestyle and behavioral modifications
  - Regular sexual activity (increases vaginal blood flow, maintains elasticity)
  - Dilator therapy if severe stenosis
  - Avoid irritants (douches, perfumed soaps, harsh detergents)
  - Wear cotton underwear
  - Avoid tight-fitting clothing
  - Pelvic floor physical therapy if dyspareunia or pelvic floor dysfunction
  - Special considerations
  - Breast cancer survivors
  - Vaginal estrogen generally safe (minimal systemic absorption)
  - Discuss with oncologist, especially if on aromatase inhibitors
  - Non-hormonal options preferred by some (moisturizers, lubricants, ospemifene)
  - Women with intact uterus on systemic estrogen
  - Must take progestin to prevent endometrial hyperplasia
  - Low-dose vaginal estrogen does NOT require progestin (minimal endometrial stimulation)
clinical_pearls:
  - 'Atrophic vaginitis affects 50% of postmenopausal women - often underdiagnosed and undertreated'
  - 'Vaginal pH greater than 5.0 supports diagnosis of atrophic vaginitis (loss of lactobacilli)'
  - 'Low-dose vaginal estrogen is first-line treatment - improves symptoms in 80-90% within 2-4 weeks'
  - 'Vaginal estrogen has minimal systemic absorption - does NOT require progesterone even with intact uterus'
  - 'Vaginal estrogen generally safe in breast cancer survivors - systemic absorption negligible with low-dose preparations'
  - 'Regular sexual activity helps maintain vaginal health and elasticity in postmenopausal women'
  - 'Atrophic vaginitis increases risk of recurrent UTIs due to loss of protective lactobacilli - vaginal estrogen reduces UTI recurrence'
  - 'Symptoms recur if treatment stopped - long-term maintenance therapy required'
referrals:
  - Gynecology if refractory symptoms despite vaginal estrogen therapy
  - Urogynecology for severe vaginal stenosis, pelvic organ prolapse, or urinary incontinence
  - Sexual medicine specialist for complex dyspareunia or sexual dysfunction
  - Pelvic floor physical therapy for pelvic floor dysfunction contributing to dyspareunia
  - Oncology consultation if breast cancer survivor considering vaginal estrogen
differentials:
  - Atrophic vaginitis (postmenopausal, vaginal dryness, pH greater than 5, parabasal cells)
  - Vulvovaginal candidiasis (thick white discharge, pruritus, pseudohyphae on KOH prep, normal pH)
  - Bacterial vaginosis (thin gray discharge, fishy odor, clue cells, pH greater than 4.5)
  - Trichomoniasis (yellow-green frothy discharge, pH greater than 4.5, motile trichomonads)
  - Lichen sclerosus (white plaques, parchment-like skin, vulvar architecture changes, biopsy diagnostic)
  - Lichen planus (erosive variant - vaginal scarring, synechiae, biopsy shows interface dermatitis)
  - Genitourinary syndrome of menopause (GSM - broader term including urinary and sexual symptoms)
  - Contact dermatitis (exposure to irritant or allergen, pruritus, erythema, normal vaginal pH)
