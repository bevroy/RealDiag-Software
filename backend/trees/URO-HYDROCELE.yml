presentations:
  - Painless scrotal swelling
  - Transilluminates on exam
  - Testicle difficult to palpate due to fluid
  - May be congenital or acquired
  - Acquired causes - trauma, infection, tumor
  - Usually benign
differentials:
  - Inguinal hernia
  - Varicocele
  - Testicular tumor
  - Spermatocele
  - Epididymal cyst
workup:
  - 'Transillumination: Flashlight through scrotum - fluid transilluminates (red glow), solid masses do not'
  - 'Ultrasound: If any concern for tumor, unable to palpate testicle, rapid growth, or before surgery. Shows fluid around testicle, evaluates testicle/epididymis'
  - 'Physical exam: Fluid collection separate from testicle (can get above swelling vs inguinal hernia where you cannot)'
treatment:
  - 'Guideline-based treatment options for Hydrocele include:'
  - 'Observation: For small asymptomatic hydroceles - 80% of congenital resolve by age 1, many adult hydroceles stable (AUA 2023)'
  - 'Aspiration: Temporary relief (recurs in 80% within months) - only if patient declines surgery. Risk of infection, bleeding (AUA 2023)'
  - 'Sclerotherapy: After aspiration, inject sclerosant (tetracycline, phenol) - 80% success but painful, risk of infection (AUA 2023)'
  - 'Hydrocelectomy: Surgical excision of tunica vaginalis - definitive treatment, <5% recurrence. Indications: large/symptomatic, congenital after age 1 (AUA 2023)'
  - 'Ultrasound BEFORE surgery: Rule out underlying testicular tumor (1% of hydroceles) (AUA 2023)'
clinical_pearls:
  - Fluid collection in tunica vaginalis surrounding testicle - communicating (congenital, patent processus vaginalis) vs non-communicating (acquired)
  - 'Congenital hydrocele: Present at birth, 80% resolve by age 1 year (closes spontaneously). If persistent after age 1, needs repair'
  - 'Acquired hydrocele: Trauma, epididymitis, testicular torsion, tumor (1% of hydroceles hide testicular tumor) - needs ultrasound'
  - 'Transillumination: Shine flashlight through scrotum - hydrocele lights up red (fluid), tumor/hernia does not (solid)'
  - 'Idiopathic: Most common in adults - slow fluid accumulation, unknown cause, usually benign'
red_flags: []
disposition_guidance: {}
referrals:
  - 'Urology if: Large/symptomatic, congenital hydrocele persisting after age 1, unable to palpate testicle, rapid growth, patient desires surgery'
  - Small asymptomatic hydroceles can be observed
