tree_id: HEME-IRON-DEFICIENCY-ANEMIA
name: Iron Deficiency Anemia
family: Hematology
specialty: Hematology
chief_complaint: Fatigue and pallor
description: |
  Most common cause of anemia worldwide. Results from inadequate iron for hemoglobin synthesis.
  Causes: blood loss (GI bleeding, menorrhagia), inadequate intake, malabsorption (celiac disease), increased demand (pregnancy).
icd10: D50.9
urgency: Moderate
workup:
  - Complete blood count: low hemoglobin, low MCV (microcytic), low MCHC (hypochromic)
  - Reticulocyte count (inappropriately low for degree of anemia)
  - Iron studies: low ferritin (<30 ng/mL most sensitive), low serum iron, high TIBC, low transferrin saturation (<20%)
  - Peripheral smear: microcytic hypochromic RBCs, pencil cells, target cells
  - Stool guaiac test for occult blood (identify GI bleeding)
  - Upper endoscopy and colonoscopy in adults (especially men and postmenopausal women) to rule out GI malignancy
  - Celiac serologies (anti-tissue transglutaminase IgA) if malabsorption suspected
  - Pelvic ultrasound if menorrhagia (fibroids, endometrial pathology)
treatment:
  - Oral iron supplementation: ferrous sulfate 325mg (65mg elemental iron) TID on empty stomach
  - Take with vitamin C (enhances absorption), avoid with calcium, antacids, or PPIs
  - Expect hemoglobin rise of 1-2 g/dL after 3-4 weeks of treatment
  - Continue iron for 3-6 months after correction to replenish stores
  - IV iron (iron sucrose, ferric carboxymaltose) if: oral intolerance, malabsorption, chronic kidney disease, or need for rapid correction
  - Blood transfusion if symptomatic (angina, dyspnea at rest, hemodynamic instability)
  - Treat underlying cause: treat H. pylori, hormonal therapy for menorrhagia, surgical repair of GI bleeding source
clinical_pearls:
  - Ferritin <30 ng/mL diagnostic for iron deficiency (first value to drop)
  - Ferritin is acute phase reactant (may be falsely elevated in inflammation)
  - Serum iron varies diurnally, ferritin more reliable
  - Reticulocyte count should rise 3-7 days after starting iron (confirms diagnosis and adherence)
  - Side effects of oral iron: constipation, dark stools, nausea (take with food if intolerable)
  - Pica (craving ice or non-food items) suggests severe iron deficiency
  - Always investigate cause in men and postmenopausal women (assume GI malignancy until proven otherwise)
differentials:
  - Thalassemia trait (microcytic but ferritin normal)
  - Anemia of chronic disease
  - Sideroblastic anemia
  - Lead poisoning
  - Copper deficiency
  - Hemoglobinopathy
trace:
  - Fatigue and pallor → CBC shows microcytic hypochromic anemia → Iron studies show low ferritin, low serum iron, high TIBC → Diagnose iron deficiency anemia → Investigate cause (GI evaluation, celiac serologies, menstrual history) → Ferrous sulfate 325mg TID → Recheck CBC in 4 weeks (expect hemoglobin rise 1-2 g/dL) → Continue iron 3-6 months to replenish stores → Address underlying cause
