tree_id: HEME-IRON-DEFICIENCY-ANEMIA
name: Iron Deficiency Anemia
family: Hematology
specialty: Hematology
chief_complaint: Fatigue and pallor
description: |
  Most common cause of anemia worldwide. Results from inadequate iron for hemoglobin synthesis causing microcytic hypochromic anemia.
  Causes include blood loss (GI bleeding, menorrhagia), inadequate intake, malabsorption (celiac disease, H. pylori, gastric bypass), increased demand (pregnancy, growth). Must identify underlying cause.
icd10: D50.9
snomed: 87522002
presentations:
  - Fatigue, weakness
  - Pallor
  - Dyspnea on exertion
  - Pica (ice, dirt)
  - Restless legs syndrome
  - Koilonychia (spoon nails), angular cheilitis
urgency: Moderate
referrals:
  emergency:
    - Acute leukemia
    - TTP/HUS
    - DIC
    - Hgb <7 with symptoms
  urgent:
    - New lymphadenopathy
    - Plt <20k
    - Severe anemia
  routine:
    - Mild anemia
    - Clotting disorder
    - Anticoagulation

workup:
  - CBC - low hemoglobin (Hgb less than 13 g/dL men, less than 12 g/dL women), low MCV (less than 80 fL), low MCH
  - Peripheral smear - microcytic hypochromic RBCs, anisocytosis (variation in size), poikilocytosis (variation in shape), occasional target cells
  - Iron studies - low serum iron, high total iron binding capacity (TIBC), low ferritin (most specific - less than 15 ng/mL diagnostic), low transferrin saturation (less than 15%)
  - Ferritin acute phase reactant - may be falsely normal/elevated with inflammation, use less than 30-50 ng/mL as cutoff if inflammatory condition
  - Reticulocyte count - usually low or inappropriately normal (inadequate response)
  - Identify source of blood loss - most common cause in adults
  - Men and postmenopausal women - GI bleeding until proven otherwise
  - Stool guaiac/FIT (fecal immunochemical test) - screen for occult blood
  - Upper endoscopy and colonoscopy if no obvious source - evaluate for PUD, gastritis, AVM, polyps, cancer
  - Celiac serology (TTG-IgA) if malabsorption suspected
  - H. pylori testing - chronic gastritis impairs iron absorption
  - Premenopausal women - menstrual history, assess for heavy periods (menorrhagia)
  - Pregnancy - screen all pregnant women, increased iron demands
  - Assess dietary iron intake - vegetarians, poor diet
  - Rule out other microcytic anemias - thalassemia (normal/elevated RDW, family history, hemoglobin electrophoresis), anemia of chronic disease (low TIBC, elevated ferritin), lead poisoning (basophilic stippling)
treatment:
  - Oral iron replacement first-line
  - Ferrous sulfate 325mg (65mg elemental iron) TID on empty stomach - most effective absorption
  - Take with vitamin C (orange juice) to enhance absorption
  - Avoid with food, calcium, antacids (reduce absorption)
  - Side effects - nausea, constipation, dark stools (warn patients), abdominal pain
  - If intolerant, reduce to daily dosing or take with food (less effective but better than non-adherence)
  - Alternative formulations - ferrous gluconate 325mg (36mg elemental iron), ferrous fumarate 325mg (106mg elemental iron), polysaccharide iron complex (better tolerated)
  - Duration - continue until ferritin normalizes (greater than 50 ng/mL) then 3-6 months more to replete stores (typically 3-6 months total)
  - Hemoglobin should increase 1 g/dL every 2-3 weeks, reticulocyte count rises within 5-7 days (good response)
  - Check CBC at 4-6 weeks to confirm response
  - Intravenous iron if intolerant to oral, malabsorption, ongoing losses exceeding oral replacement, need rapid repletion (severe anemia, pregnancy)
  - Iron sucrose 200mg IV x 5 doses (total 1000mg)
  - Ferric carboxymaltose 750mg IV x 2 doses one week apart (total 1500mg)
  - Ferumoxytol 510mg IV x 2 doses 3-8 days apart (total 1020mg)
  - Risk of infusion reactions (flushing, hypotension), rare anaphylaxis
  - RBC transfusion if severe symptomatic anemia (Hgb less than 7 g/dL or hemodynamically unstable)
  - Treat underlying cause critical
  - GI bleeding - PPI for PUD, endoscopic treatment for AVM/polyps, surgery for cancer
  - Menorrhagia - OCPs, NSAIDs, tranexamic acid, IUD (levonorgestrel), endometrial ablation
  - Celiac disease - gluten-free diet improves absorption
  - H. pylori - eradicate with triple or quadruple therapy
  - Dietary counseling - increase iron-rich foods (red meat, liver, fortified cereals, beans, spinach)
clinical_pearls:
  - Pica (pagophagia - ice craving, geophagia - eating clay/dirt) pathognomonic for iron deficiency
  - Koilonychia (spoon-shaped nails), glossitis, angular cheilitis seen in severe cases
  - Restless legs syndrome associated with iron deficiency even without anemia
  - Plummer-Vinson syndrome (iron deficiency plus esophageal webs, dysphagia) rare, increased squamous cell esophageal cancer risk
  - RDW (red cell distribution width) elevated early - sensitive marker of iron deficiency
  - Failure to respond to oral iron - non-adherence most common, consider ongoing losses, malabsorption, wrong diagnosis (thalassemia, anemia of chronic disease)
  - Iron overload from excessive supplementation rare with oral but possible with IV - monitor ferritin
differentials:
  - Thalassemia trait
  - Anemia of chronic disease
  - Sideroblastic anemia
  - Lead poisoning
  - Mixed anemia (iron deficiency plus B12/folate deficiency)
trace:
  - 55-year-old man with progressive fatigue x 6 months → Exam shows conjunctival pallor → CBC shows Hgb 8.2 g/dL, MCV 72 fL, RDW 18% → Iron studies - ferritin 8 ng/mL, TIBC 425 mcg/dL, transferrin saturation 9% → Diagnose iron deficiency anemia → Stool FIT positive → Upper endoscopy shows gastric ulcer, H. pylori positive → Colonoscopy shows 2 cm adenomatous polyp → Ulcer biopsy positive for H. pylori → Start ferrous sulfate 325mg TID, pantoprazole 40mg BID, H. pylori triple therapy (amoxicillin, clarithromycin, PPI) x 14 days → Polypectomy performed → Repeat CBC at 6 weeks - Hgb 10.8 g/dL (appropriate response) → Continue iron x 6 months → Repeat ferritin 62 ng/mL at 6 months, Hgb normalizes to 14.1 g/dL → Colonoscopy surveillance in 3 years

citations:
  - ASH (American Society of Hematology) Clinical Practice Guidelines
  - BSH (British Society for Haematology) Guidelines
  - UpToDate - Hematology
