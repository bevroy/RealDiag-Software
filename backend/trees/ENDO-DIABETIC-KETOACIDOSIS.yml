tree_id: ENDO-DIABETIC-KETOACIDOSIS
name: Diabetic Ketoacidosis
family: Endocrinology
specialty: Endocrinology
chief_complaint: Nausea, vomiting, and altered mental status
description: |
  Life-threatening complication of diabetes with hyperglycemia, ketosis, and metabolic acidosis.
  Most common in type 1 diabetes but can occur in type 2. Mortality 1-5% with treatment. Precipitated by infection, non-adherence, new-onset diabetes.
icd10: E10.10
urgency: Critical
workup:
  - Diagnostic triad - hyperglycemia (glucose greater than 250 mg/dL), ketosis (serum or urine ketones), metabolic acidosis (pH less than 7.3, bicarbonate less than 18 mEq/L)
  - Anion gap elevated (greater than 10-12) - calculate as sodium minus (chloride plus bicarbonate)
  - Beta-hydroxybutyrate most accurate ketone measurement (greater than 3 mmol/L)
  - Basic metabolic panel (potassium critical, initially elevated but total body depleted)
  - Severity - mild (pH 7.25-7.30), moderate (pH 7.0-7.24), severe (pH less than 7.0)
  - Search for precipitant - infection (urinalysis, chest X-ray, blood cultures), medication non-adherence, MI (ECG, troponin)
  - Serum osmolality if altered mental status
treatment:
  - Aggressive IV fluid resuscitation - 0.9% normal saline 1-1.5 L bolus, then 250-500 mL/hr
  - Switch to 0.45% saline once hemodynamically stable
  - Add dextrose to fluids when glucose less than 200 mg/dL (continue insulin while giving dextrose to clear ketones)
  - Regular insulin infusion 0.1 units/kg/hr IV (do NOT give bolus unless severe acidosis)
  - Potassium replacement critical - add 20-40 mEq/L to fluids if potassium 3.3-5.3 mEq/L
  - Hold insulin if potassium less than 3.3 mEq/L (risk of fatal arrhythmia), replete aggressively
  - Monitor glucose hourly, electrolytes every 2-4 hours, venous pH every 2-4 hours until resolved
  - Resolution criteria - glucose less than 200 mg/dL, anion gap less than 12, bicarbonate greater than 18 mEq/L, pH greater than 7.3
  - Transition to subcutaneous insulin when resolution criteria met AND patient able to eat
  - Overlap IV and subcutaneous insulin by 1-2 hours to prevent recurrence
clinical_pearls:
  - Classic triad includes polyuria, polydipsia, weight loss; presentation may include Kussmaul respirations (deep, rapid breathing), fruity breath odor
  - Cerebral edema most common in children (1%), presents with headache, altered mental status, seizures (reduce IV fluid rate, give mannitol)
  - Most common precipitants - infection (30-40%), insulin non-adherence (20-30%), new-onset diabetes (20%)
  - Anion gap closure but persistent acidosis suggests hyperchloremic acidosis from normal saline (benign)
  - DKA in type 2 diabetes called ketosis-prone type 2 diabetes
  - Never stop insulin infusion until subcutaneous insulin on board and ketones cleared
differentials:
  - Hyperosmolar hyperglycemic state (HHS)
  - Alcoholic ketoacidosis
  - Starvation ketosis
  - Lactic acidosis
  - Toxic ingestion (methanol, ethylene glycol, salicylates)
  - Uremia
trace:
  - Nausea, vomiting, abdominal pain x 2 days, increasing confusion → Glucose 420 mg/dL, pH 7.15, bicarbonate 10 mEq/L, anion gap 24, beta-hydroxybutyrate 5.8 mmol/L, potassium 5.2 mEq/L → Diagnose moderate DKA → Normal saline 1L bolus, then 500 mL/hr → Regular insulin infusion 0.1 units/kg/hr → Potassium repletion 40 mEq/L added to fluids → Glucose decreases to 180 mg/dL by hour 4, add dextrose to fluids → Anion gap closes, pH 7.32 by hour 8 → Transition to subcutaneous insulin basal-bolus regimen → Identify UTI as precipitant, treat with antibiotics
