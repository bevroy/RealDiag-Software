tree_id: EMERGENCY-DIABETIC-KETOACIDOSIS
name: Diabetic Ketoacidosis (DKA)
family: EMERGENCY MEDICINE
specialty: Emergency Medicine, Endocrinology, Critical Care
chief_complaint: Hyperglycemia, Altered Mental Status, Abdominal Pain
description: Diagnosis and management of diabetic ketoacidosis with protocol-based treatment approach
version: "1.0"
icd10: E10.10
author: RealDiag Clinical Team

entry_point: dka_screening

nodes:
  - id: dka_screening
    type: question
    text: "Diabetic patient with concerning presentation?"
    options:
      - label: "Glucose >250 mg/dL AND ketones AND acidosis (pH <7.3 or bicarb <18)"
        next: dka_severity
      - label: "Glucose >600 mg/dL without significant ketones"
        next: hhs_diagnosis
      - label: "Mild hyperglycemia with some ketones"
        next: mild_hyperglycemia

  - id: dka_severity
    type: question
    text: "Assess DKA severity"
    options:
      - label: "pH <7.0 OR altered mental status OR hemodynamic instability"
        next: severe_dka
      - label: "pH 7.0-7.24 AND bicarb 10-15 mEq/L"
        next: moderate_dka
      - label: "pH 7.25-7.30 AND bicarb 15-18 mEq/L"
        next: mild_dka

  - id: severe_dka
    type: diagnosis
    name: "Severe Diabetic Ketoacidosis"
    icd10: "E10.10"
    urgency: critical
    workup:
      - Blood glucose (fingerstick and serum)
      - Venous or arterial blood gas
      - CMP (sodium, potassium, chloride, bicarb, BUN, creatinine, glucose)
      - Anion gap calculation (Na - [Cl + HCO3])
      - Serum or urine ketones (beta-hydroxybutyrate preferred)
      - CBC with differential
      - Phosphate, magnesium, calcium
      - HgbA1c
      - Urinalysis and culture
      - ECG (assess for hyperkalemia, MI)
      - Chest X-ray
      - Blood cultures if febrile
      - Serum osmolality
      - Lipase if abdominal pain
      - Consider CT head if altered mental status
    treatment:
      - IMMEDIATE Management
      - Fluid Resuscitation
        * Initial - NS 1-2 L bolus over first hour (15-20 mL/kg/hr)
        * Maintenance - NS 250-500 mL/hr (adjust based on hydration status, cardiac function)
        * When glucose <250 mg/dL switch to D5 1/2 NS at 150-250 mL/hr
        * Goal - positive fluid balance of 3-5L in first 24 hours
      - Insulin Protocol
        * DO NOT START until K+ >3.3 mEq/L
        * Regular insulin 0.1 units/kg IV bolus (optional, can omit bolus)
        * Then regular insulin 0.1 units/kg/hr IV continuous infusion
        * When glucose <250 mg/dL reduce to 0.05 units/kg/hr AND add D5 to fluids
        * Continue insulin until anion gap closes (<12) AND bicarb >18 AND pH >7.3
        * Then transition to subcutaneous insulin (overlap 1-2 hours)
      - Potassium Replacement (CRITICAL)
        * K+ >5.2 mEq/L - no replacement, recheck q2h
        * K+ 3.3-5.2 mEq/L - add 20-30 mEq/L to IV fluids
        * K+ <3.3 mEq/L - HOLD INSULIN, give 20-40 mEq K+ until >3.3
        * Most DKA patients are total body K+ depleted despite normal levels
      - Bicarbonate (ONLY if pH <6.9)
        * 100 mEq NaHCO3 in 400 mL sterile water with 20 mEq KCl
        * Infuse over 2 hours
        * Recheck pH after 2 hours
        * Generally avoid unless severe acidosis with cardiovascular instability
      - Phosphate Replacement
        * Usually not needed acutely
        * If severe hypophosphatemia (<1.0 mg/dL) or cardiac/respiratory compromise
        * Sodium phosphate 20-30 mEq/L added to fluids
      - Search for Precipitating Cause
        * Infection (most common) - pneumonia, UTI, cellulitis
        * Insulin non-compliance or pump failure
        * MI or stroke
        * Pancreatitis
        * Medications (steroids, antipsychotics, diuretics)
        * New diagnosis of diabetes
      - ICU Admission
      - Monitoring
        * Glucose hourly (fingerstick)
        * Electrolytes, anion gap, venous pH q2-4h initially
        * Mental status
        * Urine output
        * Cardiac monitor (K+ changes)
      - Complications to Watch For
        * Cerebral edema (especially in children and young adults)
        * Hypokalemia from insulin treatment
        * Hypoglycemia from excessive insulin
        * Cardiac arrhythmias
        * Mucormycosis (rare)
    prognosis: "Mortality 1-5% with proper treatment; higher in elderly or with severe comorbidities"

  - id: moderate_dka
    type: diagnosis
    name: "Moderate Diabetic Ketoacidosis"
    icd10: "E10.10"
    urgency: emergency
    workup:
      - Same as severe DKA
    treatment:
      - Fluid resuscitation - NS 500 mL/hr initially, then 250 mL/hr
      - Insulin infusion 0.1 units/kg/hr IV
      - Potassium replacement protocol
      - Monitor glucose hourly, electrolytes q2-4h
      - Search for precipitating cause
      - Hospital admission (ICU or step-down)
      - Same insulin and potassium protocols as severe DKA
    prognosis: "Excellent with appropriate treatment"

  - id: mild_dka
    type: diagnosis
    name: "Mild Diabetic Ketoacidosis"
    icd10: "E10.10"
    urgency: high
    workup:
      - Glucose, CMP, venous pH, ketones
      - CBC, UA
      - ECG
    treatment:
      - IV fluids - NS 250-500 mL/hr
      - Insulin infusion 0.05-0.1 units/kg/hr OR subcutaneous rapid-acting insulin q1-2h
      - Potassium replacement as needed
      - Can consider floor admission vs step-down
      - Monitor glucose q1-2h, electrolytes q4-6h
    prognosis: "Excellent recovery expected"

  - id: hhs_diagnosis
    type: diagnosis
    name: "Hyperosmolar Hyperglycemic State (HHS)"
    icd10: "E11.00"
    urgency: critical
    workup:
      - Same workup as DKA
      - Serum osmolality (usually >320 mOsm/kg)
    treatment:
      - MORE AGGRESSIVE fluid resuscitation than DKA
      - NS 1-2 L in first hour, then 500 mL/hr
      - Goal - replace 50% of estimated deficit in first 12-24 hours
      - Insulin - LOWER doses than DKA (0.05 units/kg/hr)
      - Correct glucose slowly (50-70 mg/dL per hour max)
      - Aggressive K+ monitoring and replacement
      - ICU admission
      - Watch for thrombotic complications (DVT, stroke, MI)
    prognosis: "Mortality 10-20%, higher than DKA; more common in elderly"

  - id: mild_hyperglycemia
    type: diagnosis
    name: "Hyperglycemia Without DKA"
    icd10: "E11.65"
    urgency: moderate
    workup:
      - Glucose, CMP
      - Consider HgbA1c
      - Urine ketones
    treatment:
      - Subcutaneous insulin if needed
      - Oral hydration if possible
      - Evaluate for precipitating cause
      - Adjust home diabetes regimen
      - May not require admission if stable
    prognosis: "Excellent"

clinical_pearls:
  - "Corrected sodium = measured Na + [1.6 × (glucose - 100)/100]"
  - "Anion gap = Na - (Cl + HCO3), normal 8-12"
  - "Beta-hydroxybutyrate more specific than urine ketones"
  - "Continue IV insulin until anion gap normalizes, not just until glucose <250"
  - "Overlap subcutaneous insulin with IV drip for 1-2 hours"
  - "Children are at highest risk for cerebral edema - avoid rapid correction"
  - "Most patients need 5-7 L fluid replacement in first 24 hours"

red_flags:
  - "pH <7.0 or bicarb <5 mEq/L"
  - "K+ <3.3 mEq/L (hold insulin!)"
  - "Altered mental status (consider cerebral edema)"
  - "Acute abdominal pain (may mimic surgical abdomen)"
  - "Hypotension or shock"
  - "Anion gap not closing despite treatment"
  - "Headache, vomiting in child (cerebral edema warning)"
