tree_id: TOX-OPIOID-OD
name: Opioid Overdose
family: Toxicology
specialty: Toxicology
icd10:
- T40.2X1A
- T40.2X2A
snomed:
- '292044008'
urgency: medium
description: Comprehensive evaluation and management of Opioid Overdose
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Decreased level of consciousness, unresponsive or obtunded
- 'Respiratory depression: RR <12, shallow breathing, apnea'
- 'Miosis: Pinpoint pupils (classic triad with CNS depression and respiratory depression)'
- Bradycardia, hypotension
- Cyanosis, hypoxia (SpO2 <90%)
- Track marks, nasal insufflation evidence, or drug paraphernalia
- Responds dramatically to naloxone (diagnostic and therapeutic)
- 'Risk factors: Fentanyl (very potent), polypharmacy (benzos + opioids), resuming
  use after abstinence'
workup: []
treatment:
- 'Guideline-based treatment options for Opioid Overdose include:'
- 'Immediate: Airway (bag-valve-mask if apneic), naloxone 0.4mg IV/IM/intranasal,
  repeat q2-3min PRN (AAPCC 2023)'
- 'Titrate naloxone: Goal RR >10, adequate ventilation (not full alertness - avoid
  withdrawal) (AAPCC 2023)'
- 'If IV access difficult: Intranasal naloxone 2-4mg (Narcan spray) or IM 0.4-2mg
  (AAPCC 2023)'
- 'Continuous monitoring: Pulse ox, cardiac monitor, serial neuro exams (AAPCC 2023)'
- 'Disposition: Observe 4-6hr minimum (re-sedation risk), naloxone drip if recurrent,
  psychiatry if intentional, addiction resources (AAPCC 2023)'
clinical_pearls:
- 'Airway management FIRST: Bag-valve-mask ventilation more important than naloxone
  initially'
- 'Naloxone dosing: 0.04-0.4mg IV/IM/IN, repeat q2-3min (max 10mg), titrate to respiratory
  effort NOT full consciousness'
- 'Goal: Adequate respirations (RR >10), NOT full alertness (avoid precipitating severe
  withdrawal)'
- 'Fentanyl: May need higher/repeat naloxone doses (very potent, long-acting)'
- 'Observe 4-6 hours: Naloxone half-life shorter than most opioids, re-sedation common'
- 'Naloxone drip: If repeated boluses needed, 2/3 of total reversal dose per hour
  IV infusion'
referrals: []
differentials:
  - Sedative overdose
  - Metabolic encephalopathy
  - Stroke
  - Hypoglycemia
  - Sepsis
trace:
  source: American College of Medical Toxicology (ACMT) Guidelines, American Association
    of Poison Control Centers (AAPCC)
