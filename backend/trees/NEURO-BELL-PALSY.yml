tree_id: NEURO-BELL-PALSY
name: Bell Palsy (Idiopathic Facial Nerve Palsy)
family: Neurology
specialty: Neurology
chief_complaint: Sudden facial weakness
description: Acute unilateral peripheral facial nerve palsy of unknown cause causing inability to close eye, facial droop, and loss of taste. Corticosteroids improve recovery, most patients recover completely within 3-6 months.
icd10: G51.0
urgency: urgent

workup:
  - Clinical diagnosis: acute unilateral lower motor neuron facial weakness (forehead involved - unable to raise eyebrow or wrinkle forehead)
  - House-Brackmann scale: grades severity (I normal, II-IV increasing weakness, V-VI severe paralysis)
  - Examination: inability to close eye (lagophthalmos), flatten forehead, smile symmetrically, loss of nasolabial fold
  - Taste: decreased taste anterior 2/3 tongue (chorda tympani branch)
  - Hyperacusis: increased sensitivity to sound (stapedius muscle paralysis)
  - Distinguish from central (stroke): forehead spared in central lesion (upper motor neuron), forehead involved in Bell palsy (lower motor neuron)
  - Otoscopic exam: vesicles in ear canal suggest Ramsay Hunt syndrome (herpes zoster reactivation) - needs antivirals
  - Lyme serology: if endemic area and history of tick exposure (Lyme can cause facial palsy)
  - MRI brain: only if atypical features (gradual onset, bilateral, other cranial nerves, no improvement by 3 months)
  - Eye care assessment: if unable to close eye completely (corneal abrasion risk)

treatment:
  - Corticosteroids (within 72 hours of onset): prednisone 60-80 mg daily x7 days then taper over 3 days, or 10-day course
  - Improves recovery rate from 70% to 90% complete recovery if started early
  - Antivirals: valacyclovir 1000 mg TID x7 days or acyclovir 400 mg 5 times daily x7 days
  - Unclear benefit as monotherapy but often given with steroids (possible modest benefit when combined)
  - Eye protection (critical): artificial tears every 1-2 hours during day, lubricating ointment at night, eye patch or tape eye closed at night
  - Prevents exposure keratopathy and corneal ulceration (sight-threatening complication)
  - Ophthalmology referral: if unable to close eye, severe dry eye, or corneal abrasion
  - Physical therapy: facial exercises may help recovery (evidence limited)
  - Prognosis: 70% complete recovery within 6 months without treatment, 85-90% with early corticosteroids
  - Incomplete recovery: 15-20% have residual weakness or synkinesis (abnormal facial movements)
  - Follow-up: reassess at 3 weeks and 3 months, if no improvement by 3 months consider EMG and imaging
  - Recurrence: 10% have recurrent episodes (consider other causes if frequent recurrence)

clinical_pearls:
  - Acute unilateral facial weakness with forehead involvement (unable to raise eyebrow)
  - Distinguish from stroke: forehead spared in stroke, involved in Bell palsy
  - Corticosteroids within 72 hours improve recovery 70% to 90%
  - Eye protection critical - artificial tears, ointment, tape eye closed at night
  - Most recover completely within 3-6 months
  - Check for ear vesicles (Ramsay Hunt syndrome needs antivirals urgently)
  - Lyme serology if endemic area
  - 85-90% complete recovery with early treatment

differentials:
  - Stroke (pontine): forehead spared (upper motor neuron), other neurologic deficits, gradual or sudden onset, MRI shows infarct
  - Ramsay Hunt syndrome: vesicles in ear canal or on tympanic membrane, severe otalgia, treat with antivirals plus steroids
  - Lyme disease: facial palsy (can be bilateral 30%), history of tick bite, Lyme serology positive, treat with doxycycline
  - Acoustic neuroma: gradual onset facial weakness, hearing loss, MRI shows cerebellopontine angle mass

trace: |
  A 42-year-old woman presented to ED with sudden onset right-sided facial weakness noticed upon awakening. Unable to close right eye completely, right side of mouth drooping, unable to raise right eyebrow or wrinkle right forehead. No limb weakness, speech normal, no hearing loss. Symptoms started 24 hours ago. Exam confirmed complete right facial palsy (House-Brackmann grade IV) involving forehead (lower motor neuron pattern), unable to close right eye with 2 mm lagophthalmos. No vesicles in ear. No recent travel, no tick exposure. Diagnosed with Bell palsy. Started prednisone 60 mg daily x7 days within 72-hour window (likely viral etiology). Given valacyclovir 1000 mg TID x7 days. Extensive eye care instructions: artificial tears every 1-2 hours, lubricating ointment at night, tape eye closed at night to prevent corneal exposure. At 2 weeks slight improvement, able to partially close eye, smile asymmetry improving. At 6 weeks significant improvement, eye closure nearly complete, mild residual mouth asymmetry. At 3 months 95% recovery, minimal residual weakness only with forced smile, excellent functional outcome. No corneal complications from diligent eye care.
