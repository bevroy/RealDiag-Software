tree_id: CARDS-VARICOSE-VEINS
name: Varicose Veins
family: cardiology
specialty: Cardiology
icd10: I83.90
snomed: 72866009
urgency: routine
homeopathy: []
presentations:
  - Visible dilated, tortuous superficial veins (>3mm diameter)
  - Most commonly in legs (great or small saphenous vein distribution)
  - Leg heaviness, aching, or throbbing
  - Leg fatigue
  - Symptoms worse at end of day or after prolonged standing
  - Symptoms improve with leg elevation or compression
  - Night cramps
  - Burning or itching sensation
  - Cosmetic concerns
  - Complications - bleeding, superficial thrombophlebitis, venous ulcers (late)
  - Risk factors - family history, female sex, pregnancy, obesity, prolonged standing
workup:
  - Clinical diagnosis based on inspection
  - Venous duplex ultrasound if symptoms present or treatment planned
  - Assess for saphenofemoral or saphenopopliteal junction incompetence
  - Evaluate deep venous system for reflux or obstruction
  - Map perforator vein incompetence
  - Trendelenburg test (clinical exam, less used now)
  - Standing examination accentuates varicosities
  - Ankle-brachial index if arterial disease suspected (before compression)
treatment:
  - Conservative management (first-line for uncomplicated varicose veins)
  - Compression stockings 20-30 mmHg (symptom relief, doesn't eliminate varicosities)
  - Leg elevation when possible
  - Regular exercise - walking, calf muscle exercises
  - Weight loss if overweight
  - Avoid prolonged standing or sitting
  - Interventional treatment indications
  - Symptomatic varicose veins despite conservative measures
  - Complications - bleeding, thrombophlebitis, venous ulcers
  - Cosmetic concerns (patient preference)
  - Endovenous thermal ablation (first-line intervention)
  - Radiofrequency ablation (RFA) or endovenous laser therapy (EVLT)
  - 90-95% success rate, minimal downtime
  - Target great or small saphenous vein reflux
  - Sclerotherapy - injection of sclerosant (sodium tetradecyl sulfate, polidocanol)
  - Good for telangiectasias, reticular veins, residual varicosities post-ablation
  - Foam sclerotherapy for larger varicosities
  - Microphlebectomy - surgical removal through small incisions
  - For large tributary varicosities not amenable to sclerotherapy
  - High ligation and stripping (traditional surgery) - rarely done now
  - Compression stockings 1-2 weeks post-procedure
clinical_pearls:
  - Varicose veins affect 25-30% of adults (higher in women)
  - Most are asymptomatic or mildly symptomatic
  - Natural history - 10% worsen over 5 years without treatment
  - Telangiectasias (<1mm) and reticular veins (1-3mm) are milder forms
  - Pregnancy-related varicose veins may improve after delivery
  - Hereditary component - 90% have positive family history if both parents affected
  - Saphenofemoral junction incompetence most common cause (85%)
  - Small saphenous vein incompetence less common (15%)
  - Bleeding from varicose veins can be significant - treat with elevation and pressure
  - Recurrence rate 20-30% at 5 years after treatment
referrals:
  - Vascular surgery for symptomatic varicose veins or complications
  - Interventional radiology for endovenous ablation or sclerotherapy
  - Dermatology for superficial cosmetic telangiectasias
differentials:
  - Primary varicose veins (valvular incompetence)
  - Secondary varicose veins (DVT history, venous obstruction)
  - Telangiectasias (spider veins, <1mm, cosmetic)
  - Reticular veins (1-3mm blue-green veins, intermediate)
  - Chronic venous insufficiency (more advanced with skin changes)
  - Superficial thrombophlebitis (acute, painful, palpable cord)
  - Klippel-Trenaunay syndrome (congenital vascular malformation)
