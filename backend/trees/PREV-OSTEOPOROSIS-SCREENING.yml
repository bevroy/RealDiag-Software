tree_id: PREV-OSTEOPOROSIS-SCREENING
name: Osteoporosis Screening Encounter
family: preventive
specialty: Primary Care, Endocrinology, Rheumatology
chief_complaint: Bone density screening, osteoporosis screening
description: |
  Screening for osteoporosis to identify patients at risk for fracture.
  DEXA scan measures bone mineral density and guides treatment decisions.
icd10: Z13.820
snomed: "306213009"
presentations:
  - Routine osteoporosis screening
  - Post-menopausal woman
  - Risk factors for osteoporosis
urgency: Low
workup:
  screening_recommendations_uspstf:
    - All women age ≥65
    - Postmenopausal women <65 with increased fracture risk
    - Men - consider screening if risk factors present
  risk_factors:
    - Age >50
    - Low body weight (<127 lbs)
    - Prior fragility fracture
    - Family history of hip fracture
    - Current smoking
    - Excessive alcohol use (>3 drinks/day)
    - Glucocorticoid use ≥3 months
    - Rheumatoid arthritis
    - Secondary causes (hyperthyroidism, hyperparathyroidism, malabsorption)
  dexa_scan:
    - Dual-energy X-ray absorptiometry of hip and spine
    - T-score interpretation:
      * Normal: T-score ≥-1.0
      * Osteopenia: T-score -1.0 to -2.5
      * Osteoporosis: T-score ≤-2.5
      * Severe osteoporosis: T-score ≤-2.5 with fracture
  frax_score:
    - 10-year probability of hip fracture and major osteoporotic fracture
    - Incorporates clinical risk factors with or without BMD
treatment:
  all_patients:
    - Calcium 1200mg daily (dietary plus supplement)
    - Vitamin D 800-1000 IU daily
    - Weight-bearing exercise
    - Fall prevention
    - Smoking cessation
    - Limit alcohol
  osteopenia:
    - Calcium and vitamin D
    - Consider pharmacotherapy if high FRAX score (≥3% hip fracture or ≥20% major osteoporotic fracture)
  osteoporosis:
    - Calcium and vitamin D
    - Pharmacotherapy:
      * First-line: Bisphosphonates (alendronate 70mg weekly, risedronate, ibandronate, zoledronic acid)
      * Second-line: Denosumab (Prolia) 60mg SC every 6 months
      * Anabolic: Teriparatide (PTH analog) or romosozumab for severe osteoporosis
  monitoring:
    - Repeat DEXA every 2 years on treatment
    - Can space out to 5 years if stable
clinical_pearls:
  - DEXA scan is gold standard for diagnosis
  - T-score compares to young healthy adult (used for postmenopausal women and men ≥50)
  - Z-score compares to age-matched controls (used for premenopausal women and men <50)
  - Bisphosphonates reduce fracture risk by 50%
  - Must take bisphosphonates on empty stomach, upright for 30 minutes
  - Vertebral fracture most common osteoporotic fracture
differentials:
  - Normal bone density
  - Osteopenia (low bone mass)
  - Osteoporosis
  - Secondary osteoporosis (from medications or medical conditions)
trace:
  - 68-year-old woman presents for osteoporosis screening. First DEXA scan shows T-score -2.8 at hip, -3.1 at spine. Diagnose osteoporosis. Counsel on calcium 1200mg and vitamin D 1000 IU daily. Start alendronate 70mg weekly. Fall prevention counseling. Repeat DEXA in 2 years shows improvement. Continue bisphosphonate.
citations:
  - USPSTF Osteoporosis Screening Recommendations
  - American College of Physicians Osteoporosis Guidelines
