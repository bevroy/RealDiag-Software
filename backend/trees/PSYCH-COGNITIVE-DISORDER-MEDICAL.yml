referrals:
  - Neurology for neurological causes (stroke, seizures, dementia evaluation)
  - Endocrinology for endocrine disorders (thyroid, pituitary)
  - Infectious disease for infectious etiologies (HIV, neurosyphilis)
  - Rheumatology for autoimmune causes (lupus, vasculitis)
  - Neurosurgery for structural lesions requiring intervention
  - Neuropsychology for formal cognitive testing
