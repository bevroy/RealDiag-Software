tree_id: PSYCH-COGNITIVE-DISORDER-MEDICAL
name: Cognitive Disorder Due to Medical Condition
family: psychiatry
specialty: Psychiatry/Neurology
icd10: F06.8
snomed: 19367006
urgency: []
homeopathy: []
presentations:
  - Cognitive impairment (memory, attention, executive function, language) secondary to medical condition
  - Evidence from history, exam, or labs that cognitive disturbance is direct consequence of medical condition
  - Temporal relationship between medical condition and cognitive symptoms
  - Not better explained by delirium, dementia, or primary psychiatric disorder
  - May be reversible if underlying condition treated
  - Common medical causes: neurological (stroke, TBI, tumor, MS), metabolic (thyroid, B12, hepatic encephalopathy), infectious (HIV, neurosyphilis), autoimmune (lupus cerebritis)
workup:
  - Comprehensive medical history
  - Onset and timeline of cognitive symptoms
  - Known medical conditions (especially neurological, endocrine, infectious, autoimmune)
  - Medication review (anticholinergics, benzodiazepines, opioids, anticonvulsants)
  - Substance use history (alcohol, drugs)
  - Cognitive assessment
  - Montreal Cognitive Assessment (MoCA) or Mini-Mental State Exam (MMSE)
  - Assess domains: memory, attention, executive function, language, visuospatial
  - Compare to baseline if available
  - Neurological examination
  - Focal neurological deficits (suggest structural lesion)
  - Movement disorders
  - Cranial nerves
  - Reflexes, coordination, gait
  - Laboratory evaluation (comprehensive medical workup)
  - Complete blood count (anemia, infection)
  - Comprehensive metabolic panel (electrolytes, glucose, renal, hepatic function)
  - Thyroid function (TSH, free T4) - hypothyroidism common reversible cause
  - Vitamin B12, folate
  - Vitamin D
  - Rapid plasma reagin (RPR) for syphilis
  - HIV testing
  - Consider: heavy metals, ceruloplasmin (Wilson's), ammonia, arterial blood gas
  - Brain imaging (essential to rule out structural causes)
  - MRI brain preferred (better detail)
  - CT head if MRI contraindicated or emergency
  - Look for: stroke, tumor, hydrocephalus, atrophy, white matter disease
  - Additional testing based on clinical suspicion
  - EEG if seizure disorder suspected
  - Lumbar puncture if infection, autoimmune, or paraneoplastic syndrome suspected
  - Autoimmune panel (ANA, anti-NMDA receptor antibodies)
  - Paraneoplastic antibodies if concern for malignancy
treatment:
  - Treat underlying medical condition (PRIMARY goal)
  - Examples based on etiology
  - Hypothyroidism: levothyroxine replacement
  - Vitamin B12 deficiency: B12 supplementation (1000 mcg daily)
  - Neurosyphilis: IV penicillin
  - Normal pressure hydrocephalus: ventriculoperitoneal shunt
  - Brain tumor: neurosurgical referral
  - Autoimmune encephalitis: immunotherapy (steroids, IVIG, plasmapheresis)
  - Medication optimization
  - Discontinue or reduce anticholinergic medications
  - Simplify medication regimen
  - Avoid benzodiazepines and sedating medications
  - Cognitive rehabilitation
  - Occupational therapy
  - Speech therapy for language deficits
  - Cognitive exercises and compensatory strategies
  - Environmental modifications and safety
  - Structured routine
  - Memory aids (calendars, lists, reminders)
  - Home safety assessment
  - Assess need for supervision or caregiving support
  - Symptomatic treatment if needed
  - Cholinesterase inhibitors (donepezil) if dementia-like syndrome develops
  - Antidepressants if comorbid depression
  - Treat behavioral symptoms as needed
  - Monitor and follow-up
  - Reassess cognitive function after treating underlying condition
  - Some conditions reversible with treatment, others progressive
clinical_pearls:
  - "Always assume cognitive impairment is due to medical cause until proven otherwise - potentially reversible"
  - "Most common reversible causes: thyroid disorders, vitamin B12 deficiency, normal pressure hydrocephalus, medication effects"
  - "Brain MRI essential - identifies structural causes in 15-30% of cases"
  - "Temporal relationship between medical condition and cognitive symptoms is key diagnostic feature"
  - "HIV-associated neurocognitive disorder affects 15-50% of HIV patients despite antiretroviral therapy"
  - "Autoimmune encephalitis increasingly recognized - consider in rapidly progressive cognitive decline with psychiatric symptoms"
  - "Cognitive impairment from hypothyroidism usually reversible with thyroid replacement"
  - "Anticholinergic burden from medications major contributor to cognitive impairment in elderly"
referrals:
  - Neurology for neurological causes (stroke, seizures, dementia evaluation)
  - Endocrinology for endocrine disorders (thyroid, pituitary)
  - Infectious disease for infectious etiologies (HIV, neurosyphilis)
  - Rheumatology for autoimmune causes (lupus, vasculitis)
  - Neurosurgery for structural lesions requiring intervention
  - Neuropsychology for formal cognitive testing
differentials:
  - Cognitive disorder due to medical condition (temporal relationship to medical illness, potentially reversible)
  - Alzheimer disease and other dementias (chronic, progressive, no clear medical cause)
  - Delirium (acute, fluctuating, impaired attention)
  - Major depressive disorder (pseudodementia - cognitive symptoms improve with depression treatment)
  - Substance-induced cognitive disorder (alcohol, benzodiazepines, chronic drug use)
  - Mild cognitive impairment (less severe, may not significantly impair function)
  - Vascular dementia (stepwise decline, cardiovascular risk factors, focal neurological signs)
  - Normal aging (mild forgetfulness, no functional impairment)
