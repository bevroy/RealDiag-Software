trace:
  - Patient presents with RUQ pain, fever, positive Murphy's sign
  - Order RUQ ultrasound showing gallstones, wall thickening, pericholecystic fluid
  - Start IV antibiotics and fluid resuscitation
  - NPO and pain control
  - Consult surgery for laparoscopic cholecystectomy within 72 hours
  - If high-risk surgical candidate, consider percutaneous cholecystostomy
