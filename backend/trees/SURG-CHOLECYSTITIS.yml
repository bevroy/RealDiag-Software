presentations:
- Right upper quadrant pain, often worse after fatty meals
- 'Murphy''s sign: Inspiratory arrest with RUQ palpation (90% specific)'
- Positive sonographic Murphy's sign on ultrasound
- Fever (often low-grade), chills
- Nausea and vomiting
- 'Ultrasound findings: Gallstones, gallbladder wall thickening >4mm, pericholecystic
  fluid'
- Pain radiating to right shoulder or scapula (referred pain)
- 95% due to gallstone obstruction of cystic duct
- Leukocytosis (elevated WBC count)
- May have mild jaundice if Mirizzi syndrome (stone compresses CBD)
- 'Complications: Gangrenous cholecystitis, perforation, emphysematous cholecystitis
  (diabetics)'
- 'Risk factors: 4 F''s - Female, Forty, Fertile, Fat (obesity)'
