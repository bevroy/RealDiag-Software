tree_id: PSYCH-ADJUSTMENT-DISORDER
name: Adjustment Disorder
family: psychiatry
specialty: Psychiatry
icd10: F43.20
snomed: 71670004
urgency: []
homeopathy: []
presentations:
  - Emotional or behavioral symptoms within 3 months of identifiable stressor
  - Marked distress out of proportion to severity/intensity of stressor
  - Significant impairment in social, occupational, or other important functioning
  - Identifiable psychosocial stressor (job loss, divorce, illness, relocation, relationship problems)
  - Symptoms do not meet criteria for another mental disorder
  - Not normal bereavement response
  - Symptoms resolve within 6 months after stressor or its consequences end
  - May present with depressed mood, anxiety, or mixed features
  - Common stressors: relationship breakup, job stress, medical diagnosis, financial problems
workup:
  - Clinical diagnosis based on DSM-5-TR criteria
  - Comprehensive psychiatric evaluation
  - Identify specific stressor(s) and timing
  - Assess symptom severity and functional impairment
  - Duration: onset within 3 months of stressor
  - Symptoms should not persist beyond 6 months after stressor ends
  - Mental status examination
  - Assess mood, affect, thought content
  - Screen for suicidal ideation
  - Rule out other psychiatric disorders
  - Major depression (more severe, may not have identifiable stressor)
  - PTSD (requires traumatic stressor with specific symptom clusters)
  - Acute stress disorder (severe trauma, specific timeframe)
  - Anxiety disorders
  - Assess functional impairment
  - Work/school performance
  - Social relationships
  - Activities of daily living
  - Rating scales
  - GAD-7 (anxiety symptoms)
  - PHQ-9 (depressive symptoms)
  - Sheehan Disability Scale (functional impairment)
treatment:
  - Psychotherapy (first-line treatment)
  - Supportive psychotherapy - help process stressor
  - Cognitive Behavioral Therapy (CBT) - modify maladaptive thoughts/behaviors
  - Problem-solving therapy - develop coping strategies
  - Brief therapy (6-12 sessions) typically sufficient
  - Pharmacotherapy (generally not first-line, short-term use only)
  - Consider if symptoms severe or not responding to therapy
  - SSRIs for predominant anxiety or depression
  - Sertraline 25-100 mg daily
  - Escitalopram 5-10 mg daily
  - Benzodiazepines SHORT-TERM ONLY (2-4 weeks max) for severe anxiety
  - Lorazepam 0.5-1 mg BID-TID PRN
  - Avoid long-term use due to dependence risk
  - Supportive interventions
  - Validate emotional response
  - Provide psychoeducation about normal stress reactions
  - Identify and mobilize support systems (family, friends, community)
  - Encourage healthy coping strategies
  - Lifestyle modifications
  - Regular exercise
  - Sleep hygiene
  - Stress reduction techniques (mindfulness, relaxation)
  - Avoid alcohol and substance use as coping mechanisms
  - Follow-up
  - Monitor symptom progression
  - If symptoms persist beyond 6 months after stressor resolves, reassess diagnosis
  - May evolve into major depression or anxiety disorder
clinical_pearls:
  - "Adjustment disorders affect 5-20% of outpatient mental health population - one of most common diagnoses"
  - "Symptoms must develop within 3 months of stressor and resolve within 6 months after stressor ends"
  - "If symptoms persist beyond 6 months, consider different diagnosis (major depression, persistent depressive disorder)"
  - "Subtypes: with depressed mood, with anxiety, with mixed anxiety and depressed mood, with disturbance of conduct, with mixed disturbance of emotions and conduct"
  - "Risk factors: multiple life stressors, limited social support, history of mental illness"
  - "Suicide risk can be elevated - always assess, especially in adolescents"
  - "Psychotherapy alone often sufficient - avoid premature or unnecessary medication"
  - "Good prognosis with appropriate treatment - 70-80% fully recover"
referrals:
  - Mental health counseling for psychotherapy (CBT, supportive therapy)
  - Psychiatry if symptoms severe, not responding to therapy, or concern for other disorder
  - Crisis intervention if suicidal ideation or severe distress
  - Social work for resource identification and support services
differentials:
  - Adjustment disorder (identifiable stressor, symptoms within 3 months, resolves within 6 months)
  - Major depressive disorder (more severe, longer duration, may lack identifiable stressor)
  - Generalized anxiety disorder (chronic worry not tied to specific stressor, duration 6+ months)
  - Post-traumatic stress disorder (severe traumatic stressor with specific symptoms: intrusions, avoidance, hyperarousal)
  - Acute stress disorder (severe trauma, symptoms 3 days to 1 month)
  - Normal stress response (proportionate to stressor, minimal functional impairment)
  - Bereavement/grief (loss of loved one, culturally normal response)
  - Personality disorder exacerbation (chronic maladaptive patterns)
