tree_id: NEPHRO-AKI
name: Acute Kidney Injury
family: Nephrology
specialty: Nephrology
icd10:
- N17.9
- N17.0
- N17.1
snomed:
- '14669001'
urgency: urgent
description: Comprehensive evaluation and management of Acute Kidney Injury
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Decreased urine output
- Elevated creatinine
- Fluid overload
- Nausea and vomiting
- Confusion
- Uremic symptoms
workup:
- Basic metabolic panel (Cr, BUN, electrolytes) - serial monitoring
- Urinalysis with microscopy (casts, cells)
- Urine sodium, FeNa (fractional excretion of sodium)
- Renal ultrasound (assess size, hydronephrosis, obstruction)
- Consider renal biopsy if unclear etiology after workup
treatment:
- 'Guideline-based treatment options for Acute Kidney Injury include:'
- 'Identify and treat underlying cause: Fluids if prerenal, stop nephrotoxins (NSAIDs,
  aminoglycosides) (KDIGO 2024)'
- Monitor ins/outs, daily weights, strict fluid balance (KDIGO 2024)
- Adjust medication doses for GFR, avoid contrast if possible (KDIGO 2024)
- 'Indications for dialysis: Acidosis (pH <7.1), Electrolytes (K+ >6.5), Ingestion
  (toxins), Overload (pulmonary edema), Uremia (pericarditis, encephalopathy) (KDIGO
  2024)'
- 'Supportive: Nutrition, prevent complications (KDIGO 2024)'
clinical_pearls:
- 'KDIGO criteria: Cr increase ≥0.3 mg/dL in 48hr OR increase ≥1.5x baseline in 7
  days OR UOP <0.5 mL/kg/hr x 6hr'
- 'Classify etiology: Prerenal (70% - volume depletion), intrinsic (ATN, GN, AIN),
  postrenal (obstruction)'
- FeNa <1% = prerenal; >2% = ATN/intrinsic (not reliable if on diuretics - use FeUrea)
- Muddy brown casts = ATN; RBC casts = glomerulonephritis; WBC casts = pyelonephritis/AIN
- 'Mortality increases with stage: Stage 1 (10%), Stage 2 (25%), Stage 3 (50%)'
referrals:
- Nephrology consult for all AKI
- Dialysis if AEIOU criteria met
- ICU if severe (oliguric, hyperkalemia, acidosis)
differentials: []
trace:
