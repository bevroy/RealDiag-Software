tree_id: ENDO-HYPOGONADISM
name: Hypogonadism (Male)
family: endocrinology
specialty: Endocrinology
icd10: E29.1
snomed: 48723006
urgency: []
homeopathy: []
presentations:
  - Decreased libido (sexual desire)
  - Erectile dysfunction
  - Fatigue and decreased energy
  - Decreased muscle mass and strength
  - Increased body fat (central adiposity)
  - Mood changes (depression, irritability)
  - Hot flashes (less common than in women)
  - Gynecomastia (breast tissue development)
  - Decreased facial and body hair growth
  - Infertility (if fertility desired)
  - Osteoporosis or low bone density
  - Congenital hypogonadism: delayed puberty, undescended testes, micropenis
workup:
  - Testosterone measurement
  - Total testosterone (normal >300 ng/dL)
  - Measure in morning (8-10 AM) when levels peak
  - Repeat if low (<300 ng/dL) to confirm
  - Free testosterone or bioavailable testosterone if SHBG abnormal (obesity, aging)
  - Determine primary vs secondary hypogonadism
  - LH and FSH levels
  - High LH/FSH: primary hypogonadism (testicular failure)
  - Low/normal LH/FSH: secondary hypogonadism (pituitary/hypothalamic)
  - Prolactin level (hyperprolactinemia causes secondary hypogonadism)
  - If secondary hypogonadism: pituitary MRI to rule out adenoma
  - Assess fertility if relevant
  - Semen analysis
  - Rule out secondary causes
  - TSH (hypothyroidism)
  - Iron studies (hemochromatosis)
  - Genetic testing: karyotype (Klinefelter syndrome 47,XXY), Y-chromosome microdeletions
  - Assess complications
  - DEXA scan for bone density
  - Lipid panel, fasting glucose (metabolic effects)
  - Hematocrit/hemoglobin baseline (testosterone increases RBCs)
treatment:
  - Testosterone replacement therapy (TRT) - if confirmed hypogonadism with symptoms
  - Indications: testosterone <300 ng/dL on two occasions + symptoms
  - Formulations
  - Intramuscular injections: testosterone enanthate/cypionate 100-200 mg every 1-2 weeks
  - Transdermal gel: 50-100 mg daily (AndroGel, Testim, Fortesta)
  - Transdermal patch: 4-6 mg/day
  - Subcutaneous pellets: 150-450 mg every 3-6 months
  - Oral: testosterone undecanoate (less commonly used)
  - Contraindications to TRT
  - Prostate cancer or breast cancer
  - Hematocrit >54%
  - Severe untreated obstructive sleep apnea
  - Severe lower urinary tract symptoms (LUTS)
  - Fertility concerns (TRT suppresses spermatogenesis)
  - If fertility desired (secondary hypogonadism)
  - Human chorionic gonadotropin (hCG) injections + FSH or clomiphene citrate
  - Refer to reproductive endocrinology
  - Monitoring on TRT
  - Testosterone level at 3-6 months, then annually (goal mid-normal range)
  - Hematocrit every 3-6 months (stop if >54%)
  - PSA and DRE annually in men >40 (concern for prostate cancer)
  - Bone density at 1-2 years
  - Lipids, liver enzymes periodically
clinical_pearls:
  - "Hypogonadism defined as testosterone <300 ng/dL with symptoms - level alone insufficient for diagnosis"
  - "Morning testosterone essential - levels 30% higher in AM than PM"
  - "Primary hypogonadism: high LH/FSH (testicular problem); secondary: low LH/FSH (pituitary/hypothalamic)"
  - "Klinefelter syndrome (47,XXY) most common genetic cause - tall, small testes, gynecomastia"
  - "Obesity lowers testosterone via increased aromatization to estrogen - weight loss can normalize levels"
  - "TRT improves symptoms, bone density, muscle mass, but doesn't improve mortality or cardiovascular outcomes"
  - "TRT suppresses spermatogenesis - use hCG if fertility desired"
  - "Transdermal gel absorption variable - risk of transfer to women and children"
referrals:
  - Endocrinology for diagnosis confirmation and TRT initiation
  - Reproductive endocrinology if fertility desired
  - Urology for primary testicular disorders or concerns about prostate
differentials:
  - Primary hypogonadism (testicular failure) - Klinefelter syndrome, trauma, chemotherapy, radiation, mumps orchitis
  - Secondary hypogonadism (pituitary/hypothalamic) - pituitary adenoma, hyperprolactinemia, Kallmann syndrome, medications (opioids, steroids)
  - Age-related testosterone decline (gradual, 1-2% per year after age 30)
  - Obesity (increased aromatization to estrogen)
  - Chronic illness (diabetes, CKD, HIV, cirrhosis)
  - Medications (opioids, glucocorticoids, GnRH agonists)
trace:
  source: Endocrine Society Clinical Practice Guidelines on Testosterone Therapy 2018, AUA Guidelines
  version: '1.0'
  last_updated: '2025-12-26'
