tree_id: ENDO-CUSHINGS-SYNDROME
name: Cushing's Syndrome
family: Endocrinology
specialty: Endocrinology
chief_complaint: Weight gain, easy bruising, and facial rounding
description: |
  Chronic glucocorticoid excess from endogenous overproduction or exogenous administration. Endogenous causes include ACTH-dependent (pituitary adenoma 70% - Cushing's disease, ectopic ACTH 10%) and ACTH-independent (adrenal adenoma/carcinoma 20%).
  Exogenous glucocorticoids most common overall cause. Classic features - central obesity, moon facies, buffalo hump, purple striae, proximal myopathy, hypertension, hyperglycemia.
icd10: E24.9
snomed: 47270006
presentations:
  - Central obesity, buffalo hump
  - Moon facies, facial plethora
  - Purple striae (wide, >1cm)
  - Easy bruising
  - Proximal muscle weakness
  - Hypertension, hyperglycemia
  - Mood changes, depression
urgency: Low
referrals:
  emergency:
    - DKA
    - HHS
    - Thyroid storm
    - Myxedema coma
    - Adrenal crisis
  urgent:
    - New diabetes with poor control
    - Thyroid nodule >4cm
    - Severe hypercalcemia
    - Pituitary mass
  routine:
    - Diabetes management
    - Thyroid nodule surveillance
    - Osteoporosis management
    - Lipid disorders

workup:
  - Clinical features - central obesity with extremity wasting, moon facies (round plethoric face), dorsocervical fat pad (buffalo hump), supraclavicular fat pads
  - Skin changes - wide purple striae (greater than 1 cm), thin skin, easy bruising, acne, hirsutism, hyperpigmentation (if ACTH elevated)
  - Proximal muscle weakness (difficulty rising from chair, climbing stairs)
  - Hypertension, hyperglycemia/diabetes, osteoporosis, psychiatric symptoms (depression, psychosis)
  - Rule out pseudo-Cushing's (obesity, alcoholism, depression) - can have mild biochemical hypercortisolism without true Cushing's
  - Screening tests (need at least two abnormal tests to confirm hypercortisolism)
  - 24-hour urine free cortisol (UFC) - at least 4 times upper limit of normal highly specific, 2-4x ULN borderline
  - Late-night salivary cortisol - collected at 11 PM-midnight (two samples), elevated (greater than 3.6 ng/mL) suggests Cushing's
  - 1 mg overnight dexamethasone suppression test - give 1mg dex at 11 PM, check 8 AM cortisol
  - Normal cortisol less than 1.8 mcg/dL rules out Cushing's, cortisol greater than 5 mcg/dL suggests Cushing's
  - Low-dose dexamethasone suppression test (LDDST) - 0.5mg q6h x 8 doses, 8 AM cortisol greater than 1.8 mcg/dL abnormal
  - Determine etiology once hypercortisolism confirmed
  - 8 AM ACTH level - ACTH-dependent (ACTH greater than 10 pg/mL) vs ACTH-independent (ACTH less than 5 pg/mL, suppressed)
  - ACTH-independent - adrenal imaging (CT or MRI) to identify adenoma, carcinoma, or bilateral hyperplasia
  - ACTH-dependent - distinguish pituitary (Cushing's disease) from ectopic ACTH
  - High-dose dexamethasone suppression test (HDDST) - 8mg overnight, pituitary suppresses (cortisol decreases greater than 50%), ectopic does not
  - CRH stimulation test - pituitary responds (cortisol increases greater than 20%), ectopic usually does not
  - Inferior petrosal sinus sampling (IPSS) gold standard - catheterize veins draining pituitary, measure ACTH before and after CRH
  - Central-to-peripheral ACTH ratio greater than 2 (baseline) or greater than 3 (post-CRH) confirms pituitary source
  - Pituitary MRI if ACTH-dependent and IPSS confirms pituitary - adenoma visible in 50% (often microadenoma less than 5 mm)
  - CT chest/abdomen/pelvis if ectopic ACTH suspected - look for small cell lung cancer, bronchial carcinoid, pancreatic neuroendocrine tumor
treatment:
  - Exogenous glucocorticoid - taper and discontinue if possible, may require slow taper over months to allow adrenal recovery
  - Cushing's disease (pituitary adenoma) - transsphenoidal surgery first-line (70-90% cure rate for microadenoma)
  - Repeat testing 6 weeks post-op - goal morning cortisol less than 5 mcg/dL (indicates remission but requires glucocorticoid replacement until HPA axis recovers)
  - If persistent or recurrent disease - repeat surgery, pituitary radiation, bilateral adrenalectomy, or medical therapy
  - Adrenal adenoma/carcinoma - unilateral adrenalectomy (adenoma, 95% cure) or radical adrenalectomy plus mitotane (carcinoma)
  - Ectopic ACTH syndrome - resect tumor if localized (carcinoid), treat underlying malignancy if metastatic
  - Medical therapy for hypercortisolism (bridge to surgery, adjunct if surgery fails)
  - Steroidogenesis inhibitors - ketoconazole 200-400mg TID, metyrapone 250-1000mg TID, mitotane (adrenolytic)
  - Pituitary-directed - pasireotide (somatostatin analog) 0.6-0.9mg SC BID, cabergoline (dopamine agonist)
  - Glucocorticoid receptor blocker - mifepristone 300-1200mg daily (cannot monitor cortisol levels, monitor clinical symptoms)
  - Nelson syndrome after bilateral adrenalectomy - ACTH-secreting pituitary tumor enlarges (loss of cortisol negative feedback), causes hyperpigmentation, mass effect
  - Treat complications - control hypertension, diabetes, osteoporosis (bisphosphonates), psychiatric symptoms
  - Glucocorticoid replacement needed after bilateral adrenalectomy or successful pituitary surgery until HPA axis recovery
clinical_pearls:
  - Exogenous steroids most common cause - always ask about prednisone, inhaled/topical steroids, injections
  - Cyclic Cushing's - intermittent hypercortisolism, may need multiple 24-hour UFC collections
  - Striae in Cushing's are wide (greater than 1 cm) and purple/red, not pink
  - Small cell lung cancer classic ectopic ACTH source - rapid onset, severe hypokalemia, metabolic alkalosis
  - Children with Cushing's have growth arrest (pathognomonic - normal children growing obese do not stop growing)
  - Post-surgical remission requires glucocorticoid replacement (hydrocortisone 15-20mg divided BID-TID) until adrenal function recovers (6-18 months)
differentials:
  - Obesity (pseudo-Cushing's)
  - Metabolic syndrome
  - Polycystic ovary syndrome
  - Depression (pseudo-Cushing's)
  - Alcoholism (pseudo-Cushing's)
trace:
  - 42-year-old woman with progressive weight gain (50 lbs x 2 years), easy bruising, facial rounding, fatigue → Exam shows moon facies, central obesity (BMI 34), buffalo hump, wide purple striae on abdomen, proximal muscle weakness → BP 165/98, glucose 186 mg/dL → Screening tests - 24h UFC 380 mcg (normal less than 50), late-night salivary cortisol 12.8 ng/mL (elevated), 1mg dex suppression test cortisol 18.2 mcg/dL (failed to suppress) → Confirm hypercortisolism → 8 AM ACTH 68 pg/mL (ACTH-dependent) → High-dose dex suppression - cortisol suppresses 60% (suggests pituitary) → Pituitary MRI shows 4 mm hypoenhancing lesion left side → IPSS performed - central:peripheral ACTH ratio 4.2 (confirms pituitary source) → Diagnose Cushing's disease → Transsphenoidal surgery removes microadenoma → Post-op day 3 cortisol 2.1 mcg/dL (remission) → Start hydrocortisone replacement 20mg AM, 10mg PM → Blood pressure normalizes, glucose improves → 6-month follow-up shows 15 lb weight loss, striae fading, energy improved → Continues hydrocortisone replacement pending HPA axis recovery testing
