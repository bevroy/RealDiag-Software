tree_id: ENDO-CUSHINGS-SYNDROME
name: Cushing's Syndrome
family: Endocrinology
specialty: Endocrinology
chief_complaint: Weight gain, facial rounding, purple striae, easy bruising
description: Clinical syndrome resulting from chronic exposure to excess cortisol, either endogenous (pituitary adenoma, adrenal tumor, ectopic ACTH) or exogenous (iatrogenic glucocorticoid use)
icd10: E24.9
urgency: medium
workup:
  - Pathophysiology - Chronic hypercortisolism from various etiologies
  - Normal cortisol - Circadian rhythm (peak 6-8 AM, nadir midnight), stress response, metabolic regulation
  - Cushing syndrome - Chronic excess cortisol exposure causes multi-system effects
  - Etiologies - ACTH-dependent vs ACTH-independent
  - ACTH-dependent (80%) - Elevated ACTH drives cortisol production
  - Cushing disease (70% of all cases) - Pituitary corticotroph adenoma secreting ACTH, usually microadenoma <10 mm
  - Ectopic ACTH syndrome (10%) - Non-pituitary tumor secreting ACTH (small cell lung cancer most common, also bronchial carcinoid, pancreatic neuroendocrine, medullary thyroid cancer, pheochromocytoma)
  - ACTH-independent (20%) - Autonomous cortisol production, ACTH suppressed
  - Adrenal adenoma (10%) - Benign cortisol-secreting adrenal tumor
  - Adrenal carcinoma (5%) - Malignant, often large >6 cm, rapid onset, very high cortisol, androgens/estrogens also elevated
  - Primary pigmented nodular adrenal disease (PPNAD) - Rare, Carney complex (cardiac myxoma, skin pigmentation, endocrine tumors)
  - Bilateral macronodular adrenal hyperplasia (BMAH) - Rare, aberrant receptor expression (GIP, vasopressin, beta-adrenergic)
  - Iatrogenic (pseudo-Cushing) - Exogenous glucocorticoid use (prednisone, dexamethasone, inhaled/topical steroids if high dose)
  - Epidemiology
  - Prevalence 1 in 26,000 (rare)
  - Female predominance 3:1 (except ectopic ACTH, male predominant)
  - Peak age 25-40 years (Cushing disease), 40-60 (ectopic ACTH, adrenal tumors)
  - Clinical presentation - Gradual onset, multiple systems affected
  - General appearance
  - Central obesity - Trunk, abdomen, face (moon facies), dorsocervical fat pad (buffalo hump), supraclavicular fat pads
  - Thin extremities - Muscle wasting, proximal myopathy (difficulty rising from chair, climbing stairs)
  - Skin changes
  - Facial plethora - Ruddy complexion
  - Wide purple striae - Typically >1 cm, abdomen, thighs, axillae, breasts (catabolic effect on collagen)
  - Thin fragile skin - Easy bruising, poor wound healing
  - Acne, hirsutism - Androgen excess
  - Hyperpigmentation - If ACTH elevated (ectopic ACTH, Cushing disease), melanocyte stimulation
  - Metabolic
  - Hyperglycemia - New-onset diabetes or worsening glycemic control (cortisol is counter-regulatory hormone)
  - Hypertension - 80% (cortisol has mineralocorticoid activity, increases vascular reactivity)
  - Hypokalemia - Especially ectopic ACTH (very high cortisol overwhelms 11-beta-hydroxysteroid dehydrogenase, activates mineralocorticoid receptor)
  - Hyperlipidemia - Increased cholesterol, triglycerides
  - Musculoskeletal
  - Proximal myopathy - Weakness, muscle wasting
  - Osteoporosis - Increased fracture risk (vertebral compression fractures common)
  - Avascular necrosis - Hip, shoulder
  - Neuropsychiatric
  - Depression, anxiety, irritability, emotional lability
  - Cognitive impairment, insomnia
  - Psychosis (rare, severe cases)
  - Reproductive
  - Menstrual irregularities - Oligomenorrhea, amenorrhea (women)
  - Erectile dysfunction, decreased libido (men)
  - Infertility
  - Other
  - Immunosuppression - Increased infection risk
  - Kidney stones - Hypercalciuria
  - Venous thromboembolism - Hypercoagulable state
  - Rapid-onset features suggest malignancy - Ectopic ACTH or adrenal carcinoma (weight loss, severe hypokalemia, virilization)
  - Diagnostic approach - Three-step process (1. Confirm hypercortisolism, 2. Determine ACTH-dependent vs independent, 3. Localize source)
  - Step 1 - Confirm hypercortisolism (screening tests, need 2 abnormal tests)
  - 24-hour urine free cortisol (UFC) - Elevated (>3x upper limit normal highly specific)
  - Collect 24-hour urine, measure cortisol excretion
  - False positives - High fluid intake, pregnancy, depression, alcoholism
  - Late-night salivary cortisol - Loss of circadian rhythm (normally nadir at midnight)
  - Collect saliva 11 PM-midnight on 2 separate nights
  - Elevated >2x upper limit normal suggests Cushing
  - Convenient, outpatient, accurate
  - Low-dose dexamethasone suppression test (LDDST)
  - Overnight 1 mg test - Give dexamethasone 1 mg at 11 PM, measure cortisol 8 AM next morning
  - Normal - Cortisol <1.8 mcg/dL (suppression)
  - Cushing - Cortisol remains elevated >1.8 mcg/dL (failure to suppress)
  - OR 48-hour 2 mg test - Dexamethasone 0.5 mg q6h x 8 doses, measure cortisol after last dose
  - False positives - Medications increasing dex metabolism (phenytoin, rifampin, estrogen), depression, alcoholism, obesity, PCOS
  - Step 2 - Measure ACTH to differentiate ACTH-dependent vs independent
  - ACTH level (9 AM plasma)
  - ACTH >20 pg/mL - ACTH-dependent (pituitary or ectopic source)
  - ACTH <5 pg/mL - ACTH-independent (adrenal source, suppressed pituitary)
  - Step 3A - If ACTH-dependent, distinguish pituitary (Cushing disease) vs ectopic ACTH
  - High-dose dexamethasone suppression test (HDDST) - Less commonly used now (inferior to CRH, IPSS)
  - Give dexamethasone 8 mg at 11 PM (or 2 mg q6h x 8 doses), measure cortisol 8 AM
  - Cushing disease - Cortisol suppresses >50% (pituitary retains some negative feedback)
  - Ectopic ACTH - No suppression (tumor autonomous)
  - Accuracy only 70-80%, many false results
  - CRH stimulation test - Distinguish pituitary vs ectopic
  - Give CRH (corticorelin) 1 mcg/kg IV, measure ACTH and cortisol at 0, 15, 30, 45 minutes
  - Cushing disease - ACTH and cortisol rise (pituitary adenoma responds to CRH)
  - Ectopic ACTH - No response (tumor does not respond to CRH)
  - Inferior petrosal sinus sampling (IPSS) - GOLD STANDARD to distinguish pituitary vs ectopic
  - Indications - ACTH-dependent hypercortisolism with inconclusive imaging or discordant results
  - Technique - Catheterize both inferior petrosal sinuses (drain pituitary), measure ACTH in IPS and peripheral blood, give CRH
  - Central:peripheral ACTH ratio >2 (baseline) or >3 (post-CRH) indicates pituitary source (Cushing disease)
  - Ratio <2 suggests ectopic source
  - 95% sensitivity, 95% specificity
  - Step 3B - Imaging to localize tumor
  - MRI pituitary with gadolinium - If ACTH-dependent
  - Identify pituitary adenoma (60-70% visualized, microadenomas <10 mm)
  - 10% normal MRI in Cushing disease (microadenoma too small), IPSS then needed
  - Incidental pituitary adenomas common (10% population), do not assume causative
  - CT chest/abdomen/pelvis with contrast - If ectopic ACTH suspected
  - Identify ectopic ACTH source (lung, pancreas, thymus, adrenal pheochromocytoma)
  - Octreotide scan (somatostatin receptor scintigraphy) if CT negative
  - CT adrenal without contrast - If ACTH-independent
  - Adrenal adenoma - Well-circumscribed, <4-6 cm, low attenuation (<10 HU, lipid-rich)
  - Adrenal carcinoma - Large >6 cm, irregular, heterogeneous, high attenuation, invasion, metastases
treatment:
  - Definitive treatment - Surgical removal of tumor (curative if successful)
  - Cushing disease (pituitary adenoma) - Transsphenoidal surgery (TSS)
  - First-line treatment, 70-90% remission if microadenoma, 50-60% if macroadenoma
  - Experienced neurosurgeon critical (higher success rates)
  - Complications - Hypopituitarism (20-30%, need hormone replacement), diabetes insipidus (transient or permanent), CSF leak, meningitis, recurrence 10-20%
  - Post-op - Immediate hypocortisolism indicates cure (adrenal suppression from chronic high cortisol), need glucocorticoid replacement temporarily until HPA axis recovers (6-18 months)
  - If persistent hypercortisolism or recurrence - Repeat TSS, pituitary radiation, bilateral adrenalectomy
  - Ectopic ACTH - Surgical resection of ACTH-secreting tumor if localized and resectable
  - Often advanced malignancy (small cell lung cancer), may not be resectable
  - Medical therapy to control hypercortisolism if surgery not option
  - Adrenal adenoma - Laparoscopic adrenalectomy (unilateral)
  - Curative, low morbidity
  - Post-op glucocorticoid replacement needed (contralateral adrenal suppressed), taper over 6-12 months
  - Adrenal carcinoma - Open adrenalectomy (en bloc resection)
  - Often advanced at diagnosis (metastases), poor prognosis
  - Adjuvant mitotane (adrenolytic agent)
  - Medical therapy - Control hypercortisolism if surgery delayed, not candidate, or residual disease
  - Steroidogenesis inhibitors
  - Ketoconazole 200-400 mg BID-TID (inhibits 11-beta-hydroxylase, 17-20-lyase) - First-line medical therapy
  - Hepatotoxicity, monitor LFTs
  - Metyrapone 250-1000 mg TID-QID (inhibits 11-beta-hydroxylase) - Rapid onset, useful pre-op
  - Risk adrenal insufficiency, hypertension (androgen accumulation)
  - Mitotane 0.5-3 g daily (adrenolytic, cytotoxic to adrenal cortex) - For adrenal carcinoma
  - Slow onset (weeks-months), monitor levels, glucocorticoid/mineralocorticoid replacement needed
  - Etomidate IV infusion - Critically ill patients (severe hypercortisolism, ectopic ACTH), rapidly lowers cortisol
  - Pituitary-directed agents (Cushing disease)
  - Pasireotide (somatostatin analog) - Pituitary adenoma if surgery failed/not candidate, 15-25% remission
  - Cabergoline (dopamine agonist) - Modest efficacy, 25-40% response
  - Adrenalectomy - Bilateral laparoscopic adrenalectomy
  - Definitive treatment for hypercortisolism (any etiology) if other treatments fail
  - Requires lifelong glucocorticoid and mineralocorticoid replacement
  - Nelson syndrome risk 10-30% if Cushing disease (pituitary adenoma grows unchecked without cortisol negative feedback, hyperpigmentation from high ACTH)
  - Radiation therapy
  - Pituitary radiation (stereotactic or conventional) - If surgery failed, recurrence, or not surgical candidate
  - Slow response (months to years), 50-60% remission
  - Risk hypopituitarism (50-80%)
  - Supportive care
  - Control hypertension, diabetes, treat osteoporosis (bisphosphonates, vitamin D/calcium)
  - Monitor for complications (infections, VTE prophylaxis if immobile)
  - Psychiatric support
clinical_pearls:
  - Cushing disease (pituitary) accounts for 70% cases, ectopic ACTH 10%, adrenal tumors 20%
  - Wide purple striae >1 cm and proximal myopathy are highly specific features
  - Need 2 abnormal screening tests to confirm hypercortisolism (UFC, late-night salivary cortisol, or LDDST)
  - IPSS is gold standard to distinguish pituitary vs ectopic ACTH (95% accurate)
  - Transsphenoidal surgery is first-line for Cushing disease (70-90% remission if microadenoma)
  - Post-surgical hypocortisolism indicates cure, need temporary glucocorticoid replacement
differentials:
  - ENDO-METABOLIC-SYNDROME
  - ENDO-POLYCYSTIC-OVARY-SYNDROME
  - ENDO-OBESITY
  - PSYCH-DEPRESSION
  - GEN-MED-ALCOHOLISM
trace:
  - Central obesity, moon facies, buffalo hump, purple striae >1 cm
  - Proximal myopathy, easy bruising, hypertension, hyperglycemia
  - Screen with 24-hr UFC, late-night salivary cortisol, or LDDST (need 2 abnormal)
  - Measure ACTH to determine etiology, then imaging and IPSS if needed
  - Transsphenoidal surgery for pituitary adenoma
