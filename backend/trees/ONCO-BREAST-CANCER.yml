  icpc2: []
sources:
  - text: American Cancer Society Breast Cancer Guidelines
    origin: citations
  - text: NCCN Breast Cancer Guidelines
    origin: citations
  - text: UpToDate - Oncology
    origin: citations
presentations:
  - Palpable breast lump or mass
  - Breast pain or tenderness
  - Nipple discharge (especially bloody)
  - Nipple retraction or inversion
  - Skin changes (dimpling, peau d'orange)
  - Breast asymmetry or change in shape
  - Axillary lymphadenopathy
  - Abnormal screening mammogram
  - Thickening of breast tissue
differentials:
  - Fibroadenoma
  - Breast cyst
  - Fibrocystic changes
  - Mastitis or abscess
  - Fat necrosis
  - Phyllodes tumor
workup:
  - Clinical breast exam
  - Imaging - diagnostic mammogram, ultrasound, MRI if indicated
  - Tissue diagnosis - core needle biopsy (gold standard)
  - Staging workup if cancer confirmed - chest imaging, liver function tests, consider bone scan or PET scan
  - Receptor status - ER, PR, HER2
  - Genetic testing if family history or young age
treatment:
  - Surgical options - lumpectomy with radiation vs mastectomy
  - Sentinel lymph node biopsy
  - Adjuvant chemotherapy based on stage and receptor status
  - Hormonal therapy if ER/PR positive
  - HER2-targeted therapy if HER2 positive
  - Radiation therapy
  - Multidisciplinary care
clinical_pearls:
  - Most common cancer in women
  - Screening mammography recommended starting age 40-50
  - BRCA mutations significantly increase risk
  - Triple negative breast cancer has poorest prognosis
  - Core needle biopsy preferred over fine needle aspiration
