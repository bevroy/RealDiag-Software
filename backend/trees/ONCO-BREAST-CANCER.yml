trace:
  - 55-year-old woman presents with self-detected left breast lump. Clinical exam reveals 2cm firm irregular mass in upper outer quadrant. Diagnostic mammogram shows suspicious spiculated mass. Ultrasound-guided core needle biopsy confirms invasive ductal carcinoma, ER positive, PR positive, HER2 negative. Staging workup negative for metastases. Referred to breast surgeon and oncologist. Undergoes lumpectomy with sentinel lymph node biopsy. Final pathology stage IIA. Receives adjuvant chemotherapy followed by hormonal therapy and radiation.
