tree_id: ONCO-BREAST-CANCER
name: Breast Cancer
version: '1.0'
status: draft
family: oncology
specialty: Oncology
secondary_specialties:
  - Surgery
  - Primary Care
urgency: urgent
urgency_explanation: ''
chief_complaint: Breast lump, breast mass, abnormal mammogram
description: |
  Breast cancer is the most common cancer in women. Early detection through screening mammography and clinical breast exams
  significantly improves outcomes. Risk factors include age, family history, BRCA mutations, early menarche, late menopause.
