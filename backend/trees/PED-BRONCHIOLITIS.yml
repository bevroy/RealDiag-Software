tree_id: PED-BRONCHIOLITIS
name: Bronchiolitis
family: Pediatrics
specialty: Pediatrics
icd10:
- J21.0
- J21.9
snomed:
- '4120002'
urgency: medium
description: Comprehensive evaluation and management of Bronchiolitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Wheezing and crackles in infant <2 years (peak 2-6 months)
- Tachypnea (RR >60), respiratory distress
- Nasal flaring, intercostal/subcostal retractions, grunting
- Poor feeding, decreased oral intake, dehydration
- Low-grade fever, rhinorrhea (preceded by 2-3 days of URI symptoms)
- Hypoxia (SpO2 <90% in severe cases)
- RSV (respiratory syncytial virus) most common (70%), peak season November-March
workup: []
treatment:
- 'Guideline-based treatment options for Bronchiolitis include:'
- 'Supportive care: Nasal suctioning (before feeds), supplemental O2 if SpO2 <90%,
  maintain hydration (AAP 2023)'
- 'Mild (SpO2 >90%, feeding well): Outpatient with close follow-up, nasal saline +
  bulb suction (AAP 2023)'
- 'Moderate-severe: High-flow nasal cannula 2 L/kg/min, NG/IV fluids if poor PO intake
  (AAP 2023)'
- 'Avoid: Bronchodilators (albuterol trial only if uncertain diagnosis), steroids,
  antibiotics (unless secondary pneumonia) (AAP 2023)'
- 'Disposition: Admit if age <3 months, SpO2 <90%, apnea, dehydration, or unable to
  feed (AAP 2023)'
clinical_pearls:
- 'Clinical diagnosis: First wheezing episode in infant <2 years with URI prodrome'
- 'Supportive care ONLY: No bronchodilators (albuterol doesn''t help), no steroids,
  no antibiotics'
- Oxygen for SpO2 <90%, nasal suctioning (bulb or NP suction) to clear secretions
- 'High-flow nasal cannula (HFNC) for moderate-severe: 2 L/kg/min, up to 6-8 L/min'
- 'Admission criteria: Age <3 months, SpO2 <90%, poor feeding, dehydration, apnea'
- 'Natural history: Worsens days 3-5, improves by day 7-10, cough can last 3-4 weeks'
