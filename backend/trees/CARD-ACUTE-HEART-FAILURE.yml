  - UpToDate - Cardiovascular Medicine
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Dyspnea at rest or with minimal exertion (most common)
- Orthopnea (dyspnea when lying flat), PND (paroxysmal nocturnal dyspnea)
- Bilateral lower extremity edema, weight gain (>2-3 lbs in days)
- Rales/crackles on lung auscultation, elevated JVP
- S3 gallop (ventricular gallop, indicates volume overload)
- 'Chest X-ray: Pulmonary edema, pleural effusions, cardiomegaly'
- BNP >400 or NT-proBNP >900 pg/mL supports diagnosis
- 'Triggers: medication non-adherence, dietary indiscretion, infection, ischemia,
  arrhythmia'
workup:
- BNP or NT-proBNP
- Chest X-ray (2-view)
- ECG (look for ischemia, arrhythmia)
- Echocardiogram (assess EF, valves, wall motion)
- Basic metabolic panel (renal function, electrolytes)
- Troponin (rule out ACS as trigger)
treatment:
- 'Guideline-based treatment options for Acute Heart Failure / Decompensated Heart
  Failure include:'
- 'IV loop diuretics: Furosemide 40-80mg IV (double home dose if on oral) (ACC/AHA
  2023)'
- Oxygen or BiPAP if hypoxic or respiratory distress (ACC/AHA 2023)
- Nitroglycerin if BP adequate (SBP >90-100) for afterload reduction (ACC/AHA 2023)
- Daily weights, strict I/Os, Na/fluid restriction (≤2L/day, <2g Na/day) (ACC/AHA
  2023)
- 'Treat underlying cause: Control AFib, treat ischemia, antibiotics for infection
  (ACC/AHA 2023)'
clinical_pearls:
- BNP <100 makes HF unlikely (high negative predictive value)
- Loop diuretics (IV furosemide 40-80mg) for acute volume overload
- BiPAP reduces intubation rates in acute pulmonary edema
- Distinguish HFrEF (EF <40%) from HFpEF (EF ≥50%) - treatment differs
- 'Watch for cardiorenal syndrome: Diuresis improves lungs, worsens kidneys'
referrals:
- Cardiology for new-onset HF or refractory symptoms
- Heart failure clinic for chronic management
- Consider advanced HF team if refractory (VAD, transplant evaluation)
differentials:
  - Chronic HF exacerbation
  - Acute coronary syndrome
  - Pulmonary embolism
  - Pneumonia
  - COPD exacerbation
