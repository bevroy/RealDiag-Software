tree_id: GER-DELIRIUM
name: Delirium (Acute Confusional State)
family: Geriatrics
specialty: Geriatrics
icd10:
- R41.0
- F05
snomed:
- '2776000'
urgency: urgent
description: Comprehensive evaluation and management of Delirium (Acute Confusional
  State)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Acute change in mental status (hours to days, not weeks/months like dementia)
- Fluctuating level of consciousness (waxes and wanes throughout day)
- 'Inattention: Inability to focus, easily distracted, trouble tracking conversation'
- 'Disorganized thinking: Rambling, illogical, tangential speech'
- 'Altered level of consciousness: Hyperalert (hyperactive) or lethargic (hypoactive)'
- 'Perceptual disturbances: Visual hallucinations, delusions'
- 'Hypoactive delirium (most common in elderly): Withdrawn, quiet, easily missed'
- Often reversible if underlying cause treated
workup: []
treatment:
- 'Guideline-based treatment options for Delirium (Acute Confusional State) include:'
- 'Workup: Infection screen (UA, CXR, blood cultures), metabolics (BMP, Ca, glucose),
  medication review, ECG, consider CT head (AGS 2023)'
- 'Identify and treat cause: Antibiotics for infection, stop offending meds, correct
  metabolic abnormalities (AGS 2023)'
- 'Non-pharmacologic: Reorient frequently, familiar objects, glasses/hearing aids,
  minimize restraints, lights on during day/off at night (AGS 2023)'
- 'Medications (LAST resort): Haloperidol 0.5-1mg PO/IM (hyperactive only), avoid
  benzos (worsen), avoid if possible (AGS 2023)'
- 'Disposition: Admit if cannot identify/treat cause outpatient, high fall risk, unable
  to care for self at home (AGS 2023)'
clinical_pearls:
- 'CAM criteria (Confusion Assessment Method): (1) Acute onset + fluctuating AND (2)
  Inattention AND (3) Disorganized thinking OR (4) Altered LOC'
- 'Hyperactive (25%): Agitated, restless, hallucinations - easily recognized'
- 'Hypoactive (50%): Lethargic, withdrawn, quiet - often MISSED, higher mortality'
- 'Mixed (25%): Alternates between hyperactive and hypoactive'
- 'Common causes: Infection (UTI, pneumonia), medications (anticholinergics, benzos,
  opioids), metabolic (hyponatremia, hypoglycemia), hypoxia, pain'
- 'Do NOT treat with antipsychotics first: Find and treat underlying cause, use non-pharm
  interventions'
referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy
differentials:
  - Dementia
  - Depression
  - Psychosis
  - Medication effect
  - Metabolic encephalopathy
