tree_id: DERM-ORAL-LICHEN-PLANUS
name: Oral Lichen Planus
family: Dermatology
specialty: Dermatology
chief_complaint: White patches and painful sores in mouth
description: Chronic inflammatory condition causing white lacy patches (Wickham striae) or painful erosions in mouth, bilateral buccal mucosa classic. Associated with hepatitis C and certain medications, chronic with waxing and waning course, small malignant transformation risk (1-2%).
icd10: L43.9
snomed: 4307007
urgency: routine

workup:
  - Clinical diagnosis: bilateral white lacy patches or erosions on buccal mucosa
  - Location: buccal mucosa (cheeks) bilateral most common, also tongue, gingiva, lips
  - Clinical patterns:
  - Reticular (most common): white lacy network (Wickham striae), asymptomatic, pathognomonic
  - Erosive: painful ulcerations with surrounding white striae, most symptomatic form
  - Plaque-like: white homogenous patches (must differentiate from leukoplakia)
  - Atrophic: red patches with burning sensation
  - Papular, bullous (rare forms)
  - Bilateral and symmetric: classic feature
  - Cutaneous lichen planus: violaceous flat-topped polygonal papules with Wickham striae on wrists, ankles (30% have oral and skin involvement)
  - Chronic course: waxing and waning, rarely resolves spontaneously
  - Triggers and associations:
  - Hepatitis C: screen all patients (HCV positive in 10-30% depending on geographic area)
  - Medications: NSAIDs, ACE inhibitors, beta-blockers, sulfonylureas, antimalarials (lichenoid drug reaction)
  - Dental materials: amalgam fillings adjacent to lesions (contact reaction)
  - Autoimmune diseases: increased association
  - Biopsy: if diagnosis uncertain or to rule out dysplasia
  - Shows band-like lymphocytic infiltrate at dermoepidermal junction, saw-tooth rete ridges
  - Direct immunofluorescence: fibrinogen along basement membrane (helps distinguish from pemphigoid)
  - Malignant transformation risk: 1-2% develop squamous cell carcinoma (controversial, long-term monitoring)
  - Screen for hepatitis C: anti-HCV antibody, HCV RNA if positive

treatment:
  - Eliminate triggers:
  - Test for hepatitis C: treat HCV if positive (may improve oral LP)
  - Review medications: discontinue if lichenoid drug reaction suspected
  - Replace amalgam fillings: if lesions adjacent to dental work
  - Avoid irritants: spicy foods, acidic foods, alcohol, tobacco (worsen symptoms)
  - Topical corticosteroids (first-line for symptomatic lesions):
  - Clobetasol gel 0.05%: apply to lesions BID (high potency)
  - Triamcinolone acetonide 0.1% in Orabase: apply QID after meals and bedtime
  - Fluocinonide gel 0.05%: apply BID
  - Betamethasone oral rinse: 0.5 mg/5 mL swish and spit QID
  - Dexamethasone elixir: 0.5 mg/5 mL swish and spit QID then taper
  - Topical calcineurin inhibitors (steroid-sparing):
  - Tacrolimus 0.1% ointment: apply BID to oral lesions
  - Avoid in erosive lesions (burning sensation)
  - Intralesional corticosteroids: triamcinolone 10 mg/mL for localized resistant lesions
  - Systemic treatment for severe refractory erosive disease:
  - Prednisone 0.5-1 mg/kg daily taper over weeks (short-term only)
  - Hydroxychloroquine 200 mg BID (steroid-sparing)
  - Mycophenolate mofetil 1-2 g daily (severe cases)
  - Pain control: viscous lidocaine 2% swish and spit before meals, topical benzocaine
  - Good oral hygiene: gentle tooth brushing, avoid SLS-containing toothpaste (sodium lauryl sulfate irritant)
  - Regular monitoring: every 6-12 months for malignant transformation (controversial)

clinical_pearls:
  - White lacy patches (Wickham striae) on bilateral buccal mucosa pathognomonic
  - Erosive form most symptomatic with painful ulcerations
  - Screen for hepatitis C in all patients (10-30% association)
  - Review medications - lichenoid drug reaction mimics lichen planus
  - High-potency topical steroids first-line (clobetasol gel)
  - Chronic waxing and waning course, rarely resolves spontaneously
  - 1-2% malignant transformation risk - controversial, long-term monitoring
  - 30% have both oral and cutaneous involvement

differentials:
  - Leukoplakia: white patch, unilateral, higher malignant potential, no Wickham striae
  - Oral candidiasis (thrush): white patches scrape off (LP does not), KOH positive
  - Lichenoid drug reaction: identical to LP, resolves after stopping medication
  - Lupus: oral ulcers less lacy pattern, positive ANA, systemic symptoms
  - Pemphigus vulgaris: painful erosions, positive Nikolsky sign, immunofluorescence different

trace: |
  A 52-year-old woman presented with 6 months of painful mouth sores. Burning sensation in cheeks, pain when eating spicy or acidic foods. Also has red painful gums (erosive gingival lichen planus). Tried over-the-counter treatments without improvement. Takes lisinopril for hypertension x2 years (started before oral symptoms). Non-smoker. Exam showed bilateral buccal mucosa with white lacy reticular pattern (Wickham striae - pathognomonic) surrounding areas of erythema and erosions bilaterally symmetric. Gingiva erythematous and friable (desquamative gingivitis pattern). No cutaneous lesions. Diagnosed with erosive oral lichen planus (classic bilateral white lacy striae with erosions on buccal mucosa, desquamative gingivitis). Performed biopsy to confirm: showed band-like lymphocytic infiltrate, saw-tooth rete ridges (confirmed lichen planus). Screened for hepatitis C: anti-HCV negative. Reviewed medications: lisinopril started 2 years ago but symptoms only 6 months, unlikely drug-induced. Started clobetasol 0.05% gel applied to erosions BID after brushing. Viscous lidocaine 2% swish before meals for pain. Counseled to avoid spicy foods, acidic foods, alcohol. At 2 weeks pain improved 40%, erosions starting to heal. At 6 weeks erosions 70% healed, burning sensation much better. At 3 months excellent control, reticular striae still present (asymptomatic), erosions healed. Maintenance therapy: tacrolimus 0.1% ointment BID to reduce steroid use long-term. Counseled on chronic waxing and waning nature, regular monitoring every 6-12 months for malignant transformation (1-2% risk). At 1 year good control on tacrolimus, occasional flares managed with short bursts of clobetasol.
