tree_id: CARD-ATRIAL-FIBRILLATION
name: Atrial Fibrillation
family: Cardiovascular
specialty: Cardiology
chief_complaint: Palpitations
description: Most common sustained cardiac arrhythmia characterized by disorganized atrial electrical activity and irregular ventricular response

icd10: I48.91

urgency: urgent

workup:
  - Clinical presentation: palpitations, dyspnea, fatigue, chest discomfort, dizziness, syncope, or asymptomatic (detected incidentally)
  - ECG diagnostic: irregularly irregular rhythm, absence of P waves, fibrillatory waves (variable amplitude/morphology), variable RR intervals
  - Classification by pattern: paroxysmal (self-terminating within 7 days, usually less than 48 hours), persistent (sustained more than 7 days or requires cardioversion), long-standing persistent (more than 12 months), permanent (accepted, no further attempts at rhythm control)
  - Assess hemodynamic stability: unstable (hypotension, acute heart failure, ischemia) requires urgent cardioversion
  - Identify precipitants: alcohol (holiday heart), thyroid disease, acute illness, cardiac surgery, pulmonary disease, sleep apnea
  - Laboratory: TSH (hyperthyroidism common cause), electrolytes (hypokalemia, hypomagnesemia), CBC, BMP, troponin if chest pain
  - Echocardiogram: assess LV function, valvular disease, LA size, rule out thrombus (TEE if cardioversion planned)
  - CHA2DS2-VASc score for stroke risk: CHF (1), Hypertension (1), Age 75 or more (2), Diabetes (1), prior Stroke/TIA/thromboembolism (2), Vascular disease (1), Age 65-74 (1), Sex female (1) - score 2 or more in men or 3 or more in women requires anticoagulation

treatment:
  - Rate control target heart rate less than 110 bpm at rest for most patients: beta-blockers first-line (metoprolol 25-100 mg BID, carvedilol 3.125-25 mg BID), non-dihydropyridine CCBs (diltiazem 120-360 mg daily, verapamil 120-480 mg daily), digoxin 0.125-0.25 mg daily (third-line, useful if heart failure)
  - Rhythm control (restore sinus rhythm): consider if symptomatic despite rate control, first episode, young age, HFrEF from tachycardia-induced cardiomyopathy
  - Cardioversion: electrical (synchronized DC 100-200 J biphasic) preferred over pharmacologic (ibutilide IV, flecainide, propafenone), anticoagulate 3 weeks before if duration more than 48 hours or unknown (or TEE to exclude thrombus), continue anticoagulation 4 weeks after regardless of success
  - Antiarrhythmic drugs for rhythm control: amiodarone 200 mg daily (most effective but toxicity limits use - thyroid, pulmonary, hepatic, monitor PFTs/LFTs/TSH), sotalol 80-160 mg BID (requires QTc monitoring), flecainide 50-150 mg BID or propafenone 150-300 mg TID (class IC agents contraindicated if structural heart disease/CAD)
  - Catheter ablation (pulmonary vein isolation): curative intent, first-line option for symptomatic paroxysmal AF, higher success rate than antiarrhythmics, complications include stroke, tamponade, PV stenosis
  - Anticoagulation for stroke prevention based on CHA2DS2-VASc score: score 2 or more in men or 3 or more in women - DOACs preferred (apixaban 5 mg BID, rivaroxaban 20 mg daily, edoxaban 60 mg daily, dabigatran 150 mg BID) over warfarin (easier, no monitoring, fewer intracranial bleeds), warfarin INR 2-3 if mechanical valve or severe mitral stenosis
  - Assess bleeding risk with HAS-BLED score but does not contraindicate anticoagulation - address modifiable risk factors

clinical_pearls:
  - Most common sustained arrhythmia, prevalence increases with age (10 percent at age 80)
  - Irregularly irregular rhythm on ECG diagnostic
  - CHA2DS2-VASc score guides anticoagulation, score 2 or more in men or 3 or more in women requires anticoagulation regardless of pattern (paroxysmal same stroke risk as persistent)
  - DOACs preferred over warfarin (easier, no monitoring, fewer intracranial bleeds)
  - Rate control non-inferior to rhythm control for most patients
  - Catheter ablation first-line for symptomatic paroxysmal AF, success rate 70-80 percent
  - AF increases stroke risk 5-fold, heart failure risk 3-fold

differentials:
  - Atrial flutter (regular sawtooth flutter waves, atrial rate 250-350 bpm, often 2:1 or 3:1 AV block giving regular ventricular rate)
  - Multifocal atrial tachycardia (irregular rhythm with at least 3 different P wave morphologies, common in COPD patients)
  - Sinus tachycardia with frequent PACs (P waves present, may be irregular but not completely irregular)
  - Artifact on ECG mimicking AF (check for regular P waves hidden)

trace:
  - 68-year-old man with hypertension and diabetes presents to ED with 6 hours palpitations, dyspnea, lightheadedness, no chest pain, first episode
  - Exam: BP 138/86, HR 142 irregular, lungs clear, no acute distress
  - ECG: atrial fibrillation with rapid ventricular response 140s, no ST changes
  - Labs: TSH 1.8 mIU/L (normal), troponin negative, electrolytes normal, BNP 245 pg/mL (mildly elevated)
  - CHA2DS2-VASc score 4 (hypertension 1, age 65-74 1, diabetes 1, male 0) plus vascular disease 1 equals 4 - high stroke risk, requires anticoagulation
  - Hemodynamically stable, started metoprolol 25 mg PO, heart rate improved to 90s within 2 hours
  - Diagnosis: new onset atrial fibrillation with rapid ventricular response, duration less than 48 hours
  - Decision for cardioversion given first episode and recent onset, TEE performed to exclude LA thrombus (none seen)
  - Electrical cardioversion 150 J biphasic successful, converted to sinus rhythm
  - Started apixaban 5 mg BID (anticoagulation), metoprolol 50 mg BID (rate control), will continue 4 weeks minimum
  - Outpatient echo: normal LV function EF 60 percent, mild LA enlargement
  - 1 month follow-up: sinus rhythm on ECG, tolerating apixaban and metoprolol well, no bleeding, will continue anticoagulation indefinitely given CHA2DS2-VASc score 4
  - 6 months: remains in sinus rhythm, continues apixaban long-term for stroke prevention
