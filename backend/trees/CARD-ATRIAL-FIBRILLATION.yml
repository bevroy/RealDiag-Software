tree_id: CARD-ATRIAL-FIBRILLATION
name: Atrial Fibrillation
family: cardiovascular
specialty: Cardiology
chief_complaint: Palpitations, irregular heartbeat, shortness of breath, fatigue
description: Most common sustained cardiac arrhythmia with irregular atrial activation and ineffective atrial contraction
icd10: I48.91
urgency: routine-to-emergency
workup:
  - Clinical presentation - irregular rhythm, often asymptomatic
  - Symptoms (50% asymptomatic)
  - Palpitations (awareness of irregular heartbeat)
  - Dyspnea, reduced exercise tolerance
  - Fatigue, weakness
  - Chest discomfort, lightheadedness
  - Syncope (if rapid ventricular response)
  - Stroke or TIA (thromboembolic complication)
  - Heart failure symptoms (if LV dysfunction develops)
  - Types of atrial fibrillation
  - Paroxysmal AF - self-terminating, typically less than 7 days
  - Persistent AF - sustained greater than 7 days, requires cardioversion
  - Long-standing persistent AF - continuous AF greater than 12 months
  - Permanent AF - accepted, no further attempts at rhythm control
  - Physical examination findings
  - Irregularly irregular pulse (hallmark)
  - Tachycardia common (HR 110-140 if untreated)
  - Pulse deficit - apical rate greater than radial rate
  - Variable S1 intensity
  - Listen for murmurs (valvular disease as cause)
  - Signs of heart failure if LV dysfunction
  - Risk factors and causes
  - Age (most important), hypertension, heart failure
  - Valvular disease, CAD, prior MI
  - Hyperthyroidism, sleep apnea, obesity, diabetes
  - Medications (diuretics, stimulants)
  - Alcohol, cardiac surgery, pulmonary disease
  - Diagnostic testing with EKG showing irregularly irregular rhythm, no distinct P waves
  - Fibrillatory waves, narrow QRS
  - Holter monitor for paroxysmal AF
  - Echocardiography for structural assessment
  - TSH check (hyperthyroidism causes AF)
  - CHA2DS2-VASc score for stroke risk stratification
  - Score 2+ (men) or 3+ (women) requires anticoagulation
treatment:
  - Acute management - assess stability
  - Unstable requires urgent cardioversion
  - Stable - rate control or rhythm control strategy
  - Rate control with beta-blockers (first-line), calcium channel blockers, digoxin
  - Target HR less than 110 bpm lenient or less than 80 strict
  - Rhythm control with cardioversion (electrical or pharmacologic)
  - Anticoagulation before cardioversion if AF greater than 48 hours
  - Long-term rhythm control with antiarrhythmic drugs
  - Catheter ablation (pulmonary vein isolation) for paroxysmal AF
  - Anticoagulation (stroke prevention) - most important
  - DOACs first-line (apixaban, rivaroxaban, edoxaban, dabigatran)
  - Warfarin if valvular AF or mechanical valve
  - Continue indefinitely if CHA2DS2-VASc indicates high risk
  - Left atrial appendage closure if anticoagulation contraindicated
  - Lifestyle modifications - avoid alcohol, weight loss, treat sleep apnea
clinical_pearls:
  - Most common arrhythmia, prevalence increases with age
  - Irregularly irregular rhythm hallmark
  - CHA2DS2-VASc score guides anticoagulation
  - DOACs preferred over warfarin for most patients
  - Rate control as effective as rhythm control for many
  - Catheter ablation curative for paroxysmal AF (70-80% success)
  - AF increases stroke risk 5-fold
  - Continue anticoagulation even if sinus rhythm restored
differentials:
  - Atrial flutter (regular sawtooth pattern)
  - Multifocal atrial tachycardia (MAT)
  - Frequent PACs
  - Sinus arrhythmia
trace:
  - 72-year-old man with hypertension, diabetes presents with palpitations and dyspnea x 6 hours
  - Sudden onset, heart racing and irregular
  - No chest pain, no syncope, first episode
  - Exam shows irregular pulse HR 142, BP 135/85
  - EKG shows irregularly irregular rhythm, no P waves, fibrillatory waves
  - Diagnosis - new-onset AF with RVR, hemodynamically stable
  - TSH normal, echo shows normal EF, mildly dilated LA
  - CHA2DS2-VASc score 3 (HTN, age, diabetes) - high stroke risk
  - Treated with IV diltiazem, rate controlled to 110 bpm
  - Started apixaban 5 mg BID for anticoagulation
  - Cardioversion performed (AF less than 24 hours) - successful
  - Converted to sinus rhythm
  - Discharged on apixaban indefinitely, metoprolol for rate control
  - Event monitor x 30 days - detected paroxysmal AF recurrence at 1 year
  - Referred for catheter ablation, underwent pulmonary vein isolation
  - No AF recurrence 1 year post-ablation, continues anticoagulation
  - Outcome - successful rhythm control with ablation, on anticoagulation for stroke prevention
