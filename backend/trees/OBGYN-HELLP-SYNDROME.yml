tree_id: OBGYN-HELLP-SYNDROME
name: HELLP Syndrome
family: Obstetrics Gynecology
specialty: Obstetrics Gynecology
icd10:
- O14.2
snomed:
- '307534008'
urgency: medium
description: Comprehensive evaluation and management of HELLP Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Hemolysis: Schistocytes on smear, elevated LDH (>600 U/L), low haptoglobin, elevated
  indirect bilirubin'
- 'Elevated Liver enzymes: AST/ALT >2x ULN (often >70 U/L)'
- 'Low Platelets: <100,000/μL'
- Right upper quadrant or epigastric pain (60-90%)
- Nausea, vomiting, malaise, headache
- Usually occurs 27-37 weeks (70%) or postpartum (30%, up to 7 days)
- May occur WITHOUT severe hypertension or proteinuria
workup:
- CBC (platelets, hemoglobin, schistocytes)
- CMP (AST, ALT, LDH, bilirubin)
- Haptoglobin (low in hemolysis)
- Coagulation panel (PT, PTT, fibrinogen - assess for DIC)
- Type & screen (anticipate transfusion needs)
treatment:
- 'Guideline-based treatment options for HELLP Syndrome include:'
- 'Magnesium sulfate: 4-6g IV load, then 2g/hr (seizure prophylaxis) (ACOG 2024)'
- 'Deliver: Urgently if ≥34 weeks or maternal instability, betamethasone if <34 weeks
  (ACOG 2024)'
- 'Blood pressure control: If ≥160/110 (labetalol, hydralazine) (ACOG 2024)'
- 'Transfuse if needed: Platelets if <20K or bleeding, pRBCs if anemia (ACOG 2024)'
- 'Monitor postpartum: Platelets, LFTs q6-12hr (may worsen 24-48hr post-delivery)
  (ACOG 2024)'
clinical_pearls:
- HELLP is severe form of preeclampsia (microangiopathic hemolytic anemia + hepatic
  dysfunction)
- 15% of HELLP do not have severe hypertension or heavy proteinuria
- 'Delivery is only definitive treatment: Deliver regardless of gestational age if
  maternal instability'
- Maternal mortality 1%, risk of DIC, liver hematoma/rupture, placental abruption
- 'Postpartum HELLP: Can develop up to 7 days after delivery'
referrals:
- OB/GYN immediately
- Maternal-fetal medicine
- ICU admission
differentials:
  - Preeclampsia
  - Acute fatty liver of pregnancy
  - TTP
  - Hemolytic anemia from other cause
trace:
  source: American College of Obstetricians and Gynecologists (ACOG) Practice Bulletins,
    Society for Maternal-Fetal Medicine (SMFM)
