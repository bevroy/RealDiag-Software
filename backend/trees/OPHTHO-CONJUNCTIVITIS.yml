tree_id: OPHTHO-CONJUNCTIVITIS
name: Conjunctivitis (Pink Eye)
family: Ophthalmology
specialty: Ophthalmology
icd10:
  - H10.9
  - H10.33
  - H10.10
snomed:
  - 9826008
  - 231853008
  - 193867004
urgency: non-urgent
description: Evaluation and management of conjunctivitis - viral, bacterial, and allergic

homeopathy:
  - remedy: Euphrasia 30C
    indications: Watery, burning discharge, worse outdoors, bland nasal discharge, photophobia
  - remedy: Pulsatilla 30C
    indications: Thick yellow-green discharge, worse warmth, better open air, mild disposition
  - remedy: Apis mellifica 30C
    indications: Puffy, swollen lids, burning/stinging, worse heat, better cold compress
  - remedy: Argentum nitricum 30C
    indications: Purulent discharge, red inner canthi, splinter sensation, worse heat
  - remedy: Allium cepa 30C
    indications: Profuse bland eye discharge with acrid nasal discharge, worse indoors

presentations:
  - Red eye
  - Eye discharge (watery, purulent, or mucoid)
  - Eye itching
  - Foreign body sensation
  - Crusted eyelids in morning
  - Bilateral eye symptoms
  - Associated upper respiratory symptoms

workup:
  - "RED FLAGS requiring ophthalmology referral: severe eye pain, photophobia, decreased visual acuity, unilateral symptoms only, corneal involvement, lack of response to treatment after 3-5 days, recurrent episodes"
  - "History: onset (sudden vs gradual), discharge type (watery, purulent, stringy), itching (suggests allergic), sick contacts (viral), contact lens use, recent URI symptoms, allergy history, unilateral vs bilateral"
  - "Physical exam: visual acuity (should be normal), examine lids for edema/crusting, conjunctival injection (diffuse vs localized), discharge character, preauricular lymphadenopathy (viral), fluorescein exam if available (rule out corneal ulcer/abrasion)"
  - "Viral conjunctivitis features: watery discharge, bilateral, associated URI symptoms, preauricular lymph node, highly contagious, history of sick contacts"
  - "Bacterial conjunctivitis features: purulent discharge (yellow-green), mattering of lashes, bilateral or unilateral, may have rapid onset"
  - "Allergic conjunctivitis features: prominent itching, watery/stringy discharge, bilateral, seasonal pattern, history of atopy, boggy conjunctiva, associated rhinitis"
  - "No cultures needed for routine conjunctivitis - reserve for neonates, severe cases, or no response to treatment"

treatment:
  - "Viral conjunctivitis (most common): supportive care only - cool compresses, artificial tears, no antibiotics needed, resolves in 7-14 days, highly contagious for 10-12 days"
  - "Bacterial conjunctivitis: topical antibiotics - erythromycin 0.5% ointment QID or polymyxin B/trimethoprim drops QID x5-7 days (alternatives: azithromycin, fluoroquinolones)"
  - "Allergic conjunctivitis: topical antihistamine/mast cell stabilizer (olopatadine 0.1%, ketotifen 0.025%) BID, oral antihistamine (cetirizine, loratadine), cool compresses, avoid allergen"
  - "Contact lens wearers: STOP wearing contacts until resolved, consider fluoroquinolone drops (risk of Pseudomonas), refer if not improving"
  - "Hygiene measures: frequent handwashing, avoid touching eyes, dispose of eye makeup, don't share towels/pillows, separate towels for each eye when cleaning"
  - "Return to work/school: bacterial - after 24h of antibiotics; viral - often allowed with good hygiene but highly contagious; check local policies"

clinical_pearls:
  - "Most conjunctivitis is viral (80%) - antibiotics don't help and contribute to resistance"
  - "Can't reliably distinguish viral from bacterial clinically - purulent discharge suggests bacterial but not definitive"
  - "Unilateral conjunctivitis with foreign body sensation - think corneal abrasion or foreign body (needs fluorescein exam)"
  - "Conjunctivitis in contact lens wearer is corneal ulcer until proven otherwise - needs ophthalmology"
  - "Preauricular lymphadenopathy strongly suggests viral etiology (adenovirus most common)"
  - "If vision is affected or there's severe pain/photophobia - it's NOT simple conjunctivitis, refer to ophthalmology"
  - "Neonatal conjunctivitis (<4 weeks): concerning for chlamydia or gonorrhea, needs urgent ophthalmology and cultures"

referrals:
  - Ophthalmology for: decreased vision, severe pain, photophobia, unilateral presentation only, corneal involvement, contact lens wearer with red eye, no improvement after 3-5 days treatment, recurrent episodes, neonatal conjunctivitis
  - Allergy/Immunology for: severe or refractory allergic conjunctivitis

citations:
  - "American Academy of Ophthalmology Preferred Practice Pattern: Conjunctivitis. 2018."
  - "Azari AA, Barney NP. Conjunctivitis: A Systematic Review of Diagnosis and Treatment. JAMA. 2013;310(16):1721-1729."
  - "Epling J. Bacterial conjunctivitis. BMJ Clin Evid. 2012."
