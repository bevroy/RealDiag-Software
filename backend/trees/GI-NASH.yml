tree_id: GI-NASH
name: Nonalcoholic Steatohepatitis (NASH)
family: gastroenterology
specialty: Gastroenterology
icd10: K75.81
snomed: 442685003
urgency: []
homeopathy: []
presentations:
  - Often asymptomatic until advanced disease
  - Fatigue and right upper quadrant discomfort (nonspecific)
  - Hepatomegaly on physical examination
  - Elevated liver enzymes (ALT > AST typically)
  - Risk factors: obesity (BMI >30), type 2 diabetes, metabolic syndrome, dyslipidemia
  - Central obesity and insulin resistance
  - May present with complications of cirrhosis if advanced (ascites, variceal bleeding, encephalopathy)
  - Incidental finding on imaging showing fatty liver
workup:
  - Distinguish NASH from simple steatosis (requires inflammation and hepatocyte injury)
  - Liver enzymes: ALT, AST (ALT > AST, unlike alcoholic liver disease)
  - Mild to moderate elevation typical (<5x ULN)
  - Comprehensive metabolic panel, fasting glucose, HbA1c, lipid panel
  - Rule out other causes of liver disease
  - Viral hepatitis serologies (HBV, HCV)
  - Autoimmune markers, iron studies, ceruloplasmin
  - Exclude significant alcohol use (<20 g/day for women, <30 g/day for men)
  - Imaging: ultrasound or MRI shows hepatic steatosis
  - Non-invasive fibrosis assessment crucial
  - FibroScan (transient elastography) - measures liver stiffness (kPa)
  - "Less than 7 kPa: minimal fibrosis; 7-10 kPa: significant fibrosis; greater than 10 kPa: advanced fibrosis/cirrhosis"
  - Fibrosis-4 (FIB-4) score: age × AST / (platelets × √ALT)
  - "Less than 1.3: low risk; 1.3-2.67: intermediate; greater than 2.67: high risk of advanced fibrosis"
  - NAFLD Fibrosis Score (online calculator)
  - Liver biopsy - gold standard for diagnosis but not always required
  - Indicated if diagnostic uncertainty or to stage fibrosis
  - NASH activity score (NAS): steatosis + inflammation + ballooning
  - Fibrosis staged F0-F4 (F4 = cirrhosis)
treatment:
  - Weight loss - most effective intervention
  - Goal: 7-10% body weight reduction (improves NASH in 90%, regresses fibrosis in 45%)
  - Even 3-5% weight loss improves steatosis
  - Calorie restriction: 500-1000 kcal/day deficit
  - Mediterranean diet or low-carbohydrate diet
  - Exercise: ≥150 minutes moderate-intensity aerobic activity per week
  - Resistance training 2-3 times per week
  - Treat metabolic comorbidities aggressively
  - Type 2 diabetes: metformin, GLP-1 agonists (liraglutide, semaglutide), SGLT2 inhibitors
  - Dyslipidemia: statins (safe and effective in NASH)
  - Hypertension: ACE inhibitors or ARBs preferred
  - Pharmacotherapy for NASH (limited FDA-approved options)
  - Vitamin E 800 IU daily (improves histology in non-diabetic NASH but long-term safety concerns)
  - Pioglitazone 30 mg daily (improves NASH in diabetics but causes weight gain)
  - GLP-1 agonists (semaglutide, liraglutide) show promise - weight loss and NASH improvement
  - Bariatric surgery for morbidly obese (BMI >35) with NASH - highly effective
  - Avoid hepatotoxins: alcohol, unnecessary medications, herbal supplements
  - Screen for hepatocellular carcinoma if cirrhosis (ultrasound + AFP every 6 months)
  - Esophageal varices screening if cirrhosis present
clinical_pearls:
  - "NASH is inflammatory subtype of NAFLD - can progress to cirrhosis and HCC"
  - "20-30% of NAFLD patients have NASH; 20% of NASH patients develop cirrhosis"
  - "NASH becoming leading indication for liver transplantation in US"
  - "Weight loss of 7-10% can resolve NASH and improve fibrosis"
  - "Fibrosis stage is strongest predictor of long-term outcomes and mortality"
  - "NASH increases risk of cardiovascular disease - aggressively treat CV risk factors"
  - "Liver biopsy not always needed - use non-invasive tests (FibroScan, FIB-4) for risk stratification"
  - "No FDA-approved medications specifically for NASH yet, but several in clinical trials"
referrals:
  - Gastroenterology/Hepatology for NASH diagnosis, staging, and management
  - Refer if FIB-4 >2.67, FibroScan >10 kPa, or clinical suspicion of advanced fibrosis
  - Endocrinology for optimization of diabetes and metabolic syndrome
  - Bariatric surgery evaluation if BMI >35 and refractory to medical management
  - Liver transplant center if decompensated cirrhosis or hepatocellular carcinoma
differentials:
  - Simple hepatic steatosis (fat without inflammation - benign prognosis)
  - Nonalcoholic steatohepatitis (NASH) - inflammatory, can progress to cirrhosis
  - Alcoholic steatohepatitis (significant alcohol use, AST:ALT >2)
  - Viral hepatitis (HBV, HCV)
  - Autoimmune hepatitis (elevated IgG, positive autoantibodies)
  - Medication-induced steatohepatitis (amiodarone, methotrexate, tamoxifen)
  - Hemochromatosis (elevated iron studies)
  - Wilson's disease (age <40, low ceruloplasmin)
  - Alpha-1 antitrypsin deficiency (emphysema, low AAT level)
trace:
