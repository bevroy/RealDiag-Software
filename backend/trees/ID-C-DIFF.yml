presentations:
  - Watery diarrhea (≥3 unformed stools in 24 hours)
  - Abdominal cramping and tenderness
  - Fever, leukocytosis (WBC >15,000)
  - 'Recent antibiotic use (within 3 months): Clindamycin, fluoroquinolones, cephalosporins'
  - 'Severe: WBC >15K, Cr >1.5x baseline, or complicated (hypotension, ileus, megacolon)'
  - 'Fulminant: Hypotension, shock, ileus, or megacolon'
  - 'Stool test: Nucleic acid amplification test (NAAT) or toxin EIA'
differentials:
  - Gastroenteritis from other cause
  - IBD
  - Ischemic colitis
  - Medication effect
workup: []
treatment:
  - STOP inciting antibiotic if possible (most important step)
  - 'Initial episode non-severe: Fidaxomicin 200mg PO BID x10 days (preferred - lower recurrence) OR vancomycin 125mg PO QID x10 days'
  - Metronidazole 500mg PO TID x10 days only if fidaxomicin/vancomycin unavailable (inferior efficacy)
  - 'Severe C. diff (WBC >15K, Cr ≥1.5x baseline, albumin <3): Vancomycin 125mg PO QID x10 days OR fidaxomicin 200mg BID x10 days'
  - 'Fulminant C. diff (hypotension, shock, ileus, megacolon): Vancomycin 500mg PO/NG QID + metronidazole 500mg IV Q8H'
  - 'If ileus present: Add vancomycin retention enema (500mg in 100mL saline Q6H per rectum)'
  - 'Fulminant with no clinical improvement after 5 days: Surgical consultation for subtotal colectomy with preservation of rectum'
  - 'First recurrence (within 8 weeks): Fidaxomicin 200mg BID x10 days (preferred) OR vancomycin tapered/pulsed regimen'
  - 'Vancomycin taper: 125mg PO QID x10-14 days, then BID x7 days, then daily x7 days, then every 2-3 days x2-8 weeks'
  - 'Second or subsequent recurrence: Fidaxomicin 200mg BID x10 days followed by rifaximin 400mg TID x20 days OR vancomycin taper/pulse OR fecal microbiota transplantation (FMT)'
  - 'FMT (fecal microbiota transplantation): 80-90% cure rate for recurrent C. diff after ≥2 recurrences, delivered via colonoscopy or capsules'
  - 'Bezlotoxumab (Zinplava): Monoclonal antibody against C. diff toxin B, 10mg/kg IV single dose, reduces recurrence by 40% (give with antibiotics for high-risk patients)'
  - Supportive care - IV fluids, electrolyte repletion (patients often volume depleted from diarrhea)
  - Avoid antidiarrheals (loperamide, diphenoxylate) - can precipitate toxic megacolon
  - Infection control - contact precautions, hand washing with soap and water (alcohol gel not effective against spores), environmental cleaning with bleach
  - Probiotics NOT recommended during active infection (no proven benefit)
clinical_pearls:
  - 'Initial episode: Vancomycin 125mg PO QID or fidaxomicin 200mg PO BID x 10 days'
  - 'First recurrence: Same regimen. Second recurrence: Fidaxomicin or vancomycin taper'
  - 'Severe/fulminant: Vancomycin 500mg PO QID + metronidazole 500mg IV q8h'
  - 'If ileus: Consider vancomycin retention enema, surgical evaluation if no improvement'
  - Stop inciting antibiotics if possible. Fecal microbiota transplant for recurrent
