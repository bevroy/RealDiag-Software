tree_id: CARDS-LONG-QT-SYNDROME
name: Long QT Syndrome
family: Cardiology
specialty: Cardiology
chief_complaint: Syncope during exercise or emotional stress
description: Prolonged ventricular repolarization causing QTc over 480 ms and predisposing to torsades de pointes and sudden cardiac death. Congenital (channelopathy) or acquired (medications). Beta blockers reduce events, ICD for high-risk patients. Avoid QT-prolonging drugs.
icd10: I45.81
snomed: 111975006
urgency: urgent

workup:
  - Symptoms: result from torsades de pointes (polymorphic VT)
  - Syncope: sudden loss of consciousness during exercise, emotional stress, auditory triggers (alarm clock - LQT2)
  - Seizure-like activity: convulsions from cerebral hypoperfusion (often misdiagnosed as epilepsy)
  - Palpitations: before syncope
  - Sudden cardiac death: if torsades degenerates to ventricular fibrillation
  - Triggers vary by subtype:
  - LQT1: exercise (especially swimming)
  - LQT2: emotional stress, auditory stimuli (alarm, telephone)
  - LQT3: rest or sleep
  - Family history: syncope, sudden death in young relatives
  - ECG findings (diagnostic):
  - Prolonged QTc interval: over 480 ms definite LQTS, 460-480 ms borderline
  - QT interval: measure from start of QRS to end of T wave
  - Corrected for heart rate: QTc = QT / √RR interval (Bazett formula)
  - Normal QTc: under 440 ms (men), under 460 ms (women)
  - T wave morphology patterns:
  - LQT1: broad-based T wave
  - LQT2: low amplitude notched T wave (most common)
  - LQT3: late-onset peaked T wave
  - Torsades de pointes: polymorphic VT with twisting QRS axis
  - Congenital LQTS (channelopathy):
  - LQT1: KCNQ1 mutation (potassium channel), 40-55% of cases
  - LQT2: KCNH2 mutation (potassium channel), 35-45% of cases
  - LQT3: SCN5A mutation (sodium channel), 5-10% of cases
  - Over 15 subtypes total, autosomal dominant inheritance (Romano-Ward), rare autosomal recessive with deafness (Jervell and Lange-Nielsen)
  - Acquired LQTS (medications and electrolytes):
  - Medications: most common cause
  - Antiarrhythmics: sotalol, dofetilide, quinidine, procainamide
  - Antibiotics: macrolides (azithromycin), fluoroquinolones (levofloxacin, moxifloxacin)
  - Antipsychotics: haloperidol, ziprasidone, quetiapine
  - Antidepressants: citalopram, escitalopram, tricyclics
  - Antiemetics: ondansetron
  - Antifungals: fluconazole, ketoconazole
  - Many others (check www.crediblemeds.org)
  - Electrolyte abnormalities: hypokalemia, hypomagnesemia, hypocalcemia
  - Bradycardia: worsens QT prolongation
  - Liquid protein diets, eating disorders
  - Workup:
  - Serial ECGs: QTc can vary, measure multiple times
  - Exercise stress test: paradoxical QT prolongation with exercise suggests LQT1
  - Epinephrine challenge: unmask LQT1
  - Genetic testing: identify mutation in 75% of congenital LQTS
  - Family screening: ECG and genetic testing for first-degree relatives if congenital
  - Schwartz score: clinical criteria for diagnosing congenital LQTS (QTc duration, torsades, syncope, family history)

treatment:
  - Congenital LQTS:
  - Beta blockers (first-line, reduce events 60-70%):
  - Nadolol 1-2 mg/kg/day or propranolol 2-4 mg/kg/day (non-selective beta blockers preferred)
  - Metoprolol less effective (selective)
  - Reduces risk of cardiac events by blocking sympathetic triggers
  - Especially effective in LQT1
  - Continue lifelong even if asymptomatic
  - ICD (implantable cardioverter-defibrillator):
  - Secondary prevention: survived cardiac arrest or torsades
  - Primary prevention: high-risk features (QTc over 500 ms, syncope despite beta blockers, family history sudden death, LQT2 or LQT3)
  - Lifestyle modifications:
  - Avoid QT-prolonging medications (check all new medications)
  - Avoid competitive sports: if symptomatic or very prolonged QTc
  - LQT1: avoid swimming, vigorous exercise
  - LQT2: avoid loud noises (remove alarm clocks, loud telephones)
  - Sodium channel blockers (for LQT3):
  - Mexiletine: shortens QT by blocking late sodium current (specific for LQT3)
  - Left cardiac sympathetic denervation (LCSD):
  - Surgical removal of sympathetic ganglia T1-T4
  - For refractory patients with recurrent events despite beta blockers
  - Reduces arrhythmias 90%
  - Acquired LQTS:
  - Stop offending medication: immediately
  - Correct electrolytes: potassium over 4.5 mEq/L, magnesium over 2 mg/dL
  - Magnesium sulfate 2 grams IV: if torsades occurs (first-line treatment)
  - Overdrive pacing or isoproterenol: shorten QT by increasing heart rate
  - Avoid bradycardia: causes further QT prolongation
  - Family counseling and education:
  - Educate about triggers, medications to avoid
  - Medical alert bracelet
  - Screen siblings and children

clinical_pearls:
  - QTc over 480 ms definite LQTS (or over 500 ms if high risk)
  - Syncope during exercise (LQT1), stress/noise (LQT2), or sleep (LQT3)
  - Beta blockers first-line reduce events 60-70% (nadolol or propranolol)
  - ICD for high-risk patients (survived arrest, syncope despite beta blockers, QTc over 500 ms)
  - Avoid all QT-prolonging medications (check crediblemeds.org)
  - Acquired LQTS from medications most common (stop drug, give magnesium if torsades)
  - Torsades de pointes: polymorphic VT with twisting QRS axis
  - Often misdiagnosed as seizures (convulsions from cerebral hypoperfusion)

differentials:
  - Normal QT interval: under 440 ms (men), under 460 ms (women)
  - Brugada syndrome: different channelopathy, ST elevations in V1-V2, VF at rest
  - Catecholaminergic polymorphic VT: bidirectional VT with exercise, normal QT
  - Vasovagal syncope: benign syncope with trigger, normal ECG

trace: |
  A 16-year-old girl brought to ED after syncopal episode during swim practice. Lost consciousness in pool after vigorous swimming (exercise-induced syncope - classic for LQT1), pulled out by lifeguard, regained consciousness within 30 seconds. Similar episode x1 year ago (also during swimming). No seizure history. Family history: paternal uncle died suddenly at age 19 while playing basketball (sudden cardiac death in young relative - red flag for inherited arrhythmia syndrome). Exam: BP 110/70, HR 65, no murmurs, neurologically intact. ECG: sinus rhythm rate 65 bpm, QT interval 520 ms, RR interval 0.92 sec, QTc = 520 / √0.92 = 542 ms (markedly prolonged, normal under 460 ms for females, over 480 ms diagnostic), broad-based T waves (suggests LQT1 subtype). Diagnosed with suspected congenital long QT syndrome (QTc 542 ms, syncope with exercise especially swimming, family history sudden death, broad T waves suggest LQT1). High risk for torsades de pointes and sudden cardiac death. Admitted for monitoring. Genetic testing sent: identified KCNQ1 mutation (potassium channel, confirms LQT1 - most common subtype 40-55%, exercise-triggered especially swimming). Schwartz score: QTc 542 ms (3 points), syncope with exercise (2 points), family history sudden death (1 point) = 6 points (over 3.5 diagnostic for LQTS). Started nadolol 40 mg daily (non-selective beta blocker first-line treatment, reduces cardiac events 60-70%, especially effective in LQT1). Counseled on lifestyle modifications: no competitive swimming or vigorous exercise (exercise-induced events in LQT1), avoid QT-prolonging medications (provided list from crediblemeds.org), loud noises less concerning in LQT1 (more relevant for LQT2). Risk stratification: QTc 542 ms (over 500 ms high risk), syncope x2 episodes, positive family history. Discussed ICD: secondary prevention not applicable (no cardiac arrest), primary prevention considerations given QTc over 500 ms and recurrent syncope. Decision: trial of beta blocker first, ICD if syncope recurs despite beta blocker therapy. Medical alert bracelet provided. Family screening: parents and younger brother screened with ECG and genetic testing. Father: KCNQ1 mutation positive (same mutation), QTc 485 ms (prolonged but never symptomatic), started nadolol. Brother: KCNQ1 mutation negative (did not inherit mutation), normal QTc 420 ms, no treatment needed. At 3 weeks: repeat ECG on nadolol, QTc decreased to 515 ms (still prolonged but beta blocker may shorten slightly), resting heart rate 55 bpm (beta blockade working). At 3 months: no further syncope, compliant with nadolol, no swimming or vigorous exercise. At 1 year: asymptomatic on nadolol, no episodes. At 2 years: had one episode of presyncope during emotional stress (upset during argument), increased nadolol dose to 80 mg daily. Discussed ICD: recurrent symptoms despite beta blocker plus QTc over 500 ms indicate high risk, ICD implanted for primary prevention. At 3 years: ICD never fired, continues nadolol, excellent quality of life, no competitive sports but active with light exercise. Avoids swimming. Beta blocker and ICD combination protecting against sudden death.
