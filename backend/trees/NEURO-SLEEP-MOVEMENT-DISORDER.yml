tree_id: NEURO-SLEEP-MOVEMENT-DISORDER
name: Sleep-Related Movement Disorder
family: Neurology
specialty: Neurology/Sleep Medicine
chief_complaint: Involuntary movements during sleep causing disrupted sleep or daytime fatigue
description: Group of disorders characterized by simple, stereotyped movements during sleep including periodic limb movements, sleep myoclonus, and other parasomnias affecting sleep quality

icd10: G47.69
snomed: "63593006"

urgency: routine

homeopathy:
  - remedy: "Zincum metallicum 30C"
    indications: "Restless legs, constant movement, twitching, worse evening/night, cannot keep legs still"
  - remedy: "Tarentula hispanica 30C"
    indications: "Restlessness, must keep moving, twitching, jerking, hyperactive, music ameliorates"
  - remedy: "Rhus toxicodendron 30C"
    indications: "Restlessness, cannot stay still, worse at rest, better with motion, leg discomfort"
  - remedy: "Causticum 30C"
    indications: "Restless legs at night, twitching, cramping, weakness, worse cold, better warmth"
  - remedy: "Arsenicum album 30C"
    indications: "Restlessness, anxious, must move about, worse after midnight, burning sensations"

presentations:
  - Periodic limb movements during sleep (repetitive leg jerks every 20-40 seconds)
  - Bed partner reports kicking or jerking movements during sleep
  - Unrefreshing sleep despite adequate time in bed
  - Daytime sleepiness or fatigue
  - Frequent awakenings during night (patient often unaware)
  - Difficulty falling asleep due to limb discomfort (if associated with RLS)
  - Sleep fragmentation visible on polysomnography
  - May have restless legs syndrome symptoms when awake (urge to move legs, worse evening)

workup:
  - Distinguish primary sleep movement disorders: periodic limb movement disorder (PLMD - repetitive limb movements during sleep causing sleep disruption or impairment, patient unaware), restless legs syndrome (RLS - urge to move legs while awake, worse evening/night, relieved by movement, often has PLMS on sleep study), sleep-related rhythmic movement disorder (body rocking, head banging - usually children), sleep-related leg cramps (sudden painful muscle contractions), bruxism (teeth grinding)
  - Detailed sleep history: total sleep time, sleep quality (restorative vs unrefreshing), daytime sleepiness (Epworth Sleepiness Scale score greater than 10 abnormal), witnessed movements during sleep (ask bed partner critical - patient usually unaware), snoring or apneas (rule out sleep apnea), sleep schedule and habits
  - Restless legs syndrome screening (if present): urge to move legs, worse at rest/evening, relieved by movement, disrupts sleep onset, IRLSSG severity scale (0-40 score)
  - Bed partner interview essential: describe movements (leg jerks, body movements, kicking), frequency, duration, timing (early vs late sleep), whether partner disturbed (kicked, bed shaking), snoring or breathing pauses (OSA screening)
  - Assess daytime impact: excessive daytime sleepiness, fatigue, impaired concentration, mood disturbance (irritability, depression), functional impairment (work, driving, relationships)
  - Polysomnography (sleep study) - diagnostic test: overnight in-lab sleep study with extended EMG montage (bilateral anterior tibialis muscles), quantify periodic limb movements (PLMs), PLM index (number of movements per hour - PLMI greater than 15/hour abnormal, greater than 5/hour with symptoms may be significant), assess arousal index (sleep fragmentation), rule out sleep apnea (coexists in 30-40 percent), assess sleep architecture (reduced deep sleep common)
  - PLMD diagnostic criteria: PLMI greater than 15/hour on polysomnography (or greater than 5/hour with associated sleep complaint), movements associated with arousals or sleep disruption, symptoms of unrefreshing sleep or daytime fatigue, not better explained by another sleep disorder
  - Periodic limb movement characteristics: stereotyped movements (dorsiflexion of foot, flexion of knee/hip), duration 0.5-10 seconds, occur in series (4+ movements in sequence), periodicity 5-90 seconds between movements (typically 20-40 seconds), occur primarily in NREM sleep (stage 1 and 2)
  - Rule out secondary causes: iron deficiency (check serum ferritin - low iron worsens RLS/PLMS, target ferritin greater than 50-75 ng/mL), renal disease (uremia worsens RLS, check BUN/creatinine), pregnancy (RLS/PLMS common third trimester, resolves postpartum), medications (SSRIs, SNRIs, antipsychotics, antihistamines worsen RLS/PLMS), peripheral neuropathy, radiculopathy
  - Labs: complete blood count (anemia), serum ferritin (iron stores - if less than 50 ng/mL treat with iron), BUN/creatinine (renal function), TSH (hypothyroidism), blood glucose/HbA1c (diabetes causing neuropathy), vitamin B12 and folate
  - Neurologic exam: usually normal, assess for peripheral neuropathy (decreased sensation, absent ankle reflexes), radiculopathy (straight leg raise), spinal cord lesion (if severe)
  - Screen for comorbid conditions: sleep apnea (snoring, witnessed apneas, obesity, large neck), narcolepsy (excessive sleepiness, cataplexy, sleep paralysis), REM sleep behavior disorder (acting out dreams, especially if older male)

treatment:
  - Treat underlying causes first: iron supplementation if ferritin less than 50-75 ng/mL (ferrous sulfate 325 mg daily or BID on empty stomach with vitamin C, or IV iron infusion if oral not tolerated/absorbed, recheck ferritin in 3 months, may dramatically improve symptoms), discontinue or switch medications worsening symptoms (SSRIs, SNRIs, antihistamines, antipsychotics if possible), treat renal disease, symptoms may resolve postpartum if pregnancy-related
  - Sleep hygiene optimization: regular sleep schedule (same bed/wake times), adequate sleep duration (7-8 hours), avoid alcohol (worsens PLMS), avoid caffeine afternoon/evening, regular exercise (but not close to bedtime), cool comfortable bedroom
  - Dopamine agonists (first-line pharmacologic treatment): pramipexole 0.125-0.5 mg 1-2 hours before bedtime (start low 0.125 mg, increase every few days as needed), ropinirole 0.25-4 mg 1-2 hours before bedtime, rotigotine patch 1-3 mg/24hr (transdermal - may reduce nausea), effective for both RLS and PLMD, reduce movements and improve sleep quality, adverse effects nausea (take with food), orthostatic hypotension, impulse control disorders (gambling, shopping, hypersexuality - rare but monitor), augmentation (worsening of symptoms earlier in day with long-term use - occurs in 30-40 percent)
  - Alpha-2-delta ligands (alternative first-line, especially if neuropathic pain or augmentation concern): gabapentin 300-1800 mg at bedtime (start 300 mg, titrate up), gabapentin enacarbil 600-1200 mg (extended-release formulation), pregabalin 75-450 mg at bedtime, effective for RLS and PLMD, may be better long-term choice (less augmentation than dopamine agonists), adverse effects sedation (may be beneficial for sleep), dizziness, weight gain, avoid in renal impairment
  - Benzodiazepines (alternative if other treatments fail or not tolerated): clonazepam 0.5-2 mg at bedtime, improve sleep continuity without reducing PLM frequency (reduce arousals from movements), risks dependence, daytime sedation, cognitive impairment, avoid in elderly or sleep apnea
  - Treat comorbid sleep disorders: if sleep apnea coexists (common 30-40 percent) - CPAP therapy often improves PLMD (hypoxia worsens movements), if RLS coexists - treat RLS (will improve PLMS)
  - Non-pharmacologic interventions: pneumatic compression devices at bedtime (sequential compression of legs may reduce RLS/PLMS), vibratory pads (counter-stimulation), avoiding triggers (alcohol, caffeine, sleep deprivation, certain medications)
  - Treatment goals: reduce PLM index to less than 15/hour, improve sleep quality (reduce arousals, increase deep sleep), improve daytime function (reduce sleepiness and fatigue), goal not complete elimination of movements but reduction in sleep disruption
  - Follow-up polysomnography: if treatment initiated, consider repeat sleep study after 3-6 months to assess response (PLM index, arousal index, sleep architecture), adjust medications based on response
  - Monitor for augmentation (dopamine agonists): symptoms occurring earlier in day, symptoms more intense, spreading to other body parts (arms), if augmentation occurs - reduce or discontinue dopamine agonist, switch to alpha-2-delta ligand
  - Prognosis: chronic condition but treatable, most patients improve significantly with iron repletion and/or medications, may require long-term treatment, periodic reassessment

clinical_pearls:
  - PLMD diagnosed by polysomnography - PLM index greater than 15/hour (or greater than 5/hour with symptoms)
  - Patient usually unaware of movements - bed partner or sleep study reveals diagnosis
  - Periodic limb movements occur every 20-40 seconds, primarily in NREM sleep
  - Check serum ferritin - if less than 50-75 ng/mL, iron supplementation may dramatically improve symptoms
  - PLMD often coexists with RLS (80 percent of RLS patients have PLMS, but only 30 percent of PLMD have RLS)
  - Sleep apnea coexists in 30-40 percent - treat OSA with CPAP (may improve PLMD)
  - SSRIs, SNRIs, antihistamines, antipsychotics worsen RLS/PLMS - discontinue if possible
  - First-line treatments: iron (if deficient), dopamine agonists (pramipexole, ropinirole), alpha-2-delta ligands (gabapentin, pregabalin)
  - Dopamine agonists risk augmentation (symptoms worsen and occur earlier in day) in 30-40 percent with long-term use
  - Alpha-2-delta ligands may be better long-term choice (less augmentation risk than dopamine agonists)

referrals:
  - Sleep medicine specialist for polysomnography and complex management
  - Neurology if atypical features or concern for neurologic disorder (peripheral neuropathy, radiculopathy, myelopathy)
  - Hematology if severe iron deficiency requiring IV iron infusion
  - Nephrology if renal disease causing uremia-related symptoms

differentials:
  - Restless legs syndrome (urge to move legs while awake, worse evening, relieved by movement, may have PLMS)
  - Obstructive sleep apnea (snoring, witnessed apneas, PLMs may occur but respiratory events primary)
  - Sleep-related leg cramps (sudden painful muscle contractions, not periodic jerks)
  - Periodic limb movements without disorder (PLMI greater than 15/hour but no symptoms or impairment - no treatment needed)
  - REM sleep behavior disorder (acting out dreams, movements complex not stereotyped, in REM sleep)
  - Sleep-related rhythmic movement disorder (body rocking, head banging - usually children)
  - Nocturnal seizures (may have rhythmic movements but EEG epileptiform activity, different pattern)
  - Hypnic jerks (sleep starts - brief single jerks at sleep onset, normal phenomenon)

trace:
  - 52-year-old woman presents with excessive daytime sleepiness and unrefreshing sleep despite sleeping 8 hours nightly x 2 years
  - Chief complaint: "I sleep 8 hours but wake up exhausted every morning. I'm tired all day and struggling at work."
  - Sleep history: goes to bed 10 PM, falls asleep within 15 minutes, sleeps until 6 AM (8 hours total), wakes 3-4 times briefly during night, sleep feels unrefreshing, wakes unrefreshed and fatigued, naps on weekends (1-2 hours), no trouble falling asleep, no snoring per husband, no witnessed apneas
  - Daytime symptoms: excessive daytime sleepiness (Epworth Sleepiness Scale score 16 - abnormal, greater than 10), difficulty concentrating at work, irritable, decreased motivation, "brain fog"
  - "Bed partner interview (husband): reports patient's legs jerk and kick throughout night (has been kicked multiple times), movements occur every 20-30 seconds for periods lasting minutes, occur multiple times per night, husband now sleeps in separate bedroom (movements disturb his sleep), patient completely unaware of movements"
  - "Past medical history: hypothyroidism (well-controlled on levothyroxine), heavy menstrual bleeding x 5 years (menorrhagia)"
  - "Medications: levothyroxine 100 mcg daily, ibuprofen PRN for menstrual cramps"
  - "Social: works as accountant, drinks 1-2 glasses wine nightly, 2 cups coffee morning only"
  - "Family history: mother has restless legs syndrome"
  - "Review of systems: no leg discomfort when awake (no RLS symptoms), no urge to move legs, no symptoms worse in evening"
  - "Exam: vital signs normal, BMI 28 (overweight), neck circumference 14 inches (normal), Mallampati class II, neurologic exam normal (strength, sensation, reflexes intact, no peripheral neuropathy)"
  - "Labs: CBC shows mild anemia (hemoglobin 11.2 g/dL, normal 12-16 for females, MCV 78 fL - microcytic), serum ferritin 18 ng/mL (low, normal 20-200, target greater than 50-75 for RLS/PLMD), TSH 1.8 mIU/L (normal, hypothyroidism well-controlled), creatinine 0.9 mg/dL (normal)"
  - "Assessment: symptoms concerning for periodic limb movement disorder (excessive daytime sleepiness, unrefreshing sleep, witnessed periodic leg jerks during sleep, low ferritin likely contributing), refer for polysomnography"
  - "Polysomnography performed: total sleep time 7.5 hours, sleep efficiency 88 percent (normal), no sleep apnea (AHI 3.2/hour - normal less than 5), periodic limb movements of sleep (PLMS) prominent throughout night, PLM index 42/hour (markedly elevated, normal less than 15), PLMS associated with arousals (arousal index 25/hour - elevated, normal less than 15), reduced stage N3 deep sleep (8 percent of total sleep time, normal 15-25 percent), increased stage N1 light sleep (35 percent)"
  - "Diagnosis: Periodic Limb Movement Disorder (PLMD) with severe PLM index 42/hour causing sleep fragmentation and excessive daytime sleepiness, contributing factor: iron deficiency (ferritin 18 ng/mL)"
  - "Treatment plan: Iron supplementation with ferrous sulfate 325 mg (65 mg elemental iron) daily on empty stomach with orange juice (vitamin C enhances absorption) to treat iron deficiency which worsens PLMS; Sleep hygiene counseled to eliminate alcohol (worsens PLMS), maintain regular sleep schedule and adequate sleep duration; Pharmacologic treatment with pramipexole 0.125 mg at 9 PM started (1 hour before bedtime, dopamine agonist first-line for PLMD), instructed may increase to 0.25 mg after 1 week if needed; Referred to gynecology for heavy menstrual bleeding (ongoing iron loss source)"
  - "Follow-up 2 weeks: tolerating pramipexole 0.125 mg (mild nausea first few days resolved), sleep quality subjectively improved, less frequent awakenings, feeling slightly more rested, husband reports movements decreased, increased pramipexole to 0.25 mg at bedtime"
  - "Follow-up 6 weeks: dramatic improvement, sleep quality much better, waking refreshed most mornings, daytime sleepiness significantly reduced (Epworth score now 8 - normal), concentration and mood improved, husband confirms movements markedly reduced (no longer kicked out of bedroom)"
  - Pramipexole dose 0.25 mg effective, no adverse effects
  - "Labs repeated: hemoglobin improved to 12.8 g/dL (normal), ferritin improved to 48 ng/mL (improved but still target greater than 50-75, continue iron supplementation)"
  - "Gynecology treated menorrhagia: started oral contraceptive pill (reduce menstrual bleeding and prevent recurrent iron deficiency)"
  - "3-month follow-up: sustained improvement, sleep quality excellent, no daytime sleepiness, functioning normally at work, ferritin 62 ng/mL (therapeutic range), continued pramipexole 0.25 mg nightly and iron supplementation"
  - "Repeat polysomnography 6 months: PLM index reduced to 12/hour (normal less than 15, down from 42/hour), arousal index 10/hour (normal, down from 25/hour), stage N3 deep sleep improved to 18 percent (normal), sleep architecture normalized"
  - "1-year follow-up: continues on pramipexole 0.25 mg nightly (stable dose), sleep quality excellent, no daytime symptoms, ferritin maintained greater than 60 ng/mL, discontinued iron supplementation (menorrhagia controlled on oral contraceptive, ferritin stable), no augmentation (symptoms not occurring earlier or worsening)"
  - "Patient states: \"I can't believe the difference. I didn't realize my sleep was so disrupted. Now I wake up refreshed and have energy all day. My husband is happy too - he's back in our bedroom!\""
  - "Plan: continue pramipexole long-term, monitor for augmentation (symptoms earlier in day or worsening), annual ferritin checks, repeat sleep study if symptoms recur or worsen"
