tree_id: NEU-MILD-COGNITIVE-IMPAIRMENT
name: Mild Cognitive Impairment
family: Neurology
specialty: Neurology/Geriatrics
chief_complaint: Subjective cognitive complaints with objective impairment but preserved daily function
description: Intermediate stage between normal aging and dementia, characterized by cognitive decline greater than expected for age and education but without significant functional impairment in daily activities

icd10: G31.84
snomed: "386806002"

urgency: routine

homeopathy:
  - remedy: "Phosphoricum acidum 30C"
    indications: "Mental exhaustion, difficulty concentrating, forgetfulness, apathy after mental strain"
  - remedy: "Kali phosphoricum 30C"
    indications: "Brain fatigue, memory weakness, mental exhaustion from overwork, nervous exhaustion"
  - remedy: "Anacardium orientale 30C"
    indications: "Memory loss, confusion, lacks confidence, forgets what about to say"
  - remedy: "Lycopodium 200C"
