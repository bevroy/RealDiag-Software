  - remedy: "Baryta carbonica 30C"
    indications: "Memory loss in elderly, slow comprehension, loss of confidence, childishness"

presentations:
  - Memory complaints (patient or family noticed)
  - Word-finding difficulty
  - Difficulty concentrating
  - Forgetting appointments or recent conversations
  - Losing items more frequently
  - Taking longer to complete complex tasks
  - Needing to make lists or reminders more than before
  - Preserved independence in daily activities
  - Insight into deficits (unlike dementia)
  - Worried about developing dementia

workup:
  - Diagnostic criteria for MCI: subjective cognitive complaint (patient or informant), objective cognitive impairment on testing (below age/education norms), preserved independence in daily activities (ADLs/IADLs intact or minimal impairment), not demented (multiple domains not severely impaired)
  - Distinguish from normal aging and dementia: normal aging (occasional forgetfulness, no objective impairment on testing), MCI (objective impairment but ADLs preserved), dementia (multiple domains impaired, significant ADL/IADL decline)
  - History from patient AND informant: onset and progression, functional abilities (finances, medications, driving, work, hobbies), medications (anticholinergics can impair cognition), family history (dementia), vascular risk factors, mood (depression can mimic MCI)
  - Cognitive screening: Montreal Cognitive Assessment (MoCA 18-25 suggests MCI, more sensitive than MMSE), Mini-Mental State Exam (MMSE may be normal 27-30 in MCI - not sensitive enough), clock draw test, verbal fluency tests
  - MCI subtypes: amnestic MCI (memory primarily affected - higher risk progression to Alzheimer disease 10-15 percent/year), non-amnestic MCI (language, executive, or visuospatial primarily - may progress to other dementias like Lewy body or frontotemporal)
  - Rule out reversible causes: hypothyroidism (TSH), vitamin B12 deficiency (B12, methylmalonic acid), depression (PHQ-9 score, may coexist with MCI), sleep disorders (sleep apnea causes cognitive impairment), medication effects (benzodiazepines, anticholinergics, opioids)
  - Labs: CBC, CMP, TSH, vitamin B12, consider RPR if risk factors, HIV if risk factors, vitamin D level
  - MRI brain: identify vascular disease (white matter changes, prior strokes increase dementia risk), medial temporal lobe atrophy (suggests early Alzheimer disease), rule out tumor or subdural hematoma
  - Formal neuropsychological testing: comprehensive assessment of all cognitive domains (memory, language, executive function, visuospatial, attention), establish baseline for monitoring progression, more sensitive than bedside screening, identify specific domain impairment
  - Advanced biomarkers (research or specialized centers): CSF analysis (amyloid-beta 42 low, tau elevated suggests Alzheimer disease pathology - higher progression risk), amyloid PET imaging (positive amyloid predicts progression to Alzheimer dementia), APOE genotyping not recommended routinely (APOE-ε4 increases risk but not diagnostic)
  - Longitudinal monitoring: repeat cognitive testing annually or if decline noted (MoCA, MMSE), reassess functional status (ADLs/IADLs), 10-15 percent per year progress from MCI to dementia (amnestic MCI highest risk), some remain stable or even improve (especially if reversible cause addressed)

treatment:
  - No FDA-approved medications for MCI, focus on modifiable risk factors and monitoring for progression
  - Address reversible causes: treat hypothyroidism (levothyroxine), replete vitamin B12 if deficient (1000 mcg daily or monthly injections), treat depression (SSRI - sertraline, escitalopram), treat sleep apnea (CPAP), discontinue cognitive-impairing medications (benzodiazepines, anticholinergics, opioids if possible)
  - Vascular risk factor optimization (especially if white matter disease on MRI): blood pressure control (target less than 130/80), statin for hyperlipidemia (atorvastatin 20-40 mg or simvastatin 40 mg), diabetes control (HbA1c target 7-8 percent in elderly), smoking cessation, antiplatelet therapy if prior stroke/TIA
  - Lifestyle interventions (strongest evidence): regular exercise (150 minutes/week moderate aerobic activity reduces dementia risk 30-40 percent), cognitive training (brain games, learning new skills), social engagement (reduces isolation), Mediterranean diet or MIND diet (emphasizes vegetables, berries, nuts, olive oil, fish, whole grains)
  - Supplements (limited evidence but low harm): vitamin E 2000 IU daily (possible benefit in Alzheimer disease, use caution if on anticoagulation), omega-3 fatty acids (DHA/EPA 1-2 grams daily), B-complex vitamins if low normal B12
  - Cholinesterase inhibitors NOT recommended for MCI: large trials (donepezil in MCI) showed no benefit in delaying progression to dementia, FDA not approved, risks outweigh benefits (GI side effects, bradycardia)
  - Cognitive rehabilitation: compensatory strategies (calendars, smartphone reminders, lists, routines), occupational therapy evaluation for cognitive aids
  - Treat comorbid conditions: depression common in MCI (30-50 percent) treat with SSRI, anxiety (CBT, consider SSRI, avoid benzodiazepines), insomnia (sleep hygiene, consider melatonin 3-5 mg, trazodone 25-50 mg, avoid diphenhydramine)
  - Monitor for progression: annual or biannual visits with cognitive testing (MoCA), reassess functional status, watch for conversion to dementia (15-20 percent/year for amnestic MCI)
  - Early planning: discuss prognosis (risk of progression to dementia), encourage advance directives while patient has capacity, power of attorney designation, consider driving evaluation if concerns

clinical_pearls:
  - MCI is intermediate stage - cognitive impairment greater than normal aging but ADLs preserved (not dementia)
  - 10-15 percent per year progress from MCI to dementia (amnestic MCI highest risk for Alzheimer disease)
  - MoCA more sensitive than MMSE for detecting MCI (MMSE often normal in MCI)
  - Formal neuropsychological testing helpful to confirm diagnosis and establish baseline
  - No FDA-approved medications for MCI, cholinesterase inhibitors not beneficial
  - Focus on modifiable risk factors: exercise, cognitive stimulation, social engagement, vascular risk factor control
  - Mediterranean diet and regular exercise have strongest evidence for reducing dementia risk
  - Some MCI remains stable or even reverts to normal (20-30 percent), especially if reversible cause
  - Depression common in MCI and can worsen cognition - screen and treat
  - Encourage advance care planning while patient still has capacity

referrals:
  - Neurology or geriatrics for initial evaluation (especially if rapid decline or young age)
  - Neuropsychology for formal cognitive testing (confirm diagnosis, establish baseline, identify specific deficits)
  - Psychiatry if comorbid depression, anxiety, or complex behavioral issues
  - Occupational therapy for cognitive rehabilitation and compensatory strategies
  - Social work for community resources, support groups, advance care planning assistance
  - Sleep medicine if sleep apnea suspected (cognitive impairment from poor sleep)

differentials:
  - Normal aging (occasional forgetfulness, no objective impairment on testing, functional abilities intact)
  - Dementia (multiple domains significantly impaired, ADL/IADL dependence, lacks insight)
  - Depression (pseudodementia - poor effort on testing, pervasive sadness, improves with antidepressants)
  - Delirium (acute onset, fluctuating, inattention, identifiable cause - infection, medications)
  - Medication side effects (benzodiazepines, anticholinergics, opioids)
  - Sleep disorders (sleep apnea causes daytime cognitive impairment - improves with CPAP)
  - Hypothyroidism (fatigue, weight gain, cognitive slowing - responds to thyroid replacement)
  - Vitamin B12 deficiency (macrocytic anemia, neuropathy - responds to supplementation)

trace:
  - 68-year-old retired teacher presents with concerns about memory x 1 year, reports forgetting names, misplacing keys, word-finding difficulty, worried about Alzheimer disease
  - Patient reports: repeats herself more, forgets what went to room for, writes everything down now (never needed lists before), took longer to learn new phone, still managing all activities independently (drives, pays bills, cooks, manages medications), no getting lost
  - Past medical history: hypertension, hyperlipidemia, well-controlled
  - Medications: lisinopril 20 mg daily, atorvastatin 40 mg nightly
  - Family history: father had Alzheimer disease diagnosed age 76
  - Social: lives with husband, exercises 3 times/week (walks), active in church and book club, no depression
  - Exam: alert, oriented, pleasant, cooperative, MMSE 28/30 (lost 2 points on delayed recall), clock draw normal, MoCA 23/26 (lost points on delayed recall 2/5 words, trails, fluency)
  - Assessment: objective cognitive impairment on MoCA despite normal MMSE, primarily memory domain affected (amnestic MCI), ADLs/IADLs fully independent
  - Labs: TSH 1.8 mIU/L (normal), vitamin B12 425 pg/mL (normal), CBC and CMP normal, lipids well-controlled (LDL 78 mg/dL on statin)
  - MRI brain: mild bilateral hippocampal volume loss (greater than expected for age), scattered periventricular white matter hyperintensities (mild), no stroke or mass
  - Formal neuropsychological testing: confirmed amnestic MCI (memory domain 1.5 SD below age norms), other domains relatively preserved, consistent with possible early Alzheimer disease pathology
  - Diagnosis: Mild Cognitive Impairment, amnestic type (at risk for progression to Alzheimer disease 10-15 percent/year)
  - Discussed prognosis: explained MCI, risk of progression to dementia, also noted 20-30 percent remain stable or improve, importance of modifiable risk factors
  - "Management plan: Lifestyle interventions to continue regular exercise (increase to 30 min daily if possible), cognitive stimulation (continue book club, consider brain training apps), social engagement (continue church activities), Mediterranean diet counseling; Vascular risk factors with BP and lipids already well-controlled on current medications, continue statin and antihypertensive; Vitamin E 400 IU daily (discussed limited evidence, patient elected to try), omega-3 fatty acids 1 gram daily; No cholinesterase inhibitor (not FDA-approved for MCI, no proven benefit); Compensatory strategies to use smartphone calendar with reminders, keep keys in designated spot, lists for shopping"
  - Advance care planning: encouraged advance directives, power of attorney while still has capacity, discussed importance of planning ahead
  - Monitoring plan: follow-up every 6 months with repeat MoCA, assess for functional decline (conversion to dementia), reassess if any acute decline
  - 6-month follow-up: MoCA stable at 24/26, functionally unchanged (still fully independent), adhering to Mediterranean diet, exercising 5 days/week, enrolled in online brain training program, no depression (PHQ-9 score 2)
  - 12-month follow-up: MoCA 22/26 (declined 2 points), still independent in all ADLs/IADLs but husband reports more repetition, forgets conversations more often, still manages finances but husband double-checks, referred back to neuropsychology for repeat formal testing
  - Repeat neuropsychological testing 15 months: memory decline progressing (now 2 SD below norms), beginning to show mild executive dysfunction, remains below dementia threshold
  - 18-month follow-up: MoCA 20/26, now requiring some assistance with complex tasks (husband helps with bills), discussed that appears to be progressing, trial of donepezil 5 mg nightly (now meets criteria for mild dementia rather than MCI), continued lifestyle interventions, increased monitoring to every 3-4 months

