tree_id: CARDS-CHRONIC-VENOUS-INSUFFICIENCY
name: Chronic Venous Insufficiency
family: cardiology
specialty: Cardiology
icd10: I87.2
snomed: 48723007
urgency: routine
homeopathy: []
presentations:
  - Leg heaviness, aching, or cramping
  - Symptoms worse at end of day or prolonged standing
  - Symptoms improve with leg elevation
  - Lower extremity edema (ankle/calf)
  - Varicose veins
  - Skin changes - hyperpigmentation (hemosiderin deposition)
  - Lipodermatosclerosis (skin induration, inverted champagne bottle appearance)
  - Atrophie blanche (white atrophic skin with telangiectasias)
  - Corona phlebectatica (fan of small veins at ankle)
  - Venous stasis ulcers (typically medial malleolus)
  - Pruritus
workup:
  - Clinical diagnosis based on history and physical examination
  - Venous duplex ultrasound to confirm diagnosis and assess anatomy
  - Evaluate for deep venous reflux (>0.5 seconds) and obstruction
  - Map superficial and perforator vein incompetence
  - Rule out DVT if acute symptoms
  - Ankle-brachial index to exclude arterial disease before compression therapy
  - Consider D-dimer if acute DVT suspected
  - Wound culture if ulcer present with signs of infection
treatment:
  - Compression therapy (cornerstone of treatment)
  - Graduated compression stockings 30-40 mmHg (knee-high usually sufficient)
  - Multi-layer compression bandaging for active ulcers
  - Leg elevation above heart level 30 minutes TID-QID
  - Exercise - walking program, calf muscle pumps
  - Weight loss if overweight
  - Skin care - moisturize, avoid trauma
  - Ulcer care - debridement, moist wound healing, compression
  - Pentoxifylline 400mg TID may help ulcer healing
  - Diuretics generally not helpful (unless systemic fluid overload)
  - Venoactive drugs (diosmin, horse chestnut) limited evidence
  - Interventional therapy for refractory symptoms or recurrent ulcers
  - Endovenous thermal ablation (laser or radiofrequency) for saphenous reflux
  - Sclerotherapy for telangiectasias and small varicose veins
  - Phlebectomy for large varicose veins
  - Perforator vein ablation if incompetent
  - Venous stenting for iliac vein obstruction (May-Thurner syndrome)
clinical_pearls:
  - CEAP classification - Clinical, Etiologic, Anatomic, Pathophysiologic staging system
  - Venous ulcers represent most severe form (CEAP C6)
  - Compression contraindicated if ABI <0.8 (arterial disease)
  - Compliance with compression therapy is key challenge (hot, uncomfortable)
  - Recurrence rate high (>50% at 5 years) without compression maintenance
  - Post-thrombotic syndrome occurs in 20-50% after DVT
  - Unilateral edema more likely venous; bilateral suggests systemic cause
  - Check for secondary causes - DVT history, May-Thurner syndrome, tumor compression
  - Lipodermatosclerosis can mimic cellulitis but is non-infectious
  - Venous ulcers typically painless unless infected or arterial component
referrals:
  - Vascular surgery for refractory symptoms or venous ulcers despite conservative therapy
  - Interventional radiology for endovenous ablation procedures
  - Wound care specialist for complex or non-healing venous ulcers
  - Dermatology for skin complications or diagnostic uncertainty
differentials:
  - Primary venous insufficiency (valvular incompetence)
  - Secondary venous insufficiency (post-thrombotic syndrome)
  - Lymphedema (non-pitting, dorsal foot involvement, no skin color changes)
  - Arterial insufficiency (ulcers on toes/dorsum, painful, absent pulses)
  - Lipedema (bilateral, spares feet, tender, family history)
  - Heart failure (bilateral, other cardiac symptoms)
  - Renal disease (periorbital edema, proteinuria)
  - Medication-induced edema (calcium channel blockers)
