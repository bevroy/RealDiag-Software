tree_id: ENDO-HYPOCALCEMIA
name: Hypocalcemia
family: endocrinology
specialty: Endocrinology
icd10: E83.51
snomed: 5291005
urgency: []
homeopathy: []
presentations:
  - Perioral numbness and paresthesias (fingers, toes)
  - Muscle cramps and tetany
  - Carpopedal spasm (Trousseau sign - BP cuff inflation causes hand spasm)
  - Facial twitching (Chvostek sign - tap facial nerve causes facial spasm)
  - Seizures (severe hypocalcemia)
  - Laryngospasm (life-threatening)
  - Prolonged QT interval on ECG (risk of arrhythmias)
  - Chronic hypocalcemia: dry skin, brittle nails, cataracts, dental abnormalities
  - May be asymptomatic if mild or chronic
workup:
  - Serum calcium levels
  - Total calcium (normal 8.5-10.5 mg/dL)
  - Ionized (free) calcium - most accurate, not affected by albumin (normal 4.5-5.5 mg/dL)
  - Correct calcium for albumin: Corrected Ca = measured Ca + 0.8 × (4.0 - albumin)
  - Determine etiology
  - PTH level (intact PTH)
  - Low PTH: hypoparathyroidism (post-surgical, autoimmune, genetic)
  - High PTH: vitamin D deficiency, chronic kidney disease, pseudohypoparathyroidism
  - 25-hydroxyvitamin D level (assess vitamin D status)
  - Magnesium level (hypomagnesemia causes hypocalcemia)
  - Phosphate level (high in hypoparathyroidism, low in vitamin D deficiency)
  - Renal function (BUN, creatinine) - CKD common cause
  - Albumin level (for correction calculation)
  - ECG - prolonged QTc interval, arrhythmias
  - Consider: alkaline phosphatase, 1,25-dihydroxyvitamin D, 24-hour urine calcium
treatment:
  - Acute symptomatic hypocalcemia (emergency)
  - IV calcium gluconate 1-2 grams (10-20 mL of 10% solution) over 10-20 minutes
  - May repeat if persistent symptoms
  - Followed by continuous calcium infusion (50-100 mL calcium gluconate in 1 L D5W over 8-12 hours)
  - Cardiac monitoring due to arrhythmia risk
  - Correct hypomagnesemia first (IV magnesium sulfate 2 g) - calcium won't correct without adequate magnesium
  - Chronic or mild hypocalcemia (outpatient)
  - Oral calcium supplementation: calcium carbonate 1000-1500 mg elemental calcium TID with meals
  - Vitamin D supplementation
  - Ergocalciferol (vitamin D2) 50,000 IU weekly if deficiency
  - Calcitriol (1,25-dihydroxyvitamin D) 0.25-0.5 mcg BID if hypoparathyroidism
  - Magnesium supplementation if low (magnesium oxide 400 mg daily)
  - Treat underlying cause
  - Hypoparathyroidism: high-dose calcium + calcitriol lifelong
  - Vitamin D deficiency: vitamin D repletion
  - CKD: phosphate binders, calcitriol, manage CKD-MBD
  - Monitor calcium, phosphate, magnesium levels regularly
clinical_pearls:
  - "Hypocalcemia symptoms: 'CATS' - Convulsions, Arrhythmias, Tetany, Spasm"
  - "Chvostek sign: tap facial nerve → facial twitch (75% sensitive)"
  - "Trousseau sign: BP cuff inflation → carpopedal spasm (94% specific for hypocalcemia)"
  - "Prolonged QT interval on ECG - risk of torsades de pointes"
  - "Hypomagnesemia causes hypocalcemia that won't correct until Mg repleted"
  - "Post-thyroidectomy hypocalcemia common - transient damage to parathyroids"
  - "Vitamin D deficiency most common cause of hypocalcemia in outpatients"
  - "CKD causes hypocalcemia via reduced 1,25-vitamin D production and hyperphosphatemia"
referrals:
  - Emergency department if severe symptoms (tetany, seizures, laryngospasm)
  - Endocrinology for all cases to determine etiology and long-term management
  - Nephrology if chronic kidney disease present
differentials:
  - Hypoparathyroidism (low PTH) - post-surgical, autoimmune, genetic
  - Vitamin D deficiency (high PTH, low 25-OH vitamin D)
  - Chronic kidney disease (high PTH, low 1,25-vitamin D, high phosphate)
  - Hypomagnesemia (impairs PTH secretion and action)
  - Pseudohypoparathyroidism (PTH resistance, high PTH, genetic)
  - Acute pancreatitis (calcium sequestration)
  - Medications (bisphosphonates, denosumab, cinacalcet, foscarnet)
  - Hungry bone syndrome (after parathyroidectomy)
  - Citrate toxicity (massive blood transfusions)
trace:
  source: Endocrine Society Clinical Practice Guidelines on Hypoparathyroidism 2022
  version: '1.0'
  last_updated: '2025-12-26'
