presentations:
  - elevated prolactin
  - galactorrhea, amenorrhea (women)
  - erectile dysfunction, decreased libido (men)
  - headaches, visual field defects
  - pituitary adenoma on MRI
differentials:
  - Medication-induced hyperprolactinemia
  - Hypothyroidism
  - Pregnancy
  - Stalk effect from other tumor
workup:
  - Prolactin level (fasting, no breast stimulation, ideally morning) - repeat if elevated (stress/exercise can elevate)
  - If prolactin >100 ng/mL, check macroprolactin (biotin interference or high-dose hook effect)
  - 'Pituitary MRI with contrast: Microadenoma <1cm (80% of women), macroadenoma ≥1cm (60% of men)'
  - Visual fields if macroadenoma (assess for optic chiasm compression)
  - 'Other pituitary hormones if macroadenoma: TSH, free T4, LH/FSH, testosterone/estradiol, IGF-1, 8 AM cortisol'
treatment:
  - 'Guideline-based treatment options for Prolactinoma include:'
  - 'Medical therapy (first-line): Cabergoline 0.25-0.5mg twice weekly (dopamine agonist, better tolerated than bromocriptine) (ADA 2024)'
  - Bromocriptine 2.5-15mg daily if cabergoline unavailable - more side effects (nausea, orthostatic hypotension) (ADA 2024)
  - 'Goal: Normalize prolactin, restore gonadal function, shrink tumor (70-90% tumor shrinkage with cabergoline) (ADA 2024)'
  - 'Surgery (transsphenoidal) if: Medical therapy fails, drug intolerant, or visual field defects requiring urgent decompression (ADA 2024)'
  - 'Pregnancy: Can stop cabergoline once pregnant (usually safe, tumor rarely grows during pregnancy) (ADA 2024)'
clinical_pearls:
  - Most common functional pituitary tumor (40% of all pituitary adenomas)
  - 'Prolactin level correlates with adenoma size: <100 ng/mL (often stalk effect), 100-200 (micro or macro), >200 (prolactinoma likely)'
  - 'Stalk effect: Any pituitary mass can elevate prolactin by compressing stalk (interrupts dopamine inhibition)'
  - 'Medications causing hyperprolactinemia: Antipsychotics (risperidone, haloperidol), metoclopramide, SSRIs - rule out first'
  - Men present later with larger tumors (macroadenomas) - lack obvious symptoms until mass effect
red_flags: []
