tree_id: NEPHRO-NEPHROTIC
name: Nephrotic Syndrome
family: Nephrology
specialty: Nephrology
icd10:
- N04.9
snomed:
- '52254009'
urgency: medium
description: Comprehensive evaluation and management of Nephrotic Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Massive proteinuria (>3.5 g/day)
- Hypoalbuminemia
- Edema (periorbital, pedal)
- Hyperlipidemia
- Frothy urine
workup:
- 24-hour urine protein or spot urine protein-to-creatinine ratio (>3.5g/day or >3.0)
- Serum albumin (<3.0 g/dL)
- Lipid panel (elevated cholesterol, triglycerides)
- Renal biopsy (definitive diagnosis, determines specific glomerular disease)
- 'Consider: Hepatitis B/C serologies, ANA, complement levels, SPEP/UPEP (amyloid,
  myeloma)'
treatment:
- 'Guideline-based treatment options for Nephrotic Syndrome include:'
- 'Treat edema: Diuretics (furosemide 40-80mg daily), sodium restriction <2g/day (KDIGO
  2024)'
- ACEi or ARB (reduce proteinuria) (KDIGO 2024)
- Statins for hyperlipidemia (KDIGO 2024)
- Anticoagulation if albumin <2.5 (high VTE risk) (KDIGO 2024)
- 'Primary glomerular disease: Steroids (minimal change), immunosuppression (FSGS,
  membranous) (KDIGO 2024)'
clinical_pearls:
- 'Classic tetrad: Proteinuria >3.5g/day, hypoalbuminemia <3.0, edema, hyperlipidemia'
- 'Most common primary causes: Minimal change disease (children), FSGS, membranous
  nephropathy (adults)'
- 'Secondary causes: Diabetes (most common overall), amyloidosis, lupus, NSAIDs, infections
  (HIV, hepatitis)'
- 'Hypercoagulable state: Loss of antithrombin III → increased VTE risk'
- 'Minimal change disease: Responds to steroids (95% remission), most common in children'
referrals:
- Nephrology for all nephrotic syndrome (renal biopsy, management)
- Consider renal biopsy if not responsive to initial therapy or unclear etiology
differentials: []
