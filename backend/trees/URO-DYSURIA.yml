tree_id: URO-DYSURIA
name: Dysuria (Painful Urination)
family: urology
specialty: Urology/Primary Care
icd10: R30.0
snomed: 49650001
urgency: []
homeopathy: []
presentations:
  - Burning or pain with urination
  - External dysuria (pain at urethral meatus or vulva as urine passes) - suggests vulvovaginitis or genital lesions
  - Internal dysuria (pain in suprapubic area or deep in pelvis) - suggests bladder or urethral pathology
  - Urinary urgency and frequency often accompany dysuria
  - Hematuria may be present
  - May have vaginal discharge, genital lesions, or urethral discharge
  - Fever suggests upper tract infection (pyelonephritis)
workup:
  - History to localize cause
  - Onset (sudden vs gradual), duration, severity
  - External vs internal dysuria
  - Associated symptoms: frequency, urgency, hematuria, fever, vaginal discharge, urethral discharge
  - Sexual history (new partner, unprotected sex, dyspareunia)
  - Recent procedures (catheterization, cystoscopy)
  - Urinalysis (ESSENTIAL)
  - Pyuria (WBCs): infection or inflammation
  - Bacteriuria: infection
  - Hematuria: infection, stones, malignancy
  - Nitrites: bacterial UTI (Gram-negative bacteria)
  - Urine culture if pyuria present or recurrent UTIs
  - Identify organism and antibiotic susceptibilities
  - Physical examination
  - Abdominal exam: suprapubic tenderness suggests cystitis
  - Costovertebral angle tenderness: pyelonephritis
  - Women: pelvic exam to assess for vaginitis, cervicitis, genital lesions
  - Men: genital exam for urethral discharge, epididymal tenderness
  - STI testing if sexually active
  - Gonorrhea and chlamydia nucleic acid amplification test (NAAT) - urine or swab
  - Trichomonas testing
  - Herpes simplex virus culture if genital ulcers
  - HIV testing if risk factors
  - Pregnancy test in women of childbearing age
  - Consider imaging if complicated UTI or recurrent infections
  - Renal ultrasound or CT to rule out stones, obstruction, abscess
treatment:
  - Treat based on underlying cause
  - Uncomplicated cystitis (simple UTI) in women
  - Nitrofurantoin 100 mg twice daily for 5 days (first-line)
  - Trimethoprim-sulfamethoxazole DS twice daily for 3 days (if local resistance less than 20%)
  - Fosfomycin 3 g single dose
  - Avoid fluoroquinolones for simple cystitis (reserve for complicated infections)
  - Phenazopyridine 200 mg three times daily for 1-2 days (urinary analgesic for symptom relief)
  - Urethritis (STI-related)
  - Gonorrhea: ceftriaxone 500 mg IM single dose
  - Chlamydia: doxycycline 100 mg twice daily for 7 days or azithromycin 1 g single dose
  - Treat empirically for both if either suspected
  - Treat sexual partners
  - Trichomonas: metronidazole 2 g single dose or 500 mg twice daily for 7 days
  - Genital herpes: acyclovir 400 mg three times daily for 7-10 days or valacyclovir 1 g twice daily for 7-10 days
  - Vaginitis
  - Bacterial vaginosis: metronidazole 500 mg twice daily for 7 days or metronidazole gel 0.75% intravaginally for 5 days
  - Candida vulvovaginitis: fluconazole 150 mg single dose or topical azole cream
  - Interstitial cystitis/bladder pain syndrome
  - Multimodal treatment: diet modification, pelvic floor therapy, oral medications (pentosan polysulfate, amitriptyline)
  - Prostatitis in men
  - Fluoroquinolone (ciprofloxacin 500 mg twice daily or levofloxacin 500 mg daily) for 4-6 weeks
  - Urethral syndrome (sterile pyuria, negative cultures)
  - Trial of doxycycline 100 mg twice daily for 7 days (may have fastidious organisms)
  - Supportive care for all causes
  - Increase oral fluids
  - Avoid bladder irritants (caffeine, alcohol, spicy foods)
  - Phenazopyridine for symptomatic relief
clinical_pearls:
  - "Dysuria most commonly from urinary tract infection (50-60%), urethritis (STI), or vaginitis"
  - "External dysuria (pain at urethral opening) suggests vulvovaginitis or herpes - examine external genitalia"
  - "Internal dysuria (deep pelvic pain) suggests cystitis or urethritis"
  - "Sterile pyuria (WBCs without bacteria) suggests urethritis from chlamydia, tuberculosis, or interstitial cystitis"
  - "Always consider STIs in sexually active patients with dysuria and negative urine culture"
  - "Phenazopyridine provides rapid symptom relief but does NOT treat infection - must give antibiotics"
  - "Recurrent dysuria in women: consider interstitial cystitis, urethral syndrome, or recurrent UTIs"
  - "Dysuria in men always warrants workup - less common than women, higher concern for STI or prostatitis"
referrals:
  - Urology if recurrent UTIs (3 or more per year), hematuria, or concern for malignancy
  - Urology if chronic dysuria without clear cause (interstitial cystitis)
  - Gynecology for chronic vaginitis or pelvic pain
  - STI clinic or infectious disease if treatment-resistant STI
differentials:
  - Urinary tract infection/cystitis (dysuria, frequency, urgency, pyuria, bacteriuria)
  - Urethritis (STI: gonorrhea, chlamydia - urethral discharge, dysuria, pyuria, positive NAAT)
  - Vaginitis (vaginal discharge, external dysuria, vaginal exam abnormal)
  - Genital herpes (painful genital ulcers, external dysuria)
  - Prostatitis in men (pelvic pain, dysuria, tender prostate)
  - Interstitial cystitis/bladder pain syndrome (chronic pelvic pain, frequency, urgency, sterile urine)
  - Urethral syndrome (dysuria, sterile pyuria, negative cultures)
  - Kidney stone (flank pain, hematuria, colicky pain)
  - Bladder cancer (hematuria, dysuria, older age, smoking)
