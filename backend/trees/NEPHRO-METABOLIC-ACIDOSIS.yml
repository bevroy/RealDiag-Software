tree_id: NEPHRO-METABOLIC-ACIDOSIS
name: Metabolic Acidosis
family: Nephrology
specialty: Nephrology
icd10:
- E87.2
snomed:
- '12499000'
urgency: medium
description: Comprehensive evaluation and management of Metabolic Acidosis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Kussmaul respirations (deep, rapid breathing to blow off CO2)
- Confusion, lethargy, nausea
- Low serum bicarbonate (<22 mEq/L), low pH (<7.35)
- 'Anion gap (AG) = Na - (Cl + HCO3): Normal 8-12'
- 'High AG: MUDPILES (Methanol, Uremia, DKA, Propylene glycol, Isoniazid, Lactic acidosis,
  Ethylene glycol, Salicylates)'
- 'Normal AG (hyperchloremic): Diarrhea, RTA, ureteral diversion'
workup:
- ABG (pH, pCO2, HCO3)
- Basic metabolic panel (calculate anion gap)
- Lactate (if lactic acidosis suspected)
- Glucose, ketones (DKA), toxicology screen
- Osmolar gap if toxic ingestion suspected
treatment:
- 'Guideline-based treatment options for Metabolic Acidosis include:'
- 'Treat underlying cause: Insulin for DKA, fluids/pressors for shock, dialysis for
  uremia (KDIGO 2024)'
- 'Sodium bicarbonate: Only if pH <7.1 or severe hyperkalemia (KDIGO 2024)'
- 'Toxins: Fomepizole for ethylene glycol/methanol, dialysis for severe (KDIGO 2024)'
- Aggressive fluid resuscitation if lactic acidosis from shock (KDIGO 2024)
- Monitor serial ABG, electrolytes (K+ shifts with bicarb treatment) (KDIGO 2024)
clinical_pearls:
- Always calculate anion gap to narrow differential
- 'High AG acidosis: Think toxins, ketones, lactate, uremia'
- 'Lactic acidosis: Type A (tissue hypoxia - sepsis, shock) vs Type B (metformin,
  malignancy)'
- 'DKA: High glucose, high AG, positive ketones'
- Treat underlying cause, not just pH (bicarb only if pH <7.1 or severe hyperkalemia)
referrals:
- ICU if severe (pH <7.1) or hemodynamically unstable
- Nephrology if uremic or renal etiology
- Toxicology if ingestion suspected
differentials:
  - Lactic acidosis
  - DKA
  - RTA
  - Diarrhea
  - Renal failure
trace:
  source: 'Kidney Disease: Improving Global Outcomes (KDIGO) Guidelines, American
    Society of Nephrology (ASN)'
  version: 0.1.0
