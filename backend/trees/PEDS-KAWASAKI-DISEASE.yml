tree_id: PEDS-KAWASAKI-DISEASE
name: Kawasaki Disease
family: Pediatrics
specialty: Pediatrics
chief_complaint: High fever and red eyes in child
description: Acute vasculitis of childhood causing prolonged fever, conjunctivitis, rash, mucositis, and lymphadenopathy. Complication is coronary artery aneurysms in 25% if untreated. IVIG plus aspirin within 10 days prevents cardiac complications, most common cause of acquired heart disease in children.
icd10: M30.3
urgency: emergent

workup:
  - Clinical diagnosis: fever 5 or more days plus at least 4 of 5 principal criteria
  - Fever: high (above 39-40°C), lasting at least 5 days, unresponsive to antibiotics
  - Five principal criteria (need 4 of 5):
  - Bilateral non-purulent conjunctivitis: red eyes, limbic sparing, no discharge
  - Oral mucosa changes: red cracked lips, strawberry tongue, diffuse oral/pharyngeal erythema
  - Polymorphous rash: diffuse erythematous, maculopapular, can be scarlatiniform or targetoid
  - Extremity changes: erythema and edema of hands/feet (acute), periungual desquamation (subacute 2-3 weeks)
  - Cervical lymphadenopathy: at least one node over 1.5 cm, usually unilateral
  - Incomplete Kawasaki: fewer than 4 criteria but echocardiogram shows coronary abnormalities (especially infants under 1 year)
  - Age: peak 1-2 years, 80% under age 5, rare over 8 years or in adults
  - Coronary artery complications: aneurysms in 25% if untreated, reduced to 5% with IVIG
  - Phases:
  - Acute (0-10 days): fever, conjunctivitis, rash, lymphadenopathy
  - Subacute (11-21 days): desquamation, thrombocytosis, aneurysm formation
  - Convalescent (22 days to months): normalization, aneurysms may persist
  - Labs:
  - Elevated inflammatory markers: ESR, CRP markedly elevated
  - Thrombocytosis: platelets typically over 450000 (peaks in week 2-3, can exceed 1 million)
  - Anemia: normocytic anemia of inflammation
  - Leukocytosis: WBC elevated with left shift
  - Elevated transaminases: mild hepatitis (50%)
  - Sterile pyuria: WBC in urine without infection (60-80%)
  - Hypoalbuminemia, hyponatremia
  - Baseline echocardiogram: assess for coronary artery dilatation or aneurysms
  - Repeat echo at 2 weeks and 6-8 weeks

treatment:
  - IVIG (intravenous immunoglobulin): 2 g/kg single infusion over 10-12 hours
  - Give within 10 days of fever onset (ideally day 5-7) to prevent coronary aneurysms
  - Reduces aneurysm risk from 25% to 5%
  - High-dose aspirin: 80-100 mg/kg/day divided QID during acute phase (anti-inflammatory)
  - Switch to low-dose aspirin: 3-5 mg/kg daily (antiplatelet) after fever resolves for 48 hours
  - Continue low-dose aspirin for 6-8 weeks if no coronary abnormalities
  - Continue low-dose aspirin indefinitely if coronary aneurysms present
  - IVIG-resistant (10%): persistent or recurrent fever 36 hours after IVIG
  - Second dose IVIG: 2 g/kg
  - Corticosteroids: methylprednisolone 2 mg/kg/day or pulse therapy 10-30 mg/kg
  - Infliximab (anti-TNF): 5 mg/kg IV for refractory cases
  - Coronary artery aneurysms: anticoagulation if giant aneurysms (over 8 mm), warfarin or LMWH
  - Cardiology follow-up: long-term monitoring if coronary abnormalities
  - Influenza vaccine: important (children on aspirin at risk for Reye syndrome with influenza)
  - Hold varicella vaccine for 11 months after IVIG (immunoglobulin interferes)

clinical_pearls:
  - Fever 5+ days with conjunctivitis, rash, mucositis, and hand/foot changes in young child
  - Most common cause of acquired heart disease in children in developed countries
  - IVIG 2 g/kg plus aspirin within 10 days prevents coronary aneurysms
  - Reduces aneurysm risk from 25% to 5% with treatment
  - Thrombocytosis peaks week 2-3 (platelets can exceed 1 million)
  - Periungual desquamation (fingertip peeling) at 2-3 weeks classic
  - Infants under 1 year at highest risk for aneurysms and incomplete presentation
  - Sterile pyuria common (60-80%) - WBC in urine without infection

differentials:
  - Scarlet fever: strep pharyngitis, sandpaper rash, responds to antibiotics, no conjunctivitis
  - Measles: prodromal cough, coryza, conjunctivitis (3 Cs), Koplik spots
  - Adenovirus: conjunctivitis and fever, but shorter duration, no mucositis or hand changes
  - Stevens-Johnson syndrome: targetoid rash, mucosal involvement, medication trigger
  - Toxic shock syndrome: hypotension, multiorgan dysfunction, more severe

trace: |
  A 2-year-old boy presented with 6 days of high fever (40°C) unresponsive to antibiotics (started amoxicillin on day 3 by PCP). Parents noticed red eyes x4 days (bilateral non-purulent conjunctivitis), red cracked lips, red bumpy rash all over body x3 days, and swollen red hands and feet x2 days. Irritable, decreased oral intake. No cough or rhinorrhea. Exam showed ill-appearing toddler, temperature 39.8°C, bilateral non-purulent conjunctivitis with limbic sparing, red cracked lips, strawberry tongue (red with prominent papillae), diffuse erythematous maculopapular rash on trunk and extremities, edema and erythema of hands and feet, right cervical lymph node 2 cm. No murmur. Labs: WBC 18500 with left shift, Hgb 10.2 (anemia), platelets 380000 (will increase to over 1 million in week 2-3), ESR 88, CRP 92 (markedly elevated), ALT 78, albumin 2.8, sodium 132. Urinalysis: 20 WBC (sterile pyuria), negative culture. Diagnosed with Kawasaki disease (fever 6 days plus 5 of 5 criteria: conjunctivitis, oral changes, rash, extremity changes, lymphadenopathy - classic presentation). URGENT echocardiogram: normal coronary arteries (no aneurysms yet). Admitted immediately. Started IVIG 2 g/kg (28 kg = 56 g) infused over 12 hours on day 6 of illness (within critical 10-day window). High-dose aspirin 80 mg/kg/day (2240 mg divided QID = 560 mg QID). At 24 hours after IVIG fever resolved, dramatic improvement (typical response). At 48 hours afebrile, irritability resolved, eating better. Switched to low-dose aspirin 3-5 mg/kg daily (100 mg daily antiplatelet dose). Discharged on day 8. At 2 weeks follow-up: periungual desquamation of fingers and toes (fingertips peeling - classic subacute finding), platelets 920000 (thrombocytosis peak), echocardiogram normal coronaries (IVIG prevented aneurysms). At 6 weeks echo still normal. Discontinued aspirin at 8 weeks. Annual cardiology follow-up. Influenza vaccine given (important on aspirin to prevent Reye syndrome). Hold varicella vaccine for 11 months post-IVIG.
