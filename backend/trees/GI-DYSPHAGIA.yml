tree_id: GI-DYSPHAGIA
name: Dysphagia (Difficulty Swallowing)
family: gastroenterology
specialty: Gastroenterology
icd10: R13.10
snomed: 40739000
urgency: []
homeopathy: []
presentations:
  - Difficulty initiating swallowing or food "getting stuck"
  - Sensation of food lodging in chest or throat
  - Oropharyngeal dysphagia (difficulty initiating swallow, coughing, choking, nasal regurgitation)
  - Esophageal dysphagia (food stops or sticks after swallowing)
  - Solids only suggests mechanical obstruction
  - Solids and liquids suggests motility disorder
  - Progressive symptoms suggest malignancy or stricture
  - Intermittent symptoms suggest esophageal rings or eosinophilic esophagitis
  - Associated symptoms: odynophagia (painful swallowing), weight loss, regurgitation
workup:
  - Detailed history to distinguish oropharyngeal vs esophageal dysphagia
  - Oropharyngeal: neurologic exam, speech/swallow evaluation
  - Esophageal: upper endoscopy (EGD) is first-line
  - EGD visualizes mucosa, identifies strictures, masses, inflammation, rings
  - Obtain biopsies even if mucosa appears normal (rule out eosinophilic esophagitis)
  - Barium esophagram useful if stricture, motility disorder, or anatomic abnormality suspected
  - Esophageal manometry if normal EGD and barium study (diagnose motility disorders)
  - Modified barium swallow (videofluoroscopy) for oropharyngeal dysphagia
  - CT neck/chest if mass lesion suspected
  - Laboratory tests: CBC (anemia from malignancy), iron studies if indicated
treatment:
  - Treatment directed at underlying cause
  - Mechanical obstruction (stricture, tumor, ring)
  - Endoscopic dilation for benign strictures (peptic, radiation, post-surgical)
  - Schatzki ring: dilation or incision
  - Esophageal cancer: multidisciplinary oncology care, possible stenting
  - Eosinophilic esophagitis: topical steroids (swallowed fluticasone or budesonide), dietary elimination
  - Motility disorders
  - Achalasia: pneumatic dilation, Heller myotomy, or peroral endoscopic myotomy (POEM)
  - Diffuse esophageal spasm: calcium channel blockers, nitrates, botulinum toxin
  - Oropharyngeal dysphagia: speech therapy, dietary modifications (thickened liquids)
  - GERD-related: PPI therapy (omeprazole 20-40 mg daily)
  - Supportive measures
  - Small bites, thorough chewing, adequate fluid with meals
  - Avoid dry, sticky, or tough foods if mechanical obstruction
  - Nutritional support if significant weight loss or aspiration risk
clinical_pearls:
  - "Dysphagia is ALARM symptom - always requires evaluation, especially if progressive or with weight loss"
  - "Oropharyngeal dysphagia: immediate coughing/choking (neurologic or structural)"
  - "Esophageal dysphagia: delayed sensation of food stuck in chest"
  - "Solids only → mechanical obstruction; solids and liquids → motility disorder"
  - "Progressive dysphagia → malignancy or stricture; intermittent → rings or eosinophilic esophagitis"
  - "Odynophagia (painful swallowing) suggests infection (CMV, HSV, Candida), pill esophagitis, or cancer"
  - "Eosinophilic esophagitis increasing - young males, food impaction, atopic history"
  - "Achalasia: dysphagia to solids and liquids from onset, regurgitation, chest pain"
referrals:
  - Gastroenterology for upper endoscopy and further evaluation
  - Speech-language pathology for oropharyngeal dysphagia and swallow evaluation
  - Otolaryngology if structural oropharyngeal abnormality suspected
  - Cardiothoracic surgery for achalasia (Heller myotomy) or esophageal cancer
  - Oncology if esophageal malignancy diagnosed
differentials:
  - Esophageal stricture (peptic, radiation, caustic injury, post-surgical)
  - Esophageal rings and webs (Schatzki ring, Plummer-Vinson syndrome)
  - Esophageal cancer (progressive dysphagia, weight loss, GERD history)
  - Eosinophilic esophagitis (food impaction, atopy, esophageal rings on endoscopy)
  - Achalasia (failure of LES relaxation, bird-beak appearance on barium study)
  - Gastroesophageal reflux disease (chronic reflux causing stricture)
  - Esophageal motility disorders (diffuse spasm, ineffective motility, scleroderma)
  - Oropharyngeal dysphagia (stroke, Parkinson's, myasthenia gravis, ALS)
  - Infectious esophagitis (Candida, CMV, HSV in immunocompromised)
  - Medication-induced (pill esophagitis from bisphosphonates, NSAIDs, tetracyclines)
trace:
  source: ACG Clinical Guidelines on Esophageal Dysphagia 2020, AGA Guidelines on Eosinophilic Esophagitis
  version: '1.0'
  last_updated: '2025-12-26'

