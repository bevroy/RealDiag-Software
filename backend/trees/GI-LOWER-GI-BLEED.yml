tree_id: GI-LOWER-GI-BLEED
name: Lower Gastrointestinal Bleeding
family: gastroenterology
specialty: Gastroenterology
icd10: K62.5
snomed: 37674008
urgency: []
homeopathy: []
presentations:
  - Hematochezia (bright red blood per rectum)
  - Maroon stools
  - Melena (if slow upper GI bleed with prolonged transit time)
  - Acute vs chronic bleeding
  - Acute: hemodynamic instability, large volume bleeding
  - Chronic: occult bleeding, iron deficiency anemia
  - Abdominal pain (suggests ischemia, IBD, or diverticulitis)
  - Change in bowel habits
  - Prior history of diverticulosis, hemorrhoids, or IBD
workup:
  - Hemodynamic assessment - vital signs, orthostatic hypotension
  - Volume resuscitation with IV fluids if hemodynamically unstable
  - Laboratory tests: CBC, type and screen/crossmatch, coagulation studies, BMP
  - Nasogastric lavage or upper endoscopy to rule out upper GI source if severe bleeding
  - Colonoscopy - diagnostic and therapeutic modality of choice
  - Perform after adequate bowel prep (rapid purge with 4-6 L PEG)
  - Can identify source and provide hemostasis (clips, injection, cautery)
  - CT angiography if bleeding too brisk for colonoscopy or colonoscopy non-diagnostic
  - Requires active bleeding >0.5 mL/min for detection
  - Can guide interventional radiology or surgical planning
  - Tagged RBC scan if bleeding rate 0.1-0.5 mL/min (slower bleeding)
  - Capsule endoscopy or push enteroscopy for small bowel source if negative colonoscopy
treatment:
  - Resuscitation and stabilization
  - IV access (2 large-bore IVs), crystalloid resuscitation
  - Blood transfusion if Hgb <7 g/dL (or <8 if cardiovascular disease)
  - Correct coagulopathy - vitamin K, FFP, platelets as needed
  - Discontinue anticoagulants, antiplatelets if possible
  - Specific management based on etiology
  - Diverticular bleeding: endoscopic hemostasis (epinephrine injection, clips, cautery)
  - Angiodysplasia: endoscopic cautery (APC, bipolar, heater probe)
  - Hemorrhoids: medical management usually sufficient, rarely requires intervention
  - Ischemic colitis: supportive care, bowel rest, antibiotics if severe
  - IBD: treat underlying disease, consider biologics or immunosuppression
  - Colorectal cancer: surgical resection
  - Interventional radiology - selective mesenteric angiography with embolization
  - If endoscopy fails or patient unstable for endoscopy
  - Surgery - last resort for uncontrolled bleeding
  - Segmental resection if source localized
  - Subtotal colectomy if source unknown and life-threatening bleeding
clinical_pearls:
  - "Most common causes: diverticulosis (30-40%), angiodysplasia (20-30%), ischemic colitis (10-20%)"
  - "80-85% of lower GI bleeds stop spontaneously"
  - "Diverticular bleeding typically painless, sudden onset, large volume"
  - "Angiodysplasia more common in elderly, chronic kidney disease, aortic stenosis"
  - "Ischemic colitis: sudden onset crampy abdominal pain followed by bloody diarrhea"
  - "Always rule out upper GI source first - 10-15% of hematochezia is from upper GI bleed"
  - "Aspirin and NSAIDs increase bleeding risk but are not causative of lower GI bleed"
  - "Colonoscopy within 24 hours improves source identification and allows intervention"
referrals:
  - Emergency department if hemodynamically unstable or severe bleeding
  - Gastroenterology for urgent colonoscopy
  - Interventional radiology if endoscopy unsuccessful and ongoing bleeding
  - General Surgery if uncontrolled bleeding requiring surgical intervention
differentials:
  - Diverticular bleeding (most common, painless, sudden large volume)
  - Angiodysplasia (vascular ectasia, elderly, chronic kidney disease)
  - Ischemic colitis (abdominal pain, bloody diarrhea, watershed areas)
  - Inflammatory bowel disease (Crohn's, ulcerative colitis - chronic bloody diarrhea)
  - Hemorrhoids (bright red blood on tissue, perianal pain or itching)
  - Colorectal polyps or cancer (chronic bleeding, anemia, weight loss, change in bowel habits)
  - Infectious colitis (diarrhea, fever, travel history)
  - Radiation proctitis (history of pelvic radiation)
  - Upper GI bleeding (10-15% present as hematochezia if brisk bleeding)
  - Meckel's diverticulum (young patients, painless bleeding)
trace:
  source: ACG Clinical Guidelines on Lower GI Bleeding 2016, AGA Guidelines on Acute Lower GI Bleeding
  version: '1.0'
