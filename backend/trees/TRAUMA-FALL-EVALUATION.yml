tree_id: TRAUMA-FALL-EVALUATION
name: Fall (Evaluation)
family: emergency
specialty: Emergency Medicine, Geriatrics, Primary Care
chief_complaint: Fall, mechanical fall
description: |
  Systematic evaluation after fall to identify injuries and determine fall etiology.
  In elderly, falls may indicate medical issue (syncope, stroke, infection) rather than mechanical fall.
icd10: Z91.81
snomed: "161898004"
presentations:
  - History of fall
  - Patient complaint of pain or inability to ambulate
  - May have visible trauma
  - Fall circumstances important - witnessed, prodrome, loss of consciousness
urgency: High
referrals:
  emergency:
    - Altered mental status
    - Suspected fracture (hip, vertebral, other)
    - Head injury with anticoagulation
    - Fall with loss of consciousness
  geriatrics:
    - Recurrent falls
    - Need for comprehensive fall assessment
workup:
  fall_history:
    - Mechanical (trip, slip) vs medical (syncope, dizziness, weakness)
    - Prodromal symptoms - chest pain, palpitations, dizziness, confusion
    - Loss of consciousness
    - Ability to get up
    - Witnessed vs unwitnessed
  trauma_assessment:
    - Head examination - scalp laceration, hematoma
    - Spine tenderness
    - Extremities - pain, deformity, limited range of motion
    - Imaging based on findings
  medical_evaluation_if_non_mechanical:
    - Vital signs including orthostatic blood pressures
    - Cardiac exam and ECG - arrhythmia, MI
    - Neurologic exam - stroke signs, weakness, balance
    - Medication review - polypharmacy, sedating medications, antihypertensives
    - Labs if concern for medical cause - CBC, BMP, glucose, troponin
  fall_risk_assessment:
    - Prior falls
    - Gait and balance (Timed Up and Go test)
    - Vision
    - Environmental hazards (rugs, stairs, lighting)
    - Assistive device use
treatment:
  treat_injuries:
    - Fractures - splint, orthopedic referral
    - Lacerations - repair
    - Head injury - observation, imaging
  address_medical_causes:
    - Treat arrhythmia, syncope, stroke, infection
    - Adjust medications if contributing
    - Orthostatic hypotension - increase fluids, compression stockings, adjust medications
  fall_prevention:
    - Physical therapy for gait and balance training
    - Home safety evaluation
    - Vitamin D supplementation
    - Assistive device (cane, walker)
    - Hip protectors in nursing home residents
    - Medication review and deprescribing
clinical_pearls:
  - In elderly, fall may be presenting symptom of serious medical condition (MI, stroke, sepsis, PE)
  - Always ask about prodromal symptoms and loss of consciousness
  - Mechanical fall is diagnosis of exclusion
  - Hip fracture - patient may be able to walk with impacted fracture
  - Head CT indicated if on anticoagulation, high-energy fall, focal neurologic signs
  - Recurrent falls (>2 per year) require comprehensive assessment
  - Polypharmacy major risk factor - especially sedatives, antihypertensives
differentials:
  - Mechanical fall (trip, slip)
  - Syncope
  - Orthostatic hypotension
  - Arrhythmia
  - Stroke or TIA
  - Seizure
  - Medication side effect
  - Infection causing delirium
  - Hypoglycemia
trace:
  - 78-year-old with history of 3 falls in past month. Most recent fall from tripping on rug. No loss of consciousness. Hip X-ray negative. Gait unsteady. On 12 medications including sedatives. Diagnose recurrent falls. Refer to physical therapy for balance training. Medication review - discontinue sedating medications. Home safety assessment. Vitamin D 2000 IU daily. No further falls after interventions.
citations:
  - American Geriatrics Society Falls Guidelines
  - CDC STEADI (Stopping Elderly Accidents, Deaths & Injuries)
  - UpToDate - Geriatrics
