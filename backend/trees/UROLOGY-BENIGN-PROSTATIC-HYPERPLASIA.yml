tree_id: UROLOGY-BENIGN-PROSTATIC-HYPERPLASIA
name: Benign Prostatic Hyperplasia (BPH)
family: Nephrology
specialty: Urology
applies_to: male
chief_complaint: Urinary frequency, weak stream, nocturia
description: Non-malignant enlargement of prostate gland causing lower urinary tract symptoms
icd10: N40.0
snomed: 266569009
presentations:
  - Weak urinary stream and nocturia
  - Weak stream and nocturia
  - Weak urinary stream
  - Nocturia
  - Urinary frequency and nocturia
  - Hesitancy and weak stream
  - Difficulty starting urination
  - Incomplete bladder emptying
  - BPH symptoms
  - Benign prostatic hyperplasia
  - Enlarged prostate symptoms
  - Obstructive symptoms: hesitancy, weak stream, incomplete emptying
  - Irritative symptoms: frequency, urgency, nocturia
  - Enlarged prostate on DRE
  - Gradual onset
  - No hematuria, weight loss
urgency: routine
referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Lower urinary tract symptoms (LUTS) assessment
  - Obstructive/voiding symptoms - hesitancy, weak stream, straining, intermittency, incomplete emptying, terminal dribbling
  - Irritative/storage symptoms - frequency, urgency, nocturia, urge incontinence
  - International Prostate Symptom Score (IPSS) questionnaire (0-35 points)
  - Mild 0-7, Moderate 8-19, Severe 20-35
  - Quality of life score (0-6, how bothersome)
  - Digital rectal examination (DRE) - assess prostate size, consistency, nodules
  - Enlarged smooth prostate (may be normal size despite symptoms)
  - Urinalysis - rule out infection, hematuria
  - Post-void residual (PVR) volume - bladder ultrasound or catheterization
  - Normal less than 50 mL, elevated greater than 200 mL indicates retention
  - Serum PSA (prostate-specific antigen) - rule out prostate cancer
  - Elevated PSA can be from BPH, prostatitis, or cancer
  - PSA greater than 4.0 ng/mL or abnormal DRE warrants urology referral
  - Serum creatinine if concern for obstructive uropathy
  - Uroflowmetry - measures maximum flow rate (Qmax normal greater than 15 mL/s)
  - Urodynamic studies if diagnosis uncertain or considering surgery
  - Cystoscopy if hematuria, suspected urethral stricture, or pre-operative evaluation
  - Renal ultrasound if elevated creatinine or hydronephrosis suspected
treatment:
  - Watchful waiting for mild symptoms (IPSS less than 8) not bothersome
  - Lifestyle modifications - limit fluids before bed, reduce caffeine/alcohol, timed voiding, double voiding
  - Medical management for moderate-severe symptoms
  - Alpha-1 blockers (first-line for symptom relief) - onset 2-4 weeks
  - Tamsulosin 0.4 mg daily, alfuzosin 10 mg daily, silodosin 8 mg daily (selective)
  - Terazosin 1-10 mg at bedtime, doxazosin 1-8 mg daily (non-selective, more hypotension)
  - Side effects - orthostatic hypotension, dizziness, retrograde ejaculation
  - 5-alpha reductase inhibitors (shrink prostate, prevent progression) - onset 3-6 months
  - Finasteride 5 mg daily or dutasteride 0.5 mg daily
  - Reduces prostate volume 20-30%, decreases PSA by 50%
  - Side effects - decreased libido, erectile dysfunction, ejaculatory dysfunction
  - Combination therapy (alpha-blocker plus 5-ARI) for large prostates greater than 40 grams
  - Superior to monotherapy for preventing progression and acute urinary retention
  - Phosphodiesterase-5 inhibitors - tadalafil 5 mg daily (if concomitant ED)
  - Anticholinergics for predominant irritative symptoms (use cautiously, may worsen retention)
  - Minimally invasive procedures
  - Prostatic urethral lift (UroLift) - implants hold lobes open
  - Water vapor thermal therapy (Rezum) - steam ablation
  - Surgical management for refractory symptoms, recurrent retention, recurrent UTI, bladder stones, renal insufficiency from obstruction
  - Transurethral resection of prostate (TURP) - gold standard, 75-96% symptom improvement
  - Holmium laser enucleation (HoLEP) - for large prostates
  - Simple prostatectomy (open or robotic) - for very large prostates greater than 80-100 grams
  - Perioperative alpha-blocker before catheter removal
clinical_pearls:
  - Prevalence increases with age - 50% by age 60, 90% by age 85
  - Histological BPH present in 50% of men by age 50, but only 50% develop symptoms
  - BPH is proliferation of stromal and epithelial cells in transition zone of prostate
  - PSA velocity (rate of change) more important than absolute value
  - 5-ARIs decrease PSA by approximately 50% - double the PSA value for cancer screening
  - Acute urinary retention occurs in 1-2% per year with untreated BPH
  - Bladder outlet obstruction can lead to detrusor hypertrophy, diverticula, stones, hydronephrosis
  - Avoid anticholinergics, antihistamines, decongestants - can precipitate retention
  - Hematuria in BPH patient requires evaluation to rule out bladder cancer or stones
  - Post-TURP syndrome - hyponatremia from glycine irrigation absorption (rare with modern techniques)
differentials:
  - Prostate cancer (abnormal DRE, elevated PSA, biopsy confirmation)
  - Prostatitis (acute pain, fever, tender prostate, elevated WBC)
  - Urethral stricture (history of instrumentation, gonorrhea, trauma)
  - Bladder cancer (painless hematuria, cytology positive)
  - Overactive bladder (urgency/frequency without obstruction, normal flow rate)
  - Neurogenic bladder (diabetes, spinal cord injury, MS, abnormal urodynamics)
  - Bladder stone (irritative symptoms, hematuria, stone on imaging)
  - Medication-induced retention (anticholinergics, antihistamines, decongestants)
trace:
  - 67-year-old man presents with 2-year history of worsening urinary symptoms
  - Frequent urination every 2-3 hours during day, waking 3-4 times per night to urinate
  - Weak urinary stream, hesitancy before starting urination, feeling of incomplete bladder emptying
  - Symptoms progressively worsening, significantly affecting quality of life and sleep
  - No hematuria, no dysuria, no fever
  - Past medical history - hypertension well-controlled on amlodipine
  - No history of prostate issues, no family history prostate cancer
  - Physical exam - vitals normal, abdomen soft non-distended, no suprapubic tenderness
  - DRE - prostate enlarged (estimated 50 grams), smooth, no nodules, non-tender
  - IPSS questionnaire completed - score 18 (moderate symptoms)
  - Quality of life score 4 (mostly dissatisfied)
  - Urinalysis - normal, no blood, no WBCs, no bacteria
  - Post-void residual (bladder ultrasound) - 125 mL (elevated)
  - PSA 3.2 ng/mL (mildly elevated for age but in range given prostate size)
  - Serum creatinine 1.0 mg/dL (normal)
  - Uroflowmetry - maximum flow rate 9 mL/s (reduced, normal greater than 15)
  - Diagnosis - Benign prostatic hyperplasia with moderate LUTS
  - Treatment plan discussed, patient desires medical management
  - Started tamsulosin 0.4 mg daily (alpha-blocker)
  - Given large prostate size (greater than 40 grams), also started finasteride 5 mg daily (5-ARI)
  - Combination therapy to improve symptoms and prevent progression
  - Lifestyle modifications discussed - limit evening fluids, reduce caffeine
  - PSA will decrease approximately 50% on finasteride (important for future cancer screening)
  - 4-week follow-up - improvement in stream, less hesitancy
  - Nocturia decreased to 2 times per night
  - Mild dizziness with standing (alpha-blocker side effect), advised to rise slowly
  - 3-month follow-up - significant improvement in symptoms
  - IPSS score now 9 (mild-moderate), quality of life score 2 (mostly satisfied)
  - Nocturia 1-2 times per night, stronger stream
  - PVR decreased to 50 mL (normal)
  - 1-year follow-up - sustained improvement on combination therapy
  - IPSS 7 (mild), nocturia 1 time per night
  - PSA decreased to 1.6 ng/mL (50% reduction as expected with finasteride)
  - No erectile dysfunction or other side effects
  - Continue current regimen, annual monitoring
  - Outcome - Excellent response to combination medical therapy, avoidance of surgery

