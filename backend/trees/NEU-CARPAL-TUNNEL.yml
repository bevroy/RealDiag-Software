tree_id: NEU-CARPAL-TUNNEL
name: Carpal Tunnel Syndrome
family: Neurology
specialty: Neurology/Orthopedics/Hand Surgery
chief_complaint: Hand numbness, tingling, and pain, worse at night, in median nerve distribution
description: Compression neuropathy of the median nerve at the wrist within the carpal tunnel, causing sensory symptoms and weakness in median nerve distribution

icd10: G56.00
snomed: "57406009"

urgency: routine

homeopathy:
  - remedy: "Hypericum perforatum 200C"
    indications: "Nerve pain, tingling, shooting pains along nerve distribution, numbness, injury to nerve-rich areas"
  - remedy: "Ruta graveolens 30C"
    indications: "Wrist pain, tendon strain, overuse injury, worse with movement, stiffness"
  - remedy: "Arnica montana 30C"
    indications: "Trauma, overuse, bruised soreness, worse with touch or movement"
  - remedy: "Causticum 30C"
    indications: "Progressive weakness, numbness, burning pain, worse in cold, better with warmth"
  - remedy: "Rhus toxicodendron 30C"
    indications: "Stiffness worse after rest, better with continued motion, numbness, worse damp weather"

presentations:
  - Hand numbness and tingling (paresthesias) in median nerve distribution (thumb, index, middle, and radial half of ring finger)
  - Nocturnal symptoms (awakens from sleep with numbness)
  - Shaking hand provides relief (flick sign)
  - Weakness of thumb (difficulty with pinch, dropping objects)
  - Pain radiating to forearm or shoulder
  - Worse with repetitive hand activities (typing, gripping)
  - Thenar atrophy (severe cases)
  - Symptoms bilateral in 50 percent of cases
  - Occupational exposure (repetitive wrist flexion/extension)

workup:
  - Clinical diagnosis: classic triad of nocturnal paresthesias in median nerve distribution, positive provocative tests, symptom relief with hand shaking
  - Median nerve sensory distribution: palmar surface of thumb, index, middle, and radial half of ring finger, NOT dorsum of hand (dorsal branch spares carpal tunnel), spares thenar eminence sensation (palmar cutaneous branch proximal to tunnel)
  - Tinel sign: tap over median nerve at wrist (volar wrist crease) - positive if produces tingling in median distribution (sensitivity 50 percent, specificity 75 percent)
  - Phalen test: wrist flexion for 60 seconds (hold wrists together in prayer position reversed) - positive if reproduces symptoms (sensitivity 75 percent, specificity 47 percent)
  - Carpal compression test: direct pressure over carpal tunnel 30 seconds - positive if symptoms (most sensitive test 87 percent)
  - Reverse Phalen (wrist extension): less sensitive than flexion
  - Durkan test: thumb pressure over median nerve 30 seconds
  - Thenar muscle strength: thumb abduction (abductor pollicis brevis - APB), opposition (touch thumb to pinky), compare to contralateral side, weakness suggests severe compression
  - Sensory testing: two-point discrimination on fingertips (normal less than 5 mm), light touch median vs ulnar distribution
  - Inspect for thenar atrophy (muscle wasting at base of thumb - indicates chronic severe compression)
  - Nerve conduction studies (NCS) and EMG: confirm diagnosis, assess severity, rule out other neuropathies, prolonged median sensory latency (most sensitive finding), prolonged median motor latency (more severe), compare median to ulnar nerve (internal control), normal NCS does not exclude CTS if symptoms classic (clinical diagnosis sufficient)
  - Indications for NCS/EMG: atypical symptoms, weak or absent provocative tests, pre-surgical planning, assess severity, rule out cervical radiculopathy or polyneuropathy, median and ulnar comparison, thenar denervation on EMG (chronic severe)
  - X-ray wrist not routine: consider if trauma, limited range of motion, or suspect arthritis
  - Ultrasound median nerve: enlarged median nerve (cross-sectional area greater than 10 mm² at tunnel inlet), flattening within tunnel, becoming more common (sensitivity/specificity similar to NCS)
  - MRI wrist rarely needed: if mass lesion suspected, wrist anatomy abnormality
  - Risk factors: pregnancy (third trimester fluid retention), diabetes mellitus, hypothyroidism, rheumatoid arthritis, obesity, repetitive hand use, wrist fracture/trauma, female sex, age 40-60, hemodialysis, acromegaly

treatment:
  - Conservative management (mild to moderate): wrist splinting at night (neutral position 0-5 degrees extension, wear nightly x 6-12 weeks - effective 80 percent mild cases), avoid aggravating activities (repetitive wrist flexion/extension, prolonged gripping), ergonomic modifications (keyboard position, wrist rests, neutral wrist posture), weight loss if obese, glycemic control if diabetic
  - Corticosteroid injection: methylprednisolone 40 mg or triamcinolone 20 mg with 1 mL lidocaine into carpal tunnel (inject proximal to wrist crease, ulnar to palmaris longus tendon, 45-degree angle), relief 75-80 percent but temporary (median 3-4 months), can repeat if effective, avoid injection directly into nerve
  - Oral corticosteroids: prednisone 20 mg daily x 10-14 days (alternative to injection), less effective than injection but may be tried
  - NSAIDs: limited evidence of benefit (ibuprofen 400-600 mg TID, naproxen 500 mg BID), may help pain but do not improve nerve compression
  - Gabapentin or pregabalin: limited evidence (not first-line), consider if neuropathic pain prominent despite other treatment
  - Physical/occupational therapy: nerve gliding exercises, tendon gliding, stretching, may provide symptom relief
  - Surgical release (carpal tunnel release - CTR): definitive treatment for moderate-severe, persistent symptoms despite conservative care, thenar weakness or atrophy, or patient preference for definitive treatment
  - Surgical indications: failed conservative treatment 3-6 months, moderate-severe on NCS, thenar weakness/atrophy, progressive symptoms, constant numbness (not just nocturnal)
  - Surgical technique: divide transverse carpal ligament (open release or endoscopic release - similar outcomes), success rate 75-90 percent, recovery 6-12 weeks, endoscopic may have faster return to work (1-2 weeks vs 4-6 weeks), open technique better visualization
  - Post-surgical: immediate finger range of motion, splint x 1-2 weeks, avoid heavy lifting x 4-6 weeks, expect improvement within days to weeks (pain relief first, numbness may take months especially if chronic severe)
  - Prognosis: excellent for acute/subacute cases, may have residual symptoms if chronic severe compression (axonal loss), recurrence rare (less than 5 percent)

clinical_pearls:
  - Carpal tunnel syndrome is most common compression neuropathy (affects 3-6 percent of adults)
  - Classic presentation: nocturnal hand numbness that awakens patient, relieved by shaking hand (flick sign)
  - Median nerve distribution spares dorsum of hand and thenar eminence sensation
  - Phalen test (wrist flexion 60 seconds) and carpal compression test most useful provocative tests
  - Thenar weakness or atrophy indicates severe chronic compression requiring surgery
  - Night splinting (neutral wrist position) effective first-line treatment for mild-moderate cases
  - Corticosteroid injection provides temporary relief (median 3-4 months), can repeat
  - Nerve conduction studies confirm diagnosis but normal NCS does not exclude CTS if classic symptoms
  - Surgical release (carpal tunnel release) is definitive treatment - success rate 75-90 percent
  - Bilateral symptoms common (50 percent), assess both hands even if unilateral complaint

referrals:
  - Hand surgeon or orthopedic hand specialist for surgical evaluation (if failed conservative treatment, moderate-severe, thenar weakness)
  - Neurology if diagnosis uncertain, atypical symptoms, or need nerve conduction studies
  - Occupational therapy for splinting, ergonomic evaluation, nerve gliding exercises
  - Physical medicine and rehabilitation (physiatry) for injection or conservative management
  - Rheumatology if underlying inflammatory arthritis suspected

differentials:
  - Cervical radiculopathy (C6-C7 - neck pain, radiates to shoulder/arm, involves dorsum of hand, reflex changes, positive Spurling test)
  - Pronator syndrome (median nerve compression at forearm - pain with forearm pronation, tenderness over pronator teres, no nocturnal symptoms)
  - Peripheral neuropathy (stocking-glove distribution, bilateral symmetric, involves feet, diabetes or other systemic cause)
  - Thoracic outlet syndrome (vascular or neurogenic - symptoms with arm elevation, supraclavicular tenderness, affects entire hand)
  - Ulnar neuropathy (ulnar nerve distribution - pinky and ulnar half ring finger, worse with elbow flexion)
  - de Quervain tenosynovitis (radial wrist pain, thumb tenderness, positive Finkelstein test - no numbness)
  - Cervical myelopathy (upper motor neuron signs - hyperreflexia, Hoffman sign, gait disturbance, bowel/bladder)
  - Raynaud phenomenon (color changes with cold, triphasic white-blue-red, triggered by cold or stress)

trace:
  - 52-year-old administrative assistant presents with right hand numbness and tingling x 6 months, progressively worsening
  - Reports: numbness in thumb, index, and middle fingers, awakens from sleep 2-3 times per night with hand "asleep", shakes hand and symptoms improve (flick sign), worse after long days of typing at computer, occasional pain radiates to forearm, dropped coffee cup twice last month
  - Past medical history: type 2 diabetes (HbA1c 7.2 percent), obesity (BMI 32), no prior hand injuries
  - Occupations: types 6-8 hours daily, repetitive mouse use
  - Exam: tenderness over volar wrist, Tinel sign positive (tingling with percussion over median nerve), Phalen test positive at 40 seconds (reproduces numbness), carpal compression test positive, thenar strength intact (5/5 thumb abduction and opposition), no thenar atrophy, sensation intact to light touch but subjective numbness in median distribution (thumb, index, middle fingers), ulnar distribution normal (pinky normal)
  - Two-point discrimination: 7 mm on index finger (mild impairment, normal less than 5 mm), 4 mm on pinky (normal)
  - Assessment: classic carpal tunnel syndrome right hand, moderate severity based on exam (provocative tests positive, mild sensory changes, no weakness yet)
  - Nerve conduction study: prolonged median sensory latency 4.2 ms (normal less than 3.5 ms), median motor latency 5.1 ms (normal less than 4.5 ms), ulnar nerve normal (2.9 ms sensory), confirms median neuropathy at wrist (CTS), moderate severity
  - "Treatment plan (initial conservative): Wrist splint neutral position (cock-up splint) to wear every night x 6-8 weeks; Ergonomic evaluation at work to adjust keyboard height, wrist rest, frequent breaks, maintain neutral wrist posture; Weight loss counseling (even 10-15 pounds may reduce symptoms); Optimize diabetes control (HbA1c goal less than 7 percent reduces neuropathy risk); NSAIDs with ibuprofen 400 mg TID as needed for pain; Avoid aggravating activities by limiting prolonged gripping and forceful wrist flexion"
  - Follow-up 6 weeks: wearing splint nightly, symptoms slightly improved (awakens only once per night instead of 2-3 times), still symptomatic during day with typing, ergonomic changes made at work
  - Corticosteroid injection offered: methylprednisolone 40 mg with 1 mL lidocaine injected into carpal tunnel (proximal wrist crease, ulnar to palmaris longus, 45-degree angle aimed distally), no resistance or paresthesias during injection
  - 1 week post-injection: dramatic improvement, no nocturnal symptoms, minimal daytime symptoms, very pleased
  - 4-month post-injection: symptoms returning, nocturnal numbness 1-2 nights per week, daytime numbness with prolonged typing, discussed options (repeat injection vs surgery)
  - Patient elected surgical evaluation (wants definitive treatment, tired of recurring symptoms)
  - Referred to hand surgeon: recommended carpal tunnel release right hand given failed conservative treatment (splinting), temporary relief with injection (4 months), moderate severity on NCS, no red flags
  - Surgery scheduled: open carpal tunnel release performed as outpatient, transverse carpal ligament divided, median nerve visualized (no anatomic abnormalities), compression released
  - Post-op day 1: immediate relief of numbness, mild incision pain (controlled with acetaminophen), splint in place, instructed finger range of motion exercises
  - Post-op 2 weeks: sutures removed, incision healing well, numbness resolved, strength returning, wearing splint at night only, avoiding heavy lifting
  - Post-op 6 weeks: full recovery, no numbness or pain, returned to work full duty with ergonomic modifications, grip strength 90 percent of left hand (dominant right), very satisfied with outcome
  - 6-month follow-up: complete resolution of symptoms, no nocturnal awakenings, no limitations, continues ergonomic practices at work to prevent recurrence (rare less than 5 percent), thenar strength full, sensory exam normal
