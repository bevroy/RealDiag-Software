presentations:
  - Fatigue and lethargy
  - Cold intolerance
  - Weight gain (modest, 5-10 lbs)
  - Constipation
  - Dry, coarse skin
  - Hair loss (scalp and lateral eyebrows)
  - Hoarseness
  - Muscle aches and cramps
  - Depression and cognitive impairment ("brain fog")
  - Menstrual irregularities (menorrhagia)
  - Bradycardia
  - Delayed deep tendon reflexes (slow relaxation phase)
  - Periorbital edema and non-pitting edema
  - Gradual onset of symptoms (months to years)
differentials:
  - Subclinical hypothyroidism
  - Euthyroid sick syndrome
  - Depression
  - Anemia
workup:
  - TSH (elevated in primary hypothyroidism, low/normal in secondary)
  - Free T4 (low - confirms hypothyroidism)
  - Anti-TPO antibodies if Hashimoto's suspected (helps predict progression in subclinical cases)
  - 'If secondary suspected: Morning cortisol, IGF-1, prolactin, LH/FSH, pituitary MRI'
treatment:
  - 'Guideline-based treatment options for Hypothyroidism include:'
  - Levothyroxine 1.6 mcg/kg/day PO (round to 25, 50, 75, 88, 100, 112, 125, 137, 150 mcg strengths) (ADA 2024)
  - 'Start lower in elderly or cardiac disease: 25-50 mcg daily (ADA 2024)'
  - Recheck TSH in 6-8 weeks, adjust dose by 12.5-25 mcg increments until TSH normalized (ADA 2024)
  - 'Goal TSH 0.5-2.5 mIU/L (tighter range if pregnant: 0.1-2.5 by trimester) (ADA 2024)'
  - Once stable, check TSH annually - dose may need adjustment with weight changes or pregnancy (ADA 2024)
clinical_pearls:
  - 'Primary (95%): Thyroid gland failure (Hashimoto''s, post-RAI, post-thyroidectomy). Secondary (5%): Pituitary failure'
  - 'Subclinical hypothyroidism: Elevated TSH with normal free T4 - treat if TSH >10 or symptoms/pregnancy'
  - 'Hashimoto''s thyroiditis: Anti-TPO antibodies positive in 90%, gradual thyroid destruction'
  - 'Medication effects: Amiodarone, lithium, interferon can cause hypothyroidism'
  - Levothyroxine must be taken on empty stomach, 30-60 min before breakfast (food reduces absorption)
red_flags: []
disposition_guidance: {}
referrals:
  - 'Endocrinology if: Secondary hypothyroidism, pregnant, difficulty controlling TSH, or large goiter'
  - Cardiology if new cardiac symptoms after starting levothyroxine (reduce dose)
