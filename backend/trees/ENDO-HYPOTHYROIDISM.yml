tree_id: ENDO-HYPOTHYROIDISM
name: Hypothyroidism
family: Endocrinology
specialty: Endocrinology
chief_complaint: Fatigue, weight gain, and cold intolerance
description: |
  Thyroid hormone deficiency causing decreased metabolism. Primary hypothyroidism (thyroid gland failure, 95%) most common - Hashimoto thyroiditis in developed countries, iodine deficiency worldwide.
  Secondary hypothyroidism (pituitary) and tertiary (hypothalamus) rare. Affects 5-10% of population, women 10:1, increases with age. Symptoms insidious, often unrecognized. Levothyroxine replacement highly effective.
icd10: E03.9
urgency: Low
workup:
  - Clinical presentation - fatigue, cold intolerance, weight gain, constipation, dry skin, hair loss, hoarseness, bradycardia, delayed deep tendon reflexes
  - Myxedema - non-pitting edema, puffy face, periorbital edema
  - Subclinical hypothyroidism often asymptomatic (discovered on screening)
  - TSH (thyroid-stimulating hormone) first-line test
  - Primary hypothyroidism - elevated TSH (greater than 4-5 mIU/L), low or normal free T4
  - Overt hypothyroidism - TSH greater than 10 mIU/L and low free T4 (less than 0.8 ng/dL)
  - Subclinical hypothyroidism - TSH 4.5-10 mIU/L with normal free T4 (controversial whether to treat)
  - Secondary/tertiary hypothyroidism - low or normal TSH with low free T4 (central hypothyroidism)
  - Free T4 (thyroxine) confirms diagnosis - low in overt hypothyroidism
  - Total T4 affected by binding proteins (pregnancy, estrogen, liver disease) - use free T4
  - TPO antibodies (thyroid peroxidase) - positive in Hashimoto thyroiditis (90%)
  - High titers predict progression of subclinical to overt hypothyroidism
  - Thyroid ultrasound if palpable goiter or nodule - Hashimoto shows heterogeneous hypoechoic gland
  - Assess for autoimmune associations - type 1 diabetes, celiac disease, vitiligo, pernicious anemia
  - Lipid panel - hypothyroidism causes hyperlipidemia (elevated LDL, triglycerides)
  - CPK may be elevated (myopathy)
  - Exclude secondary causes if TSH not elevated with low T4 - pituitary MRI (look for adenoma, empty sella)
treatment:
  - Levothyroxine (synthetic T4) replacement - treat overt hypothyroidism, consider for symptomatic subclinical
  - Starting dose - young healthy adults 1.6 mcg/kg/day (typically 100-125 mcg daily)
  - Elderly or cardiac disease - start low 25-50 mcg daily, increase slowly q4-6 weeks (rapid replacement can precipitate angina, MI)
  - Take on empty stomach 30-60 minutes before breakfast (or at bedtime 4 hours after last meal) for consistent absorption
  - Narrow therapeutic index - same brand/formulation for consistency
  - Monitor TSH 6-8 weeks after dose change, then every 6-12 months when stable
  - Goal TSH 0.5-2.5 mIU/L (some sources 0.4-4.0, individualize based on age and symptoms)
  - Dose adjustment - if TSH elevated, increase by 12.5-25 mcg; if TSH suppressed (less than 0.1), decrease
  - Subclinical hypothyroidism (TSH 4.5-10, normal free T4) - controversial
  - Treat if TSH greater than 10, positive TPO antibodies, symptomatic, goiter, hyperlipidemia, infertility, pregnancy
  - Observe if TSH 4.5-7, asymptomatic, negative antibodies (may normalize spontaneously)
  - Pregnancy - increase levothyroxine dose 30-50% as soon as pregnancy confirmed
  - Goal TSH less than 2.5 first trimester, less than 3.0 second/third trimester
  - Maternal hypothyroidism impairs fetal neurodevelopment
  - Drug interactions - many drugs affect absorption or metabolism
  - Decreased absorption - calcium, iron, PPIs, sucralfate, cholestyramine (take levothyroxine 4 hours apart)
  - Increased metabolism - rifampin, phenytoin, carbamazepine (may need higher dose)
  - Myxedema coma - rare life-threatening emergency (severe hypothyroidism plus precipitating event)
  - Hypothermia, hypotension, bradycardia, hypoventilation, altered mental status
  - ICU management - IV levothyroxine 200-400 mcg bolus then 50-100 mcg daily, IV hydrocortisone (treat possible adrenal insufficiency), supportive care
  - Liothyronine (T3) not routinely recommended (short half-life, cardiac effects, no proven benefit over T4 alone)
  - Combination T4/T3 therapy controversial (some patients prefer but no clear superiority in studies)
  - Monitor for overtreatment - symptoms of hyperthyroidism (palpitations, tremor, weight loss, insomnia), atrial fibrillation, osteoporosis
  - Desiccated thyroid (Armour Thyroid) contains T4 and T3 from animal thyroid - variable potency, not preferred
clinical_pearls:
  - TSH most sensitive test for primary hypothyroidism (elevated before T4 decreases)
  - Subclinical hypothyroidism common in elderly (10-20% over 65) - may not require treatment
  - Hashimoto thyroiditis can cause transient hyperthyroidism initially (Hashitoxicosis) before progression to hypothyroidism
  - Postpartum thyroiditis - transient hyper then hypothyroidism 3-12 months postpartum, 80% recover spontaneously
  - Levothyroxine half-life 7 days - steady state takes 4-6 weeks, allows once-daily dosing
  - Generic levothyroxine bioequivalent to brand (Synthroid, Levoxyl) per FDA - can substitute but monitor TSH after switch
  - Central hypothyroidism (low T4 with normal/low TSH) - always check other pituitary hormones, MRI pituitary
differentials:
  - Depression
  - Chronic fatigue syndrome
  - Anemia
  - Obstructive sleep apnea
  - Medication side effects
  - Adrenal insufficiency
trace:
  - 52-year-old woman with 6 months of progressive fatigue, 12 lb weight gain despite no diet change, constipation, dry skin, cold intolerance → Exam shows bradycardia HR 56, delayed relaxation phase of ankle reflexes, coarse hair → TSH 28 mIU/L (elevated), free T4 0.6 ng/dL (low) → TPO antibodies 420 IU/mL (strongly positive) → Diagnose primary hypothyroidism due to Hashimoto thyroiditis → Lipid panel shows total cholesterol 265 mg/dL, LDL 170 mg/dL → Start levothyroxine 100 mcg daily on empty stomach → Recheck TSH in 6 weeks - TSH 6.2 mIU/L (improved but still elevated) → Increase levothyroxine to 125 mcg daily → TSH 2.1 mIU/L at 8 weeks (goal achieved) → Symptoms markedly improved - energy better, weight loss 8 lbs, bowel movements regular → Cholesterol improves to 210 mg/dL → Continue levothyroxine 125 mcg, monitor TSH annually, remains stable on this dose
