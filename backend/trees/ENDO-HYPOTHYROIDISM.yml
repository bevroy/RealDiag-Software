tree_id: ENDO-HYPOTHYROIDISM
name: Hypothyroidism
family: Endocrinology
specialty: Endocrinology
chief_complaint: Fatigue, weight gain, and cold intolerance
description: |
  Inadequate thyroid hormone production. Most common cause: Hashimoto's thyroiditis (autoimmune).
  Affects 5% of population, more common in women. Subclinical hypothyroidism: elevated TSH with normal T4.
icd10: E03.9
urgency: Low
workup:
  - TSH (most sensitive screening test, elevated in primary hypothyroidism)
  - Free T4 (low in overt hypothyroidism, normal in subclinical)
  - Thyroid peroxidase antibodies (TPO Ab) if positive confirms Hashimoto's thyroiditis
  - Thyroglobulin antibodies (Tg Ab) if TPO Ab negative but autoimmune suspected
  - Complete metabolic panel (hyponatremia in severe cases)
  - Lipid panel (hyperlipidemia common, improves with treatment)
  - CBC (anemia may be present)
  - Thyroid ultrasound if goiter or nodule palpated
treatment:
  - Levothyroxine (T4) replacement: start 1.6 mcg/kg/day (lower dose 25-50 mcg if elderly or cardiac disease)
  - Take on empty stomach 30-60 minutes before breakfast for optimal absorption
  - Recheck TSH in 6-8 weeks, adjust dose by 12.5-25 mcg increments to achieve TSH 0.5-2.5 mIU/L
  - Goal TSH 0.5-2.5 for most, 0.1-0.5 if thyroid cancer history
  - Avoid taking with calcium, iron, PPIs, or soy (decrease absorption)
  - Subclinical hypothyroidism (TSH 4.5-10 with normal T4): treat if symptomatic, pregnant, or TPO Ab positive
  - Lifelong therapy required, annual TSH monitoring once stable
clinical_pearls:
  - Symptoms: fatigue, weight gain, cold intolerance, constipation, dry skin, hair loss, bradycardia, delayed reflexes
  - Myxedema coma: severe hypothyroidism with altered mental status, hypothermia, bradycardia (life-threatening, treat with IV T4)
  - Pregnancy increases levothyroxine requirements by 30-50% (increase dose as soon as pregnancy confirmed)
  - TSH may take 6-8 weeks to normalize after dose change (don't adjust more frequently)
  - Over-replacement causes hyperthyroid symptoms (palpitations, tremor, weight loss)
  - Drug interactions: estrogen, rifampin, phenytoin, carbamazepine increase levothyroxine requirements
differentials:
  - Depression
  - Chronic fatigue syndrome
  - Anemia
  - Sleep apnea
  - Subclinical hypothyroidism
  - Medication-induced (lithium, amiodarone, interferon)
trace:
  - Fatigue and weight gain → Check TSH → Elevated TSH → Check free T4 → Low T4 confirms overt hypothyroidism → Check TPO antibodies → Positive confirms Hashimoto's → Start levothyroxine 1.6 mcg/kg/day → Recheck TSH in 6-8 weeks → Adjust dose to achieve TSH 0.5-2.5 → Annual monitoring once stable
