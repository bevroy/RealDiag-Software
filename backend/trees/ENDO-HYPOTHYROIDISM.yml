tree_id: ENDO-HYPOTHYROIDISM
name: Hypothyroidism
family: Endocrinology
specialty: Endocrinology
chief_complaint: Fatigue and weight gain
description: Insufficient thyroid hormone production causing fatigue, weight gain, cold intolerance, and elevated TSH

icd10: E03.9

urgency: routine

workup:
  - Clinical presentation: fatigue, weight gain (5-10 pounds despite normal appetite), cold intolerance, constipation, dry skin, hair loss, hoarseness, muscle aches, slowed cognition (brain fog), menstrual irregularities (menorrhagia)
  - Exam: bradycardia, diastolic hypertension, dry coarse skin, brittle hair, loss of lateral third eyebrows, delayed deep tendon reflex relaxation phase, goiter (if Hashimoto or iodine deficiency), periorbital edema, macroglossia
  - Laboratory diagnosis: elevated TSH (greater than 4.5-5.0 mIU/L) with low or normal free T4
  - Overt hypothyroidism: elevated TSH plus low free T4 (less than 0.8 ng/dL), symptomatic, requires treatment
  - Subclinical hypothyroidism: elevated TSH (5-10 mIU/L) with normal free T4, may be asymptomatic, treat if symptoms, TSH greater than 10, positive TPO antibodies, pregnancy, or goiter
  - Etiology primary hypothyroidism (95 percent): Hashimoto thyroiditis most common (autoimmune, check TPO antibodies and thyroglobulin antibodies), post-radioactive iodine therapy, post-thyroidectomy, iodine deficiency (worldwide most common but rare in US), medications (lithium, amiodarone, interferon), thyroiditis (subacute, postpartum)
  - Etiology secondary hypothyroidism (5 percent): pituitary or hypothalamic dysfunction (low or inappropriately normal TSH with low free T4), check other pituitary hormones, MRI pituitary
  - TPO antibodies: positive in 90 percent Hashimoto thyroiditis (confirms autoimmune etiology)
  - Additional labs: CBC (anemia common, macrocytic), lipid panel (hyperlipidemia common), CK (elevated), sodium (hyponatremia if severe)
  - Imaging: thyroid ultrasound if goiter or nodule (not routinely needed for diagnosis)

treatment:
  - Levothyroxine (synthetic T4) oral replacement: start 1.6 mcg/kg ideal body weight (typically 50-100 mcg daily for most adults), take on empty stomach 30-60 minutes before breakfast for optimal absorption
  - Dosing considerations: start lower in elderly or CAD (12.5-25 mcg daily, titrate slowly to avoid cardiac events), start full dose in young healthy adults
  - Goal TSH: 0.5-2.5 mIU/L for most patients (some prefer lower end of normal 0.5-2.0 mIU/L), pregnancy goal TSH less than 2.5 first trimester and less than 3.0 second/third trimester (increase levothyroxine dose by 30 percent when pregnancy confirmed)
  - Monitoring: check TSH 6-8 weeks after starting or changing dose, once stable check annually, adjust dose by 12.5-25 mcg increments based on TSH
  - Factors affecting absorption: wait 4 hours after levothyroxine to take calcium, iron, PPIs (interfere with absorption), increase dose if starting estrogen (increases thyroid-binding globulin)
  - Pregnancy: critical to treat (untreated hypothyroidism causes miscarriage, preterm birth, impaired fetal neurodevelopment), check TSH every 4 weeks first half pregnancy then every trimester, increase dose as needed
  - Subclinical hypothyroidism treatment indications: TSH greater than 10 mIU/L, symptoms, positive TPO antibodies (will likely progress to overt), pregnancy or trying to conceive, goiter
  - Central (secondary) hypothyroidism: cannot use TSH to monitor (TSH low or normal), monitor free T4 (goal mid-upper normal range)
  - Myxedema coma (severe hypothyroidism with altered mental status, hypothermia, bradycardia, hypoventilation): medical emergency, IV levothyroxine 200-400 mcg loading dose then 50-100 mcg daily, IV hydrocortisone (rule out adrenal insufficiency first), supportive care, ICU admission

clinical_pearls:
  - Fatigue, weight gain, cold intolerance classic triad
  - Elevated TSH with low free T4 diagnostic (overt hypothyroidism)
  - Hashimoto thyroiditis most common cause (TPO antibodies positive)
  - Levothyroxine dose 1.6 mcg/kg, take on empty stomach
  - Goal TSH 0.5-2.5 mIU/L (lower in pregnancy less than 2.5 first trimester)
  - Check TSH 6-8 weeks after dose change
  - Increase levothyroxine by 30 percent when pregnancy confirmed
  - Subclinical hypothyroidism (elevated TSH, normal free T4) - treat if symptoms or TSH greater than 10

differentials:
  - Depression (fatigue, weight changes, but normal TSH)
  - Chronic fatigue syndrome (fatigue but normal thyroid function)
  - Anemia (fatigue, but check CBC)
  - Obesity (weight gain but normal TSH unless related to hypothyroidism)

trace:
  - 42-year-old woman presents with 6 months progressive fatigue (exhausted by mid-afternoon), weight gain 12 pounds despite no diet change, cold intolerance (wears sweater when others comfortable), constipation, dry skin, hair thinning
  - History: no prior thyroid disease, family history mother has hypothyroidism on levothyroxine
  - Exam: BP 136/92 (diastolic hypertension), HR 58 (bradycardia), weight 168 pounds (up from 156), dry skin, coarse hair, loss of lateral third eyebrows, delayed relaxation phase deep tendon reflexes, small diffuse goiter
  - Labs: TSH 18.5 mIU/L (markedly elevated, normal 0.4-4.5), free T4 0.6 ng/dL (low, normal 0.8-1.8), TPO antibodies 450 IU/mL (positive, normal less than 35)
  - Additional labs: total cholesterol 268 mg/dL (elevated), LDL 178 mg/dL (elevated), hemoglobin 11.8 g/dL (mild anemia), MCV 96 fL (macrocytic)
  - Diagnosis: overt primary hypothyroidism due to Hashimoto thyroiditis (elevated TSH, low free T4, positive TPO antibodies, diffuse goiter)
  - Started levothyroxine 75 mcg daily (1.6 mcg/kg x 47 kg ideal body weight approximately 75 mcg), take 30-60 minutes before breakfast on empty stomach
  - Education: lifelong treatment, do NOT stop medication, wait 4 hours to take calcium or iron supplements
  - 6 weeks: fatigue improved 50 percent, weight loss 4 pounds, cold intolerance improved, repeat TSH 4.2 mIU/L (improved but still slightly elevated), free T4 1.1 ng/dL (normal)
  - Increased levothyroxine to 88 mcg daily (increase by 12.5 mcg)
  - 6 weeks later (12 weeks total): fatigue resolved, weight down to 160 pounds (lost 8 pounds), cold intolerance resolved, constipation improved, TSH 1.8 mIU/L (goal range), free T4 1.3 ng/dL (mid-normal)
  - Stable on levothyroxine 88 mcg daily
  - 6 months: symptoms completely resolved, weight 156 pounds (baseline), TSH 1.6 mIU/L (stable), cholesterol improved to 210 mg/dL (hypothyroidism contributed to hyperlipidemia)
  - Annual monitoring: TSH checked yearly, remains stable on levothyroxine 88 mcg daily
  - Counseled: if pregnancy planned notify physician immediately (will need dose increase by 30 percent)
