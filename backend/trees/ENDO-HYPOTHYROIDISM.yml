tree_id: ENDO-HYPOTHYROIDISM
name: Hypothyroidism
family: endocrine-metabolic
specialty: Endocrinology
chief_complaint: Fatigue, weight gain, cold intolerance, constipation
description: Thyroid hormone deficiency causing decreased metabolism
icd10: E03.9
urgency: routine
workup:
  - Clinical presentation - symptoms develop gradually over months
  - Common symptoms include fatigue, weight gain, cold intolerance, constipation, dry skin, hair loss
  - Menstrual irregularities (heavy periods), depression, cognitive slowing
  - Physical exam shows bradycardia, diastolic hypertension, delayed reflexes, periorbital edema
  - Thyroid may be enlarged (goiter in Hashimoto's) or normal
  - Primary hypothyroidism most common (thyroid gland failure)
  - Hashimoto thyroiditis (autoimmune) - most common cause in iodine-sufficient areas
  - Iatrogenic (post-thyroidectomy, radioactive iodine, radiation therapy)
  - Medications (lithium, amiodarone, interferon)
  - Iodine deficiency (most common worldwide)
  - Secondary hypothyroidism from pituitary failure (low TSH, low T4)
  - Laboratory diagnosis with TSH as screening test
  - Primary hypothyroidism shows elevated TSH, low free T4
  - Subclinical hypothyroidism shows elevated TSH, normal free T4
  - TPO antibodies positive in Hashimoto thyroiditis
treatment:
  - Levothyroxine replacement therapy
  - Start 1.6 mcg/kg ideal body weight (typical 100-125 mcg daily for adults)
  - Elderly or cardiac disease start low (25-50 mcg) and titrate slowly
  - Take on empty stomach, 30-60 minutes before breakfast
  - Recheck TSH in 6-8 weeks after dose change
  - Target TSH 0.5-2.5 mIU/L for most patients
  - Lifelong therapy for primary hypothyroidism
  - Monitor TSH annually once stable
  - Increase dose needs during pregnancy, malabsorption, certain medications
  - Subclinical hypothyroidism (TSH 4.5-10) - treat if symptomatic, pregnant, or elevated antibodies
clinical_pearls:
  - Most common cause is Hashimoto thyroiditis in developed countries
  - TSH best screening test, elevated in primary hypothyroidism
  - Levothyroxine dose 1.6 mcg/kg ideal body weight
  - Take levothyroxine on empty stomach for optimal absorption
  - Pregnancy increases levothyroxine needs by 30-50%
  - Avoid taking levothyroxine with calcium, iron, PPI (interfere with absorption)
  - Subclinical hypothyroidism (high TSH, normal T4) controversial - treat if TSH greater than 10 or symptomatic
differentials:
  - Depression (normal TSH)
  - Chronic fatigue syndrome
  - Anemia
  - Sleep apnea
  - Adrenal insufficiency
trace:
  - 45-year-old woman presents with fatigue, weight gain, and cold intolerance x 6 months
  - Gaining weight despite no diet change, always cold when others comfortable
  - Constipation, dry skin, hair thinning
  - Feels sluggish mentally
  - Exam shows bradycardia HR 58, delayed ankle reflex relaxation, dry skin
  - TSH 12.5 mIU/L (elevated), free T4 0.7 ng/dL (low)
  - TPO antibodies positive (confirms Hashimoto thyroiditis)
  - Diagnosis - primary hypothyroidism from Hashimoto thyroiditis
  - Started levothyroxine 100 mcg daily on empty stomach
  - 6 weeks later TSH 3.2 mIU/L, free T4 1.1 ng/dL - improved
  - Symptoms improved, more energy, weight stable
  - 3 months TSH 1.8 mIU/L (optimal)
  - Continues levothyroxine 100 mcg daily, annual TSH monitoring
  - Outcome - successful treatment with levothyroxine replacement
