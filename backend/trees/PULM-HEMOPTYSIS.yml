tree_id: PULM-HEMOPTYSIS
name: Hemoptysis
family: pulmonology
specialty: Pulmonology
icd10: R04.2
snomed: 66857006
urgency: high
homeopathy: []
presentations:
  - Coughing up blood or blood-tinged sputum
  - Range from blood-streaked sputum to massive hemoptysis (>100-600 mL/24h)
  - Frank red blood (arterial) vs dark blood (venous or older)
  - Frothy blood (mixed with air/sputum) suggests pulmonary source
  - Associated symptoms - dyspnea, chest pain, fever, weight loss
  - Differentiate from hematemesis (GI bleeding) and epistaxis (nose bleeding)
  - Hemoptysis - alkaline pH, frothy, mixed with sputum, no food particles
  - Hematemesis - acidic pH, dark/coffee grounds, mixed with food
  - Risk factors - smoking, tuberculosis, lung cancer, bronchiectasis, anticoagulation
workup:
  - Assess severity and hemodynamic stability
  - Massive hemoptysis (>100-200 mL in 24h or life-threatening) - ICU, urgent intervention
  - Non-massive hemoptysis - outpatient workup often appropriate if stable
  - Chest X-ray (first-line imaging) - may identify mass, infiltrate, cavitation, bronchiectasis
  - Normal CXR in 20-30% of cases
  - CT chest with IV contrast (gold standard) - identify source in 85-90%
  - Assess for malignancy, bronchiectasis, AVM, pulmonary embolism
  - Bronchoscopy - both diagnostic and potentially therapeutic
  - Urgent rigid bronchoscopy for massive hemoptysis (better control, larger suction)
  - Flexible bronchoscopy for non-massive (localizes source, biopsies)
  - Complete blood count and coagulation studies (PT/INR, aPTT, platelets)
  - Type and crossmatch if massive hemoptysis
  - Sputum for Gram stain, culture, AFB (TB), cytology (malignancy)
  - Consider bronchial arteriography if recurrent or massive hemoptysis
  - Additional tests based on suspected etiology
  - Urinalysis and renal function for vasculitis (Goodpasture, granulomatosis with polyangiitis)
  - ANCA, anti-GBM antibodies if pulmonary-renal syndrome suspected
  - Echocardiogram if mitral stenosis suspected
treatment:
  - Stabilization and airway protection (ABCs)
  - Oxygen, IV access, fluid resuscitation if needed
  - Position patient with bleeding side down (prevent blood from entering good lung)
  - Reverse coagulopathy - vitamin K, FFP, platelet transfusion as needed
  - Hold anticoagulants and antiplatelets
  - Non-massive hemoptysis
  - Observation and supportive care
  - Cough suppression with codeine or hydrocodone
  - Treat underlying cause (antibiotics for pneumonia, anti-TB therapy, etc.)
  - Massive or life-threatening hemoptysis
  - ICU admission
  - Urgent consultation - pulmonology, interventional radiology, thoracic surgery
  - Rigid bronchoscopy for clot evacuation, tamponade, or endobronchial intervention
  - Bronchial artery embolization (BAE) - treatment of choice for massive hemoptysis
  - 75-98% immediate success rate
  - 10-20% rebleeding rate
  - Surgical resection (lobectomy/pneumonectomy) if BAE fails or anatomically resectable lesion
  - Intubation with large endotracheal tube (≥8.0) or double-lumen tube to isolate lungs
  - Specific treatments based on etiology
  - TB - anti-TB therapy (RIPE regimen)
  - Lung cancer - oncology referral, chemotherapy, radiation
  - Bronchiectasis - antibiotics, bronchial hygiene
  - Aspergilloma - antifungals, consider surgery
clinical_pearls:
  - 90% of pulmonary bleeding from bronchial arteries (high pressure), not pulmonary arteries
  - Most common causes - bronchitis (25%), lung cancer (20%), bronchiectasis (15%), pneumonia (10%)
  - Tuberculosis most common cause worldwide
  - Massive hemoptysis mortality 50-80% if untreated
  - Death from asphyxiation (airway obstruction), not exsanguination
  - Cryptogenic hemoptysis (no cause found) 20-30% - usually benign, self-limited
  - Most cryptogenic hemoptysis resolves spontaneously
  - Iatrogenic causes - pulmonary artery catheter, transbronchial biopsy
  - Aspirin/clopidogrel rarely cause hemoptysis but worsen bleeding from other causes
  - Always rule out lung cancer, especially in smokers >40 years
referrals:
  - Pulmonology for bronchoscopy and management of non-massive hemoptysis
  - Interventional radiology for bronchial artery embolization
  - Thoracic surgery for massive hemoptysis refractory to BAE or resectable lesion
  - Oncology if malignancy identified
  - Infectious disease if TB or fungal infection
  - ICU for massive hemoptysis or respiratory failure
differentials:
  - Bronchitis (most common overall)
  - Lung cancer (most common if smoker >40 years)
  - Bronchiectasis (chronic purulent sputum, recurrent)
  - Pneumonia (fever, infiltrate)
  - Tuberculosis (endemic areas, night sweats, weight loss)
  - Pulmonary embolism (sudden onset, pleuritic pain)
  - Aspergilloma (fungus ball in old TB cavity)
  - Lung abscess (fever, foul sputum)
  - Arteriovenous malformation (telangiectasias, hereditary hemorrhagic telangiectasia)
  - Vasculitis (Goodpasture, granulomatosis with polyangiitis)
  - Mitral stenosis (heart failure symptoms)
  - Coagulopathy or anticoagulation
