tree_id: CARDS-MULTIFOCAL-ATRIAL-TACHYCARDIA
name: Multifocal Atrial Tachycardia (MAT)
family: Cardiology
specialty: Cardiology
chief_complaint: Irregular rapid heart rate with severe COPD
description: Irregular atrial arrhythmia with three or more different P wave morphologies and rate over 100 bpm, strongly associated with severe COPD and critical illness. Treat underlying disease, correct hypoxia and electrolytes. Calcium channel blockers may help rate control. Poor prognosis reflects severity of underlying disease.
icd10: I47.1
urgency: urgent

workup:
  - Symptoms: related to rapid rate and underlying disease
  - Palpitations: irregular rapid heart rate
  - Dyspnea: from rapid rate or underlying pulmonary disease
  - Often asymptomatic: heart rate only moderately elevated (100-150 bpm, not as fast as AFib)
  - Associated with critical illness
  - ECG findings (diagnostic):
  - Three or more distinct P wave morphologies: from multiple atrial foci
  - Irregular PP intervals: varying intervals between P waves
  - Irregular RR intervals: irregularly irregular like AFib
  - Atrial rate over 100 bpm (tachycardia)
  - If under 100 bpm: called wandering atrial pacemaker (same phenomenon, slower rate)
  - Narrow QRS: unless bundle branch block
  - Isoelectric baseline between P waves: distinguishes from atrial flutter (no sawtooth)
  - Resembles AFib but P waves visible: key distinction
  - Associated conditions:
  - COPD: most common association (60%), severe exacerbation
  - Pulmonary disease: pulmonary hypertension, cor pulmonale
  - Critical illness: sepsis, respiratory failure, multi-organ dysfunction
  - Hypoxia: low oxygen tension triggers ectopic atrial foci
  - Electrolyte abnormalities: hypomagnesemia, hypokalemia
  - Theophylline: causes MAT (older asthma treatment)
  - Valvular heart disease: mitral stenosis, tricuspid regurgitation
  - Poor prognostic sign: reflects severity of underlying disease
  - Mortality 30-60% at 1 year (from underlying disease, not MAT itself)

treatment:
  - Treat underlying disease (most important):
  - COPD exacerbation: bronchodilators, corticosteroids, oxygen
  - Sepsis: antibiotics, source control
  - Respiratory failure: mechanical ventilation if needed
  - Correct hypoxia: supplemental oxygen
  - Correct electrolytes: magnesium sulfate 2 grams IV (critical - hypomagnesemia common), potassium over 4 mEq/L
  - Rate control (often difficult):
  - Calcium channel blockers: verapamil 5-10 mg IV or diltiazem 0.25 mg/kg IV
  - Most effective agents for MAT
  - Reduce AV nodal conduction, slow ventricular rate
  - Beta blockers: generally avoided (contraindicated in severe COPD with bronchospasm)
  - Metoprolol may be tried cautiously if no active bronchospasm
  - Digoxin: ineffective for rate control in MAT
  - Amiodarone: may help but not first-line
  - DO NOT cardiovert: electrical cardioversion ineffective for MAT (multiple atrial foci, not single reentrant circuit)
  - Avoid certain medications:
  - Theophylline: discontinue if present (causes MAT)
  - Class IC antiarrhythmics: ineffective
  - Management of MAT is primarily treating underlying disease
  - Rhythm often converts to sinus spontaneously when underlying disease improves
  - Prognosis:
  - MAT itself not dangerous (does not cause hemodynamic instability)
  - Prognosis determined by underlying disease (usually poor)
  - Mortality reflects severity of COPD or critical illness

clinical_pearls:
  - Three or more P wave morphologies with irregular rhythm and rate over 100 bpm
  - Strongly associated with severe COPD exacerbation (60%)
  - Treat underlying disease most important (oxygen, bronchodilators, antibiotics)
  - Correct magnesium (critical - hypomagnesemia common trigger)
  - Calcium channel blockers (verapamil, diltiazem) for rate control
  - Avoid beta blockers in COPD with bronchospasm
  - Do NOT cardiovert (ineffective)
  - Poor prognosis reflects underlying disease severity

differentials:
  - Atrial fibrillation: irregularly irregular but no distinct P waves (fibrillatory waves)
  - Atrial flutter with variable block: sawtooth flutter waves, not multiple P morphologies
  - Frequent PACs: premature P waves but not sustained tachycardia
  - Sinus tachycardia with PACs: sinus P waves predominate

trace: |
  A 68-year-old man with severe COPD presented with acute dyspnea and cough. 3-day history of worsening shortness of breath, productive cough with yellow sputum (COPD exacerbation), fever. Chronic oxygen use at home (2 L/min). Exam: BP 135/85, HR 125 irregular (rapid and irregular), RR 28, O2 saturation 88% on room air (hypoxic), tachypneic and using accessory muscles, diffuse wheezes and rhonchi, elevated JVP (cor pulmonale from chronic COPD). ECG: irregular rhythm rate 125 bpm, at least three distinct P wave morphologies (upright P in lead II, biphasic P, inverted P - multiple atrial foci), irregular PP and RR intervals (irregularly irregular like AFib but P waves visible), narrow QRS, isoelectric baseline between P waves (distinguishes from flutter). Diagnosed with multifocal atrial tachycardia (three+ P wave morphologies, irregular, rate over 100) in setting of severe COPD exacerbation. MAT reflects severity of underlying lung disease (poor prognostic sign). Labs: WBC 15,000 (leukocytosis), magnesium 1.6 mg/dL (low - hypomagnesemia common in COPD exacerbations and triggers MAT), potassium 3.5 (low normal). CXR: hyperinflation, no infiltrate, no pneumothorax. Diagnosed with acute COPD exacerbation with bacterial infection triggering MAT. Admitted to ICU for severe exacerbation. Treatment focused on underlying disease: high-flow oxygen targeting saturation 88-92% (correcting hypoxia critical), albuterol and ipratropium nebulizers Q4H (bronchodilators), methylprednisolone 125 mg IV Q6H (corticosteroids for COPD exacerbation), ceftriaxone and azithromycin (antibiotics for suspected bacterial infection). Magnesium sulfate 2 grams IV (correct hypomagnesemia - critical for MAT), potassium repletion to over 4 mEq/L. For rate control: verapamil 5 mg IV (calcium channel blocker - most effective for MAT), heart rate decreased from 125 to 105 bpm (modest improvement). Avoided beta blockers (contraindicated in acute COPD exacerbation with bronchospasm). At 48 hours: clinical improvement, O2 saturation 92% on 4 L oxygen, dyspnea improved, wheezing decreased. Heart rate 95 bpm, rhythm still irregular but P wave morphologies decreased to 2 (improving). At 5 days: MAT spontaneously converted to normal sinus rhythm rate 85 bpm (conversion occurred as underlying COPD exacerbation resolved - typical pattern). Transitioned to oral prednisone taper, PO antibiotics. Discharged on day 7 with home oxygen, bronchodilators, prednisone taper. At 2 weeks: back to baseline, sinus rhythm, no MAT. MAT resolved with treatment of underlying COPD exacerbation (MAT is marker of severe underlying disease, resolves when disease improves).
