tree_id: PSYCH-PERSONALITY-DISORDER
name: Personality Disorder
family: psychiatry
specialty: Psychiatry
icd10: F60.9
snomed: 33449004
urgency: []
homeopathy: []
presentations:
  - Enduring pattern of inner experience and behavior that deviates from cultural expectations
  - Inflexible and pervasive across broad range of personal and social situations
  - Onset in adolescence or early adulthood
  - Stable over time
  - Leads to clinically significant distress or impairment in functioning
  - Pattern evident in two or more areas: cognition (ways of perceiving self/others), affectivity (range/intensity of emotions), interpersonal functioning, impulse control
  - Not better explained by another mental disorder, substance use, or medical condition
  - Common presentations vary by cluster and specific disorder
workup:
  - Comprehensive psychiatric evaluation (personality assessment requires extensive history)
  - Longitudinal history of interpersonal relationships
  - Patterns across multiple contexts (work, family, romantic relationships)
  - Age of onset (typically adolescence/early adulthood)
  - Stability of patterns over time
  - Structured assessment tools
  - Structured Clinical Interview for DSM-5 Personality Disorders (SCID-5-PD)
  - Personality Assessment Inventory (PAI)
  - Minnesota Multiphasic Personality Inventory (MMPI-3)
  - DSM-5-TR: 10 specific personality disorders in 3 clusters
  - Cluster A (odd/eccentric): Paranoid, Schizoid, Schizotypal
  - Cluster B (dramatic/emotional/erratic): Antisocial, Borderline, Histrionic, Narcissistic
  - Cluster C (anxious/fearful): Avoidant, Dependent, Obsessive-Compulsive
  - Assess functional impairment
  - Occupational/academic functioning
  - Interpersonal relationships
  - Self-care and independent living
  - Rule out other psychiatric conditions (high comorbidity)
  - Mood disorders (depression, bipolar) - present in 50-75%
  - Anxiety disorders - present in 50-60%
  - Substance use disorders - present in 40-60%
  - Eating disorders (especially borderline PD)
  - Rule out medical/neurological causes
  - Traumatic brain injury
  - Seizure disorders
  - Neurodevelopmental disorders (autism spectrum)
  - Substance-induced personality changes
  - Collateral information helpful
  - Information from family, friends, previous providers
  - Patients may lack insight into patterns
treatment:
  - Psychotherapy PRIMARY treatment (medications adjunctive only)
  - Evidence-based therapies by disorder type
  - Borderline PD
  - Dialectical Behavior Therapy (DBT) - gold standard, most evidence
  - Mentalization-Based Therapy (MBT)
  - Transference-Focused Psychotherapy (TFP)
  - Schema-Focused Therapy
  - Antisocial PD
  - Cognitive Behavioral Therapy
  - Therapeutic communities
  - Limited treatment success, often court-mandated
  - Avoidant PD
  - Cognitive Behavioral Therapy
  - Social skills training
  - Gradual exposure to feared social situations
  - Obsessive-Compulsive PD
  - Cognitive Behavioral Therapy
  - Relaxation training
  - Other PDs: supportive psychotherapy, CBT, interpersonal therapy
  - Long-term treatment typically required (1-3+ years)
  - Pharmacotherapy (NO medication FDA-approved for personality disorders)
  - Treat comorbid conditions and specific symptom domains
  - Mood dysregulation: SSRIs (fluoxetine 20-60 mg, sertraline 50-200 mg)
  - Impulsivity/anger: SSRIs, mood stabilizers (valproate, lamotrigine)
  - Cognitive-perceptual symptoms: low-dose antipsychotics (risperidone 0.5-2 mg, olanzapine 2.5-10 mg)
  - Anxiety: SSRIs (avoid benzodiazepines - abuse potential)
  - Avoid polypharmacy - medications have limited efficacy for core personality features
  - General principles
  - Establish clear boundaries and treatment frame
  - Consistent, predictable approach
  - Address self-harm and safety concerns proactively
  - Involve family when appropriate
  - Set realistic treatment goals (improvement, not cure)
clinical_pearls:
  - "Personality disorders affect 9-15% of general population, higher in psychiatric settings (40-60%)"
  - "Borderline PD most commonly treated - 70% show significant improvement with DBT over 1-2 years"
  - "Do not diagnose personality disorder in children/adolescents - personality still developing (exception: antisocial PD requires age 18+)"
  - "High comorbidity: 75-80% have another Axis I disorder (depression, anxiety, substance use)"
  - "Medications target symptoms (mood, impulsivity, psychotic-like), not core personality features"
  - "Antisocial PD difficult to treat - poor treatment engagement, low motivation for change"
  - "Personality disorders tend to improve with age - 'mature out' of symptoms (especially Cluster B)"
  - "Patients with personality disorders can evoke strong countertransference - supervision/consultation important"
referrals:
  - Psychiatry for medication management and complex cases
  - Specialized psychotherapy (DBT-trained therapist for borderline PD)
  - Substance abuse treatment if comorbid substance use disorder
  - Residential treatment programs for severe, treatment-refractory cases
differentials:
  - Personality disorders (pervasive, stable patterns since adolescence/early adulthood)
  - Mood disorders (episodic, discrete periods of mood disturbance)
  - Anxiety disorders (excessive worry or fear, may be situational)
  - Post-traumatic stress disorder (trauma history, specific symptom clusters)
  - Autism spectrum disorder (social communication deficits from childhood)
  - Substance use disorders (personality changes during active use)
  - Medical/neurological conditions (personality changes from brain injury, dementia, seizures)
  - Adjustment disorder (time-limited response to stressor)
  - Bipolar disorder (distinct mood episodes)
