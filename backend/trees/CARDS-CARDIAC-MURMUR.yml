tree_id: CARDS-CARDIAC-MURMUR
name: Cardiac Murmur, Unspecified
family: cardiology
specialty: Cardiology
icd10: R01.1
snomed: 88610006
urgency: moderate
homeopathy: []
presentations:
  - Incidental finding on routine physical examination (asymptomatic)
  - Systolic or diastolic heart murmur
  - Associated symptoms if pathologic - dyspnea, chest pain, syncope, fatigue
  - Palpitations
  - Exercise intolerance
  - Signs of heart failure (edema, orthopnea, elevated JVP)
  - Risk factors - history of rheumatic fever, congenital heart disease, endocarditis
  - Timing - systolic (more common) vs diastolic (always pathologic) vs continuous
workup:
  - Detailed cardiac auscultation
  - Grade murmur 1-6 (Levine scale)
  - Note timing (systolic, diastolic, continuous)
  - Note quality (harsh, blowing, rumbling, musical)
  - Note location and radiation
  - Dynamic maneuvers (Valsalva, standing, squatting, handgrip)
  - ECG - assess for LVH, chamber enlargement, arrhythmia, old MI
  - Chest X-ray - assess cardiac silhouette, pulmonary vasculature
  - Transthoracic echocardiogram (TTE) - definitive test
  - Assess valvular structure and function
  - Evaluate chamber sizes and ventricular function
  - Estimate pulmonary artery pressure
  - Transesophageal echocardiogram (TEE) if TTE inadequate or endocarditis suspected
  - Cardiac MRI for complex congenital lesions or masses
  - Exercise stress echo if exertional symptoms
treatment:
  - Depends on underlying etiology identified on echo
  - Innocent/physiologic murmurs - reassurance, no treatment or follow-up needed
  - Flow murmurs (anemia, fever, pregnancy, hyperthyroidism) - treat underlying cause
  - Valvular disease - manage per specific valve lesion
  - Aortic stenosis - surgical or transcatheter aortic valve replacement (SAVR/TAVR)
  - Mitral regurgitation - surgical repair or replacement
  - Aortic regurgitation - valve replacement if symptomatic or LV dysfunction
  - Mitral stenosis - percutaneous balloon valvuloplasty or surgery
  - Medical management for valvular disease
  - Heart failure treatment if present (diuretics, ACE-I, beta-blockers)
  - Anticoagulation for atrial fibrillation
  - Blood pressure control for regurgitant lesions (afterload reduction)
  - Endocarditis prophylaxis NOT routinely recommended
  - Only for prosthetic valves, prior endocarditis, unrepaired cyanotic CHD, or cardiac transplant valvulopathy
  - Procedures requiring prophylaxis - dental procedures involving gingival manipulation
  - Serial echo monitoring based on severity (annual to q3-5 years)
clinical_pearls:
  - Diastolic murmurs are always pathologic (never innocent)
  - Systolic murmurs can be innocent (especially in children, pregnancy, elderly)
  - Innocent murmurs - grade ≤2/6, asymptomatic, normal ECG/CXR, early systolic or mid-systolic
  - Still murmur - common innocent murmur in children (vibratory, musical quality)
  - Physiologic flow murmurs - anemia, pregnancy, fever, hyperthyroidism (high cardiac output)
  - Aortic stenosis - crescendo-decrescendo, radiates to carotids, later peak with severity
  - Mitral regurgitation - holosystolic, radiates to axilla
  - Aortic regurgitation - early diastolic, high-pitched blowing, left sternal border
  - Mitral stenosis - mid-diastolic rumble with opening snap
  - Hypertrophic cardiomyopathy - louder with Valsalva/standing, softer with squatting
  - Mitral valve prolapse - mid-systolic click with late systolic murmur
referrals:
  - Cardiology for any diastolic murmur, grade ≥3/6 systolic murmur, or symptomatic patients
  - Cardiology if abnormal ECG or chest X-ray
  - Cardiothoracic surgery for severe valvular disease meeting surgical criteria
  - Interventional cardiology for percutaneous valve procedures (TAVR, MitraClip, balloon valvuloplasty)
differentials:
  - Innocent/physiologic murmur (most common)
  - Aortic stenosis (degenerative, bicuspid valve, rheumatic)
  - Mitral regurgitation (primary or secondary/functional)
  - Aortic regurgitation
  - Mitral stenosis (usually rheumatic)
  - Tricuspid regurgitation
  - Hypertrophic cardiomyopathy
  - Atrial septal defect (fixed split S2)
  - Ventricular septal defect
  - Patent ductus arteriosus (continuous machinery murmur)
