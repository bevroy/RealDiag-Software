tree_id: DERM-STEVENS-JOHNSON
name: Stevens-Johnson Syndrome and Toxic Epidermal Necrolysis
family: Dermatology
specialty: Dermatology, Burn Surgery, Critical Care
chief_complaint: Widespread Painful Rash, Blistering, Mucosal Involvement
description: Comprehensive evaluation and management of SJS/TEN
version: "1.0"
icd10: N73.9
author: RealDiag Clinical Team

entry_point: sjs_ten_presentation

nodes:
  - id: sjs_ten_presentation
    type: question
    text: "Extent of epidermal detachment?"
    options:
      - label: "SJS-TEN overlap (10-30% BSA epidermal detachment)"
        next: sjs_ten_overlap
      - label: "Stevens-Johnson Syndrome (<10% BSA)"
        next: stevens_johnson
      - label: "Toxic Epidermal Necrolysis (>30% BSA)"
        next: toxic_epidermal_necrolysis

  - id: stevens_johnson
    type: diagnosis
    name: "Stevens-Johnson Syndrome (SJS)"
    icd10: "L51.1"
    urgency: critical
    workup:
      - Severe mucocutaneous reaction, spectrum with TEN (same disease, different severity)
      - Definition - <10% body surface area (BSA) epidermal detachment + mucosal involvement
      - Etiology - Medications (most common) >80%, infections, vaccines (rare)
      - High-risk medications - Allopurinol, sulfonamides (TMP-SMX, sulfasalazine), anticonvulsants (phenytoin, carbamazepine, lamotrigine, phenobarbital), NSAIDs (oxicam class), nevirapine, antibiotics (beta-lactams, quinolones)
      - Onset - Typically 1-3 weeks after drug initiation (can be up to 8 weeks)
      - Prodrome - Flu-like symptoms (fever, malaise, arthralgias) 1-3 days before rash
      - Clinical features
      - Skin - Painful erythematous macules with dusky centers, target lesions (atypical targets, dusky rather than classic concentric rings), progression to vesicles/bullae, confluent erythema, Nikolsky sign positive (lateral pressure causes skin to slough), epidermis detaches in sheets
      - Mucosal involvement (90-100%) - Painful erosions of oral mucosa, conjunctiva, genital mucosa; hemorrhagic crusted lips
      - Ocular - Conjunctivitis, photophobia, corneal erosions (can lead to blindness if not managed)
      - Respiratory - Tracheobronchial involvement (dyspnea, cough)
      - GI/GU - Esophageal, vaginal, urethral erosions
      - Labs - CBC (leukopenia common), CMP (renal/hepatic dysfunction), cultures (blood, wound if concern for infection), Mycoplasma pneumoniae serologies
      - Skin biopsy - Full-thickness epidermal necrosis, dermal-epidermal separation, sparse inflammatory infiltrate (distinguishes from other blistering disorders)
      - SCORTEN score (predicts mortality, assessed at admission and day 3)
      - Age >40 (1 point)
      - Malignancy (1 point)
      - HR >120 (1 point)
      - BSA detached >10% (1 point)
      - BUN >28 mg/dL (1 point)
      - Glucose >252 mg/dL (1 point)
      - Bicarbonate <20 mEq/L (1 point)
      - Mortality - Score 0-1 (3%), 2 (12%), 3 (35%), 4 (58%), ≥5 (>90%)
    treatment:
      - MEDICAL EMERGENCY - Transfer to burn unit or ICU
      - STOP all potentially causative medications immediately (identify and discontinue within 24-48 hours improves survival)
      - Burn unit or ICU admission - SJS/TEN managed like severe burns
      - Supportive care (mainstay)
      - Wound care - Gentle handling, non-adherent dressings (vaseline gauze, silver-impregnated), avoid debridement of intact bullae, maintain warm environment (hypothermia risk)
      - Fluid resuscitation - Extensive fluid losses like burns, but less than traditional burn formulas (Parkland formula overestimates), typical 2-3 L/day IV, monitor urine output >0.5-1 mL/kg/hr
      - Nutrition - Early enteral nutrition (high protein, high calorie), NG tube if oral intake limited
      - Pain control - Opioids (IV morphine or hydromorphone), topical lidocaine for oral lesions
      - Ophthalmology consultation URGENTLY - Daily eye exams, frequent artificial tears, topical antibiotics/corticosteroids, amniotic membrane grafting if severe (prevent symblepharon and corneal scarring leading to blindness)
      - Complications - Conjunctival synechiae, corneal ulceration, vision loss
      - Oral care - Gentle mouth rinses (saline or chlorhexidine), topical analgesics (viscous lidocaine, "magic mouthwash"), soft diet
      - Genital/urinary care - Foley catheter if urethral involvement (prevent strictures), topical emollients
      - Temperature regulation - Warm environment (thermoregulation impaired)
      - Prophylactic antibiotics NOT recommended - Culture-directed only if infection develops
      - DVT prophylaxis - Pneumatic compression devices (avoid anticoagulation initially if extensive skin loss)
      - Immunomodulatory therapy (controversial, limited evidence)
      - IVIG (intravenous immunoglobulin) 2-3 g/kg total dose over 3-5 days - Most studied, may reduce mortality if given early
      - Cyclosporine 3-5 mg/kg/day PO/IV - Alternative, some evidence for benefit
      - Systemic corticosteroids - Controversial (may increase infection risk), some use high-dose methylprednisolone in early disease
      - Etanercept (TNF-alpha inhibitor) - Case reports suggest benefit
      - No definitive proven therapy, supportive care most important
      - Infection surveillance - Monitor for sepsis (leading cause of death), cultures if fever or clinical decline
      - Prognosis - SJS mortality 5-10%, higher if elderly, extensive BSA, comorbidities

  - id: sjs_ten_overlap
    type: diagnosis
    name: "SJS-TEN Overlap"
    icd10: "L51.2"
    urgency: critical
    workup:
      - Same as SJS, but 10-30% BSA epidermal detachment
      - Higher SCORTEN score, worse prognosis than SJS alone
    treatment:
      - Same as SJS management
      - Burn unit or ICU admission mandatory
      - More aggressive fluid resuscitation (higher BSA involvement)
      - Higher mortality than SJS (10-30%)

  - id: toxic_epidermal_necrolysis
    type: diagnosis
    name: "Toxic Epidermal Necrolysis (TEN)"
    icd10: "L51.2"
    urgency: critical
    workup:
      - Same workup as SJS
      - Definition - >30% BSA epidermal detachment
      - More severe end of SJS-TEN spectrum
      - Higher SCORTEN score
    treatment:
      - MEDICAL EMERGENCY - Burn unit admission mandatory
      - Same management principles as SJS but more intensive
      - Fluid resuscitation - Greater fluid losses (treat like severe burn), but still use less than Parkland formula
      - More aggressive supportive care
      - Higher risk of complications - Sepsis (leading cause of death), ARDS, GI bleeding, renal failure, hepatic dysfunction
      - Immunomodulatory therapy - Consider IVIG 2-3 g/kg or cyclosporine (earlier in course may be more beneficial)
      - Multidisciplinary team - Burn surgery, dermatology, ophthalmology, critical care, nutrition
      - Prognosis - Mortality 25-50% (higher with greater BSA involvement and higher SCORTEN)
      - Long-term sequelae - Cutaneous (hypo/hyperpigmentation, scarring), ocular (dry eye, symblepharon, vision loss), oral (xerostomia), genital (vaginal stenosis), psychological (PTSD)
      - Survivor follow-up - Dermatology (monitor for scarring, pigment changes), ophthalmology (chronic dry eye, vision monitoring), psychology (PTSD common)
      - Avoid causative drug class permanently - Patient should wear medical alert bracelet, drug should be documented in chart as severe allergy
