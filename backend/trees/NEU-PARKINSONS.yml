referrals:
  - 'Neurology (movement disorders): For diagnosis confirmation, medication management'
  - 'Physical therapy: Gait training, fall prevention, Lee Silverman Voice Treatment (LSVT BIG)'
  - 'DBS evaluation if: Motor fluctuations refractory to medication optimization'
