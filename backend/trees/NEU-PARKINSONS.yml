author: RealDiag Clinical Team
homeopathy: []
presentations:
- resting tremor, rigidity, bradykinesia, postural instability
- gradual onset, typically older adults
- 'Resting tremor: 4-6 Hz pill-rolling, unilateral initially, improves with movement'
- 'Bradykinesia: Slow movements, reduced arm swing, masked facies, micrographia'
- 'Rigidity: Cogwheel rigidity on passive movement'
- 'Postural instability: Stooped posture, shuffling gait, festination'
workup:
- 'Clinical diagnosis: No lab test required, diagnosis based on cardinal features'
- 'DaTscan (not routine): SPECT imaging shows reduced striatal dopamine transporter
  uptake'
- 'MRI brain: Rule out atypical parkinsonism (vascular, PSP, MSA) - normal in idiopathic
  PD'
- 'Response to levodopa: Improvement supports diagnosis (atypical parkinsonism doesn''t
  respond)'
treatment:
- 'Guideline-based treatment options for Parkinson disease include:'
- 'Start when functional impairment: Carbidopa/levodopa 25/100mg TID, titrate by 25/100mg
  q3-7days (AAN 2024)'
- 'Alternative first-line (age <65): Dopamine agonist (ropinirole, pramipexole) -
  delays motor complications (AAN 2024)'
- 'MAO-B inhibitors: Rasagiline 1mg daily or selegiline 5mg BID (mild symptoms, delays
  need for levodopa) (AAN 2024)'
- 'Motor fluctuations: COMT inhibitors (entacapone), amantadine (dyskinesias), MAO-B
  inhibitors (AAN 2024)'
- 'Deep brain stimulation: If motor fluctuations refractory to meds, age <70, good
  levodopa response (AAN 2024)'
clinical_pearls:
- 'Clinical diagnosis: Requires bradykinesia + tremor and/or rigidity'
- 'Dopaminergic deficiency: Degeneration of substantia nigra pars compacta'
- 'Carbidopa/levodopa: Gold standard, start when symptoms interfere with function'
- 'Honeymoon period: 3-5 years of good response, then motor fluctuations (wearing
  off, dyskinesias)'
- 'Non-motor symptoms: REM sleep behavior disorder, constipation, hyposmia, depression
  precede motor'
- 'DaTscan: SPECT imaging shows reduced striatal dopamine uptake (not routinely needed)'
referrals:
- 'Neurology (movement disorders): For diagnosis confirmation, medication management'
- 'Physical therapy: Gait training, fall prevention, Lee Silverman Voice Treatment
  (LSVT BIG)'
- 'DBS evaluation if: Motor fluctuations refractory to medication optimization'
differentials:
  - Essential tremor
  - Vascular parkinsonism
  - Drug-induced parkinsonism
  - PSP
  - Lewy body dementia
