tree_id: GI-LACTOSE-INTOLERANCE
name: Lactose Intolerance
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Bloating and diarrhea after dairy products
description: Inability to digest lactose due to lactase enzyme deficiency causing osmotic diarrhea, bloating, and cramping after dairy consumption. Lactose-free diet or lactase supplementation resolves symptoms.
icd10: E73.9
snomed: 267425008
presentations:
  - Abdominal pain, cramping after dairy consumption
  - Bloating, gas
  - Diarrhea (30 min to 2 hrs after lactose)
  - Nausea
  - Symptoms improve with lactose avoidance
urgency: non-urgent

referrals:
  emergency:
    - GI bleeding with instability
    - Acute liver failure
    - Perforated viscus
    - Cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting
  routine:
    - IBS management
    - GERD treatment
    - Screening colonoscopy

workup:
  - Clinical diagnosis: bloating, cramping, flatulence, and diarrhea 30 minutes to 2 hours after consuming dairy products
  - Symptom improvement with lactose avoidance: therapeutic trial of lactose-free diet x2 weeks (if symptoms resolve, diagnosis confirmed)
  - Hydrogen breath test (gold standard): measures breath hydrogen after lactose challenge (undigested lactose fermented by colonic bacteria produces hydrogen)
  - Rise in breath hydrogen above 20 ppm after lactose load indicates malabsorption
  - Lactose tolerance test: rarely used, measures blood glucose after lactose load (rise below 20 mg/dL indicates malabsorption)
  - Stool pH: below 5.5 suggests carbohydrate malabsorption (rarely used)
  - Types: primary (age-related decline in lactase, most common in adults, genetic), secondary (intestinal injury from infection, celiac, Crohn), congenital (rare)
  - Prevalence varies by ethnicity: 90% East Asian, 70% African, 50% Hispanic, 15% Northern European descent
  - Rule out other causes if atypical: celiac disease, IBD, IBS, small intestinal bacterial overgrowth

treatment:
  - Lactose restriction: reduce or eliminate dairy products based on individual tolerance
  - Most lactose intolerant can tolerate small amounts (12 g lactose = 1 cup milk)
  - Lactose-free alternatives: lactose-free milk, almond milk, soy milk, coconut milk, oat milk
  - Lactase supplementation: lactase enzyme tablets (Lactaid) taken with dairy-containing meals (breaks down lactose, allows dairy consumption)
  - Dose: 3000-9000 FCC lactase units taken immediately before dairy
  - Hard cheeses and yogurt better tolerated: lower lactose content (aged cheese has minimal lactose, yogurt bacteria produce lactase)
  - Greek yogurt especially well-tolerated: higher protein, lower lactose than regular yogurt
  - Gradual reintroduction: some individuals develop tolerance with gradual dairy reintroduction (colonic bacteria adapt)
  - Calcium supplementation: if avoiding dairy completely, ensure adequate calcium intake 1000-1200 mg daily (prevent osteoporosis)
  - Vitamin D supplementation: 800-1000 IU daily if limited dairy intake
  - Hidden lactose sources: processed foods, medications, baked goods (read labels)
  - Probiotic supplements: may improve lactose digestion (Lactobacillus, Bifidobacterium strains produce lactase)

clinical_pearls:
  - Bloating, cramping, diarrhea 30 minutes to 2 hours after dairy consumption
  - Therapeutic trial of lactose-free diet x2 weeks diagnostic if symptoms resolve
  - Most can tolerate small amounts of lactose (dosing threshold varies)
  - Hard cheeses and yogurt better tolerated than milk (lower lactose)
  - Lactase enzyme supplements allow dairy consumption
  - Common in adults - prevalence varies by ethnicity (90% East Asian, 15% Northern European)
  - Ensure adequate calcium 1000-1200 mg daily if avoiding dairy
  - Secondary lactose intolerance after GI infection often temporary

differentials:
  - Irritable bowel syndrome: bloating, diarrhea, cramping, not specifically related to dairy, no malabsorption
  - Celiac disease: diarrhea, weight loss, may have secondary lactose intolerance, positive tissue transglutaminase antibody
  - Inflammatory bowel disease: diarrhea often bloody, weight loss, systemic symptoms, elevated inflammatory markers
  - Small intestinal bacterial overgrowth: bloating, diarrhea with various foods, positive glucose breath test

trace: |
  A 32-year-old woman of East Asian descent presented with 1 year of intermittent bloating, cramping, and diarrhea. Symptoms occur primarily after breakfast (cereal with milk) and after ice cream. Bowel movements watery 2-3 times within 2 hours of dairy consumption. No blood in stool, no weight loss. Family history of similar symptoms (mother avoids dairy). Exam unremarkable, abdomen soft non-tender. Suspected lactose intolerance. Recommended therapeutic trial: eliminate all dairy products x2 weeks and monitor symptoms. Patient reported complete resolution of bloating and diarrhea within 3 days of dairy elimination. Reintroduced milk 1 cup - symptoms returned within 90 minutes (bloating, cramping, loose stool). Diagnosed with lactose intolerance. Counseled on lactose-free diet: switch to lactose-free milk or almond milk, avoid regular milk and ice cream, hard cheeses and Greek yogurt better tolerated. Provided lactase enzyme tablets (Lactaid) to take before dairy-containing meals when avoiding dairy not possible. Recommended calcium carbonate 600 mg BID plus vitamin D 1000 IU daily for bone health. At 3 months symptoms controlled, using lactose-free milk at home, takes lactase tablets before occasional ice cream or restaurant meals with dairy, no bloating or diarrhea. Tolerates small amounts of cheese without symptoms. Quality of life improved significantly.
