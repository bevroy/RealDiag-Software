tree_id: RHEUM-OA
name: Osteoarthritis
family: Rheumatology
specialty: Rheumatology
icd10:
- M19.90
- M17.9
- M16.9
snomed:
- '396275006'
urgency: medium
description: Comprehensive evaluation and management of Osteoarthritis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Joint pain worse with activity
- Morning stiffness < 30 minutes
- Bony enlargement (Heberden's, Bouchard's nodes)
- Crepitus
- Loss of range of motion
workup:
- Clinical diagnosis usually sufficient
- 'X-ray: Joint space narrowing, osteophytes, subchondral sclerosis, subchondral cysts'
- 'Kellgren-Lawrence grading: 0 (normal), 1 (doubtful), 2 (minimal), 3 (moderate),
  4 (severe)'
- 'Labs: Normal ESR/CRP, normal RF/anti-CCP (helps differentiate from RA if unclear)'
treatment:
- 'Guideline-based treatment options for Osteoarthritis include:'
- 'Weight loss if overweight: 5-10% weight loss reduces knee pain 50% (most effective
  non-pharmacologic intervention) (ACR 2023)'
- 'Physical therapy: Quadriceps strengthening for knee OA, range of motion exercises
  (ACR 2023)'
- 'Acetaminophen 1g TID-QID: First-line (safer than NSAIDs, less effective) (ACR 2023)'
- 'NSAIDs: Ibuprofen 600mg TID or naproxen 500mg BID (more effective than acetaminophen,
  GI/CV/renal risks) (ACR 2023)'
- 'Intra-articular steroid injections: Triamcinolone 40-80mg for knee/hip - 3-6 months
  relief, max 3-4 per year (ACR 2023)'
- 'Joint replacement (total knee/hip arthroplasty): If severe pain limiting function
  despite medical management (ACR 2023)'
clinical_pearls:
- Most common arthritis - degenerative 'wear and tear' of cartilage, 50% of adults
  >65 have radiographic OA
- Weight-bearing joints (knees, hips) and hands (DIP, PIP, CMC thumb) most affected
- Heberden nodes (DIP) and Bouchard nodes (PIP) - bony osteophytes pathognomonic for
  OA
- Pain worse with activity, improves with rest (vs RA which is worse with rest, improves
  with activity)
- Morning stiffness <30 minutes (vs RA >1 hour) - 'gel phenomenon' from synovial fluid
  stasis
referrals:
- Orthopedics for joint replacement if severe pain limiting daily activities despite
  conservative management
- Rheumatology if diagnostic uncertainty (atypical age, inflammatory features)
differentials: []
trace:
  source: American College of Rheumatology (ACR) Guidelines, European League Against
    Rheumatism (EULAR)
