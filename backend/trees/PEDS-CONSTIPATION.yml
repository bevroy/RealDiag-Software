tree_id: PEDS-CONSTIPATION
name: Constipation (Pediatric)
family: pediatrics
specialty: Pediatrics/Gastroenterology
icd10: K59.00
snomed: 14760008
urgency:
  - Abdominal distension with vomiting (concern for obstruction)
  - Severe abdominal pain with peritoneal signs
  - Acute urinary retention
  - Fecal impaction with overflow incontinence
  - Neurologic symptoms (lower extremity weakness, saddle anesthesia)
homeopathy: []
presentations:
  - Infrequent bowel movements (less than 3 per week)
  - Hard, dry, or pellet-like stools
  - Painful defecation or crying with bowel movements
  - Stool withholding behavior (child holds stool, resists urge)
  - Large-diameter stools that clog toilet
  - Abdominal pain or cramping
  - Decreased appetite
  - Encopresis (fecal soiling or overflow incontinence)
  - Blood on stool or toilet paper (from anal fissures)
  - Palpable stool in abdomen or on rectal exam
  - Irritability or behavioral changes related to toileting
  - Diet history of low fiber, excessive dairy intake
workup:
  - Clinical history
  - Onset and duration of constipation
  - Frequency of bowel movements (normal varies by age)
  - 'Newborn: 4 or more daily, infants: 2 daily, older children: 1-2 daily to 3 per week'
  - Stool consistency (Bristol Stool Scale - hard lumps versus soft formed)
  - Pain with defecation, bleeding, or anal fissures
  - Stool withholding behaviors (squatting, stiffening legs, hiding, crossing legs)
  - Toilet training history and timeline
  - Encopresis or fecal soiling (suggests overflow incontinence from impaction)
  - Diet history
  - Low fiber intake (insufficient fruits, vegetables, whole grains)
  - Excessive dairy product consumption (milk, cheese)
  - Inadequate fluid intake
  - Recent dietary changes
  - Fluid intake adequacy
  - Urinary symptoms (enuresis, UTIs - may be associated)
  - Developmental history and milestones
  - Stool withholding often begins during toilet training (age 2-4 years)
  - Red flag symptoms (suggest organic pathology)
  - Onset before 1 month of age (Hirschsprung disease)
  - Delayed passage of meconium (greater than 48 hours in term infant)
  - Failure to thrive or poor weight gain
  - Explosive diarrhea or chronic diarrhea
  - Fever with constipation
  - Bilious vomiting
  - Blood in stool without anal fissure
  - Neurologic symptoms (weakness, sensory changes)
  - Abnormal thyroid or growth parameters
  - Physical examination
  - Growth parameters (height, weight, BMI) - plot on growth chart
  - Failure to thrive suggests organic disease
  - Abdominal examination
  - Distension, palpable stool (left lower quadrant or suprapubic)
  - Tenderness, masses, organomegaly
  - External anal examination
  - Anal fissures (most common cause of painful defecation)
  - Perianal skin tags or fistulas (Crohn disease)
  - Anteriorly displaced anus
  - Anal wink reflex (test S2-S4 innervation)
  - Digital rectal examination
  - Usually NOT needed for functional constipation diagnosis
  - Consider if red flags, diagnostic uncertainty, or concern for Hirschsprung
  - Assess sphincter tone, rectal vault size, stool consistency and amount
  - Tight sphincter with empty vault suggests Hirschsprung disease
  - Lax sphincter or neurologic concern requires further evaluation
  - Spine examination
  - Midline defects (tuft of hair, dimple, nevus) - tethered cord concern
  - Neurologic examination
  - Lower extremity strength, sensation, reflexes
  - Gait abnormalities
  - Laboratory and imaging
  - NOT routinely indicated for functional constipation (clinical diagnosis)
  - Consider if red flags present or refractory to treatment
  - Abdominal X-ray (supine)
  - Assess stool burden if diagnosis uncertain or severe impaction
  - Not required for diagnosis but may support clinical impression
  - Thyroid function tests (TSH, free T4) if growth delay or clinical hypothyroidism signs
  - Celiac screen (tissue transglutaminase IgA, total IgA) if growth delay or diarrhea alternating with constipation
  - Lead level if pica or environmental exposure
  - Serum calcium (hypercalcemia rare cause)
  - Sweat chloride test if failure to thrive or recurrent pneumonia (cystic fibrosis)
  - Anorectal manometry if concern for Hirschsprung disease (absence of rectoanal inhibitory reflex)
  - Rectal biopsy (gold standard) if Hirschsprung suspected (absence of ganglion cells)
treatment:
  - Behavioral and dietary modifications - FIRST-LINE
  - Education and reassurance
  - Functional constipation is common, benign, treatable
  - Not child's fault, avoid punishment for soiling
  - Treatment often takes months, requires patience
  - Dietary changes
  - Increase fiber intake
  - Age in years + 5 grams = daily fiber goal (e.g., 3-year-old needs 8 g/day)
  - Fruits (prunes, pears, peaches, apples), vegetables, whole grains, beans
  - Prune juice particularly effective (sorbitol acts as osmotic laxative)
  - Adequate fluid intake (water, avoid excessive juice or milk)
  - Limit excessive dairy products (no more than 16-24 oz milk daily)
  - Regular physical activity
  - Toilet training and routine
  - Scheduled toilet sits (5-10 minutes after meals, twice daily)
  - Take advantage of gastrocolic reflex
  - Proper positioning (feet supported on stool if using adult toilet)
  - Positive reinforcement (sticker chart for sitting attempts, not just success)
  - Avoid punishment or pressure
  - Disimpaction (if fecal impaction present)
  - Oral disimpaction (preferred if tolerated, takes 3-5 days)
  - Polyethylene glycol (PEG, MiraLAX) high dose: 1-1.5 g/kg/day for 3-6 days (max 17 g/day)
  - Alternative: mineral oil 3 mL/kg/day (age greater than 1 year, max 90 mL/day) for 3 days
  - Rectal disimpaction (faster, if severe impaction or oral not tolerated)
  - Pediatric glycerin suppository (age less than 3 years)
  - Bisacodyl suppository (age greater than 3 years)
  - Pediatric Fleet enema (sodium phosphate) - use cautiously, risk electrolyte imbalance
  - Maintenance therapy (after disimpaction, continue for months)
  - Polyethylene glycol (PEG 3350, MiraLAX) - FIRST-LINE
  - Starting dose: 0.4-0.8 g/kg/day (usual 17 g/day for school-age child)
  - Titrate dose to achieve soft daily stools
  - Well-tolerated, safe for long-term use (months to years)
  - Lactulose 1-3 mL/kg/day divided twice daily (alternative to PEG)
  - Sweet taste may be less palatable
  - Magnesium hydroxide (Milk of Magnesia) 1-3 mL/kg/day
  - Use cautiously if renal insufficiency (magnesium accumulation)
  - Mineral oil 1-3 mL/kg/day (age greater than 1 year)
  - Risk aspiration if given to young child or child with swallowing difficulty
  - Senna (stimulant laxative) - second-line, short-term use
  - Age 2-6 years: 2.5-7.5 mL/day
  - Age greater than 6 years: 5-15 mL/day
  - Avoid long-term use (concern for dependency, tolerance)
  - Rectal therapies (if needed for breakthrough constipation)
  - Glycerin suppository (infants and toddlers)
  - Bisacodyl suppository (older children)
  - Duration of treatment
  - Maintenance therapy typically needed for months (often 6-24 months)
  - Gradual weaning after several months of regular soft stools
  - Reduce dose by 25% every 2-4 weeks as tolerated
  - Refractory constipation management
  - Ensure compliance with medications and dietary changes
  - Increase PEG dose (can use up to 1-2 g/kg/day if needed)
  - Add stimulant laxative (senna) if osmotic alone insufficient
  - Consider specialist referral
clinical_pearls:
  - 'Functional constipation accounts for 95% of childhood constipation - usually clinical diagnosis, labs and imaging not needed'
  - 'Red flags requiring further workup: onset before 1 month, delayed meconium passage, failure to thrive, neurologic symptoms, explosive diarrhea'
  - 'Stool withholding behavior (child resists urge to defecate) creates vicious cycle - harder stool, more pain, more withholding'
  - 'Disimpaction MUST be completed before starting maintenance therapy - maintenance alone will not clear impaction'
  - 'Polyethylene glycol (MiraLAX) is first-line maintenance therapy - safe, effective, well-tolerated for long-term use (months to years)'
  - 'Encopresis (fecal soiling) usually represents overflow incontinence from severe impaction - NOT intentional, NOT behavioral problem'
  - 'Treatment often takes many months (6-24 months typical) - set realistic expectations, patience required'
  - 'Delayed passage of meconium (greater than 48 hours in term infant) warrants evaluation for Hirschsprung disease'
referrals:
  - Pediatric gastroenterology if red flag symptoms, refractory to treatment after 3-6 months, concern for Hirschsprung or anatomic abnormality
  - Pediatric surgery if Hirschsprung disease confirmed, anorectal malformation, or severe refractory constipation
  - Pediatric neurology if neurologic abnormalities, tethered cord suspected, or spinal dysraphism
  - Behavioral health if significant behavioral issues, toilet refusal, or psychosocial stressors contributing
differentials:
  - Functional constipation (95% of cases) - stool withholding, dietary factors, no organic cause
  - Hirschsprung disease (congenital aganglionic megacolon) - delayed meconium passage, tight sphincter with empty rectal vault, biopsy diagnostic
  - Anal fissure (painful defecation leads to stool withholding)
  - Celiac disease (constipation, diarrhea, failure to thrive, abdominal distension)
  - Hypothyroidism (constipation, fatigue, cold intolerance, growth delay, elevated TSH)
  - Cystic fibrosis (meconium ileus in newborn, recurrent pneumonia, failure to thrive)
  - Spinal cord abnormality (tethered cord, spinal dysraphism) - neurologic symptoms, back findings
  - Cow's milk protein allergy (infants, constipation with anal fissures, occult blood)
  - Medications (opioids, anticholinergics, iron, antacids)
  - Hypercalcemia (constipation, polyuria, weakness, rare)
