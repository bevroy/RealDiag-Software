tree_id: PULM-SLEEP-APNEA-OBSTRUCTIVE
name: Obstructive Sleep Apnea
family: Pulmonology
specialty: Sleep Medicine
chief_complaint: Snoring and daytime sleepiness
description: Repetitive upper airway collapse during sleep causing apneas, hypoxemia, sleep fragmentation, and daytime sleepiness. CPAP therapy highly effective, reduces cardiovascular risk and improves quality of life.
icd10: G47.33
urgency: non-urgent

workup:
  - Clinical screening: STOP-BANG score (Snoring, Tired, Observed apneas, high BP, BMI >35, Age >50, Neck >40 cm, male Gender) - score ≥3 high risk
  - Epworth Sleepiness Scale: 0-10 normal, 11-24 excessive daytime sleepiness
  - Polysomnography (in-lab sleep study): gold standard, measures AHI (apnea-hypopnea index), oxygen desaturation, sleep architecture
  - Home sleep apnea testing (HSAT): alternative if high pretest probability, measures AHI and oxygen saturation (less expensive, more convenient)
  - AHI severity: normal <5, mild 5-15, moderate 15-30, severe >30 events per hour
  - Screening for complications: BP (hypertension common), ECG (atrial fibrillation risk), fasting glucose (diabetes association)

treatment:
  - Positive airway pressure therapy (first-line): CPAP (continuous positive airway pressure) most effective treatment, prevents airway collapse
  - CPAP adherence: use ≥4 hours per night ≥70% of nights, mask fitting and comfort crucial, humidification reduces dryness
  - CPAP benefits: improves daytime sleepiness, reduces hypertension, decreases cardiovascular events, improves quality of life
  - BiPAP (bilevel PAP): if CPAP intolerant, provides different pressures for inhalation and exhalation
  - Auto-adjusting PAP (APAP): automatically adjusts pressure throughout night
  - Lifestyle modifications: weight loss 10% reduces AHI by 30%, avoid alcohol and sedatives (worsen apneas), sleep position training (avoid supine)
  - Oral appliances (mandibular advancement device): if CPAP intolerant or mild-moderate OSA, advances lower jaw to open airway, fitted by dentist
  - Surgery options: uvulopalatopharyngoplasty (UPPP), tonsillectomy if enlarged tonsils, maxillomandibular advancement for severe refractory cases
  - Hypoglossal nerve stimulation (Inspire): implantable device stimulates tongue to prevent collapse, if CPAP failure and specific criteria
  - Treat underlying conditions: hypothyroidism, acromegaly (rare causes)
  - Follow-up: reassess symptoms and CPAP adherence regularly, repeat sleep study if weight change >10% or persistent symptoms despite treatment

clinical_pearls:
  - Snoring, witnessed apneas, daytime sleepiness classic triad
  - STOP-BANG score ≥3 high risk, refer for sleep study
  - Polysomnography diagnostic - AHI >5 confirms OSA (mild 5-15, moderate 15-30, severe >30)
  - CPAP first-line treatment - highly effective, improves symptoms and cardiovascular outcomes
  - CPAP adherence critical - ≥4 hours per night ≥70% nights
  - Weight loss 10% reduces AHI 30%
  - Untreated OSA increases risk hypertension, stroke, MI, atrial fibrillation
  - Screen for and treat comorbid conditions (hypertension, diabetes, depression)

differentials:
  - Central sleep apnea: apneas without respiratory effort (OSA has effort against collapsed airway), associated with heart failure, stroke, opioids
  - Insomnia: difficulty falling or staying asleep, no snoring or apneas
  - Narcolepsy: excessive daytime sleepiness with cataplexy, sleep paralysis, hypnagogic hallucinations
  - Hypothyroidism: fatigue, weight gain, can cause or worsen OSA

trace: |
  A 52-year-old obese man (BMI 38) presented with wife's complaints of loud snoring, witnessed breathing pauses during sleep multiple times per night, and patient's complaint of severe daytime sleepiness affecting work performance. Epworth Sleepiness Scale 18 (excessive). STOP-BANG score 7 (high risk). BP 152/94 (hypertension). Referred for in-lab polysomnography which showed AHI 42 (severe OSA), lowest oxygen saturation 78%, frequent arousals, sleep efficiency 65%. Sleep architecture disrupted. Diagnosed with severe obstructive sleep apnea. Started CPAP therapy with auto-titrating pressure. Sleep medicine follow-up at 2 weeks for mask fitting and troubleshooting. At 6 weeks excellent CPAP adherence (average 6.5 hours per night, 95% nights), AHI on CPAP reduced to 2 (residual events minimal). Epworth improved to 6 (normal), daytime alertness dramatically improved, wife reports no more snoring or apneas. At 3 months BP improved to 132/82 with same medications. Counseled on weight loss, lost 15 pounds over 6 months. At 12 months continues excellent CPAP adherence, weight down 25 pounds, BP 128/78, excellent quality of life, reduced cardiovascular risk.
