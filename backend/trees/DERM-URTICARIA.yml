tree_id: DERM-URTICARIA
name: Urticaria (Hives)
family: Dermatology
specialty: Dermatology
icd10:
- L50.9
- L50.0
snomed:
- '126485001'
urgency: medium
description: Comprehensive evaluation and management of Urticaria (Hives)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Pruritic wheals (raised, blanching lesions)
- Transient lesions that resolve within 24 hours
- Central pallor with erythematous border
- Variable size from few millimeters to large plaques
- Migratory pattern (lesions appear and disappear in different locations)
- May have angioedema (deeper swelling of face, lips, tongue, extremities)
- Worse with heat, pressure, or scratching
- Associated with flushing or warmth
- Triggered by allergens (food, medications, insect stings)
- Can occur with infections (viral URI), stress, or physical stimuli
- May have dermographism (skin writing from light scratching)
- Systemic symptoms if anaphylaxis (dyspnea, hypotension, GI symptoms)
workup:
- Usually clinical diagnosis, no tests needed for acute urticaria
- For chronic urticaria: CBC, ESR/CRP, TSH, tryptase (if mastocytosis suspected)
- Skin biopsy if concern for urticarial vasculitis (lesions >24hrs, bruising)
treatment:
- 'Guideline-based treatment options for Urticaria (Hives) include:'
- 'Acute: H1 antihistamine (cetirizine 10mg or fexofenadine 180mg daily), can increase
  up to 4x dose (AAD 2023)'
- Add H2 blockerif inadequate response (AAD 2023)
- 'Severe/angioedema: Prednisone 40-60mg daily for 3-5 days, epinephrine if airway
  compromise (AAD 2023)'
- 'Chronic: Daily non-sedating H1 antihistamine, increase to 4x dose if needed (AAD
  2023)'
- 'Refractory chronic: Omalizumab 150-300mg SQ monthly (anti-IgE) (AAD 2023)'
clinical_pearls:
- 'Acute (<6 weeks): Usually identifiable trigger. Chronic (>6 weeks): Often idiopathic'
- Individual lesions resolve in <24 hours (if longer, consider urticarial vasculitis)
- 'Angioedema without urticaria: Think ACE inhibitor, hereditary angioedema, C1 esterase
  deficiency'
- 'Common triggers: Foods (shellfish, nuts), medications (NSAIDs, antibiotics), infections'
- 'Physical urticaria: Dermatographism (skin writing), cold-induced, exercise-induced'
referrals:
- Allergy/Immunology for chronic urticaria or recurrent angioedema
- Consider allergy testing if clear food/medication trigger suspected
differentials: []
