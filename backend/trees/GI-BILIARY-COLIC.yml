tree_id: GI-BILIARY-COLIC
name: Biliary Colic
family: gastroenterology
specialty: Gastroenterology
icd10: K80.20
snomed: 26329005
urgency: []
homeopathy: []
presentations:
  - Sudden onset severe right upper quadrant or epigastric pain
  - Pain typically lasts 30 minutes to 6 hours
  - Pain often triggered by fatty meals
  - Steady, constant pain (not truly colicky despite name)
  - Radiation to right shoulder or scapula
  - Nausea and vomiting common
  - Pain resolves completely between episodes
  - No fever (distinguishes from cholecystitis)
  - Normal laboratory values (no inflammation)
workup:
  - Right upper quadrant ultrasound (first-line imaging)
  - Identifies gallstones, gallbladder wall thickness, pericholecystic fluid
  - Normal gallbladder wall (<3 mm) and no pericholecystic fluid (not cholecystitis)
  - Laboratory tests: CBC, CMP, liver enzymes, lipase, bilirubin
  - Normal WBC count and liver enzymes (if elevated, consider cholecystitis or choledocholithiasis)
  - HIDA scan if diagnosis unclear and ultrasound non-diagnostic
  - Consider EGD if symptoms atypical or to rule out peptic ulcer disease
treatment:
  - Acute episode management
  - NSAIDs (ketorolac 30 mg IM/IV) or opioids (morphine) for pain control
  - Antiemetics (ondansetron 4-8 mg IV) for nausea and vomiting
  - NPO during acute episode, advance diet as tolerated
  - Avoid triggering foods (high-fat, fried, greasy foods)
  - Definitive treatment - laparoscopic cholecystectomy
  - Elective cholecystectomy recommended for symptomatic cholelithiasis
  - Surgery typically scheduled within 2-6 weeks after initial episode
  - Earlier surgery preferred to prevent complications (cholecystitis, pancreatitis, choledocholithiasis)
  - Conservative management acceptable if patient refuses surgery or high surgical risk
  - Ursodeoxycholic acid (UDCA) 8-10 mg/kg/day may dissolve small cholesterol stones (limited efficacy)
clinical_pearls:
  - "Despite name, pain is constant and steady, not colicky"
  - "Duration <30 minutes or >6 hours suggests alternative diagnosis"
  - "Murphy's sign absent in biliary colic (present in cholecystitis)"
  - "Risk factors: female, forty, fertile, fat, fair (5 F's) - but can occur in anyone"
  - "10-25% of adults have gallstones, but only 20% become symptomatic"
  - "Recurrent episodes common - 70% have repeat symptoms within 2 years"
  - "Elective cholecystectomy safer than waiting for complications"
  - "Complications include acute cholecystitis (10-20%), pancreatitis (3-7%), choledocholithiasis"
referrals:
  - General Surgery for laparoscopic cholecystectomy
  - Gastroenterology if ERCP needed for suspected choledocholithiasis
  - Consider surgical referral after first episode of symptomatic biliary colic
differentials:
  - Acute cholecystitis (fever, persistent pain >6 hours, positive Murphy's sign, WBC elevation)
  - Choledocholithiasis (jaundice, elevated bilirubin and liver enzymes)
  - Acute pancreatitis (elevated lipase >3x normal, epigastric pain radiating to back)
  - Peptic ulcer disease (epigastric pain, relation to meals, response to antacids)
  - Gastroesophageal reflux disease (burning epigastric pain, worse when supine)
  - Hepatitis (elevated transaminases, malaise, jaundice)
  - Right-sided renal colic (flank pain, hematuria, colicky pain)
  - Cardiac ischemia (especially inferior MI) - always consider in older patients
trace:
  source: Tokyo Guidelines 2018, SAGES Guidelines on Gallstone Disease
