tree_id: URO-TESTICULAR-PAIN
name: Testicular Pain (Acute Scrotal Pain)
family: urology
specialty: Urology/Emergency Medicine
icd10: N50.819
snomed: 249297007
urgency: []
homeopathy: []
presentations:
  - Acute onset testicular pain (sudden severe pain - think torsion until proven otherwise)
  - Gradual onset testicular pain (more likely epididymitis or orchitis)
  - Unilateral or bilateral pain
  - Scrotal swelling, erythema, warmth
  - Nausea and vomiting (common with torsion)
  - Fever if infectious cause (epididymitis, orchitis)
  - Dysuria, urethral discharge if urinary tract infection or STI
  - Pain with walking or movement
  - Lower abdominal or inguinal pain may radiate to testicle
workup:
  - URGENT evaluation if acute onset - testicular torsion is time-sensitive emergency
  - History
  - Onset (sudden vs gradual), duration, severity
  - Trauma history
  - Sexual activity, urethral discharge (STI risk)
  - Fever, dysuria (infection)
  - Similar prior episodes
  - Age (torsion bimodal: neonates and adolescents 12-18 years)
  - Physical examination (CRITICAL)
  - Inspect scrotum: swelling, erythema, skin changes
  - Palpate testicle and epididymis
  - Testicular torsion: high-riding testicle, horizontal lie, absent cremasteric reflex
  - Epididymitis: tender swollen epididymis (posterior testicle), relief with elevation (Prehn's sign)
  - Orchitis: tender swollen testicle, epididymis normal
  - Cremasteric reflex (CRITICAL for torsion)
  - Stroke inner thigh, testicle should elevate
  - ABSENT in 99% of torsion cases
  - Present in epididymitis
  - Transillumination (if mass palpable)
  - "Hydrocele: transilluminates"
  - "Solid mass: does not transilluminate"
  - Doppler ultrasound (if diagnosis uncertain)
  - "Testicular torsion: DECREASED or ABSENT blood flow to testicle"
  - "Epididymitis: INCREASED blood flow to epididymis"
  - "Orchitis: INCREASED blood flow to testicle"
  - DO NOT delay surgery for ultrasound if high clinical suspicion of torsion
  - Urinalysis and urine culture
  - Pyuria, bacteriuria suggest UTI/epididymitis
  - STI testing if sexually active
  - Gonorrhea and chlamydia NAAT (urine or urethral swab)
  - Laboratory tests
  - CBC if concern for infection (leukocytosis)
  - Tumor markers if concern for malignancy (AFP, beta-hCG, LDH)
treatment:
  - Management based on diagnosis
  - Testicular torsion (SURGICAL EMERGENCY)
  - Time is testicle - viability decreases after 6 hours
  - IMMEDIATE urology consultation
  - Emergent surgical exploration and detorsion
  - Orchiopexy (fixation) of affected and contralateral testicle
  - Orchiectomy if testicle non-viable (necrotic)
  - Manual detorsion can be attempted while awaiting surgery
  - "\"Open book\" technique: rotate laterally (outward) 180-360 degrees"
  - Success indicated by pain relief
  - Epididymitis
  - If STI suspected (age less than 35, sexually active, urethral discharge)
  - Ceftriaxone 500 mg IM single dose PLUS doxycycline 100 mg twice daily for 10 days
  - Covers gonorrhea and chlamydia
  - If UTI suspected (age greater than 35, urinary symptoms, pyuria)
  - Levofloxacin 500 mg daily for 10 days OR trimethoprim-sulfamethoxazole DS twice daily for 10 days
  - Covers E. coli and other uropathogens
  - Supportive care
  - NSAIDs for pain (ibuprofen 600 mg every 6 hours)
  - Scrotal elevation and support (athletic supporter or rolled towel)
  - Ice packs
  - Rest, avoid heavy lifting and sexual activity until resolved
  - Orchitis (viral, often mumps)
  - Supportive care: NSAIDs, scrotal support, rest
  - No specific antiviral treatment for mumps
  - Antibiotics if bacterial cause suspected
  - Testicular tumor
  - Urgent urology referral
  - Radical inguinal orchiectomy for definitive diagnosis and treatment
  - Oncology referral for staging and chemotherapy if needed
  - Trauma
  - Ice, elevation, NSAIDs for minor trauma
  - Ultrasound to rule out rupture or hematocele
  - Surgical exploration if rupture suspected
  - Inguinal hernia
  - Surgical referral for repair
  - Idiopathic/chronic orchialgia
  - NSAIDs, scrotal support
  - Pelvic floor physical therapy
  - Nerve blocks if refractory
  - Consider psychological evaluation (chronic pain)
clinical_pearls:
  - "Testicular torsion is EMERGENCY - must rule out in ANY acute scrotal pain"
  - "Time is testicle: salvage rate 90% if detorsed within 6 hours, drops to 50% at 12 hours, near 0% at 24 hours"
  - "Absent cremasteric reflex is 99% sensitive for torsion - if present, torsion very unlikely"
  - "Bimodal age for torsion: neonates and adolescents 12-18 years (peak 13-14)"
  - "Prehn's sign (relief with testicular elevation) suggests epididymitis but not reliable"
  - "DO NOT delay surgery for ultrasound if high suspicion of torsion"
  - "Epididymitis in sexually active young men: think STI (gonorrhea/chlamydia) - treat empirically"
  - "Epididymitis in older men or with UTI symptoms: think E. coli - treat with fluoroquinolone"
referrals:
  - Urology EMERGENT for suspected testicular torsion (acute severe pain, high-riding testicle, absent cremasteric reflex)
  - Urology urgent for testicular mass, trauma with concern for rupture
  - Urology if epididymitis not improving with 3 days of antibiotics
differentials:
  - Testicular torsion (sudden severe pain, nausea, high-riding testicle, absent cremasteric reflex, decreased blood flow on Doppler - EMERGENCY)
  - Epididymitis (gradual onset, fever, dysuria, tender epididymis, relief with elevation, increased blood flow on Doppler)
  - Orchitis (tender swollen testicle, often viral mumps, increased blood flow)
  - Testicular tumor (painless mass, or dull ache, does not transilluminate)
  - Testicular trauma (history of injury, ecchymosis)
  - Hydrocele (scrotal swelling, transilluminates, painless or mild discomfort)
  - Inguinal hernia (mass in inguinal canal, may extend into scrotum, increases with Valsalva)
  - Spermatocele (painless cystic mass separate from testicle, transilluminates)
  - Varicocele ("bag of worms" feel, worse with standing, decreases when supine)
  - Referred pain (kidney stone, hip pathology, neuropathy)
