nodes:
  - id: cholangitis_evaluation
    type: diagnosis
    name: "Acute Cholangitis"
    icd10: "K83.0"
    urgency: critical
    workup:
      - Acute cholangitis - Bacterial infection of biliary tree due to biliary obstruction
      - MEDICAL EMERGENCY (sepsis risk, mortality 10-30% if untreated)
      - Pathophysiology - Biliary obstruction → bile stasis → bacterial overgrowth → infection → increased biliary pressure → bacteremia/sepsis
      - Normal bile is sterile; obstruction allows bacterial ascent from duodenum
      - Causes of biliary obstruction
      - Choledocholithiasis (gallstones in common bile duct) - Most common (30-70%)
      - Malignant stricture - Cholangiocarcinoma, pancreatic cancer, ampullary carcinoma (10-20%)
      - Benign stricture - Post-surgical, chronic pancreatitis, primary sclerosing cholangitis (PSC)
      - Iatrogenic - Post-ERCP, biliary stent occlusion
      - Parasitic - Ascaris, liver flukes (Clonorchis, Opisthorchis) in endemic areas
      - Microbiology - Polymicrobial (E. coli most common 25-50%, Klebsiella 15-20%, Enterococcus 10-15%, Bacteroides)
      - Clinical presentation - Charcot triad + Reynolds pentad
      - Charcot triad (50-70% patients) - Fever, jaundice, RUQ pain
      - Fever (90%) - Often with rigors (chills)
      - Jaundice (60-70%) - Conjugated hyperbilirubinemia (obstructive)
      - RUQ pain (70%) - Constant or colicky
      - Reynolds pentad (severe, 5-7%) - Charcot triad + altered mental status + hypotension (septic shock)
      - Physical exam
      - Fever (>38°C), tachycardia, hypotension if septic
      - Jaundice (scleral icterus, skin)
      - RUQ tenderness, Murphy sign (inspiratory arrest with deep palpation RUQ), hepatomegaly
      - Altered mental status, shock (Reynolds pentad) - severe cholangitis
      - Labs
      - WBC - Leukocytosis (>10,000, often 15,000-25,000), left shift
      - Liver enzymes - Cholestatic pattern
      - Bilirubin elevated (>2 mg/dL, conjugated/direct), often 5-10 mg/dL
      - Alkaline phosphatase elevated (>3x ULN), GGT elevated
      - Transaminases (AST/ALT) - Mildly elevated (may be markedly elevated if acute obstruction, then decrease as obstruction persists)
      - Blood cultures - Positive 20-70% (E. coli, Klebsiella, Enterococcus)
      - Draw before antibiotics
      - Coagulation - PT/INR may be prolonged (vitamin K deficiency from cholestasis, give vitamin K 10 mg IV)
      - Creatinine - Assess renal function (may be elevated if sepsis/dehydration)
      - Lactate - Elevated if sepsis
      - Imaging
      - Ultrasound RUQ - First-line (rapid, noninvasive)
      - Findings - Dilated common bile duct (CBD >6 mm, >7 mm if post-cholecystectomy), intrahepatic duct dilation, gallstones
      - May visualize CBD stone (echogenic focus with shadow), but sensitivity only 25-50% for choledocholithiasis
      - MRCP (MR cholangiopancreatography) - Best non-invasive imaging for biliary tree
      - Sensitivity/specificity >90% for CBD stones, strictures, masses
      - Visualize level and cause of obstruction
      - CT abdomen with contrast - Alternative, evaluate complications (abscess, perforation), identify masses
      - Less sensitive than MRCP for CBD stones
      - ERCP - Diagnostic AND therapeutic (see treatment)
      - Tokyo Guidelines severity grading
      - Grade I (mild) - Responds to initial treatment (antibiotics, fluids)
      - Grade II (moderate) - Organ dysfunction (WBC >12,000 or <4000, fever >39°C, age >75, bilirubin >5, albumin <3) but responds to medical treatment
      - Grade III (severe) - Organ failure (cardiovascular dysfunction [hypotension requiring vasopressors], neurologic [altered mental status], respiratory [PaO2/FiO2 <300], renal [oliguria, Cr >2], hepatic [PT-INR >1.5], hematologic [platelets <100K])
      - Requires urgent biliary drainage (<24 hours)
    treatment:
      - IMMEDIATE management - Resuscitation + antibiotics + biliary drainage
      - Resuscitation - IV fluids (crystalloid, normal saline or LR 30 mL/kg bolus if hypotensive)
      - Vasopressors (norepinephrine) if persistent hypotension despite fluids
      - Correct coagulopathy - Vitamin K 10 mg IV (give immediately)
      - Fresh frozen plasma if urgent procedure needed and INR >1.5
      - Broad-spectrum antibiotics - START IMMEDIATELY (do NOT wait for cultures)
      - Empiric regimen - Cover gram-negatives (E. coli, Klebsiella) and anaerobes
      - Piperacillin-tazobactam 3.375-4.5 g IV q6-8h (excellent biliary penetration)
      - Ceftriaxone 1-2 g IV daily + metronidazole 500 mg IV q8h
      - Ciprofloxacin 400 mg IV q12h + metronidazole 500 mg IV q8h
      - Meropenem 1 g IV q8h (if severe or healthcare-associated)
      - Add vancomycin if MRSA risk, concern for enterococcus in severe illness
      - Duration - 4-7 days (if source controlled), longer if bacteremia, liver abscess
      - Narrow based on cultures/sensitivities
      - Biliary drainage - ESSENTIAL (antibiotics alone insufficient if obstruction persists)
      - Timing
      - Urgent (<24 hours) - If severe cholangitis (Grade III, septic shock, organ failure)
      - Early (24-72 hours) - If moderate cholangitis (Grade II) or no improvement with antibiotics
      - Elective (after stabilization) - If mild cholangitis (Grade I) responding to antibiotics
      - Methods
      - ERCP (endoscopic retrograde cholangiopancreatography) - FIRST-LINE, success rate 90-95%
      - Sphincterotomy + stone extraction (if choledocholithiasis)
      - Biliary stent placement (if stricture, unable to remove stone, malignancy)
      - Complications - Pancreatitis (5%), bleeding (1-2%), perforation (<1%)
      - Percutaneous transhepatic cholangiography (PTC) - If ERCP fails or anatomy precludes ERCP (altered anatomy post-Roux-en-Y)
      - External biliary drain placement
      - Success rate 95%, but higher complication rate (bile leak, bleeding, sepsis)
      - Surgical decompression - Last resort (if ERCP/PTC fail)
      - Laparotomy, choledochotomy, T-tube placement
      - High morbidity/mortality in sick patients
      - EUS-guided biliary drainage - Emerging technique (if ERCP/PTC fail)
      - Supportive care - ICU if severe (septic shock, organ failure)
      - Monitor vitals, urine output, mental status
      - Serial labs (CBC, CMP, lactate, coagulation)
      - Definitive treatment - Depends on underlying cause
      - Choledocholithiasis - ERCP stone extraction
      - Cholecystectomy (same admission or within 2-6 weeks) to prevent recurrence (if gallbladder in situ)
      - Malignant obstruction - Biliary stent (metal stent if life expectancy >6 months, plastic if shorter or pending definitive treatment)
      - Chemotherapy, radiation, surgical resection (if resectable)
      - Benign stricture - Stricture dilation, stent placement
      - PSC - ERCP for dominant strictures, liver transplant if end-stage
      - Complications
      - Sepsis, septic shock (10-30% severe cholangitis)
      - Hepatic abscess (5%) - Require prolonged antibiotics (4-6 weeks) ± drainage
      - Renal failure (hepatorenal syndrome)
      - DIC (disseminated intravascular coagulation)
      - Death (mortality 5-10% mild, 10-30% severe if delayed treatment)
      - Prevention - Remove/treat biliary obstruction, cholecystectomy if choledocholithiasis
      - Prognosis
      - Mild-moderate - Excellent (mortality <5% with prompt treatment)
      - Severe - Mortality 10-30% (higher if delayed drainage, elderly, comorbidities)
      - Recurrence risk - 10-20% if gallbladder not removed (if choledocholithiasis), stent occlusion (if stented)
