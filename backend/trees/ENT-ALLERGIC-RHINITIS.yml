tree_id: ENT-ALLERGIC-RHINITIS
name: Allergic Rhinitis
family: Ent
specialty: Ent
icd10:
- J30.9
snomed:
- 61582004
urgency: medium
description: Comprehensive evaluation and management of Allergic Rhinitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Nasal congestion, rhinorrhea
- Sneezing
- Itchy nose, eyes, throat
- Postnasal drip
- Watery eyes
- Seasonal or perennial
- Pale, boggy nasal mucosa on exam
workup:
- Clinical diagnosis - testing not routinely needed
- 'Allergy testing (skin prick or specific IgE) if: Considering immunotherapy, unclear
  triggers, refractory to treatment'
- 'Nasal cytology (rarely done): Eosinophils on nasal smear support allergic etiology'
treatment:
- 'Guideline-based treatment options for Allergic Rhinitis include:'
- 'Avoidance: Allergen-impermeable pillow/mattress covers, HEPA filters, remove pets
  from bedroom, reduce indoor humidity <50% (AAO-HNS 2023)'
- 'First-line: Intranasal corticosteroids (fluticasone 2 sprays each nostril daily)
  - most effective, takes 2-4 weeks for full benefit (AAO-HNS 2023)'
- 'Second-gen oral antihistamines: Cetirizine 10mg or loratadine 10mg daily (less
  sedating than first-gen) (AAO-HNS 2023)'
- 'Add if inadequate response: Intranasal antihistamine+ pseudoephedrine 30-60mg q4-6h
  for congestion (AAO-HNS 2023)'
- 'Severe/refractory: Allergen immunotherapy (allergy shots) - only treatment that
  modifies disease, 80-90% effective (AAO-HNS 2023)'
clinical_pearls:
- 'IgE-mediated hypersensitivity: Seasonal (pollens - spring/fall) or perennial (dust
  mites, mold, pet dander)'
- 'Allergic shiners: Dark circles under eyes from venous congestion. Allergic salute:
  Upward nose rubbing causing transverse nasal crease'
- 'Differentiate from viral URI: Itching (eyes, nose, throat) = allergy. Purulent
  discharge, fever = viral/bacterial'
- 'Associated conditions: Asthma (80% of asthmatics have allergic rhinitis), sinusitis,
  otitis media with effusion'
- 'Perennial triggers: Dust mites (bedroom most important), pet dander, cockroach,
  mold'
referrals:
- 'Allergy/Immunology if: Considering immunotherapy, refractory to medical management,
  unclear diagnosis'
- 'ENT if: Nasal polyps, chronic sinusitis, or structural abnormalities (deviated
  septum)'
differentials: []
