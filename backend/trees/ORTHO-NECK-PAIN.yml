tree_id: ORTHO-NECK-PAIN
name: Neck Pain - Cervical Spine Evaluation
family: Orthopedics
specialty: Orthopedics
icd10:
  - M54.2
  - M50.20
  - S13.4XXA
snomed:
  - 81680005
  - 298376008
  - 205324007
urgency: non-urgent
description: Evaluation and management of neck pain including cervical strain, radiculopathy, and whiplash

homeopathy:
  - remedy: Rhus toxicodendron 30C
    indications: Neck stiffness worse on first motion, better with continued movement, worse cold/damp
  - remedy: Bryonia 30C
    indications: Neck pain worse with any movement, better with rest, sharp pain
  - remedy: Arnica montana 30C
    indications: After trauma/whiplash, bruised feeling, sore muscles, worse touch
  - remedy: Cimicifuga 30C
    indications: Neck and upper back stiffness, worse cold/damp, associated headache
  - remedy: Hypericum 30C
    indications: Shooting nerve pain from neck to arm, worse jarring, tingling fingers

presentations:
  - Acute neck pain after trauma (whiplash)
  - Chronic neck pain
  - Neck stiffness and reduced range of motion
  - Neck pain with arm radiation
  - Neck pain with numbness/tingling in arm
  - Morning neck stiffness
  - Neck pain with headaches

differentials:
  - Cervical strain
  - Disc herniation
  - Radiculopathy
  - Whiplash
  - Torticollis

workup:
  - "RED FLAGS requiring immediate evaluation: severe trauma with possible fracture, progressive neurologic deficit, myelopathy signs (gait disturbance, bowel/bladder dysfunction, bilateral arm symptoms, hyperreflexia, positive Babinski), fever with neck pain/stiffness (meningitis), severe pain in elderly (consider vertebral artery dissection or malignancy)"
  - "History: onset (acute vs gradual), mechanism (trauma, poor posture, sleeping position), location, radiation to arm, numbness/tingling, weakness, headaches, aggravating/relieving factors, prior episodes, occupational factors (computer work, heavy lifting)"
  - "Physical exam: inspect posture and alignment, range of motion (flexion/extension, lateral bending, rotation), palpate cervical paraspinal muscles and trapezius, neurologic exam (C5-T1 dermatomes, reflexes, muscle strength), Spurling test (neck extension + rotation + axial compression reproduces arm pain = positive for radiculopathy)"
  - "C5 radiculopathy: lateral arm numbness, weak deltoid and biceps, diminished biceps reflex"
  - "C6 radiculopathy: lateral forearm/thumb numbness, weak wrist extension and biceps, diminished brachioradialis reflex"
  - "C7 radiculopathy: middle finger numbness, weak triceps and wrist flexion, diminished triceps reflex"
  - "C8 radiculopathy: medial forearm/4th-5th finger numbness, weak finger flexion and intrinsic hand muscles"
  - "Myelopathy screening: check for upper motor neuron signs (hyperreflexia, positive Babinski, clonus), gait abnormality, Hoffman sign, Lhermitte sign (electric shock down spine with neck flexion)"
  - "Imaging NOT needed for acute mechanical neck pain without red flags - most resolve in 4-6 weeks"
  - "MRI cervical spine if: myelopathy signs, radiculopathy with progressive deficit, symptoms >6 weeks not improving with conservative care, considering epidural injection"
  - "X-ray cervical spine if: trauma, age >65, severe neurologic deficit, suspected instability"

treatment:
  - "Acute mechanical neck pain: NSAIDs (ibuprofen 400-600 mg TID, naproxen 500 mg BID), acetaminophen 1000 mg TID-QID, muscle relaxants if severe spasm (cyclobenzaprine 5-10 mg TID x5-7 days), remain active (avoid prolonged rest)"
  - "Heat therapy: moist heat 15-20 min several times daily for muscle relaxation"
  - "Physical therapy: neck stretching and strengthening exercises, postural training, ergonomic modifications (computer screen height, pillow support), manual therapy"
  - "Whiplash injury: early mobilization better than immobilization, avoid cervical collar beyond first 72 hours (causes muscle weakening), NSAIDs, gradual return to activity"
  - "Cervical radiculopathy: oral prednisone taper (60 mg x5 days, then taper), gabapentin 300 mg TID or pregabalin 75-150 mg BID for neuropathic pain, physical therapy with traction, consider cervical epidural injection if not improving after 4-6 weeks"
  - "Chronic neck pain: regular exercise (strengthening and stretching), cognitive behavioral therapy, stress management, ergonomic workplace modifications, avoid prolonged static postures"
  - "Avoid: prolonged cervical collar use (causes muscle atrophy), opioids (no better outcomes than NSAIDs), excessive imaging without red flags"

clinical_pearls:
  - "Most acute neck pain is mechanical (cervical strain, facet irritation) and resolves in 4-6 weeks with conservative care"
  - "Spurling test: extend neck, rotate to affected side, apply axial pressure - reproduces arm pain (not just neck pain) in radiculopathy"
  - "Myelopathy vs radiculopathy: myelopathy = spinal cord compression (gait problems, bilateral symptoms, hyperreflexia), radiculopathy = nerve root (unilateral arm pain, dermatomal pattern)"
  - "Whiplash: avoid cervical collar beyond 72h - immobilization delays recovery. Early mobilization is key."
  - "Neck pain + fever + stiffness = meningitis until proven otherwise (Brudzinski and Kernig signs)"
  - "Vertebral artery dissection: severe neck/head pain after minor trauma, Horner syndrome, may have stroke symptoms - needs urgent imaging"
  - "Hoffman sign: flick patient's middle fingernail - if thumb and index finger flex involuntarily, suggests myelopathy"

referrals:
  - Neurosurgery or Orthopedic Spine for: myelopathy (URGENT), progressive neurologic deficit, radiculopathy not improving after 6-12 weeks conservative therapy, MRI-confirmed herniation with surgical indication
  - Physical therapy for: all patients with persistent neck pain >2 weeks, radiculopathy, postural dysfunction, whiplash
  - Pain management for: chronic pain refractory to conservative therapy, consideration for cervical epidural steroid injection
  - Emergency department for: suspected meningitis, vertebral artery dissection, high-energy trauma with neurologic deficit

citations:
  - "North American Spine Society Clinical Guidelines: Diagnosis and Treatment of Cervical Radiculopathy from Degenerative Disorders. 2010."
  - "Carette S, Fehlings MG. Clinical practice: Cervical radiculopathy. N Engl J Med. 2005;353(4):392-399."
  - "Blanpied PR, et al. Neck Pain: Clinical Practice Guidelines. J Orthop Sports Phys Ther. 2017;47(7):A1-A83."
