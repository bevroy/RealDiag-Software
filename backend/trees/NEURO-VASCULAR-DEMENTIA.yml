presentations:
  - Stepwise cognitive decline (sudden worsening with strokes)
  - Executive dysfunction prominent (planning, judgment, problem-solving)
  - Slower processing speed
  - Gait disturbance (small steps, shuffling, falls)
  - Urinary urgency or incontinence
  - Emotional lability or pseudobulbar affect
  - Focal neurologic deficits (weakness, sensory loss from prior strokes)
  - History of stroke or TIA
  - Vascular risk factors (hypertension, diabetes, smoking, hyperlipidemia)

workup:
  - Distinguish from Alzheimer disease: vascular dementia has stepwise decline (sudden worsening with strokes then plateau), executive dysfunction and processing speed more impaired than memory early, gait disturbance and incontinence earlier, Alzheimer has gradual progressive decline with memory loss predominant
  - Diagnostic criteria (probable vascular dementia): cognitive decline interfering with ADLs, cerebrovascular disease on imaging (multiple infarcts, extensive white matter disease, strategic single infarct), temporal relationship between cognitive decline and stroke(s), exclude other causes of dementia
  - History critical: onset and progression (abrupt vs gradual, stepwise vs progressive), temporal relationship to strokes or vascular events, functional decline in ADLs/IADLs, vascular risk factors (hypertension, diabetes, smoking, hyperlipidemia, atrial fibrillation), prior strokes or TIAs, informant history essential (patient may lack insight)
  - Cognitive screening: Mini-Mental State Exam (MMSE) or Montreal Cognitive Assessment (MoCA), clock draw test (executive function sensitive), verbal fluency (animal naming, FAS), Trail Making Test B (executive function), may have relative preservation of memory compared to Alzheimer (can recall with cuing)
  - Cognitive domains assessment: executive function (planning, set-shifting, judgment) most impaired early, processing speed slow, attention impaired, language relatively preserved (unlike Alzheimer anomia), memory impaired but recall improves with cuing (retrieval deficit vs encoding deficit in Alzheimer)
  - Neuroimaging essential (MRI preferred): multiple cortical or subcortical infarcts (especially bilateral), extensive white matter hyperintensities (leukoaraiosis - Fazekas score 2-3), strategic single infarcts (thalamus, angular gyrus, basal forebrain), lacunar infarcts in basal ganglia/thalamus (small vessel disease), brain atrophy (cortical and subcortical), CT acceptable if MRI contraindicated but less sensitive for small vessel disease
  - Distinguish subtypes: multi-infarct dementia (multiple large cortical strokes), subcortical vascular dementia (Binswanger disease - extensive white matter disease, lacunar infarcts), strategic infarct dementia (single stroke in critical location), mixed dementia (vascular plus Alzheimer pathology - very common in elderly)
  - Neurologic exam: gait assessment (small-stepped, shuffling, apraxic, wide-based, falls), focal deficits from prior strokes (weakness, sensory loss, visual field cuts, dysarthria), frontal release signs (grasp, snout, glabellar), pseudobulbar affect (inappropriate laughing/crying), parkinsonism (rigidity, bradykinesia from vascular parkinsonism)
  - Assess vascular risk factors: blood pressure (hypertension major risk factor), blood glucose (diabetes doubles risk), lipid panel (hyperlipidemia), ECG (atrial fibrillation cardioembolic source), carotid ultrasound if concern for stenosis, echocardiogram if cardiac source suspected
  - Labs: CBC, CMP, TSH (rule out reversible causes), vitamin B12, fasting glucose or HbA1c, lipid panel, consider ESR/CRP if vasculitis concern, RPR if risk factors
  - Rule out other causes: Alzheimer disease (gradual onset, memory predominant, medial temporal atrophy on MRI), Lewy body dementia (visual hallucinations, parkinsonism, fluctuations), frontotemporal dementia (behavioral variant, language variant, younger onset), normal pressure hydrocephalus (triad gait-incontinence-dementia, ventriculomegaly out of proportion to atrophy)
  - Formal neuropsychological testing: comprehensive evaluation if diagnosis unclear, executive dysfunction and processing speed deficits out of proportion to memory (pattern differs from Alzheimer), establish baseline for monitoring

treatment:
  - No FDA-approved medications specifically for vascular dementia, focus on preventing further vascular damage and managing symptoms
  - Aggressive vascular risk factor management (cornerstone - prevent progression): blood pressure control (target less than 130/80, may prevent up to 50 percent of vascular dementia cases, ACE inhibitors or ARBs preferred - ramipril 10 mg daily, losartan 100 mg daily - also reduce stroke risk), statin therapy (atorvastatin 40-80 mg or rosuvastatin 20-40 mg - LDL goal less than 70 mg/dL, reduces stroke risk 20-30 percent), antiplatelet therapy (aspirin 81-325 mg daily or clopidogrel 75 mg daily - secondary prevention after stroke/TIA), anticoagulation if atrial fibrillation (apixaban 5 mg BID, rivaroxaban 20 mg daily, or warfarin INR 2-3), diabetes control (HbA1c target less than 8 percent in elderly, avoid hypoglycemia), smoking cessation (essential)
  - Cholinesterase inhibitors: donepezil 5-10 mg daily, rivastigmine 3-6 mg BID or patch 9.5-13.3 mg/24hr, galantamine 8-12 mg BID, modest benefit shown in some trials (2-3 point ADAS-cog improvement), consider trial for 3-6 months and continue if benefit, adverse effects nausea, diarrhea, bradycardia
  - NMDA antagonist: memantine 10 mg BID or extended-release 28 mg daily, may benefit moderate-severe vascular dementia, can combine with cholinesterase inhibitor
  - Treat behavioral and psychological symptoms: depression (very common 30-50 percent - SSRI sertraline 50-100 mg, citalopram 10-20 mg), apathy (trial of methylphenidate 5-10 mg or modafinil 100-200 mg if no cardiac contraindication), agitation (behavioral interventions first, low-dose antipsychotics if danger to self/others - quetiapine 25-100 mg, risperidone 0.25-1 mg with FDA black box warning increased mortality)
  - Gait and fall prevention: physical therapy for gait training, balance exercises, assistive device (walker, cane), home safety evaluation, avoid sedating medications (benzodiazepines, anticholinergics), treat orthostatic hypotension if present
  - Bladder dysfunction: prompted voiding schedule, pelvic floor exercises, treat overactive bladder if present (mirabegron 25-50 mg preferred over anticholinergics which worsen cognition), avoid indwelling catheter unless necessary
  - Non-pharmacologic interventions: cognitive stimulation therapy, structured daily routine, exercise program (30 min moderate activity most days - improves cognition and reduces falls), Mediterranean diet (reduces stroke and dementia risk)
  - Secondary stroke prevention critical: optimize all vascular risk factors, workup for stroke etiology if not done (carotid stenosis, cardiac source, hypercoagulable state if young), consider carotid endarterectomy or stenting if severe stenosis (greater than 70 percent symptomatic)
  - Safety considerations: driving evaluation (refer to DMV if unsafe), wandering prevention, financial protection (power of attorney), home safety assessment, fall prevention
  - Caregiver support: educate about disease, prognosis (progressive but rate varies, further strokes worsen cognition), respite care, support groups, address caregiver burnout

clinical_pearls:
  - Vascular dementia is second most common dementia cause (15-20 percent), but mixed vascular/Alzheimer pathology very common in elderly
  - Stepwise decline with sudden worsening (strokes) then plateau distinguishes from Alzheimer gradual decline
  - Executive dysfunction, processing speed, and gait disturbance earlier and more prominent than in Alzheimer
  - Imaging shows multiple infarcts, extensive white matter disease, or strategic single infarcts
  - Aggressive vascular risk factor control prevents progression (BP control especially critical)
  - Cholinesterase inhibitors modestly effective, though not FDA-approved for vascular dementia
  - Depression very common (30-50 percent) and treatable - screen and treat aggressively
  - Each subsequent stroke worsens cognition - secondary stroke prevention essential
  - Mixed dementia (vascular plus Alzheimer) common - treat both components
  - Gait disturbance and urinary symptoms earlier than in Alzheimer disease

referrals:
  - Neurology or geriatrics for initial diagnosis and management
  - Vascular neurology or stroke specialist for secondary stroke prevention, especially if recurrent strokes
  - Neuropsychology for formal cognitive testing if diagnosis unclear
  - Cardiology for atrial fibrillation management, cardiac source evaluation
  - Physical therapy for gait training, fall prevention, balance exercises
  - Occupational therapy for home safety evaluation and adaptive strategies
  - Geriatric psychiatry for behavioral symptoms, depression management
  - Social work for community resources, caregiver support, placement when needed

differentials:
  - Alzheimer disease (gradual onset, memory predominant, medial temporal atrophy, no stepwise decline)
  - Mixed dementia (vascular plus Alzheimer - very common, features of both)
  - Lewy body dementia (visual hallucinations, parkinsonism, fluctuations, REM sleep behavior disorder)
  - Frontotemporal dementia (behavioral changes, apathy, disinhibition, younger onset 50s-60s)
  - Normal pressure hydrocephalus (triad gait-incontinence-dementia, ventriculomegaly, improves with VP shunt)
  - Chronic subdural hematoma (headache, fluctuating symptoms, history of fall, improves with drainage)
  - Depression (pseudodementia - poor effort, responds to antidepressants)
  - Parkinson disease dementia (dementia occurs more than 1 year after motor symptoms)

trace:
  - 72-year-old man presents with progressive cognitive decline and gait difficulty x 3 years
  - History: 3 years ago had left-sided weakness and slurred speech lasting 2 days, diagnosed with right MCA stroke, recovered with mild residual left leg weakness, 1 year later had another stroke (left frontal lobe), developed sudden worsening of memory and judgment after second stroke, noticed by wife
  - Current symptoms: forgetfulness (repeats questions, forgets appointments), poor judgment (gave money to phone scammer, poor financial decisions), difficulty planning and organizing (used to manage household finances, now cannot), slowness (takes much longer to complete tasks), urinary urgency and occasional incontinence (new x 1 year), gait difficulty (shuffling, slow, multiple falls), emotional lability (cries easily at sentimental commercials)
  - Wife reports: stepwise decline (stable periods then sudden worsening with strokes), personality change (more apathetic, less motivated), needs help with finances and medications (IADLs impaired), still dresses and bathes independently (ADLs preserved)
  - Past medical history: hypertension x 20 years (poorly controlled, systolic BP often 160-180), diabetes mellitus type 2 (HbA1c 8.2 percent), hyperlipidemia, 2 strokes (as above), 30 pack-year smoking history (quit 3 years ago after first stroke)
  - Medications: lisinopril 40 mg daily, metformin 1000 mg BID, atorvastatin 40 mg nightly, aspirin 81 mg daily
  - Family history: father had strokes, died age 68
  - Exam: BP 168/92 (elevated), gait slow with short steps (shuffling), wide-based, turns en bloc, mild left leg weakness (4+/5), left foot dorsiflexion 4/5, hyperreflexia left leg (stroke sequelae), Babinski sign positive left, dysarthria (slurred speech), frontal release signs (grasp reflex present), MMSE 22/30 (lost points on orientation, attention/calculation, delayed recall 1/3 words, but could recall with cuing)
  - MRI brain: multiple lacunar infarcts bilateral basal ganglia and thalamus (small vessel disease), right MCA territorial infarct (old), small left frontal infarct (old), extensive periventricular and deep white matter hyperintensities (Fazekas score 3 - severe leukoaraiosis), moderate cortical and subcortical atrophy
  - Labs: HbA1c 8.2 percent (poor diabetes control), LDL cholesterol 142 mg/dL (not at goal), TSH 2.1 mIU/L (normal), vitamin B12 386 pg/mL (normal), creatinine 1.2 mg/dL
  - Carotid ultrasound: bilateral 30-40 percent stenosis (moderate, not severe enough for intervention)
  - ECG: normal sinus rhythm (no atrial fibrillation)
  - Formal neuropsychological testing: executive dysfunction prominent (Trail Making Test B impaired, verbal fluency reduced, clock draw abnormal), processing speed slow, attention impaired, memory impaired but improved with cuing (retrieval deficit pattern), pattern consistent with subcortical vascular dementia
  - Diagnosis: Vascular Dementia, subcortical type (extensive white matter disease plus multiple lacunar infarcts), with stepwise decline temporally related to strokes
  - PHQ-9 depression screening: score 11 (moderate depression)
  - Assessment: poorly controlled vascular risk factors (hypertension, diabetes, hyperlipidemia) driving progression of cerebrovascular disease and cognitive decline
  - Treatment plan - aggressive vascular risk factor management to prevent further progression:
    • Blood pressure optimization: lisinopril increased to 80 mg daily plus amlodipine 10 mg daily added (target BP less than 130/80), home BP monitoring
    • Diabetes control: metformin increased to 1500 mg BID, referred to endocrinology, target HbA1c less than 8 percent
    • Lipid management: atorvastatin increased to 80 mg nightly (LDL goal less than 70), recheck in 3 months
    • Antiplatelet: continue aspirin 81 mg daily (secondary stroke prevention)
    • Cognitive medication trial: donepezil 5 mg nightly started (may provide modest benefit in vascular dementia), increase to 10 mg after 4 weeks
    • Depression treatment: sertraline 50 mg daily started (treat comorbid depression)
    • Gait and fall prevention: referred to physical therapy for gait training, walker recommended, home safety evaluation
    • Bladder: prompted voiding schedule every 2 hours, avoid anticholinergics
  - Caregiver support: wife connected to Alzheimer's Association support group (also serves vascular dementia caregivers), respite care arranged 2 days/week
  - Safety planning: driving evaluation recommended (referred to DMV), wife took over finances (power of attorney in place), advance directives completed
  - Follow-up 3 months: BP improved to 132/78 on increased medications (excellent), HbA1c improved to 7.6 percent, LDL 82 mg/dL (at goal on high-dose statin), tolerating donepezil 10 mg (mild nausea first week resolved), mood improved on sertraline (PHQ-9 score 6), gait safer with walker (no falls past 3 months), cognition stable (MMSE 21, no decline)
  - Assessment: stabilization of cognitive decline with aggressive vascular risk factor control and no new strokes
  - 9-month follow-up: BP well-controlled average 128/76, diabetes controlled HbA1c 7.4 percent, no new strokes on MRI, cognition stable (MMSE 22), functionally unchanged (continued IADL dependence but ADLs intact), mood good
  - Wife reports: "He's not getting worse, and that's a relief. I know we can't reverse the damage, but at least he's stable now. Controlling his blood pressure and blood sugar has made a big difference."
  - 18-month follow-up: unfortunately developed third stroke (small right thalamic lacune), acute worsening of cognition and gait, MMSE dropped to 18/30, now requires assistance with some ADLs (bathing, dressing), increased urinary incontinence
  - Discussed prognosis: each stroke worsens cognition (stepwise decline), importance of maximizing vascular risk factor control to prevent future strokes, home care needs increased
  - Memantine 5 mg BID added to donepezil (moderate-severe dementia stage now)
  - Arranged increased home care assistance 5 days/week, discussed long-term care options for future when needed
  - 2-year follow-up: stable since last stroke 6 months ago (no new events), MMSE 17/30, requires assistance with most ADLs, remains at home with full-time caregiver support, BP and diabetes well-controlled, wife considering assisted living placement in next 6-12 months as care needs increase
