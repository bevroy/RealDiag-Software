tree_id: NEURO-VASCULAR-DEMENTIA
name: Vascular Dementia
family: Neurology
specialty: Neurology/Geriatrics
chief_complaint: Stepwise cognitive decline with history of strokes or vascular risk factors
description: Second most common cause of dementia characterized by cognitive impairment resulting from cerebrovascular disease, with stepwise decline and prominent executive dysfunction

icd10: F01.50
snomed: "429998004"

urgency: routine

