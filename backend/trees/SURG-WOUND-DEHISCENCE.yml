urgency: medium
description: Comprehensive evaluation and management of Wound Dehiscence
version: '1.0'
citations:
  - ACS (American College of Surgeons) Clinical Guidelines
  - RCS (Royal College of Surgeons) Guidelines
  - UpToDate - General Surgery
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Separation of surgical wound edges
- Sudden gush of serosanguineous fluid
- Visible bowel (evisceration)
- Postoperative day 7-10 typically
- 'Risk factors: obesity, infection, poor nutrition'
- Requires urgent surgical repair
workup: []
treatment:
  - 'Superficial: Wound care, close monitoring, allow granulation'
  - 'Deep fascial dehiscence: Immediate surgical consultation'
  - 'Evisceration (bowel protruding): Cover with saline-soaked gauze, NPO, urgent OR'
  - 'Operative repair - re-suture fascia with retention sutures, close skin loosely'
  - 'Wound VAC therapy postoperatively'
  - 'Optimize nutrition - protein >1.5g/kg/day, vitamin C, zinc'
  - 'Control risk factors - hyperglycemia, infection, malnutrition'
  - 'Abdominal binder for support during healing'
  - 'Avoid heavy lifting/straining x6-8 weeks'
  - 'Risk of incisional hernia - long-term follow-up'
clinical_pearls: []
referrals:
  emergency:
    - Acute abdomen
    - Peritonitis
