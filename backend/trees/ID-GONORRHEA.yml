tree_id: ID-GONORRHEA
name: Gonorrhea (Neisseria gonorrhoeae) Infection
family: infectious_disease
specialty: Infectious Disease
icd10: A54.9
snomed: 15628003
urgency: []
homeopathy: []
presentations:
  - Purulent urethral discharge (men) - yellow/green
  - Dysuria without urgency or frequency
  - Asymptomatic in 50% of men and 70-80% of women
  - Mucopurulent cervical discharge (women)
  - Intermenstrual or postcoital bleeding (women)
  - Lower abdominal or pelvic pain (suggests PID)
  - Testicular pain or epididymitis (men)
  - Rectal discharge, pain, or bleeding (proctitis)
  - Pharyngeal infection usually asymptomatic
  - Disseminated gonococcal infection (arthritis-dermatitis syndrome)
workup:
  - NAAT (nucleic acid amplification test) - most sensitive and specific
  - Men: first-catch urine or urethral swab
  - Women: endocervical swab, vaginal swab (self-collected acceptable), or urine
  - Rectal NAAT if receptive anal intercourse
  - Pharyngeal NAAT if receptive oral sex
  - Culture with antibiotic susceptibility testing if treatment failure or pharyngeal infection
  - Test simultaneously for chlamydia (co-infection 20-40%)
  - HIV testing and other STI screening (syphilis, hepatitis B/C)
  - Pregnancy test in women of reproductive age
  - Synovial fluid analysis if disseminated gonococcal infection suspected
treatment:
  - First-line (uncomplicated): Ceftriaxone 500 mg IM single dose (<150 kg body weight)
  - If ≥150 kg: Ceftriaxone 1 g IM single dose
  - ALWAYS treat for chlamydia simultaneously: Doxycycline 100 mg PO BID x 7 days
  - If cephalosporin allergy: Gentamicin 240 mg IM plus azithromycin 2 g PO (single doses)
  - Disseminated gonococcal infection: Ceftriaxone 1-2 g IV/IM daily x 7 days
  - Conjunctivitis: Ceftriaxone 1 g IM single dose plus lavage
  - Test of cure 7-14 days after treatment if pharyngeal infection or symptoms persist
  - Treat all sexual partners from past 60 days
  - Expedited partner therapy (EPT) where legally permissible
  - Abstain from sex for 7 days after treatment
  - Retest 3 months after treatment (high reinfection rate)
  - Report to health department (nationally notifiable)
clinical_pearls:
  - "Second most common reportable STI in US (over 700,000 cases/year)"
  - "Increasing antibiotic resistance - cephalosporin resistance emerging globally"
  - "Pharyngeal gonorrhea is reservoir for resistance development and treatment failures"
  - "Disseminated gonococcal infection (DGI): triad of tenosynovitis, dermatitis (pustular lesions), polyarthralgia"
  - "Untreated gonorrhea in women can cause PID, ectopic pregnancy, infertility, chronic pelvic pain"
  - "Neonatal transmission during delivery causes ophthalmia neonatorum (prevented with erythromycin eye ointment)"
  - "Men who have sex with men (MSM) should be screened at all anatomic sites of exposure"
  - "Screen sexually active women <25 and older women with risk factors annually"
  - "Fluoroquinolones (ciprofloxacin) no longer recommended due to widespread resistance"
referrals:
  - Gynecology/Urology if PID, epididymitis, or complications
  - Infectious Disease for treatment failures or disseminated infection
  - Public Health for partner notification and contact tracing
  - Ophthalmology for gonococcal conjunctivitis
differentials:
  - Chlamydia trachomatis (often indistinguishable, test and treat both)
  - Nongonococcal urethritis (Mycoplasma genitalium, Ureaplasma, Trichomonas)
  - Pelvic inflammatory disease (upper genital tract infection, more severe symptoms)
  - Urinary tract infection (urgency and frequency prominent, pyuria without discharge)
  - Reactive arthritis (Reiter syndrome) - can follow gonorrhea or chlamydia
  - Bacterial vaginosis (vaginal discharge but no cervicitis)
trace:
  source: CDC Sexually Transmitted Infections Treatment Guidelines 2021
