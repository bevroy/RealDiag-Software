presentations:
  - Gradual onset of testicular pain
  - Scrotal swelling and tenderness
  - Dysuria, urinary frequency
  - Fever (in acute cases)
  - Positive Prehn sign (pain relieved by elevation)
  - Cremasteric reflex present
  - STI or UTI pathogen
differentials:
  - Testicular torsion
  - Orchitis
  - Inguinal hernia
  - Hydrocele
  - Testicular cancer
workup:
  - 'UA with culture: Pyuria, bacteriuria (if coliforms). May be normal if STI etiology'
  - 'Urethral swab: Nucleic acid amplification test (NAAT) for gonorrhea/Chlamydia if age <35 or STI risk'
  - 'Cremasteric reflex: Present (vs absent in torsion)'
  - 'Doppler ultrasound: Increased blood flow to epididymis (hyperemia), enlarged epididymis. Use if torsion cannot be excluded clinically'
  - 'Prehn sign: Pain relief with scrotal elevation (positive in 70% of epididymitis)'
treatment:
  - 'Guideline-based treatment options for Epididymitis include:'
  - 'Age <35 or sexually active: Ceftriaxone 250mg IM x1 + doxycycline 100mg BID x10 days (covers gonorrhea + Chlamydia) (AUA 2023)'
  - 'Age >35 or no STI risk: Levofloxacin 500mg daily x10 days (covers E. coli and coliforms) (AUA 2023)'
  - 'Supportive care: Scrotal support (wear briefs, not boxers), ice packs, NSAIDs (AUA 2023)'
  - 'Treat sexual partners: If STI etiology, partner needs treatment (expedited partner therapy) (AUA 2023)'
  - 'Follow-up: Pain should improve in 2-3 days, resolve in 1-2 weeks. If not improving, ultrasound to rule out abscess (AUA 2023)'
clinical_pearls:
  - Inflammation of epididymis - age <35 years (STI - Chlamydia, gonorrhea), age >35 years (coliforms - E. coli, Enterococcus)
  - Gradual onset (vs testicular torsion which is sudden) - pain develops over hours to days
  - 'Prehn sign: Pain relief with scrotal elevation (vs torsion where elevation doesn''t help or worsens pain) - 70% sensitive'
  - 'Cremasteric reflex present: Distinguishes from torsion (absent in 99% of torsion)'
  - 'Doppler ultrasound: Increased blood flow (hyperemia) vs torsion (decreased flow)'
red_flags: []
disposition_guidance: {}
referrals:
  - 'Urology if: Not improving after 2-3 days of antibiotics, concern for abscess, recurrent epididymitis'
  - If unable to exclude torsion clinically, urgent urology evaluation
