  - positive straight leg raise test
  - Sharp shooting pain from buttock down posterior leg to foot
  - 'Dermatomal distribution: L5 (lateral leg, dorsal foot) or S1 (posterior leg, plantar foot)'
  - 'Weakness: L5 (foot drop, ankle dorsiflexion), S1 (unable to toe stand, plantar flexion)'
  - 'Herniated disc (90%): L4-L5 (affects L5 root) or L5-S1 (affects S1 root)'
differentials:
  - Piriformis syndrome
  - Spinal stenosis
  - Disc herniation
  - Spondylolisthesis
  - Tumor
workup:
  - 'Straight leg raise: Supine, passively raise leg - positive if pain <60 degrees'
  - 'MRI lumbar spine: If red flags, failed conservative x6 weeks, or considering surgery (shows disc herniation, nerve compression)'
  - 'X-ray lumbar spine: Rule out fracture, spondylolisthesis, but doesn''t show disc'
  - 'Neurologic exam: Check strength (L5 dorsiflexion, S1 plantarflexion), reflexes (L4 patellar, S1 Achilles)'
treatment:
  - 'Guideline-based treatment options for Sciatica include:'
  - 'First 6 weeks: NSAIDs, remain active (bed rest not helpful) (AAN 2024)'
  - 'Physical therapy: McKenzie exercises (extension-based), core strengthening after acute phase (AAN 2024)'
  - 'Neuropathic pain: Gabapentin 300-900mg TID or pregabalin 75-150mg BID if radicular pain prominent (AAN 2024)'
  - 'Avoid opioids: Not superior to NSAIDs, high abuse risk, delays recovery (AAN 2024)'
  - 'Epidural steroid injection: Consider if failed NSAIDs + PT x6 weeks, provides 3-6 months relief (AAN 2024)'
  - 'Surgery (microdiscectomy): If failed conservative x6-12 weeks, progressive weakness, or cauda equina (AAN 2024)'
clinical_pearls:
  - 'Natural history: 80-90% improve with conservative management over 6-12 weeks'
  - 'Straight leg raise: Positive if pain <60 degrees leg elevation (80% sensitive, 40% specific)'
  - 'Crossed straight leg raise: Contralateral leg raise reproduces pain (95% specific for herniated disc)'
  - 'Red flags: Cauda equina (saddle anesthesia, bladder/bowel dysfunction), progressive weakness, fever'
  - 'MRI lumbar spine: Not needed unless red flags or failed conservative therapy >6 weeks'
red_flags: []
