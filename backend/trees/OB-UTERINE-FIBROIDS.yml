tree_id: OB-UTERINE-FIBROIDS
name: Uterine Fibroids (Leiomyomas)
family: gynecologic
specialty: Obstetrics-Gynecology
chief_complaint: Heavy menstrual bleeding, pelvic pressure, or asymptomatic
description: Benign smooth muscle tumors of the uterus, most common pelvic tumor in women
icd10: D25.9
urgency: routine
workup:
  - Clinical diagnosis confirmed with imaging
  - Detailed menstrual history (quantity, duration, frequency, clots)
  - Pelvic examination - enlarged, irregular uterus, palpable masses
  - Pregnancy test (rule out pregnancy before treatment)
  - Complete blood count (anemia from heavy bleeding)
  - Pelvic ultrasound (transvaginal and transabdominal) - first-line imaging
  - Classify by location - intramural (within wall), submucosal (into cavity), subserosal (toward outside)
  - MRI pelvis if ultrasound inconclusive or planning surgical/interventional treatment
  - Better delineates fibroid location, size, number, distinguishes adenomyosis
  - Saline infusion sonohysterography (SIS) to evaluate submucosal fibroids
  - Hysteroscopy for direct visualization of submucosal fibroids
  - TSH (hypothyroidism can cause menorrhagia)
  - Endometrial biopsy if age greater than 45 or risk factors for endometrial cancer (rule out malignancy)
  - CA-125 if concern for malignancy (rapid growth, postmenopausal), but rarely leiomyosarcoma
treatment:
  - Management depends on symptoms, size, location, desire for fertility
  - Expectant management if asymptomatic - observation with annual exam
  - Medical management for symptomatic fibroids
  - NSAIDs (ibuprofen 600-800 mg TID during menses) for pain and decreased bleeding
  - Tranexamic acid 1300 mg TID during menses (reduces bleeding 40-50%)
  - Combined oral contraceptives or progestin-only pills (regulate bleeding)
  - Levonorgestrel IUD (Mirena) - reduces menorrhagia, effective for 5 years
  - GnRH agonists (leuprolide 3.75 mg IM monthly) - temporary shrinkage up to 50%, for preoperative use or bridge to menopause
  - Side effects - hot flashes, bone loss, limit to 6 months
  - GnRH antagonist (elagolix with add-back therapy) - reduces bleeding, better side effect profile
  - Surgical management
  - Myomectomy (remove fibroids, preserve uterus) - for women desiring future fertility
  - Can be hysteroscopic (submucosal), laparoscopic, or open approach
  - Hysterectomy - definitive treatment, for completed childbearing
  - Can be vaginal, laparoscopic, or abdominal depending on uterine size
  - Minimally invasive procedures
  - Uterine artery embolization (UAE) - radiologic procedure, blocks blood supply to fibroids
  - 85-90% symptom improvement, preserves uterus
  - MRI-guided focused ultrasound (MRgFUS) - noninvasive thermal ablation
  - Iron supplementation if anemic (ferrous sulfate 325 mg daily)
clinical_pearls:
  - Most common pelvic tumor in women, affects 70-80% by age 50
  - Higher prevalence in African American women (3x more common, larger, more symptomatic)
  - 25-50% are symptomatic, remainder asymptomatic incidental findings
  - Classic triad of symptoms - abnormal uterine bleeding (most common), pelvic pressure/bulk symptoms, reproductive issues
  - Submucosal fibroids most likely to cause heavy bleeding despite small size
  - Estrogen-dependent - grow during reproductive years, shrink after menopause
  - Rapid growth or postmenopausal growth raises concern for leiomyosarcoma (rare, less than 1%)
  - Fibroids can cause infertility or pregnancy complications (preterm birth, malpresentation)
  - Pedunculated subserosal fibroid can torse causing acute pain
  - Red degeneration (infarction) common in pregnancy - severe pain, fever, treat conservatively
differentials:
  - Adenomyosis - diffusely enlarged tender uterus, no discrete masses on ultrasound
  - Endometrial polyp - abnormal bleeding, hysteroscopy for diagnosis and treatment
  - Ovarian mass - separate from uterus on imaging, elevated CA-125
  - Leiomyosarcoma - rare malignancy, rapid growth, postmenopausal, irregular borders
  - Pregnancy - positive pregnancy test, gestational sac on ultrasound
  - Endometrial hyperplasia/cancer - postmenopausal bleeding, endometrial thickness greater than 4 mm
  - Pelvic inflammatory disease - fever, cervical motion tenderness, elevated WBC
trace:
  - 42-year-old nulliparous woman presents with 2-year history of progressively heavy menstrual periods
  - Menses every 28 days, lasting 8-9 days, soaking through super tampon every 1-2 hours first 3 days
  - Passing large clots, using 20-25 pads per cycle
  - Pelvic pressure, urinary frequency, no pain
  - Denies plans for future pregnancy
  - Past medical history - none, no prior surgeries
  - Physical exam - enlarged uterus palpable to umbilicus, firm, irregular contour, nontender, mobile
  - Pregnancy test negative
  - Labs - Hemoglobin 9.2 g/dL (anemia), MCV 72 fL (microcytic), ferritin 8 ng/mL (iron deficiency)
  - TSH 2.1 mIU/L (normal)
  - Pelvic ultrasound - enlarged uterus 14 cm, multiple intramural and submucosal fibroids
  - Largest fibroid 8 cm intramural, 3 cm submucosal fibroid distorting endometrial cavity
  - Normal appearing ovaries
  - MRI pelvis - confirms multiple fibroids, largest 8 cm posterior intramural, 3 cm submucosal
  - No adenomyosis, no adnexal masses
  - Diagnosis - Symptomatic uterine fibroids with menorrhagia and iron deficiency anemia
  - Treatment discussion - patient desires definitive treatment, not interested in fertility preservation
  - Options presented - hysterectomy (definitive), myomectomy (not preferred given no fertility desire), UAE
  - Patient elected total laparoscopic hysterectomy
  - Started iron supplementation (ferrous sulfate 325 mg daily) and tranexamic acid 1300 mg TID during menses preoperatively
  - Hemoglobin improved to 10.8 g/dL after 6 weeks of iron
  - Underwent uncomplicated total laparoscopic hysterectomy with bilateral salpingectomy (ovaries preserved)
  - Pathology - multiple leiomyomas, largest 8.5 cm, benign, no malignancy
  - Postoperative course unremarkable, discharged home day 1
  - 6-week follow-up - complete resolution of bleeding and pressure symptoms, hemoglobin 12.5 g/dL
  - Outcome - Excellent result, highly satisfied with treatment decision
