tree_id: OPHTHO-MACULAR-DEGENERATION
name: Age-Related Macular Degeneration
family: ophthalmology
specialty: Ophthalmology
chief_complaint: Progressive vision loss
description: Leading cause of irreversible vision loss in elderly, causing central vision loss from macular damage. Dry AMD managed with AREDS vitamins, wet AMD treated with anti-VEGF injections to prevent blindness.
icd10: H35.30
snomed: 422338006
presentations:
  - Gradual central vision loss
  - Distorted vision (metamorphopsia)
  - Difficulty reading, recognizing faces
  - Scotomas (blind spots)
  - Dry form: drusen, atrophy
  - Wet form: sudden vision loss, hemorrhage
urgency: non-urgent

referrals:
  emergency:
    - Acute vision loss
    - Chemical burn
    - Globe rupture
  urgent:
    - Floaters with flashes
    - Suspected GCA
    - Corneal ulcer
  routine:
    - Cataracts
    - Glaucoma screening
    - Routine eye exam

workup:
  - Clinical diagnosis: progressive central vision loss in patient >50 years with macular changes on exam
  - Symptoms: blurred central vision, metamorphopsia (straight lines appear wavy - pathognomonic), central scotoma, difficulty reading/recognizing faces
  - Amsler grid: home monitoring tool, detects metamorphopsia (lines distorted or missing)
  - Dilated fundoscopic exam: drusen (yellow deposits under retina), geographic atrophy (dry AMD), subretinal fluid or hemorrhage (wet AMD)
  - Optical coherence tomography (OCT): high-resolution cross-sectional imaging of retina, detects subretinal fluid, retinal thickening (wet AMD)
  - Fluorescein angiography: if wet AMD suspected, shows choroidal neovascularization (leaking new vessels)
  - Classification: dry (non-exudative) 90% - drusen and atrophy, slowly progressive OR wet (exudative) 10% - choroidal neovascularization, rapid vision loss if untreated
  - Risk factors: age >50, smoking (strongest modifiable risk), family history, Caucasian race, hypertension, obesity

treatment:
  - Dry AMD: no treatment halts progression, AREDS2 vitamins slow progression in intermediate/advanced disease
  - AREDS2 formula: vitamin C 500 mg, vitamin E 400 IU, lutein 10 mg, zeaxanthin 2 mg, zinc 80 mg, copper 2 mg daily
  - Only for intermediate AMD (multiple medium drusen or large drusen) or advanced AMD in one eye - not for early AMD
  - Wet AMD (URGENT referral to retina specialist): anti-VEGF intravitreal injections prevent severe vision loss
  - Anti-VEGF agents: ranibizumab, bevacizumab, aflibercept monthly injections initially, then extend interval based on response (treat-and-extend protocol)
  - Dramatically effective: prevents severe vision loss in 90%, improves vision in 30-40%
  - Prompt treatment critical: vision lost before treatment often irreversible
  - Smoking cessation: most important modifiable risk factor (doubles risk, accelerates progression)
  - Control cardiovascular risk factors: BP, lipids, diabetes
  - Low vision rehabilitation: magnifiers, large print, high contrast, occupational therapy for advanced disease
  - Monitor: Amsler grid daily at home, report new distortion immediately (may indicate conversion dry to wet)

clinical_pearls:
  - Central vision loss with metamorphopsia in elderly patient classic
  - Dry AMD 90% (drusen, atrophy) - slow progression, AREDS2 vitamins if intermediate/advanced
  - Wet AMD 10% (choroidal neovascularization) - rapid vision loss, URGENT anti-VEGF injections
  - OCT diagnostic - shows subretinal fluid in wet AMD
  - Anti-VEGF injections prevent blindness in wet AMD - 90% avoid severe vision loss
  - Smoking strongest modifiable risk factor - cessation critical
  - Amsler grid home monitoring - report new distortion immediately
  - Peripheral vision preserved (vs glaucoma which affects peripheral first)

differentials:
  - Diabetic macular edema: diabetes history, hard exudates, microaneurysms, OCT shows macular thickening
  - Central serous retinopathy: younger patients, subretinal fluid on OCT, usually spontaneous resolution
  - Macular hole: central scotoma, OCT shows full-thickness defect
  - Cataract: gradual vision loss but affects all vision not just central, lens opacity on exam

trace: |
  A 72-year-old woman with 50 pack-year smoking history presented with 6 months of progressive difficulty reading, straight lines appearing wavy when looking at doorframes. Central vision blurry but peripheral vision intact. Dilated exam showed multiple large soft drusen and pigment changes in both macular regions. OCT showed drusen without subretinal fluid. No choroidal neovascularization. Diagnosed with intermediate dry age-related macular degeneration. Started AREDS2 vitamins daily (vitamin C, E, lutein, zeaxanthin, zinc, copper). Counseled extensively on smoking cessation, enrolled in cessation program. Given Amsler grid for daily home monitoring, instructed to report immediately if lines become more distorted. At 3 months quit smoking. At 6 months OCT stable, no progression to wet AMD. At 12 months developed sudden worsening distortion in right eye, returned urgently. OCT showed subretinal fluid right macula (conversion to wet AMD). URGENTLY referred to retina specialist, started ranibizumab intravitreal injections monthly. After 3 injections subretinal fluid resolved, vision stabilized, continued treat-and-extend protocol. At 2 years right eye stable on injections every 10 weeks, left eye remains dry AMD on AREDS2 vitamins, continues Amsler grid monitoring, no smoking.

