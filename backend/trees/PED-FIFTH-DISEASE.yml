presentations:
  - Slapped cheek appearance
  - Lacy reticular rash on extremities
  - Low-grade fever
  - Parvovirus B19
  - Rash may wax and wane
  - School-aged children
differentials:
  - Scarlet fever
  - Roseola
  - Measles
  - Rubella
  - Drug rash
workup: []
treatment:
  - Supportive care only - self-limited viral illness (no specific antiviral treatment)
  - Symptomatic treatment - acetaminophen 10-15mg/kg/dose Q4-6H or ibuprofen 10mg/kg/dose Q6-8H for fever or joint pain
  - Hydration - encourage fluids
  - No school exclusion needed once rash appears (no longer infectious at rash stage)
  - Complications rare in healthy children
  - 'Pregnant exposure: Check parvovirus B19 IgG/IgM, monitor fetus with serial ultrasounds if acute infection (risk of hydrops fetalis)'
  - 'Immunocompromised patients with chronic anemia: May need IVIG 400mg/kg/day x5 days for persistent infection'
  - 'Patients with sickle cell or hereditary spherocytosis: Monitor for aplastic crisis (temporary cessation of RBC production), may need transfusion'
