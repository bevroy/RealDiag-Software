presentations:
  - Sore throat (sudden onset)
  - Fever
  - Tonsillar exudates
  - Tender anterior cervical lymphadenopathy
  - Absence of cough
  - Palatal petechiae
  - Positive rapid strep test or throat culture
differentials:
  - Viral pharyngitis
  - Mononucleosis
  - Peritonsillar abscess
  - Epiglottitis
workup:
  - Rapid antigen detection test (RADT) - 85-90% sensitive, 95% specific
  - Throat culture if RADT negative but high clinical suspicion (Centor ≥3) - results in 24-48hrs
  - 'DO NOT test/treat if: Centor score 0-1 (low probability), age <3 years (rare, complications rare)'
treatment:
  - 'Guideline-based treatment options for Streptococcal Pharyngitis (Strep Throat) include:'
  - Penicillin V 500mg PO BID × 10 days (first-line, narrow spectrum, cheap) OR amoxicillin 500mg TID × 10 days (AAO-HNS 2023)
  - 'Single-dose option: Benzathine penicillin G 1.2 million units IM × 1 (ensures compliance) (AAO-HNS 2023)'
  - 'If penicillin allergy: Cephalexin 500mg BID × 10 days OR azithromycin 500mg day 1, then 250mg days 2-5 (AAO-HNS 2023)'
  - 'Symptomatic: NSAIDs (ibuprofen 400-600mg q6h), throat lozenges, salt water gargles (AAO-HNS 2023)'
  - 'Patient advice: Return to school/work 24 hours after starting antibiotics (no longer contagious) (AAO-HNS 2023)'
clinical_pearls:
  - Caused by Group A Streptococcus (Streptococcus pyogenes) - peak age 5-15 years
  - 'Centor criteria (score 0-4): Fever, tonsillar exudates, tender cervical nodes, absence of cough. Score ≥3 test/treat'
  - 'Complications if untreated: Acute rheumatic fever (2-3 weeks), post-strep glomerulonephritis (1-3 weeks), peritonsillar abscess'
  - 'Scarlet fever: Strep pharyngitis + sandpaper rash (erythematous, blanching, starts trunk/neck)'
  - Rapid strep test 85-90% sensitive - if negative with high suspicion, send throat culture (gold standard)
red_flags: []
disposition_guidance: {}
referrals:
  - 'ENT if: Recurrent strep throat (≥7 episodes in 1 year) - consider tonsillectomy'
  - 'Emergency department if: Peritonsillar abscess, inability to swallow/drooling, respiratory distress'
