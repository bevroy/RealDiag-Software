id: OPHTHO-VISION-LOSS
title: Vision Loss Diagnostic Tree
family: Ophthalmology
specialty: Ophthalmology/Emergency Medicine/Neurology
version: 1.0
icd10: A64
last_updated: 2025-11-20
evidence_level: AAO Preferred Practice Patterns, AHA/ASA Stroke Guidelines
entry: acute_vs_gradual

clinical_pearls:
  - Acute painless vision loss = vascular event until proven otherwise (CRAO, CRVO, retinal detachment)
  - CRAO = ophthalmologic stroke - immediate treatment may salvage vision
  - Temporal arteritis in elderly with vision loss = start steroids immediately before biopsy
  - Afferent pupillary defect (APD) = optic nerve or severe retinal disease
  - Flashes and floaters preceding vision loss = retinal detachment until proven otherwise
  - Central scotoma = macular pathology, peripheral loss = retinal/optic nerve

red_flags:
  - Sudden painless vision loss (vascular occlusion, retinal detachment)
  - Vision loss + jaw claudication + temporal headache (giant cell arteritis)
  - Vision loss + severe eye pain (acute angle-closure glaucoma, optic neuritis)
  - Afferent pupillary defect (optic nerve disease, severe retinal disease)
  - Bilateral vision loss (cortical, optic chiasm, both optic nerves)
  - Vision loss + new neurologic symptoms (stroke, MS, tumor)

nodes:
- id: acute_vs_gradual
  when: {}
  description: Determine onset and character of vision loss
  tests:
  - Visual acuity (each eye separately, with pinhole)
  - Pupil examination (APD critical finding)
  - Visual fields by confrontation
  - Fundoscopic examination (dilated if possible)
  - Intraocular pressure
  - Timeline - seconds, minutes, hours, days, weeks
  - Monocular vs binocular
  - Painful vs painless
  suggest_dx: []
  next:
  - when:
      onset: acute_painless
    go: acute_painless_vision_loss
  - when:
      all_of:
      - vision_loss: acute
      - pain: present
    go: painful_vision_loss
  - when:
      symptoms_contains_any:
      - flashes
      - floaters
      - curtain or shadow
    go: retinal_detachment_assessment
  - when:
      onset: gradual
    go: gradual_vision_loss
  - default: acute_painless_vision_loss

- id: acute_painless_vision_loss
  when:
    all_of:
    - onset: acute
    - pain: absent
  description: Acute painless vision loss - vascular vs retinal
  tests:
  - Dilated fundoscopic examination
  - APD (afferent pupillary defect)
  - Visual fields
  - Look for cherry-red spot (CRAO)
  - Look for retinal hemorrhages (CRVO)
  - Look for pale/elevated retina (retinal detachment)
  suggest_dx: []
  next:
  - when:
      fundoscopy: cherry_red_spot
    go: central_retinal_artery_occlusion
  - when:
      fundoscopy: retinal_hemorrhages
    go: central_retinal_vein_occlusion
  - when:
      all_of:
      - symptoms_contains: curtain_or_shadow
      - fundoscopy: elevated_retina
    go: retinal_detachment
  - when:
      all_of:
      - age: '>50'
      - symptoms_contains_any:
        - headache
        - jaw claudication
        - scalp tenderness
    go: giant_cell_arteritis
  - when:
      fundoscopy: normal
    go: optic_neuropathy_assessment
  - default: acute_vascular_evaluation

- id: central_retinal_artery_occlusion
  when:
    fundoscopy: cherry_red_spot
  description: Central retinal artery occlusion (CRAO) - eye stroke
  tests:
  - Dilated fundoscopy - cherry-red spot, pale retina, boxcarring of vessels
  - APD present (except if cilioretinal artery sparing)
  - Visual acuity (count fingers or worse typically)
  - Intraocular pressure
  - ESR, CRP (rule out giant cell arteritis if age >50)
  - Carotid ultrasound
  - Echocardiogram (look for embolic source)
  - Hypercoagulable workup if young
  suggest_dx:
  - Central retinal artery occlusion (H34.1)
  - Ophthalmologic stroke emergency
  - Vision prognosis poor if >90-100 minutes
  referrals:
  - Ophthalmology STAT
  - Neurology/stroke team
  - Vascular surgery (carotid evaluation)
  management:
  - TREAT IMMEDIATELY - every minute counts
  - Goal - dislodge embolus or increase perfusion
  - Ocular massage (30 seconds on, 5 seconds off x 15 minutes)
    - Gentle pressure on closed eyelid to raise then lower IOP
  - Lower IOP
    - Acetazolamide 500mg IV or PO
    - Topical timolol 0.5%
    - Anterior chamber paracentesis (ophthalmology)
  - Increase retinal oxygenation
    - High-flow oxygen (consider hyperbaric if available)
    - Carbogen (95% O2, 5% CO2) if available
  - Sublingual isosorbide dinitrate 5mg (vasodilation)
  - IV methylprednisolone 1g if giant cell arteritis suspected (age >50)
  - Aspirin 325mg
  - Workup for stroke risk factors
  prognosis:
  - If >90-100 minutes, permanent vision loss likely
  - Final vision count fingers or worse in most cases
  - 10-15% spontaneous improvement
  prevention:
  - Treat cardiovascular risk factors
  - Antiplatelet therapy
  - Carotid endarterectomy if significant stenosis
  next:
  - default: null

- id: central_retinal_vein_occlusion
  when:
    fundoscopy: retinal_hemorrhages_scattered
  description: Central retinal vein occlusion (CRVO)
  tests:
  - Dilated fundoscopy - retinal hemorrhages in all 4 quadrants, dilated tortuous veins, cotton-wool spots
  - Visual acuity (variable - 20/40 to count fingers)
  - APD may be present
  - Intraocular pressure
  - Optical coherence tomography (OCT) - macular edema
  - Fluorescein angiography (ischemic vs non-ischemic)
  - Hypercoagulable workup if age <50
  - Blood pressure
  suggest_dx:
  - Central retinal vein occlusion (H34.8)
  - Non-ischemic (better prognosis) vs ischemic (worse prognosis)
  referrals:
  - Ophthalmology urgently (within 24 hours)
  - Hematology if hypercoagulable state
  management:
  - No acute treatment proven effective
  - Treat macular edema (if present)
    - Intravitreal anti-VEGF injections (ranibizumab, aflibercept)
    - Intravitreal steroid implant (dexamethasone)
  - Monitor for neovascular glaucoma (ischemic CRVO)
    - Iris neovascularization → rubeosis → neovascular glaucoma
    - Panretinal photocoagulation if neovascularization develops
  - Control risk factors
    - Hypertension (most important)
    - Diabetes
    - Hyperlipidemia
    - Glaucoma
  prognosis:
  - Non-ischemic (75%) - 50% regain good vision
  - Ischemic (25%) - poor visual prognosis, risk of neovascular glaucoma
  complications:
  - Macular edema (main cause of vision loss)
  - Neovascular glaucoma (15% of ischemic CRVO)
  next:
  - default: null

- id: retinal_detachment
  when:
    symptoms_contains_any:
    - flashes
    - floaters
    - curtain or shadow
  description: Retinal detachment
  tests:
  - Dilated fundoscopic examination - elevated gray retina, retinal tear
  - Ultrasound if view obscured (vitreous hemorrhage, cataract)
  - Visual acuity
  - Visual field defect corresponding to detachment
  - APD if macula detached
  suggest_dx:
  - Rhegmatogenous retinal detachment (H33.0) - most common, retinal tear
  - Tractional retinal detachment (diabetic retinopathy, vitreous traction)
  - Exudative retinal detachment (choroidal tumor, inflammation)
  referrals:
  - Ophthalmology STAT (same day, or next morning if after hours)
  - Macula-on detachment (central vision preserved) - more urgent (within hours)
  - Macula-off detachment - urgent but can wait until morning
  management:
  - No eating or drinking (may need surgery)
  - Position patient to keep detachment dependent
    - Superior detachment - sit upright
    - Inferior detachment - lie flat
  - Patch both eyes (reduce eye movement)
  - Surgical repair required
    - Pneumatic retinopexy (gas bubble)
    - Scleral buckle
    - Vitrectomy
  - Do NOT delay - risk of progression to macula-off
  prognosis:
  - Macula-on - 90% achieve 20/50 or better
  - Macula-off - 40-60% achieve 20/50
  - Earlier repair = better visual outcome
  risk_factors:
  - Myopia (nearsightedness)
  - Prior cataract surgery
  - Eye trauma
  - Family history
  - Lattice degeneration
  next:
  - default: null

- id: retinal_detachment_assessment
  when:
    symptoms_contains_any:
    - flashes
    - floaters
    - curtain
  description: Assessment for retinal detachment
  tests:
  - Dilated fundoscopic examination mandatory
  - Document extent of detachment
  - Identify retinal tears
  - Macula status (attached vs detached)
  suggest_dx:
  - Posterior vitreous detachment (PVD) - benign if no tear
  - Retinal tear without detachment - requires treatment
  - Retinal detachment - surgical emergency
  next:
  - when:
      fundoscopy: retinal_detachment
    go: retinal_detachment
  - when:
      fundoscopy: retinal_tear_without_detachment
    go: retinal_tear
  - when:
      fundoscopy: vitreous_hemorrhage
    go: vitreous_hemorrhage
  - default: posterior_vitreous_detachment

- id: retinal_tear
  when:
    fundoscopy: retinal_tear_without_detachment
  description: Retinal tear without detachment
  tests:
  - Dilated fundoscopic examination
  - Document location and size of tear
  suggest_dx:
  - Retinal tear (H33.3)
  - High risk for progression to retinal detachment
  referrals:
  - Ophthalmology within 24 hours
  - Urgent laser photocoagulation or cryotherapy
  management:
  - Prophylactic laser photocoagulation or cryotherapy to seal tear
  - Prevents progression to retinal detachment
  - Activity restriction until treated
  - Avoid heavy lifting, straining
  next:
  - default: null

- id: posterior_vitreous_detachment
  when:
    all_of:
    - symptoms_contains: flashes_and_floaters
    - fundoscopy: normal_retina
  description: Posterior vitreous detachment (PVD) - benign
  tests:
  - Dilated fundoscopic examination
  - Rule out retinal tear
  - Weiss ring may be visible
  suggest_dx:
  - Posterior vitreous detachment (H43.81)
  - Benign age-related change
  - Risk of retinal tear 10-15%
  referrals:
  - Ophthalmology within 1-2 weeks
  - Sooner if new symptoms (increased floaters, flashes, shadow)
  management:
  - Observation
  - Warn patient about symptoms of retinal detachment
  - Return immediately if
    - Sudden increase in floaters
    - New flashes of light
    - Shadow or curtain in vision
    - Decreased vision
  - Repeat dilated exam in 4-6 weeks
  next:
  - default: null

- id: vitreous_hemorrhage
  when:
    fundoscopy: vitreous_hemorrhage
  description: Vitreous hemorrhage
  tests:
  - Dilated fundoscopic examination (may be limited by blood)
  - B-scan ultrasound (rule out retinal detachment behind hemorrhage)
  - Assess for causes
    - Diabetic retinopathy (most common)
    - Retinal tear/detachment
    - Trauma
    - PVD with vessel rupture
  suggest_dx:
  - Vitreous hemorrhage (H43.1)
  referrals:
  - Ophthalmology within 24 hours
  - May require urgent vitrectomy if massive
  management:
  - Head elevation (helps blood settle inferiorly)
  - Identify and treat underlying cause
  - May resolve spontaneously over weeks to months
  - Vitrectomy if
    - Non-clearing hemorrhage
    - Retinal detachment present
    - Diabetic with vitreous hemorrhage
  next:
  - default: null

- id: giant_cell_arteritis
  when:
    all_of:
    - age: '>50'
    - symptoms_contains_any:
      - jaw claudication
      - scalp tenderness
      - temporal headache
  description: Giant cell arteritis (temporal arteritis)
  tests:
  - ESR (typically >50, often >100)
  - CRP (elevated)
  - Temporal artery biopsy (within 1 week of starting steroids)
  - CBC, CMP
  - Fundoscopy - pale swollen optic disc (arteritic AION)
  suggest_dx:
  - Giant cell arteritis (M31.6)
  - Can cause permanent bilateral blindness if untreated
  - Optic nerve infarction
  referrals:
  - Ophthalmology STAT
  - Rheumatology
  - Temporal artery biopsy within 1 week
  management:
  - START STEROIDS IMMEDIATELY - do not wait for biopsy
  - Methylprednisolone 1g IV daily x 3 days
  - Then prednisone 1 mg/kg/day PO (60-80mg)
  - Temporal artery biopsy (can be done up to 1 week after starting steroids)
  - Aspirin 81-325mg daily
  - PPI (GI protection with steroids)
  - Calcium and vitamin D
  - Treat for 1-2 years, taper slowly
  - Monitor ESR/CRP
  warning:
  - Vision loss may occur in fellow eye without treatment
  - 25-50% risk of fellow eye involvement within days
  - Do NOT delay steroids to get biopsy
  next:
  - default: null

- id: optic_neuropathy_assessment
  when:
    all_of:
    - fundoscopy: optic_disc_abnormality
    - APD: present
  description: Optic neuropathy evaluation
  tests:
  - APD (hallmark of optic nerve disease)
  - Visual fields (central scotoma, altitudinal defect)
  - Fundoscopy - disc edema, pallor, hemorrhages
  - MRI brain and orbits with contrast and fat suppression
  - Check for MS risk factors
  suggest_dx: []
  next:
  - when:
      all_of:
      - age: '20-50'
      - pain_with_eye_movement: true
      - fundoscopy: disc_edema
    go: optic_neuritis
  - when:
      all_of:
      - age: '>50'
      - fundoscopy: pale_swollen_disc
    go: anterior_ischemic_optic_neuropathy
  - when:
      fundoscopy: papilledema_bilateral
    go: papilledema
  - default: optic_neuritis

- id: optic_neuritis
  when:
    all_of:
    - age: '20-50'
    - pain_with_eye_movement: true
    - vision_loss: subacute
  description: Optic neuritis
  tests:
  - APD present (hallmark)
  - Visual acuity (variable, 20/30 to count fingers)
  - Color vision decreased (red desaturation)
  - Visual fields - central scotoma
  - Fundoscopy - disc edema (1/3), normal disc (2/3 - retrobulbar)
  - MRI brain and orbits with gadolinium and fat suppression
    - Look for T2 hyperintense lesion in optic nerve
    - Look for periventricular white matter lesions (MS)
  - Lumbar puncture (if MRI suggests MS) - oligoclonal bands
  suggest_dx:
  - Optic neuritis (H46)
  - 50% associated with multiple sclerosis
  - Idiopathic
  - Post-viral
  - Neuromyelitis optica (NMO) - bilateral, severe
  referrals:
  - Neuro-ophthalmology within 24-48 hours
  - Neurology if MS suspected
  management:
  - IV methylprednisolone 1g daily x 3 days
    - Speeds visual recovery (does not change final outcome)
    - Do NOT use oral prednisone alone (increased recurrence risk)
  - MRI to assess MS risk
    - If periventricular lesions present → 70% risk of MS within 15 years
    - If normal MRI → 25% risk of MS
  - Consider DMT (disease-modifying therapy) if high MS risk
  - NMO antibody (aquaporin-4) if bilateral or severe
  prognosis:
  - 90-95% recover to 20/40 or better within 6 months
  - Recovery begins 2-3 weeks, complete by 6 months
  - Residual deficits - color vision, contrast sensitivity
  - Recurrence risk 30% over 10 years
  next:
  - default: null

- id: anterior_ischemic_optic_neuropathy
  when:
    all_of:
    - age: '>50'
    - fundoscopy: pale_swollen_optic_disc
    - vision_loss: acute_painless
  description: Anterior ischemic optic neuropathy (AION)
  tests:
  - APD present
  - Visual fields - altitudinal defect (superior or inferior half)
  - Fundoscopy - pale swollen disc, flame hemorrhages
  - ESR, CRP (rule out giant cell arteritis)
  - Blood pressure
  - Cardiovascular risk factor assessment
  suggest_dx:
  - Non-arteritic AION (NAION) - most common (H47.01)
  - Arteritic AION (giant cell arteritis) - must rule out (H47.02)
  referrals:
  - Neuro-ophthalmology within 24-48 hours
  - If arteritic (GCA) - ophthalmology STAT
  management:
  - Rule out giant cell arteritis (ESR, CRP, temporal artery biopsy)
  - If arteritic → IV steroids immediately
  - If non-arteritic (NAION)
    - No proven treatment
    - Aspirin 81-325mg daily
    - Control cardiovascular risk factors
      - Blood pressure
      - Diabetes
      - Hyperlipidemia
      - Sleep apnea
  - Discourage use of phosphodiesterase-5 inhibitors (Viagra, Cialis) - may increase risk
  prognosis:
  - NAION - 40% improve spontaneously, 40% stable, 20% worsen
  - Fellow eye involvement 15% over 5 years
  - Arteritic AION - poor prognosis without treatment, high risk of fellow eye
  next:
  - default: null

- id: papilledema
  when:
    fundoscopy: bilateral_disc_edema
  description: Papilledema - bilateral disc edema from increased ICP
  tests:
  - Fundoscopy - bilateral disc edema, no APD unless chronic
  - Visual fields - enlarged blind spot
  - CT or MRI brain (rule out mass, hydrocephalus, venous sinus thrombosis)
  - Lumbar puncture with opening pressure (if imaging safe)
    - Opening pressure >25 cm H2O abnormal
  - MRV (venous sinus thrombosis)
  suggest_dx:
  - Idiopathic intracranial hypertension (IIH) - obese women of childbearing age
  - Brain tumor
  - Hydrocephalus
  - Cerebral venous sinus thrombosis
  - Meningitis
  referrals:
  - Neurosurgery if mass or hydrocephalus
  - Neurology for IIH management
  - Ophthalmology for vision monitoring
  management:
  - Treat underlying cause
  - IIH
    - Weight loss (most effective)
    - Acetazolamide 500mg-1g BID
    - Furosemide
    - Serial lumbar punctures
    - Optic nerve sheath fenestration or shunt if vision threatened
  emergency:
  - Papilledema = increased intracranial pressure until proven otherwise
  - Requires urgent neuroimaging
  next:
  - default: null

- id: painful_vision_loss
  when:
    all_of:
    - vision_loss: present
    - pain: severe
  description: Painful vision loss evaluation
  tests:
  - Intraocular pressure
  - Pupil examination
  - Corneal examination
  - Anterior chamber depth
  suggest_dx: []
  next:
  - when:
      iop: '>21'
    go: acute_angle_closure_glaucoma_vision_loss
  - when:
      pain_with_eye_movement: true
    go: optic_neuritis
  - when:
      exam_findings: corneal_opacity
    go: corneal_pathology_vision_loss
  - default: optic_neuritis

- id: acute_angle_closure_glaucoma_vision_loss
  when:
    all_of:
    - iop: '>21'
    - vision_loss: present
    - severe_pain: true
  description: Acute angle-closure glaucoma with vision loss
  tests:
  - See OPHTHO-RED-EYE tree for full management
  suggest_dx:
  - Acute angle-closure glaucoma
  referrals:
  - Ophthalmology STAT
  management:
  - Lower IOP immediately
  - Acetazolamide, timolol, apraclonidine, pilocarpine
  - Laser peripheral iridotomy
  next:
  - default: null

- id: corneal_pathology_vision_loss
  when:
    exam_findings: corneal_opacity
  description: Corneal cause of vision loss
  tests:
  - See OPHTHO-RED-EYE tree for corneal pathology
  suggest_dx:
  - Corneal ulcer
  - Keratitis
  - Corneal scar
  referrals:
  - Ophthalmology STAT if active infection
  next:
  - default: null

- id: gradual_vision_loss
  when:
    onset: gradual_weeks_to_months
  description: Gradual vision loss evaluation
  tests:
  - Visual acuity with pinhole (refractive error improves with pinhole)
  - Dilated fundoscopic examination
  - Intraocular pressure
  - Slit lamp if available
  suggest_dx:
  - Cataract (most common cause)
  - Age-related macular degeneration
  - Diabetic retinopathy
  - Glaucoma
  - Refractive error
  referrals:
  - Routine ophthalmology
  - Urgent if sudden worsening or new symptoms
  management:
  - Full ophthalmologic evaluation with dilated exam
  - Treat underlying cause
  next:
  - default: null

differential_diagnosis:
  acute_painless:
    - Central retinal artery occlusion (CRAO)
    - Central retinal vein occlusion (CRVO)
    - Retinal detachment
    - Vitreous hemorrhage
    - Giant cell arteritis (arteritic AION)
    - Non-arteritic AION
    - Optic neuritis (may have pain)
    - Posterior vitreous detachment (if dense floaters)
  acute_painful:
    - Acute angle-closure glaucoma
    - Optic neuritis (pain with eye movement)
    - Corneal ulcer
    - Uveitis
    - Endophthalmitis
  gradual:
    - Cataract
    - Age-related macular degeneration
    - Diabetic retinopathy
    - Glaucoma (chronic open-angle)
    - Refractive error

disposition_guidance:
  immediate_treatment:
    - CRAO (within 90-100 minutes)
    - Acute angle-closure glaucoma
    - Giant cell arteritis (start steroids stat)
    - Retinal detachment (macula-on)
  urgent_ophthalmology:
    - CRVO (within 24 hours)
    - Optic neuritis (within 24-48 hours)
    - Retinal detachment (macula-off, within 24 hours)
    - Vitreous hemorrhage
  routine_follow_up:
    - Gradual vision loss (cataract, AMD, glaucoma)
    - Posterior vitreous detachment (within 1-2 weeks)

references:
  - American Academy of Ophthalmology. Preferred Practice Pattern - Retinal and Ophthalmic Artery Occlusions. 2020.
  - AAO Preferred Practice Pattern - Idiopathic Intracranial Hypertension. 2019.
  - Optic Neuritis Study Group. Visual Function 15 Years after Optic Neuritis. Ophthalmology. 2008.
  - Hayreh SS. Acute retinal arterial occlusive disorders. Prog Retin Eye Res. 2011.
  - American Heart Association/American Stroke Association. Guidelines for Prevention of Stroke in Patients with Stroke and TIA. 2021.
