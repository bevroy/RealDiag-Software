tree_id: CARD-ATRIAL-FIB
name: Atrial Fibrillation
family: Cardiology
specialty: Cardiology
chief_complaint: Palpitations, irregular heartbeat, dyspnea, chest discomfort
description: Most common sustained cardiac arrhythmia with chaotic atrial electrical activity and irregular ventricular response, increases stroke risk 5-fold
icd10: I48.91
urgency: urgent
workup:
  - Pathophysiology - Disorganized atrial electrical activity 400-600 bpm with irregular ventricular response
  - Loss of atrial kick reduces cardiac output by 15-25%, atrial stasis increases thrombus formation
  - Stroke risk 5x higher (15-20% of all strokes from AF)
  - Classification - Paroxysmal (self-terminating <7 days), Persistent (>7 days requires cardioversion), Permanent (accepted, no cardioversion attempts)
  - Epidemiology - 2-4% of adults, 6 million US, prevalence increases with age (0.5% at 40-50 years to 5-15% at 80 years)
  - Risk factors - Hypertension (most common), CAD, valvular disease, heart failure, hyperthyroidism, obesity, OSA, alcohol binge (holiday heart)
  - Clinical presentation - Palpitations (irregular rapid heartbeat), dyspnea, fatigue, chest discomfort, dizziness, syncope rare, 30-40% asymptomatic
  - Physical exam - Irregularly irregular pulse, pulse deficit (apical rate exceeds radial rate), absent A waves in JVD, variable S1 intensity
  - ECG - Required for diagnosis, absent P waves (replaced by fibrillatory f waves), irregularly irregular R-R intervals, narrow QRS unless aberrant conduction
  - Laboratory - TSH (hyperthyroidism 10-15% of AF), BMP (electrolytes), CBC, troponin if chest pain, BNP if heart failure
  - Echocardiography - TTE in all new AF (assess for structural heart disease, LA size, LV function, valvular disease), TEE before cardioversion if AF >48 hours and not anticoagulated x 3 weeks
treatment:
  - Three pillars - Rate control, rhythm control, anticoagulation (most important)
  - Unstable (hypotension, heart failure, chest pain, altered mental status) - Immediate synchronized cardioversion 120-200 J
  - Rate control - First-line for most, target <110 bpm at rest (lenient approach)
  - Beta-blockers (metoprolol 25-100 mg BID, carvedilol) - First-line especially if CAD, heart failure, IV metoprolol 2.5-5 mg for acute control
  - Non-DHP calcium channel blockers (diltiazem 120-360 mg daily, verapamil) - Avoid if reduced EF
  - Digoxin 0.125-0.25 mg daily - Less effective, adjunct in heart failure
  - Rhythm control - Restore sinus rhythm
  - Cardioversion (electrical or pharmacologic) - If AF <48 hours can cardiovert without TEE, AF >48 hours needs anticoagulation x 3 weeks or TEE first, then 4 weeks anticoagulation post-cardioversion
  - Electrical cardioversion - Synchronized DC shock 120-200 J (90% success, procedural sedation)
  - Pharmacologic - Flecainide 200-300 mg or propafenone 450-600 mg (only if no structural heart disease), ibutilide 1 mg IV (most effective), amiodarone (safe in structural heart disease)
  - Antiarrhythmic drugs - Maintain sinus rhythm post-cardioversion
  - Amiodarone 200 mg daily - Most effective, safe in structural heart disease, monitor PFTs, LFTs, TFTs every 6 months (pulmonary fibrosis, thyroid dysfunction)
  - Dronedarone 400 mg BID - Less effective than amiodarone, contraindicated in NYHA class IV heart failure
  - Flecainide, propafenone - Only if NO structural heart disease
  - Catheter ablation - Pulmonary vein isolation, indications are symptomatic AF refractory to meds or patient preference, 70-80% success
  - Anticoagulation - MOST IMPORTANT (prevents stroke)
  - CHA2DS2-VASc score - CHF (1), Hypertension (1), Age ≥75 (2), Diabetes (1), Stroke/TIA (2), Vascular disease (1), Age 65-74 (1), Sex female (1)
  - Score ≥2 in men or ≥3 in women requires anticoagulation
  - DOACs FIRST-LINE - Apixaban 5 mg BID, rivaroxaban 20 mg daily, edoxaban 60 mg daily, dabigatran 150 mg BID (no INR monitoring, less intracranial hemorrhage than warfarin)
  - Warfarin - INR 2-3 if severe CKD (CrCl <15), mechanical valve, rheumatic mitral stenosis
  - Left atrial appendage closure (Watchman device) - If high stroke risk but contraindication to anticoagulation
  - Lifestyle - Avoid alcohol (especially binge), weight loss (10% reduces AF burden), treat OSA with CPAP, BP control
clinical_pearls:
  - AF increases stroke risk 5x, anticoagulation reduces stroke by 65% (most important intervention)
  - CHA2DS2-VASc score ≥2 in men or ≥3 in women requires anticoagulation, DOACs preferred over warfarin
  - Rate control (<110 bpm) is first-line for most patients, as effective as rhythm control for long-term outcomes
  - AF >48 hours requires 3 weeks anticoagulation or TEE before cardioversion (prevent stroke)
  - Pulmonary vein isolation (catheter ablation) is effective for symptomatic paroxysmal AF refractory to medications
  - Beta-blockers or non-DHP CCBs first-line for rate control, avoid CCBs if reduced EF
  - Amiodarone most effective antiarrhythmic but significant toxicities (monitor PFTs, LFTs, TFTs)
differentials:
  - CARD-ATRIAL-FLUTTER
  - CARD-SUPRAVENTRICULAR-TACHYCARDIA
  - CARD-MULTIFOCAL-ATRIAL-TACHYCARDIA
  - CARD-VENTRICULAR-TACHYCARDIA
trace:
  - Irregularly irregular pulse, palpitations, dyspnea
  - ECG shows absent P waves with irregularly irregular R-R intervals
  - CHA2DS2-VASc score to determine anticoagulation (DOACs first-line)
  - Rate control with beta-blockers or CCBs (target <110 bpm)
  - Consider cardioversion if symptomatic (anticoagulate first if >48 hours)
