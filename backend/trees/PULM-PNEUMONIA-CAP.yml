tree_id: PULM-PNEUMONIA-CAP
name: Community-Acquired Pneumonia
family: Pulmonary
specialty: Pulmonology
chief_complaint: Cough and fever
description: Acute infection of lung parenchyma acquired outside hospital in immunocompetent host

icd10: J18.9

urgency: urgent

workup:
  - Clinical presentation: cough (productive or nonproductive), fever, dyspnea, pleuritic chest pain, rigors, sputum production
  - Exam: fever, tachypnea, tachycardia, crackles/rales on auscultation, bronchial breath sounds, egophony, dullness to percussion
  - Chest X-ray PA and lateral: lobar consolidation, patchy infiltrates, or interstitial pattern - confirms diagnosis, assess for complications (effusion, empyema, cavitation)
  - Severity assessment: CURB-65 score (Confusion, Urea greater than 20 mg/dL, Respiratory rate 30 or more, BP less than 90/60, age 65 or more) - score 0-1 outpatient, 2 consider admission, 3-5 ICU consideration, PSI (Pneumonia Severity Index) alternative tool
  - Laboratory: CBC (leukocytosis with left shift), BMP (assess hydration, renal function), procalcitonin elevated suggests bacterial (versus viral), blood cultures if hospitalized (positive in 5-14 percent)
  - Sputum culture if severe CAP, not responding to therapy, or concern for resistant organism (Gram stain and culture)
  - Legionella urinary antigen if severe CAP or no response to beta-lactam
  - Respiratory viral panel (influenza, RSV, COVID-19) during viral season

treatment:
  - Outpatient (CURB-65 0-1, healthy no comorbidities): amoxicillin 1 gram TID x 5-7 days (preferred, covers Streptococcus pneumoniae), alternative macrolide (azithromycin 500 mg day 1 then 250 mg daily x 4 days), or doxycycline 100 mg BID x 5-7 days
  - Outpatient with comorbidities (COPD, diabetes, heart/liver/renal disease, aspiration risk): combination amoxicillin-clavulanate 875/125 mg BID plus macrolide (azithromycin), or respiratory fluoroquinolone monotherapy (levofloxacin 750 mg daily, moxifloxacin 400 mg daily) x 5-7 days
  - Inpatient non-ICU (CURB-65 2): beta-lactam (ceftriaxone 1-2 grams daily, ampicillin-sulbactam 1.5-3 grams every 6 hours) plus macrolide (azithromycin 500 mg daily), or respiratory fluoroquinolone monotherapy (levofloxacin 750 mg daily)
  - ICU (CURB-65 3-5 or septic shock): beta-lactam (ceftriaxone 2 grams daily or cefotaxime 1-2 grams every 8 hours) plus either azithromycin 500 mg daily or respiratory fluoroquinolone
  - MRSA risk factors (prior MRSA, IV drug use, recent hospitalization): add vancomycin 15-20 mg/kg every 8-12 hours or linezolid 600 mg every 12 hours
  - Pseudomonas risk factors (bronchiectasis, severe COPD, recent antibiotics, recent hospitalization): antipseudomonal beta-lactam (piperacillin-tazobactam 4.5 grams every 6 hours, cefepime 2 grams every 8 hours, meropenem 1 gram every 8 hours) plus ciprofloxacin or levofloxacin
  - Supportive care: oxygen to maintain SpO2 greater than 90 percent, IV fluids if dehydrated, antipyretics
  - Influenza: oseltamivir 75 mg BID x 5 days if within 48 hours (or severe illness regardless of timing)
  - Duration: 5-7 days for uncomplicated CAP, longer if complications or slow response

clinical_pearls:
  - Streptococcus pneumoniae most common cause (30-50 percent), Haemophilus influenzae, Mycoplasma pneumoniae, Chlamydia pneumoniae, viruses (influenza, RSV, COVID-19)
  - Chest X-ray confirms diagnosis but does not identify organism
  - CURB-65 guides disposition (0-1 outpatient, 2 admission, 3-5 ICU)
  - Amoxicillin preferred outpatient therapy for healthy patients (covers S. pneumoniae, inexpensive)
  - Macrolide resistance increasing - combination therapy or fluoroquinolone if comorbidities
  - Duration 5-7 days adequate for uncomplicated CAP (as effective as 10-14 days)
  - Failure to improve after 72 hours consider resistant organism, complications (empyema), or alternative diagnosis

differentials:
  - Bronchitis (cough without infiltrate on chest X-ray, no fever/tachypnea, viral etiology, antibiotics not indicated)
  - Pulmonary embolism (acute dyspnea, pleuritic chest pain, clear lungs on exam, elevated D-dimer, CT angiography diagnostic)
  - Heart failure (dyspnea, orthopnea, crackles, elevated BNP, pulmonary edema on chest X-ray)
  - Lung cancer (chronic cough, weight loss, hemoptysis, mass on chest X-ray)

trace:
  - 54-year-old man with COPD presents to ED with 3 days cough productive yellow-green sputum, fever to 101.5 F, dyspnea, right-sided chest pain with breathing
  - Exam: temp 100.8 F, HR 102, RR 24, SpO2 91 percent on room air, decreased breath sounds right lower lobe with crackles, dullness to percussion right base
  - Labs: WBC 16.5K with 85 percent neutrophils, left shift, procalcitonin 2.8 ng/mL (elevated, bacterial)
  - Chest X-ray: right lower lobe consolidation
  - CURB-65 score 1 (age less than 65, no confusion, RR less than 30, BP 128/76, BUN 14) but has COPD comorbidity
  - Diagnosis: community-acquired pneumonia right lower lobe, moderate severity
  - Decision to admit given comorbidity COPD and hypoxemia
  - Blood cultures obtained (prior to antibiotics)
  - Started ceftriaxone 1 gram IV daily plus azithromycin 500 mg IV daily, oxygen 2 L nasal cannula (SpO2 94 percent)
  - Day 2: fever resolves, feeling better, blood cultures no growth at 48 hours
  - Day 3: significant improvement, SpO2 95 percent on room air, switched to oral levofloxacin 750 mg daily, discharged home with 5 days total antibiotic course
  - Follow-up 1 week: symptoms resolved, repeat chest X-ray in 6 weeks to document clearing (exclude underlying mass)
