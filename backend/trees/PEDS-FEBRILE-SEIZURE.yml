tree_id: PEDS-FEBRILE-SEIZURE
name: Febrile Seizure
family: pediatrics
specialty: Pediatrics/Neurology/Emergency Medicine
icd10: R56.00
snomed: 41497008
urgency:
  - Prolonged seizure (greater than 5 minutes) or status epilepticus
  - Recurrent seizures within same febrile illness (complex febrile seizure)
  - Focal seizure or focal neurologic deficits post-ictally
  - Age less than 6 months or greater than 5 years (not typical febrile seizure age)
  - Signs of meningitis (altered mental status, bulging fontanelle, neck stiffness)
  - Seizure before fever onset (suggests CNS infection or epilepsy, not febrile seizure)
homeopathy: []
presentations:
  - Generalized tonic-clonic seizure associated with fever
  - Sudden loss of consciousness
  - Rhythmic jerking of extremities (clonic activity)
  - Body stiffening (tonic activity)
  - Eyes rolled back or deviated
  - Cyanosis or apnea during seizure
  - Post-ictal period: confusion, lethargy, sleepiness (brief, less than 15 minutes)
  - Age 6 months to 5 years (peak age 12-18 months)
  - Fever present at time of seizure or develops shortly after
  - First-time seizure versus recurrent febrile seizures
  - Family history of febrile seizures (20-25% recurrence risk if family history)
  - Otherwise healthy child with normal development
workup:
  - Clinical history
  - Detailed seizure description
  - Duration of seizure (most important feature)
  - Type: generalized versus focal
  - Number of seizures in current illness (single versus multiple)
  - Post-ictal period duration and characteristics
  - Classify as simple versus complex febrile seizure
  - Simple febrile seizure (80-85% of cases)
  - Generalized tonic-clonic
  - Duration less than 15 minutes
  - Single episode in 24-hour period
  - No focal features
  - Rapid return to baseline (within 15-30 minutes)
  - Complex febrile seizure (15-20% of cases)
  - Prolonged (greater than or equal to 15 minutes) OR
  - Focal features (one-sided or focal onset) OR
  - Recurrent (multiple seizures in 24 hours)
  - Fever characteristics
  - Timing: fever before seizure (typical) versus seizure before fever recognition (concerning)
  - Maximum temperature and rate of rise (rapid fever rise triggers seizures)
  - Source of fever (URI, otitis media, roseola, gastroenteritis)
  - Past medical history
  - Previous febrile seizures (30-40% recurrence risk)
  - Previous afebrile seizures (suggests epilepsy, not simple febrile seizure)
  - Developmental history (normal development typical of febrile seizures)
  - Neurologic problems or chronic medical conditions
  - Recent head trauma
  - Recent immunizations (febrile seizures can occur within 24 hours of vaccines, especially MMR and varicella)
  - Family history
  - Febrile seizures (increases recurrence risk)
  - Epilepsy
  - Medication history (recent antibiotics, antihistamines - may lower seizure threshold)
  - Physical examination
  - Vital signs (temperature, heart rate, respiratory rate, blood pressure, oxygen saturation)
  - Confirm fever present (temperature greater than or equal to 100.4°F/38°C)
  - General appearance (well-appearing versus ill, toxic)
  - Neurologic examination (CRITICAL)
  - Mental status (should return to baseline after brief post-ictal period)
  - Prolonged altered mental status concerning for CNS infection or post-ictal state
  - Cranial nerves
  - Motor: tone, strength, symmetry (should be normal and symmetric)
  - Focal weakness suggests complex seizure or CNS pathology
  - Reflexes: deep tendon reflexes, Babinski (should be symmetric)
  - Meningismus assessment
  - Neck stiffness (Kernig and Brudzinski signs in older children)
  - Bulging fontanelle in infants
  - Photophobia
  - Signs of increased intracranial pressure
  - Comprehensive exam to identify fever source
  - HEENT: tympanic membranes (otitis media), pharynx (pharyngitis), nasal discharge
  - Respiratory: lung sounds (pneumonia)
  - Skin: rashes, petechiae, purpura
  - Identify underlying cause of fever (usually benign viral illness)
  - Diagnostic evaluation
  - Lumbar puncture (LP) with CSF analysis - assess for meningitis
  - Indications
  - Age less than 12 months: STRONGLY consider (meningeal signs unreliable)
  - Age 12-18 months: consider if not fully immunized (Hib/PCV13) or clinical suspicion
  - Age greater than 18 months: if meningeal signs present or clinical suspicion
  - Any complex febrile seizure
  - Ill or toxic appearance
  - Recent antibiotics (may partially treat meningitis, masking symptoms)
  - NOT routinely indicated for simple febrile seizure in well-appearing fully immunized child greater than 18 months
  - CSF studies: cell count, glucose, protein, Gram stain, culture
  - Neuroimaging (CT or MRI brain)
  - NOT routinely indicated for simple febrile seizure
  - Consider if:
  - Focal seizure or focal neurologic deficits
  - Signs of increased intracranial pressure
  - Complex febrile seizure not rapidly returning to baseline
  - History of neurosurgery, VP shunt, or CNS abnormality
  - EEG (electroencephalogram)
  - NOT routinely indicated for simple febrile seizure
  - Does not predict epilepsy risk or guide management
  - Consider if concern for underlying epilepsy (afebrile seizure history, developmental delay)
  - Serum electrolytes, glucose, calcium, magnesium
  - NOT routinely indicated for simple febrile seizure
  - Consider if:
  - Prolonged or focal seizure
  - History of vomiting/diarrhea (dehydration, electrolyte imbalance)
  - Concern for metabolic cause
  - Complete blood count, blood culture
  - Based on clinical indication to identify fever source
  - NOT routinely needed for simple febrile seizure diagnosis
treatment:
  - Acute seizure management (if seizure ongoing upon presentation)
  - Ensure airway patency and adequate oxygenation
  - Position child on side (recovery position) to prevent aspiration
  - Do NOT restrain or place anything in mouth
  - Supplemental oxygen if needed
  - Seizure lasting greater than 5 minutes or ongoing: administer antiseizure medication
  - Benzodiazepines (first-line)
  - Lorazepam 0.1 mg/kg IV (max 4 mg) OR
  - Diazepam 0.2-0.5 mg/kg IV (max 10 mg) OR
  - Midazolam 0.2 mg/kg IM or 0.2-0.5 mg/kg intranasal (max 10 mg)
  - If IV access not available: rectal diazepam 0.5 mg/kg or buccal/intranasal midazolam
  - If seizure continues despite benzodiazepine: status epilepticus protocol
  - Fosphenytoin 20 mg PE/kg IV OR levetiracetam 60 mg/kg IV OR valproic acid 40 mg/kg IV
  - Most febrile seizures are brief (less than 5 minutes) and self-terminate before arrival
  - Post-seizure management
  - Supportive care
  - Observation until returns to baseline mental status
  - Treat underlying fever source (antibiotics if bacterial infection)
  - Antipyretics for comfort
  - Acetaminophen 15 mg/kg/dose every 4-6 hours OR
  - Ibuprofen 10 mg/kg/dose every 6 hours
  - Antipyretics do NOT prevent recurrent febrile seizures
  - Prophylactic antiseizure medications NOT recommended
  - Continuous daily anticonvulsants (phenobarbital, valproate) NOT indicated
  - Risks outweigh benefits (side effects, no proven long-term benefit)
  - Does not reduce epilepsy risk
  - Intermittent diazepam with fever NOT routinely recommended
  - May reduce recurrence risk but does not change long-term outcomes
  - Side effects (sedation, ataxia)
  - Reserved for select cases (prolonged seizures, parental anxiety)
  - Rectal diazepam 0.5 mg/kg (max 20 mg) at fever onset can be prescribed for home use
  - Disposition
  - Simple febrile seizure, well-appearing, returned to baseline: may discharge home
  - Admit if:
  - Complex febrile seizure (prolonged, focal, recurrent)
  - Age less than 6 months or greater than 5 years
  - Suspected meningitis or serious bacterial infection
  - Persistent altered mental status
  - Social concerns (unreliable follow-up, parental inability to cope)
  - Parent education and anticipatory guidance (CRITICAL)
  - Febrile seizures are common (2-5% of children age 6 months to 5 years)
  - Benign condition, does NOT cause brain damage or developmental delay
  - Risk of recurrence: 30-40% overall (higher if young age at first seizure, family history, low-grade fever)
  - Risk of developing epilepsy: 1-2% (only slightly higher than general population)
  - Higher epilepsy risk if: complex febrile seizure, family history of epilepsy, developmental delay
  - Antipyretics do NOT prevent febrile seizures (give for comfort only)
  - If seizure occurs at home: keep safe (side position, do not restrain), call 911 if prolonged greater than 5 minutes
  - Reassurance: vast majority outgrow febrile seizures by age 5-6 years, excellent prognosis
clinical_pearls:
  - 'Febrile seizures occur in 2-5% of children age 6 months to 5 years - benign condition with excellent prognosis'
  - 'Simple febrile seizure: generalized, less than 15 minutes, single in 24 hours, rapid return to baseline - no workup needed if well-appearing and fully immunized'
  - 'Lumbar puncture STRONGLY consider in infants less than 12 months (meningeal signs unreliable) or if not fully immunized'
  - 'Antipyretics (acetaminophen, ibuprofen) do NOT prevent febrile seizures - give for comfort but set realistic expectations'
  - 'Prophylactic antiseizure medications (phenobarbital, valproate) NOT recommended - risks outweigh benefits, do not prevent epilepsy'
  - 'Risk of recurrence 30-40% (higher if young age, family history, low-grade fever at first seizure)'
  - 'Risk of epilepsy only 1-2% (slightly higher than general population) - febrile seizures do NOT cause epilepsy or brain damage'
  - 'Complex febrile seizure (prolonged greater than 15 minutes, focal, or recurrent in 24 hours) warrants further evaluation - consider LP, labs, possible imaging'
referrals:
  - Pediatric neurology if complex febrile seizure, recurrent febrile seizures with family concern, focal neurologic deficits, or developmental delay
  - Pediatric neurology if seizure before fever onset or afebrile seizure (suggests epilepsy)
  - Pediatric infectious disease if concern for meningitis, encephalitis, or complicated infection
  - EEG and neuroimaging NOT routinely indicated but neurology may order if atypical features
differentials:
  - Simple febrile seizure (most common) - age 6 months to 5 years, generalized, brief, rapid recovery, benign
  - Complex febrile seizure - prolonged (greater than 15 minutes), focal, or recurrent in 24 hours
  - Epilepsy (afebrile seizure) - seizure without fever, recurrent unprovoked seizures
  - Meningitis or encephalitis - fever with seizure, altered mental status, meningeal signs, CSF pleocytosis
  - Breath-holding spell - triggered by crying or frustration, cyanotic or pallid type, brief, age 6-18 months
  - Rigors or shivering (not true seizure) - child conscious, can be consoled, no post-ictal period
  - Syncope - brief loss of consciousness, no tonic-clonic activity, rapid recovery
  - Acute symptomatic seizure (provoked) - metabolic (hypoglycemia, hyponatremia), toxic ingestion, head trauma
  - Infantile spasms (West syndrome) - clusters of brief spasms, hypsarrhythmia on EEG, developmental regression
  - Dravet syndrome (severe myoclonic epilepsy of infancy) - starts with prolonged febrile seizures in infancy, progresses to refractory epilepsy
