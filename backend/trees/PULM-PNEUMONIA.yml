tree_id: PULM-PNEUMONIA
name: Community-Acquired Pneumonia
family: Pulmonology
specialty: Pulmonology
icd10:
- J18.9
- J15.9
- J13
snomed:
- '385093006'
urgency: medium
description: Comprehensive evaluation and management of Community-Acquired Pneumonia
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Fever and chills
- Productive cough with purulent sputum
- Pleuritic chest pain
- Dyspnea and tachypnea
- Crackles on lung auscultation
workup:
- Chest X-ray (lobar consolidation, interstitial infiltrates)
- Sputum gram stain and culture if hospitalized
- Blood cultures x 2 if hospitalized (before antibiotics)
- Procalcitonin or CRP if diagnosis uncertain
- 'Consider: Legionella urinary antigen, pneumococcal urinary antigen'
treatment:
- 'Guideline-based treatment options for Community-Acquired Pneumonia include:'
- 'Outpatient healthy: Amoxicillin 1g TID x 5 days OR doxycycline 100mg BID x 5 days
  (ATS 2023)'
- 'Outpatient with comorbidities: Amoxicillin-clavulanate 875/125mg BID + azithromycin
  500mg daily x 5 days (ATS 2023)'
- 'Inpatient non-ICU: Ceftriaxone 1g daily + azithromycin 500mg daily (ATS 2023)'
- 'ICU: Ceftriaxone 2g daily + azithromycin 500mg daily (or levofloxacin 750mg daily)
  (ATS 2023)'
- Add vancomycin or linezolid if MRSA suspected (influenza, IV drug use, recent hospitalization)
  (ATS 2023)
clinical_pearls:
- 'Most common bacterial causes: Streptococcus pneumoniae (most common), Mycoplasma,
  Chlamydia, Haemophilus'
- 'CURB-65 score predicts mortality: Confusion, Urea >20, RR ≥30, BP <90/60, age ≥65
  (score ≥2 = consider admission)'
- 'Atypical features: Gradual onset, dry cough, extrapulmonary symptoms (Mycoplasma,
  Legionella)'
- 'Healthcare-associated pneumonia (HCAP): Within 90 days hospitalization - covers
  MRSA/Pseudomonas'
- Blood cultures positive in only 5-14% (send before antibiotics but don't delay treatment)
referrals:
- Admission if CURB-65 ≥2, hypoxia (SpO2 <90%), inability to tolerate PO, or social
  concerns
- ICU if CURB-65 ≥3, mechanical ventilation needed, or septic shock
- Pulmonology if slow resolution or concern for post-obstructive pneumonia (lung cancer)
differentials: []
trace:
  source: American Thoracic Society (ATS) Guidelines, Global Initiative for Chronic
    Obstructive Lung Disease (GOLD)
