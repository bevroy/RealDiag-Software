tree_id: OBGYN-PELVIC-INFLAMMATORY-DISEASE
name: Pelvic Inflammatory Disease (PID)
family: Obstetrics Gynecology
specialty: Obstetrics Gynecology
icd10:
- N73.9
- N70.93
snomed:
- '198130006'
urgency: medium
description: Comprehensive evaluation and management of Pelvic Inflammatory Disease
  (PID)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Lower abdominal/pelvic pain (bilateral)
- Cervical motion tenderness (chandelier sign)
- Uterine tenderness, adnexal tenderness
- Abnormal vaginal discharge (purulent)
- Fever (may be absent in mild cases)
- Abnormal uterine bleeding
- 'Caused by ascending infection: Chlamydia trachomatis, Neisseria gonorrhoeae most
  common'
workup:
- 'Cervical swabs: NAAT for gonorrhea and chlamydia'
- Pregnancy test (rule out ectopic)
- Wet mount (trichomonas, BV)
- CBC (leukocytosis)
- Pelvic ultrasound if TOA suspected (complex adnexal mass)
treatment:
- 'Guideline-based treatment options for Pelvic Inflammatory Disease (PID) include:'
- 'Outpatient: Ceftriaxone 500mg IM x 1 + doxycycline 100mg PO BID x 14 days + metronidazole
  500mg BID x 14d (ACOG 2024)'
- 'Inpatient: Cefotetan 2g IV q12h + doxycycline 100mg IV/PO q12h, OR cefoxitin 2g
  IV q6h + doxycycline (ACOG 2024)'
- 'Alternative: Clindamycin + gentamicin IV (ACOG 2024)'
- 'Treat sexual partners: Empiric treatment for gonorrhea and chlamydia (ACOG 2024)'
- 'Follow-up: 48-72 hours to ensure improving, repeat testing in 3 months (test of
  cure) (ACOG 2024)'
clinical_pearls:
- 'Low threshold for diagnosis: Treat empirically if sexually active + pelvic pain
  + CMT'
- 'Minimal criteria (CDC): Pelvic pain + cervical motion or uterine or adnexal tenderness'
- 'Test for gonorrhea AND chlamydia: Both common, often coinfection'
- 'Complications: Tubo-ovarian abscess, Fitz-Hugh-Curtis syndrome (perihepatitis),
  infertility, chronic pain'
- 'Admit if: TOA, pregnancy, severe illness, unable to tolerate PO, failed outpatient
  treatment'
referrals:
- OB/GYN if TOA or severe
- 'Admission if: TOA, unable to tolerate PO, pregnancy, severe illness'
- Surgery if TOA ruptured
differentials:
  - Appendicitis
  - Ectopic pregnancy
  - Ovarian torsion
  - UTI
  - Endometriosis
trace:
  source: American College of Obstetricians and Gynecologists (ACOG) Practice Bulletins,
    Society for Maternal-Fetal Medicine (SMFM)
  version: 0.1.0
  last_updated: '2024-12-26'
