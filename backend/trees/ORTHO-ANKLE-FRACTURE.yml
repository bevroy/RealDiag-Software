presentations:
  - Ankle pain, swelling, inability to bear weight after trauma
  - Deformity if displaced
  - Ottawa ankle rules to determine need for X-ray
  - X-ray shows fracture of malleolus (medial, lateral, or bimalleolar)
differentials:
  - Ankle sprain
  - Ligament tear
  - Tendon rupture
  - Dislocation
workup:
  - 'X-ray ankle (AP, lateral, mortise): Medial, lateral, or posterior malleolus fracture. Mortise view for talar shift'
  - 'Medial clear space: <4mm normal. >4mm = syndesmotic disruption or deltoid ligament injury'
  - 'Tibiofibular overlap: >6mm on AP, >1mm on mortise. Less = syndesmotic injury'
  - 'Palpate entire fibula: Rule out Maisonneuve fracture (proximal fibula fracture)'
treatment:
  - 'Guideline-based treatment options for Ankle Fracture include:'
  - 'Non-displaced stable lateral malleolus: Controlled ankle motionboot, weight bearing as tolerated, f/u 1 week (AAOS 2023)'
  - 'Displaced or unstable: ORIF with plates/screws (bimalleolar, trimalleolar, syndesmotic injury) (AAOS 2023)'
  - 'Post-op: Non-weight bearing x6 weeks, then progressive weight bearing with PT (AAOS 2023)'
  - 'Splint initially: Posterior splint with ankle 90° dorsiflexion until swelling improves, then cast or surgery (AAOS 2023)'
  - 'DVT prophylaxis: Enoxaparin 40mg SQ daily if non-weight bearing >3 days (Caprini score) (AAOS 2023)'
clinical_pearls:
  - 'Ottawa ankle rules (99% sensitive): X-ray if bone tenderness at posterior edge/tip of lateral or medial malleolus OR unable to bear weight 4 steps'
  - 'Stable fractures: Isolated non-displaced lateral malleolus below plafond - can be treated with boot/cast'
  - 'Unstable fractures (need ORIF): Bimalleolar, trimalleolar, displaced, talar shift, syndesmotic injury (Maisonneuve)'
  - 'Maisonneuve fracture: Proximal fibula fracture with syndesmotic disruption - palpate entire fibula, unstable, needs ORIF'
  - 'Syndesmotic injury: Widened mortise on X-ray (>4mm medial clear space) - high ankle sprain, prolonged recovery'
red_flags: []
disposition_guidance: {}
referrals:
  - 'Orthopedics urgently if: Bimalleolar/trimalleolar, displaced fracture, syndesmotic injury, Maisonneuve fracture, neurovascular compromise'
  - 'Stable non-displaced lateral malleolus: Can manage with CAM boot and orthopedic follow-up 1 week'
