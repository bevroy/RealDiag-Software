tree_id: ORTHO-ANKLE-FRACTURE
name: Ankle Fracture
family: Orthopedics
specialty: Orthopedics
chief_complaint: Ankle pain, swelling, and inability to bear weight after injury
description: Fracture of one or more malleoli (lateral malleolus, medial malleolus, posterior malleolus) typically from inversion, eversion, or rotational injury. Classification by Lauge-Hansen or Weber systems guides treatment. Ottawa ankle rules help determine need for X-ray (99% sensitive, reduces unnecessary imaging). Stable fractures (isolated non-displaced lateral malleolus) can be managed non-operatively. Unstable fractures (bimalleolar, trimalleolar, displaced, syndesmotic injury) require ORIF. Complications include malunion, chronic instability, post-traumatic arthritis, and deep vein thrombosis.
icd10: S82.899A
urgency: urgent

workup:
  - Clinical presentation and mechanism of injury:
    - Inversion injury (most common, 85% of ankle injuries):
      - Lateral malleolus fracture (distal fibula)
      - Lateral ligament sprain (anterior talofibular ligament most common)
      - May have associated medial injury if severe
    - Eversion injury:
      - Medial malleolus fracture (distal tibia)
      - Deltoid ligament injury
      - Often unstable requiring surgical fixation
    - Rotational injury:
      - Bimalleolar or trimalleolar fracture
      - High energy mechanism
      - High risk of instability
    - Symptoms:
      - Immediate pain at ankle after injury
      - Swelling and ecchymosis (develops over hours)
      - Inability or difficulty bearing weight
      - Deformity if displaced fracture or dislocation
      - Point tenderness over malleoli or midfoot
  - Physical examination:
    - Inspection:
      - Swelling and ecchymosis location (lateral, medial, posterior)
      - Deformity or abnormal position (fracture-dislocation)
      - Open injury (break in skin overlying fracture - surgical emergency)
      - Skin tension or tenting (risk of skin necrosis)
    - Palpation:
      - Bony tenderness at malleoli (medial, lateral, posterior)
      - Tenderness along fibula (Maisonneuve fracture if proximal fibula tender)
      - Midfoot tenderness (5th metatarsal base, navicular - associated injuries)
      - Syndesmotic assessment (squeeze test, external rotation test)
    - Range of motion (if able to tolerate):
      - Dorsiflexion and plantarflexion
      - Inversion and eversion
      - Neurovascular exam:
        - Dorsalis pedis and posterior tibial pulses
        - Capillary refill (under 2 seconds normal)
        - Sensation (superficial peroneal, deep peroneal, tibial, sural nerves)
        - Motor function (dorsiflexion, plantarflexion, toe extension/flexion)
    - Ability to bear weight (Ottawa ankle rules)
  - Ottawa Ankle Rules (determine need for radiographs):
    - Ankle X-rays required if ANY of following present:
      - Age 55 or older
      - Bone tenderness at posterior edge or tip of lateral malleolus
      - Bone tenderness at posterior edge or tip of medial malleolus
      - Unable to bear weight immediately after injury AND in ED (4 steps)
    - Foot X-rays required if ANY of following present:
      - Bone tenderness at base of 5th metatarsal
      - Bone tenderness at navicular
      - Unable to bear weight immediately after injury AND in ED (4 steps)
    - Ottawa rules are 99% sensitive (negative rules essentially rule out fracture)
    - Do NOT apply rules if: intoxicated, distracting injury, decreased sensation, head injury
  - Imaging:
    - Ankle X-rays (AP, lateral, mortise views):
      - Identify fracture location (lateral, medial, posterior malleolus)
      - Assess displacement and angulation
      - Measure talar shift (medial clear space should equal superior clear space)
      - Assess syndesmotic injury (tibiofibular clear space over 6 mm abnormal)
      - Weber classification (lateral malleolus fracture level relative to syndesmosis):
        - Weber A: Below syndesmosis (usually stable)
        - Weber B: At level of syndesmosis (may be unstable)
        - Weber C: Above syndesmosis (unstable, high syndesmotic injury risk)
    - Stress views (if syndesmotic injury suspected):
      - External rotation or gravity stress to assess stability
      - Medial clear space widening indicates deltoid or syndesmotic injury
    - CT scan indications:
      - Complex fracture patterns requiring surgical planning
      - Intra-articular involvement assessment
      - Posterior malleolus fracture (assess fragment size)
    - MRI (rarely needed acutely):
      - Assess ligamentous injuries if no fracture but severe symptoms
      - Osteochondral lesions of talus
      - Syndesmotic injury evaluation

treatment:
  - Initial management (all ankle fractures):
    - Immobilization with posterior splint or well-padded stirrup splint
    - Ice and elevation to reduce swelling
    - Non-weight bearing with crutches
    - Pain control (NSAIDs, acetaminophen, opioids if severe)
    - Orthopedic referral within 3-7 days for all fractures
  - Closed reduction if grossly displaced or fracture-dislocation:
    - Perform in ED with procedural sedation
    - Reduce dislocation promptly to prevent skin necrosis and neurovascular injury
    - Post-reduction neurovascular exam and repeat X-rays
    - Posterior splint after reduction
  - Stable fractures (non-operative management):
    - Criteria for non-operative treatment:
      - Isolated non-displaced lateral malleolus fracture (Weber A or B)
      - No syndesmotic injury
      - No medial-side injury (no medial tenderness, normal medial clear space)
      - Stable mortise on X-ray
    - Treatment protocol:
      - Posterior splint or walking boot for 6 weeks
      - Non-weight bearing first 2-3 weeks, then progressive weight bearing as tolerated
      - Transition to ankle brace at 6 weeks
      - Physical therapy for range of motion and strengthening
      - Return to activity at 8-12 weeks depending on healing
    - Follow-up X-rays at 1-2 weeks to ensure no displacement
  - Unstable fractures (operative management with ORIF):
    - Indications for surgery:
      - Bimalleolar fracture (medial and lateral malleoli)
      - Trimalleolar fracture (medial, lateral, and posterior malleoli)
      - Displaced fracture (over 2 mm displacement or angulation)
      - Syndesmotic injury (widened mortise)
      - Weber C fracture (high fibula fracture above syndesmosis)
      - Talar shift or medial clear space widening
      - Open fracture (surgical emergency within 6-8 hours)
    - Surgical timing:
      - Within 6-8 hours for open fractures
      - Within 24-48 hours for fracture-dislocations
      - Delay 7-14 days if significant swelling (wait for wrinkle sign)
      - Early surgery increases wound complications if severe swelling
    - Post-operative care:
      - Non-weight bearing 6 weeks in boot or cast
      - Progressive weight bearing weeks 6-12
      - Physical therapy starting 6-8 weeks
      - Return to full activity 12-16 weeks
      - Hardware removal rarely needed unless symptomatic
  - Special considerations:
    - Maisonneuve fracture (proximal fibula fracture with syndesmotic injury):
      - High ankle sprain pattern with proximal fibula fracture
      - Requires syndesmotic fixation even without distal fibula fracture
      - Always palpate entire fibula in ankle injuries
    - Posterior malleolus fractures:
      - Fragment over 25% of articular surface requires fixation
      - Associated with worse long-term outcomes if not fixed
    - Pediatric ankle fractures:
      - Physeal injuries (Salter-Harris classification)
      - Growth plate damage risk
      - Lower threshold for orthopedic referral
  - DVT prophylaxis considerations:
    - Increased DVT risk with immobilization and non-weight bearing
    - Consider prophylactic anticoagulation if high risk (obesity, prior DVT, prolonged immobilization)
    - Encourage ankle pumps and leg exercises while non-weight bearing

clinical_pearls:
  - Ottawa ankle rules are 99% sensitive for ankle fractures and reduce unnecessary X-rays by 30-40%
  - Inability to bear weight 4 steps is key component of Ottawa rules
  - Bimalleolar and trimalleolar fractures are UNSTABLE and require ORIF
  - Weber classification guides treatment: A often stable, B variable, C unstable requiring surgery
  - Always assess syndesmosis: medial clear space should equal superior clear space (both 3-4 mm)
  - Talar shift of 1 mm reduces tibiotalar contact area by 40% leading to post-traumatic arthritis
  - Maisonneuve fracture is syndesmotic injury with proximal fibula fracture - easy to miss
  - Posterior malleolus fractures over 25% of articular surface require fixation
  - Delay surgery 7-14 days if severe swelling (wait for wrinkle sign) to reduce wound complications
  - Open fractures are surgical emergencies requiring antibiotics and washout within 6-8 hours
  - Non-displaced isolated lateral malleolus fractures (Weber A) can be treated in walking boot
  - Always assess for associated injuries: 5th metatarsal base fracture, midfoot injuries

presentations:
  - Ankle pain after injury
  - Swelling and ecchymosis
  - Inability to bear weight
  - Ankle deformity
  - Point tenderness over malleolus
  - Limited range of motion
  - Limping or antalgic gait
  - Crepitus on movement
  - Open wound (open fracture)

