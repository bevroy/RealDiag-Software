tree_id: GI-ACHALASIA
name: Achalasia
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Progressive dysphagia to solids and liquids, regurgitation, chest pain
description: Primary esophageal motility disorder characterized by failure of lower esophageal sphincter relaxation and absent esophageal peristalsis
icd10: K22.0
snomed: 80774007
urgency: routine
workup:
  - Clinical presentation - progressive dysphagia over months to years
  - Dysphagia to both solids AND liquids (liquids may be worse - key feature)
  - Progresses gradually over months to years
  - Regurgitation of undigested food, especially when lying down
  - Chest pain (30-60% of patients) - retrosternal, can mimic cardiac pain
  - Weight loss (50-90% of patients) due to difficulty eating
  - Heartburn (30-40%) - mimics GERD but refractory to PPIs
  - Nocturnal cough, aspiration pneumonia (from regurgitation)
  - Patients learn maneuvers to help (standing, arching back, Valsalva)
  - Barium esophagram - first-line imaging study
  - Dilated esophagus with smooth tapering at gastroesophageal junction ("bird's beak" appearance)
  - Absence of gastric air bubble
  - Poor esophageal emptying, fluid level in esophagus
  - Upper endoscopy (EGD) - rule out pseudoachalasia
  - Esophagus often dilated with retained food/fluid
  - Lower esophageal sphincter (LES) tight but endoscope can pass with gentle pressure
  - Gastroesophageal junction appears normal (rules out stricture, tumor)
  - High-resolution esophageal manometry - GOLD STANDARD for diagnosis
  - Incomplete LES relaxation (integrated relaxation pressure IRP greater than 15 mmHg)
  - Absent or weak peristalsis in esophageal body
  - Chicago Classification types
  - Type I - absent contractility (classic achalasia)
  - Type II - pan-esophageal pressurization (best prognosis)
  - Type III - spastic achalasia with premature contractions (worst prognosis)
  - Endoscopic ultrasound if suspect pseudoachalasia (age greater than 60, symptoms less than 6 months, severe weight loss)
  - Evaluates for malignancy at gastroesophageal junction
  - CT chest/abdomen if red flags for secondary achalasia (Chagas disease, malignancy)
treatment:
  - No cure - treatment focuses on relieving obstruction at LES
  - Medical therapy (least effective, only for poor surgical candidates)
  - Calcium channel blockers - nifedipine 10-30 mg 30 minutes before meals
  - Nitrates - isosorbide dinitrate 5-10 mg before meals
  - Only 10-50% response rate, temporary benefit
  - Botulinum toxin injection (temporary, not definitive)
  - Endoscopic injection of botox into LES (100 units)
  - 60-80% initial response but relapse in 6-12 months
  - Repeat injections less effective
  - Reserved for elderly, high surgical risk, bridge to definitive therapy
  - Can cause fibrosis making subsequent myotomy more difficult
  - Pneumatic dilation - endoscopic first-line treatment
  - Balloon dilation of LES under fluoroscopy (30-40 mm balloon)
  - Graded dilations starting smaller progressing to larger
  - 70-90% success rate initially, 50% at 5 years
  - Complications - perforation 2-5%, GERD 15-30%
  - May require repeat dilations over time
  - Laparoscopic Heller myotomy plus partial fundoplication - surgical definitive treatment
  - Division of circular muscle fibers of LES (myotomy)
  - Extend 6 cm up esophagus and 2-3 cm onto stomach
  - Partial fundoplication (Dor or Toupet) to prevent reflux
  - Success rate 85-95%, durable long-term results
  - Complications - GERD 10-20%, dysphagia if fundoplication too tight, perforation less than 1%
  - Preferred for young healthy patients, Type III achalasia
  - Peroral endoscopic myotomy (POEM) - newer endoscopic technique
  - Endoscopic submucosal myotomy
  - Success rate 90-95%, similar to Heller myotomy
  - Less invasive, faster recovery
  - GERD rate higher (30-40%) due to no fundoplication
  - Requires specialized expertise
  - Post-treatment management
  - PPI therapy for GERD (common after all treatments)
  - Repeat manometry and barium swallow if symptoms recur
  - Surveillance for esophageal cancer (increased risk with long-standing achalasia)
  - Upper endoscopy every 3 years after 10-15 years of disease
clinical_pearls:
  - Rare disease, incidence 1-2 per 100,000, affects all ages but peak 30-60 years, equal male-female
  - Primary achalasia - idiopathic loss of myenteric plexus neurons in esophagus
  - Secondary achalasia (pseudoachalasia) - malignancy (adenocarcinoma at GE junction), Chagas disease (Trypanosoma cruzi)
  - Red flags for pseudoachalasia - age greater than 60, symptom duration less than 6 months, weight loss greater than 15 pounds
  - Dysphagia to liquids equal or worse than solids - distinguishes from mechanical obstruction (cancer, stricture)
  - Type II achalasia (pan-esophageal pressurization) best response to treatment (90-95% success)
  - Type III (spastic achalasia) worst response, often requires Heller myotomy or POEM
  - Increased risk of esophageal squamous cell carcinoma (0.3% per year, 10-30x general population) from chronic stasis
  - No medical therapy effectively treats achalasia - intervention (dilation, myotomy, POEM) required
  - Botox repeated injections cause fibrosis, avoid if patient may be future surgical candidate
differentials:
  - Esophageal cancer (progressive solid dysphagia, weight loss, older patient, mass on endoscopy)
  - Peptic stricture from GERD (dysphagia to solids first, history of chronic heartburn)
  - Eosinophilic esophagitis (intermittent dysphagia, food impaction, rings/furrows on endoscopy)
  - Diffuse esophageal spasm (intermittent chest pain, simultaneous contractions on manometry but LES relaxes normally)
  - Scleroderma esophagus (absent peristalsis but LES hypotensive, not hypertensive)
  - Pseudoachalasia from malignancy (short symptom duration, severe weight loss, older age)
  - Chagas disease (endemic areas South America, other GI dysmotility)
trace:
  - 42-year-old man presents with 3-year history of progressive difficulty swallowing
  - Initially only solids, now liquids also difficult (sometimes harder than solids)
  - Has to drink water to wash down food
  - Regurgitation of undigested food several hours after eating
  - Worse when lying down at night, sometimes awakens choking
  - Chest discomfort retrosternal after eating
  - 20-pound unintentional weight loss over 3 years
  - Tried PPIs for presumed GERD - no improvement
  - No heartburn, no odynophagia, no hematemesis
  - Past medical history - none
  - No smoking, rare alcohol
  - Physical exam - vitals normal, BMI 22 (thin)
  - No lymphadenopathy, normal cardiac and lung exam
  - Abdomen soft, non-tender, normal bowel sounds
  - Barium esophagram ordered
  - Shows dilated esophagus with smooth tapering at gastroesophageal junction (bird's beak)
  - Delayed emptying with fluid level in distal esophagus
  - Absent gastric air bubble
  - Upper endoscopy performed
  - Dilated esophagus with retained food particles and saliva
  - LES appears tight but scope passes with gentle pressure
  - Gastroesophageal junction appears normal, no mass or stricture
  - Stomach and duodenum normal
  - Biopsies of GE junction - no dysplasia, no malignancy
  - High-resolution esophageal manometry - GOLD STANDARD
  - Integrated relaxation pressure (IRP) 22 mmHg (elevated, normal less than 15)
  - Absent peristalsis in esophageal body (100% failed peristalsis)
  - Pan-esophageal pressurization on swallows
  - Diagnosis - Achalasia, Type II (pan-esophageal pressurization)
  - Type II has best prognosis for treatment
  - Discussed treatment options
  - Patient prefers less invasive approach initially
  - Pneumatic dilation recommended as first-line
  - Endoscopic pneumatic dilation scheduled
  - Procedure performed under conscious sedation with fluoroscopy
  - 30 mm balloon dilator advanced over guidewire to LES
  - Balloon inflated for 60 seconds
  - Slight waist seen on balloon then disappeared (successful dilation)
  - No evidence of perforation
  - Post-procedure - clear liquid diet Day 1, soft diet Day 2, regular diet Day 3
  - Omeprazole 20 mg daily started for GERD prevention
  - 2-week follow-up - significant improvement
  - Swallowing much easier, able to eat normal meals
  - No regurgitation, no chest pain
  - Gained 3 pounds already
  - Dysphagia score improved from 8/10 to 2/10
  - Continue PPI
  - 6-month follow-up - continued improvement
  - Eating normal diet without difficulty
  - Occasional mild dysphagia with breads (manageable)
  - Weight up 12 pounds (back to pre-illness weight)
  - Repeat barium swallow - improved esophageal emptying, still some dilation but much better
  - 2-year follow-up - symptoms remained well-controlled
  - Dysphagia score 1-2/10
  - No repeat dilation needed yet
  - Continue annual follow-up
  - Counseled on long-term esophageal cancer risk, plan surveillance endoscopy after 10-15 years of disease
  - Outcome - Excellent response to pneumatic dilation, significant symptom relief, improved quality of life
