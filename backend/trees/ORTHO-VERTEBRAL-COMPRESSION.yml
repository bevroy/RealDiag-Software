presentations:
  - Acute back pain (often thoracic or lumbar)
  - Common in elderly with osteoporosis or after minor trauma
  - Height loss, kyphosis if multiple fractures
  - Point tenderness over affected vertebra
  - X-ray or MRI shows vertebral body compression
differentials:
  - Osteoporotic fracture
  - Pathologic fracture
  - Disc herniation
  - Spinal stenosis
workup:
  - 'X-ray spine (AP + lateral): Shows fracture (wedge, biconcave, crush), height loss >20-25%'
  - 'MRI spine (if red flags or neurologic deficits): STIR sequence shows acute fracture (bone marrow edema - bright), differentiates acute vs chronic, malignancy'
  - 'DEXA scan: Assess bone density (T-score <-2.5 = osteoporosis)'
  - 'Labs if malignancy suspected: CBC, CMP, SPEP (myeloma), PSA (men), ESR/CRP'
treatment:
  - 'Guideline-based treatment options for Vertebral Compression Fracture include:'
  - 'Acute pain control: Acetaminophen 1g TID, NSAIDs, opioids short-term if severe (AAOS 2023)'
  - 'Bracing: Thoracolumbosacral orthosisfor 6-12 weeks - reduces pain, unclear if prevents further collapse (AAOS 2023)'
  - 'Early mobilization: Bedrest <3 days increases osteoporosis, deconditioning. Ambulate as tolerated (AAOS 2023)'
  - 'Osteoporosis treatment: Bisphosphonate (alendronate 70mg weekly), calcium 1200mg + vitamin D 800-1000 IU daily (AAOS 2023)'
  - 'Vertebroplasty/kyphoplasty: If pain refractory to medical management >6 weeks OR patient can''t tolerate meds (AAOS 2023)'
clinical_pearls:
  - 700,000 per year in US - osteoporotic (75%), malignant (20%), traumatic (5%)
  - 'Osteoporotic: Spontaneous or minor trauma (lifting, coughing), thoracolumbar junction (T12-L1) most common'
  - 'Red flags for malignancy: Age <50, history of cancer, weight loss, night pain, posterior element involvement, pedicle destruction'
  - 'Multiple fractures: Height loss (1-2 inches per fracture), kyphosis, restrictive lung disease'
  - Neurologic deficits RARE in osteoporotic fractures (compression only) - if present, suspect malignancy or trauma
red_flags: []
disposition_guidance: {}
referrals:
  - Neurosurgery urgently if neurologic deficits (cord compression - rare in osteoporotic fractures, suggests malignancy)
  - Interventional radiology if refractory pain >6 weeks (vertebroplasty/kyphoplasty)
  - Endocrinology/rheumatology for osteoporosis management
