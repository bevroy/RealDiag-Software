id: OBGYN-CONTRACEPTION-STI
title: Contraception and Sexually Transmitted Infections Tree
specialty: Obstetrics and Gynecology/Primary Care/Emergency Medicine
version: 1.0
icd10: I21.9
last_updated: 2025-11-20
evidence_level: ACOG Guidelines, CDC STI Treatment Guidelines
entry: initial_assessment

clinical_pearls:
  - Contraception should be offered to all sexually active women to prevent unintended pregnancy
  - Long-acting reversible contraception (LARC - IUD, implant) most effective, highest satisfaction
  - Emergency contraception effective up to 120 hours but most effective within 72 hours
  - Asymptomatic Chlamydia and gonorrhea very common, screen annually in sexually active women <25
  - Test of cure required for Chlamydia in pregnancy, gonorrhea if symptoms persist
  - Treat partners empirically to prevent reinfection ("expedited partner therapy")

red_flags:
  - Severe abdominal pain with IUD (expulsion, perforation, ectopic pregnancy)
  - Fever with IUD (PID, sepsis)
  - Pregnancy with IUD in place (ectopic risk, remove IUD if strings visible)
  - Postcoital bleeding (cervical cancer, cervicitis)
  - Painful genital ulcers (herpes, syphilis, chancroid)
  - HIV risk factors (screen and offer PrEP)

nodes:
- id: initial_assessment
  when: {}
  description: Initial contraception and sexual health assessment
  tests:
  - History
    - Contraception goals (prevent pregnancy, regulate cycles, other benefits)
    - Sexual history (partners, gender, STI history)
    - Menstrual history (regularity, heavy bleeding)
    - Medical history (contraindications to hormonal contraception)
    - Medications (interactions)
    - Obstetric history (pregnancies, deliveries, complications)
  - Physical exam (if indicated - pelvic exam for IUD placement, STI symptoms)
  - Pregnancy test (before starting contraception)
  suggest_dx: []
  next:
  - when:
      presenting_concern: contraception
    go: contraception_counseling
  - when:
      presenting_concern: emergency_contraception
    go: emergency_contraception
  - when:
      symptoms: vaginal_discharge_or_dysuria
    go: sti_screening
  - when:
      presenting_concern: genital_ulcers
    go: genital_ulcers
  - default: contraception_counseling

- id: contraception_counseling
  when:
    requesting: contraception
  description: Contraceptive method counseling and selection
  tests:
  - Pregnancy test (ensure not currently pregnant)
  - Blood pressure (if considering combined hormonal contraception)
  - Assess contraindications to hormonal contraception
    - Current pregnancy
    - Breast cancer (current or within 5 years)
    - Thromboembolism (current or history)
    - Stroke or heart disease
    - Migraine with aura (contraindication to estrogen)
    - Severe hypertension
    - Smoking age ≥35 (contraindication to estrogen)
    - Liver disease (active)
  suggest_dx: []
  next:
  - when:
      preference: long_acting_reversible
    go: larc_methods
  - when:
      preference: short_acting_hormonal
    go: short_acting_hormonal
  - when:
      preference: barrier_or_natural
    go: barrier_methods
  - when:
      preference: permanent_sterilization
    go: permanent_sterilization
  - default: larc_methods

- id: larc_methods
  when:
    preference: long_acting_reversible_contraception
  description: Long-acting reversible contraception (LARC) - IUD and implant
  tests:
  - Pregnancy test
  - Pelvic exam (IUD placement)
  - STI screening (before IUD placement recommended but not required)
  suggest_dx: []
  referrals:
  - OB/GYN or trained provider for insertion
  management:
  - Intrauterine devices (IUD) - most effective, 99% efficacy
    - Copper IUD (Paragard)
      - Non-hormonal
      - Duration 10-12 years
      - Effective immediately
      - May increase menstrual bleeding and cramping
      - Also used as emergency contraception (within 5 days of unprotected intercourse)
    - Levonorgestrel IUD (Mirena, Kyleena, Liletta, Skyla)
      - Hormonal (progestin-only, local effect)
      - Duration 3-8 years depending on type
      - Effective 7 days after insertion (use backup contraception)
      - Decreases menstrual bleeding (20% amenorrhea with Mirena)
      - Treats heavy menstrual bleeding
  - Contraceptive implant (Nexplanon)
    - Progestin-only rod inserted under skin of upper arm
    - Duration 3 years
    - Most effective contraception (>99%)
    - Effective within 24 hours if inserted during first 5 days of cycle
    - Side effects - irregular bleeding (common), weight gain
  - Advantages of LARC
    - Most effective (pregnancy rate <1%)
    - Highest continuation and satisfaction rates
    - Reversible (fertility returns immediately after removal)
    - Minimal user effort (set it and forget it)
  patient_education:
  - Most effective reversible contraception
  - IUD insertion may cause cramping (take ibuprofen 1 hour before)
  - Return if severe pain, fever, heavy bleeding, IUD strings missing
  next:
  - default: null

- id: short_acting_hormonal
  when:
    preference: pills_patch_or_ring
  description: Short-acting hormonal contraception
  tests:
  - Pregnancy test
  - Blood pressure
  - Assess contraindications (see contraception_counseling node)
  suggest_dx: []
  management:
  - Combined oral contraceptives (COCs) - estrogen + progestin
    - Efficacy 91% typical use, 99% perfect use
    - Take 1 pill daily at same time
    - Start day 1 of period (immediately effective) or quick start (backup for 7 days)
    - Benefits - regulate cycles, reduce menstrual bleeding and cramps, reduce ovarian/endometrial cancer risk, improve acne
    - Side effects - nausea, breast tenderness, breakthrough bleeding (common first 3 months), headaches
    - Risks - increased VTE risk (low absolute risk, 3-9 per 10,000 women-years vs 1-5 baseline)
    - Contraindications - smoking age ≥35, migraine with aura, thromboembolism, stroke, breast cancer
  - Progestin-only pill (POP, mini-pill)
    - Efficacy 91% typical use, 99% perfect use
    - Take daily at SAME TIME (3-hour window, strict)
    - Safe in breastfeeding, migraine with aura, VTE history
    - Side effects - irregular bleeding
  - Contraceptive patch (Xulane)
    - Efficacy 91% typical use
    - Change weekly x3 weeks, then 1 week off
    - Same benefits/risks as COCs
    - May be less effective if weight >90 kg (198 lbs)
  - Vaginal ring (NuvaRing, Annovera)
    - Efficacy 91% typical use
    - Insert ring, leave 3 weeks, remove 1 week
    - Same benefits/risks as COCs
  - Depot medroxyprogesterone acetate (Depo-Provera)
    - Progestin-only injection every 3 months
    - Efficacy 94% typical use, 99% perfect use
    - Benefits - amenorrhea (most women after 1 year), convenient (4 injections per year)
    - Side effects - weight gain (avg 5-10 lbs/year), irregular bleeding, delayed return to fertility (avg 10 months after stopping), decreased bone density (reversible)
    - Not first-line in adolescents due to bone effects
  patient_education:
  - Pills must be taken daily at same time for best efficacy
  - Backup contraception for 7 days if quick start
  - Condoms prevent STIs (hormonal contraception does not)
  - Return if severe headaches, leg swelling/pain, chest pain, vision changes (ACHES mnemonic)
  next:
  - default: null

- id: barrier_methods
  when:
    preference: barrier_or_natural_methods
  description: Barrier and natural family planning methods
  tests: []
  suggest_dx: []
  management:
  - Male condoms
    - Efficacy 85% typical use, 98% perfect use
    - Only method that prevents both pregnancy and STIs
    - Latex or non-latex (polyurethane if latex allergy)
    - Use with every act of intercourse
  - Female condoms
    - Efficacy 79% typical use, 95% perfect use
    - Protects against STIs
    - Can be inserted up to 8 hours before intercourse
  - Diaphragm with spermicide
    - Efficacy 88% typical use
    - Requires fitting by provider
    - Insert before intercourse, leave in 6 hours after
  - Spermicide alone
    - Efficacy 72% typical use
    - Less effective than other methods
    - May increase UTI risk
  - Fertility awareness-based methods
    - Efficacy 76-88% typical use
    - Track menstrual cycles, basal body temperature, cervical mucus
    - Avoid intercourse on fertile days (5 days before ovulation through 1 day after)
    - Requires commitment and regular cycles
  - Withdrawal (coitus interruptus)
    - Efficacy 78% typical use
    - Not recommended as primary method
  patient_education:
  - Condoms most effective barrier method and only method preventing STIs
  - Use condoms correctly (check expiration, use water-based lubricant, leave space at tip)
  - Consider combining methods (e.g., condoms + fertility awareness) for higher efficacy
  next:
  - default: null

- id: permanent_sterilization
  when:
    preference: permanent_contraception
  description: Permanent sterilization
  tests:
  - Pregnancy test
  - Counseling regarding permanence
  suggest_dx: []
  referrals:
  - OB/GYN or surgeon for procedure
  management:
  - Female sterilization (tubal ligation or bilateral salpingectomy)
    - Efficacy >99%
    - Surgical procedure (laparoscopy or hysteroscopy)
    - Can be performed postpartum or interval
    - Bilateral salpingectomy preferred (also reduces ovarian cancer risk)
    - Permanent, difficult to reverse
  - Male sterilization (vasectomy)
    - Efficacy >99%
    - Office-based procedure (local anesthesia)
    - Less invasive and lower cost than tubal ligation
    - Not immediately effective (use backup contraception until sperm count zero at 3 months)
    - Permanent, reversal possible but not guaranteed
  patient_education:
  - Consider permanence carefully
  - Regret rates higher in women <30 or with life changes
  - LARC methods nearly as effective and reversible
  next:
  - default: null

- id: emergency_contraception
  when:
    unprotected_intercourse: recent
  description: Emergency contraception (EC)
  tests:
  - Last menstrual period (estimate risk of pregnancy)
  - Time since unprotected intercourse
  - Current contraception use (if any)
  suggest_dx: []
  management:
  - Copper IUD (most effective EC)
    - Insert within 5 days (120 hours) of unprotected intercourse
    - ">99% effective"
    - Can keep as ongoing contraception
    - Most effective option, especially if BMI >30
  - Ulipristal acetate (ella)
    - 30mg PO single dose
    - Effective up to 5 days (120 hours), most effective within 72 hours
    - More effective than levonorgestrel, especially days 3-5
    - Prescription required
    - Delays ovulation
    - May be less effective if BMI >30
  - Levonorgestrel (Plan B One-Step, generic)
    - 1.5mg PO single dose (or 0.75mg x2 doses 12 hours apart)
    - Effective up to 3-5 days (72-120 hours), most effective within 72 hours
    - Over-the-counter, no prescription needed
    - Delays ovulation
    - Efficacy decreases significantly if BMI >25-30
  - Start regular contraception after EC (quick start method)
  patient_education:
  - Most effective if taken as soon as possible
  - Not abortion (prevents pregnancy, does not terminate existing pregnancy)
  - May cause next period to be early/late or heavier/lighter
  - Start regular contraception to prevent future need for EC
  - Not as effective as regular contraception (EC is for emergencies only)
  next:
  - default: null

- id: sti_screening
  when:
    any_of:
    - sexually_active: true
    - symptoms: present
  description: STI screening and evaluation
  tests:
  - History
    - Sexual history (number of partners, new partner, gender of partners)
    - Symptoms (discharge, dysuria, lesions, pain)
    - Prior STIs
    - Last STI screening
  - Physical exam
    - Pelvic exam (women) - cervical discharge, cervical motion tenderness, lesions
    - Genital exam (men) - urethral discharge, lesions
  - STI testing
    - Chlamydia and gonorrhea NAAT (nucleic acid amplification test)
      - Women - endocervical, vaginal, or urine
      - Men - urethral or urine (first-catch)
      - Extragenital if indicated - rectal, pharyngeal
    - HIV (offer to all)
    - Syphilis (RPR or VDRL, confirm with treponemal test)
    - Hepatitis B and C (if risk factors)
    - Trichomonas (wet mount, NAAT, or culture)
  suggest_dx: []
  next:
  - when:
      symptoms: vaginal_discharge
    go: vaginal_discharge
  - when:
      symptoms: cervicitis_or_urethritis
    go: cervicitis_urethritis
  - when:
      test_positive: chlamydia_or_gonorrhea
    go: cervicitis_urethritis
  - default: vaginal_discharge

- id: vaginal_discharge
  when:
    symptoms: vaginal_discharge
  description: Vaginal discharge evaluation
  tests:
  - Pelvic exam
    - Inspect vulva and vagina
    - Assess discharge (color, consistency, odor)
  - Wet mount microscopy
    - Saline prep (clue cells, motile trichomonads)
    - KOH prep (pseudohyphae = Candida)
  - Vaginal pH (normal 3.8-4.5, elevated in BV and trichomoniasis)
  - Whiff test (fishy odor with KOH = BV or trichomoniasis)
  - STI testing (Chlamydia, gonorrhea, Trichomonas NAAT)
  suggest_dx:
  - Bacterial vaginosis (BV)
  - Candida vulvovaginitis (yeast infection)
  - Trichomoniasis
  - Normal physiologic discharge
  referrals: []
  management:
  - Bacterial vaginosis
    - Thin, white-gray discharge with fishy odor
    - Clue cells on wet mount, pH >4.5, positive whiff test
    - Treatment
      - Metronidazole 500mg PO BID x 7 days (preferred)
      - OR Metronidazole gel 0.75% intravaginally daily x 5 days
      - OR Clindamycin cream 2% intravaginally at bedtime x 7 days
    - Treat in pregnancy (metronidazole safe in all trimesters)
    - Do NOT treat partners (not sexually transmitted)
  - Vulvovaginal candidiasis (yeast infection)
    - Thick, white, cottage cheese-like discharge, vulvar pruritus
    - Pseudohyphae on KOH prep
    - Treatment (uncomplicated)
      - Fluconazole 150mg PO single dose
      - OR Topical azoles (miconazole, clotrimazole, terconazole) intravaginally x 1-7 days
    - Recurrent (≥4 episodes/year) - longer treatment course, then maintenance suppression (fluconazole 150mg weekly x 6 months)
  - Trichomoniasis
    - Yellow-green frothy discharge, strawberry cervix
    - Motile trichomonads on wet mount (but only 50% sensitive, NAAT preferred)
    - Treatment
      - Metronidazole 2g PO single dose (preferred)
      - OR Tinidazole 2g PO single dose
      - Treat sexual partners
    - Test for other STIs (frequently coexist)
  patient_education:
  - BV not sexually transmitted but recurrences common
  - Yeast infections common, especially after antibiotics
  - Trichomoniasis is STI, treat partners
  - Return if symptoms persist or recur
  next:
  - default: null

- id: cervicitis_urethritis
  when:
    symptoms_any:
    - mucopurulent_cervical_discharge
    - cervical_friability
    - dysuria
  description: Cervicitis or urethritis (Chlamydia and gonorrhea)
  tests:
  - Cervical NAAT for Chlamydia trachomatis and Neisseria gonorrhoeae
  - Urethral or urine NAAT (men)
  - Wet mount (if vaginal discharge - rule out trichomoniasis)
  - HIV testing
  - Syphilis serology (RPR)
  suggest_dx:
  - Chlamydia trachomatis (most common bacterial STI)
  - Neisseria gonorrhoeae
  - Mycoplasma genitalium (emerging pathogen)
  - Trichomoniasis
  referrals: []
  management:
  - Empiric treatment (treat before results if high suspicion)
  - Chlamydia
    - Doxycycline 100mg PO BID x 7 days (preferred)
    - OR Azithromycin 1g PO single dose (use if adherence concern, but resistance increasing)
  - Gonorrhea
    - Ceftriaxone 500mg IM single dose (1g if weight ≥150kg)
    - If ceftriaxone unavailable - Gentamicin 240mg IM + Azithromycin 2g PO single dose
  - If gonorrhea suspected, treat for both gonorrhea AND Chlamydia (coinfection common 30-50%)
  - Test of cure
    - Chlamydia in pregnancy - repeat NAAT 3 weeks after treatment
    - Gonorrhea if symptoms persist - repeat NAAT 7-14 days after treatment
  - Partner management
    - Treat all partners from past 60 days (or most recent if >60 days)
    - Expedited partner therapy (EPT) - give prescription or medication to patient for partners
      - EPT not allowed in all states
      - Use same regimen as index patient
  - Abstinence from intercourse until 7 days after treatment completed (both patient and partners)
  patient_education:
  - Serious infections if untreated (PID, infertility, ectopic pregnancy, chronic pain)
  - Often asymptomatic (especially Chlamydia in women)
  - Must treat partners to prevent reinfection
  - Retest in 3 months (high reinfection rates)
  - Use condoms to prevent future infections
  next:
  - default: null

- id: genital_ulcers
  when:
    symptoms: genital_lesions_or_ulcers
  description: Genital ulcer evaluation
  tests:
  - Examine lesions
    - Painful vs painless
    - Single vs multiple
    - Vesicles, ulcers, or nodules
  - Syphilis serology (RPR or VDRL, confirm with FTA-ABS or TP-PA)
  - HSV PCR (swab base of ulcer)
  - HIV testing (acute HIV can present with ulcers)
  - Darkfield microscopy or PCR for Treponema pallidum (if available)
  - Lymph node exam (inguinal lymphadenopathy)
  suggest_dx:
  - Herpes simplex virus (HSV-1 or HSV-2) - most common
  - Syphilis (Treponema pallidum)
  - Chancroid (Haemophilus ducreyi) - rare in US
  - Lymphogranuloma venereum (LGV, Chlamydia serovars L1-L3)
  - Granuloma inguinale (Klebsiella granulomatis) - rare
  referrals:
  - Infectious disease if complicated or uncertain diagnosis
  management:
  - Herpes simplex virus
    - Painful vesicles and ulcers, tender inguinal lymphadenopathy
    - Primary episode (first infection)
      - Acyclovir 400mg PO TID x 7-10 days
      - OR Valacyclovir 1g PO BID x 7-10 days
      - OR Famciclovir 250mg PO TID x 7-10 days
    - Recurrent episode (shorter course)
      - Valacyclovir 500mg PO BID x 3 days
      - OR Famciclovir 1g PO BID x 1 day
    - Suppressive therapy (if frequent recurrences ≥6/year)
      - Valacyclovir 500mg PO daily
  - Syphilis
    - Painless ulcer (chancre), firm indurated base, inguinal lymphadenopathy
    - Primary syphilis
      - Benzathine penicillin G 2.4 million units IM single dose
    - Secondary syphilis (rash, condyloma lata, lymphadenopathy)
      - Benzathine penicillin G 2.4 million units IM single dose
    - Latent or tertiary syphilis
      - Benzathine penicillin G 2.4 million units IM weekly x 3 doses
    - Penicillin allergy - Doxycycline 100mg PO BID x 14 days (primary/secondary) or 28 days (latent/tertiary)
  - Chancroid (rare)
    - Painful ulcers, friable, undermined edges, purulent base
    - Azithromycin 1g PO single dose
    - OR Ceftriaxone 250mg IM single dose
  - Lymphogranuloma venereum
    - Small painless ulcer followed by painful inguinal lymphadenopathy with buboes
    - Doxycycline 100mg PO BID x 21 days
  patient_education:
  - Herpes incurable but manageable (antivirals reduce outbreaks)
  - Syphilis curable with penicillin (early treatment prevents complications)
  - Treat partners
  - Abstain from sexual activity until lesions healed
  - Use condoms to reduce transmission
  next:
  - default: null

differential_diagnosis:
  contraception_methods:
    - LARC (IUD - copper or levonorgestrel, implant)
    - Short-acting hormonal (COCs, progestin-only pills, patch, ring, Depo-Provera)
    - Barrier methods (condoms, diaphragm, spermicide)
    - Fertility awareness-based methods
    - Emergency contraception (copper IUD, ulipristal, levonorgestrel)
    - Permanent sterilization (tubal ligation, vasectomy)
  vaginal_discharge:
    - Bacterial vaginosis (most common)
    - Vulvovaginal candidiasis (yeast infection)
    - Trichomoniasis
    - Cervicitis (Chlamydia, gonorrhea)
    - Normal physiologic discharge
  genital_ulcers:
    - Herpes simplex virus (HSV - most common)
    - Syphilis (Treponema pallidum)
    - Chancroid (Haemophilus ducreyi)
    - Lymphogranuloma venereum (LGV)
    - Granuloma inguinale
    - Trauma, fixed drug eruption
  sti:
    - Chlamydia trachomatis
    - Neisseria gonorrhoeae
    - Trichomonas vaginalis
    - Herpes simplex virus (HSV-1, HSV-2)
    - Syphilis (Treponema pallidum)
    - HIV
    - Hepatitis B and C
    - HPV (human papillomavirus)

disposition_guidance:
  admit:
    - PID with severe symptoms (see OBGYN-PELVIC-PAIN tree)
    - Disseminated gonococcal infection (arthritis, rash)
    - Severe herpes with urinary retention or meningitis
  discharge:
    - Most contraception counseling and STI treatment outpatient
    - Ensure reliable for follow-up
    - Partner treatment arranged
  follow_up:
    - IUD - check strings after first period, then annually
    - Chlamydia/gonorrhea - retest in 3 months (high reinfection rates)
    - Chlamydia in pregnancy - test of cure in 3 weeks
    - Syphilis - repeat RPR at 6 and 12 months (ensure 4-fold decline)
    - Herpes - follow-up if severe or frequent recurrences
  screening_recommendations:
    - Chlamydia/gonorrhea - annually in sexually active women <25, or risk factors (new/multiple partners)
    - HIV - at least once (ages 13-64), annually if high risk
    - Syphilis - annually if high risk (MSM, HIV+, sex work)
    - Pap smear - start age 21, every 3 years (or every 5 years with HPV co-testing age 30-65)
    - HPV vaccine - ages 9-26 (catch-up to age 45 if high risk)

references:
  - ACOG Practice Bulletin No. 186 - Long-Acting Reversible Contraception. Obstet Gynecol. 2017 (Reaffirmed 2021).
  - ACOG Committee Opinion No. 735 - Adolescents and Long-Acting Reversible Contraception. Obstet Gynecol. 2018.
  - CDC Sexually Transmitted Infections Treatment Guidelines, 2021.
  - ACOG Practice Bulletin No. 152 - Emergency Contraception. Obstet Gynecol. 2015 (Reaffirmed 2021).
  - CDC U.S. Medical Eligibility Criteria for Contraceptive Use, 2016 (Updated 2020).
