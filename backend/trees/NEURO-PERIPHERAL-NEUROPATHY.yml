tree_id: NEURO-PERIPHERAL-NEUROPATHY
name: Peripheral Neuropathy Evaluation
family: NEUROLOGY
specialty: Neurology, Internal Medicine
chief_complaint: Numbness, Tingling, Weakness, Pain in Extremities
description: Comprehensive evaluation of peripheral neuropathy patterns and causes
version: "1.0"
icd10: G62.9
author: RealDiag Clinical Team

entry_point: peripheral_neuropathy_presentation

nodes:
  - id: peripheral_neuropathy_presentation
    type: question
    text: "Pattern of neuropathy?"
    options:
      - label: "Mononeuropathy (single nerve)"
        next: mononeuropathy
      - label: "Polyneuropathy (symmetric distal)"
        next: polyneuropathy
      - label: "Guillain-Barré syndrome (acute ascending paralysis)"
        next: guillain_barre_syndrome

  - id: mononeuropathy
    type: diagnosis
    name: "Mononeuropathy"
    icd10: "G58.9"
    urgency: medium
    workup:
      - Definition - Dysfunction of single peripheral nerve
      - Common mononeuropathies
      - Carpal tunnel syndrome (CTS) - Most common, median nerve compression at wrist
      - Symptoms - Numbness/tingling thumb, index, middle fingers (median distribution), worse at night, shaking hands relieves symptoms
      - Thenar atrophy if severe chronic
      - Phalen test (wrist flexion 60 sec) and Tinel sign (tap over carpal tunnel) positive
      - Ulnar neuropathy - Compression at elbow (cubital tunnel) or wrist (Guyon canal)
      - Numbness/tingling 4th-5th fingers, intrinsic hand muscle weakness (interossei, lumbricals), claw hand deformity if severe
      - Froment sign - Thumb IP flexion to compensate for weak adductor pollicis
      - Radial neuropathy - "Saturday night palsy" (arm draped over chair), wrist drop
      - Weakness wrist/finger extension, sensory loss posterior forearm/dorsal hand
      - Peroneal neuropathy - Compression at fibular head (crossing legs), foot drop
      - Weakness ankle dorsiflexion/eversion, high steppage gait, sensory loss dorsal foot
      - Femoral neuropathy - Diabetes, retroperitoneal hematoma, hip surgery
      - Weakness knee extension (quadriceps), loss of patellar reflex, anterior thigh numbness
      - Causes - Compression (most common), trauma, ischemia, infiltration
      - EMG/NCS - Confirm nerve involved, assess severity (demyelinating vs axonal), prognosis
      - Prolonged distal latency, reduced conduction velocity, conduction block = demyelination
      - Reduced amplitude = axonal loss (worse prognosis)
    treatment:
      - Conservative management - Most mononeuropathies
      - Avoid provocative activities, wrist splinting (CTS), elbow padding (ulnar neuropathy)
      - NSAIDs, gabapentin for pain
      - Corticosteroid injection (carpal tunnel)
      - Physical therapy, strengthening
      - Surgical decompression - If severe symptoms, motor weakness, thenar atrophy, failed conservative therapy
      - Carpal tunnel release, cubital tunnel decompression, peroneal nerve decompression
      - Prognosis - Most improve with treatment, may take months for recovery if axonal injury

  - id: polyneuropathy
    type: diagnosis
    name: "Polyneuropathy"
    icd10: "G62.9"
    urgency: medium
    workup:
      - Definition - Symmetric distal sensory and/or motor neuropathy ("stocking-glove" distribution)
      - Clinical - Numbness, tingling, burning pain starting in toes, progresses proximally, eventually affects fingers
      - Loss of ankle reflexes first, then knee
      - Distal weakness (foot drop, difficulty walking on heels/toes) if motor involvement
      - Common causes - "DANG THERAPIST"
      - Diabetes mellitus - Most common cause (50% of all polyneuropathies)
      - Distal symmetric sensory > motor, painful (burning, shooting)
      - Also causes mononeuropathy multiplex (e.g., femoral, peroneal), autonomic neuropathy
      - Alcohol - Nutritional deficiency (thiamine B1, other B vitamins), direct toxic effect
      - Nutritional deficiencies - B12 (also posterior column signs - ataxia, Romberg+), B6 toxicity (high-dose supplements), B1, folate, vitamin E
      - B12 deficiency - Check methylmalonic acid and homocysteine if borderline B12 level
      - Guillain-Barré syndrome (GBS) - Acute, see separate node
      - Toxins - Heavy metals (lead, arsenic, mercury), organic solvents, acrylamide
      - Hypothyroidism - Mild distal sensory neuropathy, carpal tunnel syndrome
      - Elevated CK, delayed relaxation phase of reflexes
      - Renal failure (uremic neuropathy)
      - Amyloidosis - Painful sensory neuropathy, autonomic dysfunction, carpal tunnel
      - Paraproteinemia - MGUS, multiple myeloma, Waldenström
      - IgM anti-MAG antibodies (demyelinating)
      - Infections - HIV, hepatitis C (cryoglobulinemia), Lyme disease
      - Sarcoidosis - Small fiber neuropathy
      - Toxic medications - Chemotherapy (vincristine, cisplatin, taxanes), isoniazid, metronidazole, amiodarone, statins
      - Hereditary - Charcot-Marie-Tooth (CMT) disease, most common inherited neuropathy
      - Distal weakness/atrophy, pes cavus, high arches, hammer toes, family history
      - Workup for polyneuropathy - Stepwise approach
      - Labs - Fasting glucose, HbA1c (diabetes), B12, methylmalonic acid, TSH, CMP (renal function), SPEP/UPEP/immunofixation (paraprotein), ESR/CRP
      - If above negative - ANA, RF, anti-Ro/La (Sjögren), ANCA (vasculitis), HIV, hepatitis C, Lyme, heavy metal screen
      - EMG/NCS - Axonal vs demyelinating, sensory vs motor, severity
      - Nerve biopsy - Rarely needed, consider if vasculitis or amyloidosis suspected
    treatment:
      - Treat underlying cause
      - Diabetes - Tight glycemic control (prevent progression, HbA1c <7%), may not reverse existing neuropathy
      - B12 deficiency - B12 1000 mcg IM monthly or high-dose oral 1000 mcg daily
      - Alcohol - Abstinence, thiamine supplementation
      - Medications - Stop offending drug if possible
      - Uremia - Dialysis or transplant
      - Symptomatic pain management - Neuropathic pain medications
      - First-line - Gabapentin 300-3600 mg/day divided TID OR pregabalin 150-600 mg/day divided BID (more predictable dosing)
      - Second-line - Duloxetine 60-120 mg daily (SNRI, also treats depression) OR tricyclic antidepressants (amitriptyline 10-100 mg qHS, nortriptyline better tolerated)
      - Topical - Lidocaine patches, capsaicin cream for localized pain
      - Opioids - Last resort (risk dependence), tramadol sometimes used
      - Foot care - Inspect feet daily (diabetics), proper footwear, prevent ulcers
      - Physical therapy - Gait training, assistive devices (AFO for foot drop)

  - id: guillain_barre_syndrome
    type: diagnosis
    name: "Guillain-Barré Syndrome (GBS)"
    icd10: "G61.0"
    urgency: critical
    workup:
      - Definition - Acute inflammatory demyelinating polyradiculoneuropathy (AIDP), most common form of acute flaccid paralysis
      - Autoimmune attack on peripheral nerve myelin (molecular mimicry after infection)
      - Epidemiology - 1-2 per 100,000, any age, slight male predominance
      - Preceding illness (2-4 weeks before) - 60-70% have antecedent infection
      - Campylobacter jejuni (most common, 30-40%, worse prognosis)
      - Upper respiratory infection (viral)
      - GI illness (diarrhea)
      - Zika virus, CMV, EBV, Mycoplasma
      - Recent vaccination (rare, temporal association but causality uncertain)
      - Clinical - Progressive ascending symmetric weakness
      - Motor weakness - Starts in legs, ascends to arms, trunk, face (days to weeks, peaks by 4 weeks)
      - Areflexia or hyporeflexia (hallmark, loss of DTRs)
      - Sensory symptoms - Paresthesias, pain (back pain, radicular pain common), but sensory exam relatively preserved
      - Cranial nerve involvement - Facial weakness (bilateral, 50%), dysphagia, ophthalmoplegia
      - Autonomic dysfunction - Arrhythmias, blood pressure lability, urinary retention, ileus
      - Respiratory failure - 20-30% require mechanical ventilation (monitor FVC, NIF, MIP)
      - Variants
      - AIDP (acute inflammatory demyelinating polyradiculoneuropathy) - Classic, most common (90%)
      - AMAN (acute motor axonal neuropathy) - Pure motor, axonal, more common in China, Campylobacter association, worse prognosis
      - AMSAN (acute motor and sensory axonal neuropathy) - Motor and sensory axonal, worst prognosis
      - Miller Fisher syndrome - Triad: ophthalmoplegia, ataxia, areflexia (anti-GQ1b antibodies)
      - Diagnostic criteria (Brighton criteria)
      - Required - Progressive weakness both legs AND arms, areflexia
      - Supportive - Progression <4 weeks, relative symmetry, sensory symptoms/signs, cranial nerve involvement, autonomic dysfunction, absence of fever at onset
      - CSF - Albuminocytologic dissociation (elevated protein >45 mg/dL, normal WBC <10), may be normal first week
      - Takes 1-2 weeks for protein to rise
      - EMG/NCS - Demyelinating features (prolonged F-waves, conduction slowing, conduction block), may be normal early
      - Differential diagnosis - Spinal cord compression (MRI spine to exclude), myasthenia gravis (ocular symptoms, fatigability, improved with edrophonium), tick paralysis, botulism, polio, porphyria
    treatment:
      - ICU admission - Close monitoring (respiratory, autonomic)
      - Respiratory monitoring - FVC (forced vital capacity) q4-6h, NIF (negative inspiratory force), ABG
      - Intubate if FVC <15-20 mL/kg, NIF worse than -30 cm H2O, hypoxia, inability to clear secretions, bulbar weakness with aspiration
      - Tracheostomy if prolonged ventilation expected (>2 weeks)
      - Autonomic monitoring - Continuous cardiac monitoring (arrhythmias - bradycardia, tachycardia, heart block), blood pressure (lability, orthostatic hypotension), avoid beta-blockers and CCBs (can exacerbate autonomic instability)
      - DVT prophylaxis - LMWH or heparin (immobility, high risk)
      - Immunotherapy - Start within 2-4 weeks of symptom onset (most effective early)
      - IVIg 0.4 g/kg/day x 5 days (2 g/kg total) - First-line, equivalent to plasmapheresis
      - Easier to administer, fewer complications
      - OR Plasmapheresis (plasma exchange) - 5 sessions over 7-14 days (1-1.5 plasma volumes per session)
      - Equivalent efficacy to IVIg
      - More complications (central line, hypotension, infections)
      - Preferred if IVIg contraindication (IgA deficiency)
      - IVIg and plasmapheresis together - NO additional benefit (do NOT combine)
      - Corticosteroids - NOT effective in GBS (no benefit)
      - Pain management - Gabapentin, opioids if needed (pain common and severe)
      - Physical therapy - Start early, prevent contractures, rehabilitation
      - Prognosis
      - Most recover (80-85% independent ambulation within 6 months)
      - 3-5% mortality (respiratory failure, autonomic dysfunction, PE)
      - 10-20% have significant residual deficits (weakness, ataxia)
      - Poor prognostic factors - Advanced age, rapid progression, ventilator dependence, axonal variant (AMAN/AMSAN), Campylobacter infection, low distal CMAP amplitudes on EMG
      - Recovery - Slow, may take 6-12 months to plateau
      - CIDP (chronic inflammatory demyelinating polyneuropathy) - Chronic form of GBS
      - Progressive or relapsing weakness >8 weeks
      - Treatment - Corticosteroids (prednisone 1 mg/kg/day), IVIg maintenance, plasmapheresis, immunosuppressants (azathioprine, mycophenolate)
