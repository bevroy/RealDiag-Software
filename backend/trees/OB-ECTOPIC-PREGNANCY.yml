tree_id: OB-ECTOPIC-PREGNANCY
name: Ectopic Pregnancy
family: Obstetrics
specialty: Obstetrics and Gynecology
chief_complaint: Abdominal pain and vaginal bleeding in early pregnancy
description: |
  Pregnancy implanted outside uterine cavity, 95% in fallopian tube. Leading cause of maternal mortality in first trimester.
  Risk factors include prior ectopic, tubal surgery, pelvic inflammatory disease, intrauterine device, assisted reproduction. Requires high index of suspicion.
icd10: O00.9
urgency: High
workup:
  - Pregnancy test (urine or serum beta-hCG) in all women of reproductive age with abdominal pain or vaginal bleeding
  - Transvaginal ultrasound (TVUS) - intrauterine pregnancy (IUP) with gestational sac and yolk sac rules out ectopic (except rare heterotopic)
  - IUP visible when beta-hCG greater than 1500-2000 mIU/mL (discriminatory zone)
  - Ectopic findings on TVUS - adnexal mass (tubal ring), fluid in cul-de-sac (blood), empty uterus
  - Serial beta-hCG if diagnosis uncertain - normal IUP doubles every 48-72 hours, abnormal rise (less than 35% increase) or plateau suggests ectopic or failing IUP
  - Serum progesterone - level less than 5 ng/mL suggests nonviable pregnancy (ectopic or miscarriage)
  - Uterine curettage if no IUP on ultrasound and declining hCG - presence of chorionic villi confirms intrauterine miscarriage, absence suggests ectopic
  - Physical exam - abdominal tenderness, cervical motion tenderness, adnexal mass or tenderness
  - Ruptured ectopic presents with acute abdomen, hemodynamic instability, shoulder pain (diaphragmatic irritation from hemoperitoneum)
treatment:
  - Stable patient, unruptured ectopic - medical or surgical management
  - Medical management - methotrexate 50 mg/m2 IM single dose (first-line if beta-hCG less than 5000 mIU/mL, no fetal cardiac activity, mass less than 3.5 cm, patient reliable for follow-up)
  - Check beta-hCG on days 4 and 7 - should decline 15% or more between days 4 and 7, if not give second dose methotrexate
  - Monitor weekly beta-hCG until undetectable, may take 2-6 weeks
  - Avoid intercourse, folate supplements, NSAIDs during treatment
  - Surgical management - laparoscopic salpingostomy (preserve tube) or salpingectomy (remove tube)
  - Salpingostomy if contralateral tube absent or damaged, salpingectomy if tube severely damaged or recurrent ectopic in same tube
  - Ruptured ectopic or hemodynamically unstable - emergency laparoscopy or laparotomy, salpingectomy, IV fluid resuscitation, blood transfusion if needed
  - Rh immune globulin (RhoGAM) 50 mcg if patient Rh negative
  - Expectant management if declining beta-hCG, asymptomatic, small ectopic - spontaneous resolution in 50-70%
clinical_pearls:
  - Classic triad abdominal pain, vaginal bleeding, missed period (only 50% have all three)
  - Any woman with positive pregnancy test and abdominal pain needs to rule out ectopic until IUP confirmed on ultrasound
  - Heterotopic pregnancy (combined intrauterine and ectopic) rare 1 in 30,000 spontaneous pregnancies but 1 in 100 with assisted reproduction
  - Persistently elevated beta-hCG after treatment suggests persistent trophoblastic tissue - may need repeat methotrexate or surgery
  - Future fertility after ectopic - 60% achieve IUP, 10% recurrent ectopic, 30% infertility
  - Tubal rupture risk increases with delay in diagnosis
differentials:
  - Miscarriage (spontaneous abortion)
  - Corpus luteum cyst
  - Ovarian torsion
  - Appendicitis
  - Pelvic inflammatory disease
  - Ovarian cyst rupture
trace:
  - 28-year-old woman with 6 weeks amenorrhea, left lower abdominal pain, light vaginal bleeding → Positive pregnancy test, hemodynamically stable → Beta-hCG 2800 mIU/mL → Transvaginal ultrasound shows empty uterus, 2 cm left adnexal mass with ring sign, small amount free fluid → Diagnose ectopic pregnancy → Counsel on medical vs surgical management → Patient chooses medical management → Methotrexate 50 mg/m2 IM (85 mg for BSA 1.7 m2) → Beta-hCG day 4 is 2650, day 7 is 2100 (21% decline, adequate response) → Weekly beta-hCG monitoring - week 2 is 890, week 3 is 240, week 4 is 45, week 5 undetectable → Resolution without surgery, counsel on future pregnancy and contraception
