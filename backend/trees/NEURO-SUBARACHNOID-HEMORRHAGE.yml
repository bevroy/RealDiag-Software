tree_id: NEURO-SUBARACHNOID-HEMORRHAGE
name: Subarachnoid Hemorrhage (SAH)
family: NEUROLOGY
specialty: Neurology, Neurosurgery, Emergency Medicine, Critical Care
chief_complaint: Sudden Severe Headache, Worst Headache of Life
description: Rapid diagnosis and management of subarachnoid hemorrhage from ruptured aneurysm
version: "1.0"
icd10: I60.9
author: RealDiag Clinical Team

entry_point: sah_screening

nodes:
  - id: sah_screening
    type: question
    text: "Patient with thunderclap headache or concerning symptoms?"
    options:
      - label: "Sudden severe headache + altered mental status or coma"
        next: severe_sah
      - label: "Sudden severe headache with neurologic deficits"
        next: sah_workup
      - label: "Sudden severe headache, neurologically intact"
        next: thunderclap_headache

  - id: severe_sah
    type: diagnosis
    name: "Severe Subarachnoid Hemorrhage"
    icd10: "I60.9"
    urgency: critical
    workup:
      - STAT non-contrast CT head (98-100% sensitive in first 6 hours)
      - If CT negative but high suspicion → Lumbar puncture
        - Opening pressure
        - Cell count (RBCs), xanthochromia (yellowing from RBC breakdown)
        - Centrifuge CSF - xanthochromia indicates SAH (not traumatic tap)
      - Once SAH confirmed:
        - CTA head and neck (CT angiography) - identify aneurysm
        - Alternative: Formal cerebral angiography (gold standard)
        - MRA if patient unstable for CT
      - Labs: CBC, CMP, coagulation studies, troponin (neurogenic stress cardiomyopathy), ECG
      - Hunt-Hess Grade (1-5) and Fisher Grade (1-4) for prognosis
    treatment:
      - IMMEDIATE NEUROSURGERY CONSULTATION
      - ICU Admission
      - "Airway Protection - intubate if GCS under 8"
      - "Blood Pressure Management (CRITICAL) - BEFORE aneurysm secured SBP 140-160 mmHg to prevent rebleeding, Use nicardipine or labetalol drip, Avoid excessive BP lowering (risk of ischemia)"
      - "Seizure Prophylaxis - Levetiracetam 1000 mg IV load then 500-1000 mg IV q12h, Continue for 3-7 days, NO phenytoin (may worsen outcomes)"
      - Aneurysm Repair (within 24 hours to prevent rebleeding)
        - Endovascular coiling (preferred for most)
        - Surgical clipping (if anatomy not suitable for coiling)
        - Decision made by neurosurgery/interventional neuroradiology
      - Nimodipine 60 mg PO/NG q4h for 21 days (MANDATORY)
        - Reduces vasospasm and improves outcomes
        - Start immediately upon SAH diagnosis
        - Continue for full 21 days regardless of clinical course
      - Prevent/Treat Complications:
        - Rebleeding (highest risk in first 24 hours - 4% per day untreated)
        - Vasospasm (days 4-14, peaks day 7-10)
          - Triple-H therapy if symptomatic (Hypertension, Hypervolemia, Hemodilution) - controversial
          - Maintain euvolemia with isotonic fluids
          - Induce hypertension if vasospasm occurs (after aneurysm secured)
          - Daily transcranial Dopplers to monitor for vasospasm
        - Hydrocephalus (may need external ventricular drain)
        - Seizures
        - Hyponatremia (SIADH or cerebral salt wasting)
      - Neuromonitoring
        - Frequent neurologic exams
        - "ICP monitoring if GCS under 8 or hydrocephalus"
        - Daily TCDs for vasospasm detection
      - DVT Prophylaxis
        - Sequential compression devices initially
        - Heparin SC after aneurysm secured (24-48 hours post-op)
    prognosis: "Mortality 30-40%; 30% die before reaching hospital; neurologic deficits in 50% of survivors"

  - id: sah_workup
    type: diagnosis
    name: "Subarachnoid Hemorrhage Confirmed"
    icd10: "I60.9"
    urgency: critical
    workup:
      - Same as severe SAH
    treatment:
      - Same as severe SAH
      - Classify Hunt-Hess grade:
        - Grade 1: Asymptomatic or mild headache
        - Grade 2: Moderate-severe headache, nuchal rigidity, no neuro deficit except CN palsy
        - Grade 3: Drowsiness, confusion, mild focal deficit
        - Grade 4: Stupor, moderate-severe hemiparesis
        - Grade 5: Coma, decerebrate posturing
    prognosis: "Hunt-Hess 1-2: good prognosis; 3-5: poor prognosis"

  - id: thunderclap_headache
    type: diagnosis
    name: "Thunderclap Headache - Rule Out SAH"
    icd10: "R51.9"
    urgency: emergency
    workup:
      - Non-contrast CT head
      - If CT negative → LUMBAR PUNCTURE (do not skip!)
        - SAH can be missed on CT, especially after 12-24 hours
        - LP should be done 6-12 hours after headache onset (allows xanthochromia to develop)
        - Xanthochromia present = SAH until proven otherwise
      - If both CT and LP negative → consider:
        - CTA or MRA to rule out unruptured aneurysm
        - Alternative diagnoses (RCVS, migraine, etc)
    treatment:
      - If SAH confirmed → full SAH protocol
      - If SAH ruled out:
        - Consider reversible cerebral vasoconstriction syndrome (RCVS)
        - MRA to evaluate for aneurysm
        - Headache management
        - Neurology follow-up
    prognosis: "Depends on final diagnosis"

clinical_pearls:
  - "85% of SAH due to ruptured aneurysms"
  - "Classic presentation: 'worst headache of my life', thunderclap onset"
  - "Sentinel headache (warning leak) occurs in 30-50% days-weeks before major bleed"
  - "Non-contrast CT sensitivity: 98-100% at 6 hours, 93% at 24 hours, 50% at 1 week"
  - "LP required if CT negative and high suspicion - SAH can be missed on CT"
  - "Xanthochromia takes 6-12 hours to develop (bilirubin from RBC breakdown)"
  - "Peak vasospasm risk: days 7-10 after bleed"
  - "Nimodipine improves outcomes - give to ALL SAH patients for 21 days"
  - "Grade 5 SAH has >70% mortality"
  - "SIADH vs cerebral salt wasting: both cause hyponatremia, differentiate by volume status"

red_flags:
  - "Sudden onset severe headache (seconds to minutes)"
  - "Loss of consciousness"
  - "Nuchal rigidity"
  - "Focal neurologic deficits"
  - "Altered mental status"
  - "Seizure"
  - "Vomiting"
  - "Photophobia"
  - "GCS decline (rebleeding)"
  - "New focal deficits days 4-14 (vasospasm)"
