tree_id: URO-RENAL-COLIC
name: Renal Colic
family: urology
specialty: Urology/Emergency Medicine
icd10: N23
snomed: 89837001
urgency: []
homeopathy: []
presentations:
  - Sudden onset severe colicky flank pain (waves of intense cramping pain)
  - Pain radiates from flank to groin and genitals following course of ureter
  - Restlessness and inability to find comfortable position (patient writhes in pain)
  - Nausea and vomiting in 50% of cases
  - Hematuria (gross or microscopic) in 85-90%
  - Urinary urgency and frequency if stone near bladder
  - Symptoms come in waves corresponding to ureteral peristalsis
  - Patient appears in acute distress
  - Most commonly caused by obstructing kidney stone (ureterolithiasis)
workup:
  - Clinical diagnosis based on characteristic presentation
  - Sudden severe colicky flank-to-groin pain
  - Patient writhing in pain, cannot stay still (vs peritonitis where patient lies still)
  - Urinalysis (at bedside if possible)
  - Hematuria (microscopic or gross) in 85-90%
  - Absence of hematuria does NOT rule out stone
  - Check for pyuria (suggests infection - urgent)
  - Check pH: acidic suggests uric acid stone, alkaline suggests struvite
  - Vital signs
  - Fever suggests concurrent infection (pyelonephritis) - urgent
  - Blood pressure may be elevated from pain
  - Physical examination
  - Costovertebral angle tenderness
  - Abdomen usually soft (not peritoneal)
  - Genitourinary exam to rule out other causes
  - Imaging to confirm diagnosis and guide management
  - Non-contrast CT abdomen/pelvis (GOLD STANDARD)
  - Sensitivity/specificity greater than 95%
  - Confirms stone, measures size and location
  - Assesses hydronephrosis and obstruction degree
  - Rules out alternative diagnoses (AAA, appendicitis)
  - Renal ultrasound if CT contraindicated (pregnancy, renal insufficiency)
  - Detects hydronephrosis (indirect sign of obstruction)
  - Less sensitive for small stones
  - Laboratory tests
  - Complete blood count (if fever present - check for leukocytosis)
  - Basic metabolic panel (creatinine, electrolytes)
  - Check for AKI if bilateral obstruction or solitary kidney
  - Pregnancy test in women of childbearing age (ectopic pregnancy can mimic)
  - Risk stratification for urgent vs expectant management
  - Stone size: less than 5 mm (90% pass), 5-10 mm (50% pass), greater than 10 mm (rarely pass)
  - Location: distal stones more likely to pass
  - Degree of hydronephrosis
  - Presence of infection (urgent intervention required)
treatment:
  - Acute pain management (PRIORITY)
  - NSAIDs FIRST-LINE (superior to opioids for renal colic)
  - Ketorolac 30 mg IV or 60 mg IM (single dose or every 6 hours if needed)
  - Ibuprofen 800 mg PO every 6-8 hours
  - Mechanism: reduce prostaglandin-mediated ureteral inflammation and spasm
  - Contraindications: renal insufficiency, GI bleeding, anticoagulation
  - Opioids if NSAIDs insufficient or contraindicated
  - Morphine 4-8 mg IV every 2-4 hours
  - Hydromorphone 0.5-2 mg IV every 2-4 hours
  - Antiemetics if nausea/vomiting
  - Ondansetron 4-8 mg IV/PO
  - Metoclopramide 10 mg IV (also has analgesic properties)
  - Medical expulsive therapy (MET) for stones 5-10 mm
  - Tamsulosin 0.4 mg PO daily (alpha-blocker relaxes ureteral smooth muscle)
  - Increases stone passage rate by 25-30%
  - Continue for up to 4-6 weeks
  - Hydration: encourage oral fluids 2-3 L/day
  - AVOID aggressive IV hydration (increases ureteral pressure and pain)
  - Expectant management for stones less than 10 mm without complications
  - Trial of spontaneous passage with pain control and MET
  - Follow-up in 1-2 weeks
  - Strain urine to capture stone
  - Repeat imaging if stone not passed by 4-6 weeks
  - Urgent intervention indications (urology consultation)
  - Infected obstructing stone (pyonephrosis - sepsis risk, EMERGENCY)
  - Bilateral obstructing stones or obstruction in solitary kidney (AKI risk)
  - Intractable pain or vomiting despite maximal medical therapy
  - Stone greater than 10 mm (unlikely to pass spontaneously)
  - Persistent high-grade obstruction with worsening hydronephrosis
  - Intervention options (by urology)
  - Ureteroscopy with laser lithotripsy (endoscopic stone fragmentation)
  - Extracorporeal shock wave lithotripsy (ESWL) for stones less than 20 mm
  - Percutaneous nephrostomy or ureteral stent for temporary drainage
  - Discharge criteria
  - Pain controlled with oral medications
  - Able to tolerate oral fluids
  - No signs of infection (fever, pyuria)
  - No high-risk features (bilateral obstruction, solitary kidney, AKI)
  - Close follow-up arranged
clinical_pearls:
  - "Renal colic is one of the most severe pains experienced - patients in acute distress, writhing in pain"
  - "NSAIDs (ketorolac) superior to opioids for renal colic pain - reduce inflammation and ureteral spasm"
  - "Patients with renal colic cannot lie still (vs peritonitis where movement worsens pain)"
  - "Hematuria absent in 10-15% of confirmed kidney stones - do not rule out based on negative UA"
  - "Infected obstructing stone (pyonephrosis) is urologic emergency - requires emergent decompression (stent or nephrostomy) and antibiotics"
  - "Stone location matters: distal stones pass more readily than proximal"
  - "Tamsulosin increases spontaneous stone passage by 25-30% and reduces time to passage"
  - "Avoid aggressive IV hydration - increases intrarenal pressure and worsens pain"
referrals:
  - Urology EMERGENT if infected obstructing stone, bilateral obstruction, or solitary kidney with obstruction
  - Urology urgent if intractable pain/vomiting or stone greater than 10 mm
  - Urology non-urgent if stone not passed after 4-6 weeks of expectant management
differentials:
  - Renal colic from ureterolithiasis (CT shows stone, hematuria common, colicky pain)
  - Pyelonephritis (fever, CVA tenderness, pyuria, no stone)
  - Abdominal aortic aneurysm (older patients, pulsatile mass, vascular risk factors - EMERGENCY)
  - Ectopic pregnancy (women, positive pregnancy test, pelvic pain)
  - Appendicitis (RLQ pain, fever, rebound tenderness)
  - Ovarian torsion (women, sudden severe pelvic pain, adnexal mass on imaging)
  - Diverticulitis (LLQ pain, fever, change in bowel habits)
  - Musculoskeletal pain (reproducible on palpation, no hematuria)
