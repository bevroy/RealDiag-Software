tree_id: GI-ACUTE-PANCREATITIS
name: Acute Pancreatitis
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Severe epigastric pain radiating to back
description: |
  Acute inflammation of pancreas. Most common causes - gallstones (40%), alcohol (30%), hypertriglyceridemia (10%).
  Mild (80%) vs severe (20% with organ failure or necrosis). Mortality 5-10% overall, 30% in severe cases.
icd10: K85.9
urgency: High
workup:
  - Diagnosis requires 2 of 3 criteria - characteristic pain, lipase or amylase >3x upper limit normal, imaging findings
  - Lipase preferred over amylase (more specific, elevated longer)
  - Complete metabolic panel (hypocalcemia poor prognostic sign, assess renal function)
  - Liver enzymes (ALT >150 suggests gallstone etiology, AST >100 suggests alcohol)
  - Triglycerides (>1000 mg/dL can cause pancreatitis)
  - CT abdomen with IV contrast (only if diagnosis uncertain or assess complications after 48-72 hours)
  - Abdominal ultrasound to assess for gallstones and bile duct dilation
  - Ranson criteria or BISAP score to assess severity (predict mortality and ICU need)
treatment:
  - Aggressive IV fluid resuscitation with lactated Ringer's 250-500 mL/hr initially (reduces mortality and organ failure)
  - Goal urine output >0.5 mL/kg/hr, avoid fluid overload
  - NPO initially, advance diet when pain improving (low-fat diet, can start oral feeding within 24 hours if tolerating)
  - Pain control with IV opioids (morphine, hydromorphone) titrated to effect
  - Antiemetics including ondansetron for nausea
  - No antibiotics unless infected necrosis confirmed (prophylactic antibiotics not beneficial)
  - ERCP within 24 hours if concurrent cholangitis (fever, jaundice, elevated bilirubin)
  - Cholecystectomy during same hospitalization if gallstone pancreatitis (prevent recurrence)
  - Severe pancreatitis requires ICU monitoring, may need nutritional support (enteral preferred over parenteral)
  - Necrosis managed conservatively unless infected (percutaneous or surgical drainage)
clinical_pearls:
  - Classic presentation includes sudden severe epigastric pain radiating to back, nausea, vomiting
  - Cullen sign (periumbilical ecchymosis) and Grey Turner sign (flank ecchymosis) suggest hemorrhagic pancreatitis (rare, poor prognosis)
  - GET SMASHED causes - Gallstones, Ethanol, Trauma, Steroids, Mumps, Autoimmune, Scorpion sting, Hyperlipidemia/Hypercalcemia, ERCP, Drugs
  - Drugs causing pancreatitis include azathioprine, valproic acid, 6-mercaptopurine, furosemide, pentamidine, didanosine
  - Early aggressive hydration (first 12-24 hours) reduces morbidity and mortality
  - Avoid CT in first 48 hours (underestimates necrosis, allow time for inflammatory changes to evolve)
differentials:
  - Peptic ulcer disease (perforated)
  - Acute cholecystitis
  - Mesenteric ischemia
  - Bowel obstruction
  - Myocardial infarction
  - Aortic dissection
trace:
  - Severe epigastric pain radiating to back with vomiting → Lipase 1200 U/L (>3x normal) → CT shows pancreatic edema → Diagnose acute pancreatitis → Abdominal ultrasound shows gallstones → Gallstone pancreatitis → Aggressive IV hydration with LR 250 mL/hr → NPO, IV morphine for pain → Check LFTs (ALT 180 suggests biliary etiology) → ERCP not needed (no cholangitis) → Pain improving day 3, advance to low-fat diet → Laparoscopic cholecystectomy before discharge → Discharge with low-fat diet instructions
