tree_id: GI-ACUTE-PANCREATITIS
name: Acute Pancreatitis
family: gastrointestinal
specialty: Gastroenterology
chief_complaint: Severe epigastric pain radiating to back, nausea, vomiting
description: Acute inflammation of the pancreas with local and systemic manifestations
icd10: K85.9
urgency: emergency
workup:
  - Clinical diagnosis requires 2 of 3 criteria - characteristic abdominal pain, serum lipase or amylase greater than 3 times upper limit of normal, characteristic imaging findings
  - Serum lipase (more specific than amylase, remains elevated longer)
  - Serum amylase (can be normal in 10-20% of cases)
  - Comprehensive metabolic panel (calcium, glucose, BUN, creatinine)
  - Complete blood count (elevated WBC with left shift)
  - Liver function tests (ALT greater than 150 U/L suggests gallstone etiology)
  - Triglycerides (if greater than 1000 mg/dL suggests hypertriglyceridemia as cause)
  - CT abdomen with IV contrast (not needed for diagnosis, reserve for severe cases or complications)
  - Perform CT after 48-72 hours if not improving or to evaluate for necrosis
  - Abdominal ultrasound to evaluate for gallstones (biliary pancreatitis)
  - Chest X-ray (assess for pleural effusion, ARDS)
  - Arterial blood gas if respiratory distress
  - Ranson criteria or APACHE II score to assess severity
  - BISAP score (BUN greater than 25, impaired mental status, SIRS, age greater than 60, pleural effusion) - score greater than 3 predicts mortality
treatment:
  - Aggressive IV fluid resuscitation - Lactated Ringer 250-500 mL/hr (15-20 mL/kg/hr) initially
  - Goal urine output greater than 0.5 mL/kg/hr, avoid fluid overload
  - NPO initially, advance diet as tolerated when pain improves
  - Early enteral nutrition (within 24-48 hours) preferred over parenteral - reduces infections and mortality
  - Pain control - IV opioids (morphine, hydromorphone), avoid meperidine
  - Antiemetics - ondansetron 4-8 mg IV Q8H PRN
  - No role for prophylactic antibiotics in sterile pancreatitis
  - Antibiotics only if infected necrosis suspected (carbapenem or fluoroquinolone plus metronidazole)
  - ERCP within 24 hours if concurrent acute cholangitis or biliary obstruction
  - Cholecystectomy during same admission for mild gallstone pancreatitis (once recovered)
  - Delayed cholecystectomy (6 weeks) for severe necrotizing pancreatitis
  - Insulin for hyperglycemia (target glucose 140-180 mg/dL)
  - Correct hypocalcemia if symptomatic or severe (calcium less than 7.5 mg/dL)
  - Avoid alcohol and smoking cessation counseling
clinical_pearls:
  - GET SMASHED mnemonic for causes - Gallstones, Ethanol, Trauma, Steroids, Mumps, Autoimmune, Scorpion sting, Hypercalcemia/Hypertriglyceridemia, ERCP, Drugs
  - Gallstones (40-50%) and alcohol (30-35%) account for 80% of cases
  - Drugs causing pancreatitis - azathioprine, 6-MP, valproic acid, sulfonamides, pentamidine, didanosine
  - Cullen sign (periumbilical ecchymosis) and Grey Turner sign (flank ecchymosis) indicate severe hemorrhagic pancreatitis
  - Lipase more sensitive and specific than amylase, stays elevated longer (7-14 days vs 3-5 days)
  - Normal lipase does NOT rule out pancreatitis if presentation late or chronic disease
  - CT findings - pancreatic enlargement, peripancreatic fat stranding, fluid collections
  - Necrotizing pancreatitis develops in 10-20%, mortality 15-30%
  - Infected necrosis requires drainage (percutaneous, endoscopic, or surgical)
  - Pseudocyst develops in 10-20% after 4 weeks, most resolve spontaneously
differentials:
  - Perforated peptic ulcer - sudden onset, peritoneal signs, free air on imaging
  - Acute cholecystitis - RUQ pain, positive Murphy sign, gallbladder wall thickening
  - Mesenteric ischemia - pain out of proportion to exam, older patient, AF
  - Myocardial infarction - chest pain radiation, ECG changes, elevated troponin
  - Ruptured abdominal aortic aneurysm - pulsatile mass, hypotension, back pain
  - Bowel obstruction - colicky pain, distension, hyperactive bowel sounds
  - Diabetic ketoacidosis - elevated glucose, anion gap acidosis, ketonuria
trace:
  - 52-year-old man presents to ED with sudden onset severe epigastric pain radiating to back, started 6 hours ago
  - Constant pain 9/10, associated with nausea and vomiting (5 episodes)
  - Unable to find comfortable position, pain worse lying flat
  - History of heavy alcohol use (6-8 beers daily for 20 years)
  - No prior episodes, no gallstones, no recent trauma
  - Physical exam - vitals BP 105/70, HR 115, temp 38.2C, RR 24, O2 sat 94% on RA
  - Appears ill, diaphoretic, tender epigastrium with guarding, diminished bowel sounds
  - No rebound tenderness, no palpable masses
  - Labs - WBC 18.5 K/uL, Hgb 15.2 g/dL, platelets 210 K/uL
  - Lipase 1250 U/L (normal less than 60), amylase 650 U/L (normal less than 100)
  - BUN 28 mg/dL, creatinine 1.4 mg/dL, glucose 210 mg/dL, calcium 8.2 mg/dL
  - ALT 45 U/L, AST 85 U/L, alkaline phosphatase 90 U/L, total bilirubin 1.2 mg/dL
  - Triglycerides 180 mg/dL (normal)
  - CT abdomen with contrast - diffuse pancreatic enlargement with peripancreatic fat stranding, no necrosis
  - RUQ ultrasound - no gallstones, no biliary dilatation
  - Diagnosis - Acute alcoholic pancreatitis, moderate severity
  - BISAP score 2 (BUN greater than 25, age greater than 60 no) - moderate risk
  - Admitted to medical floor, aggressive IV fluid resuscitation with Lactated Ringer 250 mL/hr
  - NPO, IV hydromorphone 0.5 mg Q3H PRN pain, ondansetron 4 mg IV Q8H PRN nausea
  - Day 2 - pain improved, started clear liquid diet, tolerated well
  - Day 3 - advanced to low-fat diet, pain 3/10, lipase trending down to 420 U/L
  - Alcohol cessation counseling, social work consultation, outpatient addiction services referral
  - Discharged day 4 with outpatient follow-up, complete alcohol abstinence advised
  - Outcome - Full recovery, attending alcohol support group, no recurrence at 6 months
