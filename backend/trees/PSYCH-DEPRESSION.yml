id: PSYCH-DEPRESSION
title: Depression Diagnostic Tree
family: Psychiatry
specialty: Psychiatry
version: 1.0
icd10: F32.9
last_updated: 2025-11-20
evidence_level: DSM-5-TR, APA Practice Guidelines
entry: screening

clinical_pearls:
  - PHQ-9 ≥10 suggests moderate-to-severe depression requiring treatment
  - Screen all patients with unexplained somatic symptoms for depression
  - Up to 50% of depressed patients present with physical complaints only
  - Always assess for bipolar disorder before starting antidepressants
  - Beware secondary causes - thyroid, anemia, B12 deficiency, medications

red_flags:
  - Suicidal ideation or plan (requires immediate safety assessment)
  - Psychotic symptoms (hallucinations, delusions)
  - Catatonia (immobility, mutism, posturing)
  - Severe self-neglect or inability to care for self
  - Manic or hypomanic symptoms (may indicate bipolar disorder)

nodes:
- id: screening
  when: {}
  description: Initial screening for depression symptoms
  tests:
  - PHQ-9 (Patient Health Questionnaire-9)
  - TSH, CBC, CMP, B12, folate
  - Urine drug screen (if substance use suspected)
  - Medication review (beta-blockers, corticosteroids, interferon)
  suggest_dx: []
  next:
  - when:
      symptoms_contains_any:
      - suicidal ideation
      - homicidal ideation
      - self-harm
    go: safety_assessment
  - when:
      symptoms_contains_any:
      - hallucinations
      - delusions
      - paranoia
    go: psychotic_depression
  - when:
      all_of:
      - phq9_score: '>=10'
      - symptoms_contains_all:
        - depressed mood
        - anhedonia
    go: major_depression
  - when:
      all_of:
      - duration: '>=2 years'
      - phq9_score: '5-9'
    go: persistent_depressive
  - when:
      symptoms_contains_any:
      - manic symptoms
      - hypomanic symptoms
      - decreased need for sleep
      - grandiosity
    go: bipolar_screen
  - default: adjustment_disorder

- id: safety_assessment
  when:
    symptoms_contains_any:
    - suicidal ideation
    - self-harm
    - homicidal ideation
  description: Immediate suicide risk assessment
  tests:
  - C-SSRS (Columbia Suicide Severity Rating Scale)
  - Mental status examination
  - Assess access to means (firearms, medications)
  - Collateral information from family/friends
  suggest_dx:
  - Major depressive disorder with suicidal ideation
  - Adjust diagnostic code based on suicide risk level
  referrals:
  - Emergency psychiatry consultation STAT
  - If high risk - psychiatric hold, 1:1 observation
  - If imminent risk - psychiatric hospitalization
  - Crisis hotline - 988 Suicide & Crisis Lifeline
  management:
  - Do NOT discharge high-risk patients without psychiatric clearance
  - Remove access to lethal means
  - Safety contract is NOT sufficient protection
  - Consider involuntary commitment if patient refuses evaluation
  - Document risk factors, protective factors, and decision-making
  next:
  - default: null

- id: psychotic_depression
  when:
    all_of:
    - symptoms_contains_any:
      - hallucinations
      - delusions
    - symptoms_contains_any:
      - depressed mood
      - anhedonia
  description: Depression with psychotic features
  tests:
  - Mental status examination
  - CT or MRI head (first episode psychosis)
  - Metabolic panel, LFTs
  - Urine drug screen
  - Consider RPR, HIV, ANA if new-onset psychosis
  suggest_dx:
  - Major depressive disorder with psychotic features
  - Rule out schizoaffective disorder
  - Rule out substance-induced psychotic disorder
  referrals:
  - Emergency psychiatry consultation
  - Psychiatric hospitalization often required
  - Higher suicide risk than non-psychotic depression
  management:
  - Combination antidepressant + antipsychotic required
  - ECT highly effective for psychotic depression
  - Do not treat with antidepressant monotherapy
  next:
  - default: null

- id: major_depression
  when:
    all_of:
    - phq9_score: '>=10'
    - symptoms_contains_any:
      - depressed mood
      - anhedonia
    - duration: '>=2 weeks'
  description: Major depressive disorder assessment
  tests:
  - PHQ-9 score for severity and monitoring
  - Screen for bipolar (MDQ, prior manic episodes)
  - Thyroid function (TSH, free T4)
  - CBC (anemia), CMP (electrolytes)
  - Vitamin B12, folate
  suggest_dx:
  - Major depressive disorder, single episode (F32.x)
  - Major depressive disorder, recurrent (F33.x)
  - Severity by PHQ-9 - Mild (10-14), Moderate (15-19), Severe (20-27)
  referrals:
  - Psychiatry referral within 1-2 weeks for moderate-severe
  - Psychotherapy (CBT, IPT) - essential component of treatment
  - If treatment-resistant (2+ failed trials) - TMS, ECT, ketamine
  management:
  - First-line SSRIs - sertraline 50mg, escitalopram 10mg, fluoxetine 20mg
  - Avoid TCAs in elderly or cardiac disease
  - Takes 4-6 weeks for full response
  - Continue for 6-12 months after remission (first episode)
  - Longer treatment if recurrent episodes
  - Psychotherapy + medication more effective than either alone
  monitoring:
  - PHQ-9 at each visit to track response
  - Activation syndrome - increased anxiety, agitation first 1-2 weeks
  - Monitor for emergence of suicidal ideation (black box warning)
  - Screen for manic switch on antidepressants
  next:
  - default: null

- id: persistent_depressive
  when:
    all_of:
    - duration: '>=2 years'
    - phq9_score: '>=5'
    - symptoms_contains_any:
      - depressed mood
      - low self-esteem
  description: Persistent depressive disorder (dysthymia)
  tests:
  - PHQ-9 for baseline severity
  - TSH to rule out hypothyroidism
  - Consider vitamin D level
  suggest_dx:
  - Persistent depressive disorder (dysthymia) (F34.1)
  - May have superimposed major depressive episodes ("double depression")
  referrals:
  - Psychiatry for medication management
  - Long-term psychotherapy (CBT, psychodynamic)
  management:
  - SSRIs or SNRIs effective
  - Often requires combination of medication + therapy
  - May need long-term treatment
  - Address comorbid personality traits
  next:
  - default: null

- id: bipolar_screen
  when:
    symptoms_contains_any:
    - manic symptoms
    - hypomanic symptoms
    - decreased need for sleep
    - grandiosity
    - racing thoughts
  description: Screen for bipolar disorder before treating depression
  tests:
  - Mood Disorder Questionnaire (MDQ)
  - Detailed psychiatric history
  - Family history of bipolar disorder
  - Review prior medication responses (activation on antidepressants)
  suggest_dx:
  - Bipolar disorder, current episode depressed
  - Rule out bipolar I, bipolar II
  referrals:
  - Psychiatry referral URGENT
  - Do NOT start antidepressant monotherapy
  - Risk of precipitating mania or rapid cycling
  management:
  - Mood stabilizers first-line (lithium, lamotrigine, quetiapine)
  - If antidepressant needed, use with mood stabilizer
  - Close monitoring for mood switching
  next:
  - default: null

- id: adjustment_disorder
  when:
    all_of:
    - phq9_score: '<10'
    - identifiable_stressor: true
    - duration: '<6 months'
  description: Adjustment disorder with depressed mood
  tests:
  - PHQ-9 for baseline
  - Clinical interview to identify stressor
  suggest_dx:
  - Adjustment disorder with depressed mood (F43.21)
  - Subclinical depression
  - Bereavement (V62.82) if related to death of loved one
  referrals:
  - Brief psychotherapy (CBT, problem-solving therapy)
  - Social work for psychosocial stressors
  management:
  - Psychotherapy is first-line treatment
  - Antidepressants generally not indicated unless severe
  - Should resolve within 6 months of stressor resolution
  - If persists >6 months, consider major depression
  - Support groups, stress management
  monitoring:
  - Reassess in 2-4 weeks
  - If worsening, escalate to antidepressant treatment
  next:
  - default: null

differential_diagnosis:
  - Bipolar disorder (screen with MDQ before starting antidepressants)
  - Hypothyroidism (check TSH)
  - Anemia (check CBC)
  - Vitamin B12 or folate deficiency
  - Medication-induced (beta-blockers, corticosteroids, interferon)
  - Substance use disorder (alcohol, cannabis, stimulant withdrawal)
  - Sleep apnea
  - Chronic pain syndrome
  - Bereavement/grief reaction
  - Adjustment disorder with depressed mood

disposition_guidance:
  admit:
  - Active suicidal ideation with plan and intent
  - Psychotic depression with self-neglect
  - Catatonia
  - Severe malnutrition or dehydration from depression
  discharge:
  - Mild-moderate depression without suicidal ideation
  - Has follow-up arranged within 1 week
  - Adequate social support and safety plan
  - Started on or continuing medication
  follow_up:
  - Psychiatry within 1-2 weeks for moderate-severe
  - Primary care within 1 week to monitor medication response
  - Psychotherapy referral arranged
  - PHQ-9 at each visit to track progress

references:
  - American Psychiatric Association. DSM-5-TR Diagnostic Criteria for Major Depressive Disorder. 2022.
  - APA Practice Guideline for the Treatment of Patients with Major Depressive Disorder, 3rd Edition. 2010.
  - Kroenke K, Spitzer RL. The PHQ-9 - A New Depression Diagnostic and Severity Measure. Psychiatr Ann. 2002.
  - Kennedy SH et al. Canadian Network for Mood and Anxiety Treatments (CANMAT) Clinical Guidelines. Can J Psychiatry. 2016.
  - NICE Guidelines - Depression in adults - recognition and management. 2022.
