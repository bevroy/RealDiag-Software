tree_id: URO-PROSTATITIS-ACUTE
name: Acute Bacterial Prostatitis
family: Urology
specialty: Urology
icd10:
- N41.0
snomed:
- 9713002
urgency: urgent
description: Comprehensive evaluation and management of Acute Bacterial Prostatitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Fever, chills
- Pelvic or perineal pain
- Dysuria, urinary frequency
- Urinary retention
- Tender, boggy prostate on DRE
- Pyuria, bacteriuria
- Elevated PSA (may be normal after treatment)
workup:
- 'UA with culture BEFORE antibiotics: Pyuria (WBC >10), bacteriuria, positive culture
  (>100,000 CFU/mL)'
- 'Blood cultures if febrile: Positive in 50% (bacteremia common)'
- 'DRE: Exquisitely tender, boggy, swollen prostate - DO NOT massage vigorously'
- 'TRUS (transrectal ultrasound) if not improving: Rule out prostatic abscess (hypoechoic
  fluid collection)'
- 'PSA: Elevated acutely, recheck 6 weeks after treatment to ensure normalization'
treatment:
- 'Guideline-based treatment options for Acute Bacterial Prostatitis include:'
- 'Fluoroquinolone x4 weeks: Ciprofloxacin 500mg BID or levofloxacin 500mg daily (best
  prostate penetration) (AUA 2023)'
- 'Alternative: TMP-SMX DS BID x4 weeks (if fluoroquinolone resistance or contraindication)
  (AUA 2023)'
- 'Hospitalization if septic/toxic: Ceftriaxone 1g IV daily + gentamicin 5mg/kg IV
  daily, then oral fluoroquinolone x4 weeks total (AUA 2023)'
- 'Urinary retention: Suprapubic catheter preferred over urethral (avoid instrumenting
  infected prostate) (AUA 2023)'
- 'NSAIDs for pain: Ibuprofen 600mg TID, avoid alpha-blockers acutely (may worsen
  hypotension if septic) (AUA 2023)'
clinical_pearls:
- 'Bacterial infection of prostate - E. coli (80%), Klebsiella, Proteus, Enterococcus.
  Risk factors: recent UTI, catheterization, transrectal prostate biopsy'
- DO NOT vigorously massage prostate on DRE (can cause bacteremia, sepsis) - gentle
  palpation only
- 'PSA: Transiently elevated during acute prostatitis (inflammation causes PSA release),
  recheck 6 weeks after treatment'
- 'Abscess formation: 5-10% develop prostatic abscess if inadequately treated - needs
  drainage'
- 'Chronic prostatitis: 5-10% develop chronic bacterial prostatitis after acute episode
  (recurrent UTIs with same organism)'
referrals:
- 'Urology if: Not improving after 48-72h antibiotics, urinary retention, concern
  for abscess'
- 'Admit if: Septic, toxic appearance, unable to tolerate PO, urinary retention'
differentials:
  - UTI
  - BPH
  - Prostate cancer
  - Epididymitis
  - Urethral stricture
trace:
  source: American Urological Association (AUA) Guidelines, European Association of
    Urology (EAU) Guidelines
  version: 0.1.0
  last_updated: '2024-12-26'
