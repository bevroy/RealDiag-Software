tree_id: PSYCH-BIPOLAR-DISORDER
name: Bipolar I Disorder
family: Psychiatry
specialty: Psychiatry
icd10:
- F31.10
- F31.31
snomed:
- '13746004'
urgency: medium
description: Comprehensive evaluation and management of Bipolar I Disorder
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Manic episode: ≥1 week of elevated/expansive or irritable mood'
- Inflated self-esteem or grandiosity, decreased need for sleep (3 hours feels sufficient)
- More talkative than usual, pressured speech, flight of ideas
- Distractibility, increased goal-directed activity, psychomotor agitation
- Excessive involvement in pleasurable activities (spending sprees, sexual indiscretions,
  risky investments)
- Marked functional impairment, may require hospitalization
- Depressive episodes also common (but not required for diagnosis)
workup:
- Mood Disorder Questionnaire (MDQ) for screening
- 'Lithium level (if on lithium): Therapeutic 0.6-1.2 mEq/L'
- TSH, Cr, CBC (baseline and monitor with mood stabilizers)
- Urine drug screen (substance-induced mania)
treatment:
- 'Guideline-based treatment options for Bipolar I Disorder include:'
- 'Acute mania: Atypical antipsychotic (olanzapine 10-20mg, risperidone 2-6mg, quetiapine
  400-800mg) (APA 2022)'
- 'Mood stabilizer: Lithium 300mg BID-TID (titrate to level 0.6-1.2), or valproate
  500-1500mg/day (APA 2022)'
- 'Depressive episode: Lamotrigine 200mg daily, or quetiapine, or add antidepressant
  (with mood stabilizer) (APA 2022)'
- 'Avoid: Antidepressants alone (risk mania), benzodiazepines long-term (APA 2022)'
- 'Psychotherapy: CBT, family-focused therapy, psychoeducation (APA 2022)'
clinical_pearls:
- 'Bipolar I: At least one manic episode (depressive episodes common but not required)'
- 'Bipolar II: Hypomanic episodes + major depressive episodes (no full mania)'
- 'Mood stabilizers first-line: Lithium, valproate, lamotrigine, atypical antipsychotics'
- 'Avoid antidepressants alone: Can trigger mania or rapid cycling'
- 'Lithium levels: Therapeutic 0.6-1.2 mEq/L, check levels q3-6 months + TSH, Cr'
referrals:
- Psychiatry for all bipolar disorder
- Hospitalization if manic with psychosis, danger to self/others, or severe impairment
differentials:
  - Major depression
  - Borderline personality disorder
  - Substance use
  - ADHD
trace:
  source: American Psychiatric Association (APA) Practice Guidelines, DSM-5-TR Diagnostic
