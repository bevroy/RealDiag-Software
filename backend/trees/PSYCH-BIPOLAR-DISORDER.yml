tree_id: PSYCH-BIPOLAR-DISORDER
name: Bipolar Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Mood swings with periods of elevated mood and depression
description: |
  Chronic mood disorder with episodes of mania or hypomania and depression.
  Bipolar I (manic episodes), Bipolar II (hypomanic episodes with major depression). Lifetime prevalence 1-2%. Average age of onset 25 years.
icd10: F31.9
urgency: Moderate
workup:
  - Clinical diagnosis using DSM-5 criteria
  - Manic episode - distinct period of abnormally elevated, expansive, or irritable mood lasting at least 7 days (or any duration if hospitalization needed)
  - Plus 3 or more symptoms - grandiosity, decreased need for sleep, pressured speech, racing thoughts, distractibility, increased goal-directed activity, excessive risky behavior
  - Hypomanic episode - similar but lasts 4-7 days, less severe, no marked impairment or psychosis
  - Major depressive episode - as per criteria (2 weeks of depressed mood or anhedonia plus other symptoms)
  - Rule out medical causes - thyroid function tests, metabolic panel, toxicology screen
  - Brain imaging if atypical presentation or first episode in older adult
treatment:
  - Mood stabilizers first-line - lithium 900-1200mg/day (target level 0.8-1.2 mEq/L) most effective
  - Alternative mood stabilizers - valproate 500-1500mg/day, carbamazepine 400-1200mg/day
  - Atypical antipsychotics - quetiapine 300-800mg, olanzapine 10-20mg, risperidone 2-6mg, aripiprazole 15-30mg
  - Acute mania - antipsychotic (quetiapine, olanzapine, risperidone) plus mood stabilizer, benzodiazepines for agitation
  - Bipolar depression - quetiapine or lurasidone monotherapy, or lithium/valproate plus antidepressant (SSRI with caution, risk of switching to mania)
  - Maintenance therapy - continue mood stabilizer lifelong to prevent recurrence
  - Psychotherapy - cognitive behavioral therapy, family-focused therapy, interpersonal and social rhythm therapy
  - Monitor lithium levels every 3-6 months, check TSH and creatinine (lithium can cause hypothyroidism and nephrotoxicity)
clinical_pearls:
  - Bipolar I requires at least one manic episode, Bipolar II requires hypomanic episode plus major depressive episode
  - Manic patients often have poor insight and may not recognize illness
  - Rapid cycling (4 or more mood episodes per year) indicates poor prognosis
  - Antidepressants alone can precipitate mania in bipolar patients (always use with mood stabilizer)
  - Lithium most effective for preventing suicide in bipolar disorder
  - High comorbidity with substance use disorders (60%), anxiety disorders (50%)
  - Psychiatric emergency if suicidal, homicidal, or severe psychosis (hospitalize)
differentials:
  - Major depressive disorder
  - Schizoaffective disorder
  - Borderline personality disorder
  - Substance-induced mood disorder
  - ADHD
  - Hyperthyroidism
trace:
  - 3-day history of decreased sleep (2 hours/night), rapid speech, excessive spending, feeling on top of the world → Prior episode of severe depression 6 months ago → No substance use, TSH normal → Diagnose bipolar I disorder, manic episode → Start lithium 600mg BID plus olanzapine 10mg nightly → Lorazepam 2mg for agitation → Hospitalize for safety → Symptoms improve over 7 days → Continue lithium (level 0.9 mEq/L) and olanzapine → Psychoeducation, follow-up weekly initially → Long-term mood stabilization
