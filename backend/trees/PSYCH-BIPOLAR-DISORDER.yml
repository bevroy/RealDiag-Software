tree_id: PSYCH-BIPOLAR-DISORDER
name: Bipolar Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Mood swings and decreased need for sleep
description: |
  Mood disorder characterized by episodes of mania or hypomania alternating with depression. Bipolar I requires at least one manic episode (may have depressive episodes).
  Bipolar II requires at least one hypomanic episode and one major depressive episode (no full manic episodes). Cyclothymic disorder has chronic fluctuating mood but not meeting criteria for mania or major depression. Lifetime prevalence 1-2%.
icd10: F31.9
urgency: High
workup:
  - Detailed psychiatric history - age of onset (typically late teens/early 20s), episode duration, symptom patterns, family history (strong genetic component)
  - Screen for manic/hypomanic episodes - elated or irritable mood, increased energy, decreased need for sleep (less than 3 hours yet not tired), racing thoughts, pressured speech, grandiosity, impulsivity, risky behavior
  - Manic episode - symptoms last at least 7 days (or hospitalization required), significant functional impairment or psychosis
  - Hypomanic episode - symptoms last at least 4 days, noticeable change but not severe impairment, no psychosis
  - Screen for depressive episodes - DSM-5 criteria for major depression (depressed mood, anhedonia, sleep/appetite changes, fatigue, guilt, concentration difficulty, suicidality)
  - Rule out substance-induced - amphetamines, cocaine, corticosteroids can mimic mania
  - Urine drug screen, alcohol use assessment
  - Medical workup to exclude secondary causes - TSH (hyperthyroidism), CBC, CMP, HIV, syphilis if indicated
  - Brain imaging (CT or MRI) if first episode, atypical features, or focal neurologic signs - rule out tumor, stroke, MS
  - Mood charting - daily tracking of mood, sleep, medications helps identify patterns and triggers
  - Assess suicide risk - bipolar disorder has high suicide rate (15-20% lifetime)
  - Screen for comorbidities - anxiety disorders (75%), substance use disorders (50%), ADHD (20%)
treatment:
  - Mood stabilizers first-line for acute mania and maintenance
  - Lithium 300-600mg BID to TID, target level 0.8-1.2 mEq/L acute mania, 0.6-0.8 mEq/L maintenance
  - Check level 5 days after dose change, then q3-6 months when stable
  - Monitor TSH, creatinine, calcium q6-12 months (thyroid and renal toxicity)
  - Narrow therapeutic window - toxicity causes tremor, ataxia, confusion, arrhythmias
  - Valproate (divalproex) 250-500mg BID, target level 50-125 mcg/mL
  - Hepatotoxicity, thrombocytopenia, weight gain, teratogenic (avoid in pregnancy)
  - Carbamazepine 200-400mg BID, target level 4-12 mcg/mL
  - Drug interactions (CYP inducer), agranulocytosis, hyponatremia
  - Second-generation antipsychotics effective for acute mania
  - Quetiapine 300-800mg daily, olanzapine 10-20mg daily, aripiprazole 15-30mg daily, risperidone 2-6mg daily
  - Metabolic side effects - weight gain, diabetes, dyslipidemia (monitor weight, glucose, lipids)
  - Bipolar depression treatment - lamotrigine, quetiapine, lurasidone, or lithium
  - Lamotrigine 25-200mg daily, titrate slowly to prevent Stevens-Johnson syndrome (start 25mg daily x 2 weeks, increase by 25mg q2 weeks)
  - Avoid antidepressant monotherapy - can trigger mania or rapid cycling
  - If antidepressant needed, combine with mood stabilizer (SSRI or bupropion preferred)
  - Rapid cycling (4 or more episodes per year) - valproate or lamotrigine preferred over lithium
  - Psychotherapy adjunct - cognitive behavioral therapy (CBT), family-focused therapy, interpersonal and social rhythm therapy
  - Lifestyle - regular sleep schedule critical, avoid alcohol and drugs, stress management
  - Maintenance treatment lifelong - prevents recurrence (risk 90% within 5 years without treatment)
clinical_pearls:
  - Bipolar I (mania) vs Bipolar II (hypomania plus major depression) - II has more chronic depression, higher suicide risk
  - Antidepressants alone can induce mania - always use with mood stabilizer in bipolar disorder
  - Mixed episodes (simultaneous manic and depressive symptoms) highest suicide risk
  - Postpartum period high risk for mood episodes - consider prophylactic treatment
  - Cyclothymia (chronic mild mood swings x 2+ years) can progress to bipolar disorder
  - Screen family members - first-degree relatives have 10x increased risk
differentials:
  - Major depressive disorder (unipolar depression)
  - Borderline personality disorder
  - ADHD
  - Substance use disorder
  - Schizoaffective disorder
  - Hyperthyroidism
trace:
  - 24-year-old woman with 3 days of elevated mood, racing thoughts, decreased sleep (2-3 hours nightly but feels energized) → Uncharacteristic spending spree ($5000 on credit cards), hypersexual behavior, pressured speech → Family reports similar episode 2 years ago followed by 3-month depression → No substance use, urine drug screen negative → TSH normal → Family history significant - mother has bipolar disorder → Diagnose bipolar I disorder, current episode manic → Voluntary hospitalization for safety → Start olanzapine 15mg nightly and lithium 300mg TID → Lithium level 0.9 mEq/L after 5 days → Manic symptoms resolve over 10 days, discharge on olanzapine 10mg and lithium 900mg daily → Refer to psychiatrist and therapist for CBT → Educate on importance of medication adherence, sleep hygiene → Mood stabilizes, continues lithium monotherapy long-term, no recurrence at 2-year follow-up
