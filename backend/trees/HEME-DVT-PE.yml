tree_id: HEME-DVT-PE
name: Deep Vein Thrombosis and Pulmonary Embolism
family: Hematology
specialty: Hematology/Emergency Medicine/Internal Medicine
chief_complaint: DVT/PE
description: Diagnostic decision tree for venous thromboembolism
version: "1.0"
icd10: I26.9
author: RealDiag Team
entry_point: presentation

nodes:
  - id: presentation
    type: question
    text: "Clinical presentation?"
    options:
      - label: "Massive PE (hypotension, shock, cardiac arrest)"
        next: massive_pe
      - label: "Submassive PE (RV strain, no hypotension)"
        next: submassive_pe
      - label: "Suspected PE, hemodynamically stable"
        next: suspected_pe
      - label: "Unilateral leg swelling (suspected DVT)"
        next: suspected_dvt
      - label: "Upper extremity DVT"
        next: upper_dvt

  - id: massive_pe
    type: diagnosis
    diagnosis: Massive Pulmonary Embolism
    icd10: I26.99
    urgency: critical
    workup:
      - Bedside echocardiogram (RV dilation/dysfunction)
      - CT angiography if stable enough
      - Troponin, BNP
      - ABG
      - ECG (S1Q3T3, new RBBB)
      - Consider bedside ultrasound (leg DVT)
    treatment:
      - ACTIVATE PE RESPONSE TEAM
      - 100% oxygen, intubation if needed
      - Aggressive IV fluids (cautious - may worsen RV failure)
      - Avoid excessive preload
      - Vasopressors (norepinephrine) if hypotensive
      - Systemic thrombolysis (alteplase 100mg over 2 hours) if no contraindications
      - Catheter-directed thrombolysis or thrombectomy if available
      - Surgical embolectomy if thrombolysis contraindicated
      - ECMO as bridge if available
      - IVC filter if cannot anticoagulate
      - ICU admission
      - Mortality 25-50%

  - id: submassive_pe
    type: diagnosis
    diagnosis: Submassive Pulmonary Embolism
    icd10: I26.99
    urgency: critical
    workup:
      - CT angiography chest (PE confirmed)
      - Troponin (elevated suggests RV strain)
      - BNP or NT-proBNP
      - Echocardiogram (RV dysfunction, RV/LV ratio >0.9)
      - ECG
      - ABG
    treatment:
      - Anticoagulation immediately
      - Heparin bolus 80 units/kg IV, then 18 units/kg/h OR
      - LMWH (enoxaparin 1 mg/kg q12h)
      - Consider half-dose thrombolysis if high risk (controversial)
      - Catheter-directed therapy at experienced centers
      - ICU vs telemetry admission
      - Transition to oral anticoagulation
      - Apixaban 10mg BID x 7 days, then 5mg BID OR
      - Rivaroxaban 15mg BID x 21 days, then 20mg daily
      - Monitor for decompensation
      - Hematology consult

  - id: suspected_pe
    type: question
    text: "Wells score or PERC rule?"
    options:
      - label: "High probability (Wells >4)"
        next: high_prob_pe
      - label: "Moderate probability (Wells 2-4)"
        next: moderate_prob_pe
      - label: "Low probability (Wells <2) and PERC negative"
        next: low_prob_pe

  - id: high_prob_pe
    type: diagnosis
    diagnosis: High Probability Pulmonary Embolism
    icd10: I26.99
    urgency: high
    workup:
      - CT angiography chest (skip D-dimer)
      - ECG, troponin, BNP
      - CBC, BMP, PT/INR
      - Consider VQ scan if CTA contraindicated
      - Leg ultrasound if CTA unavailable (DVT confirms need for anticoagulation)
    treatment:
      - Start anticoagulation before imaging if high suspicion and no contraindication
      - If PE confirmed: therapeutic anticoagulation
      - Heparin or LMWH initially
      - Transition to oral anticoagulant
      - Apixaban 10mg BID x 7 days, then 5mg BID OR
      - Rivaroxaban 15mg BID x 21 days, then 20mg daily OR
      - Warfarin (overlap with heparin until INR 2-3)
      - Minimum 3 months anticoagulation
      - Assess for thrombophilia and cancer
      - Hospital admission if significant PE or risk factors

  - id: moderate_prob_pe
    type: diagnosis
    diagnosis: Moderate Probability PE
    icd10: I26.99
    urgency: high
    workup:
      - D-dimer (if negative, PE excluded)
      - If D-dimer positive: CT angiography
      - Age-adjusted D-dimer (age x 10 if >50 years)
    treatment:
      - If D-dimer negative: PE excluded, no treatment
      - If CT positive: treat as confirmed PE
      - Anticoagulation for 3-6 months
      - Assess for provoked vs unprovoked
      - Provoked (surgery, trauma, immobility): 3 months
      - Unprovoked or cancer: ≥6 months, consider extended
      - Hematology follow-up

  - id: low_prob_pe
    type: diagnosis
    diagnosis: Low Probability PE (Excluded)
    icd10: R06.02
    urgency: low
    workup:
      - PERC rule applies (age <50, HR <100, SpO2 ≥95%, no hemoptysis, no estrogen, no prior VTE, no unilateral leg swelling, no surgery/trauma)
      - No further testing needed
    treatment:
      - PE effectively ruled out
      - Alternative diagnosis
      - Reassurance
      - Outpatient management

  - id: suspected_dvt
    type: question
    text: "Wells score for DVT?"
    options:
      - label: "High probability (Wells ≥2)"
        next: dvt_high_prob
      - label: "Low probability (Wells <2)"
        next: dvt_low_prob

  - id: dvt_high_prob
    type: diagnosis
    diagnosis: Deep Vein Thrombosis (High Probability)
    icd10: I82.40
    urgency: high
    workup:
      - Compression ultrasound of leg
      - D-dimer if ultrasound not immediately available
      - Consider whole leg ultrasound vs proximal only
      - Repeat ultrasound in 1 week if initial negative but high suspicion
    treatment:
      - If DVT confirmed: anticoagulation
      - Proximal DVT (popliteal or above): treat
      - Distal (calf) DVT: treat if symptomatic or high risk
      - Rivaroxaban 15mg BID x 21 days, then 20mg daily OR
      - Apixaban 10mg BID x 7 days, then 5mg BID OR
      - LMWH bridge to warfarin (INR 2-3)
      - Compression stockings controversial
      - Leg elevation, ambulation
      - Minimum 3 months treatment
      - Assess for malignancy and thrombophilia
      - IVC filter if anticoagulation contraindicated

  - id: dvt_low_prob
    type: diagnosis
    diagnosis: DVT Low Probability
    icd10: R22.41
    urgency: low
    workup:
      - D-dimer
      - If positive: compression ultrasound
      - If negative: DVT excluded
    treatment:
      - If D-dimer negative: no DVT, no treatment
      - If ultrasound confirms DVT: treat as above
      - Alternative diagnoses: cellulitis, Baker's cyst, muscle strain, lymphedema

  - id: upper_dvt
    type: question
    text: "Catheter-associated?"
    options:
      - label: "Central line or PICC associated"
        next: catheter_dvt
      - label: "Effort thrombosis (Paget-Schroetter)"
        next: effort_thrombosis
      - label: "Spontaneous upper extremity DVT"
        next: spontaneous_upper_dvt

  - id: catheter_dvt
    type: diagnosis
    diagnosis: Catheter-Associated Upper Extremity DVT
    icd10: I82.62
    urgency: medium
    workup:
      - Compression ultrasound of upper extremity
      - Assess catheter necessity
    treatment:
      - Anticoagulation if symptomatic or catheter cannot be removed
      - Remove catheter if no longer needed
      - If catheter needed: anticoagulate and leave in place
      - Rivaroxaban or apixaban x 3 months minimum
      - Higher recurrence risk than lower extremity
      - Consider imaging for PE if extensive clot

  - id: effort_thrombosis
    type: diagnosis
    diagnosis: Effort Thrombosis (Paget-Schroetter Syndrome)
    icd10: I82.A1
    urgency: high
    workup:
      - Upper extremity venography or ultrasound
      - Assess for thoracic outlet syndrome
      - CT chest (thoracic inlet)
    treatment:
      - Early catheter-directed thrombolysis (<14 days)
      - Anticoagulation
      - Thoracic outlet decompression (first rib resection) after acute phase
      - Vascular surgery consult
      - Young, athletic patients
      - High recurrence if not treated definitively

  - id: spontaneous_upper_dvt
    type: diagnosis
    diagnosis: Spontaneous Upper Extremity DVT
    icd10: I82.60
    urgency: high
    workup:
      - Ultrasound with Doppler
      - Malignancy workup (more common than lower extremity)
      - CT chest/abdomen/pelvis
      - Thrombophilia testing
    treatment:
      - Anticoagulation x 3-6 months
      - Assess for occult malignancy
      - Consider extended anticoagulation if unprovoked
      - Hematology referral
