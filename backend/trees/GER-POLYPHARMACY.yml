homeopathy: []
presentations:
- Taking ≥5 medications regularly (some definitions use ≥10)
- Confusion, falls, or cognitive decline from medications
- Drug-drug interactions (e.g., warfarin + NSAIDs, SSRIs + tramadol)
- Potentially inappropriate medications (PIMs) for elderly (Beers criteria)
- Medication non-adherence (too many meds, cost, confusion)
- 'Adverse drug events (ADEs): Falls, delirium, GI bleed, renal injury'
- 'Anticholinergic burden: Cumulative anticholinergic effects (dry mouth, constipation,
  urinary retention, confusion)'
workup: []
treatment:
- 'Guideline-based treatment options for Polypharmacy and Adverse Drug Reactions include:'
- 'Comprehensive medication review: List all prescriptions, OTC, supplements, herbals
  (AGS 2023)'
- 'Identify PIMs: Use Beers criteria or STOPP/START, flag anticholinergics, sedatives,
  high-risk meds (AGS 2023)'
- 'Deprescribing plan: Stop 1 med at a time, taper if needed (benzos, opioids, PPIs),
  monitor for withdrawal/rebound (AGS 2023)'
- 'Simplify regimen: Once-daily dosing preferred, pill organizers, medication list
  with indications (AGS 2023)'
- 'Disposition: Outpatient management with close follow-up, pharmacist consult, geriatrician
  referral if complex (AGS 2023)'
clinical_pearls:
- 'Beers Criteria = PIMs to avoid in elderly: Anticholinergics (diphenhydramine, hydroxyzine),
  benzos, NSAIDs, PPIs long-term, sliding scale insulin'
- 'STOPP/START: STOPP = potentially inappropriate meds to stop, START = beneficial
  meds to start'
- 'Deprescribing: Systematically reduce/stop meds, prioritize those causing ADEs or
  no clear benefit'
- 'Anticholinergic burden scale: Each anticholinergic med increases fall/delirium
  risk cumulatively'
- 'Medication reconciliation at EVERY visit: Brown bag review (bring all meds/supplements)'
- 'Start low, go slow: Elderly more sensitive to medications (reduced renal clearance,
  altered pharmacodynamics)'
referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy
differentials:
  - Drug interactions
  - Adverse drug events
