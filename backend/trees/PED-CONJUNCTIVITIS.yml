tree_id: PED-CONJUNCTIVITIS
name: Conjunctivitis (Pediatric)
family: pediatrics
specialty: Pediatrics/Ophthalmology/Family Medicine
icd10: H10.9
snomed: 9826008
urgency: []
homeopathy: []
presentations:
  - Red or pink eye(s)
  - Eye discharge (watery, mucoid, or purulent)
  - Crusting of eyelids (especially upon waking)
  - Eye itching or irritation
  - Tearing
  - Gritty or foreign body sensation
  - May have associated upper respiratory infection symptoms
  - Unilateral or bilateral presentation
  - Typically no vision changes or severe pain
workup:
  - Clinical history
  - Onset and duration
  - Unilateral versus bilateral
  - Type and amount of discharge (watery, mucoid, purulent)
  - Associated symptoms (itching, pain, photophobia, vision changes)
  - Recent viral illness or sick contacts
  - Trauma or foreign body exposure
  - Contact lens use (older children)
  - Allergies or atopic history
  - Physical examination
  - Visual acuity (if age-appropriate)
  - External examination
  - Eyelid inspection (swelling, erythema, crusting)
  - Conjunctival injection (redness)
  - Type of discharge
  - Preauricular lymphadenopathy (viral)
  - Corneal examination (fluorescein stain if concern for abrasion or ulcer)
  - Pupil reactivity
  - Red flags requiring ophthalmology referral
  - Vision loss or significant photophobia
  - Severe eye pain
  - Corneal opacity or infiltrate
  - Irregular pupil
  - History of eye trauma or chemical exposure
  - Newborn (younger than 4 weeks) with conjunctivitis
  - No improvement after 2-3 days of appropriate treatment
  - Laboratory testing
  - Usually NOT needed for typical viral or bacterial conjunctivitis
  - Indications for testing
  - Neonatal conjunctivitis (gonorrhea and chlamydia cultures/NAAT)
  - Suspected gonococcal conjunctivitis (hyperacute, copious purulent discharge)
  - Recurrent or chronic conjunctivitis
  - Failed antibiotic therapy
treatment:
  - Viral conjunctivitis (MOST COMMON - 80% of infectious cases)
  - Presentation: watery discharge, bilateral, associated URI symptoms, preauricular lymphadenopathy
  - Treatment: supportive care only
  - Cool compresses 4-6 times daily
  - Artificial tears for symptom relief
  - Hand hygiene to prevent spread
  - Self-limited (resolves in 7-14 days)
  - Antibiotics NOT helpful
  - Highly contagious - exclude from school/daycare until discharge resolves
  - Bacterial conjunctivitis
  - Presentation: purulent discharge, matting of lashes, may be unilateral
  - Most common pathogens: H. influenzae, S. pneumoniae, M. catarrhalis
  - Topical antibiotic therapy (first-line)
  - Erythromycin 0.5% ointment: thin ribbon to lower lid 4 times daily for 5-7 days
  - Preferred for infants and young children (less stinging)
  - Polytrim (polymyxin B-trimethoprim) drops: 1 drop 4 times daily for 5-7 days
  - Azithromycin 1% drops: 1 drop twice daily for 2 days, then once daily for 5 days
  - Fluoroquinolones (ciprofloxacin, moxifloxacin): reserve for contact lens wearers
  - Usually improves within 2-3 days
  - Can return to school/daycare after 24 hours of antibiotics
  - Allergic conjunctivitis
  - Presentation: bilateral itching (prominent), watery discharge, seasonal pattern, personal/family history atopy
  - Treatment
  - Avoid allergens if identified
  - Cool compresses
  - Artificial tears (wash away allergens)
  - Antihistamine drops (olopatadine, ketotifen) - very effective
  - Oral antihistamines (cetirizine, loratadine)
  - Mast cell stabilizer drops (nedocromil, cromolyn) for prevention
  - Neonatal conjunctivitis (ophthalmia neonatorum)
  - Age-based differential
  - "Day 1: chemical (silver nitrate prophylaxis)"
  - "Days 2-5: gonococcal (N. gonorrhoeae)"
  - "Days 5-14: chlamydial (C. trachomatis) - most common"
  - "Beyond 2 weeks: HSV, other bacteria"
  - Workup: bacterial culture, gonorrhea/chlamydia NAAT, consider HSV PCR
  - Treatment
  - Gonococcal: ceftriaxone 25-50 mg/kg IV/IM (max 125 mg) single dose PLUS topical erythromycin
  - Chlamydial: oral azithromycin 20 mg/kg/day for 3 days OR erythromycin 50 mg/kg/day divided QID for 14 days
  - Hospitalize if concern for gonorrhea (can cause corneal perforation)
  - Treat mother and sexual partners
  - Infection control and prevention
  - Frequent hand washing (most important)
  - Avoid touching or rubbing eyes
  - Do not share towels, pillowcases, eye drops
  - Discard eye makeup and contact lenses if bacterial
  - Clean and disinfect surfaces
clinical_pearls:
  - 'Viral conjunctivitis most common (80% of infectious cases) - watery discharge, bilateral, self-limited, NO antibiotics needed'
  - 'Bacterial conjunctivitis has purulent discharge and crusting - topical antibiotics shorten duration by 1-2 days'
  - 'Itching is hallmark of allergic conjunctivitis - antihistamine drops (olopatadine) highly effective'
  - 'Neonatal conjunctivitis in first month of life requires cultures and systemic antibiotics for gonorrhea or chlamydia'
  - 'Preauricular lymphadenopathy suggests viral etiology (adenovirus most common)'
  - 'Contact lens wearers with purulent conjunctivitis need pseudomonas coverage (fluoroquinolone drops) and ophthalmology referral'
  - 'Can return to school/daycare after 24 hours of antibiotic drops or when discharge resolves (viral)'
  - 'Red flags: vision loss, severe pain, corneal involvement, photophobia - require ophthalmology evaluation'
referrals:
  - Ophthalmology if vision changes, severe pain, corneal involvement, failed treatment, or neonatal conjunctivitis
  - Emergency ophthalmology for suspected gonococcal conjunctivitis (hyperacute, copious purulent discharge)
  - Allergy/immunology if severe recurrent allergic conjunctivitis
differentials:
  - Viral conjunctivitis (watery discharge, bilateral, URI symptoms, preauricular lymphadenopathy)
  - Bacterial conjunctivitis (purulent discharge, crusting, may be unilateral)
  - Allergic conjunctivitis (itching prominent, bilateral, watery discharge, seasonal)
  - Chemical/irritant conjunctivitis (exposure history, improves after irrigation)
  - Corneal abrasion (pain, foreign body sensation, fluorescein uptake)
  - Foreign body (unilateral, pain, visible on exam)
  - Nasolacrimal duct obstruction (chronic tearing, discharge from birth, massage helps)
  - Blepharitis (eyelid margin inflammation, crusting at lash base)
  - Uveitis (eye pain, photophobia, decreased vision, requires urgent ophthalmology)
