tree_id: PEDS-ADHD
name: ADHD (Pediatric)
family: pediatrics
specialty: Pediatrics/Developmental-Behavioral Pediatrics/Psychiatry
icd10: F90.9
snomed: 406506008
urgency:
  - Suicidal ideation or self-harm behaviors
  - Severe aggression or violence toward others
  - Severe impairment in functioning with acute crisis
  - Psychotic symptoms
  - Substance abuse concerns
homeopathy: []
presentations:
  - Inattention symptoms (difficulty sustaining attention, easily distracted)
  - Does not seem to listen when spoken to directly
  - Fails to give close attention to details, makes careless mistakes
  - Difficulty organizing tasks and activities
  - Avoids or dislikes tasks requiring sustained mental effort (homework)
  - Loses things necessary for tasks (school supplies, toys, assignments)
  - Forgetful in daily activities
  - Hyperactivity symptoms (excessive motor activity)
  - Fidgets with hands or feet, squirms in seat
  - Leaves seat when remaining seated expected
  - Runs or climbs excessively in inappropriate situations
  - Unable to play quietly
  - '"On the go" or acts as if "driven by motor"'
  - Talks excessively
  - Impulsivity symptoms (acting without thinking)
  - Blurts out answers before questions completed
  - Difficulty waiting turn
  - Interrupts or intrudes on others
  - Functional impairment (school, home, peer relationships)
  - Academic underachievement despite normal intelligence
  - Poor school performance, incomplete homework
  - Behavioral problems at school (disciplinary issues)
  - Conflict with parents, siblings, peers
  - Symptoms present in multiple settings (home AND school)
  - Age of onset before 12 years
  - Symptoms persist for at least 6 months
workup:
  - Clinical history (comprehensive)
  - ADHD symptoms
  - Onset and duration (symptoms must be present for at least 6 months)
  - Age of onset (must be before age 12 years)
  - Inattention symptoms (at least 6 for children, 5 for adolescents age greater than or equal to 17 years)
  - Hyperactivity-impulsivity symptoms (at least 6 for children, 5 for adolescents age greater than or equal to 17 years)
  - Settings affected (must be present in 2 or more settings: home, school, activities)
  - Degree of functional impairment (academic, social, family)
  - Developmental and medical history
  - Pregnancy and birth history (prematurity, low birth weight, prenatal exposures)
  - Developmental milestones (rule out intellectual disability or developmental delay)
  - Sleep patterns (sleep disorders can mimic ADHD)
  - Hearing and vision screening results
  - Medical conditions (thyroid disorder, anemia, lead exposure)
  - Medications (can cause or worsen inattention - antihistamines, anticonvulsants)
  - Head trauma or neurologic problems
  - Psychiatric history
  - Anxiety disorders (can present with inattention)
  - Depression (can cause poor concentration)
  - Oppositional defiant disorder (high comorbidity with ADHD)
  - Conduct disorder, substance abuse (adolescents)
  - Autism spectrum disorder (comorbid in 50-70% of cases)
  - Learning disorders (dyslexia, dyscalculia)
  - Tics or Tourette syndrome
  - Family history
  - ADHD (highly heritable, 75% genetic heritability)
  - Learning disabilities, intellectual disability
  - Mental health disorders (anxiety, depression, bipolar, substance abuse)
  - School history
  - Academic performance (grades, achievement tests)
  - Previous retention or need for academic supports
  - IEP or 504 plan in place
  - Teacher reports of behavior and attention
  - Social history
  - Family structure and stressors
  - Parenting style and discipline practices
  - Adverse childhood experiences (trauma, abuse, neglect)
  - Home environment (chaos, consistency)
  - Physical examination
  - Growth parameters (height, weight, BMI) - baseline before medication
  - Vital signs (blood pressure, heart rate) - baseline before stimulant medication
  - General physical examination (usually normal)
  - Dysmorphic features (fetal alcohol syndrome, genetic syndromes)
  - Neurocutaneous findings (neurofibromatosis, tuberous sclerosis)
  - Neurologic examination
  - Observe behavior during visit (activity level, attention span, impulsivity)
  - Assess for tics, abnormal movements
  - Vision and hearing screening (if not recently done)
  - Diagnostic criteria (DSM-5)
  - Inattention: at least 6 symptoms (5 if age greater than or equal to 17 years) present for 6 months
  - Hyperactivity-impulsivity: at least 6 symptoms (5 if age greater than or equal to 17 years) present for 6 months
  - Symptoms present before age 12 years
  - Symptoms present in 2 or more settings (e.g., home, school, activities)
  - Clear evidence symptoms interfere with functioning
  - Symptoms not better explained by another mental disorder
  - ADHD subtypes
  - Predominantly inattentive presentation
  - Predominantly hyperactive-impulsive presentation
  - Combined presentation (most common - both inattention and hyperactivity-impulsivity)
  - Standardized rating scales (ESSENTIAL for diagnosis)
  - Obtain from multiple informants (parent AND teacher)
  - Vanderbilt ADHD Diagnostic Rating Scales (parent and teacher versions)
  - Assesses ADHD symptoms and comorbidities, screens for ODD, conduct disorder, anxiety, depression
  - Conners Rating Scales (parent, teacher, self-report)
  - ADHD Rating Scale-5
  - Broad-band scales (assess multiple domains)
  - Child Behavior Checklist (CBCL)
  - Behavior Assessment System for Children (BASC)
  - Laboratory testing
  - NOT routinely indicated for ADHD diagnosis
  - Consider if clinical indications
  - Thyroid function tests (TSH, free T4) if symptoms of thyroid disorder
  - Lead level if risk factors for lead exposure (pica, old housing)
  - Ferritin if symptoms of anemia or restless leg syndrome
  - Neuroimaging, EEG NOT indicated for uncomplicated ADHD
treatment:
  - Multimodal approach: behavioral interventions + medication (most effective combination)
  - Behavioral interventions
  - Parent behavior training (FIRST-LINE for preschool age 4-5 years, before medication)
  - Positive reinforcement, structured routines, clear expectations
  - Time-out, response cost, token economy
  - Programs: Parent-Child Interaction Therapy (PCIT), Triple P, Incredible Years
  - School interventions
  - IEP (Individualized Education Program) if qualifies under IDEA (Other Health Impairment)
  - 504 Plan if does not qualify for IEP (accommodations)
  - Accommodations: preferential seating, extended time, breaks, reduced distractions
  - Daily report card linking home and school
  - Organizational skills training
  - Classroom behavioral management strategies
  - Child-focused interventions
  - Organizational skills training
  - Social skills training
  - Cognitive-behavioral therapy (CBT) for older children and adolescents
  - Exercise and physical activity (beneficial for ADHD symptoms)
  - Medication (evidence-based, first-line for school-age children)
  - Stimulant medications (first-line pharmacotherapy, 70-80% response rate)
  - Methylphenidate-based
  - Short-acting (duration 3-5 hours)
  - Methylphenidate (Ritalin) 5-20 mg 2-3 times daily
  - Starting dose: 5 mg twice daily, titrate by 5-10 mg weekly
  - Intermediate-acting (duration 6-8 hours)
  - Methylphenidate ER (Ritalin SR, Metadate ER) 10-60 mg once daily
  - Long-acting (duration 10-12 hours)
  - Methylphenidate ER (Concerta) 18-72 mg once daily morning
  - Methylphenidate ER (Focalin XR) 5-40 mg once daily morning
  - Methylphenidate patch (Daytrana) 10-30 mg patch, wear 9 hours
  - Amphetamine-based
  - Short-acting (duration 4-6 hours)
  - Dextroamphetamine (Dexedrine) 5-40 mg daily divided 2-3 times
  - Mixed amphetamine salts (Adderall) 5-40 mg daily divided 2-3 times
  - Starting dose: 5 mg once or twice daily, titrate by 5 mg weekly
  - Long-acting (duration 10-12 hours)
  - Mixed amphetamine salts XR (Adderall XR) 5-30 mg once daily morning
  - Lisdexamfetamine (Vyvanse) 20-70 mg once daily morning
  - Side effects: decreased appetite, weight loss, insomnia, irritability, headache, stomachache
  - Monitor growth (height, weight), vital signs (BP, HR)
  - Temporary tic exacerbation possible (not contraindication)
  - Drug holidays (weekends, summers) sometimes used but may impair functioning
  - Non-stimulant medications (second-line or if stimulants ineffective/not tolerated)
  - Atomoxetine (Strattera)
  - Norepinephrine reuptake inhibitor
  - Starting dose: 0.5 mg/kg/day for 7 days, then increase to 1.2 mg/kg/day (max 100 mg)
  - Takes 4-6 weeks for full effect (unlike stimulants which work immediately)
  - Benefits: not controlled substance, 24-hour coverage, less appetite suppression
  - Side effects: decreased appetite, nausea, sedation (give at night if sedating), rarely hepatotoxicity
  - Black box warning: suicidal ideation (monitor)
  - Guanfacine extended-release (Intuniv)
  - Alpha-2 agonist
  - Dose: 1-4 mg once daily
  - Benefits: helps hyperactivity and impulsivity, helps sleep, improves tics
  - Side effects: sedation, hypotension, bradycardia (monitor BP and HR)
  - Taper when discontinuing (avoid rebound hypertension)
  - Clonidine extended-release (Kapvay)
  - Alpha-2 agonist
  - Dose: 0.1-0.4 mg divided twice daily
  - Similar to guanfacine
  - Bupropion (Wellbutrin)
  - Off-label for ADHD
  - Dose: 3-6 mg/kg/day divided twice daily (max 300-450 mg)
  - Contraindicated if seizure disorder (lowers seizure threshold)
  - Medication monitoring
  - Baseline: height, weight, BMI, blood pressure, heart rate
  - Follow-up: every 3 months during titration, then every 6-12 months
  - Monitor growth, vital signs, side effects, efficacy
  - Consider EKG before stimulants if personal or family history of cardiac disease, syncope, or arrhythmia
  - Medication management pearls
  - Start low, go slow, titrate to optimal dose based on response and tolerability
  - May need to try multiple medications (methylphenidate versus amphetamine, different formulations)
  - Combination therapy sometimes used (e.g., stimulant + guanfacine)
  - Treat comorbidities (anxiety, ODD)
  - Dietary interventions
  - Balanced diet, avoid excessive sugar and artificial additives (limited evidence)
  - Omega-3 fatty acid supplementation modest benefit (adjunct, not first-line)
  - Iron supplementation if iron deficiency present
clinical_pearls:
  - 'ADHD is clinical diagnosis based on DSM-5 criteria: 6+ symptoms (inattention and/or hyperactivity-impulsivity), present greater than 6 months, before age 12, in 2+ settings, with impairment'
  - 'Standardized rating scales from parent AND teacher are ESSENTIAL - subjective report alone insufficient'
  - 'Behavioral parent training first-line for preschool age (4-5 years) before considering medication'
  - 'Stimulant medications (methylphenidate or amphetamine) are first-line pharmacotherapy for school-age children - 70-80% response rate'
  - 'Multimodal treatment (medication + behavioral interventions + school supports) most effective for ADHD'
  - 'High comorbidity: ODD (50%), anxiety (30%), learning disorders (30%), depression (20%), autism (50-70%)'
  - 'Growth monitoring important with stimulants - may cause decreased appetite and weight loss, usually stabilizes over time'
  - 'No specific laboratory tests or neuroimaging for ADHD diagnosis - rule out mimics (thyroid, anemia, lead, sleep disorder)'
referrals:
  - Developmental-behavioral pediatrics or child psychiatry for diagnostic clarification, comorbid conditions, or refractory symptoms
  - Neuropsychological testing if concern for learning disorder, intellectual disability, or complex profile
  - School psychologist for IEP or 504 plan evaluation and accommodations
  - Mental health counseling for behavioral interventions, family therapy, CBT
differentials:
  - ADHD (combined, inattentive, or hyperactive-impulsive presentation)
  - Normal developmental variation (active toddler/preschooler, high energy)
  - Oppositional defiant disorder (ODD) - defiant, argumentative, often comorbid with ADHD
  - Anxiety disorders (inattention due to worry and rumination)
  - Depression (poor concentration, lack of motivation, anhedonia)
  - Learning disorders (inattention specific to academic tasks - dyslexia, dyscalculia)
  - Autism spectrum disorder (inattention, hyperactivity, restricted interests, social deficits)
  - Intellectual disability (global cognitive delay, low IQ)
  - Sleep disorders (sleep apnea, insufficient sleep, insomnia causing daytime inattention)
  - Trauma or adverse childhood experiences (PTSD symptoms mimic ADHD)
  - Thyroid disorder (hyperthyroidism can cause hyperactivity, hypothyroidism can cause inattention)
