urgency: medium
description: Comprehensive evaluation and management of Hemorrhagic Stroke (Intracerebral
  Hemorrhage)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden severe headache with onset during exertion
- Altered level of consciousness (drowsiness to coma)
- 'Focal neurologic deficits: Hemiparesis, aphasia, visual defects'
- Nausea, vomiting (from increased ICP)
- Seizures (10-15%, more common than ischemic stroke)
- Markedly elevated blood pressure (often >200/120)
- Noncontrast CT shows hyperdense blood in brain parenchyma
- 'Common locations: Basal ganglia (hypertension), lobar (amyloid angiopathy)'
workup: []
treatment:
- 'Guideline-based treatment options for Hemorrhagic Stroke (Intracerebral Hemorrhage)
  include:'
- 'Immediate: Noncontrast CT head, reverse anticoagulation, BP control, neurosurgery
  consult (ACEP 2023)'
- 'Reverse anticoagulation: Warfarin (PCC + vit K), DOACs (idarucizumab for dabigatran,
  andexanet for Xa inhibitors) (ACEP 2023)'
- 'BP control: Nicardipine 5mg/hr IV titrated to SBP 140-160 (avoid aggressive lowering)
  (ACEP 2023)'
- 'ICP management: Elevate HOB 30°, maintain CPP >60, consider mannitol/hypertonic
  saline if herniation (ACEP 2023)'
- 'Disposition: ICU admission, neurosurgery evaluation for surgical evacuation vs
  observation (ACEP 2023)'
clinical_pearls:
- 'Reverse anticoagulation immediately: Vitamin K 10mg IV + PCC (or FFP if no PCC)
  for warfarin'
- 'BP lowering: Target SBP 140-160 mmHg (lower mortality, but avoid <140 - worsens
  outcomes)'
- 'Avoid rapid BP drop: Use nicardipine or labetalol IV, titrate slowly'
- 'Neurosurgery consult: For cerebellar hemorrhage >3cm, hydrocephalus, mass effect'
- 'Hold tPA/anticoagulation: Contraindicated, will worsen bleeding'
- 'ICH score predicts mortality: GCS + ICH volume + intraventricular extension + age
  + location'
