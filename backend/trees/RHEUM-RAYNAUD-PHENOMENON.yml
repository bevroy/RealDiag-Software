tree_id: RHEUM-RAYNAUD-PHENOMENON
name: Raynaud Phenomenon
family: Rheumatology
specialty: Rheumatology
chief_complaint: Fingers turn white and blue in cold
description: Vasospastic disorder causing episodic digital color changes (white, blue, red) triggered by cold or stress. Primary Raynaud benign and self-limited, secondary Raynaud associated with autoimmune disease requiring investigation.
icd10: I73.00
snomed: 266261006
presentations:
  - Episodic color changes in digits: white (pallor), blue (cyanosis), red (reperfusion)
  - Triggered by cold or stress
  - Numbness, tingling, pain
  - Primary: no underlying disease
  - Secondary: associated with connective tissue disease
urgency: routine

workup:
  - Clinical diagnosis: episodic triphasic color changes of digits triggered by cold or emotional stress
  - Classic triphasic: white (ischemia from vasospasm), blue (cyanosis), red (reperfusion hyperemia)
  - Not all phases occur in every episode (biphasic common)
  - Symmetric: typically affects multiple fingers bilaterally, spares thumbs (thumb involvement suggests secondary)
  - Duration: episodes last minutes to hours, resolves with rewarming
  - Triggers: cold exposure (most common), emotional stress, vibrating tools
  - Primary vs secondary Raynaud:
  - Primary (80%): young women, symmetric, no tissue damage, normal nailfold capillaries, negative autoantibodies, benign course
  - Secondary (20%): older onset, asymmetric, digital ulcers or necrosis, abnormal nailfold capillaries, positive autoantibodies, associated autoimmune disease
  - Screen for secondary causes: scleroderma (most common), SLE, Sjögren, rheumatoid arthritis, mixed connective tissue disease
  - Labs: ANA, ESR, CRP, rheumatoid factor if concern for secondary
  - Nailfold capillaroscopy: abnormal tortuous dilated capillaries with dropout areas suggests secondary Raynaud (scleroderma)
  - Digital ulcers or gangrene: indicates severe secondary Raynaud requiring aggressive treatment
  - Red flags for secondary: older age at onset (above 30), male, asymmetric, digital ulcers, thumb involvement, associated symptoms (arthritis, dry eyes/mouth, skin thickening)

treatment:
  - Non-pharmacologic (first-line for primary Raynaud):
  - Avoid cold exposure: dress warmly (layers, gloves, mittens, warm socks), avoid air conditioning
  - Hand warmers: chemical or battery-powered in pockets
  - Avoid triggers: smoking cessation (nicotine causes vasoconstriction), avoid vasoconstricting medications (beta-blockers, decongestants)
  - Stress management: relaxation techniques if stress-triggered
  - Biofeedback: teaches warming techniques
  - Pharmacologic treatment (for frequent or severe episodes):
  - Calcium channel blockers (first-line): nifedipine extended-release 30-90 mg daily or amlodipine 5-10 mg daily
  - Vasodilation reduces frequency and severity of attacks
  - Side effects: headache, peripheral edema, flushing (often improve with time)
  - Alternative vasodilators: losartan 50 mg daily, fluoxetine 20 mg daily (serotonin reuptake inhibition causes vasodilation)
  - Topical nitroglycerin: 2% ointment to affected fingers during attack (acute treatment)
  - Phosphodiesterase-5 inhibitors: sildenafil 20-50 mg BID for severe refractory cases or digital ulcers
  - Prostacyclin analogs: iloprost IV infusion for critical ischemia with digital ulcers (hospital-based)
  - Botulinum toxin injections: into fingers for severe refractory Raynaud (investigational)
  - Digital ulcer care: keep clean and dry, topical antibiotics, pain control, aggressive vasodilator therapy
  - Surgical sympathectomy: rarely performed, high recurrence rate
  - Treat underlying autoimmune disease: if secondary Raynaud, treat primary condition

clinical_pearls:
  - Episodic digital color changes (white-blue-red) triggered by cold or stress
  - Primary Raynaud benign: young women, symmetric, no tissue damage, normal labs
  - Secondary Raynaud: older onset, asymmetric, digital ulcers, associated autoimmune disease
  - Screen for scleroderma if secondary suspected (most common cause)
  - Avoid cold and smoking cessation most important interventions
  - Calcium channel blockers (nifedipine) first-line medication
  - Red flags for secondary: older age, male, asymmetric, thumb involvement, digital ulcers
  - Nailfold capillaroscopy abnormal in scleroderma

differentials:
  - Acrocyanosis: persistent blue discoloration of hands and feet (not episodic), worsened by cold, benign, no ischemia
  - Peripheral artery disease: claudication with walking, diminished pulses, older patients, atherosclerotic risk factors
  - Buerger disease (thromboangiitis obliterans): young male smokers, affects feet more than hands, digital gangrene
  - Thoracic outlet syndrome: arm numbness and color changes with overhead activities, positive Adson test

trace: |
  A 28-year-old woman presented with 3 years of fingers turning white then blue when exposed to cold. Occurs in winter when going outside or grabbing items from freezer. Affects index, middle, and ring fingers bilaterally (spares thumbs). Episodes last 10-20 minutes, fingers become painful and numb during attack. Rewarming causes fingers to turn bright red with throbbing pain then return to normal color. No skin ulcers. No joint pain, dry eyes, or skin changes. Non-smoker. Exam: normal nailbeds, capillaries, pulses, no digital ulcers, no skin thickening. Labs: ANA negative, ESR 8, normal CBC. Nailfold capillaroscopy: normal capillary pattern. Diagnosed with primary Raynaud phenomenon (young woman, symmetric, spares thumbs, no tissue damage, negative autoantibodies, normal capillaries). Counseled on avoiding cold: dress in layers, wear insulated gloves before going outside, use hand warmers in pockets. Avoid smoking. Avoid beta-blockers and decongestants. Episodes frequent (daily in winter) and bothersome. Started nifedipine extended-release 30 mg daily. At 2 weeks headache and ankle swelling (side effects), counseled usually improve. At 4 weeks side effects resolved, frequency of attacks reduced by 60%. At 8 weeks increased nifedipine to 60 mg daily. At 3 months excellent control, rare attacks only with extreme cold exposure, quality of life improved. Continues nifedipine, may reduce dose in summer months. Annual monitoring for development of autoimmune disease (low risk given primary Raynaud).
