tree_id: DERM-URTICARIA-CHRONIC
name: Chronic Urticaria
family: Dermatology
specialty: Allergy/Immunology
chief_complaint: Recurrent hives
description: Recurrent pruritic wheals lasting >6 weeks, typically idiopathic autoimmune in nature. High-dose antihistamines suppress symptoms, omalizumab highly effective for refractory disease.
icd10: L50.8
snomed: 402408005
urgency: non-urgent

workup:
  - Clinical diagnosis: recurrent episodes of wheals (raised erythematous pruritic lesions) and/or angioedema occurring most days of week for >6 weeks
  - Individual lesions last <24 hours, clear completely without scarring or pigmentation (key differentiating feature)
  - Chronic spontaneous urticaria (CSU): most common, no identifiable trigger (70% idiopathic, 30% autoimmune)
  - Chronic inducible urticaria: specific triggers (physical stimuli - pressure, cold, heat, sun, vibration, aquagenic)
  - Limited testing recommended: CBC with differential (exclude eosinophilia), ESR/CRP (inflammation), TSH (thyroid association)
  - Extensive allergy testing NOT recommended: food/environmental allergies rarely cause chronic urticaria (more common in acute urticaria <6 weeks)
  - Consider C4, C1 esterase inhibitor level and function if angioedema without wheals (hereditary angioedema)
  - Rule out urticarial vasculitis: if lesions last >24 hours, painful rather than pruritic, leave bruising - needs skin biopsy

treatment:
  - Second-generation H1 antihistamines (first-line): cetirizine 10 mg daily, loratadine 10 mg daily, fexofenadine 180 mg daily, levocetirizine 5 mg daily
  - If inadequate response after 2 weeks: increase dose up to 4-fold (cetirizine 20-40 mg daily, fexofenadine 360-720 mg daily)
  - High-dose antihistamines safe and effective for chronic urticaria (licensed at standard dose but higher doses commonly used off-label)
  - Avoid first-generation antihistamines (diphenhydramine, hydroxyzine) - sedating, anticholinergic side effects
  - Add H2 blocker: famotidine 20 mg BID (may provide additional benefit when combined with H1 blocker)
  - Leukotriene receptor antagonist: add montelukast 10 mg daily if antihistamines inadequate
  - Omalizumab (anti-IgE monoclonal antibody): 150-300 mg SC monthly for antihistamine-refractory chronic spontaneous urticaria (highly effective 70% complete response)
  - Short course oral corticosteroids: prednisone 40-60 mg daily x3-7 days for severe flares (not for chronic use - significant side effects)
  - Cyclosporine 3-5 mg/kg/day: alternative immunosuppressant if omalizumab fails or unavailable (requires monitoring)
  - Avoid triggers if identified: NSAIDs worsen urticaria in 30%, tight clothing (pressure urticaria), hot showers
  - Reassurance: chronic urticaria typically improves over time, 50% resolve within 1 year

clinical_pearls:
  - Pruritic wheals >6 weeks definition, individual lesions last <24 hours
  - Most cases chronic spontaneous urticaria (idiopathic) - extensive allergy testing NOT needed
  - Second-generation H1 antihistamines first-line - can safely increase up to 4-fold dose
  - Omalizumab highly effective for antihistamine-refractory disease - 70% complete response
  - Avoid first-generation antihistamines (sedating)
  - NSAIDs worsen urticaria in 30% - avoid if possible
  - If lesions last >24 hours or leave bruising consider urticarial vasculitis - needs biopsy
  - 50% spontaneously resolve within 1 year

differentials:
  - Acute urticaria: wheals <6 weeks duration, often allergic trigger (food, medication)
  - Urticarial vasculitis: lesions last >24 hours, painful, leave bruising, low C3/C4, biopsy shows leukocytoclastic vasculitis
  - Hereditary angioedema: recurrent angioedema without wheals, abdominal pain, low C4 and C1 esterase inhibitor
  - Mastocytosis: urticaria pigmentosa (brown macules that urticaria with stroking - Darier sign), elevated tryptase

trace: |
  A 32-year-old woman presented with 4 months of daily pruritic hives affecting various body sites (arms, legs, trunk). Individual wheals appeared suddenly, lasted 4-12 hours then resolved completely without trace. Affecting quality of life and sleep. No obvious triggers identified. No angioedema. No medications or new foods. Exam during flare showed multiple erythematous raised wheals 1-3 cm diameter. Labs showed CBC normal, ESR 8, TSH normal. Diagnosed with chronic spontaneous urticaria. Started cetirizine 10 mg daily. At 2 weeks partial improvement but still daily hives. Increased cetirizine to 20 mg daily (double dose). At 4 weeks significant improvement, hives 2-3 times per week instead of daily. At 8 weeks increased to 30 mg daily for complete control. At 12 weeks excellent control on cetirizine 30 mg daily, rare breakthrough hives, minimal impact on life. At 6 months attempted taper to 20 mg daily but hives returned, resumed 30 mg daily. At 12 months spontaneous improvement, tapered successfully to 10 mg daily then discontinued. At 18 months remains hive-free off treatment (spontaneous remission).
