tree_id: CARDS-TAKOTSUBO-CARDIOMYOPATHY
name: Takotsubo Cardiomyopathy (Stress Cardiomyopathy)
family: Cardiology
specialty: Cardiology
chief_complaint: Chest pain after emotional stress
description: Acute reversible cardiomyopathy triggered by emotional or physical stress causing apical ballooning and mimicking MI, postmenopausal women most affected. Normal coronaries on angiography distinguish from ACS. Supportive care, full recovery in weeks to months, low recurrence rate.
icd10: I51.81
snomed: 71772001
presentations:
  - Acute chest pain mimicking MI
  - Dyspnea
  - Emotional or physical stressor preceding onset
  - ECG changes similar to MI
  - Transient apical ballooning on echo
  - Predominantly postmenopausal women
urgency: emergent

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Clinical presentation: mimics acute MI
  - Chest pain: acute substernal chest pain
  - Dyspnea: from acute heart failure
  - Syncope: rarely
  - Emotional trigger (75%): death of loved one, bad news, argument, intense fear, surprise party (happy events too)
  - Physical trigger (25%): surgery, acute illness, exacerbation of chronic disease
  - Demographics: postmenopausal women 90%, average age 60-75 years
  - Physical exam: variable from normal to cardiogenic shock
  - Tachycardia, hypotension if severe
  - Pulmonary edema if heart failure
  - Signs similar to acute MI
  - ECG: ST elevations (anterolateral leads) or T wave inversions (diffuse, deep)
  - Mimics STEMI or NSTEMI
  - QTc prolongation common (risk of torsades)
  - Cardiac biomarkers:
  - Troponin: elevated but modest (peak troponin I usually below 10 ng/mL, much less than expected for degree of wall motion abnormality)
  - BNP: markedly elevated (often over 1000)
  - Coronary angiography (essential to distinguish from MI):
  - Normal coronaries or non-obstructive CAD (below 50% stenosis)
  - Rules out acute coronary syndrome
  - Echocardiogram or ventriculography (diagnostic):
  - Apical ballooning: akinesis or dyskinesis of apical and mid LV segments with hyperkinetic base (classic pattern 80%)
  - Other patterns: mid-ventricular, basal, focal variants
  - Circumferential pattern extending beyond single coronary territory (distinguishes from MI)
  - Reduced EF (30-50% typically)
  - Dynamic LVOT obstruction: may develop in 10-20% from hyperkinetic basal septum
  - Mayo Clinic diagnostic criteria (2008):
  - Transient hypokinesis, akinesis, or dyskinesis of LV mid segments with or without apical involvement
  - Regional wall motion abnormalities extend beyond single coronary territory
  - Absence of obstructive CAD or acute plaque rupture
  - New ECG abnormalities (ST elevation or T wave inversion) or modest troponin elevation
  - Absence of pheochromocytoma or myocarditis
  - Cardiac MRI: myocardial edema without late gadolinium enhancement (no scar - distinguishes from MI)
  - Mechanism: catecholamine surge causes myocardial stunning (direct myocardial toxicity, microvascular dysfunction, coronary spasm)

treatment:
  - Supportive care (most important - self-limited condition):
  - Hemodynamic support: IV fluids if hypotension, inotropes (dobutamine, milrinone) if cardiogenic shock
  - Avoid high-dose inotropes if LVOT obstruction present (worsens obstruction)
  - Mechanical support: IABP, Impella, or ECMO if refractory cardiogenic shock (rare)
  - Heart failure management:
  - ACE inhibitors or ARBs: started in hospital, reduce afterload
  - Beta blockers: theoretically beneficial (blunt catecholamine effects), but benefit not proven
  - Diuretics: if volume overload
  - LVOT obstruction management (if present):
  - Avoid inotropes and vasodilators: worsen obstruction
  - Beta blockers: reduce obstruction
  - Fluid resuscitation: increase preload
  - Anticoagulation: if LV thrombus develops (rare) or severely reduced EF with akinetic apex
  - Aspirin and antiplatelet: consider initially until MI ruled out, then often discontinued
  - Duration of treatment: continue ACE inhibitor and beta blocker x3-6 months until recovery
  - Prognosis:
  - Complete recovery: EF normalizes in days to weeks (median 2-4 weeks)
  - Repeat echo at 4-6 weeks shows normal LV function in over 95%
  - In-hospital complications: cardiogenic shock (5-10%), VT/VF (rare), LV thrombus (rare), LV rupture (very rare)
  - Mortality: 1-5% (lower than MI but not benign)
  - Recurrence: 5-10% over 5 years (relatively low)
  - Stress reduction and counseling: address triggers, consider psychiatric evaluation if severe

clinical_pearls:
  - Acute chest pain after emotional stress in postmenopausal woman
  - Mimics MI: chest pain, ST elevations, troponin elevated
  - Normal coronaries on angiography distinguish from ACS
  - Apical ballooning on echo (circumferential beyond single coronary territory)
  - Troponin elevated but modest (less than expected for wall motion abnormality)
  - Full recovery in weeks to months (95% normalize EF)
  - Supportive care main treatment, self-limited condition
  - Low recurrence rate (5-10%)
  - Also called broken heart syndrome

differentials:
  - Acute MI: obstructive CAD on angiography, regional wall motion abnormality in single coronary territory
  - Myocarditis: similar presentation but viral prodrome, may have pericardial involvement, slower recovery
  - Pheochromocytoma: catecholamine surge causes similar cardiomyopathy, elevated metanephrines
  - Cocaine-induced cardiomyopathy: toxin exposure history, similar pathophysiology
  - Intracranial hemorrhage: subarachnoid hemorrhage causes catecholamine surge and similar cardiomyopathy

trace: |
  A 68-year-old woman presented to ED with acute severe chest pain. Occurred 2 hours ago immediately after receiving news that her son was in serious car accident (intense emotional stress - classic trigger). Substernal crushing chest pain, dyspnea, diaphoretic. No prior cardiac history. Exam: BP 95/60 (hypotensive), HR 105, tachypneic, cold and clammy, bibasilar rales (pulmonary edema). ECG: ST elevations in leads V2-V6, I, aVL (anterior and lateral - concerning for large STEMI). Troponin I 2.5 ng/mL (elevated). Activated cath lab for presumed STEMI. Emergent coronary angiography: normal coronary arteries, no stenosis, no dissection, no thrombus (ruled out acute MI despite ST elevations and chest pain). Left ventriculography during cath: severe apical and mid-ventricular akinesis with apical ballooning, hyperkinetic base, EF 35% (classic takotsubo pattern - looks like Japanese octopus trap). Diagnosed with takotsubo (stress-induced) cardiomyopathy (acute chest pain after emotional stress, ST elevations, apical ballooning on ventriculography, normal coronaries - meets Mayo criteria). Admitted to CCU for monitoring. Started IV fluids for hypotension, lisinopril 5 mg daily, metoprolol 25 mg BID (beta blocker may blunt catecholamine effects). Diuretics held initially given hypotension. BNP 1850 (markedly elevated). At 24 hours hemodynamically stable, BP improved to 110/70. Echocardiogram: confirmed apical ballooning pattern, severe apical akinesis, hyperkinetic base, EF 35%, no LVOT obstruction, no LV thrombus. Troponin peaked at 3.8 ng/mL (modest elevation relative to severe wall motion abnormality - distinguishes from MI). QTc prolonged to 520 ms (risk of torsades - monitored on telemetry). At 48 hours pulmonary edema resolved with diuresis. Transferred to step-down unit. Cardiac MRI at day 3: apical and mid-ventricular wall edema (acute injury), no late gadolinium enhancement (no scar - rules out MI, confirms takotsubo). Stress reduction counseling, discussed emotional trigger. At 1 week discharged on lisinopril, metoprolol, aspirin. Follow-up echo at 4 weeks: complete resolution of wall motion abnormalities, EF normalized to 60% (full recovery - typical for takotsubo). Discontinued aspirin, continued lisinopril and metoprolol x3 months then reassess. At 3 months: asymptomatic, echo normal EF 62%, stopped medications. Counseled on 5-10% recurrence risk, stress management techniques. At 1 year: no recurrence, excellent functional status. Complete recovery from takotsubo cardiomyopathy.

