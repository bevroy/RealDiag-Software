tree_id: PED-CONSTIPATION
name: Constipation (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/Gastroenterology
icd10: K59.00
snomed: 14760008
urgency: []
homeopathy: []
presentations:
  - Infrequent bowel movements (less than 3 per week)
  - Hard, pellet-like, or large-caliber stools
  - Painful defecation (crying, straining, or withholding)
  - Abdominal pain or cramping
  - Fecal withholding behaviors (crossing legs, dancing, hiding, stiffening body)
  - Blood on stool surface or toilet paper (from anal fissures)
  - Fecal soiling or encopresis (overflow incontinence)
  - Abdominal distension
  - Decreased appetite
  - Irritability
workup:
  - Clinical history
  - Stool frequency, consistency, size
  - Age of onset (birth suggests Hirschsprung disease)
  - Pain with defecation
  - Withholding behaviors
  - Fecal soiling (overflow incontinence suggests fecal impaction)
  - Dietary history (fiber, fluids, milk intake)
  - Toilet training history and stresses
  - Developmental milestones
  - Medications (iron, opioids, anticholinergics)
  - Red flag symptoms
  - Failure to pass meconium in first 48 hours of life
  - Ribbon-like stools
  - Failure to thrive
  - Severe abdominal distension
  - Bilious vomiting
  - Perianal abnormalities
  - Lower extremity weakness or absent reflexes
  - Physical examination
  - Growth parameters (height, weight, BMI)
  - Abdominal examination
  - Distension
  - Palpable stool in left lower quadrant or suprapubic area
  - Tenderness
  - Masses
  - External anorectal examination
  - Perianal skin tags, fissures, fistulas
  - Position of anus (anteriorly displaced)
  - Sacral dimple or tuft of hair (spinal dysraphism)
  - Digital rectal examination (if indicated)
  - Anal tone (increased in Hirschsprung, decreased in neurologic)
  - Stool in rectal vault (absent in Hirschsprung, present in functional)
  - Masses or hard stool
  - Neurologic examination
  - Lower extremity strength, tone, reflexes
  - Cremasteric reflex
  - Laboratory and imaging
  - Generally NOT needed for functional constipation
  - Indications for further workup (red flags present)
  - Thyroid function tests (TSH) if concern for hypothyroidism
  - Celiac serologies if failure to thrive
  - Lead level if pica or environmental exposure
  - Calcium level if hypercalcemia suspected
  - Abdominal X-ray
  - Can confirm fecal impaction (large stool burden)
  - Not routinely needed if diagnosis clear on exam
  - Colonic transit study if refractory constipation
  - Anorectal manometry if concern for Hirschsprung disease
  - Barium enema or rectal biopsy for Hirschsprung diagnosis
treatment:
  - Functional constipation management (95% of cases)
  - Disimpaction (if fecal impaction present)
  - Oral approach (preferred)
  - Polyethylene glycol 3350 (MiraLAX) 1-1.5 g/kg/day for 3-6 days
  - Maximum 17 g (one capful) per day
  - Mix in 4-8 oz liquid
  - High-dose mineral oil 15-30 mL/year of age per day (max 240 mL/day) for 3-4 days
  - Avoid in children under 1 year or with aspiration risk
  - Rectal approach (if oral not tolerated)
  - Glycerin suppository (infants)
  - Saline or phosphate enema (children over 2 years)
  - "2-5 years: 6 oz (pediatric Fleet)"
  - "5-12 years: 4.5 oz (adult Fleet)"
  - Avoid repeated phosphate enemas (electrolyte disturbances)
  - Maintenance therapy (after disimpaction)
  - Polyethylene glycol 3350 (MiraLAX) - FIRST-LINE
  - Starting dose: 0.4-0.8 g/kg/day (typically 1 capful = 17 g daily)
  - Titrate to achieve soft daily stools
  - Safe for long-term use (months to years)
  - Lactulose 1-2 mL/kg/day divided BID
  - Alternative to PEG, less palatable
  - Sorbitol 1-3 mL/kg/day divided BID
  - Similar to lactulose, less expensive
  - Mineral oil 1-3 mL/kg/day (max 90 mL/day)
  - Avoid in children under 1 year
  - Can cause fat-soluble vitamin deficiency with prolonged use
  - Senna (stimulant laxative)
  - Second-line, for short-term use
  - Dose varies by age and formulation
  - Risk of tolerance with prolonged use
  - Dietary modifications
  - Increase fiber intake
  - "Age + 5 grams per day (e.g., 8-year-old needs 13 g/day)"
  - Fruits, vegetables, whole grains, legumes
  - Fiber supplements (Benefiber, Metamucil) if dietary intake insufficient
  - Adequate fluid intake
  - "1-3 years: 4 cups/day"
  - "4-8 years: 5 cups/day"
  - "9+ years: 7-8 cups/day"
  - Reduce cow's milk intake if excessive (greater than 24 oz/day can worsen constipation)
  - Limit constipating foods (bananas, rice, cheese)
  - Behavioral interventions
  - Regular toilet sitting after meals (gastrocolic reflex)
  - 5-10 minutes, 2-3 times daily
  - Use footstool for proper positioning
  - Positive reinforcement (sticker chart)
  - Avoid punitive approach
  - Address toilet training issues
  - Treatments NOT recommended
  - Routine cow's milk elimination (unless true milk allergy)
  - Probiotic supplements (insufficient evidence)
  - Duration of therapy
  - Continue maintenance laxatives for at least 1-2 months after regular bowel movements established
  - Gradual weaning over weeks to months
  - Relapse common if discontinued too early
  - Long-term maintenance (6-24 months) often needed
  - Red flag conditions requiring referral
  - Hirschsprung disease: delayed meconium passage, failure to thrive, enterocolitis
  - Spinal dysraphism: lower extremity weakness, absent reflexes, sacral dimple
  - Hypothyroidism: growth failure, developmental delay, fatigue
  - Celiac disease: failure to thrive, chronic diarrhea alternating with constipation
clinical_pearls:
  - 'Functional constipation accounts for 95% of pediatric constipation - no underlying organic cause'
  - 'Polyethylene glycol (MiraLAX) is first-line maintenance therapy - safe, effective, well-tolerated for long-term use'
  - 'Disimpaction required before starting maintenance therapy - cannot achieve success if impacted'
  - 'Withholding behaviors (crossing legs, hiding, stiffening) indicate painful defecation - creates vicious cycle'
  - 'Fiber recommendations: age + 5 grams per day (e.g., 5-year-old needs 10 g fiber/day)'
  - 'Toilet sitting after meals (2-3 times daily) uses gastrocolic reflex to promote regular bowel movements'
  - 'Long-term maintenance (6-24 months) often needed - gradual weaning to prevent relapse'
  - 'Red flags: delayed meconium passage (greater than 48 hours), failure to thrive, ribbon stools suggest Hirschsprung disease'
referrals:
  - Pediatric gastroenterology if refractory to treatment, red flags present, or concern for Hirschsprung disease
  - Pediatric surgery if Hirschsprung disease confirmed (rectal biopsy showing absence of ganglion cells)
  - Neurology if concern for spinal dysraphism or neurologic cause
  - Endocrinology if hypothyroidism or other metabolic disorder
differentials:
  - Functional constipation (most common - infrequent hard stools, no red flags, normal growth)
  - Hirschsprung disease (delayed meconium passage, severe constipation from birth, failure to thrive, enterocolitis)
  - Spinal dysraphism (tethered cord - constipation, urinary incontinence, lower extremity weakness)
  - Hypothyroidism (constipation, fatigue, cold intolerance, growth failure, delayed reflexes)
  - Celiac disease (constipation alternating with diarrhea, failure to thrive, abdominal distension)
  - Anal stenosis or imperforate anus (congenital anatomic abnormality)
  - Medication-induced (opioids, anticholinergics, iron supplements)
  - Cow's milk protein allergy (infants with constipation, blood in stool, eczema)
  - Fecal impaction with overflow incontinence (fecal soiling, palpable stool on exam)
