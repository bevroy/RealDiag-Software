tree_id: DERM-PRURITUS
name: Pruritus (Itching)
family: dermatology
specialty: Dermatology / Primary Care
chief_complaint: Generalized or localized itching
description: Pruritus (itching) is an unpleasant sensation that provokes desire to scratch. Can be localized or generalized, acute or chronic (>6 weeks). Causes range from primary dermatologic conditions to systemic diseases. Evaluation includes skin exam, medication review, and systemic disease screening. Treatment targets underlying cause plus symptomatic relief.
icd10: L29.9
snomed: "418290006"
presentations:
  - Generalized itching with or without visible rash
  - Localized itching (scalp, anogenital, specific body areas)
  - Worse at night (common)
  - Excoriations and lichenification from chronic scratching
  - Sleep disturbance from nighttime pruritus
  - No primary skin lesions (if systemic cause)
urgency: non-urgent (unless severe or with systemic symptoms)

referrals:
  dermatology:
    - Chronic pruritus without clear cause
    - Failed empiric treatment
    - Suspicion of bullous disease or lymphoma
  other_specialists:
    - Gastroenterology if cholestatic liver disease
    - Nephrology if chronic kidney disease
    - Hematology if malignancy suspected
    - Psychiatry if psychogenic component

workup:
  history:
    - Duration: acute (<6 weeks) vs chronic (>6 weeks)
    - Pattern: constant vs intermittent, worse at night
    - Distribution: localized vs generalized
    - Skin examination findings: primary rash vs secondary changes only (excoriations)
    - Exacerbating factors: heat, water, stress, specific activities
    - Recent medications (including new medications or changes)
    - Review of systems: weight loss, fever, night sweats, fatigue, jaundice
    - Associated symptoms: dry skin, atopy, occupational exposures
  physical_examination:
    - Complete skin exam: primary dermatosis vs secondary changes (excoriations, lichenification)
    - Lymph node exam
    - Abdominal exam (hepatosplenomegaly)
    - Jaundice assessment
  initial_laboratory_if_no_primary_rash:
    - CBC with differential (anemia, eosinophilia, malignancy)
    - CMP (renal failure, liver disease)
    - TSH (thyroid dysfunction)
    - Fasting glucose or HbA1c (diabetes)
    - LFTs including alkaline phosphatase (cholestasis)
  additional_testing_if_indicated:
    - Iron studies, ferritin (iron deficiency)
    - HIV test
    - Hepatitis B and C serologies
    - Chest X-ray (sarcoidosis, lymphoma, lung cancer)
    - Age-appropriate cancer screening
    - Skin biopsy if atypical features

causes_and_differential_diagnosis:
  dermatologic_with_primary_rash:
    - Atopic dermatitis/eczema (flexural, lichenification, personal/family atopy)
    - Contact dermatitis (exposure history, localized)
    - Psoriasis (silvery scale, extensor surfaces)
    - Urticaria (transient wheals <24 hours)
    - Scabies (burrows, webspaces, nocturnal, contacts affected)
    - Dermatitis herpetiformis (grouped vesicles, elbows/knees, associated with celiac)
    - Lichen planus (purple polygonal papules, Wickham striae)
    - Bullous pemphigoid (tense bullae, elderly)
  systemic_diseases_no_primary_rash:
    - Chronic kidney disease/uremia (most common systemic cause)
    - Cholestatic liver disease (primary biliary cholangitis, obstructive jaundice)
    - Thyroid disease (hyper or hypothyroidism)
    - Iron deficiency anemia
    - Hematologic malignancies (Hodgkin lymphoma, leukemia, polycythemia vera)
    - Solid tumor malignancies (paraneoplastic)
    - HIV/AIDS
    - Diabetes mellitus
  medications:
    - Opioids (direct histamine release)
    - Aspirin and NSAIDs
    - ACE inhibitors
    - Hydrochlorothiazide
    - Allopurinol
    - Antibiotics
  neurologic_and_psychogenic:
    - Neuropathic itch (post-herpetic, diabetic neuropathy, nerve compression)
    - Brachioradial pruritus (sun-damaged skin, cervical spine)
    - Psychogenic (depression, anxiety, delusions of parasitosis)

treatment:
  general_measures:
    - Identify and treat underlying cause
    - Discontinue offending medications if possible
    - Emollients: apply liberally and frequently (CeraVe, Cetaphil, Aquaphor)
    - Lukewarm baths (not hot), limit duration
    - Gentle cleansers, avoid harsh soaps
    - Cotton clothing, avoid wool and synthetic fabrics
    - Cool environment, humidifier if dry air
    - Trim nails short, wear cotton gloves at night to prevent scratching
  topical_therapy:
    - Topical corticosteroids: for inflammatory dermatoses
      - Low-potency (hydrocortisone 1-2.5%) for face and intertriginous
      - Mid-to-high potency (triamcinolone 0.1%) for body
    - Topical calcineurin inhibitors: tacrolimus, pimecrolimus (steroid-sparing)
    - Menthol or camphor lotions: cooling sensation (Sarna, Gold Bond)
    - Topical anesthetics: pramoxine, lidocaine
    - Capsaicin cream: for localized neuropathic itch (requires weeks of use)
  systemic_antihistamines:
    - First-generation (sedating): hydroxyzine 25-50 mg HS, diphenhydramine 25-50 mg HS
    - Second-generation (non-sedating): cetirizine 10 mg, loratadine 10 mg, fexofenadine 180 mg daily
    - Can increase dose up to 4x standard if needed
  other_systemic_therapies:
    - Gabapentin 300-900 mg HS: for neuropathic pruritus
    - Mirtazapine 7.5-15 mg HS: antihistamine and antidepressant effects
    - Doxepin 10-25 mg HS: tricyclic with strong antihistamine properties
    - SSRIs (sertraline, paroxetine): for chronic pruritus, psychogenic
    - Cholestyramine: for cholestatic pruritus (binds bile salts)
    - UV phototherapy (narrowband UVB): chronic pruritus, uremic pruritus
    - Aprepitant (NK-1 antagonist): refractory pruritus
    - Dupilumab: for atopic dermatitis
  uremic_pruritus:
    - Optimize dialysis adequacy
    - UV phototherapy
    - Gabapentin 100 mg post-dialysis
    - Topical emollients
  cholestatic_pruritus:
    - Cholestyramine 4 g TID (before meals)
    - Rifampin 150-300 mg BID
    - Naltrexone 50 mg daily (opioid antagonist)
    - Ursodeoxycholic acid for primary biliary cholangitis

clinical_pearls:
  - Chronic pruritus (>6 weeks) warrants investigation for systemic disease
  - Most common systemic cause: chronic kidney disease
  - Cholestatic pruritus often severe and refractory, worse at night
  - Nocturnal pruritus suggests scabies, atopic dermatitis, or Hodgkin lymphoma
  - Pruritus without rash (excoriations only) suggests systemic cause
  - Aquagenic pruritus (triggered by water) associated with polycythemia vera
  - Iron deficiency can cause pruritus even without anemia
  - Hodgkin lymphoma classic cause of paraneoplastic pruritus (25% of patients)
  - Brachioradial pruritus: dorsal forearms, sun-exposed, C5-C6 radiculopathy
  - Psychiatric causes: delusions of parasitosis (Morgellons), obsessive scratching

differentials:
  - See causes listed above (dermatologic vs systemic)
  - Key: presence or absence of primary rash guides differential

trace: |
  A 68-year-old woman presented with 4 months of progressive generalized itching, worst at night, disrupting sleep. No visible rash except excoriations and lichenification from chronic scratching on arms and legs. No relief with OTC antihistamines and hydrocortisone cream. Denies jaundice, weight loss, fever. No new medications. History of hypertension (on amlodipine), no other medical conditions. Exam: numerous linear excoriations and lichenified plaques on bilateral arms and legs, no primary skin lesions (no wheals, scales, vesicles), no lymphadenopathy, no hepatosplenomegaly, no jaundice. Labs: CBC normal, CMP showed Cr 3.8 mg/dL (elevated), BUN 52 mg/dL, eGFR 18 mL/min (stage 4 CKD - previously unknown), TSH 2.1 mIU/L (normal), LFTs normal, fasting glucose 98 mg/dL. Diagnosis: uremic pruritus secondary to chronic kidney disease. Referred to nephrology urgently. Started hemodialysis. For pruritus management: liberal emollients (CeraVe cream) after every shower and twice daily, hydroxyzine 25 mg at bedtime, gabapentin 100 mg after each dialysis session (renally dosed). Initiated narrowband UVB phototherapy 3 times weekly. At 4 weeks pruritus improved 50%, sleeping better. At 8 weeks pruritus improved 70%, quality of life significantly better. At 12 weeks pruritus well-controlled with maintenance regimen, continues dialysis awaiting kidney transplant evaluation.

citations:
  - AAD (American Academy of Dermatology) Guidelines for Pruritus
  - International Forum for the Study of Itch (IFSI)
  - UpToDate - Dermatology
