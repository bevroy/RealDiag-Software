tree_id: ORTHO-COSTOCHONDRITIS
name: Costochondritis
family: orthopedics
specialty: Orthopedics
icd10: M94.0
snomed: 64109004
urgency: []
homeopathy: []
presentations:
  - Sharp chest pain localized to costochondral junctions (where ribs meet sternum)
  - Pain typically affects 2nd-5th costochondral junctions
  - Tenderness with palpation over affected costochondral junctions (key diagnostic feature)
  - Pain worse with deep breathing, coughing, or upper body movement
  - Pain may radiate to chest or back
  - Can mimic cardiac chest pain (important to rule out cardiac causes)
  - Gradual onset over days to weeks (vs sudden in MI)
  - May follow respiratory infection, trauma, or unusual physical activity
  - No systemic symptoms (fever, weight loss)
workup:
  - Clinical diagnosis based on history and physical examination
  - History assessment
  - Chest pain characteristics (location, quality, duration, aggravating/relieving factors)
  - Recent trauma, unusual activity, or respiratory infection
  - Cardiac risk factors (age, hypertension, diabetes, smoking, family history)
  - Physical examination
  - Reproducible chest pain with palpation of costochondral junctions (diagnostic)
  - Multiple costochondral joints affected (usually 2nd-5th)
  - No signs of infection (fever, erythema, warmth)
  - Normal cardiovascular and respiratory exam
  - Rule out cardiac causes (if any concern)
  - ECG to rule out acute coronary syndrome, pericarditis
  - Cardiac biomarkers (troponin) if chest pain concerning for ACS
  - Chest X-ray if atypical features or respiratory symptoms
  - Normal in costochondritis
  - Rules out pneumonia, pneumothorax, rib fracture
  - Laboratory tests usually not needed
  - ESR/CRP if concern for inflammatory arthritis
  - Imaging rarely needed unless atypical presentation
treatment:
  - Reassurance (benign condition, not cardiac or serious)
  - Self-limited - most cases resolve in weeks to months
  - Pain management
  - NSAIDs first-line
  - Ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Use for 2-4 weeks as needed
  - Acetaminophen 1000 mg TID if NSAIDs contraindicated
  - Topical NSAIDs (diclofenac gel) can apply to affected area
  - Heat or ice application to chest wall (whichever provides relief)
  - Activity modification
  - Avoid aggravating activities (heavy lifting, pushing, pulling)
  - Gentle stretching exercises
  - Avoid sleeping on affected side
  - Physical therapy if persistent
  - Stretching and strengthening exercises for chest wall
  - Posture correction
  - Local injection (for refractory cases)
  - Corticosteroid + lidocaine injection into most tender costochondral junction
  - Reserved for persistent pain >2-3 months despite conservative treatment
  - Prognosis: most resolve within weeks, but can recur or become chronic
clinical_pearls:
  - "Costochondritis diagnosis of exclusion - must rule out cardiac causes first"
  - "Reproducible chest pain with palpation is key diagnostic feature"
  - "Affects 10-30% of patients presenting with chest pain to primary care"
  - "More common in women and adults <40 years old"
  - "Tietze syndrome variant: costochondritis + visible swelling of costochondral junction (rare)"
  - "Self-limited in most cases - resolves in 6-12 weeks"
  - "Can recur in 30-50% of patients"
  - "Always consider cardiac causes in patients with risk factors or concerning symptoms"
referrals:
  - Emergency department if any concern for acute coronary syndrome (unstable vitals, concerning ECG, risk factors)
  - Cardiology if cardiac evaluation needed
  - Rheumatology if systemic inflammatory condition suspected
  - Pain management if chronic refractory pain >3-6 months
differentials:
  - Costochondritis (tender costochondral junctions, reproducible pain)
  - Tietze syndrome (costochondritis + visible swelling, usually single joint)
  - Acute coronary syndrome (cardiac risk factors, abnormal ECG/troponin)
  - Pericarditis (pleuritic chest pain, pericardial friction rub, ECG changes)
  - Rib fracture (trauma history, point tenderness, visible on X-ray)
  - Pneumonia (fever, cough, dyspnea, infiltrate on chest X-ray)
  - Pneumothorax (sudden dyspnea, decreased breath sounds, visible on X-ray)
  - Gastroesophageal reflux disease (GERD) - burning chest pain, worse after meals
  - Herpes zoster (shingles) - vesicular rash in dermatomal distribution
  - Fibromyalgia (widespread pain, tender points)
  - Referred pain from cervical or thoracic spine
