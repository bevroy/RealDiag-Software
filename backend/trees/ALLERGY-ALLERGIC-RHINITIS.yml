tree_id: ALLERGY-ALLERGIC-RHINITIS
name: Allergic Rhinitis (Hay Fever)
family: Allergy
specialty: Allergy
icd10:
- J30.9
- J30.1
- J30.2
snomed:
- '61582004'
urgency: medium
description: Comprehensive evaluation and management of Allergic Rhinitis (Hay Fever)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Nasal congestion and rhinorrhea (clear discharge)
- Sneezing (often paroxysmal)
- Nasal itching
- Postnasal drip
- Itchy, watery eyes (allergic conjunctivitis)
- Itching of palate or throat
- Worse with allergen exposure (seasonal pollens, perennial dust mites, pet dander,
  mold)
- Symptoms improve when away from allergen
- May have dark circles under eyes ("allergic shiners")
- Nasal crease from frequent nose rubbing
- Pale, boggy nasal mucosa on exam
- Associated with asthma, eczema, or food allergies
workup:
- Clinical diagnosis based on history and exam
- 'Allergy testing if considering immunotherapy or unclear triggers: Skin prick test
  (preferred) or specific IgE blood test'
- Nasal endoscopy if concern for structural abnormality (polyps, deviated septum)
treatment:
- 'Guideline-based treatment options for Allergic Rhinitis include:'
- 'First-line: Intranasal corticosteroid (fluticasone, mometasone, triamcinolone)
  daily (AAAAI 2023)'
- Add non-sedating oral H1 antihistamine (cetirizine, loratadine, fexofenadine) for
  breakthrough symptoms (AAAAI 2023)
- Intranasal antihistamine (azelastine) can be added if inadequate response to steroid
  alone (AAAAI 2023)
- Allergen avoidance measures (dust mite covers, HEPA filters, pet avoidance if applicable)
- Saline nasal irrigation can provide symptom relief
- 'For severe or refractory: Allergen immunotherapy (allergy shots or sublingual tablets)
  (AAAAI 2023)'
- Avoid prolonged use of oral decongestants (pseudoephedrine) - can cause rebound
  congestion
- 'Pregnancy: Intranasal steroids generally safe (budesonide pregnancy category B)
  (AAAAI 2023)'
clinical_pearls:
- Most common allergic disorder, affects 10-30% of population
- 'Seasonal vs perennial: Seasonal (pollen - spring trees, summer grass, fall ragweed),
  Perennial (dust mites, pets, mold)'
- Often begins in childhood, can develop at any age
- Associated with asthma (80% of asthmatics have allergic rhinitis)
- Chronic inflammation can lead to sinusitis, sleep disturbance, impaired quality
  of life
- 'Allergic salute: Upward rubbing of nose causing transverse nasal crease'
- Untreated can lead to complications: chronic sinusitis, otitis media, asthma exacerbations
referrals:
- Allergy/Immunology if considering immunotherapy or unclear diagnosis
- ENT if structural abnormality, chronic sinusitis, or refractory symptoms
differentials: []
