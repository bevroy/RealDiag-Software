tree_id: RHEUM-AS
name: Ankylosing Spondylitis
family: Rheumatology
specialty: Rheumatology
icd10:
- M45.9
snomed:
- '9631008'
urgency: medium
description: Comprehensive evaluation and management of Ankylosing Spondylitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Lower back pain and stiffness
- Pain worse at rest, improves with activity
- Morning stiffness > 30 minutes
- Reduced spinal mobility
- HLA-B27 positive
- Sacroiliitis on imaging
workup:
- 'HLA-B27: 90% sensitive (positive in 90% of AS), but low specificity (8% general
  population positive)'
- 'ESR/CRP: Elevated in 50-70% (normal ESR doesn''t rule out AS)'
- 'X-ray pelvis (AP): Sacroiliitis (erosions, sclerosis, fusion), bamboo spine (late
  - syndesmophytes)'
- 'MRI SI joints: More sensitive than X-ray for early sacroiliitis - bone marrow edema
  on STIR sequence'
- 'Schober test: Mark L5, measure 10cm up. Flex forward. <5cm increase = reduced lumbar
  flexion (normal >5cm)'
treatment:
- 'Guideline-based treatment options for Ankylosing Spondylitis include:'
- 'NSAIDs (first-line): Indomethacin 50mg TID or naproxen 500mg BID continuously-
  improves stiffness, slows radiographic progression (ACR 2023)'
- 'Physical therapy: Spinal extension exercises, posture training, swimming - prevent
  fixed flexion deformity (ACR 2023)'
- 'Anti-TNF biologics: If failed NSAIDs x3 months or active disease. Etanercept 50mg
  SQ weekly, adalimumab 40mg SQ q2 weeks, infliximab 5mg/kg IV q6-8 weeks (ACR 2023)'
- 'IL-17 inhibitors: Secukinumab, ixekizumab - alternative to anti-TNF (ACR 2023)'
- 'Smoking cessation: Worse outcomes in smokers (faster radiographic progression)
  (ACR 2023)'
clinical_pearls:
- Seronegative spondyloarthropathy - chronic inflammatory back pain, male 3:1, onset
  <40 years (average 26)
- 'Inflammatory back pain features: Age <40, insidious onset, >3 months, morning stiffness
  >30 min, improves with exercise (vs mechanical back pain worse with exercise)'
- 'Bamboo spine: Late finding - syndesmophytes (bony bridges between vertebrae), complete
  spinal fusion'
- 'Extraspinal: Uveitis (25-40% - anterior, unilateral, recurrent), aortitis, apical
  pulmonary fibrosis, enthesitis (Achilles, plantar fascia)'
- 'HLA-B27: 90% of AS patients positive (vs 8% general population), but most HLA-B27+
  people never develop AS'
referrals:
- Rheumatology for diagnosis confirmation and biologic therapy
- Ophthalmology if uveitis (red eye, photophobia, pain)
differentials: []
trace:
  source: American College of Rheumatology (ACR) Guidelines, European League Against
    Rheumatism (EULAR)
