tree_id: PSYCH-MAJOR-DEPRESSION
name: Major Depressive Disorder
family: Psychiatric
specialty: Psychiatry
chief_complaint: Depressed mood
description: Mental disorder characterized by persistent depressed mood or anhedonia with cognitive, vegetative, and physical symptoms causing significant impairment

icd10: F33.1

urgency: urgent

workup:
  - DSM-5 criteria require at least 5 symptoms present during same 2-week period with at least one being depressed mood or anhedonia
  - Core symptoms include depressed mood, anhedonia (loss of interest/pleasure), significant weight change or appetite change, insomnia or hypersomnia, psychomotor agitation or retardation
  - Additional symptoms include fatigue/loss of energy, feelings of worthlessness or excessive guilt, diminished concentration or indecisiveness, recurrent thoughts of death or suicidal ideation
  - Symptoms cause significant distress or impairment in social/occupational functioning
  - Severity classification mild (few symptoms beyond required 5), moderate (symptoms/functional impairment between mild and severe), severe (most symptoms with marked functional impairment, may have psychotic features)
  - Screen with PHQ-9 score greater than or equal to 10 suggests moderate-severe depression, score greater than or equal to 20 severe
  - Suicide risk assessment for suicidal ideation, plan, intent, prior attempts, access to means, protective factors - hospitalize if imminent risk
  - Rule out medical causes TSH (hypothyroidism), CBC (anemia), CMP (electrolytes), vitamin B12/folate, screen for substance use (alcohol, drugs)
  - Rule out bipolar disorder by screening for prior manic/hypomonic episodes because antidepressants can trigger mania in undiagnosed bipolar

treatment:
  - Psychotherapy first-line for mild-moderate depression with CBT (cognitive-behavioral therapy) or IPT (interpersonal therapy) equally effective as medications
  - Antidepressants for moderate-severe depression, SSRIs first-line (sertraline 50-200 mg daily, escitalopram 10-20 mg daily, fluoxetine 20-80 mg daily) well-tolerated, take 4-6 weeks for full effect, continue 6-12 months after remission
  - Alternative antidepressants include SNRIs (venlafaxine 75-225 mg daily, duloxetine 60 mg daily), mirtazapine 15-45 mg at bedtime (good if insomnia/weight loss), bupropion 150-450 mg daily (good if fatigue/low energy, no sexual side effects)
  - Combination therapy (medication plus psychotherapy) more effective than either alone for moderate-severe
  - Treatment-resistant depression (failure of 2 or more adequate antidepressant trials) options are switch to different class, augment with lithium or atypical antipsychotic (aripiprazole, quetiapine), consider TMS (transcranial magnetic stimulation) or ECT (electroconvulsive therapy)
  - Monitor response with PHQ-9 every 2-4 weeks, adjust dose or switch if inadequate response after 4-6 weeks
  - Suicidal ideation management hospitalize if imminent risk, frequent follow-up if passive ideation, remove access to means
  - Lifestyle interventions include regular exercise (30 min moderate 5 days/week as effective as antidepressants for mild-moderate), sleep hygiene, social support, avoid alcohol

clinical_pearls:
  - Anhedonia (loss of interest/pleasure) often more prominent than depressed mood
  - SSRIs take 4-6 weeks for full therapeutic effect, counsel patients to continue despite early lack of response
  - Screen for bipolar disorder before starting antidepressants because they can trigger mania
  - Combination medication plus psychotherapy more effective than either alone
  - Sexual side effects common with SSRIs, bupropion or mirtazapine are alternatives without sexual side effects
  - Continue antidepressants 6-12 months after remission to reduce relapse risk
  - Recurrent depression (3 or more episodes) may require indefinite maintenance therapy
  - Always assess suicide risk at every visit

differentials:
  - Bipolar disorder (depressive episodes with prior manic/hypomanic episodes, antidepressants can trigger mania, mood stabilizers required)
  - Persistent depressive disorder dysthymia (chronic low-grade depression at least 2 years, less severe than MDD but longer duration)
  - Adjustment disorder with depressed mood (depressive symptoms within 3 months of identifiable stressor, resolves within 6 months of stressor resolution)
  - Medical illness (hypothyroidism, anemia, vitamin B12 deficiency, chronic disease) or substance-induced (alcohol, benzodiazepines, corticosteroids)

trace:
  - 34-year-old woman presents with 3 months progressive depressed mood, anhedonia (no longer enjoys time with children or hobbies), insomnia (early morning awakening 3 AM), poor appetite with 10-pound weight loss, fatigue, poor concentration at work, feelings of worthlessness and guilt, denies suicidal ideation but has thoughts that family would be better off without her
  - PHQ-9 score 18 (moderate-severe depression)
  - Exam shows depressed affect, psychomotor retardation, normal cognition, no suicidal ideation/plan/intent, good insight/judgment
  - Labs TSH 2.4 mIU/L (normal), CBC normal, CMP normal, urine drug screen negative
  - Screened for bipolar disorder with no prior manic/hypomanic episodes
  - Diagnosis major depressive disorder, single episode, moderate-severe
  - Safety planning implemented, remove firearms from home (husband secured), emergency contacts provided, suicide hotline number given
  - Started sertraline 50 mg daily, referred to psychologist for CBT (cognitive-behavioral therapy), follow-up in 1 week then every 2 weeks
  - 2 weeks shows some improvement in energy but still depressed, increased sertraline to 100 mg daily, attending CBT weekly
  - 4 weeks shows significant improvement, PHQ-9 score 10 (mild), mood better, enjoying activities again, insomnia resolved, appetite improved
  - 8 weeks achieves PHQ-9 score 4 (minimal symptoms), remission, continues sertraline 100 mg daily and CBT
  - 6 months shows sustained remission, completed 16 sessions CBT, continues sertraline maintenance therapy, plan to continue at least 12 months from remission before considering taper
