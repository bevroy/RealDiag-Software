tree_id: PSYCH-MAJOR-DEPRESSION
name: Major Depressive Disorder (MDD)
family: Psychiatry
specialty: Psychiatry
icd10:
- F32.9
- F33.1
snomed:
- '370143000'
urgency: medium
description: Comprehensive evaluation and management of Major Depressive Disorder
  (MDD)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Depressed mood or anhedonia (loss of interest) for ≥2 weeks
- 'Additional symptoms: Sleep changes (insomnia or hypersomnia), appetite/weight changes'
- Fatigue, low energy, psychomotor agitation or retardation
- Feelings of worthlessness or excessive guilt
- Difficulty concentrating, indecisiveness
- Recurrent thoughts of death or suicide
- Significant functional impairment (work, relationships, self-care)
workup:
- PHQ-9 questionnaire (depression severity)
- TSH (rule out hypothyroidism)
- CBC, CMP (medical causes)
- Vitamin B12, folate (if indicated)
treatment:
- 'Guideline-based treatment options for Major Depressive Disorder (MDD) include:'
- 'SSRI: Sertraline 50mg daily (titrate to 200mg) or escitalopram 10mg daily (up to
  20mg) (APA 2022)'
- 'Psychotherapy: CBT (cognitive-behavioral therapy) or IPT (interpersonal therapy)
  (APA 2022)'
- 'Exercise: 30 min moderate activity 3-5x/week (evidence-based adjunct) (APA 2022)'
- 'Monitor: Every 1-2 weeks initially (suicide risk highest early treatment) (APA
  2022)'
- 'Augmentation if partial response: Add bupropion, mirtazapine, or atypical antipsychotic
  (APA 2022)'
clinical_pearls:
- PHQ-9 score ≥10 suggests moderate-severe depression (screening tool)
- Screen for bipolar disorder before starting antidepressants (can trigger mania)
- 'SSRIs first-line: Sertraline, escitalopram, fluoxetine (4-6 weeks for effect)'
- 'Assess suicide risk: Ask directly about ideation, plan, means, intent'
- Psychotherapy + medication superior to either alone
referrals:
- Psychiatry for treatment-resistant depression or complex cases
- Hospitalization if acute suicidal ideation with plan/intent
differentials: []
