tree_id: PSYCH-MAJOR-DEPRESSION  
name: Major Depressive Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Depressed mood, loss of interest, fatigue, sleep disturbance, suicidal thoughts
description: Common mood disorder with persistent depressed mood and/or anhedonia plus associated cognitive, behavioral, and somatic symptoms causing significant functional impairment
icd10: F33.9
urgency: urgent
workup:
  - Epidemiology - Lifetime prevalence 15-20%, annual 7% of adults, female to male ratio 2:1, peak onset 20-30 years, leading cause of disability worldwide
  - Suicide risk - 15-20x higher than general population, 60% of suicides have mood disorder
  - Pathophysiology - Monoamine hypothesis (deficiency of serotonin, norepinephrine, dopamine), HPA axis dysregulation, decreased BDNF, inflammatory cytokines elevated
  - Risk factors - Prior episode (50% recurrence after first), family history (2-3x risk), female sex, early life trauma, chronic medical illness, substance use, medications (beta-blockers, corticosteroids, interferon), psychosocial stressors
  - DSM-5 criteria - Requires 5 or more symptoms for at least 2 weeks with functional impairment
  - Core symptoms (at least one required) - Depressed mood most of day nearly every day, anhedonia (markedly diminished interest or pleasure in all or almost all activities)
  - Associated symptoms - Weight change (>5% in 1 month) or appetite change, insomnia or hypersomnia, psychomotor agitation or retardation (observable), fatigue or loss of energy, worthlessness or excessive guilt, diminished concentration or indecisiveness, recurrent thoughts of death or suicidal ideation
  - Screening - PHQ-9 (9 items, score 0-27), score 5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe, score ≥10 has 88% sensitivity and specificity for MDD, question 9 assesses suicidal ideation
  - PHQ-2 - Brief screening (depressed mood and anhedonia), if score ≥3 then do PHQ-9
  - Suicide risk assessment - CRITICAL in all patients, ask directly about suicidal thoughts, intent, plan, access to means (asking does NOT increase risk)
  - Risk factors - Prior attempt (strongest predictor), hopelessness, impulsivity, substance use, access to lethal means, psychosis, agitation, isolation
  - High risk - Admit involuntarily if imminent danger, remove lethal means, close follow-up
  - Laboratory - Rule out medical causes: TSH (hypothyroidism), CBC (anemia, B12/folate deficiency), CMP, vitamin D, urine drug screen
treatment:
  - General approach - Combination of pharmacotherapy and psychotherapy most effective, target full remission (PHQ-9 <5), treatment phases are acute (6-12 weeks), continuation (4-9 months), maintenance (years if high-risk)
  - SSRIs - FIRST-LINE: Sertraline 50-200 mg daily (most evidence, best tolerated), Escitalopram 10-20 mg daily (fewer drug interactions), Fluoxetine 20-80 mg daily (longest half-life, activating)
  - Side effects - Nausea (transient), headache, insomnia or sedation, sexual dysfunction (30-70%), activation/anxiety initially (start low go slow), hyponatremia (SIADH in elderly), GI bleeding risk with NSAIDs
  - SNRIs - Venlafaxine 75-225 mg daily (dose-dependent BP elevation, more effective than SSRIs for severe depression), duloxetine 60-120 mg daily (also for diabetic neuropathy, fibromyalgia, chronic pain)
  - Atypical antidepressants - Bupropion 150-450 mg daily (no sexual side effects, activating, avoid if seizure history), Mirtazapine 15-45 mg at bedtime (sedating, increases appetite/weight), Trazodone 150-300 mg daily (primarily for insomnia 50-100 mg)
  - Treatment principles - Adequate trial is 4-8 weeks at therapeutic dose (some improvement by 2-4 weeks, full effect 6-12 weeks), if partial response optimize dose, if no response at 6-8 weeks switch to different class, if response but not remission augment
  - Augmentation - Add bupropion (addresses residual fatigue, sexual dysfunction), add aripiprazole or quetiapine (FDA-approved), add lithium or thyroid hormone T3
  - Psychotherapy - As effective as medications for mild-moderate depression: CBT (identify and modify negative thought patterns, 12-20 sessions, most evidence-based), IPT (address interpersonal issues, 12-16 sessions), Behavioral Activation (schedule pleasurable activities)
  - Treatment-resistant depression - No response to 2+ adequate trials: Esketamine nasal spray (rapid-acting, NMDA antagonist, FDA-approved), ECT (most effective 70-90% response, for severe with psychosis, catatonia, high suicide risk), TMS (noninvasive brain stimulation)
  - Lifestyle - Exercise 30 minutes 3-5x/week (equivalent to antidepressants for mild-moderate), sleep hygiene, light therapy for SAD (10,000 lux x 30 minutes morning), social support, avoid alcohol and drugs
  - Duration - First episode continue 6-12 months after remission, recurrent depression long-term maintenance if 2+ episodes, 50% relapse within 6 months if stop prematurely
clinical_pearls:
  - MDD requires depressed mood or anhedonia plus 4 additional symptoms for 2+ weeks with functional impairment
  - Always assess suicide risk directly (asking does not increase risk)
  - PHQ-9 score ≥10 suggests MDD, screen all patients in primary care
  - SSRIs (sertraline, escitalopram) are first-line (well-tolerated, safe)
  - Adequate trial is 4-8 weeks at therapeutic dose, full effect may take 6-12 weeks
  - Combination of antidepressant plus psychotherapy (CBT) more effective than either alone
  - Continue antidepressant 6-12 months after remission to prevent relapse
  - ECT is most effective treatment for severe or treatment-resistant depression (70-90% response)
differentials:
  - ENDO-HYPOTHYROIDISM
  - PSYCH-BIPOLAR-DISORDER
  - PSYCH-ADJUSTMENT-DISORDER
  - NEURO-DEMENTIA
  - PSYCH-SUBSTANCE-USE-DISORDER
trace:
  - Depressed mood and/or anhedonia plus 4 additional symptoms for 2+ weeks
  - PHQ-9 screening (score ≥10 suggests MDD)
  - Rule out medical causes (TSH, CBC, CMP)
  - Assess suicide risk (prior attempts, plan, intent, access to means)
  - Start SSRI (sertraline, escitalopram) or psychotherapy (CBT)
  - If inadequate response after 6-8 weeks, switch or augment
