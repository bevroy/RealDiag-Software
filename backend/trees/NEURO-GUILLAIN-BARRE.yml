nodes:
  - id: gbs_evaluation
    type: diagnosis
    name: "Guillain-Barré Syndrome"
    icd10: "G61.0"
    urgency: critical
    workup:
      - Guillain-Barré syndrome (GBS) - Acute immune-mediated polyneuropathy causing progressive ascending weakness
      - MEDICAL EMERGENCY (respiratory failure 20-30%)
      - Epidemiology - Incidence 0.4-4 per 100,000/year, median age 40 years (but all ages), slight male predominance
      - Most common cause acute flaccid paralysis worldwide
      - Pathophysiology - Molecular mimicry, antibodies against gangliosides in peripheral nerve myelin → demyelination and/or axonal damage
      - Triggered by antecedent infection (60-70% cases)
      - Campylobacter jejuni (30-40%, most common bacterial trigger, worse prognosis)
      - Cytomegalovirus (CMV 10-20%), Epstein-Barr virus (EBV), Mycoplasma pneumoniae
      - Zika virus (2015-2016 outbreak, 20-fold increased GBS)
      - COVID-19 (rare association)
      - Recent vaccination (rare, influenza vaccine 1-2 per million, benefits outweigh risk)
      - Latency 1-3 weeks after infection
      - Subtypes
      - Acute inflammatory demyelinating polyneuropathy (AIDP) - 85-90% North America/Europe, demyelinating, better prognosis
      - Acute motor axonal neuropathy (AMAN) - 5-10% North America, 30-50% Asia/Central/South America, pure motor, axonal loss, associated Campylobacter, GM1/GD1a antibodies, worse prognosis
      - Acute motor and sensory axonal neuropathy (AMSAN) - Severe axonal variant, motor and sensory, poor prognosis
      - Miller Fisher syndrome (MFS) - 5%, triad: ataxia, areflexia, ophthalmoplegia, GQ1b antibodies (90%), better prognosis
      - Clinical presentation - Ascending symmetric weakness (CLASSIC)
      - Weakness - Progressive, ascending (legs → arms → face), symmetric
      - Starts distal legs (difficulty walking, foot drop), ascends proximally
      - Reaches maximum severity by 2-4 weeks (nadir)
      - Areflexia/hyporeflexia - Absent or diminished deep tendon reflexes (REQUIRED for diagnosis)
      - Sensory symptoms - Paresthesias, numbness (glove-and-stocking), neuropathic pain (50-80%, back/leg pain common)
      - Cranial nerve involvement (50%) - Facial weakness (bilateral, 50%), bulbar weakness (dysphagia, dysarthria), ophthalmoplegia (Miller Fisher)
      - Autonomic dysfunction (60-70%) - Cardiac arrhythmias (tachycardia, bradycardia, heart block), blood pressure lability (hypertension/hypotension), ileus, urinary retention, SIADH
      - Respiratory failure (20-30%) - Diaphragm weakness, requires intubation/mechanical ventilation
      - Monitor vital capacity (VC), negative inspiratory force (NIF)
      - Intubate if VC <15-20 mL/kg, NIF >-30 cm H2O, hypoxia, tachypnea, bulbar weakness with aspiration
      - "20/30/40 rule - Consider ICU if VC <20 mL/kg, NIF >-30, O2 sat <92% room air, or decrease VC >30% or NIF >40%"
      - Physical exam
      - Motor - Symmetric proximal and distal weakness (legs > arms early), cannot walk unaided (60% at nadir)
      - Reflexes - Areflexia or markedly diminished (HALLMARK)
      - Sensory - Distal sensory loss (stocking-glove), but can be normal
      - Cranial nerves - Facial diplegia (bilateral facial weakness), bulbar (dysphagia, dysarthria), extraocular (Miller Fisher)
      - Respiratory - Tachypnea, accessory muscle use, paradoxical breathing (diaphragm weakness)
      - Autonomic - Heart rate variability, blood pressure lability
      - Diagnostic criteria (Brighton criteria, modified)
      - Required - Progressive bilateral weakness (legs/arms), decreased or absent reflexes
      - Supportive - Progression <4 weeks, relative symmetry, sensory symptoms, cranial nerve involvement, recovery (begins 2-4 weeks after nadir), autonomic dysfunction, no fever at onset
      - CSF analysis - Albuminocytologic dissociation (elevated protein >45 mg/dL with normal WBC <10 cells/μL)
      - Protein elevation 80-90% sensitive (may be normal first week, peaks 4-6 weeks)
      - Normal or mildly elevated WBC (<10), if >50 cells consider alternative (Lyme, HIV, CMV, malignancy)
      - Electrodiagnostic studies (EMG/NCS) - Nerve conduction studies
      - Demyelinating features (AIDP) - Prolonged distal latencies, reduced conduction velocities (<80% normal), conduction block, prolonged F-waves (>120% upper limit)
      - Axonal features (AMAN/AMSAN) - Reduced amplitudes (CMAPs <80% lower limit), normal velocities
      - May be normal first 1-2 weeks (repeat if high suspicion)
      - Labs - Exclude mimics
      - Electrolytes (hypokalemia periodic paralysis), CPK (myopathy), HIV, Lyme serology (Lyme radiculopathy), heavy metals, porphyria
      - Anti-ganglioside antibodies - GM1, GD1a (AMAN 60-80%), GQ1b (Miller Fisher 90%)
      - Imaging - MRI spine if atypical features (rule out myelopathy, cord compression)
      - Cauda equina nerve root enhancement on MRI (supportive)
      - Differential diagnosis - Myasthenia gravis (fluctuating, ocular, normal reflexes, improves neostigmine), botulism (descending paralysis, pupils), spinal cord compression (sensory level, sphincter early), acute myelitis, hypokalemia, porphyria, tick paralysis, critical illness polyneuropathy
    treatment:
      - MEDICAL EMERGENCY - Requires hospitalization (ICU if respiratory compromise, autonomic instability, severe weakness)
      - Respiratory monitoring - CRITICAL
      - Vital capacity (VC) q4-6h, negative inspiratory force (NIF), oxygen saturation, respiratory rate
      - Intubation criteria - VC <15-20 mL/kg, NIF >-30 cm H2O, hypoxia, bulbar weakness with aspiration, rapidly declining VC
      - "20/30/40 rule - ICU if VC <20 mL/kg, NIF >-30, or decreasing VC >30% or NIF >40%"
      - Mechanical ventilation 20-30% (average 2-3 weeks)
      - Immunotherapy - FIRST-LINE (reduces time to recovery, mechanical ventilation, disability)
      - Intravenous immunoglobulin (IVIG) 0.4 g/kg/day x 5 days (total 2 g/kg)
      - First-line (easier administration than PLEX, similar efficacy)
      - Mechanism - Neutralizes pathogenic antibodies, modulates immune system
      - Side effects - Headache, fever, aseptic meningitis (10%), hyperviscosity (thrombosis, especially with IgA deficiency), renal failure (rare, sucrose-containing formulations)
      - Check IgA level before (if IgA deficient, anaphylaxis risk)
      - Plasma exchange (PLEX, plasmapheresis) - 5 exchanges over 10-14 days (1-1.5 plasma volumes per exchange)
      - Alternative to IVIG (equivalent efficacy)
      - Mechanism - Removes circulating pathogenic antibodies
      - Requires large-bore central line
      - Side effects - Hypotension, line infections, electrolyte abnormalities, citrate toxicity (hypocalcemia)
      - Combination IVIG + PLEX - NOT superior to monotherapy (no benefit)
      - Timing - Start within 2-4 weeks of symptom onset (most effective if started <2 weeks)
      - Benefit even if started up to 4 weeks
      - Corticosteroids - NOT effective (multiple trials showed no benefit)
      - Supportive care - ESSENTIAL
      - DVT prophylaxis - Heparin 5000 units SQ BID or LMWH (high risk immobility, 30% DVT without prophylaxis)
      - Physical therapy - Early mobilization (prevent contractures), passive range of motion
      - Pain management - Neuropathic pain (50-80%), gabapentin 300-900 mg TID, pregabalin 75-150 mg BID, opioids if severe
      - Bowel/bladder care - Stool softeners, urinary catheter if retention
      - Nutrition - Enteral feeding if dysphagia
      - Autonomic monitoring - Continuous cardiac monitoring (arrhythmias), avoid sudden position changes (orthostatic hypotension), avoid certain medications (beta-blockers worsen bradycardia)
      - Eye care - If facial weakness, artificial tears, eye lubrication, taping eyelids closed (prevent corneal abrasion)
      - Prognosis
      - Recovery - Begins 2-4 weeks after nadir, 80-90% walk independently at 6 months, 70-80% full recovery by 1 year
      - Time course - Nadir 2-4 weeks, plateau 2-4 weeks, recovery months to years
      - Mortality - 3-5% (respiratory failure, autonomic dysfunction, PE, sepsis)
      - Residual disability - 20-30% have persistent weakness or neuropathic pain at 1 year
      - Recurrence - 3-5% (true recurrence vs. CIDP if >1 recurrence)
      - Poor prognostic factors - Age >60 years, rapid onset (<7 days to nadir), severe weakness at nadir (cannot walk unaided), need for mechanical ventilation, preceding diarrheal illness (Campylobacter, AMAN), axonal subtype (AMAN/AMSAN), reduced CMAP amplitudes
      - Good prognostic factors - Younger age, mild weakness, demyelinating subtype (AIDP), Miller Fisher syndrome
