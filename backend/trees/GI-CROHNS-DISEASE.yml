tree_id: GI-CROHNS-DISEASE
name: Crohn's Disease
family: Gastrointestinal
specialty: Gastroenterology
chief_complaint: Abdominal pain and diarrhea
description: Chronic inflammatory bowel disease causing transmural inflammation anywhere from mouth to anus with skip lesions, most commonly terminal ileum and colon

icd10: K50.90

urgency: routine_urgent

workup:
  - Clinical presentation: chronic diarrhea (>6 weeks), abdominal pain (often RLQ), weight loss, fatigue, fever, perianal disease (fissures, fistulas, abscesses common)
  - Laboratory: CBC (anemia from chronic disease/GI bleeding, leukocytosis/thrombocytosis from inflammation), ESR/CRP elevated (markers of inflammation), albumin low (malnutrition/protein-losing enteropathy), stool studies (C. diff, cultures, ova/parasites to exclude infection)
  - Colonoscopy with ileoscopy: patchy/skip lesions, cobblestoning, deep linear/serpentine ulcers, terminal ileum involvement common, biopsies show transmural inflammation with granulomas (40%)
  - Upper endoscopy if upper GI symptoms: can involve esophagus/stomach/duodenum
  - Imaging: CT/MRI enterography evaluate small bowel (wall thickening, strictures, fistulas, abscesses), MRI pelvis for perianal disease
  - Extra-intestinal manifestations: arthritis (peripheral/axial), erythema nodosum, pyoderma gangrenosum, uveitis/episcleritis, primary sclerosing cholangitis (more common in UC)

treatment:
  - Induction therapy for active disease: moderate-severe - prednisone 40-60 mg daily x 2-4 weeks then taper, or budesonide 9 mg daily (ileal/right colon disease, less systemic effects), biologics for severe (anti-TNF)
  - Maintenance therapy to prevent relapse: thiopurines (azathioprine 2-2.5 mg/kg daily, 6-mercaptopurine 1-1.5 mg/kg daily) - check TPMT levels before starting, monitor CBC, anti-TNF biologics (infliximab 5 mg/kg IV at 0/2/6 weeks then every 8 weeks, adalimumab 160/80 mg then 40 mg SC every 2 weeks)
  - 5-ASA agents (mesalamine) less effective in Crohn's than UC, may use for mild colonic disease
  - Antibiotics for perianal disease/fistulas: metronidazole 500 mg TID or ciprofloxacin 500 mg BID
  - Immunomodulators: methotrexate 25 mg SC/IM weekly alternative if thiopurine intolerance
  - Advanced therapies: anti-integrin (vedolizumab), anti-IL12/23 (ustekinumab), JAK inhibitors (upadacitinib)
  - Surgery for complications: strictures with obstruction, fistulas, abscesses (I&D), medically refractory disease - NOT curative (recurrence common at anastomosis)
  - Nutritional support: correct deficiencies (iron, B12, folate, vitamin D), enteral nutrition for stricturing disease
  - Smoking cessation mandatory (smoking worsens Crohn's)

clinical_pearls:
  - Transmural inflammation anywhere mouth to anus with skip lesions (vs UC - continuous mucosal inflammation colon only)
  - Terminal ileum most common site, cobblestoning and deep fissuring ulcers characteristic
  - Perianal disease (fissures/fistulas/abscesses) in 30-40%, highly suggestive of Crohn's
  - Granulomas on biopsy pathognomonic but only in 40%
  - Surgery not curative - recurrence at anastomosis >70% at 10 years
  - Smoking worsens Crohn's (opposite of UC where smoking protective)
  - Extra-intestinal manifestations in 25-40%
  - Increased risk of small bowel adenocarcinoma and colorectal cancer

differentials:
  - Ulcerative colitis (continuous inflammation colon only, rectal involvement always, superficial mucosal inflammation, crypt abscesses, no skip lesions/granulomas/perianal disease)
  - Infectious colitis (Salmonella, Shigella, Campylobacter, C. diff, Yersinia - acute onset, stool cultures positive, resolves with antibiotics)
  - Intestinal tuberculosis (endemic areas, chronic diarrhea/weight loss, ileocecal involvement, caseating granulomas, AFB positive)
  - Celiac disease (chronic diarrhea, weight loss, malabsorption, positive TTG/EMA antibodies, duodenal biopsy villous atrophy)

trace:
  - 24-year-old man presents with 6 months progressive abdominal pain/diarrhea, RLQ cramping after meals, non-bloody diarrhea 5-6 times daily, 15-pound weight loss, low-grade fevers, fatigue, recent perianal abscess drained by surgeon
  - Exam: thin/ill-appearing, RLQ tenderness/fullness, perianal skin tag and healing abscess
  - Labs: Hgb 10.2 g/dL (anemia), WBC 13.5K, platelets 485K, ESR 52 mm/hr, CRP 4.8 mg/dL (elevated), albumin 3.2 g/dL (low), stool studies negative including C. diff
  - Colonoscopy with ileoscopy: terminal ileum severely inflamed with deep linear ulcers and cobblestoning, cecum/ascending colon patchy inflammation with skip areas, transverse/descending/sigmoid normal, rectum normal, biopsies show transmural inflammation with non-caseating granulomas
  - CT enterography: terminal ileum wall thickening, mesenteric fat stranding, no strictures/fistulas/abscesses currently
  - Diagnosis: moderate-severe Crohn's disease (ileocolonic) with perianal disease
  - Started prednisone 40 mg daily, mesalamine 2.4 g daily, metronidazole 500 mg TID for perianal disease
  - 2 weeks: improved symptoms, started infliximab induction (5 mg/kg IV at week 0) with plan for doses at week 2 and 6, started azathioprine 150 mg daily (combination therapy superior)
  - Tapered prednisone over 8 weeks, completed infliximab induction
  - 6 months: clinical remission on infliximab every 8 weeks + azathioprine, normalized labs (ESR/CRP), weight gain 20 pounds, excellent quality of life
  - 1 year: repeat colonoscopy shows mucosal healing (deep remission), continues maintenance therapy
