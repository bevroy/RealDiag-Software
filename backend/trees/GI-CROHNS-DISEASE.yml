tree_id: GI-CROHNS-DISEASE
name: Crohn's Disease
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Chronic diarrhea with abdominal pain and weight loss
description: |
  Chronic inflammatory bowel disease affecting any part of GI tract from mouth to anus. Transmural inflammation causes fistulas, strictures, abscesses.
  Skip lesions characteristic (diseased segments separated by normal mucosa). Peak onset 15-35 years. Terminal ileum and colon most commonly affected.
icd10: K50.90
urgency: Moderate
workup:
  - Clinical presentation - chronic diarrhea (may be bloody), abdominal pain (often RLQ), weight loss, fever, perianal disease (fissures, fistulas, abscesses)
  - Laboratory tests - CBC (anemia from chronic disease or blood loss, thrombocytosis, leukocytosis), CRP and ESR elevated (correlate with disease activity)
  - Fecal calprotectin greater than 150 mcg/g indicates intestinal inflammation, useful for monitoring
  - Comprehensive metabolic panel - hypoalbuminemia (malnutrition, protein-losing enteropathy), electrolyte abnormalities
  - Vitamin B12, folate, vitamin D, iron studies (assess for deficiencies)
  - Stool studies - culture, ova and parasites, C. difficile toxin (rule out infection)
  - Colonoscopy with ileoscopy and multiple biopsies - gold standard
  - Endoscopic findings - skip lesions, cobblestoning, linear ulcers (rake ulcers), perianal disease
  - Histology - transmural inflammation, non-caseating granulomas (30%), cryptitis
  - CT or MRI enterography - evaluate small bowel involvement, assess complications (abscess, fistula, stricture)
  - MRI preferred in young patients (no radiation), excellent for perianal disease
  - Upper endoscopy if upper GI symptoms
  - Serologic markers - ASCA (anti-Saccharomyces cerevisiae antibodies) positive in 60%, pANCA typically negative
treatment:
  - Mild-moderate ileocecal disease - budesonide 9mg daily x 8 weeks (topical steroid, fewer systemic effects), taper over 2-4 weeks
  - Alternative sulfasalazine or mesalamine (less effective in Crohn than UC)
  - Moderate-severe disease - systemic corticosteroids (prednisone 40-60mg daily) for induction, biologics for maintenance
  - Anti-TNF biologics first-line for moderate-severe - infliximab 5 mg/kg IV at 0, 2, 6 weeks then q8 weeks, or adalimumab 160mg SC then 80mg week 2 then 40mg q2 weeks
  - Check TB (QuantiFERON or PPD) and hepatitis B before starting anti-TNF
  - Alternative biologics - vedolizumab 300mg IV at 0, 2, 6 weeks then q8 weeks (gut-selective integrin inhibitor, safer if infection risk), ustekinumab 390-520mg IV then 90mg SC q8 weeks (IL-12/23 inhibitor)
  - Immunomodulators for steroid-dependent disease or maintenance - azathioprine 2-2.5 mg/kg/day (check TPMT before starting), 6-mercaptopurine 1-1.5 mg/kg/day, methotrexate 15-25mg IM/SC weekly
  - Antibiotics for perianal disease or abscesses - metronidazole 500mg TID, ciprofloxacin 500mg BID
  - Nutritional support - enteral nutrition (exclusive enteral nutrition can induce remission in children), parenteral nutrition if bowel rest needed, correct vitamin/mineral deficiencies
  - Surgery for complications - bowel resection for strictures causing obstruction, fistula repair, abscess drainage (recurrence common, 70% need surgery within 10 years)
  - Endoscopic balloon dilation for short strictures less than 4 cm
  - Perianal fistulas - seton placement for drainage, biologics, possible fistulotomy
clinical_pearls:
  - Transmural inflammation distinguishes Crohn from UC (mucosal only)
  - Fistulas hallmark complication - enteroenteric, enterovesical (pneumaturia, fecaluria), enterocutaneous, perianal
  - Extraintestinal manifestations - arthritis (peripheral, axial), erythema nodosum, pyoderma gangrenosum, uveitis, primary sclerosing cholangitis (less common than UC), nephrolithiasis (calcium oxalate from fat malabsorption)
  - Smoking worsens Crohn (opposite of UC), strongly recommend cessation
  - Increased risk of colorectal cancer with colonic involvement (start surveillance 8-10 years after diagnosis)
  - Strictures can cause small bowel obstruction - avoid fiber if symptomatic strictures
differentials:
  - Ulcerative colitis
  - Infectious colitis (TB, Yersinia)
  - Ischemic colitis
  - Appendicitis (if RLQ pain predominant)
  - Intestinal tuberculosis
  - Celiac disease
trace:
  - 24-year-old woman with chronic diarrhea 6-8 times daily, RLQ pain, 15 lb weight loss x 4 months → Low-grade fever, tender RLQ mass → Labs show Hgb 10.2, CRP 45 mg/L, albumin 2.9 g/dL, fecal calprotectin 650 mcg/g → Colonoscopy shows terminal ileum ulceration with cobblestoning, skip lesions in colon → Biopsies show transmural inflammation with non-caseating granulomas → CT enterography shows terminal ileum wall thickening, mesenteric fat stranding, small abscess → Diagnose Crohn disease with abscess → Percutaneous CT-guided abscess drainage, antibiotics (ciprofloxacin and metronidazole) → QuantiFERON negative → Start infliximab 5 mg/kg IV at 0, 2, 6 weeks plus azathioprine 150mg daily → Symptoms improve, CRP normalizes, fecal calprotectin decreases → Continue infliximab q8 weeks, azathioprine maintenance → Clinical remission at 6 months
