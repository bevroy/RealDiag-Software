tree_id: GI-DYSPEPSIA
name: Dyspepsia (Indigestion)
family: gastroenterology
specialty: Gastroenterology
icd10: K30
snomed: 162031009
urgency: []
homeopathy: []
presentations:
  - Chronic or recurrent upper abdominal pain or discomfort
  - Early satiety (feeling full after small meals)
  - Postprandial fullness or bloating
  - Epigastric burning or gnawing pain
  - Nausea with or without vomiting
  - Belching or burping
  - Symptoms present for >1 month
  - No alarm features (weight loss, dysphagia, bleeding, anemia)
  - Symptoms may be meal-related or persistent
workup:
  - Initial evaluation based on age and alarm features
  - Age <60 without alarm features - empiric trial of PPI or H. pylori testing
  - Age ≥60 or alarm features - upper endoscopy (EGD) indicated
  - Alarm features: age >60, weight loss, dysphagia, odynophagia, GI bleeding, anemia, palpable mass
  - H. pylori testing - stool antigen, urea breath test, or serology
  - If EGD performed, obtain biopsies for H. pylori and histology
  - Laboratory tests if indicated: CBC (anemia), CMP, lipase (if pancreatitis suspected)
  - Consider celiac serology if diarrhea present
  - Abdominal ultrasound if biliary colic suspected
treatment:
  - Uninvestigated dyspepsia (no EGD yet)
  - Test and treat H. pylori if endemic area (>10% prevalence)
  - Empiric PPI trial for 4-8 weeks (omeprazole 20 mg daily, esomeprazole 40 mg daily)
  - Lifestyle modifications - avoid late meals, elevate head of bed, weight loss
  - Investigated dyspepsia (post-EGD)
  - H. pylori positive - eradication therapy (triple or quadruple therapy)
  - Clarithromycin triple therapy: PPI + amoxicillin 1g + clarithromycin 500mg BID x 14 days
  - Bismuth quadruple therapy: PPI + bismuth + tetracycline + metronidazole x 14 days
  - PPI therapy for GERD, erosive esophagitis, or gastritis/duodenitis
  - Functional dyspepsia (normal EGD) - PPI trial, consider tricyclic antidepressant
  - Amitriptyline 10-50 mg at bedtime or nortriptyline 10-25 mg
  - Prokinetics (metoclopramide, domperidone) if delayed gastric emptying
  - Dietary modifications - avoid trigger foods, small frequent meals
  - Psychological therapies (CBT, hypnotherapy) may benefit some patients
clinical_pearls:
  - "Functional dyspepsia (FD) accounts for 60-70% of dyspepsia cases - normal endoscopy"
  - "Rome IV criteria defines functional dyspepsia subtypes: postprandial distress (PDS) vs epigastric pain (EPS)"
  - "H. pylori eradication improves symptoms in only 10% of functional dyspepsia patients"
  - "PPI most effective for epigastric pain syndrome (EPS), less for postprandial distress (PDS)"
  - "Alarm features require endoscopy regardless of age: dysphagia, bleeding, weight loss, anemia"
  - "Age cutoff for empiric vs endoscopic approach varies by guideline (50-60 years)"
  - "Overlap common with IBS (30-40%), GERD (30-40%), and psychological disorders"
  - "NSAIDs, aspirin, bisphosphonates can cause dyspepsia - review medication list"
referrals:
  - Gastroenterology for upper endoscopy if alarm features or refractory symptoms
  - Consider GI referral if symptoms persist despite empiric PPI trial
  - Dietitian for dietary modification counseling
differentials:
  - Functional dyspepsia (normal endoscopy, Rome IV criteria)
  - Gastroesophageal reflux disease (heartburn, regurgitation)
  - Peptic ulcer disease (H. pylori, NSAIDs, endoscopy shows ulcer)
  - Gastritis or duodenitis (endoscopy and biopsy findings)
  - Gastroparesis (early satiety, nausea, vomiting, delayed gastric emptying)
  - Biliary colic (episodic RUQ pain after fatty meals, ultrasound shows gallstones)
  - Chronic pancreatitis (epigastric pain radiating to back, elevated lipase)
  - Gastric cancer (alarm features, weight loss, endoscopy with biopsy)
  - Medication-induced (NSAIDs, aspirin, bisphosphonates, antibiotics)
  - Celiac disease (diarrhea, positive serology, duodenal biopsy)
trace:
  source: ACG Clinical Guidelines on Dyspepsia 2017, Rome IV Criteria for Functional GI Disorders 2016
  version: '1.0'
  last_updated: '2025-12-26'
