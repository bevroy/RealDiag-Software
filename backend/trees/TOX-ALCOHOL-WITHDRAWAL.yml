homeopathy: []
presentations:
- Tremors and anxiety
- Tremors especially in hands
- Hand tremor and sweating
- Anxiety restlessness
- Diaphoresis
- Nausea vomiting
- Tachycardia hypertension
- Seizures (6-48 hours after last drink)
- Delirium tremens (48-96 hours) - hallucinations, confusion, autonomic instability
- History of chronic heavy alcohol use
- Tremor and blackouts
- Blackouts and tremor
- Alcohol withdrawal tremor
- Withdrawal symptoms after stopping alcohol
workup: []
treatment:
  - 'Benzodiazepines first-line - prevent seizures and DTs, reduce mortality'
  - 'CIWA-Ar protocol: Symptom-triggered dosing - chlordiazepoxide 50-100mg Q1H PRN or lorazepam 2-4mg Q1H PRN until CIWA <8-10'
  - 'Fixed-dose alternative: Chlordiazepoxide 50mg Q6H x4 doses, then 25mg Q6H x8 doses, then taper OR lorazepam 2mg Q6H with taper'
  - 'Severe withdrawal or DTs: Diazepam 10-20mg IV Q5-15min or lorazepam 2-4mg IV Q10-15min until sedation, may need VERY high doses'
  - 'Thiamine 100mg IV/IM before any glucose (prevent Wernicke encephalopathy), continue 100mg daily x3-5 days'
  - 'Folic acid 1mg daily, multivitamin'
  - 'Magnesium sulfate 2g IV over 10 min if low or if seizure (replete to >2 mg/dL)'
  - 'Phosphate and potassium repletion as needed (often depleted)'
  - 'Avoid phenytoin for withdrawal seizures (not effective, benzos are treatment)'
  - 'Propofol or phenobarbital for benzodiazepine-refractory DTs'
  - 'Supportive care - IV fluids (often dehydrated), antiemetics (ondansetron 4mg), treat concurrent conditions'
  - 'Haloperidol 5mg IM/IV for severe agitation (adjunct to benzos, not monotherapy)'
  - 'ICU admission for DTs, severe withdrawal (CIWA >15), or concurrent serious illness'
  - 'Alcohol counseling and addiction treatment referral before discharge'
