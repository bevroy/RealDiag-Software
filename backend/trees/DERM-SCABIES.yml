tree_id: DERM-SCABIES
name: Scabies
family: Dermatology
specialty: Dermatology
chief_complaint: Intensely itchy rash worse at night
description: Sarcoptes scabiei mite infestation causing intensely pruritic rash in characteristic distribution (interdigital spaces, wrists, axillae, waist, genitals). Permethrin 5% cream curative, treat all household contacts simultaneously.
icd10: B86
snomed: 128869009
presentations:
  - Intense pruritus (worse at night)
  - Linear burrows (pathognomonic)
  - Interdigital web spaces, wrists, axillae, genitals
  - Secondary excoriations, impetiginization
  - Household contacts affected
  - Pruritus persists weeks after treatment
urgency: urgent

workup:
  - Clinical diagnosis: intensely pruritic rash worse at night in characteristic distribution
  - Distribution: web spaces of fingers (most common), wrists, axillae, waist, buttocks, genitals (penis, scrotum), breasts (areolae in women)
  - Burrows: pathognomonic finding - serpiginous thread-like tracks 2-10 mm long (mite tunneling through stratum corneum)
  - Secondary lesions: excoriations from scratching, papules, vesicles, eczematous changes
  - Face and scalp spared in adults (involved in infants)
  - Generalized pruritus: out of proportion to visible skin findings
  - Nocturnal pruritus: classic feature (mite activity increases at night)
  - Contact history: close physical contact with infected person, common in crowded living conditions, nursing homes, sexual contact
  - Microscopy (gold standard): skin scraping of burrow with mineral oil, identify mites, eggs, or fecal pellets (scybala) under microscope
  - Positive scraping confirms diagnosis but negative does NOT rule out (low sensitivity 30-50%)
  - Dermoscopy: may visualize mite at end of burrow (delta wing sign)

treatment:
  - Permethrin 5% cream (first-line): apply from neck down to entire body including under nails, leave on 8-14 hours (overnight), wash off in morning
  - Repeat application in 7-14 days (second dose critical - treats newly hatched mites from eggs resistant to first treatment)
  - Alternative: ivermectin 200 mcg/kg PO single dose, repeat in 7-14 days (useful if cannot apply cream, institutional outbreaks, crusted scabies)
  - Less effective alternatives: crotamiton 10% cream or sulfur 5-10% ointment (pregnancy)
  - Treat ALL household members and close contacts simultaneously (even if asymptomatic - prevent reinfestation)
  - Environmental decontamination: wash all clothing, bedding, towels in hot water and dry on high heat, items that cannot be washed seal in plastic bag x72 hours (mites die off host in 2-3 days)
  - Pruritus persists 2-4 weeks after successful treatment: allergic reaction to dead mites and fecal material, does NOT mean treatment failure
  - Symptomatic treatment for pruritus: oral antihistamines (hydroxyzine, cetirizine), topical corticosteroids for inflammation
  - Post-scabies dermatitis: eczematous changes persist after treatment, treat with emollients and topical steroids
  - Crusted (Norwegian) scabies: severe infestation in immunocompromised, thick hyperkeratotic crusts, millions of mites, highly contagious, treat with ivermectin plus permethrin

clinical_pearls:
  - Intensely pruritic rash worse at night in web spaces, wrists, axillae, waist, genitals
  - Burrows pathognomonic - serpiginous tracks in skin
  - Treat ALL household contacts simultaneously even if asymptomatic
  - Permethrin 5% cream neck down overnight, repeat in 7-14 days
  - Pruritus persists 2-4 weeks after treatment (dead mite reaction, not failure)
  - Wash all bedding and clothing in hot water, seal non-washables x72 hours
  - Skin scraping low sensitivity - negative does not rule out
  - Highly contagious - close physical contact transmission

differentials:
  - Atopic dermatitis: flexural distribution, personal/family history atopy, chronic course, no burrows
  - Contact dermatitis: pruritic, acute onset after exposure, distribution matches allergen exposure
  - Pediculosis corporis (body lice): pruritus, excoriations, lice and nits on clothing not skin
  - Dermatitis herpetiformis: intensely pruritic vesicles on extensor surfaces, associated with celiac disease

trace: |
  A 28-year-old woman presented with 3 weeks of intensely pruritic rash keeping her awake at night. Started as itching between fingers, spread to wrists, waist, and breasts. Boyfriend has similar symptoms. Lives with boyfriend in apartment. Exam showed excoriated papules and vesicles on web spaces of fingers bilaterally (classic distribution), wrists, anterior axillary folds, waist, and around areolae. Identified subtle serpiginous burrows in web spaces. Diagnosed with scabies clinically (classic distribution, nocturnal pruritus, burrows, contact with symptomatic partner). Performed skin scraping from burrow on right hand with mineral oil - microscopy showed adult mite and eggs confirming diagnosis. Prescribed permethrin 5% cream, instructed to apply from neck down to entire body including under fingernails, leave on overnight 8-14 hours, wash off in morning. Repeat application in exactly 2 weeks. Prescribed to boyfriend as well (treat both simultaneously). Hydroxyzine 25 mg at bedtime for pruritus. Instructed to wash all bedding, clothing, towels in hot water and high heat dryer today, seal pillows and stuffed animals in plastic bags x3 days. At 1 week itching improved 50%, no new lesions. At 3 weeks after second permethrin application, itching 90% resolved, skin healing. Residual mild pruritus (post-scabies allergic reaction to dead mites, not treatment failure). At 6 weeks complete resolution, skin clear. Boyfriend also cured. No recurrence.
