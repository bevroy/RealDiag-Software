presentations:
  - Generalized tonic-clonic seizure (convulsion, loss of consciousness, postictal confusion)
  - Focal seizure with impaired awareness (staring, lip smacking, confusion)
  - Focal seizure without impaired awareness (aura, motor symptoms, sensory symptoms)
  - Absence seizure (brief staring spells, no postictal state)
  - Myoclonic jerks (brief muscle jerks, often morning)
  - Atonic seizure (drop attacks)
  - Postictal confusion or somnolence
  - Tongue biting (lateral tongue specific for tonic-clonic)
  - Incontinence during seizure
  - Aura before seizure (déjà vu, rising epigastric sensation, fear, olfactory hallucination)
  - Todd's paralysis (transient focal weakness after focal seizure)

workup:
  - Epilepsy diagnosis requires: 1 unprovoked seizure plus high risk of recurrence (greater than 60 percent - abnormal EEG or MRI or nocturnal seizure), or 2 or more unprovoked seizures greater than 24 hours apart, or epilepsy syndrome diagnosis
  - Provoked seizures (not epilepsy): acute symptomatic seizures from metabolic derangement (hypoglycemia, hyponatremia, hypocalcemia), alcohol withdrawal (12-48 hours after last drink), drug intoxication (cocaine, amphetamines), acute CNS infection (meningitis, encephalitis), acute stroke, head trauma
  - First seizure evaluation: detailed history (seizure description, prodrome/aura, duration, postictal state, witnesses), past medical history (prior seizures, head trauma, CNS infection, febrile seizures as child, family history epilepsy), medication history (seizure threshold lowering drugs - bupropion, tramadol, antipsychotics)
  - Physical exam: general neurologic exam (look for focal deficits suggesting structural lesion), neurocutaneous findings (café-au-lait spots neurofibromatosis, ash-leaf spots tuberous sclerosis, port-wine stain Sturge-Weber)
  - Lab tests (first seizure): glucose (rule out hypoglycemia), sodium (hyponatremia can cause seizures), calcium, magnesium, CBC (infection), toxicology screen (cocaine, amphetamines), pregnancy test (women childbearing age), consider lumbar puncture if fever or meningeal signs
  - MRI brain with and without contrast (preferred over CT): identify structural lesions (tumor, vascular malformation, cortical dysplasia, mesial temporal sclerosis, prior stroke), obtain within 48 hours of first unprovoked seizure
  - EEG (all patients with first unprovoked seizure): capture interictal epileptiform discharges (spikes, sharp waves) supporting epilepsy diagnosis, classify seizure type and epilepsy syndrome, obtain within 24-48 hours when possible (yield higher closer to event), sleep-deprived EEG increases yield, video EEG monitoring for refractory cases or unclear diagnosis
  - EEG findings supporting epilepsy: generalized spike-wave (absence epilepsy, juvenile myoclonic epilepsy), focal spikes or sharp waves (focal epilepsy), photoparoxysmal response (photosensitive epilepsy), normal EEG does not exclude epilepsy (50 percent sensitivity single routine EEG)
  - Genetic testing if suspected genetic epilepsy syndrome (onset infancy/early childhood, developmental delay, family history, specific EEG pattern)

treatment:
  - Treat epilepsy (2 or more unprovoked seizures): antiseizure medication (ASM) reduces seizure recurrence 50 percent over 2 years but does not change long-term prognosis, discuss risks/benefits with patient
  - First unprovoked seizure with normal MRI and EEG: 30-50 percent recurrence risk, consider ASM if high risk (abnormal MRI, epileptiform discharges on EEG, nocturnal seizure, focal seizure, patient preference), otherwise may observe
  - ASM selection based on seizure type: focal seizures (levetiracetam, lamotrigine, carbamazepine, oxcarbazepine), generalized tonic-clonic (levetiracetam, lamotrigine, valproate), absence seizures (ethosuximide, valproate, lamotrigine - avoid carbamazepine worsens absences), myoclonic seizures (valproate, levetiracetam, topiramate)
  - Levetiracetam 500 mg BID initial (increase to 1000-1500 mg BID): broad spectrum (focal and generalized), no drug interactions, renally cleared, adverse effects mood changes (irritability, depression), generally well tolerated
  - Lamotrigine 25 mg daily initial (titrate slowly to 200-400 mg daily over 6-8 weeks): broad spectrum, well tolerated, risk Stevens-Johnson syndrome if titrated too rapidly (especially with valproate), effective for focal and generalized seizures
  - Carbamazepine 200 mg BID initial (increase to 400-600 mg BID): effective for focal seizures, sodium channel blocker, enzyme inducer (many drug interactions), adverse effects hyponatremia (SIADH), diplopia, dizziness, rare aplastic anemia or SJS, avoid in absence or myoclonic seizures (can worsen)
  - Valproate 250-500 mg BID (increase to 1000-2000 mg daily divided): broad spectrum most effective for generalized epilepsies (absence, JME), hepatotoxic (monitor LFTs), teratogenic (neural tube defects 10 percent risk - avoid women of childbearing potential), weight gain, tremor, hair loss, thrombocytopenia
  - Topiramate 25 mg nightly initial (increase to 100-200 mg BID): broad spectrum, cognitive side effects (word-finding difficulty, mental slowing), weight loss, kidney stones, avoid in pregnancy (increased cleft palate risk)
  - Oxcarbazepine 300 mg BID initial (increase to 600-1200 mg BID): similar to carbamazepine but fewer drug interactions, hyponatremia more common, effective for focal seizures
  - Refractory epilepsy (failed 2 appropriate ASMs at therapeutic doses): consider combination therapy (levetiracetam plus lamotrigine common), refer epilepsy center for video EEG monitoring and surgical evaluation, vagus nerve stimulator if not surgical candidate, ketogenic diet for some syndromes
  - Seizure freedom goals: 50-60 percent seizure-free on first ASM, 70 percent seizure-free after trying 2-3 ASMs, medication withdrawal considered after 2-5 years seizure freedom (50-60 percent remain seizure-free off meds, lower risk if normal MRI and EEG, single seizure type, easily controlled)
  - Counseling: avoid seizure triggers (sleep deprivation, alcohol, flashing lights if photosensitive), driving restrictions vary by state (typically 3-12 months seizure-free required), avoid swimming alone or heights, shower sitting down, avoid jobs with heavy machinery or heights until seizure control established
  - Women of childbearing age: folic acid 1-4 mg daily (reduce neural tube defect risk), avoid valproate (teratogenic), levetiracetam or lamotrigine preferred in pregnancy, continue ASM during pregnancy (seizures more harmful than medication), breastfeeding generally safe on ASMs

clinical_pearls:
  - Epilepsy is 2 or more unprovoked seizures or 1 seizure with high recurrence risk
  - MRI brain and EEG are key diagnostic tests for first seizure
  - Lateral tongue biting highly specific for tonic-clonic seizure (not present in pseudoseizures)
  - Postictal confusion/somnolence and elevated prolactin support true seizure (vs pseudoseizure)
  - Levetiracetam and lamotrigine are first-line for most seizure types (broad spectrum, well tolerated)
  - Valproate most effective for generalized epilepsies but avoid women childbearing age (teratogenic)
  - 30 percent of epilepsy patients have refractory seizures despite multiple ASMs
  - Surgical evaluation appropriate for refractory focal epilepsy (especially temporal lobe)
  - Status epilepticus (seizure greater than 5 minutes or recurrent without recovery) is emergency requiring IV benzodiazepines

referrals:
  - Emergency department for first-time seizure (rule out acute causes, obtain initial workup)
  - Neurology for epilepsy management (ASM selection, monitoring, refractory cases)
  - Epilepsy center for refractory epilepsy (video EEG monitoring, surgical evaluation, VNS)
  - Neuropsychology testing if cognitive concerns or pre-surgical evaluation
  - Neurosurgery if surgical candidate for epilepsy (focal epilepsy, identifiable lesion, failed medical therapy)
  - Genetic counseling if suspected genetic epilepsy syndrome

differentials:
  - Syncope (brief, rapid recovery, no postictal confusion, triggered by standing/stress)
  - Psychogenic non-epileptic seizures (PNES/pseudoseizures - eyes closed, prolonged, pelvic thrusting, not responsive to ASMs)
  - Transient ischemic attack (focal deficits, older age, vascular risk factors, brief duration)
  - Migraine with aura (visual symptoms, gradual spread, headache follows)
  - Movement disorders (tremor, dystonia, chorea - no loss of awareness)
  - Sleep disorders (parasomnias, narcolepsy - occur from sleep, different characteristics)
  - Panic attack (hyperventilation, anxiety, no loss of consciousness)

trace:
  - 24-year-old woman presents to ED after witnessed generalized tonic-clonic seizure at work, coworker reports patient suddenly stopped talking, stared briefly, then fell and had rhythmic jerking of all extremities for 2 minutes, incontinent of urine, confused for 15 minutes after
  - Past medical history: no known seizures, 2 episodes last year of "spacing out" for 10-20 seconds at a time (did not seek care, thought was fatigue)
  - Family history: mother has epilepsy (controlled on medication)
  - Medications: oral contraceptives only
  - Patient reports no warning before today's seizure, no recall of event, awakened on floor with EMS present, felt confused and tired, bit tongue (blood in mouth)
  - Exam in ED: alert oriented (one hour post-seizure), BP 118/72, HR 88, temperature 98.6F, general and neurologic exam normal except lateral tongue laceration (dried blood), no focal deficits
  - Labs: glucose 98 mg/dL, sodium 138 mEq/L, calcium 9.2 mg/dL, magnesium 2.0 mg/dL, CBC normal, urine toxicology negative, pregnancy test negative
  - CT head non-contrast (ED): no acute intracranial process, no hemorrhage or mass
  - Patient discharged from ED with neurology follow-up scheduled within 1 week, advised not to drive until neurology evaluation
  - Neurology visit 5 days later: patient reports 1 additional "spacing out" episode yesterday (20 seconds staring, lip smacking, confusion after)
  - MRI brain with contrast: right mesial temporal sclerosis (hippocampal atrophy and T2 hyperintensity) - classic finding for temporal lobe epilepsy
  - EEG: right temporal sharp waves (interictal epileptiform discharges), no seizures captured
  - Diagnosis: focal epilepsy (temporal lobe epilepsy) with progression to bilateral tonic-clonic seizure, prior events were focal seizures with impaired awareness (complex partial seizures), high risk recurrence given 3 seizures in past year, abnormal MRI (mesial temporal sclerosis), and epileptiform discharges on EEG
  - Started levetiracetam 500 mg BID (focal seizure indication), counsel avoid driving for 3-6 months per state law until seizure-free
  - Follow-up 2 weeks: tolerated levetiracetam well, no seizures, increased to 750 mg BID
  - Follow-up 6 weeks: no seizures on 750 mg BID, mild irritability noted (common levetiracetam side effect), counseled
  - 6 months: seizure-free, may resume driving per state regulations, continue levetiracetam 750 mg BID, plan long-term treatment (at least 2 years seizure freedom before considering medication withdrawal)
  - 1 year: remains seizure-free, functioning well at work, contraception switched from oral contraceptives to IUD (levetiracetam does not interact but planning ahead in case need to add enzyme-inducing ASM in future)
  - Discussion of long-term prognosis: mesial temporal sclerosis epilepsy is common focal epilepsy, 50-60 percent become seizure-free with ASMs, if refractory to 2-3 ASMs may be candidate for surgical resection (anterior temporal lobectomy 70-80 percent seizure freedom rate)
