tree_id: NEU-SEIZURE-DISORDER
name: Seizure Disorder/Epilepsy
family: Neurology
specialty: Neurology
chief_complaint: Recurrent unprovoked seizures
description: Chronic neurologic disorder characterized by recurrent unprovoked seizures resulting from abnormal excessive neuronal activity in the brain

icd10: G40.909
snomed: "84757009"

urgency: urgent_if_active

