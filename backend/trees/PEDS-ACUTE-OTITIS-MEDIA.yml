tree_id: PEDS-ACUTE-OTITIS-MEDIA
name: Acute Otitis Media (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/ENT
icd10: H66.90
snomed: 3110003
urgency: []
homeopathy: []
presentations:
  - Ear pain or tugging/pulling at ears (especially infants and toddlers)
  - Fever (present in 50-60% of cases)
  - Irritability and fussiness
  - Difficulty sleeping or lying flat
  - Decreased appetite or difficulty feeding
  - Hearing difficulty or decreased response to sounds
  - Ear drainage (if tympanic membrane perforation)
  - Preceding or concurrent upper respiratory infection symptoms (80-90% of cases)
  - More common in children age 6 months to 3 years
  - Increased risk with daycare attendance, pacifier use, bottle-feeding, smoke exposure
workup:
  - Clinical history
  - Onset and duration of ear pain or symptoms
  - Fever pattern and maximum temperature
  - Preceding upper respiratory infection
  - Previous episodes of acute otitis media (AOM)
  - Number of episodes in past 6-12 months (assess for recurrent AOM)
  - Previous tympanostomy tubes
  - Recent antibiotic use (within past 30 days)
  - Risk factors
  - Age (younger children at higher risk)
  - Daycare attendance
  - Smoking exposure
  - Pacifier use beyond age 6 months
  - Bottle-feeding (especially supine)
  - Family history of recurrent ear infections
  - Craniofacial anomalies (cleft palate, Down syndrome)
  - Immunization status (pneumococcal and influenza vaccines)
  - Symptoms of complications
  - Facial weakness (facial nerve paralysis)
  - Severe headache, neck stiffness (meningitis)
  - Postauricular swelling or tenderness (mastoiditis)
  - Physical examination
  - Otoscopy (MOST IMPORTANT diagnostic tool)
  - Adequate visualization requires cerumen removal if obstructing view
  - Diagnostic criteria for AOM (ALL THREE required)
  - Acute onset of symptoms (ear pain, fever, irritability)
  - Middle ear effusion (MEE)
  - Bulging tympanic membrane (TM) - MOST specific finding
  - Limited or absent TM mobility on pneumatic otoscopy
  - Air-fluid level or otorrhea
  - Signs of middle ear inflammation
  - Erythema of TM (LEAST specific - can occur with crying or fever alone)
  - Opacification of TM
  - Decreased TM mobility
  - Tympanic membrane assessment
  - Color: gray (normal), red (inflamed), yellow (pus), amber (serous fluid)
  - Position: bulging (purulent effusion), retracted (negative middle ear pressure)
  - Translucency: opaque (effusion or inflammation)
  - Mobility: reduced or absent with pneumatic otoscopy (effusion present)
  - Landmarks: light reflex, handle of malleus (obscured in AOM)
  - External ear and mastoid examination
  - Postauricular erythema, swelling, tenderness (mastoiditis)
  - Otorrhea (TM perforation or tympanostomy tube drainage)
  - Facial nerve function (smile symmetry - facial nerve runs through middle ear)
  - General examination
  - Nasal discharge, pharyngitis (concurrent URI)
  - Cervical lymphadenopathy
  - Lung examination (assess for pneumonia if respiratory symptoms)
  - Laboratory and imaging
  - Usually NOT required for uncomplicated AOM
  - Tympanocentesis (rarely performed)
  - For severe toxic-appearing child not responding to multiple antibiotics
  - For immunocompromised patients
  - For neonates (higher risk for unusual pathogens)
  - Culture and sensitivity from middle ear fluid
  - CT temporal bones if concern for mastoiditis or intracranial complications
treatment:
  - Observation versus immediate antibiotic therapy (based on age, severity, certainty of diagnosis)
  - Immediate antibiotic therapy ALWAYS indicated for
  - Age less than 6 months
  - Severe symptoms (moderate to severe ear pain, fever greater than or equal to 102.2°F/39°C)
  - Bilateral AOM in age less than 24 months
  - AOM with otorrhea (TM perforation or tube drainage)
  - Observation (watchful waiting) option for
  - Age 6-23 months with unilateral non-severe AOM AND reliable follow-up
  - Age greater than or equal to 24 months with non-severe symptoms AND reliable follow-up
  - Requires close follow-up in 48-72 hours to assess response
  - Provide rescue antibiotic prescription for use if worsening or no improvement in 48-72 hours
  - Observation reduces antibiotic overuse and resistance
  - First-line antibiotic therapy
  - Amoxicillin 80-90 mg/kg/day divided twice daily for 10 days (age less than 2 years) or 5-7 days (age greater than or equal to 2 years)
  - High-dose amoxicillin covers drug-resistant Streptococcus pneumoniae
  - Most common pathogens: S. pneumoniae, non-typeable Haemophilus influenzae, Moraxella catarrhalis
  - Alternative first-line if penicillin allergy
  - Non-Type I allergy (not anaphylaxis): cefdinir, cefpodoxime, cefuroxime
  - Type I allergy (anaphylaxis): azithromycin or clarithromycin (higher treatment failure rate)
  - Second-line therapy (treatment failure after 48-72 hours)
  - Amoxicillin-clavulanate 90 mg/kg/day (amoxicillin component) divided twice daily
  - Clavulanate covers beta-lactamase producing H. influenzae and M. catarrhalis
  - Alternative: ceftriaxone 50 mg/kg IM daily for 1-3 days
  - Recurrent AOM (3+ episodes in 6 months OR 4+ in 12 months with 1 in past 6 months)
  - Consider tympanostomy tube placement (refer to ENT)
  - Chemoprophylaxis NOT routinely recommended (increases antibiotic resistance)
  - Pain management
  - Acetaminophen 15 mg/kg/dose every 4-6 hours OR ibuprofen 10 mg/kg/dose every 6 hours
  - Topical analgesics (benzocaine drops) - limited evidence, use with caution
  - Warm compress to affected ear
  - Tympanostomy tubes (PE tubes)
  - Indications
  - Recurrent AOM (3+ in 6 months or 4+ in 12 months)
  - Persistent middle ear effusion greater than 3 months with hearing loss
  - Chronic suppurative otitis media
  - Complications of AOM
  - Refer to pediatric ENT for evaluation
  - Prevention strategies
  - Immunizations
  - Pneumococcal conjugate vaccine (PCV13 or PCV15) - reduces AOM incidence by 20-30%
  - Annual influenza vaccine
  - Reduce risk factors
  - Avoid tobacco smoke exposure
  - Breastfeeding (protective effect)
  - Avoid bottle propping or supine bottle feeding
  - Limit pacifier use beyond 6 months
  - Avoid daycare if possible (or smaller group size)
  - Xylitol (sugar substitute) may reduce AOM in high-risk children (limited evidence)
clinical_pearls:
  - 'AOM requires ALL 3 criteria: acute onset, middle ear effusion (bulging TM or otorrhea), and signs of inflammation - TM erythema alone insufficient'
  - 'Bulging tympanic membrane most specific finding for AOM - distinguishes from otitis media with effusion (OME)'
  - 'High-dose amoxicillin (80-90 mg/kg/day) first-line treatment - covers drug-resistant S. pneumoniae'
  - 'Observation (watchful waiting) option for age greater than 6 months with non-severe unilateral AOM and reliable follow-up - reduces antibiotic overuse'
  - 'Most AOM resolves spontaneously within 48-72 hours - 80% improve without antibiotics'
  - 'Pneumococcal vaccine reduces AOM incidence by 20-30% - most effective prevention strategy'
  - 'Recurrent AOM (3+ in 6 months or 4+ in 12 months) indication for tympanostomy tubes - NOT for prolonged antibiotics'
  - 'TM perforation occurs in 5-10% of AOM - heals spontaneously in most cases, continue antibiotics'
referrals:
  - Pediatric ENT for recurrent AOM (3+ in 6 months or 4+ in 12 months) - consider tympanostomy tubes
  - Pediatric ENT for persistent middle ear effusion (greater than 3 months) with hearing loss
  - Pediatric ENT for suspected complications (mastoiditis, facial nerve paralysis)
  - Audiology for formal hearing evaluation if speech delay or persistent effusion
  - Pediatric infectious disease if immunocompromised or treatment failure with multiple antibiotics
differentials:
  - Acute otitis media (bulging TM, acute onset ear pain, fever, MEE)
  - Otitis media with effusion (MEE without acute inflammation - retracted or neutral TM, no ear pain, no fever)
  - Otitis externa (swimmer's ear - pain with tragus or pinna manipulation, external auditory canal erythema and edema, normal TM)
  - Referred pain from pharyngitis or dental pain (normal otoscopic exam)
  - Temporomandibular joint (TMJ) dysfunction (jaw pain radiating to ear, worse with chewing)
  - Cerumen impaction (fullness sensation, hearing loss, visible cerumen on otoscopy)
  - Mastoiditis (postauricular swelling, erythema, tenderness, protruding ear)
  - Foreign body in ear canal (visible on otoscopy, unilateral symptoms)
