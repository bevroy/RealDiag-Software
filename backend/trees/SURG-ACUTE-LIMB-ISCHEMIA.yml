presentations:
  - 'Six Ps: Pain, Pallor, Pulselessness, Paresthesias, Paralysis, Poikilothermia'
  - Sudden onset limb pain
  - Cool pale extremity
  - Absent pulses
  - Atrial fibrillation or vascular disease
  - Requires urgent revascularization
differentials:
  - DVT
  - Compartment syndrome
  - Peripheral neuropathy
  - Acute arterial occlusion
workup: []
treatment:
  - Immediate vascular surgery consult - limb-threatening emergency
  - Heparin bolus 80 units/kg IV, then 18 units/kg/hr infusion (prevent thrombus propagation)
  - Pain control - IV opioids
  - Keep affected limb dependent (gravity improves perfusion)
  - Vascular imaging - CT angiography or catheter angiography
  - Revascularization within 6 hours - surgical embolectomy, thrombectomy, or bypass
  - Catheter-directed thrombolysis for selected cases - tPA infusion
  - Fasciotomy if compartment syndrome after reperfusion
  - Amputation if irreversible ischemia (paralysis, rigor, gangrene)
  - Anticoagulation after revascularization to prevent recurrence
  - Treat underlying cause - atrial fibrillation (anticoagulate), atherosclerosis (antiplatelet, statin)
  - Reperfusion injury common - monitor for compartment syndrome, rhabdomyolysis, hyperkalemia
