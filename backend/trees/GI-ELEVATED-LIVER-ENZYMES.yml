tree_id: GI-ELEVATED-LIVER-ENZYMES
name: Elevated Liver Enzymes (Transaminitis)
family: gastroenterology
specialty: Gastroenterology
icd10: R74.0
snomed: 166603001
urgency: []
homeopathy: []
presentations:
  - Asymptomatic elevation found on routine labs
  - Mild elevation (ALT/AST <5x upper limit of normal)
  - Moderate elevation (5-10x ULN)
  - Severe elevation (>10x ULN)
  - May have associated symptoms: fatigue, right upper quadrant discomfort, jaundice
  - Known risk factors: alcohol use, obesity, diabetes, medications
  - Pattern: hepatocellular (elevated transaminases) vs cholestatic (elevated Alk Phos, bilirubin)
workup:
  - Repeat testing to confirm persistent elevation
  - Comprehensive metabolic panel including total and direct bilirubin
  - Complete blood count, PT/INR (assess synthetic function)
  - Determine pattern: AST/ALT ratio
  - AST:ALT ratio >2 suggests alcohol
  - AST:ALT ratio <1 typical of most liver diseases
  - Viral hepatitis serologies: Hepatitis A, B, C
  - HBsAg, anti-HBc, anti-HBs for hepatitis B
  - Hepatitis C antibody, confirm with HCV RNA if positive
  - Autoimmune markers: ANA, anti-smooth muscle antibody, anti-LKM, IgG
  - Metabolic testing: iron panel (ferritin, transferrin saturation), ceruloplasmin (Wilson's)
  - Alpha-1 antitrypsin level and phenotype
  - Right upper quadrant ultrasound with Doppler
  - Assess for steatosis, cirrhosis, biliary dilation, masses, vascular patency
  - Consider liver biopsy if diagnosis unclear after non-invasive testing
  - FibroScan (transient elastography) to assess fibrosis non-invasively
treatment:
  - Treat underlying cause
  - Alcohol-related: abstinence counseling and support
  - NAFLD/NASH: weight loss (7-10%), exercise, diabetes control, avoid alcohol
  - Viral hepatitis B: antiviral therapy (tenofovir, entecavir)
  - Viral hepatitis C: direct-acting antivirals (cure rate >95%)
  - Autoimmune hepatitis: prednisone + azathioprine
  - Hemochromatosis: phlebotomy to normalize iron stores
  - Wilson's disease: copper chelation (penicillamine, trientine)
  - Medication-induced: discontinue offending agent
  - Common culprits: acetaminophen, statins, NSAIDs, antibiotics, herbal supplements
  - General measures
  - Avoid hepatotoxins: alcohol, acetaminophen >2 g/day, unnecessary medications
  - Vaccinate for hepatitis A and B if not immune
  - Monitor for progression of liver disease
clinical_pearls:
  - "Mild transaminase elevation (<5x ULN) usually chronic liver disease; severe (>10x) suggests acute injury"
  - "AST:ALT ratio >2 highly suggestive of alcoholic liver disease"
  - "ALT more specific for liver than AST (AST also in muscle, heart, kidney)"
  - "Most common causes: NAFLD (most common in developed countries), alcohol, viral hepatitis, medications"
  - "Isolated alkaline phosphatase elevation often non-hepatic (bone, pregnancy, malignancy)"
  - "Normal PT/INR and albumin reassuring - indicates preserved synthetic function"
  - "Hepatitis C now curable with 8-12 week direct-acting antiviral regimens"
  - "NAFLD affects 25% of US population - spectrum from simple steatosis to NASH to cirrhosis"
  - "Always ask about herbal supplements - many hepatotoxic (green tea extract, kava, kratom)"
referrals:
  - Gastroenterology/Hepatology for persistent elevation, unclear etiology, or advanced liver disease
  - Consider GI referral if transaminases >3x ULN persisting >6 months
  - Liver transplant evaluation if cirrhosis with decompensation (MELD >15)
differentials:
  - Non-alcoholic fatty liver disease (NAFLD/NASH) - most common cause in US
  - Alcoholic liver disease (AST:ALT >2, history of heavy alcohol use)
  - Viral hepatitis (B, C, A, E, CMV, EBV)
  - Medication/drug-induced liver injury (acetaminophen, statins, antibiotics, herbal supplements)
  - Autoimmune hepatitis (positive ANA, ASMA, elevated IgG)
  - Hemochromatosis (elevated ferritin and transferrin saturation)
  - Wilson's disease (young patients, neurologic symptoms, low ceruloplasmin)
  - Alpha-1 antitrypsin deficiency (emphysema, liver disease, low AAT level)
  - Celiac disease (can cause mild transaminase elevation)
  - Thyroid disease (hypothyroidism can cause mild elevation)
  - Muscle disorders (elevated AST from rhabdomyolysis, check CK)
