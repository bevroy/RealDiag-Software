presentations:
  - Pelvic, perineal, or genital pain (> 3 months)
  - Urinary symptoms (frequency, urgency, dysuria)
  - Pain with ejaculation
  - No fever
  - Normal or tender prostate on DRE
  - Urine cultures often negative
differentials:
  - BPH
  - Prostate cancer
  - Chronic pelvic pain
  - Interstitial cystitis
workup:
  - 'Clinical diagnosis: Pelvic pain >3 months + LUTS, no fever, no clear bacterial infection'
  - 'UA with culture: Usually negative (if positive, treat but may still have CPPS)'
  - 'Post-prostate massage urine (Meares-Stamey 4-glass test): >10 WBC in expressed prostatic secretions = IIIA inflammatory. Rarely done in practice'
  - 'DRE: Normal or mildly tender prostate'
  - 'PSA: Usually normal (may be mildly elevated)'
treatment:
  - 'Guideline-based treatment options for Chronic Prostatitis/Chronic Pelvic Pain Syndrome include:'
  - 'Trial of antibiotics (even if culture-negative): Fluoroquinolonex4-6 weeks - helps 40% (AUA 2023)'
  - 'Alpha-blocker: Tamsulosin 0.4mg daily - relaxes bladder neck/prostate, improves urinary symptoms and pain in 50% (AUA 2023)'
  - 'NSAIDs: Ibuprofen 600mg TID or naproxen 500mg BID for pain (AUA 2023)'
  - 'Pelvic floor physical therapy: Myofascial release, trigger point therapy - effective in 50-60% (AUA 2023)'
  - 'Avoid: Cycling, prolonged sitting, spicy foods, caffeine, alcohol (may worsen symptoms) (AUA 2023)'
clinical_pearls:
  - Most common prostatitis syndrome (90% of cases) - chronic pelvic pain >3 months, often no bacteria identified
  - 'Two types: IIIA inflammatory (WBC in expressed prostatic secretions) vs IIIB non-inflammatory (no WBC) - treatment similar'
  - 'Etiology unclear: Not infectious in most cases, theories include pelvic floor dysfunction, neuromuscular pain, autoimmune'
  - 'NIH-CPSI (Chronic Prostatitis Symptom Index): Scores pain, urinary symptoms, quality of life - useful for monitoring treatment'
  - 'Frustrating condition: No cure, multiple failed treatments common, significant impact on quality of life'
