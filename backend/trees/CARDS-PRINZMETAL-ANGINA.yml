tree_id: CARDS-PRINZMETAL-ANGINA
name: Prinzmetal Angina (Variant Angina)
family: Cardiology
specialty: Cardiology
chief_complaint: Chest pain at rest in early morning hours
description: Angina from coronary artery vasospasm causing transient ST elevations, typically at rest or early morning. Often normal coronary arteries. Younger patients, associated with smoking and cocaine. Calcium channel blockers and nitrates prevent spasm. Avoid beta blockers alone.
icd10: I20.1
snomed: 371806007
urgency: urgent

workup:
  - Symptoms: angina at rest from coronary spasm
  - Chest pain at rest: typically early morning hours (4-6 AM)
  - Not related to exertion: distinguishes from typical angina
  - Duration: 5-15 minutes
  - May occur in clusters: multiple episodes over days then remission for weeks
  - Relieved by: nitroglycerin (vasodilator)
  - Syncope: if severe spasm or arrhythmia
  - Demographics: younger than typical angina patients (30-50 years)
  - Associated factors:
  - Smoking: strong association
  - Cocaine use: potent coronary vasoconstrictor
  - Migraine headaches: vasospastic disorders
  - Raynaud phenomenon: peripheral vasospasm
  - ECG during episode (diagnostic):
  - ST elevation: transient, in leads corresponding to spasm territory
  - Resolves when spasm resolves (distinguishes from STEMI)
  - May see ventricular arrhythmias during spasm (PVCs, VT)
  - ECG between episodes: normal
  - Cardiac biomarkers:
  - Troponin: usually normal (transient ischemia without necrosis)
  - May be mildly elevated if prolonged severe spasm
  - Coronary angiography:
  - Often normal coronary arteries (50% of cases)
  - May have mild non-obstructive disease
  - Provocative testing: ergonovine or acetylcholine infusion to induce spasm
  - Dangerous test, must be done with resuscitation ready
  - Positive: reproduces chest pain and ST elevations with normal coronaries
  - Holter monitoring: capture early morning ST elevations
  - Mechanism: coronary artery vasospasm
  - Endothelial dysfunction, smooth muscle hyperreactivity
  - Usually involves epicardial arteries (not microvascular)

treatment:
  - Acute episode:
  - Sublingual nitroglycerin: 0.4 mg, repeat Q5min (vasodilator, relieves spasm)
  - Usually very responsive to nitroglycerin
  - Long-term prevention (anti-spasm therapy):
  - Calcium channel blockers (first-line):
  - Diltiazem 180-360 mg daily or amlodipine 10 mg daily or nifedipine XL 60-120 mg daily
  - Very effective, reduce spasm frequency 90%
  - Long-acting nitrates:
  - Isosorbide mononitrate 60-120 mg daily
  - Combine with calcium channel blocker if needed
  - Avoid beta blockers alone:
  - May worsen vasospasm (unopposed alpha vasoconstriction)
  - Can use if combined with calcium channel blocker
  - Aspirin: controversial
  - May worsen vasospasm (blocks prostacyclin)
  - Use if underlying atherosclerotic disease present
  - Avoid triggers:
  - Smoking cessation: critical (smoking major trigger)
  - Avoid cocaine and amphetamines: potent vasoconstrictors
  - Avoid cold exposure
  - Stress reduction
  - Revascularization: not indicated
  - Problem is spasm not fixed stenosis
  - Stenting does not prevent spasm
  - Only if significant underlying atherosclerotic disease
  - Prognosis:
  - Variable: some patients have complete remission, others chronic recurrent episodes
  - Risk of MI: if prolonged severe spasm
  - Risk of sudden death: from arrhythmias during spasm (rare)
  - Better prognosis if normal coronary arteries vs underlying CAD

clinical_pearls:
  - Angina at rest with transient ST elevations that resolve (distinguishes from STEMI)
  - Typical timing: early morning hours (4-6 AM)
  - Often younger patients with normal coronary arteries
  - Associated with smoking and cocaine use
  - Calcium channel blockers first-line prevent spasm
  - Avoid beta blockers alone (may worsen vasospasm)
  - Very responsive to nitroglycerin

differentials:
  - STEMI: ST elevations but persistent, troponin elevated, CAD on angiography
  - Unstable angina: exertional pattern, no ST elevations at rest
  - Pericarditis: pleuritic pain, PR depression, friction rub
  - Esophageal spasm: dysphagia, may respond to nitroglycerin (confusing)

trace: |
  A 42-year-old man presented to ED with recurrent chest pain x2 weeks. Episodes occur at rest, typically between 4-6 AM (awakens from sleep with chest pain - classic timing for Prinzmetal), severe substernal pressure lasting 10-15 minutes, relieved by sublingual nitroglycerin (vasodilator relieves spasm). No pain with exertion during day (not exertional angina). Smoker x20 years (major risk factor for vasospastic angina). No diabetes, hypertension, or hyperlipidemia. Exam: BP 125/75, HR 68, otherwise unremarkable. Resting ECG in ED: normal, no ST changes (between episodes). Troponin: normal (no myocardial necrosis). Admitted for monitoring. At 5 AM on telemetry: chest pain with ST elevations 3 mm in V2-V4 (anterior ST elevations during episode - vasospasm in LAD territory). Given sublingual nitroglycerin 0.4 mg, pain resolved within 2 minutes, repeat ECG 10 minutes later showed complete resolution of ST elevations (transient ST elevations resolving with nitroglycerin diagnostic of Prinzmetal angina). Diagnosed with Prinzmetal variant angina (chest pain at rest early morning, transient ST elevations resolving spontaneously or with nitroglycerin, young patient, heavy smoker). Coronary angiography: completely normal coronary arteries, no stenosis (50% of Prinzmetal patients have normal arteries). Ergonovine provocation test performed (induces spasm): ergonovine 0.05 mg IV caused severe chest pain with ST elevations 4 mm in V2-V4 (reproduced symptoms and ECG changes - confirms vasospasm in LAD). Given IV nitroglycerin, spasm resolved. Positive provocation test confirms Prinzmetal angina. Started calcium channel blocker: diltiazem 180 mg daily (first-line to prevent coronary vasospasm). Long-acting nitrate: isosorbide mononitrate 60 mg daily (additional anti-spasm therapy). Sublingual nitroglycerin as needed for breakthrough episodes. Counseled on smoking cessation (critical - smoking major trigger for vasospasm). No aspirin (controversial in Prinzmetal, may worsen vasospasm). No beta blocker (contraindicated alone - may worsen vasospasm from unopposed alpha vasoconstriction). At 1 week: no further episodes of chest pain, diltiazem effective. At 4 weeks: quit smoking, no angina episodes for 3 weeks (smoking cessation and calcium channel blocker very effective). At 6 months: remains angina-free on diltiazem and isosorbide, continues smoking abstinence. At 1 year: attempted to wean medications, had recurrence of early morning angina, resumed diltiazem. Continues long-term calcium channel blocker therapy with excellent control. Prinzmetal angina successfully managed with anti-spasm therapy and smoking cessation.
