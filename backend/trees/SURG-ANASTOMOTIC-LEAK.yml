presentations:
  - Postoperative fever (POD 5-7 typically)
  - Abdominal pain
  - Tachycardia and leukocytosis
  - Peritoneal signs
  - Recent GI surgery or bowel anastomosis
  - May require reoperation
differentials:
  - Postop ileus
  - Abscess
  - Perforation
  - Wound infection
  - Fistula
workup: []
treatment:
  - Urgent surgical consultation - high mortality if untreated
  - NPO, aggressive IV fluid resuscitation
  - Broad-spectrum antibiotics - piperacillin-tazobactam 4.5g IV Q6H + vancomycin 15-20mg/kg IV Q8-12H
  - CT abdomen/pelvis with oral contrast - diagnostic test
  - Drain intra-abdominal collections percutaneously if possible
  - Operative management for peritonitis or septic shock - washout, diversion (colostomy/ileostomy), drain placement
  - ICU care - sepsis management, vasopressor support
  - TPN (total parenteral nutrition) - bowel rest during healing
  - Endoscopic approaches for selected leaks - stent placement, clips, vacuum therapy
  - Second-look operation in 24-48 hours if unstable
  - Mortality 10-30% depending on location and timing
