tree_id: OPTH-HORDEOLUM
name: Hordeolum (Stye)
family: Ophthalmology
specialty: Ophthalmology
chief_complaint: Painful red eyelid bump
description: Acute bacterial infection of eyelid gland causing painful red swollen nodule at lid margin. Warm compresses resolve most cases within 5-7 days, spontaneous drainage common, rarely requires incision and drainage.
icd10: H00.019
snomed: 1489008
urgency: routine

workup:
  - Clinical diagnosis: acute onset painful red swollen tender nodule on eyelid
  - External hordeolum (stye): infection of Zeis gland (sebaceous) or Moll gland (apocrine) at base of eyelash, points to skin surface
  - Internal hordeolum: infection of meibomian gland within tarsal plate, points to conjunctival surface, larger and more painful
  - Location: lid margin (external) or within eyelid pointing to conjunctiva (internal)
  - Tender to palpation: distinguishes from chalazion (painless)
  - Yellow pustule: may be visible at center (pointing)
  - Associated localized eyelid edema and erythema
  - Causative organism: Staphylococcus aureus (most common)
  - Risk factors: blepharitis, seborrheic dermatitis, rosacea, poor eyelid hygiene, diabetes
  - Usually unilateral and localized (vs diffuse in preseptal cellulitis)

treatment:
  - Conservative management (first-line): most resolve spontaneously in 5-7 days with warm compresses
  - Warm compresses: apply warm washcloth to closed eyelid 10-15 minutes QID (promotes drainage and resolution)
  - Do NOT squeeze or manipulate: may spread infection
  - Eyelid hygiene: gentle cleaning with diluted baby shampoo or lid scrub pads
  - Topical antibiotics: limited benefit but often prescribed
  - Erythromycin 0.5% or bacitracin ointment to eyelid margin QID x5-7 days
  - May prevent spread to adjacent glands
  - Systemic antibiotics: rarely needed, only if associated preseptal cellulitis or not responding
  - Dicloxacillin 500 mg QID or cephalexin 500 mg QID x7 days (MSSA coverage)
  - Pain control: acetaminophen or ibuprofen as needed
  - Incision and drainage: if large, pointing, and not draining spontaneously after 5-7 days
  - Under local anesthesia, small incision to release pus, immediate pain relief
  - Natural history: most drain spontaneously within 5-7 days with warm compresses
  - May evolve into chalazion: if acute infection resolves but granulomatous inflammation persists (chronic painless nodule)
  - Prevention: daily eyelid hygiene, treat underlying blepharitis

clinical_pearls:
  - Acute painful red swollen tender nodule at eyelid margin
  - External points to skin, internal points to conjunctiva
  - Warm compresses QID resolve most within 5-7 days
  - Most drain spontaneously - do NOT squeeze
  - Topical antibiotics limited benefit but often prescribed
  - Distinguish from chalazion: hordeolum acute and painful, chalazion chronic and painless
  - May evolve into chalazion if acute infection resolves but inflammation persists
  - Staphylococcus aureus most common organism

differentials:
  - Chalazion: painless chronic eyelid nodule, sterile granulomatous inflammation, develops over weeks
  - Preseptal cellulitis: diffuse eyelid swelling and erythema, fever, tender, no discrete nodule, may follow hordeolum
  - Dacryocystitis: infection of lacrimal sac at medial canthus, swelling and erythema medial lower eyelid, epiphora
  - Sebaceous cell carcinoma: painless recurrent lesion, loss of eyelashes, does not respond to antibiotics

trace: |
  A 35-year-old woman presented with 2 days of painful red bump on left upper eyelid. Acute onset, increasingly tender. No vision changes. Denies contact lens use. Exam showed localized tender erythematous swelling at upper eyelid margin with small yellow pustule at center (pointing to skin surface), no periorbital cellulitis, extraocular movements intact, vision normal. Diagnosed with external hordeolum (stye - infection of eyelash follicle gland). Started warm compresses: apply warm washcloth to closed eyelid 10-15 minutes four times daily to promote drainage. Prescribed erythromycin 0.5% ointment to eyelid margin four times daily x7 days. Ibuprofen 400 mg Q6H PRN for pain. Counseled NOT to squeeze or manipulate lesion (may spread infection). At 3 days pustule spontaneously drained overnight, pain significantly improved. At 5 days swelling resolved 80%, minimal residual tenderness. At 7 days completely resolved, eyelid normal. Counseled on prevention: daily eyelid hygiene with warm compresses and lid scrubs to prevent recurrence, especially if history of blepharitis. No incision and drainage needed.
