tree_id: CARD-HEART-FAILURE
name: Heart Failure
family: cardiovascular
specialty: Cardiology
chief_complaint: Shortness of breath, fatigue, leg swelling, orthopnea
description: Clinical syndrome from impaired cardiac output or elevated filling pressures
icd10: I50.9
urgency: urgent-to-emergency
workup:
  - Clinical presentation with symptoms and signs of volume overload
  - Dyspnea (exertional progressing to rest), orthopnea, paroxysmal nocturnal dyspnea
  - Fatigue, reduced exercise tolerance
  - Lower extremity edema, weight gain
  - Physical exam shows JVD, crackles, S3 gallop, peripheral edema, hepatomegaly
  - Classification by ejection fraction
  - HFrEF (reduced EF less than 40%) - systolic dysfunction
  - HFpEF (preserved EF greater than 50%) - diastolic dysfunction
  - HFmrEF (mildly reduced EF 41-49%) - intermediate
  - Common causes of HFrEF include CAD/MI, dilated cardiomyopathy, valvular disease, myocarditis
  - Common causes of HFpEF include hypertension, obesity, diabetes, aging
  - NYHA functional class assesses severity
  - Class I - no symptoms with ordinary activity
  - Class II - slight limitation, comfortable at rest
  - Class III - marked limitation, comfortable only at rest
  - Class IV - symptoms at rest
  - Diagnostic testing with BNP/NT-proBNP elevated (BNP greater than 100, NT-proBNP greater than 300)
  - Echocardiogram essential - measure EF, assess valves, wall motion, chamber sizes
  - Chest X-ray shows cardiomegaly, pulmonary edema, pleural effusions
  - EKG may show prior MI, LVH, LBBB, arrhythmia
  - Labs include BMP (renal function), CBC, TSH, lipids, troponin if ACS suspected
treatment:
  - Acute decompensated heart failure - diuresis and hemodynamic support
  - IV furosemide 40-80 mg bolus (or 2x home dose), repeat or continuous infusion
  - Goal negative fluid balance, symptom relief
  - Oxygen for hypoxemia, BiPAP if respiratory distress
  - Vasodilators if hypertensive (nitroglycerin, nitroprusside)
  - Inotropes if cardiogenic shock (dobutamine, milrinone)
  - Admit for IV diuresis if significant volume overload
  - Chronic HFrEF - guideline-directed medical therapy (GDMT)
  - Four pillars of HFrEF treatment (all proven mortality benefit)
  - ACE inhibitor or ARB or ARNI (sacubitril/valsartan)
  - ARNI superior to ACE/ARB (sacubitril/valsartan 24/26-97/103 mg BID)
  - If not on ARNI - lisinopril 10-40 mg daily or losartan 50-100 mg daily
  - Beta-blocker (carvedilol 3.125-25 mg BID, metoprolol succinate 12.5-200 mg daily, bisoprolol)
  - Mineralocorticoid receptor antagonist (spironolactone 12.5-50 mg daily, eplerenone 25-50 mg daily)
  - SGLT2 inhibitor (dapagliflozin 10 mg daily, empagliflozin 10 mg daily) - even if no diabetes
  - Loop diuretics for volume management (furosemide, bumetanide, torsemide)
  - Not mortality benefit but symptom control
  - Devices for select patients
  - ICD if EF 35% or less despite 3 months optimal medical therapy (primary prevention SCD)
  - CRT if EF 35% or less, NYHA II-IV, LBBB with QRS greater than 150 ms (improves outcomes)
  - HFpEF treatment - less evidence, focus on comorbidities
  - SGLT2 inhibitors (dapagliflozin, empagliflozin) reduce hospitalizations
  - Diuretics for volume overload
  - Control hypertension, treat AF, manage obesity
  - Lifestyle modifications include sodium restriction (less than 2-3 g/day), fluid restriction if severe, daily weights
  - Exercise encouraged once compensated
  - Prognosis - 5-year mortality 50% for HFrEF, better with modern therapy
clinical_pearls:
  - BNP/NT-proBNP elevated in heart failure (rules out if normal)
  - Echo essential to measure EF and guide therapy
  - GDMT four pillars for HFrEF - ARNI, beta-blocker, MRA, SGLT2 inhibitor
  - SGLT2 inhibitors benefit both HFrEF and HFpEF
  - ARNI (sacubitril/valsartan) superior to ACE inhibitor
  - ICD for primary prevention if EF 35% or less
  - CRT dramatically improves outcomes if LBBB with QRS greater than 150 ms
  - Daily weights detect early decompensation (gain 2-3 pounds in 1-2 days)
differentials:
  - COPD exacerbation (wheezing, smoking history)
  - Pulmonary embolism (sudden dyspnea, hypoxemia)
  - Pneumonia (fever, cough, infiltrate)
  - Renal failure (volume overload, elevated Cr)
  - Cirrhosis with ascites (liver disease, ascites predominant)
trace:
  - 65-year-old man with CAD s/p MI 5 years ago presents with progressive dyspnea x 3 months
  - Dyspnea walking one block, climbing stairs
  - Sleeps on 3 pillows (orthopnea), wakes short of breath at night
  - Gained 10 pounds, legs swollen
  - Fatigue, cannot do usual activities
  - Past medical history - MI 5 years ago with stent, hypertension, diabetes
  - Medications - aspirin, atorvastatin, lisinopril 10 mg daily, metoprolol 25 mg BID
  - Exam shows JVD to angle of jaw, bibasilar crackles, S3 gallop, 2+ pitting edema to knees
  - BP 110/70, HR 88, RR 20, SpO2 92% on room air
  - BNP 850 pg/mL (elevated, diagnostic for HF)
  - Chest X-ray shows cardiomegaly, pulmonary vascular congestion, small pleural effusions
  - Echo shows EF 30% (reduced), global hypokinesis, dilated LV
  - Diagnosis - heart failure with reduced ejection fraction (HFrEF), NYHA class III
  - Likely ischemic cardiomyopathy from prior MI
  - Acute decompensated heart failure with volume overload
  - Admitted for IV diuresis
  - Furosemide 40 mg IV BID, negative fluid balance 1-2 L daily
  - Dyspnea improved, weight down 8 pounds
  - JVD resolved, crackles cleared
  - Discharged after 3 days
  - Medications optimized to GDMT
  - Switch lisinopril to sacubitril/valsartan 24/26 mg BID (ARNI)
  - Increase metoprolol to metoprolol succinate 100 mg daily
  - Add spironolactone 25 mg daily (MRA)
  - Add dapagliflozin 10 mg daily (SGLT2 inhibitor)
  - Furosemide 40 mg daily for volume management
  - Daily weights, sodium restriction
  - Cardiology follow-up 2 weeks
  - 2 weeks post-discharge - feeling much better
  - Dyspnea improved, can walk several blocks
  - Weight stable, no edema
  - Tolerating GDMT well
  - 3 months on GDMT - significant improvement
  - NYHA class II (slight limitation only)
  - Echo shows EF improved to 40% (improvement on GDMT)
  - Qualifies for ICD evaluation (EF still 35-40% range)
  - EF 35% or less after 3 months optimal therapy → ICD indicated
  - Will recheck echo at 6 months, if EF still 35% or less will place ICD
  - Continue GDMT
  - 6 months echo EF 38%, LBBB present with QRS 158 ms
  - Referred for CRT-D (cardiac resynchronization therapy with defibrillator)
  - Device improves outcomes in LBBB with wide QRS
  - CRT-D implanted successfully
  - 1 year post-hospitalization - doing very well
  - NYHA class I-II, active lifestyle
  - No HF hospitalizations
  - EF improved to 45% on repeat echo (excellent response to GDMT + CRT)
  - Continues all GDMT medications
  - Outcome - successful treatment with GDMT and device therapy, significant improvement in symptoms and EF
