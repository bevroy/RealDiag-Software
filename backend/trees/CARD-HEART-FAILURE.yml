tree_id: CARD-HEART-FAILURE
name: Heart Failure
family: Cardiology
specialty: Cardiology
chief_complaint: Dyspnea and peripheral edema
description: |
  Inability of heart to meet metabolic demands. HFrEF (EF <40%) vs HFpEF (EF ≥50%).
  5-year mortality 50%. Leading cause of hospitalization in patients >65 years. Most common causes: CAD, hypertension, valvular disease.
icd10: I50.9
urgency: High
workup:
  - BNP or NT-proBNP (BNP >100 pg/mL or NT-proBNP >300 pg/mL suggests HF, higher levels indicate worse prognosis)
  - Echocardiogram (assess EF, wall motion, valvular function, diastolic function)
  - Chest X-ray (cardiomegaly, pulmonary edema, pleural effusions, Kerley B lines)
  - ECG (may show MI, arrhythmia, LVH)
  - Complete metabolic panel (renal function critical for medication dosing)
  - CBC (anemia worsens HF), TSH (hyperthyroidism or hypothyroidism can cause HF)
  - Coronary angiography if ischemic etiology suspected (revascularization may improve EF)
  - Consider cardiac MRI if infiltrative disease (amyloidosis, sarcoidosis, hemochromatosis) suspected
treatment:
  - ACE inhibitor or ARB (enalapril 10-20mg BID, lisinopril 20-40mg daily) - improves survival in HFrEF
  - Beta-blocker (carvedilol 25mg BID, metoprolol succinate 200mg daily, bisoprolol 10mg daily) - reduces mortality 35%
  - Aldosterone antagonist (spironolactone 25mg daily) if NYHA class II-IV - reduces mortality 30%
  - SGLT2 inhibitor (dapagliflozin 10mg, empagliflozin 10mg daily) - reduces HF hospitalization 30%, improves survival
  - Loop diuretic for fluid overload (furosemide 40-80mg daily, titrate to euvolemia)
  - ARNI (sacubitril/valsartan) replaces ACE/ARB if still symptomatic on optimal therapy
  - ICD placement if EF <35% despite 3 months optimal medical therapy (reduces sudden death)
  - Cardiac resynchronization therapy (CRT) if EF <35%, QRS >150ms, LBBB morphology
  - Dietary sodium restriction <2g/day, fluid restriction <2L/day if hyponatremia
clinical_pearls:
  - NYHA classification - Class I (no symptoms), II (symptoms with moderate activity), III (symptoms with minimal activity), IV (symptoms at rest)
  - Acute decompensation triggers - medication non-adherence, dietary indiscretion, infection, arrhythmia, MI, anemia
  - Quadruple therapy (ACE/ARB/ARNI plus beta-blocker plus aldosterone antagonist plus SGLT2 inhibitor) is new standard for HFrEF
  - HFpEF treatment - manage hypertension, treat atrial fibrillation, diuretics for congestion (no proven mortality benefit drugs)
  - Avoid NSAIDs, CCBs (except amlodipine), thiazolidinediones (worsen fluid retention)
  - Daily weights monitored - gain of 2-3 lbs in 1 day or 5 lbs in 1 week suggests decompensation
differentials:
  - Pulmonary edema from other causes
  - Chronic obstructive pulmonary disease
  - Pulmonary embolism
  - Cirrhosis with ascites
  - Nephrotic syndrome
  - Venous insufficiency
trace:
  - Dyspnea and peripheral edema → BNP elevated >400 pg/mL → Echocardiogram shows EF 30% → Diagnose HFrEF → Initiate ACE inhibitor and beta-blocker → Add spironolactone → Add SGLT2 inhibitor → Persistent symptoms after 3 months, EF still 30% → Upgrade ACE to ARNI → Consider ICD placement → If QRS >150ms with LBBB, add CRT
