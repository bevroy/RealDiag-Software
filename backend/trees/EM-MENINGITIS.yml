tree_id: EM-MENINGITIS
name: Acute Bacterial Meningitis
family: Emergency Medicine
specialty: Emergency Medicine
icd10:
- G00.9
- G03.9
snomed:
- '95883001'
urgency: urgent
description: Comprehensive evaluation and management of Acute Bacterial Meningitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Classic triad (only 44% have all): Fever, headache, neck stiffness (nuchal rigidity)'
- Altered mental status, confusion, lethargy (80%)
- Photophobia, phonophobia
- 'Kernig sign: Resistance to knee extension with hip flexed 90°'
- 'Brudzinski sign: Involuntary hip flexion when neck flexed'
- 'Petechial or purpuric rash: N. meningitidis (emergency - high mortality)'
- Seizures (20-30%), focal neurologic deficits (10-20%)
- 'Risk factors: Immunocompromised, recent neurosurgery, CSF shunt, basilar skull
  fracture'
workup: []
treatment:
- 'Guideline-based treatment options for Acute Bacterial Meningitis include:'
- 'Immediate: Blood cultures ×2, empiric antibiotics + dexamethasone (ACEP 2023)'
- 'Empiric antibiotics: <50yr, >50yr (add ampicillin 2g IV q4h) (ACEP 2023)'
- 'Dexamethasone: 0.15mg/kg IV (max 10mg) before or with first antibiotic dose (ACEP
  2023)'
- 'LP when safe: Opening pressure, cell count with differential, glucose, protein,
  Gram stain, culture (ACEP 2023)'
- 'Disposition: ICU admission, respiratory isolation if N. meningitidis suspected,
  prophylaxis for close contacts (ACEP 2023)'
clinical_pearls:
- 'Do NOT delay antibiotics for LP: Give antibiotics FIRST if LP will be delayed >30
  min'
- 'Empiric antibiotics by age: <50yr (vancomycin + ceftriaxone), >50yr or immunocompromised
  (add ampicillin for Listeria)'
- 'Dexamethasone 0.15mg/kg before or with antibiotics: Reduces mortality/morbidity
  in pneumococcal meningitis'
- 'CT head before LP if: Altered mental status, focal deficits, papilledema, immunocompromised
  (concern for mass effect)'
- 'CSF interpretation: Bacterial (WBC >1000, PMNs, glucose <40, protein >200) vs Viral
  (lymphocytes <300, normal glucose)'
- 'LP opening pressure: Normal 5-20 cm H2O, elevated (>25) suggests bacterial or fungal'
referrals: []
differentials: []
