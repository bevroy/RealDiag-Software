name: Ovarian Cancer
version: '1.0'
status: draft
family: obstetrics_gynecology
specialty: OB/GYN
secondary_specialties:
  - Oncology
urgency: urgent
urgency_explanation: ''
chief_complaint: Abdominal bloating, pelvic mass, abdominal pain
description: |
  Ovarian cancer is the most lethal gynecologic malignancy, often diagnosed at advanced stages due to vague symptoms.
  Risk factors include BRCA mutations, family history, nulliparity, endometriosis. Epithelial ovarian cancer is most common type.
