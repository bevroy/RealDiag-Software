urgency: medium
description: Comprehensive evaluation and management of Croup (Laryngotracheobronchitis)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Barking "seal-like" cough (most characteristic)
- Inspiratory stridor (high-pitched sound on inspiration)
- Hoarse voice, dysphonia
- Symptoms worse at night
- Preceded by 1-2 days of URI symptoms (rhinorrhea, low-grade fever)
- Age 6 months to 3 years (peak at 2 years)
- Parainfluenza virus (most common cause, 75%)
- 'Westley Croup Score: 0-17 (stridor, retractions, air entry, cyanosis, LOC)'
workup: []
treatment:
- 'Guideline-based treatment options for Croup (Laryngotracheobronchitis) include:'
- 'All patients: Dexamethasone 0.6mg/kg PO or IM (max 10mg), single dose (AAP 2023)'
- 'Mild croup (no stridor at rest): Dexamethasone and discharge with precautions (AAP
  2023)'
- 'Moderate-severe (stridor at rest): Racemic epinephrine 0.5mL (2.25%) + 3mL NS nebulizer
  (AAP 2023)'
- 'Observe 2-3 hours after epinephrine: Rebound stridor can occur, may need repeat
  dosing (AAP 2023)'
- 'Disposition: Discharge if mild and improved, admit if severe, persistent stridor,
  or respiratory distress (AAP 2023)'
clinical_pearls:
- Westley score <3 = mild (treat outpatient), 3-7 = moderate, ≥8 = severe (hospitalize)
- Dexamethasone 0.6mg/kg PO/IM (max 10mg) = mainstay treatment, single dose usually
  sufficient
- Racemic epinephrine nebulizer 0.5mL in 3mL NS for severe croup (provides 2hr relief)
- Cool mist therapy or taking child outside in cold air may provide symptomatic relief
- 'Steeple sign on neck X-ray: Subglottic narrowing (but diagnosis is clinical, don''t
  need X-ray)'
- Most improve within 48 hours, but can worsen at night
referrals: []
differentials:
  - Epiglottitis
  - Bacterial tracheitis
  - Foreign body
  - Asthma
  - Anaphylaxis
