tree_id: ORTHO-LUMBAR-SPINAL-STENOSIS
name: Lumbar Spinal Stenosis
family: Orthopedics
specialty: Orthopedics
chief_complaint: Back and leg pain worse with walking
description: |
  Narrowing of lumbar spinal canal causing compression of nerve roots. Most commonly degenerative from facet arthropathy, disc degeneration, ligamentum flavum hypertrophy.
  Typically affects older adults (over 60). Symptoms include neurogenic claudication - leg pain/weakness with walking relieved by sitting or flexion. Progressive condition.
icd10: M48.06
snomed: 76107001
presentations:
  - Neurogenic claudication: leg pain with walking
  - Pain relieved by sitting, leaning forward (shopping cart sign)
  - Bilateral leg symptoms
  - Numbness, weakness in legs
  - Back pain variable
  - Worsens with lumbar extension
urgency: Moderate
referrals:
  emergency:
    - Open fracture
    - Compartment syndrome
    - Neurovascular injury
  urgent:
    - Closed fracture
    - Joint dislocation
    - Septic arthritis
  routine:
    - Chronic joint pain
    - Osteoarthritis
    - Sports injury

workup:
  - Clinical presentation - neurogenic claudication (bilateral leg pain, numbness, weakness with walking or standing), relieved by sitting or forward flexion (shopping cart sign)
  - Distinguish from vascular claudication (calf pain only, relieved by standing still, diminished pulses) and lumbar radiculopathy (unilateral, dermatomal)
  - Pain improves going uphill (flexion opens canal) and worsens going downhill (extension narrows canal)
  - Physical exam - normal at rest, neurologic exam may show subtle weakness or sensory changes, straight leg raise usually negative
  - Romberg test, gait assessment, check for myelopathy (hyperreflexia, Babinski sign suggests cervical stenosis)
  - MRI lumbar spine without contrast - shows spinal canal narrowing, neural foraminal stenosis, disc bulging, facet hypertrophy
  - Central canal stenosis (anteroposterior diameter less than 10 mm severe), lateral recess stenosis, foraminal stenosis
  - Standing plain films (AP and lateral) assess alignment, spondylolisthesis (vertebral slippage)
  - CT myelography if MRI contraindicated - shows spinal cord and nerve root compression
  - Ankle-brachial index if vascular claudication suspected
treatment:
  - Conservative management first-line for most patients
  - Physical therapy - core strengthening, flexion exercises (relieve symptoms by opening canal), aerobic conditioning
  - NSAIDs - ibuprofen 600-800mg TID, naproxen 500mg BID (short-term, monitor renal function in elderly)
  - Neuropathic pain medications - gabapentin 300-3600mg daily in divided doses, pregabalin 150-600mg daily
  - Epidural steroid injections (ESI) - transforaminal or interlaminar, provides temporary relief (weeks to months) in 50%, can repeat up to 3 times per year
  - Avoid prolonged walking/standing, use assistive devices (cane, walker) if needed
  - Weight loss if obese
  - Surgical decompression (laminectomy) if conservative treatment fails and significant functional impairment
  - Indications - intractable pain despite 3-6 months conservative therapy, progressive neurologic deficit, cauda equina syndrome (rare emergency)
  - Laminectomy removes posterior elements to decompress canal - 70-80% good outcomes at 2 years
  - Fusion added if spondylolisthesis, scoliosis, or instability present
  - Minimally invasive techniques (interspinous spacers) less proven efficacy
  - Surgical risks - dural tear, infection, hardware failure, adjacent segment disease, persistent pain
clinical_pearls:
  - Neurogenic claudication triad - bilateral leg symptoms, worse with walking/standing, relief with sitting/flexion
  - Patients often lean forward on shopping cart for relief (shopping cart sign)
  - Natural history variable - one-third improve, one-third stable, one-third worsen over 4-10 years
  - Cauda equina syndrome rare but surgical emergency - bilateral leg weakness, saddle anesthesia, bowel/bladder dysfunction
  - Tandem stenosis (cervical plus lumbar) causes myelopathy and radiculopathy - assess cervical spine if upper motor neuron signs
  - Congenital stenosis (achondroplasia, developmental) presents at younger age
differentials:
  - Peripheral arterial disease (vascular claudication)
  - Lumbar radiculopathy
  - Peripheral neuropathy
  - Hip arthritis
  - Trochanteric bursitis
  - Chronic venous insufficiency
trace:
  - 68-year-old man with bilateral leg pain and numbness when walking greater than 2 blocks x 1 year → Symptoms improve when sitting or leaning on shopping cart → No back pain at rest → Exam shows normal strength and sensation at rest, normal pulses → MRI lumbar spine shows severe central canal stenosis L3-L4 and L4-L5 (AP diameter 8 mm), moderate facet arthropathy, disc bulging → Diagnose lumbar spinal stenosis → Start physical therapy with flexion exercises, core strengthening → Gabapentin 300mg nightly, titrate to 900mg TID → NSAIDs PRN → Symptoms persist, limiting walking to 1 block → Lumbar epidural steroid injection L4-L5 provides 6 weeks relief → Symptoms recur → Patient opts for surgical decompression → Laminectomy L3-L5 performed → Postop improvement, ambulating 6 blocks without symptoms at 3 months → Physical therapy continues, no fusion needed
