tree_id: CARDS-PVCS
name: Premature Ventricular Contractions (PVCs)
family: Cardiology
specialty: Cardiology
chief_complaint: Palpitations and skipped beats
description: Ectopic ventricular beats arising from ventricles causing wide QRS complexes. Usually benign in structurally normal heart. High burden (over 10-20% of beats) can cause PVC-induced cardiomyopathy. Beta blockers for symptoms, catheter ablation for high burden or cardiomyopathy.
icd10: I49.3
snomed: 164884008
presentations:
  - Palpitations: skipped or extra beats
  - Sensation of pauses or thumping
  - Often asymptomatic
  - May increase with stress, caffeine, or alcohol
  - Usually benign if structurally normal heart
urgency: non-urgent

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Symptoms: often asymptomatic or minimal
  - Palpitations: feeling of skipped beat or extra beat
  - Chest discomfort: brief pause after PVC
  - Dyspnea: if very frequent (high burden)
  - Fatigue: if PVC-induced cardiomyopathy develops
  - Often asymptomatic: discovered incidentally on ECG or Holter
  - ECG findings:
  - Wide QRS complex: over 120 ms (ventricular origin)
  - Premature: occurs before next expected sinus beat
  - No preceding P wave
  - Compensatory pause: full compensatory pause after PVC (unlike PAC)
  - Morphology indicates origin:
  - RVOT (right ventricular outflow tract): LBBB morphology, inferior axis (positive in II, III, aVF), most common benign PVC origin
  - LV: RBBB morphology, variable axis
  - Patterns:
  - Bigeminy: every other beat is PVC
  - Trigeminy: every third beat is PVC
  - Couplets: two consecutive PVCs
  - Non-sustained VT: three or more consecutive PVCs
  - Frequency (PVC burden):
  - Low burden: under 5% of total beats per day
  - Moderate burden: 5-10%
  - High burden: over 10-20% (over 10,000-20,000 PVCs per day)
  - Very high burden: over 20-30% (risk of PVC-induced cardiomyopathy)
  - Holter monitor (24-48 hours):
  - Quantify PVC burden (percentage of total beats)
  - Assess for non-sustained VT
  - Correlate symptoms with PVCs
  - Echocardiogram:
  - Assess LV function (EF)
  - Rule out structural heart disease
  - PVC-induced cardiomyopathy: reduced EF from chronic high PVC burden (over 20-30%)
  - Reversible with PVC suppression
  - Exercise stress test:
  - PVCs suppressed with exercise suggests benign (vagal PVCs)
  - PVCs increased with exercise may indicate ischemia or pathologic
  - Evaluate for coronary disease
  - Causes:
  - Idiopathic: most common in structurally normal heart (benign)
  - Structural heart disease: CAD, cardiomyopathy, valvular disease
  - Ischemia: acute MI, chronic CAD
  - Electrolyte abnormalities: hypokalemia, hypomagnesemia
  - Stimulants: caffeine, alcohol, cocaine, amphetamines
  - Medications: digoxin toxicity
  - Metabolic: hyperthyroidism
  - High burden PVCs: can cause cardiomyopathy (cause or effect)

treatment:
  - No treatment needed if:
  - Asymptomatic or minimally symptomatic
  - Low PVC burden (under 10%)
  - Structurally normal heart
  - Benign morphology (RVOT origin)
  - Reassurance: PVCs are benign in structurally normal heart
  - Lifestyle modifications:
  - Reduce caffeine, alcohol, stimulants
  - Manage stress, adequate sleep
  - Correct electrolytes: potassium over 4 mEq/L, magnesium over 2 mg/dL
  - Beta blockers (first-line for symptomatic PVCs):
  - Metoprolol 25-100 mg BID or atenolol 50-100 mg daily
  - Suppress PVCs and reduce symptoms
  - Most effective for RVOT PVCs
  - Calcium channel blockers: verapamil or diltiazem (alternative to beta blockers)
  - Antiarrhythmic medications (if high burden or refractory):
  - Class IC: flecainide 50-150 mg BID (if no structural heart disease)
  - Class III: sotalol, amiodarone (if structural heart disease)
  - Use with caution (proarrhythmic risk)
  - Catheter ablation:
  - Indications:
  - PVC-induced cardiomyopathy (high burden over 20-30% with reduced EF)
  - Symptomatic refractory to medications
  - Patient preference to avoid long-term medications
  - Success rate: 70-90% depending on PVC origin
  - RVOT PVCs: higher success rate (over 85%)
  - Epicardial or unusual origins: lower success rate
  - PVC-induced cardiomyopathy: EF improves after ablation (reverses cardiomyopathy)
  - Treat underlying causes:
  - Ischemia: revascularization
  - Electrolytes: correct hypokalemia, hypomagnesemia
  - Hyperthyroidism: treat thyroid disorder
  - Digoxin toxicity: stop digoxin

clinical_pearls:
  - Wide QRS complex (over 120 ms) with compensatory pause
  - Benign in structurally normal heart (RVOT origin most common)
  - High burden over 20-30% can cause reversible cardiomyopathy
  - Beta blockers first-line for symptomatic PVCs
  - Catheter ablation for high burden with cardiomyopathy or refractory symptoms
  - RVOT PVCs: LBBB morphology with inferior axis
  - PVCs suppressed with exercise suggests benign

differentials:
  - PACs (premature atrial contractions): narrow QRS with P wave, non-compensatory pause
  - Aberrantly conducted PACs: wide QRS but preceded by premature P wave
  - Bundle branch block: wide QRS but regular rhythm, not premature
  - Artifact: mimics ectopy but patient asymptomatic

trace: |
  A 35-year-old woman presented with palpitations x6 months. Frequent sensation of skipped beats, especially at rest and bedtime (vagal PVCs common at rest), not with exercise. No chest pain, no syncope, no dyspnea. Otherwise healthy, no medications, moderate caffeine use (3 cups coffee daily). Exam: BP 120/75, HR 72 with occasional irregular beats (PVCs), no murmurs. ECG: normal sinus rhythm with frequent PVCs, wide QRS 140 ms, LBBB morphology with inferior axis (positive in II, III, aVF), positive in V5-V6 (consistent with RVOT origin - benign location, most common idiopathic PVC origin). 48-hour Holter monitor: 12,000 PVCs per day (high burden, approximately 10% of total beats assuming baseline HR 70 bpm = 100,000 beats per day), all uniform morphology (monomorphic), no non-sustained VT, symptoms correlated with PVCs. Echocardiogram: structurally normal heart, EF 60% (normal), no abnormalities. Diagnosed with frequent idiopathic PVCs from RVOT (benign origin, structurally normal heart). PVC burden 10% (borderline high but EF normal - no cardiomyopathy yet). Counseled on benign nature (reassurance important). Advised to reduce caffeine (cut to 1 cup daily), avoid alcohol. Started metoprolol 25 mg BID (beta blocker first-line for symptomatic PVCs). At 2 weeks: palpitations reduced 50%, tolerating metoprolol well. Repeat Holter at 6 weeks: PVC burden decreased to 3,000 per day (3% burden - beta blocker effective). At 6 months: minimal palpitations, occasional awareness but much improved. Continues low-dose metoprolol. At 2 years: PVCs well-controlled on metoprolol, no development of cardiomyopathy (EF remains 60%), excellent quality of life. Beta blockers effective for symptomatic idiopathic PVCs.

