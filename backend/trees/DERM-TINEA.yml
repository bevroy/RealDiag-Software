  - Pruritic
  - KOH positive for hyphae
differentials:
  - Eczema
  - Psoriasis
  - Contact dermatitis
  - Candidiasis
  - Seborrheic dermatitis
workup:
  - KOH prep: Scrape scale, add KOH, look for hyphae (quick office test)
  - Fungal culture if KOH negative but high suspicion (takes 2-4 weeks)
  - Wood's lamp (no longer used - only works for rare Microsporum species)
treatment:
  - 'Guideline-based treatment options for Tinea Corporis (Ringworm) include:'
  - 'Tinea corporis/cruris: Topical azole (clotrimazole, ketoconazole) BID for 2-4 weeks (AAD 2023)'
  - 'Tinea pedis: Topical terbinafine 1% BID for 1-2 weeks (most effective) (AAD 2023)'
  - 'Extensive/refractory: Oral terbinafine 250mg daily for 2-4 weeks (AAD 2023)'
  - 'Tinea capitis: Oral griseofulvin 20-25mg/kg/day for 6-8 weeks (first-line in children) (AAD 2023)'
  - 'Alternative for capitis: Oral terbinafine or fluconazole (AAD 2023)'
clinical_pearls:
  - 'Dermatophyte infection: Trichophyton, Microsporum, Epidermophyton species'
  - 'Named by location: Corporis (body), cruris (groin), pedis (feet), capitis (scalp)'
  - Tinea capitis requires oral therapy (topicals don't penetrate hair follicles)
  - Steroid use can modify appearance ('tinea incognito') - looks atypical
  - 'Majocchi granuloma: Deep follicular infection, requires systemic therapy'
