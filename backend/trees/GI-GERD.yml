author: RealDiag Clinical Team
homeopathy: []
presentations:
- Heartburn (pyrosis)
- Regurgitation
- Dysphagia
- Chronic cough
- Laryngitis or hoarseness
- Symptoms worse when lying down
workup:
- None needed for typical symptoms (empiric PPI trial)
- 'EGD if: Alarm symptoms, refractory symptoms, or long-standing GERD (screen for
  Barrett''s)'
- Esophageal pH monitoring if diagnosis uncertain or evaluating for anti-reflux surgery
- Esophageal manometry if dysphagia present (rule out achalasia, scleroderma)
treatment:
- 'Guideline-based treatment options for Gastroesophageal Reflux Disease (GERD) include:'
- 'Lifestyle: Weight loss, elevate head of bed 6-8 inches, avoid meals 3 hours before
  bed (ACG 2023)'
- 'Avoid triggers: Caffeine, alcohol, chocolate, peppermint, fatty foods, smoking
  (ACG 2023)'
- 'PPI therapy: Omeprazole 20mg daily or pantoprazole 40mg daily x 8 weeks (take 30-60min
  before breakfast) (ACG 2023)'
- 'If refractory: Increase PPI to BID dosing or switch PPI (ACG 2023)'
- Consider H2 blocker at bedtime for nocturnal symptoms (ranitidine, famotidine) (ACG
  2023)
clinical_pearls:
- 'Clinical diagnosis: Typical symptoms (heartburn, regurgitation) - no testing needed'
- 'PPI trial: If symptoms improve on PPI, confirms GERD (diagnostic and therapeutic)'
- 'Alarm symptoms: Dysphagia, weight loss, anemia, vomiting - need EGD'
- 'Barrett''s esophagus: Chronic GERD causes intestinal metaplasia (increased cancer
  risk)'
- 'Extraesophageal manifestations: Chronic cough, asthma, laryngitis (less responsive
  to PPI)'
- 'Lifestyle modifications: Elevate head of bed, avoid late meals, lose weight, avoid
  triggers'
referrals:
- 'Gastroenterology if: Refractory to PPI, alarm symptoms, Barrett''s esophagus, or
  surgical candidate'
- Surgery (Nissen fundoplication) if medical therapy fails or patient preference
- ENT if extraesophageal symptoms (laryngitis, chronic cough)
differentials:
  - Peptic ulcer disease
  - Esophageal cancer
  - Eosinophilic esophagitis
  - Cardiac ischemia
  - Functional dyspepsia
