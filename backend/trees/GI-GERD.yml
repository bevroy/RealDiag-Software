tree_id: GI-GERD
name: Gastroesophageal Reflux Disease
family: Gastrointestinal
specialty: Gastroenterology
chief_complaint: Heartburn
description: Chronic condition from reflux of gastric contents into esophagus causing symptoms and/or mucosal injury

icd10: K21.9

urgency: routine

workup:
  - Clinical presentation: heartburn (burning retrosternal discomfort), regurgitation, dysphagia, chronic cough, hoarseness, asthma exacerbations, dental erosions (extraesophageal symptoms)
  - Typical symptoms (heartburn, regurgitation): empiric trial of PPI without testing (most cost-effective approach)
  - Alarm features require endoscopy: dysphagia, odynophagia, weight loss, GI bleeding, anemia, persistent vomiting, age greater than 60 with new-onset symptoms, family history esophageal cancer
  - Upper endoscopy (EGD): visualize esophageal mucosa, identify complications (esophagitis LA grade A-D, stricture, Barrett esophagus, adenocarcinoma), biopsies for Barrett surveillance, normal endoscopy does not exclude GERD (60 percent have nonerosive reflux disease NERD)
  - Esophageal pH monitoring (24-hour ambulatory or wireless Bravo): gold standard confirms acid reflux, indicated if PPI failure or atypical symptoms, abnormal if pH less than 4 for greater than 4-6 percent of time
  - Esophageal manometry: assess esophageal motility before antireflux surgery, exclude achalasia or other motility disorders (can mimic GERD)
  - Barium esophagram: hiatal hernia, stricture, anatomic abnormalities
  - Barrett esophagus: intestinal metaplasia (goblet cells) in distal esophagus from chronic acid exposure, precursor to adenocarcinoma, requires surveillance endoscopy every 3-5 years (no dysplasia) or more frequently if dysplasia

treatment:
  - Lifestyle modifications (all patients): elevate head of bed 6-8 inches, avoid meals 2-3 hours before bedtime, lose weight if overweight (5-10 percent weight loss improves symptoms), avoid trigger foods (caffeine, alcohol, chocolate, peppermint, fatty foods, citrus, tomatoes, spicy foods), smoking cessation, avoid tight clothing
  - Mild intermittent symptoms: antacids PRN (Maalox, Tums) or H2 receptor antagonists (famotidine 20 mg BID, ranitidine - note FDA removed ranitidine 2020 for NDMA contamination)
  - Moderate-severe or frequent symptoms: PPI first-line therapy (omeprazole 20 mg daily, lansoprazole 30 mg daily, esomeprazole 40 mg daily, pantoprazole 40 mg daily) - take 30-60 minutes before breakfast, 8-week course for healing esophagitis
  - PPI response: 70-80 percent have symptom improvement in 4-8 weeks, if inadequate response increase to BID (before breakfast and dinner), ensure compliance and proper timing
  - PPI-refractory GERD: pH monitoring to confirm acid reflux, consider alternative diagnosis (functional heartburn, eosinophilic esophagitis, achalasia), optimize PPI timing and dose, add nighttime H2RA if nocturnal symptoms, prokinetic agent (metoclopramide) if delayed gastric emptying
  - Long-term PPI therapy: step down to lowest effective dose, on-demand dosing for mild symptoms, concerns about long-term use include increased risk osteoporosis/fractures, C. difficile infection, hypomagnesemia, vitamin B12 deficiency, chronic kidney disease (absolute risk low), consider calcium/vitamin D supplementation, periodic magnesium/B12 monitoring
  - Antireflux surgery (fundoplication): indicated if proven GERD with inadequate response to medical therapy or desire to discontinue lifelong medications, requires esophageal manometry pre-op, Nissen fundoplication (complete 360-degree wrap) or Toupet (partial 270-degree), laparoscopic approach, complications include dysphagia, gas-bloat syndrome, inability to belch/vomit
  - Barrett esophagus management: PPI therapy, surveillance endoscopy with biopsies every 3-5 years if no dysplasia, annually if low-grade dysplasia, endoscopic eradication therapy (radiofrequency ablation or endoscopic mucosal resection) if high-grade dysplasia

clinical_pearls:
  - Typical symptoms (heartburn, regurgitation) - empiric PPI trial without testing
  - PPI first-line for moderate-severe GERD, take 30-60 minutes before breakfast
  - Alarm features (dysphagia, weight loss, GI bleeding, age greater than 60 new-onset) require endoscopy
  - Normal endoscopy does not exclude GERD (60 percent have nonerosive reflux disease NERD)
  - Barrett esophagus (intestinal metaplasia) precursor to adenocarcinoma, requires surveillance
  - Weight loss improves GERD symptoms
  - Long-term PPI use associated with small increased risks (fractures, C. diff, hypomagnesemia) but benefits generally outweigh risks

differentials:
  - Functional heartburn (GERD symptoms but normal pH monitoring, does not respond to PPI)
  - Eosinophilic esophagitis (dysphagia, food impaction, esophageal rings/furrows on endoscopy, eosinophils on biopsy, treat with swallowed steroids)
  - Achalasia (dysphagia solids and liquids, regurgitation, barium shows bird-beak, manometry absent peristalsis)
  - Cardiac chest pain (angina can mimic heartburn, worse with exertion, ECG/troponin abnormal)

trace:
  - 45-year-old obese woman (BMI 34) presents with 6 months heartburn 3-4 times weekly, burning sensation behind breastbone, worse after large meals and at night, regurgitation sour taste in mouth, occasional nocturnal cough
  - Tried OTC antacids (Tums) with minimal relief
  - No alarm features (no dysphagia, weight loss, GI bleeding)
  - Diagnosis: gastroesophageal reflux disease (GERD) based on typical symptoms
  - Empiric therapy without endoscopy (no alarm features)
  - Lifestyle counseling: elevate head of bed, avoid meals 3 hours before bedtime, weight loss goal 10 percent, avoid trigger foods (caffeine, alcohol, chocolate, fatty foods)
  - Started omeprazole 20 mg daily 30 minutes before breakfast
  - 4 weeks: 50 percent improvement but still some heartburn 1-2 times weekly, increased omeprazole to 40 mg daily
  - 8 weeks: 90 percent improvement, rare mild heartburn, weight loss 8 pounds
  - Continues omeprazole 40 mg daily
  - 6 months: excellent symptom control, weight loss 20 pounds (BMI 31), attempt to step down PPI dose to omeprazole 20 mg daily
  - 2 weeks on 20 mg: symptoms return, back to 40 mg daily with good control
  - Discussion of long-term PPI therapy: benefits outweigh risks, continue omeprazole 40 mg daily, calcium 1200 mg with vitamin D 1000 IU daily supplementation, monitor magnesium/B12 annually
  - 2 years: remains on omeprazole 40 mg daily with excellent symptom control, no complications
