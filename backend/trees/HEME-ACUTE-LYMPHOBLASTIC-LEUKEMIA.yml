nodes:
  - id: all_evaluation
    type: diagnosis
    name: "Acute Lymphoblastic Leukemia"
    icd10: "C91.0"
    urgency: critical
    workup:
      - Acute lymphoblastic leukemia (ALL) - Clonal malignancy of lymphoid progenitor cells (B-cell or T-cell lineage)
      - Most common cancer in children (25% childhood cancers, 75% childhood leukemias)
      - Peak age 2-5 years (children), second peak >50 years (adults)
      - Incidence - 1.7 per 100,000/year (3,000-4,000 cases/year US), 60% children, 40% adults
      - Better prognosis children than adults (children 90% cure rate, adults 30-40%)
      - Risk factors
      - Age - Peak 2-5 years (favorable prognosis), <1 year or >10 years (poor prognosis), adults worse than children
      - Genetic syndromes - Down syndrome (10-20x risk, GATA1 mutation), Fanconi anemia, Bloom syndrome, ataxia-telangiectasia, Li-Fraumeni (TP53)
      - Ionizing radiation exposure (atomic bomb survivors, therapeutic radiation)
      - Prior chemotherapy (topoisomerase II inhibitors → secondary ALL with MLL rearrangement)
      - Pathophysiology - Acquired genetic mutations → arrested differentiation lymphoid progenitors + uncontrolled proliferation → accumulation blasts in bone marrow/blood
      - Crowding out normal hematopoiesis → cytopenias
      - Infiltration extramedullary sites (CNS, testes, liver, spleen, lymph nodes)
      - Subtypes
      - B-cell ALL (80-85%) - More common, better prognosis children
      - Pre-B ALL (most common), mature B-cell ALL (Burkitt leukemia/lymphoma)
      - T-cell ALL (15-20%) - Older children/adolescents/young adults, male predominance, mediastinal mass (50-70%), worse prognosis historically (but improved with modern therapy)
      - Cytogenetics/molecular (prognostic)
      - Favorable - Hyperdiploidy (>50 chromosomes, 25-30% pediatric, excellent prognosis), t(12;21) ETV6-RUNX1 fusion (25% pediatric, favorable)
      - Unfavorable - Hypodiploidy (<44 chromosomes, 5%, very poor prognosis), Philadelphia chromosome t(9;22) BCR-ABL1 (25% adults, 3-5% children, poor prognosis without TKI), MLL rearrangement t(4;11) (infants <1 year 70-80%, poor prognosis), t(1;19) TCF3-PBX1 (5%)
      - Clinical presentation
      - Bone marrow failure symptoms - Develops over days to weeks
      - Anemia - Fatigue, pallor, dyspnea (90%)
      - Thrombocytopenia - Petechiae, purpura, bruising, mucosal bleeding (80%)
      - Neutropenia - Fever, infections (60%)
      - Bone pain (20-30%) - Especially children (periosteal infiltration), long bones
      - Lymphadenopathy (50-70%) - Painless, generalized
      - Hepatosplenomegaly (60-70%) - Leukemic infiltration
      - Mediastinal mass (50-70% T-cell ALL) - Cough, dyspnea, SVC syndrome (facial swelling, headache, plethora)
      - CNS involvement (5% at diagnosis, 50-70% relapse without prophylaxis) - Headache, cranial nerve palsies, meningismus, papilledema
      - Testicular involvement (1-2% at diagnosis, 8-10% relapse site boys)
      - Leukostasis (rare, WBC >100,000) - Respiratory/neurologic symptoms (less common than AML)
      - Physical exam - Pallor, petechiae/bruising, lymphadenopathy (cervical, axillary, inguinal), hepatosplenomegaly, testicular enlargement, cranial nerve palsies
      - Labs
      - CBC - Anemia (Hgb <10), thrombocytopenia (platelets <100K common, <50K frequent), WBC variable (high 50%, normal 30%, low 20%)
      - Peripheral smear - Lymphoblasts (large cells, scant cytoplasm, prominent nucleoli)
      - Chemistry - Elevated LDH (tumor burden), uric acid (tumor lysis), K/phosphate (tumor lysis)
      - Coagulation - Usually normal (vs. AML with DIC)
      - Bone marrow aspirate/biopsy - DIAGNOSTIC (≥20% lymphoblasts WHO 2016)
      - Morphology - Hypercellular (>90%), replaced by lymphoblasts
      - Flow cytometry - Immunophenotyping
      - B-ALL - CD19, CD20, CD22, CD79a, cytoplasmic CD22, TdT
      - T-ALL - CD2, CD3, CD5, CD7, TdT
      - Cytogenetics - Karyotype (prognostic)
      - Molecular testing - BCR-ABL1 (Philadelphia chromosome PCR), MLL rearrangement, ETV6-RUNX1
      - CNS evaluation - Lumbar puncture (LP) with CSF cell count/differential, cytology
      - CNS1 - No blasts
      - CNS2 - <5 WBC/μL with blasts
      - CNS3 - ≥5 WBC/μL with blasts OR cranial nerve palsy (CNS disease, requires intensified CNS therapy)
      - Imaging
      - Chest X-ray - Mediastinal mass (T-ALL)
      - CT chest - Better delineate mediastinal mass, assess airway compression (anesthesia risk)
      - CT abdomen/pelvis - Hepatosplenomegaly, lymphadenopathy
      - Testicular ultrasound - If palpable abnormality (boys)
      - Risk stratification - Standard risk vs. high risk (based on age, WBC, cytogenetics, treatment response)
      - Standard risk (favorable) - Age 1-10 years, WBC <50K, favorable cytogenetics (hyperdiploidy, ETV6-RUNX1), rapid early response (MRD negative)
      - High risk (unfavorable) - Age <1 or >10 years, WBC >50K, unfavorable cytogenetics (hypodiploidy, Philadelphia chromosome, MLL), slow early response (MRD positive), CNS/testicular involvement
    treatment:
      - ALL treatment - Multi-agent intensive chemotherapy (multiple phases, 2-3 years total)
      - Cure rates - Children 85-90%, adults 30-40%
      - Supportive care - URGENT
      - Transfusions - RBC if Hgb <7-8, platelets if <10K (or <50K if bleeding/fever)
      - Antibiotics - Fever in neutropenic patient (ANC <500) → broad-spectrum IV antibiotics immediately (cefepime, piperacillin-tazobactam)
      - Tumor lysis prophylaxis - ESSENTIAL (high tumor burden)
      - Allopurinol 300 mg daily OR rasburicase 0.2 mg/kg IV (if very high risk)
      - Aggressive hydration (3 L/m²/day), monitor electrolytes q6-8h
      - Avoid potassium/phosphate in IV fluids
      - Chemotherapy phases
      - Induction (4-6 weeks) - Goal achieve complete remission (CR <5% blasts, ANC >1000, platelets >100K)
      - Pediatric - Vincristine, corticosteroid (prednisone or dexamethasone), L-asparaginase, anthracycline (daunorubicin)
      - Adult - Hyper-CVAD (cyclophosphamide, vincristine, doxorubicin, dexamethasone alternating with high-dose methotrexate and cytarabine)
      - CR rate - Children 95-98%, adults 80-90%
      - CNS prophylaxis - Intrathecal chemotherapy (methotrexate, cytarabine, hydrocortisone) during induction
      - Consolidation/intensification (2-6 months) - Eliminate residual leukemia
      - Multiple cycles multi-agent chemotherapy (higher doses)
      - Interim maintenance (8-12 weeks)
      - Delayed intensification (8 weeks) - Repeat induction-like regimen
      - Maintenance (1.5-2 years) - Oral chemotherapy (longest phase)
      - Daily mercaptopurine + weekly methotrexate
      - Monthly vincristine + corticosteroid pulses
      - Continue intrathecal chemotherapy q3 months (CNS prophylaxis)
      - Children - Total treatment duration 2-3 years (girls 2 years, boys 3 years, longer relapse risk)
      - Adults - Shorter maintenance (1-2 years)
      - CNS prophylaxis - ALL phases (leukemia sanctuary site, 50-70% CNS relapse without prophylaxis)
      - Intrathecal chemotherapy - Throughout treatment
      - High-dose systemic chemotherapy - Methotrexate, cytarabine (crosses blood-brain barrier)
      - Cranial radiation - 18-24 Gy (reserved for CNS disease at diagnosis or high-risk T-ALL)
      - Avoid if possible (neurocognitive late effects, especially young children)
      - Philadelphia chromosome-positive (Ph+) ALL - Add tyrosine kinase inhibitor (TKI)
      - Imatinib (Gleevec) 600 mg daily + chemotherapy
      - OR dasatinib or ponatinib (more potent)
      - Dramatically improved outcomes (historically worst prognosis, now 50-70% long-term survival)
      - Allogeneic hematopoietic stem cell transplantation (allo-HSCT) - Reserved for high-risk or relapsed ALL
      - Indications - Ph+ ALL in first CR, induction failure, high-risk cytogenetics (hypodiploidy, MLL), MRD-positive after induction, relapsed ALL
      - Timing - After achieving CR (usually after consolidation)
      - Donor - Matched sibling best, matched unrelated donor (MUD), haploidentical
      - Outcomes - 50-60% cure rate relapsed ALL, higher cure rate than chemotherapy alone for high-risk
      - Complications - GVHD, transplant-related mortality (TRM 10-20%)
      - Minimal residual disease (MRD) monitoring - Most important prognostic factor
      - Flow cytometry or PCR (detects 1 leukemia cell in 10,000-100,000 normal cells)
      - Check after induction (day 29), end of consolidation
      - MRD-negative (< 0.01%) - Excellent prognosis (relapse risk <10%)
      - MRD-positive (> 0.01%) - Poor prognosis (relapse risk 50-80%), consider treatment intensification or transplant
      - Relapsed ALL - 10-15% children relapse, 30-50% adults
      - Reinduction chemotherapy - Different regimen, CR2 rate 70-90% (children), 30-50% (adults)
      - Allo-HSCT - Only curative option (30-50% long-term survival)
      - Novel therapies - Blinatumomab (BiTE antibody CD19/CD3), inotuzumab ozogamicin (anti-CD22 ADC), CAR T-cell therapy (tisagenlecleucel, 80-90% CR rate relapsed/refractory)
      - Prognosis - Variable (depends on age, cytogenetics, treatment response)
      - Children - 85-90% long-term survival (cure)
      - Standard risk - 90-95% cure
      - High risk - 70-80% cure
      - Infants <1 year - 30-50% cure (MLL rearrangement common)
      - Adults - 30-40% long-term survival
      - Ph+ ALL (with TKI) - 50-70% long-term survival
      - Relapsed ALL - 30-50% long-term survival (with transplant)
      - Late effects (survivors) - Growth impairment, neurocognitive deficits (cranial radiation, intrathecal chemo), infertility, secondary cancers (5-10% at 20 years), cardiomyopathy (anthracyclines), osteonecrosis (corticosteroids)
      - Surveillance - Lifelong follow-up for late effects
