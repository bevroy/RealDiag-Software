tree_id: ORTHO-LUMBAR-STRAIN
name: Lumbar Strain/Sprain
family: orthopedics
specialty: Orthopedics
icd10: S33.5XXA
snomed: 202794004
urgency: []
homeopathy: []
presentations:
  - Acute onset low back pain after lifting, twisting, or sudden movement
  - Pain localized to lower back, may radiate to buttocks but not below knee
  - Muscle spasm and stiffness in paraspinal muscles
  - Pain worse with movement, bending, or prolonged sitting/standing
  - Pain improves with rest
  - No neurologic symptoms (numbness, weakness, bowel/bladder dysfunction)
  - Tenderness to palpation over paraspinal muscles
  - Limited range of motion due to pain and spasm
  - History of heavy lifting, awkward movement, or overexertion
workup:
  - Clinical diagnosis based on history and physical examination
  - Physical exam findings
  - Tenderness over paraspinal muscles and SI joints
  - Muscle spasm
  - Limited lumbar flexion and extension
  - Negative straight leg raise test (rules out radiculopathy)
  - Normal neurologic exam (strength, sensation, reflexes intact)
  - Red flags requiring imaging or further workup
  - Age >50 or <20, trauma, fever, weight loss, night pain
  - History of cancer, immunosuppression, IV drug use
  - Neurologic deficits, bowel/bladder dysfunction (cauda equina)
  - Pain lasting >6 weeks despite conservative treatment
  - Imaging (only if red flags present)
  - Lumbar X-rays (AP and lateral) if trauma or suspicion of fracture
  - MRI lumbar spine if neurologic deficits or cauda equina suspected
  - No imaging needed for uncomplicated acute low back pain <6 weeks
treatment:
  - Acute phase (first 48-72 hours)
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Acetaminophen 1000 mg TID if NSAIDs contraindicated
  - Ice application 15-20 minutes every 2-3 hours for first 48 hours
  - Avoid bed rest - continue normal activities as tolerated
  - Muscle relaxants if severe spasm (cyclobenzaprine 5-10 mg TID x 3-5 days)
  - Subacute phase (after 72 hours)
  - Heat application 15-20 minutes several times daily
  - Gentle stretching exercises (hamstring, hip flexor stretches)
  - Gradual return to normal activities
  - Physical therapy if not improving after 2-3 weeks
  - Manual therapy, therapeutic exercises, core strengthening
  - Ergonomic education and body mechanics training
  - Activity modification
  - Avoid heavy lifting, prolonged sitting, awkward positions
  - Use proper lifting technique (bend knees, keep back straight)
  - Return to work with restrictions if needed
  - Medications to avoid
  - Opioids NOT recommended for acute low back pain
  - Systemic corticosteroids not effective for lumbar strain
  - Expected recovery: 90% improve within 6 weeks with conservative care
clinical_pearls:
  - "Acute low back pain affects 80% of adults at some point in life"
  - "90% of acute lumbar strains resolve within 6 weeks with conservative treatment"
  - "Imaging NOT indicated for uncomplicated acute low back pain <6 weeks - only increases costs"
  - "Bed rest is harmful - staying active promotes faster recovery"
  - "Red flags: age >50, trauma, fever, weight loss, neurologic deficits, bowel/bladder dysfunction"
  - "Straight leg raise test: if positive (<60 degrees reproduces leg pain) suggests radiculopathy, not simple strain"
  - "Opioids NOT recommended - no better than NSAIDs and high addiction risk"
  - "Most patients improve regardless of treatment - natural history is favorable"
referrals:
  - Physical therapy if not improving after 2-3 weeks
  - Orthopedics or spine specialist if pain persists >6 weeks despite conservative treatment
  - Emergency department if cauda equina symptoms (bowel/bladder dysfunction, saddle anesthesia, progressive weakness)
differentials:
  - Lumbar strain/sprain (muscular, no neurologic deficits)
  - Lumbar disc herniation with radiculopathy (leg pain, positive SLR, neurologic deficits)
  - Lumbar spinal stenosis (older age, neurogenic claudication, pain with standing/walking)
  - Compression fracture (trauma, osteoporosis, severe localized pain)
  - Ankylosing spondylitis (young male, morning stiffness, improves with activity)
  - Spinal infection (fever, IV drug use, elevated inflammatory markers)
  - Spinal malignancy (age >50, history of cancer, night pain, weight loss)
  - Sacroiliac joint dysfunction (pain over SI joints, positive SI joint provocation tests)
  - Hip pathology (groin pain, limited hip range of motion)
