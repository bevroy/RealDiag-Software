tree_id: PED-IMMUNIZATION-ENCOUNTER
name: Immunization Encounter (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/Immunology
icd10: Z23
snomed: 33879002
urgency: []
homeopathy: []
presentations:
  - Routine childhood immunizations
  - Catch-up immunizations for delayed schedule
  - Vaccine due per CDC schedule
  - Pre-travel immunizations
  - School or daycare immunization requirements
  - Parental questions or concerns about vaccines
workup:
  - Review immunization record
  - State immunization registry check
  - Previous vaccine reactions or adverse events
  - Immunization history documentation
  - CDC immunization schedule assessment
  - Determine which vaccines are due today
  - Identify catch-up vaccines if behind schedule
  - Assess for contraindications and precautions
  - Contraindications (DO NOT give vaccine)
  - Severe allergic reaction (anaphylaxis) to previous dose or vaccine component
  - Encephalopathy within 7 days of previous DTaP/Tdap (pertussis contraindication)
  - Severe combined immunodeficiency (SCID) - live vaccines contraindicated
  - Pregnancy - live vaccines contraindicated (MMR, varicella, live influenza)
  - Precautions (consider delaying vaccine)
  - Moderate or severe acute illness with fever (delay until recovered)
  - Recent administration of antibody-containing blood product (delay MMR, varicella per guidelines)
  - History of Guillain-Barré syndrome within 6 weeks of previous influenza vaccine
  - Thrombocytopenia or bleeding disorder (use smaller needle, apply pressure)
  - Conditions that are NOT contraindications
  - Mild illness (low-grade fever, URI, diarrhea) - can vaccinate
  - Current antibiotic therapy - can vaccinate
  - Prematurity (use chronological age for schedule, not corrected age)
  - Recent exposure to infectious disease - can vaccinate
  - Breastfeeding - can vaccinate (mother and infant)
  - Personal or family history of seizures - can vaccinate
  - Egg allergy - can receive influenza vaccine (no longer contraindication)
  - Screen for vaccine eligibility
  - Age-appropriate vaccines per CDC schedule
  - Medical history (immunocompromised, chronic conditions)
  - Allergy history (especially to vaccine components)
  - Current medications (immunosuppressive therapy)
treatment:
  - CDC Recommended Immunization Schedule (2024)
  - Birth
  - Hepatitis B #1 (within 24 hours)
  - 1-2 months
  - Hepatitis B #2 (at least 4 weeks after dose #1)
  - 2 months
  - DTaP #1, IPV #1, Hib #1, PCV15/PCV20 #1, Rotavirus #1, Hepatitis B #2 (can give if not given earlier)
  - 4 months
  - DTaP #2, IPV #2, Hib #2, PCV15/PCV20 #2, Rotavirus #2
  - 6 months
  - DTaP #3, Hib #3, PCV15/PCV20 #3, Rotavirus #3 (if RotaTeq), Hepatitis B #3, Influenza (annually starting 6 months)
  - 6-18 months
  - IPV #3 (can give anytime in this range)
  - 12-15 months
  - MMR #1, Varicella #1, Hepatitis A #1, PCV15/PCV20 #4, Hib #4
  - 15-18 months
  - DTaP #4
  - 12-23 months
  - Hepatitis A #2 (6-18 months after dose #1)
  - 4-6 years
  - DTaP #5, IPV #4, MMR #2, Varicella #2
  - 11-12 years
  - Tdap (one-time booster), HPV #1 and #2 (6-12 months apart), MenACWY #1
  - 16 years
  - MenACWY #2 (booster), MenB (2 or 3-dose series, optional but recommended)
  - Annually starting 6 months
  - Influenza vaccine (annually in fall, 2 doses first year if <9 years)
  - COVID-19
  - Per current CDC recommendations (schedule evolving)
  - Catch-up immunization schedules
  - Use CDC catch-up schedule if child behind
  - Minimum intervals between doses (e.g., 4 weeks between most doses)
  - Maximum ages for certain vaccines (e.g., rotavirus must start by 14 weeks 6 days, complete by 8 months)
  - Accelerated schedule if rapid catch-up needed (e.g., international travel)
  - Special populations
  - Premature infants: use chronological age (not corrected), full doses
  - Immunocompromised: avoid live vaccines (MMR, varicella, rotavirus, live influenza), may need additional doses
  - Asplenia: additional PCV doses, MenACWY, MenB, Hib beyond routine schedule
  - Chronic kidney disease, diabetes, heart disease: additional influenza, pneumococcal vaccines
  - Household contacts of immunocompromised: avoid live oral polio (use IPV), can receive other live vaccines
  - Vaccine administration techniques
  - Route: intramuscular (most vaccines), subcutaneous (MMR, varicella), oral (rotavirus)
  - Site: anterolateral thigh (infants/toddlers), deltoid (older children/adolescents)
  - Needle size: 1 inch 22-25 gauge (infants), 1-1.25 inch 22-25 gauge (older children)
  - Multiple vaccines: can give same day in different sites (≥1 inch apart)
  - Combination vaccines available to reduce number of injections
  - Pain reduction strategies
  - Breastfeeding during injection (infants)
  - Topical anesthetic (e.g., lidocaine cream) applied 30-60 minutes before
  - Distraction techniques (toys, videos, conversation)
  - Sitting upright (not lying down) - reduces anxiety
  - Tactile stimulation near injection site
  - Vaccine Information Statements (VIS)
  - REQUIRED to provide to parent/patient before vaccination
  - CDC-produced standardized information sheets
  - Document VIS edition date in medical record
  - Post-vaccination monitoring
  - Observe 15 minutes for allergic reaction (especially first dose)
  - Educate about expected side effects (soreness, low-grade fever, irritability)
  - Acetaminophen or ibuprofen for pain/fever AFTER vaccination (not before - may reduce immune response)
  - Vaccine Adverse Event Reporting System (VAERS)
  - Report serious adverse events to VAERS (vaers.hhs.gov or 1-800-822-7967)
  - National Vaccine Injury Compensation Program for severe reactions
clinical_pearls:
  - 'Mild illness (low-grade fever, URI, diarrhea) is NOT a contraindication to vaccination - vaccinate on schedule'
  - 'Egg allergy is NO LONGER a contraindication to influenza vaccine - can give safely in office'
  - 'Use chronological age (not corrected age) for premature infants - give full doses at same schedule as term infants'
  - 'Multiple vaccines can be given same day in different sites (≥1 inch apart) - does not decrease effectiveness or increase adverse events'
  - 'Live vaccines (MMR, varicella, rotavirus, live influenza) must be given same day or separated by ≥28 days'
  - 'Rotavirus vaccine must be started by 14 weeks 6 days and completed by 8 months (age restrictions due to intussusception risk)'
  - 'HPV vaccine most effective when given at age 11-12 (before sexual debut) - 2 doses if <15 years, 3 doses if ≥15 years'
  - 'Tdap booster at age 11-12, then Td booster every 10 years for life (or Tdap for pregnant women each pregnancy)'
  - 'MenACWY at age 11-12 with booster at 16 years (college freshmen in dorms at highest risk for meningococcal disease)'
  - 'Document VIS edition date in medical record (federal requirement) and report serious adverse events to VAERS'
referrals:
  - Allergy/immunology if history of severe vaccine reaction or anaphylaxis to vaccine component
  - Infectious disease if immunocompromised and need specialized vaccine recommendations
  - Travel medicine clinic if international travel requiring special vaccines (yellow fever, typhoid, Japanese encephalitis)
  - Vaccine exemption review if parent requesting medical exemption (rare - only for true contraindications)
differentials:
  - This is preventive care encounter, not diagnostic
  - Post-vaccination reactions (expected and manageable)
  - Local reactions (pain, redness, swelling at injection site) - most common, resolve in 1-3 days
  - Systemic reactions (fever, irritability, fatigue) - common, resolve in 1-2 days
  - Vaccine-specific reactions
  - DTaP: fussiness, drowsiness, fever (up to 50%), local swelling
  - MMR: fever 7-12 days post-vaccination (10%), mild rash (5%)
  - Varicella: mild varicella-like rash at injection site or generalized (2-3%)
  - Rotavirus: mild diarrhea or vomiting (up to 24%)
  - Serious adverse events (very rare)
  - Anaphylaxis (1 per million doses) - onset within minutes
  - Febrile seizures (MMR, MMRV) - typically benign, no long-term effects
  - Intussusception (rotavirus) - risk 1-5 per 100,000 infants, typically within 7 days of first dose
  - Guillain-Barré syndrome (influenza) - very rare, 1-2 per million doses
  - Shoulder injury related to vaccine administration (SIRVA) - improper injection technique
  - Conditions NOT caused by vaccines (extensive evidence)
  - Autism (no link to MMR vaccine or any vaccine - thoroughly debunked)
  - Diabetes, multiple sclerosis, SIDS (no causal relationship)
  - Overwhelming immune system (infants can handle thousands of antigens - vaccines contain <200)
