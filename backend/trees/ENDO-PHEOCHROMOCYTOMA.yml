presentations:
  - episodic headaches, sweating, palpitations
  - hypertension (paroxysmal or sustained)
  - elevated catecholamines
  - adrenal mass on imaging
differentials:
  - Anxiety/panic disorder
  - Hyperthyroidism
  - Essential hypertension
  - Carcinoid syndrome
  - Sympathomimetic use
workup:
  - Plasma free metanephrines (most sensitive, >4x normal highly specific) OR 24-hr urine metanephrines
  - 'If positive biochemical test: Adrenal CT or MRI to localize tumor (avoid contrast until after alpha-blockade)'
  - 'Genetic testing if: Age <40, bilateral, extra-adrenal, family history (test VHL, RET, NF1, SDHx)'
  - MIBG scan or PET (68Ga-DOTATATE) if extra-adrenal or metastatic disease suspected
treatment:
  - 'Guideline-based treatment options for Pheochromocytoma include:'
  - 'Alpha-blockade FIRST: Phenoxybenzamine 10mg BID, titrate to 20-40mg TID over 2-3 weeks (ADA 2024)'
  - 'Then beta-blockade (NEVER before alpha): Propranolol 10-40mg TID (prevents unopposed alpha) (ADA 2024)'
  - 'Surgical resection: Laparoscopic adrenalectomy after adequate alpha/beta blockade (ADA 2024)'
  - 'Intra-op: Phentolamine 5mg IV for hypertensive crisis, nitroprusside infusion (ADA 2024)'
  - 'Post-op: Monitor for hypotension (catecholamine withdrawal), may need IV fluids (ADA 2024)'
clinical_pearls:
  - 'Rule of 10s: 10% bilateral, 10% extra-adrenal (paraganglioma), 10% malignant, 10% familial'
  - 'Classic triad: Headaches, sweating, palpitations/tachycardia during ''spells'' (episodes last minutes to hours)'
  - 'Familial syndromes (40%): MEN2, VHL, NF1, SDH mutations - screen if age <40 or family history'
  - Hypertensive crisis with surgery/anesthesia if unrecognized - preop alpha-blockade essential
  - 'Incidentaloma workup: All adrenal masses >1cm should be screened for pheochromocytoma before biopsy'
red_flags: []
