tree_id: CARD-ATRIAL-FIBRILLATION-RVR
name: Atrial Fibrillation with Rapid Ventricular Response (AFib RVR)
family: Cardiology
specialty: Cardiology
icd10:
- I48.91
- I48.0
snomed:
- '49436004'
urgency: medium
description: Comprehensive evaluation and management of Atrial Fibrillation with Rapid
  Ventricular Response (AFib RVR)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Irregularly irregular rhythm on ECG, no P waves, rate >100 bpm
- Palpitations, dyspnea, chest discomfort, dizziness
- May be asymptomatic in chronic AFib
- Heart rate typically 110-180 bpm (uncontrolled)
- 'Risk factors: HTN, CAD, valvular disease, thyroid disease, ETOH, advanced age'
- 'Complications: Stroke risk (CHA2DS2-VASc score), heart failure, cardiomyopathy'
workup:
- ECG (irregularly irregular, no P waves, variable R-R intervals)
- TSH (hyperthyroidism common trigger)
- Echocardiogram (assess LV function, valves, LA size)
- CHA2DS2-VASc score (stroke risk)
- 'Consider: TEE before cardioversion if >48hr or unknown duration'
treatment:
- 'Guideline-based treatment options for Atrial Fibrillation with Rapid Ventricular
  Response (AFib RVR) include:'
- 'Rate control: Metoprolol 5mg IV q5min up to 15mg, or diltiazem 0.25mg/kg IV (ACC/AHA
  2023)'
- 'Oral: Metoprolol 25-100mg BID or diltiazem 180-360mg daily (extended-release) (ACC/AHA
  2023)'
- 'Anticoagulation: Apixaban 5mg BID or rivaroxaban 20mg daily if CHA2DS2-VASc ≥2
  (ACC/AHA 2023)'
- 'Cardioversion: If unstable or <48hr onset (consider after TEE if uncertain duration)
  (ACC/AHA 2023)'
- 'Treat triggers: Hyperthyroidism, infection, ETOH (ACC/AHA 2023)'
clinical_pearls:
- 'Goals: Rate control (<110 bpm at rest) and anticoagulation'
- 'Rate vs rhythm control: Rate control non-inferior for most patients'
- 'CHA2DS2-VASc ≥2 men, ≥3 women: Start anticoagulation (apixaban, rivaroxaban)'
- Cardioversion if <48hr onset, or after 3 weeks anticoagulation + TEE
- IV metoprolol or diltiazem for acute rate control
referrals:
- Cardiology for new-onset AFib or rhythm control
- EP for catheter ablation if symptomatic despite meds
differentials: []
