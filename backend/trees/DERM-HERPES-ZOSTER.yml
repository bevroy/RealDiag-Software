urgency: medium
description: Comprehensive evaluation and management of Herpes Zoster (Shingles)
version: '1.0'
citations:
  - AAD (American Academy of Dermatology) Clinical Guidelines
  - British Association of Dermatologists Guidelines
  - UpToDate - Dermatology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Painful vesicular rash
- Dermatomal distribution
- Unilateral
- Prodrome of pain or tingling
- More common in elderly or immunocompromised
workup:
- Clinical diagnosis (usually no testing needed)
- Tzanck smear or DFA if atypical presentation (low sensitivity)
- PCR of vesicle fluid (gold standard but rarely needed)
treatment:
- 'Guideline-based treatment options for Herpes Zoster (Shingles) include:'
- 'Antivirals within 72hrs: Valacyclovir 1g TID or famciclovir 500mg TID for 7 days
  (AAD 2023)'
- 'Pain control: Gabapentin 300-900mg TID, pregabalin 75-150mg BID, or lidocaine patches
  (AAD 2023)'
- 'If V1/ophthalmicus: Ophthalmology referral same day, start antivirals immediately
  (AAD 2023)'
- 'PHN prevention: Early antivirals + aggressive pain control during acute phase (AAD
  2023)'
- 'PHN treatment: Gabapentin, pregabalin, TCAs (amitriptyline), lidocaine patches,
  capsaicin (AAD 2023)'
clinical_pearls:
- Reactivation of varicella-zoster virus (VZV) dormant in dorsal root ganglia
- Start antivirals within 72 hours of rash onset for maximum benefit
- 'Postherpetic neuralgia (PHN) in 10-15%: Pain >90 days after rash, increases with
  age'
- 'Herpes zoster ophthalmicus: V1 distribution, can cause blindness - ophthalmology
  emergency'
- 'Hutchinson sign: Vesicles on tip/side of nose predicts ocular involvement'
referrals:
- Ophthalmology STAT if V1/herpes zoster ophthalmicus (Hutchinson sign, eye involvement)
- Pain management if severe PHN
differentials:
  - Herpes simplex
  - Cellulitis
  - Contact dermatitis
  - Impetigo
  - Acute coronary syndrome (if chest)
