tree_id: DERM-HERPES-ZOSTER
name: Herpes Zoster (Shingles)
family: Dermatology
specialty: Dermatology
chief_complaint: Painful unilateral rash in dermatomal distribution
description: |
  Reactivation of varicella-zoster virus (VZV) from dorsal root ganglia. Painful vesicular rash in dermatomal distribution.
  Affects 1 in 3 people in lifetime, more common in elderly and immunocompromised. Risk increases after age 50.
icd10: B02.9
urgency: Moderate
workup:
  - Clinical diagnosis based on unilateral dermatomal painful vesicular rash
  - Tzanck smear shows multinucleated giant cells (not specific for VZV)
  - Direct fluorescent antibody (DFA) or PCR of vesicle fluid confirms diagnosis if uncertain
  - Ophthalmic involvement (V1 dermatome) requires urgent ophthalmology referral
  - Hutchinson sign (lesions on tip of nose) suggests ocular involvement
treatment:
  - Antiviral therapy most effective if started within 72 hours of rash onset
  - Valacyclovir 1000mg TID x 7 days (first-line, better bioavailability)
  - Acyclovir 800mg 5 times daily x 7 days alternative
  - Famciclovir 500mg TID x 7 days alternative
  - Pain management - acetaminophen or NSAIDs, gabapentin 300-900mg TID, or pregabalin 150-300mg BID for severe pain
  - Topical lidocaine patches or capsaicin cream for localized pain
  - Ophthalmic zoster requires systemic antivirals plus urgent ophthalmology evaluation
  - Prevention of postherpetic neuralgia (PHN) - early antiviral therapy, adequate pain control
  - PHN treatment if develops - gabapentin, pregabalin, tricyclic antidepressants (amitriptyline 25-75mg nightly), topical lidocaine
  - Shingrix vaccine for prevention in adults 50 and older (90% effective)
clinical_pearls:
  - Classic prodrome of pain, tingling, or burning in dermatome 1-5 days before rash
  - Rash evolves from macules to papules to vesicles to crusts over 7-10 days
  - Dermatomal distribution is key diagnostic feature (does not cross midline)
  - Postherpetic neuralgia (PHN) is pain persisting more than 90 days after rash onset (occurs in 10-15%, higher in elderly)
  - Ramsay Hunt syndrome is zoster affecting facial nerve (CN VII) with ear pain, facial palsy, vesicles in ear canal
  - Disseminated zoster (more than 20 lesions outside primary dermatome) suggests immunocompromise
  - Patients are contagious until lesions crust over (avoid contact with pregnant women and immunocompromised)
differentials:
  - Herpes simplex virus
  - Contact dermatitis
  - Impetigo
  - Cellulitis
  - Early shingles without rash (zoster sine herpete)
  - Dermatitis herpetiformis
trace:
  - Right-sided chest pain x 3 days, now painful vesicular rash in T5 dermatome → Vesicles on erythematous base, unilateral, dermatomal → Diagnose herpes zoster → Start valacyclovir 1000mg TID x 7 days within 48 hours of rash → Gabapentin 300mg TID for pain → Rash crusts over 10 days, pain resolves → No postherpetic neuralgia → Recommend Shingrix vaccine once acute episode resolved
