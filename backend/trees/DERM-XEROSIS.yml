tree_id: DERM-XEROSIS
name: Xerosis (Dry Skin)
family: Dermatology
specialty: Dermatology
chief_complaint: Dry itchy skin
description: Impaired skin barrier causing dry, rough, scaly skin with pruritus especially on lower legs. Frequent moisturization restores skin barrier and resolves symptoms, worse in winter with low humidity.
icd10: L85.3
urgency: non-urgent

workup:
  - Clinical diagnosis: dry, rough, scaly skin with fine fissures, often pruritic
  - Distribution: typically lower legs (shins), hands, arms, worse in winter months
  - Appearance: dull, rough texture, fine white scales, fissures, cracks (if severe)
  - Asteatotic eczema (eczema craquelé): severe xerosis with inflammation, erythema, and network of fine cracks resembling cracked porcelain
  - Pruritus: common, worse at night, can lead to scratching and secondary eczematous changes
  - Risk factors: low humidity (winter months, indoor heating), aging (decreased sebum production), excessive bathing with hot water and harsh soaps, genetics
  - Elderly: very common (decreased sebum, less skin hydration)
  - Associated conditions: atopic dermatitis, ichthyosis, hypothyroidism
  - Complications: secondary eczema from scratching, bacterial superinfection

treatment:
  - Emollients (most important): frequent application of moisturizers restores skin barrier
  - Apply immediately after bathing while skin still damp (traps moisture)
  - Frequency: at least twice daily, more often if needed
  - Types: ointments most effective (petrolatum, Aquaphor) but greasy, creams good compromise (CeraVe, Cetaphil, Eucerin), lotions least effective
  - Ingredients: ceramides (restore barrier), urea 10-20% (keratolytic and humectant), lactic acid 12% (AmLactin - keratolytic)
  - Bathing modifications: lukewarm water (not hot), limit time to 5-10 minutes, avoid harsh soaps
  - Gentle cleansers: fragrance-free, non-soap (Cetaphil, CeraVe, Dove Sensitive)
  - Humidifier: use in bedroom during winter months (increases environmental humidity)
  - Avoid irritants: harsh soaps, alcohol-based products, fragrances, wool clothing (wear cotton)
  - Topical corticosteroids: if eczematous changes develop from scratching
  - Triamcinolone 0.1% cream or hydrocortisone 2.5% cream BID x1-2 weeks to inflamed areas
  - Antihistamines: for pruritus, hydroxyzine 25 mg at bedtime or cetirizine 10 mg daily
  - Prevention: year-round moisturization, gentle skin care, avoid excessive bathing

clinical_pearls:
  - Dry, rough, scaly skin with pruritus especially lower legs
  - Worse in winter months with low humidity and indoor heating
  - Frequent moisturization most important treatment - apply after bathing
  - Ointments most effective but greasy, creams good compromise
  - Apply moisturizer immediately after bathing while skin damp
  - Avoid hot water and harsh soaps - use lukewarm water and gentle cleansers
  - Use humidifier in winter months
  - Very common in elderly (decreased sebum production)

differentials:
  - Atopic dermatitis: flexural distribution, intense pruritus, personal/family history atopy, starts in childhood
  - Psoriasis: well-demarcated plaques with silvery scale, extensor surfaces, nail involvement
  - Ichthyosis vulgaris: genetic disorder, fish-like scales, keratosis pilaris, starts in childhood
  - Hypothyroidism: dry skin plus fatigue, weight gain, cold intolerance, elevated TSH

trace: |
  A 68-year-old woman presented with 3 months of intensely itchy dry skin on lower legs worse over past month as weather turned cold. Skin feels tight and rough. Notices white flakes on clothing. Scratches at night disrupting sleep. Takes long hot showers daily. Uses bar soap. No moisturizer use. Exam showed bilateral lower legs with diffuse dryness, fine white scaling, rough texture, linear excoriations from scratching, no erythema or weeping. Diagnosed with xerosis (dry skin) of lower legs. Extensive counseling on skin care regimen: lukewarm showers (not hot) limited to 10 minutes, switch from bar soap to gentle fragrance-free cleanser (Cetaphil), apply thick moisturizer (CeraVe cream) immediately after shower while skin still damp, reapply moisturizer at bedtime. Humidifier in bedroom at night. Prescribed triamcinolone 0.1% cream twice daily x2 weeks to excoriated areas (eczematous changes from scratching). Hydroxyzine 25 mg at bedtime for pruritus and sleep. At 2 weeks pruritus improved 60%, skin texture smoother, scaling reduced. At 4 weeks pruritus 90% improved, skin significantly improved, sleeping better. Continues twice-daily moisturization. At 3 months maintains excellent control with daily moisturization routine, minimal pruritus, no scratching. Counseled to continue year-round moisturization to prevent recurrence.
