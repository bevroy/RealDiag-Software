presentations:
  - Palpable purpura on lower extremities and buttocks
  - Abdominal pain (colicky)
  - Arthralgia or arthritis
  - Hematuria and glomerulonephritis
  - Age 3-10 years typically
  - Recent URI
differentials:
  - ITP
  - HSP
  - Meningococcemia
  - Other vasculitis
  - Trauma
workup: []
treatment:
  - Supportive care for most cases - self-limited in 90%, resolves in 4-6 weeks
  - NSAIDs for joint pain and inflammation - ibuprofen 10mg/kg Q6-8H (avoid if significant renal involvement or GI bleeding)
  - Corticosteroids for severe symptoms - prednisone 1-2mg/kg/day (max 60-80mg) x1-2 weeks, then taper
  - 'Steroid indications: severe abdominal pain, GI bleeding, scrotal involvement, significant renal disease'
  - Steroids reduce abdominal pain but do NOT prevent nephritis
  - 'Severe nephritis: Consider pulse methylprednisolone 30mg/kg IV (max 1g) daily x3 days, then oral prednisone, ± cyclophosphamide or mycophenolate'
  - Monitor BP and urinalysis weekly during acute phase
  - Long-term follow-up - urinalysis and BP checks for 6 months (20-50% develop transient nephritis, 1-2% develop chronic kidney disease)
  - Hydration and rest during acute phase
  - No immunizations during active disease (may exacerbate)
