tree_id: PEDS-GASTROENTERITIS
name: Gastroenteritis (Pediatric)
family: pediatrics
specialty: Pediatrics/Gastroenterology/Emergency Medicine
icd10: A09
snomed: 25374005
urgency:
  - Severe dehydration (greater than 9% fluid loss)
  - Signs of shock (hypotension, altered mental status, poor perfusion)
  - Bloody diarrhea with fever or severe abdominal pain
  - Bilious vomiting (concern for obstruction or volvulus)
  - Age less than 3 months with vomiting and diarrhea
  - Altered mental status or seizures
homeopathy: []
presentations:
  - Acute onset of diarrhea (loose or watery stools, increased frequency)
  - Vomiting (may precede diarrhea by 12-24 hours)
  - Abdominal cramping or pain
  - Fever (more common with bacterial pathogens)
  - Nausea and decreased appetite
  - Dehydration signs (dry mucous membranes, decreased urine output, lethargy)
  - Sick contacts or daycare exposure
  - Viral prodrome (URI symptoms, malaise, myalgias)
  - Recent antibiotic use (consider C. difficile)
  - Travel history (increased risk bacterial pathogens)
  - Blood or mucus in stool (suggests invasive bacterial infection)
  - Tenesmus (painful straining with bowel movements)
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Frequency and character of stools (watery, bloody, mucoid)
  - Presence and frequency of vomiting
  - Fever pattern and maximum temperature
  - Associated symptoms (abdominal pain, tenesmus, URI symptoms)
  - Oral intake tolerance and amount
  - Urine output (wet diapers, last void time)
  - Sick contacts, daycare attendance
  - Recent travel (domestic or international)
  - Food exposures (unpasteurized milk, undercooked meat, shellfish, contaminated water)
  - Recent antibiotic use (within past 3 months - C. difficile risk)
  - Chronic medical conditions (immunocompromised, inflammatory bowel disease)
  - Immunization history (rotavirus vaccine status)
  - Physical examination
  - Vital signs (temperature, heart rate, respiratory rate, blood pressure, weight)
  - Assess degree of dehydration (see PEDS-DEHYDRATION)
  - Mild (3-5%), moderate (6-9%), severe (greater than 9%)
  - General appearance (playful, lethargic, obtunded)
  - Abdominal examination
  - Distension, tenderness, guarding, rebound
  - Bowel sounds (hyperactive with viral, hypoactive with obstruction)
  - Palpable masses or organomegaly
  - Perianal examination (excoriation, fissures, tags)
  - Rectal examination if bloody stools or concern for intussusception (currant jelly stool)
  - Skin examination (rash, petechiae, purpura)
  - Neurologic examination (mental status, signs of meningismus)
  - Distinguish viral versus bacterial gastroenteritis
  - Viral (most common): watery diarrhea, vomiting prominent, low-grade fever, sick contacts
  - Bacterial: bloody diarrhea, high fever, severe abdominal pain, less vomiting, food exposure
  - Laboratory evaluation
  - NOT routinely needed for typical viral gastroenteritis
  - Consider testing if:
  - Severe symptoms, high fever, bloody diarrhea
  - Immunocompromised patient
  - Recent travel or outbreak setting
  - Duration greater than 7 days (chronic diarrhea)
  - Basic metabolic panel (BMP) if moderate-severe dehydration
  - Assess electrolytes (sodium, potassium, bicarbonate)
  - BUN/creatinine (pre-renal azotemia)
  - Glucose (hypoglycemia risk in young infants)
  - Complete blood count (CBC)
  - Leukocytosis with left shift suggests bacterial infection
  - Stool studies (if bloody diarrhea, high fever, severe symptoms, or immunocompromised)
  - Stool culture and sensitivity (bacterial pathogens)
  - Salmonella, Shigella, Campylobacter, E. coli O157:H7, Yersinia
  - Stool for Shiga toxin (E. coli O157:H7) - risk hemolytic uremic syndrome (HUS)
  - Stool for ova and parasites (if travel history or chronic diarrhea)
  - Giardia, Cryptosporidium, Entamoeba
  - C. difficile toxin (if recent antibiotics or hospitalization)
  - Stool viral panel (rotavirus, norovirus, adenovirus) - usually not needed, clinical diagnosis
  - Stool lactoferrin or fecal leukocytes (marker of invasive bacterial infection)
  - Abdominal imaging
  - Usually NOT indicated for typical gastroenteritis
  - Abdominal X-ray if concern for obstruction (bilious vomiting, distension, no stool output)
  - Ultrasound if concern for intussusception, appendicitis, or pyloric stenosis
  - CT abdomen if peritoneal signs or severe pain (appendicitis, perforation)
treatment:
  - Oral rehydration therapy (ORT) - MAINSTAY of treatment
  - See PEDS-DEHYDRATION for detailed rehydration protocol
  - Oral rehydration solution (ORS): Pedialyte, WHO-ORS
  - Mild dehydration: 50 mL/kg over 2-4 hours
  - Moderate dehydration: 100 mL/kg over 2-4 hours
  - Small frequent volumes (5 mL every 2-5 minutes)
  - IV fluids if severe dehydration, shock, or unable to tolerate oral
  - Normal saline 20 mL/kg bolus, repeat as needed
  - After stabilization: maintenance plus deficit replacement
  - Dietary management
  - Continue breastfeeding throughout illness
  - Resume normal age-appropriate diet once rehydrated
  - No dietary restrictions (full-strength formula, regular foods)
  - BRAT diet (bananas, rice, applesauce, toast) NOT recommended - nutritionally inadequate
  - Avoid high-sugar drinks (juice, soda) - osmotic load worsens diarrhea
  - Complex carbohydrates, lean meats, yogurt, fruits, vegetables all appropriate
  - Lactose restriction NOT routinely needed (transient lactase deficiency rare)
  - Antiemetic therapy
  - Ondansetron (Zofran) - facilitates oral rehydration if vomiting
  - Age greater than 6 months: 0.15 mg/kg PO (max 8 mg) single dose
  - Reduces vomiting episodes, improves ORT success
  - May prolong diarrhea duration slightly
  - Other antiemetics (promethazine, metoclopramide) NOT recommended in children
  - Antibiotic therapy - NOT routinely indicated for most cases
  - Viral gastroenteritis: supportive care only, antibiotics not helpful
  - Bacterial gastroenteritis: usually self-limited, antibiotics often NOT needed
  - Consider antibiotics for:
  - Shigella (especially if greater than 5 years or daycare attendee): azithromycin 12 mg/kg day 1, then 6 mg/kg days 2-5
  - Campylobacter if early course (within 3 days onset): azithromycin 10 mg/kg/day for 3 days
  - Salmonella: do NOT treat uncomplicated cases (prolongs carrier state)
  - Only treat if age less than 3 months, immunocompromised, or severe invasive disease
  - Ceftriaxone 50 mg/kg IV daily OR azithromycin
  - C. difficile: metronidazole 7.5 mg/kg PO every 8 hours for 10 days OR vancomycin 10 mg/kg PO every 6 hours
  - Giardia: metronidazole 5 mg/kg PO three times daily for 5-7 days
  - E. coli O157:H7: do NOT give antibiotics (increases risk HUS)
  - Antidiarrheal agents
  - Loperamide (Imodium) and bismuth subsalicylate (Pepto-Bismol) NOT recommended in children
  - Risk prolonging infection, bacterial overgrowth, toxic megacolon
  - Probiotics
  - Lactobacillus GG, Saccharomyces boulardii
  - May reduce duration of diarrhea by 1 day
  - Safe adjunct therapy
  - Zinc supplementation (WHO recommendation, especially developing countries)
  - Age 6 months to 5 years: 10-20 mg elemental zinc daily for 10-14 days
  - Reduces duration and severity of diarrhea
  - Prevention
  - Hand hygiene (most important - soap and water, not alcohol gel for norovirus)
  - Rotavirus vaccination (RotaTeq, Rotarix) - dramatically reduced severe gastroenteritis
  - Food safety (proper cooking, refrigeration, avoid unpasteurized products)
  - Safe water sources when traveling
  - Disposition
  - Discharge home if mild dehydration and tolerating oral rehydration
  - Admit if moderate-severe dehydration, failed oral rehydration trial, age less than 3 months, toxic appearance
  - Anticipatory guidance: continue ORS for ongoing losses, when to return (lethargy, no urine, blood in stool, worsening)
clinical_pearls:
  - 'Viral gastroenteritis most common cause (rotavirus, norovirus, adenovirus) - supportive care with rehydration only, no antibiotics needed'
  - 'Bloody diarrhea suggests bacterial pathogen (Shigella, Campylobacter, Salmonella, E. coli O157:H7) - obtain stool culture'
  - 'Do NOT give antibiotics for E. coli O157:H7 - increases risk of hemolytic uremic syndrome (HUS)'
  - 'Oral rehydration therapy (ORT) equally effective as IV fluids for mild-moderate dehydration - first-line treatment'
  - 'Resume normal diet immediately after rehydration - BRAT diet outdated and nutritionally inadequate'
  - 'Ondansetron single dose improves oral rehydration success if vomiting - consider to facilitate ORT'
  - 'Antidiarrheal agents (loperamide) contraindicated in children - risk complications including toxic megacolon'
  - 'Rotavirus vaccination dramatically reduced hospitalizations for gastroenteritis - most important prevention measure'
referrals:
  - Pediatric gastroenterology if chronic diarrhea (greater than 14 days), blood in stool persisting, weight loss or failure to thrive
  - Pediatric nephrology if hemolytic uremic syndrome (HUS) develops (triad: hemolytic anemia, thrombocytopenia, acute kidney injury)
  - Pediatric infectious disease if immunocompromised host, unusual pathogen, or complicated course
  - Public health notification if concern for outbreak, food poisoning, or reportable pathogen
differentials:
  - Viral gastroenteritis (rotavirus, norovirus, adenovirus, astrovirus) - most common, watery diarrhea, vomiting
  - Bacterial gastroenteritis (Salmonella, Shigella, Campylobacter, E. coli, Yersinia, C. difficile)
  - Parasitic infection (Giardia, Cryptosporidium, Entamoeba histolytica)
  - Food poisoning (Staphylococcus aureus, Bacillus cereus, Clostridium perfringens) - short incubation, often outbreak
  - Appendicitis (right lower quadrant pain, fever, vomiting, anorexia, rebound tenderness)
  - Intussusception (intermittent colicky pain, vomiting, currant jelly stools, age 6-36 months, ultrasound target sign)
  - Malrotation with midgut volvulus (bilious vomiting, abdominal distension, surgical emergency)
  - Inflammatory bowel disease (IBD) - Crohn's or ulcerative colitis (chronic bloody diarrhea, weight loss, growth delay)
  - Hemolytic uremic syndrome (HUS) - triad of hemolytic anemia, thrombocytopenia, acute kidney injury (post E. coli O157:H7)
  - Lactose intolerance (secondary to viral gastroenteritis, watery diarrhea, bloating, usually self-resolves)
