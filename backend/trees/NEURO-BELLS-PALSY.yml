tree_id: NEURO-BELLS-PALSY
name: Bell's Palsy
family: Neurology
specialty: Neurology
chief_complaint: Sudden onset unilateral facial weakness
description: |
  Acute unilateral peripheral facial nerve (CN VII) palsy of unknown etiology. Likely post-viral inflammation.
  Most common cause of acute facial paralysis (60-75%). Usually self-limited, 70% recover completely without treatment.
icd10: G51.0
urgency: Moderate
workup:
  - Clinical diagnosis - acute onset unilateral facial weakness affecting forehead and lower face (peripheral pattern)
  - House-Brackmann scale to grade severity (I normal to VI complete paralysis)
  - Assess for complete eye closure (inability increases risk of corneal abrasion)
  - Examine ear for vesicles (Ramsay Hunt syndrome from herpes zoster, worse prognosis)
  - Test taste on anterior two-thirds of tongue (CN VII chorda tympani branch)
  - Rule out stroke - central facial palsy spares forehead, associated with other focal deficits
  - Lyme serology if endemic area or recent tick exposure (Lyme disease can cause facial palsy)
  - Consider MRI brain with gadolinium if atypical features (gradual onset, bilateral, progressive, recurrent, other cranial neuropathies)
treatment:
  - Prednisone 60mg daily x 5 days, then taper over 5 days (started within 72 hours improves recovery by 10-15%)
  - Valacyclovir 1000mg TID x 7 days if seen within 72 hours (benefit unclear, may add to steroids)
  - Eye protection critical - artificial tears during day, lubricating ointment at night, eye patch or tape eyelid closed when sleeping
  - Physical therapy including facial exercises once movement begins to return
  - Surgical decompression not recommended (no proven benefit)
  - Most patients (70-80%) recover completely within 3-6 months
  - Incomplete recovery more likely with complete paralysis, age over 60, diabetes, pregnancy
clinical_pearls:
  - Peripheral CN VII palsy affects entire half of face including forehead (cannot wrinkle forehead or close eye)
  - Central lesion (stroke) spares forehead due to bilateral cortical innervation of upper face
  - Ramsay Hunt syndrome (herpes zoster oticus) presents with ear pain, vesicles in ear canal, worse prognosis than Bell's palsy
  - Synkinesis (aberrant reinnervation causing involuntary movements) can occur in 15% during recovery
  - Hyperacusis (increased sensitivity to sound) from stapedius muscle paralysis
  - Red flag features requiring imaging - gradual onset, bilateral, progressive over weeks, recurrent episodes
differentials:
  - Stroke (central facial palsy)
  - Ramsay Hunt syndrome (herpes zoster oticus)
  - Lyme disease
  - Acoustic neuroma
  - Parotid tumor
  - Multiple sclerosis
trace:
  - Sudden inability to close right eye and smile on right side this morning → Forehead also affected, cannot wrinkle right forehead → No ear vesicles, no other neurologic deficits → Diagnose Bell's palsy → Start prednisone 60mg daily x 10 days with taper plus valacyclovir 1000mg TID x 7 days → Eye protection with artificial tears and nighttime ointment, tape eye closed at night → Physical therapy facial exercises → Follow-up at 2 weeks, starting to regain movement → 3 months, 90% recovery
