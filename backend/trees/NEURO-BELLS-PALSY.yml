tree_id: NEURO-BELLS-PALSY
name: Bell's Palsy
family: Neurology
specialty: Neurology
chief_complaint: Sudden unilateral facial weakness or paralysis
description: Acute peripheral facial nerve (CN VII) palsy of unknown etiology, characterized by sudden unilateral facial weakness affecting upper and lower face, thought to be post-viral inflammatory neuropathy
icd10: G51.0
urgency: medium
workup:
  - Pathophysiology - Inflammatory demyelination of facial nerve (CN VII) in facial canal
  - Most commonly affects nerve at geniculate ganglion or distal to stylomastoid foramen
  - Thought to be post-viral inflammatory response (HSV-1 reactivation most implicated, also VZV, EBV, CMV)
  - Viral infection → inflammation → edema → compression in narrow bony facial canal → nerve ischemia → demyelination
  - Facial nerve course - Motor to muscles of facial expression, stapedius muscle (ear), taste anterior 2/3 tongue (chorda tympani), parasympathetic to lacrimal/salivary glands
  - Peripheral vs central facial palsy
  - Peripheral (LMN) - Bell's palsy, affects ENTIRE ipsilateral face (forehead + lower face)
  - Cannot raise eyebrow, wrinkle forehead, close eye, smile
  - Central (UMN) - Stroke, affects lower face ONLY, forehead spared (bilateral cortical innervation of upper face)
  - Can raise eyebrow, wrinkle forehead, but cannot smile
  - Epidemiology
  - Most common cause acute facial palsy (60-75% cases)
  - Annual incidence 20-30 per 100,000
  - Peak age 15-45 years, equal gender distribution
  - Risk factors - Pregnancy (3x risk, especially third trimester), diabetes (3-4x risk), hypertension, URI
  - Clinical presentation - SUDDEN onset unilateral facial weakness
  - Onset - Maximal deficit within 72 hours (often overnight, patient wakes with facial droop)
  - Prodrome - 25% report retroauricular pain or dysgeusia 1-2 days before weakness
  - Facial weakness - Affects entire ipsilateral face
  - Cannot close eye (lagophthalmos) - Risk of corneal abrasion, exposure keratitis (most serious complication)
  - Bell phenomenon - Eyeball rolls upward when attempting to close eye
  - Cannot raise eyebrow, wrinkle forehead (vs stroke, forehead spared)
  - Asymmetric smile, mouth droop, difficulty with lip closure (drooling, difficulty drinking)
  - Flattened nasolabial fold
  - Associated symptoms
  - Retroauricular pain - Common (50-60%), often first symptom
  - Hyperacusis - Increased sensitivity to sound (stapedius muscle paralysis, fails to dampen loud sounds)
  - Dysgeusia - Altered taste anterior 2/3 tongue (chorda tympani involvement)
  - Decreased tearing or lacrimation - Parasympathetic dysfunction
  - House-Brackmann grading scale - Severity of facial palsy (I-VI)
  - I - Normal
  - II - Mild dysfunction, slight weakness on close inspection
  - III - Moderate dysfunction, obvious weakness but not disfiguring, complete eye closure with effort
  - IV - Moderately severe dysfunction, obvious disfiguring asymmetry, incomplete eye closure
  - V - Severe dysfunction, barely perceptible motion
  - VI - Total paralysis, no movement
  - Red flags for alternative diagnosis (NOT Bell's palsy)
  - Gradual onset (>3 days progression) - Consider tumor, Lyme disease
  - Bilateral facial palsy - Guillain-Barré syndrome, Lyme disease, sarcoidosis
  - Recurrent ipsilateral - Tumor, Melkersson-Rosenthal syndrome
  - Vesicles in ear canal - Ramsay Hunt syndrome (VZV, herpes zoster oticus)
  - Other cranial neuropathies - Lyme, tumor, GBS
  - Prolonged recovery (>6 months) - Consider alternative diagnosis
  - Diagnostic evaluation - Clinical diagnosis of exclusion
  - History and physical - Assess onset, distribution (forehead involved?), rule out stroke, exclude secondary causes
  - Neurologic exam - Full cranial nerve exam, strength, sensation, cerebellar (ataxia suggests brainstem lesion, not Bell's)
  - Otoscopic exam - Vesicles in ear canal/tympanic membrane suggest Ramsay Hunt (VZV)
  - Laboratory tests - NOT routinely needed for classic presentation
  - Lyme serology - If endemic area, tick exposure, bilateral palsy, other Lyme manifestations
  - HIV testing - If risk factors, bilateral palsy
  - ACE level - If concern for sarcoidosis (bilateral palsy, systemic symptoms)
  - ESR/CRP - Non-specific
  - Imaging - NOT routinely indicated for typical Bell's palsy
  - MRI brain with gadolinium - If atypical features (gradual onset, recurrent, other CN deficits, hearing loss, brainstem signs)
  - Enhancement of facial nerve in facial canal normal finding in Bell's palsy
  - Tumor, stroke, demyelination if atypical
  - CT temporal bone - If trauma, cholesteatoma, chronic otitis media
  - Electrodiagnostic testing - Nerve conduction studies, electromyography (EMG)
  - NOT for diagnosis, used for prognosis
  - Perform after 2-3 weeks if no recovery (assess denervation)
  - Severe denervation (>90% axonal loss) predicts poor recovery
treatment:
  - Corticosteroids - MAINSTAY, most effective if started within 72 hours
  - Prednisone 60-80 mg daily (or 1 mg/kg up to 80 mg) x 5-7 days, then taper over 3-7 days (total 10 days)
  - OR prednisolone 60 mg daily x 5 days, then taper by 10 mg daily
  - Mechanism - Reduce inflammation, edema, nerve compression
  - Evidence - NNT = 10 for improved recovery at 6 months (Cochrane review)
  - Most benefit if started <72 hours (ideally <48 hours)
  - Antivirals - Controversial, modest benefit if combined with steroids
  - Acyclovir 400 mg 5x daily x 7-10 days OR valacyclovir 1000 mg TID x 7 days
  - Combined with steroids, may improve outcomes if severe palsy or started early
  - Mechanism - Treat HSV reactivation (presumed etiology)
  - Evidence - Cochrane review shows small benefit when added to steroids, no benefit alone
  - Recommendation - Consider in severe palsy (H-B IV-VI) or early presentation (<72 hours)
  - Eye protection - CRITICAL to prevent corneal complications
  - Artificial tears - Frequently during day (q1-2h while awake)
  - Lubricating ointment - At night (more viscous, lasts longer)
  - Eye patch or tape eyelid closed - At night to prevent exposure (use paper tape or eye patch)
  - Moisture chamber goggles - During day if incomplete closure
  - Ophthalmology referral - If signs of corneal abrasion (pain, redness, photophobia, visual changes)
  - Physical therapy - Facial exercises, massage
  - May help prevent synkinesis (aberrant reinnervation, involuntary facial movements)
  - Start after 2-3 weeks when voluntary movement returns
  - Prognosis - GOOD, most recover completely
  - 70-85% complete recovery without treatment
  - 85-95% complete recovery with steroids
  - Recovery timeline - Begins 2-3 weeks, complete by 3-6 months (90% by 3 months)
  - Incomplete recovery predictors - Severe palsy (H-B V-VI), age >60, diabetes, absent taste, hyperacusis, lack of recovery by 3 weeks
  - Synkinesis - 10-15% develop (aberrant reinnervation, eye closure causes mouth movement, or vice versa)
  - Recurrence - 8-12% recur (usually contralateral), if ipsilateral recurrence consider alternative diagnosis (tumor)
clinical_pearls:
  - Bell's palsy affects entire face (forehead + lower face), stroke spares forehead (can wrinkle forehead)
  - Start corticosteroids within 72 hours for best outcomes (prednisone 60-80 mg daily x 5-7 days then taper)
  - Eye protection is critical - artificial tears, ointment at night, tape eye closed to prevent exposure keratitis
  - 85-95% recover completely with steroids, most by 3-6 months
  - Bilateral facial palsy is NOT Bell's palsy - consider Guillain-Barré, Lyme disease, sarcoidosis
  - Vesicles in ear canal suggest Ramsay Hunt syndrome (VZV), not Bell's palsy - needs acyclovir
differentials:
  - NEURO-STROKE
  - NEURO-GUILLAIN-BARRE
  - INFECTIOUS-LYME-DISEASE
  - RHEUM-SARCOIDOSIS
  - ENT-RAMSAY-HUNT-SYNDROME
  - NEURO-BRAIN-TUMOR
trace:
  - Sudden unilateral facial weakness affecting entire face
  - Cannot close eye, raise eyebrow, or smile on affected side
  - Retroauricular pain, hyperacusis, dysgeusia common
  - Start prednisone within 72 hours, eye protection critical
  - Most recover completely by 3-6 months
