tree_id: NEURO-BELLS-PALSY
name: Bell's Palsy
family: Neurology
specialty: Neurology
chief_complaint: Sudden onset unilateral facial weakness
description: Acute peripheral facial nerve (CN VII) palsy of unknown etiology
icd10: G51.0
urgency: urgent
workup:
  - Clinical diagnosis based on history and physical examination
  - House-Brackmann scale (I-VI) to grade severity of facial paralysis
  - Complete neurological exam to exclude central causes (forehead sparing suggests central lesion)
  - Otoscopic examination for herpes zoster vesicles in ear canal (Ramsay Hunt syndrome)
  - Test all branches of facial nerve (temporal, zygomatic, buccal, mandibular, cervical)
  - Check for hyperacusis (stapedius muscle paralysis), taste impairment (chorda tympani)
  - Schirmer test for decreased lacrimation
  - MRI brain with contrast if atypical features, bilateral involvement, or no improvement in 3 months
  - Lyme serology if endemic area or tick exposure
  - HIV testing if risk factors present
  - Fasting glucose or HbA1c (diabetes increases Bell palsy risk)
  - EMG/nerve conduction studies if not improving at 3-4 weeks (predicts recovery)
treatment:
  - Prednisone 60-80 mg daily for 7 days, then taper over 3-5 days (start within 72 hours for best results)
  - Valacyclovir 1000 mg TID for 7 days (add if seen within 72 hours, benefit controversial)
  - Eye protection CRITICAL - artificial tears hourly while awake, ophthalmic ointment at night
  - Eye patch or taping eyelid closed at night to prevent corneal exposure/ulceration
  - Ophthalmology consultation if incomplete eye closure
  - Physical therapy - facial exercises (smile, frown, raise eyebrows, puff cheeks)
  - Massage affected side to maintain muscle tone
  - Electrical stimulation may help (evidence limited)
  - Reassurance - 70% complete recovery without treatment, 85-90% with corticosteroids
  - Follow-up in 1-2 weeks to assess improvement
  - If no improvement by 3 months, refer to neurology for EMG and consider MRI
clinical_pearls:
  - Diagnosis of exclusion - rule out stroke, Lyme disease, tumor, Ramsay Hunt syndrome
  - Forehead INVOLVED in Bell palsy (cannot raise eyebrow) vs forehead spared in stroke (bilateral cortical innervation)
  - Most common cause of acute facial paralysis (60-75% of cases)
  - Peak incidence age 15-45, slight female predominance, higher risk in pregnancy (3rd trimester)
  - Recurrence rate 7-12%, bilateral involvement rare (less than 1%)
  - HSV-1 reactivation likely etiology (HSV DNA found in facial nerve geniculate ganglion)
  - House-Brackmann grade I-II at onset predicts excellent recovery
  - Complete denervation on EMG at 2-3 weeks predicts incomplete recovery
  - Crocodile tears (gustatory lacrimation) may develop during recovery due to aberrant nerve regeneration
  - Synkinesis (involuntary facial movements) affects 10-15% - treat with botulinum toxin
differentials:
  - Stroke (central facial palsy - forehead spared, other neurological deficits)
  - Ramsay Hunt syndrome (herpes zoster oticus - vesicles in ear canal, more severe)
  - Lyme disease (bilateral facial palsy in 25%, tick exposure, erythema migrans)
  - Cholesteatoma or temporal bone tumor
  - Acute otitis media with facial nerve involvement
  - Parotid gland tumor (gradual onset, palpable mass)
  - Guillain-Barré syndrome (bilateral, ascending paralysis)
  - Sarcoidosis (Heerfordt syndrome - uveitis, parotid swelling)
  - HIV, syphilis, tuberculosis
trace:
  - 35-year-old woman presents to ED with sudden onset right facial weakness noticed upon waking
  - Unable to close right eye, drooling from right corner of mouth, difficulty speaking clearly
  - Denies headache, vision changes, numbness, weakness elsewhere
  - No recent illness, no tick exposure, not pregnant
  - Physical exam - complete right facial paralysis (House-Brackmann grade V)
  - Unable to raise right eyebrow, close right eye, wrinkle forehead, or show teeth on right
  - Right nasolabial fold flattened, mouth deviates to left when smiling
  - Hyperacusis present on right, taste impairment on right anterior tongue
  - No vesicles in ear canal, tympanic membrane normal
  - Remainder of neurological exam normal (no limb weakness, reflexes symmetric, coordination intact)
  - CT head without contrast - no acute intracranial abnormality
  - Diagnosis - Bell palsy
  - Started prednisone 60 mg daily for 7 days then taper, valacyclovir 1000 mg TID for 7 days
  - Prescribed artificial tears QID, erythromycin ophthalmic ointment at bedtime, eye patch at night
  - Educated on facial exercises, importance of eye protection
  - Follow-up in 2 weeks - significant improvement, able to partially close eye and smile
  - 3-month follow-up - near-complete recovery (House-Brackmann grade II), minimal residual weakness
  - Outcome - Excellent recovery with no complications, discontinued eye protection
