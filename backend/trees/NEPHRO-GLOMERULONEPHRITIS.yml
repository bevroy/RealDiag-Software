tree_id: NEPHRO-GLOMERULONEPHRITIS
name: Glomerulonephritis
family: Nephrology
specialty: Nephrology
chief_complaint: Hematuria and edema
description: |
  Inflammation of glomeruli causing hematuria, proteinuria, and renal dysfunction. Can be primary (renal-limited) or secondary (systemic disease).
  Presentation varies from asymptomatic urinary abnormalities to rapidly progressive glomerulonephritis (RPGN) with acute kidney injury. Nephritic syndrome characterized by hematuria, hypertension, edema, oliguria.
icd10: N05.9
snomed: 36171008
presentations:
  - Hematuria (tea-colored urine)
  - Edema (periorbital, peripheral)
  - Hypertension
  - Oliguria
  - Proteinuria
  - May follow pharyngitis or skin infection
urgency: High
workup:
  - Urinalysis - dysmorphic RBCs, RBC casts (pathognomonic for glomerulonephritis), proteinuria, WBCs
  - RBC casts distinguish glomerular from non-glomerular hematuria
  - Quantify proteinuria - spot urine protein/creatinine ratio or 24-hour urine collection
  - Nephrotic range (greater than 3.5 g/24h) vs nephritic (sub-nephrotic)
  - Serum creatinine and BUN - assess renal function, calculate eGFR
  - Complement levels - C3 and C4
  - Low C3 with normal C4 - post-infectious GN, MPGN, shunt nephritis
  - Low C3 and C4 - lupus nephritis, cryoglobulinemia, endocarditis
  - Normal complement - IgA nephropathy, ANCA vasculitis, anti-GBM disease
  - Serologic testing based on clinical presentation
  - ANA, anti-dsDNA, complement - systemic lupus erythematosus
  - ANCA (c-ANCA/PR3 and p-ANCA/MPO) - granulomatosis with polyangiitis (GPA), microscopic polyangiitis (MPA)
  - Anti-GBM antibody - Goodpasture syndrome
  - ASO titer, streptozyme - post-streptococcal GN
  - Hepatitis B and C serology - associated with membranous nephropathy, MPGN, cryoglobulinemia
  - HIV, syphilis testing if indicated
  - Renal ultrasound - assess kidney size, rule out obstruction
  - Renal biopsy definitive diagnosis - light microscopy, immunofluorescence, electron microscopy
  - Indications - unclear etiology, need to guide treatment (especially if considering immunosuppression), RPGN
treatment:
  - Treatment depends on underlying cause
  - Post-streptococcal GN (PSGN) - supportive care, resolves spontaneously in 95%
  - Salt/fluid restriction, diuretics (furosemide 20-80mg daily) for edema and hypertension
  - ACE inhibitors or ARBs for blood pressure and proteinuria
  - Self-limited, excellent prognosis in children, occasional progression in adults
  - IgA nephropathy (Berger disease) - most common primary GN worldwide
  - ACE inhibitors/ARBs reduce proteinuria and slow progression
  - Fish oil (omega-3 fatty acids) may benefit
  - Corticosteroids if proteinuria greater than 1 g/day despite maximal RAAS blockade - prednisone 0.5-1 mg/kg daily
  - Poor prognosis - hypertension, heavy proteinuria, elevated creatinine, severe fibrosis on biopsy
  - RPGN (rapidly progressive GN) - aggressive treatment required
  - Crescents on biopsy (greater than 50% severe), acute renal failure over days to weeks
  - Type I (anti-GBM disease/Goodpasture) - plasmapheresis plus cyclophosphamide 2 mg/kg daily and prednisone 1 mg/kg daily
  - Type II (immune complex - lupus, PSGN) - treat underlying disease
  - Type III (pauci-immune ANCA vasculitis) - cyclophosphamide or rituximab plus high-dose corticosteroids
  - Induction - methylprednisolone 500-1000mg IV x 3 days, then prednisone 1 mg/kg, cyclophosphamide 2 mg/kg daily or rituximab 375 mg/m2 weekly x 4
  - Maintenance - azathioprine or rituximab for 18-24 months
  - Plasmapheresis if dialysis-dependent or pulmonary hemorrhage
  - Lupus nephritis - biopsy determines class and treatment
  - Class III-IV (proliferative) - mycophenolate mofetil 2-3 g/day or cyclophosphamide IV monthly plus prednisone
  - Membranous nephropathy - treat if nephrotic syndrome
  - Exclude secondary causes (malignancy, hepatitis B, NSAIDs, lupus)
  - Cyclical cyclophosphamide and steroids or rituximab
clinical_pearls:
  - Nephritic syndrome triad - hematuria, hypertension, edema (think glomerulonephritis)
  - Nephrotic syndrome - proteinuria greater than 3.5 g/day, hypoalbuminemia, edema, hyperlipidemia (different glomerulopathies)
  - PSGN follows pharyngitis by 1-2 weeks or impetigo by 3-6 weeks, self-limited
  - IgA nephropathy - episodic gross hematuria concurrent with URI (synpharyngitic), mesangial IgA deposition
  - RPGN medical emergency - dialysis and death within weeks without treatment
  - Goodpasture pulmonary-renal syndrome - anti-GBM antibodies, hemoptysis plus hematuria, treat aggressively
  - ANCA vasculitis - GPA (upper/lower respiratory plus renal), MPA (renal and pulmonary)
differentials:
  - Urinary tract infection
  - Nephrolithiasis
  - Bladder cancer
  - Acute tubular necrosis
  - Acute interstitial nephritis
  - Thrombotic microangiopathy
trace:
  - 28-year-old man with dark urine, facial edema x 3 days → History of pharyngitis 2 weeks ago → BP 165/95, periorbital edema → Urinalysis shows 3+ blood, 2+ protein, dysmorphic RBCs, RBC casts → Creatinine 1.8 mg/dL (baseline 0.9), BUN 42 → Low C3 48 mg/dL (normal 90-180), normal C4, elevated ASO titer 640 → Diagnose post-streptococcal glomerulonephritis → Admit for monitoring → Restrict sodium and fluids → Furosemide 40mg daily for edema → Lisinopril 10mg daily for hypertension → Creatinine improves to 1.2 at 1 week → C3 normalizes by 8 weeks → Complete recovery, no chronic kidney disease at 6-month follow-up
