tree_id: PEDS-MENINGITIS
name: Pediatric Meningitis
family: Pediatrics
specialty: Pediatrics, Emergency Medicine, Infectious Disease
chief_complaint: Fever, Headache, Altered Mental Status in Child
description: Rapid diagnosis and treatment of bacterial and viral meningitis in children
version: "1.0"
icd10: G03.9
author: RealDiag Clinical Team

entry_point: meningitis_screening

nodes:
  - id: meningitis_screening
    type: question
    text: "Child with concerning symptoms?"
    options:
      - label: "Infant <3 months with fever"
        next: infant_fever_workup
      - label: "Child with fever AND meningeal signs (stiff neck, Kernig/Brudzinski)"
        next: bacterial_meningitis_suspected
      - label: "Child with fever, headache, but no meningeal signs"
        next: low_risk_meningitis

  - id: infant_fever_workup
    type: diagnosis
    name: "Febrile Infant <3 Months - Sepsis/Meningitis Workup"
    icd10: "R50.9"
    urgency: critical
    workup:
      - DO NOT wait - empiric antibiotics and full sepsis workup
      - Blood culture x2
      - Urine culture (catheterized specimen)
      - Lumbar puncture (unless contraindicated)
        - CSF cell count, glucose, protein, Gram stain, culture
        - CSF PCR panel (HSV, enterovirus if available)
      - CBC with differential, CRP, procalcitonin
      - CMP
      - Chest X-ray
    treatment:
      - IMMEDIATE empiric antibiotics (do NOT wait for LP)
      - Ampicillin 50 mg/kg IV q6h (covers Listeria, GBS) PLUS
      - Cefotaxime 50 mg/kg IV q6h OR gentamicin 2.5 mg/kg IV q8h
      - ADD Acyclovir 20 mg/kg IV q8h (for HSV meningitis)
      - Admit to PICU
      - Close monitoring
      - Adjust antibiotics based on cultures
    prognosis: "Critical age group; requires aggressive treatment"

  - id: bacterial_meningitis_suspected
    type: diagnosis
    name: "Acute Bacterial Meningitis"
    icd10: "G00.9"
    urgency: critical
    workup:
      - Blood cultures x2 BEFORE antibiotics if possible
      - "Lumbar puncture (unless contraindicated): Contraindications include signs of increased ICP (papilledema, focal neuro signs, altered mental status), hemodynamic instability, infection at LP site, coagulopathy. If contraindicated give antibiotics immediately, do LP later or get CT first"
      - "CSF Studies: Opening pressure (elevated in bacterial), Cell count and differential, Glucose (low in bacterial - less than 40 mg/dL or CSF/serum less than 0.4), Protein (elevated in bacterial - greater than 100 mg/dL), Gram stain and culture (GOLD STANDARD), Bacterial antigens (S. pneumoniae, N. meningitidis, H. flu), PCR if available"
      - CBC, CMP, coagulation studies
      - CT head BEFORE LP if:
        - Altered mental status
        - New-onset seizure
        - Focal neurologic signs
        - Papilledema
        - Immunocompromised
    treatment:
      - DO NOT DELAY antibiotics for imaging or LP
      - TIME IS CRITICAL - give antibiotics within 30 minutes of suspicion
      - Empiric Antibiotics (adjust by age):
        - "1-3 months: Ampicillin 75 mg/kg IV q6h + Cefotaxime 50 mg/kg IV q6h"
        - ">3 months: Ceftriaxone 100 mg/kg/day IV divided q12h (max 4g/day) + Vancomycin 15 mg/kg IV q6h"
        - "Add ampicillin if age under 50 years (Listeria coverage)"
      - Dexamethasone 0.15 mg/kg IV q6h x2-4 days
        - Give BEFORE or WITH first antibiotic dose
        - Reduces neurologic sequelae in pneumococcal meningitis
        - Controversy in children - typically used if pneumococcal suspected
      - Supportive Care:
        - IV fluids - careful with SIADH risk
        - Monitor sodium closely (SIADH common)
        - Seizure precautions
        - Maintain normoglycemia
        - Treat increased ICP if present
      - PICU admission
      - Isolation precautions until bacterial etiology ruled out (droplet for first 24 hours)
      - Chemoprophylaxis for close contacts if N. meningitidis or H. influenzae
        - Rifampin, ciprofloxacin, or ceftriaxone for contacts
      - Duration of treatment:
        - N. meningitidis: 7 days
        - H. influenzae: 7-10 days
        - S. pneumoniae: 10-14 days
        - Gram-negative: 21 days
      - Repeat LP at 48 hours if not improving
      - Audiology follow-up (hearing loss common complication)
      - Developmental follow-up
    prognosis: "Mortality 5-10% with treatment; neurologic sequelae in 20-30% (hearing loss, seizures, developmental delay)"

  - id: low_risk_meningitis
    type: diagnosis
    name: "Low Risk Meningitis - Likely Viral"
    icd10: "A87.9"
    urgency: high
    workup:
      - Lumbar puncture
        - CSF lymphocytic predominance (viral)
        - Normal or mildly elevated protein
        - Normal glucose
        - Negative Gram stain
      - CSF viral PCR (enterovirus, HSV if severe)
      - Blood work
    treatment:
      - Supportive care if viral pattern
      - Antipyretics, hydration
      - Pain control
      - Observation vs admission based on clinical appearance
      - NO antibiotics needed if clearly viral pattern
      - Acyclovir if HSV suspected
    prognosis: "Excellent for viral meningitis; self-limited"

clinical_pearls:
  - "Classic triad: fever, nuchal rigidity, altered mental status (only 44% have all three)"
  - "Kernig sign: pain with knee extension when hip flexed to 90°"
  - "Brudzinski sign: involuntary hip/knee flexion when neck flexed"
  - "Bacterial CSF: >1000 WBC, neutrophil predominant, low glucose, high protein, positive Gram stain"
  - "Viral CSF: <500 WBC, lymphocyte predominant, normal glucose, mildly elevated protein"
  - "Most common organisms by age:"
  - "  <1 month: GBS, E. coli, Listeria"
  - "  1-3 months: GBS, E. coli, S. pneumoniae, N. meningitidis, H. influenzae"
  - "  >3 months: S. pneumoniae, N. meningitidis (with vaccines, incidence much lower)"
  - "Petechial or purpuric rash suggests meningococcemia"
  - "NEVER delay antibiotics for LP or imaging"

red_flags:
  - "Petechial or purpuric rash (meningococcemia)"
  - "Altered mental status"
  - "Seizures"
  - "Focal neurologic deficits"
  - "Signs of increased ICP (bulging fontanelle in infant, papilledema)"
  - "Hypotension or shock"
  - "Apnea in infant"
  - "Poor feeding in infant"
