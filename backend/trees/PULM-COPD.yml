tree_id: PULM-COPD
name: Chronic Obstructive Pulmonary Disease
family: Pulmonology
specialty: Pulmonology
chief_complaint: Shortness of breath and chronic cough
description: Progressive airflow limitation caused by chronic bronchitis and emphysema, primarily from cigarette smoking. Smoking cessation, bronchodilators, and inhaled corticosteroids reduce exacerbations and slow progression.
icd10: J44.9
urgency: non-urgent

workup:
  - Clinical diagnosis: chronic dyspnea, cough, sputum production in smoker >40 years old with >10 pack-year history
  - Spirometry (required for diagnosis): post-bronchodilator FEV1/FVC <0.70 confirms airflow obstruction
  - GOLD severity staging by FEV1: GOLD 1 (FEV1 ≥80% predicted), GOLD 2 (50-79%), GOLD 3 (30-49%), GOLD 4 (<30%)
  - GOLD ABCD classification: combines symptoms (mMRC or CAT score) and exacerbation history to guide treatment
  - Chest X-ray: hyperinflation, flattened diaphragms, increased AP diameter (barrel chest)
  - Alpha-1 antitrypsin level: if early onset <45 years, minimal smoking history, or lower lobe predominant emphysema
  - Arterial blood gas: if severe COPD or acute exacerbation to assess hypoxemia and hypercapnia
  - 6-minute walk test: assess functional capacity and oxygen desaturation

treatment:
  - Smoking cessation: MOST IMPORTANT intervention, only treatment that slows FEV1 decline
  - Influenza vaccine annually, pneumococcal vaccines (PCV20 or PPSV23)
  - Bronchodilators (all patients with symptoms): LABA (long-acting beta-agonist) and/or LAMA (long-acting muscarinic antagonist)
  - Inhaled corticosteroids (ICS): add if frequent exacerbations (≥2 per year or ≥1 requiring hospitalization) or high eosinophils >300
  - Triple therapy (LABA/LAMA/ICS): for frequent exacerbators, single inhaler improves adherence
  - Common regimens: fluticasone/umeclidinium/vilanterol (Trelegy) once daily, or budesonide/glycopyrrolate/formoterol (Breztri) twice daily
  - SAMA or SABA: albuterol as needed for acute symptoms
  - Supplemental oxygen: if resting PaO2 <55 mmHg or O2 sat <88% (improves survival)
  - Pulmonary rehabilitation: exercise training, education, nutrition - improves symptoms and reduces hospitalizations
  - Roflumilast (PDE4 inhibitor): if severe COPD with chronic bronchitis and frequent exacerbations despite triple therapy
  - Azithromycin prophylaxis 250 mg daily or three times weekly: reduces exacerbations in former smokers with frequent exacerbations
  - Acute exacerbation treatment: systemic corticosteroids (prednisone 40 mg daily x5 days), antibiotics if increased sputum purulence, increased bronchodilators

clinical_pearls:
  - Smoking cessation most important - only treatment that slows FEV1 decline
  - Spirometry required for diagnosis - FEV1/FVC <0.70 post-bronchodilator
  - All symptomatic patients need bronchodilator - LABA and/or LAMA
  - Add ICS if ≥2 exacerbations per year or eosinophils >300
  - Triple therapy (LABA/LAMA/ICS) for frequent exacerbators
  - Supplemental oxygen if PaO2 <55 or O2 sat <88% improves survival
  - Pulmonary rehab improves symptoms and reduces hospitalizations
  - Acute exacerbation: prednisone 40 mg x5 days plus antibiotics if purulent sputum

differentials:
  - Asthma: younger onset, reversible airflow obstruction, atopy, eosinophilia, FEV1/FVC normalizes post-bronchodilator
  - Bronchiectasis: chronic productive cough, recurrent infections, dilated airways on CT
  - Heart failure: orthopnea, paroxysmal nocturnal dyspnea, elevated BNP, pulmonary edema on imaging
  - Interstitial lung disease: restrictive pattern on spirometry, reticular opacities on CT

trace: |
  A 62-year-old man with 45 pack-year smoking history presented with 3 years progressive dyspnea on exertion and chronic productive cough. Spirometry showed FEV1 52% predicted, FEV1/FVC 0.58 post-bronchodilator (GOLD 2 moderate obstruction). mMRC dyspnea score 2, one exacerbation requiring antibiotics in past year. Chest X-ray showed hyperinflation. Diagnosed with COPD GOLD 2 Group B. Counseled extensively on smoking cessation, referred to cessation program. Started fluticasone/umeclidinium/vilanterol (Trelegy) one inhalation daily plus albuterol inhaler as needed. Influenza and pneumococcal vaccines given. Referred to pulmonary rehabilitation. At 3 months quit smoking (most important achievement), dyspnea improved, completed pulmonary rehab. At 12 months FEV1 stable at 54%, no exacerbations. At 2 years remains smoke-free, FEV1 stable, excellent symptom control on triple therapy with significantly improved quality of life.
