tree_id: NEPHRO-ACUTE-KIDNEY-INJURY
name: Acute Kidney Injury
family: Nephrology
specialty: Nephrology
chief_complaint: Elevated creatinine or decreased urine output
description: |
  Abrupt decline in kidney function, defined as increase in serum creatinine by 0.3 mg/dL within 48 hours or increase to 1.5 times baseline, or urine output less than 0.5 mL/kg/hr for 6 hours.
  Classified as prerenal (60-70%), intrinsic renal (25-40%), or postrenal (5-10%). Reversible if identified and treated early.
icd10: N17.9
urgency: High
workup:
  - Review medications - NSAIDs, ACE inhibitors, ARBs, diuretics, aminoglycosides, contrast
  - Volume status assessment - orthostatic vitals, jugular venous pressure, skin turgor, mucous membranes, edema
  - Urinalysis - bland sediment suggests prerenal or postrenal, RBC casts (glomerulonephritis), WBC casts (pyelonephritis, interstitial nephritis), muddy brown casts (acute tubular necrosis), eosinophils (interstitial nephritis)
  - Urine electrolytes and osmolality - calculate fractional excretion of sodium (FENa)
  - FENa less than 1% suggests prerenal (kidneys conserving sodium), greater than 2% suggests intrinsic renal (ATN)
  - FENa unreliable if on diuretics - use fractional excretion of urea (FEUrea less than 35% prerenal)
  - Renal ultrasound - assess for hydronephrosis (obstruction), kidney size (small suggests chronic disease), echogenicity
  - Bladder scan - assess for urinary retention
  - Labs - BUN/Cr ratio (greater than 20:1 prerenal, less than 15:1 intrinsic), electrolytes (hyperkalemia, acidosis), CBC
  - If intrinsic renal suspected - complement levels (C3, C4), ANA, ANCA, anti-GBM, hepatitis serologies, serum and urine protein electrophoresis
  - Kidney biopsy if diagnosis uncertain and glomerulonephritis or interstitial nephritis suspected
treatment:
  - Prerenal AKI - restore renal perfusion
  - Volume depletion - IV fluid resuscitation (normal saline or balanced crystalloids), target euvolemia
  - Cardiorenal syndrome - optimize heart failure management, diuretics
  - Stop nephrotoxic medications - NSAIDs, ACE inhibitors/ARBs (temporarily), aminoglycosides
  - Intrinsic renal AKI - treat underlying cause
  - Acute tubular necrosis (ATN) - supportive care, avoid further insults, volume management, usually recovers in 1-3 weeks
  - Acute interstitial nephritis - stop offending drug, consider corticosteroids if severe (prednisone 1 mg/kg/day x 4-6 weeks)
  - Glomerulonephritis - immunosuppression (steroids, cyclophosphamide, rituximab depending on etiology)
  - Postrenal AKI - relieve obstruction
  - Foley catheter for bladder outlet obstruction (BPH, neurogenic bladder)
  - Nephrostomy tubes or ureteral stents for ureteral obstruction
  - Post-obstructive diuresis common after relief - replace losses to avoid hypovolemia
  - Renal replacement therapy (dialysis) indications - refractory hyperkalemia (K greater than 6.5 with ECG changes), severe metabolic acidosis (pH less than 7.1), volume overload refractory to diuretics, uremic symptoms (pericarditis, encephalopathy), toxic ingestions
  - Monitor electrolytes closely - hyperkalemia (restrict dietary potassium, kayexelate, insulin/glucose), metabolic acidosis (sodium bicarbonate if severe)
  - Adjust medication doses for renal function
clinical_pearls:
  - RIFLE criteria (Risk, Injury, Failure, Loss, ESRD) and KDIGO staging classify AKI severity
  - Contrast-induced nephropathy prevention - adequate hydration before and after contrast, avoid if eGFR less than 30, use iso-osmolar contrast
  - Hepatorenal syndrome - AKI in cirrhosis from splanchnic vasodilation and renal vasoconstriction, treat with albumin and vasoconstrictors (midodrine, octreotide)
  - Rhabdomyolysis causes ATN - CK greater than 5000, myoglobin in urine, treat with aggressive IV hydration
  - Tumor lysis syndrome causes AKI from uric acid nephropathy - prevent with allopurinol or rasburicase, hydration
  - Urine eosinophils suggest acute interstitial nephritis but low sensitivity
differentials:
  - Prerenal azotemia
  - Acute tubular necrosis
  - Acute interstitial nephritis
  - Glomerulonephritis
  - Urinary obstruction
  - Chronic kidney disease
trace:
  - 75-year-old man admitted with pneumonia, baseline Cr 1.1 mg/dL → Day 3, Cr increases to 2.8 mg/dL → Urine output decreased to 20 mL/hr x 6 hours → Exam shows dry mucous membranes, orthostatic hypotension → Review medications - on vancomycin, piperacillin-tazobactam, ibuprofen for pain → Urinalysis shows muddy brown casts → FENa 2.5% → BUN/Cr ratio 12:1 → Renal ultrasound shows no hydronephrosis, normal-sized kidneys → Diagnose acute tubular necrosis (intrinsic AKI) from volume depletion plus nephrotoxins → Stop ibuprofen and vancomycin, switch to cefepime → IV fluid resuscitation with normal saline → Urine output improves → Cr peaks at 3.2 mg/dL on day 5, then gradually improves → Discharge day 10 with Cr 1.5 mg/dL, continues to trend down as outpatient → Returns to baseline Cr 1.1 mg/dL by 3 weeks
