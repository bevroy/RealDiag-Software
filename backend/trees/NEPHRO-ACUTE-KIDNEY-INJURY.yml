tree_id: NEPHRO-ACUTE-KIDNEY-INJURY
name: Acute Kidney Injury
family: Nephrology
specialty: Nephrology
chief_complaint: Elevated creatinine and decreased urine output
description: |
  Rapid decline in kidney function over hours to days. Defined by creatinine increase 0.3 mg/dL within 48 hours or 1.5x baseline within 7 days.
  Classified as prerenal (60%), intrinsic renal (35%), or postrenal (5%). Mortality increases with severity.
icd10: N17.9
urgency: High
workup:
  - Serum creatinine and eGFR to assess severity
  - KDIGO staging - Stage 1 (creatinine 1.5-1.9x baseline), Stage 2 (2-2.9x), Stage 3 (3x or greater than 4 mg/dL)
  - Urinalysis with microscopy (dysmorphic RBCs and casts suggest glomerulonephritis, muddy brown casts suggest ATN)
  - Urine electrolytes - calculate FENa (fractional excretion of sodium) less than 1% suggests prerenal, greater than 2% suggests intrinsic
  - Renal ultrasound to assess for hydronephrosis (postrenal obstruction) and kidney size
  - Complete metabolic panel (hyperkalemia, metabolic acidosis, uremia)
  - Volume status assessment (JVP, orthostatic vitals, skin turgor, mucous membranes)
  - Review medications for nephrotoxins (NSAIDs, aminoglycosides, contrast, ACE inhibitors)
treatment:
  - Prerenal AKI - IV fluid resuscitation with isotonic saline or lactated Ringer's to restore perfusion
  - Postrenal AKI - relieve obstruction (Foley catheter for bladder outlet obstruction, nephrostomy or ureteral stent for ureteral obstruction)
  - Intrinsic renal AKI (ATN) - supportive care, maintain euvolemia, avoid nephrotoxins
  - Discontinue all nephrotoxic medications (NSAIDs, aminoglycosides, contrast agents)
  - Adjust medication doses for renal function
  - Treat hyperkalemia if present (calcium gluconate, insulin with dextrose, sodium polystyrene sulfonate)
  - Correct metabolic acidosis if severe (pH less than 7.2) with sodium bicarbonate
  - Nephrology consultation if unclear etiology, severe AKI (stage 3), or need for dialysis
  - Dialysis indications (AEIOU) - Acidosis refractory, Electrolyte abnormality (hyperkalemia), Intoxication, Overload (volume), Uremia (pericarditis, encephalopathy)
clinical_pearls:
  - Prerenal causes include hypovolemia (bleeding, dehydration), decreased cardiac output (heart failure, shock), renal hypoperfusion (NSAIDs, ACE inhibitors)
  - Intrinsic causes include acute tubular necrosis (ATN from ischemia or nephrotoxins), glomerulonephritis, acute interstitial nephritis
  - Postrenal causes include BPH, kidney stones, malignancy, retroperitoneal fibrosis
  - ATN typically improves over 1-3 weeks once insult removed
  - Contrast-induced nephropathy peaks at 3-5 days, prevented with hydration and limiting contrast volume
  - Rhabdomyolysis causes AKI from myoglobin (check CK, treat with aggressive hydration)
differentials:
  - Chronic kidney disease (small kidneys on ultrasound, anemia, hyperparathyroidism)
  - Prerenal azotemia
  - Acute tubular necrosis
  - Acute interstitial nephritis
  - Glomerulonephritis
  - Urinary tract obstruction
trace:
  - Creatinine increased from 1.0 to 2.8 mg/dL over 48 hours → Urine output decreased to 400 mL in 24 hours → Review medications (recently started ibuprofen) → Assess volume status (dry mucous membranes, orthostatic hypotension) → Urinalysis bland, FENa 0.4% → Diagnose prerenal AKI from hypovolemia and NSAIDs → Stop ibuprofen, IV normal saline 150 mL/hr → Creatinine improves to 1.5 mg/dL by day 3 → Continue hydration, creatinine returns to baseline by day 7
