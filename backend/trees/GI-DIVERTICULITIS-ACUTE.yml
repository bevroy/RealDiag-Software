tree_id: GI-DIVERTICULITIS-ACUTE
name: Acute Diverticulitis
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Left lower quadrant abdominal pain
description: Inflammation or infection of colonic diverticula causing acute abdominal pain. Mild uncomplicated cases treated outpatient with antibiotics or observation, complicated cases require hospitalization and possible surgery.
icd10: K57.32
urgency: urgent

workup:
  - Clinical diagnosis: left lower quadrant pain (classically), fever, leukocytosis in patient with known diverticulosis or age >40
  - CT abdomen/pelvis with IV contrast: gold standard for diagnosis (95% sensitivity), shows colonic wall thickening, pericolonic fat stranding, abscess if present
  - Hinchey classification guides treatment: Stage I (pericolic abscess <5 cm), Stage II (pelvic/retroperitoneal abscess >5 cm), Stage III (purulent peritonitis), Stage IV (fecal peritonitis)
  - Labs: CBC (leukocytosis common), CMP (assess hydration), urinalysis (rule out UTI), blood cultures if febrile
  - Avoid colonoscopy acutely: risk of perforation, defer 6-8 weeks after resolution to rule out colon cancer (colonoscopy within 6-8 weeks in patients >50 or alarm symptoms)
  - Rule out other diagnoses: pregnancy test in women of childbearing age, consider appendicitis if right-sided

treatment:
  - Uncomplicated mild diverticulitis (no abscess, able to tolerate PO): outpatient management with clear liquid diet advancing as tolerated
  - Antibiotics historically standard but recent evidence shows selective use: consider observation without antibiotics if immunocompetent and no systemic signs
  - If antibiotics given: amoxicillin-clavulanate 875/125 mg BID or ciprofloxacin 500 mg BID plus metronidazole 500 mg TID x7-10 days (cover gram-negative and anaerobes)
  - Admit if unable to tolerate PO, severe pain, significant comorbidities, immunosuppressed, or complicated disease
  - Inpatient IV antibiotics: ceftriaxone 1 g daily plus metronidazole 500 mg TID, or piperacillin-tazobactam 3.375 g every 6 hours, or ciprofloxacin plus metronidazole
  - Small abscess <5 cm (Hinchey I): antibiotics alone usually sufficient
  - Large abscess >5 cm (Hinchey II): percutaneous drainage plus antibiotics
  - Purulent or fecal peritonitis (Hinchey III-IV): emergent surgery (washout, colostomy)
  - Elective sigmoid colectomy: consider after resolution if recurrent diverticulitis (≥2 episodes), young age <50, immunosuppressed, or complicated episode
  - Prevention after resolution: high-fiber diet, avoid constipation, maintain hydration (no evidence avoiding nuts/seeds prevents recurrence)

clinical_pearls:
  - LLQ pain, fever, leukocytosis in patient >40 years classic presentation
  - CT abdomen/pelvis with contrast diagnostic (95% sensitivity)
  - Uncomplicated mild cases can be managed outpatient, observation without antibiotics reasonable if immunocompetent
  - If antibiotics: amoxicillin-clavulanate or cipro/flagyl x7-10 days
  - Large abscess >5 cm needs percutaneous drainage
  - Peritonitis (Hinchey III-IV) requires emergent surgery
  - Colonoscopy 6-8 weeks after resolution to rule out colon cancer
  - Elective colectomy if recurrent episodes or complicated disease

differentials:
  - Appendicitis: right lower quadrant pain (but retrocecal appendix or long appendix can cause left-sided pain)
  - Colon cancer: weight loss, change in bowel habits, rectal bleeding, colonoscopy diagnostic
  - Inflammatory bowel disease: chronic diarrhea, extraintestinal manifestations, colonoscopy shows continuous inflammation
  - Pelvic inflammatory disease: bilateral lower abdominal pain, cervical motion tenderness, vaginal discharge

trace: |
  A 58-year-old woman with known diverticulosis (prior colonoscopy 2 years ago) presented to ED with 2 days of left lower quadrant abdominal pain, fever to 100.8°F, nausea, and constipation. Exam showed LLQ tenderness without rebound or guarding. Labs showed WBC 14,200 (leukocytosis). CT abdomen/pelvis with contrast showed sigmoid diverticulitis with pericolonic fat stranding and colonic wall thickening, no abscess (uncomplicated Hinchey 0). Tolerating clear liquids. Diagnosed with acute uncomplicated diverticulitis. Discharged home on clear liquid diet with instructions to advance diet as tolerated, ciprofloxacin 500 mg BID plus metronidazole 500 mg TID x10 days. Close outpatient follow-up arranged. At 3 days symptoms improving, advanced to low-residue diet. At 10 days completed antibiotics, pain resolved, tolerating regular diet. At 8 weeks repeat colonoscopy showed multiple sigmoid diverticula, no masses or strictures (ruled out cancer). Counseled on high-fiber diet and hydration to prevent recurrence. Remains asymptomatic at 12 months.
