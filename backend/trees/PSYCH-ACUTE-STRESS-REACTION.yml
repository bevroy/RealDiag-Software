tree_id: PSYCH-ACUTE-STRESS-REACTION
name: Acute Stress Reaction
family: psychiatry
specialty: Psychiatry/Emergency Medicine
icd10: F43.0
snomed: 129104009
urgency: []
homeopathy: []
presentations:
  - Exposure to actual or threatened death, serious injury, or sexual violence
  - Occurs immediately or within hours of traumatic event
  - Intrusion symptoms (recurrent memories, nightmares, flashbacks, psychological distress)
  - Negative mood (inability to experience positive emotions, dissociative symptoms)
  - Arousal symptoms (sleep disturbance, irritability, hypervigilance, concentration problems, exaggerated startle)
  - Avoidance of stimuli related to trauma
  - Duration: 3 days to 1 month after trauma exposure
  - Dissociative symptoms common (feeling dazed, altered sense of reality, depersonalization, derealization)
  - Significant distress or functional impairment
workup:
  - Clinical assessment based on DSM-5-TR criteria for Acute Stress Disorder
  - Detailed trauma history
  - Type of traumatic event
  - Timing (must be within 1 month of trauma)
  - Previous trauma history
  - Symptom assessment
  - Intrusion symptoms (at least 1): memories, nightmares, flashbacks, distress with reminders
  - Negative mood (at least 1): inability to experience positive emotions
  - Dissociative symptoms (at least 3): altered sense of reality, depersonalization, derealization, dissociative amnesia, numbing
  - Avoidance symptoms (at least 1): avoid memories, thoughts, or external reminders
  - Arousal symptoms (at least 1): sleep disturbance, irritability, hypervigilance, concentration, exaggerated startle
  - Mental status examination
  - Assess level of distress and functioning
  - Safety assessment (suicidal/homicidal ideation)
  - Screen for substance use as coping mechanism
  - Assess for acute medical needs from trauma
  - Rule out traumatic brain injury, medical injuries
  - Consider toxicology if substance involvement
  - Distinguish from other conditions
  - Normal acute stress response (resolves quickly, less severe)
  - PTSD (duration greater than 1 month after trauma)
  - Adjustment disorder (stressor not traumatic in nature)
treatment:
  - Psychological first aid (immediate intervention)
  - Ensure safety and basic needs met
  - Provide calm, supportive presence
  - Psychoeducation about normal stress reactions
  - Facilitate connection to social supports
  - Avoid forced debriefing (Critical Incident Stress Debriefing NOT recommended)
  - Trauma-focused psychotherapy (evidence-based, start early)
  - Trauma-focused Cognitive Behavioral Therapy (TF-CBT)
  - Most effective intervention, reduces PTSD development by 50-70%
  - 4-5 sessions often sufficient
  - Cognitive Processing Therapy (CPT)
  - Eye Movement Desensitization and Reprocessing (EMDR)
  - Pharmacotherapy (generally NOT first-line, limited evidence)
  - Consider for severe insomnia or agitation interfering with functioning
  - Short-term sedatives (2-7 days maximum)
  - Trazodone 25-100 mg at bedtime for sleep
  - Prazosin 1-5 mg at bedtime for nightmares
  - Avoid benzodiazepines (may interfere with trauma processing, increase PTSD risk)
  - SSRIs NOT effective in acute phase (evidence for PTSD prevention lacking)
  - Supportive interventions
  - Normalize reactions ("these are normal responses to abnormal events")
  - Encourage gradual return to routine activities
  - Mobilize social support
  - Sleep hygiene and self-care
  - Limit media exposure to trauma reminders
  - Follow-up critical
  - Monitor for PTSD development (30-50% of ASD develops into PTSD)
  - Reassess at 1 month post-trauma
clinical_pearls:
  - "Acute Stress Disorder affects 20-50% of trauma survivors in first month"
  - "30-50% of those with ASD go on to develop PTSD if untreated"
  - "Early trauma-focused CBT reduces PTSD risk by 50-70% - most effective intervention"
  - "Dissociative symptoms (depersonalization, derealization, amnesia) associated with higher PTSD risk"
  - "Critical Incident Stress Debriefing (CISD) NOT recommended - may worsen outcomes"
  - "Benzodiazepines NOT recommended - interfere with trauma processing, may increase PTSD risk"
  - "Distinguish ASD (3 days to 1 month) from PTSD (greater than 1 month) - treatment similar"
  - "Most trauma survivors recover without developing PTSD - avoid over-pathologizing normal reactions"
referrals:
  - Mental health provider for trauma-focused therapy (CBT, CPT, EMDR)
  - Psychiatry if severe symptoms, suicidality, or complex presentation
  - Emergency evaluation if safety concerns or severe psychiatric symptoms
  - Follow-up at 1 month to assess for PTSD development
differentials:
  - Acute Stress Disorder (3 days to 1 month after trauma, specific symptom clusters)
  - Post-Traumatic Stress Disorder (symptoms persist greater than 1 month)
  - Acute stress reaction/crisis (immediate response, less severe, resolves quickly)
  - Adjustment disorder (stressor not traumatic in nature, different symptom pattern)
  - Panic disorder (panic attacks not triggered by trauma reminders)
  - Major depressive disorder (may follow trauma, different symptom focus)
  - Substance withdrawal (agitation, autonomic symptoms)
  - Traumatic brain injury (cognitive symptoms, history of head trauma)
  - Dissociative disorders (chronic dissociative symptoms)
trace:
  source: DSM-5-TR Criteria, APA Clinical Practice Guideline for PTSD, International Society for Traumatic Stress Studies Guidelines
  version: '1.0'
