tree_id: GI-HEMORRHOIDS
name: Hemorrhoids
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Rectal bleeding and anal discomfort
description: Swollen vascular cushions in anal canal causing bleeding, pain, and prolapse. Conservative management with fiber supplementation and stool softeners effective for most cases, procedural interventions for persistent symptoms.
icd10: K64.9
snomed: 90458008
presentations:
  - Rectal bleeding (bright red, on tissue or in toilet)
  - Anal discomfort, itching
  - Palpable anal mass (external hemorrhoids)
  - Pain with bowel movements
  - Prolapse with defecation
urgency: routine

referrals:
  emergency:
    - GI bleeding with instability
    - Acute liver failure
    - Perforated viscus
    - Cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting
  routine:
    - IBS management
    - GERD treatment
    - Screening colonoscopy

workup:
  - Clinical diagnosis: painless bright red blood per rectum on toilet paper or coating stool, anal discomfort, sensation of fullness
  - Internal hemorrhoids: above dentate line (painless - no somatic innervation), present with bleeding and prolapse
  - Grade I: bleeding, no prolapse
  - Grade II: prolapse with defecation, spontaneous reduction
  - Grade III: prolapse with defecation, requires manual reduction
  - Grade IV: irreducible prolapse
  - External hemorrhoids: below dentate line (painful - somatic innervation), covered by skin, present with pain and thrombosis
  - Thrombosed external hemorrhoid: acute severe pain, tender firm bluish lump at anal verge
  - Physical exam: visual inspection and digital rectal exam, anoscopy to visualize internal hemorrhoids
  - Rule out other causes of rectal bleeding: anoscopy or flexible sigmoidoscopy if age above 40, alarm features (weight loss, anemia, family history colon cancer)
  - Colonoscopy: if age-appropriate screening due, recurrent bleeding, anemia, change in bowel habits
  - Risk factors: chronic constipation and straining, prolonged sitting on toilet, pregnancy, obesity, low-fiber diet, chronic diarrhea

treatment:
  - Conservative management (first-line): effective for Grade I-II internal hemorrhoids and external hemorrhoids
  - High-fiber diet: 25-35 grams daily (most important), psyllium (Metamucil) 1 tablespoon BID or methylcellulose
  - Stool softeners: docusate sodium 100-200 mg BID (prevents straining)
  - Adequate hydration: 8 glasses water daily
  - Avoid straining: do not strain or sit on toilet for prolonged periods
  - Sitz baths: warm water 10-15 minutes TID and after bowel movements (reduces pain and spasm)
  - Topical treatments: hydrocortisone 1% cream or suppository QID x1 week, witch hazel pads (Tucks), lidocaine 5% ointment for pain
  - Thrombosed external hemorrhoid (acute): excision within 72 hours of onset if severe pain (provides immediate relief)
  - After 72 hours: conservative management (pain resolves in 7-10 days as clot resorbs)
  - Office procedures for Grade I-III internal hemorrhoids if conservative fails:
  - Rubber band ligation (most common): band placed at base of hemorrhoid, falls off in 5-7 days, success rate 70-80%
  - Infrared coagulation: heat destroys hemorrhoid tissue
  - Sclerotherapy: injection sclerosing agent causes fibrosis
  - Surgical hemorrhoidectomy: for Grade IV, large external hemorrhoids, failed office procedures
  - Excision of hemorrhoid tissue, definitive treatment, success rate 95% but painful recovery 2-4 weeks
  - Complications: bleeding (most common), pain, urinary retention, infection

clinical_pearls:
  - Painless bright red blood per rectum on toilet paper highly suggestive
  - Internal hemorrhoids painless (above dentate line), external painful (below dentate line)
  - High-fiber diet and stool softeners prevent straining - most important treatment
  - Thrombosed external hemorrhoid: excise within 72 hours if severe pain
  - Rubber band ligation effective for Grade I-III internal hemorrhoids
  - Colonoscopy if age above 40 or alarm features to rule out other causes bleeding
  - Avoid prolonged sitting on toilet
  - Most respond to conservative management

differentials:
  - Anal fissure: severe sharp pain with defecation (vs painless bleeding in internal hemorrhoids), visible tear in anal canal
  - Colorectal cancer: painless rectal bleeding, change in bowel habits, weight loss, iron-deficiency anemia, colonoscopy diagnostic
  - Inflammatory bowel disease: bloody diarrhea, abdominal pain, weight loss, colonoscopy shows inflammation
  - Rectal prolapse: full-thickness protrusion of rectum (vs hemorrhoid), concentric rings

trace: |
  A 45-year-old man presented with 3 months of intermittent bright red blood per rectum noted on toilet paper after bowel movements. No pain with defecation. Chronic constipation, strains with bowel movements. No weight loss, no abdominal pain. Digital rectal exam normal, no masses. Anoscopy showed Grade II internal hemorrhoids at 3 and 7 o'clock positions with minor bleeding. No external hemorrhoids. Diagnosed with internal hemorrhoids Grade II. Started conservative management: psyllium fiber supplement (Metamucil) 1 tablespoon BID to soften stool and increase bulk. Docusate sodium 100 mg BID stool softener. Counseled on bowel habits: do not strain, avoid prolonged sitting on toilet (maximum 5 minutes), respond to urge promptly. Sitz baths warm water 10-15 minutes after bowel movements. Hydrocortisone 2.5% suppository nightly x1 week. At 4 weeks bleeding episodes reduced by 70%, softer stools, less straining. At 8 weeks bleeding resolved completely. Continues high-fiber diet and adequate hydration. At 6 months no recurrent bleeding. Recommended colonoscopy given age 45 (colorectal cancer screening) - colonoscopy normal except for internal hemorrhoids, no polyps or masses. Continues fiber supplementation and good bowel habits to prevent recurrence.

