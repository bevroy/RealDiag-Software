tree_id: ENDO-HYPERTHYROIDISM
name: Hyperthyroidism
family: Endocrinology
specialty: Endocrinology
chief_complaint: Palpitations, weight loss, and tremor
description: |
  Excess thyroid hormone production. Most common cause is Graves disease (autoimmune, 70-80%).
  Other causes include toxic multinodular goiter, toxic adenoma, thyroiditis. Affects 1% of population, more common in women.
icd10: E05.90
urgency: Moderate
workup:
  - TSH (suppressed, <0.1 mIU/L diagnostic)
  - Free T4 and free T3 (elevated in overt hyperthyroidism, normal T4 with elevated T3 suggests T3 toxicosis)
  - TSH receptor antibodies (TRAb) positive in Graves disease (95% sensitivity)
  - Thyroid-stimulating immunoglobulin (TSI) also positive in Graves disease
  - Radioactive iodine uptake scan (RAIU) distinguishes causes - high uptake (Graves, toxic nodular goiter), low uptake (thyroiditis, exogenous thyroid hormone)
  - Thyroid ultrasound if palpable nodule or multinodular goiter
  - Complete blood count (watch for agranulocytosis with thionamides)
  - Comprehensive metabolic panel, liver enzymes baseline
treatment:
  - Methimazole 10-40mg daily (first-line thionamide, blocks thyroid hormone synthesis)
  - Propylthiouronol (PTU) 50-150mg TID alternative (preferred in first trimester pregnancy, thyroid storm)
  - Beta-blocker for symptomatic relief - propranolol 20-40mg TID or atenolol 25-100mg daily (controls palpitations, tremor, anxiety)
  - Definitive treatment options after achieving euthyroid state with medication
  - Radioactive iodine ablation (RAI) most common definitive treatment in US (causes hypothyroidism requiring lifelong levothyroxine)
  - Thyroidectomy if large goiter, pregnancy planned within 6 months, ophthalmopathy, or patient preference
  - Graves ophthalmopathy - selenium supplementation, avoid RAI (can worsen eye disease), consider orbital decompression if severe
  - Monitor CBC for agranulocytosis (rare but serious complication of thionamides)
clinical_pearls:
  - Classic symptoms include weight loss despite increased appetite, heat intolerance, sweating, palpitations, tremor, anxiety, diarrhea, menstrual irregularities
  - Graves disease specific findings - diffuse goiter, ophthalmopathy (exophthalmos, lid lag, lid retraction), pretibial myxedema
  - Thyroid storm (life-threatening) - fever, severe tachycardia, altered mental status, treat with PTU, propranolol, iodine, steroids, supportive care
  - Methimazole preferred over PTU (once daily dosing, less hepatotoxicity), but PTU preferred in first trimester and thyroid storm
  - Agranulocytosis occurs in 0.3% on thionamides (check CBC if fever or sore throat develops)
  - Subclinical hyperthyroidism (low TSH, normal T3/T4) - treat if TSH <0.1, age >65, cardiac disease, or osteoporosis
differentials:
  - Graves disease
  - Toxic multinodular goiter
  - Toxic adenoma
  - Thyroiditis (subacute, postpartum, silent)
  - Exogenous thyroid hormone
  - Pituitary adenoma (TSH-secreting, rare)
trace:
  - Palpitations, weight loss 15 lbs, tremor, heat intolerance x 3 months → TSH <0.01 mIU/L, free T4 elevated 3.5 ng/dL → TSH receptor antibodies positive → Diagnose Graves disease → Start methimazole 20mg daily plus propranolol 40mg TID → Recheck thyroid function in 4-6 weeks → Euthyroid achieved, continue methimazole 12-18 months → Consider definitive treatment with RAI → Discuss options with patient
