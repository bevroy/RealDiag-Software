tree_id: ENDO-HYPERTHYROIDISM
name: Hyperthyroidism
family: endocrine
specialty: Endocrinology
chief_complaint: Heat intolerance, weight loss, palpitations, tremor
description: Excessive thyroid hormone production causing hypermetabolic state
icd10: E05.90
urgency: routine
workup:
  - TSH (suppressed less than 0.1 mIU/L)
  - Free T4 (elevated greater than 1.7 ng/dL) and Free T3 (elevated greater than 4.4 pg/mL)
  - Thyroid-stimulating immunoglobulin (TSI) if Graves disease suspected
  - Radioactive iodine uptake (RAIU) scan to differentiate causes
  - Thyroid ultrasound if nodular disease suspected
  - ECG (may show atrial fibrillation, sinus tachycardia)
  - Complete blood count (CBC) - monitor for agranulocytosis with antithyroid drugs
  - Liver function tests before starting antithyroid medications
  - Thyroid peroxidase antibody (TPOAb) if autoimmune suspected
  - Thyroid receptor antibody (TRAb) for Graves disease
treatment:
  - Methimazole 10-40 mg daily (first-line antithyroid drug, fewer side effects than PTU)
  - Propylthiouracil (PTU) 100-200 mg TID (preferred in first trimester pregnancy, thyroid storm)
  - Radioactive iodine-131 (RAI) ablation for definitive treatment (contraindicated in pregnancy)
  - Thyroidectomy for large goiters, compression symptoms, pregnancy planning, or malignancy concern
  - Beta-blockers for symptom control - propranolol 10-40 mg QID or atenolol 25-100 mg daily
  - Treat underlying cause (stop amiodarone if drug-induced, manage TSH-secreting adenoma)
  - Monitor TSH and free T4 every 4-6 weeks initially, then every 3-6 months when stable
  - Calcium and vitamin D supplementation (increased bone resorption)
  - Ophthalmology referral for Graves ophthalmopathy (proptosis, diplopia)
  - Selenium supplementation 200 mcg daily may help mild Graves eye disease
clinical_pearls:
  - Graves disease (autoimmune) accounts for 60-80% of hyperthyroidism cases
  - Elderly patients may present with apathetic hyperthyroidism (weight loss, depression, AF without classic symptoms)
  - Thyroid storm is life-threatening emergency - fever over 104F, severe tachycardia, altered mental status
  - Subclinical hyperthyroidism (low TSH, normal T4/T3) increases risk of atrial fibrillation and osteoporosis
  - Postpartum thyroiditis causes transient hyperthyroid phase followed by hypothyroid phase
  - Amiodarone can cause hyperthyroidism (type 1 iodine-induced, type 2 destructive thyroiditis)
  - PTU preferred over methimazole in thyroid storm (blocks peripheral T4 to T3 conversion)
  - Agranulocytosis is rare (0.2-0.5%) but serious side effect of antithyroid drugs - check CBC if fever/sore throat
  - After RAI ablation, most patients become hypothyroid requiring lifelong levothyroxine
  - Graves ophthalmopathy may worsen after RAI treatment - consider corticosteroids
differentials:
  - Graves disease
  - Toxic multinodular goiter
  - Toxic adenoma (solitary hot nodule)
  - Subacute thyroiditis (painful thyroid, elevated ESR)
  - Postpartum thyroiditis
  - Drug-induced (amiodarone, lithium, interferon)
  - Factitious thyrotoxicosis (exogenous thyroid hormone)
  - TSH-secreting pituitary adenoma (elevated TSH)
  - Struma ovarii (ectopic thyroid tissue in ovarian teratoma)
trace:
  - 45-year-old woman with 3-month history of 15-pound weight loss despite increased appetite
  - Heat intolerance, palpitations, tremor, anxiety, frequent bowel movements
  - Physical exam - heart rate 110 bpm regular, fine tremor, warm moist skin, diffuse thyroid enlargement, lid lag
  - Labs - TSH less than 0.01 mIU/L (suppressed), free T4 2.8 ng/dL (elevated), free T3 8.2 pg/mL (elevated)
  - TSI positive 3.5 IU/L (elevated, confirms Graves disease)
  - RAIU scan - diffusely increased uptake 45% at 24 hours (normal 10-30%)
  - ECG - sinus tachycardia, no atrial fibrillation
  - Started methimazole 20 mg daily and propranolol 20 mg TID for symptom control
  - Ophthalmology evaluation - mild proptosis, no diplopia or vision changes
  - Follow-up at 6 weeks - improved symptoms, TSH still suppressed, free T4 1.5 ng/dL
  - Methimazole continued at 10 mg daily maintenance dose
  - Plan for definitive treatment with RAI ablation after 6-12 months of medical management
  - Patient counseled on need for lifelong thyroid hormone replacement after ablation
  - Outcome - Achieved euthyroid state on methimazole 10 mg daily, proceeding with RAI ablation
