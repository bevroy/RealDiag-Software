urgency: medium
description: Comprehensive evaluation and management of Systemic Sclerosis (Scleroderma)
version: '1.0'
citations:
  - ACR (American College of Rheumatology) Clinical Practice Guidelines
  - EULAR (European League Against Rheumatism) Recommendations
  - UpToDate - Rheumatology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Skin thickening and tightening
- Raynaud's phenomenon
- Dysphagia
- GERD
- Pulmonary fibrosis
- Digital ulcers
workup:
- 'Anti-Scl-70 (anti-topoisomerase I): 30% positive, specific for diffuse cutaneous
  SSc, predicts pulmonary fibrosis'
- 'Anti-centromere antibodies: 50% positive in limited cutaneous SSc (CREST), lower
  risk of organ involvement'
- 'ANA: Positive in 95%, speckled or nucleolar pattern'
- 'PFTs: Restrictive pattern (low FVC, low DLCO) - monitor annually for interstitial
  lung disease'
- 'Echo: Screen for pulmonary hypertension (estimated RVSP >40 mmHg)'
- 'Barium swallow: Esophageal dysmotility, dilated atonic esophagus'
treatment:
- 'Guideline-based treatment options for Systemic Sclerosis (Scleroderma) include:'
- 'Raynaud''s: Calcium channel blockers (nifedipine XL 30-90mg daily or amlodipine
  5-10mg daily), avoid cold, stop smoking (ACR 2023)'
- 'GERD/dysphagia: PPI (omeprazole 40mg daily), prokinetics, small frequent meals
  (ACR 2023)'
- 'Pulmonary fibrosis: Immunosuppression (mycophenolate 2-3g daily or cyclophosphamide),
  monitor with PFTs annually (ACR 2023)'
- 'Pulmonary hypertension: Screen with echo annually, treat with endothelin receptor
  antagonists (bosentan), PDE5 inhibitors (sildenafil) (ACR 2023)'
- 'Scleroderma renal crisis: ACE inhibitor (captopril 6.25-25mg TID, titrate rapidly)
  - started even if normotensive, dialysis if needed (ACR 2023)'
clinical_pearls:
- Autoimmune fibrotic disease - excess collagen deposition in skin and organs, female
  4:1
- 'Limited cutaneous (lcSSc, CREST): Skin involvement distal to elbows/knees, better
  prognosis. Calcinosis, Raynaud''s, Esophageal dysmotility, Sclerodactyly, Telangiectasias'
- 'Diffuse cutaneous (dcSSc): Skin involvement proximal to elbows/knees + trunk, worse
  prognosis, rapid progression, renal crisis risk'
- 'Raynaud''s phenomenon: Triphasic color change (white → blue → red) with cold/stress
  - present in 95% of scleroderma'
- 'Scleroderma renal crisis: Malignant hypertension, acute kidney injury, microangiopathic
  hemolytic anemia - EMERGENCY, treat with ACE inhibitor'
referrals:
- Rheumatology for all scleroderma - requires organ monitoring and immunosuppression
- Pulmonology for interstitial lung disease or pulmonary hypertension
- Nephrology urgently if scleroderma renal crisis (malignant HTN, AKI)
differentials:
  - CREST syndrome
  - Mixed connective tissue disease
  - Eosinophilic fasciitis
