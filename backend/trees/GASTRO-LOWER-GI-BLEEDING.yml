tree_id: GASTRO-LOWER-GI-BLEEDING
name: Lower Gastrointestinal Bleeding
family: gastroenterology
specialty: Gastroenterology, Emergency Medicine
chief_complaint: Rectal bleeding, blood in stool
description: |
  Bleeding from a source distal to the ligament of Treitz. Hematochezia (bright red blood per rectum) is the hallmark.
  Most common causes: diverticulosis (30-40%), hemorrhoids/anal fissures (20%), inflammatory bowel disease, colorectal cancer, angiodysplasia.
icd10: K92.1
snomed: "37372002"
presentations:
  - Hematochezia (bright red or maroon blood per rectum)
  - Clots in stool
  - Dizziness, lightheadedness (if significant blood loss)
  - Tachycardia, hypotension (if hemodynamically significant)
  - Abdominal pain or cramping
  - Diarrhea or change in bowel habits
  - Weight loss (if malignancy)
urgency: High
referrals:
  emergency:
    - Hemodynamic instability (hypotension, tachycardia, syncope)
    - Large volume bleeding
    - Signs of shock
  urgent:
    - Moderate bleeding with stable vital signs
    - Recurrent bleeding
    - Age >60 with new onset bleeding
  gastroenterology:
    - Colonoscopy for diagnosis and possible treatment
    - All cases of lower GI bleeding
workup:
  - History: timing, volume, color of blood, associated symptoms, prior episodes, medications (NSAIDs, anticoagulants), comorbidities
  - Physical exam: vital signs for hemodynamic stability, abdominal exam, rectal exam with visual inspection and digital exam
  - Labs: CBC (hemoglobin, platelet count), BMP (renal function), coagulation studies (PT/INR, PTT), type and cross if severe
  - Nasogastric lavage if concern for upper GI source (10-15% of apparent lower GI bleeds are from upper GI)
  - Colonoscopy: diagnostic and therapeutic (gold standard), should be done within 24 hours after resuscitation
  - CT angiography: if active bleeding suspected (detects bleeding >0.3 mL/min), can localize source before intervention
  - Tagged RBC scan: for slower or intermittent bleeding (detects >0.1 mL/min), less commonly used now
  - Angiography with embolization: for ongoing bleeding not controlled by colonoscopy
treatment:
  - Resuscitation: two large-bore IVs, crystalloid fluids, blood transfusion if Hgb <7 g/dL (or <8-9 if cardiac disease)
  - NPO until source identified and bleeding controlled
  - Discontinue anticoagulants if possible (consider reversal if severe bleeding)
  - Hold antiplatelet agents
  - Correct coagulopathy: vitamin K for elevated INR, platelets if thrombocytopenia
  - Colonoscopy with hemostasis: cautery, clips, injection therapy for bleeding lesions
  - Angiography with embolization if colonoscopy fails or unavailable
  - Surgery: reserved for massive uncontrolled bleeding or failed endoscopic/angiographic therapy
  - Specific treatment based on source:
    - Diverticular bleeding: usually self-limited, colonoscopic hemostasis if active
    - Hemorrhoids/fissures: conservative management, topical therapy, may need surgical intervention
    - IBD: medical management of underlying disease
    - Angiodysplasia: endoscopic ablation
    - Colorectal cancer: surgical resection
clinical_pearls:
  - 80% of lower GI bleeds stop spontaneously
  - Diverticulosis is the most common cause in adults >60 years
  - Bright red blood usually indicates lower GI source, but brisk upper GI bleed can present with hematochezia
  - Hemorrhoids are common but consider other sources in patients >40, weight loss, or anemia
  - Early colonoscopy (within 24 hours) improves diagnostic yield and outcomes
  - Aspirin and anticoagulants increase bleeding risk but are not usually the primary cause
differentials:
  - Upper GI bleeding presenting as hematochezia
  - Hemorrhoids or anal fissure
  - Diverticular bleeding
  - Colorectal cancer or polyps
  - Inflammatory bowel disease (Crohn's, ulcerative colitis)
  - Angiodysplasia
  - Ischemic colitis
  - Infectious colitis
  - Radiation proctitis
  - Meckel's diverticulum (young patients)
trace:
  - 65-year-old presents with large volume bright red blood per rectum. Check vital signs BP 90/60, HR 110. Two large-bore IVs, crystalloid resuscitation. Labs Hgb 8.5, type and cross. Transfuse 2 units PRBCs. Hemodynamically stabilizes. Colonoscopy within 24 hours reveals bleeding diverticulum. Endoscopic clipping achieves hemostasis. Bleeding resolves. High fiber diet and avoid NSAIDs.
citations:
  - American College of Gastroenterology Guidelines on Lower GI Bleeding
  - American Society for Gastrointestinal Endoscopy Guidelines
  - UpToDate - Gastroenterology
