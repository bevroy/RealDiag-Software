tree_id: RENAL-UTI
name: Urinary Tract Infection Evaluation
family: UROLOGY
specialty: Urology/Primary Care/Internal Medicine
chief_complaint: Urinary Symptoms
description: Diagnostic decision tree for urinary tract infection evaluation
version: "1.0"
icd10: N39.0
author: RealDiag Team
entry_point: presentation

nodes:
  - id: presentation
    type: question
    text: "Clinical presentation?"
    options:
      - label: "Fever, flank pain, CVA tenderness"
        next: pyelonephritis_suspected
      - label: "Dysuria, frequency, urgency, suprapubic pain"
        next: cystitis_suspected
      - label: "Asymptomatic bacteriuria (screening)"
        next: asymptomatic_screening
      - label: "Recurrent UTI (≥2 in 6 months or ≥3 in 12 months)"
        next: recurrent_uti

  - id: pyelonephritis_suspected
    type: question
    text: "Severity assessment?"
    options:
      - label: "Septic (hypotension, altered mental status)"
        next: urosepsis
      - label: "Severe (unable to tolerate PO, dehydrated)"
        next: severe_pyelonephritis
      - label: "Uncomplicated (tolerating PO, stable)"
        next: uncomplicated_pyelonephritis
      - label: "Urologic obstruction suspected"
        next: complicated_pyelonephritis

  - id: urosepsis
    type: diagnosis
    diagnosis: Urosepsis
    icd10: A41.9
    urgency: critical
    workup:
      - Blood cultures (before antibiotics)
      - CBC, BMP, lactate
      - Urinalysis, urine culture
      - CT abdomen/pelvis with contrast
      - Rule out obstruction
    treatment:
      - Broad-spectrum IV antibiotics (ceftriaxone 1-2g + gentamicin 5mg/kg or piperacillin-tazobactam 4.5g)
      - Aggressive IV fluids
      - Vasopressors if needed
      - ICU admission
      - Urology consult if obstruction
      - Source control (drain abscess/obstruction)

  - id: severe_pyelonephritis
    type: diagnosis
    diagnosis: Severe Pyelonephritis
    icd10: N10
    urgency: high
    workup:
      - Urinalysis, urine culture
      - Blood cultures
      - CBC, BMP, creatinine
      - CT abdomen/pelvis if not improving
    treatment:
      - Hospital admission
      - IV ceftriaxone 1g daily or fluoroquinolone
      - IV fluids
      - Antiemetics
      - Transition to PO when tolerating
      - Total 7-14 days therapy

  - id: uncomplicated_pyelonephritis
    type: diagnosis
    diagnosis: Uncomplicated Pyelonephritis
    icd10: N10
    urgency: medium
    workup:
      - Urinalysis, urine culture
      - CBC, BMP if indicated
    treatment:
      - Outpatient oral therapy
      - Ciprofloxacin 500mg BID x 7 days OR
      - Levofloxacin 750mg daily x 5 days OR
      - Ceftriaxone 1g IM x 1 + PO antibiotic
      - Follow-up in 48-72 hours
      - Admit if not improving

  - id: complicated_pyelonephritis
    type: diagnosis
    diagnosis: Complicated Pyelonephritis with Obstruction
    icd10: N13.6
    urgency: critical
    workup:
      - Stat CT abdomen/pelvis with contrast
      - Blood cultures
      - Urinalysis, urine culture
      - CBC, BMP
    treatment:
      - Emergent urology consult
      - IV broad-spectrum antibiotics
      - Percutaneous nephrostomy or ureteral stent
      - Hospital admission
      - Drain abscess if present

  - id: cystitis_suspected
    type: question
    text: "Patient characteristics?"
    options:
      - label: "Healthy non-pregnant woman"
        next: uncomplicated_cystitis
      - label: "Pregnant"
        next: cystitis_pregnancy
      - label: "Male"
        next: cystitis_male
      - label: "Complicated (diabetes, immunosuppression, recent procedure)"
        next: complicated_cystitis
      - label: "Catheter-associated"
        next: catheter_uti

  - id: uncomplicated_cystitis
    type: diagnosis
    diagnosis: Uncomplicated Cystitis
    icd10: N30.00
    urgency: low
    workup:
      - Urinalysis (dipstick sufficient)
      - Urine culture if treatment failure
    treatment:
      - Nitrofurantoin 100mg BID x 5 days OR
      - Trimethoprim-sulfamethoxazole DS BID x 3 days OR
      - Fosfomycin 3g single dose
      - Avoid fluoroquinolones (first-line)
      - Phenazopyridine PRN for dysuria
      - Increase fluids

  - id: cystitis_pregnancy
    type: diagnosis
    diagnosis: Cystitis in Pregnancy
    icd10: O23.4
    urgency: medium
    workup:
      - Urinalysis
      - Urine culture (mandatory)
      - Test of cure after treatment
    treatment:
      - Nitrofurantoin 100mg BID x 5-7 days (avoid term) OR
      - Cephalexin 500mg QID x 5-7 days OR
      - Amoxicillin-clavulanate 875mg BID x 5-7 days
      - Test of cure in 1-2 weeks
      - OB follow-up

  - id: cystitis_male
    type: diagnosis
    diagnosis: Cystitis in Male
    icd10: N30.00
    urgency: medium
    workup:
      - Urinalysis
      - Urine culture
      - Consider prostatitis if febrile
      - Consider STI screening if <35 years
    treatment:
      - Longer duration (7 days)
      - Fluoroquinolone OR TMP-SMX
      - Evaluate for structural abnormality if recurrent
      - Urology referral if recurrent

  - id: complicated_cystitis
    type: diagnosis
    diagnosis: Complicated Cystitis
    icd10: N30.00
    urgency: medium
    workup:
      - Urinalysis
      - Urine culture (mandatory)
      - Consider imaging if not improving
    treatment:
      - Longer therapy (7-14 days)
      - Fluoroquinolone OR TMP-SMX OR cephalosporin
      - Adjust based on culture
      - Treat underlying condition

  - id: catheter_uti
    type: question
    text: "Catheter status?"
    options:
      - label: "Symptomatic (fever, dysuria, suprapubic pain)"
        next: catheter_symptomatic
      - label: "Asymptomatic bacteriuria"
        next: catheter_asymptomatic

  - id: catheter_symptomatic
    type: diagnosis
    diagnosis: Catheter-Associated UTI
    icd10: T83.511A
    urgency: medium
    workup:
      - Remove or replace catheter
      - Urinalysis and culture from new catheter
      - Blood cultures if febrile
    treatment:
      - Replace catheter before antibiotics
      - Empiric ciprofloxacin or ceftriaxone
      - Adjust based on culture
      - 7-14 days therapy
      - Remove catheter if possible

  - id: catheter_asymptomatic
    type: diagnosis
    diagnosis: Asymptomatic Bacteriuria (Catheterized)
    icd10: N39.0
    urgency: low
    workup:
      - No treatment required
    treatment:
      - Do not treat unless pregnancy or pre-urologic procedure
      - Focus on catheter care
      - Remove catheter if possible

  - id: asymptomatic_screening
    type: question
    text: "Indication for screening?"
    options:
      - label: "Pregnancy"
        next: asymptomatic_pregnancy
      - label: "Pre-urologic procedure"
        next: asymptomatic_procedure
      - label: "Other (elderly, diabetic, etc.)"
        next: asymptomatic_no_treatment

  - id: asymptomatic_pregnancy
    type: diagnosis
    diagnosis: Asymptomatic Bacteriuria in Pregnancy
    icd10: O23.4
    urgency: medium
    workup:
      - Urine culture
      - Screening at 12-16 weeks
    treatment:
      - Treat with 4-7 days antibiotics
      - Nitrofurantoin, cephalexin, or amoxicillin-clavulanate
      - Test of cure mandatory
      - Prevents pyelonephritis

  - id: asymptomatic_procedure
    type: diagnosis
    diagnosis: Asymptomatic Bacteriuria (Pre-Procedure)
    icd10: N39.0
    urgency: medium
    workup:
      - Urine culture
    treatment:
      - Treat before urologic procedure
      - Single dose perioperative antibiotic
      - Based on susceptibilities

  - id: asymptomatic_no_treatment
    type: diagnosis
    diagnosis: Asymptomatic Bacteriuria (Do Not Treat)
    icd10: N39.0
    urgency: low
    workup:
      - None needed
    treatment:
      - Do not treat
      - No benefit shown
      - Increases antibiotic resistance
      - Reassure patient

  - id: recurrent_uti
    type: question
    text: "Pattern of recurrence?"
    options:
      - label: "Relapse (same organism <2 weeks)"
        next: relapse_uti
      - label: "Reinfection (different organism or >2 weeks)"
        next: reinfection_uti

  - id: relapse_uti
    type: diagnosis
    diagnosis: Relapsing UTI
    icd10: N39.0
    urgency: high
    workup:
      - Urine culture
      - CT abdomen/pelvis
      - Evaluate for anatomic abnormality, stones, abscess
      - Consider cystoscopy
      - Urology referral
    treatment:
      - Prolonged antibiotics (2-6 weeks)
      - Treat underlying cause
      - Fluoroquinolone or based on culture

  - id: reinfection_uti
    type: diagnosis
    diagnosis: Recurrent UTI (Reinfection)
    icd10: N39.0
    urgency: medium
    workup:
      - Post-void residual
      - Consider cystoscopy if hematuria
      - Rule out diabetes
    treatment:
      - Behavioral modifications (void after intercourse, adequate hydration, avoid spermicides)
      - Consider prophylaxis (continuous low-dose, post-coital, or self-start therapy)
      - Nitrofurantoin 50-100mg daily OR TMP-SMX SS daily
      - Cranberry products may help
      - Topical estrogen if post-menopausal
