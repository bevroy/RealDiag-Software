presentations:
  - Eye pain, sharp or foreign body sensation
  - Tearing, photophobia
  - Blurred vision
  - History of trauma or foreign body
  - Fluorescein staining shows epithelial defect
  - Red eye
differentials:
  - Corneal ulcer
  - Foreign body
  - Conjunctivitis
  - Uveitis
workup:
  - 'Fluorescein stain with cobalt blue light: Epithelial defect lights up bright green'
  - 'Visual acuity: Document baseline (usually normal or mildly decreased)'
  - 'Slit lamp: Rule out infiltrate (bacterial keratitis - white opacity), anterior chamber reaction'
  - 'Evert upper lid: Rule out retained foreign body (causes vertical linear abrasions)'
treatment:
  - 'Guideline-based treatment options for Corneal Abrasion include:'
  - 'Topical antibiotic: Erythromycin 0.5% ointment QID x3-5 days (non-contact lens) OR moxifloxacin 0.5% drops QID (contact lens - Pseudomonas coverage) (AAO 2023)'
  - 'Pain control: Cycloplegic drops (cyclopentolate 1% or homatropine 5%) for pain, oral NSAIDs (AAO 2023)'
  - DO NOT prescribe topical anesthetics (tetracaine) for home use - delays healing, causes corneal toxicity (AAO 2023)
  - 'Remove foreign body if present: Irrigate, use moist cotton swab, needle at slit lamp if embedded (refer if deep) (AAO 2023)'
  - 'Follow-up in 24 hours: Re-check with fluorescein to ensure healing (AAO 2023)'
clinical_pearls:
  - Disruption of corneal epithelium - very painful (cornea most densely innervated tissue in body)
  - 'Causes: Trauma (fingernail, paper, tree branch), contact lens overwear, foreign body, dry eyes'
  - 'Contact lens wearers: High risk for Pseudomonas keratitis - needs fluoroquinolone drops'
  - 'Recurrent erosion syndrome: 10% recur, especially if basement membrane disrupted (heal within hours but fragile)'
  - DO NOT patch eye (increases infection risk, delays healing)
red_flags: []
disposition_guidance: {}
referrals:
  - 'Ophthalmology if: Large abrasion (>4mm), central location affecting vision, penetrating injury, not healing in 24-48 hours, infiltrate present'
  - Most small peripheral abrasions managed by primary care
