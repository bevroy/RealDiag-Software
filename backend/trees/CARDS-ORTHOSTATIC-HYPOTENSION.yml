tree_id: CARDS-ORTHOSTATIC-HYPOTENSION
name: Orthostatic Hypotension
family: cardiology
specialty: Cardiology
icd10: I95.1
snomed: 28651003
urgency: moderate
homeopathy: []
presentations:
  - Lightheadedness or dizziness upon standing
  - Syncope or near-syncope with position change
  - Blurred vision when standing
  - Weakness or fatigue upon standing
  - Symptoms worse in morning, after meals, or with heat
  - Falls, especially in elderly
  - Neck or shoulder pain (coat hanger distribution) from muscle hypoperfusion
  - Supine hypertension (paradoxical)
workup:
  - Orthostatic vital signs (BP and HR supine, then at 1 and 3 minutes standing)
  - Positive if SBP drop ≥20 mmHg or DBP drop ≥10 mmHg within 3 minutes of standing
  - ECG to rule out arrhythmia
  - CBC to assess for anemia
  - Basic metabolic panel (assess for dehydration, electrolytes)
  - Medication review (antihypertensives, diuretics, alpha-blockers, antidepressants)
  - Consider tilt table test if diagnosis uncertain
  - Consider autonomic function testing if neurogenic cause suspected
  - HbA1c if diabetic neuropathy suspected
  - Consider plasma norepinephrine levels (supine vs standing) for autonomic failure
treatment:
  - Identify and treat underlying cause
  - Medication review - reduce or eliminate causative medications
  - Increase fluid intake to 2-3 liters daily
  - Increase salt intake to 6-10 grams daily (unless contraindicated)
  - Compression stockings (30-40 mmHg thigh-high or abdominal binder)
  - Slow position changes - sit before standing, dangle legs
  - Elevate head of bed 10-30 degrees at night to reduce supine hypertension
  - Small frequent meals to avoid postprandial hypotension
  - Physical counterpressure maneuvers (leg crossing, squatting, muscle tensing)
  - Pharmacologic therapy if conservative measures fail
  - Midodrine 2.5-10mg TID (alpha-1 agonist, avoid within 4 hours of bedtime)
  - Fludrocortisone 0.1-0.2mg daily (mineralocorticoid, increases sodium retention)
  - Droxidopa for neurogenic orthostatic hypotension in Parkinson's or autonomic failure
  - Pyridostigmine 60mg TID for autonomic dysfunction
  - Avoid prolonged standing, hot environments, large meals, alcohol
clinical_pearls:
  - Neurogenic causes show paradoxical HR decrease or minimal increase (<15 bpm) with standing
  - Non-neurogenic causes show compensatory tachycardia (HR increase >15 bpm)
  - Supine hypertension occurs in 50% of autonomic failure patients
  - Postprandial hypotension occurs 30-120 minutes after eating
  - Morning symptoms often worse due to nocturnal diuresis
  - Elderly at higher risk - prevalence 20-30% over age 65
  - Check vitamin B12 level if neuropathy suspected
  - Deconditioning from bedrest is reversible cause
  - Beta-blockers can worsen orthostatic hypotension by preventing compensatory tachycardia
  - Always assess fall risk in elderly patients
referrals:
  - Neurology if autonomic dysfunction or Parkinson's disease suspected
  - Cardiology if cardiac cause suspected or refractory symptoms
  - Geriatrics for complex elderly patients with falls
  - Physical therapy for conditioning and fall prevention
differentials:
  - Hypovolemia / dehydration
  - Medication-induced (antihypertensives, diuretics, alpha-blockers, vasodilators)
  - Autonomic dysfunction (diabetic neuropathy, Parkinson's, multiple system atrophy)
  - Cardiac causes (arrhythmia, aortic stenosis, cardiomyopathy)
  - Adrenal insufficiency
  - Anemia
  - Postprandial hypotension
  - Prolonged bedrest / deconditioning
