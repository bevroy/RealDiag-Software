tree_id: PSYCH-DEPRESSION-MAJOR
name: Major Depressive Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Depressed mood
description: Mood disorder characterized by persistent depressed mood or anhedonia with neurovegetative symptoms causing functional impairment. Treatable with medications and psychotherapy with excellent prognosis if adherent.
icd10: F33.1
urgency: routine

workup:
  - Clinical diagnosis (DSM-5 criteria): 5 or more symptoms for ≥2 weeks including depressed mood or anhedonia plus neurovegetative symptoms (sleep, interest, guilt, energy, concentration, appetite, psychomotor, suicidal ideation) - mnemonic SIG E CAPS
  - PHQ-9 score: 0-4 none, 5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe (guides treatment and monitors response)
  - Suicide risk assessment: ask directly about suicidal ideation, intent, plan, means, prior attempts (most important screening question)
  - Rule out medical causes: TSH (hypothyroidism), CBC (anemia), CMP (electrolytes), vitamin B12, vitamin D
  - Screen for bipolar disorder: prior manic or hypomanic episodes (antidepressants can trigger mania)
  - Substance use history: alcohol and drugs can cause or worsen depression
  - Medication review: beta-blockers, corticosteroids, interferon can cause depression

treatment:
  - Mild depression PHQ-9 <10: consider psychotherapy alone, active monitoring
  - Moderate-severe depression PHQ-9 ≥10: antidepressant medication plus psychotherapy (combination superior to monotherapy)
  - SSRI first-line: sertraline 50-200 mg daily, escitalopram 10-20 mg daily, fluoxetine 20-40 mg daily (generally well-tolerated)
  - SNRI alternative: venlafaxine 75-225 mg daily, duloxetine 30-60 mg daily
  - Bupropion: if sexual side effects concern, helpful for smoking cessation, avoid in seizure disorder
  - Mirtazapine: if insomnia or poor appetite prominent, sedating
  - Trial duration: 4-6 weeks at therapeutic dose to assess response, 8-12 weeks for full effect
  - If partial response: increase dose or augment (add bupropion, mirtazapine, aripiprazole, thyroid)
  - If no response: switch to different class antidepressant
  - Psychotherapy: cognitive behavioral therapy (CBT) or interpersonal therapy (IPT) evidence-based
  - Treatment duration: continue 6-12 months after remission for first episode, longer if recurrent
  - Suicidal ideation: ensure safety, remove means, consider hospitalization if imminent risk, close follow-up
  - Electroconvulsive therapy (ECT): most effective treatment for severe refractory depression or psychotic depression
  - Lifestyle: exercise (as effective as medication for mild depression), sleep hygiene, avoid alcohol

clinical_pearls:
  - 5+ symptoms ≥2 weeks with depressed mood or anhedonia and functional impairment diagnostic (SIG E CAPS mnemonic)
  - PHQ-9 quantifies severity and monitors response
  - ALWAYS assess suicide risk directly - ask about ideation, plan, intent
  - SSRIs first-line - sertraline or escitalopram well-tolerated
  - Combination medication plus psychotherapy superior to monotherapy
  - 4-6 weeks for response, 8-12 weeks for full effect - be patient
  - Continue treatment 6-12 months after remission
  - Screen for bipolar before starting antidepressant

differentials:
  - Bipolar disorder: prior manic or hypomanic episodes (elevated mood, decreased sleep, impulsivity)
  - Persistent depressive disorder (dysthymia): chronic low-grade depression lasting ≥2 years
  - Adjustment disorder: depressive symptoms in response to identifiable stressor within 3 months, resolves within 6 months
  - Hypothyroidism: fatigue, weight gain, cold intolerance, elevated TSH

trace: |
  A 34-year-old woman presented with 3 months of depressed mood, anhedonia, insomnia, poor concentration, fatigue, feelings of worthlessness, and passive suicidal ideation without plan or intent. PHQ-9 score 18 (moderately severe). Previously enjoyed exercise and socializing, now isolates at home. Functioning declined at work. No prior psychiatric history. TSH, CBC, CMP normal. No substance use. No history of mania. Assessed suicide risk - passive ideation without plan or intent, agreed to safety plan, no access to firearms. Started sertraline 50 mg daily and referred to CBT psychotherapy. Close follow-up scheduled in 2 weeks. At 2 weeks mood slightly improved, sleep better, tolerated medication well. Increased sertraline to 100 mg daily. At 6 weeks PHQ-9 improved to 10, engaging in therapy, returning to exercise. At 12 weeks PHQ-9 6 (mild), remission achieved, functioning restored. Continued sertraline with plan for 12 months then taper. At 18 months remains well, tapered off sertraline successfully without relapse.
