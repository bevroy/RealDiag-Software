tree_id: PSYCH-DEPRESSION-MAJOR
name: Major Depressive Disorder
family: Psychiatry
specialty: Psychiatry, Primary Care
chief_complaint: Persistent sadness, loss of interest, low energy
description: Mood disorder characterized by persistent depressed mood or loss of interest/pleasure causing significant functional impairment. One of most common psychiatric disorders.

icd10: F33.1
snomed: ["370143000", "36923009"]

urgency: medium

