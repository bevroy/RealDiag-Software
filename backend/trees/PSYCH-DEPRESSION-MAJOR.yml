workup:
  - DSM-5 criteria: ≥5 symptoms present during same 2-week period (at least one must be depressed mood or anhedonia): depressed mood most of day, anhedonia (loss of interest/pleasure), significant weight change or appetite change, insomnia or hypersomnia, psychomotor agitation or retardation, fatigue or energy loss, worthlessness or excessive guilt, diminished concentration or indecisiveness, recurrent thoughts of death or suicidal ideation
  - PHQ-9 screening tool: score 0-27 (5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe), score ≥10 suggests major depression
  - Assess severity, functional impairment, suicidal ideation (item 9 on PHQ-9)
  - Rule out medical causes: hypothyroidism (TSH), anemia (CBC), vitamin deficiencies (B12, folate, vitamin D), chronic disease
  - Rule out medication-induced: beta-blockers, corticosteroids, interferon, isotretinoin, oral contraceptives
  - Rule out substance-induced: alcohol, benzodiazepines, opioids
  - Rule out bipolar disorder: screen for history of mania/hypomania (MDQ screening tool)
  - Assess for comorbid anxiety (GAD-7), PTSD, substance use
  - Safety assessment: suicidal ideation, intent, plan, means, protective factors

treatment:
  - Mild depression (PHQ-9 10-14): watchful waiting 2 weeks or start treatment if patient preference, psychotherapy alone or combination
  - Moderate-severe depression (PHQ-9 ≥15): antidepressant medication plus psychotherapy (combination more effective than either alone)
  - First-line SSRIs: sertraline 25-200 mg daily (start 25-50 mg, increase after 1 week), escitalopram 10-20 mg daily, fluoxetine 20-80 mg daily, citalopram 20-40 mg daily (max 40 mg due to QTc), paroxetine 20-60 mg daily
  - Alternative antidepressants: SNRIs (venlafaxine 75-225 mg daily, duloxetine 30-120 mg daily), bupropion SR 150-400 mg daily (good if fatigue prominent, smoking cessation, avoid if seizure history), mirtazapine 15-45 mg at bedtime (good for insomnia, appetite stimulation)
  - Onset of action: 2-4 weeks for initial effect, 6-8 weeks for full response
  - Side effects SSRIs: nausea, sexual dysfunction (40-60%), insomnia or sedation, weight gain (long-term), increased suicide risk in youth <25 (close monitoring first 4 weeks)
  - Trial duration: adequate trial is 4-8 weeks at therapeutic dose before switching
  - If inadequate response after 6-8 weeks: increase dose, switch to different SSRI or class, augmentation (add bupropion, mirtazapine, or aripiprazole), or combine with psychotherapy
  - Psychotherapy: cognitive behavioral therapy (CBT), interpersonal therapy (IPT), problem-solving therapy - as effective as medication for mild-moderate depression
  - Severe depression or treatment-resistant: psychiatry referral, consider TMS (transcranial magnetic stimulation), ECT (electroconvulsive therapy), esketamine nasal spray
  - Duration of treatment: continue 6-12 months after first episode remission, 2+ years after second episode, indefinite after ≥3 episodes
  - Discontinuation: taper gradually over 2-4 weeks to avoid discontinuation syndrome (dizziness, nausea, flu-like symptoms), especially with paroxetine and venlafaxine

clinical_pearls:
  - Major depressive disorder affects 7% of US adults annually
  - Combination of medication plus psychotherapy is most effective
  - SSRIs are first-line due to efficacy, tolerability, and safety profile
  - Response rate to first antidepressant is 50-60%, need to try 2-3 different agents for many patients
  - Screen for bipolar disorder before starting antidepressants (can trigger mania)
  - Sexual dysfunction is most common side effect causing discontinuation (40-60% with SSRIs)
  - Increased suicide risk first 4 weeks of treatment in youth <25 - close monitoring essential
  - PHQ-9 score useful for tracking response to treatment (repeat every 2-4 weeks)
  - Exercise has proven antidepressant effect (150 min/week moderate intensity)
  - Vitamin D supplementation if deficient may help mood
  - St. John's Wort has antidepressant effect but many drug interactions (not recommended)
  - Relapse rate high if discontinue too early (50% within 6 months)

referrals:
  - Psychiatry: severe depression, suicidal ideation with plan, psychosis, treatment-resistant (failed 2-3 adequate trials), bipolar disorder concern, complex comorbidities
  - Psychology/therapist: psychotherapy (CBT, IPT), ongoing counseling
  - Emergency department: active suicidal ideation with intent/plan, acute psychosis
  - Crisis line: National Suicide Prevention Lifeline 988

presentations:
  - Depressed mood most of the day
  - Anhedonia (loss of interest or pleasure in activities)
  - Significant weight loss or gain
  - Insomnia or hypersomnia
  - Psychomotor agitation or retardation
  - Fatigue or loss of energy
  - Feelings of worthlessness or excessive guilt
  - Diminished ability to concentrate
  - Indecisiveness
  - Recurrent thoughts of death or suicide
  - Social withdrawal
  - Crying spells
  - Irritability
  - Physical symptoms (headache, body aches)
