nodes:
  - id: trigeminal_neuralgia_evaluation
    type: diagnosis
    name: "Trigeminal Neuralgia"
    icd10: "G50.0"
    urgency: medium
    workup:
      - Trigeminal neuralgia (TN) - "Tic douloureux" - One of the most painful conditions known
      - Neuropathic facial pain - Affects distribution of trigeminal nerve (CN V)
      - Prevalence - 12-27 per 100,000, female:male 2:1, age >50 (but can occur younger)
      - Trigeminal nerve divisions
      - V1 (ophthalmic) - Forehead, eye
      - V2 (maxillary) - Midface, upper teeth, upper lip (most common division affected)
      - V3 (mandibular) - Lower face, lower teeth, lower lip, jaw
      - Types
      - Classical TN - Neurovascular compression (artery compresses nerve at root entry zone in brainstem, typically superior cerebellar artery)
      - Secondary TN - Multiple sclerosis (10%, demyelinating plaque affects trigeminal pathway), tumor (acoustic neuroma, meningioma), vascular malformation, stroke
      - Idiopathic TN - No identifiable cause
      - Clinical features - DIAGNOSTIC (clinical diagnosis, no lab test)
      - Pain character - Sudden, severe, electric shock-like, stabbing, lancinating
      - Duration - Brief (seconds to 2 minutes), paroxysmal (multiple episodes per day)
      - Unilateral (98%), right side more common (60%)
      - Distribution - Follows trigeminal nerve division (V2/V3 most common, 50% involve both)
      - Triggers - Light touch to specific areas (trigger zones), talking, chewing, brushing teeth, smiling, wind on face
      - Pain so severe patients avoid triggers (stop eating, talking, brushing teeth)
      - Refractory period - After attack, brief period where pain cannot be triggered
      - No pain between attacks (initially), but can develop background burning pain (atypical TN)
      - Physical exam - Normal neurologic exam (sensation intact, no motor deficit)
      - If sensory loss present → suspect secondary TN (MS, tumor)
      - Red flags - Age <40 (consider MS), bilateral pain (MS), sensory loss, hearing loss (acoustic neuroma), progressive, constant pain
      - Imaging - MRI brain with high-resolution sequences (CISS, FIESTA) to visualize trigeminal nerve and detect neurovascular compression
      - Required if - Age <40, atypical features, sensory loss, bilateral, refractory to treatment
      - MRI can show - Vascular compression (artery loop), MS plaques, tumor
      - Differential diagnosis
      - Dental pain - Toothache (constant, pressure triggers, intraoral exam abnormal, X-ray shows dental pathology)
      - Post-herpetic neuralgia - Zoster rash history, constant burning + allodynia
      - Atypical facial pain - Constant dull ache, no triggers, psychological component
      - Temporomandibular joint disorder - Jaw pain, worse with chewing, joint tenderness
      - Giant cell arteritis - Age >50, temporal artery tenderness, elevated ESR/CRP, jaw claudication
    treatment:
      - Medical therapy - First-line
      - Carbamazepine - MOST EFFECTIVE (60-80% respond), GOLD STANDARD
      - Start 100-200 mg BID, increase gradually to 600-1200 mg/day divided BID-TID
      - Mechanism - Sodium channel blocker (stabilizes nerve membrane)
      - Side effects - Dizziness, drowsiness, diplopia, ataxia, hyponatremia
      - Rare - Aplastic anemia (0.5 per 100,000), agranulocytosis, Stevens-Johnson syndrome (1-6 per 10,000), hepatotoxicity
      - Monitor - CBC, CMP, LFTs at baseline and periodically
      - HLA-B*1502 allele (Asian ancestry) - Screen before starting (increased SJS risk)
      - Oxcarbazepine - Similar to carbamazepine, better tolerated (fewer drug interactions, less monitoring)
      - 300-600 mg BID, increase to 1200-1800 mg/day
      - Effective 50-70%
      - Hyponatremia more common than carbamazepine (monitor sodium)
      - Baclofen - GABA agonist, muscle relaxant
      - 10-20 mg TID, increase to 60-80 mg/day
      - Effective as monotherapy 50-70% or adjunct to carbamazepine
      - Side effects - Sedation, weakness, do NOT stop abruptly (withdrawal seizures)
      - Lamotrigine - Anticonvulsant
      - 25 mg daily, slowly titrate (increase 25-50 mg every 2 weeks) to 200-400 mg/day
      - Slow titration to avoid SJS (rash risk if escalate too fast)
      - Effective 50-60%, useful add-on or if carbamazepine intolerant
      - Gabapentin, pregabalin - Neuropathic pain agents
      - Modest efficacy (30-40%), adjunct therapy
      - Phenytoin - IV for acute exacerbation (loading dose 15-20 mg/kg), not long-term
      - Medication failure - 30-50% eventually become refractory to medications (inadequate pain relief or intolerable side effects)
      - Surgical/procedural therapy - If medication failure or intolerance
      - Microvascular decompression (MVD) - Most definitive
      - Open craniotomy, separate compressing artery from trigeminal nerve, place Teflon sponge
      - Pain-free outcome 80-90% initially, 70-75% at 10 years
      - Best for classical TN with vascular compression on MRI, younger/healthier patients
      - Complications - Stroke, hearing loss, CSF leak, facial numbness (10-20%, mild), rare mortality <1%
      - Stereotactic radiosurgery (Gamma Knife) - Non-invasive
      - Focused radiation to trigeminal nerve root
      - Pain-free 50-70% (lower success than MVD), delayed effect (weeks to months)
      - Advantages - Outpatient, no incision, safe for elderly/comorbid patients
      - Side effects - Facial numbness (10-30%), pain recurrence (50% at 5 years)
      - Percutaneous procedures - Destructive (ablate nerve fibers)
      - Radiofrequency thermocoagulation - Heat destroys nerve fibers
      - Glycerol injection - Chemical destruction
      - Balloon compression - Mechanical compression of nerve
      - Pain relief 60-80%, but high recurrence (50% at 3-5 years)
      - Side effects - Facial numbness (50-70%, intentional), dysesthesias, corneal anesthesia (risk keratitis), masseter weakness (V3)
      - Advantages - Minimally invasive, local anesthesia, outpatient
      - Reserved for elderly, comorbid patients, or failed MVD
      - Treatment algorithm - Carbamazepine or oxcarbazepine first-line → add baclofen or lamotrigine → if refractory → MVD (if surgical candidate) or Gamma Knife
      - Prognosis - Chronic condition, spontaneous remissions possible (months to years), but 50-70% eventually recur
      - Medical therapy controls pain in 50-70% long-term
      - MVD most durable surgical option
