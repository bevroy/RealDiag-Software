tree_id: PULM-BRONCHIECTASIS
name: Bronchiectasis Evaluation
family: Pulmonology
specialty: Pulmonology
chief_complaint: Chronic Productive Cough, Hemoptysis, Recurrent Infections
description: Evaluation and management of bronchiectasis
version: "1.0"
author: RealDiag Clinical Team

entry_point: bronchiectasis_evaluation

nodes:
  - id: bronchiectasis_evaluation
    type: diagnosis
    name: "Bronchiectasis"
    icd10: "J47.9"
    urgency: medium
    workup:
      - Bronchiectasis - Permanent, irreversible dilation of bronchi and bronchioles
      - Pathophysiology - "Vicious cycle" (Cole's hypothesis)
      - Initial insult → impaired mucociliary clearance → mucus retention → bacterial colonization → chronic inflammation → airway damage → further impaired clearance
      - Pathology - Loss of normal bronchial structure (cartilage destruction, smooth muscle hypertrophy), airways dilated and thick-walled
      - Prevalence - 4-5 per 100,000, increasing (better diagnosis CT), more common women, elderly
      - Causes - "Post-infectious" most common, but many etiologies
      - Post-infectious (40%) - Severe pneumonia (childhood pertussis, measles, adenovirus), TB, nontuberculous mycobacteria (MAC)
      - Cystic fibrosis - CFTR mutation, thick secretions, chronic Pseudomonas infection
      - Screen all bronchiectasis patients (sweat chloride test, CFTR genetic testing)
      - Immunodeficiency - Hypogammaglobulinemia (CVID, XLA), selective IgA deficiency, HIV
      - Recurrent sinopulmonary infections → bronchiectasis
      - Check serum immunoglobulins (IgG, IgA, IgM, IgG subclasses), vaccine titers
      - Primary ciliary dyskinesia (PCD, Kartagener syndrome) - Defective ciliary motility
      - Kartagener syndrome triad - Bronchiectasis, chronic sinusitis, situs inversus
      - Infertility (immotile sperm), recurrent otitis media
      - Diagnosis - Nasal nitric oxide low, ciliary biopsy (electron microscopy)
      - Allergic bronchopulmonary aspergillosis (ABPA) - Hypersensitivity to Aspergillus fumigatus
      - Asthma, central bronchiectasis (proximal airways), eosinophilia, elevated IgE >1000
      - Alpha-1 antitrypsin deficiency - Lower lobe emphysema + bronchiectasis, young, liver disease
      - Connective tissue diseases - Rheumatoid arthritis (RA), Sjögren syndrome
      - Inflammatory bowel disease - Ulcerative colitis > Crohn's
      - Aspiration - Recurrent aspiration (GERD, dysphagia, neurologic)
      - Idiopathic (40%) - No cause identified despite workup
      - Clinical presentation
      - Chronic productive cough (90%) - Daily purulent sputum (yellow/green), copious
      - Dyspnea (70%) - Exertional
      - Hemoptysis (50%) - Mild streaking to massive (bronchial artery hypertrophy, inflammation)
      - Recurrent respiratory infections (exacerbations) - Increased sputum, dyspnea, fever
      - Wheeze, chest pain, fatigue, weight loss (advanced)
      - Symptoms often fluctuate (stable baseline with acute exacerbations)
      - Physical exam - Crackles (persistent, localized), wheezing, clubbing (50%)
      - Labs
      - Sputum culture - Identify colonizing organisms
      - Haemophilus influenzae most common (50%), Pseudomonas aeruginosa (30%, worse prognosis), Moraxella catarrhalis, Staphylococcus aureus, nontuberculous mycobacteria (MAC)
      - Chronic colonization common (not always active infection)
      - Etiologic workup
      - Sweat chloride test, CFTR mutation analysis - Rule out CF (all patients)
      - Serum immunoglobulins (IgG, IgA, IgM, IgG subclasses) - Rule out immunodeficiency
      - Vaccine titers (pneumococcal, tetanus) - Assess specific antibody response
      - Total IgE, Aspergillus IgE/IgG, eosinophil count - ABPA
      - Alpha-1 antitrypsin level - If lower lobe predominant
      - HIV test
      - Autoimmune serologies - If suspected (RF, anti-CCP, ANA, SSA/SSB)
      - Imaging
      - Chest X-ray - Often abnormal but nonspecific (tram-track sign, ring shadows, hyperinflation)
      - Can be normal (20-30%)
      - High-resolution CT (HRCT) chest - GOLD STANDARD for diagnosis
      - Bronchial dilation - Bronchial:arterial ratio >1 (signet ring sign, bronchus dilated next to pulmonary artery)
      - Bronchial wall thickening
      - Mucus plugging (tree-in-bud opacities)
      - Types - Cylindrical (mild, tubular dilation), varicose (irregular beaded), cystic/saccular (severe, grape-like clusters)
      - Distribution - Patchy, lower lobes common (post-infectious), upper lobes (CF, ABPA), central (ABPA)
      - Pulmonary function tests - Obstructive pattern (FEV1/FVC <0.7), reduced FEV1
      - Mixed obstructive-restrictive if severe
      - Severity assessment - Bronchiectasis Severity Index (BSI) or FACED score (predict mortality, exacerbations)
    treatment:
      - Goals - Reduce symptoms, prevent exacerbations, preserve lung function, improve quality of life
      - Airway clearance techniques - CORNERSTONE of therapy
      - Chest physiotherapy (CPT) - Postural drainage, percussion, vibration
      - Positive expiratory pressure (PEP) devices - Flutter valve, Acapella
      - High-frequency chest wall oscillation (HFCWO) - Vest therapy
      - Perform daily (10-20 min BID)
      - Effective in reducing sputum, improving QOL
      - Bronchodilators - Albuterol, ipratropium (if reversible obstruction, wheeze)
      - PFTs to assess reversibility
      - Mucolytics
      - Hypertonic saline 7% nebulized BID - Hydrate secretions, improve clearance
      - Inhaled mannitol - Osmotic agent (alternative)
      - DNase (dornase alfa) - NOT recommended non-CF bronchiectasis (may worsen)
      - Anti-inflammatory
      - Inhaled corticosteroids - Consider if coexistent asthma, ABPA
      - Not routinely recommended (conflicting data)
      - Macrolide antibiotics - Azithromycin 250-500 mg three times weekly
      - Immunomodulatory and anti-inflammatory properties
      - Reduces exacerbations 40-50% (NTM-negative patients)
      - Side effects - Hearing loss, prolonged QT, drug interactions, macrolide resistance
      - Check baseline audiogram, EKG, drug interactions
      - Screen for NTM before starting (chronic macrolide monotherapy can induce NTM resistance)
      - Chronic suppressive antibiotics - Consider if ≥3 exacerbations per year despite airway clearance
      - Azithromycin (most evidence) OR
      - Inhaled antibiotics - Tobramycin 300 mg nebulized BID, colistin, aztreonam (for chronic Pseudomonas)
      - On/off cycles (28 days on, 28 days off)
      - Reduce exacerbations, improve symptoms
      - Side effects - Bronchospasm (pretreat with bronchodilator), ototoxicity (tobramycin)
      - Vaccinations - Pneumococcal (PCV20 or PCV15 + PPSV23), annual influenza
      - Acute exacerbations - Increased sputum volume/purulence, dyspnea, fever
      - Antibiotics - 10-14 days, directed by sputum culture
      - H. influenzae - Amoxicillin-clavulanate 875/125 mg BID or doxycycline
      - P. aeruginosa - Ciprofloxacin 500-750 mg BID PO or IV antibiotics (antipseudomonal beta-lactam + aminoglycoside)
      - Augment airway clearance during exacerbation
      - Immunoglobulin replacement - If immunodeficiency (IVIG 400-600 mg/kg q3-4 weeks)
      - Reduces infections
      - ABPA treatment - Oral corticosteroids (prednisone 0.5 mg/kg/day x 2 weeks, taper over months) + itraconazole 200 mg BID (antifungal, reduces steroid requirement)
      - Surgical resection - Consider if localized disease (1-2 lobes), refractory symptoms (recurrent infections, massive hemoptysis), adequate pulmonary reserve
      - 5-10% candidates
      - Outcomes - 80% symptom improvement, but progressive disease in remaining lobes possible
      - Bronchial artery embolization - For massive hemoptysis (>200 mL/24 hours)
      - Lung transplantation - End-stage disease (severe, refractory)
      - Prognosis - Variable, depends on etiology, severity, chronic Pseudomonas colonization (worse)
      - 5-year survival 80-90% overall
      - Progressive decline in FEV1 ~50 mL/year
      - Exacerbations accelerate decline
