tree_id: ENDO-PAGET-DISEASE-BONE
name: Paget Disease of Bone
family: musculoskeletal
specialty: Endocrinology/Rheumatology
chief_complaint: Bone pain, skeletal deformity, often asymptomatic
description: Chronic disorder of bone remodeling with excessive bone resorption followed by disorganized bone formation
icd10: M88.9
urgency: routine
workup:
  - Clinical presentation - often asymptomatic (70-90% discovered incidentally)
  - Bone pain (most common symptom when present) - deep aching, worse at night
  - Skeletal deformity - bowing of long bones (tibia, femur), enlarged skull
  - Warmth over affected bones (increased blood flow)
  - Hearing loss (30%) - skull base involvement affecting cranial nerve VIII
  - Neurologic complications - nerve compression, spinal stenosis, basilar invagination
  - Pathologic fracture (10-30%) - chalk-stick fractures, often minimal trauma
  - Arthritis in joints adjacent to affected bones (hip, knee)
  - Most commonly affected sites - pelvis (70%), spine (50%), femur (50%), skull (40%), tibia (30%)
  - Physical examination
  - Skeletal deformities - bowing of legs (tibia), kyphosis
  - Enlarged skull (increased hat size)
  - Warmth and tenderness over affected bones
  - Gait abnormalities from leg length discrepancy or hip arthritis
  - High-output heart failure (rare, extensive disease with increased vascularity)
  - Laboratory studies
  - Alkaline phosphatase (ALP) - markedly elevated (hallmark finding)
  - Proportional to extent and activity of disease
  - Can be 10-25x upper limit of normal in severe cases
  - Bone-specific alkaline phosphatase - more specific if total ALP unclear
  - Bone turnover markers
  - N-telopeptide (NTX) or C-telopeptide (CTX) - elevated (markers of bone resorption)
  - Useful for monitoring treatment response
  - Serum calcium, phosphorus, PTH - typically normal
  - Hypercalcemia can occur with immobilization or fracture
  - 25-OH vitamin D level - assess for deficiency before treatment
  - Radiographic findings - characteristic appearance
  - X-rays show increased bone density, cortical thickening, coarse trabecular pattern
  - Lytic phase - osteolytic lesions (osteoporosis circumscripta in skull)
  - Mixed phase - combination lytic and blastic
  - Blastic phase - dense sclerotic bone
  - Specific patterns - "picture frame" vertebra, "cotton wool" appearance skull, V-shaped osteolytic lesion distal femur or tibia
  - Bone scintigraphy (bone scan) - intense uptake in affected bones
  - Most sensitive test for identifying all sites of involvement
  - CT or MRI if complications suspected (nerve compression, malignant transformation)
treatment:
  - Indications for treatment
  - Symptomatic disease (bone pain)
  - Elevated alkaline phosphatase (especially if greater than 2x upper limit)
  - Active disease in high-risk sites (skull, spine, weight-bearing bones, near joints)
  - Before orthopedic surgery on affected bones
  - Complications - fracture, deformity, neurologic involvement
  - Bisphosphonates - first-line treatment
  - Zoledronic acid 5 mg IV single infusion - most effective
  - Normalizes ALP in 90% of patients
  - Duration of effect typically 2-5 years from single dose
  - Alendronate 40 mg daily for 6 months
  - Or risedronate 30 mg daily for 2 months
  - Less potent than zoledronic acid
  - Pre-treatment requirements
  - Adequate vitamin D (25-OH vitamin D greater than 30 ng/mL) - supplement if deficient
  - Calcium 1200-1500 mg daily plus vitamin D 800-1000 IU daily
  - Normal renal function (avoid bisphosphonates if eGFR less than 35)
  - Good dental health (risk of osteonecrosis of jaw)
  - Side effects of bisphosphonates
  - Acute phase reaction (flu-like symptoms 24-72 hours after IV dose) - common, self-limited
  - Hypocalcemia (especially with IV formulations) - ensure adequate calcium/vitamin D
  - Osteonecrosis of jaw (rare, risk 1 in 10,000) - dental exam before treatment
  - Atypical femur fracture (very rare with long-term use)
  - Calcitonin - second-line (if bisphosphonates contraindicated or not tolerated)
  - Salmon calcitonin 100 units SC daily or nasal spray 200 units daily
  - Less effective than bisphosphonates
  - Analgesics for bone pain - NSAIDs, acetaminophen
  - Monitor treatment response
  - Alkaline phosphatase at 3-6 months after treatment
  - Goal - normalization or 75% reduction from baseline
  - Bone turnover markers (NTX, CTX) also decrease
  - Repeat treatment if ALP rises again or symptoms recur (typically years later)
  - Surgical management if needed
  - Fracture fixation (pathologic fractures)
  - Joint replacement (severe arthritis adjacent to pagetic bone)
  - Spinal decompression (neurologic compromise)
  - Preoperative bisphosphonate reduces surgical bleeding
  - Complications to monitor
  - Pathologic fractures - especially femur, tibia
  - Osteosarcoma (less than 1% risk) - suspect if sudden worsening pain, soft tissue mass
  - Neurologic complications - basilar invagination, spinal stenosis, nerve compression
  - High-output heart failure (rare, extensive disease)
clinical_pearls:
  - Prevalence increases with age - 3-4% of people over age 40, up to 10% over age 80
  - More common in European descent, rare in Asians and Africans
  - Genetic component - 15-40% have positive family history, SQSTM1 gene mutations
  - Monostotic (single bone 20%) vs polyostotic (multiple bones 80%)
  - Skull involvement - frontal bone most common, causes enlargement (increased hat size), hearing loss, cranial nerve compression
  - Pelvis most commonly involved site overall
  - Bisphosphonates very effective - single dose zoledronic acid normalizes ALP in 90%, effect lasts years
  - Osteosarcoma rare but serious complication (less than 1%) - suspect if sudden pain increase, soft tissue mass, ALP spike
  - Disease progression slows or stops with treatment but bone deformities are irreversible
  - High cardiac output (from increased bone vascularity) can precipitate heart failure in extensive disease
differentials:
  - Metastatic bone disease (cancer history, multiple lytic/blastic lesions, hypercalcemia)
  - Primary hyperparathyroidism (elevated PTH, hypercalcemia, diffuse bone disease)
  - Osteomalacia (low calcium, low phosphorus, low vitamin D, elevated ALP)
  - Fibrous dysplasia (younger age, monostotic usually, ground-glass appearance on X-ray)
  - Osteomyelitis (acute pain, fever, localized findings)
  - Osteoarthritis (joint pain, normal ALP, cartilage loss on imaging)
  - Multiple myeloma (anemia, hypercalcemia, lytic lesions, monoclonal protein)
trace:
  - 68-year-old man presents to PCP for routine visit, found to have elevated alkaline phosphatase on metabolic panel
  - Routine labs ordered as part of annual physical
  - Alkaline phosphatase 580 U/L (markedly elevated, normal less than 120)
  - All other labs normal including calcium, phosphorus, liver enzymes
  - Patient reports mild left hip pain for past 6 months, attributed to arthritis
  - Pain worse at night, aching in nature
  - No trauma, no weight loss, no fevers
  - Noticed hat feels tighter recently (increased skull size)
  - Mild hearing loss in left ear (gradual over years)
  - Past medical history - hypertension, osteoarthritis
  - Medications - lisinopril, occasional ibuprofen
  - Family history - father had "bone problems" in old age
  - Physical exam - vitals normal, BMI 27
  - Skull appears prominent frontally
  - Mild bowing of left tibia
  - Left hip tender to palpation, reduced internal rotation
  - Gait normal, no neurologic deficits
  - GGT 45 U/L (normal) - rules out hepatic cause of elevated ALP
  - Bone-specific alkaline phosphatase 485 U/L (elevated) - confirms bone origin
  - Serum calcium 9.4 mg/dL (normal), phosphorus 3.8 mg/dL (normal), PTH 42 pg/mL (normal)
  - 25-OH vitamin D 22 ng/mL (insufficient)
  - X-rays ordered
  - Left hip/pelvis - coarse trabecular pattern in left ilium and left proximal femur, cortical thickening, increased bone density
  - Skull - areas of increased density ("cotton wool" appearance), frontal bone thickening
  - Left tibia - cortical thickening, bowing deformity
  - Bone scan (technetium-99m) - intense uptake in left pelvis/femur, skull, left tibia (confirms polyostotic Paget disease)
  - Diagnosis - Paget disease of bone, polyostotic (pelvis, skull, tibia)
  - Referred to endocrinology for management
  - Endocrine evaluation - extensive disease with markedly elevated ALP, symptomatic (hip pain)
  - Indications for treatment - symptoms, elevated ALP, involvement of weight-bearing bones and skull
  - Dental evaluation obtained - no active dental disease, cleared for bisphosphonate
  - Treatment plan
  - Vitamin D repletion first - cholecalciferol 50,000 IU weekly for 8 weeks
  - Calcium carbonate 600 mg BID
  - After vitamin D replete, schedule zoledronic acid infusion
  - 6 weeks later - vitamin D level 38 ng/mL (replete)
  - Zoledronic acid 5 mg IV infusion administered
  - Pre-medicated with acetaminophen 1000 mg
  - Infusion over 15 minutes, tolerated well
  - Post-infusion - developed flu-like symptoms (fever, myalgias, fatigue) 24 hours later
  - Treated with acetaminophen, resolved within 48 hours (expected acute phase reaction)
  - 3-month follow-up - significant improvement
  - Hip pain much improved, now 2/10 from 6/10
  - Labs - alkaline phosphatase 185 U/L (down from 580, 68% reduction)
  - Bone-specific ALP 145 U/L (down from 485)
  - Calcium normal, vitamin D 42 ng/mL
  - Continue calcium and vitamin D supplementation
  - 6-month follow-up - continued improvement
  - Hip pain minimal, 1/10
  - Alkaline phosphatase 125 U/L (near normal, 79% reduction from baseline)
  - Excellent response to treatment
  - No need for repeat bisphosphonate at this time
  - Annual monitoring of ALP
  - 1-year follow-up - ALP stable 130 U/L, minimal symptoms
  - 2-year follow-up - ALP 135 U/L, remains asymptomatic
  - Effect of single zoledronic acid dose lasting years as expected
  - Will monitor annually, repeat treatment if ALP rises significantly or symptoms recur
  - Outcome - Excellent response to single dose zoledronic acid, normalized ALP, symptom resolution
