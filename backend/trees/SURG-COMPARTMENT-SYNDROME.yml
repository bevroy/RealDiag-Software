tree_id: SURG-COMPARTMENT-SYNDROME
name: Acute Compartment Syndrome
family: Surgery
specialty: Surgery
icd10:
- T79.A0XA
snomed:
- '238094007'
urgency: urgent
description: Comprehensive evaluation and management of Acute Compartment Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Pain out of proportion to physical findings (earliest, most sensitive sign)
- Pain with passive stretch of muscles in affected compartment (95% sensitive)
- '6 Ps: Pain, Pressure, Paresthesias, Pallor, Pulselessness (LATE), Paralysis (LATE)'
- Tense, swollen compartment (firm, "wood-like" on palpation)
- Paresthesias in distribution of nerves traversing compartment
- 'Most common: Lower leg (anterior compartment), forearm (volar compartment)'
- 'Causes: Fractures (tibia, forearm), crush injury, tight casts/dressings, prolonged
  immobilization'
workup: []
treatment:
- 'Guideline-based treatment options for Acute Compartment Syndrome include:'
- 'Immediate: Remove all circumferential dressings, casts, splints down to skin, elevate
  limb to heart level (NOT above) (ACS 2023)'
- 'Compartment pressure measurement: Stryker device or arterial line setup, measure
  affected compartments (ACS 2023)'
- 'If pressure >30 mmHg or Δ30 mmHg below diastolic BP: EMERGENT fasciotomy (ACS 2023)'
- 'Orthopedic/surgery consult immediately: Fasciotomy = surgical decompression of
  all compartments (ACS 2023)'
- 'Disposition: OR for emergent fasciotomy, wounds left open, delayed primary closure
  3-5 days later (ACS 2023)'
clinical_pearls:
- Pain with passive stretch = most sensitive early sign (95%), appears before paresthesias
- 'Pulselessness = LATE finding: Irreversible damage already occurred, do NOT wait
  for this'
- 'Compartment pressure measurement: >30 mmHg or Δ30 mmHg of diastolic BP = fasciotomy
  indicated'
- 'Clinical diagnosis: Don''t delay for pressure measurement if high suspicion'
- 'Time is muscle: Permanent damage after 6-8 hours, fasciotomy must be done urgently'
- 'Cast/dressing: Remove immediately if suspected, down to skin (may decompress)'
referrals:
  emergency:
    - Acute abdomen
    - Peritonitis
    - Perforated viscus
    - Ruptured AAA
    - Necrotizing fasciitis
  urgent:
    - Suspected malignancy
    - Bowel obstruction
    - Incarcerated hernia
    - Acute cholecystitis
  routine:
    - Elective hernia repair
    - Gallstones without cholecystitis
    - Benign masses
    - Screening abnormalities
differentials:
  - DVT
  - Cellulitis
  - Muscle strain
  - Fracture without compartment syndrome
