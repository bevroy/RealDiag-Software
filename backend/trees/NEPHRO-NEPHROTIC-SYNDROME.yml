tree_id: NEPHRO-NEPHROTIC-SYNDROME
name: Nephrotic Syndrome
family: Nephrology
specialty: Nephrology
chief_complaint: Edema and foamy urine
description: |
  Glomerular disorder with massive proteinuria, hypoalbuminemia, edema, and hyperlipidemia.
  Defined by urine protein greater than 3.5 g/24 hours or urine protein-to-creatinine ratio greater than 3 mg/mg. Causes include minimal change disease, focal segmental glomerulosclerosis, membranous nephropathy.
icd10: N04.9
snomed: 52254009
presentations:
  - Severe proteinuria (>3.5 g/24hr)
  - Edema (periorbital, peripheral, anasarca)
  - Hypoalbuminemia
  - Hyperlipidemia
  - Thrombotic complications
  - Infections (encapsulated organisms)
urgency: Moderate
referrals:
  emergency:
    - AKI with K>6.5
    - Severe acidosis
    - Uremia needing dialysis
  urgent:
    - Rapidly progressive GN
    - AKI rising Cr
    - Nephrotic syndrome
  routine:
    - CKD management
    - Proteinuria
    - Stone prevention

workup:
  - 24-hour urine protein collection (greater than 3.5 g/day diagnostic) or spot urine protein-to-creatinine ratio greater than 3 mg/mg
  - Serum albumin less than 3 g/dL (hypoalbuminemia)
  - Lipid panel shows hyperlipidemia (elevated total cholesterol, LDL, triglycerides)
  - Complete metabolic panel (assess kidney function, may have AKI)
  - Urinalysis shows proteinuria, oval fat bodies, fatty casts
  - Renal ultrasound (assess kidney size and rule out obstruction)
  - Serologic workup - ANA, anti-dsDNA (lupus nephritis), hepatitis B and C, HIV, complement levels (C3, C4)
  - Serum and urine protein electrophoresis if age greater than 40 (rule out multiple myeloma)
  - Renal biopsy for definitive diagnosis (determines specific glomerular disease and guides treatment)
treatment:
  - ACE inhibitor or ARB to reduce proteinuria (enalapril 10-20mg daily, lisinopril 20-40mg daily)
  - Loop diuretics for edema (furosemide 40-80mg daily or BID, titrate to effect)
  - Sodium restriction less than 2g/day
  - Statin therapy for hyperlipidemia (atorvastatin 20-40mg daily)
  - Anticoagulation if albumin less than 2 g/dL (high risk of thromboembolism) - warfarin or DOAC
  - Disease-specific treatment based on biopsy - minimal change disease (prednisone 1 mg/kg/day x 4-16 weeks), FSGS (ACE/ARB, may need steroids or immunosuppression), membranous nephropathy (rituximab, cyclophosphamide, or calcineurin inhibitors)
  - Treat underlying cause if secondary nephrotic syndrome (diabetes, amyloidosis, lupus)
  - Vaccinations (pneumococcal, influenza) due to immunosuppression from disease and treatment
clinical_pearls:
  - Nephrotic syndrome triad includes proteinuria, hypoalbuminemia, edema (hyperlipidemia often added as fourth feature)
  - Hypercoagulable state from loss of anticoagulant proteins (antithrombin III, protein C, protein S) and increased hepatic synthesis of procoagulant factors
  - Renal vein thrombosis complication presents with flank pain, hematuria, sudden worsening of renal function
  - Minimal change disease most common in children (90%), responds well to steroids
  - FSGS most common primary cause in adults, often progresses to ESRD
  - Membranous nephropathy associated with malignancy (especially in elderly), hepatitis B, NSAIDs, penicillamine
differentials:
  - Nephritic syndrome
  - Acute glomerulonephritis
  - Diabetic nephropathy
  - Amyloidosis
  - Heart failure
  - Cirrhosis
trace:
  - Progressive leg swelling and foamy urine x 4 weeks → Exam shows 3+ pitting edema, periorbital edema → 24-hour urine protein 8 g, albumin 2.1 g/dL, cholesterol 320 mg/dL → Diagnose nephrotic syndrome → Renal biopsy shows minimal change disease → Start prednisone 60mg daily (1 mg/kg), furosemide 40mg BID, lisinopril 20mg daily → Atorvastatin 40mg, sodium restriction → Proteinuria resolves by week 8 → Taper prednisone over 6 months → Complete remission maintained

citations:
  - KDIGO (Kidney Disease: Improving Global Outcomes) Guidelines
  - NKF (National Kidney Foundation) Clinical Practice Guidelines
  - UpToDate - Nephrology
