tree_id: ID-ACUTE-PYELONEPHRITIS
name: Acute Pyelonephritis
family: Infectious Disease
specialty: Infectious Disease
icd10:
- N10
- N12
snomed:
- '36689008'
urgency: urgent
description: Comprehensive evaluation and management of Acute Pyelonephritis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Fever, chills (high-grade fever often >38.5°C)
- Flank pain, CVA tenderness (costovertebral angle tenderness, hallmark finding)
- Dysuria, urinary frequency, urgency (cystitis symptoms often present)
- Nausea and vomiting (systemic symptoms)
- 'Urinalysis: Pyuria, bacteriuria, WBC casts (pathognomonic for kidney infection)'
- E. coli (80% of cases), Klebsiella, Proteus, Enterococcus
- More severe than simple cystitis - systemic toxicity present
- 'Complicated cases: Pregnancy, diabetes, immunosuppression, obstruction, catheter'
- May progress to sepsis if untreated
- 'Emphysematous pyelonephritis: Gas in kidney tissue (diabetics), surgical emergency'
- 'Diagnosis: Clinical (fever + CVA tenderness) + UA with WBC casts + urine culture
  >100K CFU/mL'
- Risk factors - female, urinary stasis, vesicoureteral reflux, kidney stones
workup:
- Urinalysis (pyuria, WBC casts, bacteriuria)
- Urine culture (before antibiotics)
- Blood cultures if admitted or severe
- CT abdomen/pelvis if complicated or no improvement (rule out abscess, obstruction)
treatment:
- 'Guideline-based treatment options for Acute Pyelonephritis include:'
- 'Outpatient: Ciprofloxacin 500mg PO BID x 7d or levofloxacin 750mg daily x 5d (IDSA
  2024)'
- 'Alternative: Ceftriaxone 1g IV/IM x 1, then cefpodoxime or ciprofloxacin PO (IDSA
  2024)'
- 'Inpatient: Ceftriaxone 1-2g IV daily or fluoroquinolone IV (IDSA 2024)'
- 'If gram-positive cocci: Ampicillin + gentamicin (enterococcus) (IDSA 2024)'
- 'If severe/septic: Piperacillin-tazobactam or carbapenem (IDSA 2024)'
clinical_pearls:
- 'Uncomplicated: Outpatient PO fluoroquinolone or ceftriaxone x 1, then PO'
- 'Complicated: Admission for IV antibiotics (obstruction, pregnancy, immunocompromised)'
- WBC casts are pathognomonic for pyelonephritis
- Imaging not needed for uncomplicated; CT if severe, no improvement in 48-72hr
- Sepsis can develop quickly - low threshold for admission
referrals:
- 'Admission if: Sepsis, pregnancy, obstruction, immunocompromised, unable to tolerate
  PO'
- Urology if obstruction or recurrent infections
differentials: []
trace:
  source: Infectious Diseases Society of America (IDSA) Guidelines, Centers for Disease
    Control and Prevention (CDC)
