nodes:
  - id: food_allergy_evaluation
    type: diagnosis
    name: "Food Allergy Evaluation"
    icd10: "T78.1"
    urgency: medium
    workup:
      - IgE-mediated food allergy - Immediate hypersensitivity (minutes to 2 hours after ingestion)
      - Common food allergens "Big 9" - Milk, egg, peanut, tree nuts, wheat, soy, fish, shellfish, sesame (90% of food allergies)
      - Prevalence - 8% children, 5% adults, increasing
      - Clinical presentations
      - Mild - Urticaria, angioedema, pruritus oral/throat, nausea
      - Moderate - Vomiting, diarrhea, wheezing, dyspnea
      - Severe - Anaphylaxis (see ALLERGY-ANAPHYLAXIS tree)
      - Diagnosis
      - Clinical history - Timing (immediate), reproducible reactions, specific food triggers
      - Skin prick testing (SPT) - High negative predictive value (>95%), but positive predictive value low (50-60%), many false positives
      - Serum specific IgE - Similar performance to SPT, quantitative
      - Oral food challenge - GOLD STANDARD, medically supervised graded exposure, confirms diagnosis
      - Natural history
      - Outgrow - Milk (80% by age 16), egg (70% by 16), wheat/soy (60-70%)
      - Persist - Peanut (20% outgrow), tree nuts (10%), fish/shellfish (rare <5%)
    treatment:
      - Strict avoidance - Read labels, avoid cross-contamination, inform restaurants/schools
      - Epinephrine auto-injector - TWO devices (EpiPen 0.15mg if 15-30kg, 0.3mg if >30kg), teach use, always carry
      - Indications to use - Any respiratory or cardiovascular symptoms, or multi-system involvement (see anaphylaxis)
      - Medical alert identification - Bracelet/necklace
      - Emergency action plan - Written instructions for caregivers/teachers
      - Oral immunotherapy (OIT) - Peanut OIT (Palforzia FDA-approved), milk/egg OIT experimental
      - Gradual dose escalation over months, induces desensitization (NOT tolerance)
      - Requires ongoing daily dosing, risk anaphylaxis during treatment
      - Alternative - Omalizumab (anti-IgE) + OIT or multi-allergen desensitization
      - Follow-up - Allergy testing periodically to assess if outgrown (especially milk/egg), supervised oral challenge to confirm tolerance
