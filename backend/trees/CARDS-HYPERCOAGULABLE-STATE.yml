tree_id: CARDS-HYPERCOAGULABLE-STATE
name: Hypercoagulable State (Thrombophilia)
family: cardiology
specialty: Cardiology
icd10: D68.69
snomed: 439001
urgency: moderate
homeopathy: []
presentations:
  - Venous thromboembolism (DVT or PE) at young age (<50 years)
  - Recurrent VTE
  - Unprovoked VTE (no clear precipitant)
  - VTE in unusual locations (cerebral, mesenteric, portal vein)
  - Family history of VTE or known thrombophilia
  - Pregnancy complications - recurrent miscarriages (≥3), stillbirth, severe preeclampsia
  - VTE during pregnancy or postpartum
  - Arterial thrombosis at young age (if antiphospholipid syndrome)
  - Warfarin-induced skin necrosis (protein C/S deficiency)
  - Neonatal purpura fulminans (severe protein C/S deficiency)
workup:
  - Thrombophilia testing indications (selective, not routine for all VTE)
  - First VTE at age <50 years
  - Recurrent VTE
  - VTE in unusual site
  - Strong family history (≥2 first-degree relatives with VTE)
  - Unprovoked VTE with plan to stop anticoagulation
  - Women with pregnancy complications
  - Inherited thrombophilias (genetic)
  - Factor V Leiden mutation (most common, 5% prevalence)
  - Prothrombin G20210A mutation
  - Protein C deficiency
  - Protein S deficiency
  - Antithrombin deficiency (highest VTE risk)
  - Acquired thrombophilias
  - Antiphospholipid antibody syndrome (lupus anticoagulant, anticardiolipin, anti-beta-2-glycoprotein)
  - Test twice, 12 weeks apart for diagnosis
  - Elevated factor VIII
  - Hyperhomocysteinemia
  - Timing of testing - delay until ≥2 weeks off anticoagulation (if safe) for accurate results
  - Acute thrombosis and anticoagulation affect protein C/S levels
  - Factor V Leiden and prothrombin gene mutation unaffected by anticoagulation
treatment:
  - Anticoagulation for acute VTE event (standard duration regardless of thrombophilia)
  - Acute phase - LMWH, fondaparinux, or unfractionated heparin
  - DOACs (rivaroxaban, apixaban, edoxaban, dabigatran) or warfarin for long-term
  - Extended anticoagulation indications
  - Recurrent unprovoked VTE
  - Unprovoked proximal DVT or PE with low bleeding risk
  - Antiphospholipid syndrome with thrombosis (lifelong warfarin)
  - Antithrombin deficiency (high recurrence risk)
  - Consider extended anticoagulation for unprovoked VTE even without identified thrombophilia
  - Limited duration anticoagulation (3-6 months) for provoked VTE
  - Pregnancy management
  - High-risk thrombophilias (antithrombin, homozygous Factor V Leiden, antiphospholipid syndrome)
  - Prophylactic LMWH during pregnancy and 6 weeks postpartum
  - History of VTE - therapeutic LMWH
  - Avoid estrogen-containing contraceptives in thrombophilia
  - Thromboprophylaxis for high-risk situations (surgery, hospitalization, long flights)
clinical_pearls:
  - Thrombophilia testing rarely changes acute VTE management
  - Factor V Leiden heterozygous - 5-8x VTE risk (most common, relatively mild)
  - Factor V Leiden homozygous - 80x VTE risk
  - Prothrombin G20210A mutation - 2-3x VTE risk
  - Protein C/S deficiency - 10x VTE risk
  - Antithrombin deficiency - 25-50x VTE risk (most thrombogenic)
  - Antiphospholipid syndrome - both arterial and venous thrombosis, requires warfarin (not DOACs)
  - Testing during acute thrombosis or on anticoagulation may yield false results
  - Duration of anticoagulation driven more by provoked vs unprovoked than thrombophilia presence
  - Routine screening of asymptomatic family members not recommended
referrals:
  - Hematology for recurrent VTE, unusual presentations, or complex thrombophilia management
  - Maternal-fetal medicine for pregnant patients with thrombophilia
  - Vascular medicine for complex anticoagulation decisions
differentials:
  - Inherited thrombophilias (Factor V Leiden, prothrombin mutation, protein C/S/antithrombin deficiency)
  - Antiphospholipid antibody syndrome
  - Malignancy-associated thrombosis (Trousseau syndrome)
  - Heparin-induced thrombocytopenia (HIT)
  - Paroxysmal nocturnal hemoglobinuria (PNH)
  - Myeloproliferative disorders (polycythemia vera, essential thrombocythemia)
  - Nephrotic syndrome (loss of antithrombin)
  - Hyperhomocysteinemia
