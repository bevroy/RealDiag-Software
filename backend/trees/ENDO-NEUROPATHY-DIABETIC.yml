tree_id: ENDO-NEUROPATHY-DIABETIC
name: Diabetic Neuropathy
family: Endocrinology
specialty: Endocrinology
chief_complaint: Numbness and tingling in feet
description: Most common complication of diabetes causing distal symmetric sensory loss, neuropathic pain, and autonomic dysfunction. Glycemic control slows progression, medications reduce neuropathic pain, foot care prevents ulcers and amputation.
icd10: E11.40
snomed: 230572002
presentations:
  - Distal symmetric polyneuropathy
  - Numbness, tingling in feet and hands (stocking-glove)
  - Burning pain, hyperalgesia
  - Loss of protective sensation
  - Autonomic neuropathy: orthostasis, gastroparesis, erectile dysfunction
  - Mononeuropathy: cranial nerve palsy, carpal tunnel
urgency: non-urgent

workup:
  - Clinical diagnosis: bilateral distal symmetric sensory loss in stocking-glove distribution in patient with diabetes
  - Symptoms: numbness, tingling, burning pain (worse at night), hyperalgesia, allodynia
  - Monofilament testing: 10-g monofilament on plantar surface (inability to sense indicates loss of protective sensation - high amputation risk)
  - Vibration testing: 128-Hz tuning fork on great toe (reduced vibration sense early sign)
  - Ankle reflexes: diminished or absent
  - Screen annually: all diabetic patients should be screened for neuropathy at diagnosis and annually
  - Rule out other causes: B12 deficiency, hypothyroidism, alcohol, medications (chemotherapy), chronic kidney disease
  - Nerve conduction studies: only if atypical presentation (asymmetric, rapid progression, upper extremity predominant, motor > sensory)
  - Autonomic neuropathy: gastroparesis, erectile dysfunction, orthostatic hypotension, resting tachycardia, diabetic diarrhea

treatment:
  - Glycemic control (most important): intensive control slows progression (HbA1c <7%), greater benefit in type 1 than type 2
  - Once established, tight control does not reverse neuropathy but slows worsening
  - Neuropathic pain management (if painful): first-line agents
  - Pregabalin 75-300 mg BID (start low 75 mg nightly, titrate slowly), or gabapentin 300-1200 mg TID (start 300 mg nightly, titrate)
  - Duloxetine 60 mg daily (SNRI, also treats comorbid depression), or venlafaxine 75-225 mg daily
  - Tricyclic antidepressants: amitriptyline 25-100 mg HS or nortriptyline 25-100 mg HS (effective but anticholinergic side effects, avoid if elderly)
  - Topical agents: lidocaine 5% patches or capsaicin cream for localized pain
  - Tramadol or tapentadol: if refractory pain, but opioid risks (avoid long-term if possible)
  - Combination therapy: often requires two medications (pregabalin plus duloxetine)
  - Foot care (prevent ulcers and amputation): daily inspection, proper footwear, podiatry referral
  - Offload pressure areas, treat calluses and nail abnormalities professionally
  - Educate on foot hygiene: wash and dry thoroughly, moisturize (not between toes), avoid barefoot walking
  - Autonomic neuropathy management: gastroparesis (metoclopramide, erythromycin), orthostatic hypotension (midodrine, fludrocortisone), erectile dysfunction (PDE5 inhibitors)

clinical_pearls:
  - Distal symmetric sensory loss stocking-glove distribution in diabetic patient diagnostic
  - Screen annually with monofilament testing - loss of protective sensation predicts ulcers
  - Glycemic control most important - slows progression but doesn't reverse established neuropathy
  - Painful neuropathy: pregabalin or duloxetine first-line
  - Often requires combination therapy for pain control
  - Foot care critical - daily inspection, proper footwear, podiatry to prevent amputation
  - Loss of protective sensation high amputation risk - intensive foot care
  - Autonomic neuropathy causes gastroparesis, orthostasis, erectile dysfunction

differentials:
  - B12 deficiency: similar stocking-glove neuropathy, low B12, macrocytic anemia, responds to supplementation
  - Alcoholic neuropathy: alcohol use history, similar presentation, nutritional deficiencies
  - Chemotherapy-induced neuropathy: temporal relationship with chemotherapy (platinum, taxanes, vinca alkaloids)
  - Chronic inflammatory demyelinating polyneuropathy (CIDP): progressive, areflexia, elevated CSF protein, responds to immunotherapy

trace: |
  A 58-year-old man with type 2 diabetes x12 years (HbA1c 8.5%, poorly controlled) presented with 18 months progressive bilateral foot numbness and tingling, now with burning pain in both feet worse at night affecting sleep. Exam showed decreased sensation to monofilament testing bilaterally (loss of protective sensation), absent ankle reflexes, reduced vibration sense at great toes, normal motor strength. Labs showed HbA1c 8.5%, B12 450 (normal), TSH 2.1 (normal), creatinine 1.2 (normal). Diagnosed with diabetic sensorimotor polyneuropathy with painful neuropathy. Counseled extensively on importance of glycemic control to slow progression. Intensified diabetes regimen to target HbA1c <7%. Started pregabalin 75 mg nightly for neuropathic pain. Referred to podiatry for foot care education and proper footwear. At 2 weeks increased pregabalin to 75 mg BID, pain improved 40%, sleeping better. At 6 weeks increased to 150 mg BID, pain reduced 70%. At 3 months HbA1c improved to 7.2%, pain well-controlled on pregabalin, neuropathy progression slowed. Daily foot inspection established, proper diabetic shoes obtained. At 12 months HbA1c 6.9%, no foot ulcers developed, pain controlled, excellent adherence to foot care preventing complications.
