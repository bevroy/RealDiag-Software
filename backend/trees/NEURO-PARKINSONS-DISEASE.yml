tree_id: NEURO-PARKINSONS-DISEASE
name: Parkinson's Disease
family: neurologic
specialty: Neurology
chief_complaint: Tremor, slowness of movement, stiffness, balance problems
description: Progressive neurodegenerative disorder from loss of dopaminergic neurons in substantia nigra
icd10: G20
urgency: routine
workup:
  - Clinical presentation - motor symptoms develop gradually
  - Cardinal motor features (need 2 of 4 for diagnosis)
  - Resting tremor (4-6 Hz pill-rolling tremor at rest, disappears with action)
  - Bradykinesia (slowness of movement) - REQUIRED for diagnosis
  - Rigidity (lead-pipe or cogwheel rigidity)
  - Postural instability (impaired balance, falls) - late feature
  - Motor symptoms typically begin unilaterally then progress to bilateral
  - Early symptoms include decreased arm swing, micrographia, masked facies
  - Gait disturbance includes shuffling, festinating gait, reduced stride length
  - Non-motor symptoms common
  - Hyposmia (reduced sense of smell) - early, may precede motor symptoms by years
  - REM sleep behavior disorder (acting out dreams) - precedes motor symptoms
  - Constipation, urinary urgency
  - Orthostatic hypotension
  - Depression, anxiety (30-40%)
  - Cognitive impairment, dementia (30% develop)
  - Age of onset typically 55-65 years
  - Prevalence increases with age (1-2% over 65)
  - Physical examination - motor findings
  - Tremor - resting tremor of hands (pill-rolling), jaw, legs
  - Suppressed with voluntary movement
  - Bradykinesia testing - finger tapping, hand movements show progressive slowing and decrement
  - Rigidity - increased tone throughout passive ROM (lead-pipe)
  - Cogwheel rigidity (ratchety) if tremor superimposed
  - Postural instability - pull test (stand behind patient, pull shoulders back, normal takes 1-2 steps, PD takes 3+ steps or falls)
  - Hypomimia (masked facies, reduced facial expression)
  - Hypophonia (soft speech)
  - Micrographia (small handwriting)
  - Gait - shuffling, reduced arm swing, stooped posture, festination (accelerating gait)
  - Glabellar reflex not suppressed (tap forehead, normal habituates, PD does not)
  - Diagnostic criteria (UK Brain Bank)
  - Bradykinesia PLUS one of tremor or rigidity
  - Exclude other causes (normal brain imaging, no atypical features)
  - Supportive criteria - unilateral onset, persistent asymmetry, excellent response to levodopa, progressive course
  - Laboratory and imaging - rule out secondary causes
  - Brain MRI - normal in idiopathic Parkinson's (rules out structural lesions, vascular parkinsonism, NPH)
  - DaTscan (dopamine transporter SPECT imaging) - shows reduced striatal uptake
  - Distinguishes Parkinson's from essential tremor (normal DaTscan in ET)
  - Not routinely needed if classic presentation
  - No specific lab tests diagnose PD
  - TSH (hypothyroidism can mimic), B12, copper/ceruloplasmin (Wilson disease if young)
  - Response to levodopa trial - dramatic improvement supports diagnosis
treatment:
  - No cure, treatment is symptomatic
  - Initiate treatment when symptoms interfere with function
  - Levodopa (with carbidopa) - most effective medication
  - Carbidopa/levodopa (Sinemet) - start 25/100 mg TID, increase as needed
  - Typical dose 25/100 to 25/250 mg TID-QID
  - Carbidopa inhibits peripheral conversion (reduces nausea)
  - Most effective for bradykinesia and rigidity
  - Side effects - nausea, orthostatic hypotension, dyskinesias (involuntary movements with chronic use)
  - Motor fluctuations develop after 5-10 years (wearing-off, on-off phenomena)
  - Dopamine agonists - alternative first-line for younger patients
  - Pramipexole 0.125-1.5 mg TID
  - Ropinirole 0.25-8 mg TID
  - Rotigotine transdermal patch 2-8 mg daily
  - Less effective than levodopa but delay motor fluctuations
  - Side effects - nausea, orthostatic hypotension, impulse control disorders (gambling, hypersexuality), somnolence
  - MAO-B inhibitors - mild benefit, neuroprotective potential
  - Selegiline 5 mg BID or rasagiline 0.5-1 mg daily
  - Inhibit dopamine breakdown
  - Can be used alone (mild disease) or with levodopa
  - COMT inhibitors - extend levodopa duration
  - Entacapone 200 mg with each levodopa dose (Stalevo = carbidopa/levodopa/entacapone combined)
  - For motor fluctuations (wearing-off)
  - Amantadine - mild benefit, reduces dyskinesias
  - 100 mg BID-TID
  - Anticholinergics - tremor benefit (trihexyphenidyl, benztropine)
  - Avoid in elderly (cognitive side effects, urinary retention)
  - Advanced therapies for refractory symptoms
  - Deep brain stimulation (DBS) - surgical implantation of electrodes in STN or GPi
  - For medically refractory symptoms or disabling motor fluctuations
  - Improves tremor, bradykinesia, rigidity
  - Does not help postural instability or dementia
  - Carbidopa/levodopa intestinal gel (Duopa) - continuous infusion via PEG-J tube
  - Apomorphine injections - rescue for off episodes
  - Non-motor symptom management
  - Depression - SSRIs (sertraline, citalopram)
  - Orthostatic hypotension - midodrine, fludrocortisone, increase salt/fluid
  - Constipation - stool softeners, polyethylene glycol
  - Dementia - rivastigmine (cholinesterase inhibitor approved for PD dementia)
  - REM sleep behavior disorder - clonazepam, melatonin
  - Psychosis (hallucinations) - pimavanserin, quetiapine (avoid typical antipsychotics - worsen parkinsonism)
  - Physical therapy, occupational therapy, speech therapy essential
  - Exercise improves motor symptoms and slows progression
  - Prognosis - progressive neurodegenerative disease
  - Average 10-15 years from diagnosis to severe disability
  - Complications - falls, aspiration pneumonia, dementia
clinical_pearls:
  - Second most common neurodegenerative disease after Alzheimer's
  - Cardinal features - resting tremor, bradykinesia (required), rigidity, postural instability
  - Symptoms begin unilaterally and remain asymmetric
  - Excellent response to levodopa supports diagnosis
  - Levodopa most effective but motor fluctuations develop after 5-10 years
  - Younger patients often start with dopamine agonists (delay motor complications)
  - DBS effective for medically refractory symptoms
  - Non-motor symptoms (hyposmia, REM sleep behavior disorder, constipation) may precede motor symptoms
  - Avoid typical antipsychotics (haloperidol, risperidone) - worsen parkinsonism
differentials:
  - Essential tremor (action tremor, no bradykinesia, family history, improved with alcohol)
  - Vascular parkinsonism (stepwise progression, lower body predominant, poor levodopa response, white matter changes on MRI)
  - Drug-induced parkinsonism (antipsychotics, metoclopramide, valproate - resolves when stopped)
  - Progressive supranuclear palsy (PSP) - early falls, vertical gaze palsy, axial rigidity
  - Multiple system atrophy (MSA) - autonomic failure, cerebellar signs, poor levodopa response
  - Lewy body dementia (early dementia, visual hallucinations, fluctuating cognition)
  - Normal pressure hydrocephalus (gait apraxia, urinary incontinence, dementia, enlarged ventricles on CT)
trace:
  - 68-year-old right-handed man presents to neurology with 2-year history of right hand tremor
  - Tremor started in right hand, present at rest
  - Noticed while watching TV, hand has pill-rolling tremor
  - Tremor disappears when he reaches for objects
  - Over past year, right hand movements slower and clumsier
  - Difficulty buttoning shirts, using utensils with right hand
  - Handwriting smaller than before
  - Wife noticed decreased arm swing on right when walking
  - Also reports reduced sense of smell x 3 years, constipation
  - No falls, no cognitive complaints
  - Past medical history - hypertension, hyperlipidemia
  - Family history - no Parkinson's disease
  - Medications - lisinopril, atorvastatin, no antipsychotics
  - Physical exam - alert, oriented, normal cognition
  - Cranial nerves - slight hypomimia (reduced facial expression), otherwise normal
  - Motor - right hand resting tremor 4-6 Hz, pill-rolling quality
  - Tremor suppressed with voluntary movement
  - Bradykinesia testing - finger tapping right hand shows progressive slowing and decrement (abnormal), left hand normal
  - Rigidity - increased tone right upper extremity with cogwheel quality, left normal
  - Asymmetric - right worse than left
  - Gait - reduced right arm swing, slightly stooped posture, no festination
  - Pull test - takes 1 step back (normal, no postural instability yet)
  - Micrographia - handwriting sample shows progressively smaller letters
  - Sensory - intact, hyposmia confirmed (unable to identify coffee smell)
  - Diagnosis - PARKINSON'S DISEASE, early stage
  - Cardinal features present - resting tremor, bradykinesia, rigidity (meets criteria)
  - Unilateral right-sided onset (typical)
  - Hyposmia and constipation (non-motor symptoms)
  - Brain MRI ordered - normal (rules out vascular, structural causes)
  - DaTscan not needed (classic presentation)
  - Treatment discussion
  - Symptoms interfering with function (difficulty with buttons, utensils)
  - Age 68 - reasonable to start levodopa (most effective)
  - Alternatively could start dopamine agonist or MAO-B inhibitor (milder)
  - Patient preference for most effective treatment
  - Started carbidopa/levodopa 25/100 mg TID with meals
  - 2-week follow-up - dramatic improvement
  - Tremor significantly reduced
  - Right hand movements faster, easier to button shirts
  - Excellent response to levodopa (supports diagnosis)
  - Tolerating well, no nausea
  - Continue current dose
  - 6-month follow-up - stable on carbidopa/levodopa 25/100 TID
  - Tremor well-controlled, bradykinesia improved
  - Able to perform all activities of daily living
  - No side effects
  - Encouraged exercise (shown to slow progression)
  - Referred to physical therapy
  - 2-year follow-up - symptoms progressed slightly
  - Left hand now showing mild tremor and bradykinesia (bilateral progression expected)
  - Increased carbidopa/levodopa to 25/250 mg TID
  - Good response
  - 5-year follow-up - developed wearing-off
  - Medication effect lasts only 3-4 hours instead of full day
  - Symptoms return before next dose (end-of-dose wearing-off)
  - Added entacapone 200 mg with each levodopa dose (COMT inhibitor extends duration)
  - Improved wearing-off
  - 8-year follow-up - more advanced disease
  - Bilateral symptoms, some postural instability
  - Dyskinesias developed (involuntary movements when medication peaks)
  - Added amantadine 100 mg BID (reduces dyskinesias)
  - Discussed deep brain stimulation for future if needed
  - 10-year follow-up - managing with medications
  - Carbidopa/levodopa 25/250 mg 5 times daily, entacapone with each dose, amantadine BID
  - Motor fluctuations (on-off) but functional most of day
  - Using walker for safety (postural instability)
  - Engaged in physical therapy, exercise program
  - Mild cognitive slowing but no dementia
  - Outcome - Typical Parkinson's progression managed with medications, maintained good quality of life for 10+ years
