tree_id: NEURO-PARKINSONS-DISEASE
name: Parkinson's Disease
family: Neurology
specialty: Neurology
chief_complaint: Tremor, slowness, and stiffness
description: |
  Progressive neurodegenerative disorder with loss of dopaminergic neurons in substantia nigra. Alpha-synuclein accumulation (Lewy bodies).
  Second most common neurodegenerative disease after Alzheimer. Average age of onset 60 years. Motor and non-motor symptoms.
icd10: G20
urgency: Moderate
workup:
  - Clinical diagnosis - at least 2 of 4 cardinal features: resting tremor, bradykinesia, rigidity, postural instability
  - Bradykinesia (slowness of movement) required for diagnosis plus one other feature
  - Response to levodopa supports diagnosis (dramatic improvement)
  - Assess motor symptoms - UPDRS (Unified Parkinson's Disease Rating Scale)
  - Resting tremor 4-6 Hz, pill-rolling, asymmetric, decreases with movement
  - Cogwheel rigidity - ratchet-like resistance to passive movement
  - Postural instability - pull test (stand behind patient, pull shoulders backward), unable to recover balance
  - Gait - shuffling, reduced arm swing, festination (accelerating forward), freezing
  - Non-motor symptoms - hyposmia, REM sleep behavior disorder (acting out dreams, precedes motor symptoms by years), constipation, depression, anxiety, cognitive impairment
  - Brain MRI normal (rules out other causes like vascular parkinsonism, normal pressure hydrocephalus)
  - DaTscan (dopamine transporter imaging) if diagnosis uncertain - abnormal in Parkinson disease (reduced striatal uptake), normal in essential tremor or drug-induced parkinsonism
treatment:
  - Levodopa/carbidopa most effective medication - start when symptoms interfere with function
  - Immediate-release levodopa/carbidopa 25/100mg TID, titrate up to effective dose (typical 300-800mg/day levodopa)
  - Carbidopa inhibits peripheral conversion to dopamine (reduces nausea)
  - Motor fluctuations and dyskinesias develop after 5-10 years of levodopa (wearing off, on-off phenomenon, peak-dose dyskinesias)
  - Dopamine agonists for younger patients (less than 60-65) to delay levodopa and reduce dyskinesia risk - pramipexole 0.125mg TID, titrate to 1.5-4.5mg/day in 3 doses, or ropinirole 0.25mg TID, titrate to 3-24mg/day
  - Side effects of dopamine agonists - impulse control disorders (gambling, hypersexuality, compulsive shopping), somnolence, hallucinations, edema
  - MAO-B inhibitors mild symptomatic benefit - rasagiline 1mg daily or selegiline 5mg BID
  - COMT inhibitors reduce wearing off - entacapone 200mg with each levodopa dose (prolongs levodopa effect)
  - Amantadine for dyskinesias - 100mg BID or TID
  - Deep brain stimulation (DBS) for advanced disease with motor fluctuations despite medications - subthalamic nucleus (STN) or globus pallidus interna (GPi) targets, improves motor symptoms and reduces medication needs
  - Exercise critical - aerobic exercise, balance training, physical therapy slow progression
  - Treat non-motor symptoms - depression (SSRIs), constipation (polyethylene glycol), orthostatic hypotension (midodrine, fludrocortisone), psychosis (quetiapine, pimavanserin)
clinical_pearls:
  - TRAP mnemonic - Tremor (resting), Rigidity, Akinesia/bradykinesia, Postural instability
  - Asymmetric onset characteristic, remains asymmetric throughout disease
  - Micrographia (small handwriting) early sign
  - Hypophonia (soft voice), masked facies (reduced facial expression), decreased blink rate
  - REM sleep behavior disorder predates motor symptoms by years (prodromal marker)
  - Levodopa-induced dyskinesias choreiform movements, occur at peak dose
  - Avoid antipsychotics (worsen parkinsonism) except quetiapine and clozapine
differentials:
  - Essential tremor
  - Drug-induced parkinsonism
  - Vascular parkinsonism
  - Progressive supranuclear palsy
  - Multiple system atrophy
  - Lewy body dementia
trace:
  - 62-year-old man with right hand tremor at rest x 2 years, progressive slowness, difficulty with buttons → Exam shows 4 Hz resting tremor right hand (pill-rolling), cogwheel rigidity right greater than left, bradykinesia, shuffling gait with reduced right arm swing → Pull test shows postural instability → Diagnose Parkinson disease (tremor, rigidity, bradykinesia, postural instability) → Start levodopa/carbidopa 25/100mg TID → Dramatic improvement in tremor and mobility after 2 weeks → Increase to 25/100mg QID for better coverage → Add rasagiline 1mg daily → Refer to physical therapy for gait and balance training → Recommend regular aerobic exercise → Symptoms well-controlled on medications, continues to work and maintain independence
