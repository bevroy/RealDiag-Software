tree_id: NEURO-PARKINSONS-DISEASE
name: "Parkinson's Disease"
family: Neurology
specialty: Neurology
chief_complaint: Tremor at rest, slowness of movement, stiffness, balance problems
description: Progressive neurodegenerative disorder caused by loss of dopaminergic neurons in substantia nigra pars compacta, leading to classic motor features (tremor, rigidity, bradykinesia, postural instability) and non-motor symptoms
icd10: G20
urgency: routine
workup:
  - Pathophysiology - Degeneration of dopaminergic neurons in substantia nigra pars compacta
  - Loss of dopamine in basal ganglia (particularly striatum) disrupts motor control circuitry
  - Lewy bodies (alpha-synuclein aggregates) in neurons characteristic pathologic finding
  - 'Greater than 60-80% dopamine depletion before motor symptoms manifest'
  - Epidemiology
  - Second most common neurodegenerative disease after Alzheimer (affects 1% of population >60 years)
  - Mean age of onset 60 years, increases with age
  - Male to female ratio 1.5:1
  - 5-10% early-onset (age <50), often genetic
  - Risk factors - Age (strongest), family history (5-10% familial), male sex, pesticide exposure, rural living, well water
  - Protective factors - Caffeine, tobacco (nicotine may be neuroprotective), NSAIDs
  - Genetics - Most cases sporadic, but genetic forms exist
  - SNCA (alpha-synuclein gene) - Autosomal dominant, early onset
  - LRRK2 (leucine-rich repeat kinase 2) - Most common genetic cause, autosomal dominant
  - Parkin, PINK1, DJ-1 - Autosomal recessive, early onset
  - GBA (glucocerebrosidase) - Risk factor, not fully penetrant
  - Clinical presentation - Diagnosis is clinical (no definitive test)
  - Cardinal motor features (bradykinesia required + one other)
  - Bradykinesia - Slowness of movement, REQUIRED for diagnosis
  - Decreased amplitude and speed of repetitive movements (finger tapping, hand opening/closing)
  - Micrographia (small handwriting)
  - Masked facies (hypomimia, decreased facial expression)
  - Decreased blink rate
  - Monotone speech (hypophonia)
  - Shuffling gait, reduced arm swing
  - Resting tremor - "Pill-rolling" (4-6 Hz), asymmetric at onset
  - Present at rest, decreases with action and sleep
  - Often begins in one hand (unilateral), spreads to other side over years
  - Tremor-predominant subtype (better prognosis)
  - 70% have tremor at some point (not universal)
  - Rigidity - Increased muscle tone, lead-pipe or cogwheel quality
  - Cogwheel rigidity (ratchety resistance with passive movement) classic
  - Postural instability - Loss of postural reflexes, falls
  - Late finding (typically after 8+ years), suggests disease progression
  - Pull test (examiner pulls patient backward from shoulders, unable to recover balance in <3 steps)
  - Non-motor symptoms (often precede motor symptoms by years)
  - Hyposmia (loss of smell) - Earliest non-motor symptom (years before motor symptoms)
  - REM sleep behavior disorder (RBD) - Acting out dreams, can precede motor symptoms by decades
  - Constipation - Autonomic dysfunction (slowed GI motility)
  - Depression, anxiety - 40-50% prevalence
  - Cognitive impairment - Executive dysfunction, slowed processing, dementia in advanced stages (30-80%)
  - Orthostatic hypotension - Autonomic dysfunction
  - Urinary urgency, nocturia
  - Seborrheic dermatitis
  - Diagnostic criteria (UK Parkinson Disease Society Brain Bank)
  - Bradykinesia PLUS at least one of - Resting tremor, rigidity, postural instability
  - Supportive features - Unilateral onset, progressive, persistent asymmetry, excellent response to levodopa (>70% improvement), levodopa-induced dyskinesias, clinical course >10 years
  - Exclusion criteria - History of strokes, head injury, neuroleptic use, oculogyric crises, cerebellar signs, early dementia, Babinski sign, tumor or hydrocephalus on imaging
  - Laboratory evaluation
  - No specific lab test for Parkinson disease (diagnosis is clinical)
  - Consider - TSH (hypothyroidism can mimic), ceruloplasmin and 24-hour urine copper (Wilson disease if age <40), HIV, syphilis (rare causes parkinsonism)
  - Genetic testing if early onset (<50 years) or strong family history
  - Imaging
  - MRI brain - Rule out structural causes (stroke, tumor, hydrocephalus, normal pressure hydrocephalus)
  - Normal in Parkinson disease (or age-appropriate changes)
  - DaTscan (dopamine transporter SPECT imaging) - Reduced striatal dopamine transporter uptake
  - Distinguishes Parkinson disease from essential tremor and drug-induced parkinsonism
  - NOT needed for typical cases (clinical diagnosis sufficient)
  - Useful if uncertain diagnosis, atypical features, poor response to treatment
  - Differential diagnosis - Rule out atypical parkinsonism and other causes
  - Essential tremor - Action tremor (vs resting), no bradykinesia or rigidity, improves with alcohol
  - Drug-induced parkinsonism - Neuroleptics (antipsychotics, metoclopramide, prochlorperazine), history of exposure, bilateral and symmetric, reversible with drug discontinuation
  - Vascular parkinsonism - Lower body predominant, step-wise progression, pyramidal signs, MRI shows multiple lacunar infarcts
  - Atypical parkinsonian disorders (20% of cases initially diagnosed as PD)
  - Multiple system atrophy (MSA) - Autonomic failure (early orthostatic hypotension, urinary retention), cerebellar signs, poor levodopa response
  - Progressive supranuclear palsy (PSP) - Vertical gaze palsy (downward gaze first), axial rigidity, early falls, minimal tremor
  - Corticobasal degeneration (CBD) - Asymmetric rigidity, apraxia, alien limb phenomenon, cortical sensory loss
  - Lewy body dementia - Early dementia (within 1 year of motor symptoms), visual hallucinations, fluctuating cognition
  - Normal pressure hydrocephalus (NPH) - Triad of gait disturbance, urinary incontinence, dementia, large ventricles on MRI, improves with CSF drainage
treatment:
  - General principles
  - No cure, treatment is symptomatic (does not slow disease progression)
  - Start medications when symptoms interfere with function or quality of life
  - Tailor to individual patient (age, symptoms, side effects, lifestyle)
  - Younger patients - Delay levodopa if possible (dopamine agonists first) to reduce long-term motor complications
  - Older patients (>70) - Start levodopa (better tolerated, less concern for long-term complications)
  - Dopaminergic therapy - Mainstay of treatment
  - Levodopa (with carbidopa) - GOLD STANDARD, most effective medication
  - Levodopa crosses BBB and converts to dopamine (carbidopa prevents peripheral conversion, reduces nausea)
  - Start 25/100 mg TID, titrate to effect (typical dose 300-1000 mg/day divided TID-QID)
  - Best for bradykinesia and rigidity, less effective for tremor and postural instability
  - Side effects - Nausea (give with food, or add domperidone), orthostatic hypotension, hallucinations (dose-related)
  - Motor complications (develop over years)
  - Wearing off - Shorter duration of benefit, symptoms return before next dose (increase frequency, add COMT inhibitor)
  - Dyskinesias - Involuntary movements (chorea, dystonia) at peak dose (reduce dose, use extended-release formulation)
  - On-off fluctuations - Unpredictable motor fluctuations
  - Dopamine agonists - Pramipexole, ropinirole, rotigotine (patch)
  - Mimic dopamine at receptors, longer half-life than levodopa (smoother symptom control)
  - Less effective than levodopa but delay motor complications
  - First-line for younger patients (<60-70 years) to delay levodopa
  - Side effects - Nausea, orthostatic hypotension, hallucinations, impulse control disorders (gambling, hypersexuality, compulsive shopping), sleep attacks
  - MAO-B inhibitors - Rasagiline, selegiline
  - Inhibit dopamine breakdown, increase dopamine availability
  - Mild symptomatic benefit, can be used as monotherapy in early disease or adjunct to levodopa
  - Side effects - Insomnia (take in morning), nausea
  - COMT inhibitors - Entacapone, tolcapone
  - Prolong levodopa effect (reduce wearing off)
  - Always given WITH levodopa (no effect alone)
  - Entacapone preferred (tolcapone has hepatotoxicity risk, requires monitoring)
  - Side effects - Diarrhea, urine discoloration (orange), worsens dyskinesias
  - Amantadine - NMDA antagonist, increases dopamine release
  - Mild symptomatic benefit in early disease
  - Treats levodopa-induced dyskinesias (extended-release formulation)
  - Side effects - Livedo reticularis, peripheral edema, confusion (elderly)
  - Anticholinergics - Trihexyphenidyl, benztropine
  - Reduce tremor, less effect on bradykinesia
  - Avoid in elderly (cognitive side effects, hallucinations, urinary retention)
  - Limited use (dopaminergic agents preferred)
  - Non-motor symptom management
  - Depression - SSRIs (sertraline, citalopram), SNRIs (venlafaxine)
  - Psychosis - Reduce or stop offending medications (anticholinergics, amantadine, dopamine agonists), pimavanserin (5-HT2A inverse agonist, does not worsen motor symptoms), quetiapine low dose (off-label)
  - Avoid typical antipsychotics and risperidone (worsen parkinsonism)
  - Dementia - Rivastigmine (cholinesterase inhibitor), memantine
  - Orthostatic hypotension - Increase salt and fluid intake, compression stockings, midodrine, fludrocortisone
  - Constipation - Fiber, polyethylene glycol, docusate
  - REM sleep behavior disorder - Melatonin, clonazepam
  - Surgical therapy
  - Deep brain stimulation (DBS) - GOLD STANDARD surgical treatment
  - Bilateral stimulation of subthalamic nucleus (STN) or globus pallidus internus (GPi)
  - Indications - Advanced disease with motor fluctuations despite optimal medical therapy, disabling tremor, levodopa-responsive symptoms, no major cognitive impairment
  - Benefits - Reduces motor fluctuations, decreases medication requirements, improves quality of life
  - Does NOT help levodopa-unresponsive symptoms (postural instability, speech, swallowing)
  - Complications - Surgical (hemorrhage, infection <5%), hardware malfunction, speech/cognitive changes
  - Multidisciplinary care
  - Physical therapy - Gait training, balance exercises, fall prevention
  - Occupational therapy - ADL training, adaptive equipment
  - Speech therapy - Dysarthria, hypophonia (LSVT LOUD program), dysphagia
  - Exercise - Regular aerobic and resistance exercise improves motor function and quality of life
  - Nutrition - High-protein meals can compete with levodopa absorption (separate by 30-60 minutes)
  - Prognosis
  - Variable progression (faster in older age of onset, rigid-akinetic subtype)
  - Tremor-predominant subtype has slower progression and better prognosis
  - Median time to postural instability 8 years, to dementia 10+ years
  - Life expectancy slightly reduced (mortality ratio 1.5-2x general population)
clinical_pearls:
  - Diagnosis requires bradykinesia plus one of resting tremor, rigidity, or postural instability
  - Asymmetric onset and excellent response to levodopa support diagnosis
  - Hyposmia and REM sleep behavior disorder often precede motor symptoms by years
  - Levodopa is most effective medication, start when symptoms interfere with function
  - Younger patients - delay levodopa with dopamine agonists to reduce motor complications
  - DBS is effective for advanced disease with motor fluctuations despite optimal medical therapy
  - Avoid typical antipsychotics (worsen parkinsonism), use pimavanserin or quetiapine for psychosis
differentials:
  - NEURO-ESSENTIAL-TREMOR
  - NEURO-NORMAL-PRESSURE-HYDROCEPHALUS
  - NEURO-DEMENTIA-LEWY-BODY
  - PSYCH-DRUG-INDUCED-MOVEMENT-DISORDER
trace:
  - Resting tremor, bradykinesia, rigidity, postural instability (asymmetric onset)
  - Clinical diagnosis (no specific test), MRI to rule out structural causes
  - Levodopa most effective medication (start when symptoms interfere with function)
  - Dopamine agonists first-line in younger patients (delay motor complications)
  - Deep brain stimulation for advanced disease with motor fluctuations
