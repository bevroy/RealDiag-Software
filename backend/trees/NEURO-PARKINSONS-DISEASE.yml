tree_id: NEURO-PARKINSONS-DISEASE
name: Parkinson Disease
family: Neurologic
specialty: Neurology
chief_complaint: Tremor and slowed movement
description: Progressive neurodegenerative disorder from loss of dopaminergic neurons in substantia nigra causing motor and non-motor symptoms

icd10: G20

urgency: routine

workup:
  - Clinical diagnosis based on motor features: bradykinesia (slowness of movement) required plus at least one of resting tremor or rigidity
  - Bradykinesia: slowness initiating movement, decreased amplitude/speed with repetitive movements (finger tapping, hand opening/closing), decreased arm swing when walking, micrographia (small handwriting), hypomimia (masked facies)
  - Resting tremor: 4-6 Hz pill-rolling tremor (thumb and fingers), present at rest, decreases with action, often asymmetric/unilateral onset
  - Rigidity: increased muscle tone throughout range of motion (lead-pipe rigidity), cogwheel rigidity (ratchety) when combined with tremor
  - Postural instability: impaired balance and falls (late feature, not present early)
  - Cardinal features: tremor, rigidity, bradykinesia, postural instability (mnemonic TRAP)
  - Non-motor symptoms: hyposmia (reduced sense of smell, often precedes motor symptoms), REM sleep behavior disorder (acting out dreams), constipation, autonomic dysfunction (orthostatic hypotension, urinary urgency), depression, anxiety, cognitive impairment (dementia late)
  - Exam: resting tremor asymmetric, cogwheel rigidity, bradykinesia with rapid alternating movements, shuffling gait with reduced arm swing, difficulty with gait initiation, postural instability (pull test positive), hypomimia
  - Response to levodopa: dramatic improvement supports diagnosis (if no response question diagnosis)
  - Neuroimaging: brain MRI normal in Parkinson disease (excludes structural lesions, vascular parkinsonism), DaTscan (dopamine transporter imaging) shows reduced uptake in striatum (differentiates essential tremor from Parkinson)
  - No specific laboratory tests for diagnosis

treatment:
  - No cure, treatment symptomatic to improve quality of life
  - Initiate therapy when symptoms interfere with function (no benefit to early treatment)
  - Levodopa plus carbidopa most effective: carbidopa/levodopa 25/100 mg TID initially, titrate to symptom control (typical 25/100 or 25/250 mg TID-QID), carbidopa inhibits peripheral conversion of levodopa (reduces nausea), take 30 minutes before meals or 1 hour after (protein interferes with absorption), side effects nausea (usually resolves), dyskinesias (involuntary movements from long-term use), motor fluctuations (wearing off before next dose, on-off phenomena)
  - Dopamine agonists alternative initial therapy: pramipexole 0.375-4.5 mg TID or ropinirole 1-8 mg TID, less effective than levodopa but delay motor complications (dyskinesias), side effects somnolence, orthostatic hypotension, impulse control disorders (gambling, hypersexuality, compulsive shopping), hallucinations
  - MAO-B inhibitors: rasagiline 0.5-1 mg daily or selegiline 5 mg BID, mild symptomatic benefit, well-tolerated, can use as monotherapy early or adjunct to levodopa
  - COMT inhibitors: entacapone 200 mg with each levodopa dose (extends levodopa half-life), for motor fluctuations (wearing off), available as combination pill (carbidopa/levodopa/entacapone Stalevo)
  - Anticholinergics: trihexyphenidyl 1-2 mg TID, for tremor-predominant disease in younger patients (less than 70), avoid in elderly (cognitive impairment risk)
  - Amantadine: for dyskinesias (involuntary movements from levodopa), 100 mg BID-TID
  - Deep brain stimulation (DBS): surgical treatment for advanced disease with motor fluctuations or tremor refractory to medications, electrodes implanted in subthalamic nucleus or globus pallidus internus, dramatically improves motor symptoms and reduces medication needs, not for dementia/severe postural instability
  - Non-motor symptoms treatment: depression (SSRIs), constipation (polyethylene glycol, fiber), orthostatic hypotension (fludrocortisone, midodrine), REM sleep behavior disorder (clonazepam, melatonin)
  - Exercise important: regular aerobic exercise improves gait, balance, and motor function
  - Multidisciplinary care: physical therapy (gait training, fall prevention), occupational therapy (ADL adaptations), speech therapy (hypophonia, dysphagia)

clinical_pearls:
  - Diagnosis requires bradykinesia plus tremor or rigidity, resting tremor classic (pill-rolling)
  - Asymmetric onset typical (symptoms start one side)
  - Non-motor symptoms common (hyposmia, REM sleep behavior disorder, constipation, depression)
  - Levodopa most effective treatment, dramatic response supports diagnosis
  - Motor complications (dyskinesias, wearing off) develop with long-term levodopa use
  - Dopamine agonists alternative initial therapy in younger patients (delay motor complications)
  - DBS for advanced disease with motor fluctuations or refractory tremor

differentials:
  - Essential tremor (bilateral action tremor, no bradykinesia/rigidity, family history, improves with alcohol, no response to levodopa)
  - Vascular parkinsonism (multiple lacunar infarcts, lower-body predominant rigidity, gait difficulty, stepwise progression, MRI shows small vessel disease)
  - Drug-induced parkinsonism (antipsychotics, metoclopramide, valproate cause reversible parkinsonism, symmetric, no resting tremor)
  - Multiple system atrophy (parkinsonism plus autonomic failure plus cerebellar signs, poor levodopa response)

trace:
  - 64-year-old man presents with 18 months progressive right hand tremor, slowness buttoning shirts/typing, wife noticed decreased arm swing right side when walking, handwriting smaller
  - Denies falls, no cognitive changes, notes reduced sense of smell x 2 years (did not mention until asked), occasional constipation
  - Medications: no antipsychotics or other drugs causing parkinsonism
  - Exam: resting tremor right hand (4-5 Hz pill-rolling), decreases with reaching, cogwheel rigidity right arm greater than left, bradykinesia with rapid finger tapping and hand opening/closing right side (decreased amplitude/speed), hypomimia (masked facies), normal gait but reduced right arm swing, postural reflexes intact (no pull test abnormality)
  - Brain MRI: normal (no structural lesions, no vascular disease)
  - Diagnosis: Parkinson disease (bradykinesia plus resting tremor plus rigidity, asymmetric onset right side)
  - Counseling: progressive neurodegenerative disease, no cure but effective symptomatic treatments, regular exercise beneficial
  - Symptoms mild, interfering with typing and buttoning (functional impairment), decision to start therapy
  - Started carbidopa/levodopa 25/100 mg TID (take 30 minutes before meals)
  - 2 weeks: dramatic improvement in tremor and bradykinesia, able to type and button shirts normally, continues levodopa
  - 3 months: sustained excellent response to levodopa, confirms Parkinson disease diagnosis, tremor 90 percent improved, bradykinesia markedly better, handwriting normal size
  - Referred to physical therapy for gait training and balance exercises, encouraged regular aerobic exercise (walking, cycling)
  - 1 year: remains well-controlled on carbidopa/levodopa 25/100 mg TID, no motor complications (dyskinesias or wearing off), continues active lifestyle with daily exercise
  - 3 years: still good control but starting to notice symptoms return 30 minutes before next levodopa dose (wearing off), increased carbidopa/levodopa to QID dosing (every 4 hours while awake), added entacapone 200 mg with each dose (extends levodopa duration)
  - 5 years: well-controlled on combination therapy, mild dyskinesias at peak levodopa dose (acceptable to patient), continues active with good quality of life
