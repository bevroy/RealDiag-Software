tree_id: DERM-SKIN-LESION-EVALUATION
name: Skin Lesion / Mole Evaluation (Encounter)
family: Dermatology
specialty: Dermatology/Primary Care
chief_complaint: Changing mole or concerning skin lesion
description: Systematic evaluation of pigmented and non-pigmented skin lesions to identify benign vs malignant features. ABCDE criteria for melanoma screening. Dermoscopy enhances diagnostic accuracy. Biopsy indicated for suspicious lesions.
icd10: D48.5
snomed: 400210000
presentations:
  - New or changing mole
  - Irregular borders or color
  - Asymmetric lesion
  - Diameter greater than 6 mm
  - Evolving (changing) lesion
  - Bleeding or crusting lesion
  - Non-healing sore
  - Patient or family concern
urgency: routine
referrals:
  emergency:
    - Rapidly growing aggressive tumor
  urgent:
    - Suspected melanoma (ABCDE criteria, ugly duckling sign)
    - Suspected non-melanoma skin cancer
    - Symptomatic or bleeding lesion
  routine:
    - Routine skin cancer screening
    - Atypical nevi surveillance
    - Family history of melanoma

workup:
  - Comprehensive skin examination - systematic head-to-toe inspection
  - History
  - Chief concern - which lesion prompted visit
  - Duration - longstanding vs new
  - Changes - size, shape, color, symptoms
  - Symptoms - bleeding, itching, pain, crusting
  - Sun exposure history - childhood sunburns, tanning bed use, occupational exposure
  - Personal history - prior skin cancers, dysplastic nevi, immunosuppression
  - Family history - melanoma, dysplastic nevus syndrome, skin cancers
  - Fitzpatrick skin type - I (always burns) to VI (never burns)
  - ABCDE criteria for melanoma - red flags
  - A - Asymmetry: one half different from other half
  - B - Border irregularity: scalloped, notched, or ill-defined borders
  - C - Color variegation: multiple colors (brown, black, red, white, blue)
  - D - Diameter: greater than 6 mm (pencil eraser size)
  - E - Evolving: changing in size, shape, color, or symptoms
  - Additional concerning features
  - Ugly duckling sign - lesion that looks different from patient's other nevi
  - Amelanotic (non-pigmented) lesion that's changing or symptomatic
  - Nodular melanoma - rapidly growing dark nodule, may lack ABCDE features
  - New pigmented lesion after age 40
  - Lesion on chronically sun-damaged skin
  - Dermoscopy - handheld magnification device (10x), enhances diagnostic accuracy
  - Improves sensitivity and specificity for melanoma detection
  - Allows visualization of subsurface structures, pigment patterns
  - Pattern analysis - helps differentiate benign from malignant
  - Benign nevus patterns - network, globules, homogeneous
  - Melanoma patterns - atypical network, blue-white veil, regression structures, irregular dots, pseudopods
  - BCC - arborizing vessels, leaf-like structures, blue-gray ovoid nests, ulceration
  - SCC/AK - white circles, strawberry pattern, keratin, vessels
  - Types of lesions
  - Benign pigmented lesions
  - Benign melanocytic nevus (common mole) - symmetricround/oval, uniform color (tan/brown), well-defined border, less than 6 mm, stable
  - Seborrheic keratosis - "stuck on" waxy papule, brown/black, horn pseudocysts on dermoscopy
  - Solar lentigo (age spot, liver spot) - flat, well-demarcated, uniform tan/brown, on sun-exposed areas
  - Dermatofibroma - firm papule, dimples with pinching, commonly on legs
  - Cherry angioma - bright red papule, vascular
  - Malignant pigmented lesions
  - Melanoma - ABCDE features, ugly duckling, irregular, evolving
  - Subtypes - superficial spreading (most common), nodular (aggressive, vertical growth), lentigo maligna (face, elderly), acral lentiginous (palms, soles, nails, darker-skinned)
  - Non-pigmented malignancies
  - Basal cell carcinoma (BCC) - pearly papule or nodule, telangiectasias, rolled border, central dell or ulceration, on sun-exposed areas
  - Squamous cell carcinoma (SCC) - scaly, hyperkeratotic papule or nodule, indurated, ulcerated, on sun-damaged skin
  - Actinic keratosis (AK) - rough scaly papule, precancerous
  - Physical examination
  - Inspect lesion of concern - ABCDE criteria, dermoscopy
  - Measure size - ruler, photograph for documentation
  - Palpate - flat vs raised, soft vs firm, mobile vs fixed
  - Full-body skin examination - evaluate all skin including scalp, between toes, nails, genitals, perianal area
  - Document total body nevus count (greater than 50 nevi increases melanoma risk)
  - Look for atypical nevi - larger than 6 mm, irregular borders, color variegation, "fried egg" appearance
  - Ugly duckling sign - lesion that stands out as different
  - Lymph node examination - regional nodes if melanoma suspected
  - Biopsy indications
  - Any lesion concerning for melanoma (ABCDE, ugly duckling, evolving)
  - Non-healing lesion, bleeding, symptomatic
  - Uncertain diagnosis
  - Patient or physician concern
  - Biopsy technique
  - Excisional biopsy with narrow margins (1-2 mm) - preferred for suspected melanoma
  - Removes entire lesion for histologic diagnosis and Breslow depth
  - Allows definitive diagnosis and staging
  - Punch biopsy - for lesions too large for excision, sample deepest/darkest area
  - Shave biopsy - acceptable for suspected BCC or SCC, avoid for melanoma (may not assess depth)
  - NEVER shave biopsy if melanoma suspected - must have full depth
treatment:
  - Treatment depends on biopsy results
  - Benign lesions - observation, reassurance, removal if symptomatic or cosmetic concern
  - Malignant melanoma - wide local excision with margins based on Breslow depth, sentinel lymph node biopsy if indicated, staging, adjuvant therapy if high-risk
  - Basal cell carcinoma - excision, Mohs surgery for high-risk sites (face), topical therapy for superficial BCC
  - Squamous cell carcinoma - excision with 4-6 mm margins, Mohs for high-risk
  - Atypical/dysplastic nevus - excisional biopsy with clear margins, surveillance every 6-12 months
  - Prevention and screening
  - Sun protection - SPF 30+ broad-spectrum sunscreen, protective clothing, avoid peak hours, no tanning beds
  - Self-skin examination - monthly, check all areas including back, scalp, between toes
  - Professional full-body skin examination
  - Average risk - baseline at age 40, then annually or as indicated
  - High risk (atypical nevi, family history, personal history) - every 6-12 months
  - Very high risk (dysplastic nevus syndrome, multiple melanomas) - every 3-6 months
  - Photography - baseline total body photography for high-risk patients, serial imaging to detect changes
clinical_pearls:
  - ABCDE criteria for melanoma - Asymmetry, Border, Color, Diameter, Evolving
  - Ugly duckling sign - lesion that looks different from patient's other nevi highly suspicious
  - Dermoscopy improves diagnostic accuracy - essential tool for skin lesion evaluation
  - Excisional biopsy preferred for suspected melanoma - provides full depth for Breslow measurement
  - Never shave biopsy suspected melanoma - may compromise staging
  - Nodular melanoma can lack ABCDE features - rapidly growing dark nodule, think melanoma
  - Amelanotic melanoma exists - pink or red lesion without pigment, often missed
  - Seborrheic keratoses benign, very common with age - "stuck on" waxy appearance, no treatment needed unless symptomatic
  - BCC most common skin cancer - pearly papule with telangiectasias, rarely metastasizes
  - SCC second most common - scaly hyperkeratotic, can metastasize if high-risk features
  - Greater than 50 nevi increases melanoma risk 5-fold
  - Atypical mole syndrome (dysplastic nevi) - precursor to melanoma, requires surveillance
  - Five or more blistering sunburns doubles melanoma risk
  - Melanoma incidence increasing - sun protection and early detection critical
differentials:
  - Benign - melanocytic nevus, seborrheic keratosis, lentigo, dermatofibroma, hemangioma
  - Premalignant - dysplastic nevus, actinic keratosis
  - Malignant - melanoma, basal cell carcinoma, squamous cell carcinoma, Merkel cell carcinoma
trace:
  - 52-year-old woman presents for skin check after noticing changing mole on left shoulder
  - Mole present for years but noticed darkening and irregular border over past 6 months
  - No bleeding, no itching, no pain
  - History of multiple severe sunburns in teens and 20s, used tanning beds in college
  - No personal history of skin cancer
  - Father had melanoma excised from back at age 58
  - Fitzpatrick skin type II (fair skin, burns easily)
  - Physical examination - 8 mm irregularly pigmented macule on left posterior shoulder, asymmetric, irregular scalloped border, color variegation (dark brown, black, tan areas), "ugly duckling" appears different from other nevi
  - Full-body skin exam - approximately 40 total nevi, two other nevi on trunk 6-7 mm with slight irregularity (atypical nevi)
  - No palpable lymphadenopathy
  - Dermoscopy of left shoulder lesion - atypical pigment network, irregular dots and globules, blue-white veil - suspicious for melanoma
  - Clinical diagnosis - suspicious pigmented lesion, rule out melanoma
  - Treatment plan - excisional biopsy with 2 mm clinical margins under local anesthesia
  - Pathology - melanoma in situ (intraepidermal melanoma, no invasion), margins positive
  - Re-excision with 5 mm margins (standard for melanoma in situ)
  - Final pathology - clear margins, no residual melanoma
  - Staged as melanoma in situ (Tis N0 M0, Stage 0)
  - No sentinel lymph node biopsy needed (no invasion)
  - Surveillance plan - full-body skin exam every 6 months x 5 years given personal and family history
  - Sun protection counseling
  - Excisional biopsy of two atypical nevi on trunk - both dysplastic nevi with moderate atypia, margins clear
  - Diagnosis - dysplastic nevus syndrome
  - Continues surveillance every 6 months

citations:
  - AAD (American Academy of Dermatology) Guidelines for Melanoma Screening
  - NCCN (National Comprehensive Cancer Network) Melanoma Guidelines
  - Dermoscopy Guidelines
  - UpToDate - Dermatology
