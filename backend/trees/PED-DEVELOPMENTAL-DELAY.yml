tree_id: PED-DEVELOPMENTAL-DELAY
name: Developmental Delay (Pediatric)
family: pediatrics
specialty: Pediatrics/Developmental-Behavioral Pediatrics/Neurology
icd10: F88
snomed: 229737002
urgency: []
homeopathy: []
presentations:
  - Delay in achieving developmental milestones
  - Gross motor delay (sitting, walking, running)
  - Fine motor delay (grasping, drawing, self-feeding)
  - Speech and language delay (babbling, first words, sentences)
  - Social/emotional delay (smiling, stranger anxiety, interactive play)
  - Cognitive delay (problem-solving, learning)
  - Parental concern about development
  - Loss of previously acquired skills (RED FLAG - regression)
  - Global developmental delay (≥2 domains affected)
workup:
  - Developmental screening (standardized tools at every well-child visit)
  - Ages and Stages Questionnaires (ASQ) - parent-completed
  - Parents' Evaluation of Developmental Status (PEDS) - parent-reported concerns
  - Survey of Wellbeing of Young Children (SWYC)
  - Formal developmental assessment if screening abnormal
  - Bayley Scales of Infant Development
  - Denver Developmental Screening Test
  - Mullen Scales of Early Learning
  - Clinical history (comprehensive)
  - Prenatal history (infections, medications, substance use, complications)
  - Birth history (prematurity, birth weight, APGAR scores, NICU stay, hypoxia)
  - Postnatal history (neonatal jaundice, seizures, feeding difficulties)
  - Medical history (chronic illnesses, hospitalizations, seizures, hearing/vision)
  - Family history (developmental delay, intellectual disability, genetic conditions, consanguinity)
  - Social history (home environment, lead exposure, neglect/abuse, parental education)
  - Current developmental skills in all domains
  - Gross motor: rolling, sitting, crawling, walking, running, jumping
  - Fine motor: grasping, transferring objects, pincer grasp, drawing, writing
  - Language: cooing, babbling, first words, word combinations, sentences, comprehension
  - Social-emotional: social smile, stranger anxiety, parallel/interactive play, self-care
  - Cognitive: object permanence, problem-solving, attention, learning
  - Physical examination (comprehensive)
  - Growth parameters (head circumference - microcephaly/macrocephaly)
  - Dysmorphic features (genetic syndromes)
  - Skin examination (neurocutaneous disorders - café-au-lait spots, ash-leaf spots)
  - Neurological examination (tone, reflexes, asymmetry, coordination)
  - Hearing and vision screening
  - Laboratory and diagnostic testing (selective based on history/exam)
  - Lead level (environmental exposure)
  - Thyroid function (TSH, T4) - congenital hypothyroidism
  - Metabolic screening (amino acids, organic acids if concern for inborn error)
  - Chromosomal microarray (first-tier genetic test for unexplained developmental delay)
  - Fragile X testing (especially boys with autism or intellectual disability)
  - Brain MRI (if abnormal neurologic exam, microcephaly/macrocephaly, regression, seizures)
  - EEG (if concern for seizures or regression)
  - Hearing evaluation (audiology) - MANDATORY for speech delay
  - Vision evaluation (ophthalmology) if concern
  - Red flags requiring urgent evaluation
  - Loss of developmental milestones (regression) - neurodegenerative disease or autism
  - Seizures
  - Microcephaly or macrocephaly
  - Asymmetric tone or reflexes (focal neurologic deficit)
  - No babbling by 12 months
  - No single words by 16 months or 2-word phrases by 24 months
  - Loss of language or social skills at any age (autism spectrum disorder)
treatment:
  - Early intervention services (birth to 3 years) - MOST IMPORTANT
  - Federally mandated under IDEA (Individuals with Disabilities Education Act)
  - FREE services through state programs
  - Multidisciplinary team: physical therapy, occupational therapy, speech therapy, special education
  - Home-based or center-based services
  - Individualized Family Service Plan (IFSP)
  - Contact state early intervention program for evaluation
  - Earlier intervention = better outcomes (neuroplasticity greatest in first 3 years)
  - Special education services (age 3+)
  - Individualized Education Program (IEP) through school district
  - Speech-language therapy
  - For speech and language delays
  - Addresses expressive and receptive language, articulation, pragmatics
  - Critical window in first 3-5 years
  - Physical therapy
  - For gross motor delays
  - Improves strength, balance, coordination, mobility
  - Occupational therapy
  - For fine motor delays and adaptive skills
  - Improves hand skills, self-care, sensory processing
  - Applied Behavior Analysis (ABA) therapy
  - For autism spectrum disorder
  - Intensive behavioral intervention (20-40 hours/week)
  - Most evidence for improving outcomes in autism
  - Medical management of underlying causes
  - Treat hypothyroidism, correct vision/hearing impairments
  - Antiepileptic drugs if seizures
  - Genetic counseling if genetic syndrome identified
  - Family support and education
  - Parent training and support groups
  - Connect with advocacy organizations (e.g., The Arc, Family Voices)
  - Respite care services
  - Financial assistance programs (SSI, Medicaid waiver)
  - Monitoring and follow-up
  - Reassess development every 3-6 months
  - Coordinate care between primary care, specialists, therapists, educators
  - Monitor for comorbidities (ADHD, anxiety, behavioral problems)
clinical_pearls:
  - 'Developmental surveillance at EVERY well-child visit - standardized screening at 9, 18, and 24-30 months per AAP'
  - 'Global developmental delay = delay in ≥2 domains (motor, speech, social, cognitive) - more likely underlying etiology than isolated delay'
  - 'Regression (loss of skills) is RED FLAG - requires urgent evaluation for neurodegenerative disease, autism, or seizure disorder'
  - 'Early intervention (birth-3 years) is most effective due to neuroplasticity - refer early, don''t "wait and see"'
  - 'Hearing loss most common cause of isolated speech delay - audiology evaluation MANDATORY before speech therapy'
  - 'Chromosomal microarray is first-tier genetic test (yield 10-15%) for unexplained developmental delay'
  - 'Boys 4x more likely than girls to have developmental delay (X-linked conditions, autism)'
  - 'Prematurity major risk factor - correct age for prematurity until 24 months (e.g., 12-month-old born 2 months early = 10-month developmental expectations)'
  - 'Parental concern about development has 70-80% sensitivity - take seriously and screen formally'
  - 'Most children with developmental delay (>50%) have normal brain MRI - MRI indicated only if red flags'
referrals:
  - Early intervention services (birth-3 years) - REFER ALL children with developmental concerns
  - School district evaluation (age 3+) for special education services
  - Developmental-behavioral pediatrics for comprehensive developmental assessment
  - Audiology for hearing evaluation (MANDATORY for speech delay)
  - Ophthalmology if vision concerns
  - Genetics for dysmorphic features, multiple congenital anomalies, family history, or unexplained global delay
  - Neurology if seizures, regression, abnormal neurologic exam, or microcephaly/macrocephaly
  - Child psychiatry if autism spectrum disorder or behavioral concerns
differentials:
  - Normal variant (constitutional delay, familial pattern, within 2 SD of mean)
  - Prematurity (correct age for gestational age until 24 months)
  - Global developmental delay (≥2 domains - genetic syndromes, cerebral palsy, metabolic disorders)
  - Isolated gross motor delay (muscular dystrophy, cerebral palsy, spinal muscular atrophy)
  - Isolated speech/language delay (hearing loss, oral motor dysfunction, autism spectrum disorder)
  - Autism spectrum disorder (social communication deficits, restricted/repetitive behaviors, regression)
  - Intellectual disability (cognitive delays, adaptive functioning impairment)
  - Cerebral palsy (non-progressive motor disorder, abnormal tone/reflexes, often history birth injury)
  - Hearing or vision impairment (sensory-based delay)
  - Environmental deprivation or neglect (lack of stimulation, psychosocial factors)
  - Genetic syndromes (Down syndrome, Fragile X, chromosomal abnormalities, single-gene disorders)
  - Metabolic disorders (phenylketonuria, hypothyroidism, mitochondrial disorders)
  - Neurodegenerative disorders (if regression - Rett syndrome, leukodystrophies)
