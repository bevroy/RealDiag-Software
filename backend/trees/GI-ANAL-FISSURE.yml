tree_id: GI-ANAL-FISSURE
name: Anal Fissure
family: gastroenterology
specialty: Gastroenterology
icd10: K60.2
snomed: 17319000
urgency: []
homeopathy: []
presentations:
  - Sharp, tearing pain during and after bowel movements
  - Bright red blood on toilet paper or stool surface
  - Visible tear or crack in anal skin
  - Anal spasm and discomfort lasting hours after defecation
  - Reluctance to have bowel movements due to pain
  - Constipation (often both cause and consequence)
  - Sentinel skin tag at distal end of fissure
  - Chronic fissure with exposed internal anal sphincter fibers
  - Most commonly located in posterior midline (90%)
workup:
  - Clinical diagnosis based on history and visual inspection
  - Gentle external examination - visualize tear in anoderm
  - Digital rectal exam often deferred in acute phase (too painful)
  - Anoscopy only if diagnosis uncertain or to rule out other pathology
  - Assess for underlying causes (chronic constipation, inflammatory bowel disease)
  - Red flags requiring further workup (lateral fissures, multiple fissures, atypical appearance)
  - Consider colonoscopy or flexible sigmoidoscopy if atypical features or IBD suspected
  - HIV testing if immunocompromised or atypical presentation
treatment:
  - Conservative management (first-line for acute fissures <6 weeks)
  - High-fiber diet (25-30 g/day) and increased fluid intake
  - Fiber supplementation (psyllium, methylcellulose) to soften stools
  - Sitz baths in warm water 10-20 minutes 2-3 times daily
  - Topical anesthetic (lidocaine gel) before bowel movements for pain relief
  - Stool softeners (docusate sodium) or osmotic laxatives (polyethylene glycol)
  - Medical therapy for chronic fissures (>6 weeks)
  - Nitroglycerin 0.2-0.4% ointment applied topically BID x 6-8 weeks (headache common)
  - Diltiazem 2% ointment applied topically BID x 6-8 weeks (better tolerated, fewer side effects)
  - Botulinum toxin injection into internal anal sphincter (if medical therapy fails)
  - Surgical referral - lateral internal sphincterotomy (gold standard for refractory cases)
  - Avoid straining and prolonged sitting on toilet
clinical_pearls:
  - "Acute fissures (<6 weeks) heal spontaneously in 50% of cases with conservative management"
  - "Chronic fissures (>6 weeks) have <50% healing rate without medical or surgical intervention"
  - "Posterior midline location (90%) due to relatively poor blood supply in that area"
  - "Lateral or multiple fissures suggest Crohn's disease, tuberculosis, syphilis, HIV, or malignancy"
  - "Classic triad: pain during defecation, bright red blood, sentinel skin tag"
  - "Nitroglycerin and diltiazem work by relaxing internal anal sphincter, improving blood flow"
  - "Lateral internal sphincterotomy is 95% effective but risk of minor incontinence (5-10%)"
  - "Botox injection avoids permanent sphincter damage but may need repeat injections"
referrals:
  - Colorectal surgery for chronic fissures refractory to medical management
  - Gastroenterology if concern for inflammatory bowel disease
  - Consider surgical consultation if atypical features or recurrent fissures
differentials:
  - Hemorrhoids (painless bleeding, prolapse, no tear visible)
  - Perianal abscess (tender fluctuant mass, fever, systemic symptoms)
  - Anal fistula (chronic drainage, opening visible, history of abscess)
  - Proctitis (inflammatory bowel disease, sexually transmitted infections)
  - Anal cancer (indurated ulcer, irregular borders, lymphadenopathy)
  - Crohn's disease (lateral fissures, skip lesions, systemic symptoms)
