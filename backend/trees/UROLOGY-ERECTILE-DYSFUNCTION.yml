tree_id: UROLOGY-ERECTILE-DYSFUNCTION
name: Erectile Dysfunction
family: Urology
specialty: Urology
chief_complaint: Difficulty achieving or maintaining erection
description: |
  Inability to achieve or maintain erection sufficient for satisfactory sexual performance. Affects 40% of men at age 40, 70% at age 70.
  Multifactorial causes - vascular (most common), neurogenic, hormonal, psychogenic, medication-induced. Often first sign of cardiovascular disease.
icd10: N52.9
snomed: 397803000
presentations:
  - Inability to achieve or maintain erection
  - Reduced rigidity
  - Gradual onset (vascular) vs sudden (psychogenic)
  - Libido usually preserved
  - Risk factors: DM, HTN, CAD, smoking
urgency: Low
workup:
  - Comprehensive sexual, medical, and psychosocial history - onset (gradual suggests organic, sudden suggests psychogenic), morning erections present (suggests psychogenic)
  - Medication review - antihypertensives (beta-blockers, thiazides), antidepressants (SSRIs), antipsychotics, finasteride
  - Physical exam - secondary sex characteristics, penile abnormalities (Peyronie disease), testicular size, prostate, peripheral pulses, neurologic exam
  - Laboratory testing - fasting glucose or HbA1c (diabetes), lipid panel (cardiovascular risk), morning testosterone (8-10 AM), if low repeat with LH, FSH, prolactin
  - Additional testing if indicated - TSH (hypothyroidism), PSA if considering testosterone replacement in older men
  - Nocturnal penile tumescence testing rarely needed (differentiates organic from psychogenic)
  - Vascular studies (penile Doppler ultrasound) if considering vascular surgery or young patient with trauma history
treatment:
  - Lifestyle modifications - weight loss, exercise, smoking cessation, limit alcohol, optimize diabetes and cardiovascular risk factors
  - Treat underlying causes - optimize medications (switch from beta-blocker to ACE inhibitor), treat hypogonadism, treat depression
  - Phosphodiesterase-5 (PDE5) inhibitors first-line - sildenafil 50-100mg 1 hour before intercourse, tadalafil 10-20mg (lasts 36 hours), vardenafil 10-20mg
  - Take on empty stomach for faster onset, requires sexual stimulation to work
  - Contraindications - nitrate use (risk of severe hypotension), severe cardiovascular disease
  - Side effects - headache, flushing, dyspepsia, nasal congestion, visual disturbances (blue tinge with sildenafil)
  - Daily low-dose tadalafil 2.5-5mg if frequent sexual activity
  - Intraurethral alprostadil (MUSE) 125-1000 mcg if PDE5 inhibitors ineffective or contraindicated
  - Intracavernosal injection - alprostadil, papaverine, phentolamine (highly effective 70-80%, risk of priapism)
  - Vacuum erection device - mechanical option, no systemic side effects
  - Penile prosthesis surgery for refractory cases - inflatable or malleable implants (high satisfaction 90-95%)
  - Psychotherapy or couples counseling if significant psychogenic component
clinical_pearls:
  - ED often sentinel event for cardiovascular disease - same risk factors (atherosclerosis, endothelial dysfunction)
  - Evaluate and treat cardiovascular risk factors in all men with ED
  - Testosterone replacement only if hypogonadal (total testosterone less than 300 ng/dL on two morning measurements) - improves libido but may not improve ED if vascular cause
  - Priapism (erection greater than 4 hours) medical emergency - detumescence with aspiration and phenylephrine injection
  - Peyronie disease (penile curvature) may improve with pentoxifylline, intralesional collagenase, or surgery
  - PDE5 inhibitors also approved for BPH symptoms (tadalafil 5mg daily)
differentials:
  - Hypogonadism
  - Depression
  - Relationship issues
  - Performance anxiety
  - Medication side effects
  - Peyronie disease
trace:
  - 55-year-old man with progressive difficulty achieving erections x 1 year → History of hypertension, diabetes, smoking → Morning erections absent → Physical exam normal, good peripheral pulses → Fasting glucose 165 mg/dL, HbA1c 8.2%, lipids elevated, morning testosterone 420 ng/dL (normal) → Counsel on lifestyle modifications - smoking cessation, weight loss, diabetes control → Start sildenafil 50mg PRN 1 hour before intercourse → Effective but reports headache → Switch to tadalafil 10mg PRN → Good response, improved sexual function → Emphasize cardiovascular risk reduction and diabetes management
