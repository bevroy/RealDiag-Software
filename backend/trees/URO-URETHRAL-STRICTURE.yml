workup:
  - 'Uroflowmetry: Peak flow <10 mL/sec suggests obstruction (normal >15 mL/sec)'
  - 'Post-void residual: Bladder scan after voiding - >200 mL suggests significant obstruction'
  - 'Retrograde urethrography (RUG): Contrast injected into urethra during X-ray - gold standard for diagnosis, shows stricture location/length'
  - 'Cystoscopy: Direct visualization of urethra and stricture'
treatment:
  - 'Guideline-based treatment options for Urethral Stricture include:'
  - 'Urethral dilation: Office procedure - sequential dilators to stretch stricture. Quick but 50% recur within 1 year (AUA 2023)'
  - 'Direct vision internal urethrotomy: Endoscopic incision of stricture. 50-70% success rate, best for short strictures <1.5cm (AUA 2023)'
  - 'Urethroplasty (gold standard): Open surgical repair - excision + primary anastomosis or buccal mucosa graft. 85-90% success, definitive treatment (AUA 2023)'
  - 'Chronic catheterization: If not surgical candidate - suprapubic catheter preferred over urethral (avoids trauma) (AUA 2023)'
  - 'Self-dilation: Teach patient to dilate at home with catheters - prevents recurrence after urethroplasty (AUA 2023)'
clinical_pearls:
  - 'Narrowing of urethra from scar tissue - causes: trauma (straddle injury, pelvic fracture), catheterization (iatrogenic), STI (gonococcal), idiopathic'
  - 'Anterior urethra strictures (90%): Bulbar urethra most common - trauma, catheter, instrumentation'
  - 'Posterior urethra strictures (10%): Membranous urethra - pelvic fracture, prostate surgery (TURP)'
  - 'Recurrence common: 50% recur after single dilation, urethroplasty (surgical repair) has better long-term success (85-90%)'
  - 'Complications: Recurrent UTIs, urinary retention, bladder stones, hydronephrosis'
