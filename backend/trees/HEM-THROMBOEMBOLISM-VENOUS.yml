tree_id: HEM-THROMBOEMBOLISM-VENOUS
name: Venous Thromboembolism (DVT/PE)
family: Hematology
specialty: Hematology
chief_complaint: Leg swelling or shortness of breath
description: Blood clot in deep veins (DVT) or pulmonary arteries (PE) causing limb swelling or respiratory symptoms. Anticoagulation prevents clot extension and recurrence, reduces mortality from PE.
icd10: I82.40
urgency: urgent

workup:
  - Clinical assessment: Wells score for DVT or PE (estimates pretest probability - guides testing)
  - DVT: unilateral leg swelling, pain, warmth, palpable cord, Homan sign (insensitive and nonspecific)
  - PE: dyspnea, pleuritic chest pain, tachycardia, tachypnea, hypoxemia (can be asymptomatic if small)
  - D-dimer: high sensitivity but low specificity, negative result rules out VTE if low pretest probability (Wells score)
  - DVT imaging: compression ultrasound with Doppler (first-line, 95% sensitive for proximal DVT, less sensitive for calf DVT)
  - PE imaging: CT pulmonary angiography (CTPA) gold standard, or V/Q scan if contrast contraindication
  - Labs: CBC, PT/INR, aPTT (baseline before anticoagulation), creatinine (dose adjustment)
  - Troponin and BNP if PE: assess right heart strain (prognostic)
  - Thrombophilia testing: consider if unprovoked VTE, age <50, recurrent VTE, family history (test after acute treatment completed)
  - Risk factors: immobilization, surgery, malignancy, pregnancy, oral contraceptives, thrombophilia, prior VTE

treatment:
  - Anticoagulation (all patients): prevent clot extension and recurrence
  - Direct oral anticoagulants (DOACs) preferred over warfarin: rivaroxaban 15 mg BID x21 days then 20 mg daily, or apixaban 10 mg BID x7 days then 5 mg BID
  - Alternatively: dabigatran or edoxaban (require initial parenteral anticoagulation first)
  - Warfarin alternative: requires initial heparin or LMWH bridge, INR goal 2-3, frequent monitoring, drug and food interactions
  - Low molecular weight heparin (LMWH): enoxaparin 1 mg/kg SC BID or dalteparin - preferred in cancer-associated VTE or pregnancy
  - Unfractionated heparin IV: if renal dysfunction (CrCl <30), high bleeding risk (short half-life reversible), or candidate for thrombolysis
  - Duration of anticoagulation: provoked VTE (surgery, immobilization) 3 months, unprovoked VTE or cancer at least 3-6 months or indefinite if high recurrence risk
  - Massive PE with hemodynamic instability: systemic thrombolysis (alteplase 100 mg IV over 2 hours), or catheter-directed thrombolysis, or embolectomy
  - IVC filter: if anticoagulation contraindication (active bleeding), retrievable filters preferred
  - Compression stockings: for post-thrombotic syndrome prevention (controversial - recent trials show no benefit)
  - Follow-up: monitor for bleeding complications, recurrence, post-thrombotic syndrome

clinical_pearls:
  - Wells score guides testing - if low probability and negative D-dimer, VTE excluded
  - Compression ultrasound for DVT, CTPA for PE
  - DOACs preferred over warfarin - rivaroxaban or apixaban no INR monitoring needed
  - Provoked VTE anticoagulate 3 months, unprovoked 3-6 months or indefinite
  - Cancer-associated VTE use LMWH (superior to warfarin in cancer)
  - Massive PE with shock needs thrombolysis or embolectomy
  - Major bleeding risk 2-3% per year on anticoagulation - weigh risks vs benefits

differentials:
  - DVT mimics: cellulitis (warmth, erythema, fever), ruptured Baker cyst (calf pain and swelling), musculoskeletal strain
  - PE mimics: pneumonia (fever, cough, infiltrate), acute coronary syndrome (troponin elevation), anxiety (normal imaging)
  - Superficial thrombophlebitis: palpable tender cord, superficial vein, usually benign

trace: |
  A 45-year-old woman presented to ED with 2 days of left leg swelling, pain, and warmth after 14-hour international flight one week prior. Left calf 4 cm larger than right, tender, positive Homan sign. Wells score 3 (high probability). D-dimer 2450 (markedly elevated). Compression ultrasound showed left common femoral and popliteal vein DVT (proximal). No dyspnea or chest pain. Diagnosed with acute proximal DVT provoked by prolonged immobilization. Started rivaroxaban 15 mg BID. Leg elevation and ambulation as tolerated. At 3 weeks switched to rivaroxaban 20 mg daily (after 21-day loading phase completed), swelling significantly improved. At 3 months leg swelling resolved, no post-thrombotic syndrome. Completed 3 months anticoagulation for provoked DVT, discontinued rivaroxaban. Counseled on VTE prevention during future travel (ambulation, hydration, compression stockings). At 12 months no recurrence, excellent outcome.
