tree_id: GI-CONSTIPATION-FECAL-IMPACTION
name: Constipation with Fecal Impaction
family: gastroenterology
specialty: Gastroenterology, Primary Care, Emergency Medicine
chief_complaint: Inability to pass stool, abdominal discomfort
description: |
  Fecal impaction is the accumulation of hardened stool in the rectum or colon that cannot be evacuated spontaneously.
  Most common in elderly, immobile patients, those with neurologic disorders, and chronic opioid users.
icd10: K56.49
snomed: "236069009"
presentations:
  - Inability to pass stool for several days
  - Abdominal pain, cramping, or distension
  - Rectal pain or pressure
  - Paradoxical diarrhea (liquid stool leaking around impaction)
  - Nausea, vomiting
  - Loss of appetite
  - Urinary retention or overflow incontinence
  - Confusion or delirium (especially in elderly)
  - Hard mass palpable on abdominal exam
  - Rock-hard stool on rectal exam
urgency: Moderate
referrals:
  emergency:
    - Signs of bowel obstruction or perforation
    - Severe abdominal pain with peritoneal signs
    - Vomiting, inability to tolerate oral intake
    - Hemodynamic instability
  gastroenterology:
    - Recurrent fecal impaction
    - Failure of manual disimpaction
    - Need for colonoscopy to rule out underlying pathology
workup:
  - History: duration of constipation, stool frequency, medications (opioids, anticholinergics), comorbidities (neurologic, metabolic), diet, fluid intake
  - Physical exam: abdominal exam for distension and palpable stool, rectal exam to identify hard stool in rectum
  - Labs: generally not needed unless concern for electrolyte abnormalities or metabolic causes
  - Imaging: abdominal X-ray (KUB) shows fecal loading, dilated loops of bowel; CT if concern for obstruction or perforation
treatment:
  - Manual disimpaction: digital removal of stool from rectum (may require sedation or local anesthesia)
  - Enemas: normal saline, mineral oil, or docusate enemas to soften and evacuate stool
  - Suppositories: glycerin or bisacodyl suppositories for rectal stimulation
  - Oral laxatives after disimpaction:
    - Osmotic: polyethylene glycol (MiraLAX) 17g daily, lactulose 15-30 mL daily
    - Stimulant: senna, bisacodyl (short-term use)
    - Stool softeners: docusate sodium 100-200mg daily
  - Increase fluid intake (goal 2-3 liters per day)
  - Increase dietary fiber (fruits, vegetables, whole grains)
  - Encourage physical activity and mobility
  - Bowel regimen for chronic opioid users: scheduled osmotic and stimulant laxatives
  - Address underlying causes: discontinue constipating medications if possible, treat hypothyroidism or hypercalcemia
  - Surgical intervention: reserved for severe cases with obstruction or perforation
clinical_pearls:
  - Paradoxical diarrhea (overflow incontinence) is a common presentation - liquid stool leaking around hard impaction
  - Always perform rectal exam in patients with constipation or change in bowel habits
  - Elderly and institutionalized patients are at highest risk
  - Prevention is key: adequate fluids, fiber, activity, and scheduled bowel regimen for high-risk patients
  - Chronic opioid users require aggressive prophylactic bowel regimen
  - Manual disimpaction may be uncomfortable; consider lidocaine jelly or conscious sedation
  - After disimpaction, maintain bowel regimen to prevent recurrence
differentials:
  - Simple constipation without impaction
  - Bowel obstruction (mechanical)
  - Ileus
  - Colon cancer or stricture
  - Hirschsprung's disease (in young patients)
  - Rectal prolapse
  - Pelvic floor dysfunction
trace:
  - 80-year-old nursing home resident with dementia presents with no bowel movement x 7 days, abdominal distension → Abdominal exam shows diffuse mild tenderness, palpable stool in left lower quadrant → Rectal exam reveals hard stool in rectal vault → Diagnose fecal impaction → Manual disimpaction performed → Mineral oil enema administered → Large amount of stool evacuated → Start polyethylene glycol 17g daily and encourage fluids → Symptoms resolve → Bowel regimen continued for prevention
citations:
  - American Gastroenterological Association Guidelines on Constipation
  - American College of Gastroenterology Chronic Constipation Guidelines
  - UpToDate - Gastroenterology
