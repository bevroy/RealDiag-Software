trace:
  - 72-year-old man with fair skin presents with 8-month history of growing, non-healing lesion on left ear. Exam reveals 1.5cm firm, erythematous nodule with central ulceration and crust on helix. Shave biopsy performed. Pathology confirms well-differentiated squamous cell carcinoma. Given high-risk location on ear, referred to dermatology for Mohs surgery. Complete excision achieved with 3 stages. Wound reconstructed with skin graft. Margins clear. Patient counseled on sun protection and close surveillance with full skin exams every 6 months.
