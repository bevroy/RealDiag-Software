tree_id: DERM-SQUAMOUS-CELL-CARCINOMA
name: Squamous Cell Carcinoma (Skin)
family: dermatology
specialty: Dermatology, Primary Care
chief_complaint: Non-healing skin lesion, growing scaly patch or nodule on sun-exposed area
description: |
  Squamous cell carcinoma (SCC) is the second most common skin cancer. Arises from keratinocytes in epidermis.
  Most often caused by cumulative UV exposure. Can metastasize but less aggressive than melanoma. Precursor is actinic keratosis.
icd10: C44.92
snomed: "402815007"
presentations:
  - Scaly, crusted, or hyperkeratotic patch or plaque
  - Firm, flesh-colored or red nodule
  - Ulcerated or bleeding lesion
  - Non-healing wound or sore
  - Tender or painful lesion
  - Growth on sun-exposed areas (face, ears, scalp, neck, arms, hands)
  - History of actinic keratoses
  - Lesion arising in scar or chronic wound
urgency: Moderate
referrals:
  urgent:
    - Rapidly growing lesion
    - Large lesion (>2cm)
    - High-risk location (ear, lip, genitals)
    - Perineural invasion or deep invasion
  dermatology:
    - All suspected squamous cell carcinomas for biopsy and treatment planning
  oncology:
    - Metastatic disease
workup:
  - Clinical exam with dermoscopy
  - Skin biopsy (shave, punch, or excisional)
  - Pathology confirms diagnosis and determines depth, differentiation, perineural invasion
  - Staging if high-risk features or suspected metastases
treatment:
  - Standard excision with 4-6mm margins for low-risk SCC
  - Mohs micrographic surgery for high-risk SCC or cosmetically sensitive areas
  - Electrodesiccation and curettage for small, low-risk lesions
  - Radiation therapy if surgery not feasible
  - Topical therapies (5-FU, imiquimod) for superficial SCC in situ
  - Systemic therapy for metastatic disease
  - Close surveillance after treatment
clinical_pearls:
  - Second most common skin cancer after basal cell carcinoma
  - 5-10% risk of metastasis for high-risk lesions
  - High-risk features include size >2cm, depth >4mm, poorly differentiated, perineural invasion, immunosuppression
  - Actinic keratoses are precursor lesions
  - Immunosuppressed patients (organ transplant) have much higher risk
  - Sun protection critical for prevention
differentials:
  - Actinic keratosis
  - Basal cell carcinoma
  - Keratoacanthoma
  - Wart
  - Seborrheic keratosis
  - Hypertrophic scar or keloid
  - Melanoma
trace:
  - 72-year-old man with fair skin presents with 8-month history of growing, non-healing lesion on left ear. Exam reveals 1.5cm firm, erythematous nodule with central ulceration and crust on helix. Shave biopsy performed. Pathology confirms well-differentiated squamous cell carcinoma. Given high-risk location on ear, referred to dermatology for Mohs surgery. Complete excision achieved with 3 stages. Wound reconstructed with skin graft. Margins clear. Patient counseled on sun protection and close surveillance with full skin exams every 6 months.
citations:
  - American Academy of Dermatology Skin Cancer Guidelines
  - NCCN Squamous Cell Skin Cancer Guidelines
  - UpToDate - Dermatology
