tree_id: DERM-SQUAMOUS-CELL-CARCINOMA
name: Squamous Cell Carcinoma (Skin)
version: '1.0'
status: draft
family: dermatology
specialty: Dermatology
secondary_specialties:
  - Primary Care
urgency: urgent
urgency_explanation: ''
chief_complaint: Non-healing skin lesion, growing scaly patch or nodule on sun-exposed area
description: |
  Squamous cell carcinoma (SCC) is the second most common skin cancer. Arises from keratinocytes in epidermis.
  Most often caused by cumulative UV exposure. Can metastasize but less aggressive than melanoma. Precursor is actinic keratosis.
