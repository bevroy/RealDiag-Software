presentations:
  - Scaly, crusted, or hyperkeratotic patch or plaque
  - Firm, flesh-colored or red nodule
  - Ulcerated or bleeding lesion
  - Non-healing wound or sore
  - Tender or painful lesion
  - Growth on sun-exposed areas (face, ears, scalp, neck, arms, hands)
  - History of actinic keratoses
  - Lesion arising in scar or chronic wound
differentials:
  - Actinic keratosis
  - Basal cell carcinoma
  - Keratoacanthoma
  - Wart
  - Seborrheic keratosis
  - Hypertrophic scar or keloid
  - Melanoma
workup:
  - Clinical exam with dermoscopy
  - Skin biopsy (shave, punch, or excisional)
  - Pathology confirms diagnosis and determines depth, differentiation, perineural invasion
  - Staging if high-risk features or suspected metastases
treatment:
  - Standard excision with 4-6mm margins for low-risk SCC
  - Mohs micrographic surgery for high-risk SCC or cosmetically sensitive areas
  - Electrodesiccation and curettage for small, low-risk lesions
  - Radiation therapy if surgery not feasible
  - Topical therapies (5-FU, imiquimod) for superficial SCC in situ
  - Systemic therapy for metastatic disease
  - Close surveillance after treatment
clinical_pearls:
  - Second most common skin cancer after basal cell carcinoma
  - 5-10% risk of metastasis for high-risk lesions
  - High-risk features include size >2cm, depth >4mm, poorly differentiated, perineural invasion, immunosuppression
  - Actinic keratoses are precursor lesions
  - Immunosuppressed patients (organ transplant) have much higher risk
  - Sun protection critical for prevention
