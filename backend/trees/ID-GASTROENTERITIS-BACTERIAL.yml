presentations:
  - Acute diarrhea (often bloody or mucoid)
  - Abdominal cramping and pain
  - Fever >38.5°C (101.3°F)
  - Nausea and vomiting
  - Tenesmus (painful straining with bowel movements)
  - Recent travel, especially to developing countries
  - Contaminated food or water exposure
  - Outbreak setting (multiple ill contacts)
  - Severe or prolonged symptoms >7 days
  - Signs of dehydration
differentials:
  - Viral gastroenteritis (norovirus, rotavirus) - watery diarrhea, less fever, self-limited
  - Parasitic infection (Giardia, Cryptosporidium, Entamoeba) - prolonged, travel history
  - C. difficile colitis (recent antibiotic use, healthcare exposure)
  - Inflammatory bowel disease (Crohn's, ulcerative colitis) - chronic or recurrent
  - Ischemic colitis (elderly, vascular disease, sudden onset bloody diarrhea)
  - Appendicitis (RLQ pain, fever, may have diarrhea initially)
workup:
  - Stool culture for bacterial pathogens (Salmonella, Shigella, Campylobacter, E. coli)
  - Stool PCR panel (multiplex GI pathogen panel) - faster, more sensitive
  - Stool for ova and parasites if travel history or persistent symptoms
  - Stool for C. difficile if recent antibiotic use or healthcare exposure
  - Complete blood count (leukocytosis with left shift suggests bacterial)
  - Basic metabolic panel to assess dehydration and electrolyte abnormalities
  - Blood cultures if signs of bacteremia (high fever, sepsis)
  - Consider stool for fecal leukocytes/lactoferrin (indicates inflammatory diarrhea)
treatment:
  - Oral rehydration therapy - first-line for mild-moderate dehydration
  - IV fluids for severe dehydration or inability to tolerate oral intake
  - Antimotility agents (loperamide) generally avoided in suspected bacterial diarrhea
  - Antibiotics typically NOT needed for most bacterial gastroenteritis (self-limited)
  - 'Consider antibiotics if: severe illness, bloody diarrhea, immunocompromised, age >65'
  - 'Empiric antibiotic (if indicated): Ciprofloxacin 500 mg PO BID x 3-5 days'
  - 'Alternative: Azithromycin 500 mg PO daily x 3 days (better for Campylobacter, travel)'
  - Avoid antibiotics in suspected STEC/EHEC (E. coli O157:H7) - increases HUS risk
  - Probiotics (Lactobacillus, Saccharomyces boulardii) may reduce duration
  - Report to public health if Salmonella, Shigella, STEC, or outbreak suspected
  - Dietary modifications - BRAT diet (bananas, rice, applesauce, toast) initially
  - Avoid dairy products temporarily (transient lactose intolerance common)
  - Zinc supplementation in children may reduce duration
clinical_pearls:
  - Bacterial gastroenteritis more likely if fever, bloody diarrhea, severe abdominal pain, fecal leukocytes
  - 'Common bacterial causes: Campylobacter (most common in US), Salmonella, Shigella, E. coli (ETEC, STEC)'
  - Travel-associated diarrhea usually ETEC (enterotoxigenic E. coli) - responds to fluoroquinolones or azithromycin
  - Shiga-toxin producing E. coli (STEC/O157:H7) - NEVER give antibiotics (risk of HUS)
  - Hemolytic uremic syndrome (HUS) complication of STEC - thrombocytopenia, hemolytic anemia, acute renal failure
  - Campylobacter can cause Guillain-Barré syndrome 1-3 weeks after infection
  - Non-typhoidal Salmonella bacteremia risk in infants <3 months, elderly, immunocompromised, sickle cell
  - Reactive arthritis can follow Salmonella, Shigella, Campylobacter, or Yersinia infection
  - Foodborne outbreaks - report to health department for investigation
