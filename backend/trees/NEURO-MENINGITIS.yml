tree_id: NEURO-MENINGITIS
name: Bacterial Meningitis
family: Neurology
specialty: Infectious Disease/Neurology
chief_complaint: Severe headache, fever, and neck stiffness
description: |
  Life-threatening infection of meninges surrounding brain and spinal cord. Requires immediate recognition and treatment. Common bacteria vary by age - neonates (GBS, E. coli, Listeria), children/adults (Strep pneumoniae, Neisseria meningitidis), elderly (Strep pneumoniae, Listeria).
  Classic triad: fever, headache, neck stiffness (only 44% have all three). Mortality 10-30% despite treatment, neurologic sequelae common (hearing loss, seizures, cognitive impairment).
icd10: G00.9
urgency: Critical
workup:
  - Clinical presentation - acute severe headache, fever, neck stiffness (nuchal rigidity), photophobia, altered mental status
  - Kernig sign - resistance to knee extension with hip flexed
  - Brudzinski sign - neck flexion causes involuntary hip flexion
  - Petechial or purpuric rash suggests meningococcemia (N. meningitidis)
  - Blood cultures x 2 before antibiotics - positive in 50-90%
  - Lumbar puncture (LP) - do not delay antibiotics for LP if clinical suspicion high
  - Contraindications to immediate LP - signs of increased ICP (papilledema, focal neurologic deficit, altered consciousness), thrombocytopenia, anticoagulation
  - Get head CT before LP if concern for mass effect (focal deficit, seizure, immunocompromised, age greater than 60, papilledema)
  - CSF analysis - opening pressure, cell count with differential, glucose, protein, Gram stain and culture
  - Bacterial meningitis - elevated WBC 1000-5000 (neutrophil predominance greater than 80%), low glucose (CSF/serum ratio less than 0.4), elevated protein (greater than 200 mg/dL), positive Gram stain (60-90%), positive culture (70-85%)
  - Viral meningitis - elevated WBC 100-1000 (lymphocyte predominance), normal glucose, mildly elevated protein (less than 150 mg/dL)
  - Tuberculous meningitis - elevated WBC (lymphocytes), very low glucose, very high protein (greater than 100 mg/dL)
  - Fungal meningitis (Cryptococcus) - lymphocytic pleocytosis, low glucose, India ink stain, cryptococcal antigen
  - CSF lactate greater than 31.5 mg/dL highly suggestive of bacterial meningitis
  - CSF PCR for specific pathogens if available (HSV, enterovirus, pneumococcus, meningococcus)
  - Head CT or MRI if concern for complications - abscess, hydrocephalus, infarction
treatment:
  - Do not delay antibiotics - give within 1 hour of arrival, before LP if LP delayed
  - Empiric antibiotics based on age and risk factors
  - Age 18-50 - vancomycin 15-20 mg/kg IV q8-12h (target trough 15-20) plus ceftriaxone 2g IV q12h
  - Age greater than 50 or immunocompromised - add ampicillin 2g IV q4h for Listeria coverage
  - Neonates - ampicillin plus cefotaxime or gentamicin
  - Post-neurosurgery or CSF shunt - vancomycin plus cefepime or meropenem (Pseudomonas coverage)
  - Penicillin allergy - vancomycin plus moxifloxacin
  - Adjust antibiotics based on Gram stain and culture/sensitivities
  - Strep pneumoniae - vancomycin plus ceftriaxone (high-dose ceftriaxone 2g q12h) x 10-14 days
  - Neisseria meningitidis - ceftriaxone x 7 days (can switch to penicillin G if susceptible)
  - Listeria monocytogenes - ampicillin x 21 days (add gentamicin first 7 days)
  - H. influenzae - ceftriaxone x 7-10 days
  - Dexamethasone 10mg IV before or with first antibiotic dose, then q6h x 4 days
  - Improves outcomes in pneumococcal meningitis (reduces mortality and neurologic sequelae especially hearing loss)
  - Benefit unclear for other bacterial causes
  - Adjunctive treatment - seizure precautions, monitor ICP, treat cerebral edema with hypertonic saline or mannitol if indicated
  - Repeat LP at 48 hours if not improving - assess sterilization of CSF
  - Chemoprophylaxis for close contacts if meningococcus or H. influenzae
  - Rifampin 600mg PO BID x 2 days or ceftriaxone 250mg IM x 1 or ciprofloxacin 500mg PO x 1
  - Complications - hearing loss (screen all patients with audiometry before discharge), seizures, hydrocephalus, subdural empyema, brain abscess, stroke
  - Aseptic meningitis (viral) - supportive care, acyclovir 10 mg/kg IV q8h if HSV suspected
clinical_pearls:
  - Antibiotics before LP if any delay expected - cultures may remain positive x 24-48 hours after antibiotics started
  - Jolt accentuation of headache (worsening with horizontal head rotation) 97% sensitive but only 60% specific
  - Absence of fever, neck stiffness, and altered mental status makes bacterial meningitis very unlikely
  - Waterhouse-Friderichsen syndrome - fulminant meningococcemia with DIC, adrenal hemorrhage, shock (fatal if not treated emergently)
  - College students living in dorms, military recruits, asplenic patients higher risk for meningococcal disease
  - Vaccination - pneumococcal (PCV13, PPSV23), meningococcal (MenACWY, MenB), H. influenzae B prevents most cases
differentials:
  - Viral meningitis (aseptic meningitis)
  - Encephalitis
  - Subarachnoid hemorrhage
  - Brain abscess
  - Migraine
  - Temporal arteritis
trace:
  - 32-year-old previously healthy woman with severe headache, fever to 39.5°C, photophobia x 12 hours → Increasingly confused, difficult to arouse → Exam shows nuchal rigidity, positive Kernig and Brudzinski signs, no focal deficits, no papilledema, no rash → Blood cultures drawn → Head CT normal (performed due to altered consciousness) → Lumbar puncture - opening pressure 35 cm H2O, CSF cloudy → CSF analysis - WBC 3500 (95% neutrophils), glucose 18 mg/dL (serum 105), protein 285 mg/dL → Gram stain shows Gram-positive diplococci → Immediate treatment - dexamethasone 10mg IV, vancomycin 1g IV, ceftriaxone 2g IV → Admit to ICU → CSF culture grows Streptococcus pneumoniae sensitive to ceftriaxone (MIC 0.06) → Continue ceftriaxone alone x 14 days, dexamethasone x 4 days → Clinical improvement over 72 hours, afebrile by day 3 → Audiometry shows mild high-frequency hearing loss right ear → Complete antibiotic course, discharged home day 16 with audiology follow-up
