tree_id: ENT-OTITIS-MEDIA
name: Acute Otitis Media
family: Ent
specialty: Ent
icd10:
- H66.90
snomed:
- 3110003
urgency: urgent
description: Comprehensive evaluation and management of Acute Otitis Media
version: '1.0'
citations:
  - AAO-HNS (American Academy of Otolaryngology–Head and Neck Surgery) Clinical Practice Guidelines
  - British Society of Otology Guidelines
  - UpToDate - Otolaryngology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Ear pain (otalgia)
- Fever
- Hearing loss
- Bulging, erythematous tympanic membrane
- Possible purulent drainage if TM rupture
- Common in children
- May follow upper respiratory infection
workup:
- Clinical diagnosis based on pneumatic otoscopy (bulging, immobile TM with decreased
  mobility)
- Tympanometry if diagnosis uncertain (flat Type B curve in AOM)
- Tympanocentesis for culture if refractory or recurrent (rarely needed)
treatment:
- 'Guideline-based treatment options for Acute Otitis Media include:'
- 'Observation 48-72hrs if: Age >2 years, mild symptoms, unilateral, no fever, reliable
  follow-up (AAO-HNS 2023)'
- 'Antibiotics if: Age <6 months (always treat), severe symptoms, bilateral, fever
  >39°C, immunocompromised (AAO-HNS 2023)'
- 'First-line: Amoxicillin 80-90 mg/kg/day divided BID × 10 days (5-7 days if age
  >2 years) (AAO-HNS 2023)'
- 'If penicillin allergy: Cefdinir 14 mg/kg/day OR azithromycin 10 mg/kg day 1, then
  5 mg/kg days 2-5 (AAO-HNS 2023)'
- 'Treatment failure at 48-72hrs: Switch to amoxicillin-clavulanate 90 mg/kg/day (covers
  beta-lactamase) (AAO-HNS 2023)'
clinical_pearls:
- Most common bacterial infection in children (peak age 6-24 months)
- 'Organisms: S. pneumoniae (most common), H. influenzae, M. catarrhalis, Streptococcus
  pyogenes'
- Bulging TM with loss of landmarks = acute infection. Retracted TM = OME (effusion
  without infection)
- Spontaneous TM perforation occurs in 5% - pain suddenly improves with drainage
- 'Risk factors: Daycare, smoke exposure, bottle feeding (vs breastfeeding), pacifier
  use, cleft palate'
referrals:
- 'ENT if: Recurrent AOM (≥3 episodes in 6 months or ≥4 in 12 months) for tympanostomy
  tubes consideration'
- 'ENT if: Persistent effusion >3 months or hearing loss >25 dB'
- 'Emergency department if: Mastoiditis (postauricular swelling, ear protruding forward),
  meningitis signs'
differentials:
  - Otitis externa
  - URI
  - Teething
  - TMJ disorder
  - Mastoiditis
