tree_id: GI-NAUSEA-VOMITING
name: Nausea and Vomiting
family: gastroenterology
specialty: Gastroenterology
icd10: R11.2
snomed: 422587007
urgency: []
homeopathy: []
presentations:
  - Nausea (sensation of needing to vomit)
  - Vomiting (forceful expulsion of gastric contents)
  - Retching or dry heaves
  - Acute onset (<1 week) vs chronic (>1 month)
  - Associated symptoms: abdominal pain, diarrhea, fever, headache
  - Timing: morning (pregnancy), postprandial (gastroparesis), nocturnal (increased ICP)
  - Projectile vomiting (gastric outlet obstruction, increased ICP)
  - Hematemesis (upper GI bleeding)
  - Undigested food in vomitus (gastroparesis, obstruction)
workup:
  - Determine acute vs chronic, presence of alarm features
  - Alarm features: severe abdominal pain, GI bleeding, weight loss, neurologic symptoms
  - Pregnancy test in all women of childbearing age (first step!)
  - Laboratory tests: CBC, CMP, liver enzymes, lipase, urinalysis
  - Assess for dehydration: orthostatic vital signs, BUN/Cr ratio
  - Upper endoscopy (EGD) if concern for peptic ulcer, gastritis, or obstruction
  - CT abdomen/pelvis if concern for obstruction, perforation, or intra-abdominal pathology
  - Head CT if neurologic symptoms or concern for increased intracranial pressure
  - Gastric emptying study if gastroparesis suspected
  - Consider toxicology screen, medication review (many drugs cause nausea)
treatment:
  - Treat underlying cause when identified
  - Supportive care and rehydration
  - Oral rehydration for mild cases (small sips, electrolyte solutions)
  - IV fluids (normal saline or lactated Ringer's) for moderate-severe dehydration
  - Replace electrolytes (potassium, magnesium)
  - NPO initially, then clear liquid diet advancing as tolerated
  - Antiemetic medications
  - Ondansetron 4-8 mg PO/IV q8h (5-HT3 antagonist)
  - Promethazine 12.5-25 mg PO/IV/PR q4-6h (antihistamine, sedating)
  - Metoclopramide 10 mg PO/IV q6h (prokinetic, risk of dystonia/tardive dyskinesia)
  - Prochlorperazine 10 mg PO/IM q6h or 25 mg PR q12h (phenothiazine)
  - Scopolamine patch 1.5 mg q72h (for motion sickness)
  - Specific situations
  - Pregnancy: vitamin B6 (pyridoxine) 25 mg TID ± doxylamine 12.5 mg TID
  - Chemotherapy-induced: ondansetron, aprepitant, dexamethasone
  - Gastroparesis: metoclopramide, domperidone, dietary modification
  - Vestibular: meclizine 25 mg q6h, scopolamine patch
  - Cannabinoid hyperemesis: hot showers, haloperidol, capsaicin cream
  - Hospitalization if severe dehydration, electrolyte imbalance, or inability to tolerate oral intake
clinical_pearls:
  - "Always check pregnancy test first in women of childbearing age!"
  - "Acute nausea/vomiting (<48 hours) usually infectious gastroenteritis - self-limited"
  - "Chronic nausea/vomiting (>1 month) requires investigation - not just symptom management"
  - "Feculent vomiting suggests distal small bowel obstruction"
  - "Morning vomiting: pregnancy, increased ICP, uremia, alcohol use"
  - "Postprandial vomiting: gastroparesis, gastric outlet obstruction, pyloric stenosis"
  - "Projectile vomiting: pyloric stenosis (infants), increased ICP, gastric outlet obstruction"
  - "Cannabinoid hyperemesis syndrome: chronic marijuana use, relief with hot showers, compulsive bathing"
  - "Cyclic vomiting syndrome: stereotypical episodes with symptom-free intervals"
referrals:
  - Gastroenterology for chronic nausea/vomiting or abnormal endoscopy
  - Emergency department if severe dehydration, hematemesis, severe abdominal pain, or neurologic symptoms
  - Obstetrics if hyperemesis gravidarum (severe nausea/vomiting in pregnancy)
  - Neurology if concern for increased intracranial pressure or CNS pathology
differentials:
  - Acute gastroenteritis (viral, bacterial) - most common cause
  - Pregnancy (morning sickness, hyperemesis gravidarum)
  - Medication-induced (chemotherapy, opioids, antibiotics)
  - Gastroparesis (diabetic, post-surgical, idiopathic)
  - Gastric outlet obstruction (peptic ulcer disease, malignancy)
  - Small bowel obstruction (adhesions, hernia)
  - Acute pancreatitis (epigastric pain, elevated lipase)
  - Acute cholecystitis or biliary colic (RUQ pain, ultrasound findings)
  - Peptic ulcer disease or gastritis
  - Increased intracranial pressure (headache, neurologic deficits)
  - Vestibular disorders (vertigo, nystagmus)
  - Cannabinoid hyperemesis syndrome (chronic marijuana use, relief with hot showers)
  - Cyclic vomiting syndrome (stereotypical episodes)
  - Diabetic ketoacidosis (hyperglycemia, ketones, anion gap acidosis)
trace:
  source: ACG Clinical Guidelines on Nausea and Vomiting 2020, ACOG Practice Bulletin on Nausea and Vomiting of Pregnancy
  version: '1.0'
