tree_id: URO-BPH
name: Benign Prostatic Hyperplasia (BPH)
family: Urology
specialty: Urology
icd10:
- N40.0
snomed:
- 236646002
urgency: medium
description: Comprehensive evaluation and management of Benign Prostatic Hyperplasia
  (BPH)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Lower urinary tract symptoms (LUTS)
- Difficulty initiating urination
- Weak urinary stream
- Urinary frequency and urgency
- Nocturia
- Incomplete bladder emptying
- Enlarged prostate on digital rectal exam
- Common in men > 50 years
workup:
- 'DRE: Estimate prostate size (normal 20g, BPH often 30-100g), assess nodules (concern
  for cancer)'
- 'IPSS questionnaire: Severity assessment (7 questions, 0-5 scale each)'
- 'Post-void residual (PVR): Bladder scan after voiding. <50 mL normal, >200 mL significant
  retention'
- 'Uroflowmetry: Peak flow <10 mL/sec suggests obstruction (normal >15 mL/sec)'
- 'PSA: If life expectancy >10 years (screen for prostate cancer). Elevated PSA needs
  further workup (free PSA, MRI, biopsy)'
- 'UA: Rule out UTI, hematuria'
treatment:
- 'Guideline-based treatment options for Benign Prostatic Hyperplasia (BPH) include:'
- 'Mild symptoms (IPSS <8): Watchful waiting, avoid caffeine/alcohol, timed voiding
  (AUA 2023)'
- 'Alpha-blockers (first-line): Tamsulosin 0.4mg daily or alfuzosin 10mg daily - relaxes
  smooth muscle, improves flow within days (AUA 2023)'
- '5-alpha reductase inhibitors: Finasteride 5mg daily or dutasteride 0.5mg daily
  - shrinks prostate 20-30%, takes 6-12 months. For prostate >40g (AUA 2023)'
- 'Combination therapy: Alpha-blocker + 5-ARI if prostate >40g (better than monotherapy)
  (AUA 2023)'
- 'TURP (transurethral resection of prostate): If failed medical therapy, recurrent
  retention, hydronephrosis, bladder stones (AUA 2023)'
clinical_pearls:
- 50% of men by age 60, 90% by age 85 - benign proliferation of stromal and epithelial
  cells in transition zone
- 'LUTS: Obstructive (weak stream, hesitancy, incomplete emptying) vs irritative (urgency,
  frequency, nocturia)'
- 'IPSS (International Prostate Symptom Score): 0-7 mild, 8-19 moderate, 20-35 severe
  - guides treatment'
- 'Complications: Acute urinary retention (1-2% per year), hydronephrosis, recurrent
  UTIs, bladder stones'
- 'PSA: May be elevated in BPH (not specific for cancer), 1.5 ng/mL increase per 10g
  prostate tissue'
referrals:
- 'Urology if: Failed medical therapy, recurrent urinary retention, hydronephrosis,
  recurrent UTIs, hematuria, elevated PSA concerning for cancer'
- Most BPH managed by primary care with alpha-blockers +/- 5-ARI
differentials: []
