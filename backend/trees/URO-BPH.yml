tree_id: URO-BPH
name: Benign Prostatic Hyperplasia (BPH)
family: urology
specialty: Urology/Primary Care
icd10: N40.0
snomed: 266569009
urgency: []
homeopathy: []
presentations:
  - Lower urinary tract symptoms (LUTS) - obstructive and irritative
  - Obstructive symptoms (from urethral compression)
  - Weak urinary stream
  - Hesitancy (difficulty initiating urination)
  - Intermittency (stream starts and stops)
  - Incomplete bladder emptying sensation
  - Straining to urinate
  - Prolonged urination
  - Post-void dribbling
  - Irritative symptoms (from bladder irritation/overactivity)
  - Urinary frequency (greater than 8 voids/day)
  - Nocturia (waking at night to urinate)
  - Urgency (sudden strong need to urinate)
  - Typically affects men over 50 years (prevalence increases with age: 50% by age 60, 80% by age 80)
workup:
  - Clinical history and symptom assessment
  - International Prostate Symptom Score (IPSS) questionnaire
  - 7 questions scored 0-5 each (total 0-35)
  - 0-7: mild symptoms
  - 8-19: moderate symptoms
  - 20-35: severe symptoms
  - Quality of life question (0-6)
  - Voiding diary (frequency-volume chart) for 2-3 days
  - Digital rectal examination (DRE)
  - Assess prostate size (normal 20 g, BPH often 30-100+ g)
  - "Assess consistency (BPH: smooth, rubbery, symmetric; cancer: hard, nodular, asymmetric)"
  - Absence of tenderness (tenderness suggests prostatitis)
  - Urinalysis
  - Rule out urinary tract infection
  - Rule out hematuria (suggests bladder cancer or stones)
  - Prostate-specific antigen (PSA)
  - Elevated in BPH (typically 1.5-10 ng/mL, correlates with prostate size)
  - Very elevated (greater than 10 ng/mL) or rapid rise suggests prostate cancer - refer urology
  - Age-specific reference ranges: 40-49 years (less than 2.5), 50-59 (less than 3.5), 60-69 (less than 4.5), 70-79 (less than 6.5)
  - Post-void residual (PVR) urine volume
  - Bladder ultrasound after urination
  - "Less than 50 mL: normal"
  - "50-200 mL: mild-moderate retention"
  - "Greater than 200 mL: significant retention (consider catherization or urgent urology referral)"
  - Uroflowmetry (optional, if available)
  - Measures urine flow rate
  - Peak flow less than 10 mL/sec suggests obstruction
  - Renal function (BMP) if concern for obstructive uropathy
  - Rule out hydronephrosis and renal insufficiency from chronic retention
treatment:
  - Watchful waiting for mild symptoms (IPSS 0-7) with minimal bother
  - Annual monitoring with IPSS, DRE, PSA
  - Lifestyle modifications
  - Avoid caffeine and alcohol (bladder irritants)
  - Limit fluids before bedtime (reduce nocturia)
  - Double voiding technique (urinate, wait, try again)
  - Timed voiding (urinate on schedule, not just when urgent)
  - Review medications (avoid decongestants, antihistamines, anticholinergics - worsen urinary retention)
  - Alpha-1 blockers (FIRST-LINE medical therapy for moderate-severe symptoms)
  - Mechanism: relax smooth muscle in prostate and bladder neck
  - Tamsulosin 0.4 mg daily (most selective, fewer side effects)
  - Alfuzosin 10 mg daily
  - Doxazosin 1-8 mg daily (requires titration)
  - Terazosin 1-10 mg daily (requires titration)
  - Onset: symptom improvement within days to weeks
  - Side effects: orthostatic hypotension, dizziness, retrograde ejaculation
  - 5-alpha reductase inhibitors (for larger prostates greater than 40 g)
  - Mechanism: block conversion of testosterone to DHT, shrink prostate (20-30% volume reduction)
  - Finasteride 5 mg daily
  - Dutasteride 0.5 mg daily (more potent, blocks both type 1 and 2 enzymes)
  - Onset: 3-6 months for maximum effect
  - Side effects: erectile dysfunction, decreased libido, gynecomastia
  - Lower PSA by 50% (must adjust PSA interpretation: multiply by 2)
  - Combination therapy (alpha-blocker + 5-ARI)
  - Most effective for large prostates and moderate-severe symptoms
  - Reduces progression to acute urinary retention and need for surgery by 60-70%
  - Phosphodiesterase-5 inhibitor
  - Tadalafil 5 mg daily (FDA-approved for BPH, also treats erectile dysfunction)
  - Mechanism: relaxes smooth muscle
  - Alternative for men with ED and BPH
  - Surgical interventions (if medical therapy fails or complications)
  - Indications: refractory symptoms, recurrent urinary retention, recurrent UTIs, bladder stones, hydronephrosis, renal insufficiency from obstruction
  - Transurethral resection of prostate (TURP) - gold standard surgery
  - Removes prostate tissue endoscopically
  - 75-90% symptom improvement
  - Side effects: retrograde ejaculation (65-75%), erectile dysfunction (5-10%)
  - Newer minimally invasive procedures
  - Laser ablation/enucleation (GreenLight, HoLEP)
  - Prostatic urethral lift (UroLift)
  - Water vapor thermal therapy (Rezum)
  - Transurethral microwave therapy (TUMT)
  - Less invasive, fewer side effects, faster recovery
  - Simple prostatectomy for very large glands (greater than 80-100 g)
clinical_pearls:
  - "BPH affects 50% of men by age 60, 80% by age 80 - most common benign tumor in men"
  - "Prostate size does NOT correlate with symptom severity - small prostates can cause severe symptoms"
  - "Alpha-blockers provide rapid symptom relief (days-weeks) but do not shrink prostate"
  - "5-ARIs shrink prostate (20-30%) but take 3-6 months for maximal effect"
  - "Combination therapy (alpha-blocker + 5-ARI) most effective, reduces risk of progression by 60-70%"
  - "PSA levels reduced 50% by 5-ARIs - must multiply PSA by 2 for cancer screening"
  - "Acute urinary retention affects 1-2% per year with BPH - requires urgent catheterization"
  - "Alpha-blockers can cause intraoperative floppy iris syndrome during cataract surgery - inform ophthalmologist"
referrals:
  - Urology if PSA greater than 10 ng/mL, abnormal DRE, hematuria (rule out prostate cancer)
  - Urology if refractory to medical therapy or desire for surgical intervention
  - Urology urgent if acute urinary retention, recurrent retention, hydronephrosis, or renal insufficiency from obstruction
differentials:
  - Benign prostatic hyperplasia (enlarged smooth prostate, obstructive and irritative LUTS)
  - Prostate cancer (hard nodular prostate on DRE, very elevated PSA)
  - Overactive bladder (urgency, frequency, nocturia without obstructive symptoms)
  - Urinary tract infection (dysuria, fever, pyuria)
  - Bladder cancer (hematuria, irritative symptoms)
  - Neurogenic bladder (diabetes, spinal cord injury, neurological disease)
  - Prostatitis (painful prostate on DRE, fever, dysuria)
  - Urethral stricture (history of instrumentation or infection)
