tree_id: DERM-FOREIGN-BODY-SKIN
name: Foreign Body in Skin (Encounter)
family: dermatology
specialty: Emergency Medicine, Primary Care, Surgery
chief_complaint: Splinter, foreign object embedded in skin
description: |
  Foreign body embedded in skin requiring removal.
  Common objects - wood splinters, glass, metal fragments, thorns, gravel.
  Risk of infection if retained.
icd10: S61.449A
snomed: "125643008"
presentations:
  - Visible or palpable object in skin
  - Pain, swelling, redness at site
  - History of penetrating injury
  - May have surrounding inflammation or infection
  - Retained foreign body may present days to weeks later with drainage or abscess
urgency: Low
referrals:
  surgery:
    - Deep foreign bodies
    - Foreign bodies near neurovascular structures
    - Unable to remove in office
workup:
  - History of injury - material, depth, location
  - Examine entry site
  - Assess depth by palpation or probing (if superficial)
  - Neurovascular exam
  - X-ray - will show metal, glass (if >2mm), gravel; will NOT show wood, plastic, thorns
  - Ultrasound can identify wood, plastic, and other radiolucent objects
treatment:
  removal_technique:
    superficial:
      - Clean area with antiseptic
      - Local anesthesia if needed
      - Use forceps or needle to remove
      - Irrigate wound
      - Leave open to heal by secondary intention
    deeper:
      - Local anesthesia
      - Make small incision along axis of penetration
      - Blunt dissection to locate and grasp object
      - Irrigate thoroughly
      - Close loosely or leave open if contaminated
  post_removal:
    - Confirm complete removal
    - Tetanus prophylaxis if needed
    - Wound care instructions
    - Antibiotics usually not needed unless signs of infection
  if_unable_to_locate:
    - May observe if inert material and no infection
    - Surgical referral if symptomatic or organic material (wood - high infection risk)
  antibiotics:
    - Not routinely needed
    - Consider if contaminated, organic material (wood), signs of infection
    - Cephalexin 500mg QID or augmentin 875mg BID
clinical_pearls:
  - Wood splinters have high infection risk - must remove completely
  - Glass fragments >2mm visible on X-ray
  - Ultrasound useful for localizing radiolucent foreign bodies
  - Some inert foreign bodies (metal, glass) can be observed if asymptomatic and difficult to remove
  - Organic materials (wood, thorns) must be removed due to infection risk
  - Gravel tattoo - permanent discoloration if not removed early
differentials:
  - Superficial foreign body
  - Deep foreign body
  - Retained foreign body with abscess formation
  - Foreign body granuloma
trace:
  - 8-year-old stepped on wood splinter. 1cm wood fragment visible in plantar heel. Under local anesthesia, splinter removed intact with forceps. Wound irrigated. Tetanus up to date. Wound care instructions. Heals without infection.
citations:
  - UpToDate - Emergency Medicine
  - American Academy of Family Physicians
