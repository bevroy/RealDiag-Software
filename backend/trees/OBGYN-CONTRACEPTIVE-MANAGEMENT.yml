tree_id: OBGYN-CONTRACEPTIVE-MANAGEMENT
name: Contraceptive Management (Encounter)
family: obstetrics_gynecology
specialty: Gynecology/Family Medicine/Primary Care
icd10: Z30.09
snomed: 13197004
urgency: []
homeopathy: []
presentations:
  - Request for contraception counseling
  - Desire to prevent pregnancy
  - New patient seeking to start contraception
  - Established patient requesting different contraceptive method
  - Postpartum or post-abortion contraception
  - Emergency contraception request
  - Irregular bleeding or side effects from current method
  - Desire for permanent contraception (sterilization)
  - Concerns about contraceptive safety or effectiveness
workup:
  - Comprehensive history
  - Reproductive history
  - Pregnancy history (gravidity, parity, outcomes)
  - Current or recent pregnancy/breastfeeding
  - Desire for future pregnancy and timeline
  - Menstrual history (regularity, heaviness, dysmenorrhea)
  - Previous contraceptive use and experience
  - Medical history (screen for contraindications)
  - Cardiovascular: hypertension, DVT/PE history, stroke, MI, migraines with aura
  - Hepatic: liver disease, cirrhosis
  - Cancer: breast cancer history (current or past), endometrial cancer
  - Metabolic: diabetes with complications, obesity (BMI greater than 35)
  - Hematologic: thrombophilia, sickle cell disease
  - Smoking status and age (risk factor for VTE with estrogen)
  - Medications (drug interactions with hormonal contraception)
  - Social history
  - Sexual activity frequency
  - Number of partners, STI risk
  - Substance use
  - Access to healthcare and medication adherence
  - Patient preferences and priorities
  - Effectiveness importance
  - Reversibility
  - Effect on menstrual bleeding
  - Ease of use, privacy
  - Non-contraceptive benefits (acne, dysmenorrhea, menorrhagia)
  - Cost and insurance coverage
  - Physical examination
  - Vital signs (blood pressure REQUIRED before prescribing estrogen-containing methods)
  - BMI calculation
  - Breast examination (if not done recently)
  - Pelvic examination (NOT required before prescribing contraception)
  - Only if IUD insertion, diaphragm fitting, or symptoms requiring exam
  - Pap smear if due (NOT required for contraception initiation)
  - Laboratory evaluation
  - Pregnancy test if indicated
  - No routine labs required before starting contraception
  - Consider additional testing based on medical history
  - Lipid panel if personal/family history cardiovascular disease
  - Liver function tests if history liver disease
  - Thrombophilia testing NOT routinely recommended (use family history)
treatment:
  - Contraceptive options - effectiveness and characteristics
  - Long-acting reversible contraception (LARC) - MOST EFFECTIVE
  - Copper IUD (Paragard)
  - 99.2% effective (failure rate 0.8%)
  - Lasts 10-12 years
  - Non-hormonal
  - May increase menstrual bleeding and cramping
  - Can use for emergency contraception (within 5 days)
  - Levonorgestrel IUD (Mirena, Kyleena, Liletta, Skyla)
  - 99.8% effective (failure rate 0.2%)
  - Duration: 3-8 years depending on type
  - Decreases menstrual bleeding (50% amenorrhea with Mirena)
  - Effective for dysmenorrhea and menorrhagia
  - Etonogestrel implant (Nexplanon)
  - 99.95% effective (failure rate 0.05%)
  - Single rod inserted subdermally in upper arm
  - Lasts 3 years
  - Irregular bleeding common (most common reason for removal)
  - Quick return to fertility after removal
  - Short-acting hormonal methods
  - Combined oral contraceptive pills (COCPs)
  - 91% typical use effectiveness (99.7% perfect use)
  - Take daily at same time
  - Non-contraceptive benefits: regulate cycles, reduce acne, dysmenorrhea, ovarian/endometrial cancer risk
  - Contraindications: age greater than 35 + smoking, migraine with aura, VTE history, uncontrolled hypertension
  - Progestin-only pill (POP, minipill)
  - 91% typical use effectiveness
  - Take daily at same time (3-hour window)
  - Safe with breastfeeding, no estrogen contraindications
  - Irregular bleeding common
  - Contraceptive patch (Xulane, Twirla)
  - 91% typical use effectiveness
  - Apply weekly for 3 weeks, patch-free week for withdrawal bleeding
  - Same contraindications as COCPs
  - Less effective if weight greater than 90 kg
  - Contraceptive vaginal ring (NuvaRing, Annovera)
  - 91% typical use effectiveness
  - Insert for 3 weeks, remove for 1 week
  - Same contraindications as COCPs
  - Injectable contraception
  - Depo-Provera (medroxyprogesterone acetate)
  - 94% typical use effectiveness
  - 150 mg IM injection every 12-13 weeks
  - Delay return to fertility (average 10 months after last injection)
  - Weight gain common (average 5-10 lbs over 2 years)
  - Bone density concerns (reversible after discontinuation)
  - May cause amenorrhea (benefit for some)
  - Barrier methods
  - Male condoms
  - 85% typical use effectiveness
  - Only method that prevents STIs
  - Recommend as dual protection with hormonal methods for STI prevention
  - Female condom
  - 79% typical use effectiveness
  - Protects against STIs
  - Diaphragm with spermicide
  - 88% typical use effectiveness
  - Requires fitting, insertion before intercourse
  - Fertility awareness-based methods
  - 76-88% typical use effectiveness
  - Requires tracking menstrual cycles, ovulation signs
  - Apps and wearable devices may improve effectiveness
  - Best for highly motivated couples
  - Emergency contraception
  - Levonorgestrel (Plan B One-Step, Take Action)
  - 1.5 mg PO single dose within 72 hours (sooner better)
  - 89% effective within 72 hours
  - Available over-the-counter, no age restriction
  - Less effective if BMI greater than 25-30
  - Ulipristal acetate (Ella)
  - 30 mg PO single dose within 120 hours (5 days)
  - More effective than levonorgestrel, especially after 72 hours
  - Requires prescription
  - More effective in obese women
  - Copper IUD
  - Most effective emergency contraception (99%)
  - Insert within 5 days of unprotected intercourse
  - Provides ongoing contraception for 10-12 years
  - Permanent contraception (sterilization)
  - Female sterilization (tubal ligation, tubal occlusion)
  - 99.5% effective
  - Laparoscopic bilateral tubal ligation (most common)
  - Hysteroscopic occlusion (Essure - no longer available in US)
  - Permanent, reversal difficult and expensive
  - Male sterilization (vasectomy)
  - 99.85% effective
  - Outpatient procedure, local anesthesia
  - Less invasive and less expensive than tubal ligation
  - Semen analysis at 3 months to confirm success
  - Takes 3 months or 20 ejaculations to clear sperm
  - Counseling and shared decision-making
  - Discuss effectiveness, side effects, non-contraceptive benefits
  - Use WHO Medical Eligibility Criteria (MEC) to guide selection
  - Category 1: no restriction
  - Category 2: benefits outweigh risks
  - Category 3: risks usually outweigh benefits (use alternative)
  - Category 4: unacceptable health risk (do not use)
  - Provide written information and resources
  - Offer same-day start for hormonal methods (Quick Start)
  - Use backup method or abstain for 7 days (except IUD, implant immediately effective)
clinical_pearls:
  - 'LARC methods (IUD, implant) most effective contraception - over 99% efficacy, comparable to sterilization'
  - 'Pelvic exam NOT required before prescribing hormonal contraception - removes unnecessary barrier to access'
  - 'Quick Start: can start hormonal contraception any day if reasonably certain not pregnant - improves adherence'
  - 'Combined hormonal contraception (COCPs, patch, ring) contraindicated if smoking + age greater than 35 (VTE risk)'
  - 'Copper IUD most effective emergency contraception (99%) and provides ongoing contraception for 10-12 years'
  - 'Progestin-only methods safe with breastfeeding - estrogen can decrease milk supply'
  - 'Return to fertility immediate after IUD/implant removal, but delayed 10 months average after Depo-Provera'
  - 'Male condoms only contraceptive method that prevents STIs - recommend dual protection (condom + hormonal method)'
referrals:
  - Gynecology for IUD or implant insertion if primary care provider not trained
  - Family planning clinic for comprehensive contraceptive services and subsidized options
  - Urology for vasectomy consultation
  - Gynecologic surgery for tubal ligation consultation
  - Adolescent medicine for contraception counseling in minors
differentials:
  - Routine contraceptive counseling (healthy patient seeking birth control)
  - Contraception with medical comorbidities (requires careful selection based on WHO MEC)
  - Postpartum contraception (timing varies by method - immediate postplacental IUD vs 6 weeks for estrogen methods)
  - Post-abortion contraception (can start immediately, including LARC)
  - Emergency contraception (unprotected intercourse within past 5 days)
  - Contraceptive failure or missed pills (need for emergency contraception and counseling)
  - Side effects from current method (irregular bleeding, weight gain, mood changes)
  - Desire for permanent contraception (sterilization counseling)
