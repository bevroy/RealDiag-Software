tree_id: ENT-EPIGLOTTITIS
name: Epiglottitis
family: Ent
specialty: Ent
icd10:
- J05.10
snomed:
- 80384002
urgency: medium
description: Comprehensive evaluation and management of Epiglottitis
version: '1.0'
citations:
  - AAO-HNS (American Academy of Otolaryngology–Head and Neck Surgery) Clinical Practice Guidelines
  - British Society of Otology Guidelines
  - UpToDate - Otolaryngology
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Severe sore throat
- High fever
- Drooling
- Stridor
- Tripod position (leaning forward)
- Muffled voice
- Dysphagia
- Medical emergency - airway obstruction risk
- Thumb sign on lateral neck X-ray
workup:
- DO NOT obtain labs or imaging if diagnosis suspected - risk of airway obstruction
  during procedures
- 'Lateral neck X-ray (portable at bedside if stable): Thumb sign (swollen epiglottis)
  - but don''t delay treatment'
- Visualization of cherry-red epiglottis with fiberoptic laryngoscopy - only in controlled
  setting by ENT/anesthesia
- Blood cultures after airway secured
treatment:
- 'Guideline-based treatment options for Epiglottitis include:'
- Call anesthesia/ENT IMMEDIATELY - do not leave patient unattended (AAO-HNS 2023)
- Keep patient calm, sitting upright in position of comfort (tripod position) (AAO-HNS
  2023)
- 'Secure airway in controlled setting: Intubation or tracheostomy (difficult intubation
  - swollen epiglottis) (AAO-HNS 2023)'
- 'Antibiotics AFTER airway secured: Ceftriaxone 2g IV q24h OR cefotaxime 2g IV q8h
  (AAO-HNS 2023)'
- Add vancomycin 15-20mg/kg IV q12h if concern for MRSA (AAO-HNS 2023)
clinical_pearls:
- Life-threatening airway emergency - can progress to complete obstruction in hours
- '4 D''s: Drooling, Dysphagia, Dysphonia (muffled voice), Distress (respiratory)'
- 'Organism: H. influenzae type B (rare now due to Hib vaccine), Strep species, Staph
  aureus'
- 'Peak age: Adults (20-40 years) now more common than children since Hib vaccine
  introduced'
- DO NOT examine oropharynx with tongue depressor - may precipitate laryngospasm and
  airway obstruction
referrals:
- ENT + Anesthesia STAT - airway emergency
- ICU admission for airway monitoring after intubation
- Average intubation duration 2-3 days, then extubation when epiglottis improved on
  direct visualization
differentials:
  - Croup
  - Bacterial tracheitis
  - Peritonsillar abscess
  - Foreign body
  - Angioedema
