tree_id: SURG-APPENDICITIS
name: Acute Appendicitis
family: surgical
specialty: General Surgery
chief_complaint: Right lower quadrant abdominal pain, nausea, vomiting
description: Acute inflammation of the vermiform appendix requiring surgical intervention
icd10: K35.80
urgency: emergency
workup:
  - Clinical history - periumbilical pain migrating to right lower quadrant (RLQ) over 12-24 hours
  - Anorexia (nearly universal), nausea, vomiting (after pain onset)
  - Low-grade fever (38-38.5C), higher fever suggests perforation
  - Physical examination
  - Right lower quadrant tenderness, maximal at McBurney point (two-thirds distance from umbilicus to ASIS)
  - Rebound tenderness, guarding (peritoneal irritation)
  - Rovsing sign (RLQ pain with LLQ palpation)
  - Psoas sign (RLQ pain with right hip extension - retrocecal appendix)
  - Obturator sign (RLQ pain with internal rotation of flexed right hip - pelvic appendix)
  - Laboratory studies
  - Complete blood count - leukocytosis (WBC 10-18 K/uL) with left shift
  - C-reactive protein (CRP) - elevated, increases sensitivity when combined with WBC
  - Urinalysis - may show few WBCs/RBCs if appendix near bladder/ureter
  - Pregnancy test in women of childbearing age (rule out ectopic pregnancy)
  - Imaging
  - CT abdomen/pelvis with IV contrast (adults) - sensitivity 95%, specificity 94%
  - Findings - dilated appendix greater than 6 mm, wall thickening, periappendiceal fat stranding, appendicolith
  - Ultrasound (children, pregnant women, thin patients) - less radiation
  - Non-compressible appendix greater than 6 mm diameter
  - MRI (pregnant women if ultrasound non-diagnostic)
  - Clinical scoring systems
  - Alvarado score (MANTRELS) - Migration of pain, Anorexia, Nausea, Tenderness RLQ, Rebound, Elevated temp, Leukocytosis, Shift to left
  - Score 0-10, less than 5 low probability, 5-6 equivocal, 7-10 high probability
treatment:
  - Appendectomy - definitive treatment
  - Laparoscopic appendectomy preferred (less pain, faster recovery, lower wound infection)
  - Open appendectomy if perforation with abscess, severe inflammation, hemodynamic instability
  - Timing - emergent surgery within 12-24 hours (no benefit to middle-of-night surgery if stable)
  - Preoperative management
  - NPO, IV fluids for hydration
  - Broad-spectrum antibiotics (cover gram-negative and anaerobes)
  - Cefoxitin 2 g IV or cefotetan 2 g IV (single agent)
  - Or combination - ceftriaxone 1 g IV plus metronidazole 500 mg IV
  - Piperacillin-tazobactam 3.375 g IV if severe
  - Pain control - opioids acceptable (does not mask diagnosis)
  - Antiemetics as needed
  - Non-operative management (antibiotics alone) - emerging approach for uncomplicated appendicitis
  - Success rate 70-80% but 20-40% recurrence within 1 year
  - Consider in poor surgical candidates or patient preference after informed consent
  - Perforated appendicitis with abscess greater than 3 cm
  - Percutaneous drainage plus antibiotics, interval appendectomy 6-8 weeks later
  - Postoperative antibiotics
  - None needed if non-perforated, simple appendicitis
  - 4-7 days IV antibiotics if perforated (can transition to oral once afebrile, tolerating diet, normal WBC)
clinical_pearls:
  - Most common surgical emergency, lifetime risk 7-8%
  - Peak incidence age 10-30 years, but can occur at any age
  - Classic presentation only in 50-60% of cases, atypical presentations common
  - Elderly and very young - higher perforation rates (25-30%) due to delayed diagnosis
  - Pregnant women - displaced appendix location (right upper quadrant in third trimester)
  - Perforation risk increases significantly after 24 hours of symptoms
  - Negative appendectomy rate 10-20% acceptable to avoid missing cases
  - Appendiceal stump leak is most feared complication (1-3% incidence)
  - Differential includes many conditions - maintain high index of suspicion
  - Appendicolith on imaging strongly predictive of appendicitis and perforation
differentials:
  - Gastroenteritis (diarrhea before pain, no focal RLQ tenderness)
  - Mesenteric lymphadenitis (often viral prodrome, less severe tenderness)
  - Ovarian torsion (sudden onset, adnexal mass on ultrasound)
  - Ectopic pregnancy (positive pregnancy test, adnexal mass)
  - Pelvic inflammatory disease (bilateral tenderness, cervical motion tenderness, STI risk factors)
  - Ruptured ovarian cyst (mid-cycle timing, free fluid on imaging)
  - Nephrolithiasis (colicky flank pain, hematuria, stone on CT)
  - Crohn disease (chronic symptoms, terminal ileum involvement)
  - Diverticulitis (older patient, LLQ pain more common)
  - Testicular torsion (scrotal pain, absent cremasteric reflex)
trace:
  - 19-year-old college student presents to ED with 18-hour history of abdominal pain
  - Pain started periumbilical region yesterday morning, gradually moved to right lower abdomen
  - Pain now constant 8/10, worse with movement, coughing
  - Nausea with 2 episodes vomiting, no appetite since yesterday
  - No diarrhea, last bowel movement yesterday (normal)
  - Low-grade fever at home (37.8C)
  - No recent sick contacts, no travel
  - Past medical history - none, no prior surgeries
  - Medications - none
  - Physical exam - appears uncomfortable, prefers to lie still
  - Vitals - temp 38.3C, HR 98, BP 125/75, RR 18
  - Abdomen - decreased bowel sounds, voluntary guarding
  - Marked tenderness right lower quadrant with rebound tenderness
  - Maximal tenderness at McBurney point
  - Positive Rovsing sign, negative psoas and obturator signs
  - No palpable masses, no hernias
  - Labs - WBC 16.2 K/uL (elevated) with 85% neutrophils (left shift)
  - CRP 45 mg/L (elevated)
  - Comprehensive metabolic panel normal
  - Urinalysis - 5-10 WBCs per HPF, no bacteria (likely adjacent inflammation)
  - Pregnancy test negative
  - Alvarado score - 9 points (high probability)
  - CT abdomen/pelvis with IV contrast ordered
  - CT findings - dilated fluid-filled appendix 11 mm diameter, wall thickening
  - Periappendiceal fat stranding, no free air, no abscess, no appendicolith
  - Diagnosis - Acute appendicitis, uncomplicated
  - NPO, IV normal saline at 125 mL/hr for hydration
  - Cefoxitin 2 g IV administered preoperatively
  - Hydromorphone 1 mg IV for pain control
  - Ondansetron 4 mg IV for nausea
  - General surgery consultation - agreed with diagnosis, scheduled for laparoscopic appendectomy
  - Surgery performed 6 hours after presentation
  - Laparoscopic appendectomy via 3 ports
  - Intraoperative findings - inflamed, edematous appendix without perforation
  - Appendix removed, no complications
  - Operative time 45 minutes, estimated blood loss minimal
  - Pathology - acute suppurative appendicitis, no perforation, no tumor
  - Postoperative course - uncomplicated
  - Tolerating clear liquids evening of surgery
  - Ambulating, pain well-controlled with oral medications
  - No postoperative antibiotics given (non-perforated)
  - Discharged home postoperative day 1
  - Instructions - advance diet as tolerated, limit heavy lifting for 2 weeks, return to activities as tolerated
  - Follow-up in surgery clinic in 2 weeks
  - 2-week follow-up - incisions healing well, minimal discomfort
  - Returned to full activities including sports
  - Outcome - Excellent result with complete recovery
