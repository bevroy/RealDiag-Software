tree_id: INFECTIOUS-URINARY-TRACT-INFECTION
name: Urinary Tract Infection
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Dysuria and urinary frequency
description: |
  Bacterial infection of urinary tract. Most common bacterial infection, affects 50% of women in lifetime.
  Uncomplicated cystitis (bladder only) vs pyelonephritis (kidney involvement). E. coli most common pathogen (80%).
icd10: N39.0
urgency: Moderate
workup:
  - Urinalysis shows positive leukocyte esterase, nitrites, WBCs, bacteria (pyuria >10 WBC/hpf)
  - Urine culture if pyelonephritis, complicated UTI, pregnancy, treatment failure, or recurrent UTIs (identifies organism and sensitivities)
  - Urine culture not needed for uncomplicated cystitis in non-pregnant women
  - Blood cultures if pyelonephritis or sepsis suspected
  - Renal ultrasound if pyelonephritis not responding to antibiotics in 48-72 hours (assess for abscess, obstruction)
  - Consider STI testing (gonorrhea, chlamydia) if dysuria with negative urinalysis in young sexually active patients
treatment:
  - Uncomplicated cystitis - nitrofurantoin 100mg BID x 5 days (first-line, minimal resistance)
  - Alternative trimethoprim-sulfamethoxazole DS BID x 3 days (if local resistance <20%)
  - Fosfomycin 3g single dose alternative (less effective but convenient)
  - Fluoroquinolone (ciprofloxacin 250mg BID x 3 days, levofloxacin 750mg daily x 3 days) reserved for pyelonephritis or resistant organisms
  - Pyelonephritis outpatient - ciprofloxacin 500mg BID x 7 days or levofloxacin 750mg daily x 5 days
  - Pyelonephritis inpatient - ceftriaxone 1g IV daily or ampicillin-gentamicin until afebrile 24-48 hours, then oral to complete 7-14 days
  - Phenazopyridine for dysuria symptom relief (but does not treat infection)
  - Recurrent UTIs (≥2 in 6 months) - consider prophylaxis with nitrofurantoin 50-100mg nightly or post-coital
clinical_pearls:
  - Uncomplicated UTI defined as healthy non-pregnant women with cystitis symptoms
  - Complicated UTI includes men, pregnancy, immunocompromised, structural abnormalities, catheter, pyelonephritis
  - Pyelonephritis symptoms include fever, flank pain, CVA tenderness, nausea/vomiting
  - Asymptomatic bacteriuria is positive culture without symptoms (only treat in pregnancy or before urologic procedures)
  - Pregnancy requires screening all pregnant women for bacteriuria (7-day treatment reduces pyelonephritis and preterm birth)
  - Recurrence prevention includes increased fluid intake, voiding after intercourse, cranberry products may help
differentials:
  - Pyelonephritis
  - Urethritis (gonorrhea, chlamydia)
  - Vaginitis
  - Interstitial cystitis
  - Kidney stone
  - Prostatitis (in men)
trace:
  - Dysuria, frequency, urgency x 2 days → Urinalysis shows leukocyte esterase and nitrites positive → Diagnose uncomplicated cystitis → Nitrofurantoin 100mg BID x 5 days → Symptoms resolve in 24-48 hours → Complete 5-day course → If recurrent (3rd UTI in 6 months), consider prophylactic nitrofurantoin 50mg nightly
