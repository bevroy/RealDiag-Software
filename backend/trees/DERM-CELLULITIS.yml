tree_id: DERM-CELLULITIS
name: Cellulitis
family: Dermatology
specialty: Dermatology
icd10:
- L03.90
- L03.115
snomed:
- '128045006'
urgency: medium
description: Comprehensive evaluation and management of Cellulitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Erythema and warmth (localized skin redness)
- Pain and tenderness of affected area
- Swelling, edema
- Fever, chills if systemic infection
- Regional lymphadenopathy (swollen lymph nodes)
- Poorly demarcated borders (vs erysipelas with sharp, raised borders)
- 'Most common organisms: Streptococcus pyogenes (Group A Strep), Staphylococcus aureus'
- 'Risk factors: Skin breaks, lymphedema, venous insufficiency, obesity, diabetes'
- Lymphangitis (red streaks extending from infection site)
- Purulent drainage suggests abscess - needs incision and drainage (I&D)
- 'MRSA risk factors: IVDU, recent hospitalization, prior MRSA, purulent drainage'
- Mark borders with pen to track progression or improvement on antibiotics
workup:
- Blood cultures if febrile or systemically ill (low yield but important if positive)
- CBC with differential (leukocytosis expected)
- Wound culture if purulent drainage present
- Imaging (ultrasound or MRI) if concern for abscess or necrotizing infection
treatment:
- 'Guideline-based treatment options for Cellulitis include:'
- 'Mild (outpatient): Cephalexin 500mg PO q6h or clindamycin 300mg PO q8h for 5-10
  days (AAD 2023)'
- 'MRSA coverage: Add TMP-SMX DS BID or doxycycline 100mg BID to beta-lactam (AAD
  2023)'
- 'Moderate-severe (admit): Vancomycin 15-20mg/kg IV q12h or cefazolin 1-2g IV q8h
  (AAD 2023)'
- Elevation and rest of affected limb (AAD 2023)
- NSAIDs for pain and inflammation (AAD 2023)
clinical_pearls:
- 'Most common organisms: Strep pyogenes (group A strep) and Staph aureus'
- Mark borders with pen to track progression on antibiotics
- 'MRSA risk factors: IV drug use, recent hospitalization, prior MRSA, purulent drainage'
- 'Recurrent cellulitis: Treat tinea pedis, maintain skin integrity'
- Purpura or bullae suggest necrotizing fasciitis - surgical emergency
referrals:
- Hospital admission for severe infection, immunocompromise, facial involvement, or
  failed outpatient therapy
- Surgery consult if concern for necrotizing fasciitis or deep abscess
differentials: []
