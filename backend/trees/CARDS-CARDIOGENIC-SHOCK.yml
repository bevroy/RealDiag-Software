tree_id: CARDS-CARDIOGENIC-SHOCK
name: Cardiogenic Shock
family: Cardiology
specialty: Emergency Medicine
chief_complaint: Hypotension and hypoperfusion from cardiac pump failure
description: Life-threatening condition with inadequate cardiac output causing hypotension and end-organ hypoperfusion. Most commonly from acute MI (STEMI), acute decompensated HF, mechanical complications. Requires emergent revascularization if ACS, inotropes/vasopressors, mechanical circulatory support (IABP, Impella, ECMO). High mortality 40-50%.
icd10: R57.0
snomed: 27942005
presentations:
  - Hypotension: SBP <90 mmHg or MAP <65 mmHg
  - Signs of hypoperfusion: cool, clammy skin, delayed capillary refill
  - Altered mental status: confusion, lethargy
  - Oliguria: urine output <0.5 mL/kg/hr
  - Dyspnea, tachypnea (pulmonary edema)
  - Tachycardia (compensatory), narrow pulse pressure
urgency: emergency

referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Clinical presentation (shock state):
  - Hypotension (SBP under 90 mmHg for over 30 minutes)
  - Tachycardia (compensatory response)
  - End-organ hypoperfusion signs:
  - Cool extremities from peripheral vasoconstriction
  - Altered mental status from cerebral hypoperfusion
  - Oliguria (urine output under 30 mL/hr from renal hypoperfusion)
  - Elevated lactate over 2 mmol/L (tissue hypoperfusion, anaerobic metabolism)
  - Pulmonary congestion (dyspnea, crackles, pulmonary edema)
  - Hemodynamics with Swan-Ganz catheter if available:
  - Cardiac index under 2.2 L/min/m² (reduced cardiac output)
  - PCWP over 18 mmHg (elevated LV filling pressures)
  - SVR elevated (compensatory vasoconstriction)
  - Etiology identification:
  - Acute MI most common (40-50%), STEMI with large infarct
  - Acute decompensated HF from severe HFrEF
  - Mechanical complications of MI including acute MR from papillary muscle rupture (new holosystolic murmur), VSD from ventricular septal rupture (harsh holosystolic murmur with thrill), free wall rupture causing tamponade or sudden death
  - RV infarction from inferior STEMI with RV involvement (elevated JVP, clear lungs, hypotension)
  - Acute valvular disease (acute severe MR or AR)
  - Myocarditis (fulminant viral myocarditis)
  - Takotsubo cardiomyopathy with apical ballooning
  - Physical exam findings:
  - Cold and wet presentation (cool extremities with congestion including crackles and elevated JVP)
  - Hypotension (SBP under 90 mmHg)
  - Tachycardia (over 100 bpm)
  - Altered mental status (confusion or obtundation)
  - Oliguria (under 30 mL/hr)
  - New murmur if mechanical complication (MR or VSD)
  - Imaging:
  - Urgent echocardiogram to assess LV function, wall motion abnormalities, mechanical complications, tamponade
  - Chest X-ray showing pulmonary edema
  - Labs:
  - Troponin if ACS suspected
  - Lactate over 2 mmol/L (tissue hypoperfusion)
  - Renal function with elevated creatinine (cardiorenal syndrome)
  - Liver function with elevated ALT/AST if hepatic congestion
  - ABG showing metabolic acidosis
  - ECG showing acute MI (STEMI) or arrhythmia

treatment:
  - ABCs (airway, breathing, circulation)
  - Supplemental oxygen if hypoxemic
  - Mechanical ventilation if respiratory failure
  - Revascularization if ACS (HIGHEST PRIORITY):
  - Emergent PCI or CABG to restore blood flow to ischemic myocardium
  - Door-to-balloon under 90 minutes for STEMI
  - Early revascularization most important intervention to reduce mortality
  - Inotropes to increase contractility:
  - Dobutamine (beta-1 agonist, first-line) starting 2.5 mcg/kg/min, titrate to effect (max 20 mcg/kg/min), improves cardiac output but risk arrhythmias
  - Milrinone (phosphodiesterase inhibitor, inotrope and vasodilator) at 0.375-0.75 mcg/kg/min, use if inadequate response to dobutamine
  - Vasopressors if profound hypotension:
  - Norepinephrine first-line vasopressor if SBP under 70 mmHg, starting 0.1 mcg/kg/min, titrate to MAP over 65 mmHg, avoid excessive vasoconstriction (increases afterload)
  - Mechanical circulatory support options:
  - IABP (intra-aortic balloon pump) with counterpulsation inflating during diastole (augment coronary perfusion) and deflating during systole (reduce afterload), first-line device widely available, improves hemodynamics but no mortality benefit in trials
  - Impella percutaneous LV assist device with continuous flow pump that unloads LV, provides greater hemodynamic support than IABP
  - ECMO (extracorporeal membrane oxygenation) with veno-arterial ECMO for full cardiopulmonary support, bridge to recovery or transplant, requires expertise with high complication rate, VA-ECMO if refractory shock despite inotropes/vasopressors
  - Diuretics if pulmonary congestion:
  - Cautious use to avoid overdiuresis (preload-dependent)
  - Treat mechanical complications:
  - Acute MR requires emergency surgery (mitral valve repair/replacement)
  - VSD requires emergency surgery (patch closure)
  - Free wall rupture requires emergency pericardiocentesis and surgery
  - RV infarction requires fluid resuscitation (preload-dependent, avoid diuretics) and inotropes
  - Avoid beta blockers and ACE inhibitors initially (worsen hypotension)
  - ICU monitoring with arterial line, Swan-Ganz catheter, continuous cardiac monitoring

clinical_pearls:
  - Cardiogenic shock defined as SBP under 90 mmHg, cardiac index under 2.2, end-organ hypoperfusion
  - Most commonly from STEMI with large infarct (40-50%)
  - Cold and wet presentation with cool extremities and pulmonary congestion
  - Emergent revascularization if ACS is most important intervention
  - Inotropes with dobutamine first-line, milrinone if inadequate response
  - Mechanical circulatory support includes IABP, Impella, ECMO
  - High mortality 40-50% despite treatment
  - Lactate over 2 mmol/L indicates tissue hypoperfusion

differentials:
  - Hypovolemic shock from volume depletion without pulmonary congestion
  - Distributive shock from sepsis with warm extremities initially
  - Obstructive shock from PE, tamponade, tension pneumothorax
  - RV infarction with elevated JVP, clear lungs, hypotension (preload-dependent)

trace: |
  A 58-year-old man with no cardiac history presented to ED with 2 hours severe chest pain. Initial vitals: BP 105/70, HR 95. ECG: anterior STEMI (ST elevations V1-V5). Activated cath lab for emergent PCI. Troponin 8.5 ng/mL (markedly elevated). Aspirin 325 mg chewed, ticagrelor 180 mg, heparin bolus. Transferred to cath lab. Coronary angiography: 100% occlusion proximal LAD (culprit - large territory at risk). During PCI, developed hypotension: BP 75/50 mmHg (sudden drop - cardiogenic shock). Tachycardia 115 bpm. Exam: cool extremities (hypoperfusion), altered mental status (confusion from cerebral hypoperfusion), crackles bilaterally (pulmonary edema), urine output 15 mL/hr (oliguria - renal hypoperfusion). Diagnosed with cardiogenic shock from STEMI (cold and wet presentation). Started norepinephrine 0.15 mcg/kg/min (vasopressor for profound hypotension), dobutamine 5 mcg/kg/min (inotrope to improve contractility). Successfully opened LAD with stent placement (revascularization completed - most important intervention). However, large infarct. Post-PCI echo in cath lab: EF 25% (severely reduced from large anterior infarct), anterior and septal akinesis. BP improved to 85/55 on pressors but still in shock. Labs: lactate 4.2 mmol/L (elevated - tissue hypoperfusion), creatinine 1.8 mg/dL (baseline 1.0 - cardiorenal syndrome). Given persistent shock despite revascularization and inotropes/pressors, inserted IABP (intra-aortic balloon pump) for mechanical circulatory support. IABP improved hemodynamics: BP increased to 95/60, cardiac output improved, lactate trended down. Transferred to cardiac ICU on IABP, dobutamine, norepinephrine. ICU Day 1: continued inotropic support, IABP. Lactate decreased to 2.8 mmol/L (improving). Urine output improved to 40 mL/hr. Creatinine 2.1 mg/dL (worsening cardiorenal syndrome). Started diuresis with furosemide 40 mg IV BID (gentle diuresis for pulmonary edema). ICU Day 2: hemodynamics improving, weaned norepinephrine off. Continued dobutamine and IABP. Lactate normalized to 1.5 mmol/L (tissue perfusion restored). ICU Day 3: further hemodynamic improvement, BP 100/65 off pressors. Weaned dobutamine from 5 to 2.5 mcg/kg/min. Creatinine improved to 1.9 mg/dL. ICU Day 4: weaned off dobutamine, removed IABP. BP stable 105/70 off all pressors and inotropes. Repeat echo: EF 30% (slightly improved from 25%). Large anterior wall akinesis but viable myocardium in other territories. Started GDMT: low-dose carvedilol 3.125 mg BID (beta blocker - start low in shock recovery), lisinopril 5 mg daily (ACE inhibitor - start low), spironolactone 25 mg daily, dapagliflozin 10 mg daily, torsemide 20 mg daily. Aspirin 81 mg, ticagrelor 90 mg BID (DAPT x12 months), atorvastatin 80 mg (high-intensity statin). ICU Day 5: transferred to step-down unit, hemodynamically stable. Day 7: transferred to floor. Ambulating without dyspnea, NYHA class II. Creatinine improved to 1.3 mg/dL. Day 10: discharged with close follow-up, cardiac rehab. At 3 months: uptitrated GDMT to target doses, repeat echo EF 35% (improvement with remodeling and GDMT). ICD placed for primary prevention (EF under 35% after 3 months optimal therapy). At 1 year: EF improved to 40%, no HF hospitalizations, NYHA class II, excellent functional capacity. Survived cardiogenic shock with emergent revascularization, mechanical circulatory support, inotropes, and comprehensive post-shock care.
