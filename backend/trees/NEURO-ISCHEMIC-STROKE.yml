tree_id: NEURO-ISCHEMIC-STROKE
name: Acute Ischemic Stroke
family: Neurology
specialty: Neurology  
chief_complaint: Sudden onset focal neurological deficit
description: Acute loss of blood flow to brain causing neurological deficit lasting over 24 hours (versus TIA under 24 hours). Time-sensitive emergency requiring rapid evaluation and treatment. Thrombolytic therapy with IV tPA within 4.5 hours and mechanical thrombectomy within 24 hours for large vessel occlusion improve outcomes. FAST mnemonic (Face drooping, Arm weakness, Speech difficulty, Time to call 911) helps public recognition. Stroke severity assessed by NIHSS score. Workup includes non-contrast CT to exclude hemorrhage, vascular imaging to identify large vessel occlusion, and evaluation for stroke etiology.
icd10: I63.9
urgency: emergent

workup:
  - Rapid initial assessment (door-to-imaging goal under 25 minutes):
    - ABCs and vital signs (assess airway, breathing, circulation)
    - Fingerstick glucose (hypoglycemia can mimic stroke)
    - Rapid neurological exam with NIHSS scoring
    - Establish last known well time (critical for treatment decisions)
    - FAST screening by EMS or triage:
      - Face drooping (ask patient to smile, check for facial asymmetry)
      - Arm weakness (ask patient to raise both arms, check for drift)
      - Speech difficulty (ask patient to repeat phrase, assess for slurred speech or aphasia)
      - Time to call 911 (note symptom onset time)
  - Clinical presentation varies by vascular territory:
    - Anterior circulation (carotid territory, 80% of strokes):
      - Middle cerebral artery (MCA, most common):
        - Contralateral hemiparesis and hemisensory loss
        - Facial droop and arm/leg weakness
        - Homonymous hemianopsia (vision loss same side both eyes)
        - Aphasia if dominant hemisphere (usually left)
        - Neglect and anosognosia if non-dominant hemisphere (usually right)
        - Gaze preference toward lesion side
      - Anterior cerebral artery (ACA):
        - Contralateral leg weakness greater than arm
        - Personality changes and abulia
        - Urinary incontinence
      - Internal carotid artery occlusion:
        - MCA + ACA territory involvement
        - May have ipsilateral monocular vision loss (amaurosis fugax)
    - Posterior circulation (vertebrobasilar territory, 20% of strokes):
      - Posterior cerebral artery (PCA):
        - Homonymous hemianopsia with macular sparing
        - Memory impairment
        - Alexia without agraphia
      - Brainstem (vertebral or basilar artery):
        - Crossed findings (ipsilateral cranial nerve, contralateral motor/sensory)
        - Vertigo, nausea, vomiting
        - Diplopia and dysarthria
        - Ataxia and incoordination
        - Altered consciousness if bilateral
        - Locked-in syndrome if basilar artery occlusion
      - Cerebellar:
        - Ataxia and incoordination
        - Vertigo and nausea
        - Dysarthria and dysphagia
        - Risk of herniation if large infarct with edema
  - NIHSS (NIH Stroke Scale) scoring (0-42 points, higher worse):
    - Level of consciousness (0-3)
    - Best gaze (0-2)
    - Visual fields (0-3)
    - Facial palsy (0-3)
    - Motor arm left and right (0-4 each)
    - Motor leg left and right (0-4 each)
    - Limb ataxia (0-2)
    - Sensory (0-2)
    - Best language/aphasia (0-3)
    - Dysarthria (0-2)
    - Extinction/inattention (0-2)
    - Score 0-4 minor stroke, 5-15 moderate stroke, 16-20 moderate to severe, over 20 severe stroke
    - Score over 6 suggests large vessel occlusion (consider thrombectomy)
  - Imaging (non-contrast CT head is first-line):
    - Immediate non-contrast CT head (door-to-CT goal under 25 minutes):
      - Exclude intracranial hemorrhage (contraindication to tPA)
      - Assess for early ischemic changes (hyperdense MCA sign, loss of grey-white differentiation, sulcal effacement)
      - Large infarct with mass effect may have poor prognosis
      - ASPECTS score (Alberta Stroke Program Early CT Score) predicts hemorrhage risk
    - CT angiography (CTA) head and neck:
      - Identify large vessel occlusion for thrombectomy consideration
      - Assess for carotid stenosis or occlusion
      - Perform simultaneously with non-contrast CT to save time
    - CT perfusion (if available, helps select thrombectomy candidates in extended window):
      - Identifies penumbra (salvageable tissue)
      - Core infarct versus penumbra mismatch guides late thrombectomy
    - MRI brain with DWI/ADC (more sensitive than CT):
      - Shows acute infarction within minutes (DWI hyperintensity, ADC hypointensity)
      - Useful if symptom onset over 4.5 hours or uncertain onset time (wake-up stroke)
      - MRA for vascular assessment if CTA not done
      - Not required before tPA if CT excludes hemorrhage
  - Laboratory evaluation (do not delay imaging or treatment):
    - Point-of-care glucose (hypoglycemia mimics stroke)
    - CBC (platelets needed if considering tPA, check for thrombocytopenia)
    - Coagulation studies (PT/INR, aPTT for anticoagulation status)
    - Troponin (MI can cause stroke, stroke can cause troponin elevation)
    - BMP (renal function, electrolytes)
    - Lipid panel for secondary prevention
    - HgbA1c for diabetes screening
  - Etiologic workup (for secondary prevention):
    - ECG and telemetry monitoring (atrial fibrillation in 20% of strokes)
    - Transthoracic echocardiogram (assess for cardioembolism, PFO)
    - Transesophageal echocardiogram if TTE non-diagnostic and high suspicion for cardioembolic source
    - Carotid ultrasound (duplex) to assess for stenosis
    - Thrombophilia workup if young stroke or no clear etiology

treatment:
  - Acute phase (time-critical interventions):
    - IV tissue plasminogen activator (tPA/alteplase):
      - Indications: Ischemic stroke within 4.5 hours of symptom onset
      - Dose: 0.9 mg/kg (max 90 mg), 10% bolus then 90% over 60 minutes
      - Must exclude contraindications:
        - Intracranial hemorrhage on imaging
        - Recent major surgery or trauma (within 14 days)
        - History of intracranial hemorrhage
        - Gastrointestinal bleed within 21 days
        - Platelets under 100k, INR over 1.7, aPTT elevated
        - Uncontrolled hypertension (BP over 185/110 despite treatment)
        - Glucose under 50 or over 400
        - Seizure at stroke onset with post-ictal residual deficits
        - Large infarct (over one-third MCA territory)
      - Monitor for hemorrhage (neuro checks every 15 min x 2 hours, then every 30 min x 6 hours)
      - Hold antiplatelets and anticoagulants for 24 hours post-tPA
      - Repeat CT head at 24 hours before starting antiplatelet or anticoagulant therapy
      - Number needed to treat (NNT) is 7 for good outcome at 3 months
    - Mechanical thrombectomy (endovascular clot retrieval):
      - Indications:
        - Large vessel occlusion (ICA, M1 or proximal M2 segment of MCA, basilar artery)
        - NIHSS over 6 (moderate to severe deficit)
        - Within 6 hours of last known well (can extend to 24 hours with perfusion imaging showing salvageable tissue)
        - ASPECTS score over 6 (limited early ischemic changes)
      - Can be performed with or without prior tPA
      - Number needed to treat is 3-4 for good outcome
      - Must be performed at comprehensive stroke center
    - Blood pressure management:
      - If tPA candidate: Lower BP to under 185/110 before tPA, maintain under 180/105 for 24 hours after tPA
      - If NO tPA: Permissive hypertension unless BP over 220/120 (allow BP to auto-regulate)
      - Medications: Labetalol IV 10-20 mg, nicardipine infusion, hydralazine IV
      - Avoid aggressive BP lowering (can worsen ischemia by reducing perfusion pressure)
    - Airway protection:
      - Intubate if unable to protect airway (GCS under 8, severe bulbar dysfunction)
      - Keep head of bed at 30 degrees to reduce aspiration risk
    - Glucose control:
      - Treat hypoglycemia immediately (can mimic or worsen stroke)
      - Treat hyperglycemia cautiously (goal 140-180 mg/dL, avoid hypoglycemia)
    - Temperature control:
      - Treat fever aggressively (worsens outcomes)
      - Acetaminophen for fever over 100.4°F
    - NPO until swallow screen passed (aspiration pneumonia risk)
  - Secondary prevention (prevent recurrence):
    - Antiplatelet therapy:
      - Aspirin 325 mg daily started at 24-48 hours if received tPA (after repeat CT shows no hemorrhage)
      - Aspirin 325 mg daily immediately if no tPA given
      - Dual antiplatelet therapy (aspirin + clopidogrel) for 21 days if high-risk TIA or minor stroke (NIHSS 0-3)
      - Chronic antiplatelet: aspirin 81-325 mg daily or clopidogrel 75 mg daily
    - Anticoagulation for atrial fibrillation:
      - Start after acute phase (typically 1-14 days depending on infarct size and hemorrhage risk)
      - DOAC preferred over warfarin (dabigatran, rivaroxaban, apixaban, edoxaban)
      - Timing: Small infarct 1-3 days, moderate 3-7 days, large infarct 7-14 days
    - Statin therapy:
      - High-intensity statin (atorvastatin 80 mg) regardless of LDL
      - Reduces recurrent stroke by 20%
    - Carotid revascularization if stenosis over 70%:
      - Carotid endarterectomy (CEA) within 2 weeks for symptomatic stenosis over 70%
      - Carotid stenting alternative if high surgical risk
    - Blood pressure control (after acute phase):
      - Goal under 130/80 for secondary prevention
      - Start or adjust antihypertensives before discharge
    - Diabetes management (goal HgbA1c under 7%)
    - Smoking cessation counseling
  - Complications management:
    - Malignant cerebral edema (large MCA infarct):
      - Peaks at 2-5 days post-stroke
      - Signs: Decreased level of consciousness, herniation signs
      - Treatment: Hyperosmolar therapy (mannitol or hypertonic saline), head of bed elevation
      - Decompressive hemicraniectomy if under age 60 and within 48 hours (reduces mortality from 80% to 30%)
    - Hemorrhagic transformation:
      - Occurs in 10-40% of ischemic strokes
      - Higher risk with large infarcts, hyperglycemia, tPA use
      - Usually asymptomatic but can cause neurologic decline
    - Seizures (occur in 5-10%):
      - Treat seizures but prophylactic anticonvulsants NOT recommended
    - Aspiration pneumonia:
      - Keep NPO until swallow screen passed
      - Speech therapy evaluation for dysphagia
    - DVT prophylaxis:
      - Subcutaneous heparin or enoxaparin after 24 hours if no tPA, or after repeat CT confirms no hemorrhage if tPA given
      - Pneumatic compression devices

clinical_pearls:
  - Time is brain: 1.9 million neurons die per minute in untreated stroke
  - Door-to-needle time under 60 minutes and door-to-imaging under 25 minutes are quality metrics
  - tPA within 4.5 hours has NNT of 7 for good outcome (one of most effective acute interventions in medicine)
  - Mechanical thrombectomy within 6 hours (or 24 hours with perfusion imaging) has NNT of 3-4
  - Do NOT withhold tPA for minor or rapidly improving deficits if within treatment window
  - NIHSS over 6 suggests large vessel occlusion (activate thrombectomy team)
  - Permissive hypertension is appropriate if NOT giving tPA (BP auto-regulates perfusion to ischemic tissue)
  - Wake-up strokes (unknown onset time) may be candidates for treatment if MRI shows DWI-FLAIR mismatch
  - Dual antiplatelet therapy (aspirin + clopidogrel) for 21 days reduces early recurrence in minor stroke/TIA
  - Large MCA infarcts can cause malignant edema requiring decompressive hemicraniectomy within 48 hours

presentations:
  - Sudden weakness or numbness
  - Facial droop
  - Arm or leg weakness
  - Speech difficulty or aphasia
  - Vision changes or loss
  - Severe headache
  - Dizziness or vertigo
  - Ataxia or incoordination
  - Altered mental status
  - Gaze preference
  - Neglect
  - Dysarthria

