tree_id: HEME-LEUKOCYTOSIS
name: Leukocytosis (Encounter)
family: hematology
specialty: Hematology, Primary Care
chief_complaint: Elevated white blood cell count
description: |
  Leukocytosis is an elevation in white blood cell count (WBC >11,000/μL).
  Most commonly reactive (infection, inflammation, stress), but can indicate hematologic malignancy.
  Requires differential to determine which cell line is elevated.
icd10: D72.829
snomed: "414478003"
presentations:
  - WBC count greater than 11,000/μL
  - Often asymptomatic (may be incidental finding)
  - Symptoms related to underlying cause (fever, infection, inflammation)
  - If malignancy - fatigue, weight loss, night sweats, bleeding, bruising
  - Splenomegaly (in myeloproliferative disorders or leukemia)
urgency: Medium
referrals:
  hematology:
    - WBC >30,000 without clear cause
    - Concern for leukemia (blasts on differential, unexplained cytopenias)
    - Progressive leukocytosis
    - Abnormal differential or peripheral smear
    - Splenomegaly
workup:
  - CBC with differential - determine which cell line elevated (neutrophils, lymphocytes, monocytes, eosinophils, basophils)
  - Peripheral blood smear - assess for immature cells (bands, blasts), morphology
  - Assess for infection - vital signs, physical exam, cultures if indicated
  - Inflammatory markers - CRP, ESR
  - If no clear cause - LDH, uric acid (cell turnover markers)
  - If concern for leukemia - flow cytometry, bone marrow biopsy
treatment:
  reactive_leukocytosis:
    - Treat underlying cause (infection, inflammation, stress)
    - Usually no specific WBC therapy needed
    - Monitor WBC count
  leukemoid_reaction:
    - WBC >50,000 mimicking leukemia but reactive
    - Treat underlying cause (severe infection, malignancy)
    - Distinguish from CML with BCR-ABL1 testing
  malignant:
    - Immediate hematology referral
    - Treat underlying leukemia or myeloproliferative disorder
clinical_pearls:
  - Most leukocytosis is reactive and benign
  - Neutrophilia most common (infection, inflammation, steroids, smoking)
  - Lymphocytosis - viral infections, CLL
  - Monocytosis - chronic inflammation, CMML
  - Eosinophilia - allergies, parasites, drugs
  - Left shift (immature neutrophils) suggests infection or bone marrow stress
  - Leukemoid reaction (WBC >50,000) can mimic leukemia but is reactive
  - Blasts on differential require immediate hematology evaluation
differentials:
  - Infection (bacterial, viral)
  - Inflammation or autoimmune disease
  - Stress response (surgery, trauma, MI)
  - Medications (steroids, epinephrine, G-CSF)
  - Smoking
  - Malignancy (solid tumor)
  - Chronic myeloid leukemia
  - Acute leukemia
  - Myeloproliferative disorders
trace:
  - 28-year-old presents with WBC 18,000 and fever. Differential shows neutrophilia with left shift. Diagnose bacterial pneumonia. Treat with antibiotics. WBC normalizes to 7,000 after infection resolves.
citations:
  - American Society of Hematology Guidelines
  - UpToDate - Hematology
