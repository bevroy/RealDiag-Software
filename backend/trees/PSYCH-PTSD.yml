tree_id: PSYCH-PTSD
name: Post-Traumatic Stress Disorder (PTSD)
family: Psychiatry
specialty: Psychiatry
icd10:
- F43.10
snomed:
- '47505003'
urgency: medium
description: Comprehensive evaluation and management of Post-Traumatic Stress Disorder
  (PTSD)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Exposure to actual/threatened death, serious injury, or sexual violence
- 'Intrusive symptoms: Recurrent distressing memories, nightmares, flashbacks'
- 'Avoidance: Avoids trauma-related thoughts, feelings, reminders'
- 'Negative alterations in cognition/mood: Inability to recall trauma details, negative
  beliefs, persistent negative emotions'
- 'Hyperarousal: Irritability, hypervigilance, exaggerated startle response, sleep
  disturbance'
- Duration >1 month, significant distress/impairment
workup:
- PCL-5 questionnaire (PTSD severity)
- PHQ-9 (depression screening)
- Urine drug screen, alcohol assessment
- 'Consider: TBI screening (in military/veterans)'
treatment:
- 'Guideline-based treatment options for Post-Traumatic Stress Disorder (PTSD) include:'
- 'SSRI: Sertraline 50-200mg daily or paroxetine 20-60mg daily (APA 2022)'
- 'Trauma-focused psychotherapy: Prolonged exposureor CPT (8-15 sessions) (APA 2022)'
- 'EMDR (Eye Movement Desensitization and Reprocessing): Evidence-based alternative
  (APA 2022)'
- Prazosin 2-15mg at bedtime for nightmares (start 1mg, titrate) (APA 2022)
- 'Avoid benzodiazepines: Not effective for PTSD, worsen outcomes (APA 2022)'
clinical_pearls:
- PCL-5 score ≥33 suggests PTSD (screening tool)
- 'SSRIs first-line: Sertraline, paroxetine (FDA-approved for PTSD)'
- 'Trauma-focused psychotherapy gold standard: Prolonged exposure (PE), CPT (cognitive
  processing therapy), EMDR'
- 'Prazosin for nightmares: Alpha-blocker, 2-15mg at bedtime (evidence mixed but commonly
  used)'
- 'Screen for comorbidities: Depression (50%), substance use (30%), TBI common in
  veterans'
referrals:
- Psychiatry for complex cases or comorbidities
- Trauma-focused psychotherapist (PE, CPT, EMDR)
- Substance use treatment if comorbid
differentials:
  - Acute stress disorder
  - Depression
  - Anxiety disorders
  - Substance use
  - Personality disorder
trace:
  source: American Psychiatric Association (APA) Practice Guidelines, DSM-5-TR Diagnostic
    Criteria
  version: 0.1.0
  last_updated: '2024-12-26'
