tree_id: EMERGENCY-SEPSIS
name: Sepsis and Septic Shock
family: EMERGENCY MEDICINE
specialty: Emergency Medicine, Critical Care, Internal Medicine
chief_complaint: Fever, Hypotension, Suspected Infection
description: Rapid identification and management of sepsis and septic shock using Surviving Sepsis Campaign guidelines
version: "1.0"
icd10: A41.9
author: RealDiag Clinical Team

entry_point: sepsis_screening

nodes:
  - id: sepsis_screening
    type: question
    text: "Does patient meet sepsis criteria?"
    options:
      - label: "Suspected/confirmed infection PLUS 2+ SIRS criteria or qSOFA ≥2"
        next: sepsis_severity
      - label: "Infection without systemic response"
        next: infection_no_sepsis
      - label: "SIRS without clear infection source"
        next: sirs_workup

  - id: sepsis_severity
    type: question
    text: "Assess sepsis severity"
    options:
      - label: "Hypotension (SBP <90 or MAP <65) OR lactate ≥4 mmol/L requiring vasopressors"
        next: septic_shock
      - label: "Hypotension responding to fluids OR lactate 2-4 mmol/L"
        next: severe_sepsis
      - label: "Sepsis without hypotension, lactate <2 mmol/L"
        next: sepsis_diagnosis

  - id: septic_shock
    type: diagnosis
    name: "Septic Shock"
    icd10: "R65.21"
    urgency: critical
    workup:
      - Blood cultures x2 (before antibiotics if possible, but don't delay treatment)
      - CBC with differential
      - CMP (BUN, Cr, glucose, electrolytes)
      - Lactate (initial and serial q2-4h)
      - Procalcitonin
      - Coagulation studies (PT/INR, PTT)
      - Liver function tests
      - Urinalysis and urine culture
      - Chest X-ray
      - Other cultures based on suspected source (sputum, wound, CSF, etc)
      - Blood gas (arterial or venous)
      - Consider CT imaging if source unclear
      - Troponin, BNP if cardiac involvement suspected
    treatment:
      - IMMEDIATE Sepsis Bundle (within 1 hour)
      - Measure lactate - remeasure if >2 mmol/L
      - Obtain blood cultures before antibiotics
      - Administer broad-spectrum antibiotics within 1 hour
      - Begin rapid crystalloid 30 mL/kg if hypotensive or lactate ≥4 mmol/L
      - Apply vasopressors if hypotension persists after fluids (target MAP ≥65 mmHg)
      - Empiric Antibiotics (based on suspected source)
        * Community-acquired pneumonia - ceftriaxone 2g IV + azithromycin 500mg IV OR levofloxacin 750mg IV
        * Healthcare-associated/nosocomial - piperacillin-tazobactam 4.5g IV q6h OR meropenem 1g IV q8h
        * Abdominal source - piperacillin-tazobactam OR ceftriaxone + metronidazole
        * Urinary source - ceftriaxone 2g IV OR piperacillin-tazobactam
        * Skin/soft tissue - vancomycin 15-20 mg/kg IV + piperacillin-tazobactam
        * Unknown source - vancomycin + piperacillin-tazobactam OR meropenem
        * Add antifungal if immunocompromised or prolonged ICU stay
      - Vasopressor Protocol
        * First line - norepinephrine 0.05-2 mcg/kg/min (titrate to MAP ≥65)
        * Second line - vasopressin 0.03-0.04 units/min (fixed dose)
        * Third line - epinephrine 0.05-2 mcg/kg/min or phenylephrine
        * Consider hydrocortisone 200mg/day if refractory shock
      - Fluid Resuscitation
        * Initial 30 mL/kg crystalloid (LR or NS) within 3 hours
        * Reassess with dynamic measures (pulse pressure variation, stroke volume variation)
        * Avoid hetastarch - albumin acceptable if large volumes needed
      - Supportive Care
        * Maintain O2 sat >92% - intubate if needed
        * Keep glucose 140-180 mg/dL with IV insulin
        * DVT prophylaxis - heparin 5000 units SC q8h or enoxaparin
        * Stress ulcer prophylaxis - pantoprazole 40mg IV daily
        * Early nutrition (enteral preferred, within 48 hours)
      - Source Control
        * Drain abscesses within 12 hours if possible
        * Remove infected devices/catheters
        * Debride necrotic tissue
        * Surgical consultation if indicated
      - ICU Admission
      - Consider steroids (hydrocortisone 50mg IV q6h) if refractory to vasopressors
    prognosis: "Mortality 20-40% for septic shock; early recognition and treatment critical"
    
  - id: severe_sepsis
    type: diagnosis
    name: "Severe Sepsis"
    icd10: "R65.20"
    urgency: emergency
    workup:
      - Same as septic shock
    treatment:
      - Follow Sepsis Bundle protocol
      - Aggressive fluid resuscitation 30 mL/kg within 3 hours
      - Broad-spectrum antibiotics within 1 hour
      - Target MAP ≥65 mmHg (vasopressors if needed after fluids)
      - Lactate clearance - recheck q2-4h until <2 mmol/L
      - Source control as indicated
      - ICU admission or step-down unit
      - Same antibiotic choices as septic shock based on source
    prognosis: "Mortality 10-20%; prompt treatment improves outcomes"

  - id: sepsis_diagnosis
    type: diagnosis
    name: "Sepsis"
    icd10: "A41.9"
    urgency: high
    workup:
      - Blood cultures x2
      - CBC, CMP, lactate
      - Urinalysis and culture
      - Chest X-ray
      - Source-specific cultures
    treatment:
      - Antibiotics within 1 hour of recognition
      - IV fluids as needed
      - Monitor vital signs closely
      - Treat underlying infection source
      - Admit for observation and IV antibiotics
      - Re-evaluate if clinical deterioration
    prognosis: "Good with early treatment; monitor for progression"

  - id: infection_no_sepsis
    type: diagnosis
    name: "Localized Infection Without Sepsis"
    icd10: "A49.9"
    urgency: moderate
    workup:
      - Targeted cultures based on infection site
      - CBC
      - Basic labs if indicated
    treatment:
      - Appropriate antibiotics for infection type
      - Outpatient treatment often possible
      - Return precautions for worsening symptoms
    prognosis: "Excellent with appropriate antibiotics"

  - id: sirs_workup
    type: diagnosis
    name: "SIRS (Non-Infectious Cause)"
    icd10: "R65.10"
    urgency: moderate
    workup:
      - Evaluate for non-infectious causes
      - CBC, CMP, lactate
      - Consider pancreatitis (lipase), PE (D-dimer, CTA), MI (troponin, ECG)
      - Imaging based on clinical suspicion
    treatment:
      - Treat underlying cause
      - Supportive care
      - Broad monitoring
    prognosis: "Depends on underlying etiology"

clinical_pearls:
  - "Time is critical - 'Hour-1 Bundle' significantly improves mortality"
  - "Don't delay antibiotics for cultures if patient unstable"
  - "qSOFA (RR ≥22, altered mentation, SBP ≤100) predicts poor outcomes"
  - "Serial lactate measurements guide resuscitation"
  - "Early de-escalation of antibiotics when cultures available"
  - "Procalcitonin can help distinguish bacterial from viral/non-infectious"
  - "Consider atypical presentations in elderly, immunosuppressed"

red_flags:
  - "Lactate >4 mmol/L"
  - "SBP <90 mmHg despite fluids"
  - "Altered mental status"
  - "Mottled skin/poor perfusion"
  - "Oliguria <0.5 mL/kg/hr"
  - "Respiratory failure requiring intubation"
  - "New or worsening organ dysfunction"
