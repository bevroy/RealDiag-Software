tree_id: PULM-ASTHMA-EXACERBATION
name: Asthma Exacerbation
family: Pulmonology
specialty: Pulmonology
chief_complaint: Shortness of breath and wheezing
description: |
  Acute worsening of asthma symptoms with increased airway inflammation and bronchoconstriction.
  Triggers include viral infections (most common), allergens, pollutants, cold air, exercise, medications (aspirin, beta-blockers).
icd10: J45.901
urgency: High
workup:
  - Peak expiratory flow rate (PEFR) or FEV1 to assess severity - mild (>70% predicted), moderate (40-69%), severe (<40%)
  - Oxygen saturation (hypoxemia indicates severe exacerbation)
  - Respiratory rate, use of accessory muscles, ability to speak in full sentences
  - Auscultation for wheezing, decreased breath sounds (concerning for severe obstruction)
  - Chest X-ray if concerned for pneumonia, pneumothorax, or first episode (usually not needed for typical exacerbation)
  - ABG if severe (respiratory acidosis indicates impending respiratory failure)
  - Complete blood count if infection suspected
treatment:
  - Oxygen to maintain saturation >90% (>95% in pregnant women and cardiac disease)
  - Inhaled short-acting beta-agonist (albuterol) 2.5-5mg nebulized or 4-8 puffs via MDI with spacer every 20 minutes x 3 doses
  - Ipratropium bromide 0.5mg nebulized added to albuterol for moderate-severe exacerbations
  - Systemic corticosteroids - prednisone 40-60mg PO or methylprednisolone 60-125mg IV (reduces relapse, speeds recovery)
  - Continue corticosteroids 5-7 days (no taper needed if short course)
  - Magnesium sulfate 2g IV over 20 minutes for severe exacerbations not responding to initial therapy
  - Admission criteria - PEFR <40% predicted after treatment, hypoxemia, altered mental status, inability to speak, no improvement
  - ICU transfer if impending respiratory failure, requires intubation, severe refractory bronchospasm
  - Discharge if PEFR >70% predicted, minimal symptoms, adequate home medications and follow-up
clinical_pearls:
  - Silent chest (no wheezing) is ominous sign of severe obstruction with minimal air movement
  - Pulsus paradoxus >25 mmHg suggests severe exacerbation
  - Respiratory acidosis on ABG indicates respiratory muscle fatigue and impending failure
  - Most exacerbations triggered by viral upper respiratory infections
  - Antibiotics not indicated unless bacterial infection confirmed (purulent sputum, fever, infiltrate on CXR)
  - After discharge, continue albuterol q4h for 24-48 hours, then as needed, ensure controller medication (inhaled corticosteroid)
  - Follow-up within 1 week to reassess control and adjust maintenance therapy
differentials:
  - Chronic obstructive pulmonary disease exacerbation
  - Pneumonia
  - Pulmonary embolism
  - Heart failure with pulmonary edema
  - Foreign body aspiration
  - Anaphylaxis
trace:
  - Shortness of breath and wheezing x 2 days, worsening last 4 hours → PEFR 50% predicted, SpO2 92% on room air → Moderate exacerbation → Albuterol 5mg nebulized plus ipratropium 0.5mg nebulized q20min x 3 → Oxygen 2L nasal cannula → Prednisone 60mg PO → Reassess after 1 hour, PEFR improved to 65%, SpO2 95%, breathing easier → Continue albuterol q4h, prednisone 60mg daily x 5 days → Discharge home with albuterol inhaler, ensure using inhaled corticosteroid daily → Follow-up in 3-5 days
