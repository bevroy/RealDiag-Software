tree_id: PULM-ASTHMA-EXACERBATION
name: Acute Asthma Exacerbation
family: pulmonology
specialty: Pulmonology
icd10: J45.901
snomed: 195967001
urgency: high
homeopathy: []
presentations:
  - Progressive worsening of dyspnea
  - Increased wheezing
  - Chest tightness
  - Cough (may be dry or productive)
  - Inability to speak in full sentences (severe)
  - Reduced exercise tolerance
  - Poor response to rescue inhaler
  - Nocturnal symptoms worsening
  - Accessory muscle use
  - Tachypnea (respiratory rate >20)
  - Tachycardia
  - Prolonged expiratory phase
  - Decreased breath sounds or silent chest (life-threatening)
  - Triggers - viral URI, allergens, cold air, exercise, stress, medication noncompliance
workup:
  - Peak expiratory flow rate (PEFR) or FEV1 measurement
  - Severity classification based on PEFR or FEV1 (% predicted or personal best)
  - Mild - PEFR >70%, speaks in sentences, no accessory muscle use
  - Moderate - PEFR 40-69%, speaks in phrases, some accessory muscle use
  - Severe - PEFR <40%, speaks in words, obvious accessory muscle use
  - Life-threatening - PEFR <25%, silent chest, altered mental status, cyanosis
  - Pulse oximetry - assess for hypoxemia (O2 sat <90% concerning)
  - Arterial blood gas if severe (PaCO2 >42 mmHg indicates respiratory failure)
  - Chest X-ray to rule out pneumonia, pneumothorax, or other complications
  - CBC if infection suspected
  - Consider troponin if chest pain or cardiac risk factors
  - Avoid routine CXR in mild-moderate uncomplicated exacerbations
treatment:
  - Oxygen to maintain SpO2 ≥90% (≥95% in pregnancy)
  - Inhaled short-acting beta-2 agonists (SABA) - albuterol
  - Mild - 2-4 puffs q20min x 1 hour, then q1-4h PRN
  - Moderate-severe - continuous nebulization or MDI q20min x 1 hour
  - Ipratropium bromide added to SABA for moderate-severe exacerbations
  - Albuterol 2.5mg + ipratropium 0.5mg nebulized q20min x 3 doses
  - Systemic corticosteroids (within 1 hour, cornerstone of treatment)
  - Prednisone/prednisolone 40-60mg PO daily x 5-7 days (oral preferred if tolerated)
  - Methylprednisolone 40-80mg IV if unable to take PO or life-threatening
  - No taper needed for short course
  - Magnesium sulfate 2g IV over 20 minutes for severe exacerbations (refractory to initial therapy)
  - Epinephrine 0.3mg IM for anaphylaxis or severe bronchospasm unresponsive to SABA
  - Heliox (helium-oxygen mixture) may reduce work of breathing in severe cases
  - Avoid routine antibiotics unless bacterial infection suspected
  - Intubation and mechanical ventilation for respiratory failure
  - Criteria - altered mental status, worsening hypercapnia, respiratory arrest
  - Discharge criteria - PEFR >70% predicted, sustained improvement, adequate inhaler technique, outpatient follow-up arranged
clinical_pearls:
  - Silent chest and normal/elevated PaCO2 indicate impending respiratory failure
  - Pulsus paradoxus >25 mmHg suggests severe exacerbation
  - Most exacerbations triggered by viral respiratory infections
  - Systemic steroids most important intervention - give early
  - Inhaled steroids at discharge reduce relapse rate
  - 5-day course of oral steroids as effective as 10-14 days
  - Routine chest X-ray not needed unless atypical features or severe
  - Reassess peak flow 1 hour after initial treatment to guide disposition
  - Lactic acidosis common from beta-agonists (not infection)
  - Admit if PEFR <40% after initial treatment or poor social support
referrals:
  - Pulmonology for recurrent exacerbations (≥2 per year), severe asthma, or poor control
  - ICU admission for life-threatening exacerbation or respiratory failure
  - Allergy/immunology for allergic triggers or consideration of biologic therapy
differentials:
  - Acute asthma exacerbation
  - COPD exacerbation (older, smoking history)
  - Pneumonia (fever, infiltrate on CXR)
  - Pulmonary embolism (sudden onset, risk factors)
  - Heart failure (elevated JVP, peripheral edema, BNP)
  - Upper airway obstruction (anaphylaxis, foreign body, vocal cord dysfunction)
  - Pneumothorax (unilateral decreased breath sounds)
  - Panic attack (normal peak flow, hyperventilation)
trace:
  source: GINA Guidelines for Asthma Management 2023
  version: '1.0'
  last_updated: '2025-12-26'
