tree_id: OBGYN-OVARIAN-TORSION
name: Ovarian Torsion
family: Obstetrics Gynecology
specialty: Obstetrics Gynecology
icd10:
- N83.511
- N83.512
snomed:
- '65200003'
urgency: medium
description: Comprehensive evaluation and management of Ovarian Torsion
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden onset severe unilateral pelvic pain
- Nausea, vomiting (90%)
- Intermittent pain (if intermittent torsion/detorsion)
- Adnexal mass on exam or imaging (ovarian cyst or mass causes torsion)
- Fever less common (unless necrosis)
- Most common in reproductive age women
- 'Risk factors: Ovarian mass (>5 cm), pregnancy, ovarian hyperstimulation'
workup:
- Pelvic ultrasound with Doppler (decreased/absent ovarian flow, enlarged ovary, whirlpool
  sign)
- Beta-hCG (rule out ectopic pregnancy)
- CBC (leukocytosis suggests necrosis)
- Urinalysis (rule out kidney stone)
treatment:
- 'Guideline-based treatment options for Ovarian Torsion include:'
- 'Immediate: IV access, analgesia, anti-emetics, OB/GYN consult (ACOG 2024)'
- 'Pelvic ultrasound with Doppler: Assess ovarian blood flow, identify mass (ACOG
  2024)'
- 'Emergent laparoscopy: Detorsion (untwist ovary), assess viability, remove cyst
  if present (ACOG 2024)'
- 'Oophoropexy: Fix ovary to prevent recurrence (if no mass removed) (ACOG 2024)'
- 'Oophorectomy: Only if ovary clearly necrotic (try to preserve if viable) (ACOG
  2024)'
clinical_pearls:
- 'Surgical emergency: Ovarian necrosis occurs after 4-8 hours'
- 'Doppler ultrasound: Absent or decreased ovarian blood flow (but can be normal if
  intermittent torsion)'
- 'Whirlpool sign: Twisted vascular pedicle on ultrasound (specific but not sensitive)'
- 'Don''t delay surgery for imaging if high suspicion: Ultrasound can be falsely negative'
- 'Laparoscopy diagnostic and therapeutic: Detorsion + cystectomy or oophoropexy'
referrals:
- Emergent OB/GYN or gynecologic surgery consult
- Operating room for diagnostic laparoscopy
differentials:
  - Ectopic pregnancy
  - Appendicitis
  - Ovarian cyst
  - Kidney stone
  - PID
trace:
  source: American College of Obstetricians and Gynecologists (ACOG) Practice Bulletins,
    Society for Maternal-Fetal Medicine (SMFM)
