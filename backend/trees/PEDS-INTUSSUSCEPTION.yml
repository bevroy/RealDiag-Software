tree_id: PEDS-INTUSSUSCEPTION
name: Pediatric Intussusception Evaluation
family: PEDIATRICS
specialty: Pediatrics, Pediatric Surgery, Emergency Medicine
chief_complaint: Colicky Abdominal Pain, Vomiting, Bloody Stools in Child
description: Comprehensive evaluation and management of intussusception in children
version: "1.0"
author: RealDiag Clinical Team

entry_point: intussusception_presentation

nodes:
  - id: intussusception_presentation
    type: question
    text: "Clinical presentation and diagnostic findings?"
    options:
      - label: "Classic intussusception - uncomplicated"
        next: intussusception_uncomplicated
      - label: "Intussusception with peritonitis/perforation"
        next: intussusception_complicated
      - label: "Recurrent intussusception"
        next: intussusception_recurrent

  - id: intussusception_uncomplicated
    type: diagnosis
    name: "Intussusception - Uncomplicated"
    icd10: "K56.1"
    urgency: high
    workup:
      - Definition - Telescoping of proximal bowel segment (intussusceptum) into distal segment (intussuscipiens)
      - Most common cause of intestinal obstruction in infants/young children
      - Ileocolic most common (90%) - Terminal ileum invaginates into colon through ileocecal valve
      - Colocolic and ileoileal less common
      - Epidemiology - Peak incidence 6-36 months (mean age 9 months), male:female 3:2
      - Pathophysiology
      - Lead point (10-25% of cases, higher in older children) - Meckel diverticulum (most common), polyp, lymphoma, Henoch-Schönlein purpura (submucosal hematoma), intestinal duplication cyst
      - Idiopathic (75-90%, especially infants) - Hypertrophied Peyer patches (lymphoid hyperplasia) after viral illness, "lead point" is enlarged lymphoid tissue
      - Post-viral (adenovirus, rotavirus association), seasonal variation (spring/fall)
      - Vascular compromise - Mesenteric vessels dragged in, venous congestion → edema, hemorrhage → ischemia, necrosis, perforation if untreated
      - Classic triad (only 15-20% have all three)
      - Colicky intermittent abdominal pain - Sudden onset, severe, child draws legs up, inconsolable crying, alternating with periods of normalcy between spasms (every 15-20 min)
      - Vomiting - Initially non-bilious, becomes bilious as obstruction progresses
      - "Currant jelly" stools - Blood and mucus, late finding (indicates mucosal ischemia/sloughing), only 50% at presentation
      - Physical exam
      - "Sausage-shaped" palpable mass - RUQ or RLQ (intussusception itself), mobile, firm
      - "Dance sign" - Emptiness in RLQ (where cecum should be, now intussuscepted)
      - Abdominal distension (obstruction)
      - Lethargy, altered mental status - Red flag (hypoperfusion, bacterial translocation, endotoxins)
      - Rectal exam - Gross blood or heme-positive stool, may feel intussusception if very distal
      - Labs - Usually not needed for diagnosis, but if obtained
      - WBC may be elevated (stress, ischemia)
      - Electrolyte abnormalities if dehydrated
      - Imaging - Diagnosis
      - Ultrasound - First-line, sensitivity/specificity >95%
      - "Target sign" or "donut sign" on transverse view (concentric rings of bowel)
      - "Pseudokidney sign" on longitudinal view (edematous intussusception looks like kidney)
      - Free fluid, lymph nodes may be seen
      - Abdominal X-ray - Less sensitive, may show obstruction (air-fluid levels, paucity of gas in RLQ), mass effect, but normal X-ray does NOT exclude intussusception
      - CT scan - Not routinely needed, but if obtained shows classic appearance
      - Air or contrast enema - Diagnostic AND therapeutic (see treatment)
    treatment:
      - Resuscitation - If dehydrated, lethargic, signs of shock
      - IV fluids (NS bolus 20 mL/kg, repeat as needed)
      - Nasogastric tube decompression if significant vomiting/distension
      - Surgical consultation - Early involvement (in case reduction fails or complications)
      - Non-operative reduction - First-line if no peritonitis, perforation, or shock
      - Air enema preferred (faster, less radiation than fluoroscopic contrast enema, lower perforation risk than hydrostatic enema)
      - Pneumatic reduction - Insufflate air under fluoroscopic or ultrasound guidance, pressure ~80-120 mmHg
      - Success - Free flow of air into terminal ileum, resolution of intussusception on imaging
      - Success rate 80-90% if <24 hours symptom duration, lower if >48 hours
      - Contraindications - Signs of peritonitis (guarding, rigidity, rebound), pneumoperitoneum (free air on X-ray, perforation), shock/hemodynamic instability
      - Perforation risk ~1% (small, usually seals)
      - Observation post-reduction - Admit for 24 hours, monitor for recurrence (10% within 24-72 hours)
      - Hydrostatic enema (barium or water-soluble contrast) - Alternative to air, slightly higher perforation risk, similar success rate
      - Surgical reduction - If enema reduction fails, contraindications to enema, or suspected lead point
      - Manual reduction - Gentle milking of intussusception in retrograde direction
      - Resection - If non-viable bowel (necrotic, perforated), or unable to reduce
      - Evaluate for lead point (especially if older child, recurrent, or unexpected location)

  - id: intussusception_complicated
    type: diagnosis
    name: "Intussusception - Complicated (Perforation/Peritonitis)"
    icd10: "K56.1"
    urgency: critical
    workup:
      - Red flags for complicated intussusception
      - Peritonitis - Guarding, rigidity, rebound tenderness
      - Free air on X-ray (pneumoperitoneum, perforation)
      - Severe lethargy, altered mental status, toxic appearance
      - Prolonged duration >48 hours (higher risk necrosis)
      - Shock - Tachycardia, hypotension, delayed cap refill
      - Labs - If peritonitis or sepsis concern
      - CBC (leukocytosis with left shift, or leukopenia if severe sepsis)
      - Lactate (elevated if sepsis, ischemic bowel)
      - Blood cultures
      - Imaging - Ultrasound or CT
      - Findings suggesting complication - Free fluid (significant, loculated), free air, bowel wall thickening, lack of blood flow on Doppler (necrosis), abscess
    treatment:
      - Aggressive resuscitation
      - Large-bore IV access, NS boluses 20 mL/kg (repeat PRN)
      - Broad-spectrum antibiotics - Gram-negative and anaerobic coverage (piperacillin-tazobactam 100 mg/kg IV q8h, OR ceftriaxone 50 mg/kg IV + metronidazole 10 mg/kg IV)
      - NG tube decompression
      - Emergency surgical consultation - DO NOT attempt enema reduction if peritonitis or perforation
      - Urgent laparotomy - Explore abdomen, reduce intussusception if possible, resect non-viable bowel, primary anastomosis or ostomy depending on contamination/patient stability
      - Evaluate for lead point (more common in complicated cases, older children)
      - ICU care if septic shock, post-op monitoring

  - id: intussusception_recurrent
    type: diagnosis
    name: "Recurrent Intussusception"
    icd10: "K56.1"
    urgency: high
    workup:
      - Recurrence rate - 10% overall (higher after enema reduction ~10-15%, lower after surgical reduction ~2-5%)
      - Most recurrences within 24-72 hours, but can be weeks to months later
      - Risk factors for recurrence
      - Age <1 year
      - Delayed presentation (>24 hours symptoms)
      - Multiple attempts at reduction
      - Lead point (pathologic cause more likely to recur until addressed)
      - Clinical presentation - Similar to initial episode (colicky pain, vomiting, lethargy)
      - Evaluation - Same as initial (ultrasound diagnostic)
      - Consider lead point - Especially if multiple recurrences, older child (>3 years), or unusual location (ileoileal, colocolic)
      - Meckel diverticulum - Meckel scan (technetium-99m pertechnetate) or consider CT enterography
      - Polyp - Colonoscopy
      - Lymphoma - CT abdomen/pelvis, LDH, referral to oncology
      - Henoch-Schönlein purpura - Palpable purpura, arthritis, abdominal pain, check urinalysis (hematuria, proteinuria)
      - Cystic fibrosis - Sweat chloride test (intussusception can occur with thick inspissated stool)
    treatment:
      - First recurrence - Repeat non-operative reduction (air/contrast enema) if no contraindications
      - Success rate still high (~70-80%)
      - Second recurrence or multiple recurrences - Surgical reduction + evaluate for lead point
      - Laparoscopy or laparotomy - Reduce intussusception, inspect entire small bowel for lead point (Meckel, polyp, duplication cyst, lymphoma)
      - Resect lead point if identified
      - Consider prophylactic cecopexy or appendectomy (controversial, some surgeons perform to reduce recurrence)
      - Address underlying cause if identified (polyp removal, Meckel resection, treat HSP, manage CF)
