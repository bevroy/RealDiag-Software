tree_id: CARD-AORTIC-STENOSIS
name: Aortic Stenosis
family: cardiovascular
specialty: Cardiology
chief_complaint: Exertional dyspnea, chest pain, syncope
description: Progressive narrowing of aortic valve causing left ventricular outflow obstruction
icd10: I35.0
urgency: urgent-if-symptomatic
workup:
  - Transthoracic echocardiography (TTE) - diagnostic test of choice
  - Measure aortic valve area (AVA less than 1.0 cm² severe, 1.0-1.5 cm² moderate, greater than 1.5 cm² mild)
  - Mean transvalvular gradient (greater than 40 mmHg severe, 25-40 mmHg moderate, less than 25 mmHg mild)
  - Aortic jet velocity (greater than 4 m/s severe, 3-4 m/s moderate, less than 3 m/s mild)
  - Left ventricular ejection fraction (LVEF) and wall thickness
  - ECG (left ventricular hypertrophy, left axis deviation, LBBB)
  - Chest X-ray (boot-shaped heart, calcified aortic valve)
  - Cardiac catheterization if echo nondiagnostic or to assess coronary artery disease pre-op
  - Exercise stress test if asymptomatic with severe AS to unmask symptoms (physician-supervised)
  - BNP/NT-proBNP (elevated indicates worse prognosis)
  - Cardiac CT for aortic valve calcium scoring (Agatston score greater than 2000 in men, greater than 1200 in women predicts rapid progression)
treatment:
  - Aortic valve replacement (AVR) for symptomatic severe AS (Class I indication)
  - Surgical AVR (SAVR) via sternotomy - gold standard for low-risk patients
  - Transcatheter aortic valve replacement (TAVR) for high or intermediate surgical risk
  - AVR indicated if asymptomatic with LVEF less than 50%, undergoing cardiac surgery, or abnormal exercise test
  - Medical management ONLY if not surgical candidate - no medications prevent progression
  - Diuretics cautiously for heart failure symptoms (avoid excessive preload reduction)
  - Avoid afterload reducers (ACE inhibitors, ARBs) in severe AS - can cause hypotension
  - Antibiotic prophylaxis for dental procedures if prior endocarditis or prosthetic valve
  - Serial echocardiography every 6-12 months for asymptomatic moderate-severe AS
  - Balloon aortic valvuloplasty as bridge to AVR in hemodynamically unstable patients
  - Treat concomitant coronary artery disease with CABG at time of AVR
clinical_pearls:
  - Classic triad - Angina, Syncope, Dyspnea (mnemonic AS causes SAD)
  - Once symptomatic, median survival without AVR - angina 5 years, syncope 3 years, heart failure 2 years
  - Pulsus parvus et tardus (weak, delayed carotid upstroke) classic finding
  - Crescendo-decrescendo systolic murmur best heard at right upper sternal border, radiates to carotids
  - Paradoxical splitting of S2 (A2 delayed past P2) in severe AS
  - Low-flow, low-gradient AS with reduced LVEF - dobutamine stress echo helps differentiate true severe AS from pseudo-severe
  - Normal-flow, low-gradient AS with preserved LVEF - look for small LV cavity, consider CT calcium score
  - TAVR now approved for low surgical risk patients - comparable outcomes to SAVR
  - Bicuspid aortic valve causes early AS (age 40-50s vs 70-80s for degenerative calcific AS)
  - Avoid vasodilators and vigorous diuresis - AS patients dependent on preload
differentials:
  - Hypertrophic obstructive cardiomyopathy (HOCM) - murmur increases with Valsalva
  - Mitral regurgitation - holosystolic murmur at apex
  - Aortic sclerosis - similar murmur but no hemodynamic significance, normal AVA
  - Supravalvular or subvalvular stenosis
  - Pulmonary stenosis - murmur at left upper sternal border
trace:
  - 78-year-old man with 6-month history of progressive exertional dyspnea and chest tightness
  - Recently had near-syncope while climbing stairs
  - Past medical history - hypertension, hyperlipidemia, known bicuspid aortic valve
  - Physical exam - BP 130/85, HR 72, crescendo-decrescendo systolic murmur grade 3/6 at RUSB radiating to carotids
  - Diminished and delayed carotid upstroke bilaterally, sustained PMI displaced laterally
  - ECG - left ventricular hypertrophy with strain pattern
  - TTE - bicuspid aortic valve with severe calcification, AVA 0.7 cm² (severe), mean gradient 48 mmHg, peak velocity 4.5 m/s
  - LVEF 55% with concentric left ventricular hypertrophy (wall thickness 14 mm)
  - NT-proBNP 850 pg/mL (elevated)
  - Cardiac catheterization - 70% mid-LAD stenosis, confirms severe AS
  - Cardiothoracic surgery consultation - recommended surgical AVR with bioprosthetic valve and CABG to LAD
  - STS risk score 2.5% (low-intermediate surgical risk)
  - Patient underwent successful SAVR (23 mm Carpentier-Edwards bioprosthetic valve) with CABG x1 (LIMA to LAD)
  - Postoperative course uncomplicated, discharged home day 5
  - 6-week follow-up - symptom-free, normal prosthetic valve function on echo
  - Outcome - Excellent result with resolution of symptoms, on aspirin 81 mg daily lifelong
