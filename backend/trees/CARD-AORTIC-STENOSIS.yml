tree_id: CARD-AORTIC-STENOSIS
name: Aortic Stenosis
family: Cardiology
specialty: Cardiology
chief_complaint: Exertional chest pain, dyspnea, or syncope
description: |
  Progressive narrowing of aortic valve orifice. Most common valvular heart disease requiring surgery.
  Causes include calcific degeneration (elderly), bicuspid aortic valve (younger), rheumatic heart disease. Asymptomatic for years then rapid decline once symptoms develop.
icd10: I35.0
urgency: Moderate
workup:
  - Transthoracic echocardiogram (TTE) diagnostic - assess valve area, mean gradient, peak velocity, left ventricular function
  - Severe AS criteria - aortic valve area (AVA) less than 1.0 cm2, mean gradient greater than 40 mmHg, peak velocity greater than 4 m/s
  - Moderate AS - AVA 1.0-1.5 cm2, mean gradient 25-40 mmHg, velocity 3-4 m/s
  - Mild AS - AVA greater than 1.5 cm2, mean gradient less than 25 mmHg, velocity 2.5-3 m/s
  - Low-flow low-gradient AS with reduced ejection fraction - dobutamine stress echo to differentiate true severe AS from pseudostenosis
  - Physical exam - crescendo-decrescendo systolic murmur at right upper sternal border radiating to carotids, delayed and diminished carotid upstroke (pulsus parvus et tardus), soft or absent A2
  - ECG - left ventricular hypertrophy with strain pattern
  - Cardiac catheterization before surgery if CAD suspected - simultaneous coronary angiography (many patients need CABG)
  - Exercise stress test if asymptomatic severe AS to assess for symptoms and risk stratification (only if supervised)
treatment:
  - No medical therapy slows progression - statins do not help (unlike atherosclerosis)
  - Symptomatic severe AS - aortic valve replacement (AVR) indicated
  - Classic symptom triad - angina, syncope, dyspnea/heart failure
  - Median survival after symptom onset - angina 5 years, syncope 3 years, heart failure 2 years
  - Surgical AVR (SAVR) - mechanical valve (lifelong anticoagulation, durable) or bioprosthetic valve (no anticoagulation but degenerates over 10-20 years)
  - Transcatheter aortic valve replacement (TAVR) - less invasive, via femoral artery, approved for all risk categories now, outcomes similar to SAVR in most patients
  - TAVR preferred if high surgical risk, elderly, or significant comorbidities; SAVR preferred if young (bioprosthetic valve degenerates, would need redo), mechanical valve desired, or concomitant cardiac surgery needed
  - Asymptomatic severe AS - observation with serial echos every 6-12 months, consider AVR if very severe (AVA less than 0.6 cm2, velocity greater than 5 m/s), LVEF less than 50%, or undergoing other cardiac surgery
  - Balloon valvuloplasty temporizing measure (bridge to AVR in hemodynamically unstable or palliation if not AVR candidate) - high restenosis rate
  - Endocarditis prophylaxis not routinely recommended (only if prior endocarditis)
clinical_pearls:
  - Asymptomatic phase lasts 10-20 years with gradual progression, once symptomatic rapid decline and high mortality without intervention
  - Sudden cardiac death risk in asymptomatic AS very low (less than 1% per year), dramatically increases once symptomatic
  - Bicuspid aortic valve most common congenital heart defect (1-2% population), presents with AS at younger age (40s-50s), screen with echo
  - Associated aortopathy with bicuspid valve - ascending aorta dilation, dissection risk, may need aortic surgery
  - Paradoxical low-flow low-gradient AS with preserved EF - small LV cavity, restrictive physiology
  - Avoid vasodilators in severe AS (reduced preload worsens cardiac output)
differentials:
  - Hypertrophic cardiomyopathy
  - Mitral regurgitation
  - Aortic sclerosis (thickening without stenosis)
  - Subvalvular or supravalvular stenosis
  - Aortic coarctation
trace:
  - 72-year-old man with progressive exertional dyspnea and chest pressure x 6 months → Exam shows harsh crescendo-decrescendo systolic murmur at RUSB, delayed carotid upstroke, sustained PMI → ECG shows LVH with strain → Echo shows severe AS (AVA 0.7 cm2, mean gradient 48 mmHg, peak velocity 4.5 m/s), LVEF 55%, calcified trileaflet valve → Coronary angiography shows 2-vessel CAD → Symptomatic severe AS with CAD → High surgical risk (STS score 8%) → Heart team discussion → Recommend TAVR plus possible PCI → Successful transfemoral TAVR with balloon-expandable valve → Post-TAVR echo shows AVA 1.8 cm2, mean gradient 8 mmHg, trace paravalvular leak → PCI to LAD and RCA → Symptoms resolve, improved exercise tolerance
