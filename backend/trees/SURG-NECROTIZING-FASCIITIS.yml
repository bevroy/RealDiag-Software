tree_id: SURG-NECROTIZING-FASCIITIS
name: Necrotizing Fasciitis
family: Surgery
specialty: Surgery
icd10:
- M72.6
snomed:
- '44511005'
urgency: medium
description: Comprehensive evaluation and management of Necrotizing Fasciitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Pain out of proportion to physical findings (hallmark, early sign)
- Rapidly spreading erythema, edema, warmth
- Skin bullae, crepitus (subcutaneous gas), skin necrosis (late)
- Fever, tachycardia, hypotension (systemic toxicity)
- Wood-hard feel to subcutaneous tissue
- Numbness/anesthesia of affected area (nerve involvement)
- 'Risk factors: Diabetes, immunocompromised, IV drug use, recent surgery/trauma'
- 'High mortality: 20-40%, higher if delayed treatment'
workup: []
treatment:
- 'Guideline-based treatment options for Necrotizing Fasciitis include:'
- 'Immediate: IV access, aggressive fluid resuscitation (septic shock common), broad-spectrum
  antibiotics (ACS 2023)'
- 'Antibiotics: Vancomycin + pip-tazo + clindamycin (toxin suppression), start immediately
  (ACS 2023)'
- 'EMERGENT surgical consultation: Wide debridement of all necrotic tissue, may need
  multiple trips to OR (ACS 2023)'
- 'Hyperbaric oxygen: Adjunct therapy if available, but do NOT delay surgery (ACS
  2023)'
- 'Disposition: ICU admission, serial debridements every 24-48hr until no necrotic
  tissue, high mortality (ACS 2023)'
clinical_pearls:
- 'LRINEC score ≥6 = high risk: CRP, WBC, Hgb, Na, Cr, glucose (helps risk stratify)'
- Pain out of proportion = earliest and most important clinical finding
- Crepitus = pathognomonic but only present 50% (gas-forming organisms)
- 'Do NOT wait for imaging: Clinical diagnosis, CT/MRI if uncertain but don''t delay
  surgery'
- 'Emergent surgical debridement = life-saving: Delay increases mortality exponentially'
- 'Type 1 (polymicrobial): Diabetics, post-surgery, Fournier''s gangrene (perineal)'
