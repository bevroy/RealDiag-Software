tree_id: ORTHO-SHOULDER-PAIN
name: Shoulder Pain - Comprehensive Evaluation
family: Orthopedics
specialty: Orthopedics
icd10:
  - M25.511
  - M75.100
  - M75.120
snomed:
  - 45326000
  - 399114005
  - 399153001
urgency: non-urgent
description: Evaluation and management of shoulder pain including rotator cuff, impingement, and frozen shoulder

homeopathy:
  - remedy: Rhus toxicodendron 30C
    indications: Shoulder stiffness worse on first motion, better with continued movement, worse cold/damp
  - remedy: Ferrum metallicum 30C
    indications: Right shoulder pain, deltoid region, worse raising arm, better slow motion
  - remedy: Sanguinaria 30C
    indications: Right shoulder pain radiating down arm, worse raising arm overhead, burning pain
  - remedy: Bryonia 30C
    indications: Shoulder pain worse with any movement, better with rest and pressure, sharp pains
  - remedy: Ruta graveolens 30C
    indications: Shoulder pain from overuse/injury, worse cold, better warm applications

presentations:
  - Acute shoulder pain after injury
  - Chronic shoulder pain
  - Pain with overhead activities
  - Night pain interfering with sleep
  - Shoulder stiffness and reduced range of motion
  - Weakness with shoulder movements
  - Shoulder pain radiating to arm

differentials:
  - Rotator cuff injury
  - Impingement
  - Adhesive capsulitis
  - AC joint arthritis
  - Fracture

workup:
  - "RED FLAGS requiring urgent evaluation: acute traumatic injury with deformity (dislocation), severe pain after fall in elderly (proximal humerus fracture), fever with joint effusion (septic arthritis), new shoulder pain with chest pain/dyspnea (referred cardiac pain)"
  - "History: onset (acute vs gradual), mechanism (trauma, overuse, repetitive overhead activity), location (anterior, lateral, posterior), aggravating movements (overhead, behind back, sleeping position), night pain (rotator cuff tear), occupation/sports, prior shoulder problems, systemic symptoms"
  - "Physical exam: inspect for atrophy/asymmetry, palpate AC joint/biceps tendon/subacromial space, active and passive range of motion (forward flexion, abduction, internal/external rotation), strength testing, special tests"
  - "Rotator cuff tear tests: drop arm test (can't slowly lower arm from full abduction), empty can test (pain/weakness with resisted abduction at 90° with thumbs down), external rotation weakness (infraspinatus/teres minor)"
  - "Impingement tests: Neer test (forced forward flexion of internally rotated arm reproduces pain), Hawkins-Kennedy test (forward flexion 90° then internal rotation reproduces pain)"
  - "AC joint pathology: point tenderness over AC joint, cross-body adduction test (pain with arm brought across chest)"
  - "Adhesive capsulitis (frozen shoulder): severely restricted passive AND active range of motion in all planes, especially external rotation <50% of normal"
  - "Biceps tendinopathy: anterior shoulder pain, tenderness over bicipital groove, Speed test (resisted forward flexion with supinated hand), Yergason test (resisted supination with elbow flexed)"
  - "X-ray shoulder (AP, axillary, scapular Y views) if: trauma, severe pain, suspected fracture/dislocation, age >40 with chronic pain (evaluate for arthritis, calcific tendinitis)"
  - "MRI shoulder if: suspected rotator cuff tear (especially if considering surgery), atraumatic weakness, not improving after 6 weeks physical therapy, night pain, age >40"
  - "Ultrasound (if available): can evaluate rotator cuff tear, less expensive than MRI, operator-dependent"

treatment:
  - "Acute pain: rest from aggravating activities (not complete immobilization), ice 15-20 min several times daily first 48-72 hours, NSAIDs (ibuprofen 400-600 mg TID, naproxen 500 mg BID)"
  - "Physical therapy (cornerstone of treatment): pendulum exercises initially, then progressive range of motion and strengthening (rotator cuff, scapular stabilizers), postural training, usually 6-12 weeks"
  - "Rotator cuff tendinopathy/partial tear: conservative management first - PT, NSAIDs, activity modification, subacromial corticosteroid injection if not improving after 4-6 weeks PT"
  - "Adhesive capsulitis (frozen shoulder): prolonged course (12-24 months), aggressive physical therapy (stretching focus), NSAIDs, intra-articular corticosteroid injection, hydrodilatation if refractory, surgery rare"
  - "AC joint arthritis: activity modification, NSAIDs, AC joint injection if refractory, distal clavicle excision if conservative fails"
  - "Subacromial impingement: physical therapy (rotator cuff and scapular strengthening), NSAIDs, avoid overhead activities temporarily, subacromial injection if not improving"
  - "Corticosteroid injection: subacromial space or glenohumeral joint depending on pathology, provides temporary relief (3-6 months), use as adjunct to PT not replacement, limit to 3-4 injections/year"
  - "Avoid: prolonged sling use (causes stiffness), inadequate PT, rushing to surgery without 3-6 months conservative trial (except acute full tear in young active patient)"

clinical_pearls:
  - "Most shoulder pain responds to physical therapy - surgery rarely needed except full-thickness rotator cuff tears in young/active patients"
  - "Night pain that wakes patient from sleep = rotator cuff pathology (tendinopathy or tear) until proven otherwise"
  - "Frozen shoulder (adhesive capsulitis) has 3 phases: freezing (2-9 months, progressive pain/stiffness), frozen (4-12 months, stiff but less painful), thawing (5-24 months, gradual improvement)"
  - "Can't distinguish partial from full rotator cuff tear clinically - need MRI if considering surgery"
  - "Calcific tendinitis: calcium deposits in rotator cuff tendons, shows on X-ray, can cause acute severe pain, may resolve spontaneously"
  - "Shoulder pain in diabetic: higher risk of adhesive capsulitis, frozen shoulder, rotator cuff tear"
  - "AC joint arthritis: pain with cross-body adduction, point tenderness over AC joint, common in weightlifters"
  - "Referred pain to shoulder: cervical spine (C5 radiculopathy), cardiac (MI, angina), gallbladder, diaphragm irritation"

referrals:
  - Orthopedic surgery (sports medicine or shoulder specialist) for: acute full-thickness rotator cuff tear (especially young/active patient), chronic rotator cuff tear with weakness not improving after 3-6 months PT, recurrent shoulder dislocations, severe AC joint arthritis refractory to conservative treatment, labral tear
  - Physical therapy for: all patients with shoulder pain (first-line treatment), post-injection therapy, adhesive capsulitis, rotator cuff pathology
  - Rheumatology for: inflammatory arthritis (RA, PMR) involving shoulder, systemic symptoms
  - Emergency department for: acute dislocation, suspected fracture, septic arthritis (fever, inability to move shoulder)

citations:
  - "American Academy of Orthopaedic Surgeons Clinical Practice Guideline: Optimizing the Management of Rotator Cuff Problems. 2019."
  - "Hanchard NC, et al. Physical tests for shoulder impingements and local lesions of bursa, tendon or labrum that may accompany impingement. Cochrane Database Syst Rev. 2013."
  - "Kelley MJ, et al. Shoulder Pain and Mobility Deficits: Adhesive Capsulitis. J Orthop Sports Phys Ther. 2013;43(5):A1-31."
