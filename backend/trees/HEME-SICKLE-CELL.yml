tree_id: HEME-SICKLE-CELL
name: Sickle Cell Disease
family: Hematology Oncology
specialty: Hematology Oncology
icd10:
- D57.1
snomed:
- 417357006
urgency: medium
description: Comprehensive evaluation and management of Sickle Cell Disease
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Recurrent pain crises (vaso-occlusive episodes)
- Anemia (hemolytic)
- Splenic dysfunction (recurrent infections)
- Avascular necrosis of bones
- Acute chest syndrome
- Hemoglobin electrophoresis shows HbS
workup:
- 'Hemoglobin electrophoresis: HbSS (most severe), HbSC (milder), HbS-beta thal'
- 'CBC: Chronic hemolytic anemia (Hgb 6-9 g/dL baseline), reticulocytosis, target
  cells on smear'
- 'During crisis: CBC (watch for aplastic crisis if retic count drops), CXR (acute
  chest syndrome), cultures if febrile'
- 'Newborn screening: All states screen at birth for early penicillin prophylaxis'
treatment:
- 'Guideline-based treatment options for Sickle Cell Disease include:'
- 'Pain crisis: Aggressive hydration (1.5x maintenance), opioids, NSAIDs (ketorolac
  15-30mg IV q6h) (ASH 2023)'
- Incentive spirometry q2h while awake (prevents acute chest syndrome) (ASH 2023)
- 'Acute chest syndrome: Supplemental O2, incentive spirometry, antibiotics (ceftriaxone
  + azithromycin), exchange transfusion if severe (ASH 2023)'
- 'Disease-modifying: Hydroxyurea 15-35mg/kg/day (increases HbF, reduces crises by
  50%) (ASH 2023)'
- 'Prophylaxis: Penicillin VK 125-250mg BID until age 5 (prevents pneumococcal sepsis),
  folic acid 1mg daily, vaccinate (pneumococcal, H. flu, meningococcal) (ASH 2023)'
clinical_pearls:
- 'Vaso-occlusive crisis (VOC): Sickled RBCs block microvasculature → ischemic pain
  (bones, chest, abdomen)'
- 'Acute chest syndrome: New infiltrate on CXR + chest pain/fever/hypoxia - can be
  fatal, treat aggressively'
- 'Functional asplenia by age 5: Increased risk of encapsulated organisms (Strep pneumo,
  H. flu, N. meningitidis)'
- 'Triggers for crisis: Dehydration, infection, cold, stress, hypoxia, acidosis'
- Hydroxyurea reduces crisis frequency by 50% - increases fetal hemoglobin (HbF) which
  doesn't sickle
referrals:
- Hematology for all sickle cell patients - chronic disease management
- 'Hospital admission if: Acute chest syndrome, severe pain crisis, fever (risk of
  sepsis), priapism >4hrs'
- 'Bone marrow transplant evaluation if: Severe disease, recurrent crises, stroke
  (curative but high-risk)'
differentials: []
