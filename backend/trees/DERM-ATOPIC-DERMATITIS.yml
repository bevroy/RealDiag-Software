tree_id: DERM-ATOPIC-DERMATITIS
name: Atopic Dermatitis (Eczema)
family: Dermatology
specialty: Dermatology
chief_complaint: Itchy red rash
description: |
  Chronic inflammatory skin condition characterized by pruritus and eczematous lesions. Part of atopic triad (eczema, asthma, allergic rhinitis).
  Affects 10-20% of children, 1-3% of adults. Usually begins in childhood. Flares triggered by irritants, allergens, stress, weather changes.
icd10: L20.9
urgency: Low
workup:
  - Clinical diagnosis based on major and minor criteria
  - Major criteria - pruritus, typical morphology and distribution (flexural in adults, extensor in infants), chronic relapsing course, personal or family history of atopy
  - Minor criteria - xerosis, ichthyosis, keratosis pilaris, elevated IgE, early age of onset
  - Distribution - infants (face, scalp, extensor surfaces), children and adults (flexural areas, neck, wrists, ankles)
  - Rule out other diagnoses - skin scraping for scabies if suspected, patch testing if contact dermatitis suspected
  - IgE levels and RAST testing not routinely needed
treatment:
  - Skin barrier repair - frequent emollients (petroleum jelly, ceramide-containing creams) immediately after bathing
  - Gentle skin care - lukewarm baths, mild fragrance-free cleansers, pat dry
  - Topical corticosteroids for flares - low potency (hydrocortisone 1-2.5%) for face and intertriginous areas, medium to high potency (triamcinolone 0.1%, fluocinonide 0.05%) for body
  - Use corticosteroids until clear, then taper frequency
  - Topical calcineurin inhibitors (tacrolimus 0.03-0.1%, pimecrolimus 1%) steroid-sparing alternative, safe for face and long-term use
  - Antihistamines for pruritus - hydroxyzine 25-50mg at night, cetirizine 10mg daily
  - Wet wrap therapy for severe flares - apply topical corticosteroid, cover with damp gauze, then dry layer
  - Avoid triggers - harsh soaps, wool, fragrances, hot water, stress
  - Severe refractory cases - phototherapy (narrowband UVB), systemic immunosuppressants (cyclosporine, methotrexate, azathioprine), or biologics (dupilumab)
clinical_pearls:
  - Itch-scratch cycle perpetuates disease (scratching damages skin barrier, increases inflammation)
  - Secondary bacterial infection (S. aureus) common - honey-colored crusting, weeping lesions (treat with topical or oral antibiotics)
  - Eczema herpeticum (HSV superinfection) is medical emergency - punched-out erosions, systemic symptoms (treat with IV acyclovir)
  - Most children outgrow atopic dermatitis by adolescence (60% clear by age 12)
  - Filaggrin gene mutations impair skin barrier function, increase AD risk
  - Moisturizers should be applied liberally and frequently (several times daily)
differentials:
  - Contact dermatitis
  - Seborrheic dermatitis
  - Psoriasis
  - Scabies
  - Nummular eczema
  - Cutaneous T-cell lymphoma (Sezary syndrome)
trace:
  - 8-year-old with itchy red patches in elbow and knee creases x 2 years, worse in winter → History of asthma and allergic rhinitis → Exam shows erythematous scaly plaques in flexural areas, lichenification from scratching → Diagnose moderate atopic dermatitis → Liberal emollient use after bathing → Triamcinolone 0.1% cream BID to affected areas until clear → Hydroxyzine 25mg at bedtime for itch → Symptoms improve in 2 weeks → Maintain with daily emollients, use triamcinolone for flares → Add tacrolimus 0.03% for face involvement
