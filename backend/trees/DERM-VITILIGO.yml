tree_id: DERM-VITILIGO
name: Vitiligo
family: Dermatology
specialty: Dermatology
icd10:
- L80
snomed:
- '56727007'
urgency: medium
description: Comprehensive evaluation and management of Vitiligo
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Depigmented patches
- Well-demarcated borders
- Often symmetric
- Face, hands, body folds
- May be associated with autoimmune disease
workup:
- Clinical diagnosis with Wood's lamp examination
- Screen for autoimmune: TSH, CBC, comprehensive metabolic panel, ANA
- Skin biopsy rarely needed (shows absence of melanocytes)
treatment:
- 'Guideline-based treatment options for Vitiligo include:'
- Topical corticosteroids (clobetasol 0.05%) BID for 3-4 months - best for localized
  disease (AAD 2023)
- Topical calcineurin inhibitors (tacrolimus 0.1%) for face/intertriginous areas (AAD
  2023)
- Narrowband UVB phototherapy 2-3x/week - first-line for generalized vitiligo (AAD
  2023)
- Excimer laser for focal lesions (AAD 2023)
- Cosmetic camouflage makeup, self-tanners for psychosocial impact (AAD 2023)
clinical_pearls:
- Autoimmune destruction of melanocytes - associated with thyroid disease (20%), type
  1 DM, Addison's
- 'Types: Generalized (most common), segmental (unilateral, follows dermatome), focal/localized'
- 'Koebner phenomenon: New lesions at sites of trauma'
- Wood's lamp enhances depigmented areas, helps identify in fair-skinned patients
- Psychological impact significant - provide emotional support and counseling resources
referrals:
- Dermatology for phototherapy or advanced treatments
- Endocrinology if associated autoimmune disease
- Psychology/psychiatry for significant emotional distress
differentials:
  - Tinea versicolor
  - Pityriasis alba
  - Post-inflammatory hypopigmentation
  - Idiopathic guttate hypomelanosis
trace:
  source: American Academy of Dermatology (AAD) Guidelines, National Comprehensive
