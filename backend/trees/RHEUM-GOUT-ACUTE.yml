tree_id: RHEUM-GOUT-ACUTE
name: Acute Gout
family: Rheumatologic
specialty: Rheumatology
chief_complaint: Severe joint pain and swelling
description: Acute inflammatory arthritis from monosodium urate crystal deposition causing severe pain and swelling, typically first MTP joint (podagra)

icd10: M10.9

urgency: urgent

workup:
  - Clinical presentation: acute onset (reaches maximum intensity within 6-12 hours) severe joint pain, swelling, warmth, erythema, exquisite tenderness (cannot tolerate touch or bedsheets), first metatarsophalangeal joint (MTP, great toe) most common (50 percent, podagra), also midfoot, ankle, knee
  - Risk factors: hyperuricemia (serum uric acid greater than 6.8 mg/dL, saturation point for crystal formation), male sex (9:1 male to female), obesity, alcohol (beer highest risk), high purine diet (red meat, seafood, organ meats), diuretics (especially thiazides), chronic kidney disease, medications (low-dose aspirin, cyclosporine)
  - Triggers: dehydration, alcohol binge, large purine-rich meal, surgery, acute illness, trauma
  - Exam: monoarticular arthritis (typically), severe pain with minimal movement, joint effusion, overlying erythema (can mimic cellulitis but joint-centered)
  - Gold standard diagnosis: arthrocentesis with synovial fluid analysis, negatively birefringent needle-shaped monosodium urate crystals under polarized microscopy (definitive), inflammatory fluid (WBC 10,000-50,000, neutrophil predominant), rule out infection (Gram stain and culture)
  - Serum uric acid: may be normal or low during acute attack (not diagnostic), useful for baseline before starting urate-lowering therapy
  - X-ray: normal early, chronic gout shows punched-out erosions with overhanging edges, tophi (soft tissue masses)
  - Ultrasound: double contour sign (urate crystals on cartilage surface), useful if cannot perform arthrocentesis
  - Distinguish from septic arthritis: must rule out infection (joint aspiration mandatory if any concern, septic arthritis can coexist with gout), septic arthritis has fever more common, WBC greater than 50,000 more concerning

treatment:
  - Acute gout attack treatment: NSAIDs, colchicine, or corticosteroids (all equally effective if started early, choice based on contraindications)
  - NSAIDs first-line: indomethacin 50 mg TID, naproxen 500 mg BID, ibuprofen 800 mg TID, continue until 24-48 hours after resolution then taper, contraindications (renal insufficiency, GI bleeding, cardiovascular disease)
  - Colchicine: most effective if started within 24 hours of symptom onset, 1.2 mg initially then 0.6 mg one hour later (low-dose regimen as effective as high-dose with fewer side effects), continue 0.6 mg BID until resolution, side effects (diarrhea, nausea), dose reduce if renal insufficiency, avoid if severe renal or hepatic impairment
  - Corticosteroids: if NSAIDs and colchicine contraindicated or ineffective, intra-articular triamcinolone 20-40 mg (most effective if monoarticular and can aspirate), oral prednisone 40-60 mg daily x 5-7 days then taper, IM methylprednisolone 60-120 mg single dose
  - Do NOT start or stop urate-lowering therapy during acute attack (can worsen or precipitate attack)
  - Urate-lowering therapy (ULT): indicated if recurrent attacks (2 or more per year), chronic tophaceous gout, uric acid kidney stones, CKD stage 2 or higher, goal uric acid less than 6 mg/dL (below saturation, prevents future attacks and dissolves tophi)
  - Allopurinol first-line ULT: xanthine oxidase inhibitor, start 100 mg daily, titrate by 100 mg every 2-4 weeks to goal uric acid less than 6 mg/dL (typical 300-600 mg daily), dose reduce in renal insufficiency, rare hypersensitivity reaction (allopurinol hypersensitivity syndrome, Stevens-Johnson - screen HLA-B*5801 in high-risk populations)
  - Febuxostat alternative ULT: xanthine oxidase inhibitor, 40-80 mg daily, no renal dose adjustment needed, more expensive than allopurinol, possible increased cardiovascular risk
  - Prophylaxis when starting ULT: colchicine 0.6 mg daily or NSAIDs x 3-6 months (prevents flares from uric acid mobilization)
  - Lifestyle modifications: weight loss, limit alcohol (especially beer), limit high purine foods (red meat, seafood, organ meats), hydration, avoid high-fructose corn syrup
  - Discontinue contributing medications if possible: thiazide diuretics (switch to alternative antihypertensive), low-dose aspirin (if for primary prevention consider stopping)

clinical_pearls:
  - Acute onset severe monoarticular arthritis with erythema and swelling, first MTP (podagra) classic
  - Negatively birefringent needle-shaped crystals on synovial fluid analysis diagnostic
  - Serum uric acid may be normal during acute attack (not diagnostic)
  - NSAIDs, colchicine, or corticosteroids for acute attack (start early for best effect)
  - Do NOT start or stop urate-lowering therapy during acute attack
  - Allopurinol first-line for long-term uric acid lowering (goal less than 6 mg/dL)
  - Colchicine prophylaxis x 3-6 months when starting allopurinol (prevents flares)

differentials:
  - Septic arthritis (fever, very high WBC greater than 50K, Gram stain positive, must rule out)
  - Pseudogout (calcium pyrophosphate deposition, positively birefringent rhomboid crystals)
  - Cellulitis (erythema but not joint-centered, no effusion)
  - Trauma or fracture (history of injury, X-ray shows fracture)

trace:
  - 52-year-old man wakes at 3 AM with severe right great toe pain (could not tolerate bedsheets touching), swelling, redness
  - History: similar episode 6 months ago (resolved spontaneously after 1 week), hypertension on hydrochlorothiazide, BMI 33 (obese), drinks 3-4 beers on weekends, yesterday ate large steak dinner with alcohol
  - Exam: exquisite tenderness first MTP joint right foot, swollen, warm, erythematous, cannot bear weight, no fever, remainder of joints normal
  - Labs: serum uric acid 7.2 mg/dL (elevated, normal less than 7 mg/dL in men), WBC 11.2K (mild leukocytosis), creatinine 1.1 mg/dL
  - Arthrocentesis right first MTP joint: aspirated 2 mL cloudy yellow fluid, sent for cell count, Gram stain, culture, crystal analysis
  - Synovial fluid results: WBC 28,000 cells/microL (inflammatory), 85 percent neutrophils, negatively birefringent needle-shaped monosodium urate crystals identified (diagnostic for gout), Gram stain negative, culture pending
  - Diagnosis: acute gout right first MTP joint (podagra), second attack (prior episode 6 months ago)
  - Started indomethacin 50 mg TID with food (NSAID for acute attack)
  - 24 hours: pain improved 40 percent, swelling decreased slightly
  - 48 hours: pain improved 70 percent, able to walk with limp, continues indomethacin
  - Day 5: pain resolved 90 percent, continues indomethacin x 2 more days then taper
  - Day 7: complete resolution, indomethacin discontinued
  - Counseling: recurrent gout (2 attacks), benefits of urate-lowering therapy discussed
  - Patient chooses to start urate-lowering therapy (prevent future attacks, has had 2 attacks in 6 months)
  - Started allopurinol 100 mg daily (xanthine oxidase inhibitor, lowers uric acid production) plus colchicine 0.6 mg daily x 6 months (prophylaxis against flares when starting allopurinol)
  - Changed hydrochlorothiazide to amlodipine 5 mg daily (thiazides increase uric acid)
  - Lifestyle counseling: weight loss goal 30 pounds, limit alcohol especially beer, limit red meat and seafood, increase hydration
  - 2 weeks: tolerating allopurinol well, no gout flares (colchicine prophylaxis working)
  - 6 weeks: serum uric acid 6.8 mg/dL (decreased from 7.2 but still at saturation), increased allopurinol to 200 mg daily
  - 3 months: serum uric acid 5.4 mg/dL (goal less than 6 mg/dL achieved), no gout flares, weight loss 12 pounds, continues allopurinol 200 mg daily and colchicine prophylaxis
  - 6 months: discontinued colchicine prophylaxis (no longer needed after 6 months), continues allopurinol 200 mg daily
  - 1 year: no gout flares, serum uric acid stable 5.6 mg/dL, weight loss 25 pounds, reduced alcohol intake significantly, continues allopurinol 200 mg daily indefinitely
