tree_id: NEURO-CARPAL-TUNNEL
name: Carpal Tunnel Syndrome
family: Neurology
specialty: Neurology
chief_complaint: Hand numbness and tingling worse at night
description: Median nerve compression at wrist causing numbness, tingling, and weakness in thumb, index, middle, and half of ring finger. Wrist splinting and activity modification first-line, surgery curative if conservative fails.
icd10: G56.00
urgency: non-urgent

workup:
  - Clinical diagnosis: numbness and tingling in median nerve distribution (thumb, index, middle, radial half of ring finger), worse at night, awakens from sleep
  - Shaking hands relieves symptoms (flick sign)
  - Symptoms exacerbated by: prolonged wrist flexion or extension, gripping, repetitive hand use
  - Physical exam: Tinel sign (tapping over carpal tunnel elicits paresthesias) 50% sensitive, Phalen test (wrist flexion 60 seconds reproduces symptoms) 75% sensitive
  - Thenar atrophy: late finding indicating severe chronic compression
  - Weakness: thumb opposition and abduction (abductor pollicis brevis and opponens pollicis - median nerve innervated)
  - Sensory exam: decreased sensation median nerve distribution, spares palm (palmar cutaneous branch above carpal tunnel)
  - Electrodiagnostic studies (EMG/NCS): gold standard confirms diagnosis, quantifies severity, rules out other causes (cervical radiculopathy, polyneuropathy)
  - Prolonged distal motor latency and decreased sensory nerve conduction velocity across wrist
  - Order EMG if: diagnosis uncertain, severe symptoms, considering surgery, bilateral symptoms, or failed conservative treatment
  - Risk factors: pregnancy, diabetes, hypothyroidism, rheumatoid arthritis, obesity, repetitive hand use

treatment:
  - Conservative management (first-line): effective in 50-80% mild to moderate cases
  - Wrist splinting: neutral position (not flexed or extended) especially at night (most important conservative treatment)
  - Improves nocturnal symptoms significantly, prevents wrist flexion during sleep
  - Activity modification: avoid prolonged wrist flexion/extension, frequent breaks from repetitive activities, ergonomic keyboard and mouse
  - NSAIDs: ibuprofen or naproxen PRN (modest benefit for pain, does not alter disease course)
  - Corticosteroid injection: methylprednisolone 40 mg into carpal tunnel (provides temporary relief 1-3 months, may avoid surgery in mild cases)
  - Physical/occupational therapy: nerve gliding exercises, strengthening, ergonomic training
  - Surgical release (definitive treatment): division of transverse carpal ligament to decompress median nerve
  - Indications for surgery: failed conservative treatment after 6 months, severe symptoms, thenar atrophy, persistent weakness
  - Success rate 90-95%: dramatic improvement in nocturnal symptoms, gradual improvement in numbness over weeks to months
  - Open or endoscopic technique: similar outcomes, endoscopic faster recovery but higher complication risk
  - Prognosis: surgery curative in most cases, conservative treatment effective 50-80% mild cases

clinical_pearls:
  - Numbness/tingling in thumb, index, middle, radial half ring finger (median nerve distribution)
  - Worse at night, awakens from sleep, shaking hands relieves (flick sign)
  - Wrist splint at night most effective conservative treatment
  - Phalen test 75% sensitive - wrist flexion 60 seconds reproduces symptoms
  - EMG/NCS confirms diagnosis and quantifies severity
  - Surgery 90-95% effective if conservative fails
  - Thenar atrophy indicates severe chronic compression - needs surgery
  - Spares palm (palmar cutaneous branch exits before carpal tunnel)

differentials:
  - Cervical radiculopathy (C6-C7): neck pain radiating to arm, dermatomal pattern, decreased reflexes, positive Spurling test
  - Pronator syndrome: median nerve compression at forearm, pain with resisted pronation, no nocturnal symptoms
  - Diabetic polyneuropathy: bilateral symmetric glove distribution all fingers, decreased ankle reflexes, elevated glucose
  - Thoracic outlet syndrome: numbness all fingers (ulnar distribution), worse with arm overhead, positive Adson test

trace: |
  A 52-year-old woman with diabetes presented with 6 months of bilateral hand numbness and tingling, right worse than left. Symptoms primarily affecting thumb, index, and middle fingers. Awakens 2-3 times nightly with numbness, shakes hands for relief (flick sign positive). Works as administrative assistant with extensive computer use. Exam showed positive Phalen test bilaterally (symptoms reproduced within 30 seconds wrist flexion), positive Tinel sign at right wrist, decreased sensation to light touch in median nerve distribution, thenar muscles intact, no atrophy, strength preserved. Diagnosed with bilateral carpal tunnel syndrome, right worse than left. Started wrist splints neutral position nightly bilaterally. Ergonomic assessment at work, frequent stretch breaks every hour. At 6 weeks nocturnal symptoms improved 50% bilaterally. At 3 months right hand 60% improved but persistent symptoms, left hand 80% improved. EMG/NCS showed severe right carpal tunnel syndrome (prolonged distal motor latency 6.2 ms, decreased sensory amplitude), moderate left carpal tunnel syndrome. Referred to hand surgeon for right carpal tunnel release given severity and persistent symptoms despite conservative treatment. Underwent right open carpal tunnel release. At 2 weeks post-op nocturnal symptoms resolved completely, numbness improving. At 6 weeks 90% improved, minimal residual numbness. At 3 months complete resolution right hand. Left hand continues conservative management with good control.
