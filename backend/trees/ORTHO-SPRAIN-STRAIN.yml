tree_id: ORTHO-SPRAIN-STRAIN
name: Sprain/Strain, Unspecified
family: orthopedics
specialty: Orthopedics, Primary Care, Sports Medicine
chief_complaint: Joint or muscle pain after injury
description: |
  Sprain is injury to ligament (connects bone to bone).
  Strain is injury to muscle or tendon (connects muscle to bone).
  Classified as grade I (mild), II (moderate), or III (complete tear).
icd10: S93.40XA
snomed: "125605004"
presentations:
  - Pain at joint or muscle
  - Swelling and bruising
  - Tenderness to palpation
  - Decreased range of motion
  - Instability (in severe sprains)
  - History of twisting, overstretching, or overuse injury
urgency: Low
referrals:
  orthopedics:
    - Grade III sprain/strain (complete tear)
    - Persistent instability
    - Not improving with conservative treatment after 6-8 weeks
workup:
  - Mechanism of injury and timing
  - Physical exam - swelling, ecchymosis, tenderness, range of motion, stability testing
  - Classify severity - Grade I (mild, stretched), Grade II (partial tear), Grade III (complete tear)
  - X-ray to rule out fracture (Ottawa rules for ankle/knee)
  - MRI if concern for complete tear or unclear diagnosis
treatment:
  acute_phase_first_72_hours:
    - PRICE protocol - Protection, Rest, Ice, Compression, Elevation
    - Ice 20 minutes every 2-3 hours
    - Compression wrap or brace
    - Elevate above heart
    - Crutches if weight-bearing painful
  pain_management:
    - NSAIDs - ibuprofen 400-600mg TID or naproxen 500mg BID
    - Acetaminophen 1000mg every 6 hours
  rehabilitation:
    grade_i_mild:
      - PRICE for 48-72 hours
      - Early mobilization and gradual return to activity
      - Usually heals in 1-2 weeks
    grade_ii_moderate:
      - PRICE for 3-7 days
      - Protected weight-bearing or immobilization initially
      - Physical therapy for strengthening and proprioception
      - Usually heals in 3-6 weeks
    grade_iii_severe:
      - Immobilization with brace or cast
      - Orthopedic consultation
      - May require surgery
      - Usually heals in 8-12 weeks (or longer with surgery)
clinical_pearls:
  - Sprains affect ligaments, strains affect muscles/tendons
  - Ottawa ankle rules - X-ray if bony tenderness at posterior malleoli or navicular, or inability to bear weight
  - Early controlled motion better than prolonged immobilization for most Grade I-II injuries
  - Physical therapy important to prevent chronic instability and re-injury
  - Proprioceptive training reduces re-injury risk
differentials:
  - Grade I sprain/strain (mild)
  - Grade II sprain/strain (partial tear)
  - Grade III sprain/strain (complete tear)
  - Fracture
  - Tendon rupture
  - Muscle contusion
trace:
  - 28-year-old twisted ankle playing basketball. Swelling and tenderness over lateral ankle ligaments. Able to bear weight with pain. X-ray negative. Diagnose Grade II lateral ankle sprain. PRICE protocol, compression wrap, ibuprofen 600mg TID. Refer to physical therapy. Returns to sports after 4 weeks with full recovery.
citations:
  - American Academy of Orthopaedic Surgeons Guidelines
  - UpToDate - Orthopedics and Sports Medicine
