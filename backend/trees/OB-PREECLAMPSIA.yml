tree_id: OB-PREECLAMPSIA
name: Preeclampsia
family: Obstetrics
specialty: Obstetrics
chief_complaint: Elevated blood pressure during pregnancy
description: |
  Hypertensive disorder of pregnancy characterized by new-onset hypertension (≥140/90) and proteinuria or end-organ dysfunction after 20 weeks.
  Affects 5-8% of pregnancies. Placental dysfunction causes endothelial damage and systemic inflammation.
icd10: O14.9
urgency: High
workup:
  - Blood pressure measurement (≥140/90 mmHg on two occasions 4 hours apart, or ≥160/110 once)
  - Urinalysis and urine protein-to-creatinine ratio (≥0.3 diagnostic, or 24-hour urine protein ≥300mg)
  - Complete metabolic panel (elevated creatinine >1.1 mg/dL indicates renal involvement)
  - Liver enzymes (AST/ALT >2x upper limit indicates hepatic involvement)
  - Complete blood count (thrombocytopenia <100k indicates severe features)
  - LDH and peripheral smear if HELLP syndrome suspected
  - Fetal monitoring: Non-stress test, biophysical profile, umbilical artery Doppler
  - Fundoscopic exam if visual symptoms (retinal edema, exudates)
treatment:
  - Delivery is definitive treatment: ≥37 weeks regardless of severity, or earlier if severe features
  - Antihypertensives if BP ≥160/110: IV labetalol or hydralazine acutely, oral labetalol or nifedipine for maintenance
  - Magnesium sulfate for seizure prophylaxis (4g IV load, then 1-2g/hr infusion during labor and 24 hours postpartum)
  - Corticosteroids (betamethasone) for fetal lung maturity if <34 weeks and delivery anticipated
  - Expectant management only if <34 weeks without severe features, with intensive monitoring
  - Monitor for HELLP syndrome (Hemolysis, Elevated Liver enzymes, Low Platelets)
  - Postpartum monitoring for 72 hours (25% of eclampsia occurs postpartum)
clinical_pearls:
  - Severe features: BP ≥160/110, thrombocytopenia <100k, creatinine >1.1, liver enzymes 2x normal, pulmonary edema, visual symptoms, severe headache
  - Eclampsia = seizures in preeclampsia patient (life-threatening, treat with magnesium sulfate)
  - HELLP syndrome can occur without hypertension or proteinuria
  - Risk factors: nulliparity, multiple gestation, chronic hypertension, diabetes, obesity, prior preeclampsia
  - Low-dose aspirin 81mg daily from 12-36 weeks reduces preeclampsia risk by 15% in high-risk patients
  - Postpartum preeclampsia can occur up to 6 weeks after delivery
differentials:
  - Chronic hypertension
  - Gestational hypertension
  - HELLP syndrome
  - Acute fatty liver of pregnancy
  - Thrombotic thrombocytopenic purpura
  - Hemolytic uremic syndrome
trace:
  - New-onset hypertension after 20 weeks → Check urine protein and labs → Preeclampsia diagnosed if proteinuria or end-organ dysfunction → Assess for severe features → Magnesium sulfate if indicated → Antihypertensives if BP ≥160/110 → Deliver at ≥37 weeks or earlier if severe → Postpartum monitoring for 72 hours
