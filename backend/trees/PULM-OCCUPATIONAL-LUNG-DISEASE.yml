nodes:
  - id: occupational_lung_evaluation
    type: question
    text: "Which type of occupational lung disease?"
    options:
      - label: "Asbestosis"
        next: asbestosis
      - label: "Silicosis"
        next: silicosis
      - label: "Coal worker's pneumoconiosis"
