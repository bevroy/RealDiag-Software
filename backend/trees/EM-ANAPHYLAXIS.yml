tree_id: EM-ANAPHYLAXIS
name: Anaphylaxis
family: Emergency Medicine
specialty: Emergency Medicine
icd10:
- T78.2XXA
- T78.00XA
snomed:
- '39579001'
urgency: medium
description: Comprehensive evaluation and management of Anaphylaxis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Acute onset (minutes to hours) of skin/mucosal involvement (urticaria, angioedema,
  flushing, pruritus)
- Respiratory compromise (dyspnea, wheezing, stridor, hypoxemia, throat tightness)
- Cardiovascular collapse (hypotension, syncope, shock, tachycardia)
- Gastrointestinal symptoms (nausea, vomiting, diarrhea, abdominal cramping)
- Sense of impending doom or anxiety
- Lightheadedness or dizziness
- Can occur without skin manifestations in 10-20% of cases
- 'Biphasic reaction in 20%: Recurrence 4-72 hours after initial episode'
- 'Common triggers: Foods (peanuts, tree nuts, shellfish, eggs), medications (penicillin,
  NSAIDs), insect stings (bee, wasp)'
- May progress rapidly to cardiovascular collapse within minutes
- Involvement of ≥2 organ systems (skin, respiratory, CV, GI) with rapid onset
workup: []
treatment:
- 'Guideline-based treatment options for Anaphylaxis include:'
- 'Immediate: IM epinephrine, airway management, IV access (ACEP 2023)'
- 'Supportive: Oxygen, cardiac monitoring, IV fluids (ACEP 2023)'
- 'Medications: Antihistamines, corticosteroids, bronchodilators PRN (ACEP 2023)'
- 'Disposition: Observe 4-6 hours minimum, admit if severe or refractory (ACEP 2023)'
- 'Discharge: EpiPen prescription, allergy referral, avoidance counseling (ACEP 2023)'
clinical_pearls:
- Epinephrine 0.3-0.5mg IM (1:1000) anterolateral thigh - FIRST-LINE treatment
- Repeat epinephrine every 5-15 minutes if no response
- H1 blocker (diphenhydramine 50mg IV) and H2 blocker (ranitidine 50mg IV)
- Corticosteroids (methylprednisolone 125mg IV) to prevent biphasic reaction
- IV fluids for hypotension, albuterol for bronchospasm
- Observe 4-6 hours (longer if severe), prescribe EpiPen on discharge
referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy
differentials:
  - Severe allergic reaction
  - Asthma exacerbation
  - Septic shock
  - Cardiogenic shock
  - Vasovagal syncope
