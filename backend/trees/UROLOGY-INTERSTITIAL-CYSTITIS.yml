tree_id: UROLOGY-INTERSTITIAL-CYSTITIS
name: Interstitial Cystitis (Painful Bladder Syndrome)
family: Nephrology
specialty: Urology
chief_complaint: Chronic pelvic pain, urinary urgency and frequency without infection
description: Chronic bladder condition causing pelvic pain and urinary symptoms lasting greater than 6 weeks
icd10: N30.10
snomed: 197834003
presentations:
  - Chronic pelvic/bladder pain
  - Urinary urgency, frequency (>8 times/day)
  - Nocturia
  - Pain relieved by voiding
  - Symptoms >6 weeks
  - Negative urine cultures
urgency: routine
referrals:
  emergency:
    - GI bleeding with hemodynamic instability
    - Acute liver failure
    - Toxic megacolon
    - Perforated viscus
    - Acute cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting/diarrhea
    - Abnormal imaging requiring intervention
  routine:
    - IBS management
    - GERD unresponsive to treatment
    - Abnormal liver enzymes
    - Screening colonoscopy

workup:
  - Clinical diagnosis of exclusion based on symptoms and ruling out other conditions
  - Characteristic symptoms (present for greater than 6 weeks)
  - Pelvic pain or pressure related to bladder filling, relieved with voiding
  - Urinary urgency (sudden compelling need to void)
  - Urinary frequency (greater than 8 voids per day, often 20-40 times daily in severe cases)
  - Nocturia (waking multiple times at night to urinate)
  - Dyspareunia (pain with intercourse)
  - Symptom flares with certain foods/drinks (acidic foods, caffeine, alcohol, spicy foods)
  - Voiding diary - document frequency, urgency, pain, voided volumes (typically small volumes)
  - Rule out other conditions
  - Urinalysis and urine culture (negative for infection)
  - Urine cytology (rule out bladder cancer if hematuria)
  - Post-void residual (rule out incomplete emptying)
  - STI testing if indicated (gonorrhea, chlamydia)
  - Pelvic examination in women (rule out pelvic floor dysfunction, endometriosis)
  - Prostate exam in men (rule out prostatitis, BPH)
  - Validated symptom questionnaires
  - O'Leary-Sant Interstitial Cystitis Symptom Index (ICSI) and Problem Index (ICPI)
  - Pelvic Pain and Urgency/Frequency (PUF) score
  - Cystoscopy with hydrodistention - not required for diagnosis but can help rule out other pathology
  - Hunner lesions (ulcers) seen in 10% - more severe phenotype
  - Glomerulations (petechial hemorrhages) after hydrodistention - nonspecific finding
  - Urodynamic studies if diagnosis uncertain or evaluating for concomitant voiding dysfunction
treatment:
  - Multimodal approach, stepwise progression from conservative to invasive
  - Patient education and self-care (first-line)
  - Stress reduction, relaxation techniques
  - Dietary modification - avoid trigger foods (citrus, tomatoes, chocolate, caffeine, alcohol, spicy foods, artificial sweeteners)
  - Bladder training techniques
  - Physical therapy (pelvic floor physical therapy) - very effective for many patients
  - Oral medications
  - Pentosan polysulfate (Elmiron) 100 mg TID - replenishes bladder GAG layer
  - Takes 3-6 months for benefit, continue 6-12 months for full trial
  - Monitor for rare retinal toxicity (ophthalmology screening if prolonged use)
  - Amitriptyline 10-75 mg at bedtime - pain modulation, reduces urgency/frequency
  - Hydroxyzine 25-50 mg at bedtime - antihistamine, anti-inflammatory
  - Cimetidine 400 mg BID (H2 blocker) - reduces histamine-mediated inflammation
  - Intravesical instillations (bladder installations)
  - DMSO (dimethyl sulfoxide) 50% solution, 50 mL instilled weekly for 6-8 weeks
  - Heparin plus lidocaine (rescue therapy for flares)
  - Lidocaine 2% plus sodium bicarbonate (alkalinizes urine, increases lidocaine efficacy)
  - Procedural interventions
  - Cystoscopy with hydrodistention under anesthesia - therapeutic in some patients
  - Hunner lesion fulguration or injection with triamcinolone
  - Botulinum toxin A (Botox) bladder injections 100 units - reduces pain and urgency
  - Neuromodulation
  - Sacral neuromodulation (InterStim) - implanted device for refractory cases
  - Percutaneous tibial nerve stimulation (PTNS) - less invasive alternative
  - Surgical options (last resort)
  - Augmentation cystoplasty (increase bladder capacity)
  - Urinary diversion with cystectomy (rarely needed)
clinical_pearls:
  - Predominantly affects women (female-to-male ratio 5-10:1), mean age 40-50 years
  - Prevalence 2-6% of women in US, often misdiagnosed or delayed diagnosis (average 4 years)
  - Pathophysiology - bladder epithelial dysfunction, increased permeability, neurogenic inflammation
  - Not a psychological disorder (though psychological comorbidity common from chronic pain)
  - Quality of life impact similar to rheumatoid arthritis or chronic renal failure
  - Two phenotypes - Hunner lesion (ulcerative, 10%) vs non-ulcerative (90%)
  - Overlaps with irritable bowel syndrome, fibromyalgia, chronic fatigue, vulvodynia
  - Symptoms wax and wane - periods of flare and remission
  - Not associated with increased bladder cancer risk
  - Rarely progresses to bladder failure requiring augmentation or diversion
differentials:
  - Urinary tract infection (positive urine culture, acute onset, responds to antibiotics)
  - Overactive bladder (urgency/frequency without pain, responds to anticholinergics)
  - Chronic bacterial prostatitis in men (positive cultures, tender prostate)
  - Endometriosis (cyclic pain with menses, pelvic exam findings)
  - Pelvic floor dysfunction (hypertonicity, trigger points, responds to PT)
  - Bladder cancer (hematuria, mass on cystoscopy, positive cytology)
  - Urolithiasis (colicky pain, hematuria, stone on imaging)
  - Radiation cystitis (history of pelvic radiation)
trace:
  - 38-year-old woman presents with 2-year history of chronic pelvic pain and urinary symptoms
  - Constant suprapubic pressure and pain 6/10, worse with bladder filling, improves briefly after voiding
  - Urinary urgency (sudden need to void immediately), frequency urinating every 1-2 hours
  - Waking 4-5 times per night to urinate
  - Pain with intercourse (deep dyspareunia), affecting relationship
  - Symptoms worse with coffee, wine, citrus fruits
  - Multiple courses of antibiotics for presumed UTI with negative cultures, no improvement
  - Significantly impacts quality of life - anxiety leaving home due to urgency
  - Past medical history - none, no prior surgeries
  - Past GYN history - regular periods, negative recent pap, not pregnant
  - Physical exam - vitals normal, appears tired
  - Abdomen - suprapubic tenderness, no masses
  - Pelvic exam - no lesions, mild anterior vaginal wall tenderness, pelvic floor muscle hypertonicity, normal uterus and adnexa
  - No cervical motion tenderness
  - Voiding diary (3 days) - average 28 voids per day, nocturia 5 times, small voided volumes 50-100 mL
  - Urinalysis - normal, no WBCs, no blood, negative nitrites
  - Urine culture - no growth
  - Post-void residual - 15 mL (normal, no retention)
  - STI testing - negative
  - Pregnancy test - negative
  - O'Leary-Sant ICSI score 16 (moderate-severe symptoms)
  - PUF score 24 (moderate-severe)
  - Diagnosis - Interstitial cystitis/bladder pain syndrome
  - Treatment plan initiated
  - Education on IC, realistic expectations, chronic condition management
  - Dietary modifications - elimination diet to identify trigger foods
  - Started bladder training, timed voiding every 2 hours gradually increasing intervals
  - Referred to pelvic floor physical therapy
  - Started amitriptyline 25 mg at bedtime (low dose for pain modulation)
  - Started pentosan polysulfate (Elmiron) 100 mg TID
  - Counseled on 3-6 month timeline for benefit
  - 6-week follow-up - attending pelvic floor PT twice weekly
  - Learning relaxation techniques, internal trigger point release
  - Amitriptyline increased to 50 mg at bedtime (tolerating well, helps sleep)
  - Some improvement in urgency and pain, now 3/10
  - 3-month follow-up - significant improvement with PT and medications
  - Frequency decreased to 12-15 times per day (down from 28)
  - Nocturia 2-3 times per night (down from 5)
  - Pain improved to 2/10 baseline
  - Able to resume sexual activity with less discomfort
  - Identified trigger foods - coffee, wine, tomatoes (avoiding these)
  - ICSI score 8 (mild symptoms)
  - Continue current regimen
  - 6-month follow-up - continued improvement
  - Frequency 10-12 times per day, nocturia 1-2 times
  - Pain minimal, only mild discomfort with flares
  - Quality of life markedly improved, able to travel and work without constant bathroom planning
  - Continue Elmiron for total 12 months, continue amitriptyline
  - Maintenance pelvic floor PT monthly
  - Outcome - Significant improvement with multimodal therapy, good symptom control

citations:
  - AUA (American Urological Association) Clinical Guidelines
  - EAU (European Association of Urology) Guidelines
