urgency: medium
description: Comprehensive evaluation and management of Polymyalgia Rheumatica
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Bilateral shoulder and hip girdle pain (symmetric, proximal muscles)
- Morning stiffness >1 hour, worse in morning
- Age >50 years (average age 70, rare <50)
- Difficulty rising from chair, getting out of bed, raising arms overhead
- Constitutional symptoms - fatigue, malaise, low-grade fever, weight loss
- Elevated ESR (typically >40 mm/hr, often >50) and CRP
- Dramatic response to low-dose prednisone (15-20mg) within 24-48 hours
- 'No muscle weakness: Can perform movements if pain relieved (vs myopathy)'
- 'Association with giant cell arteritis: 15% have GCA, screen for headache/jaw claudication/vision
  changes'
- Female predominance (2:1), northern European ancestry
- Symmetric involvement - bilateral shoulders and hips affected equally
- Normal CPK and aldolase (distinguishes from polymyositis)
