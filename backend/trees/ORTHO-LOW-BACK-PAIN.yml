tree_id: ORTHO-LOW-BACK-PAIN
name: Low Back Pain - Comprehensive Evaluation
family: Orthopedics
specialty: Orthopedics
icd10:
  - M54.5
  - M54.50
  - M51.26
snomed:
  - 279039007
  - 161891005
  - 202794004
urgency: non-urgent
description: Comprehensive evaluation of acute and chronic low back pain with radiculopathy assessment

homeopathy:
  - remedy: Rhus toxicodendron 30C
    indications: Back pain worse on first motion, better with continued movement, worse cold/damp, restless
  - remedy: Bryonia 30C
    indications: Back pain worse with any movement, better with rest and pressure, irritable
  - remedy: Arnica montana 30C
    indications: Bruised, sore feeling, worse touch, after trauma or overexertion
  - remedy: Hypericum 30C
    indications: Shooting nerve pain down legs, injury to spine, sharp pains, worse jarring
  - remedy: Ruta graveolens 30C
    indications: Deep aching in lumbar region, worse sitting, better lying on back, restless

presentations:
  - Acute low back pain (<4 weeks)
  - Chronic low back pain (>12 weeks)
  - Back pain with leg radiation (sciatica)
  - Back pain after lifting or trauma
  - Morning back stiffness
  - Back pain with numbness/tingling
  - Mechanical back pain worse with activity

differentials:
  - Muscle strain
  - Disc herniation
  - Spinal stenosis
  - Fracture
  - Spondylolisthesis

workup:
  - "RED FLAGS requiring immediate evaluation: cauda equina syndrome (saddle anesthesia, bowel/bladder dysfunction, bilateral leg weakness), severe trauma, suspected cancer, infection (fever, IV drug use), progressive neurologic deficit, age >50 with new onset, history of osteoporosis with minor trauma"
  - "History: onset (acute vs gradual), mechanism (lifting, twisting, trauma), location, radiation to legs, aggravating/relieving factors, numbness/tingling, weakness, bowel/bladder changes, prior episodes, morning stiffness >30 min (inflammatory), cancer history, osteoporosis, immunosuppression"
  - "Physical exam: inspect spine (scoliosis, asymmetry), range of motion, palpate paraspinal muscles, straight leg raise (positive if reproduces leg pain <60 degrees - suggests nerve root irritation), neurologic exam (L4-S1 dermatomes, reflexes, strength - dorsiflexion/plantarflexion/toe extension)"
  - "L4 radiculopathy: anterior thigh/medial leg numbness, weak knee extension, diminished patellar reflex"
  - "L5 radiculopathy: lateral leg/dorsal foot numbness, weak great toe extension and ankle dorsiflexion (foot drop), reflex usually normal"
  - "S1 radiculopathy: posterior leg/lateral foot numbness, weak ankle plantarflexion (can't stand on toes), diminished Achilles reflex"
  - "Imaging NOT needed for acute mechanical back pain without red flags - 90% resolve in 6 weeks regardless of findings"
  - "MRI lumbar spine if: red flags present, radiculopathy with progressive neurologic deficit, symptoms not improving after 4-6 weeks conservative therapy, considering epidural injection or surgery"
  - "X-ray lumbar spine if: age >50, trauma, suspected compression fracture, spondylolisthesis"

treatment:
  - "Acute mechanical back pain: remain active (bed rest NOT recommended), NSAIDs (ibuprofen 400-600 mg TID, naproxen 500 mg BID), acetaminophen 1000 mg TID-QID, muscle relaxants if significant spasm (cyclobenzaprine 5-10 mg TID x5-7 days)"
  - "Heat/ice: ice first 48 hours if acute injury, then heat therapy for muscle relaxation, 15-20 min sessions"
  - "Physical therapy: core strengthening, stretching, postural training - start after acute phase (1-2 weeks), critical for chronic pain"
  - "Radiculopathy: oral prednisone taper may help (60 mg x5 days, then taper), gabapentin 300 mg TID or pregabalin 75-150 mg BID for neuropathic pain, consider epidural steroid injection if not improving"
  - "Chronic pain (>12 weeks): multidisciplinary approach - PT, cognitive behavioral therapy, gradual return to activity, avoid opioids, consider duloxetine 60 mg daily (SNRI for chronic pain)"
  - "Avoid: prolonged bed rest (weakens muscles), opioids (no better than NSAIDs, high addiction risk), imaging without red flags (leads to unnecessary interventions)"
  - "When to consider surgery: progressive neurologic deficit despite treatment, cauda equina syndrome, persistent radiculopathy with MRI-confirmed disc herniation after 6-12 weeks conservative therapy"

clinical_pearls:
  - "90% of acute low back pain resolves within 6 weeks regardless of treatment - reassurance is key"
  - "Red flag mnemonic 'TUNA FISH': Trauma, Unexplained weight loss, Neurologic deficit, Age >50, Fever, IV drug use, Steroid use, History of cancer"
  - "Straight leg raise: patient supine, lift leg with knee extended - positive if reproduces leg pain (not just back pain) at <60 degrees"
  - "Cauda equina is surgical emergency: saddle anesthesia + bowel/bladder dysfunction = immediate MRI and neurosurgery consult"
  - "Imaging without red flags often shows 'abnormalities' (disc bulge, arthritis) that don't correlate with symptoms - leads to unnecessary anxiety and interventions"
  - "Bed rest is harmful - delays recovery and causes deconditioning. Encourage activity as tolerated."
  - "Chronic opioid use for back pain increases risk of addiction without improving outcomes compared to NSAIDs"

referrals:
  - Neurosurgery or Orthopedic Spine for: cauda equina syndrome (URGENT), progressive neurologic deficit, radiculopathy not improving after 6-12 weeks conservative therapy, MRI-confirmed herniation with surgical indication
  - Physical therapy for: all patients with chronic pain (>6 weeks), radiculopathy, mechanical pain not improving after 2-4 weeks
  - Pain management for: chronic pain refractory to conservative therapy, consideration for epidural steroid injection, multidisciplinary pain program
  - Rheumatology for: inflammatory back pain (morning stiffness >30 min, better with activity, worse with rest), suspected spondyloarthropathy

citations:
  - "American College of Physicians Clinical Practice Guideline: Noninvasive Treatments for Acute, Subacute, and Chronic Low Back Pain. Ann Intern Med. 2017."
  - "North American Spine Society Evidence-Based Clinical Guidelines for Multidisciplinary Spine Care: Diagnosis and Treatment of Low Back Pain. 2020."
  - "Chou R, et al. Diagnosis and Treatment of Low Back Pain: A Joint Clinical Practice Guideline from the American College of Physicians and the American Pain Society. Ann Intern Med. 2007."
