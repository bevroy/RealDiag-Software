tree_id: CARD-HEART-BLOCK
name: Atrioventricular Block
family: Cardiology
specialty: Cardiology
icd10:
- I44.30
- I44.2
snomed:
- '233916004'
urgency: medium
description: Comprehensive evaluation and management of Atrioventricular Block
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- syncope or presyncope
- fatigue, dyspnea
- first, second, or third degree block on ECG
- may require pacemaker
- 'First-degree: PR >200ms, all P waves conducted (benign, no treatment)'
- 'Second-degree Mobitz I (Wenckebach): Progressive PR lengthening then dropped QRS
  (usually benign)'
- 'Second-degree Mobitz II: Constant PR, sudden dropped QRS (high risk for complete
  block)'
- 'Third-degree (complete): No relationship between P and QRS, escape rhythm'
- 'Symptoms: Syncope, presyncope, fatigue, dyspnea (if bradycardic)'
workup:
- 'ECG: Identify degree and type of block'
- 'Telemetry: Monitor for progression'
- 'Holter monitor: If intermittent symptoms'
- 'Electrolytes: K, Mg, Ca'
- 'Troponin: Rule out MI as cause'
treatment:
- 'Guideline-based treatment options for Atrioventricular Block include:'
- 'First-degree: No treatment, monitor if progressive (ACC/AHA 2023)'
- 'Mobitz I: Observation if asymptomatic, pacemaker if symptomatic (ACC/AHA 2023)'
- 'Mobitz II: Permanent pacemaker (high risk for progression to complete block) (ACC/AHA
  2023)'
- 'Complete heart block: Transcutaneous pacing, atropine (if narrow QRS escape), permanent
  pacemaker (ACC/AHA 2023)'
- 'Stop AV nodal blockers: Beta-blockers, CCB, digoxin, amiodarone (ACC/AHA 2023)'
clinical_pearls:
- 'First-degree: Benign, no treatment needed (monitor if on AV nodal blockers)'
- 'Mobitz I (Wenckebach): Usually benign, AV nodal level, narrow QRS'
- 'Mobitz II: Infranodal (His-Purkinje), wide QRS, high risk for complete block -
  needs pacemaker'
- 'Complete heart block: Medical emergency if symptomatic, pacemaker urgently'
- 'Inferior MI: AV block common (RCA supplies AV node), often temporary'
referrals:
- 'Cardiology/EP for: Mobitz II, complete heart block, symptomatic bradycardia'
- 'Permanent pacemaker: Mobitz II, symptomatic complete block, symptomatic Mobitz
  I'
differentials: []
