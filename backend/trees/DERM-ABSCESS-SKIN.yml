tree_id: DERM-ABSCESS-SKIN
name: Skin Abscess (Furuncle / Carbuncle)
family: Dermatology
specialty: Dermatology/Primary Care/Emergency Medicine
chief_complaint: Painful, swollen, red lump with pus
description: Localized collection of pus in dermis and subcutaneous tissue. Most commonly caused by Staphylococcus aureus (including MRSA). Incision and drainage (I&D) is primary treatment. Antibiotics indicated for specific situations.
icd10: L02.91
snomed: 128477000
presentations:
  - Painful, tender, fluctuant nodule
  - Erythema, warmth, swelling
  - Purulent drainage (spontaneous or after rupture)
  - Fever if large or systemic involvement
  - Common locations - axilla, groin, buttocks, face, neck
urgency: medium
referrals:
  emergency:
    - Facial abscess with signs of cavernous sinus thrombosis
    - Extensive cellulitis with systemic toxicity
    - Abscess with sepsis
    - Necrotizing fasciitis
  urgent:
    - Large abscess requiring I&D
    - Abscess in immunocompromised
    - Failed outpatient management
  routine:
    - Small abscess amenable to outpatient I&D
    - Recurrent abscesses

workup:
  - Clinical diagnosis based on examination
  - History
  - Duration - days to weeks
  - Pain progression - initially firm nodule, becomes fluctuant and more painful as abscess matures
  - Spontaneous drainage - may have purulent discharge
  - Fever, chills - suggests systemic involvement
  - Prior episodes - recurrent abscesses common with MRSA colonization
  - Risk factors
  - MRSA colonization (nares, groin, axillae)
  - Diabetes mellitus
  - Immunosuppression (HIV, chemotherapy, corticosteroids)
  - IV drug use
  - Poor hygiene, crowded living conditions
  - Contact sports (wrestling, football)
  - Recent hospitalization or antibiotic use
  - Hidradenitis suppurativa (recurrent abscesses in axillae, groin, perianal)
  - Physical examination
  - Inspection - erythematous, warm, swollen nodule or plaque
  - Palpation - fluctuance (key finding indicating pus collection, ready for drainage)
  - Firm induration without fluctuance suggests cellulitis or early abscess not yet mature
  - Size - measure diameter (cm)
  - Purulent drainage - spontaneous or expressible
  - Surrounding cellulitis - erythema extending beyond abscess
  - Lymphadenopathy - regional lymph nodes tender/enlarged
  - Vital signs - fever suggests systemic infection
  - Definitions
  - Furuncle (boil) - abscess of hair follicle and surrounding tissue
  - Carbuncle - coalescence of multiple furuncles, forms multiloculated abscess with multiple drainage points, more extensive
  - Hidradenitis suppurativa - chronic inflammatory condition with recurrent abscesses in apocrine gland-bearing areas
  - Location-specific considerations
  - Facial abscess (nasolabial triangle, periorbital) - risk of cavernous sinus thrombosis, need IV antibiotics
  - Perianal abscess - may be simple or associated with Crohn's disease, fistula-in-ano
  - Axillary/groin - consider hidradenitis suppurativa if recurrent
  - Hand abscess - felon (finger pulp), paronychia (nail fold)
  - Laboratory/imaging
  - Routine labs not needed for uncomplicated abscess
  - Culture and sensitivity - from purulent drainage (aspirate or swab after I&D)
  - Identifies organism (S. aureus vs MRSA), guides antibiotic choice if needed
  - Mandatory if MRSA suspected or empiric antibiotics given
  - Gram stain and culture for atypical organisms if immunocompromised (fungi, mycobacteria, actinomyces)
  - Blood cultures - if febrile, systemically ill, or immunocompromised
  - Imaging - rarely needed
  - Ultrasound - if uncertain whether fluctuant, identifies fluid collection, useful for deep or difficult-to-examine locations
  - CT or MRI - if concern for deep abscess, osteomyelitis, necrotizing fasciitis
treatment:
  - Incision and drainage (I&D) - definitive treatment for abscess
  - Indications - fluctuant abscess (any size)
  - Procedure
  - Local anesthesia - lidocaine 1-2% with epinephrine (avoid epinephrine on digits, nose, ears, penis)
  - Incision - make linear incision over point of maximum fluctuance, large enough to allow drainage and probing
  - Drainage - express pus, culture purulent material
  - Break up loculations - insert hemostat and gently spread to break up septations
  - Irrigation - copious irrigation with normal saline
  - Packing - loosely pack wound cavity with iodoform gauze (promotes hemostasis, keeps wound open to drain)
  - Remove packing in 24-48 hours
  - Controversial whether packing necessary - some studies show no benefit
  - Dressing - cover with absorbent gauze
  - Alternatives to packing - loop drainage technique (vessel loop sutured in place to keep wound open)
  - Follow-up in 2-3 days to assess healing, repack if large cavity
  - Antibiotics - NOT routinely needed if adequate drainage performed
  - I&D alone usually sufficient for uncomplicated abscess
  - Antibiotic indications
  - Severe or extensive disease (greater than 5 cm, multiple abscesses)
  - Significant surrounding cellulitis (greater than 2 cm erythema beyond abscess)
  - Systemic signs (fever, tachycardia)
  - Immunocompromised (HIV, chemotherapy, diabetes with poor control)
  - Extremes of age (infants, elderly)
  - Lack of response to I&D alone
  - Difficult-to-drain location (face, hands, genitals)
  - Concern for deeper infection (septic arthritis, osteomyelitis, endocarditis)
  - Antibiotic choice - must cover MRSA (most common cause of skin abscesses)
  - Outpatient oral antibiotics (for above indications)
  - Trimethoprim-sulfamethoxazole (Bactrim DS) 1-2 tablets twice daily x 5-10 days - first-line
  - Doxycycline 100 mg twice daily x 5-10 days - alternative
  - Clindamycin 300-450 mg three times daily x 5-10 days - if beta-lactam allergy, increasing resistance
  - Linezolid 600 mg twice daily x 5-10 days - expensive, reserved for resistant cases
  - Avoid beta-lactams (cephalexin, dicloxacillin) for empiric therapy - ineffective against MRSA
  - IV antibiotics - if admission required
  - Vancomycin 15-20 mg/kg IV every 8-12 hours
  - Daptomycin 4-6 mg/kg IV daily
  - Linezolid 600 mg IV every 12 hours
  - Warm compresses - before fluctuance develops, may promote abscess maturation and spontaneous drainage
  - After I&D, promotes continued drainage and healing
  - Pain management - NSAIDs (ibuprofen, naproxen) or acetaminophen, rarely require opioids
  - Recurrent abscesses - decolonization to eradicate MRSA carriage
  - Intranasal mupirocin 2% ointment twice daily x 5 days (months 1, 3, 5)
  - Chlorhexidine body washes daily x 5-14 days
  - Decolonize household contacts if recurrent infections
  - Bleach baths (1/4 - 1/2 cup bleach per bathtub) twice weekly
  - Clean personal items (towels, razors, clothing) frequently
  - No sharing of personal items
  - Specific scenarios
  - Perirectal abscess - I&D in OR if complex, rule out fistula, treat with antibiotics covering gram-negatives and anaerobes
  - Facial abscess - IV antibiotics (vancomycin + piperacillin-tazobactam), I&D with caution, risk of cavernous sinus thrombosis
  - Hidradenitis suppurativa - chronic management with antibiotics (doxycycline, clindamycin), biologics (adalimumab), surgery for extensive disease
clinical_pearls:
  - Incision and drainage (I&D) is primary treatment - antibiotics alone insufficient
  - Fluctuance key finding - indicates pus collection ready for drainage
  - MRSA most common cause (50-80% of community-acquired skin abscesses) - must cover with antibiotics if indicated
  - Antibiotics NOT routinely needed - I&D alone curative for uncomplicated abscess
  - Antibiotic indications - severe disease, extensive cellulitis, systemic signs, immunocompromised, failed I&D
  - TMP-SMX (Bactrim) first-line oral antibiotic for MRSA coverage
  - Avoid beta-lactams (cephalexin) for empiric therapy - ineffective against MRSA
  - Culture abscess drainage - identifies organism, guides therapy if treatment fails
  - Recurrent abscesses - consider MRSA decolonization (intranasal mupirocin, chlorhexidine washes)
  - Facial abscesses dangerous - risk of cavernous sinus thrombosis, always treat with IV antibiotics
  - Warm compresses help - before drainage promotes maturation, after drainage promotes continued drainage
  - Packing controversial - some studies show no benefit, but commonly done for hemostasis
  - Hidradenitis suppurativa chronic condition - requires long-term management, not just I&D
differentials:
  - Cellulitis - erythema, warmth, induration but no fluctuance (no pus collection), antibiotics primary treatment
  - Furuncle vs carbuncle - furuncle single hair follicle abscess, carbuncle coalescence of multiple
  - Pilonidal cyst/abscess - sacrococcygeal region, natal cleft, may have hair visible in sinus tract
  - Hidradenitis suppurativa - recurrent abscesses in axillae, groin, perianal, chronic inflammatory condition
  - Inflamed epidermoid cyst - fluctuant but with central punctum (pore), drains cheesy material not pus
  - Necrotizing fasciitis - severe pain out of proportion, rapid progression, skin necrosis, bullae, systemic toxicity, surgical emergency
trace:
  - 35-year-old man presents to urgent care with painful lump on right buttock for 4 days
  - Started as small firm bump, progressively enlarged and more painful
  - Noticed pus draining this morning, brought tissue with purulent drainage
  - Denies fever, chills
  - Had similar abscess on thigh 6 months ago treated with antibiotics only, did not have drainage
  - Works as personal trainer, uses gym equipment daily
  - No diabetes, not immunocompromised
  - Physical examination - 3 cm fluctuant, erythematous, tender nodule on right buttock, spontaneous purulent drainage visible, surrounding erythema extends 1 cm beyond abscess, no lymphadenopathy, afebrile, vital signs normal
  - Diagnosis - Skin abscess (furuncle) right buttock, likely MRSA given community-acquired and gym exposure
  - Procedure - Incision and drainage performed
  - Local anesthesia with lidocaine 1% with epinephrine
  - 2 cm linear incision over point of maximum fluctuance
  - Expressed 10 mL purulent material, sent for culture and sensitivity
  - Broke up loculations with hemostat
  - Irrigated cavity with 100 mL normal saline
  - Packed cavity loosely with iodoform gauze
  - Applied bulky dressing
  - Culture sent - grew MRSA (methicillin-resistant Staphylococcus aureus) sensitive to TMP-SMX, doxycycline, clindamycin, vancomycin
  - Antibiotic decision - uncomplicated abscess with adequate drainage, minimal surrounding cellulitis (less than 2 cm), no systemic signs, immunocompetent - antibiotics NOT indicated per guidelines
  - I&D alone sufficient
  - Prescribed ibuprofen 600 mg every 6 hours PRN for pain
  - Instructions - remove packing in 48 hours (at home or return to clinic), warm compresses 3-4 times daily to promote drainage, keep clean and covered
  - Return if worsening redness, fever, or not improving
  - Discussed MRSA decolonization given recurrent infections
  - At 48 hours - packing removed, wound draining well, less pain, erythema improved
  - No repacki ng needed, continue warm compresses and dressing changes
  - At 1 week - wound nearly closed, minimal drainage, no signs of infection
  - Counseled on decolonization - intranasal mupirocin 2% ointment twice daily x 5 days, chlorhexidine body washes daily x 2 weeks, clean gym equipment before use, don't share towels
  - At 3 weeks - wound completely healed, small scar, no recurrence

citations:
  - IDSA (Infectious Diseases Society of America) Guidelines for Skin and Soft Tissue Infections
  - AAD (American Academy of Dermatology) Guidelines
  - UpToDate - Dermatology and Infectious Disease
