tree_id: GASTRO-ULCERATIVE-COLITIS
name: Ulcerative Colitis (UC)
family: Gastroenterology
specialty: Gastroenterology
icd10:
- K51.90
- K51.00
snomed:
- '64766004'
urgency: medium
description: Comprehensive evaluation and management of Ulcerative Colitis (UC)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Bloody diarrhea (hallmark), tenesmus, urgency
- Lower abdominal cramping, often relieved by defecation
- Continuous inflammation starting at rectum, extends proximally
- 'Extraintestinal: Arthritis, PSC (stronger association than Crohn''s), erythema
  nodosum'
- 'Severe flare (fulminant colitis): More than 10 BM/day, fever, tachycardia, anemia'
- 'Toxic megacolon: Dilated colon (>6 cm), systemic toxicity, risk of perforation'
workup:
- Colonoscopy (continuous inflammation, loss of vascular pattern, pseudopolyps)
- Biopsy (crypt abscesses, basal plasmacytosis)
- Fecal calprotectin (elevated)
- CBC (anemia), CRP/ESR, stool studies
- Abdominal X-ray if toxic megacolon suspected (dilated colon)
treatment:
- 'Guideline-based treatment options for Ulcerative Colitis (UC) include:'
- 'Mild-moderate: Mesalamine2.4-4.8g daily, topical mesalamine suppositories/enemas
  (ACG 2023)'
- 'Moderate-severe: Prednisone 40mg daily taper (ACG 2023)'
- 'Maintenance: Azathioprine, 6-MP, or biologics (infliximab, vedolizumab) (ACG 2023)'
- 'Severe flare: IV methylprednisolone 60mg daily, if refractory → cyclosporine or
  colectomy (ACG 2023)'
- 'Toxic megacolon: NPO, IV fluids, antibiotics, surgery if no improvement (ACG 2023)'
clinical_pearls:
- Continuous mucosal inflammation (unlike Crohn's skip lesions)
- Starts in rectum, extends proximally (can be proctitis, left-sided, or pancolitis)
- Smoking protective (opposite of Crohn's)
- 'Increased colon cancer risk: Screen starting 8 years after diagnosis'
- 'Severe flare: IV steroids, if no response in 3-5 days → consider colectomy'
referrals:
- Gastroenterology for all suspected UC
- Colorectal surgery if severe refractory flare or toxic megacolon
differentials: []
