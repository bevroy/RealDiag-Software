tree_id: ORTHO-ROTATOR-CUFF-TEAR
name: Rotator Cuff Tear
family: Orthopedics
specialty: Orthopedics
icd10:
- M75.100
snomed:
- 47433009
urgency: medium
description: Comprehensive evaluation and management of Rotator Cuff Tear
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Shoulder pain, especially with overhead activities
- Weakness with arm elevation
- Painful arc of motion
- Positive drop arm test, empty can test
- MRI shows rotator cuff tear
- Common in elderly or after trauma
workup:
- 'Empty can test (supraspinatus): Arm 90° abduction, 30° forward, thumb down. Resist
  elevation. Pain/weakness = positive'
- 'Drop arm test: Passively abduct arm 90°, ask to slowly lower. Arm drops suddenly
  = positive (full-thickness tear)'
- 'External rotation lag sign: Passively externally rotate arm 90°, ask to hold. Arm
  falls to neutral = positive (infraspinatus tear)'
- 'MRI shoulder: 90% sensitive - shows tear size, retraction, muscle atrophy, fatty
  infiltration (poor prognosis for repair)'
- 'X-ray shoulder (AP, scapular Y, axillary): Rule out fracture, calcific tendinitis,
  acromioclavicular arthritis'
treatment:
- 'Guideline-based treatment options for Rotator Cuff Tear include:'
- 'Conservative (first-line for degenerative tears): PT 6-12 weeks (deltoid compensation,
  scapular stabilization), NSAIDs, subacromial steroid injection (AAOS 2023)'
- 'Subacromial steroid injection: Triamcinolone 40mg + 5 mL lidocaine - diagnostic
  and therapeutic (AAOS 2023)'
- 'Surgical repair: If traumatic tear in young patient, failed 3-6 months PT, significant
  weakness, large tear (>3 cm) (AAOS 2023)'
- 'Repair options: Arthroscopic (preferred), mini-open, open. Better outcomes if repaired
  within 6 months (muscle atrophy/fatty infiltration irreversible after 6 months)
  (AAOS 2023)'
- 'Post-op: Sling x6 weeks, passive ROM only x6 weeks, then active ROM, strengthening
  at 3 months (AAOS 2023)'
clinical_pearls:
- 'Prevalence increases with age: 10% at age 60, 50% at age 80 (many asymptomatic)'
- 'Traumatic vs degenerative: Young trauma (fall on outstretched arm) vs older degenerative
  (chronic impingement, overuse)'
- Supraspinatus most commonly torn (90%), then infraspinatus (60%), subscapularis
  (40%), teres minor (rare)
- 'Partial vs full-thickness: Partial tears (bursal or articular side) may respond
  to PT, full-thickness often need surgery'
- 'Massive tears (>5 cm, 2+ tendons): High re-tear rate after repair, may need reverse
  total shoulder if irreparable'
referrals:
- 'Orthopedic shoulder specialist if: Acute traumatic tear, failed 3-6 months PT,
  significant weakness, large/massive tear'
- 'Degenerative tears: Trial PT x3-6 months before surgery (50% improve with PT alone)'
differentials: []
