tree_id: ORTHO-ROTATOR-CUFF-TEAR
name: Rotator Cuff Tear
family: Orthopedics
specialty: Orthopedics
chief_complaint: Shoulder pain and weakness
description: |
  Tear of rotator cuff tendons (supraspinatus most commonly affected). Can be partial or full-thickness.
  Age-related degeneration most common cause. Acute trauma less common. Affects 20-30% of people over 60.
icd10: M75.10
urgency: Low
workup:
  - Physical examination including Neer test (impingement), Hawkins-Kennedy test (impingement), empty can test (supraspinatus)
  - Drop arm test (inability to lower arm smoothly suggests full-thickness tear)
  - External rotation lag sign and lift-off test (subscapularis tear)
  - X-ray shoulder (AP, axillary, scapular Y views) to rule out fracture, assess for superior humeral head migration, acromial spurring
  - MRI shoulder (gold standard, 90% sensitivity for full-thickness tears, shows tear size and muscle atrophy)
  - Ultrasound alternative if MRI contraindicated (operator-dependent, 85-95% accuracy)
treatment:
  - Conservative treatment for partial tears and small full-thickness tears in elderly low-demand patients
  - NSAIDs for pain control (ibuprofen 600-800mg TID, naproxen 500mg BID)
  - Physical therapy focused on strengthening remaining rotator cuff and scapular stabilizers (6-12 weeks trial)
  - Subacromial corticosteroid injection for persistent pain (triamcinolone 40mg, provides temporary relief)
  - Surgical repair indicated if conservative treatment fails after 3-6 months, acute traumatic tear in young active patient, or weakness persisting
  - Arthroscopic repair preferred for most tears (less invasive, faster recovery)
  - Open repair for massive tears or revision surgery
  - Post-operative immobilization in sling 4-6 weeks, physical therapy 3-6 months
  - Reverse total shoulder arthroplasty for massive irreparable tears with arthritis in elderly
clinical_pearls:
  - Supraspinatus initiates shoulder abduction (0-15 degrees), deltoid continues abduction (15-180 degrees)
  - Painful arc 60-120 degrees suggests subacromial impingement or rotator cuff pathology
  - Night pain common (lying on affected shoulder compresses cuff)
  - Muscle atrophy on MRI indicates chronicity and poorer surgical outcomes
  - Tear size matters - small (<1cm), medium (1-3cm), large (3-5cm), massive (>5cm)
  - Younger patients with acute tears benefit most from surgical repair
  - Many rotator cuff tears are asymptomatic and found incidentally on imaging
differentials:
  - Shoulder impingement syndrome
  - Calcific tendinitis
  - Adhesive capsulitis (frozen shoulder)
  - Glenohumeral arthritis
  - Cervical radiculopathy
  - Acromioclavicular joint arthritis
trace:
  - Shoulder pain and weakness x 6 months → Positive empty can test and drop arm test → X-ray shows superior humeral head migration → MRI confirms full-thickness supraspinatus tear (2.5cm) → Trial conservative treatment with NSAIDs and physical therapy x 3 months → Persistent pain and weakness → Arthroscopic rotator cuff repair → Immobilization in sling 6 weeks → Physical therapy 4 months → Regain function and strength
