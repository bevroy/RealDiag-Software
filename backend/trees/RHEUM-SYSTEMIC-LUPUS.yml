tree_id: RHEUM-SYSTEMIC-LUPUS
name: Systemic Lupus Erythematosus
family: Rheumatologic
specialty: Rheumatology
chief_complaint: Joint pain and rash
description: Chronic autoimmune disease with multi-organ involvement causing arthritis, rash, serositis, renal disease, and cytopenias

icd10: M32.9

urgency: urgent

workup:
  - Clinical features: young women (female to male 9:1, peak age 15-40), multisystem involvement
  - Constitutional symptoms: fatigue, fever, weight loss
  - Musculoskeletal: arthralgia or non-erosive arthritis (hands, wrists, knees), no deformity (unlike RA)
  - Dermatologic: malar (butterfly) rash sparing nasolabial folds (classic), discoid rash (scarring), photosensitivity, oral or nasopharyngeal ulcers (usually painless), alopecia
  - Serositis: pleuritis (pleuritic chest pain, pleural effusion), pericarditis (chest pain, pericardial friction rub, effusion)
  - Renal: lupus nephritis (proteinuria, hematuria, RBC casts, elevated creatinine) - serious complication requiring aggressive treatment
  - Hematologic: hemolytic anemia (Coombs positive), leukopenia, lymphopenia, thrombocytopenia
  - Neurologic: seizures, psychosis, aseptic meningitis, transverse myelitis, peripheral neuropathy
  - EULAR/ACR 2019 classification criteria: requires ANA positive (entry criterion) plus score greater than or equal to 10 from domains (constitutional, hematologic, neuropsychiatric, mucocutaneous, serosal, musculoskeletal, renal)
  - Laboratory: ANA positive 95 percent sensitive (but not specific, can be positive in healthy people and other diseases), anti-dsDNA highly specific (60-70 percent), anti-Smith (Sm) highly specific (30 percent)
  - Complete autoimmune panel: anti-Ro/SSA, anti-La/SSB (associated with neonatal lupus and photosensitivity), anti-RNP, antihistone antibodies (drug-induced lupus)
  - Complement: C3 and C4 low during active disease (consumed by immune complexes), useful to monitor disease activity
  - CBC: Coombs-positive hemolytic anemia, leukopenia (WBC less than 4000), lymphopenia (less than 1500), thrombocytopenia (less than 100,000)
  - Urinalysis: proteinuria, hematuria, RBC casts (lupus nephritis) - if positive need 24-hour urine protein or spot urine protein-to-creatinine ratio and renal biopsy
  - Renal biopsy if lupus nephritis: determines class (I-VI), guides treatment
  - Antiphospholipid antibodies: lupus anticoagulant, anticardiolipin, anti-beta-2-glycoprotein I (associated with thrombosis and pregnancy loss)

treatment:
  - All patients: hydroxychloroquine 200-400 mg daily (reduces flares, prevents organ damage, improves survival), sun protection (sunscreen, avoid midday sun), NSAIDs for arthralgia
  - Mild disease (arthritis, rash): hydroxychloroquine plus NSAIDs, short course low-dose prednisone for flares
  - Moderate disease (serositis, cytopenias): prednisone 0.5 mg/kg daily taper over weeks-months, add steroid-sparing immunosuppressant (azathioprine 2 mg/kg daily, methotrexate 15-25 mg weekly, mycophenolate mofetil 1-3 grams daily)
  - Severe disease (lupus nephritis, CNS lupus, severe cytopenias): high-dose IV methylprednisolone 500-1000 mg daily x 3 days (pulse therapy) followed by oral prednisone 1 mg/kg daily, plus induction therapy with IV cyclophosphamide or mycophenolate mofetil
  - Lupus nephritis treatment: induction (6 months) with mycophenolate mofetil 2-3 grams daily or IV cyclophosphamide, then maintenance (years) with mycophenolate or azathioprine, goal remission (proteinuria less than 0.5 grams/day, normal creatinine)
  - Refractory lupus: rituximab (B-cell depleting, 1000 mg IV on day 1 and 15), belimumab (anti-BLyS antibody, 10 mg/kg IV monthly)
  - Antiphospholipid syndrome (thrombosis or pregnancy loss with positive aPL antibodies): anticoagulation with warfarin (INR 2-3), aspirin if arterial thrombosis or pregnancy
  - Monitoring: clinical assessment, anti-dsDNA and complement levels (track disease activity), urinalysis (detect nephritis early), CBC, CMP
  - Pregnancy: high-risk, requires rheumatology and maternal-fetal medicine co-management, hydroxychloroquine safe and should be continued, avoid methotrexate and mycophenolate (teratogenic)

clinical_pearls:
  - Young women with multisystem disease (arthritis, rash, serositis, cytopenias)
  - Malar (butterfly) rash sparing nasolabial folds classic
  - ANA positive 95 percent sensitive (entry criterion), anti-dsDNA and anti-Sm highly specific
  - Low complement (C3, C4) indicates active disease
  - Hydroxychloroquine for all patients (reduces flares, prevents damage, improves survival)
  - Lupus nephritis requires aggressive treatment (steroids plus mycophenolate or cyclophosphamide)
  - Non-erosive arthritis (unlike RA)

differentials:
  - Rheumatoid arthritis (erosive arthritis, RF/anti-CCP positive, no rash)
  - Mixed connective tissue disease (overlap features, anti-RNP positive)
  - Drug-induced lupus (procainamide, hydralazine, isoniazid - antihistone antibodies, resolves after stopping drug)
  - Sjogren syndrome (dry eyes/mouth, anti-Ro/La positive)

trace:
  - 28-year-old woman presents with 3 months progressive fatigue, joint pain (hands, wrists, knees), facial rash, worsening with sun exposure
  - History: 1 week ago developed pleuritic chest pain (worse with deep breath)
  - Exam: malar rash across cheeks sparing nasolabial folds (butterfly distribution), photosensitive rash upper chest, painless oral ulcer hard palate, synovitis hands and wrists (no deformity), pleural friction rub left base
  - Labs: ANA positive 1:640 speckled pattern, anti-dsDNA 185 IU/mL (elevated, normal less than 25), anti-Sm positive, anti-Ro positive, C3 68 mg/dL (low, normal 90-180), C4 8 mg/dL (low, normal 10-40)
  - CBC: WBC 3.2K (leukopenia), lymphocytes 800 (lymphopenia), hemoglobin 10.8 g/dL (anemia), MCV 88 fL (normocytic), platelets 110K (mild thrombocytopenia), Coombs test positive (hemolytic anemia)
  - CMP: creatinine 0.9 mg/dL (normal)
  - Urinalysis: protein 2+ (100 mg/dL), RBC 10-20 per HPF, RBC casts present (glomerulonephritis)
  - 24-hour urine protein: 2.8 grams (nephrotic-range proteinuria)
  - Chest X-ray: small left pleural effusion
  - Diagnosis: systemic lupus erythematosus with lupus nephritis (Class III or IV suspected based on proteinuria and RBC casts) and serositis (pleuritis)
  - EULAR/ACR score: fever 2, leukopenia 3, thrombocytopenia 4, autoimmune hemolysis 4, proteinuria greater than 0.5 grams 4, joint involvement 6, pleural effusion 5, malar rash 6, alopecia 2, oral ulcers 2, anti-dsDNA 6, low complement 3 - total well over 10 (definite SLE)
  - Renal biopsy: Class IV diffuse proliferative lupus nephritis (most severe, requires aggressive treatment)
  - Started high-dose prednisone 60 mg daily (1 mg/kg), mycophenolate mofetil 1500 mg twice daily (induction for lupus nephritis), hydroxychloroquine 400 mg daily
  - 2 weeks: pleuritic pain resolved, joint pain improved 50 percent
  - 4 weeks: arthritis markedly improved, fatigue better, repeat urinalysis shows decreased proteinuria and hematuria
  - 3 months: clinical improvement sustained, prednisone tapered to 20 mg daily, repeat 24-hour urine 0.8 grams (improved from 2.8), creatinine 0.8 mg/dL (stable), C3/C4 normalized
  - 6 months: achieved partial remission (proteinuria 0.6 grams/day), transitioned to maintenance therapy with mycophenolate 1500 mg twice daily, prednisone tapered to 5 mg daily
  - 1 year: sustained remission, proteinuria 0.3 grams/day, continues hydroxychloroquine plus low-dose mycophenolate and prednisone 5 mg daily
  - Counseled on sun protection, regular monitoring, pregnancy planning (high-risk, requires specialist care)
