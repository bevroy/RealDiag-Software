tree_id: EM-PULMONARY-EMBOLISM
name: Pulmonary Embolism
family: Emergency Medicine
specialty: Emergency Medicine
icd10:
- I26.99
- I26.09
snomed:
- '59282003'
urgency: medium
description: Comprehensive evaluation and management of Pulmonary Embolism
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Acute dyspnea (most common symptom, 73%)
- Pleuritic chest pain (sharp, worse with inspiration, 44%)
- Tachypnea (respiratory rate >20 breaths/min)
- Tachycardia (heart rate >100 bpm)
- Hypoxia (SpO2 <95%) - but normal O2 doesn't rule out PE
- Cough
- Hemoptysis (less common, 8%)
- Lower extremity swelling or pain (DVT symptoms)
- Syncope or presyncope (suggests massive PE)
- Hypotension or shock if massive PE (5% of cases)
- 'Risk factors: Recent surgery, immobilization >3 days, malignancy, pregnancy/postpartum,
  oral contraceptives, thrombophilia'
- Sudden onset of symptoms (seconds to minutes)
workup: []
treatment:
- 'Guideline-based treatment options for Pulmonary Embolism include:'
- 'Immediate: Oxygen, IV access, anticoagulation if high suspicion (ACEP 2023)'
- 'Massive PE (shock/hypotension): Thrombolysis, consider ECMO/surgical embolectomy
  (ACEP 2023)'
- 'Submassive PE (RV strain, no shock): Anticoagulation, monitor closely, consider
  half-dose tPA (ACEP 2023)'
- 'Anticoagulation: Apixaban 10mg BID ×7d then 5mg BID, or rivaroxaban 15mg BID ×21d
  then 20mg daily, or LMWH→warfarin (INR 2-3) (ACEP 2023)'
- 'Disposition: Admit for massive/submassive PE, discharge if low-risk with outpatient
  anticoagulation follow-up (ACEP 2023)'
clinical_pearls:
- Wells score >4 or PERC rule positive → proceed with workup (D-dimer or CTPA)
- D-dimer negative in low-risk (<2% Wells) safely rules out PE (high sensitivity)
- 'CTPA gold standard: Filling defect in pulmonary artery, V/Q scan if contrast contraindicated'
- 'Massive PE (hemodynamic instability): Consider thrombolysis (tPA 100mg over 2hr)
  - high bleeding risk but life-saving'
- Start anticoagulation immediately if high suspicion, don't wait for imaging
- Saddle embolus = large clot at PA bifurcation, high mortality
