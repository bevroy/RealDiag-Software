tree_id: DERM-CONTACT-DERMATITIS
name: Contact Dermatitis
family: Dermatology
specialty: Dermatology
chief_complaint: Itchy rash after exposure to irritant or allergen
description: Inflammatory skin reaction from direct contact with irritant or allergen causing pruritic erythematous rash in distribution matching exposure. Identify and avoid trigger, topical corticosteroids treat inflammation, resolves with trigger avoidance.
icd10: L25.9
urgency: routine

workup:
  - Clinical diagnosis: pruritic erythematous rash with distribution corresponding to exposure site
  - Types: irritant contact dermatitis (80% - direct toxic effect, immediate or cumulative), allergic contact dermatitis (20% - type IV hypersensitivity, delayed 24-72 hours)
  - Irritant: no prior sensitization needed, immediate burning or delayed cumulative damage (detergents, solvents, acids)
  - Allergic: requires prior sensitization, delayed onset 24-72 hours after re-exposure, pruritus prominent
  - Distribution key: helps identify trigger (hands = soaps/gloves, wrist = watch/jewelry, face = cosmetics/fragrances, eyelids = nail polish touching face)
  - Acute: erythema, vesicles, bullae, weeping, crusting
  - Chronic: lichenification (thickened skin from repeated scratching), scaling, fissures
  - Common triggers: nickel (jewelry, belt buckles), fragrances, preservatives, latex, poison ivy/oak, adhesives, topical antibiotics (neomycin)
  - Patch testing: gold standard for allergic contact dermatitis, identifies specific allergens, performed by dermatologist when trigger unclear
  - Apply potential allergens to back under occlusion x48 hours, read at 72-96 hours
  - Rule out other causes: if distribution atypical consider atopic dermatitis, nummular eczema, psoriasis

treatment:
  - Identify and avoid trigger: most important intervention, complete avoidance necessary for resolution
  - Ask about new products, occupational exposures, hobbies, jewelry
  - Acute phase: cool compresses, topical corticosteroids
  - Topical corticosteroids: potency based on severity and location
  - Mild-moderate: hydrocortisone 1-2.5% cream BID to face/intertriginous areas
  - Moderate-severe: triamcinolone 0.1% cream BID to body, clobetasol 0.05% cream BID to hands/feet (potent)
  - Duration: 2-4 weeks then taper, avoid prolonged use on face
  - Systemic corticosteroids: if severe or widespread
  - Prednisone 40-60 mg daily x5-7 days then taper over 10-14 days (minimum 2-week course to prevent rebound)
  - Antihistamines: for pruritus, hydroxyzine 25 mg Q6H or cetirizine 10 mg daily
  - Emollients: frequent moisturization (Cetaphil, CeraVe) to restore skin barrier
  - Barrier protection: cotton gloves under vinyl gloves for hand dermatitis from wet work
  - Avoid sensitizers: do not use topical antibiotics (neomycin, bacitracin common sensitizers)
  - Poison ivy treatment: wash exposed skin immediately with soap and water, launder clothes, wash under nails
  - Calcineurin inhibitors: tacrolimus 0.1% or pimecrolimus 1% for facial dermatitis if steroid-sparing needed

clinical_pearls:
  - Distribution matches exposure site - key diagnostic clue
  - Identify and avoid trigger most important for resolution
  - Irritant contact dermatitis 80% (immediate toxic effect, no sensitization)
  - Allergic contact dermatitis 20% (delayed 24-72 hours, type IV hypersensitivity)
  - Common allergens: nickel, fragrances, preservatives, poison ivy, topical neomycin
  - Topical steroids treat inflammation but avoidance cures
  - Patch testing identifies specific allergens when trigger unclear
  - Systemic steroids if severe - need 2-week course to prevent rebound

differentials:
  - Atopic dermatitis: flexural distribution (antecubital, popliteal), personal/family history atopy, chronic relapsing course
  - Psoriasis: well-demarcated plaques with silvery scale, extensor surfaces, nail pitting
  - Nummular eczema: coin-shaped plaques, often on lower legs, chronic and pruritic
  - Tinea corporis: annular scaling plaques with central clearing, KOH prep shows hyphae

trace: |
  A 28-year-old woman presented with 5 days of intensely pruritic rash on both wrists. Started 2 days after wearing new costume jewelry bracelet. Rash limited to area under bracelet, well-demarcated. Exam showed bilateral wrist erythema, small vesicles, and weeping in band-like distribution corresponding to bracelet location. No other skin involvement. Diagnosed with allergic contact dermatitis (nickel allergy suspected - common in costume jewelry). Advised to discontinue wearing bracelet and avoid nickel-containing jewelry (costume jewelry, belt buckles, jean buttons). Prescribed triamcinolone 0.1% cream to affected areas twice daily x2 weeks. Hydroxyzine 25 mg at bedtime for pruritus and sleep. Cool compresses for comfort. At 5 days pruritus improved 60%, vesicles dried. At 2 weeks rash resolved completely with post-inflammatory hyperpigmentation. Stopped topical steroid. Counseled to avoid nickel jewelry, choose surgical steel or gold. At 3 months no recurrence since avoiding costume jewelry. If needs confirmation of nickel allergy, could perform patch testing but clinical diagnosis clear given distribution and temporal relationship.
