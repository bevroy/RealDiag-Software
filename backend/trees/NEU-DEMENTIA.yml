presentations:
  - Progressive memory loss (especially recent memory)
  - Getting lost in familiar places
  - Difficulty with complex tasks (finances, medications)
  - Language problems (word-finding difficulty, anomia)
  - Poor judgment and decision-making
  - Personality changes
  - Apathy or withdrawal
  - Confusion or disorientation
  - Repetitive questions or statements
  - Difficulty learning new information
  - Functional decline (ADL/IADL impairment)

workup:
  - Distinguish dementia from normal aging and mild cognitive impairment: normal aging (occasional forgetfulness, finds information with time), MCI (cognitive complaints, objective impairment on testing, preserved ADLs), dementia (multiple cognitive domains impaired, functional decline in ADLs/IADLs)
  - Cognitive screening: Mini-Mental State Exam (MMSE 0-30 score, less than 24 suggests dementia but education/age dependent), Montreal Cognitive Assessment (MoCA 0-30, more sensitive than MMSE especially for MCI, less than 26 abnormal), clock draw test (executive function), Mini-Cog (3-word recall plus clock draw - quick screen)
  - History from patient AND informant critical: onset and progression (gradual vs stepwise), functional decline (ADLs - bathing dressing eating, IADLs - finances medications driving), behavioral changes, medication review (anticholinergics worsen cognition), family history (Alzheimer's, frontotemporal dementia genetic)
  - Cognitive domains assessment: memory (recall words, recent events), language (naming objects, fluency), executive function (planning, problem-solving, clock draw), visuospatial (copy figures), attention, behavior/personality
  - Rule out reversible causes: hypothyroidism (TSH), vitamin B12 deficiency (B12 level, methylmalonic acid if borderline), neurosyphilis (RPR/VDRL if risk factors), normal pressure hydrocephalus (triad gait ataxia, urinary incontinence, dementia - CT/MRI shows ventriculomegaly)
  - Labs (all patients): CBC (anemia), CMP (electrolytes, renal, liver, glucose), TSH, vitamin B12, consider HIV test if risk factors, consider heavy metal screening if exposure
  - MRI brain (preferred) or CT head: identify structural lesions (tumor, subdural), vascular disease (strokes, white matter disease), atrophy patterns (medial temporal lobe atrophy Alzheimer's, frontal/temporal atrophy frontotemporal dementia), normal pressure hydrocephalus (ventriculomegaly without sulcal prominence)
  - Alzheimer disease (most common 60-70 percent): gradual onset, progressive memory loss, medial temporal lobe (hippocampal) atrophy on MRI, temporoparietal hypometabolism on FDG-PET
  - Vascular dementia (second most common 15-20 percent): stepwise decline, cerebrovascular risk factors (hypertension, diabetes, smoking, prior strokes), extensive white matter disease or multiple infarcts on MRI, associated with gait disturbance and urinary symptoms
  - Lewy body dementia (10-15 percent): visual hallucinations, parkinsonism (rigidity, bradykinesia), fluctuating cognition, REM sleep behavior disorder, severe neuroleptic sensitivity
  - Frontotemporal dementia (5-10 percent, younger onset typically 50s-60s): behavioral variant (disinhibition, apathy, loss of empathy, compulsions) or language variant (progressive aphasia), frontal/temporal atrophy on MRI, family history common (genetic forms)
  - Formal neuropsychological testing if diagnosis unclear: comprehensive assessment of all cognitive domains, distinguish dementia subtypes, establish baseline for monitoring
  - Advanced biomarkers (specialized centers): CSF analysis (amyloid-beta 42 decreased, tau increased in Alzheimer disease), amyloid PET imaging (detects amyloid plaques), tau PET imaging (research), APOE genotyping not recommended (not diagnostic, only risk factor)

treatment:
  - No cure for most dementias, treatment goals: slow progression, manage symptoms, maintain function, support caregivers
  - Cholinesterase inhibitors (mild to moderate Alzheimer disease, Lewy body dementia): donepezil 5-10 mg nightly (first-line, once daily), rivastigmine 1.5-6 mg BID or patch 4.6-13.3 mg/24hr, galantamine 4-12 mg BID, modest benefit (2-4 point MMSE improvement, delay nursing home 6-12 months), adverse effects nausea, diarrhea, bradycardia (use caution if cardiac conduction disease)
  - NMDA antagonist (moderate to severe Alzheimer disease): memantine 5-10 mg BID or extended-release 28 mg daily, can combine with cholinesterase inhibitor (additive benefit), generally well tolerated (dizziness, headache)
  - New anti-amyloid antibodies (early Alzheimer disease with confirmed amyloid on PET or CSF): lecanemab (Leqembi) 10 mg/kg IV every 2 weeks or aducanumab (Aduhelm) - remove amyloid plaques, modest clinical benefit (1.8 point CDR-SB improvement 18 months), risk ARIA (amyloid-related imaging abnormalities - brain edema or microhemorrhages, requires MRI monitoring), expensive, limited access
  - Vascular dementia: no specific medications, optimize vascular risk factors (BP control target less than 140/90, statin for hyperlipidemia, antiplatelet aspirin or clopidogrel, diabetes control HbA1c less than 8 percent in elderly)
  - Behavioral and psychological symptoms of dementia (BPSD): depression (SSRI - sertraline, citalopram), agitation (behavioral interventions first, consider low-dose antipsychotics if severe and danger to self/others - quetiapine 25-100 mg, risperidone 0.25-1 mg, FDA black box warning increased mortality in dementia), sleep disturbance (sleep hygiene, avoid diphenhydramine anticholinergic, consider trazodone 25-50 mg or melatonin)
  - Non-pharmacologic interventions: cognitive stimulation therapy, reminiscence therapy, music therapy, exercise programs (30 minutes moderate activity most days reduces cognitive decline), Mediterranean diet (possible benefit)
  - Safety considerations: driving evaluation (refer to DMV if unsafe), wandering prevention (door alarms, ID bracelet), financial protection (power of attorney, prevent exploitation), home safety (remove weapons, stove safety, fall prevention)
  - Caregiver support critical: educate about disease progression, respite care, support groups (Alzheimer's Association), address caregiver burnout and depression (common), advance care planning and goals of care discussions early

clinical_pearls:
  - Dementia diagnosis requires impairment in multiple cognitive domains AND functional decline in ADLs/IADLs
  - Alzheimer disease is most common cause (60-70 percent) - gradual memory loss, progressive
  - Always obtain history from informant (family member) - patients may lack insight into deficits
  - Reversible causes (hypothyroidism, B12 deficiency, NPH) are rare but must be excluded
  - MRI brain recommended to exclude structural lesions and identify patterns supporting diagnosis
  - Cholinesterase inhibitors modestly effective for Alzheimer disease and Lewy body dementia
  - Behavioral symptoms often more distressing than cognitive symptoms for caregivers
  - Avoid anticholinergics (diphenhydramine, oxybutynin, tricyclic antidepressants) - worsen cognition
  - Early advance care planning essential before patient loses capacity
  - Caregiver support and education as important as patient treatment

referrals:
  - Neurology or geriatrics for initial evaluation and diagnosis (especially if younger than 65 or atypical features)
  - Neuropsychology for formal cognitive testing (if diagnosis unclear, young onset, or establish baseline)
  - Geriatric psychiatry for behavioral symptoms, depression, or complex medication management
  - Occupational therapy for home safety evaluation and adaptive strategies
  - Physical therapy for gait training and fall prevention
  - Social work for community resources, respite care, assisted living placement when needed
  - Elder law attorney for advance directives, power of attorney, financial planning

differentials:
  - Normal aging (mild forgetfulness, no functional decline, performance improves with cuing)
  - Mild cognitive impairment (MCI - objective cognitive impairment but preserved ADLs, 10-15 percent/year progress to dementia)
  - Depression (pseudodementia - poor effort on testing, responds to antidepressants, memory improves)
  - Delirium (acute onset, fluctuating, inattention, reversible cause - infection, medications, metabolic)
  - Medication side effects (anticholinergics, benzodiazepines, opioids)
  - Hypothyroidism (fatigue, weight gain, respond to thyroid replacement)
  - Vitamin B12 deficiency (macrocytic anemia, neuropathy, improves with supplementation)
  - Normal pressure hydrocephalus (triad gait-incontinence-dementia, improves with VP shunt)

trace:
  - 74-year-old woman brought by daughter for evaluation of memory problems x 2 years, progressively worsening
  - Daughter reports: mother repeats questions, forgets recent conversations, got lost driving to familiar places twice, stopped paying bills (late notices), difficulty managing medications (takes pills multiple times or forgets), no longer cooks (used to cook daily)
  - Patient downplays concerns, says memory is fine for age
  - Past medical history: hypertension, hyperlipidemia, no stroke or head trauma
  - Medications: lisinopril 10 mg daily, atorvastatin 20 mg nightly
  - Family history: mother died with Alzheimer disease at age 82
  - Exam: pleasant, cooperative, MMSE score 21/30 (impaired - lost points on orientation, recall 0/3 words, unable to spell WORLD backwards, poor clock draw), vital signs normal, general and neurologic exam otherwise normal except mild difficulty with complex commands
  - Labs: TSH 2.4 mIU/L (normal), vitamin B12 482 pg/mL (normal), CBC and CMP normal
  - MRI brain: moderate bilateral hippocampal and medial temporal lobe atrophy (characteristic of Alzheimer disease), mild periventricular white matter changes (age-appropriate), no mass or stroke
  - Diagnosis: dementia likely Alzheimer disease (progressive memory loss x 2 years, multiple cognitive domains impaired - memory, language, executive function, functional decline in IADLs - finances, medications, driving, medial temporal atrophy on MRI)
  - Family meeting: discussed diagnosis, prognosis (progressive neurodegenerative disease, average survival 8-10 years from diagnosis), treatment options, safety concerns
  - Safety addressed: driving evaluation recommended (referred to DMV), daughter took over finances (power of attorney already in place), medication management by daughter (pill organizer with monitoring)
  - Started donepezil 5 mg nightly x 4 weeks then increase to 10 mg nightly (first-line cholinesterase inhibitor)
  - Counseling: advised Mediterranean diet, regular exercise, social engagement, cognitive stimulation activities
  - Daughter connected to Alzheimer's Association for education and support group
  - Follow-up 6 weeks: tolerating donepezil 10 mg, mild nausea first week (resolved), no significant cognitive change yet (expected - stabilization of decline not improvement)
  - Advance care planning: completed advance directives, POLST form, designated daughter as healthcare power of attorney, discussed goals of care (prioritize quality of life, comfort, avoid aggressive interventions if severe dementia)
  - 6-month follow-up: MMSE stable at 22/30 (stabilization suggests medication benefit), functionally similar (still dependent for IADLs but performing ADLs independently), daughter reports patient less repetitive, slightly more engaged
  - 18-month follow-up: MMSE declined to 18/30, increased apathy and withdrawal, some ADL assistance now needed (bathing, dressing), daughter experiencing caregiver stress
  - Addressed caregiver burden: arranged respite care 2 days/week (adult day program), referred daughter to therapist, discussed assisted living options for future
  - Added memantine 5 mg BID (moderate dementia stage), continued donepezil 10 mg
  - 2-year follow-up: MMSE 16/30 (moderate dementia), requires assistance with most ADLs, mild agitation in evenings (sundowning), remains at home with full-time caregiver assistance, daughter considering assisted living with memory care unit, discussed hospice eligibility criteria for future when severe stage (GDS 7, bedridden, unable to communicate)
