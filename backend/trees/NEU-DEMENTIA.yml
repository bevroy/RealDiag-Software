tree_id: NEU-DEMENTIA
name: Dementia
family: Neurology
specialty: Neurology/Geriatrics
chief_complaint: Progressive cognitive decline interfering with daily function
description: Chronic progressive neurodegenerative syndrome characterized by decline in memory and at least one other cognitive domain (language, executive function, visuospatial, behavior) sufficient to interfere with independence in daily activities

icd10: F03.90
snomed: "52448006"

urgency: routine

