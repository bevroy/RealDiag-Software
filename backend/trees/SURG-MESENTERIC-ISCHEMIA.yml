tree_id: SURG-MESENTERIC-ISCHEMIA
name: Acute Mesenteric Ischemia
family: Surgery
specialty: Surgery
icd10:
- K55.0
snomed:
- 63367001
urgency: urgent
description: Comprehensive evaluation and management of Acute Mesenteric Ischemia
version: '1.0'
citations:
  - ACS (American College of Surgeons) Clinical Guidelines
  - RCS (Royal College of Surgeons) Guidelines
  - UpToDate - General Surgery
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Severe abdominal pain out of proportion to exam
- Atrial fibrillation or vascular disease history
- Nausea, vomiting, bloody diarrhea
- Metabolic acidosis and elevated lactate
- CT angiography shows vascular occlusion
- High mortality if delayed
workup: []
treatment:
  - 'Surgical emergency - high mortality (60-80%)'
  - 'Aggressive IV fluid resuscitation'
  - 'Broad-spectrum antibiotics - piperacillin-tazobactam 4.5g IV Q6H + vancomycin'
  - 'NPO, NG tube decompression'
  - 'CT angiography - diagnostic test (SMA/celiac occlusion or non-occlusive)'
  - 'Immediate laparotomy if peritonitis - resect necrotic bowel, revascularize (embolectomy, bypass, stent)'
  - 'Papaverine infusion for non-occlusive mesenteric ischemia (vasodilator)'
  - 'Second-look laparotomy in 24-48 hours to reassess bowel viability'
  - 'Anticoagulation after revascularization to prevent recurrence'
  - 'ICU care - sepsis management, TPN'
  - 'Prognosis poor - early recognition critical'
clinical_pearls: []
referrals:
  emergency:
    - Acute abdomen
    - Peritonitis
    - Perforated viscus
    - Ruptured AAA
    - Necrotizing fasciitis
  urgent:
    - Suspected malignancy
    - Bowel obstruction
    - Incarcerated hernia
    - Acute cholecystitis
  routine:
    - Elective hernia repair
    - Gallstones without cholecystitis
    - Benign masses
    - Screening abnormalities
differentials:
  - Bowel obstruction
  - Pancreatitis
  - Perforated ulcer
  - Aortic dissection
  - Gastroenteritis
