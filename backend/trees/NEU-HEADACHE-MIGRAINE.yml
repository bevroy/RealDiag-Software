homeopathy: []
presentations:
- Recurrent unilateral (60%) or bilateral throbbing headache
- Moderate to severe intensity, worsens with activity
- 'Associated: Nausea/vomiting, photophobia, phonophobia'
- Duration 4-72 hours if untreated
- 'Aura (20-30%): Visual (scintillating scotoma), sensory, speech disturbance'
- 'Migraine with brainstem aura: Vertigo, diplopia, ataxia, dysarthria'
- 'Chronic migraine: ≥15 headache days/month for >3 months (≥8 are migraines)'
- 'ICHD-3 criteria: ≥5 attacks meeting duration, location, quality criteria'
workup: []
treatment: []
clinical_pearls:
- 'Acute treatment: NSAIDs, triptans (within 2 hours of onset), antiemetics'
- Triptans contraindicated in hemiplegic migraine, basilar migraine, CAD
- 'Prophylaxis if ≥4 attacks/month: Propranolol, topiramate, CGRP inhibitors'
- 'Medication overuse headache: >10 days/month analgesic use for >3 months'
- 'Red flags requiring imaging: New onset >50, thunderclap, focal neuro deficits'
treatment:
  - 'Acute treatment - take at onset of headache (within 1-2 hours for best efficacy)'
  - 'Mild-moderate: NSAIDs first-line - ibuprofen 400-800mg, naproxen 500-1000mg, aspirin 900-1000mg'
  - 'Moderate-severe or NSAIDs ineffective: Triptans - sumatriptan 50-100mg PO (or 6mg SC, 20mg nasal), rizatriptan 10mg, eletriptan 40mg, zolmitripan 2.5-5mg'
  - 'Triptan contraindications: Hemiplegic migraine, basilar migraine, CAD, stroke, uncontrolled HTN, pregnancy'
  - 'Antiemetics: Metoclopramide 10mg IV/PO, prochlorperazine 10mg IV/PO, ondansetron 4-8mg ODT (treat nausea, may have independent antimigraine effect)'
  - 'Combination therapy: Sumatriptan 85mg + naproxen 500mg (Treximet) - more effective than either alone'
  - 'Refractory acute: IV medications in ED - prochlorperazine 10mg IV + diphenhydramine 25mg IV (prevents dystonia), or dexamethasone 10-20mg IV (prevents recurrence), or valproate 500-1000mg IV'
  - 'Avoid opioids and butalbital - high risk of medication overuse headache and dependence'
  - 'Preventive therapy indications: ≥4 migraine days/month, ≥8 headache days/month, failure of acute treatments, or patient preference'
  - 'First-line preventive: Propranolol 80-240mg daily, metoprolol 100-200mg daily, topiramate 50-200mg daily (most effective), divalproex 500-1500mg daily'
  - 'CGRP inhibitors (newer, very effective): Erenumab 70-140mg SC monthly, fremanezumab 225mg SC monthly, galcanezumab 120mg SC monthly, eptinezumab 100mg IV Q3 months'
  - 'Alternative preventives: Amitriptyline 25-150mg qHS, venlafaxine 150mg daily, candesartan 16mg daily'
  - 'Botulinum toxin A (Botox): 155-195 units IM every 12 weeks for chronic migraine (≥15 headache days/month)'
  - 'Acute menstrual migraine prevention: Frovatriptan 2.5mg BID starting 2 days before menses x 6 days OR naproxen 500mg BID'
  - Lifestyle modifications - regular sleep schedule, avoid triggers (stress, certain foods, alcohol), regular meals, exercise, adequate hydration
  - 'Medication overuse headache: If using acute meds >10 days/month x3 months, must discontinue overused medication (may worsen temporarily), start preventive'
  - Treat comorbidities - depression, anxiety, sleep disorders (often coexist with migraine)
