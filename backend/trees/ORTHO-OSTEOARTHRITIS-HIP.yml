tree_id: ORTHO-OSTEOARTHRITIS-HIP
name: Osteoarthritis, Hip
family: orthopedics
specialty: Orthopedics
icd10: M16.9
snomed: 239872002
urgency: []
homeopathy: []
presentations:
  - Groin pain (classic location for hip OA)
  - Pain may radiate to anterior thigh, knee, or buttock
  - Insidious onset, gradual progression over months to years
  - Pain worse with weight-bearing activities (walking, stairs, standing)
  - Morning stiffness <30 minutes (vs RA which is >1 hour)
  - Difficulty with activities: putting on shoes/socks, getting in/out of car
  - Limping or antalgic gait
  - Limited hip range of motion, especially internal rotation
  - Risk factors: age >50, obesity, previous hip injury, developmental dysplasia
workup:
  - Clinical diagnosis: hip pain + age >50 + activity-related pain + morning stiffness <30 min
  - Physical examination
  - Gait assessment (antalgic gait, Trendelenburg gait)
  - Range of motion testing (internal rotation most affected early)
  - Positive FABER test (flexion, abduction, external rotation reproduces groin pain)
  - Positive log roll test (passive internal/external rotation reproduces pain)
  - Leg length discrepancy (chronic OA can cause shortening)
  - Imaging
  - Hip X-rays (AP pelvis and frog-leg lateral views)
  - Findings: joint space narrowing, osteophytes, subchondral sclerosis, cysts
  - Kellgren-Lawrence grading (0-4) for severity
  - MRI not routinely needed but can assess early cartilage loss or AVN
  - Laboratory tests NOT needed (OA is non-inflammatory)
  - May check ESR/CRP if inflammatory arthritis suspected
  - Assess functional impact
  - WOMAC score (Western Ontario McMaster Universities OA Index)
  - Visual analog pain scale
  - Impact on activities of daily living
treatment:
  - Non-pharmacologic (first-line for all patients)
  - Weight loss if BMI >25 (most effective intervention - reduces pain and slows progression)
  - Physical therapy and exercise
  - Strengthening exercises (hip abductors, extensors)
  - Low-impact aerobic exercise (swimming, cycling, walking)
  - Range of motion exercises
  - Assistive devices
  - Cane in contralateral hand (reduces hip joint loading by 20-30%)
  - Walker if bilateral hip OA or balance issues
  - Activity modification (avoid high-impact activities)
  - Pharmacologic
  - Acetaminophen 1000 mg TID (first-line, safest)
  - NSAIDs: ibuprofen 600-800 mg TID, naproxen 500 mg BID
  - Use lowest effective dose, limit duration (GI/CV/renal risks)
  - Topical NSAIDs less effective for hip than knee (deeper joint)
  - Tramadol 50-100 mg TID-QID if NSAIDs contraindicated (addiction risk)
  - Avoid opioids for chronic OA pain
  - Intra-articular injections (temporary relief)
  - Corticosteroid injections (fluoroscopy or ultrasound-guided)
  - 3-6 months relief, limit to 3-4 per year
  - Hyaluronic acid injections (viscosupplementation) - limited evidence for hip
  - Surgical management
  - Total hip arthroplasty (THA) indications
  - Severe pain and disability affecting quality of life
  - Radiographic evidence of significant OA
  - Failed conservative treatment for 3-6 months
  - THA most successful and cost-effective joint replacement
  - Greater than 95% 10-year survival rate, excellent pain relief and function
clinical_pearls:
  - "Groin pain is classic for hip OA - buttock/lateral hip pain suggests trochanteric bursitis, not OA"
  - "Internal rotation most affected movement in early hip OA"
  - "Morning stiffness <30 minutes in OA vs >1 hour in inflammatory arthritis"
  - "Weight loss most effective non-surgical intervention - every pound lost reduces hip force by 3 pounds"
  - "Hip X-rays: joint space narrowing best seen on AP pelvis weight-bearing view"
  - "Total hip replacement one of most successful surgeries - 95% satisfaction, excellent pain relief"
  - "NSAIDs provide modest benefit but significant GI/CV/renal risks in older adults"
  - "Glucosamine and chondroitin NOT recommended - no better than placebo"
referrals:
  - Orthopedic surgery if severe symptoms, functional limitation, or considering joint replacement
  - Physical therapy for exercise program and gait training
  - Pain management if conservative treatment fails
differentials:
  - Hip osteoarthritis (groin pain, limited internal rotation, X-ray changes)
  - Trochanteric bursitis (lateral hip pain, tenderness over greater trochanter)
  - Avascular necrosis of femoral head (risk factors: steroids, alcohol, trauma)
  - Hip labral tear (young active adults, clicking, catching, positive FABER test)
  - Iliopsoas bursitis (anterior hip pain, snapping hip)
  - Lumbar radiculopathy (radiating leg pain, positive straight leg raise)
  - Inflammatory arthritis (RA, psoriatic arthritis - prolonged morning stiffness, elevated ESR/CRP)
  - Hip fracture (acute trauma, unable to bear weight)
  - Referred pain from lumbar spine
