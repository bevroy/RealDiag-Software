tree_id: OB-ENDOMETRIOSIS
name: Endometriosis
family: gynecologic
specialty: Obstetrics-Gynecology
chief_complaint: Pelvic pain, dysmenorrhea, dyspareunia, infertility
description: Presence of endometrial tissue outside the uterine cavity causing inflammation and pain
icd10: N80.9
urgency: routine
workup:
  - Clinical diagnosis based on history and physical examination
  - Classic triad - dysmenorrhea (painful periods), dyspareunia (painful intercourse), dyschezia (painful bowel movements)
  - Detailed pain history - timing (cyclical vs constant), severity, impact on quality of life
  - Menstrual history, fertility concerns
  - Pelvic examination - may reveal tenderness, nodularity in posterior cul-de-sac, fixed retroverted uterus, adnexal masses
  - Often normal examination (does not rule out endometriosis)
  - Transvaginal ultrasound - evaluate for endometriomas (chocolate cysts), assess ovaries and uterus
  - Classic appearance - homogeneous low-level echoes (ground glass appearance)
  - MRI pelvis for complex cases or deep infiltrating endometriosis
  - CA-125 may be elevated (not diagnostic, nonspecific)
  - Laparoscopy with biopsy - gold standard for definitive diagnosis
  - Visual inspection plus histological confirmation
  - Classify severity using ASRM classification (Stage I minimal to Stage IV severe)
  - Consider at time of surgical treatment rather than solely for diagnosis
  - Rule out other causes of pelvic pain (PID, ovarian cysts, IBS, interstitial cystitis)
treatment:
  - Treatment goals - pain relief, preserve/restore fertility, prevent recurrence
  - Medical management for pain (does not improve fertility)
  - NSAIDs (ibuprofen 600-800 mg TID, naproxen 500 mg BID) first-line for dysmenorrhea
  - Hormonal therapy to suppress ovulation and endometrial growth
  - Combined oral contraceptives (continuous or cyclic) - first-line
  - Progestin-only therapy - norethindrone acetate 5 mg daily, medroxyprogesterone acetate, levonorgestrel IUD (Mirena)
  - GnRH agonists (leuprolide 3.75 mg IM monthly, 11.25 mg IM every 3 months)
  - Add-back therapy (norethindrone 5 mg daily or estrogen/progestin) to minimize bone loss and vasomotor symptoms
  - Limit to 6-12 months due to bone density concerns
  - GnRH antagonist (elagolix 150-200 mg daily or combined with add-back therapy)
  - Aromatase inhibitors (letrozole 2.5 mg daily) with hormonal contraception (off-label)
  - Surgical management
  - Laparoscopic excision or ablation of endometriotic lesions - gold standard
  - Excision of endometriomas (cystectomy preferred over drainage)
  - Lysis of adhesions, restoration of normal anatomy
  - Improves pain in 70-80%, improves fertility
  - Hysterectomy with bilateral salpingo-oophorectomy for severe disease unresponsive to other treatments
  - Not first-line, reserved for completed childbearing
  - Assisted reproductive technology (IVF) for infertility associated with endometriosis
  - Multidisciplinary approach - pain management, physical therapy, psychological support
clinical_pearls:
  - Affects 10% of reproductive-age women, 20-50% of women with infertility
  - Retrograde menstruation theory most accepted (Sampson theory)
  - Severity of pain does NOT correlate with stage of disease (minimal disease can cause severe pain)
  - Endometriomas (chocolate cysts) are endometriosis involving ovaries
  - Deep infiltrating endometriosis (DIE) - extends greater than 5 mm beneath peritoneum, affects bowel, bladder, ureters
  - Diagnosis delayed average 7-10 years from symptom onset
  - Normal pelvic exam does NOT exclude endometriosis
  - Pregnancy and menopause improve symptoms (suppression of ovulation)
  - Recurrence common after surgery (30-50% at 5 years) - consider postoperative hormonal suppression
  - Increased risk of ovarian cancer (especially clear cell and endometrioid subtypes)
differentials:
  - Adenomyosis (endometrial tissue within myometrium, diffusely enlarged tender uterus)
  - Pelvic inflammatory disease (cervical motion tenderness, elevated WBC, STI testing)
  - Ovarian cysts (functional cysts usually resolve, hemorrhagic cysts)
  - Irritable bowel syndrome (Rome IV criteria, altered bowel habits, no dysmenorrhea)
  - Interstitial cystitis (urinary frequency, urgency, pelvic pain, cystoscopy findings)
  - Chronic pelvic pain syndrome
  - Fibroids (palpable masses, bulk symptoms, ultrasound shows leiomyomas)
trace:
  - 28-year-old nulligravid woman presents with 5-year history of progressively worsening pelvic pain
  - Severe dysmenorrhea starting 2-3 days before menses, lasting through period
  - Pain 8/10 requiring time off work, NSAIDs provide minimal relief
  - Deep dyspareunia (pain with intercourse) particularly with deep penetration
  - Cyclical bowel symptoms with diarrhea and pain with bowel movements during menses
  - Trying to conceive for 18 months without success
  - Menstrual history - regular 28-day cycles, heavy flow first 2 days
  - Past medical history - none, no prior surgeries
  - Physical exam - BMI 24, vitals normal
  - Pelvic exam - mild tenderness in posterior cul-de-sac, possible nodularity on rectovaginal exam
  - No palpable masses, normal sized anteverted uterus
  - Transvaginal ultrasound - 4 cm left ovarian cyst with homogeneous low-level echoes consistent with endometrioma
  - Normal appearing right ovary, normal uterus
  - Labs - pregnancy test negative, CA-125 65 U/mL (mildly elevated)
  - Diagnosis - Suspected endometriosis with left ovarian endometrioma
  - Discussion of treatment options given pain and fertility goals
  - Patient desires definitive diagnosis and treatment for both pain and fertility
  - Planned for diagnostic laparoscopy with excision of endometriosis
  - Laparoscopy performed - findings consistent with Stage III endometriosis
  - Multiple peritoneal implants (powder burn lesions, red lesions), left ovarian endometrioma 4 cm, filmy adhesions
  - Deep infiltrating endometriosis on uterosacral ligaments
  - Surgical treatment - excision of all visible endometriotic lesions, left ovarian cystectomy
  - Lysis of adhesions, peritoneal washings
  - Pathology confirmed endometriosis
  - Postoperative management - started on combined oral contraceptives continuously (no placebo week)
  - For hormonal suppression and pain control
  - 3-month follow-up - significant improvement in pain (dysmenorrhea 3/10)
  - Able to have pain-free intercourse
  - Advised to try to conceive actively for 6 months given improved anatomy
  - If not pregnant by 6 months, refer to reproductive endocrinology for IVF
  - 8-month follow-up - patient pregnant naturally, thrilled with outcome
  - Outcome - Successful surgical treatment with improvement in pain and fertility
