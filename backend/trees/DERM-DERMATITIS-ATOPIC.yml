tree_id: DERM-DERMATITIS-ATOPIC
name: Atopic Dermatitis (Eczema)
family: Dermatology
specialty: Dermatology
chief_complaint: Itchy skin rash
description: Chronic relapsing inflammatory skin condition causing intensely pruritic eczematous lesions, commonly in flexural areas. Barrier repair with emollients plus topical corticosteroids control flares, systemic therapies for severe refractory disease.
icd10: L20.9
snomed: 24079001
urgency: non-urgent

workup:
  - Clinical diagnosis: pruritus plus typical morphology and distribution
  - Acute lesions: erythematous papules and plaques with excoriation, oozing, crusting
  - Chronic lesions: lichenification (thickened skin from chronic scratching), scaling, hyperpigmentation
  - Distribution: infants (face, scalp, extensor surfaces), children and adults (flexural areas - antecubital and popliteal fossae, neck, wrists, ankles)
  - Personal or family history of atopy: asthma, allergic rhinitis, food allergies (atopic triad)
  - Severity assessment: mild (<10% BSA, minimal sleep disturbance), moderate (10-20% BSA, moderate sleep disturbance), severe (>20% BSA or severe impact on quality of life)
  - Rule out other diagnoses: scabies (burrows, webspaces), contact dermatitis (well-demarcated, exposure history), psoriasis (silvery scale, extensor surfaces)

treatment:
  - Emollients (cornerstone of treatment): apply liberally and frequently (at least twice daily), preferably thick ointments or creams (petrolatum, Aquaphor, CeraVe, Cetaphil)
  - Apply emollients within 3 minutes of bathing (locks in moisture)
  - Avoid triggers: harsh soaps (use gentle fragrance-free cleansers), hot water, wool, stress, allergens
  - Mild disease: topical corticosteroids low-potency (hydrocortisone 1-2.5% cream) for flares
  - Moderate-severe disease: topical corticosteroids mid-to-high potency (triamcinolone 0.1% cream for body, hydrocortisone 2.5% for face) for 1-2 weeks then taper
  - Apply topical steroids to active lesions once or twice daily, then emollients to entire body
  - Topical calcineurin inhibitors: tacrolimus 0.03-0.1% ointment or pimecrolimus 1% cream (steroid-sparing for face and sensitive areas, no skin atrophy risk)
  - Antihistamines: hydroxyzine 25-50 mg HS or diphenhydramine 25-50 mg HS for nighttime pruritus and sleep (sedating properties helpful)
  - Secondary infection common: if honey-colored crusting or oozing, treat with topical mupirocin or oral cephalexin (Staph aureus colonization common)
  - Bleach baths: dilute bleach bath (1/4 to 1/2 cup bleach in full tub) twice weekly reduces bacterial colonization and inflammation
  - Severe refractory disease: systemic immunosuppression (dupilumab 300 mg SC every 2 weeks - IL-4/IL-13 inhibitor highly effective, JAK inhibitors, cyclosporine, methotrexate)
  - Phototherapy: narrowband UVB for moderate-severe disease if topical therapy inadequate

clinical_pearls:
  - Chronic pruritus with flexural eczema and personal/family atopy history diagnostic
  - Emollients cornerstone - apply liberally twice daily and within 3 minutes of bathing
  - Topical corticosteroids for flares - mid-to-high potency for body, low potency for face
  - Topical calcineurin inhibitors (tacrolimus, pimecrolimus) for face and sensitive areas
  - Secondary Staph aureus infection common - treat with antibiotics if crusting/oozing
  - Bleach baths twice weekly reduce bacterial colonization
  - Dupilumab for severe refractory disease - highly effective biologic
  - Avoid triggers: harsh soaps, hot water, stress

differentials:
  - Contact dermatitis: well-demarcated lesions at site of exposure, acute onset, patch testing identifies allergen
  - Psoriasis: well-demarcated plaques with silvery scale, extensor surfaces (elbows, knees), nail pitting
  - Scabies: burrows in webspaces, intense pruritus worse at night, contacts with similar symptoms
  - Seborrheic dermatitis: greasy yellow scales on scalp, nasolabial folds, central chest

trace: |
  A 7-year-old boy with history of asthma and food allergies presented with 3 years of recurrent intensely itchy rash affecting antecubital fossae, popliteal fossae, and neck. Current flare with erythematous weeping plaques in flexural areas, excoriation marks, and lichenification from chronic scratching. Disrupted sleep from nighttime pruritus. Mother has history of eczema and allergic rhinitis. Exam showed erythematous lichenified plaques in flexural areas covering 15% BSA (moderate severity), no signs of infection. Diagnosed with moderate atopic dermatitis. Counseled on liberal emollient use (CeraVe cream) twice daily and after all bathing. Started triamcinolone 0.1% cream to body lesions twice daily and hydrocortisone 2.5% cream to neck twice daily for 2 weeks, then taper. Hydroxyzine 25 mg at bedtime for pruritus. Bleach baths twice weekly. At 2 weeks flare significantly improved, lesions drier and less erythematous, sleep improved. Tapered topical steroids to once daily, continued emollients. At 6 weeks skin clear, stopped topical steroids, continued daily emollients for maintenance. At 6 months rare mild flares controlled with brief topical steroid use, overall excellent control with emollient-based regimen.
