tree_id: ENDO-THYROID_NODULE
name: Thyroid nodule (benign or indeterminate)
family: Endocrinology
specialty: Endocrinology
icd10:
- E04.1
- E04.2
snomed: []
urgency: medium
description: Comprehensive evaluation and management of Thyroid nodule (benign or
  indeterminate)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Palpable neck mass or lump (anterior neck)
- Often discovered incidentally on imaging (CT, MRI, ultrasound)
- Usually asymptomatic
- May have compressive symptoms if large (dysphagia, hoarseness, dyspnea)
- Visible neck swelling
- Thyroid function typically normal (euthyroid)
- May cause hyperthyroidism if autonomous ("hot" nodule)
- Rarely causes hypothyroidism
- More common in women and with age
- Risk factors: Radiation exposure, family history, iodine deficiency
workup:
- TSH (if low, get radioiodine uptake scan)
- Thyroid ultrasound with nodule characteristics (size, echogenicity, calcifications,
  vascularity)
- FNA with cytology if meets size/feature criteria above
- Calcitonin if family history of medullary thyroid cancer or MEN2 (screen for medullary
  CA)
treatment:
- 'Guideline-based treatment options for Thyroid nodule (benign or indeterminate)
  include:'
- Check TSH first - if low, nodule may be autonomously functioning (hot) (ADA 2024)
- 'If TSH normal/high: Ultrasound all nodules ≥1 cm or suspicious features (ADA 2024)'
- 'FNA if: ≥1 cm with suspicious ultrasound features OR ≥1.5 cm with intermediate
  features OR ≥2 cm low suspicion (ADA 2024)'
- Molecular testing (Afirma, ThyroSeq) for indeterminate Bethesda III/IV to avoid
  unnecessary surgery (ADA 2024)
- 'Benign nodules: Repeat ultrasound in 12-24 months to assess stability (ADA 2024)'
clinical_pearls:
- 'Very common: 50-60% of population has nodules on ultrasound, most benign (90-95%)'
- 'Risk factors for malignancy: Age <30 or >60, male, radiation exposure, family history,
  hard/fixed nodule'
- If TSH low, get radioiodine scan - hot nodules (autonomous) are almost never malignant
  (skip FNA)
- 'ATA ultrasound classification: High suspicion features (hypoechoic, microcalcifications,
  taller-than-wide)'
- 'Bethesda cytology categories: I (nondiagnostic), II (benign), III/IV (indeterminate),
  V/VI (suspicious/malignant)'
referrals:
- Endocrinology for initial evaluation and FNA coordination
- 'Thyroid surgery (endocrine surgeon) if: Bethesda V/VI, suspicious growth, compressive
  symptoms'
differentials: []
trace:
  source: American Diabetes Association (ADA) Standards of Care, Endocrine Society
    Clinical Practice Guidelines
