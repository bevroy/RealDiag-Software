nodes:
  - id: retinal_detachment_evaluation
    type: diagnosis
    name: "Retinal Detachment"
    icd10: "H33.2"
    urgency: critical
    workup:
      - Retinal detachment - Separation of neurosensory retina from underlying retinal pigment epithelium (RPE)
      - Types
      - Rhegmatogenous (most common 90%) - Retinal tear/break allows vitreous fluid to accumulate under retina
      - Tractional - Fibrovascular membranes (diabetic retinopathy, sickle cell) pull retina off RPE
      - Exudative - Fluid accumulation under retina without tear (tumors, inflammation, hypertensive retinopathy)
      - Risk factors rhegmatogenous RD - High myopia (most important), lattice degeneration, posterior vitreous detachment (PVD), trauma, prior cataract surgery, family history
      - Clinical presentation - URGENT ophthalmology referral
      - Sudden onset flashes (photopsia) - Vitreous traction on retina
      - Floaters - Vitreous condensation or hemorrhage
      - "Curtain or "shadow" visual field defect - Progresses as detachment enlarges, superior detachment causes inferior field loss"
      - Decreased visual acuity - If macula involved (macula-off RD, worse prognosis)
      - Painless
      - Exam - Dilated fundoscopy (by ophthalmologist), retina appears gray/translucent and elevated, retinal tear visible, relative afferent pupillary defect if extensive
      - Ultrasound - If view obscured (vitreous hemorrhage, cataract), shows detached retina fluttering
    treatment:
      - OPHTHALMIC EMERGENCY - Refer to ophthalmology immediately (same day)
      - Macula-on RD - URGENT surgery within 24 hours (preserve central vision)
      - Macula-off RD - Surgery within days (poorer visual outcome, but still salvageable)
      - Surgical options
      - Pneumatic retinopexy - Gas bubble injected into vitreous, patient positioning (head position so gas tamponades tear), cryopexy or laser to seal tear, 70-80% success single procedure, outpatient, best for superior detachments
      - Scleral buckle - Silicone band encircles eye, indents sclera to relieve vitreous traction, cryopexy/laser seals tear, 85-90% success, myopic shift complication
      - Pars plana vitrectomy (PPV) - Remove vitreous, drain subretinal fluid, endolaser to seal tear, gas or silicone oil tamponade, 85-95% success, best for complex cases (PVR, large tears, inferior detachments)
      - Post-op - Positioning restrictions (face-down if macula detachment or inferior RD), gas bubble reabsorbs 1-8 weeks (no air travel, nitrous oxide anesthesia contraindicated - gas expands causing increased IOP/blindness)
      - Complications - Proliferative vitreoretinopathy (PVR, scar tissue causes redetachment 10%), cataract, glaucoma, recurrent detachment
      - Prognosis - 90% reattachment after 1-2 surgeries, visual recovery depends on macula status (macula-on RD better outcome, macula-off 50-70% regain 20/50 or better if repaired within 1 week)
