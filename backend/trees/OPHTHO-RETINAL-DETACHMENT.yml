urgency: medium
description: Comprehensive evaluation and management of Retinal Detachment
version: '1.0'
citations:
  - Clinical Practice Guidelines from relevant medical specialty societies
  - UpToDate Clinical Reference
  - Evidence-based medical literature
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden onset of floaters
- Flashing lights (photopsia)
- Dark curtain or shadow across visual field
- Painless vision loss
- May follow eye trauma or surgery
- Requires urgent ophthalmology referral
workup:
- 'Dilated fundoscopy: Gray elevated retina, corrugated appearance, retinal tear (horseshoe
  or round hole)'
- 'B-scan ultrasound: If media opacity prevents visualization (cataract, vitreous
  hemorrhage)'
- 'Visual acuity: Decreased, correlates with macular involvement'
- 'Visual field: Defect corresponding to detachment location'
treatment:
- 'Guideline-based treatment options for Retinal Detachment include:'
- Position patient with detached area dependent (if superior detachment, elevate head
  to slow progression) (AAO 2023)
- Urgent surgery within 24-48 hours for macula-on detachment (preserves central vision)
  (AAO 2023)
- 'Pneumatic retinopexy: Gas bubble injected, patient positioning, laser/cryotherapy
  to seal tear - 80% success for small superior tears (AAO 2023)'
- 'Scleral buckle: Silicone band around eye to indent wall toward tear - for young
  patients, large tears (AAO 2023)'
- 'Vitrectomy: Remove vitreous, flatten retina, gas/silicone oil tamponade - for complex
  or large detachments (AAO 2023)'
clinical_pearls:
- Separation of neurosensory retina from retinal pigment epithelium - URGENT, can
  cause permanent vision loss
- 'Rhegmatogenous (most common): Retinal tear allows vitreous fluid under retina -
  high myopia, trauma, post-cataract surgery'
- 'Tractional: Fibrovascular membranes pull retina (diabetic retinopathy, sickle cell)'
- 'Exudative: Fluid accumulates without tear (uveitis, tumors, hypertension)'
- 'Risk factors: High myopia (6-8 diopters), lattice degeneration, prior RD in fellow
  eye (10-15% risk)'
referrals:
- Ophthalmology URGENTLY (same day) - retinal detachment requires surgery within 24-48
  hours
- 'Macula-on detachment: EMERGENT (hours) - every hour counts to preserve central
  vision'
differentials:
  - Posterior vitreous detachment
  - Retinal tear
  - Vitreous hemorrhage
  - Migraine aura
