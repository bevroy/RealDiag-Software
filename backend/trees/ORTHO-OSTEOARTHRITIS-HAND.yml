tree_id: ORTHO-OSTEOARTHRITIS-HAND
name: Osteoarthritis, Hand
family: orthopedics
specialty: Orthopedics
icd10: M19.049
snomed: 201834006
urgency: []
homeopathy: []
presentations:
  - Pain, stiffness, and swelling in finger joints
  - Distal interphalangeal (DIP) joints most commonly affected
  - Proximal interphalangeal (PIP) joints also affected
  - Thumb carpometacarpal (CMC) joint at base of thumb
  - Heberden nodes (bony enlargements at DIP joints)
  - Bouchard nodes (bony enlargements at PIP joints)
  - Morning stiffness <30 minutes (vs RA which is >1 hour)
  - Difficulty with fine motor tasks (buttoning, writing, opening jars)
  - Pain worse with use, improves with rest
  - More common in women, especially postmenopausal
workup:
  - Clinical diagnosis based on characteristic joint involvement and exam findings
  - Physical examination
  - Heberden nodes (DIP joints) - hallmark of hand OA
  - Bouchard nodes (PIP joints)
  - Square appearance of thumb base (CMC joint OA)
  - Tenderness over affected joints
  - Limited range of motion
  - Crepitus with joint movement
  - Positive grind test for CMC OA (axial compression + rotation of thumb)
  - MCP joint involvement rare in primary OA (suggests inflammatory arthritis)
  - Imaging
  - Hand X-rays (PA and oblique views) confirm diagnosis
  - Findings: joint space narrowing, osteophytes, subchondral sclerosis
  - Not always needed if classic clinical presentation
  - Laboratory tests NOT routinely needed (OA is non-inflammatory)
  - Consider RF and anti-CCP if suspicious for rheumatoid arthritis
  - ESR/CRP if inflammatory arthritis suspected
treatment:
  - Non-pharmacologic (first-line)
  - Hand exercises and range of motion
  - Strengthening exercises for intrinsic hand muscles
  - Joint protection techniques
  - Activity modification (avoid repetitive gripping, pinching)
  - Use assistive devices (jar openers, enlarged grip handles)
  - Splinting for CMC joint OA
  - Thumb spica splint for activities or at night
  - Improves pain and function
  - Heat therapy (warm water soaks, paraffin baths) before activities
  - Cold therapy for acute flares
  - Pharmacologic
  - Topical NSAIDs (diclofenac gel) - first-line, minimal systemic absorption
  - Apply TID-QID to affected joints
  - Oral NSAIDs if topical insufficient
  - Ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Use lowest effective dose (GI/CV/renal risks)
  - Acetaminophen 1000 mg TID if NSAIDs contraindicated
  - Intra-articular injections for CMC joint
  - Corticosteroid injections provide temporary relief (3-6 months)
  - Limit to 3-4 per year
  - Surgical management (for severe, refractory cases)
  - CMC joint arthroplasty or fusion
  - PIP joint fusion or arthroplasty (less common)
  - Indications: severe pain, functional limitation, failed conservative treatment
clinical_pearls:
  - "Hand OA most common form of OA - affects 10% of adults >60 years"
  - "DIP joint involvement (Heberden nodes) hallmark of hand OA"
  - "MCP joint sparing in primary OA - if swollen, think inflammatory arthritis (RA)"
  - "CMC joint of thumb (base of thumb) very common - causes 'squared' thumb appearance"
  - "Heberden and Bouchard nodes are bony osteophytes, not inflammatory swelling"
  - "Erosive hand OA subtype: inflammatory component with erosions on X-ray, more aggressive"
  - "Morning stiffness <30 minutes typical (vs RA >1 hour)"
  - "Topical NSAIDs effective and safer than oral for hand OA"
  - "Strong genetic component - often runs in families"
referrals:
  - Hand surgery or orthopedics if severe symptoms or considering surgery
  - Occupational therapy for hand exercises, splinting, joint protection techniques
  - Rheumatology if inflammatory arthritis suspected (MCP involvement, prolonged stiffness)
differentials:
  - Hand osteoarthritis (DIP/PIP joints, Heberden/Bouchard nodes, morning stiffness <30 min)
  - Rheumatoid arthritis (MCP/PIP joints, symmetrical, morning stiffness >1 hour, elevated RF/anti-CCP)
  - Psoriatic arthritis (DIP joint involvement, nail pitting, dactylitis, psoriasis)
  - Erosive osteoarthritis (inflammatory subtype of OA, erosions on X-ray)
  - Gout (acute monoarticular, tophi, elevated uric acid)
  - Calcium pyrophosphate deposition disease (pseudogout)
  - Dupuytren contracture (palmar nodules, finger contracture, no joint pain)
trace:
  source: ACR Guidelines on Osteoarthritis Management 2020, EULAR Hand OA Recommendations
  version: '1.0'
  last_updated: '2025-12-26'
