tree_id: CARDS-CLAUDICATION
name: Claudication (Intermittent Claudication)
family: cardiology
specialty: Cardiology
icd10: I73.9
snomed: 63491006
urgency: moderate
homeopathy: []
presentations:
  - Reproducible leg muscle pain or cramping with walking
  - Pain relieved with rest (typically within 10 minutes)
  - Calf pain most common (femoral/popliteal disease)
  - Thigh/buttock pain with aortoiliac disease
  - Reduced walking distance or exercise tolerance
  - Absent or diminished peripheral pulses
  - Lower extremity pallor with elevation, rubor with dependency
  - Cool extremities
  - Hair loss on affected leg
  - Risk factors - smoking, diabetes, hypertension, hyperlipidemia, age >50
workup:
  - Ankle-brachial index (ABI) at rest (diagnostic test of choice)
  - ABI 0.91-1.40 normal, 0.41-0.90 mild-moderate PAD, <0.40 severe PAD
  - ABI >1.40 suggests non-compressible vessels (calcification in diabetes)
  - Exercise ABI if resting ABI normal but symptoms suggestive
  - Toe-brachial index if ABI >1.40 (falsely elevated)
  - Segmental pressure measurements to localize disease
  - Pulse volume recordings
  - Duplex ultrasound to map arterial lesions
  - CT angiography or MR angiography for surgical planning
  - Conventional angiography if intervention planned
  - Assess cardiovascular risk factors (lipids, HbA1c, creatinine)
  - ECG and consider stress test (high CAD prevalence)
treatment:
  - Cardiovascular risk reduction (critical - prevent MI and stroke)
  - Smoking cessation - most important intervention, slows progression
  - Antiplatelet therapy - aspirin 75-325mg daily or clopidogrel 75mg daily
  - High-intensity statin (atorvastatin 40-80mg) regardless of lipid levels
  - Blood pressure control (ACE inhibitor or ARB preferred)
  - Diabetes management (HbA1c <7%)
  - Supervised exercise therapy (first-line for claudication)
  - 30-45 minutes walking 3x/week for 12 weeks minimum
  - Walk to near-maximal pain, rest, repeat
  - Improves walking distance by 150-200%
  - Cilostazol 100mg BID (phosphodiesterase inhibitor) - improves walking distance
  - Contraindicated in heart failure
  - Revascularization for lifestyle-limiting symptoms despite medical therapy
  - Endovascular therapy (angioplasty ± stenting) for focal lesions
  - Surgical bypass for extensive disease or failed endovascular therapy
  - Foot care - inspect daily, proper footwear, treat wounds promptly
clinical_pearls:
  - Only 25% of PAD patients have claudication; many are asymptomatic or atypical
  - Annual cardiovascular event rate 5-7% (MI, stroke, or cardiovascular death)
  - Critical limb ischemia develops in <5% over 5 years with optimal medical therapy
  - Natural history - 70-80% stable, 10-20% worsen, 5-10% require intervention
  - Claudication distance should be reproducible (same distance each time)
  - Rest pain, non-healing ulcers, or gangrene indicate critical limb ischemia (urgent)
  - Pentoxifylline has minimal benefit compared to cilostazol
  - Screen all PAD patients for AAA (15% prevalence)
  - 50-70% have concomitant coronary artery disease
  - Routine revascularization not indicated for asymptomatic PAD
referrals:
  - Vascular surgery for lifestyle-limiting symptoms despite 3-6 months medical therapy
  - Interventional radiology for endovascular therapy consideration
  - Cardiology for cardiovascular risk management and CAD evaluation
  - Wound care specialist if non-healing ulcers
  - Supervised exercise therapy program
differentials:
  - Peripheral artery disease (atherosclerotic)
  - Neurogenic claudication (spinal stenosis) - pain with standing, relieved by sitting/flexion
  - Chronic compartment syndrome (young athletes, both legs)
  - Venous claudication (worse with standing, better with leg elevation)
  - McArdle disease (muscle phosphorylase deficiency)
  - Popliteal artery entrapment syndrome (young athletes)
  - Musculoskeletal pain (arthritis, muscle strain)
