tree_id: RHEUM-GCA
name: Giant Cell Arteritis
family: Rheumatology
specialty: Rheumatology
icd10:
- M31.6
- M31.5
snomed:
- '400130008'
urgency: medium
description: Comprehensive evaluation and management of Giant Cell Arteritis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- New headache
- Temporal artery tenderness
- Jaw claudication
- Vision changes (amaurosis fugax)
- Elevated ESR/CRP
- Age > 50 years
workup:
- 'ESR: Typically >50 mm/hr, often >100 (very high ESR suggests GCA)'
- 'CRP: Elevated, often very high'
- 'Temporal artery biopsy (3-5 cm segment): Giant cells, intimal thickening, skip
  lesions - 80% sensitive (false negatives due to skip lesions)'
- Biopsy both sides if first negative and high suspicion (skip lesions can cause false
  negatives)
- 'CTA or MRA head/neck: If biopsy negative but high suspicion - shows vessel wall
  thickening, stenosis'
treatment:
- 'Guideline-based treatment options for Giant Cell Arteritis include:'
- Start prednisone 1mg/kg (60mg) IMMEDIATELY if high clinical suspicion - do NOT wait
  for biopsy (vision loss is emergency) (ACR 2023)
- 'Temporal artery biopsy within 2 weeks: Confirms diagnosis (giant cells, skip lesions).
  Steroids don''t affect biopsy results for 2 weeks (ACR 2023)'
- 'Initial steroids: Prednisone 60mg daily x4 weeks, if vision loss give methylprednisolone
  1g IV daily x3 days first (ACR 2023)'
- 'Slow taper: After 4 weeks, taper by 10mg every 2 weeks to 20mg, then 2.5mg every
  2-4 weeks to 10mg, then 1mg every 4-8 weeks. Total duration 1-2 years (ACR 2023)'
- 'Monitor ESR/CRP: Check monthly during taper - if rising, increase prednisone. Add
  methotrexate 15-25mg weekly or tocilizumab if steroid-dependent (ACR 2023)'
clinical_pearls:
- Large vessel vasculitis - age >50 years (average 70), MEDICAL EMERGENCY due to risk
  of irreversible blindness
- 'Anterior ischemic optic neuropathy (AION): 15-20% develop vision loss, often sudden
  and permanent if untreated'
- 'Jaw claudication: Most specific symptom (95% specific for GCA) - pain with chewing,
  relieved by rest'
- 'Temporal artery: Tender, thickened, non-pulsatile, nodular - but normal exam doesn''t
  rule out GCA'
- 'Association with PMR: 50% of GCA have PMR symptoms'
referrals:
- Rheumatology urgently - same day if vision symptoms
- Ophthalmology urgently if any vision changes
- Vascular surgery for temporal artery biopsy within 2 weeks
differentials: []
