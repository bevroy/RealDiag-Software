tree_id: NEURO-SEIZURE-DISORDER
name: Seizure Disorder (Epilepsy)
family: Neurologic
specialty: Neurology
chief_complaint: Seizures
description: Chronic neurologic disorder characterized by recurrent unprovoked seizures from abnormal excessive neuronal discharges

icd10: G40.909

urgency: urgent

workup:
  - Definition: epilepsy diagnosed after 2 or more unprovoked seizures greater than 24 hours apart, or 1 unprovoked seizure with high recurrence risk (greater than 60 percent over 10 years)
  - Seizure classification: focal onset (aware or impaired awareness, motor or non-motor), generalized onset (tonic-clonic, absence, myoclonic, atonic), unknown onset
  - Detailed history: seizure semiology (aura, motor movements, awareness, automatisms, postictal confusion/Todd paralysis), duration, triggers, prior seizures, family history, birth/developmental history
  - Exclude provoking factors for first seizure: acute symptomatic seizures (hypoglycemia, hyponatremia, hypocalcemia, drug/alcohol withdrawal, CNS infection, stroke, trauma, medications lowering seizure threshold) do not diagnose as epilepsy
  - Laboratory: glucose, electrolytes (sodium, calcium, magnesium), CBC, toxicology screen, anticonvulsant levels if on medications
  - EEG: interictal epileptiform discharges (spikes, sharp waves) support diagnosis, focal slowing suggests structural lesion, generalized spike-wave (absence epilepsy), may be normal in 50 percent after single seizure
  - MRI brain with epilepsy protocol: identify structural cause (hippocampal sclerosis, cortical dysplasia, tumor, vascular malformation, prior stroke, mesial temporal sclerosis), essential in adults with new-onset focal epilepsy
  - Video-EEG monitoring if diagnostic uncertainty or pre-surgical evaluation (captures ictal events)

treatment:
  - Antiseizure medications (ASMs) after 2 unprovoked seizures or 1 seizure with high recurrence risk
  - First seizure management: defer ASM if normal MRI/EEG, no risk factors, discuss with patient (recurrence risk 40-50 percent after first unprovoked seizure), start ASM if abnormal imaging, epileptiform EEG, focal seizure, or patient preference
  - Focal epilepsy first-line ASMs: levetiracetam 500-1500 mg BID (well-tolerated, no drug interactions, can cause irritability), lamotrigine 25-200 mg BID (titrate slowly to avoid rash), carbamazepine 200-400 mg BID (enzyme inducer, drug interactions), oxcarbazepine 300-1200 mg BID
  - Generalized epilepsy first-line: valproate 250-1000 mg BID (broad-spectrum, effective for all generalized seizure types, avoid in women of childbearing age - teratogenic), levetiracetam, lamotrigine
  - Absence epilepsy: ethosuximide 250-750 mg BID (first-line), valproate, lamotrigine
  - Start single agent (monotherapy), titrate to seizure control or side effects, if inadequate try alternative monotherapy before polytherapy
  - Drug-resistant epilepsy: failure of 2 adequate trials of ASMs, consider polytherapy (combination), epilepsy surgery evaluation (best outcomes if mesial temporal lobe epilepsy with hippocampal sclerosis, 60-80 percent seizure-free after temporal lobectomy), vagus nerve stimulation (VNS), responsive neurostimulation (RNS)
  - Status epilepticus (seizure greater than 5 minutes or recurrent without recovery): medical emergency, benzodiazepines first-line (lorazepam 4 mg IV or diazepam 10 mg IV), if continues load fosphenytoin 20 mg PE/kg IV or levetiracetam 60 mg/kg IV or valproate 40 mg/kg IV, refractory status requires intubation and anesthetic agents (propofol, midazolam, pentobarbital)
  - Seizure precautions: avoid driving until seizure-free (state laws vary, typically 3-12 months), avoid swimming alone, no heights/ladders, shower instead of bath
  - Women of childbearing age: high-dose folic acid 1-4 mg daily (reduce neural tube defects), avoid valproate (highly teratogenic), lamotrigine or levetiracetam preferred in pregnancy
  - Withdrawal ASM after seizure-free: consider after 2-5 years seizure-free, normal EEG, single seizure type, taper slowly over months (recurrence risk 25-50 percent)

clinical_pearls:
  - Epilepsy diagnosed after 2 unprovoked seizures greater than 24 hours apart or 1 seizure with high recurrence risk
  - Exclude acute symptomatic seizures (provoked) - do not diagnose epilepsy
  - EEG may be normal after seizure (50 percent) - does not exclude epilepsy
  - MRI brain essential in adults with new-onset focal epilepsy
  - Levetiracetam and lamotrigine first-line for focal epilepsy (well-tolerated, no drug interactions)
  - Valproate broad-spectrum for generalized epilepsy but avoid in women (teratogenic)
  - Drug-resistant epilepsy (failure 2 ASMs) - refer for surgery evaluation
  - Status epilepticus (seizure greater than 5 minutes) - benzodiazepines immediately

differentials:
  - Syncope (brief loss of consciousness, pallor, rapid recovery, no postictal confusion, upright position, may have brief myoclonic jerks)
  - Psychogenic nonnonepileptic seizures (PNES) (prolonged episodes, eyes closed, side-to-side head movements, no postictal confusion, normal EEG during event)
  - Acute symptomatic seizure (provoked by metabolic derangement, alcohol/drug withdrawal, stroke, infection, trauma - treat underlying cause)
  - Migraine with aura (visual symptoms develop over minutes, headache follows, no loss of awareness)

trace:
  - 28-year-old man brought to ED by friends after witnessed generalized tonic-clonic seizure at work, lasted 2 minutes, postictal confusion 20 minutes, no prior seizures, no recent illness/trauma/drugs
  - History: no preceding aura, sudden loss of consciousness, whole-body stiffening (tonic phase) then rhythmic jerking all extremities (clonic phase), eyes rolled back, tongue biting, urinary incontinence, postictal somnolence and confusion
  - Exam (postictal): drowsy but arousable, tongue laceration, normal neurologic exam when fully awake
  - Labs: glucose 112 mg/dL (normal), sodium 139 mEq/L, calcium 9.2 mg/dL, magnesium 2.1 mEq/L (all normal), toxicology screen negative including alcohol
  - Head CT noncontrast: normal (exclude hemorrhage/acute lesion)
  - EEG: normal awake and sleep, no epileptiform discharges (does not exclude epilepsy)
  - MRI brain with epilepsy protocol: normal (no structural lesion)
  - Diagnosis: first unprovoked generalized tonic-clonic seizure
  - Counseling: recurrence risk 40-50 percent after first unprovoked seizure, options defer ASM vs start treatment
  - Patient prefers to start ASM given witnessed seizure at work and concern about driving
  - Started levetiracetam 500 mg BID (titrate to 1000 mg BID over 1 week)
  - Seizure precautions: no driving for 6 months seizure-free (state law), avoid swimming alone, no heights
  - 3 months: no further seizures, tolerating levetiracetam well, no side effects
  - 6 months: remains seizure-free, cleared to drive
  - 2 years: seizure-free on levetiracetam 1000 mg BID, repeat EEG normal, discussed continuing ASM vs trial off medication
  - Patient elects to continue given good tolerance and preference for seizure prevention
