tree_id: NEURO-SEIZURE-DISORDER
name: Seizure Disorder (Epilepsy)
family: Neurology
specialty: Neurology
chief_complaint: Episodes of altered consciousness or convulsions
description: |
  Recurrent unprovoked seizures from abnormal neuronal activity. Epilepsy diagnosed after 2 or more unprovoked seizures.
  Affects 1% of population. Focal seizures (60%) originate in one brain region, generalized seizures (40%) involve both hemispheres from onset.
icd10: G40.909
urgency: Moderate
workup:
  - Detailed seizure history - onset, duration, aura, postictal state, triggers, prior seizures
  - Classify seizure type - focal aware, focal impaired awareness, focal to bilateral tonic-clonic, generalized (absence, tonic-clonic, myoclonic, atonic)
  - MRI brain with epilepsy protocol (detects structural lesions - tumor, stroke, mesial temporal sclerosis, cortical dysplasia)
  - EEG captures interictal epileptiform discharges (spikes, sharp waves) - supports diagnosis, helps classify epilepsy syndrome
  - Labs - glucose, electrolytes, calcium, magnesium, toxicology screen (rule out provoking factors)
  - Lumbar puncture if concern for CNS infection
  - Video EEG monitoring if diagnosis uncertain or presurgical evaluation
treatment:
  - Antiepileptic drugs (AEDs) initiated after first unprovoked seizure if high recurrence risk or after second seizure
  - Focal seizures first-line - levetiracetam 500-1500mg BID, lamotrigine 100-200mg BID, carbamazepine 200-400mg BID
  - Generalized tonic-clonic seizures - valproate 500-1500mg BID, levetiracetam, lamotrigine
  - Absence seizures - ethosuximide 250mg BID-TID or valproate
  - Start low dose, titrate slowly to effective dose or seizure freedom
  - Goal is seizure freedom with minimal side effects
  - Drug-resistant epilepsy defined as failure of 2 appropriate AEDs - refer for epilepsy surgery evaluation
  - Vagus nerve stimulation (VNS) or responsive neurostimulation (RNS) if not surgical candidate
  - Ketogenic diet for refractory pediatric epilepsy
  - Avoid seizure triggers - sleep deprivation, alcohol, flashing lights (photosensitive epilepsy)
clinical_pearls:
  - Status epilepticus is seizure lasting greater than 5 minutes or recurrent seizures without return to baseline (medical emergency, treat with benzodiazepines)
  - Provoked seizures (from acute illness, toxins, withdrawal) do not constitute epilepsy
  - Postictal state (confusion, drowsiness, Todd's paralysis) helps distinguish from syncope or pseudoseizure
  - Common AED side effects - levetiracetam (mood changes), lamotrigine (rash, Stevens-Johnson syndrome), carbamazepine (hyponatremia, aplastic anemia), valproate (weight gain, tremor, hepatotoxicity)
  - Women of childbearing age avoid valproate (teratogenic, neural tube defects)
  - Driving restrictions vary by state (typically 3-12 months seizure-free required)
differentials:
  - Syncope
  - Psychogenic non-epileptic seizures (pseudoseizures)
  - Transient ischemic attack
  - Migraine with aura
  - Movement disorders
  - Cardiac arrhythmia
trace:
  - Two episodes of loss of consciousness with tonic-clonic movements in past 6 months, postictal confusion → MRI brain shows mesial temporal sclerosis → EEG shows left temporal sharp waves → Diagnose focal epilepsy (temporal lobe origin) with focal to bilateral tonic-clonic seizures → Start levetiracetam 500mg BID, increase to 1000mg BID → Seizure-free for 6 months → Continue AED, counsel about driving restrictions, avoid triggers → Annual neurology follow-up
