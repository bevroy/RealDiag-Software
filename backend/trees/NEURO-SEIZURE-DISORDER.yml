tree_id: NEURO-SEIZURE-DISORDER
name: Seizure Disorder (Epilepsy)
family: Neurology
specialty: Neurology
chief_complaint: Convulsions and loss of consciousness
description: |
  Recurrent unprovoked seizures due to abnormal excessive neuronal activity. Epilepsy diagnosed after two unprovoked seizures or one seizure with high recurrence risk.
  Affects 1% of population. Seizures classified as focal (partial) or generalized. Causes include genetic, structural (stroke, tumor, trauma), infectious, metabolic, immune, unknown.
icd10: G40.909
urgency: High
workup:
  - Detailed seizure history - type of movements, duration, consciousness, aura, post-ictal state, triggers
  - Witness description critical - patient often amnestic for event
  - Focal seizures - involve one brain region, may have preserved awareness (simple partial) or impaired awareness (complex partial)
  - Aura common (déjà vu, rising epigastric sensation, fear, olfactory hallucination)
  - Focal motor (Jacksonian march), focal sensory, focal autonomic, focal to bilateral tonic-clonic
  - Generalized seizures - involve both hemispheres from onset, loss of consciousness
  - Tonic-clonic (grand mal) - tonic stiffening then clonic jerking, tongue biting, incontinence, post-ictal confusion
  - Absence (petit mal) - brief (3-10 sec) staring spells, no post-ictal state, childhood onset
  - Myoclonic - brief muscle jerks, often morning (juvenile myoclonic epilepsy)
  - Atonic (drop attacks) - sudden loss of tone, falls
  - Physical exam - assess for focal neurologic deficits, signs of head trauma, skin lesions (neurocutaneous syndromes)
  - Labs - glucose (hypoglycemia), electrolytes (hyponatremia, hypocalcemia, hypomagnesemia), toxicology screen
  - Lumbar puncture if fever, meningismus, immunocompromised (meningitis, encephalitis)
  - EEG (electroencephalogram) - captures interictal or ictal epileptiform activity
  - Generalized spike-wave 3 Hz (absence), focal sharp waves (focal epilepsy)
  - May need prolonged video-EEG monitoring to capture events
  - MRI brain with and without contrast - identify structural causes (tumor, vascular malformation, mesial temporal sclerosis, cortical dysplasia)
  - CT head emergently if first seizure, concern for bleed, trauma, mass effect
  - Routine EEG and MRI may be normal in epilepsy (clinical diagnosis)
treatment:
  - First unprovoked seizure - risk of recurrence 40-50% over 2 years
  - Start antiepileptic drug (AED) if structural lesion, abnormal EEG, nocturnal seizure, status epilepticus, or patient preference
  - Otherwise can observe (driving restrictions apply)
  - Epilepsy (recurrent seizures) - AED to prevent further seizures
  - Focal seizures - levetiracetam 500-1500mg BID (first-line, well-tolerated, no drug interactions)
  - Lamotrigine 25-200mg BID (titrate slowly to prevent rash - start 25mg daily x 2 weeks)
  - Carbamazepine 200-400mg BID (effective but drug interactions, hyponatremia)
  - Oxcarbazepine 300-600mg BID (fewer interactions than carbamazepine)
  - Generalized tonic-clonic - valproate 250-750mg BID (very effective but teratogenic, weight gain, tremor, hair loss)
  - Levetiracetam, lamotrigine alternatives
  - Absence seizures - ethosuximide 250mg BID-TID (first-line for pure absence) or valproate
  - Juvenile myoclonic epilepsy - valproate first-line, levetiracetam or lamotrigine alternatives
  - Avoid carbamazepine, oxcarbazepine, phenytoin (can worsen myoclonic and absence seizures)
  - Women of childbearing potential - avoid valproate (highly teratogenic), use lamotrigine or levetiracetam
  - Folic acid 1-4mg daily if planning pregnancy
  - Monotherapy preferred, use lowest effective dose
  - If first AED fails, try alternative monotherapy
  - If two AED monotherapies fail, consider combination therapy (rational polytherapy)
  - Refractory epilepsy (seizures persist despite two adequate AED trials) - consider epilepsy surgery evaluation
  - Temporal lobectomy for mesial temporal sclerosis - 60-80% seizure-free
  - Lesionectomy for focal lesion
  - Corpus callosotomy for drop attacks
  - Vagal nerve stimulation (VNS) or responsive neurostimulation (RNS) if not surgical candidate
  - Ketogenic diet for refractory epilepsy (especially children)
  - Status epilepticus (seizure greater than 5 minutes or recurrent without return to baseline) - medical emergency
  - Benzodiazepines first-line - lorazepam 0.1 mg/kg IV (4mg) or diazepam 0.15 mg/kg IV
  - Second-line - fosphenytoin 20 mg PE/kg IV or levetiracetam 60 mg/kg IV
  - Third-line - anesthesia with propofol, midazolam, or pentobarbital
  - Lifestyle - adequate sleep, avoid alcohol, medication adherence, identify and avoid triggers
  - Driving restrictions - varies by state, typically seizure-free 3-12 months required
clinical_pearls:
  - Tongue biting (lateral tongue) and post-ictal confusion highly specific for generalized tonic-clonic seizure
  - Todd paralysis - transient focal weakness after focal seizure (resolves within 48 hours)
  - Prolactin elevated 10-20 minutes after generalized tonic-clonic (not focal) - helps distinguish from pseudoseizure
  - Juvenile myoclonic epilepsy - morning myoclonic jerks, photosensitivity, lifelong treatment usually needed
  - Febrile seizures (children 6 months-5 years) - usually benign, not epilepsy
  - Psychogenic non-epileptic seizures (PNES) - 20% of refractory epilepsy, video-EEG shows no epileptiform activity
  - AED withdrawal after 2-5 years seizure-free - 60-70% remain seizure-free, discuss risks/benefits
differentials:
  - Syncope
  - Psychogenic non-epileptic seizure
  - Transient ischemic attack
  - Migraine with aura
  - Movement disorder
  - Hypoglycemia
trace:
  - 26-year-old woman with two episodes of loss of consciousness with convulsions in past 6 months → Witness describes tonic-clonic movements lasting 2 minutes, tongue biting, incontinence, post-ictal confusion x 20 minutes → No fever, trauma, or substance use → Second episode occurred while sleeping → Exam normal between events → Labs including glucose, electrolytes normal → MRI brain normal → EEG shows left temporal sharp waves → Diagnose focal epilepsy with focal to bilateral tonic-clonic seizures → High recurrence risk, recommend AED → Start levetiracetam 500mg BID → Educate on driving restrictions, safety precautions → Increase to 750mg BID at 2 weeks → No further seizures at 3-month follow-up → Continues levetiracetam, remains seizure-free x 1 year → Cleared to drive after state-mandated seizure-free period
