tree_id: GI-CHRONIC-PANCREATITIS
name: Chronic Pancreatitis
family: gastroenterology
specialty: Gastroenterology

presentations:
  - Chronic or recurrent epigastric abdominal pain
  - Pain radiating to the back
  - Postprandial pain (worse after eating, especially fatty foods)
  - Weight loss and malnutrition
  - Steatorrhea (fatty, greasy, foul-smelling stools)
  - Nausea and vomiting
  - New-onset diabetes mellitus (pancreatic diabetes)
  - Jaundice (if bile duct obstruction)
  - History of alcohol abuse or recurrent acute pancreatitis

workup:
  - History:
    - Alcohol consumption history (most common cause)
    - History of acute pancreatitis episodes
    - Family history of pancreatitis or cystic fibrosis
    - Smoking history
    - Autoimmune conditions
    - Hyperlipidemia or hypercalcemia
  - Physical exam:
    - Epigastric tenderness
    - Jaundice (scleral icterus)
    - Signs of malnutrition or cachexia
    - Epigastric mass (if pseudocyst present)
  - Laboratory studies:
    - Lipase and amylase (may be normal or mildly elevated in chronic disease)
    - Fecal elastase (low in pancreatic insufficiency)
    - Hemoglobin A1c and fasting glucose (screen for diabetes)
    - Liver function tests (AST, ALT, alkaline phosphatase, bilirubin)
    - Lipid panel (hypertriglyceridemia)
    - Serum calcium
    - IgG4 level (if autoimmune pancreatitis suspected)
    - Vitamin A, D, E, K levels (fat-soluble vitamin deficiency)
  - Imaging studies:
    - CT abdomen with IV contrast (pancreatic calcifications, atrophy, ductal dilation)
    - Abdominal ultrasound (initial assessment)
    - MRCP (magnetic resonance cholangiopancreatography) for ductal anatomy
    - Endoscopic ultrasound (EUS) - most sensitive for early chronic pancreatitis
    - ERCP (endoscopic retrograde cholangiopancreatography) for therapeutic intervention

treatment:
  pain_management:
    - Acetaminophen or NSAIDs for mild pain
    - Tramadol or opioids for moderate to severe pain (use cautiously, risk of dependence)
    - Pregabalin or gabapentin for neuropathic pain component
    - Celiac plexus block for refractory pain
  pancreatic_enzyme_replacement:
    - Pancrelipase (Creon, Zenpep, Pancreaze) 25,000-75,000 units lipase with meals
    - Proton pump inhibitor (omeprazole, pantoprazole) to enhance enzyme efficacy
    - Take enzymes with all meals and snacks
  nutritional_support:
    - Low-fat diet (limit to 20-30g fat per day initially)
    - Small frequent meals
    - Fat-soluble vitamin supplementation (A, D, E, K)
    - Medium-chain triglyceride (MCT) oil for calories
    - Nutritionist referral
  diabetes_management:
    - Insulin therapy (often required for pancreatic diabetes)
    - Careful glucose monitoring (risk of hypoglycemia)
    - Endocrinology referral
  lifestyle_modifications:
    - Absolute alcohol cessation
    - Smoking cessation (slows disease progression)
    - Substance abuse treatment referral if needed
  surgical_interventions:
    - ERCP with pancreatic duct stenting or stone removal
    - Lateral pancreaticojejunostomy (Puestow procedure) for dilated duct
    - Pancreatic head resection (Whipple or Beger procedure)
    - Total pancreatectomy with islet autotransplantation (severe cases)

clinical_pearls:
  - Chronic pancreatitis is irreversible progressive inflammatory disease of the pancreas
  - Most common cause is chronic alcohol abuse (70-80% of cases in Western countries)
  - Triad of chronic pancreatitis is pain, malabsorption, and diabetes
  - Pancreatic calcifications on CT are pathognomonic but only present in 30-40% of cases
  - EUS is most sensitive imaging modality for early chronic pancreatitis
  - Fecal elastase <200 mcg/g indicates pancreatic exocrine insufficiency
  - Pancreatic enzyme replacement therapy should provide at least 25,000-40,000 units of lipase per meal
  - Pancreatic diabetes (type 3c) has high risk of hypoglycemia due to loss of both insulin and glucagon
  - Increased risk of pancreatic cancer (cumulative risk 4% at 20 years)
  - Autoimmune pancreatitis (IgG4-related) responds to corticosteroid therapy
  - Weight loss despite adequate caloric intake suggests pancreatic insufficiency
  - Pain may decrease over time as pancreas "burns out" but exocrine and endocrine insufficiency worsen

trace:
  - Diagnostic criteria for chronic pancreatitis
  - Pancreatic enzyme replacement dosing and efficacy
  - Surgical management options for chronic pancreatitis
  - Autoimmune pancreatitis vs alcoholic chronic pancreatitis

citations:
  - Whitcomb DC, et al. (2016). Chronic pancreatitis: An international draft consensus proposal for a new mechanistic definition. Pancreatology, 16(2), 218-224.
  - Gardner TB, et al. (2020). ACG Clinical Guideline: Chronic Pancreatitis. Am J Gastroenterol, 115(3), 322-339.
  - Forsmark CE. (2016). Management of chronic pancreatitis. Gastroenterology, 151(3), 421-433.
