tree_id: ORTHO-OSTEOARTHRITIS-KNEE
name: Knee Osteoarthritis
family: Orthopedics
specialty: Orthopedics
chief_complaint: Knee pain
description: Degenerative joint disease of knee from progressive cartilage loss causing pain, stiffness, and functional limitation

icd10: M17.9
snomed: 239873007
presentations:
  - Knee pain worse with activity, better with rest
  - Morning stiffness <30 minutes
  - Crepitus with movement
  - Bony enlargement, effusion
  - Varus or valgus deformity
  - Reduced range of motion

urgency: routine

referrals:
  emergency:
    - Open fracture
    - Compartment syndrome
    - Neurovascular injury
  urgent:
    - Closed fracture
    - Joint dislocation
    - Septic arthritis
  routine:
    - Chronic joint pain
    - Osteoarthritis
    - Sports injury

workup:
  - Clinical presentation: gradual onset knee pain (months to years), worse with activity (walking, stairs, standing), improved with rest, morning stiffness less than 30 minutes (versus rheumatoid arthritis greater than 1 hour), end-of-day pain, gelling (stiffness after sitting), reduced range of motion, functional limitation
  - Risk factors: age (older than 50), obesity (mechanical stress), prior knee injury (meniscal tear, ACL tear), family history, female sex, repetitive stress (occupational, sports)
  - Exam: bony enlargement (osteophytes), crepitus with motion, tenderness over joint line, effusion (may be present), reduced range of motion (flexion contracture, limited extension), varus or valgus deformity, antalgic gait
  - Radiographs knee (standing AP, lateral, sunrise): joint space narrowing (hallmark), osteophytes (bone spurs), subchondral sclerosis (increased bone density), subchondral cysts, normal X-rays do NOT exclude OA (symptoms may precede radiographic changes)
  - Kellgren-Lawrence grading: Grade 0 (normal), Grade 1 (doubtful osteophytes), Grade 2 (definite osteophytes, possible joint space narrowing), Grade 3 (moderate joint space narrowing, multiple osteophytes), Grade 4 (severe joint space narrowing, large osteophytes, bone-on-bone)
  - Laboratory: not routinely needed (OA is non-inflammatory), consider if atypical presentation to exclude inflammatory arthritis (ESR/CRP normal in OA, RF/anti-CCP negative)
  - Arthrocentesis if effusion: synovial fluid non-inflammatory (WBC less than 2000 cells/microL, clear/yellow), exclude septic arthritis or crystalline arthropathy if acute

treatment:
  - Non-pharmacologic first-line (all patients): weight loss if overweight (5-10 percent weight loss significantly improves pain), physical therapy (quadriceps strengthening, range of motion exercises), low-impact aerobic exercise (swimming, cycling, walking), assistive devices (cane in contralateral hand, walker, knee brace if instability), heat or ice for symptom relief
  - Pharmacologic therapy: acetaminophen 650-1000 mg TID-QID first-line (safe, well-tolerated, max 3 grams daily), NSAIDs if inadequate response (ibuprofen 400-800 mg TID, naproxen 500 mg BID) - more effective than acetaminophen but GI/cardiovascular/renal risks, use lowest effective dose shortest duration
  - Topical NSAIDs: diclofenac gel 1 percent apply to knee QID (effective for superficial joints, less systemic absorption than oral NSAIDs, preferred in elderly or renal insufficiency)
  - Tramadol 50-100 mg every 4-6 hours PRN if NSAIDs contraindicated or ineffective (opioid-like, less addiction potential than pure opioids, side effects nausea, constipation, dizziness)
  - Avoid chronic opioids (risk dependence, minimal benefit for chronic pain, reserved for severe refractory pain)
  - Intra-articular corticosteroid injections: triamcinolone 40 mg or methylprednisolone 40-80 mg, effective for flares or moderate-severe pain, symptom relief 4-12 weeks, limit to 3-4 injections per year (cartilage damage with frequent injections)
  - Hyaluronic acid injections (viscosupplementation): controversial efficacy (not superior to placebo in many trials), not recommended by ACR guidelines, may provide modest benefit in select patients, series of 3-5 weekly injections
  - Glucosamine/chondroitin supplements: not recommended (no proven efficacy in high-quality trials), but low risk if patient wishes to try
  - Surgical options if conservative management fails: arthroscopic debridement NOT effective for OA (no better than sham surgery), osteotomy (realign mechanical axis) in younger patients with unicompartmental OA, total knee arthroplasty (TKA) definitive treatment for severe OA (excellent outcomes, 90 percent 10-year implant survival, consider when pain/disability significantly impacts quality of life despite maximal medical management)

clinical_pearls:
  - Most common joint disease, affects 10 percent of men and 13 percent of women over 60
  - Activity-related pain that improves with rest (versus inflammatory arthritis worse with rest)
  - Morning stiffness less than 30 minutes (versus RA greater than 1 hour)
  - Weight loss 5-10 percent significantly improves pain
  - Radiographic findings may not correlate with symptoms (severe X-ray changes with minimal pain or vice versa)
  - Acetaminophen first-line pharmacologic, NSAIDs more effective but risks
  - Intra-articular steroid injections effective for flares (symptom relief 4-12 weeks)
  - Total knee arthroplasty excellent outcomes for severe OA refractory to conservative management

differentials:
  - Meniscal tear (acute onset after twisting injury, mechanical symptoms locking/catching, positive McMurray test, MRI diagnostic)
  - Rheumatoid arthritis (symmetric polyarthritis, morning stiffness greater than 1 hour, elevated RF/anti-CCP, inflammatory on labs)
  - Septic arthritis (acute onset, fever, joint effusion, synovial fluid WBC greater than 50,000, positive Gram stain/culture)
  - Gout or pseudogout (acute onset, severe pain, synovial fluid crystals, gout urate crystals, pseudogout calcium pyrophosphate)

trace:
  - 64-year-old obese woman (BMI 36) presents with 3 years progressive right knee pain, worse with walking and stairs, improved with rest, morning stiffness 15 minutes, no swelling or warmth, denies trauma
  - History: worked as nurse x 30 years (prolonged standing/walking), tried OTC ibuprofen with some relief
  - Exam: BMI 36, antalgic gait favoring right, right knee bony enlargement medial joint line, crepitus with flexion/extension, tenderness medial joint line, varus deformity (bow-legged), range of motion flexion 110 degrees (limited, normal 135), extension lacks 5 degrees (mild flexion contracture), no effusion, stable ligaments
  - Radiographs right knee standing AP and lateral: medial joint space narrowing (Grade 3 Kellgren-Lawrence), osteophytes medial femoral condyle and tibial plateau, subchondral sclerosis
  - Diagnosis: right knee osteoarthritis, moderate-severe, medial compartment
  - Counseling: degenerative condition, progressive, no cure but effective symptom management
  - Non-pharmacologic therapy: weight loss goal 10 percent (current 220 pounds, goal 198), referred to physical therapy (quadriceps strengthening, range of motion exercises, gait training), low-impact exercise (swimming, stationary bike), cane in left hand for ambulation
  - Pharmacologic: started acetaminophen 1000 mg TID scheduled (better than PRN for chronic pain), topical diclofenac gel 1 percent apply to knee QID (preferred over oral NSAIDs given age and obesity)
  - 6 weeks: weight loss 8 pounds, attending PT twice weekly, improved quadriceps strength, pain improved 30 percent but still limiting activities, continues acetaminophen and topical diclofenac
  - Offered intra-articular corticosteroid injection given persistent moderate-severe pain
  - Performed intra-articular injection right knee triamcinolone 40 mg with lidocaine
  - 2 weeks post-injection: significant pain relief (70 percent improved), able to walk without cane, continues weight loss and PT
  - 3 months: weight loss 15 pounds total, excellent improvement in pain and function with weight loss, PT, and steroid injection wearing off but still better than baseline
  - 6 months: weight loss 22 pounds (10 percent achieved), pain well-controlled with acetaminophen and topical diclofenac, excellent functional improvement, no longer using cane, able to walk 30 minutes daily, satisfied with conservative management
  - 1 year: maintains weight loss and exercise program, occasional flares treated with repeat steroid injections (total 2 injections over year), continues conservative management, not currently candidate for surgery given good symptom control
