tree_id: PULM-LUNG-NODULE
name: Lung Nodule (Incidental Finding)
family: pulmonology
specialty: Pulmonology
icd10: R91.8
snomed: 247439007
urgency: moderate
homeopathy: []
presentations:
  - Incidental finding on chest imaging (CT, CXR)
  - Usually asymptomatic
  - Single pulmonary nodule (solitary pulmonary nodule, SPN) or multiple nodules
  - Round or oval opacity <3 cm diameter (>3 cm = mass, higher malignancy risk)
  - Surrounded by normal lung parenchyma
  - No associated lymphadenopathy or effusion
  - Patient may have risk factors for malignancy - smoking, age >65, prior cancer
workup:
  - Determine nodule characteristics and malignancy risk
  - Size - larger nodules higher risk (>8mm significant risk)
  - Morphology - spiculated/irregular edges higher risk, smooth/well-defined lower risk
  - Density - solid (higher risk), part-solid (intermediate), ground-glass (lower risk but still concerning)
  - Growth rate - doubling time <1 month (infection) or >2 years (benign)
  - Calcification pattern - central, laminated, popcorn (benign); eccentric, stippled (malignant)
  - Compare with prior imaging if available (stability >2 years suggests benign)
  - Assess patient risk factors
  - Smoking history (pack-years)
  - Age (>65 higher risk)
  - Family history of lung cancer
  - Occupational exposures (asbestos, radon)
  - Prior malignancy (especially lung, breast, colon, kidney)
  - Use validated risk calculator - Brock model, Mayo Clinic model
  - Further imaging
  - High-resolution CT chest with contrast
  - PET-CT for nodules >8mm with intermediate-high malignancy probability
  - SUV >2.5 suggests malignancy (sensitivity 90%, specificity 75%)
  - False positives - infection, inflammation, sarcoidosis
  - False negatives - carcinoid, adenocarcinoma in situ (lepidic), small nodules
  - Tissue diagnosis if high risk or growing
  - CT-guided transthoracic needle biopsy (good for peripheral lesions)
  - Bronchoscopy with transbronchial biopsy or EBUS (for central lesions)
  - Video-assisted thoracoscopic surgery (VATS) wedge resection (diagnostic and therapeutic)
treatment:
  - Management based on nodule size, risk, and characteristics (Fleischner Society Guidelines)
  - Low-risk patient (less than 5% malignancy probability)
  - Less than 6mm - no routine follow-up (or optional 12 months)
  - 6-8mm - 6-12 month CT, then 18-24 months if stable
  - Greater than 8mm - 3 month CT, then PET-CT, biopsy, or surveillance based on risk
  - High-risk patient (5% or greater malignancy probability, includes all smokers)
  - Less than 6mm - 12 month CT surveillance
  - 6-8mm - 6-12 month CT, then 18-24 months
  - Greater than 8mm - 3 month CT, PET-CT, or biopsy
  - Solid nodules follow more aggressive surveillance than ground-glass
  - Part-solid nodules most concerning for adenocarcinoma
  - Growing nodule or high PET avidity - pursue tissue diagnosis
  - Surgical resection if malignancy confirmed (lobectomy preferred over wedge)
  - Multiple nodules - consider metastatic disease vs multifocal primary
  - Benign stable nodules - discharge from surveillance after 2 years stability
clinical_pearls:
  - Incidental lung nodules found in 25-50% of CT scans (increasing with low-dose CT lung cancer screening)
  - Overall malignancy risk 5-10% for incidental nodules, higher in screening populations
  - Most common benign causes - granuloma (histoplasmosis, TB), hamartoma
  - Popcorn calcification = hamartoma (benign)
  - Ground-glass nodules growing over years may be adenocarcinoma in situ (lepidic)
  - Doubling time <30 days or >450 days suggests benign process
  - Stability for 2 years on CT essentially rules out malignancy (except carcinoid, lepidic)
  - Annual low-dose CT lung cancer screening recommended for age 50-80 with 20 pack-year history
  - Overdiagnosis concern - many indolent cancers detected that may never cause harm
  - Smoking cessation counseling critical for all patients with nodules
referrals:
  - Pulmonology for nodule evaluation and bronchoscopy
  - Interventional radiology for CT-guided biopsy
  - Thoracic surgery for VATS biopsy or resection of suspicious nodules
  - Oncology if malignancy confirmed
differentials:
  - Benign granuloma (histoplasmosis, TB, coccidioidomycosis) - most common benign cause
  - Hamartoma (benign tumor with popcorn calcification)
  - Primary lung cancer (adenocarcinoma most common, squamous cell, small cell)
  - Metastatic disease (from breast, colon, kidney, melanoma)
  - Carcinoid tumor (slow-growing, low PET avidity)
  - Pulmonary abscess or organizing pneumonia
  - Arteriovenous malformation
  - Intrapulmonary lymph node
  - Rounded atelectasis
  - Fungal infection (aspergilloma)
