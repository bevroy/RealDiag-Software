tree_id: NEURO-PARKINSON-DISEASE
name: Parkinson Disease
family: Neurology
specialty: Movement Disorders
chief_complaint: Tremor and slowed movement
description: Progressive neurodegenerative disorder causing resting tremor, bradykinesia, rigidity, and postural instability from loss of dopaminergic neurons. Levodopa highly effective for motor symptoms.
icd10: G20
urgency: non-urgent

workup:
  - Clinical diagnosis: bradykinesia (essential) plus either resting tremor or rigidity
  - Classic features: resting tremor 4-6 Hz (pill-rolling), unilateral onset, gradual progression
  - Examination: masked facies, decreased blink rate, micrographia, shuffling gait, stooped posture, reduced arm swing
  - Response to levodopa: dramatic improvement strongly supports diagnosis (>50% improvement typical)
  - Neuroimaging: brain MRI normal (excludes structural lesions, normal pressure hydrocephalus, vascular parkinsonism)
  - DaTscan (dopamine transporter imaging): reduced striatal uptake supports diagnosis but not routinely needed
  - Rule out medication-induced parkinsonism: antipsychotics (haloperidol, risperidone), metoclopramide, valproate
  - Red flags against PD: symmetric onset, early falls, early autonomic dysfunction, poor levodopa response (suggests atypical parkinsonian disorder)

treatment:
  - Levodopa/carbidopa (gold standard): most effective treatment, carbidopa 25 mg/levodopa 100 mg start one tablet TID, titrate gradually
  - Start low, go slow: begin when functional impairment significant enough to warrant treatment
  - Young patients (<60-65): consider dopamine agonist first (pramipexole 0.125-1.5 mg TID or ropinirole 0.25-8 mg TID) to delay levodopa and motor complications
  - Motor fluctuations (wearing-off): as disease progresses, shorter duration of benefit from each levodopa dose
  - Management of fluctuations: increase levodopa frequency, add COMT inhibitor (entacapone 200 mg with each levodopa dose - extends duration), add MAO-B inhibitor (rasagiline 1 mg daily or selegiline), or dopamine agonist
  - Dyskinesias: involuntary movements from chronic levodopa use, manage by decreasing individual dose and increasing frequency, or add amantadine 100 mg TID
  - Non-motor symptoms: treat depression (SSRIs), constipation (fiber, stool softeners, polyethylene glycol), orthostatic hypotension (midodrine, fludrocortisone), REM sleep behavior disorder (clonazepam, melatonin)
  - Dementia: common late complication, treat with rivastigmine or donepezil
  - Psychosis: quetiapine 25-100 mg or pimavanserin 34 mg daily (most antipsychotics worsen parkinsonism)
  - Deep brain stimulation (DBS): for advanced disease with motor fluctuations and dyskinesias despite optimal medications, dramatically improves motor symptoms
  - Physical therapy: gait training, balance exercises, prevent falls
  - Speech therapy: for hypophonia and dysphagia

clinical_pearls:
  - Bradykinesia plus resting tremor or rigidity diagnostic
  - Resting tremor 4-6 Hz pill-rolling, unilateral onset classic
  - Levodopa/carbidopa most effective treatment - dramatic response typical
  - Start treatment when functional impairment significant
  - Young patients consider dopamine agonist first to delay levodopa
  - Motor fluctuations and dyskinesias develop with chronic levodopa use
  - Non-motor symptoms (depression, constipation, orthostasis, dementia) common
  - DBS for advanced disease with motor complications
  - Falls, symmetry, poor levodopa response suggest atypical parkinsonism

differentials:
  - Essential tremor: action tremor (not resting), bilateral, family history, improves with alcohol
  - Drug-induced parkinsonism: history of antipsychotic or metoclopramide use, bilateral, may reverse with drug discontinuation
  - Progressive supranuclear palsy: early falls, vertical gaze palsy, poor levodopa response
  - Multiple system atrophy: early autonomic failure, cerebellar signs, poor levodopa response

trace: |
  A 68-year-old man presented with 18 months of right hand tremor at rest, handwriting getting smaller, and slowed movements. Noticed tremor watching TV or sitting at rest, improved with intentional movement. Progressive difficulty with fine motor tasks (buttoning shirt, typing). Exam showed right hand resting tremor 4-5 Hz, bradykinesia (slow finger taps and hand movements), cogwheel rigidity right arm, masked facies, reduced right arm swing with gait. Left side normal. No postural instability. Brain MRI normal. Diagnosed with early Parkinson disease (Hoehn and Yahr stage 1-2 unilateral involvement). Mild functional impairment, patient desired treatment. Started carbidopa/levodopa 25/100 one tablet TID with meals. At 2 weeks tremor 70% improved, movement speed improved, handwriting better (excellent levodopa response confirms diagnosis). At 3 months increased to 25/100 one and a half tablets TID for sustained benefit. At 6 months motor symptoms well-controlled, returned to all activities. Referred to physical therapy for gait training and fall prevention. At 18 months disease progressed with mild left-sided symptoms emerging (expected progression), increased levodopa to two tablets TID. At 3 years continues excellent functional status on levodopa monotherapy without motor complications.
