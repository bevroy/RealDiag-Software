tree_id: PED-OTITIS-MEDIA
name: Acute Otitis Media (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine
icd10: H66.90
snomed: 3110003
urgency: []
homeopathy: []
presentations:
  - Ear pain (otalgia) - may pull or tug at ear
  - Fever (present in 50-60% of cases)
  - Irritability or fussiness in infants and young children
  - Difficulty sleeping
  - Recent upper respiratory infection (often precedes AOM)
  - Decreased hearing or feeling of ear fullness
  - Ear drainage (if tympanic membrane perforated)
  - Decreased appetite
  - Balance problems or clumsiness in older children
  - Infants may present only with fever and irritability without localizing symptoms
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Severity of ear pain
  - Fever pattern and height
  - Recent viral URI or cold symptoms
  - Previous episodes of otitis media
  - Day care attendance
  - Antibiotic use in past month
  - Known drug allergies
  - Risk factors for resistant bacteria
  - Physical examination
  - Vital signs (temperature, assess for systemic toxicity)
  - Otoscopic examination (ESSENTIAL for diagnosis)
  - Remove cerumen if obstructing view
  - Assess tympanic membrane for diagnostic criteria of AOM
  - Moderate to severe bulging of TM (most specific finding)
  - Loss of normal landmarks (light reflex, malleus handle)
  - Erythema (redness) - LEAST specific finding
  - Decreased or absent mobility on pneumatic otoscopy
  - Otorrhea (purulent drainage) if TM perforation
  - Position of TM (bulging versus retracted)
  - Pneumatic otoscopy
  - Apply gentle positive and negative pressure
  - Normal TM moves briskly
  - AOM: decreased or no movement (middle ear effusion)
  - Diagnostic certainty required before antibiotics
  - Certain diagnosis: bulging TM with impaired mobility
  - Uncertain diagnosis: retracted TM with impaired mobility (may be OME)
  - HEENT examination
  - Assess for concurrent upper respiratory infection
  - Pharyngitis, rhinorrhea, nasal congestion
  - Cervical lymphadenopathy
  - Conjunctivitis (if both present, consider nontypeable H. influenzae)
  - Exclude complications
  - Postauricular swelling, erythema, tenderness (mastoiditis)
  - Facial nerve palsy
  - Altered mental status (meningitis, intracranial extension)
  - Laboratory and imaging
  - Generally NOT needed for uncomplicated AOM
  - Tympanocentesis (needle aspiration of middle ear fluid)
  - Rarely performed, reserved for
  - Severe otalgia unresponsive to therapy
  - Immunocompromised patients
  - Failed multiple antibiotic courses
  - Culture identifies specific pathogen and sensitivities
  - CT temporal bones if concern for mastoiditis or intracranial complications
treatment:
  - Diagnostic criteria must be met before starting antibiotics
  - Severe bulging of tympanic membrane PLUS recent onset ear pain
  - OR purulent otorrhea not due to otitis externa
  - Initial management decision: observation versus antibiotics
  - Observation (watchful waiting for 48-72 hours) appropriate if
  - Age 6 months to 2 years with nonsevere unilateral AOM
  - Age greater than 2 years with nonsevere AOM (unilateral or bilateral)
  - Reliable follow-up and ability to fill prescription if worsens
  - Nonsevere defined as mild otalgia and fever less than 102.2°F (39°C)
  - Provide prescription and instructions to fill if no improvement in 48-72 hours
  - Immediate antibiotic therapy indicated if
  - Age less than 6 months (all cases)
  - Age 6 months to 2 years with bilateral AOM
  - Severe illness: moderate to severe otalgia OR fever greater than 102.2°F (39°C)
  - Immunocompromised
  - Presence of tympanic membrane perforation with otorrhea
  - First-line antibiotic therapy
  - Amoxicillin 80-90 mg/kg/day divided twice daily for 5-10 days (FIRST-LINE)
  - Higher dose needed for S. pneumoniae resistance
  - Duration: 10 days for age less than 2 years or severe disease, 5-7 days for age greater than 2 years mild-moderate
  - Alternative if penicillin allergy
  - Non-type I hypersensitivity: cefdinir, cefuroxime, cefpodoxime
  - Type I hypersensitivity (anaphylaxis): azithromycin or clarithromycin
  - Second-line therapy (treatment failure after 48-72 hours)
  - Amoxicillin-clavulanate 90 mg/kg/day of amoxicillin component divided BID
  - Covers beta-lactamase producing H. influenzae and M. catarrhalis
  - Alternative: ceftriaxone 50 mg/kg IM daily for 1-3 days
  - Pain management (ESSENTIAL)
  - Acetaminophen 10-15 mg/kg/dose every 4-6 hours
  - Ibuprofen 10 mg/kg/dose every 6-8 hours (age greater than 6 months)
  - Topical analgesics: antipyrine-benzocaine otic drops (if TM intact, age greater than 5 years)
  - Warm compresses to affected ear
  - Treatments NOT recommended
  - Decongestants and antihistamines (ineffective)
  - Tympanostomy tube placement for acute episode (only for recurrent or persistent OME)
  - Follow-up
  - Reassess in 48-72 hours if observation chosen or if no improvement on antibiotics
  - Routine follow-up at 8-12 weeks to document resolution of middle ear effusion
  - Middle ear effusion can persist 4-6 weeks after AOM (normal, not treatment failure)
  - Recurrent AOM management (3+ episodes in 6 months or 4+ in 12 months)
  - Chemoprophylaxis NOT routinely recommended (antibiotic resistance concerns)
  - Consider tympanostomy tubes if frequent recurrences impacting quality of life
  - Prevention strategies
  - Pneumococcal conjugate vaccine (PCV15 or PCV20) - reduces AOM incidence
  - Influenza vaccine annually
  - Avoid secondhand smoke exposure
  - Breastfeeding for at least 6 months (protective)
  - Avoid bottle propping or supine feeding
  - Consider xylitol gum or lozenges (age greater than 3 years) - some evidence
clinical_pearls:
  - 'AOM most common bacterial infection in children - 60% have at least one episode by age 1 year'
  - 'Bulging tympanic membrane with impaired mobility is diagnostic - erythema alone is NOT sufficient'
  - 'High-dose amoxicillin (80-90 mg/kg/day) is first-line therapy - covers penicillin-resistant S. pneumoniae'
  - 'Observation without antibiotics appropriate for nonsevere AOM in children over 6 months with reliable follow-up'
  - 'Pain relief is essential - acetaminophen or ibuprofen should be started immediately regardless of antibiotic decision'
  - 'Middle ear effusion persists 4-6 weeks in 60-70% after AOM - this is normal, not treatment failure'
  - 'Most common pathogens: S. pneumoniae (30-40%), nontypeable H. influenzae (20-30%), M. catarrhalis (10-15%)'
  - 'Amoxicillin-clavulanate is second-line if no improvement after 48-72 hours on amoxicillin'
referrals:
  - ENT (otolaryngology) for recurrent AOM (3+ in 6 months or 4+ in 12 months), chronic OME (greater than 3 months), or hearing loss
  - ENT for consideration of tympanostomy tube placement
  - Emergency department if signs of mastoiditis, meningitis, or severe illness
  - Audiology for hearing evaluation if chronic OME or speech delay
differentials:
  - Acute otitis media (bulging TM, impaired mobility, ear pain, fever)
  - Otitis media with effusion (OME - middle ear fluid without infection, retracted TM, no pain/fever, impaired mobility)
  - Otitis externa (swimmer's ear - pain with tragus/pinna manipulation, external canal erythema, no TM bulging)
  - Eustachian tube dysfunction (fullness, muffled hearing, retracted TM, no fever/pain)
  - Referred pain (from pharyngitis, dental abscess, TMJ - TM normal on exam)
  - Mastoiditis (postauricular swelling, tenderness, erythema, proptosis of auricle)
  - Foreign body in ear (visible on otoscopy, unilateral)
  - Tympanic membrane perforation (visible hole, otorrhea, history of trauma or severe infection)
  - Cerumen impaction (wax obscures TM, removal needed for visualization)
