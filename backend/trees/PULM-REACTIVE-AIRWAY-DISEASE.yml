tree_id: PULM-REACTIVE-AIRWAY-DISEASE
name: Reactive Airway Disease, Unspecified
family: pulmonology
specialty: Pulmonology
icd10: J68.3
snomed: 426656000
urgency: moderate
homeopathy: []
presentations:
  - Episodic wheezing
  - Dyspnea or shortness of breath
  - Chest tightness
  - Cough (may be dry or productive)
  - Symptoms triggered by irritants, exercise, cold air, or respiratory infections
  - Symptoms occur without formal asthma diagnosis
  - More common in young children or after acute respiratory illness
  - May have history of prematurity, bronchiolitis, or frequent respiratory infections
  - Symptoms may resolve with age or progress to asthma
workup:
  - Detailed history - frequency, severity, triggers, response to bronchodilators
  - Physical examination during symptomatic episode
  - Expiratory wheezing
  - Prolonged expiratory phase
  - Use of accessory muscles
  - May be normal when asymptomatic
  - Pulse oximetry - assess for hypoxemia during symptoms
  - Chest X-ray to rule out structural abnormalities, infection, or aspiration
  - Hyperinflation may be present
  - Spirometry with bronchodilator testing (if age ≥5 years and cooperative)
  - Reversible airflow obstruction supports asthma diagnosis
  - FEV1 improvement ≥12% and ≥200 mL after bronchodilator
  - May be normal between episodes
  - Peak flow monitoring at home to track variability
  - Consider allergy testing if allergic triggers suspected
  - Trial of bronchodilator therapy often both diagnostic and therapeutic
  - Distinguish from asthma vs transient reactive airway disease
treatment:
  - Acute symptom management
  - Short-acting beta-2 agonist (albuterol) MDI 2-4 puffs q4-6h PRN
  - Albuterol nebulizer 2.5mg q4-6h PRN for severe symptoms
  - Spacer device recommended for MDI (essential in young children)
  - Systemic corticosteroids (prednisone 1-2mg/kg, max 40-60mg) for moderate-severe exacerbations
  - Controller therapy if frequent symptoms (>2 episodes per week)
  - Low-dose inhaled corticosteroid (fluticasone 88-176 mcg BID or budesonide 0.5-1mg daily)
  - Reassess in 3-6 months - continue if benefit, discontinue if resolved
  - Leukotriene modifier (montelukast) alternative for mild symptoms
  - Environmental control measures
  - Avoid known triggers (smoke, allergens, irritants)
  - Smoking cessation for household members
  - HEPA filtration, dust mite covers if allergic triggers
  - Asthma action plan for parents/caregivers
  - Recognize early warning signs
  - When to use rescue inhaler
  - When to seek medical care
  - Follow-up in 2-4 weeks to assess response and adjust therapy
  - Re-evaluate diagnosis - may evolve to asthma diagnosis or resolve completely
clinical_pearls:
  - Reactive airway disease is descriptive term, not formal diagnosis
  - Often used when wheezing present but formal asthma diagnosis not yet established
  - Common in children <5 years (difficult to perform spirometry)
  - Many children with viral-induced wheezing in early childhood outgrow symptoms by school age
  - Predictors of persistent asthma (Asthma Predictive Index)
  - Early onset eczema or allergic rhinitis
  - Parental asthma
  - Wheezing apart from colds
  - Peripheral eosinophilia
  - Recurrent wheezing (≥3 episodes) by age 3 with risk factors likely to have persistent asthma
  - Avoid overuse of albuterol (>2 canisters/month suggests need for controller therapy)
  - Exercise-induced symptoms suggest underlying asthma (consider pre-exercise albuterol)
  - Always consider alternative diagnoses in atypical presentations
referrals:
  - Pulmonology or allergy/immunology for recurrent episodes, severe exacerbations, or unclear diagnosis
  - Consider referral if symptoms persist despite controller therapy
  - Speech therapy if vocal cord dysfunction suspected
differentials:
  - Viral-induced reactive airway disease (transient, post-bronchiolitis)
  - Asthma (persistent, reversible airflow obstruction)
  - Bronchiolitis (age <2, first episode, winter seasonality)
  - Vocal cord dysfunction (stridor, symptoms during inspiration)
  - Foreign body aspiration (unilateral wheezing, sudden onset)
  - Gastroesophageal reflux with aspiration
  - Cystic fibrosis (chronic symptoms, failure to thrive)
  - Primary ciliary dyskinesia (chronic rhinosinusitis, recurrent infections)
  - Tracheomalacia or bronchomalacia (congenital airway weakness)
  - Bronchopulmonary dysplasia (premature infants)
trace:
  source: GINA Guidelines - Wheezing Disorders in Young Children 2023
