tree_id: CARDS-ARRHYTHMOGENIC-RV-CARDIOMYOPATHY
name: Arrhythmogenic Right Ventricular Cardiomyopathy (ARVC)
family: Cardiology
specialty: Cardiology
chief_complaint: Palpitations and syncopal episode
description: Genetic disorder causing fibrofatty replacement of RV myocardium leading to ventricular arrhythmias and sudden cardiac death, particularly in young athletes. Epsilon wave on ECG, RV dilation and dysfunction on echo. ICD essential for high-risk patients, avoid strenuous exercise.
icd10: I42.8
snomed: 85898001
presentations:
  - Palpitations (ventricular arrhythmias)
  - Syncope or near-syncope (especially with exercise)
  - Sudden cardiac death in young athletes
  - Right heart failure symptoms (advanced disease): dyspnea, edema, ascites
  - Family history of sudden cardiac death or ARVC
urgency: urgent

workup:
  - Symptoms: ventricular arrhythmias and RV failure
  - Palpitations: PVCs, ventricular tachycardia (VT with LBBB morphology - arises from RV)
  - Syncope: VT or ventricular fibrillation
  - Sudden cardiac death: often first presentation, particularly during exercise
  - Right heart failure: dyspnea, edema (late manifestation)
  - Family history: sudden death in young relatives, autosomal dominant inheritance
  - Physical exam: often normal early, later RV failure signs (elevated JVP, edema, hepatomegaly)
  - Task Force criteria for diagnosis (2010 revised):
  - Major and minor criteria in 6 categories: structural, histologic, ECG depolarization, ECG repolarization, arrhythmias, family history
  - Definite ARVC: 2 major, 1 major + 2 minor, or 4 minor from different categories
  - ECG findings:
  - Epsilon wave (major): small deflection after QRS in V1-V3 (terminal notch - pathognomonic but rare 30%)
  - T wave inversions: in right precordial leads V1-V3 (major if V1-V3 in age over 14, minor if V1-V2 or V4-V6)
  - Prolonged S wave upstroke: in V1-V3 over 55 ms (localized QRS widening)
  - Ventricular arrhythmias: PVCs with LBBB morphology (originating from RV), VT with LBBB pattern
  - Echocardiogram:
  - RV dilation: regional or global RV enlargement
  - RV dysfunction: reduced RV systolic function (TAPSE below 17 mm)
  - RV wall motion abnormalities: akinesia, dyskinesia, or aneurysm
  - Often difficult to assess RV on echo (complex geometry)
  - Cardiac MRI (best imaging modality):
  - RV dilation and dysfunction
  - Fibrofatty infiltration: bright signal on T1-weighted images
  - Late gadolinium enhancement: scar in RV free wall
  - RV wall thinning and aneurysms
  - Signal abnormality ratio: RV free wall signal compared to skeletal muscle
  - Endomyocardial biopsy: gold standard but rarely done (sampling error, complications)
  - Fibrofatty replacement of myocardium (over 3% for minor, over 10% for major criterion)
  - Genetic testing: mutations in desmosomal genes (PKP2, DSG2, DSC2, DSP, JUP - plakophilin-2 most common)
  - Family screening: first-degree relatives need ECG, echo, Holter, consider genetic testing
  - Signal-averaged ECG: late potentials (abnormal terminal QRS signals)

treatment:
  - Lifestyle modification (critical):
  - Avoid strenuous exercise: competitive and endurance sports contraindicated
  - Exercise triggers arrhythmias and accelerates disease progression
  - ICD (most important treatment):
  - Secondary prevention: survived cardiac arrest or sustained VT (class I)
  - Primary prevention: high risk features (extensive RV involvement, LV involvement, syncope, inducible VT, family history sudden death)
  - Most effective intervention to prevent sudden cardiac death
  - Antiarrhythmic medications:
  - Beta blockers: first-line, reduce arrhythmia burden, consider in all patients
  - Sotalol: class III antiarrhythmic, more effective than beta blockers alone for VT suppression
  - Amiodarone: if refractory VT despite other antiarrhythmics
  - Flecainide: avoid (class IC can be proarrhythmic in structural heart disease)
  - Catheter ablation: for symptomatic VT despite medications
  - Targets scar substrate in RV (endocardial or epicardial approach)
  - Not curative (disease progressive) but reduces VT burden and ICD shocks
  - Heart failure management: if RV or LV dysfunction develops
  - Diuretics for volume overload
  - Standard heart failure therapy if LV involvement
  - Heart transplantation: if end-stage biventricular failure (rare)
  - Prognosis: variable, some stable for years, others rapid progression
  - High risk for sudden death especially with exercise
  - LV involvement worsens prognosis
  - ICD dramatically improves survival

clinical_pearls:
  - Fibrofatty replacement of RV causing ventricular arrhythmias and sudden death
  - Epsilon wave on ECG pathognomonic (rare 30%), T wave inversions V1-V3 more common
  - VT with LBBB morphology (arises from RV)
  - Cardiac MRI best imaging modality for RV structure and scar
  - ICD essential for high-risk patients (most effective treatment)
  - Avoid strenuous exercise (triggers arrhythmias, accelerates disease)
  - Autosomal dominant, screen first-degree relatives
  - Desmosomal gene mutations (PKP2 most common)

differentials:
  - Idiopathic RV outflow tract VT: VT with LBBB morphology but structurally normal heart, benign
  - Sarcoidosis: can involve RV, but systemic disease, PET scan positive
  - Myocarditis: acute presentation, no family history, often resolves
  - Athlete heart: physiologic RV dilation but normal function, no scar, no arrhythmias
  - Dilated cardiomyopathy: LV predominant, not RV selective

trace: |
  A 19-year-old college soccer player presented after syncopal episode during practice. Collapsed while sprinting, lost consciousness x30 seconds, spontaneously recovered. History of palpitations x1 year (ignored). Family history: paternal uncle died suddenly at age 25 while running (sudden cardiac death). Exam: BP 120/75, HR 88 regular, no murmurs, no signs of heart failure. ECG: T wave inversions in V1-V3 and V4 (major criterion - right precordial leads), prolonged terminal activation duration in V1 (QRS upstroke 65 ms, over 55 ms is minor criterion), epsilon wave questionable in V1 (small terminal notch). 48-hour Holter monitor: over 5000 PVCs per day with LBBB morphology (originating from RV - minor criterion for arrhythmias), 3 runs of non-sustained VT with LBBB pattern. Transthoracic echo: RV appeared dilated with reduced function, TAPSE 14 mm (below 17 mm abnormal), difficult to fully assess RV (complex geometry). Cardiac MRI (best test for RV): RV severely dilated with end-diastolic volume index 125 mL/m² (normal below 110 - major criterion), RV ejection fraction 35% (reduced, normal over 45%), regional RV akinesia in RV free wall, late gadolinium enhancement in RV free wall (scar - major criterion), fibrofatty infiltration visible on T1 imaging. Diagnosed with arrhythmogenic right ventricular cardiomyopathy (meets Task Force criteria: 3 major criteria - RV dilation on MRI, RV dysfunction, late gadolinium enhancement; plus multiple minor criteria). High risk for sudden cardiac death: syncope during exercise, sustained VT on Holter, family history sudden death, extensive RV involvement on MRI. Genetic testing: PKP2 mutation (plakophilin-2 - desmosomal protein, most common ARVC mutation, confirms diagnosis). Disqualified from competitive sports (devastating but necessary - exercise triggers arrhythmias and sudden death). ICD implanted for primary prevention of sudden cardiac death (high risk). Started sotalol 80 mg BID (antiarrhythmic to reduce VT burden). At 2 weeks adjusting to lifestyle change, understanding importance of exercise restriction and ICD. Family screening: father underwent ECG, echo, MRI, genetic testing. Father positive for same PKP2 mutation, mild RV changes on MRI, asymptomatic. Father also got ICD and exercise restriction. At 3 months: sotalol dose increased to 160 mg BID, PVC burden reduced 60% on repeat Holter. At 1 year: ICD fired once for sustained VT during emotional stress (ICD saved his life, justified implantation). Continues sotalol, lifestyle modifications, no competitive sports. Annual MRI monitoring shows stable RV size and function. At 3 years: no further ICD shocks, PVCs well-controlled on sotalol, leading relatively normal life avoiding strenuous exercise.
