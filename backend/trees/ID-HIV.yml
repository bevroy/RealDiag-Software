tree_id: ID-HIV
name: HIV/AIDS
family: Infectious Disease
specialty: Infectious Disease
icd10:
- B20
- Z21
snomed:
- '86406008'
urgency: medium
description: Comprehensive evaluation and management of HIV/AIDS
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Opportunistic infections
- Unexplained weight loss
- Persistent fever
- Chronic diarrhea
- Oral thrush
- Kaposi's sarcoma
- Low CD4 count
workup:
- HIV antibody/antigen test (4th generation) - detects HIV-1, HIV-2, p24 antigen
- HIV RNA viral load (confirms diagnosis if antibody positive)
- CD4 count (assesses immune status)
- Genotypic resistance testing before starting ART
- 'Screen for: Hepatitis B/C, STIs, TB (PPD or IGRA)'
treatment:
- 'Guideline-based treatment options for HIV/AIDS include:'
- Start ART (antiretroviral therapy) immediately after diagnosis (IDSA 2024)
- 'Preferred regimen: Integrase inhibitor (bictegravir or dolutegravir) + 2 NRTIs
  (tenofovir-emtricitabine) (IDSA 2024)'
- 'Example: Biktarvy (bictegravir-tenofovir-emtricitabine) 1 tablet daily (IDSA 2024)'
- 'Prophylaxis: TMP-SMX DS daily if CD4 <200 (prevents PCP, toxo) (IDSA 2024)'
- 'Monitor: Viral load (goal undetectable <50), CD4 count (IDSA 2024)'
clinical_pearls:
- 'AIDS definition: CD4 <200 or AIDS-defining illness (PCP, CMV, cryptococcal meningitis,
  Kaposi''s)'
- 'Acute HIV: Mononucleosis-like syndrome 2-4 weeks after exposure (fever, rash, lymphadenopathy)'
- 'PrEP (pre-exposure prophylaxis): Tenofovir-emtricitabine daily reduces transmission
  >90%'
- 'PEP (post-exposure): Start within 72 hours, same regimen x 28 days'
- 'U=U: Undetectable viral load = Untransmittable'
- Screen all ages 13-64 at least once, high-risk annually
referrals:
- HIV clinic or infectious disease for all newly diagnosed
- Social work (medication assistance programs, housing, mental health)
- Start ART as soon as possible (improves outcomes)
differentials:
  - Other immunodeficiency
  - Lymphoma
  - Autoimmune disease
  - Chronic viral infection
trace:
  source: Infectious Diseases Society of America (IDSA) Guidelines, Centers for Disease
    Control and Prevention (CDC)
  version: 0.1.0
  last_updated: '2024-12-26'
