tree_id: DERM-PRESSURE-ULCER
name: Pressure Injury / Ulcer
family: dermatology
specialty: Dermatology

presentations:
  - Skin breakdown or wound over bony prominence
  - Redness that does not blanch with pressure
  - Pain or tenderness at affected site
  - Open sore or wound with or without drainage
  - Necrotic tissue or eschar
  - Common locations (sacrum, heels, ischial tuberosities, greater trochanters, elbows, occiput)
  - History of immobility or prolonged bed rest
  - Incontinence-associated skin damage

workup:
  - History:
    - Duration of immobility
    - Nutritional status and recent weight loss
    - Medical comorbidities (diabetes, vascular disease, spinal cord injury)
    - Sensory impairment or neuropathy
    - Continence status
    - Current medications (corticosteroids, immunosuppressants)
    - Home support and care resources
  - Physical exam:
    - Full skin assessment of all bony prominences
    - Stage pressure injury (Stage 1-4, unstageable, deep tissue injury)
    - Wound measurements (length, width, depth in cm)
    - Assess wound bed (granulation, slough, eschar, exposed bone/tendon)
    - Evaluate wound edges and surrounding skin
    - Palpate for undermining or tunneling
    - Check for signs of infection (erythema, warmth, purulent drainage, odor)
    - Assess for peripheral pulses and capillary refill
    - Braden Scale for fall risk assessment
  - Staging:
    - Stage 1 Non-blanchable erythema of intact skin
    - Stage 2 Partial-thickness skin loss with exposed dermis
    - Stage 3 Full-thickness skin loss with adipose tissue visible
    - Stage 4 Full-thickness skin and tissue loss with exposed muscle, bone, or tendon
    - Unstageable Obscured full-thickness skin loss (covered by slough or eschar)
    - Deep tissue injury Persistent non-blanchable deep red, maroon, or purple discoloration
  - Laboratory studies:
    - CBC (anemia, leukocytosis)
    - Albumin and prealbumin (nutritional status)
    - Hemoglobin A1c (glycemic control)
    - Wound culture (if signs of infection) - deep tissue culture or biopsy, not swab
    - ESR and CRP (if osteomyelitis suspected)
    - Blood cultures (if systemic infection suspected)
  - Imaging:
    - Plain radiographs of affected area (if concern for osteomyelitis)
    - MRI (definitive test for osteomyelitis)
    - Probe-to-bone test (if bone palpable, high suspicion for osteomyelitis)

treatment:
  general_wound_care:
    - Pressure redistribution - turn patient every 2 hours, specialty mattress/cushion
    - Wound cleansing with normal saline or wound cleanser
    - Debridement of necrotic tissue (sharp, enzymatic, autolytic)
    - Maintain moist wound healing environment
    - Appropriate dressing selection based on wound characteristics
  dressing_selection:
    - Stage 1 Transparent film dressing or moisture barrier
    - Stage 2 Hydrocolloid or foam dressing
    - Stage 3-4 Calcium alginate, hydrofiber, foam with border, or negative pressure wound therapy
    - Antimicrobial dressings if signs of infection (silver, cadexomer iodine)
  infection_management:
    - Topical antimicrobials for localized infection
    - Systemic antibiotics if cellulitis, osteomyelitis, or bacteremia present
    - Common organisms MRSA, Pseudomonas, anaerobes, Enterococcus
  nutritional_support:
    - High-protein diet (1.2-1.5 g/kg/day)
    - Caloric supplementation (30-35 kcal/kg/day)
    - Vitamin C (500mg daily) and zinc (if deficient)
    - Nutritionist consultation
  advanced_therapies:
    - Negative pressure wound therapy (VAC therapy)
    - Biological skin substitutes
    - Hyperbaric oxygen therapy (refractory cases)
    - Surgical debridement and flap closure (Stage 3-4)
  prevention:
    - Pressure redistribution surfaces (low air loss, alternating pressure)
    - Repositioning schedule every 2 hours
    - Skin moisturization and barrier creams
    - Incontinence management
    - Nutritional optimization
    - Patient and caregiver education

clinical_pearls:
  - Pressure injuries develop from sustained pressure causing ischemia and tissue death
  - Stage cannot be downgraded as wound heals (Stage 4 healing is "healing Stage 4" not Stage 3)
  - Kennedy terminal ulcer is unavoidable pressure injury at end of life (usually sacral)
  - Do not obtain wound cultures by swab (high contamination) - use tissue biopsy or deep aspiration
  - Unstageable wounds must be debrided before accurate staging is possible
  - Eschar on heels should not be debrided if dry and intact (acts as natural barrier)
  - Albumin <3.5 g/dL and prealbumin <15 mg/dL associated with poor wound healing
  - Not all pressure injuries are preventable despite best care
  - Probe-to-bone test has 87% sensitivity for osteomyelitis in diabetic foot ulcers
  - Negative pressure wound therapy contraindicated if untreated osteomyelitis or exposed vessels
  - Document pressure injuries thoroughly including photos, measurements, staging
  - Medicare and insurance may deny reimbursement for hospital-acquired pressure injuries

trace:
  - NPUAP/EPUAP pressure injury staging system
  - Evidence-based wound care and dressing selection
  - Prevention strategies and risk assessment tools
  - Management of pressure injury-related osteomyelitis

citations:
  - National Pressure Injury Advisory Panel. (2016). NPUAP Pressure Injury Stages.
  - Edsberg LE, et al. (2016). Revised National Pressure Ulcer Advisory Panel Pressure Injury Staging System. J Wound Ostomy Continence Nurs, 43(6), 585-597.
  - Jaul E, et al. (2018). An overview of co-morbidities and the development of pressure ulcers among older adults. BMC Geriatrics, 18(1), 305.
