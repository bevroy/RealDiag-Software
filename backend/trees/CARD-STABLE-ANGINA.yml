tree_id: CARD-STABLE-ANGINA
name: Stable Angina Pectoris
family: Cardiology
specialty: Cardiology
icd10:
- I20.9
- I20.8
snomed:
- '194828000'
urgency: medium
description: Comprehensive evaluation and management of Stable Angina Pectoris
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Predictable chest discomfort with exertion, relieved by rest (5-10 minutes)
- Substernal pressure, tightness, or heaviness (not sharp)
- May radiate to left arm, jaw, neck, or epigastrium
- 'Associated symptoms: Dyspnea, diaphoresis, nausea (less common than ACS)'
- 'Reproducible pattern: Same level of exertion triggers symptoms'
- Relieved by nitroglycerin within 5 minutes
- No symptoms at rest (distinguishes from unstable angina)
workup:
- Stress test (exercise ECG, nuclear perfusion, or stress echo)
- Coronary CT angiography (if low-intermediate risk)
- Coronary angiography if high risk or positive stress test
- Lipid panel, A1c, ECG
treatment:
- 'Guideline-based treatment options for Stable Angina Pectoris include:'
- 'Antiplatelet: Aspirin 81mg daily (ACC/AHA 2023)'
- 'Beta-blocker: Metoprolol 25-100mg BID (first-line for rate control) (ACC/AHA 2023)'
- 'Nitrates: Sublingual NTG 0.4mg PRN for angina (take up to 3 doses 5 min apart)
  (ACC/AHA 2023)'
- 'Statin: High-intensity (atorvastatin 40-80mg) regardless of LDL (ACC/AHA 2023)'
- 'Risk factor modification: Smoking cessation, BP control, diabetes management (ACC/AHA
  2023)'
clinical_pearls:
- 'Typical angina: Substernal, exertional, relieved by rest or NTG'
- 'Atypical angina: 2 of 3 features (more common in women, diabetics)'
- Stable = predictable pattern, no crescendo, no rest symptoms
- Stress test if new diagnosis (exercise ECG, nuclear, echo stress)
- 'Optimal medical therapy: Aspirin, statin, BB or CCB, nitrates PRN'
referrals:
- Cardiology for new diagnosis or refractory symptoms
- Consider revascularization (PCI or CABG) if severe or refractory
differentials: []
