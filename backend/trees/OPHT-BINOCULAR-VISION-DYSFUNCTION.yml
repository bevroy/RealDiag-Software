tree_id: OPHT-BINOCULAR-VISION-DYSFUNCTION
name: Binocular Vision Dysfunction
family: ophthalmology
specialty: Ophthalmology

presentations:
  - Diplopia (double vision)
  - Eye strain or fatigue with reading
  - Headaches (especially frontal or periorbital)
  - Difficulty concentrating on visual tasks
  - Blurred vision with near work
  - Difficulty reading (losing place, re-reading lines)
  - Motion sickness or dizziness with visual tasks
  - Pulling or pressure sensation around the eyes
  - Poor depth perception
  - Neck or shoulder pain with prolonged visual tasks
  - Closing or covering one eye for relief

workup:
  - History:
    - Onset and duration of symptoms
    - Relationship to near work, reading, or computer use
    - History of head trauma, concussion, or whiplash injury
    - Prior strabismus, amblyopia, or eye muscle surgery
    - Developmental history in children
    - Current medications and medical conditions
  - Physical exam:
    - Visual acuity at distance and near
    - Cover-uncover test and alternate cover test
    - Near point of convergence (NPC) measurement
    - Stereopsis testing (Titmus fly test, Randot stereotest)
    - Extraocular motility assessment
    - Pupillary examination
    - Cranial nerve examination if neurologic concern
  - Diagnostic studies:
    - Comprehensive eye examination by optometrist or ophthalmologist
    - Neuroimaging (MRI brain) if new onset diplopia, neurologic signs, or trauma history
    - Thyroid function tests if thyroid eye disease suspected

treatment:
  convergence_insufficiency:
    - Vision therapy (vergence and accommodation exercises)
    - Base-in prism glasses for symptomatic relief
    - Computer glasses with near plus power
    - Referral to behavioral or developmental optometrist
  vertical_heterophoria:
    - Prism correction in glasses (vertical or oblique prism)
    - Vision therapy for fusional reserves
    - Treat underlying strabismus if present
  accommodative_dysfunction:
    - Near plus reading glasses
    - Vision therapy for accommodation facility
    - Ergonomic modifications (lighting, screen distance)
  general_measures:
    - Frequent breaks from near work (20-20-20 rule)
    - Proper lighting and screen positioning
    - Address underlying refractive error with corrective lenses
    - Treat dry eye if contributing
    - Physical therapy for neck/posture issues if present
  surgical_options:
    - Strabismus surgery if significant misalignment
    - Consider for patients who fail conservative management

clinical_pearls:
  - Binocular vision dysfunction (BVD) encompasses convergence insufficiency, vertical heterophoria, and accommodative dysfunction
  - Convergence insufficiency is the most common form with receded near point of convergence (>6 cm) and exophoria at near
  - Symptoms are often worse with prolonged near work, reading, or computer use
  - Post-concussion patients frequently develop BVD with persistent visual symptoms
  - Vision therapy is first-line treatment with 70-80% success rate for convergence insufficiency
  - Vertical misalignment as small as 0.5-1 prism diopter can cause significant symptoms
  - Many patients have been evaluated multiple times with "normal" eye exams because standard testing misses subtle binocular deficits
  - Multidisciplinary approach may be needed including optometry, ophthalmology, neurology, and physical therapy
  - Children with BVD often present with reading difficulties, poor attention, or "laziness" rather than visual complaints
  - Base-in prism for convergence insufficiency, vertical prism for vertical heterophoria

trace:
  - Diagnostic criteria for binocular vision dysfunction
  - Treatment effectiveness of vision therapy for convergence insufficiency
  - Role of prism correction in vertical heterophoria management
  - Post-concussive syndrome and binocular vision disorders

citations:
  - American Optometric Association. (2020). Optometric Clinical Practice Guideline - Care of the Patient with Accommodative and Vergence Dysfunction.
  - Scheiman M, et al. (2008). A randomized clinical trial of treatments for convergence insufficiency in children. Arch Ophthalmol, 126(10), 1336-49.
  - Ciuffreda KJ, et al. (2017). Occurrence of oculomotor dysfunctions in acquired brain injury. Optometry, 78(4), 155-61.
  - Debacker J, et al. (2021). Vertical heterophoria and binocular vision dysfunction. J Optom, 14(3), 190-198.
