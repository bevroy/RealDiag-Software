tree_id: ORTHO-ANKLE-SPRAIN
name: Ankle Sprain
family: orthopedics
specialty: Orthopedics
icd10: S93.409A
snomed: 44465007
urgency: []
homeopathy: []
presentations:
  - Acute ankle pain after inversion injury (rolling ankle)
  - Lateral ankle pain and swelling (85% of ankle sprains)
  - Difficulty or inability to bear weight
  - Bruising and ecchymosis (appears 24-48 hours after injury)
  - Tenderness over lateral ligaments (ATFL, CFL)
  - Limited range of motion due to pain and swelling
  - May hear "pop" at time of injury
  - Ankle instability or giving way sensation
workup:
  - Clinical assessment
  - Mechanism of injury (inversion most common)
  - Inspect for swelling, ecchymosis, deformity
  - Palpate lateral ligaments, medial ligaments, malleoli, 5th metatarsal base, navicular
  - Assess ability to bear weight
  - Test ankle range of motion (dorsiflexion, plantarflexion, inversion, eversion)
  - Anterior drawer test (assesses ATFL integrity)
  - Talar tilt test (assesses CFL integrity)
  - Ottawa ankle rules for imaging decision
  - X-ray indicated if: unable to bear weight (4 steps) immediately and in ED, OR bone tenderness at posterior edge or tip of lateral/medial malleolus, OR bone tenderness at navicular or 5th metatarsal base
  - Reduces unnecessary X-rays by 30-40% without missing fractures
  - Imaging if indicated
  - Ankle X-rays (AP, lateral, mortise views)
  - Foot X-rays if midfoot tenderness or 5th metatarsal base tenderness
  - Stress X-rays or MRI if suspected high-grade ligament tear or chronic instability
  - Grading ankle sprains
  - Grade 1 (mild): ligament stretch, minimal swelling, able to walk, minimal functional loss
  - Grade 2 (moderate): partial ligament tear, moderate swelling/bruising, difficulty walking, some instability
  - Grade 3 (severe): complete ligament tear, significant swelling/bruising, unable to bear weight, marked instability
treatment:
  - Acute management (first 48-72 hours) - PRICE protocol
  - Protection: brace, splint, or crutches if needed
  - Rest: avoid weight-bearing if painful
  - Ice: 15-20 minutes every 2-3 hours
  - Compression: elastic bandage or compression wrap
  - Elevation: above heart level to reduce swelling
  - Grade 1 (mild) sprain
  - Weight-bearing as tolerated immediately
  - Elastic wrap or lace-up ankle brace for support
  - Early range of motion exercises (ankle pumps, circles)
  - Return to activities in 1-2 weeks
  - Grade 2 (moderate) sprain
  - Semi-rigid ankle brace or walking boot for 1-3 weeks
  - Crutches initially if unable to bear weight
  - Progress to weight-bearing as tolerated
  - Physical therapy for ROM, strengthening, proprioception
  - Return to sports in 4-6 weeks
  - Grade 3 (severe) sprain
  - Immobilization in walking boot or cast for 2-4 weeks
  - Crutches non-weight-bearing initially (1-2 weeks)
  - Consider surgical repair if high-level athlete or chronic instability
  - Physical therapy essential (6-12 weeks)
  - Return to sports 3-6 months
  - Pain management
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Acetaminophen 1000 mg TID alternative
  - Rehabilitation (critical to prevent recurrence)
  - Range of motion exercises (ankle pumps, alphabet exercises)
  - Strengthening (resistance band exercises, heel raises, toe raises)
  - Proprioception training (balance board, single-leg stance)
  - Progressive return to sport (straight-line→cutting→full sport)
clinical_pearls:
  - "85% of ankle sprains are lateral (inversion injuries) - ATFL most commonly injured"
  - "Ottawa ankle rules reduce unnecessary X-rays by 30-40% - highly sensitive (nearly 100%)"
  - "High ankle sprain (syndesmotic) more serious - prolonged recovery, return to sport 6-12 weeks"
  - "Functional rehabilitation (early mobilization + proprioception) superior to immobilization"
  - "30-40% develop chronic ankle instability without proper rehabilitation"
  - "Proprioception training reduces re-injury risk by 50%"
  - "ATFL injured first (Grade 1), then CFL (Grade 2), then posterior talofibular ligament (Grade 3)"
  - "Maisonneuve fracture: ankle sprain mechanism with proximal fibula fracture - check full fibula on X-ray"
referrals:
  - Orthopedics if Grade 3 sprain with significant instability
  - Orthopedics if suspected Maisonneuve or high ankle sprain (syndesmotic injury)
  - Physical therapy for all Grade 2-3 sprains for comprehensive rehabilitation
  - Orthopedics if chronic instability despite rehabilitation >3-6 months
differentials:
  - Lateral ankle sprain (inversion injury, ATFL/CFL, lateral tenderness)
  - Medial ankle sprain (eversion injury, deltoid ligament, less common)
  - High ankle sprain (syndesmotic injury, squeeze test positive, prolonged recovery)
  - Lateral malleolus fracture (unable to bear weight, bony tenderness)
  - 5th metatarsal fracture (Jones fracture, base of 5th MT tenderness)
  - Achilles tendon rupture (sudden pop, unable to plantarflex, positive Thompson test)
  - Peroneal tendon subluxation or tear (lateral ankle, snapping sensation)
  - Osteochondral lesion of talus (persistent pain after sprain)
