tree_id: PSYCH-ANXIETY-DISORDER
name: Generalized Anxiety Disorder
family: Psychiatric
specialty: Psychiatry
chief_complaint: Excessive worry
description: Mental disorder characterized by excessive anxiety and worry about various events or activities, occurring more days than not for at least 6 months

icd10: F41.1

urgency: routine

workup:
  - DSM-5 criteria: excessive anxiety and worry about various events/activities, occurring more days than not for at least 6 months, difficult to control worry, associated with 3 or more of 6 symptoms (restlessness/feeling on edge, easily fatigued, difficulty concentrating, irritability, muscle tension, sleep disturbance), causes significant distress or impairment
  - Clinical presentation: persistent worry (health, finances, work, family), difficulty controlling worry, physical symptoms (muscle tension, headaches, GI symptoms), restlessness, fatigue, poor concentration, irritability, sleep disturbance
  - Screen with GAD-7 (Generalized Anxiety Disorder 7-item scale): score 0-4 minimal, 5-9 mild, 10-14 moderate, 15-21 severe anxiety
  - Assess for comorbidities: major depression (50 percent comorbid), other anxiety disorders (panic disorder, social anxiety), substance use
  - Rule out medical causes: hyperthyroidism (TSH), cardiac disease (ECG if palpitations), caffeine/stimulant use, medication side effects (steroids, albuterol, levothyroxine)
  - Substance-induced anxiety: caffeine, cocaine, amphetamines, alcohol withdrawal, benzodiazepine withdrawal
  - Assess suicide risk: anxiety increases suicide risk, especially if comorbid depression

treatment:
  - Psychotherapy first-line: CBT (cognitive-behavioral therapy) most effective, teaches coping strategies to manage worry, relaxation techniques, exposure to anxiety-provoking situations, typically 12-16 sessions
  - Pharmacotherapy: SSRIs or SNRIs first-line medications
  - SSRIs: escitalopram 10-20 mg daily, sertraline 50-200 mg daily, paroxetine 20-50 mg daily - well-tolerated, take 4-6 weeks for full effect, continue 12 months after remission
  - SNRIs: venlafaxine XR 75-225 mg daily, duloxetine 60 mg daily - alternative to SSRIs, also effective for chronic pain if comorbid
  - Buspirone: 5-10 mg TID (titrate to 30-60 mg daily divided) - alternative if prefer non-SSRI, delayed onset (2-4 weeks), no withdrawal or abuse potential, less effective than SSRIs
  - Benzodiazepines: NOT first-line (abuse potential, tolerance, withdrawal), reserve for short-term use during acute anxiety or while waiting for SSRI to take effect, lorazepam 0.5-1 mg TID PRN or clonazepam 0.25-0.5 mg BID, taper and discontinue once SSRI effective, avoid long-term use
  - Combination therapy: CBT plus medication more effective than either alone
  - Lifestyle modifications: regular exercise (aerobic 30 min most days reduces anxiety), adequate sleep, limit caffeine/alcohol, stress management techniques (meditation, mindfulness, yoga), relaxation exercises (deep breathing, progressive muscle relaxation)
  - Monitor response: GAD-7 every 4-8 weeks, adjust dose or switch medication if inadequate response after 8-12 weeks
  - Treatment-resistant anxiety: ensure adequate dose and duration, combination SSRI plus buspirone, augmentation with atypical antipsychotic (quetiapine 25-300 mg at bedtime), switch to different SSRI or SNRI

clinical_pearls:
  - Excessive worry about multiple domains (health, work, finances) occurring more days than not for 6 months
  - GAD-7 screening tool quick and useful (score 10 or more suggests moderate-severe)
  - CBT first-line treatment, SSRIs or SNRIs if moderate-severe or patient preference
  - SSRIs take 4-6 weeks for full effect, continue 12 months after remission
  - Benzodiazepines NOT first-line (abuse potential, tolerance, withdrawal)
  - Comorbid depression common (50 percent) - SSRIs treat both
  - Exercise reduces anxiety as effectively as medication for mild-moderate

differentials:
  - Panic disorder (discrete panic attacks with physical symptoms, fear of future attacks, not constant worry)
  - Social anxiety disorder (fear of social situations, humiliation/embarrassment, avoidance of social settings)
  - Obsessive-compulsive disorder (intrusive thoughts with compulsions, repetitive behaviors to reduce anxiety)
  - Adjustment disorder with anxiety (anxiety within 3 months of identifiable stressor, resolves within 6 months of stressor resolution)
  - Medical causes (hyperthyroidism, cardiac arrhythmias, pheochromocytoma) or substance-induced (caffeine, stimulants, alcohol withdrawal)

trace:
  - 34-year-old woman presents with 8 months excessive worry about multiple things (work performance, children's health, finances, aging parents), present almost daily, difficult to control, interfering with work concentration and relationships
  - Associated symptoms: restlessness, easily fatigued, difficulty concentrating, irritability, muscle tension (especially neck/shoulders), difficulty falling asleep
  - GAD-7 score: 14 (moderate anxiety)
  - No panic attacks, no social phobia, not related to specific stressor
  - Denies depression but notes anhedonia (decreased enjoyment of activities), sleep disturbance, low energy - suggests comorbid depression
  - PHQ-9 score: 12 (moderate depression)
  - Exam: anxious appearing, restless, normal vital signs, no thyromegaly
  - Labs: TSH 2.1 mIU/L (normal), rules out hyperthyroidism
  - Diagnosis: generalized anxiety disorder with comorbid major depressive disorder
  - Counseling: chronic conditions, effective treatments available, CBT plus medication most effective
  - Referred to therapist for CBT (cognitive-behavioral therapy)
  - Started escitalopram 10 mg daily (SSRI treats both anxiety and depression)
  - Lifestyle recommendations: regular exercise (30 min walking daily), limit caffeine to morning only, relaxation exercises (deep breathing, progressive muscle relaxation app), adequate sleep hygiene
  - Follow-up 2 weeks: tolerating escitalopram well, minimal side effects, started CBT weekly sessions
  - 4 weeks: some improvement in worry and mood but still significant symptoms, increased escitalopram to 20 mg daily
  - 8 weeks: marked improvement, GAD-7 score 7 (mild anxiety), PHQ-9 score 5 (minimal depression), worry much more manageable, able to concentrate at work, sleep improved, attending CBT weekly (learning coping strategies)
  - 3 months: GAD-7 score 4 (minimal anxiety), PHQ-9 score 3 (minimal), in remission, completed 12 CBT sessions, continues escitalopram 20 mg daily
  - 6 months: sustained remission, using CBT techniques to manage occasional worry, continues escitalopram, plan to continue medication at least 12 months from remission before considering taper
  - 1 year: remains in remission, excellent quality of life, continues maintenance escitalopram 20 mg daily
