tree_id: RHEUM-SLE
name: Systemic Lupus Erythematosus
family: Rheumatology
specialty: Rheumatology
icd10:
- M32.9
- M32.10
snomed:
- '55464009'
urgency: medium
description: Comprehensive evaluation and management of Systemic Lupus Erythematosus
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Malar rash
- Photosensitivity
- Oral ulcers
- Arthritis
- Serositis
- Renal involvement
- Positive ANA, anti-dsDNA
workup:
- 'ANA: 95% sensitive but only 50% specific - if negative, SLE very unlikely. Titer
  >1:160 significant'
- 'Anti-dsDNA: 70% sensitive, 95% specific - rises with disease activity, correlates
  with nephritis'
- 'Anti-Smith: 30% sensitive, 99% specific - most specific for SLE'
- 'Complement (C3, C4): Low in active disease (consumption)'
- 'UA with micro: Proteinuria, RBC casts (lupus nephritis). 24-hour urine protein
  if positive'
- 'CBC: Anemia (hemolytic or chronic disease), leukopenia, thrombocytopenia'
treatment:
- 'Guideline-based treatment options for Systemic Lupus Erythematosus include:'
- 'Mild disease (arthritis, rash): Hydroxychloroquine 200-400mg daily (reduces flares,
  protects against organ damage), NSAIDs, sunscreen SPF 50+ (ACR 2023)'
- 'Moderate disease: Prednisone 0.5-1mg/kg daily, taper after control, add steroid-sparing
  agent (methotrexate 15-25mg weekly, azathioprine 2mg/kg daily) (ACR 2023)'
- 'Severe disease (lupus nephritis, CNS lupus): High-dose prednisone 1mg/kg + cyclophosphamide
  IV monthly x6 months OR mycophenolate 2-3g daily (ACR 2023)'
- 'Belimumab (monoclonal anti-BLyS): For active disease despite standard therapy (ACR
  2023)'
- 'Pregnancy: High-risk (preeclampsia, flares), hydroxychloroquine continued, avoid
  methotrexate/cyclophosphamide (teratogenic) (ACR 2023)'
clinical_pearls:
- Multisystem autoimmune disease - female 9:1, peak onset 20-40 years, African American
  > Caucasian
- 'Malar (butterfly) rash: Spares nasolabial folds - pathognomonic but only present
  50%'
- 'Lupus nephritis (50%): Most serious complication, leading cause of morbidity/mortality,
  requires aggressive immunosuppression'
- 'Drug-induced lupus: Hydralazine, procainamide, isoniazid, minocycline - resolves
  after stopping drug, anti-histone antibodies positive'
- 'Antiphospholipid syndrome (30%): Thrombosis, recurrent miscarriages, thrombocytopenia
  - requires anticoagulation'
referrals:
- Rheumatology urgently for all SLE diagnoses - requires disease activity monitoring
  and immunosuppression
- Nephrology if proteinuria >500mg/day or active urine sediment (lupus nephritis)
differentials: []
trace:
  source: American College of Rheumatology (ACR) Guidelines, European League Against
    Rheumatism (EULAR)
