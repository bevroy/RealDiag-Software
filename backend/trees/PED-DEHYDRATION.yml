tree_id: PED-DEHYDRATION
name: Dehydration (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/Emergency Medicine
icd10: E86.0
snomed: 34095006
urgency: []
homeopathy: []
presentations:
  - Decreased urine output (fewer wet diapers, dark concentrated urine)
  - Dry mucous membranes (mouth, tongue)
  - Absent or decreased tears when crying
  - Sunken fontanelle in infants
  - Decreased skin turgor (skin tenting)
  - Lethargy or decreased activity
  - Irritability or fussiness
  - Sunken eyes
  - Cool or mottled extremities (severe dehydration)
  - History of fluid losses (vomiting, diarrhea, decreased intake, fever, excessive sweating)
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Fluid losses
  - Vomiting: frequency, volume, bilious or bloody
  - Diarrhea: frequency, consistency, blood or mucus
  - Fever duration and height
  - Excessive sweating or increased insensible losses
  - Oral intake
  - Amount and type of fluids/foods consumed
  - Ability to tolerate oral intake
  - Refusal to drink
  - Urine output
  - Number of wet diapers (normal 6-8 per day)
  - Time since last urination
  - Color and concentration of urine
  - Weight loss if recent weight known
  - Associated symptoms (abdominal pain, headache, respiratory symptoms)
  - Risk factors for severe dehydration (young age, underlying conditions)
  - Physical examination - assess severity of dehydration
  - Vital signs
  - Heart rate (tachycardia suggests dehydration)
  - Blood pressure (hypotension indicates severe dehydration)
  - Respiratory rate
  - Weight (compare to recent well-child weight if available)
  - General appearance
  - Alert and active versus lethargic
  - Consolable versus inconsolable
  - Hydration assessment
  - Mucous membranes (moist versus dry versus parched)
  - Tears present when crying
  - Fontanelle (flat, sunken, or bulging)
  - Eyes (normal versus sunken)
  - Skin turgor (immediate recoil versus tenting)
  - Capillary refill (less than 2 seconds normal, prolonged in dehydration)
  - Extremities (warm versus cool, mottled)
  - Clinical dehydration score
  - Mild (3-5% weight loss)
  - Normal mental status
  - Slightly dry mucous membranes
  - Normal tears, fontanelle, eyes
  - Capillary refill less than 2 seconds
  - Urine output slightly decreased
  - Moderate (6-9% weight loss)
  - Lethargic or irritable
  - Dry mucous membranes
  - Decreased tears
  - Sunken fontanelle (infants)
  - Sunken eyes
  - Decreased skin turgor
  - Capillary refill 2-3 seconds
  - Oliguria (markedly decreased urine)
  - Severe (10% or greater weight loss)
  - Altered mental status (lethargic, minimally responsive)
  - Parched mucous membranes
  - Absent tears
  - Very sunken fontanelle
  - Very sunken eyes
  - Tenting skin turgor
  - Capillary refill greater than 3 seconds
  - Cool, mottled extremities
  - Weak or absent pulses
  - Hypotension
  - Anuria
  - Laboratory evaluation
  - Not routinely needed for mild dehydration
  - Consider if moderate to severe dehydration or diagnostic uncertainty
  - Basic metabolic panel (BMP)
  - Assess for electrolyte abnormalities (Na, K, Cl, CO2)
  - BUN and creatinine (elevated BUN:Cr ratio suggests dehydration)
  - Glucose (hypoglycemia risk in young children)
  - Venous blood gas if concern for acidosis
  - Urinalysis
  - Specific gravity greater than 1.020 suggests dehydration
  - Ketones if decreased oral intake
  - Additional testing based on cause
  - Stool studies if bloody diarrhea or severe gastroenteritis
  - Complete blood count if concern for infection
treatment:
  - Oral rehydration therapy (ORT) - FIRST-LINE for mild to moderate dehydration
  - Preferred over IV fluids for mild-moderate dehydration (equally effective, less invasive)
  - Oral rehydration solution (ORS)
  - Pedialyte, Enfalyte, WHO-ORS
  - Optimal sodium 45-75 mEq/L, glucose 2-2.5%
  - Avoid sports drinks, juice, soda (inappropriate electrolyte composition)
  - Rehydration phase (first 4 hours)
  - Calculate fluid deficit
  - "Mild (3-5%): 50 mL/kg over 4 hours"
  - "Moderate (6-9%): 100 mL/kg over 4 hours"
  - Give small frequent amounts
  - 5 mL every 5 minutes initially, increase as tolerated
  - Use syringe or spoon for infants
  - If vomiting, wait 10 minutes and restart with smaller volume
  - Even with vomiting, most fluid is retained
  - Maintenance phase (after rehydration)
  - Resume age-appropriate diet
  - Continue ORS for ongoing losses
  - "10 mL/kg ORS for each diarrheal stool"
  - "2 mL/kg ORS for each vomiting episode"
  - Breastfeeding should continue throughout
  - Feeding recommendations
  - Do NOT withhold food (BRAT diet outdated)
  - Resume normal diet as soon as tolerated
  - Age-appropriate foods
  - Continue breastfeeding
  - Lactose-free formula NOT necessary (most can tolerate regular formula)
  - Intravenous rehydration - indications
  - Severe dehydration (10% or greater weight loss)
  - Altered mental status
  - Hemodynamic instability (hypotension, poor perfusion)
  - Persistent vomiting preventing oral intake
  - Failed oral rehydration trial
  - Ileus or severe abdominal distension
  - IV fluid resuscitation
  - Bolus: 20 mL/kg normal saline or lactated Ringer's over 20 minutes
  - Repeat boluses as needed until improved perfusion
  - Then calculate fluid deficit and give over 24 hours (or faster if severe)
  - Maintenance fluids: calculated by weight or 4-2-1 rule
  - "First 10 kg: 100 mL/kg/day (4 mL/kg/hr)"
  - "Second 10 kg: 50 mL/kg/day (2 mL/kg/hr)"
  - "Each kg above 20: 20 mL/kg/day (1 mL/kg/hr)"
  - Antiemetics
  - Ondansetron (Zofran) may reduce vomiting and facilitate oral rehydration
  - 0.15 mg/kg PO/IV single dose (max 8 mg)
  - Use selectively, not routinely
  - Medications to AVOID
  - Loperamide (Imodium) - NOT recommended in children (risk of ileus, CNS depression)
  - Antibiotics - NOT indicated for most viral gastroenteritis
  - Probiotics - some evidence for reducing diarrhea duration (Lactobacillus GG, Saccharomyces boulardii)
  - Admission criteria
  - Severe dehydration requiring IV fluids
  - Failed outpatient oral rehydration
  - Underlying conditions (diabetes, renal disease, infancy)
  - Inadequate social support for home management
  - Prevention and discharge instructions
  - Continue ORS for ongoing losses at home
  - Resume normal diet
  - Hand hygiene to prevent spread
  - Return precautions
  - No urination in 8-12 hours
  - Worsening lethargy, confusion
  - Bloody diarrhea or severe abdominal pain
  - Persistent vomiting preventing any oral intake
  - Fever greater than 102°F (39°C) in infant under 3 months
clinical_pearls:
  - 'Oral rehydration therapy (ORT) as effective as IV fluids for mild-moderate dehydration and preferred (less invasive, lower cost)'
  - 'Give ORS in small frequent amounts (5 mL every 5 minutes) - even with vomiting, most fluid is absorbed'
  - 'Sports drinks and juice NOT appropriate for rehydration - incorrect electrolyte composition (too much sugar, not enough sodium)'
  - 'Clinical assessment more accurate than labs for determining dehydration severity - use vital signs and exam findings'
  - 'BRAT diet outdated - resume age-appropriate diet as soon as child tolerates, does not need to be restricted'
  - 'Capillary refill time greater than 2 seconds and decreased skin turgor most reliable clinical signs of dehydration'
  - 'Ondansetron can facilitate oral rehydration by reducing vomiting but should not replace ORT as first-line treatment'
  - 'Infants and young children at highest risk for rapid dehydration due to higher baseline water requirements and increased losses'
referrals:
  - Emergency department if severe dehydration, altered mental status, hemodynamic instability, or failed oral rehydration
  - Gastroenterology if chronic diarrhea, malabsorption, or failure to thrive
  - Nephrology if electrolyte abnormalities persist or concern for renal dysfunction
differentials:
  - Dehydration from gastroenteritis (vomiting, diarrhea, most common cause)
  - Dehydration from decreased oral intake (anorexia, sore throat, stomatitis)
  - Dehydration from fever and increased insensible losses
  - Diabetic ketoacidosis (polyuria, polydipsia, hyperglycemia, metabolic acidosis)
  - Adrenal insufficiency (hypotension, hyponatremia, hyperkalemia, hypoglycemia)
  - Pyloric stenosis (projectile vomiting in infant 3-12 weeks, hypochloremic metabolic alkalosis)
  - Sepsis (fever, ill-appearing, poor perfusion)
  - Heat illness (exposure to high temperatures, hyperthermia)
