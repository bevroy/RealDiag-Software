tree_id: URO-PYELONEPHRITIS
name: Pyelonephritis
family: Urology
specialty: Urology
icd10:
- N10
snomed:
- 45816000
urgency: medium
description: Comprehensive evaluation and management of Pyelonephritis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Fever, chills (high-grade fever often >38.5°C)
- Flank pain, CVA tenderness (costovertebral angle tenderness, hallmark finding)
- Dysuria, urinary frequency, urgency (cystitis symptoms often present)
- Nausea and vomiting (systemic symptoms)
- 'Urinalysis: Pyuria, bacteriuria, WBC casts (pathognomonic for kidney infection)'
- E. coli (80% of cases), Klebsiella, Proteus, Enterococcus
- More severe than simple cystitis - systemic toxicity present
- 'Complicated cases: Pregnancy, diabetes, immunosuppression, obstruction, catheter'
- May progress to sepsis if untreated
- 'Emphysematous pyelonephritis: Gas in kidney tissue (diabetics), surgical emergency'
- 'Diagnosis: Clinical (fever + CVA tenderness) + UA with WBC casts + urine culture
  >100K CFU/mL'
- Risk factors - female, urinary stasis, vesicoureteral reflux, kidney stones
workup:
- 'UA with culture BEFORE antibiotics: Pyuria, bacteriuria, WBC casts (pathognomonic),
  positive nitrites'
- 'Urine culture: >100,000 CFU/mL (lower threshold if symptoms severe)'
- 'Blood cultures: Positive in 20-30% (bacteremia common)'
- 'CBC: Leukocytosis with left shift'
- 'Renal ultrasound: If not improving, diabetic, or suspicion for obstruction - rule
  out abscess, obstruction'
treatment:
- 'Guideline-based treatment options for Pyelonephritis include:'
- 'Outpatient (mild, uncomplicated): Fluoroquinolone (ciprofloxacin 500mg BID or levofloxacin
  750mg daily) x7-14 days (AUA 2023)'
- 'Inpatient (severe, complicated): Ceftriaxone 1g IV daily OR amp/gent (ampicillin
  2g IV q6h + gentamicin 5mg/kg IV daily) until afebrile x48h, then oral x14 days
  total (AUA 2023)'
- 'Pregnant: Ceftriaxone 1g IV daily until afebrile x48h (avoid fluoroquinolones,
  high risk of preterm labor/sepsis) (AUA 2023)'
- 'Renal ultrasound if not improving in 48-72h: Rule out obstruction, abscess, emphysematous
  pyelonephritis (AUA 2023)'
- 'Follow-up urine culture 1-2 weeks after treatment: Ensure bacterial clearance (AUA
  2023)'
clinical_pearls:
- Bacterial infection of kidney parenchyma - E. coli (80%), Klebsiella, Proteus, Enterococcus
- 'Ascending infection: Most cases from bladder UTI ascending to kidney via ureter'
- 'Complicated vs uncomplicated: Complicated (male, pregnant, diabetes, immunosuppressed,
  obstruction, catheter) needs longer treatment'
- 'WBC casts: Pathognomonic for pyelonephritis - neutrophils in tubular casts on urine
  microscopy'
- 'Emphysematous pyelonephritis: Gas-forming infection (usually diabetics) - CT shows
  gas in kidney, high mortality, needs nephrectomy'
referrals:
- 'Urology if: Obstruction present, renal abscess, emphysematous pyelonephritis, recurrent
  pyelonephritis (>2 episodes)'
- 'Admit if: Unable to tolerate PO, severe sepsis, pregnant, immunocompromised, concern
  for complicated infection'
differentials: []
trace:
  source: American Urological Association (AUA) Guidelines, European Association of
    Urology (EAU) Guidelines
  version: 0.1.0
  last_updated: '2024-12-26'
