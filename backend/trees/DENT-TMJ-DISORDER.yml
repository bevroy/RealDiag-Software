tree_id: DENT-TMJ-DISORDER
name: Temporomandibular Joint Disorder (TMD)
family: Dentistry
specialty: Dentistry
chief_complaint: Jaw pain and clicking with chewing
description: Dysfunction of temporomandibular joint causing jaw pain, clicking, and limited opening. Conservative management with soft diet, NSAIDs, and occlusal splint effective in 80-90% of cases.
icd10: M26.60
snomed: 298231005
urgency: non-urgent

workup:
  - Clinical diagnosis: jaw pain (preauricular area), clicking or popping with jaw movement, limited mouth opening, pain with chewing
  - Types: myofascial pain (muscle disorder - most common), internal derangement (disc displacement), degenerative joint disease (arthritis)
  - Muscle tenderness: masseter and temporalis muscles tender to palpation
  - Joint sounds: clicking (disc displacement with reduction), crepitus (arthritis)
  - Limited opening: normal mouth opening 35-45 mm (measure between incisors), TMD often below 35 mm or asymmetric deviation
  - Triggers: stress (jaw clenching, teeth grinding), trauma, malocclusion, bruxism (nighttime teeth grinding)
  - Risk factors: female (3:1 ratio), age 20-40, stress, anxiety, depression
  - Imaging rarely needed: X-ray if trauma or suspected fracture, MRI if surgical evaluation considered (shows disc position)
  - Red flags requiring imaging: severe pain, rapidly progressive, suspected tumor or infection

treatment:
  - Conservative management (first-line): effective in 80-90% within 2-3 months
  - Self-care: soft diet (avoid hard or chewy foods, no gum), avoid wide mouth opening (yawning, large bites), gentle jaw stretching exercises
  - Moist heat: apply to affected area 15-20 minutes several times daily (relaxes muscles)
  - NSAIDs: ibuprofen 400-600 mg TID or naproxen 500 mg BID x2-4 weeks for pain and inflammation
  - Occlusal splint (night guard): custom-fitted acrylic appliance worn at night, prevents bruxism, reduces muscle tension
  - Most effective treatment for bruxism-related TMD, wear nightly for 3-6 months
  - Physical therapy: jaw exercises (stretching, strengthening), massage, ultrasound therapy, posture correction
  - Stress management: relaxation techniques, cognitive behavioral therapy, avoid jaw clenching
  - Muscle relaxants: cyclobenzaprine 5-10 mg at bedtime x2 weeks if severe muscle spasm (short-term only)
  - Trigger point injections: lidocaine or botulinum toxin into masseter or temporalis if refractory muscle pain
  - Intra-articular corticosteroid injection: for joint inflammation and arthritis (limited benefit)
  - Surgery (arthroscopy or open joint surgery): rarely needed (less than 5% of cases), only if failed conservative treatment for 6-12 months or mechanical obstruction
  - Avoid invasive procedures: most TMD is self-limited and improves with conservative management

clinical_pearls:
  - Jaw pain worse with chewing, clicking or popping with jaw movement
  - Myofascial pain (muscle disorder) most common type
  - Conservative management effective in 80-90% within 2-3 months
  - Soft diet, NSAIDs, occlusal splint (night guard) first-line treatment
  - Avoid wide mouth opening and hard/chewy foods
  - Bruxism (teeth grinding) common trigger - night guard effective
  - Stress management important - jaw clenching worsens symptoms
  - Surgery rarely needed (less than 5% of cases)

differentials:
  - Dental abscess: severe localized tooth pain, swelling, fever, percussion tenderness over specific tooth
  - Temporal arteritis: unilateral headache, jaw claudication, age above 50, elevated ESR, temporal artery tenderness
  - Trigeminal neuralgia: brief lancinating facial pain (seconds), triggered by touch or chewing, no joint symptoms
  - Parotid gland disorder: swelling over parotid gland (in front of ear), pain with eating

trace: |
  A 35-year-old woman presented with 2 months of bilateral jaw pain worse on right side. Pain located in front of ears, worse with chewing especially hard foods. Notices clicking sound when opening mouth. Works in high-stress job, aware of clenching jaw during day and partner reports teeth grinding at night. No trauma. Exam showed tenderness over right masseter and temporalis muscles, palpable click with mouth opening, mouth opening 32 mm (reduced from normal 40-45 mm), deviation to right on opening. TMJ area tender to palpation. Teeth show flattened surfaces (bruxism). Diagnosed with temporomandibular joint disorder (myofascial pain and disc displacement with reduction). Started conservative management: soft diet (avoid hard or chewy foods, no gum, cut food into small pieces), moist heat to jaw 15-20 minutes TID, ibuprofen 600 mg TID with meals x3 weeks. Gentle jaw stretching exercises demonstrated (open mouth slowly and hold 5 seconds, repeat 10 times TID). Referred to dentist for custom occlusal splint (night guard) fabrication. Counseled on stress management and avoiding jaw clenching. At 3 weeks pain improved 40%, continues soft diet and exercises. At 6 weeks custom night guard delivered, wearing nightly. Pain improved 60%, clicking persists but painless. At 3 months pain improved 85%, mouth opening improved to 38 mm, teeth grinding controlled with night guard. Continues night guard use, returns to normal diet gradually. No surgery needed.
