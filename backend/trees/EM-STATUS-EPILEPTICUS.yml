tree_id: EM-STATUS-EPILEPTICUS
name: Status Epilepticus
family: Emergency Medicine
specialty: Emergency Medicine
icd10:
- G41.9
- G41.901
snomed:
- '230456007'
urgency: medium
description: Comprehensive evaluation and management of Status Epilepticus
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Continuous seizure activity >5 minutes (previously >30 min definition outdated)
- Repeated seizures without return to baseline consciousness
- Generalized tonic-clonic (most common) or focal with impaired awareness
- Altered consciousness, coma
- Requires immediate intervention to prevent neuronal injury
- High mortality (10-20%) if treatment delayed
- 'Causes: Medication noncompliance, CNS infection, metabolic, withdrawal'
workup: []
treatment:
- 'Guideline-based treatment options for Status Epilepticus include:'
- '0-5 min: ABCs, O2, IV access, check glucose, give thiamine if indicated (ACEP 2023)'
- '5-10 min: Lorazepam 4mg IV (may repeat once) or midazolam 10mg IM (ACEP 2023)'
- '10-20 min: Fosphenytoin 20 PE/kg IV or levetiracetam 60mg/kg IV (max 4500mg) (ACEP
  2023)'
- '20-40 min: Refractory status - intubate, propofol/midazolam drip, ICU, EEG (ACEP
  2023)'
- 'Workup: Labs (CBC, CMP, tox screen, AED levels), LP if concern for infection, MRI
  brain (ACEP 2023)'
clinical_pearls:
- 'Time is brain: Start treatment at 5 minutes, not 30 minutes'
- 'Benzodiazepines FIRST: Lorazepam 0.1mg/kg IV (or diazepam, midazolam IM)'
- 'If benzos fail (refractory): Fosphenytoin 20 PE/kg IV or levetiracetam 60mg/kg
  IV'
- 'If still seizing: Intubation + propofol or midazolam infusion, EEG monitoring'
- Check glucose immediately (hypoglycemia can mimic seizure)
- Thiamine 100mg IV before dextrose if malnourished/alcoholic
