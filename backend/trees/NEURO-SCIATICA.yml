tree_id: NEURO-SCIATICA
name: Sciatica (Lumbar Radiculopathy)
family: neurological
specialty: Neurology/Orthopedics
chief_complaint: Low back pain radiating down leg
description: Nerve root compression or irritation causing radiating pain along sciatic nerve distribution
icd10: M54.30
urgency: routine-to-urgent
workup:
  - Detailed history - location, radiation, quality of pain, aggravating/relieving factors
  - Pain radiating below knee in dermatomal pattern (L4, L5, or S1 distribution)
  - Neurological examination - motor, sensory, reflexes
  - L4 - quadriceps weakness (knee extension), decreased patellar reflex, medial leg numbness
  - L5 - foot drop (ankle dorsiflexion weakness), extensor hallucis longus weakness, lateral leg and dorsal foot numbness
  - S1 - plantar flexion weakness, decreased Achilles reflex, posterior leg and lateral foot numbness
  - Straight leg raise test (SLR) - positive if pain radiates below knee at 30-70 degrees
  - Crossed straight leg raise (more specific)
  - Check for cauda equina syndrome red flags - saddle anesthesia, bowel/bladder dysfunction, bilateral symptoms, progressive neurological deficit
  - MRI lumbar spine - imaging test of choice if considering surgery or red flags present
  - Shows herniated disc, nerve root compression, spinal stenosis
  - CT myelography if MRI contraindicated
  - X-rays lumbar spine - limited utility, shows alignment, degenerative changes, not disc herniation
  - EMG/nerve conduction studies if diagnosis unclear or evaluating for peripheral neuropathy
  - ESR, CRP if concern for infection or inflammatory cause
treatment:
  - Conservative management first-line for acute sciatica (85-90% improve within 6-12 weeks)
  - Remain active, avoid bed rest (bed rest delays recovery)
  - NSAIDs - ibuprofen 600-800 mg TID, naproxen 500 mg BID
  - Acetaminophen 1000 mg TID-QID
  - Muscle relaxants - cyclobenzaprine 5-10 mg TID, methocarbamol 500-750 mg QID (short-term use)
  - Neuropathic pain medications
  - Gabapentin 300-1200 mg TID (start low, titrate up)
  - Pregabalin 75-150 mg BID
  - Duloxetine 30-60 mg daily
  - Oral corticosteroids (prednisone 60-80 mg daily for 5-7 days) controversial, may provide short-term relief
  - Epidural steroid injection if severe pain not responding to conservative management
  - Transforaminal or interlaminar approach
  - May provide relief for 3-6 months, can repeat up to 3 injections per year
  - Physical therapy - core strengthening, stretching, posture training
  - Surgery (microdiscectomy, laminectomy) for
  - Cauda equina syndrome (emergency)
  - Progressive neurological deficit despite conservative management
  - Persistent severe pain greater than 6-12 weeks unresponsive to conservative treatment
  - Significant functional impairment
  - Surgery success rate 85-95% for properly selected patients
clinical_pearls:
  - Most common cause is lumbar disc herniation (90%), peak age 30-50 years
  - L4-L5 and L5-S1 levels account for 95% of disc herniations
  - Natural history - 50% improve in 6 weeks, 75% in 12 weeks with conservative treatment
  - True sciatica involves pain radiating below the knee in dermatomal pattern
  - Pain worse with sitting, Valsalva, forward flexion, better with standing/walking
  - Positive SLR test highly sensitive (90%) but not specific
  - Crossed SLR more specific (less sensitive) - lifting contralateral leg reproduces symptoms
  - MRI findings often do NOT correlate with symptoms - 30% of asymptomatic adults have disc herniation
  - Most disc herniations resorb over time (6-12 months) without surgery
  - Surgery provides faster relief but similar outcomes to conservative treatment at 1-2 years
differentials:
  - Lumbar spinal stenosis (neurogenic claudication, worse with walking/standing, better with sitting/flexion)
  - Piriformis syndrome (buttock pain, no true radiculopathy, worse with hip internal rotation)
  - Sacroiliac joint dysfunction (pain over SI joint, provocative SI joint tests positive)
  - Hip pathology (groin pain, limited hip range of motion)
  - Peripheral neuropathy (stocking-glove distribution, bilateral, diabetes, abnormal EMG)
  - Trochanteric bursitis (lateral hip pain, tenderness over greater trochanter)
  - Cauda equina syndrome (bilateral symptoms, saddle anesthesia, bowel/bladder dysfunction - emergency)
  - Spinal tumor or infection (progressive symptoms, constitutional symptoms, elevated ESR/CRP)
trace:
  - 42-year-old construction worker presents with 2-week history of severe low back pain radiating down right leg
  - Pain started after lifting heavy object at work
  - Sharp, shooting pain from right buttock down posterior thigh to lateral calf and foot
  - Pain 8/10, worse with sitting, coughing, bending forward
  - Numbness and tingling in lateral right foot and dorsum of foot
  - Difficulty with toe walking on right
  - Denies bowel or bladder dysfunction, no saddle anesthesia
  - Past medical history - none, no prior back problems
  - Physical exam - walks with antalgic gait favoring right side
  - Lumbar spine - decreased range of motion with forward flexion, no midline tenderness
  - Neurological exam - motor strength 4/5 right ankle plantar flexion (S1), 5/5 elsewhere
  - Sensory decreased to light touch over lateral right foot and dorsum (S1 distribution)
  - Decreased right Achilles reflex compared to left, patellar reflexes symmetric
  - Positive straight leg raise on right at 40 degrees (reproduces leg pain)
  - Crossed SLR positive (lifting left leg reproduces right leg pain)
  - No saddle anesthesia, normal rectal tone
  - Diagnosis - Right S1 radiculopathy (sciatica), likely from L5-S1 disc herniation
  - MRI lumbar spine ordered given severity and neurological findings
  - MRI shows large right paracentral disc herniation at L5-S1 with compression of right S1 nerve root
  - No cauda equina syndrome, no emergent surgical indication
  - Conservative management initiated
  - NSAIDs naproxen 500 mg BID with food
  - Gabapentin started at 300 mg TID, plan to titrate to 600-900 mg TID
  - Cyclobenzaprine 10 mg at bedtime for muscle spasm
  - Physical therapy referral for McKenzie exercises and core strengthening
  - Avoid prolonged sitting, use proper body mechanics
  - Work restrictions - no lifting greater than 10 pounds, limited bending
  - Follow-up in 2 weeks - pain improved to 5/10, tolerating gabapentin 600 mg TID
  - Able to perform more activities, still has numbness
  - Continue conservative management
  - 6-week follow-up - significant improvement, pain 2/10, minimal numbness
  - Able to return to light duty work
  - 3-month follow-up - 90% improved, occasional mild back discomfort, resolved leg symptoms
  - Returned to full duty work with restrictions on heavy lifting
  - Outcome - Successful conservative management, avoided surgery
