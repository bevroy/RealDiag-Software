tree_id: CARD-ACUTE-CORONARY-SYNDROME
name: Acute Coronary Syndrome (ACS)
family: Cardiology
specialty: Cardiology/Emergency Medicine
chief_complaint: Chest pain or pressure, shortness of breath, diaphoresis
description: Spectrum of acute myocardial ischemia ranging from unstable angina to STEMI
icd10: I24.9
urgency: emergency
workup:
  - Immediate assessment - within 10 minutes of presentation
  - Brief focused history - chest pain characteristics (onset, quality, duration, radiation, associated symptoms)
  - STEMI equivalents - diaphoresis, dyspnea, nausea, vomiting, syncope (especially in elderly, women, diabetics)
  - Risk factors - age, smoking, diabetes, hypertension, hyperlipidemia, family history
  - Physical examination - vitals (hypotension, tachycardia), signs of heart failure, murmur (acute MR from papillary muscle rupture)
  - 12-lead ECG within 10 minutes - CRITICAL
  - STEMI - ST elevation greater than 1 mm in 2+ contiguous leads, new LBBB
  - NSTEMI - ST depression, T wave inversion, or non-diagnostic ECG with positive biomarkers
  - Unstable angina - symptoms at rest, no ST elevation, negative biomarkers
  - Cardiac biomarkers
  - Troponin I or T (preferred) - detectable 3-4 hours, peaks 12-24 hours, elevated up to 7-14 days
  - High-sensitivity troponin - detectable earlier (1-2 hours), requires serial measurements
  - Repeat at 3-6 hours if initial negative but clinical suspicion high
  - CK-MB less specific than troponin
  - Complete blood count, comprehensive metabolic panel, lipid panel, coagulation studies
  - Chest X-ray (pulmonary edema, widened mediastinum)
  - Echocardiography (wall motion abnormalities, complications)
treatment:
  - STEMI - time is muscle, door-to-balloon less than 90 minutes for PCI
  - Activate cardiac catheterization lab immediately
  - Primary PCI (percutaneous coronary intervention) preferred if available within 120 minutes
  - Fibrinolysis if PCI not available within 120 minutes (door-to-needle less than 30 minutes)
  - Alteplase, reteplase, or tenecteplase
  - Contraindications - prior ICH, ischemic stroke within 3 months, active bleeding, aortic dissection
  - Immediate medications (MONA plus antiplatelet/anticoagulation)
  - Morphine 2-4 mg IV for pain (use judiciously, may worsen outcomes)
  - Oxygen if SpO2 less than 90% (avoid routine oxygen if saturation normal)
  - Nitroglycerin 0.4 mg sublingual every 5 minutes x3, then IV infusion if ongoing pain
  - Contraindications - hypotension, right ventricular infarction, PDE5 inhibitor use within 24-48 hours
  - Aspirin 162-325 mg chewed immediately (loading dose)
  - Dual antiplatelet therapy (DAPT)
  - Aspirin 325 mg loading then 81 mg daily maintenance
  - P2Y12 inhibitor - clopidogrel 600 mg loading (or ticagrelor 180 mg, prasugrel 60 mg) then maintenance
  - Ticagrelor 90 mg BID preferred over clopidogrel (more potent)
  - Anticoagulation
  - Heparin unfractionated IV bolus 60 U/kg (max 4000 U) then infusion 12 U/kg/hr
  - Or enoxaparin 1 mg/kg SC every 12 hours
  - Beta-blocker (within 24 hours if stable, no heart failure/hypotension)
  - Metoprolol 25-50 mg PO BID or IV 5 mg every 5 minutes x3
  - ACE inhibitor within 24 hours (especially if anterior MI, EF less than 40%, diabetes, hypertension)
  - Lisinopril 2.5-5 mg daily, titrate up
  - High-intensity statin - atorvastatin 80 mg or rosuvastatin 40 mg daily
  - NSTEMI/Unstable angina - risk stratification
  - GRACE or TIMI risk scores
  - High risk - invasive strategy (cardiac catheterization within 24 hours)
  - Low-intermediate risk - ischemia-guided strategy or invasive within 72 hours
  - Complications - arrhythmias (VT/VF, heart block), cardiogenic shock, mechanical complications (free wall rupture, VSR, acute MR), pericarditis
clinical_pearls:
  - Classic chest pain - substernal pressure, squeezing, radiating to left arm or jaw, 10-20 minutes duration
  - Women, elderly, diabetics may present with atypical symptoms (no chest pain, just dyspnea or fatigue)
  - STEMI treated with PCI has 3-5% mortality, with fibrinolysis 6-7%, without reperfusion 15-20%
  - Time to reperfusion is critical - every 30 minute delay increases mortality
  - Right ventricular infarction (inferior STEMI with RV involvement) - hypotension, elevated JVP, clear lungs
  - Requires IV fluids, avoid nitrates and diuretics
  - Wellens syndrome - biphasic or deeply inverted T waves in V2-V3, indicates critical LAD stenosis
  - High risk for anterior STEMI within days-weeks, urgent catheterization
  - Post-MI medications - aspirin lifelong, P2Y12 inhibitor 12 months, beta-blocker, ACE/ARB, statin
  - Cardiac rehabilitation improves outcomes - enroll all post-MI patients
differentials:
  - Aortic dissection (tearing pain radiating to back, pulse differential, widened mediastinum)
  - Pulmonary embolism (dyspnea, pleuritic chest pain, DVT risk factors, elevated D-dimer)
  - Pericarditis (pleuritic chest pain, worse with lying flat, better leaning forward, friction rub)
  - Pneumothorax (sudden dyspnea, unilateral decreased breath sounds, hyperresonance)
  - GERD (burning chest pain, relieved with antacids, no ECG changes)
  - Costochondritis (chest wall tenderness, reproducible with palpation)
  - Anxiety/panic attack (younger patient, hyperventilation, no cardiac risk factors)
trace:
  - 58-year-old man with history of hypertension and hyperlipidemia presents to ED via EMS with chest pain
  - Sudden onset severe substernal chest pressure 90 minutes ago while shoveling snow
  - Pain 10/10, radiating to left arm and jaw, associated with diaphoresis, nausea
  - EMS gave aspirin 324 mg, oxygen, sublingual nitroglycerin with minimal relief
  - Past medical history - hypertension, hyperlipidemia, 30-pack-year smoking history
  - Medications - lisinopril, simvastatin (non-compliant)
  - Family history - father MI at age 55
  - Physical exam on arrival - appears distressed, diaphoretic, pale
  - Vitals - BP 160/95, HR 102, RR 22, SpO2 94% on 4L NC, temp 37.0C
  - Cardiac exam - tachycardic regular rhythm, no murmurs, JVP not elevated
  - Lung exam - bibasilar crackles
  - 12-lead ECG (obtained 8 minutes after arrival) - ST elevation 3-4 mm in V2-V4, I, aVL (anterolateral STEMI)
  - Diagnosis - Acute ST-elevation myocardial infarction (STEMI), anterolateral
  - Code STEMI activated, cardiac catheterization lab mobilized
  - Door-to-balloon goal less than 90 minutes
  - Immediate treatment initiated
  - Aspirin 325 mg chewed (already given by EMS)
  - Ticagrelor 180 mg loading dose PO
  - Heparin IV bolus 4000 units followed by infusion
  - Nitroglycerin IV infusion started for ongoing chest pain
  - Taken emergently to cardiac catheterization lab
  - Coronary angiography - 100% occlusion of proximal LAD (culprit lesion), 70% stenosis RCA, 50% stenosis LCx
  - Primary PCI to LAD - balloon angioplasty, drug-eluting stent placed with TIMI 3 flow restored
  - Door-to-balloon time 72 minutes (excellent)
  - Post-procedure - chest pain resolved, repeat ECG shows resolution of ST elevations
  - Admitted to CCU for monitoring
  - Started on metoprolol 25 mg BID, lisinopril 5 mg daily, atorvastatin 80 mg daily
  - Continued aspirin 81 mg daily, ticagrelor 90 mg BID (DAPT for 12 months)
  - Echocardiogram day 2 - EF 45% (reduced), anterior wall hypokinesis, no mechanical complications
  - Hospital course uncomplicated, no arrhythmias, no heart failure
  - Discharged day 3 with medication reconciliation and education
  - Enrolled in cardiac rehabilitation program
  - Smoking cessation counseling, nicotine replacement therapy
  - Follow-up with cardiologist in 2 weeks
  - 6-week follow-up - doing well, attending cardiac rehab 3 times per week
  - Quit smoking, tolerating medications well
  - Repeat echo - EF improved to 50%
  - Outcome - Successful primary PCI with good recovery, excellent compliance with secondary prevention
