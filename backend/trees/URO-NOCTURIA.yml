tree_id: URO-NOCTURIA
name: Nocturia (Nighttime Urination)
family: urology
specialty: Urology/Primary Care
icd10: R35.1
snomed: 139394000
urgency: []
homeopathy: []
presentations:
  - Waking at night to urinate (two or more times is clinically significant)
  - Disrupted sleep, daytime fatigue
  - Frequency without large volumes (bladder dysfunction, overactive bladder)
  - Large volumes each void (nocturnal polyuria, diabetes, sleep apnea)
  - Difficulty falling back asleep after voiding
  - Sensation of incomplete emptying
  - Weak urinary stream (obstruction - BPH)
  - Urgency (overactive bladder)
  - Leg swelling that improves overnight (fluid mobilization causing nocturnal polyuria)
workup:
  - Bladder diary (CRITICAL for diagnosis)
  - Record for 3 consecutive days: time of each void, volume voided, fluid intake
  - Distinguishes nocturnal polyuria from bladder dysfunction
  - Nocturnal polyuria: nocturnal urine volume greater than 33% of 24-hour volume (greater than 20% in elderly)
  - Bladder dysfunction: frequent small volumes, total nocturnal volume normal
  - History
  - Number of nocturia episodes per night
  - Voided volumes (small vs large)
  - Daytime frequency, urgency
  - Fluid intake (amount, timing, types - caffeine, alcohol)
  - Medical history: diabetes, heart failure, sleep apnea, chronic venous insufficiency
  - Medications (diuretics, timing; medications causing polyuria)
  - Sleep history: snoring, apnea symptoms
  - Physical examination
  - Abdominal examination (palpable bladder, masses)
  - Digital rectal examination (prostate size, masses)
  - Lower extremity edema (fluid retention)
  - Cardiovascular examination (heart failure signs)
  - Urinalysis
  - Glucose (uncontrolled diabetes causing osmotic diuresis)
  - Protein, casts (kidney disease)
  - Infection (UTI causing frequency)
  - Specific gravity (dilute in polyuria, concentrated in dehydration)
  - Post-void residual (PVR)
  - Bladder scan or catheterization after voiding
  - Elevated PVR (greater than 100-150 mL) suggests obstruction or detrusor underactivity
  - Normal PVR rules out retention
  - Laboratory tests
  - Fasting glucose, HbA1c (screen for diabetes)
  - BUN, creatinine (kidney function)
  - Serum sodium, calcium (hypercalcemia causes polyuria)
  - TSH (hyperthyroidism can cause polyuria)
  - BNP or NT-proBNP if heart failure suspected
  - Consider sleep study if obstructive sleep apnea suspected (strong association with nocturia)
  - Uroflowmetry (if obstruction suspected)
  - Assesses urinary flow rate
treatment:
  - Treatment based on underlying cause
  - Nocturnal polyuria (large volumes at night)
  - Behavioral modifications
  - Limit fluids 2-3 hours before bedtime
  - Avoid caffeine and alcohol (diuretic effects)
  - Elevate legs in afternoon/evening (mobilize edema before bedtime)
  - Compression stockings for venous insufficiency
  - Afternoon diuretics (shift diuresis to daytime)
  - If on diuretics, take in morning or early afternoon, NOT evening
  - Desmopressin (synthetic ADH) for nocturnal polyuria
  - Desmopressin 0.1-0.2 mg orally at bedtime (lower dose in elderly)
  - Reduces nocturnal urine production
  - CAUTION: hyponatremia risk (especially elderly, women)
  - Check serum sodium after 3 days and periodically
  - Contraindications: heart failure, hyponatremia, renal insufficiency
  - Effective in 40-60% when nocturnal polyuria confirmed
  - Treat underlying conditions
  - Diabetes: optimize glucose control
  - Heart failure: optimize diuretics (daytime dosing), ACE inhibitors, beta-blockers
  - Sleep apnea: CPAP therapy (improves nocturia in 60-80%)
  - Bladder dysfunction (small frequent volumes)
  - Overactive bladder
  - Behavioral therapy: timed voiding, bladder training, fluid management
  - Antimuscarinics (oxybutynin, tolterodine, solifenacin) - bedtime dosing
  - Mirabegron (beta-3 agonist) if antimuscarinics not tolerated
  - Bladder outlet obstruction (BPH)
  - Alpha-blockers (tamsulosin, alfuzosin) - improve flow and reduce nocturia
  - 5-alpha reductase inhibitors (finasteride, dutasteride) for large prostates
  - TURP or other surgical procedures if medications ineffective
  - Detrusor underactivity (elevated PVR)
  - Timed voiding, double voiding
  - Alpha-blockers if outlet obstruction component
  - Intermittent self-catheterization if severe retention
  - Mixed etiology (common)
  - Combination of behavioral, pharmacologic, and underlying condition treatments
  - Sleep hygiene
  - Regular sleep schedule, dark quiet room
  - Treat sleep disorders (insomnia, sleep apnea)
clinical_pearls:
  - "Nocturia two or more times per night is clinically significant (associated with impaired quality of life)"
  - "Affects 50% of adults over 50, 80% over 80"
  - "Nocturnal polyuria defined as nocturnal urine greater than 33% of 24-hour volume (greater than 20% in elderly)"
  - "Bladder diary is ESSENTIAL to distinguish nocturnal polyuria from bladder dysfunction"
  - "Sleep apnea strongly associated with nocturia - CPAP improves nocturia in 60-80%"
  - "Desmopressin effective for nocturnal polyuria but RISK of hyponatremia in elderly - monitor sodium"
  - "Afternoon diuretic timing (vs evening) shifts diuresis to daytime, reduces nocturia"
  - "Leg elevation and compression stockings mobilize edema during day, reduce nocturnal polyuria"
  - "Nocturia associated with falls, fractures, sleep deprivation, impaired quality of life, increased mortality"
referrals:
  - Urology if refractory to initial management, elevated PVR, hematuria, or concern for malignancy
  - Nephrology if kidney disease suspected (proteinuria, elevated creatinine)
  - Cardiology if heart failure contributing and suboptimally controlled
  - Sleep medicine if obstructive sleep apnea suspected (snoring, witnessed apneas, daytime sleepiness)
  - Endocrinology if uncontrolled diabetes or other endocrine cause (hypercalcemia, diabetes insipidus)
differentials:
  - Nocturnal polyuria (large volumes, greater than 33% of 24-hour output at night - diabetes, heart failure, sleep apnea, venous insufficiency, medications)
  - Overactive bladder (urgency, frequency, small volumes)
  - Benign prostatic hyperplasia (obstructive symptoms, weak stream, elevated PVR)
  - Urinary tract infection (dysuria, frequency, urgency, suprapubic pain)
  - Diabetes mellitus (polyuria, polydipsia, osmotic diuresis)
  - Diabetes insipidus (central or nephrogenic - massive polyuria, dilute urine)
  - Chronic kidney disease (impaired concentrating ability, polyuria)
  - Heart failure (leg edema, fluid shifts at night)
  - Obstructive sleep apnea (snoring, witnessed apneas, strong association with nocturia)
  - Medications (diuretics, SSRIs, lithium, calcium channel blockers)
  - Chronic venous insufficiency (leg edema, varicosities)
  - Hypercalcemia (polyuria, constipation, confusion)
  - Primary polydipsia (excessive fluid intake)
  - Bladder cancer (hematuria, irritative symptoms)
  - Interstitial cystitis (bladder pain, severe frequency)
