tree_id: NEURO-MIGRAINE
name: Migraine
family: Neurology
specialty: Neurology
chief_complaint: Recurrent severe headache
description: |
  Recurrent primary headache disorder with unilateral throbbing pain, nausea, photophobia, phonophobia.
  Affects 15% of population, 3:1 female predominance. Migraine with aura (25%) vs without aura (75%).
icd10: G43.909
urgency: Moderate
workup:
  - Clinical diagnosis based on ICHD-3 criteria (no imaging needed for typical presentation)
  - Migraine without aura: ≥5 attacks lasting 4-72 hours with ≥2 of (unilateral, throbbing, moderate-severe, worse with activity) PLUS nausea/vomiting or photophobia/phonophobia
  - Migraine with aura: reversible focal neurologic symptoms (visual most common) lasting 5-60 minutes, followed by headache within 60 minutes
  - Neuroimaging (MRI brain) indicated if: atypical features, focal neurologic deficits persisting beyond aura, sudden onset ("thunderclap"), age >50 with new headache, change in headache pattern
  - Red flags requiring urgent evaluation: sudden severe headache, fever/meningismus, focal deficits, papilledema, altered mental status
treatment:
  - Acute treatment (abortive): take at headache onset for best efficacy
  - Mild-moderate: NSAIDs (ibuprofen 400-800mg, naproxen 500-1000mg) or acetaminophen 1000mg
  - Moderate-severe: triptans first-line (sumatriptan 50-100mg PO, rizatriptan 10mg ODT, eletriptan 40mg)
  - Rescue therapy: metoclopramide 10mg IV/IM for nausea, prochlorperazine 10mg IV, or ketorolac 30mg IV
  - Avoid opioids (not effective, risk medication overuse headache)
  - Preventive therapy if: ≥4 headache days per month, ≥8 migraine days per month, or debilitating attacks
  - Preventive first-line: topiramate 50-100mg daily, propranolol 80-240mg daily, amitriptyline 25-100mg nightly
  - Preventive alternatives: valproate, venlafaxine, or CGRP monoclonal antibodies (erenumab, fremanezumab, galcanezumab)
  - Botox injections for chronic migraine (≥15 headache days per month)
clinical_pearls:
  - Medication overuse headache (rebound): occurs with acute meds >10-15 days per month (requires withdrawal and prevention)
  - Aura symptoms: visual (scintillating scotoma, zigzag lines), sensory (paresthesias), speech disturbance (rarely motor)
  - Status migrainosus: migraine lasting >72 hours (treat with IV antiemetics, steroids, DHE, or hospitalize)
  - Triggers: stress, sleep changes, menstruation, foods (aged cheese, wine, MSG), weather changes, skipped meals
  - Premonitory symptoms (hours before): mood changes, neck stiffness, yawning, food cravings
  - Triptans contraindicated in: coronary artery disease, uncontrolled hypertension, hemiplegic migraine, basilar migraine
differentials:
  - Tension-type headache
  - Cluster headache
  - Medication overuse headache
  - Subarachnoid hemorrhage
  - Meningitis
  - Brain tumor
trace:
  - Recurrent unilateral throbbing headache with nausea and photophobia → ≥5 similar attacks lasting 4-72 hours → Diagnose migraine without aura → Mild-moderate severity → Trial ibuprofen 600mg at onset → Inadequate relief → Prescribe sumatriptan 100mg for future attacks → Frequent attacks (≥4 per month) → Initiate preventive therapy with propranolol 80mg daily → Reduce attack frequency by 50%
