tree_id: NEURO-MIGRAINE
name: Migraine Headache
family: neurologic
specialty: Neurology
chief_complaint: Severe throbbing headache, often unilateral, with nausea and photophobia
description: Primary headache disorder with recurrent moderate-severe headaches and associated symptoms
icd10: G43.909
urgency: routine-to-urgent

homeopathy:
  - remedy: "Belladonna 30C"
    indications: "Throbbing right-sided headache, sudden onset, worse from light/noise/motion"
  - remedy: "Iris versicolor 30C"
    indications: "Right-sided headache with visual disturbances, nausea, vomiting bile"
  - remedy: "Natrum muriaticum 30C"
    indications: "Hammering headache, worse from sun, emotional stress, craves salt"
  - remedy: "Sanguinaria 30C"
    indications: "Right-sided headache ascending from neck, better after vomiting"
  - remedy: "Spigelia 30C"
    indications: "Left-sided headache extending to eye, worse from motion"

workup:
  - Clinical presentation with characteristic headache features
  - Migraine without aura (75%) - unilateral throbbing headache 4-72 hours
  - Moderate-severe intensity, aggravated by physical activity
  - Associated with nausea/vomiting, photophobia, phonophobia
  - Migraine with aura (25%) - transient neurologic symptoms before headache
  - Visual aura most common (zigzag lines, scintillations, scotomas)
  - Sensory aura (numbness, tingling), speech disturbance
  - Aura develops over 5-20 minutes, lasts less than 60 minutes
  - Headache follows aura within 60 minutes
  - Triggers include stress, sleep changes, hormonal fluctuations, foods (aged cheese, wine, MSG), weather
  - Chronic migraine defined as 15+ headache days per month with migraine features
  - Physical exam typically normal between attacks
  - During attack patient prefers dark quiet room
  - Neurologic exam normal (if abnormal, consider secondary headache)
  - Red flags requiring imaging include sudden thunderclap onset, new headache after age 50, focal neurologic deficits, papilledema, fever
  - Brain MRI if red flags present (rule out secondary causes)
  - Diagnosis clinical based on International Headache Society criteria
treatment:
  - Acute treatment - abort migraine attack
  - Mild-moderate migraine - NSAIDs or combination analgesics
  - Ibuprofen 400-800 mg, naproxen 500-750 mg
  - Acetaminophen/aspirin/caffeine (Excedrin) 2 tablets
  - Moderate-severe migraine - triptans first-line
  - Sumatriptan 50-100 mg PO (onset 30-60 min) or 6 mg SC (onset 10-15 min)
  - Rizatriptan 10 mg ODT (dissolves on tongue)
  - Eletriptan 40 mg, zolmitriptan 2.5-5 mg
  - Contraindications - coronary artery disease, uncontrolled hypertension, stroke, hemiplegic migraine
  - Take early in attack for best efficacy
  - Anti-emetics adjunct for nausea
  - Metoclopramide 10 mg, prochlorperazine 10 mg
  - CGRP antagonists for acute treatment
  - Ubrogepant 50-100 mg, rimegepant 75 mg ODT
  - Alternative if triptans contraindicated or ineffective
  - Avoid medication overuse headache - limit acute medications to less than 10 days per month for triptans, less than 15 days for NSAIDs
  - Preventive treatment - reduce frequency and severity
  - Indications - 4+ migraine days per month, or disabling attacks
  - First-line preventive medications
  - Beta-blockers - propranolol 80-240 mg daily, metoprolol 100-200 mg daily
  - Antiepileptics - topiramate 50-200 mg daily (weight loss, kidney stones), valproate 500-1000 mg daily (teratogenic, avoid in women of childbearing age)
  - Antidepressants - amitriptyline 25-100 mg at bedtime (sedating, weight gain), venlafaxine 150 mg daily
  - CGRP monoclonal antibodies - monthly or quarterly injections
  - Erenumab 70-140 mg SC monthly, fremanezumab 225 mg monthly or 675 mg quarterly, galcanezumab 240 mg loading then 120 mg monthly
  - Very effective, well-tolerated, expensive
  - Botulinum toxin for chronic migraine (15+ headache days/month)
  - OnabotulinumtoxinA 155 units injected into 31 sites every 3 months
  - Lifestyle modifications include regular sleep schedule, regular meals, hydration, exercise, stress management
  - Identify and avoid triggers
clinical_pearls:
  - Most common disabling primary headache disorder
  - Female:male 3:1, prevalence 12% in US
  - Unilateral throbbing with nausea/photophobia classic triad
  - Triptans highly effective but must take early in attack
  - CGRP antagonists alternative if triptans contraindicated
  - Preventive therapy indicated if 4+ migraine days per month
  - Medication overuse headache common - limit acute meds to less than 10-15 days/month
  - Chronic migraine responds to botulinum toxin injections
differentials:
  - Tension-type headache (bilateral, pressing quality, no nausea, mild-moderate)
  - Cluster headache (unilateral orbital, autonomic features, short duration 15-180 min)
  - Trigeminal neuralgia (brief electric shocks, trigger points)
  - Temporal arteritis (age greater than 50, jaw claudication, elevated ESR)
  - Subarachnoid hemorrhage (thunderclap sudden onset, worst headache of life)
  - Meningitis (fever, neck stiffness)
trace:
  - 32-year-old woman presents with recurrent severe headaches x 2 years
  - Headaches 5-6 times per month, lasting 8-24 hours each
  - Severe throbbing pain, usually right-sided temporal
  - Nausea and vomiting during attacks
  - Light and sound bothers her, stays in dark room
  - Cannot work during attacks
  - Sometimes sees zigzag lines 20 minutes before headache starts (visual aura)
  - Triggers include stress, menstruation, wine, lack of sleep
  - Family history - mother has migraines
  - Currently taking ibuprofen 800 mg, helps slightly but not enough
  - Physical exam and neurologic exam normal
  - Diagnosis - migraine with aura, episodic (6 days/month)
  - Frequent attacks interfering with function - candidate for preventive therapy
  - Acute treatment - prescribed sumatriptan 100 mg PO
  - Take at headache onset (within first hour) for best response
  - Can repeat once after 2 hours if incomplete response
  - Maximum 200 mg per 24 hours
  - Limit to 9 days per month (avoid medication overuse)
  - Preventive therapy - discussed options
  - Patient prefers to avoid daily medications initially
  - Trial lifestyle modifications first (regular sleep, avoid triggers, hydration)
  - Magnesium 400 mg daily, riboflavin 400 mg daily (supplements with modest benefit)
  - 2 months later - sumatriptan very effective for acute attacks
  - Takes within 30 minutes of onset, headache resolves within 2 hours
  - But still having 5-6 migraines per month, using sumatriptan 5-6 days/month
  - Still significantly impacting quality of life
  - Discussed daily preventive medication
  - Started propranolol 40 mg BID (beta-blocker)
  - 3 months on propranolol - migraine frequency decreased to 2-3 per month
  - Significant improvement in quality of life
  - Continues sumatriptan for breakthrough attacks (now only 2-3 days/month)
  - 1 year later - stable on propranolol, 2-3 migraines per month (50% reduction)
  - Sumatriptan effective for attacks
  - Tolerating propranolol well (mild fatigue initially, resolved)
  - Outcome - successful migraine management with acute triptan and preventive beta-blocker
