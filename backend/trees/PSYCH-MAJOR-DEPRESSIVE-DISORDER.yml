tree_id: PSYCH-MAJOR-DEPRESSIVE-DISORDER
name: Major Depressive Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Persistent low mood and loss of interest
description: |
  Mood disorder characterized by depressed mood and anhedonia with neurovegetative symptoms. Lifetime prevalence 15-20%, more common in women (2:1).
  High suicide risk - assess at every visit. Multifactorial etiology includes genetic, neurobiological, psychosocial factors.
icd10: F33.1
urgency: High
workup:
  - Clinical diagnosis using DSM-5 criteria - 5 or more symptoms present during same 2-week period, must include depressed mood or anhedonia
  - Nine symptoms - depressed mood, anhedonia, weight change (greater than 5%), insomnia or hypersomnia, psychomotor agitation or retardation, fatigue, worthlessness or guilt, decreased concentration, recurrent thoughts of death or suicide
  - Symptoms cause significant distress or functional impairment
  - Rule out medical causes - thyroid function tests (hypothyroidism), vitamin B12, CBC (anemia), comprehensive metabolic panel, pregnancy test in women of childbearing age
  - Screen for substance use - alcohol, cannabis, stimulants can cause or worsen depression
  - PHQ-9 questionnaire to assess severity (score 5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe)
  - Columbia Suicide Severity Rating Scale (C-SSRS) for suicide risk assessment
  - Rule out bipolar disorder - screen for history of mania or hypomania (antidepressants can precipitate manic episodes)
treatment:
  - Psychotherapy - cognitive behavioral therapy (CBT) or interpersonal therapy (IPT) effective as monotherapy for mild-moderate depression
  - Combination psychotherapy plus medication superior to either alone for moderate-severe depression
  - SSRI first-line medication - sertraline 50-200mg daily, escitalopram 10-20mg daily, fluoxetine 20-80mg daily
  - Trial adequate dose for 4-6 weeks before assessing response, may take 8-12 weeks for full effect
  - If partial response, increase dose; if no response, switch to different SSRI or SNRI
  - SNRI alternative - venlafaxine 75-225mg daily, duloxetine 30-60mg daily
  - Atypical antidepressants - bupropion 300-450mg daily (avoid if seizure history, eating disorder), mirtazapine 15-45mg nightly (sedating, increases appetite)
  - Treatment-resistant depression - augmentation with aripiprazole 2-15mg daily, lithium 300-900mg daily, or switch to different class
  - Electroconvulsive therapy (ECT) for severe treatment-resistant depression or psychotic features (most effective treatment, 70-90% response)
  - Ketamine or esketamine nasal spray for treatment-resistant depression
  - Continue medication 6-12 months after first episode, 2+ years after second episode, indefinite if 3 or more episodes
clinical_pearls:
  - SIG E CAPS mnemonic - Sleep, Interest, Guilt, Energy, Concentration, Appetite, Psychomotor, Suicidal ideation
  - Always assess suicide risk - past attempts strongest predictor, also family history, access to means, substance use, social isolation, recent loss
  - If active suicidal ideation with plan or intent - psychiatric hospitalization for safety
  - SSRI side effects - sexual dysfunction (30-70%), GI upset, initial anxiety, hyponatremia in elderly
  - Discontinuation syndrome if stopped abruptly - taper over 2-4 weeks (except fluoxetine due to long half-life)
  - Peripartum depression screen at prenatal and postpartum visits - Edinburgh Postnatal Depression Scale
differentials:
  - Bipolar disorder
  - Persistent depressive disorder (dysthymia)
  - Adjustment disorder
  - Grief/bereavement
  - Substance-induced mood disorder
  - Hypothyroidism
trace:
  - 35-year-old woman with persistent low mood, loss of interest in activities, insomnia, fatigue x 2 months → Reports difficulty concentrating at work, decreased appetite with 10 lb weight loss, feels worthless → PHQ-9 score 18 (moderately severe) → Denies suicidal ideation, no history mania → TSH, CBC, B12 normal → Diagnose major depressive disorder, moderate-severe → Start sertraline 50mg daily plus referral to CBT → Increase to 100mg after 4 weeks → PHQ-9 at 8 weeks improves to 7 (mild residual symptoms) → Continue sertraline, ongoing CBT → PHQ-9 at 12 weeks score 3 (remission) → Plan to continue medication at least 6-12 months
