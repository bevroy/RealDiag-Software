tree_id: ONCOLOGY-PANCREATIC-CANCER
name: Pancreatic Adenocarcinoma
family: gastrointestinal-oncology
specialty: Oncology/Gastroenterology
chief_complaint: Painless jaundice, abdominal pain, weight loss
description: Malignant tumor of pancreas, most commonly adenocarcinoma of ductal epithelium
icd10: C25.9
urgency: urgent
workup:
  - Clinical presentation - often late presentation with advanced disease
  - Painless jaundice (70% of pancreatic head tumors) - progressive, dark urine, pale stools, pruritus
  - Abdominal pain (75%) - epigastric, radiating to back, worse supine, better sitting forward
  - Weight loss (85%) - significant, unintentional, often 10-20% body weight
  - New-onset diabetes (15-30%) - within 2 years of diagnosis
  - Anorexia, early satiety
  - Steatorrhea (fat malabsorption from pancreatic insufficiency)
  - Acute pancreatitis (may be presenting symptom)
  - Trousseau syndrome - migratory superficial thrombophlebitis (paraneoplastic)
  - Courvoisier sign - palpable, non-tender gallbladder with jaundice (suggests malignancy not cholelithiasis)
  - Physical examination
  - Jaundice (scleral icterus, skin)
  - Palpable gallbladder (Courvoisier sign)
  - Hepatomegaly (liver metastases)
  - Ascites (peritoneal metastases)
  - Left supraclavicular lymphadenopathy (Virchow node - distant metastasis)
  - Cachexia, muscle wasting
  - Laboratory studies
  - Liver function tests - markedly elevated bilirubin (direct/conjugated), elevated alkaline phosphatase and GGT (cholestasis)
  - Transaminases mildly elevated or normal
  - Tumor marker - CA 19-9 elevated (greater than 37 U/mL)
  - Sensitivity 80%, specificity 90% for pancreatic cancer
  - Useful for monitoring treatment response, detecting recurrence
  - Can be falsely elevated in benign biliary obstruction
  - Cannot be synthesized by Lewis antigen-negative patients (5-10% population)
  - Complete blood count (anemia from chronic disease)
  - Coagulation studies (PT/INR may be elevated if biliary obstruction)
  - Fasting glucose (new-onset diabetes)
  - Imaging - crucial for diagnosis and staging
  - Pancreatic protocol CT (triple-phase contrast CT)
  - Pancreatic mass with vascular involvement assessment
  - Liver metastases, lymphadenopathy, ascites
  - Determines resectability
  - MRI/MRCP - if CT contraindicated or for better soft tissue detail
  - Endoscopic ultrasound (EUS) - most sensitive for small tumors (less than 2 cm)
  - Allows FNA biopsy for tissue diagnosis
  - Assess vascular invasion
  - PET-CT - detect distant metastases if CT equivocal
  - Staging laparoscopy - if considering surgery, rule out peritoneal metastases
  - Tissue diagnosis - required before chemotherapy (not before surgery if resectable)
  - EUS-guided FNA (preferred) - high sensitivity, low complication rate
  - CT-guided biopsy
  - ERCP with brushings (if biliary obstruction requiring stenting)
  - Staging - TNM system
  - Resectable - no distant metastases, no arterial involvement (SMV/celiac/hepatic artery)
  - Borderline resectable - limited vascular involvement (less than 180 degrees SMA/celiac encasement)
  - Locally advanced unresectable - greater than 180 degrees arterial encasement, unreconstructible venous occlusion
  - Metastatic - distant metastases (liver, peritoneum, lung)
treatment:
  - Surgical resection - only curative option (15-20% of patients eligible)
  - Whipple procedure (pancreaticoduodenectomy) for head of pancreas
  - Remove pancreatic head, duodenum, gallbladder, part of bile duct, pylorus
  - Complex surgery, mortality 2-5% at high-volume centers
  - Distal pancreatectomy with splenectomy for body/tail tumors
  - Adjuvant chemotherapy after resection - improves survival
  - FOLFIRINOX (5-FU, leucovorin, irinotecan, oxaliplatin) - most effective, for fit patients
  - Median OS 54 months with adjuvant FOLFIRINOX
  - Gemcitabine plus capecitabine - alternative, better tolerated
  - Gemcitabine alone - for patients unable to tolerate combination
  - Duration 6 months
  - Neoadjuvant therapy for borderline resectable disease
  - Chemotherapy +/- radiation before surgery
  - May downstage tumor to allow resection
  - FOLFIRINOX or gemcitabine/nab-paclitaxel for 2-6 months
  - Advanced/metastatic disease - palliative chemotherapy
  - First-line - FOLFIRINOX (if ECOG 0-1, good performance status)
  - Median OS 11 months vs 6.8 months with gemcitabine alone
  - Toxic - nausea, diarrhea, neuropathy, neutropenia
  - Alternative - gemcitabine plus nab-paclitaxel
  - Median OS 8.5 months, better tolerated than FOLFIRINOX
  - Gemcitabine alone - for ECOG 2 or poor performance status
  - Second-line options - 5-FU/oxaliplatin, MM-398 (liposomal irinotecan)
  - Targeted therapy
  - PARP inhibitors (olaparib, rucaparib) - for germline BRCA1/2 mutations (5-10% of patients)
  - Maintenance after platinum-based chemotherapy
  - Palliative interventions
  - Biliary stenting (ERCP with metal stent) for obstructive jaundice
  - Celiac plexus neurolysis (EUS-guided) for intractable pain
  - Pancreatic enzyme replacement (pancrelipase) for exocrine insufficiency
  - Insulin for diabetes management
  - Radiation therapy - limited role
  - May be used with chemoradiation for borderline resectable or locally advanced disease
  - Supportive care
  - Pain management - opioids, nerve blocks
  - Antiemetics
  - Nutritional support - high-calorie diet, pancreatic enzymes, fat-soluble vitamins
  - Palliative care referral early
clinical_pearls:
  - Fourth leading cause of cancer death in US, median age 71 years, slight male predominance
  - Extremely poor prognosis - overall 5-year survival less than 10%, median survival 6-12 months
  - Risk factors - smoking (20-30% of cases), chronic pancreatitis, diabetes, obesity, family history, hereditary syndromes (BRCA2, Lynch, Peutz-Jeghers)
  - 65% occur in pancreatic head, 15% body, 10% tail, 10% diffuse
  - Only 15-20% resectable at diagnosis (most have locally advanced or metastatic disease)
  - CA 19-9 useful for monitoring but not screening (low PPV in general population)
  - Whipple procedure complex - requires high-volume center (better outcomes)
  - Median survival resectable disease with surgery plus adjuvant chemo 20-24 months
  - New-onset diabetes in older patient without risk factors - consider pancreatic cancer
  - Courvoisier law - palpable non-tender gallbladder with jaundice suggests malignancy
  - Germline testing recommended for all pancreatic cancer (identify BRCA, Lynch - implications for treatment and family)
differentials:
  - Chronic pancreatitis (recurrent episodes, calcifications, alcohol history, no mass)
  - Pancreatic neuroendocrine tumor (better prognosis, different imaging characteristics, chromogranin A elevated)
  - Cholangiocarcinoma (biliary tree tumor, similar presentation)
  - Ampullary carcinoma (similar presentation but better prognosis)
  - Autoimmune pancreatitis (elevated IgG4, response to steroids, sausage-shaped pancreas)
  - Pancreatic cystic lesions (IPMN, mucinous cystic neoplasm - precancerous)
  - Metastases to pancreas (renal cell, melanoma)
trace:
  - 68-year-old man presents with 2-month history of progressive jaundice and weight loss
  - Noticed yellowing of eyes 2 months ago, gradually worsening
  - Dark urine, pale stools, itching all over body
  - 25-pound unintentional weight loss over 3 months
  - Poor appetite, feels full quickly
  - Dull epigastric abdominal pain radiating to back, worse lying down, better sitting forward
  - New diagnosis diabetes 6 months ago, started metformin
  - No prior history of gallstones or pancreatitis
  - Past medical history - hypertension, new-onset diabetes 6 months ago
  - Medications - lisinopril, metformin
  - Tobacco - 40 pack-year history, quit 10 years ago
  - Family history - no pancreatic cancer
  - Physical exam - appears jaundiced, cachectic
  - Vitals - normal, BMI 21 (thin)
  - Skin - jaundice, excoriations from scratching (pruritus)
  - Abdomen - soft, non-distended, palpable non-tender mass right upper quadrant (Courvoisier sign - palpable gallbladder)
  - Mild epigastric tenderness, no rebound
  - No hepatomegaly initially appreciated
  - Labs - total bilirubin 12.5 mg/dL (markedly elevated, normal less than 1.2), direct bilirubin 10.8 mg/dL (conjugated)
  - Alkaline phosphatase 680 U/L (markedly elevated), GGT 450 U/L (elevated)
  - AST 120 U/L, ALT 145 U/L (mildly elevated)
  - Albumin 3.2 g/dL (low)
  - CA 19-9 1850 U/mL (markedly elevated, normal less than 37)
  - Hemoglobin 10.5 g/dL (anemia)
  - Glucose 245 mg/dL (hyperglycemia)
  - Pancreatic protocol CT abdomen/pelvis with IV contrast
  - 3.5 cm hypoenhancing mass in head of pancreas
  - Pancreatic duct dilation (double duct sign with common bile duct dilation)
  - No definite arterial involvement (less than 180 degrees contact with SMA)
  - Equivocal small hypoattenuating liver lesions (possible metastases)
  - No ascites, no lymphadenopathy
  - MRI liver with contrast - confirms 2 small liver metastases (5 mm and 8 mm)
  - Diagnosis - Pancreatic adenocarcinoma, head of pancreas, metastatic disease (stage IV)
  - NOT surgical candidate due to liver metastases
  - EUS with FNA scheduled for tissue diagnosis
  - ERCP with biliary stenting for obstructive jaundice
  - EUS-FNA - adenocarcinoma confirmed, pancreatic ductal origin
  - ERCP - metal stent placed in common bile duct, successful biliary drainage
  - Oncology consultation - discuss treatment options
  - Performance status ECOG 1 (good functional status despite weight loss)
  - Germline genetic testing ordered (rule out BRCA, Lynch syndrome)
  - Treatment plan - palliative chemotherapy
  - FOLFIRINOX regimen initiated (fit patient, ECOG 1)
  - 5-FU 2400 mg/m2 continuous infusion 46 hours, leucovorin 400 mg/m2, irinotecan 180 mg/m2, oxaliplatin 85 mg/m2
  - Every 2 weeks
  - Antiemetics, growth factor support
  - Germline testing - no pathogenic variants identified
  - Supportive care
  - Pancreatic enzyme replacement (pancrelipase with meals)
  - Insulin started for diabetes management
  - Pain management - oxycodone ER plus breakthrough IR
  - Palliative care referral
  - Response assessment after 2 months (4 cycles FOLFIRINOX)
  - CT scan - stable liver metastases (no growth), primary tumor slightly smaller
  - CA 19-9 decreased to 450 U/mL (significant drop, suggests response)
  - Patient feels better, appetite improved, pain improved
  - Continue FOLFIRINOX
  - 6-month update - continued response
  - CA 19-9 320 U/mL (continued decline)
  - CT stable disease
  - Tolerating chemotherapy with manageable side effects (neuropathy grade 1, diarrhea controlled)
  - 12-month update - disease progression
  - CA 19-9 rising to 1200 U/mL
  - CT shows progression of liver metastases, new peritoneal implants
  - Symptoms worsening - increased pain, fatigue
  - Progression on first-line therapy
  - Second-line chemotherapy - 5-FU/leucovorin plus liposomal irinotecan
  - Tolerated 3 cycles, minimal benefit
  - Performance status declining ECOG 3
  - Transitioned to hospice care
  - Focus on comfort, pain control, quality of life
  - Patient died 15 months after diagnosis
  - Outcome - Typical course of metastatic pancreatic cancer, initial response to FOLFIRINOX with disease progression
