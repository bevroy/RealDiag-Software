tree_id: TRAUMA-MOTOR-VEHICLE-COLLISION
name: Motor Vehicle Collision Evaluation
family: emergency
specialty: Emergency Medicine, Trauma Surgery
chief_complaint: Motor vehicle accident, car crash
description: |
  Systematic evaluation after motor vehicle collision (MVC) to identify injuries.
  Requires high index of suspicion for occult injuries even with normal initial exam.
icd10: V49.9XXA
snomed: "242411005"
presentations:
  - History of motor vehicle collision
  - Visible trauma or patient complaint of pain
  - May have no immediate symptoms (adrenaline, delayed pain)
  - Mechanism details important - speed, restraints, airbag deployment, vehicle damage
urgency: Emergency
referrals:
  trauma_surgery:
    - High-energy mechanism
    - Multiple injuries
    - Unstable vital signs
    - Positive FAST exam or imaging showing significant injury
workup:
  primary_survey_abcde:
    - Airway with C-spine protection
    - Breathing and ventilation
    - Circulation and hemorrhage control
    - Disability (neurologic exam, GCS)
    - Exposure and environmental control
  mechanism_assessment:
    - Vehicle speed, intrusion, airbag deployment
    - Ejection from vehicle
    - Death of other passenger
    - Seatbelt use
    - Steering wheel deformity
  imaging_based_on_mechanism_and_exam:
    high_energy_mechanism:
      - CT head if any head injury or altered mental status
      - CT cervical spine (or clear clinically with NEXUS/CCR)
      - CT chest/abdomen/pelvis for blunt trauma evaluation
      - FAST exam at bedside for intraabdominal bleeding
    lower_energy_with_specific_complaints:
      - X-rays of symptomatic areas
      - CT as indicated by exam findings
  laboratory:
    - Type and screen if potential for significant injury
    - Hemoglobin if concern for bleeding
    - Urinalysis for hematuria
    - Pregnancy test in women of childbearing age
treatment:
  immediate_management:
    - Spine immobilization until cleared
    - Hemodynamic resuscitation if needed
    - Treat specific injuries identified
  common_injuries:
    chest_trauma:
      - Rib fractures, pulmonary contusion, pneumothorax
    abdominal_trauma:
      - Solid organ injury (spleen, liver, kidney)
      - Hollow viscus injury
    head_injury:
      - Concussion, intracranial hemorrhage
    cervical_spine:
      - Fracture, ligamentous injury
    seatbelt_injuries:
      - Chance fracture (lumbar spine)
      - Bowel injury
  disposition:
    - Admit if significant injuries or hemodynamic instability
    - Observation for delayed injury presentation
    - Discharge with reliable return precautions if minor or no injuries
clinical_pearls:
  - Adrenaline can mask pain initially - thorough exam essential
  - Seatbelt sign (bruising across chest/abdomen) indicates high energy transfer
  - Absence of external injury does not rule out internal injury
  - Delayed splenic rupture can occur days after injury
  - Children and pregnant women require special consideration
  - High-risk criteria - high speed, ejection, death of passenger, significant vehicle deformity
  - C-spine can be cleared clinically with NEXUS or CCR if low risk
differentials:
  - No significant injury
  - Minor soft tissue injury
  - Rib fractures
  - Pulmonary contusion
  - Solid organ injury (spleen, liver)
  - Bowel injury
  - Intracranial hemorrhage
  - Cervical spine fracture
  - Extremity fractures
trace:
  - 28-year-old restrained driver in 40mph head-on collision with airbag deployment. Complains of chest and neck pain. Exam shows seatbelt sign across chest, cervical tenderness. CT C-spine negative. CT chest shows multiple rib fractures without pneumothorax. Admit for pain control and observation. Discharged day 2 with rib fracture precautions.
citations:
  - Advanced Trauma Life Support (ATLS) Guidelines
  - Eastern Association for the Surgery of Trauma (EAST)
  - UpToDate - Trauma Surgery
