tree_id: ORTHO-ACHILLES-TENDINITIS
name: Achilles Tendinitis
family: orthopedics
specialty: Orthopedics
icd10: M76.60
snomed: 202882003
urgency: []
homeopathy: []
presentations:
  - Pain and stiffness in Achilles tendon region (2-6 cm above heel insertion)
  - Pain worse with first steps in morning or after rest
  - Pain with running, jumping, or climbing stairs
  - Tenderness to palpation along Achilles tendon
  - Thickening or nodularity of tendon
  - Morning stiffness that improves with activity
  - Gradual onset over weeks to months (chronic) vs acute onset (acute)
  - Risk factors: running, sudden increase in activity, fluoroquinolone antibiotics
  - May have crepitus with ankle movement
workup:
  - Clinical diagnosis based on history and physical examination
  - Physical examination
  - Tenderness 2-6 cm proximal to calcaneal insertion (midportion tendinopathy)
  - Or tenderness at insertion site (insertional tendinopathy)
  - Palpable tendon thickening or nodule
  - Pain with resisted ankle plantarflexion
  - Positive arc sign (tender area moves with dorsiflexion/plantarflexion)
  - Normal Thompson test (rules out Achilles rupture)
  - Assess for calf tightness and strength asymmetry
  - Imaging
  - Usually not needed for diagnosis
  - Ultrasound can assess tendon thickening, tears, peritendinous fluid
  - MRI if diagnosis uncertain or planning surgery
  - X-ray of heel if insertional tendinopathy (assess for Haglund deformity, calcification)
  - Assess for contributing factors
  - Training errors (rapid increase in mileage, intensity)
  - Poor footwear, worn-out shoes
  - Overpronation or high-arched feet
  - Calf muscle tightness or weakness
treatment:
  - Activity modification (first-line)
  - Relative rest - avoid aggravating activities (running, jumping)
  - Continue low-impact activities (swimming, cycling)
  - Gradual return to activity once pain-free
  - Eccentric strengthening exercises (most effective intervention)
  - Alfredson protocol: heel drops off step edge, slow eccentric lowering
  - 3 sets of 15 reps, twice daily for 12 weeks
  - 80-90% success rate with consistent eccentric exercises
  - Physical therapy
  - Eccentric strengthening program (heel drops)
  - Calf stretching (gastrocnemius and soleus)
  - Progressive loading and return-to-sport program
  - Address biomechanical factors
  - Ice massage 10-15 minutes after activity
  - Pharmacologic
  - NSAIDs: ibuprofen 600-800 mg TID for acute pain
  - Avoid chronic NSAID use (may impair tendon healing)
  - Avoid corticosteroid injections (high risk of tendon rupture)
  - Orthotics and footwear
  - Heel lift (reduces strain on Achilles by 10-15%)
  - Proper athletic shoes with adequate heel cushioning
  - Orthotics if overpronation or biomechanical issues
  - Advanced therapies (if conservative treatment fails)
  - Platelet-rich plasma (PRP) injections (emerging evidence)
  - Extracorporeal shockwave therapy (ESWT)
  - Surgical management (rarely needed)
  - Debridement of degenerative tissue
  - Gastrocnemius recession if severe calf tightness
  - Indications: failed conservative treatment >6 months
clinical_pearls:
  - "Achilles tendinopathy, not tendinitis - degenerative process, not inflammatory"
  - "Eccentric heel drops (Alfredson protocol) most effective treatment - 80-90% success"
  - "Pain that improves with activity ('warm-up' phenomenon) typical of tendinopathy"
  - "Avoid corticosteroid injections - high risk of tendon rupture (up to 40% risk)"
  - "Fluoroquinolone antibiotics (ciprofloxacin, levofloxacin) increase tendinopathy and rupture risk"
  - "Thompson test: squeeze calf, foot should plantarflex; if not = Achilles rupture"
  - "Midportion tendinopathy (2-6 cm from insertion) more common than insertional"
  - "Recovery typically 3-6 months with consistent eccentric exercises"
referrals:
  - Physical therapy for eccentric exercise program and biomechanical assessment
  - Sports medicine or orthopedics if refractory to conservative treatment >3-6 months
  - Podiatry for orthotic evaluation if biomechanical issues
  - Orthopedic surgery if considering surgical debridement
differentials:
  - Achilles tendinopathy (midportion or insertional, gradual onset, palpable thickening)
  - Achilles tendon rupture (sudden pop, inability to plantarflex, positive Thompson test)
  - Retrocalcaneal bursitis (pain anterior to Achilles at insertion, tender bursa)
  - Haglund deformity (bony prominence on posterior heel, insertional pain)
  - Sever disease (calcaneal apophysitis in children/adolescents)
  - Plantar fasciitis (heel pain on plantar surface, worse with first steps)
  - Posterior ankle impingement (posterior ankle pain, worse with plantarflexion)
  - Flexor hallucis longus tendinopathy (posteromedial ankle pain)
