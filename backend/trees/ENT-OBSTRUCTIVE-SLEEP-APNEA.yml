tree_id: ENT-OBSTRUCTIVE-SLEEP-APNEA
name: Obstructive Sleep Apnea
family: ent
specialty: Otolaryngology
icd10_code: G47.33

presentations:
  - Loud snoring
  - Witnessed apneas (breathing pauses during sleep)
  - Gasping or choking during sleep
  - Excessive daytime sleepiness
  - Morning headaches
  - Difficulty concentrating or memory problems
  - Irritability or mood changes
  - Nocturia (frequent nighttime urination)
  - Dry mouth or sore throat upon awakening
  - Unrefreshing sleep despite adequate sleep time
  - Falling asleep during sedentary activities (Epworth Sleepiness Scale >10)

workup:
  - History:
    - Snoring history and witnessed apneas (partner report)
    - Daytime sleepiness severity (Epworth Sleepiness Scale)
    - Sleep schedule and sleep hygiene
    - Medical history (hypertension, diabetes, stroke, atrial fibrillation, heart failure)
    - Medication review (sedatives, opioids)
    - Alcohol and tobacco use
    - Occupational history (commercial driver, safety-sensitive position)
  - Physical exam:
    - BMI and neck circumference (>17 inches men, >16 inches women increases risk)
    - Blood pressure measurement
    - Nasal examination (septal deviation, turbinate hypertrophy, polyps)
    - Oropharyngeal examination (Mallampati score, tonsillar size, palate position)
    - Retrognathia or micrognathia
    - Cardiovascular examination
  - Diagnostic studies:
    - Polysomnography (in-lab sleep study) - gold standard
    - Home sleep apnea testing (HSAT) - acceptable for moderate to high pretest probability
    - Apnea-Hypopnea Index (AHI) calculation
    - Overnight oximetry if sleep study unavailable
  - Severity classification:
    - Normal AHI <5 events/hour
    - Mild OSA AHI 5-14 events/hour
    - Moderate OSA AHI 15-29 events/hour
    - Severe OSA AHI >=30 events/hour

treatment:
  positive_airway_pressure:
    - CPAP (continuous positive airway pressure) - first-line therapy
    - CPAP titration study to determine optimal pressure
    - BiPAP (bilevel PAP) if CPAP intolerance or central sleep apnea component
    - Auto-adjusting PAP (APAP) as alternative
    - Heated humidification for comfort
    - Mask fitting (nasal, nasal pillows, full face)
    - CPAP adherence monitoring (goal >4 hours/night, >70% of nights)
  lifestyle_modifications:
    - Weight loss (7-10% weight loss can reduce AHI by 50%)
    - Positional therapy (avoid supine sleeping if positional OSA)
    - Alcohol avoidance before bedtime
    - Smoking cessation
    - Sleep hygiene optimization
    - Avoid sedatives and opioids
  oral_appliances:
    - Mandibular advancement device (MAD) for mild to moderate OSA
    - Custom-fitted by dentist trained in dental sleep medicine
    - Alternative if CPAP not tolerated
    - Less effective than CPAP but better adherence in some patients
  surgical_options:
    - Uvulopalatopharyngoplasty (UPPP) for palatal/tonsillar obstruction
    - Septoplasty or turbinate reduction for nasal obstruction
    - Tonsillectomy (especially pediatric OSA)
    - Genioglossus advancement or hyoid suspension
    - Maxillomandibular advancement (severe OSA, craniofacial abnormalities)
    - Hypoglossal nerve stimulation (Inspire therapy) for moderate to severe OSA with CPAP failure
    - Tracheostomy (severe life-threatening OSA as last resort)
  comorbidity_management:
    - Optimize treatment of hypertension
    - Glycemic control in diabetes
    - Weight management referral (bariatric surgery consideration)
    - Screen for depression and anxiety
    - Cardiovascular risk reduction

clinical_pearls:
  - OSA affects 10-17% of adults and is significantly underdiagnosed
  - Risk factors include obesity, male sex, age >40, neck circumference >17 inches, retrognathia, family history
  - OSA is associated with hypertension, stroke, atrial fibrillation, heart failure, diabetes, and motor vehicle accidents
  - CPAP reduces cardiovascular events and improves blood pressure control
  - Epworth Sleepiness Scale >10 suggests excessive daytime sleepiness
  - Positional OSA (supine-predominant) may respond to positional therapy devices
  - Children with OSA often present with hyperactivity and behavioral problems rather than sleepiness
  - Adenotonsillar hypertrophy is most common cause in children
  - CPAP adherence is major challenge (30-50% of patients discontinue within first year)
  - Home sleep apnea testing (HSAT) is acceptable for uncomplicated OSA but not for central sleep apnea or complex patients
  - Untreated severe OSA doubles mortality risk
  - Commercial drivers with OSA require documentation of treatment and adherence for DOT medical certification
  - Weight loss surgery can be curative for obesity-related OSA
  - Hypoglossal nerve stimulation requires absence of complete concentric collapse on drug-induced sleep endoscopy

trace:
  - Diagnostic criteria and AHI severity classification for obstructive sleep apnea
  - CPAP therapy efficacy and adherence strategies
  - Surgical treatment options and patient selection
  - Cardiovascular complications of untreated OSA

citations:
  - Epstein LJ, et al. (2009). Clinical guideline for the evaluation, management and long-term care of obstructive sleep apnea in adults. J Clin Sleep Med, 5(3), 263-276.
  - Kapur VK, et al. (2017). Clinical Practice Guideline for Diagnostic Testing for Adult Obstructive Sleep Apnea: An American Academy of Sleep Medicine Clinical Practice Guideline. J Clin Sleep Med, 13(3), 479-504.
  - Strollo PJ Jr, et al. (2014). Upper-airway stimulation for obstructive sleep apnea. N Engl J Med, 370(2), 139-49.
