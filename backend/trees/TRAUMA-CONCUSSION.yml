tree_id: TRAUMA-CONCUSSION
name: Concussion (Mild Traumatic Brain Injury)
family: TRAUMA
specialty: Emergency Medicine, Sports Medicine, Neurology
chief_complaint: Head trauma, Headache, Confusion, Memory problems
description: Comprehensive evaluation and management of concussion with return-to-play/activity guidelines
version: "1.0"
icd10: S06.0X0A
snomed: ["125670008", "110030002"]
author: RealDiag Clinical Team

entry_point: concussion_assessment

nodes:
  - id: concussion_assessment
    type: question
    text: "Patient with suspected concussion - Initial assessment?"
    clinical_pearls:
      - Concussion is a functional brain injury, not structural - CT/MRI often normal
      - Loss of consciousness occurs in <10% of concussions
      - Symptoms can be delayed up to 24-48 hours
      - Second impact syndrome is rare but potentially fatal
      - Chronic traumatic encephalopathy (CTE) risk with repeated concussions
    options:
      - label: "Red flags present (GCS <15, focal deficit, worsening symptoms, seizure, severe/worsening headache)"
        next: concussion_red_flags
      - label: "Typical concussion without red flags"
        next: standard_concussion
      - label: "Post-concussion syndrome (symptoms >4 weeks)"
        next: post_concussion_syndrome

  - id: concussion_red_flags
    type: diagnosis
    name: "Concussion with Red Flags"
    icd10: "S06.0X1A"
    snomed: ["125670008"]
    urgency: urgent
    clinical_pearls:
      - Red flags warrant immediate CT head and neurosurgical evaluation
      - Skull fracture, intracranial hemorrhage, cerebral edema must be ruled out
      - Age >65, anticoagulation, fall >3 feet increase bleed risk
    presentations:
      - GCS <15 at 2 hours post-injury
      - Focal neurologic deficit
      - Severe or worsening headache
      - Repeated vomiting (>2 episodes)
      - Seizure post-trauma
      - Signs of basilar skull fracture (Battle sign, raccoon eyes, hemotympanum, CSF leak)
      - Suspected open/depressed skull fracture
      - Coagulopathy or anticoagulant use
    workup:
      - Non-contrast CT head (STAT if GCS <15 or red flags)
      - Cervical spine imaging if mechanism suggests C-spine injury
      - Glasgow Coma Scale (GCS) every 15-30 minutes
      - Neurologic examination (cranial nerves, motor, sensory, cerebellar, mental status)
      - Assess for signs of basilar skull fracture
      - Coagulation studies if on anticoagulants
      - Consider admission for observation if abnormal CT or persistent symptoms
    treatment:
      - Emergency Department evaluation
      - Neurosurgery consult if positive CT findings
      - CT head immediately - do not delay
      - Cervical spine precautions until cleared
      - IV access, cardiac monitoring if severe
      - Avoid sedation until neurologic status stable
      - Admit for observation if CT abnormal or high-risk features
      - Hold anticoagulation if bleeding found
      - Serial neurologic exams
      - Strict return precautions - immediate return if symptoms worsen
    referrals:
      - Neurosurgery (if CT shows hemorrhage)
      - Trauma surgery (if polytrauma)
    management:
      - ICU monitoring if severe
      - Elevate head of bed 30 degrees
      - Avoid hypotension, hypoxia, hyperthermia
      - ICP monitoring if indicated

  - id: standard_concussion
    type: diagnosis
    name: "Concussion (Mild Traumatic Brain Injury)"
    icd10: "S06.0X0A"
    snomed: ["125670008", "110030002"]
    urgency: routine
    clinical_pearls:
      - Most concussions resolve within 7-14 days
      - Children/adolescents may take longer to recover (2-4 weeks)
      - Graduated return to activity is essential - "return to learn" before "return to play"
      - SCAT6 (Sport Concussion Assessment Tool) for standardized evaluation
      - Buffalo Concussion Treadmill Test can guide aerobic exercise prescription
      - Early (24-48h) light aerobic exercise may speed recovery
    presentations:
      - Headache (most common symptom)
      - Confusion or feeling "foggy"
      - Amnesia (retrograde or anterograde)
      - Dizziness or balance problems
      - Nausea
      - Sensitivity to light (photophobia) or noise (phonophobia)
      - Difficulty concentrating
      - Memory problems
      - Slowed reaction time
      - Sleep disturbances
      - Mood changes (irritability, sadness, anxiety)
      - Feeling "just not right"
    workup:
      - Clinical diagnosis based on history and exam
      - Glasgow Coma Scale (should be 15)
      - SCAT6 or ImPACT testing (if baseline available)
      - Balance assessment (BESS test)
      - Cervical spine examination
      - Neurologic examination (normal in uncomplicated concussion)
      - CT head NOT routinely indicated if GCS 15, no red flags, and mechanism not high-risk
      - Consider CT if age >60, significant mechanism, anticoagulation, or parental concern in children
      - Vestibular-ocular motor screening (VOMS)
    treatment:
      - Relative rest for 24-48 hours (not complete rest - can worsen symptoms)
      - Gradual return to normal activities as tolerated
      - Light aerobic exercise (walking, stationary bike) starting 24-48h post-injury if symptoms allow
      - Avoid contact sports, high-risk activities until cleared
      - Sleep hygiene - adequate sleep essential for recovery
      - Avoid alcohol and recreational drugs during recovery
      - Acetaminophen for headache (avoid NSAIDs for first 24h due to bleeding risk)
      - Return to school/work gradually with accommodations
      - Screen time limits if worsening symptoms
      - Graduated Return-to-Play Protocol (6 stages, 24h minimum per stage)
      - Stage 1 - Symptom-limited activity (daily activities, no sports)
      - Stage 2 - Light aerobic exercise (walking, swimming, stationary bike, no resistance)
      - Stage 3 - Sport-specific exercise (no head impact)
      - Stage 4 - Non-contact training drills
      - Stage 5 - Full contact practice
      - Stage 6 - Return to play/competition
      - If symptoms worsen at any stage, return to previous stage
    referrals:
      - Sports medicine or concussion specialist if symptoms persist >2 weeks
      - Neuropsychology for cognitive testing if indicated
      - Vestibular/physical therapy for balance/vestibular symptoms
      - Return to primary care in 1-2 weeks for reassessment
    management:
      - Education on concussion and expected recovery
      - Written return precautions - return immediately if worsening symptoms, repeated vomiting, severe headache, seizure, focal weakness
      - No driving until symptom-free
      - Academic accommodations (extra time, reduced workload, rest breaks)
      - Avoid activities with high re-injury risk
      - Follow-up in 24-48 hours or sooner if symptoms worsen

  - id: post_concussion_syndrome
    type: diagnosis
    name: "Post-Concussion Syndrome"
    icd10: "F07.81"
    snomed: ["125670008"]
    urgency: routine
    clinical_pearls:
      - Defined as symptoms persisting >4 weeks (adults) or >4 weeks (children)
      - Affects 10-15% of concussion patients
      - Risk factors - female sex, prior concussion, migraine history, mood disorders
      - Multidisciplinary approach often needed
      - May benefit from sub-threshold aerobic exercise
    presentations:
      - Persistent headache (>4 weeks post-injury)
      - Cognitive difficulties (concentration, memory)
      - Fatigue
      - Sleep disturbances
      - Mood changes (depression, anxiety, irritability)
      - Dizziness/balance problems
      - Visual disturbances
      - Sensitivity to light/noise
    workup:
      - Detailed symptom inventory
      - Neuropsychological testing (cognitive function)
      - Vestibular testing if dizziness prominent
      - MRI brain (usually normal, but rules out structural lesions)
      - Cervical spine evaluation (whiplash-associated disorder common)
      - Screen for depression, anxiety, PTSD
      - Consider sleep study if sleep-disordered breathing suspected
      - Assess for medication overuse headache
    treatment:
      - Sub-threshold aerobic exercise (Buffalo Protocol) - key intervention
      - Cognitive behavioral therapy (CBT) for coping strategies
      - Headache management (tricyclics like amitriptyline, topiramate)
      - Treat comorbid conditions (migraine, cervical strain, mood disorders)
      - Vestibular rehabilitation therapy if vestibular symptoms
      - Vision therapy if visual symptoms
      - Sleep hygiene and treatment of insomnia
      - Gradual return to activities with pacing/energy conservation
      - Avoid complete rest (deconditioning worsens symptoms)
      - Address psychosocial factors (stress, secondary gain)
    referrals:
      - Concussion specialist or sports medicine
      - Neuropsychology
      - Physical therapy (cervical, vestibular)
      - Psychiatry if significant mood disorder
      - Occupational therapy for return-to-work planning
      - Headache specialist/neurology if refractory headaches
    management:
      - Multidisciplinary coordinated care
      - Regular follow-up every 2-4 weeks
      - Reassurance and expectation management
      - Address barriers to recovery
      - Return-to-work/school planning with accommodations
