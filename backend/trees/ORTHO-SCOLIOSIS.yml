tree_id: ORTHO-SCOLIOSIS
name: Scoliosis
family: orthopedics
specialty: Orthopedics
icd10: M41.9
snomed: 298382003
urgency: []
homeopathy: []
presentations:
  - Lateral curvature of spine (may be asymptomatic)
  - Uneven shoulders or shoulder blades
  - One hip higher than the other
  - Asymmetric waistline
  - Rib prominence when bending forward (rib hump)
  - Visible spinal curve
  - Back pain (more common in adults than children)
  - May have family history of scoliosis
  - Most cases detected on school screening or routine physical exam
  - Adolescent idiopathic scoliosis most common (age 10-18)
workup:
  - Physical examination
  - Forward bend test (Adam's test) - patient bends forward, observe for rib hump
  - Rib hump >5-7 degrees suggests significant scoliosis
  - Shoulder height asymmetry
  - Pelvic height asymmetry (rule out leg length discrepancy)
  - Waist crease asymmetry
  - Assess skeletal maturity (Tanner staging, growth potential)
  - Neurologic exam (rule out neuromuscular causes)
  - Skin exam for café-au-lait spots (neurofibromatosis), midline defects
  - Imaging
  - Standing AP and lateral spine X-rays (full spine, scoliosis series)
  - Measure Cobb angle - quantifies curve severity
  - <10 degrees: spinal asymmetry, not true scoliosis
  - 10-25 degrees: mild scoliosis
  - 25-40 degrees: moderate scoliosis
  - >40-50 degrees: severe scoliosis
  - Assess skeletal maturity (Risser sign 0-5 on iliac crest apophysis)
  - Risser 0-2: significant growth remaining (high risk progression)
  - Risser 4-5: skeletal maturity (low risk progression)
  - MRI spine if neurologic findings, atypical curve, rapid progression, age <10
  - Rule out syrinx, tethered cord, tumor, Chiari malformation
  - Classification of scoliosis
  - Idiopathic (80-85%): adolescent (age 10-18), juvenile, infantile
  - Congenital: vertebral anomalies present at birth
  - Neuromuscular: cerebral palsy, muscular dystrophy, spinal cord injury
  - Syndromic: Marfan, Ehlers-Danlos, neurofibromatosis
treatment:
  - Treatment based on age, curve severity, skeletal maturity, progression risk
  - Observation (Cobb angle <25 degrees, skeletally mature)
  - Monitor with serial X-rays every 6-12 months
  - No restrictions on activity or sports
  - Physical therapy not proven to prevent progression but may help with pain/flexibility
  - Bracing (Cobb angle 25-40 degrees, skeletally immature)
  - Goal: prevent curve progression, not correct existing curve
  - Thoracolumbosacral orthosis (TLSO) most common
  - Worn 16-23 hours/day (compliance critical)
  - Continue until skeletal maturity (Risser 4-5)
  - 70-80% success rate preventing progression >5 degrees
  - Regular follow-up every 4-6 months with X-rays
  - Surgical management (spinal fusion)
  - Indications
  - Curve >40-50 degrees (high risk progression in adulthood)
  - Documented progression despite bracing
  - Severe pain or neurologic compromise
  - Cardiopulmonary compromise (rare, very severe curves >70-80 degrees)
  - Posterior spinal fusion with instrumentation (rods, screws)
  - Anterior approach for some thoracolumbar curves
  - Typically performed age 12-14 after growth spurt
  - Pain management if symptomatic
  - NSAIDs, physical therapy, activity modification
clinical_pearls:
  - "Adolescent idiopathic scoliosis affects 2-4% of adolescents, more common in girls (7:1 ratio for curves >20 degrees)"
  - "Most scoliosis is asymptomatic - back pain in adolescent with scoliosis warrants MRI (rule out tumor, syrinx)"
  - "Curves <20 degrees rarely progress after skeletal maturity"
  - "Curves 20-40 degrees may progress 1-2 degrees/year after maturity"
  - "Curves >50 degrees at maturity likely to progress throughout life (1 degree/year)"
  - "Right thoracic curve most common pattern in idiopathic scoliosis"
  - "Left thoracic curve or rapid progression raises concern for secondary causes (MRI indicated)"
  - "Bracing only effective in skeletally immature patients (Risser 0-2)"
referrals:
  - Pediatric orthopedic spine specialist for all curves >20-25 degrees
  - Refer earlier if rapid progression, neurologic findings, atypical features, or age <10
  - Neurosurgery if MRI shows intraspinal pathology (tumor, syrinx, tethered cord)
differentials:
  - Idiopathic scoliosis (adolescent, juvenile, infantile - no underlying cause)
  - Congenital scoliosis (vertebral anomalies, hemivertebrae, fused segments)
  - Neuromuscular scoliosis (cerebral palsy, muscular dystrophy, spina bifida)
  - Syndromic scoliosis (Marfan, neurofibromatosis, Ehlers-Danlos)
  - Leg length discrepancy causing functional scoliosis (resolves with leveling blocks)
  - Scheuermann kyphosis (thoracic kyphosis >45 degrees, anterior wedging vertebrae)
