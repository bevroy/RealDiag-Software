presentations:
  - Sudden onset severe testicular pain (unilateral)
  - Nausea, vomiting (50%)
  - Absent cremasteric reflex (99% sensitive)
  - High-riding testis, horizontal lie
  - Swelling, erythema, scrotal edema
  - 'Negative Prehn sign: Elevation does NOT relieve pain (vs epididymitis)'
  - 'Peak ages: Neonates and 12-18 years'
  - 'Time-critical: Testicular salvage 90% if <6 hours, <50% if 6-12 hours, <10% if >12 hours'
differentials:
  - Epididymitis
  - Orchitis
  - Torsion of appendix testis
  - Hernia
  - Trauma
workup:
  - 'Cremasteric reflex: Absent in 99% of torsion (stroke inner thigh, normal = testicle retracts)'
  - 'Doppler ultrasound: Decreased or absent blood flow (don''t delay surgery for this)'
  - 'Physical exam: High-riding testis, horizontal lie, firm tender testis'
treatment:
  - 'Guideline-based treatment options for Testicular Torsion include:'
  - 'Immediate: IV access, analgesia (morphine, ketorolac), urgent urology consult (ACEP 2023)'
  - 'Manual detorsion attempt: Rotate affected testis OUTWARD (medial border toward thigh) 180-720° until pain relief (ACEP 2023)'
  - 'If pain worsens: Stop and rotate in opposite direction (ACEP 2023)'
  - 'Ultrasound only if diagnosis uncertain AND surgery will not be delayed: Color Doppler shows decreased flow (ACEP 2023)'
  - 'Disposition: Emergent OR for surgical detorsion + bilateral orchiopexy (fix both testes to prevent recurrence) (ACEP 2023)'
clinical_pearls:
  - Absent cremasteric reflex = torsion until proven otherwise (99% sensitive, 100% NPV)
  - 'Do NOT delay surgery for imaging if high suspicion: Ultrasound can give false negatives'
  - 'Color Doppler ultrasound: Decreased/absent testicular blood flow (but don''t delay surgery)'
  - '6-hour window critical: Testicular salvage depends on time to detorsion'
  - 'Manual detorsion: ''Open the book'' - rotate affected testis outward (lateral to medial) 180-720°'
  - 'All patients need surgery: Detorsion + orchiopexy bilaterally (contralateral testis at risk)'
