tree_id: PULM-INTERSTITIAL-LUNG-DISEASE
name: Interstitial Lung Disease
family: Pulmonology
specialty: Pulmonology
chief_complaint: Progressive dyspnea and dry cough
description: |
  Heterogeneous group of disorders causing inflammation and fibrosis of lung interstitium. Idiopathic pulmonary fibrosis (IPF) most common, others include connective tissue disease-ILD, hypersensitivity pneumonitis, sarcoidosis.
  Progressive restrictive lung disease leading to respiratory failure. IPF has poor prognosis (median survival 3-5 years).
icd10: J84.9
urgency: Moderate
workup:
  - Clinical presentation - progressive exertional dyspnea, dry cough, bibasilar inspiratory crackles (Velcro rales), clubbing in IPF
  - Pulmonary function tests - restrictive pattern (FVC reduced, FEV1/FVC ratio normal or increased), reduced DLCO
  - High-resolution CT chest (HRCT) without contrast - diagnostic for IPF if classic usual interstitial pneumonia (UIP) pattern
  - UIP pattern - bibasilar, subpleural reticulation, honeycombing, traction bronchiectasis, absence of features inconsistent with UIP (upper/mid lung predominance, nodules, ground glass)
  - Other HRCT patterns - nonspecific interstitial pneumonia (NSIP), organizing pneumonia, hypersensitivity pneumonitis
  - Six-minute walk test - assess functional capacity, desaturation (oxygen requirement)
  - Chest X-ray - reticular opacities, decreased lung volumes (not sensitive, HRCT preferred)
  - Serologic testing - ANA, RF, anti-CCP (connective tissue disease), hypersensitivity pneumonitis panel if exposure history
  - Surgical lung biopsy (VATS) if HRCT pattern indeterminate and diagnosis needed to guide treatment
  - Multidisciplinary discussion (pulmonologist, radiologist, pathologist) for diagnosis
  - Bronchoscopy with bronchoalveolar lavage if infection, malignancy, or hypersensitivity pneumonitis suspected
treatment:
  - Idiopathic pulmonary fibrosis (IPF) - antifibrotic therapy slows progression
  - Nintedanib 150mg PO BID (tyrosine kinase inhibitor) or pirfenidone 801mg PO TID - reduce FVC decline by 50%, delay disease progression
  - Side effects - nintedanib (diarrhea, nausea, elevated transaminases), pirfenidone (photosensitivity, GI upset)
  - No role for corticosteroids or immunosuppression in IPF (may worsen outcomes)
  - Supplemental oxygen if SpO2 less than 88% at rest or with exertion
  - Pulmonary rehabilitation improves quality of life and exercise capacity
  - Treat gastroesophageal reflux (may worsen IPF) - PPI therapy
  - Lung transplant evaluation for eligible patients (age less than 65, no significant comorbidities) - only definitive treatment for IPF
  - Connective tissue disease-ILD - immunosuppression may help (mycophenolate, cyclophosphamide, rituximab)
  - Hypersensitivity pneumonitis - antigen avoidance critical, corticosteroids for acute/subacute
  - Sarcoidosis - systemic corticosteroids if significant symptoms or organ involvement
  - Supportive care - vaccinations (pneumococcal, influenza), smoking cessation, avoid environmental exposures
  - Palliative care for end-stage disease
clinical_pearls:
  - IPF typically older adults (greater than 60 years), more common in men, strong association with smoking
  - Acute exacerbation of IPF - rapid worsening (days to weeks), new ground-glass opacities on CT, high mortality (50% at 3 months)
  - Honeycombing on CT hallmark of advanced fibrosis, irreversible
  - Hypersensitivity pneumonitis from inhaled organic antigens (bird droppings, mold, hot tubs) - history of exposure key
  - Drug-induced ILD - amiodarone, bleomycin, methotrexate, nitrofurantoin
  - Connective tissue diseases with ILD - systemic sclerosis (most common), rheumatoid arthritis, polymyositis/dermatomyositis
differentials:
  - Congestive heart failure
  - Chronic obstructive pulmonary disease
  - Pneumonia
  - Pulmonary embolism
  - Lung cancer
  - Occupational lung disease
trace:
  - 68-year-old former smoker with progressive dyspnea on exertion x 18 months, dry cough → Exam shows bibasilar inspiratory crackles, digital clubbing, SpO2 92% on room air → PFTs show FVC 58% predicted, FEV1/FVC 0.85, DLCO 48% predicted (restrictive pattern) → HRCT chest shows bibasilar and subpleural reticulation, honeycombing, traction bronchiectasis, UIP pattern → Labs (ANA, RF) negative → Multidisciplinary discussion confirms idiopathic pulmonary fibrosis → 6-minute walk 320 meters with desaturation to 84% → Diagnose IPF with moderate impairment → Start nintedanib 150mg PO BID, manage diarrhea with loperamide → Supplemental oxygen 2L at rest, 4L with exertion → Refer for pulmonary rehabilitation and lung transplant evaluation → Omeprazole 40mg daily for GERD → Follow PFTs every 3-6 months, FVC decline slowed on antifibrotic therapy
