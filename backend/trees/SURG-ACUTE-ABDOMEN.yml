presentations:
  - Sudden severe abdominal pain
  - Peritoneal signs (guarding, rebound)
  - Rigidity
  - Absent bowel sounds
  - Requires urgent surgical evaluation
  - Free air on imaging suggests perforation
differentials:
  - Appendicitis
  - Cholecystitis
  - Perforated ulcer
  - Bowel obstruction
  - Ectopic pregnancy
  - Pancreatitis
workup: []
treatment:
  - NPO (nothing by mouth), IV fluids resuscitation
  - Nasogastric tube if bowel obstruction or severe vomiting
  - Broad-spectrum antibiotics if suspected perforation or ischemia - piperacillin-tazobactam 3.375g IV Q6H + metronidazole
  - Urgent surgical consultation for peritonitis, perforation, ischemia
  - CT abdomen/pelvis with IV contrast - diagnostic test of choice
  - Pain control - IV opioids acceptable (does not mask exam)
  - Serial abdominal exams Q4-6H to monitor progression
  - 'Emergency surgery indications: Free air, peritonitis, unstable vitals, ischemic bowel'
  - 'Perforated viscus: Emergent exploratory laparotomy'
  - 'Bowel obstruction: Decompress with NG, surgery if strangulation/complete/no improvement'
  - 'Appendicitis: Laparoscopic appendectomy'
  - 'Cholecystitis: Laparoscopic cholecystectomy (within 72 hours)'
