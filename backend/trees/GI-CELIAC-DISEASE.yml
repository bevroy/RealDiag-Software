tree_id: GI-CELIAC-DISEASE
name: Celiac Disease
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Chronic diarrhea and abdominal pain
description: |
  Autoimmune disorder triggered by gluten (wheat, barley, rye) causing small intestinal inflammation and villous atrophy. Affects 1% of population.
  Strongly associated with HLA-DQ2 (95%) and HLA-DQ8. Classic presentation diarrhea and malabsorption, but many have minimal GI symptoms. Increased risk of lymphoma if untreated.
icd10: K90.0
urgency: Low
workup:
  - Serologic testing while on gluten-containing diet - tissue transglutaminase IgA (TTG-IgA) most sensitive and specific (95%)
  - Endomysial antibody IgA (EMA-IgA) very specific (98%) but more expensive
  - Total IgA level - 2-3% of celiac patients have IgA deficiency (false negative TTG-IgA and EMA-IgA)
  - If IgA deficient, check TTG-IgG and deamidated gliadin peptide IgG
  - Upper endoscopy with duodenal biopsies (at least 4-6 samples from duodenum and bulb) if positive serology
  - Histology shows villous atrophy, crypt hyperplasia, increased intraepithelial lymphocytes (Marsh classification)
  - HLA-DQ2/DQ8 testing if diagnosis uncertain - negative has high negative predictive value (rules out celiac)
  - Assess for nutritional deficiencies - iron, folate, vitamin B12, vitamin D, calcium, zinc
  - Bone density (DEXA) if diagnosed as adult - osteopenia/osteoporosis common
  - Screen first-degree relatives - 10% have celiac disease
  - Monitoring after diagnosis - TTG-IgA at 6 months and annually (should normalize on gluten-free diet), repeat endoscopy if persistent symptoms despite diet
treatment:
  - Strict lifelong gluten-free diet - avoid wheat, barley, rye (oats contaminated unless certified gluten-free)
  - Consultation with dietitian experienced in celiac disease - label reading, cross-contamination avoidance, meal planning
  - Hidden sources of gluten - sauces, soups, processed foods, medications, communion wafers
  - Most patients improve within weeks, complete healing takes 6-24 months
  - Nutritional supplementation - iron, folate, calcium 1200mg daily, vitamin D 800-1000 IU (treat deficiencies aggressively)
  - Pneumococcal vaccine (hyposplenism risk)
  - Refractory celiac disease (persistent symptoms and villous atrophy despite strict gluten-free diet x 6-12 months) - rule out inadvertent gluten exposure, consider enteropathy-associated T-cell lymphoma
  - Type I refractory (polyclonal T cells) - treat with steroids
  - Type II refractory (clonal T cells) - high risk of lymphoma, may need immunosuppression or chemotherapy
  - Associated conditions - dermatitis herpetiformis (treat with dapsone 50-200mg daily plus gluten-free diet), type 1 diabetes, autoimmune thyroid disease, IgA nephropathy
clinical_pearls:
  - Must be eating gluten when tested - at least 1-2 slices bread daily x 6 weeks before serology/biopsy
  - Silent celiac (positive serology and villous atrophy but asymptomatic) and latent celiac (positive serology, normal biopsy) exist
  - Dermatitis herpetiformis pathognomonic - intensely pruritic vesicular rash on extensor surfaces, responds to gluten-free diet
  - Non-celiac gluten sensitivity controversial entity - symptoms improve with gluten avoidance but negative serology and normal biopsy
  - Increased risk of small bowel adenocarcinoma and enteropathy-associated T-cell lymphoma (rare, poor prognosis)
  - Fertility issues improve with gluten-free diet
differentials:
  - Irritable bowel syndrome
  - Inflammatory bowel disease
  - Lactose intolerance
  - Small intestinal bacterial overgrowth
  - Tropical sprue
  - Whipple disease
trace:
  - 32-year-old woman with chronic diarrhea 4-6 times daily, abdominal bloating, fatigue x 2 years → Labs show iron deficiency anemia (Hgb 9.8, ferritin 8), low vitamin D → TTG-IgA elevated 85 U/mL (normal less than 20), total IgA normal → Upper endoscopy with duodenal biopsies shows Marsh 3b (subtotal villous atrophy, crypt hyperplasia) → Diagnose celiac disease → Refer to dietitian for gluten-free diet education → Start iron supplementation 325mg daily, calcium 1200mg, vitamin D 2000 IU → Symptoms improve significantly within 3 weeks → DEXA shows osteopenia, continue calcium and vitamin D → Repeat TTG-IgA at 6 months normalizes to 12 U/mL → Repeat endoscopy at 1 year shows improved villous architecture → Continues strict gluten-free diet, annual TTG monitoring, joined celiac support group
