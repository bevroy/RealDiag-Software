tree_id: ENDO-THYROIDITIS
name: Thyroiditis
family: endocrinology
specialty: Endocrinology
icd10: E06.9
snomed: 66944004
urgency: []
homeopathy: []
presentations:
  - Anterior neck pain or tenderness (subacute thyroiditis)
  - Thyroid enlargement or goiter
  - Symptoms of hyperthyroidism initially (anxiety, palpitations, tremor, weight loss)
  - Followed by hypothyroid phase (fatigue, weight gain, cold intolerance)
  - Fever and malaise (subacute thyroiditis)
  - Recent upper respiratory infection (viral prodrome)
  - Painful swallowing or dysphagia
  - Postpartum onset (postpartum thyroiditis - within 1 year after delivery)
  - May be asymptomatic (chronic lymphocytic thyroiditis/Hashimoto's)
workup:
  - Thyroid function tests
  - TSH, free T4, free T3
  - Pattern: initial hyperthyroid phase (low TSH, high T4/T3) → euthyroid → hypothyroid phase
  - Inflammatory markers
  - Erythrocyte sedimentation rate (ESR) - markedly elevated in subacute thyroiditis (often >50-100)
  - C-reactive protein (CRP) - elevated
  - Thyroid antibodies
  - Anti-TPO and anti-thyroglobulin - positive in Hashimoto thyroiditis, negative in subacute
  - TSH receptor antibodies - negative (differentiates from Graves' disease)
  - Radioactive iodine uptake (RAIU) scan
  - Low uptake in thyroiditis (vs high in Graves' disease)
  - Helps differentiate destructive thyroiditis from hyperthyroidism
  - Thyroid ultrasound
  - Diffusely heterogeneous hypoechoic gland in Hashimoto's
  - Decreased vascularity in subacute thyroiditis
  - Fine needle aspiration if concern for malignancy or abscess
treatment:
  - Subacute (De Quervain) thyroiditis - self-limited
  - NSAIDs (ibuprofen 600-800 mg TID) for mild pain
  - Prednisone 40 mg daily for severe pain, taper over 4-6 weeks
  - Beta-blockers (propranolol 20-40 mg TID) for hyperthyroid symptoms
  - Levothyroxine if prolonged hypothyroid phase (usually transient)
  - Usually resolves in 2-6 months
  - Chronic lymphocytic thyroiditis (Hashimoto thyroiditis)
  - Levothyroxine if hypothyroid (TSH >10 or symptomatic)
  - Start 1.6 mcg/kg/day, adjust to normalize TSH
  - Lifelong treatment typically required
  - Observation if euthyroid with mild elevation in antibodies
  - Postpartum thyroiditis
  - Beta-blockers for hyperthyroid phase (avoid antithyroid drugs - not Graves')
  - Levothyroxine if symptomatic hypothyroid phase
  - 80% resolve within 1 year, but 20-30% develop permanent hypothyroidism
  - Acute suppurative thyroiditis (rare)
  - IV antibiotics (cover Staph, Strep, anaerobes)
  - Surgical drainage if abscess
  - Painful thyroiditis monitoring
  - Repeat thyroid function tests every 4-6 weeks until stable
clinical_pearls:
  - "Subacute thyroiditis classically presents with painful thyroid after viral URI"
  - "Triphasic course: hyperthyroid (2-6 weeks) → euthyroid → hypothyroid (2-6 months) → recovery"
  - "Extremely elevated ESR (>50-100) characteristic of subacute thyroiditis"
  - "Low radioactive iodine uptake in thyroiditis vs high uptake in Graves' disease"
  - "Hashimoto thyroiditis most common cause of hypothyroidism in iodine-sufficient areas"
  - "Postpartum thyroiditis occurs in 5-10% of women within first year after delivery"
  - "Pain distinguishes subacute thyroiditis from painless (silent) thyroiditis"
  - "Recurrence of subacute thyroiditis rare (<2%)"
referrals:
  - Endocrinology for diagnosis confirmation and management
  - Otolaryngology if concern for abscess or need for drainage
  - Obstetrics for postpartum thyroiditis management
differentials:
  - Subacute (De Quervain) thyroiditis - painful, elevated ESR, post-viral
  - Chronic lymphocytic thyroiditis (Hashimoto) - painless, anti-TPO positive, hypothyroidism
  - Postpartum thyroiditis - within 1 year after delivery, painless, transient
  - Silent (painless) thyroiditis - like postpartum but not related to pregnancy
  - Acute suppurative thyroiditis - rare, bacterial infection, severe pain, fever, abscess
  - Graves' disease - hyperthyroidism, high RAIU, TSH receptor antibodies positive
  - Radiation-induced thyroiditis - history of radioactive iodine treatment
  - Drug-induced thyroiditis (amiodarone, interferon, lithium, checkpoint inhibitors)
trace:
  source: ATA Guidelines on Thyroiditis 2016, Endocrine Society Clinical Practice Guidelines
  version: '1.0'
