tree_id: ORTHO-CARPAL-TUNNEL-SYNDROME
name: Carpal Tunnel Syndrome
family: Orthopedics
specialty: Orthopedics
chief_complaint: Hand numbness and tingling
description: |
  Compression of median nerve in carpal tunnel at wrist. Most common entrapment neuropathy.
  Affects 3-6% of adults, more common in women. Risk factors include repetitive hand use, pregnancy, diabetes, hypothyroidism, obesity, rheumatoid arthritis.
icd10: G56.00
urgency: Low
workup:
  - Clinical diagnosis - numbness/tingling in median nerve distribution (thumb, index, middle, radial half of ring finger)
  - Symptoms worse at night, improved by shaking hand (flick sign)
  - Tinel sign (tapping over median nerve at wrist reproduces paresthesias) - 60% sensitive
  - Phalen test (wrist flexion 60 seconds reproduces symptoms) - 75% sensitive
  - Decreased two-point discrimination in affected fingers
  - Thenar atrophy in severe chronic cases
  - Nerve conduction studies (NCS) and EMG confirm diagnosis - prolonged distal motor latency, decreased sensory conduction velocity
  - Rule out cervical radiculopathy (C6-C7) with neck exam and imaging if atypical presentation
treatment:
  - Conservative treatment for mild-moderate symptoms - wrist splint in neutral position at night
  - NSAIDs for pain (ibuprofen 600mg TID)
  - Corticosteroid injection into carpal tunnel (triamcinolone 40mg) provides temporary relief (3-6 months)
  - Ergonomic modifications - keyboard position, frequent breaks, avoid repetitive forceful gripping
  - Treat underlying conditions (diabetes control, thyroid replacement)
  - Surgical release if conservative treatment fails after 6 months, severe symptoms, thenar atrophy, or abnormal two-point discrimination
  - Open carpal tunnel release or endoscopic release - divide transverse carpal ligament to decompress nerve
  - Surgery 90% effective, faster recovery with endoscopic approach
  - Post-operative splint for 1-2 weeks, return to light activities 2-4 weeks
clinical_pearls:
  - Night symptoms classic (wrist flexion during sleep increases carpal tunnel pressure)
  - Spares hypothenar eminence and fifth finger (ulnar nerve distribution)
  - Pregnancy-related CTS often resolves postpartum (fluid retention causes compression)
  - Bilateral symptoms more common than unilateral
  - Weakness of thumb opposition and abduction suggests advanced disease
  - Durkan test (direct pressure over carpal tunnel 30 seconds) most sensitive provocative test
differentials:
  - Cervical radiculopathy
  - Thoracic outlet syndrome
  - Median nerve compression at forearm (pronator syndrome)
  - Ulnar neuropathy
  - Polyneuropathy
  - Multiple sclerosis
trace:
  - Numbness and tingling in thumb, index, middle fingers x 6 months, worse at night, wakes from sleep → Positive Phalen and Tinel signs → Thenar muscle strength intact → Nerve conduction study shows prolonged median nerve distal latency → Diagnose moderate carpal tunnel syndrome → Night wrist splint in neutral position → NSAIDs → Symptoms improve 30% → Persistent symptoms at 3 months → Corticosteroid injection → Relief for 2 months, symptoms recur → Refer for carpal tunnel release → Endoscopic release performed → Symptoms resolve, return to work 3 weeks
