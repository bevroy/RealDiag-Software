tree_id: ORTHO-CARPAL-TUNNEL-SYNDROME
name: Carpal Tunnel Syndrome
family: musculoskeletal
specialty: Orthopedics
chief_complaint: Hand numbness, tingling, pain worse at night
description: Median nerve compression at the wrist within the carpal tunnel
icd10: G56.00
urgency: routine
workup:
  - Clinical diagnosis based on history and physical examination
  - Tinel sign (tap over median nerve at wrist - positive if paresthesias in median distribution)
  - Phalen test (wrist flexion 60 seconds - positive if reproduces symptoms)
  - Durkan test (direct compression over carpal tunnel - positive if symptoms)
  - Assess thenar atrophy (severe, chronic cases)
  - Two-point discrimination (greater than 6 mm abnormal)
  - Median nerve sensory distribution (thumb, index, middle, radial half of ring finger, palm spared)
  - Motor testing - thumb abduction weakness (abductor pollicis brevis)
  - Nerve conduction studies (NCS) and EMG - confirms diagnosis, assesses severity
  - Prolonged distal motor latency greater than 4.5 ms and sensory latency greater than 3.5 ms
  - X-rays wrist if trauma, to rule out fracture or arthritis
  - MRI wrist if atypical presentation or space-occupying lesion suspected
  - Lab workup - TSH, glucose, rheumatoid factor if secondary cause suspected
treatment:
  - Conservative management first-line for mild-moderate cases
  - Wrist splint in neutral position, especially at night (6-12 weeks trial)
  - Activity modification - avoid repetitive wrist flexion/extension, forceful gripping
  - NSAIDs for pain control (ibuprofen 400-600 mg TID)
  - Corticosteroid injection - 1 mL triamcinolone 40 mg/mL plus 1 mL 1% lidocaine into carpal tunnel
  - Provides temporary relief 1-3 months, repeat injection reasonable if initial good response
  - Vitamin B6 (pyridoxine) 100-200 mg daily - limited evidence
  - Surgical carpal tunnel release for severe symptoms, thenar atrophy, failed conservative treatment
  - Open release or endoscopic technique (similar outcomes, endoscopic faster recovery)
  - Divide transverse carpal ligament to decompress median nerve
  - Post-op - early finger ROM, return to light activity 2-4 weeks, full recovery 3-6 months
  - Treat underlying conditions (diabetes, hypothyroidism, rheumatoid arthritis)
clinical_pearls:
  - Most common entrapment neuropathy, affects 3-6% of adults
  - Female-to-male ratio 3:1, peak incidence age 40-60
  - Nocturnal symptoms classic - patients shake/flick hand to relieve numbness
  - Palm spared (palmar cutaneous branch of median nerve branches proximal to carpal tunnel)
  - Bilateral in 50% of cases, dominant hand usually more symptomatic
  - Pregnancy-associated CTS often resolves postpartum
  - Flick sign - patient demonstrates shaking/flicking hand for relief (highly specific)
  - Nerve conduction studies normal in 10-15% with clinical CTS (false negative)
  - Surgical success rate 75-90% for typical CTS, better for acute than chronic
  - EMG fibrillation potentials in thenar muscles indicate severe denervation - surgery urgent
differentials:
  - Cervical radiculopathy (C6-C7) - neck pain, dermatomal pattern, positive Spurling test
  - Pronator syndrome (median nerve compression at forearm) - pain with pronation, no nocturnal symptoms
  - Ulnar neuropathy (cubital tunnel syndrome) - affects ring/small finger
  - Thoracic outlet syndrome - affects entire arm, worse with arm elevation
  - Peripheral neuropathy (diabetes, B12 deficiency) - symmetric, stocking-glove pattern
  - Cervical myelopathy - upper motor neuron signs, gait disturbance
  - De Quervain tenosynovitis - radial wrist pain, positive Finkelstein test
  - Raynaud phenomenon - color changes with cold exposure
trace:
  - 52-year-old administrative assistant with 6-month history of right hand numbness and tingling
  - Symptoms predominantly thumb, index, middle fingers, worse at night, wakes her up
  - Shakes hand to relieve symptoms (positive flick sign)
  - Occasionally drops objects, difficulty buttoning shirts
  - Occupation involves extensive computer keyboard and mouse use
  - Past medical history - type 2 diabetes, hypothyroidism on levothyroxine
  - Physical exam - positive Tinel sign and Phalen test on right, negative on left
  - Mild thenar atrophy on right, 2-point discrimination 8 mm (abnormal)
  - Weak thumb abduction on right compared to left
  - No sensory deficits in ulnar or radial distributions, no palm involvement
  - Cervical spine exam normal, negative Spurling test
  - Nerve conduction studies - prolonged right median nerve distal motor latency 5.2 ms (normal less than 4.5 ms)
  - Prolonged sensory latency 4.1 ms (normal less than 3.5 ms), reduced amplitude
  - EMG - no fibrillation potentials (no severe denervation)
  - Diagnosis - Moderate carpal tunnel syndrome, right hand
  - Conservative management - night wrist splint in neutral position, NSAIDs, ergonomic workstation evaluation
  - Corticosteroid injection (triamcinolone 40 mg) into right carpal tunnel
  - Follow-up at 6 weeks - 50% improvement but symptoms persist
  - Discussed surgical options given persistent symptoms despite conservative treatment
  - Patient elected to proceed with open carpal tunnel release
  - Surgery performed under local anesthesia, uncomplicated
  - Post-op - early finger ROM exercises, returned to work at 4 weeks with restrictions
  - 3-month follow-up - complete resolution of nocturnal symptoms, 90% improved
  - Outcome - Excellent result, minimal scar, returned to full duties at work
