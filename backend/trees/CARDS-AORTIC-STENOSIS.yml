tree_id: CARDS-AORTIC-STENOSIS
name: Aortic Stenosis
family: Cardiology
specialty: Cardiology
chief_complaint: Chest pain and shortness of breath with exertion
description: Narrowing of aortic valve causing progressive obstruction to LV outflow, classic triad of angina, syncope, and heart failure. Calcific degenerative most common cause in elderly, bicuspid valve in younger patients. Asymptomatic with severe AS requires valve replacement before irreversible LV dysfunction develops.
icd10: I35.0
urgency: urgent

workup:
  - Classic triad of symptoms (late manifestations):
  - Angina: exertional chest pain (decreased coronary perfusion from LV hypertrophy and increased oxygen demand)
  - Syncope: exertional lightheadedness or syncope (fixed cardiac output cannot increase with activity)
  - Heart failure: dyspnea, orthopnea, pulmonary edema (LV dysfunction from chronic pressure overload)
  - SAD triad mnemonic: Syncope, Angina, Dyspnea
  - Survival after symptom onset: angina 5 years, syncope 3 years, heart failure 2 years (without valve replacement)
  - Physical exam:
  - Crescendo-decrescendo systolic murmur: harsh, radiates to carotids, best heard right upper sternal border
  - Decreased and delayed carotid upstroke (pulsus parvus et tardus)
  - Soft or absent S2 (A2 component diminished from immobile valve)
  - Sustained apical impulse (LV hypertrophy)
  - S4 gallop (atrial contraction into stiff LV)
  - Paradoxical splitting S2: severe AS delays aortic closure (A2 after P2)
  - Causes:
  - Calcific degenerative (most common in elderly): age-related calcification, similar risk factors to CAD
  - Bicuspid aortic valve (most common in age below 70): congenital, develops stenosis decades earlier
  - Rheumatic heart disease: commissural fusion, often with mitral involvement
  - Echocardiogram (diagnostic):
  - Aortic valve area (AVA): normal 3-4 cm², mild 1.5-2 cm², moderate 1-1.5 cm², severe below 1 cm²
  - Mean gradient: severe over 40 mmHg
  - Peak velocity: severe over 4 m/s
  - LV hypertrophy: concentric hypertrophy from pressure overload
  - LV systolic function: initially preserved (compensated), late decline indicates decompensation
  - Low-flow low-gradient AS: severe AS with low EF and mean gradient below 40 mmHg (dobutamine stress echo helps)
  - ECG: LV hypertrophy with strain pattern (deep S in V1, tall R in V5-V6, inverted T waves V5-V6)
  - Cardiac catheterization: if echo non-diagnostic or discordant with symptoms, measure gradient directly
  - Coronary angiography: preoperative assessment before valve replacement (50% have concomitant CAD)
  - Exercise stress test: CONTRAINDICATED in symptomatic severe AS (risk of sudden death)
  - May use in asymptomatic severe AS to unmask symptoms

treatment:
  - Medical management (temporizing only, does NOT alter disease progression):
  - No effective medical therapy to prevent progression
  - Heart failure: diuretics (furosemide) cautiously, avoid overdiuresis (preload-dependent)
  - Avoid vasodilators: ACE inhibitors and nitrates can cause hypotension (fixed cardiac output)
  - Beta blockers: use cautiously, may worsen heart failure
  - Statins: no proven benefit to slow AS progression (despite calcific process)
  - Surgical aortic valve replacement (SAVR) - definitive treatment:
  - Indications: ANY symptoms with severe AS (angina, syncope, dyspnea)
  - Asymptomatic severe AS with: EF below 50%, undergoing other cardiac surgery, very severe AS (velocity over 5 m/s), abnormal exercise test
  - Mechanical valve: lifelong warfarin, durable, preferred if age below 60-65
  - Bioprosthetic valve: no anticoagulation (aspirin only), degenerates in 10-15 years, preferred if age over 65
  - Operative mortality 2-4% for isolated AVR
  - Transcatheter aortic valve replacement (TAVR):
  - Less invasive than surgery, via femoral artery or transapical approach
  - Approved for all risk categories (low, intermediate, high surgical risk)
  - Preferred if age over 80, high surgical risk, or frail
  - Complications: stroke, vascular complications, conduction abnormalities requiring pacemaker (10-15%)
  - Balloon valvuloplasty: NOT effective for calcific AS (restenosis within months), bridge to TAVR/SAVR or palliative
  - Antibiotic prophylaxis: NOT recommended for degenerative AS (only for prosthetic valves)
  - Avoid strenuous exercise: if severe AS, restrict competitive sports

clinical_pearls:
  - SAD triad: Syncope, Angina, Dyspnea - survival 3, 5, 2 years without surgery
  - Harsh crescendo-decrescendo murmur radiating to carotids with delayed carotid upstroke
  - Severe AS: valve area below 1 cm², mean gradient over 40 mmHg, velocity over 4 m/s
  - ANY symptoms with severe AS is indication for valve replacement
  - Do NOT exercise stress test in symptomatic severe AS (risk sudden death)
  - TAVR now approved for all risk categories, preferred if age over 80
  - LV hypertrophy compensates initially but eventual decompensation with EF decline
  - Bicuspid valve most common cause in younger patients (age below 70)

differentials:
  - Hypertrophic cardiomyopathy: systolic murmur increases with Valsalva (AS decreases), no carotid radiation
  - Mitral regurgitation: holosystolic murmur radiating to axilla, not to carotids
  - Aortic sclerosis: murmur without hemodynamic obstruction, normal valve area and gradients on echo
  - Pulmonic stenosis: systolic murmur at left upper sternal border, not radiating to carotids

trace: |
  A 78-year-old man presented with 3 months of progressive exertional chest pain and dyspnea. Previously walked 2 miles daily, now short of breath after 1 block. Chest pressure with exertion relieving with rest. Two episodes of lightheadedness climbing stairs (near syncope). Exam: BP 145/85, HR 72, harsh 3/6 crescendo-decrescendo systolic murmur at right upper sternal border radiating to carotids, delayed and diminished carotid upstrokes bilaterally (pulsus parvus et tardus), sustained apical impulse (LV hypertrophy), soft S2 (diminished A2 from immobile valve), S4 gallop. ECG: LV hypertrophy with strain pattern (deep S V1, tall R V5-V6 15 mm, inverted T waves V5-V6). Echocardiogram: severe aortic stenosis with heavily calcified trileaflet valve, aortic valve area 0.7 cm² (severe below 1 cm²), mean gradient 48 mmHg (severe over 40), peak velocity 4.5 m/s (severe over 4), concentric LV hypertrophy, preserved LV systolic function EF 60%. Diagnosed with symptomatic severe aortic stenosis (SAD triad: near-Syncope, Angina, Dyspnea, with severe AS on echo). Exercise stress test CONTRAINDICATED (risk sudden death in symptomatic severe AS). Coronary angiography: 70% stenosis LAD (concomitant CAD in 50% of AS patients), otherwise normal coronaries. Cardiothoracic surgery consultation: given age 78 and moderate surgical risk, offered choice of SAVR vs TAVR. Patient chose TAVR (less invasive). Pre-TAVR workup: CT angiography for sizing, femoral arteries adequate. Underwent transfemoral TAVR with 26 mm bioprosthetic valve. Procedure successful, immediate improvement in gradient (post-deployment mean gradient 8 mmHg). Complication: complete heart block post-procedure requiring permanent pacemaker implantation (10-15% risk with TAVR). At 1 week discharged on aspirin 81 mg and clopidogrel 75 mg daily x6 months (dual antiplatelet after TAVR), then aspirin alone lifelong. At 1 month dramatic symptom improvement: no chest pain, no dyspnea, walking 1 mile without symptoms. Echocardiogram: well-seated valve, mean gradient 10 mmHg, no paravalvular leak, EF 65%. At 6 months back to baseline activity, walking 2 miles daily, excellent quality of life. Annual echo monitoring for valve function. TAVR life-saving for symptomatic severe aortic stenosis.
