tree_id: CARDS-AORTIC-STENOSIS
name: Aortic Stenosis
family: Cardiology
specialty: Cardiology
chief_complaint: Exertional dyspnea, chest pain, and syncope
description: Progressive narrowing of aortic valve causing LV outflow obstruction. Classic triad of symptoms (angina, syncope, dyspnea) signals severe disease. Most commonly calcific degenerative in elderly. Severe AS defined as valve area under 1.0 cm², mean gradient over 40 mmHg, peak velocity over 4 m/s. Symptomatic severe AS requires valve replacement (SAVR or TAVR). Asymptomatic severe AS with EF under 50% or positive stress test also warrants intervention.
icd10: I35.0
urgency: urgent

workup:
  - Clinical presentation (classic triad indicates severe disease):
  - Angina (exertional chest pain from increased oxygen demand, 50% mortality at 5 years if untreated)
  - Syncope (exertional from inability to increase cardiac output, 50% mortality at 3 years if untreated)
  - Dyspnea (from heart failure, 50% mortality at 2 years if untreated)
  - Risk factors and etiology:
  - Calcific degenerative (most common in elderly, over age 65)
  - Bicuspid aortic valve (congenital, presents earlier age 40-50)
  - Rheumatic heart disease (less common in developed countries)
  - Physical exam findings:
  - Harsh crescendo-decrescendo systolic ejection murmur at right upper sternal border radiating to carotids
  - Decreased and delayed carotid upstroke (pulsus parvus et tardus)
  - Soft or absent S2 (calcified immobile valve)
  - S4 gallop (LV hypertrophy)
  - Laterally displaced PMI if LV dilation
  - Narrow pulse pressure if severe
  - Imaging (echocardiogram is diagnostic):
  - Severity grading by echo:
  - Mild AS (valve area over 1.5 cm², mean gradient under 25 mmHg, peak velocity under 3 m/s)
  - Moderate AS (valve area 1.0-1.5 cm², mean gradient 25-40 mmHg, peak velocity 3-4 m/s)
  - Severe AS (valve area under 1.0 cm², mean gradient over 40 mmHg, peak velocity over 4 m/s)
  - Very severe AS (valve area under 0.6 cm², mean gradient over 60 mmHg, peak velocity over 5 m/s)
  - LV hypertrophy (concentric from pressure overload)
  - EF assessment (reduced EF indicates LV dysfunction)
  - Chest X-ray (may show cardiomegaly, pulmonary edema if HF, calcified aortic valve)
  - ECG (LV hypertrophy with strain pattern)
  - Labs (BNP elevated if symptomatic or LV dysfunction)
  - Stress testing:
  - Only if asymptomatic (contraindicated if symptomatic)
  - Assess exercise capacity and symptoms
  - Positive test (symptoms, hypotension, ST changes) indicates intervention needed
  - Cardiac catheterization:
  - Pre-operative coronary angiography if age over 40 or CAD risk factors
  - Hemodynamic assessment if echo-clinical discordance
  - CT calcium scoring (severe AS typically over 2000 Agatston units in men, over 1200 in women)

treatment:
  - Medical management (no proven therapy to slow progression):
  - Treat hypertension cautiously (avoid excessive afterload reduction causing hypotension)
  - Statins do NOT slow AS progression (previously thought to help)
  - Diuretics for congestion if HF symptoms
  - Avoid vigorous exercise if severe AS
  - Serial monitoring if asymptomatic:
  - Severe AS every 6 months (echo and clinical assessment)
  - Moderate AS annually
  - Mild AS every 2-3 years
  - Valve replacement indications (definitive treatment):
  - Symptomatic severe AS (class I indication, any symptoms warrant intervention)
  - Asymptomatic severe AS with EF under 50% (LV dysfunction)
  - Asymptomatic severe AS with positive stress test
  - Asymptomatic very severe AS (valve area under 0.6 cm²) may be considered
  - Severe AS undergoing other cardiac surgery (CABG, other valve surgery)
  - SAVR vs TAVR decision:
  - SAVR (surgical aortic valve replacement):
  - Low surgical risk (STS score under 4%)
  - Young patients (under 65-70 years, longer durability needed)
  - Anatomy unsuitable for TAVR
  - Mechanical valve (if desired and able to take anticoagulation)
  - TAVR (transcatheter aortic valve replacement):
  - High surgical risk (STS score over 8%)
  - Intermediate or low risk (TAVR non-inferior to SAVR, now approved)
  - Elderly (over 75-80 years)
  - Frailty or comorbidities
  - Prior cardiac surgery (redo sternotomy high risk)
  - Post-intervention management:
  - Anticoagulation if mechanical valve (warfarin with INR 2-3 for aortic position)
  - Antiplatelet if bioprosthetic valve (aspirin 81 mg daily)
  - Endocarditis prophylaxis for prosthetic valve
  - Serial echo to assess prosthetic valve function

clinical_pearls:
  - Classic triad (angina, syncope, dyspnea) indicates severe symptomatic AS requiring intervention
  - Once symptomatic, median survival without intervention is 2-5 years
  - Severe AS criteria (valve area under 1.0 cm², mean gradient over 40 mmHg, peak velocity over 4 m/s)
  - Symptomatic severe AS is class I indication for valve replacement
  - TAVR now approved for all risk categories, preferred in elderly and high surgical risk
  - Statins do NOT slow AS progression
  - Stress test contraindicated if symptomatic

differentials:
  - Hypertrophic cardiomyopathy (similar murmur but increases with Valsalva)
  - Aortic sclerosis (murmur without stenosis, normal carotid upstroke)
  - Mitral regurgitation (holosystolic murmur at apex)
  - Supravalvular or subvalvular stenosis

trace: |
  A 78-year-old man presented with 6 months progressive exertional dyspnea and chest discomfort. Previously walked 1 mile, now dyspneic after half block. Occasional lightheadedness with exertion (near-syncope). History of hypertension. Exam: BP 135/85 (narrow pulse pressure 50 mmHg - normal over 60), harsh crescendo-decrescendo systolic murmur grade 4/6 at right upper sternal border radiating to carotids, decreased and delayed carotid upstroke (pulsus parvus et tardus - classic for severe AS), soft S2 (calcified immobile valve), S4 gallop (LV hypertrophy). ECG: LV hypertrophy with strain pattern. Chest X-ray: cardiomegaly, calcified aortic valve visible. Echocardiogram: severely calcified trileaflet aortic valve with severely restricted opening, valve area 0.7 cm² (severe AS - under 1.0), mean gradient 48 mmHg (severe AS - over 40), peak velocity 4.5 m/s (severe AS - over 4), concentric LV hypertrophy (pressure overload), EF 55% (preserved systolic function). BNP 285 pg/mL (elevated - symptomatic). Diagnosed with severe symptomatic aortic stenosis (dyspnea and angina with severe AS by echo). This is class I indication for valve replacement (any symptoms with severe AS warrant intervention). Given age 78 and symptoms, discussed valve replacement options. Evaluated by Heart Team (cardiology and cardiac surgery). STS risk score 5.5% (intermediate surgical risk). Given age, frailty assessment showed mild frailty. Anatomy favorable for both SAVR and TAVR on CT. Patient preference after discussion: TAVR (less invasive, faster recovery, appropriate for age and risk). Coronary angiography pre-procedure: non-obstructive CAD (mild disease, no intervention needed). Underwent transfemoral TAVR with 26mm balloon-expandable valve under conscious sedation. Procedure successful, valve deployed in excellent position. Post-procedure echo: mean gradient 10 mmHg (excellent hemodynamics), no paravalvular leak, EF 55%. Post-procedure course uneventful. Pacemaker not needed (no conduction abnormalities - 15% risk with TAVR). Discharged on day 2 with aspirin 81 mg daily (antiplatelet for bioprosthetic valve), continued lisinopril and atorvastatin. At 1 month: outpatient follow-up, symptoms dramatically improved. Walking 1 mile without dyspnea, no chest pain, no lightheadedness. Exam: normal carotid upstroke (no longer delayed), systolic murmur present but softer (prosthetic valve), S2 audible. Repeat echo: prosthetic valve functioning well, mean gradient 12 mmHg (normal for prosthetic), no stenosis or regurgitation, EF 58% (improved with afterload reduction). At 6 months: asymptomatic, excellent exercise tolerance. At 1 year: annual echo shows stable prosthetic valve function. Complete resolution of symptoms with TAVR. This case demonstrates classic presentation of severe symptomatic AS (exertional dyspnea, angina, near-syncope) with physical exam findings (harsh murmur, delayed carotid upstroke, soft S2, narrow pulse pressure) and echo confirmation (valve area 0.7 cm², mean gradient 48 mmHg, peak velocity 4.5 m/s). Symptomatic severe AS is absolute indication for valve replacement. TAVR appropriate for elderly patient with intermediate surgical risk, excellent outcomes with symptom resolution and improved quality of life.
