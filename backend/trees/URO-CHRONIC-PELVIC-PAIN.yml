tree_id: URO-CHRONIC-PELVIC-PAIN
name: Chronic Pelvic Pain Syndrome (Chronic Prostatitis - CPPS)
family: urology
specialty: Urology/Pain Management
icd10: N41.1
snomed: 197970005
urgency: []
homeopathy: []
presentations:
  - Chronic pelvic or perineal pain (at least 3 of past 6 months)
  - Pain in perineum, suprapubic area, penis, testicles, or rectum
  - Pain may radiate to lower back, inner thighs, or buttocks
  - Pain worse with sitting, prolonged standing, or after ejaculation
  - Urinary symptoms (frequency, urgency, dysuria, weak stream)
  - Sexual dysfunction (erectile dysfunction, painful ejaculation)
  - Psychological distress (depression, anxiety, catastrophizing)
  - No evidence of urinary tract infection or bacterial prostatitis
  - Symptoms fluctuate in severity
  - Quality of life significantly impaired
workup:
  - Diagnosis is clinical (diagnosis of exclusion - must rule out other causes)
  - NIH-CPSI (NIH Chronic Prostatitis Symptom Index)
  - Validated questionnaire, score 0-43
  - Pain domain (0-21), urinary symptoms (0-10), quality of life impact (0-12)
  - Helps quantify severity and track treatment response
  - History (comprehensive)
  - Onset, duration, location, quality, severity of pain
  - Exacerbating factors (sitting, bowel movements, ejaculation)
  - Urinary symptoms (frequency, urgency, dysuria, nocturia)
  - Sexual function (erectile dysfunction, painful ejaculation)
  - Prior treatments and response
  - Psychological comorbidities (depression, anxiety, stress)
  - Occupational factors (prolonged sitting, cycling)
  - Physical examination
  - Abdominal examination (suprapubic tenderness, masses)
  - Digital rectal examination
  - Prostate: may be tender, normal size, boggy or normal consistency
  - Pelvic floor: assess for hypertonicity, trigger points
  - External genitalia: testicular, epididymal examination
  - Urinalysis and urine culture
  - Should be NEGATIVE (rules out UTI, bacterial prostatitis)
  - If positive, treat infection first then reassess
  - Post-prostatic massage urine (Stamey 4-glass test - rarely done now)
  - No bacteria or minimal bacteria (vs bacterial prostatitis with significant bacteria)
  - Elevated WBCs may be present in prostatic fluid
  - PSA (if indicated)
  - May be elevated but NOT due to cancer
  - Recheck after 6-12 weeks if elevated
  - Optional/consider
  - Uroflowmetry and post-void residual (if urinary symptoms prominent)
  - Cystoscopy (if hematuria, refractory symptoms, or concern for bladder pathology)
  - Pelvic floor assessment by physical therapist (assess for myofascial dysfunction)
  - Semen culture (if infertility concern)
treatment:
  - Multimodal approach (no single cure, 30-40% respond to any single therapy)
  - Alpha-blockers (first-line pharmacotherapy)
  - Tamsulosin 0.4 mg daily, alfuzosin 10 mg daily
  - Improves urinary symptoms and may help pain in 40-50%
  - Trial for 4-8 weeks, discontinue if no benefit
  - Most effective in alpha-blocker-naive patients
  - Pelvic floor physical therapy (highly effective)
  - Myofascial release, trigger point therapy, biofeedback
  - 50-60% improvement in pain and symptoms
  - Requires specialized pelvic floor therapist
  - Should be tried in most patients
  - NSAIDs and analgesics
  - Ibuprofen 600 mg three times daily, naproxen 500 mg twice daily
  - Chronic use risks (GI, renal, cardiovascular) - use lowest effective dose
  - Neuropathic pain medications (if neuropathic component)
  - Gabapentin 300-900 mg three times daily
  - Amitriptyline 25-75 mg at bedtime
  - Pregabalin 75-150 mg twice daily
  - Trial for 6-8 weeks
  - Antibiotics (controversial, NOT standard but sometimes tried)
  - Fluoroquinolones (levofloxacin, ciprofloxacin) for 4-6 weeks
  - May help 30-40% even without cultured bacteria (? occult infection)
  - Not recommended routinely due to adverse effects and antibiotic resistance concerns
  - Use only if recent onset or previous bacterial prostatitis
  - 5-alpha reductase inhibitors (if large prostate)
  - Finasteride 5 mg daily
  - May reduce inflammation and shrink prostate
  - Takes 3-6 months for effect
  - Phytotherapy and supplements
  - Quercetin 500 mg twice daily (anti-inflammatory bioflavonoid) - modest benefit
  - Saw palmetto, bee pollen - limited evidence
  - Psychological and behavioral interventions
  - Cognitive behavioral therapy (CBT) for chronic pain
  - Stress reduction techniques, mindfulness
  - Treatment of depression/anxiety if present
  - Avoidance of exacerbating factors (prolonged sitting, cycling, spicy foods, caffeine, alcohol)
  - Invasive therapies (for refractory cases)
  - Prostatic massage (controversial, limited evidence)
  - Nerve blocks (pudendal, ganglion impar)
  - Sacral neuromodulation
  - Surgical options NOT recommended (TURP does not help and may worsen)
clinical_pearls:
  - "CPPS is diagnosis of exclusion - must rule out UTI, bacterial prostatitis, cancer"
  - "Accounts for 90-95% of chronic prostatitis cases"
  - "NIH Classification: Type III chronic prostatitis/CPPS (90-95%), subdivided into IIIa (inflammatory - WBCs present) and IIIb (non-inflammatory - no WBCs)"
  - "No single cure - requires multimodal approach, trial and error"
  - "Pelvic floor dysfunction present in 50-80% of cases - pelvic floor PT should be tried"
  - "Alpha-blockers most effective in alpha-blocker-naive patients with prominent urinary symptoms"
  - "Antibiotics NOT routinely recommended unless recent onset or prior bacterial prostatitis"
  - "Psychological comorbidities common (depression, anxiety) - treat concurrently"
  - "Quality of life impact similar to angina, Crohn's disease, or myocardial infarction"
  - "Symptoms fluctuate over time - spontaneous improvement can occur"
  - "TURP and other prostate surgeries do NOT help and may worsen symptoms"
referrals:
  - Urology for initial evaluation, diagnosis confirmation, treatment optimization
  - Pelvic floor physical therapy (specialized therapist experienced in male pelvic pain)
  - Pain management if refractory to standard treatments (nerve blocks, advanced pain therapies)
  - Psychiatry/psychology for CBT, treatment of depression/anxiety, chronic pain coping strategies
differentials:
  - Chronic bacterial prostatitis (NIH Type II - positive urine culture, recurrent UTIs)
  - Acute bacterial prostatitis (fever, severe pain, systemic symptoms, positive culture)
  - Bladder pain syndrome/interstitial cystitis (bladder-centric pain, worse with filling)
  - Pelvic floor dysfunction (myofascial pain, hypertonicity, trigger points)
  - Pudendal neuralgia (perineal neuropathic pain, worse with sitting)
  - Urethral stricture (weak stream, obstructive symptoms)
  - Bladder cancer (hematuria, irritative symptoms)
  - Prostate cancer (elevated PSA, abnormal DRE, usually painless)
  - Benign prostatic hyperplasia (obstructive symptoms without pain)
  - Chronic orchialgia (testicular pain, may overlap with CPPS)
  - Inguinal hernia (groin mass, increases with Valsalva)
  - Musculoskeletal pain (back, hip pathology)
trace:
  source: American Urological Association Guidelines on Chronic Pelvic Pain Syndrome, European Association of Urology Guidelines, UpToDate
