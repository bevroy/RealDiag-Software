tree_id: CARDS-AV-BLOCK-THIRD-DEGREE
name: Third-Degree AV Block (Complete Heart Block)
family: Cardiology
specialty: Cardiology
chief_complaint: Syncope with slow heart rate
description: Complete dissociation between atria and ventricles, no impulses conducted through AV node. Escape rhythm maintains ventricular rate (junctional 40-60 bpm or ventricular 20-40 bpm). Causes syncope and risk of sudden death. Permanent pacemaker essential treatment.
icd10: I44.2
urgency: emergent

workup:
  - Symptoms: severe, from bradycardia and low cardiac output
  - Syncope: Stokes-Adams attacks (sudden loss of consciousness from asystole until escape rhythm starts)
  - Presyncope, dizziness, lightheadedness
  - Fatigue, weakness, exercise intolerance
  - Dyspnea: inadequate cardiac output
  - Confusion: especially elderly, chronic cerebral hypoperfusion
  - Sudden cardiac death: if no escape rhythm or ventricular fibrillation
  - ECG findings (diagnostic):
  - Complete AV dissociation: P waves and QRS complexes completely independent
  - P waves march through at regular sinus rate (60-100 bpm)
  - QRS complexes at slower escape rate (20-60 bpm)
  - No relationship between P waves and QRS: PR interval constantly varying
  - Escape rhythm determines QRS morphology and rate:
  - Junctional escape: narrow QRS, rate 40-60 bpm (AV nodal level block, more stable)
  - Ventricular escape: wide QRS, rate 20-40 bpm (infranodal block, less stable, higher risk)
  - Physical exam:
  - Severe bradycardia: pulse 30-50 bpm
  - Cannon A waves: intermittent giant jugular venous pulsations when atria contract against closed tricuspid valve (AV dissociation causes atria and ventricles to contract simultaneously occasionally)
  - Variable intensity S1: changing AV relationship
  - S4 gallop: if atrial contraction occurs just before ventricular contraction
  - Hypotension: if severe bradycardia
  - Causes:
  - Acute MI: especially inferior (RCA supplies AV node), may be reversible
  - Chronic degenerative disease: Lev disease (fibrosis of conduction system), Lenègre disease
  - Medications: beta blockers, calcium channel blockers, digoxin toxicity
  - Infiltrative disease: sarcoidosis, amyloidosis, hemochromatosis
  - Myocarditis: Lyme disease, viral, Chagas disease
  - Post-cardiac surgery: valve surgery, septal ablation
  - Congenital: maternal lupus (neonatal lupus with congenital complete block)
  - Hyperkalemia: severe (K over 7 mEq/L)

treatment:
  - Acute management (emergent):
  - Hemodynamically unstable: immediate temporary pacing
  - Transcutaneous pacing: external pads, immediate (painful but life-saving)
  - Transvenous pacing: temporary pacing wire through central vein to RV (more stable)
  - Atropine 0.5-1 mg IV: may improve junctional escape rate, ineffective for infranodal block with ventricular escape
  - Dopamine or epinephrine infusion: bridge to pacing
  - Permanent pacemaker (definitive treatment):
  - Class I indication: all symptomatic third-degree AV block
  - Class I indication: asymptomatic third-degree block with ventricular rate under 40 bpm or pauses over 3 seconds
  - Dual-chamber pacemaker (DDD): maintains AV synchrony, improves cardiac output
  - DO NOT delay: high risk of sudden death
  - Reversible causes:
  - Acute inferior MI: may resolve with reperfusion (delay pacemaker x1-2 weeks, use temporary pacing)
  - Lyme carditis: treat with antibiotics (ceftriaxone), may resolve (temporary pacing bridge)
  - Medication-induced: stop offending drugs
  - Hyperkalemia: correct electrolytes
  - If persists after treating reversible cause: permanent pacemaker
  - Prognosis:
  - Without pacemaker: high mortality (sudden death)
  - With pacemaker: excellent prognosis, symptoms resolve

clinical_pearls:
  - Complete AV dissociation with P waves and QRS independent
  - Ventricular escape rate determines symptoms (junctional 40-60 bpm more stable than ventricular 20-40 bpm)
  - Cannon A waves from AV dissociation
  - Stokes-Adams attacks: syncope from asystole until escape rhythm starts
  - Permanent pacemaker essential (class I indication if symptomatic)
  - Acute inferior MI may cause reversible complete block (temporary pacing, observe x1-2 weeks)
  - Wide QRS escape rhythm worse prognosis than narrow QRS (infranodal vs nodal)

differentials:
  - Second-degree AV block Mobitz II: some P waves conducted, not complete dissociation
  - AV dissociation with junctional tachycardia: junctional rate faster than sinus rate (acceleration, not block)
  - Severe sinus bradycardia with junctional escape: atrial rate very slow, not complete block

trace: |
  A 80-year-old woman with hypertension and diabetes brought to ED by family after syncopal episode at home. Suddenly lost consciousness x30 seconds, spontaneously recovered (Stokes-Adams attack - classic for complete heart block). Two prior near-syncope episodes this week. Increasing fatigue and dyspnea x1 month. Exam: BP 90/60 (hypotensive), HR 35 bpm regular (severe bradycardia), elevated JVP with intermittent giant A waves (cannon A waves from AV dissociation - atria contracting against closed tricuspid valve), variable S1 intensity. ECG: complete heart block with total AV dissociation, P waves marching regularly at rate 75 bpm (normal sinus rate), QRS complexes at rate 35 bpm (slow ventricular escape rhythm), wide QRS 150 ms (ventricular escape - infranodal block, worse prognosis than narrow QRS junctional escape), P waves and QRS completely independent with constantly varying PR intervals. Diagnosed with third-degree AV block (complete heart block) with ventricular escape rhythm (emergent, life-threatening). Stokes-Adams syncope indicates periods of no escape rhythm (asystole until ventricular escape takes over). High risk of sudden death. Immediate treatment required. Started transcutaneous pacing (external pads on chest): captured at 60 bpm (painful but stabilized patient, BP improved to 115/70). Admitted to CCU. Placed transvenous temporary pacemaker: wire through right internal jugular vein into RV apex, pacing at 70 bpm (more comfortable than transcutaneous, stable hemodynamics). Workup for reversible causes: electrolytes normal (K 4.2), no acute MI on ECG or troponin, echocardiogram showed normal LV function EF 55%, mild LVH, no acute abnormalities. Review medications: on metoprolol 50 mg BID and amlodipine (beta blocker may contribute but complete block suggests intrinsic conduction disease). Stopped metoprolol. Likely chronic degenerative disease (Lev disease - age-related fibrosis of conduction system). Permanent pacemaker indicated (class I indication - symptomatic third-degree block with syncope, high risk sudden death). At 48 hours underwent dual-chamber permanent pacemaker (DDD) implantation: leads in right atrium and right ventricle, lower rate limit 60 bpm, AV interval programmed to maintain AV synchrony. Temporary pacemaker removed. Pacemaker interrogation: pacing 100% in ventricle (complete heart block persists, no intrinsic conduction), settings appropriate. At 1 week post-implantation: syncope resolved, fatigue dramatically improved (adequate heart rate restored), no dizziness. Pacemaker functioning perfectly. At 1 month: excellent functional status, back to baseline activities, asymptomatic. Annual pacemaker checks. At 1 year: continues pacing 100%, no episodes of syncope or presyncope, excellent quality of life. Pacemaker saved her life (prevented sudden death from complete heart block).
