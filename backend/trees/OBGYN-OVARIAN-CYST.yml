tree_id: OBGYN-OVARIAN-CYST
name: Ovarian Cyst
family: obstetrics_gynecology
specialty: Gynecology/Primary Care
icd10: N83.20
snomed: 190236009
urgency: []
homeopathy: []
presentations:
  - Asymptomatic incidental finding on imaging (most common)
  - Pelvic or abdominal pain (dull, aching, or sharp if rupture/torsion)
  - Unilateral lower quadrant pain
  - Pain may worsen with activity, intercourse, or bowel movements
  - Bloating or fullness sensation
  - Menstrual irregularities
  - Acute severe pain if ovarian torsion or cyst rupture
  - Nausea and vomiting (especially with torsion)
  - Dyspareunia (painful intercourse)
workup:
  - Clinical history
  - Location, onset, duration, and severity of pain
  - Menstrual history (cycle regularity, last menstrual period)
  - Sexual activity and contraception use
  - Previous history of ovarian cysts
  - Symptoms of torsion (acute severe pain, nausea, vomiting)
  - Physical examination
  - Vital signs (tachycardia and hypotension suggest rupture with hemorrhage)
  - Abdominal examination
  - Tenderness, guarding, rebound (suggests rupture or torsion)
  - Palpable mass if large cyst
  - Pelvic examination
  - Adnexal mass or tenderness on bimanual exam
  - Cervical motion tenderness
  - Assess mobility of mass (concern for malignancy if fixed)
  - Laboratory evaluation
  - Pregnancy test (beta-hCG) - ALWAYS rule out ectopic pregnancy
  - Complete blood count if concern for hemorrhage or infection
  - Tumor markers if concern for malignancy
  - CA-125 (elevated in epithelial ovarian cancer, also endometriosis)
  - Premenopausal: limited specificity (elevated in many benign conditions)
  - Postmenopausal: more specific for malignancy if elevated
  - Additional markers: CEA, AFP, hCG, LDH, inhibin (depending on imaging characteristics)
  - Imaging studies
  - Transvaginal ultrasound (FIRST-LINE imaging)
  - Assess cyst characteristics
  - Size (measure in 3 dimensions)
  - Simple versus complex
  - Wall thickness, septations, solid components
  - Papillary projections or nodules (concerning for malignancy)
  - Doppler flow (increased vascularity concerning)
  - Bilateral versus unilateral
  - Common benign cyst types on ultrasound
  - Follicular cyst: thin-walled, anechoic (fluid-filled), usually less than 3 cm
  - Corpus luteum cyst: thick wall, may have internal echoes, 3-5 cm
  - Hemorrhagic cyst: internal echoes (blood), retracting clot, may have fluid-fluid level
  - Endometrioma: "ground glass" appearance, no Doppler flow, often bilateral
  - Dermoid cyst (teratoma): echogenic, may have fat-fluid level, Rokitansky nodule
  - Features concerning for malignancy
  - Solid components or thick septations (greater than 3 mm)
  - Papillary projections
  - Ascites
  - Bilateral complex masses
  - Postmenopausal status with any complex features
  - CT or MRI pelvis
  - If ultrasound inconclusive or concern for malignancy
  - Better characterization of solid versus cystic components
  - Assess for metastatic disease
treatment:
  - Management based on cyst characteristics and symptoms
  - Simple cysts (thin-walled, anechoic, no solid components)
  - Premenopausal women
  - Less than 5 cm: observation, likely physiologic (follicular or corpus luteum)
  - Repeat ultrasound in 6-12 weeks (most resolve spontaneously)
  - 5-10 cm: repeat ultrasound in 6-12 weeks, consider surgery if persistent
  - Greater than 10 cm: surgical evaluation (higher risk torsion)
  - Postmenopausal women
  - Less than 5 cm with normal CA-125: observation with serial ultrasounds every 6 months
  - 5-10 cm or elevated CA-125: gynecologic oncology evaluation
  - Greater than 10 cm: surgical removal
  - Complex cysts or concerning features
  - Gynecology or gynecologic oncology referral
  - Surgical exploration and pathology diagnosis
  - Symptomatic cysts (pain, pressure symptoms)
  - Conservative management
  - NSAIDs for pain (ibuprofen 600 mg every 6 hours)
  - Hormonal contraception to suppress ovulation and prevent new cyst formation
  - Combined oral contraceptives (does NOT make existing cysts resolve faster)
  - Observation with repeat ultrasound in 6-12 weeks
  - Surgical management if pain severe, cyst persistent, or large
  - Ovarian cystectomy (remove cyst, preserve ovary)
  - Laparoscopic preferred approach
  - Oophorectomy if extensive ovarian involvement or concern for malignancy
  - Acute complications requiring immediate intervention
  - Ovarian torsion (surgical emergency)
  - Sudden severe unilateral pelvic pain, nausea, vomiting
  - Ultrasound: enlarged ovary, decreased or absent Doppler flow
  - Immediate laparoscopy for detorsion (untwist ovary)
  - Oophoropexy if recurrent torsion risk
  - Ruptured cyst with hemorrhage
  - Sudden sharp pain, may have lightheadedness, tachycardia, hypotension
  - Ultrasound: complex cyst or resolution of cyst, free fluid in pelvis
  - Hemodynamically stable: observation, pain control, serial hemoglobin
  - Hemodynamically unstable: surgical exploration and hemostasis
  - Prevention of recurrent cysts
  - Hormonal contraception (combined OCPs, vaginal ring, patch)
  - Suppresses ovulation, prevents new functional cyst formation
clinical_pearls:
  - 'Most ovarian cysts in premenopausal women are functional (follicular or corpus luteum) and resolve spontaneously in 6-12 weeks'
  - 'Simple cysts less than 5 cm in premenopausal women rarely require surgery - observation with repeat ultrasound appropriate'
  - 'Birth control pills do NOT make existing cysts resolve faster - they prevent NEW cyst formation'
  - 'Ovarian torsion most common with cysts 5-10 cm - larger risk due to weight, smaller less mobile'
  - 'Any ovarian cyst in postmenopausal woman requires evaluation - higher suspicion for malignancy'
  - 'CA-125 has poor specificity in premenopausal women - elevated in endometriosis, fibroids, PID, pregnancy, menses'
  - 'Dermoid cysts (mature cystic teratomas) most common ovarian tumor in women under 30 - contain hair, teeth, sebaceous material'
  - 'Hemorrhagic corpus luteum cysts can rupture causing hemoperitoneum - most resolve with observation unless hemodynamically unstable'
referrals:
  - Gynecology for persistent or symptomatic cysts, surgical evaluation
  - Gynecologic oncology for postmenopausal cysts with concerning features, elevated CA-125, or complex cysts
  - Emergency surgery for ovarian torsion or ruptured cyst with hemodynamic instability
differentials:
  - Functional ovarian cyst (follicular or corpus luteum - simple, thin-walled, resolves spontaneously)
  - Hemorrhagic cyst (internal echoes from blood, acute pain if rupture)
  - Endometrioma (chocolate cyst - ground glass appearance, often bilateral, associated with endometriosis)
  - Dermoid cyst (mature cystic teratoma - echogenic, fat-fluid level, Rokitansky nodule)
  - Cystadenoma (benign epithelial tumor - serous or mucinous, may have septations)
  - Ovarian cancer (solid components, papillary projections, ascites, elevated CA-125, postmenopausal)
  - Ectopic pregnancy (positive beta-hCG, adnexal mass, may have free fluid)
  - Ovarian torsion (acute severe pain, enlarged ovary, absent Doppler flow)
  - Pelvic inflammatory disease (bilateral adnexal tenderness, cervical motion tenderness, fever)
  - Tubo-ovarian abscess (complex adnexal mass, fever, elevated WBC)
