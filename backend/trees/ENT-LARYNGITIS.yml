tree_id: ENT-LARYNGITIS
name: Acute Laryngitis
family: Ent
specialty: Ent
icd10:
- J04.0
snomed:
- 45913009
urgency: urgent
description: Comprehensive evaluation and management of Acute Laryngitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Hoarseness or voice loss
- Dry cough
- Sore throat (mild)
- Usually follows viral URI
- Voice worsens with use
- Self-limited (typically 1-2 weeks)
workup:
- Clinical diagnosis - no testing needed for acute viral laryngitis
- 'Laryngoscopy (by ENT) if: Hoarseness >3 weeks, no URI symptoms, smoker, unilateral
  symptoms, dysphagia'
treatment:
- 'Guideline-based treatment options for Acute Laryngitis include:'
- 'Voice rest (most important): Minimize talking for 2-3 days, don''t whisper (AAO-HNS
  2023)'
- 'Hydration: Increase fluids (8+ glasses/day), humidified air (AAO-HNS 2023)'
- 'Avoid irritants: No smoking, alcohol, caffeine (dehydrating) (AAO-HNS 2023)'
- 'Symptomatic: Throat lozenges, warm tea with honey (soothes throat) (AAO-HNS 2023)'
- NO ANTIBIOTICS (viral) - corticosteroids only if professional voice user (singer)
  with urgent need (AAO-HNS 2023)
clinical_pearls:
- 'Viral laryngitis (95%): Self-limited inflammation of larynx, peak symptoms 2-3
  days, resolves in 1-2 weeks'
- 'Causes: Rhinovirus, adenovirus, influenza, RSV (follows URI symptoms)'
- 'Voice rest: Don''t whisper (causes more strain) - speak softly or write notes'
- 'Chronic hoarseness >3 weeks: Red flag for vocal cord nodules, polyps, paralysis,
  or laryngeal cancer - needs laryngoscopy'
- 'Reinke''s edema: Chronic smoking causes diffuse polypoid degeneration of vocal
  cords (deep, hoarse voice)'
referrals:
- 'ENT for direct laryngoscopy if: Hoarseness >3 weeks (rule out vocal cord pathology,
  cancer)'
- Speech-language pathology for voice therapy if chronic voice strain or vocal cord
  nodules
differentials: []
