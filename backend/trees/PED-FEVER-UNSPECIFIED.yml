tree_id: PED-FEVER-UNSPECIFIED
name: Fever, Unspecified (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/Emergency Medicine
icd10: R50.9
snomed: 386661006
urgency: []
homeopathy: []
presentations:
  - Elevated body temperature (rectal temperature greater than 100.4°F/38°C)
  - Fussiness, irritability, or decreased activity
  - Decreased appetite or refusal to eat
  - Increased sleepiness or difficulty waking
  - Warm or hot to touch
  - Flushed appearance
  - Chills or shivering
  - Sweating
  - May have associated symptoms depending on source (cough, vomiting, rash, ear pulling)
  - Age-specific presentations (neonates may have hypothermia instead of fever)
workup:
  - Critical initial assessment - age-based risk stratification
  - Febrile neonate (0-28 days): HIGH RISK - always requires full workup
  - Febrile infant (29-90 days): INTERMEDIATE RISK - stratify by clinical criteria
  - Older infant and child (greater than 90 days): risk based on clinical appearance and exam findings
  - Clinical history
  - Accurate temperature measurement and method
  - Rectal most accurate for infants
  - "Fever defined as rectal temp greater than 100.4°F (38°C)"
  - Onset, duration, and pattern of fever
  - Height of fever
  - Associated symptoms (respiratory, GI, urinary, neurologic)
  - Ill contacts or exposures
  - Recent travel
  - Immunization status (up to date?)
  - Recent antibiotic or antipyretic use
  - Chronic medical conditions
  - Physical examination - systematic approach
  - Vital signs (temperature, heart rate, respiratory rate, blood pressure, oxygen saturation)
  - General appearance (well-appearing versus ill-appearing or toxic)
  - Hydration status
  - HEENT: ears (otitis media), throat (pharyngitis), nasal discharge, conjunctivitis
  - Neck: nuchal rigidity, lymphadenopathy
  - Cardiovascular: perfusion, capillary refill
  - Respiratory: breath sounds, work of breathing
  - Abdomen: tenderness, hepatosplenomegaly
  - Genitourinary: rash in diaper area, suprapubic tenderness
  - Skin: petechiae, purpura, rashes
  - Musculoskeletal: joint swelling, tenderness, limited range of motion
  - Neurologic: altered mental status, focal deficits, irritability
  - Laboratory and imaging - age-dependent approach
  - Febrile neonate (0-28 days) - FULL SEPSIS WORKUP mandatory
  - Blood culture
  - Complete blood count with differential
  - C-reactive protein (CRP) and/or procalcitonin
  - Urinalysis and urine culture (catheterized specimen)
  - Cerebrospinal fluid analysis and culture (lumbar puncture)
  - Chest X-ray if respiratory symptoms
  - Stool culture if diarrhea
  - Admit for IV antibiotics pending cultures
  - Febrile infant (29-90 days) - selective workup based on clinical criteria
  - Low-risk infants (well-appearing, no focus of infection)
  - Urinalysis and urine culture (all febrile infants)
  - Blood culture and CBC
  - Lumbar puncture if CBC abnormal or CRP/PCT elevated
  - Consider procalcitonin (helps risk stratify)
  - High-risk infants: full sepsis workup like neonates
  - Children greater than 90 days
  - Urinalysis and culture (all febrile infants 2-24 months without source, especially females)
  - Other testing guided by history and physical exam
  - Rapid strep test if pharyngitis
  - Chest X-ray if respiratory symptoms or tachypnea
  - Blood culture if ill-appearing or toxic
  - Lumbar puncture if meningeal signs
treatment:
  - Age-specific management protocols
  - Febrile neonate (0-28 days)
  - Admit to hospital for full sepsis evaluation
  - Empiric IV antibiotics (ampicillin + gentamicin OR ampicillin + cefotaxime)
  - Add acyclovir if concern for HSV (seizures, vesicular rash, CSF pleocytosis)
  - Continue antibiotics until cultures negative for 48 hours
  - Febrile infant (29-90 days)
  - Low-risk, well-appearing: may observe as outpatient with close follow-up (24 hours) OR admit for observation
  - High-risk or ill-appearing: admit for IV antibiotics
  - Empiric antibiotics: ceftriaxone 50 mg/kg IV/IM
  - Children greater than 90 days
  - Management based on clinical appearance and identified source
  - Well-appearing with identified source: treat source (antibiotics for strep, AOM, UTI, etc.)
  - Ill-appearing or toxic: admit for IV antibiotics and further workup
  - Antipyretic therapy - fever management
  - Indications: discomfort, not just fever number
  - Fever itself not harmful and may have immune benefits
  - Acetaminophen 10-15 mg/kg/dose every 4-6 hours (max 5 doses/day)
  - Safe from birth
  - Ibuprofen 10 mg/kg/dose every 6-8 hours (age greater than 6 months only)
  - Avoid alternating acetaminophen and ibuprofen (dosing errors, no proven benefit)
  - Avoid aspirin (Reye syndrome risk)
  - Supportive care
  - Encourage oral fluids
  - Light clothing
  - Tepid sponge bath if very uncomfortable (avoid cold water - causes shivering)
  - Rest
  - Specific antibiotic therapy when source identified
  - Urinary tract infection: cephalexin or amoxicillin-clavulanate (oral), ceftriaxone (parenteral)
  - Strep pharyngitis: amoxicillin 50 mg/kg/day for 10 days
  - Acute otitis media: amoxicillin 80-90 mg/kg/day
  - Pneumonia: amoxicillin 80-90 mg/kg/day
  - When NOT to treat
  - Viral illnesses (supportive care only)
  - Teething (does NOT cause high fever - look for other source)
  - Immunizations (low-grade fever common, resolves in 1-2 days)
  - Return precautions and follow-up
  - Immediate return if
  - Age less than 3 months with any fever
  - Fever greater than 105°F (40.5°C)
  - Fever lasting more than 3-5 days
  - Ill-appearing, lethargic, inconsolable
  - Difficulty breathing, retractions
  - Seizure
  - Petechial or purpuric rash
  - Stiff neck or severe headache
  - Refusal to drink, signs of dehydration
  - No improvement with antipyretics
clinical_pearls:
  - 'Fever in neonate (0-28 days) is emergency - requires full sepsis workup and empiric IV antibiotics until cultures negative'
  - 'Rectal temperature most accurate in infants and young children - oral and temporal artery less reliable'
  - 'Fever height does NOT correlate with likelihood of serious bacterial infection - clinical appearance more important'
  - 'Fever phobia common in parents - educate that fever is protective immune response, not harmful in itself'
  - 'Febrile infant (29-90 days): urinalysis and culture mandatory - UTI most common serious bacterial infection in this age group'
  - 'Children over 90 days: identify source with history and physical - most are viral and self-limited'
  - 'Antipyretics for comfort, not to treat fever number - goal is to make child comfortable, not necessarily afebrile'
  - 'Teething does NOT cause fever greater than 101°F (38.3°C) - look for other source if high fever'
referrals:
  - Emergency department for any febrile neonate (0-28 days), toxic-appearing child, or signs of severe infection
  - Pediatric infectious disease for fever of unknown origin (FUO - fever greater than 14 days without identified source)
  - Immunology if recurrent fevers or concern for periodic fever syndromes
  - Hematology/oncology if prolonged fever with concerning labs (cytopenias, very elevated inflammatory markers)
differentials:
  - Viral upper respiratory infection (most common cause - rhinorrhea, cough, conjunctivitis)
  - Acute otitis media (ear pain, bulging TM)
  - Pharyngitis (viral or strep - sore throat, tonsillar erythema or exudates)
  - Urinary tract infection (especially infants - may have no localizing symptoms)
  - Pneumonia (cough, tachypnea, retractions, crackles)
  - Viral gastroenteritis (vomiting, diarrhea)
  - Bacteremia/sepsis (ill-appearing, poor perfusion, petechiae)
  - Meningitis (irritability, bulging fontanelle, nuchal rigidity, altered mental status)
  - Roseola (high fever 3-5 days, then rash as fever resolves)
  - Kawasaki disease (fever greater than 5 days, rash, conjunctivitis, mucositis, extremity changes, lymphadenopathy)
