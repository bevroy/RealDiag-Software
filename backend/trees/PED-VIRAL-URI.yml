tree_id: PED-VIRAL-URI
name: Viral Upper Respiratory Infection (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine
icd10: J06.9
snomed: 82272006
urgency: []
homeopathy: []
presentations:
  - Rhinorrhea (runny nose) - clear or cloudy nasal discharge
  - Nasal congestion
  - Cough (dry or productive)
  - Sore throat or throat irritation
  - Low-grade fever (usually less than 101°F/38.3°C)
  - Sneezing
  - Decreased appetite
  - Irritability or fussiness in young children
  - Symptoms typically last 7-10 days
  - May have associated symptoms (mild headache, body aches, fatigue)
workup:
  - Clinical history
  - Onset and duration of symptoms (viral URI typically peaks at 3-5 days)
  - Fever pattern and height
  - Associated symptoms (ear pain, difficulty breathing, rash)
  - Sick contacts (daycare, school exposure)
  - Recent travel
  - Hydration status (wet diapers, urine output, oral intake)
  - Immunization status
  - Physical examination
  - Vital signs (temperature, respiratory rate, heart rate, oxygen saturation)
  - General appearance (assess severity - well-appearing versus toxic-appearing)
  - HEENT examination
  - Nasal discharge (clear, purulent, unilateral versus bilateral)
  - Pharynx (mild erythema common, exudates suggest bacterial pharyngitis)
  - Tympanic membranes (rule out otitis media)
  - Cervical lymphadenopathy (small, mobile, tender nodes normal with viral URI)
  - Lung auscultation
  - Clear breath sounds expected
  - Wheezing suggests reactive airway disease or bronchiolitis
  - Crackles suggest pneumonia
  - Hydration assessment
  - Mucous membranes (moist versus dry)
  - Skin turgor
  - Capillary refill
  - Laboratory and imaging
  - Generally NOT needed for uncomplicated viral URI
  - Rapid strep test if pharyngitis with tonsillar exudates, palatal petechiae, or scarlatiniform rash
  - Influenza testing if flu season and meets criteria for antiviral therapy
  - Chest X-ray only if concern for pneumonia (tachypnea, hypoxia, crackles, respiratory distress)
  - Red flags requiring further evaluation
  - High fever (greater than 104°F/40°C) or fever lasting more than 3-5 days
  - Respiratory distress (retractions, grunting, nasal flaring)
  - Hypoxia (oxygen saturation less than 92%)
  - Dehydration (decreased urine output, dry mucous membranes, lethargy)
  - Toxic appearance (lethargy, poor perfusion, inconsolable)
  - Unilateral purulent nasal discharge (foreign body)
  - Symptoms worsening after initial improvement (bacterial superinfection)
treatment:
  - Supportive care (MAINSTAY of treatment)
  - Antipyretics for fever and discomfort
  - Acetaminophen 10-15 mg/kg/dose every 4-6 hours (max 5 doses/day)
  - Ibuprofen 10 mg/kg/dose every 6-8 hours (age greater than 6 months)
  - Avoid aspirin (risk of Reye syndrome)
  - Hydration
  - Encourage frequent small amounts of fluids
  - Breastfeeding on demand for infants
  - Oral rehydration solution if decreased intake
  - Nasal saline and suctioning
  - Saline nose drops or spray (2-3 drops each nostril before feeds and sleep)
  - Bulb suction or nasal aspirator for infants (cannot blow nose)
  - Very effective for relieving congestion in young children
  - Humidified air
  - Cool mist humidifier in child's room
  - Helps loosen secretions and soothe airways
  - Rest and comfort measures
  - Adequate sleep
  - Elevate head of bed slightly (improves drainage)
  - Honey for cough (age greater than 12 months)
  - 2.5-5 mL at bedtime or as needed
  - As effective as dextromethorphan for cough suppression
  - NEVER in infants less than 12 months (botulism risk)
  - Treatments to AVOID (not recommended or harmful)
  - Over-the-counter cough and cold medications
  - NOT recommended for children under 6 years (FDA warning)
  - Ineffective and risk of serious side effects
  - Antibiotics
  - NOT indicated for viral URI
  - Do not prevent bacterial superinfection
  - Contribute to antibiotic resistance
  - Zinc, vitamin C, echinacea
  - Insufficient evidence in children
  - When to consider specific treatments
  - Influenza antivirals (oseltamivir, zanamivir)
  - If flu confirmed or suspected and within 48 hours of symptom onset
  - Recommended for high-risk children (asthma, chronic disease, age less than 2 years)
  - Bacterial superinfection (rare)
  - Acute otitis media: amoxicillin 80-90 mg/kg/day divided BID
  - Bacterial sinusitis (symptoms greater than 10 days or worsening after 5-7 days): amoxicillin-clavulanate
  - Pneumonia: depends on age and severity
  - Prevention counseling
  - Hand hygiene (most important prevention)
  - Respiratory etiquette (cover coughs/sneezes)
  - Avoid sharing cups, utensils
  - Keep sick children home from daycare/school
  - Annual influenza vaccine (age greater than 6 months)
  - Follow-up and return precautions
  - Return if fever greater than 3-5 days
  - Return if difficulty breathing, fast breathing, retractions
  - Return if ear pain, severe sore throat
  - Return if not improving after 10-14 days
  - Return if dehydration signs (no urine 8+ hours, very dry mouth, no tears)
clinical_pearls:
  - 'Children have 6-8 viral URIs per year on average (up to 12 in daycare) - most common pediatric diagnosis'
  - 'Green nasal discharge does NOT mean bacterial infection - normal progression of viral URI as immune cells accumulate'
  - 'Antibiotics NOT indicated for viral URI - do not reduce duration, prevent complications, or improve outcomes'
  - 'Saline nasal drops plus suction is most effective treatment for infant nasal congestion'
  - 'OTC cough/cold medications contraindicated under age 6 years - FDA black box warning due to serious adverse events'
  - 'Honey as effective as dextromethorphan for cough in children over 12 months - never in infants (botulism risk)'
  - 'Fever duration key to differentiating viral URI (3-5 days) from bacterial infection (longer or recurrent)'
  - 'Most viral URIs self-limited and resolve in 7-10 days without specific treatment'
referrals:
  - Emergency department if toxic appearance, severe respiratory distress, hypoxia, or dehydration
  - ENT if recurrent URIs (greater than 12 per year), chronic nasal obstruction, or suspected adenoid hypertrophy
  - Allergy/immunology if recurrent infections suggest immunodeficiency
  - Pulmonology if recurrent lower respiratory infections or chronic cough
differentials:
  - Viral upper respiratory infection (rhinorrhea, cough, low-grade fever, self-limited 7-10 days)
  - Influenza (high fever, myalgia, sudden onset, flu season, responds to oseltamivir if early)
  - Acute otitis media (ear pain, pulling at ears, fever, bulging tympanic membrane)
  - Bacterial pharyngitis/strep throat (tonsillar exudates, palatal petechiae, scarlatiniform rash, positive strep test)
  - Acute bacterial sinusitis (symptoms greater than 10 days or worsening after improvement, purulent nasal discharge)
  - Bronchiolitis (wheezing, tachypnea, retractions, age less than 2 years, RSV season)
  - Pneumonia (tachypnea, hypoxia, crackles, focal findings on chest X-ray)
  - Allergic rhinitis (clear rhinorrhea, sneezing, itchy eyes, seasonal pattern, no fever)
  - Foreign body (unilateral purulent nasal discharge, foul odor)
