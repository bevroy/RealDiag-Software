tree_id: URO-TESTICULAR-TORSION
name: Testicular Torsion
family: Urology
specialty: Urology
icd10:
- N44.00
snomed:
- 51042005
urgency: medium
description: Comprehensive evaluation and management of Testicular Torsion
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden severe testicular pain
- Nausea and vomiting
- Absent cremasteric reflex
- High-riding testicle with horizontal lie
- Scrotal swelling and erythema
- Surgical emergency (6-hour window for salvage)
- Negative Prehn sign (elevation does not relieve pain)
workup:
- Clinical diagnosis - DO NOT delay surgery for tests
- 'Cremasteric reflex: Absent in 99% of torsion (stroke inner thigh - testicle should
  retract up)'
- 'Doppler ultrasound ONLY if diagnosis uncertain: Decreased or absent testicular
  blood flow. Takes 30-60 minutes - don''t delay surgery'
- 'Horizontal lie: Testicle lying transversely instead of vertically on ultrasound'
treatment:
- 'Guideline-based treatment options for Testicular Torsion include:'
- DO NOT delay surgery for imaging if high clinical suspicion - time is testicle,
  operate immediately (AUA 2023)
- 'Emergent scrotal exploration: Detorse testicle, assess viability, bilateral orchiopexy
  (fix both testes to prevent recurrence) (AUA 2023)'
- 'Manual detorsion: If surgery delayed - rotate testicle outward (open book direction)
  1-2 full turns, relief of pain suggests success. STILL NEEDS SURGERY (AUA 2023)'
- 'Orchiectomy: If testicle non-viable (black, necrotic), remove to prevent autoimmune
  orchitis affecting contralateral testicle (AUA 2023)'
- 'Bilateral orchiopexy: Always fix contralateral testicle (15% risk of torsion in
  other side if not fixed) (AUA 2023)'
clinical_pearls:
- SURGICAL EMERGENCY - spermatic cord twists, cutting off blood supply to testicle,
  6-hour window for salvage
- 'Bimodal age: Neonates and adolescents (12-18 years) - bell clapper deformity (horizontal
  lie, inadequate fixation)'
- 'Absent cremasteric reflex: 99% sensitive for torsion - stroke inner thigh, normal
  = testicle retracts, absent = torsion'
- 'High-riding testicle: Twisted cord shortens, testicle sits higher than contralateral
  side'
- 'Salvage rate by time: <6 hours (90-100%), 6-12 hours (50%), 12-24 hours (10%),
  >24 hours (<5%)'
referrals:
- Urology EMERGENTLY - call immediately, patient goes directly to OR
- If urology unavailable, transfer to facility with urology after calling ahead -
  surgical emergency
differentials: []
