tree_id: URO-TESTICULAR-TORSION
name: Testicular Torsion
family: Urology
specialty: Urology
chief_complaint: Acute testicular pain
description: Urologic emergency from twisting of spermatic cord causing testicular ischemia. Requires immediate surgical detorsion within 6 hours to salvage testicle.
icd10: N44.00
urgency: emergent

workup:
  - Clinical diagnosis: acute onset severe unilateral testicular pain with nausea/vomiting in adolescent or young adult (peak age 12-18 years, but can occur any age)
  - Exam: affected testicle high-riding, horizontal lie, absent cremasteric reflex (most sensitive finding 99% sensitivity)
  - Cremasteric reflex: stroking inner thigh causes ipsilateral testicle to elevate (absent in torsion, present in epididymitis)
  - Pain not relieved by elevation (vs epididymitis where elevation relieves pain - Prehn sign)
  - High clinical suspicion = immediate surgical exploration: imaging should NOT delay surgery if high suspicion
  - Color Doppler ultrasound: if diagnosis uncertain, shows decreased or absent blood flow to affected testicle (95% sensitive)
  - Normal flow on ultrasound does NOT rule out torsion (intermittent torsion, partial torsion, early torsion)
  - Time is testicle: salvage rate >90% if detorsion within 6 hours, drops to 50% at 12 hours, <10% after 24 hours

treatment:
  - EMERGENT urologic consultation and surgical exploration: do NOT delay for imaging if high clinical suspicion
  - Manual detorsion: can attempt at bedside while awaiting OR (open book - twist toward lateral thigh like opening a book, usually 1-2 rotations counterclockwise on left, clockwise on right)
  - Pain relief with manual detorsion suggests successful reduction but still requires surgical exploration and fixation
  - Surgical detorsion and bilateral orchiopexy: untwist affected testicle, assess viability, fix both testes to prevent future torsion (contralateral side at risk)
  - Orchiectomy: if testicle non-viable (black, necrotic), remove to prevent inflammatory response and potential antibody-mediated damage to contralateral testis
  - NPO status: patient should be NPO for emergency surgery
  - Analgesia: IV morphine or hydromorphone for severe pain while awaiting surgery
  - Intermittent torsion: history of recurrent episodes of severe testicular pain that spontaneously resolve (spontaneous detorsion) - needs elective bilateral orchiopexy to prevent future torsion

clinical_pearls:
  - Acute severe testicular pain in adolescent/young adult - testicular torsion until proven otherwise
  - Absent cremasteric reflex most sensitive physical finding (99% sensitivity)
  - High-riding horizontal testicle classic presentation
  - Time is testicle - detorsion within 6 hours saves testicle >90%
  - Do NOT delay surgery for imaging if high clinical suspicion
  - Ultrasound if diagnosis uncertain but negative ultrasound does not rule out torsion
  - Manual detorsion can be attempted (open book maneuver) but still needs surgical fixation
  - Bilateral orchiopexy - fix both sides to prevent contralateral torsion
  - Differential diagnosis epididymitis - but if uncertain, explore surgically (better to do unnecessary surgery than miss torsion)

differentials:
  - Epididymitis: gradual onset over hours-days, dysuria, tender epididymis, preserved cremasteric reflex, relief with elevation (Prehn sign positive), pyuria
  - Orchitis: viral (mumps) or bacterial, tender testicle, gradual onset, fever, preserved cremasteric reflex
  - Torsion of testicular appendage: more common ages 7-12, blue dot sign (infarcted appendix visible through skin), less severe pain, preserved cremasteric reflex
  - Incarcerated inguinal hernia: palpable inguinal mass, bowel sounds over scrotum

trace: |
  A 15-year-old boy presented to ED with 3 hours of sudden onset severe left testicular pain that awoke him from sleep. Associated nausea and vomiting. No dysuria, no trauma. Exam showed left testicle high-riding with horizontal lie, exquisitely tender, absent left cremasteric reflex (right cremasteric reflex intact). Pain not relieved with elevation. High clinical suspicion for testicular torsion. EMERGENT urology consultation called immediately (NO imaging obtained - high clinical suspicion sufficient). Patient made NPO, IV morphine for analgesia. Urology performed immediate surgical exploration revealing 540-degree counterclockwise torsion of left spermatic cord. Testicle dusky but viable after detorsion. Bilateral orchiopexy performed (fixed both testes to prevent recurrence). Total time from symptom onset to detorsion 4.5 hours (within 6-hour window). Postoperatively pain resolved, testicle pink and viable. Discharged postoperative day 1. At 2-week follow-up left testicle normal size and consistency, no atrophy, excellent outcome with immediate surgical intervention. Bilateral fixation prevents any future torsion.
