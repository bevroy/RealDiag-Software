tree_id: URO-TESTICULAR-TORSION
name: Testicular Torsion
family: Urology
specialty: Urology
chief_complaint: Sudden severe testicular pain and swelling
description: Urologic emergency caused by twisting of spermatic cord leading to testicular ischemia, requires immediate surgical detorsion to salvage testis
icd10: N44.00
urgency: critical
workup:
  - SURGICAL EMERGENCY - Testicular salvage depends on duration of ischemia
  - "<6 hours - 90-100% salvage rate"
  - "6-12 hours - 50% salvage"
  - ">12-24 hours - <10% salvage, likely orchiectomy"
  - Pathophysiology - Spermatic cord twists, compromising arterial inflow and venous outflow
  - Intravaginal torsion (most common) - Testis rotates within tunica vaginalis
  - Bell clapper deformity - Horizontal lie of testis (high insertion tunica vaginalis on cord), allows free rotation, bilateral anomaly present in 12% males
  - Extravaginal torsion - Rare, neonates (testis and tunica rotate together)
  - Degree rotation - 180-720 degrees (more turns = worse ischemia)
  - Venous obstruction first → engorgement, edema → arterial compromise → ischemia, infarction
  - Epidemiology
  - Bimodal age distribution - Neonatal period and puberty (peak 12-18 years)
  - Annual incidence 1 in 4000 males <25 years
  - 1 in 160 males develop torsion by age 25
  - Clinical presentation - SUDDEN onset severe unilateral scrotal pain
  - Pain characteristics
  - Acute onset (seconds to minutes) - Often wakes patient from sleep, during sports/physical activity
  - Severe constant pain - Unilateral, may radiate to lower abdomen, groin
  - Nausea/vomiting - Common (50-75%, due to visceral pain)
  - NO relief with position change or scrotal elevation (vs epididymitis)
  - Preceding episodes - 50% report prior self-limited episodes (intermittent torsion-detorsion)
  - Physical exam - HIGH index of suspicion, do NOT delay surgery for imaging
  - Inspection - Swollen, erythematous hemiscrotum, high-riding testis
  - Horizontal lie of testis - Bell clapper deformity
  - Palpation
  - Exquisitely tender testis and cord
  - Firm, swollen testis (edema, venous congestion)
  - Absent cremasteric reflex - HIGHLY suggestive (99% sensitive, but not 100%, cannot rule out)
  - Cremasteric reflex - Stroke inner thigh → ipsilateral testis elevates (intact L1-L2 genitofemoral nerve)
  - Absent in 100% torsion (but also absent 20% normal prepubertal boys, 70% epididymitis)
  - Prehn sign - Elevation of scrotum does NOT relieve pain (vs epididymitis, where elevation may help, but unreliable)
  - Blue dot sign - NOT seen in torsion (seen in torsion of appendix testis, small blue nodule at superior pole)
  - Red flags for torsion - Sudden onset, age 12-18, nausea/vomiting, absent cremasteric reflex, high-riding testis
  - Differential diagnosis - Must rule out torsion in ANY acute scrotum
  - Epididymitis - Gradual onset, dysuria, fever, pyuria, positive cremasteric reflex, Prehn sign positive (elevation may help)
  - Torsion of appendix testis/epididymis - Young boys age 7-12, blue dot sign at superior pole, localized tenderness, less severe pain
  - Trauma - History of injury
  - Orchitis - Viral illness (mumps), bilateral
  - Incarcerated inguinal hernia - Palpable mass in inguinal canal
  - Imaging - Do NOT delay surgery if high clinical suspicion
  - Color Doppler ultrasound - If diagnosis uncertain
  - Findings torsion - Absent or decreased testicular blood flow (arterial), enlarged heterogeneous testis, twisted cord (whirlpool sign), reactive hydrocele
  - Sensitivity 90%, specificity 99% if experienced operator
  - False negatives - Early torsion (<4-6 hours), intermittent torsion, hyperemic rim from reactive inflammation
  - Pitfall - Normal flow does NOT exclude torsion in equivocal cases
  - Radionuclide scintigraphy - Rarely used (time-consuming, less available)
  - Urinalysis - Typically normal (vs epididymitis, pyuria/bacteriuria)
treatment:
  - SURGICAL EXPLORATION - Do NOT delay for imaging if high suspicion
  - 'If you think it, take them to the OR - Better to explore negative than miss torsion'
  - Manual detorsion - Can attempt in emergency setting BEFORE surgery (does not replace surgery, temporary measure)
  - 'Open the book - Rotate affected testis outward (medially, like opening a book), 1-2 full turns (540-720 degrees)'
  - Most torsions twist inward (lateral), so detorse medially
  - Right testis - Rotate counterclockwise (from patient's perspective)
  - Left testis - Rotate clockwise
  - Success indicators - Immediate pain relief, improved color, return of cremasteric reflex
  - If no improvement, try opposite direction
  - Success rate 30-70% (does NOT obviate surgery, may re-torse)
  - Surgical detorsion and orchiopexy - DEFINITIVE treatment
  - Bilateral scrotal exploration via midline raphe incision
  - Detorse affected testis, assess viability
  - Viable (pink, warm, arterial bleeding) - Bilateral orchiopexy (fix testis to scrotal wall with 3-point fixation, non-absorbable suture)
  - Non-viable (dusky, necrotic, no bleeding) - Orchiectomy (remove necrotic testis, risk abscess, DIC if left in situ)
  - Contralateral orchiopexy - ALWAYS performed (bilateral bell clapper deformity, 40% risk contralateral torsion)
  - Timing - Within 6 hours of symptom onset for best salvage (goal <4-6 hours)
  - Post-operative
  - Analgesics - NSAIDs, opioids as needed
  - Ice, scrotal support
  - Follow-up - Urology, assess testicular atrophy (50% atrophy even if detorsed and viable, Leydig cells survive better than seminiferous tubules)
  - Fertility - Contralateral testis usually maintains fertility, but 30-40% have oligospermia
  - Anti-sperm antibodies can develop (exposure to disrupted blood-testis barrier)
clinical_pearls:
  - Testicular torsion is a CLINICAL diagnosis - do NOT delay surgery for imaging if high suspicion
  - Absent cremasteric reflex is highly suggestive but not 100% - cannot rule out torsion
  - Salvage rate inversely proportional to time - <6 hours is critical window
  - ALWAYS perform contralateral orchiopexy (bilateral bell clapper deformity)
  - Manual detorsion may provide temporary relief but does NOT replace surgery
  - Normal ultrasound does NOT exclude torsion - if high suspicion, explore surgically
differentials:
  - URO-EPIDIDYMITIS
  - URO-ORCHITIS
  - GEN-MED-INGUINAL-HERNIA
  - TRAUMA-SCROTAL-TRAUMA
  - URO-TESTICULAR-TUMOR
trace:
  - Sudden severe unilateral testicular pain
  - Nausea, vomiting, absent cremasteric reflex
  - High-riding testis, no relief with elevation
  - SURGICAL EMERGENCY - immediate exploration and bilateral orchiopexy
  - Do not delay for imaging if high clinical suspicion
