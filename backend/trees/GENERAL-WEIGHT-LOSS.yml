tree_id: GENERAL-WEIGHT-LOSS
name: Unintentional Weight Loss (Encounter)
version: '1.0'
status: draft
family: general
specialty: Primary Care
secondary_specialties:
  - Internal Medicine
urgency: routine
urgency_explanation: ''
chief_complaint: Unintentional weight loss
description: |
  Unintentional weight loss (>5% body weight over 6-12 months) requires evaluation for underlying cause.
  Differential is broad - malignancy, GI disorders, endocrine, psychiatric, medication side effects.
applies_to:
  sex: null
  age_min: null
  age_max: null
codes:
  icd10:
    - R63.4
  snomed:
    - '448765001'
  icpc2: []
sources:
  - text: UpToDate - Internal Medicine
    origin: citations
  - text: American Family Physician Guidelines
    origin: citations
presentations:
  - Weight loss without trying to lose weight
  - Clothes fitting more loosely
  - Decreased appetite or normal appetite with weight loss
  - Fatigue, weakness
  - May have symptoms of underlying condition
differentials:
  - Malignancy (especially GI, lung, hematologic)
  - Hyperthyroidism
  - Diabetes mellitus
  - GI disorders (celiac, IBD, malabsorption, peptic ulcer)
  - Chronic infections (TB, HIV, endocarditis)
  - Depression or psychiatric disorder
  - Medications (especially in elderly)
  - Substance abuse
  - Dementia or cognitive decline
  - Heart failure or COPD
workup:
  history:
    - Quantify weight loss (amount and timeframe)
    - Diet and appetite changes
    - GI symptoms (diarrhea, nausea, dysphagia, abdominal pain)
    - Fever, night sweats
    - Depression, anxiety
    - Substance use
    - Medications
  physical_exam:
    - Vital signs including orthostatics
    - General appearance, muscle wasting
    - Thyroid exam
    - Lymphadenopathy
    - Abdominal exam (masses, organomegaly)
    - Skin exam
  initial_laboratory_workup:
    - CBC
    - Comprehensive metabolic panel
    - TSH
    - Urinalysis
    - Fecal occult blood
    - HIV testing (if risk factors)
  additional_testing_based_on_clinical_suspicion:
    - Hemoglobin A1c (diabetes)
    - Celiac panel (anti-TTG IgA)
    - Inflammatory markers (ESR, CRP)
    - Chest X-ray
    - CT chest/abdomen/pelvis (if concern for malignancy)
    - Upper endoscopy or colonoscopy
treatment:
  treat_underlying_cause:
    - Hyperthyroidism - antithyroid medications
    - Diabetes - insulin or oral agents
    - Malabsorption - treat underlying cause, nutritional support
    - Depression - antidepressants, counseling
    - Malignancy - oncology referral
  nutritional_support:
    - Calorie-dense foods, frequent small meals
    - Nutritional supplements (Ensure, Boost)
    - Referral to dietitian
    - Consider appetite stimulants if appropriate
clinical_pearls:
  - Unintentional weight loss >5% over 6 months is significant
  - In elderly, most common causes are depression, cancer, cardiac disease
  - Malignancy found in 15-25% of cases with significant weight loss
  - Up to 25% may remain unexplained after workup
  - Always consider depression and medication side effects
  - Document baseline weight for future comparison
red_flags: []
disposition_guidance: {}
referrals:
  oncology:
    - Suspected malignancy
  gastroenterology:
    - Suspected malabsorption, celiac disease, IBD
  endocrinology:
    - Suspected hyperthyroidism, diabetes, adrenal insufficiency
special_populations: {}
