trace:
  - 62-year-old man with 20 lb unintentional weight loss over 4 months. Decreased appetite, fatigue. No GI symptoms. Labs show mild anemia, elevated ESR. CT shows pancreatic mass. Refer to oncology. Diagnosed with pancreatic cancer. Begin treatment.
