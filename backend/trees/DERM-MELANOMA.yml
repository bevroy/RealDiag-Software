tree_id: DERM-MELANOMA
name: Melanoma
family: Dermatology
specialty: Dermatology
chief_complaint: Changing mole or skin lesion
description: |
  Malignant tumor of melanocytes. Most deadly skin cancer. Early detection crucial for survival.
  ABCDE criteria: Asymmetry, Border irregularity, Color variation, Diameter >6mm, Evolution.
icd10: C43.9
urgency: High
workup:
  - Detailed skin examination with dermoscopy
  - ABCDE criteria assessment
  - Total body skin examination
  - Excisional biopsy with 1-3mm margins (diagnostic gold standard)
  - Sentinel lymph node biopsy if depth >0.8mm or ulceration present
  - Staging CT chest/abdomen/pelvis and brain MRI if stage IIC or higher
  - LDH level (elevated suggests metastatic disease)
  - Genetic testing for BRAF V600 mutation if stage III or IV
treatment:
  - Wide local excision: 0.5-1cm margins for in situ, 1cm for <1mm depth, 2cm for >1mm depth
  - Sentinel lymph node biopsy for staging (not therapeutic but prognostic)
  - Adjuvant immunotherapy for stage III: nivolumab or pembrolizumab (anti-PD-1) reduces recurrence by 50%
  - Adjuvant targeted therapy if BRAF V600 mutation: dabrafenib plus trametinib
  - Metastatic disease: First-line immunotherapy (nivolumab plus ipilimumab or pembrolizumab monotherapy)
  - BRAF/MEK inhibitors if BRAF mutated and immunotherapy fails
  - Radiation therapy for brain metastases or symptomatic lesions
clinical_pearls:
  - Breslow depth most important prognostic factor (survival decreases with increasing depth)
  - 5-year survival: 99% for stage IA, 10-15% for stage IV
  - Melanoma can arise de novo (70%) or from existing nevus (30%)
  - Amelanotic melanoma lacks pigment (5-10% of cases, easily missed)
  - Patients need lifelong surveillance every 3-6 months
  - Sun protection critical for prevention (SPF 30+, protective clothing, avoid tanning beds)
differentials:
  - Seborrheic keratosis
  - Basal cell carcinoma
  - Squamous cell carcinoma
  - Dysplastic nevus
  - Blue nevus
  - Dermatofibroma
trace:
  - Changing or new pigmented lesion → Dermoscopy and ABCDE criteria → Excisional biopsy → Pathology confirms melanoma with Breslow depth → Wide local excision with appropriate margins → Sentinel lymph node biopsy if indicated → Staging imaging if high-risk → Adjuvant therapy for stage III → Lifelong surveillance
