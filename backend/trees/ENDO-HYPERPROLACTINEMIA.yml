tree_id: ENDO-HYPERPROLACTINEMIA
name: Hyperprolactinemia
family: endocrinology
specialty: Endocrinology
icd10: E22.1
snomed: 237662005
urgency: []
homeopathy: []
presentations:
  - Women
  - Galactorrhea (inappropriate breast milk production)
  - Amenorrhea or oligomenorrhea (irregular or absent periods)
  - Infertility
  - Decreased libido
  - Vaginal dryness
  - Men
  - Erectile dysfunction
  - Decreased libido
  - Infertility
  - Gynecomastia
  - Galactorrhea (less common than in women)
  - Both sexes
  - Headaches or visual field defects (if large pituitary tumor)
  - Osteoporosis (chronic hyperprolactinemia causes hypogonadism)
workup:
  - Serum prolactin level
  - Normal: <20-25 ng/mL in women, <15-20 ng/mL in men
  - Mild elevation (25-100 ng/mL): often physiologic, stress, medications
  - Moderate elevation (100-200 ng/mL): often medications or prolactinoma
  - Marked elevation (>200 ng/mL): strongly suggests prolactinoma
  - Repeat if mildly elevated (prolactin affected by stress, timing, macroprolactin)
  - Check for macroprolactin (inactive form) if clinical picture doesn't fit
  - Rule out secondary causes
  - Medication review (most common cause)
  - Antipsychotics (risperidone, haloperidol), metoclopramide, domperidone
  - SSRIs, TCAs, verapamil, methyldopa
  - Pregnancy test (hCG) in women of childbearing age
  - TSH (hypothyroidism causes hyperprolactinemia)
  - Renal function (chronic kidney disease decreases prolactin clearance)
  - Pituitary MRI with contrast
  - Identify prolactinoma (microadenoma <10 mm, macroadenoma ≥10 mm)
  - Assess for stalk compression or other pituitary masses
  - Evaluate visual fields if macroadenoma present
  - Assess for hypogonadism
  - Testosterone in men, estradiol in women
  - LH, FSH
treatment:
  - Discontinue offending medications if possible (most common cause)
  - Pharmacologic treatment indications
  - Prolactinoma (any size) with symptoms
  - Macroadenoma regardless of symptoms (prevent tumor growth)
  - Hypogonadism or infertility from hyperprolactinemia
  - Dopamine agonists (first-line)
  - Cabergoline 0.25-0.5 mg twice weekly (preferred - more effective, better tolerated)
  - Increase gradually to 0.5-1 mg twice weekly based on prolactin levels
  - Bromocriptine 1.25-2.5 mg BID-TID (alternative, more side effects)
  - Side effects: nausea, orthostatic hypotension, headache, nasal congestion
  - Goals: normalize prolactin, restore gonadal function, shrink tumor
  - Monitoring
  - Prolactin level every 3 months until normalized, then every 6-12 months
  - Repeat MRI at 6-12 months to assess tumor shrinkage (if prolactinoma)
  - Surgery indications (rare, <10% of cases)
  - Drug intolerance or resistance
  - Visual field defects not responding to medical therapy
  - Apoplexy (pituitary hemorrhage) - emergency
  - Transsphenoidal resection by experienced neurosurgeon
  - Radiation therapy - rarely needed, for aggressive or refractory tumors
  - Pregnancy management
  - Discontinue dopamine agonist if microadenoma (unless symptomatic)
  - Continue if macroadenoma (risk of growth during pregnancy)
clinical_pearls:
  - "Medications most common cause of hyperprolactinemia - review drug list first!"
  - "Prolactin >200 ng/mL strongly suggests prolactinoma (prolactin proportional to tumor size)"
  - "Macroprolactinemia (inactive prolactin) causes falsely elevated levels without symptoms"
  - "Prolactinomas more common in women (microadenomas), macroadenomas more common in men (diagnosed later)"
  - "Cabergoline superior to bromocriptine - better efficacy, fewer side effects, once/twice weekly dosing"
  - "Dopamine agonists normalize prolactin in 90% and shrink tumors in 80-90%"
  - "Microadenomas rarely grow during pregnancy - can stop cabergoline; macroadenomas continue therapy"
  - "Visual field defects require urgent treatment - large tumors compress optic chiasm"
referrals:
  - Endocrinology for all cases of confirmed hyperprolactinemia
  - Neurosurgery if surgical intervention needed (drug resistance, visual defects, apoplexy)
  - Ophthalmology for formal visual field testing if macroadenoma
  - Reproductive endocrinology if infertility is primary concern
differentials:
  - Prolactinoma (pituitary adenoma secreting prolactin) - 40% of pituitary tumors
  - Medication-induced (antipsychotics, metoclopramide, SSRIs, verapamil) - most common
  - Hypothyroidism (elevated TRH stimulates prolactin)
  - Chronic kidney disease (decreased clearance)
  - Pregnancy or lactation (physiologic)
  - Pituitary stalk compression/disruption (any pituitary mass)
  - Idiopathic hyperprolactinemia
  - Macroprolactinemia (lab artifact, clinically insignificant)
  - Chest wall lesions (stimulate prolactin via nipple stimulation reflex)
trace:
  source: Endocrine Society Clinical Practice Guidelines on Hyperprolactinemia 2011, Pituitary Society Guidelines
  version: '1.0'
