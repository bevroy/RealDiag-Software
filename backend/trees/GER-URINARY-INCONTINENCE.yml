workup: []
treatment:
  - 'Classify type - stress (cough/sneeze), urge (overactive bladder), overflow (retention), mixed'
  - 'Pelvic floor exercises (Kegels) - 10 contractions TID, hold 10 sec each'
  - 'Bladder training - scheduled voiding Q2-3H, gradually increase intervals'
  - 'Urge incontinence: Antimuscarinic (oxybutynin 5mg BID-TID, tolterodine 2-4mg daily) OR beta-3 agonist (mirabegron 25-50mg daily)'
  - 'Avoid antimuscarinics in elderly (cognitive impairment) - prefer mirabegron'
  - 'Stress incontinence: Pessary trial, pelvic floor PT, surgical sling if severe'
  - 'Overflow: Treat obstruction (BPH with alpha-blocker or 5-ARI), intermittent self-cath if retention'
  - 'Fluid management - adequate hydration but avoid evening fluids, limit caffeine/alcohol'
  - 'Weight loss if obese'
  - 'Absorbent pads for residual symptoms'
  - 'Botulinum toxin bladder injection for refractory urge incontinence'
  - 'Surgical options - mid-urethral sling (stress), sacral neuromodulation (urge)'
