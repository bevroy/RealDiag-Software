  - id: cyanotic_chd
    type: diagnosis
    name: "Cyanotic Congenital Heart Disease"
    icd10: "Q24.9"
    urgency: critical
    workup:
      - Cyanotic CHD - Right-to-left shunt (deoxygenated blood bypasses lungs), hypoxemia, cyanosis
      - Prevalence - 8 per 1000 live births (all CHD), 25% cyanotic
      - Five "T's" - Tetralogy of Fallot, Transposition of great arteries, Truncus arteriosus, Tricuspid atresia, Total anomalous pulmonary venous return (TAPVR)
      - Tetralogy of Fallot (TOF) - Most common cyanotic CHD (5-7% all CHD)
      - Four features - VSD (large), overriding aorta, RV outflow obstruction (pulmonary stenosis), RV hypertrophy
      - Pathophysiology - RV outflow obstruction → high RV pressure → right-to-left shunt through VSD → cyanosis
      - Presentation - Cyanosis (not at birth, develops 3-6 months as RV outflow worsens), dyspnea on exertion, squatting (increases systemic vascular resistance, reduces right-to-left shunt, relieves dyspnea)
      - Tet spells - Hypercyanotic episodes (crying, feeding trigger increased RV outflow obstruction → worsening right-to-left shunt → severe hypoxemia, syncope, seizures, death if untreated)
      - Chest X-ray - "Boot-shaped heart" (RV hypertrophy, upturned apex)
      - Echo - Definitive diagnosis (visualize VSD, overriding aorta, pulmonary stenosis)
      - Transposition of great arteries (TGA) - Aorta arises from RV, pulmonary artery from LV (most common cyanotic lesion in newborns)
      - Parallel circulations (systemic and pulmonary separate) - FATAL without mixing
      - Mixing via PDA, ASD, or VSD necessary for survival
      - Presentation - Severe cyanosis at birth (within hours), not responsive to oxygen
      - Prostaglandin E1 infusion - EMERGENCY (keeps PDA open, allows mixing)
      - Definitive treatment - Arterial switch operation (within 1-2 weeks of life)
      - Other cyanotic lesions
      - Truncus arteriosus - Single arterial trunk from heart (aorta + pulmonary artery fail to separate)
      - Tricuspid atresia - No tricuspid valve (RV hypoplastic), requires ASD + VSD or PDA for survival
      - TAPVR - Pulmonary veins drain to right atrium (instead of left atrium)
      - Physical exam - Cyanosis (central, mucous membranes, not responsive to oxygen), clubbing (chronic), murmur varies by lesion
      - Hyperoxia test - 100% oxygen for 10 min, if PaO2 <100 mmHg suggests cyanotic CHD (vs. pulmonary cause)
      - Pulse oximetry screening - Newborn screening (right hand + foot, if SpO2 <95% or >3% difference → refer)
    treatment:
      - Tetralogy of Fallot
      - Tet spells - EMERGENCY
      - Knee-chest position (increases SVR, reduces right-to-left shunt)
      - Oxygen, morphine (sedation reduces oxygen demand)
      - IV fluids (increase preload)
      - Beta-blocker (propranolol, reduces RV outflow obstruction)
      - Sodium bicarbonate (correct acidosis)
      - Phenylephrine (increases SVR)
      - Surgical repair - Complete repair (close VSD, relieve RV outflow obstruction) at 3-12 months
      - Excellent outcomes (90% survival to adulthood)
      - Transposition of great arteries
      - Prostaglandin E1 0.05-0.1 mcg/kg/min IV infusion - IMMEDIATE (maintain PDA)
      - Balloon atrial septostomy (Rashkind procedure) - Emergent if inadequate mixing (create/enlarge ASD)
      - Arterial switch operation - Definitive, within 1-2 weeks (switch aorta/pulmonary artery to correct ventricles, reimplant coronaries)
      - 90% survival
      - General management cyanotic CHD
      - Avoid dehydration (increases blood viscosity, stroke risk)
      - Subacute bacterial endocarditis prophylaxis (before dental procedures)
      - Monitor for complications - Stroke, brain abscess, polycythemia (Hct >65%), iron deficiency

  - id: acyanotic_shunt
    type: diagnosis
    name: "Acyanotic CHD - Left-to-Right Shunt"
    icd10: "Q21.9"
    urgency: medium
    workup:
      - Acyanotic CHD - Left-to-right shunt (oxygenated blood recirculates through lungs), NO cyanosis, pulmonary overcirculation
      - Types - VSD, ASD, PDA (three most common CHD)
      - Ventricular septal defect (VSD) - Hole in ventricular septum, most common CHD (30-40%)
      - Pathophysiology - LV pressure > RV pressure → left-to-right shunt → increased pulmonary blood flow
      - Small VSD (restrictive) - Loud holosystolic murmur at left lower sternal border, asymptomatic, 70-80% close spontaneously by age 10
      - Moderate VSD - CHF in infancy (tachypnea, poor feeding, FTT, hepatomegaly), may close spontaneously 40%
      - Large VSD - Severe CHF, pulmonary hypertension develops (increased pulmonary blood flow → pulmonary vascular remodeling)
      - Eisenmenger syndrome - Long-standing large VSD → severe pulmonary hypertension → RV pressure exceeds LV → shunt reverses (right-to-left) → cyanosis
      - Irreversible, inoperable (pulmonary vasculopathy), poor prognosis
      - Atrial septal defect (ASD) - Hole in atrial septum (10-15% CHD)
      - Types - Secundum (most common 70%, central), primum (15%, associated AV canal defect), sinus venosus (10%, associated anomalous pulmonary venous return)
      - Pathophysiology - LA pressure > RA → left-to-right shunt → RV volume overload
      - Presentation - Often asymptomatic in childhood (diagnosed incidentally or adult), dyspnea on exertion, atrial arrhythmias (adults)
      - Exam - Fixed split S2 (RV stroke volume constant regardless respiration), soft systolic murmur (pulmonary flow)
      - Patent ductus arteriosus (PDA) - Ductus arteriosus fails to close (normally closes 48-72 hours after birth)
      - Pathophysiology - Aorta → pulmonary artery shunt → pulmonary overcirculation
      - Exam - Continuous "machinery" murmur (left infraclavicular), bounding pulses (wide pulse pressure)
      - Complications all left-to-right shunts - CHF (infants), pulmonary hypertension (if large untreated), Eisenmenger syndrome (late)
      - Chest X-ray - Cardiomegaly, increased pulmonary vascular markings
      - Echo - Visualize defect, quantify shunt (Qp:Qs ratio pulmonary:systemic flow, >1.5:1 significant)
    treatment:
      - VSD
      - Small - Observation (spontaneous closure likely), SBE prophylaxis NOT needed (post-2007 guidelines)
      - Moderate-large with CHF - Medical management (diuretics furosemide, ACE inhibitor captopril/enalapril, increase calories 150 kcal/kg/day for growth)
      - Surgical closure - If medical management fails, large defect (Qp:Qs >2:1), pulmonary hypertension developing
      - Timing - 3-12 months (before irreversible pulmonary hypertension)
      - Technique - Patch closure (Dacron or pericardial), open-heart surgery
      - Catheter device closure - Select small muscular VSDs
      - ASD
      - Small (<5 mm) - Observation (may close spontaneously by age 5)
      - Moderate-large - Closure to prevent complications (RV failure, atrial arrhythmias, paradoxical embolism/stroke)
      - Timing - Elective at age 2-5 years
      - Catheter device closure - FIRST-LINE for secundum ASD (90% success, minimally invasive)
      - Surgical closure - Primum, sinus venosus, or large secundum (patch closure)
      - PDA
      - Premature infants - Indomethacin or ibuprofen IV (inhibit prostaglandin synthesis, promote closure)
      - 70-80% close with medical therapy
      - Surgical ligation if failed medical
      - Term infants/children - Catheter device closure (coil or Amplatzer occluder) at 6-12 months
      - Surgical ligation if large PDA or device closure fails

  - id: acyanotic_obstruction
    type: diagnosis
    name: "Acyanotic CHD - Obstructive Lesions"
    icd10: "Q25.9"
    urgency: medium
    workup:
      - Obstructive lesions - Obstruction to blood flow (outflow or inflow), NO shunt, NO cyanosis
      - Types - Coarctation of aorta, aortic stenosis, pulmonary stenosis
      - Coarctation of aorta - Narrowing of descending aorta (at ductus arteriosus insertion, 5-8% CHD)
      - Associations - Turner syndrome (45,XO), bicuspid aortic valve (50%)
      - Pathophysiology - LV outflow obstruction → LV hypertrophy, hypertension (upper extremities), decreased perfusion lower body
      - Presentation - Asymptomatic (mild), CHF infants (severe), hypertension upper extremities, diminished lower extremity pulses
      - Exam - BP differential (upper > lower extremities >20 mmHg), weak/delayed femoral pulses, systolic ejection murmur (left infraclavicular)
      - Rib notching on CXR (collateral vessels erode ribs, age >5 years)
      - Aortic stenosis - Obstruction LV outflow (5% CHD)
      - Types - Valvular (most common 70%, bicuspid valve), subvalvular, supravalvular (Williams syndrome)
      - Presentation - Asymptomatic (mild), exertional chest pain/syncope (moderate-severe), CHF
      - Exam - Harsh systolic ejection murmur right upper sternal border, radiates to neck
      - Pulmonary stenosis - Obstruction RV outflow (8-10% CHD)
      - Presentation - Asymptomatic (mild), exertional dyspnea (moderate-severe)
      - Exam - Systolic ejection murmur left upper sternal border, widely split S2
    treatment:
      - Coarctation of aorta
      - Neonates with severe coarctation (ductal-dependent) - Prostaglandin E1 to maintain PDA (perfuse lower body)
      - Surgical repair - Resection + end-to-end anastomosis OR subclavian flap aortoplasty
      - Timing - Neonates (critical), elective age 2-5 years (mild)
      - Balloon angioplasty ± stent - Alternative for older children/adults, or re-coarctation
      - Complications - Recoarctation 10-20%, hypertension persists 30%
      - Aortic stenosis
      - Mild - Observation
      - Moderate-severe (gradient >50 mmHg) - Balloon valvuloplasty (first-line, catheter-based)
      - Surgical valvotomy or valve replacement (if failed balloon, severe regurgitation)
      - Ross procedure - Replace aortic valve with patient's own pulmonary valve, then pulmonary valve with homograft (avoids lifelong anticoagulation)
      - Pulmonary stenosis
      - Balloon valvuloplasty - FIRST-LINE (gradient >40-50 mmHg)
      - Excellent outcomes 90%
      - Surgical valvotomy - If dysplastic valve (not balloon amenable)
