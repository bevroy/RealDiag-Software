tree_id: DERM-ACNE-VULGARIS
name: Acne Vulgaris
family: Dermatology
specialty: Dermatology
chief_complaint: Facial pimples and oily skin
description: |
  Common inflammatory disorder of pilosebaceous units causing comedones, papules, pustules, nodules, and cysts. Affects 85% of adolescents and young adults.
  Pathogenesis involves follicular hyperkeratinization, excess sebum production, Cutibacterium acnes (formerly Propionibacterium) colonization, and inflammation. Can cause scarring and psychosocial distress.
icd10: L70.0
snomed: 88616000
urgency: Low
workup:
  - Clinical diagnosis - no testing needed
  - Assess severity - mild (comedones, few papules), moderate (more papules/pustules), severe (nodules, cysts)
  - Distribution - face (most common), back, chest
  - Lesion types - open comedones (blackheads), closed comedones (whiteheads), inflammatory papules, pustules, nodules, cysts
  - Assess for scarring - ice pick, rolling, boxcar scars
  - Consider secondary causes if atypical presentation
  - Hyperandrogenism in women - hirsutism, acanthosis nigricans, irregular menses (PCOS)
  - Check free/total testosterone, DHEA-S, 17-hydroxyprogesterone if suspected
  - Drug-induced acne - corticosteroids, lithium, phenytoin, isoniazid, anabolic steroids
  - Acne mechanica - friction/pressure from helmets, sports equipment, tight clothing
  - Exclude acneiform eruptions - rosacea (no comedones, telangiectasias, age greater than 30), perioral dermatitis, folliculitis
treatment:
  - Topical retinoids first-line for comedonal and mild-moderate inflammatory acne
  - Tretinoin 0.025-0.1% cream/gel nightly - normalizes follicular keratinization, prevents microcomedone formation
  - Adapalene 0.1-0.3% gel (less irritating than tretinoin, available OTC at 0.1%)
  - Tazarotene 0.1% gel (most potent but most irritating)
  - Start with lower concentrations, increase gradually to minimize irritation
  - Apply 20-30 minutes after washing face, pea-sized amount for entire face
  - Warn about initial purging (worsening at 2-4 weeks), photosensitivity
  - Topical antibiotics for inflammatory acne (combine with benzoyl peroxide to prevent resistance)
  - Benzoyl peroxide 2.5-10% gel/wash - antimicrobial, anti-inflammatory, prevents resistance
  - Clindamycin 1% or erythromycin 2% gel/solution (never use antibiotic alone, always with BP or retinoid)
  - Combination products - clindamycin/benzoyl peroxide gel, adapalene/benzoyl peroxide gel
  - Oral antibiotics for moderate-severe inflammatory acne or extensive involvement
  - Doxycycline 100mg daily or twice daily (preferred, anti-inflammatory effects)
  - Minocycline 100mg daily (more effective but more expensive, risk of hyperpigmentation, autoimmune syndromes)
  - Avoid tetracyclines in pregnancy, children less than 8 years (tooth discoloration)
  - Limit duration to 3-6 months to prevent resistance, continue topical therapy
  - Hormonal therapy for women with hormonal acne (premenstrual flares, jawline distribution)
  - Combination oral contraceptives (OCPs) - estrogen decreases androgen, progesterone varies (norgestimate, drospirenone, norethindrone FDA-approved)
  - Spironolactone 50-200mg daily - androgen receptor blocker, takes 3-6 months, requires contraception (teratogenic to male fetus), monitor potassium
  - Isotretinoin (Accutane) for severe nodulocystic acne or moderate acne refractory to other treatments
  - 0.5-1 mg/kg/day PO x 5-6 months, cumulative dose 120-150 mg/kg
  - iPLEDGE program required - pregnancy prevention (two forms of contraception), monthly pregnancy tests, FDA Risk Evaluation and Mitigation Strategy
  - Side effects - dry skin/lips, photosensitivity, elevated triglycerides/LFTs (monitor monthly), depression (controversial), teratogenicity
  - Cure rate 85%, most do not require second course
  - Intralesional corticosteroids for large nodules/cysts - triamcinolone 2.5-5 mg/mL injection
  - Adjunctive treatments - chemical peels (salicylic acid, glycolic acid), laser therapy for scars
clinical_pearls:
  - Takes 6-8 weeks to see improvement with any acne treatment
  - Topical retinoids cornerstone of therapy - treat and prevent, use long-term
  - Never use topical or oral antibiotics alone (resistance develops)
  - Acne often worsens first 2-4 weeks on retinoids (purging) before improvement
  - Scarring more likely with severe inflammatory acne, picking, delayed treatment
  - Adult acne increasing in women - consider hormonal causes, PCOS
  - Neonatal acne (3-6 months) and infantile acne (6-12 months) usually resolve spontaneously
differentials:
  - Rosacea
  - Folliculitis
  - Perioral dermatitis
  - Seborrheic dermatitis
  - Keratosis pilaris
  - Hidradenitis suppurativa
trace:
  - 17-year-old girl with moderate facial acne x 2 years, worse with menses → Exam shows comedones, inflammatory papules, pustules on face, mild scarring → Previous OTC benzoyl peroxide minimally effective → No signs of hyperandrogenism → Start adapalene 0.1% gel nightly and clindamycin/benzoyl peroxide gel each morning → Counsel on gradual improvement over 8-12 weeks, initial irritation → Symptoms initially worsen at week 3 (purging), patient wants to stop → Reassurance, continue treatment → Significant improvement by week 10, 75% clearance → Increase adapalene to 0.3% gel, continue benzoyl peroxide, discontinue clindamycin after 3 months → Mild acne persists, add spironolactone 100mg daily for hormonal component → Nearly complete clearance by 6 months, minimal scarring → Continues adapalene long-term for maintenance, discontinues spironolactone after 18 months
