tree_id: ONCO-ALL
name: Acute Lymphoblastic Leukemia (ALL)
family: Hematology Oncology
specialty: Hematology Oncology
icd10:
- C91.0
snomed:
- 91857003
urgency: urgent
description: Comprehensive evaluation and management of Acute Lymphoblastic Leukemia
  (ALL)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Fatigue, weakness, pallor
- Fever, infections
- Bleeding, petechiae
- Bone pain (common in children)
- Lymphadenopathy, hepatosplenomegaly
- Lymphoblasts on blood smear and bone marrow
- Most common cancer in children
workup:
- 'CBC: Pancytopenia with circulating lymphoblasts (may have WBC >100k)'
- 'Bone marrow biopsy: >20% lymphoblasts'
- 'Flow cytometry: B-ALL (CD19+, CD10+, TdT+) vs T-ALL (CD3+, CD7+, TdT+)'
- 'Cytogenetics: Hyperdiploidy (good prognosis), t(9;22) Ph+ (poor), t(4;11) MLL (very
  poor), t(12;21) (excellent)'
- 'LP with CSF cytology: Rule out CNS involvement'
treatment:
- 'Guideline-based treatment options for Acute Lymphoblastic Leukemia (ALL) include:'
- 'Multi-agent chemotherapy in phases: Induction (achieve remission) → Consolidation
  → Maintenance (2-3 years total) (ASH 2023)'
- 'Induction: Vincristine, prednisone, asparaginase +/- anthracycline (80-90% complete
  remission) (ASH 2023)'
- 'CNS prophylaxis: Intrathecal methotrexate or cytarabine (ASH 2023)'
- 'Ph+ ALL: Add tyrosine kinase inhibitor (imatinib, dasatinib) to chemotherapy (ASH
  2023)'
- 'Allogeneic HSCT: For high-risk ALL (Ph+, MLL rearrangement, poor response), relapsed
  disease (ASH 2023)'
clinical_pearls:
- Most common childhood malignancy (peak age 2-5 years) - excellent prognosis in children
  (90% cure)
- 'B-ALL (85%): CD19+, CD10+. T-ALL (15%): CD3+, presents with mediastinal mass, worse
  prognosis'
- 'Philadelphia chromosome positive (Ph+ ALL, 25% of adults): t(9;22) BCR-ABL - poor
  prognosis, needs tyrosine kinase inhibitor'
- CNS involvement in 5-10% at diagnosis - requires CNS prophylaxis (intrathecal chemotherapy)
- Tumor lysis syndrome high risk - start allopurinol, aggressive hydration before
  starting chemotherapy
referrals:
- Hematology/oncology urgently - ALL requires immediate treatment
- Pediatric oncology if child (better outcomes at specialized centers)
- Bone marrow transplant evaluation for high-risk or relapsed disease
differentials:
  - Aplastic anemia
  - Viral illness
  - ITP
  - Myelodysplastic syndrome
trace:
  source: National Comprehensive Cancer Network (NCCN) Guidelines, American Society
    of Hematology (ASH) Guidelines
