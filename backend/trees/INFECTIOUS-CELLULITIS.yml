tree_id: INFECTIOUS-CELLULITIS
name: Cellulitis
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Erythema, warmth, swelling of skin
description: |
  Acute bacterial infection of dermis and subcutaneous tissue. Most commonly caused by Streptococcus pyogenes (group A strep) and Staphylococcus aureus.
  Risk factors include skin breakdown, lymphedema, venous insufficiency, obesity, diabetes. Lower extremity most common site.
icd10: L03.90
urgency: Moderate
workup:
  - Clinical diagnosis - erythema, warmth, swelling, tenderness of skin, ill-defined borders spreading centrifugally
  - Distinguish from other causes of erythema - DVT (unilateral leg swelling, often calf), necrotizing fasciitis (severe pain out of proportion, systemic toxicity, rapid progression), venous stasis dermatitis (bilateral, hyperpigmentation, no fever)
  - Mark borders with pen to track progression or improvement
  - Blood cultures if systemic signs (fever, tachycardia, hypotension) - positive in less than 5% of uncomplicated cellulitis
  - Needle aspiration or punch biopsy rarely helpful (low yield)
  - Labs if systemic illness - CBC (leukocytosis), CRP (elevated), creatinine kinase (if necrotizing infection suspected)
  - Ultrasound to rule out abscess if fluctuant area or not improving on antibiotics
  - Consider alternative diagnoses if bilateral lower extremity involvement or no response to antibiotics
treatment:
  - Mild cellulitis (no systemic signs) - oral antibiotics outpatient
  - Cephalexin 500mg PO QID or cefazolin if parenteral needed (covers strep and MSSA)
  - If MRSA suspected (purulent drainage, abscess, high local prevalence) - add TMP-SMX 1-2 DS tablets BID or doxycycline 100mg BID
  - Alternative clindamycin 300-450mg TID (covers strep and MRSA but increasing resistance)
  - Duration 5-14 days depending on severity and response (5 days adequate for mild cases)
  - Moderate to severe cellulitis (systemic signs, immunocompromised, facial involvement) - hospitalize for IV antibiotics
  - IV cefazolin 1-2g q8h or ceftriaxone 1-2g daily
  - If MRSA suspected add vancomycin 15-20 mg/kg q8-12h (trough 15-20) or switch to vancomycin monotherapy
  - Transition to oral when afebrile x 24 hours and erythema improving
  - Supportive care - leg elevation, analgesia, mark borders to track progression
  - Treat predisposing conditions - athlete's foot (terbinafine), venous insufficiency (compression), lymphedema
  - Recurrent cellulitis (3 or more episodes) - consider prophylactic antibiotics (penicillin VK 250-500mg daily or erythromycin 250mg BID)
clinical_pearls:
  - Portal of entry often tinea pedis (athlete's foot) with fissuring between toes
  - Purpura, bullae, skin necrosis suggest more serious infection (necrotizing fasciitis, gas gangrene)
  - Facial cellulitis higher risk of intracranial extension (cavernous sinus thrombosis)
  - Crepitus on exam suggests gas-forming organisms (clostridial infection, necrotizing fasciitis) - surgical emergency
  - Chronic venous stasis dermatitis often mistaken for cellulitis but bilateral, no fever, hyperpigmentation
  - Erysipelas variant involves superficial dermis and lymphatics, raised sharp borders, face or lower legs
differentials:
  - Deep vein thrombosis
  - Venous stasis dermatitis
  - Contact dermatitis
  - Necrotizing fasciitis
  - Erysipelas
  - Gout
trace:
  - 55-year-old diabetic man with right lower leg erythema, warmth, swelling x 2 days → Temperature 38.5C, HR 105 → Exam shows erythema extending from ankle to mid-calf, warm, tender, no fluctuance → Mark borders with pen → Cracked skin between toes (tinea pedis) → WBC 14000 → Diagnose cellulitis with bacteremia risk → Admit for IV antibiotics → Start cefazolin 2g IV q8h → Blood cultures drawn (negative) → Erythema stops spreading by 24 hours, afebrile by 48 hours → Transition to cephalexin 500mg QID → Continue x 7 days total → Treat tinea pedis with terbinafine cream → Counsel on foot hygiene and early treatment of skin breakdown → Complete resolution
