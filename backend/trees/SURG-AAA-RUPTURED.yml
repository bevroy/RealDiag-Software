tree_id: SURG-AAA-RUPTURED
name: Ruptured Abdominal Aortic Aneurysm (rAAA)
family: Surgery
specialty: Surgery
icd10:
- I71.3
snomed:
- '233985008'
urgency: medium
description: Comprehensive evaluation and management of Ruptured Abdominal Aortic
  Aneurysm (rAAA)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Classic triad (50%): Abdominal/back pain, hypotension, pulsatile abdominal mass'
- Sudden onset severe abdominal, flank, or back pain (tearing, ripping quality)
- Hypotension, tachycardia, shock (may be contained rupture initially)
- Syncope or near-syncope
- Pulsatile abdominal mass on palpation (but absence doesn't rule out)
- 'Grey-Turner sign: Flank ecchymosis (retroperitoneal bleed)'
- 'Risk factors: Age >65, male, smoking, hypertension, known AAA'
- 'Mortality: 50% prehospital, 80-90% overall if untreated'
workup: []
treatment:
- 'Guideline-based treatment options for Ruptured Abdominal Aortic Aneurysm (rAAA)
  include:'
- 'Immediate: Large-bore IV access ×2, permissive hypotension (SBP 80-100), activate
  massive transfusion protocol (ACS 2023)'
- 'UNSTABLE: Call vascular surgery, go directly to OR, do NOT delay for imaging (ACS
  2023)'
- 'STABLE: CT angiogram abdomen/pelvis, vascular surgery consult, determine EVAR vs
  open (ACS 2023)'
- 'Blood products: 1:1:1 ratio PRBC:FFP:Platelets, avoid crystalloid overresuscitation
  (ACS 2023)'
- 'Disposition: OR emergently, ICU post-op, high mortality even with surgery (40-50%)
  (ACS 2023)'
clinical_pearls:
- 'Unstable patient (SBP <90) with known AAA or pulsatile mass: Go straight to OR,
  do NOT get CT'
- 'Permissive hypotension: Target SBP 80-100 until proximal control (avoid ''pop the
  clot'')'
- 'FAST exam: Free intraperitoneal or retroperitoneal fluid + hypotension = presumed
  rAAA'
- 'CT angiogram if stable: Confirms diagnosis, guides EVAR vs open repair'
- 'EVAR (endovascular repair): Faster, less invasive if anatomy suitable'
- 'Open repair: Midline laparotomy, proximal aortic control, higher mortality but
  definitive'
referrals:
  emergency:
    - Acute abdomen
    - Peritonitis
    - Perforated viscus
    - Ruptured AAA
    - Necrotizing fasciitis
  urgent:
    - Suspected malignancy
    - Bowel obstruction
    - Incarcerated hernia
    - Acute cholecystitis
  routine:
    - Elective hernia repair
    - Gallstones without cholecystitis
    - Benign masses
    - Screening abnormalities
differentials:
  - Kidney stone
  - Diverticulitis
  - Perforated ulcer
  - Mesenteric ischemia
  - Back pain
