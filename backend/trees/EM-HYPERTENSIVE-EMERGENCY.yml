urgency: urgent
description: Comprehensive evaluation and management of Hypertensive Emergency
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Severe hypertension: SBP >180 mmHg or DBP >120 mmHg'
- Evidence of acute end-organ damage (distinguishes from urgency)
- 'CNS: Hypertensive encephalopathy (confusion, headache, seizures, vision changes)'
- 'Cardiac: Acute MI, acute heart failure, pulmonary edema (flash pulmonary edema)'
- 'Renal: Acute kidney injury (Creatinine elevated, reduced urine output)'
- 'Vascular: Aortic dissection, acute stroke (hemorrhagic or ischemic)'
- 'Retinal: Hemorrhages, exudates, papilledema on fundoscopy (grade III-IV hypertensive
  retinopathy)'
- 'Hematologic: Microangiopathic hemolytic anemia (MAHA), thrombocytopenia'
- 'Risk factors: Medication noncompliance, chronic kidney disease, stimulant use (cocaine,
  amphetamines)'
- Chest pain if cardiac ischemia or dissection
- Dyspnea if pulmonary edema or heart failure
- Nausea, vomiting if increased intracranial pressure
workup: []
treatment:
- 'Guideline-based treatment options for Hypertensive Emergency include:'
- 'Workup: ECG, troponin, BNP, Cr, UA, CXR, CT head if neurologic symptoms (ACEP 2023)'
- 'IV antihypertensives: Nicardipine 5mg/hr (titrate by 2.5mg/hr q5-15min, max 15mg/hr)
  (ACEP 2023)'
- 'Alternative: Labetalol 20mg IV bolus, repeat 40-80mg q10min (max 300mg) or infusion
  0.5-2mg/min (ACEP 2023)'
- 'Specific scenarios: Dissection (esmolol+nicardipine), stroke (permissive hypertension
  unless >220/120), eclampsia (magnesium+labetalol/hydralazine) (ACEP 2023)'
- 'Disposition: ICU admission for continuous BP monitoring and IV medication titration
  (ACEP 2023)'
clinical_pearls:
- Hypertensive emergency = elevated BP + end-organ damage (requires ICU, IV meds)
- Hypertensive urgency = elevated BP, no end-organ damage (can treat PO, discharge)
- 'Goal: Reduce BP by 10-20% in first hour, then 25% in first 24 hours - NOT normal
  immediately'
- 'Avoid rapid BP drop: Can worsen cerebral/cardiac/renal perfusion'
- 'First-line IV agents: Nicardipine, labetalol, clevidipine (avoid nitroprusside
  - cyanide toxicity)'
- 'Exception: Aortic dissection needs aggressive BP reduction (SBP <120 in 20 min)'
