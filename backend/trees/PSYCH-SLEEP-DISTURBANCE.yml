tree_id: PSYCH-SLEEP-DISTURBANCE
name: Sleep Disturbance
family: psychiatry
specialty: Psychiatry/Sleep Medicine
icd10: G47.9
snomed: 39898005
urgency: []
homeopathy: []
presentations:
  - Difficulty initiating sleep (taking longer than 30 minutes to fall asleep)
  - Difficulty maintaining sleep (frequent awakenings, trouble returning to sleep)
  - Early morning awakening (waking 2+ hours before desired, unable to return to sleep)
  - Non-restorative sleep (feeling unrefreshed despite adequate sleep time)
  - Daytime consequences: fatigue, irritability, poor concentration, mood disturbance, reduced performance
  - Frequency: at least 3 nights per week
  - Duration: at least 3 months for chronic insomnia
  - Occurs despite adequate opportunity for sleep
workup:
  - Comprehensive sleep history
  - Sleep-wake schedule (bedtime, wake time, naps)
  - Sleep latency (time to fall asleep)
  - Number and duration of awakenings
  - Total sleep time
  - Sleep quality and restfulness
  - Daytime sleepiness and functioning
  - Identify type of insomnia
  - Sleep onset insomnia (difficulty falling asleep)
  - Sleep maintenance insomnia (difficulty staying asleep)
  - Early morning awakening
  - Mixed insomnia
  - Sleep diary (2 weeks) - gold standard for assessment
  - Bedtime, wake time, sleep latency, awakenings, naps
  - Identify patterns and triggers
  - Screen for primary sleep disorders
  - Obstructive sleep apnea (snoring, witnessed apneas, gasping, daytime sleepiness, obesity)
  - Restless legs syndrome (urge to move legs, worse at night, relieved by movement)
  - Periodic limb movement disorder
  - Circadian rhythm disorders (shift work, delayed sleep phase)
  - Narcolepsy (excessive daytime sleepiness, cataplexy)
  - Identify contributing factors
  - Medical conditions (pain, GERD, nocturia, hyperthyroidism)
  - Medications (stimulants, corticosteroids, beta-blockers, SSRIs, diuretics)
  - Substances (caffeine, alcohol, nicotine)
  - Psychiatric conditions (depression, anxiety, PTSD)
  - Poor sleep hygiene
  - Environmental factors (noise, light, temperature, partner)
  - Assess daytime impairment
  - Epworth Sleepiness Scale
  - Insomnia Severity Index (ISI)
  - Impact on work, relationships, quality of life
  - Mental health screening
  - Depression (PHQ-9)
  - Anxiety (GAD-7)
  - Consider polysomnography if
  - Suspected sleep apnea, restless legs, or other primary sleep disorder
  - Treatment-refractory insomnia
  - Unusual or dangerous behaviors during sleep
treatment:
  - Cognitive Behavioral Therapy for Insomnia (CBT-I) - FIRST-LINE TREATMENT
  - Most effective long-term treatment (superior to medications)
  - Components
  - Sleep hygiene education
  - Stimulus control (bed only for sleep and sex, leave bed if awake >20 min)
  - Sleep restriction (limit time in bed to actual sleep time, gradually increase)
  - Cognitive therapy (address worries and beliefs about sleep)
  - Relaxation techniques
  - Typically 4-8 sessions, 75-80% effective
  - Effects sustained long-term (unlike medications)
  - Sleep hygiene (foundational but insufficient alone)
  - Consistent sleep-wake schedule (same bedtime and wake time, even weekends)
  - Avoid naps or limit to 20-30 minutes before 3 PM
  - Avoid caffeine after noon
  - Avoid alcohol (disrupts sleep architecture)
  - Avoid large meals, fluids, or exercise within 2-3 hours of bedtime
  - Create sleep-conducive environment (cool, dark, quiet, comfortable)
  - Limit screen time 1 hour before bed (blue light suppresses melatonin)
  - Establish relaxing bedtime routine
  - Pharmacotherapy (SHORT-TERM use only, NOT first-line)
  - Non-benzodiazepine hypnotics (Z-drugs)
  - Zolpidem 5-10 mg at bedtime (short-acting, for sleep onset)
  - Eszopiclone 1-3 mg at bedtime (longer-acting, for sleep maintenance)
  - Zaleplon 5-10 mg at bedtime (ultra-short-acting)
  - Limit to 2-4 weeks - tolerance, dependence, rebound insomnia
  - Melatonin receptor agonist
  - Ramelteon 8 mg at bedtime (no abuse potential, for sleep onset)
  - Orexin receptor antagonist
  - Suvorexant 10-20 mg at bedtime (for sleep maintenance)
  - Sedating antidepressants (if comorbid depression or anxiety)
  - Trazodone 25-100 mg at bedtime (off-label, commonly used)
  - Mirtazapine 7.5-15 mg at bedtime
  - Doxepin 3-6 mg at bedtime (FDA-approved for insomnia)
  - Over-the-counter options (limited evidence)
  - Melatonin 0.5-5 mg 1-2 hours before bed (helps circadian regulation)
  - Avoid antihistamines (diphenhydramine, doxylamine) - anticholinergic effects, tolerance
  - Avoid benzodiazepines long-term (diazepam, temazepam)
  - High addiction potential, cognitive impairment, falls, rebound insomnia
  - Treat underlying conditions
  - Optimize treatment of depression, anxiety, pain, GERD, etc.
  - CPAP for sleep apnea
  - Medications for restless legs syndrome
clinical_pearls:
  - "Chronic insomnia affects 10-15% of adults, acute insomnia 30-35%"
  - "CBT-I is gold standard, first-line treatment - more effective long-term than medications"
  - "Sleep medications should be SHORT-TERM only (2-4 weeks) - tolerance, dependence, rebound insomnia common"
  - "Insomnia is both symptom and risk factor for depression/anxiety - treat both"
  - "Sleep restriction paradoxically improves insomnia - initially restricts time in bed to actual sleep time"
  - "Stimulus control breaks association between bed and wakefulness"
  - "Avoid 'trying' to sleep - creates performance anxiety and worsens insomnia"
  - "Screen for sleep apnea - present in 30-40% of patients with insomnia"
referrals:
  - Sleep medicine specialist if primary sleep disorder suspected (sleep apnea, restless legs, narcolepsy)
  - Mental health provider trained in CBT-I (most effective treatment)
  - Psychiatry if severe psychiatric comorbidity
  - Sleep study (polysomnography) if sleep apnea, RLS, or other primary sleep disorder suspected
differentials:
  - Primary insomnia (difficulty sleeping without other cause)
  - Insomnia due to psychiatric disorder (depression, anxiety, PTSD)
  - Obstructive sleep apnea (snoring, apneas, gasping, daytime sleepiness)
  - Restless legs syndrome (urge to move legs, worse at night, relieved by movement)
  - Circadian rhythm disorders (shift work disorder, delayed sleep phase)
  - Medication or substance-induced insomnia (stimulants, caffeine, alcohol, SSRIs)
  - Medical condition-related insomnia (pain, GERD, nocturia, hyperthyroidism)
  - Periodic limb movement disorder (repetitive leg movements during sleep)
  - Narcolepsy (excessive daytime sleepiness, cataplexy)
