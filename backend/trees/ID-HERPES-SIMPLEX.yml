tree_id: ID-HERPES-SIMPLEX
name: Herpes Simplex Virus (HSV) Infection
family: infectious_disease
specialty: Infectious Disease
icd10: B00.9
snomed: 88594005
urgency: []
homeopathy: []
presentations:
  - Painful vesicles or ulcers on genital, oral, or other areas
  - Primary infection more severe than recurrences
  - Prodrome of tingling, burning, or itching before lesions
  - Grouped vesicles on erythematous base
  - Painful inguinal lymphadenopathy (genital HSV)
  - Fever, malaise, myalgias (primary infection)
  - Dysuria (genital HSV with urethritis)
  - Recurrent episodes at same anatomic site
  - Asymptomatic viral shedding common
  - History of similar prior episodes
workup:
  - PCR (preferred) or viral culture from active lesion
  - Direct fluorescent antibody (DFA) or Tzanck smear (less sensitive)
  - HSV type-specific serology (IgG) - distinguishes HSV-1 from HSV-2
  - HSV IgG positive indicates past infection; does not indicate current infection
  - HSV IgM not recommended (poor sensitivity/specificity)
  - Consider serology in partners of infected patients for counseling
  - Test for other STIs (HIV, syphilis, gonorrhea, chlamydia) if genital HSV
  - Pregnancy test in women of reproductive age (neonatal HSV risk)
treatment:
  - First episode genital HSV: Valacyclovir 1 g PO BID x 7-10 days
  - Alternative: Acyclovir 400 mg PO TID x 7-10 days
  - Alternative: Famciclovir 250 mg PO TID x 7-10 days
  - Recurrent genital HSV (episodic therapy): Valacyclovir 500 mg PO BID x 3 days
  - Alternative: Acyclovir 800 mg PO TID x 2 days
  - Suppressive therapy (≥6 recurrences/year): Valacyclovir 500 mg PO daily
  - Alternative: Acyclovir 400 mg PO BID daily
  - Orolabial HSV: Valacyclovir 2 g PO q12h x 1 day (started within 1 hour of prodrome)
  - Severe or disseminated HSV: Acyclovir 5-10 mg/kg IV q8h
  - Pregnancy: Suppressive therapy starting at 36 weeks to reduce transmission risk
  - Counseling about transmission, asymptomatic shedding, and recurrence
clinical_pearls:
  - "HSV-1 traditionally oral, HSV-2 genital, but either can infect any site"
  - "Genital herpes prevalence: HSV-2 12% of US population; HSV-1 genital increasing"
  - "Asymptomatic viral shedding accounts for most transmission (not during outbreaks)"
  - "Suppressive therapy reduces transmission to partners by 50%"
  - "Recurrence frequency: HSV-2 genital 4-5/year; HSV-1 genital 1/year; HSV-1 oral 1-2/year"
  - "Triggers for recurrence: stress, illness, UV exposure, menstruation, immunosuppression"
  - "First episode is usually most severe; lasts 2-3 weeks without treatment"
  - "Neonatal HSV can be devastating - C-section recommended if active lesions at delivery"
  - "HSV encephalitis is medical emergency - acyclovir IV must be started immediately"
  - "Erythema multiforme can be triggered by recurrent HSV"
referrals:
  - Infectious Disease for severe, disseminated, or resistant infections
  - Neurology if concern for HSV encephalitis or meningitis
  - Ophthalmology for HSV keratitis (dendritic ulcers)
  - OB/GYN for genital HSV in pregnancy
  - Neonatology if neonatal HSV suspected
differentials:
  - Syphilis (chancre is painless, indurated, single ulcer)
  - Chancroid (painful ulcer with purulent base, rare in US)
  - Aphthous ulcers (non-infectious, recurrent oral ulcers, not vesicular)
  - Herpes zoster (dermatomal distribution, usually unilateral)
  - Contact dermatitis (history of exposure, pruritic rather than painful)
  - Behçet's disease (recurrent oral and genital ulcers, systemic symptoms)
trace:
  source: CDC Sexually Transmitted Infections Treatment Guidelines 2021, IDSA HSV Guidelines
