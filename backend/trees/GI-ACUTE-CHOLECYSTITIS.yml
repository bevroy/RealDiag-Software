tree_id: GI-ACUTE-CHOLECYSTITIS
name: Acute Cholecystitis
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Right upper quadrant pain with fever
description: |
  Acute inflammation of gallbladder, 90-95% from cystic duct obstruction by gallstone (calculous cholecystitis). Bacterial infection develops secondarily.
  Acalculous cholecystitis (5-10%) occurs in critically ill patients. Complications include gangrene, perforation, emphysematous cholecystitis.
icd10: K81.0
urgency: High
workup:
  - Clinical presentation - right upper quadrant (RUQ) or epigastric pain (constant, lasting greater than 4-6 hours), fever, nausea/vomiting
  - Murphy's sign - inspiratory arrest with deep palpation of RUQ (most specific physical finding, 65% sensitive)
  - Labs - leukocytosis (WBC greater than 10000), elevated CRP, mild transaminase elevation (less than 300 U/L), bilirubin may be mildly elevated
  - If bilirubin greater than 3 mg/dL or AST/ALT greater than 300, consider choledocholithiasis (common bile duct stone)
  - Right upper quadrant ultrasound first-line imaging - shows gallstones, gallbladder wall thickening (greater than 3 mm), pericholecystic fluid, sonographic Murphy sign
  - Ultrasound 90% sensitive for gallstones, 80% sensitive for acute cholecystitis
  - HIDA scan (cholescintigraphy) if ultrasound equivocal - non-visualization of gallbladder indicates cystic duct obstruction (diagnostic for cholecystitis)
  - CT abdomen if complicated cholecystitis suspected - shows pericholecystic inflammation, gas in wall (emphysematous), perforation
  - MRCP if concern for choledocholithiasis
treatment:
  - NPO, IV fluids, analgesia (opioids, NSAIDs)
  - Antibiotics - cover gram-negative and anaerobes
  - Ceftriaxone 1-2g IV daily plus metronidazole 500mg IV q8h, or piperacillin-tazobactam 3.375g IV q6h
  - Laparoscopic cholecystectomy within 72 hours of symptom onset (early surgery) reduces complications and length of stay
  - Early cholecystectomy preferred over delayed (reduces recurrent symptoms, readmissions)
  - If patient presents after 72 hours with severe inflammation, may consider delayed surgery (6-8 weeks) vs early based on clinical scenario
  - Intraoperative cholangiogram if concern for CBD stones
  - Open cholecystectomy if unable to complete laparoscopically (dense adhesions, unclear anatomy, complications)
  - Percutaneous cholecystostomy tube if too unstable for surgery (critically ill, severe comorbidities) - temporary drainage, interval cholecystectomy when stabilized
  - Endoscopic transpapillary gallbladder drainage alternative to percutaneous tube
  - Complications - gangrenous cholecystitis (20%), perforation (10%, gallbladder fossa or free perforation with peritonitis), emphysematous cholecystitis (gas-forming organisms, diabetics)
clinical_pearls:
  - Tokyo Guidelines grade severity - Grade I (mild, no organ dysfunction), Grade II (moderate, WBC greater than 18000, palpable mass, symptoms greater than 72 hours), Grade III (severe, organ dysfunction)
  - Acalculous cholecystitis in critically ill, post-op, burn, or trauma patients - ischemia and bile stasis
  - Emphysematous cholecystitis from Clostridium perfringens or E. coli - gas in wall, higher perforation risk, emergency cholecystectomy
  - Mirizzi syndrome - impacted stone in cystic duct or Hartmann pouch compressing common hepatic duct causing jaundice
  - Boas sign (referred pain to right subscapular area), Boa's hyperesthesia
  - Conversion rate from laparoscopic to open 5-10% (higher in elderly, males, acute inflammation)
differentials:
  - Biliary colic
  - Choledocholithiasis
  - Acute hepatitis
  - Peptic ulcer disease
  - Acute pancreatitis
  - Right lower lobe pneumonia
trace:
  - 58-year-old woman with constant RUQ pain x 18 hours, fever 38.5C, vomiting → History of prior biliary colic episodes → Exam shows RUQ tenderness, positive Murphy sign → WBC 15000, CRP 95 mg/L, ALT 85 U/L, bilirubin 1.4 mg/dL → RUQ ultrasound shows multiple gallstones, gallbladder wall thickening 5 mm, pericholecystic fluid, sonographic Murphy sign positive → Diagnose acute calculous cholecystitis → Admit, NPO, IV fluids, ceftriaxone 2g IV daily and metronidazole 500mg IV q8h → Hydromorphone PCA for pain → Laparoscopic cholecystectomy performed within 24 hours → Intraoperative findings confirm inflamed gallbladder, no CBD stones on cholangiogram → Pathology shows acute cholecystitis → Postop recovery uneventful, discharged POD 1 on oral antibiotics x 3 days → Follow-up at 2 weeks, incisions healed, tolerating regular diet, pain resolved
