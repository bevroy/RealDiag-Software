tree_id: ID-TUBERCULOSIS-PULMONARY
name: Pulmonary Tuberculosis (TB)
family: Infectious Disease
specialty: Infectious Disease
icd10:
- A15.0
snomed:
- '154283005'
urgency: medium
description: Comprehensive evaluation and management of Pulmonary Tuberculosis (TB)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Chronic cough (>3 weeks), hemoptysis
- Fever, night sweats, weight loss ("B symptoms")
- 'Chest X-ray: Upper lobe cavitary lesions, infiltrates, hilar lymphadenopathy'
- AFB smear and culture from sputum
- TST or IGRA positive (but can be negative in active TB)
- 'Risk factors: HIV, homelessness, incarceration, immigration from endemic areas'
workup:
- Sputum AFB smear and culture x3 (morning specimens)
- Chest X-ray (PA and lateral)
- TST or IGRA (QuantiFERON)
- HIV test (high co-infection rate)
- Baseline liver function tests, CBC, creatinine
treatment:
- 'Guideline-based treatment options for Pulmonary Tuberculosis (TB) include:'
- 'RIPE therapy: Rifampin 600mg, Isoniazid 300mg, Pyrazinamide 1500mg, Ethambutol
  1200mg daily (IDSA 2024)'
- 'Intensive phase: All 4 drugs x 2 months (IDSA 2024)'
- 'Continuation phase: Rifampin + Isoniazid x 4 months (total 6 months) (IDSA 2024)'
- Add pyridoxine (vitamin B6) 25-50mg daily to prevent isoniazid neuropathy (IDSA
  2024)
- Monitor liver function tests (hepatotoxicity risk) (IDSA 2024)
clinical_pearls:
- 'Suspect TB: Chronic cough + fever + night sweats + weight loss + upper lobe cavities'
- Airborne precautions (negative pressure room)
- 'RIPE therapy x 6 months: Rifampin, Isoniazid, Pyrazinamide, Ethambutol'
- Directly observed therapy (DOT) improves adherence and prevents resistance
- Report to public health department (notifiable disease)
referrals:
- Infectious disease or TB clinic (directly observed therapy)
- Public health notification (mandatory reporting)
- HIV clinic if co-infected
differentials: []
trace:
  source: Infectious Diseases Society of America (IDSA) Guidelines, Centers for Disease
    Control and Prevention (CDC)
