tree_id: ORTHO-TROCHANTERIC-BURSITIS
name: Trochanteric Bursitis
family: orthopedics
specialty: Orthopedics
icd10: M70.60
snomed: 88151007
urgency: []
homeopathy: []
presentations:
  - Lateral hip pain over greater trochanter
  - Pain worse when lying on affected side
  - Pain with climbing stairs, rising from chair, or prolonged walking
  - Pain may radiate down lateral thigh to knee
  - Tenderness to palpation over greater trochanter
  - Pain with resisted hip abduction
  - Gradual onset over weeks to months
  - More common in women, middle-aged to older adults
  - Risk factors: leg length discrepancy, hip OA, lateral hip trauma
workup:
  - Clinical diagnosis based on history and physical examination
  - Physical examination
  - Point tenderness over greater trochanter (key finding)
  - Pain with palpation of lateral hip
  - Pain with resisted hip abduction (gluteus medius activation)
  - Positive Patrick test (FABER) may reproduce lateral hip pain
  - Trendelenburg sign if gluteus medius weakness
  - Assess for leg length discrepancy
  - Distinguish from hip joint pathology (groin pain in hip OA vs lateral pain in bursitis)
  - Imaging
  - Usually not needed for diagnosis
  - Hip X-rays if suspicion of hip OA or other bony pathology
  - MRI or ultrasound can confirm bursitis and assess for gluteal tendon tears
  - Consider if refractory to treatment or atypical presentation
  - Laboratory tests not indicated
treatment:
  - Non-pharmacologic (first-line)
  - Activity modification
  - Avoid lying on affected side
  - Avoid crossing legs, prolonged standing, stairs
  - Use pillow between knees when sleeping on side
  - Physical therapy
  - Stretching exercises (IT band, hip flexors, gluteus medius)
  - Strengthening exercises (hip abductors, core stability)
  - Address contributing factors (leg length discrepancy, biomechanical issues)
  - Ice application 15-20 minutes several times daily
  - Weight loss if obese (reduces lateral hip stress)
  - Correct leg length discrepancy if present (shoe lift)
  - Pharmacologic
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Acetaminophen 1000 mg TID if NSAIDs contraindicated
  - Topical NSAIDs (diclofenac gel) can be applied to lateral hip
  - Intra-articular injection
  - Corticosteroid injection into trochanteric bursa
  - Very effective - 60-80% short-term relief
  - Ultrasound or landmark-guided injection
  - Triamcinolone 40 mg or methylprednisolone 80 mg + lidocaine
  - Relief typically lasts 3-6 months
  - Can repeat if needed (limit to 3-4 per year)
  - Surgical management (rarely needed)
  - Bursectomy or IT band release if refractory to conservative treatment >6-12 months
  - Gluteal tendon repair if significant tear identified on MRI
clinical_pearls:
  - "Trochanteric bursitis now called 'greater trochanteric pain syndrome' - includes bursitis and gluteal tendinopathy"
  - "Lateral hip pain over greater trochanter - NOT groin pain (groin = hip joint pathology)"
  - "Pain worse lying on affected side is classic symptom"
  - "Often coexists with hip OA, IT band syndrome, or gluteus medius tendinopathy"
  - "Point tenderness over greater trochanter is key diagnostic finding"
  - "Corticosteroid injection highly effective - 60-80% improve"
  - "Most cases resolve with conservative treatment within 6-12 weeks"
  - "Women affected 4x more than men"
referrals:
  - Physical therapy for stretching and strengthening program
  - Orthopedics if refractory to conservative treatment >3-6 months
  - Sports medicine for ultrasound-guided injection if needed
differentials:
  - Trochanteric bursitis (lateral hip pain, point tenderness over greater trochanter)
  - Hip osteoarthritis (groin pain, limited internal rotation)
  - Gluteus medius/minimus tendinopathy (lateral hip pain, positive Trendelenburg)
  - IT band syndrome (lateral hip/thigh pain, worse with running)
  - Lumbar radiculopathy L4-L5 (radiating leg pain, neurologic deficits)
  - Meralgia paresthetica (lateral thigh numbness/tingling, no hip pain)
  - Hip labral tear (anterior hip pain, clicking, young active adults)
  - Stress fracture of femoral neck (constant pain, worse with weight-bearing)
