tree_id: PEDS-FAILURE-TO-THRIVE
name: Failure to Thrive (Encounter)
family: pediatrics
specialty: Pediatrics/Gastroenterology
icd10: R62.51
snomed: 432788005
urgency:
  - Severe malnutrition with lethargy or altered mental status
  - Signs of dehydration (sunken fontanelle, poor skin turgor, oliguria)
  - Hypoglycemia
  - Suspected abuse or neglect with immediate safety concerns
  - Severe electrolyte abnormalities
homeopathy: []
presentations:
  - Weight below 5th percentile for age
  - Weight-for-length or BMI below 5th percentile
  - Deceleration in weight crossing 2 or more major percentile lines
  - Inadequate weight gain over time (flattening of growth curve)
  - May have normal or low height (height more affected in chronic malnutrition)
  - Head circumference may be affected (in severe chronic cases)
  - Decreased subcutaneous fat (wasted appearance, prominent ribs)
  - Decreased muscle mass
  - Thin hair, dry skin
  - Listlessness, decreased activity, or developmental delays
  - Poor feeding or decreased appetite
  - Vomiting or diarrhea (if GI pathology)
  - Recurrent infections (if immunodeficiency or malnutrition)
  - Social concerns (poverty, food insecurity, neglect)
workup:
  - Growth assessment (MOST IMPORTANT)
  - Accurate weight, length/height, head circumference
  - Plot on WHO growth charts (age 0-2 years) or CDC charts (age greater than 2 years)
  - Calculate weight-for-length (age less than 2 years) or BMI (age greater than 2 years)
  - Review growth trajectory over time (serial measurements essential)
  - Assess pattern of growth failure
  - Weight affected first (acute malnutrition)
  - Then length/height (chronic malnutrition)
  - Head circumference affected last (severe chronic malnutrition or neurologic cause)
  - Nutritional history (comprehensive)
  - Feeding history
  - Breastfeeding: frequency, duration, technique, maternal milk supply
  - Formula: type, concentration (proper mixing), volume per feeding, frequency
  - Solid foods: timing of introduction, types, amounts, textures
  - Total daily caloric intake (estimate calories consumed)
  - Fluid intake
  - Mealtime behaviors (duration, distractions, battles)
  - Food refusal, selectivity, or aversions
  - Vomiting or regurgitation
  - Frequency, timing (with feeds versus hours later)
  - Projectile (pyloric stenosis), bilious (obstruction), blood
  - Stool pattern
  - Frequency, consistency, color
  - Diarrhea (malabsorption, infection)
  - Constipation
  - Blood or mucus in stool
  - Foul-smelling or greasy stools (fat malabsorption - cystic fibrosis, celiac)
  - Appetite
  - Decreased appetite (organic causes, chronic illness)
  - Excessive appetite with poor weight gain (hyperthyroidism, malabsorption, diabetes)
  - Medical history
  - Prenatal and birth history
  - Prematurity, IUGR (intrauterine growth restriction)
  - Maternal substance use, infections
  - Perinatal complications
  - Past medical history
  - Chronic illnesses (cardiac, pulmonary, renal, GI, endocrine, neurologic)
  - Recurrent infections (immunodeficiency, cystic fibrosis)
  - Medications (may affect appetite or absorption)
  - Developmental history
  - Developmental delays (may be cause or consequence of FTT)
  - Feeding skills (suck-swallow coordination, chewing, self-feeding)
  - Oral-motor dysfunction or swallowing difficulties
  - Family history
  - Genetic syndromes, metabolic disorders
  - Short stature or constitutional growth delay
  - Celiac disease, inflammatory bowel disease, cystic fibrosis
  - Parental heights (calculate mid-parental height)
  - Social history (CRITICAL)
  - Family structure, primary caregiver
  - Socioeconomic status, food insecurity, poverty
  - Housing stability, access to clean water
  - Parental mental health (depression, substance abuse)
  - Parental understanding of feeding and nutrition
  - Parent-child interaction during feeding
  - Stressors, domestic violence, neglect concerns
  - WIC (Women, Infants, and Children) enrollment
  - Physical examination
  - Vital signs (temperature, heart rate, respiratory rate, blood pressure)
  - General appearance and behavior
  - Alert, interactive versus lethargic, listless
  - Developmental assessment (gross motor, fine motor, language, social)
  - Anthropometric measurements
  - Weight, length/height, head circumference (plot on growth charts)
  - Mid-upper arm circumference (MUAC) - reflects muscle and fat stores
  - Skin assessment
  - Decreased subcutaneous fat, prominent ribs and scapulae
  - Dry skin, poor skin turgor (dehydration)
  - Rashes (atopic dermatitis, zinc deficiency)
  - Bruising or marks (concern for abuse)
  - Hair and nails
  - Thin, sparse hair (protein-energy malnutrition, zinc deficiency)
  - Brittle nails
  - Oral examination
  - Oral thrush (immunodeficiency, malnutrition)
  - Dental caries
  - Cleft palate, high-arched palate
  - Cardiovascular examination
  - Murmur (congenital heart disease causes FTT)
  - Tachycardia, poor perfusion
  - Respiratory examination
  - Tachypnea, retractions (chronic lung disease)
  - Wheezing, crackles (cystic fibrosis, chronic aspiration)
  - Abdominal examination
  - Distension (obstruction, constipation, celiac disease)
  - Hepatomegaly, splenomegaly (storage disorders, chronic liver disease)
  - Masses
  - Neurologic examination
  - Hypotonia or hypertonia (cerebral palsy, neuromuscular disorders)
  - Developmental delays
  - Dysmorphic features (genetic syndromes)
  - Observe feeding (if possible)
  - Suck-swallow coordination, oral-motor skills
  - Parent-child interaction during feeding
  - Classify FTT etiology
  - Inadequate caloric intake (75% of cases)
  - Poverty, food insecurity, neglect
  - Improper formula preparation (over-dilution)
  - Breastfeeding difficulties (poor latch, low milk supply)
  - Restrictive feeding practices
  - Oral-motor dysfunction
  - Increased caloric needs (10-15% of cases)
  - Chronic illness (cardiac, pulmonary, renal, malignancy)
  - Hyperthyroidism
  - Malabsorption or loss (10-15% of cases)
  - Celiac disease, cystic fibrosis, inflammatory bowel disease
  - Milk protein allergy
  - Chronic diarrhea
  - Defective utilization (rare)
  - Inborn errors of metabolism
  - Diagnostic evaluation
  - Laboratory testing NOT routinely indicated
  - Consider if history or exam suggests organic cause
  - Basic screening tests (if organic cause suspected)
  - Complete blood count (anemia from iron deficiency or chronic disease)
  - Comprehensive metabolic panel (electrolytes, renal function, liver function, albumin)
  - Urinalysis and urine culture (UTI, renal disease)
  - Thyroid function tests (TSH, free T4) - hyperthyroidism
  - Lead level (if risk factors)
  - Stool studies (if diarrhea)
  - Fecal fat, reducing substances (malabsorption)
  - Stool culture, ova and parasites (infection)
  - Fecal calprotectin (inflammatory bowel disease)
  - Sweat chloride test (if concern for cystic fibrosis)
  - Tissue transglutaminase IgA with total IgA (celiac disease)
  - Bone age (if short stature - assess growth potential)
  - Extensive workup NOT indicated if history and exam point to inadequate intake and no red flags
treatment:
  - Nutritional rehabilitation (CORNERSTONE of treatment)
  - Calculate caloric needs
  - Catch-up growth requirements: 150-200 kcal/kg ideal body weight (weight at 50th percentile for age)
  - Normal maintenance: 100-120 kcal/kg
  - Increase caloric density of feeds
  - Breastfeeding optimization
  - Lactation consultation
  - Increase frequency of feeds (every 2-3 hours)
  - Pump after feeds to increase milk supply
  - Supplement with formula if inadequate supply
  - Formula feeding
  - Ensure proper concentration (check preparation technique)
  - Increase volume per feed (8 oz/kg/day for infants)
  - Increase caloric density (add extra powder or use high-calorie formula)
  - Standard formula: 20 kcal/oz
  - Can increase to 22-24 kcal/oz (add extra powder or oil)
  - High-calorie formulas: 24-30 kcal/oz
  - Older children
  - Increase portion sizes, add high-calorie foods
  - Calorie-dense snacks (nut butters, cheese, avocado, whole milk)
  - Nutritional supplements (Pediasure, Carnation Instant Breakfast)
  - Limit low-calorie beverages (water, juice)
  - Offer whole milk (not low-fat or skim for age less than 2 years)
  - Feeding strategies
  - Structured meal and snack times (avoid grazing)
  - Minimize distractions (no TV during meals)
  - Positive feeding environment (no pressure or battles)
  - Developmentally appropriate foods and utensils
  - Involve child in food preparation
  - Address underlying medical causes
  - Treat identified organic disease (cardiac, GI, endocrine, renal)
  - Manage gastroesophageal reflux (H2 blocker, PPI)
  - Treat constipation (may affect appetite)
  - Iron supplementation if anemia
  - Multivitamin with minerals
  - Address social determinants of health
  - WIC referral (Women, Infants, and Children program)
  - SNAP benefits (Supplemental Nutrition Assistance Program)
  - Food banks, community resources
  - Social work involvement
  - Home visiting programs
  - Parent education and support
  - Feeding education (proper formula preparation, introduction of solids)
  - Anticipatory guidance
  - Address parental mental health (depression screening, referral)
  - Multidisciplinary approach
  - Pediatric nutrition/dietitian (caloric needs, meal planning)
  - Occupational therapy or speech therapy (if oral-motor dysfunction, feeding aversion)
  - Social work (address social needs, food insecurity)
  - Developmental-behavioral pediatrics (if developmental delays, feeding disorder)
  - Monitoring and follow-up (CRITICAL)
  - Frequent weight checks (weekly to biweekly until catch-up growth established)
  - Goal: weight gain 2-3 times normal rate
  - Infants: 20-30 g/day
  - Toddlers: 5-10 g/day
  - Adjust caloric intake based on weight gain response
  - Monitor developmental progress
  - Close communication with family
  - Hospitalization indications
  - Severe malnutrition (weight less than 70-75% ideal body weight)
  - Dehydration or acute illness
  - Suspected abuse or neglect with safety concerns
  - Failed outpatient management despite interventions
  - Need for intensive feeding evaluation and observation
  - Family unable to provide adequate care
clinical_pearls:
  - 'Failure to thrive is inadequate weight gain or weight loss over time - most important is growth trajectory, not single measurement'
  - '75% of FTT cases due to inadequate caloric intake (poverty, food insecurity, improper feeding) - NOT organic disease'
  - 'Detailed feeding history and observation of feeding are most important diagnostic tools'
  - 'Laboratory testing NOT routinely needed - reserve for cases with red flags suggesting organic pathology'
  - 'Catch-up growth requires 150-200 kcal/kg ideal body weight - significantly higher than normal maintenance'
  - 'Frequent weight monitoring essential (weekly to biweekly) - goal is weight gain 2-3 times normal rate'
  - 'Address social determinants: WIC, SNAP, food banks, social work - comprehensive approach needed'
  - 'Breastfeeding mothers need lactation consultation - assess latch, milk supply, proper technique'
referrals:
  - Pediatric nutrition or dietitian for caloric needs assessment and feeding plan
  - Occupational therapy or speech-language pathology if oral-motor dysfunction, swallowing difficulties, or feeding aversion
  - Lactation consultant if breastfeeding difficulties
  - Social work for food insecurity, poverty, WIC/SNAP enrollment, safety concerns
  - Developmental-behavioral pediatrics if developmental delays, severe feeding disorder, or behavioral feeding problems
  - Pediatric gastroenterology if suspected malabsorption, celiac disease, inflammatory bowel disease, or refractory FTT
differentials:
  - Inadequate caloric intake (most common) - poverty, food insecurity, improper feeding, neglect, restrictive diets
  - Breastfeeding difficulties - poor latch, low milk supply, maternal factors
  - Improper formula preparation - over-dilution (insufficient calories), incorrect mixing
  - Oral-motor dysfunction - poor suck-swallow coordination, cerebral palsy
  - Gastroesophageal reflux disease (GERD) - vomiting, feeding aversion
  - Pyloric stenosis - projectile vomiting, age 3-12 weeks, dehydration
  - Celiac disease - chronic diarrhea, abdominal distension, malabsorption
  - Cystic fibrosis - malabsorption (steatorrhea), recurrent infections, failure to thrive
  - Milk protein allergy - vomiting, diarrhea, blood in stool, feeding aversion
  - Congenital heart disease - increased metabolic needs, poor feeding, tachypnea
  - Chronic kidney disease - poor appetite, metabolic acidosis, anemia
  - Hyperthyroidism (rare in infants) - increased metabolism, poor weight gain despite good appetite
  - Genetic syndromes (Down, Turner, Russell-Silver) - intrinsic growth restriction
