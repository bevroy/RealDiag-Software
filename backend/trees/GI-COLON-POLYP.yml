tree_id: GI-COLON-POLYP
name: Colon Polyp (History/Encounter)
family: gastroenterology
specialty: Gastroenterology
icd10: K63.5
snomed: 68496003
urgency: []
homeopathy: []
presentations:
  - Asymptomatic (most polyps found on screening colonoscopy)
  - Positive fecal occult blood test or FIT
  - Rectal bleeding (typically with larger polyps)
  - Iron deficiency anemia
  - Change in bowel habits (rare unless large polyp)
  - Family history of colon polyps or colorectal cancer
  - Personal history of polyps requiring surveillance
  - Genetic syndromes (familial adenomatous polyposis, Lynch syndrome)
workup:
  - Colonoscopy with polypectomy (diagnostic and therapeutic)
  - Complete examination to cecum with photodocumentation
  - Polyp removal via snare polypectomy or EMR (endoscopic mucosal resection)
  - Pathology evaluation crucial for risk stratification
  - Adenoma (tubular, tubulovillous, villous) - pre-cancerous
  - Sessile serrated adenoma/polyp - pre-cancerous, more commonly in proximal colon
  - Hyperplastic polyp - generally benign, no malignant potential (except in serrated polyposis)
  - Advanced adenoma: ≥10 mm, high-grade dysplasia, or villous features
  - Assess number, size, location, and histology of all polyps
treatment:
  - Polypectomy during colonoscopy (standard of care)
  - Small polyps (<1 cm) - cold snare or forceps polypectomy
  - Large polyps (≥1 cm) - hot snare polypectomy or piecemeal EMR
  - Surveillance colonoscopy interval based on findings
  - 1-2 tubular adenomas <10 mm with low-grade dysplasia: 7-10 years
  - 3-4 adenomas, any ≥10 mm, or high-grade dysplasia: 3 years
  - 5-10 adenomas: 3 years (consider genetic syndrome)
  - >10 adenomas: 1 year and genetic counseling (rule out FAP)
  - Sessile serrated polyps: 3-5 years depending on size and dysplasia
  - Piecemeal resection of large polyps: 6 month surveillance to ensure complete removal
  - Post-polypectomy care
  - Monitor for complications (bleeding 0.1-2%, perforation 0.1%)
  - Return precautions if severe abdominal pain, rectal bleeding, fever
  - Aspirin continuation during procedure reduces post-polypectomy bleeding
clinical_pearls:
  - "Adenomas are pre-cancerous - progression to cancer takes 10-15 years (window for prevention)"
  - "Advanced adenoma has highest cancer risk - requires closer surveillance"
  - "Serrated polyps (SSA/P) increasingly recognized as precursor to 20-30% of CRCs"
  - "Polyps >2 cm have significantly higher risk of containing invasive cancer"
  - "Familial adenomatous polyposis (FAP) - hundreds of polyps, nearly 100% cancer risk by age 40"
  - "Lynch syndrome - hereditary nonpolyposis CRC, earlier onset, higher cancer risk"
  - "Right-sided/proximal polyps missed more often - importance of adequate prep and withdrawal time"
  - "Adenoma detection rate (ADR) key quality metric - should be >25% in average-risk patients"
referrals:
  - Gastroenterology for colonoscopy and polyp removal
  - Surgical consultation if polyp contains invasive cancer or cannot be removed endoscopically
  - Genetic counseling if >10 adenomas, young age, or family history suggesting hereditary syndrome
  - Consider advanced endoscopy for complex polyps requiring EMR or ESD
differentials:
  - Adenomatous polyp (tubular, tubulovillous, villous) - pre-cancerous
  - Sessile serrated adenoma/polyp (SSA/P) - pre-cancerous
  - Hyperplastic polyp - usually benign
  - Inflammatory polyp (pseudopolyp in IBD)
  - Juvenile polyp (hamartomatous, in children)
  - Lipoma (submucosal, soft, yellowish)
  - Colorectal cancer (if polyp contains high-grade dysplasia or invasive cancer)
  - Familial adenomatous polyposis (FAP) - if >100 polyps
  - Lynch syndrome (HNPCC) - if family history and early onset
trace:
  source: US Multi-Society Task Force on Colorectal Cancer Screening 2020, ASGE Guidelines
