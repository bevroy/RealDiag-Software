presentations:
  - Abdominal distension after surgery
  - Nausea and vomiting
  - Absent or hypoactive bowel sounds
  - No passage of stool or flatus
  - Typically resolves with conservative management
  - Prolonged ileus > 5 days concerning
differentials:
  - Bowel obstruction
  - Anastomotic leak
  - Infection
  - Medication effect
workup: []
treatment:
  - Supportive care - usually resolves spontaneously in 3-5 days
  - NPO until return of bowel function (flatus, bowel movement)
  - IV fluids to maintain hydration and electrolytes
  - Nasogastric tube if severe nausea/vomiting or gastric distension
  - Minimize opioids - switch to non-opioid pain control (acetaminophen, NSAIDs, gabapentin)
  - 'Patient advice: Early ambulation - walk QID'
  - Chewing gum QID for 30 minutes - stimulates GI motility
  - Avoid unnecessary lab tests and CT scans unless fever or peritoneal signs
  - Alvimopan (Entereg) 12mg BID if available - peripherally acting mu-opioid antagonist, reduces ileus duration
  - Discontinue anticholinergics, avoid calcium channel blockers
  - NG decompression if severe distension
  - 'If prolonged (>5-7 days): CT to rule out mechanical obstruction, anastomotic leak, abscess'
  - Neostigmine 2mg IV slowly for Ogilvie syndrome (pseudo-obstruction)
