tree_id: DERM-CANDIDIASIS-SKIN
name: Cutaneous Candidiasis
family: Dermatology
specialty: Dermatology/Primary Care
chief_complaint: Red, itchy rash in skin folds
description: Yeast infection of the skin caused by Candida species, typically occurs in warm, moist intertriginous areas. Common in diabetes, obesity, immunosuppression. Responds well to topical antifungals and moisture control.
icd10: B37.2
snomed: 78048006
presentations:
  - Erythematous patches in skin folds
  - Satellite pustules
  - Maceration, fissuring
  - Pruritus, burning
  - Affects inframammary, groin, axillae, intergluteal
  - White curd-like debris (thrush if oral)
urgency: routine
referrals:
  emergency:
    - Invasive candidiasis with systemic signs
  urgent:
    - Widespread infection in immunocompromised
    - Failed multiple treatments
  routine:
    - Recurrent infections requiring evaluation
    - Refractory to treatment

workup:
  - Clinical diagnosis based on appearance and location
  - Clinical presentations by location
  - Intertriginous candidiasis (most common cutaneous form)
  - Inframammary - under breasts, erythematous patches with satellite pustules
  - Inguinal/crural - groin folds, scrotum, perianal area
  - Axillary - armpits
  - Intergluteal - between buttocks
  - Abdominal pannus - in obese patients with overhanging abdominal fold
  - Interdigital - between fingers or toes (hands more common)
  - Characteristic features - beefy red erythema with sharply demarcated borders, satellite pustules (pathognomonic), maceration, fissuring, white exudate
  - Diaper dermatitis (diaper candidiasis)
  - Intense erythema in diaper area, satellite lesions
  - Spares inguinal folds initially (irritant diaper dermatitis affects folds first)
  - Common in infants, especially after antibiotic use
  - Perianal candidiasis
  - Intense erythema around anus
  - Associated with diarrhea, antibiotic use, immunosuppression
  - Candidal paronychia
  - Swelling, erythema, tenderness of proximal nail fold
  - Chronic exposure to water (dishwashers, bartenders, healthcare workers)
  - Chronic mucocutaneous candidiasis (rare)
  - Chronic or recurrent candida infections of skin, nails, and mucous membranes
  - Associated with primary immunodeficiency disorders
  - Physical examination
  - Erythematous patches with sharp borders in intertriginous areas
  - Satellite pustules surrounding main patch (highly suggestive of candida)
  - Maceration, fissuring within folds
  - White curd-like material may be present
  - Check other intertriginous areas (often multiple sites involved)
  - Examine oral cavity for thrush if suspected immunosuppression
  - Look for signs of diabetes or immunosuppression
  - Laboratory studies - usually not needed for typical presentations
  - KOH preparation - scrape pustule roof or scale, KOH shows budding yeast and pseudohyphae
  - Distinguishes from bacterial infection or dermatophyte
  - Fungal culture - if diagnosis uncertain or treatment failures, identifies Candida species
  - Usually Candida albicans (most common), but can be non-albicans (C. glabrata, C. tropicalis, C. parapsilosis)
  - Risk factor assessment
  - Diabetes mellitus (most important) - check HbA1c if recurrent infections
  - Obesity - increased skin folds, moisture retention
  - Immunosuppression - HIV, chemotherapy, chronic corticosteroids, immunosuppressive medications
  - Antibiotic use - disrupts normal flora
  - Moisture exposure - occlusive clothing, incontinence, excessive sweating
  - Pregnancy - increased estrogen
  - Nutritional deficiency - zinc, iron
treatment:
  - Topical antifungal therapy - first-line for localized cutaneous candidiasis
  - Azole antifungals (most effective)
  - Clotrimazole 1% cream twice daily x 2-4 weeks
  - Miconazole 2% cream twice daily x 2-4 weeks
  - Ketoconazole 2% cream once or twice daily x 2-4 weeks
  - Econazole 1% cream once daily x 2-4 weeks
  - Apply thin layer to affected area and surrounding skin
  - Nystatin (less effective than azoles)
  - Nystatin 100,000 units/g cream or ointment 2-4 times daily x 2-4 weeks
  - Less expensive, useful for mild cases
  - Not effective for dermatophytes (azoles cover both)
  - Combination products
  - Nystatin + triamcinolone cream - for severe inflammation (short-term use only, 5-7 days)
  - Corticosteroid reduces pruritus and inflammation rapidly
  - Avoid prolonged steroid use (promotes fungal growth)
  - Oral antifungal therapy - for extensive, refractory, or recurrent cutaneous candidiasis
  - Fluconazole 150-200 mg once, then 100-200 mg daily x 7-14 days
  - Most effective oral agent, well-tolerated
  - Consider for extensive disease, multiple sites, immunocompromised, or treatment failures
  - Itraconazole 200 mg daily x 7-14 days (alternative)
  - Chronic or recurrent candidiasis - fluconazole 150 mg weekly for maintenance
  - Adjunctive measures - critical for treatment success
  - Keep affected areas dry
  - Pat dry thoroughly after bathing, especially skin folds
  - Use hair dryer on cool setting to dry intertriginous areas
  - Absorbent powder (nystatin powder, miconazole powder, cornstarch, or Zeasorb powder) to affected areas after drying
  - Reduce moisture and friction
  - Loose-fitting, breathable clothing (cotton)
  - Change wet or sweaty clothing promptly
  - For inframammary candidiasis - cotton bra, well-fitting supportive bra to reduce moisture accumulation
  - Barrier products - for diaper area, use zinc oxide paste or petrolatum as moisture barrier
  - Weight loss - if obesity contributing factor
  - Glycemic control - optimize diabetes management if diabetic (critical to prevent recurrence)
  - Address underlying risk factors
  - Antibiotic stewardship - avoid unnecessary antibiotics
  - Discontinue or reduce corticosteroids if possible
  - Specific scenarios
  - Diaper candidiasis - topical nystatin or azole cream with each diaper change, barrier paste (zinc oxide)
  - Perianal candidiasis - nystatin cream or azole cream after bowel movements, barrier paste
  - Candidal paronychia - topical azole solution, keep hands dry, wear gloves for wet work, may need oral fluconazole if chronic
  - Recurrent infections - maintenance fluconazole 150 mg weekly, aggressive moisture control, evaluate for diabetes/immunosuppression
clinical_pearls:
  - Candida albicans most common cause (70-80%), part of normal flora (skin, GI tract, vagina)
  - Opportunistic - requires disruption of skin barrier or altered host defenses
  - Satellite pustules pathognomonic for candidiasis (not seen in dermatophyte infections)
  - KOH prep shows budding yeast and pseudohyphae (vs septate branching hyphae in dermatophytes)
  - Diabetes most important risk factor - check HbA1c if recurrent infections
  - Intertriginous areas affected - warm, moist, occluded (under breasts, groin, axillae, abdominal pannus)
  - Nystatin only effective for Candida (not dermatophytes), azoles effective for both
  - Moisture control as important as antifungals - keep areas dry to prevent recurrence
  - Recurrent infections warrant evaluation for diabetes, HIV, immunosuppression
  - Chronic mucocutaneous candidiasis suggests primary immunodeficiency (APECED, hyper-IgE syndrome)
  - Avoid prolonged topical corticosteroid use (promotes fungal growth)
  - Oral fluconazole effective and well-tolerated for extensive or refractory cases
differentials:
  - Inverse psoriasis (intertriginous psoriasis) - well-demarcated, smooth erythema without satellite pustules, KOH negative, often has psoriasis elsewhere
  - Intertrigo (non-infectious) - irritant dermatitis in skin folds from friction and moisture, no satellite pustules, KOH negative
  - Erythrasma - bacterial (Corynebacterium minutissimum), coral-red fluorescence with Wood's lamp, no pustules
  - Tinea cruris (jock itch) - dermatophyte, active scaly border, spares scrotum (candida involves scrotum), KOH shows hyphae
  - Seborrheic dermatitis - greasy yellow scale, affects scalp, face, chest, no satellite pustules
  - Contact dermatitis (allergic or irritant) - history of exposure, distribution matches allergen/irritant, no satellite pustules
trace:
  - 58-year-old woman with type 2 diabetes presents with 2-week history of red, itchy rash under breasts
  - Progressive worsening, burning sensation
  - Tried over-the-counter hydrocortisone cream without improvement
  - Rash started after hot humid weather, increased sweating
  - Past medical history - type 2 diabetes (HbA1c 8.2% three months ago, suboptimal control), obesity (BMI 38), hypertension
  - Medications - metformin 1000 mg twice daily, glipizide 10 mg daily, lisinopril 20 mg daily
  - Physical examination - intense erythema with sharply demarcated borders in bilateral inframammary folds, multiple satellite pustules at periphery of main patch, maceration and fissuring, white exudate in folds
  - Similar smaller patches in axillae bilaterally
  - No oral thrush
  - KOH preparation from satellite pustule shows abundant budding yeast and pseudohyphae (confirms candidiasis)
  - Point-of-care HbA1c today - 8.6% (worsening glycemic control)
  - Diagnosis - Intertriginous cutaneous candidiasis (inframammary and axillary), associated with poorly controlled diabetes
  - Treatment plan
  - Topical - clotrimazole 1% cream twice daily to affected areas x 3 weeks
  - Moisture control - extensive counseling on keeping skin folds dry, pat dry thoroughly after showering, use hair dryer on cool setting to dry under breasts, apply miconazole powder after drying twice daily
  - Wear cotton bra, well-fitting supportive bra to lift breasts and reduce moisture
  - Change bra daily, more often if sweaty
  - Loose-fitting cotton clothing
  - Diabetes management - referred to endocrinology for medication adjustment, discussed importance of glycemic control in preventing fungal infections
  - At 1 week - significant improvement, erythema decreased 50%, fewer pustules, less pruritus and burning
  - Continues topical therapy and moisture control measures
  - At 3 weeks - complete resolution, skin under breasts and axillae normal, no erythema or pustules
  - HbA1c after endocrinology visit and medication adjustment - 7.4% (improved)
  - Counseled on maintenance - continue daily powder application, keep areas dry, monitor blood sugar
  - At 6 months - no recurrence, HbA1c 7.1%, continues preventive measures

citations:
  - IDSA (Infectious Diseases Society of America) Guidelines for Candidiasis
  - AAD (American Academy of Dermatology) Guidelines
  - UpToDate - Dermatology and Infectious Disease
