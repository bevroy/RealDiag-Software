tree_id: PEDS-STREP-THROAT
name: Strep Throat (Pediatric)
family: pediatrics
specialty: Pediatrics/Infectious Disease
icd10: J02.0
snomed: 43878008
urgency:
  - Stridor or severe dysphagia with drooling (concern for peritonsillar abscess or epiglottitis)
  - Respiratory distress or airway compromise
  - Severe dehydration from inability to swallow
  - Signs of sepsis or toxic shock syndrome
  - Suspected Lemierre syndrome (septic thrombophlebitis of internal jugular vein)
homeopathy: []
presentations:
  - Acute onset sore throat
  - Painful swallowing (odynophagia)
  - Fever (typically 101-104°F/38.3-40°C)
  - Headache
  - Abdominal pain (especially younger children)
  - Nausea and vomiting
  - Tender anterior cervical lymphadenopathy
  - Absence of cough (cough suggests viral URI, not strep)
  - Absence of rhinorrhea or conjunctivitis (suggests viral, not strep)
  - Petechiae on palate
  - Scarlatiniform rash (sandpaper texture, if scarlet fever)
  - Age typically 5-15 years (peak incidence)
  - Sick contacts or known strep exposure
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Sudden onset favors strep (versus gradual onset with viral)
  - Fever pattern and maximum temperature (high fever typical of strep)
  - Presence or absence of cough (cough suggests viral etiology)
  - Rhinorrhea or nasal congestion (suggests viral, uncommon with strep)
  - Difficulty swallowing or dysphagia
  - Abdominal pain (strep can present with abdominal pain in children)
  - Rash (scarlet fever - strep with rash)
  - Sick contacts or known strep pharyngitis exposure
  - Previous episodes of strep throat
  - Recent treatment with antibiotics
  - Rheumatic fever or glomerulonephritis history (patient or family)
  - Physical examination
  - Vital signs (temperature, heart rate, respiratory rate, blood pressure)
  - General appearance (well versus ill, toxic)
  - HEENT examination
  - Oropharynx
  - Tonsillar erythema and exudate (white or yellow patches)
  - Soft palate petechiae (highly specific for strep)
  - Uvular edema
  - Absence of oral ulcers (aphthous stomatitis suggests viral)
  - Absence of conjunctivitis (suggests viral if present)
  - Anterior cervical lymphadenopathy (tender, enlarged)
  - Posterior cervical adenopathy more common with viral/EBV
  - Assess airway patency
  - Unilateral tonsillar enlargement with uvular deviation suggests peritonsillar abscess
  - Scarlet fever findings (if present)
  - Sandpaper-textured erythematous rash (generalized, flexural accentuation)
  - Pastia lines (linear petechiae in skin folds)
  - Strawberry tongue (initially white coating with red papillae, later red)
  - Circumoral pallor
  - Desquamation of fingers and toes (late finding, 1-2 weeks after onset)
  - Abdominal examination (tenderness, hepatosplenomegaly)
  - Skin examination (scarlatiniform rash, petechiae)
  - Clinical prediction rules (Modified Centor/McIsaac Score)
  - Age 3-14 years: +1 point
  - Fever greater than 100.4°F (38°C): +1 point
  - Absence of cough: +1 point
  - Tender anterior cervical lymphadenopathy: +1 point
  - Tonsillar exudate or swelling: +1 point
  - Score 0-1: low probability (1-7%), no testing
  - Score 2-3: intermediate (10-35%), test if positive clinical suspicion
  - Score 4-5: high probability (51-53%), test and treat
  - Diagnostic testing
  - Rapid antigen detection test (RADT) - FIRST-LINE
  - Throat swab from both tonsils and posterior pharynx
  - Results in 5-10 minutes
  - High specificity (95-99%) - positive result confirms strep, can treat
  - Lower sensitivity (70-90%) - negative result needs confirmation with culture in children
  - Throat culture (gold standard)
  - Indicated if RADT negative (backup test for children and adolescents)
  - High sensitivity (90-95%) and specificity (95-99%)
  - Results in 24-48 hours
  - NOT needed if RADT positive (treat immediately)
  - Adults: negative RADT does NOT require backup culture (low risk rheumatic fever)
  - Children: negative RADT SHOULD have backup culture (higher risk complications)
  - Routine blood tests NOT indicated
  - ASO titer or anti-DNase B: NOT useful for acute diagnosis (only for post-streptococcal complications)
  - Throat culture for patients already on antibiotics may be false-negative
treatment:
  - Antibiotic therapy - indicated for positive strep test (RADT or culture)
  - Goals: shorten symptom duration, prevent suppurative complications (peritonsillar abscess), prevent acute rheumatic fever, reduce transmission
  - First-line: Penicillin
  - Penicillin VK 250 mg (weight less than 27 kg) or 500 mg (weight greater than or equal to 27 kg) PO twice or three times daily for 10 days
  - OR Amoxicillin 50 mg/kg once daily (max 1000 mg) OR 25 mg/kg twice daily (max 500 mg per dose) for 10 days
  - Amoxicillin preferred over penicillin VK (better taste, once-daily dosing option, equal efficacy)
  - Benzathine penicillin G 600,000 units IM (weight less than 27 kg) or 1.2 million units IM (weight greater than or equal to 27 kg) single dose
  - Excellent for compliance concerns (single injection)
  - Painful injection, less preferred if oral compliance expected
  - No group A Strep resistance to penicillin
  - Penicillin allergy options
  - Non-anaphylactic allergy
  - Cephalexin 20 mg/kg/dose PO twice daily (max 500 mg/dose) for 10 days OR
  - Cefadroxil 30 mg/kg once daily (max 1000 mg) for 10 days
  - Anaphylactic penicillin allergy (IgE-mediated)
  - Azithromycin 12 mg/kg once daily for 5 days (max 500 mg/day) OR
  - Clindamycin 7 mg/kg/dose PO three times daily for 10 days (max 300 mg/dose) OR
  - Clarithromycin 7.5 mg/kg/dose PO twice daily for 10 days (max 250 mg/dose)
  - Macrolide resistance increasing in some areas (10-15%)
  - Full 10-day course required (except azithromycin 5 days) to prevent rheumatic fever
  - Do NOT use trimethoprim-sulfamethoxazole or fluoroquinolones (not effective)
  - Supportive care
  - Analgesics and antipyretics
  - Acetaminophen 15 mg/kg/dose every 4-6 hours (max 75 mg/kg/day or 4000 mg/day) OR
  - Ibuprofen 10 mg/kg/dose every 6 hours (max 40 mg/kg/day or 1200 mg/day)
  - Throat lozenges or sprays (benzocaine, menthol) for older children
  - Saltwater gargles
  - Soft diet, cold liquids (ice cream, popsicles) may be soothing
  - Adequate hydration
  - Corticosteroids
  - Dexamethasone single dose (0.6 mg/kg PO/IM, max 10 mg) may provide faster pain relief
  - Modest benefit (pain reduction by 6 hours), not routinely recommended
  - Consider for severe pharyngitis or difficulty swallowing
  - Disposition and return to school/activities
  - Return to school/daycare after 24 hours of antibiotics and fever-free
  - Contagious period: from symptom onset until 24 hours after starting antibiotics
  - Improvement expected within 24-48 hours of starting antibiotics
  - If no improvement after 48-72 hours, re-evaluate (wrong diagnosis, antibiotic resistance, non-compliance, peritonsillar abscess)
  - Recurrent strep throat (3 or more episodes in 6 months or 5 or more in 12 months)
  - Consider carrier state (positive culture but not true infection)
  - Consider tonsillectomy referral
  - May need different antibiotic (clindamycin for carrier eradication)
  - Prevention
  - Hand hygiene
  - Avoid sharing utensils, cups, toothbrushes
  - Replace toothbrush after starting antibiotics
  - Prophylactic antibiotics NOT routinely recommended for contacts
  - Complications (rare with appropriate antibiotic treatment)
  - Suppurative: peritonsillar abscess, retropharyngeal abscess, cervical lymphadenitis, sinusitis, otitis media
  - Non-suppurative (immune-mediated): acute rheumatic fever (prevented by antibiotics within 9 days), post-streptococcal glomerulonephritis (NOT prevented by antibiotics)
clinical_pearls:
  - 'Group A Strep pharyngitis peak age 5-15 years - uncommon in children younger than 3 years (viral more likely)'
  - 'Centor/McIsaac criteria help predict strep likelihood: fever, absence of cough, tonsillar exudate, tender anterior cervical lymphadenopathy'
  - 'Positive rapid strep test (RADT) confirms diagnosis, can treat immediately - high specificity'
  - 'Negative RADT in children requires backup throat culture (lower sensitivity) - not needed in adults'
  - 'Amoxicillin preferred over penicillin VK - better taste, once-daily option, equal efficacy, no group A Strep resistance'
  - 'Full 10-day antibiotic course required (except azithromycin 5 days) to prevent acute rheumatic fever'
  - 'Return to school after 24 hours on antibiotics and afebrile - no longer contagious'
  - 'Antibiotics prevent acute rheumatic fever but NOT post-streptococcal glomerulonephritis'
referrals:
  - Otolaryngology (ENT) if recurrent strep throat (3+ episodes in 6 months or 5+ in 12 months) for tonsillectomy consideration
  - Otolaryngology URGENT if peritonsillar abscess suspected (unilateral tonsillar enlargement, uvular deviation, trismus, drooling)
  - Pediatric infectious disease if unusual organism, recurrent infections despite treatment, immunocompromised host
  - Pediatric rheumatology if acute rheumatic fever develops (Jones criteria: carditis, polyarthritis, chorea, erythema marginatum, subcutaneous nodules)
differentials:
  - Group A Streptococcus pharyngitis (strep throat) - sudden onset, fever, exudate, anterior cervical adenopathy, no cough
  - Viral pharyngitis (most common) - gradual onset, rhinorrhea, cough, conjunctivitis, lower fever
  - Infectious mononucleosis (EBV) - severe tonsillar exudate, posterior cervical adenopathy, hepatosplenomegaly, atypical lymphocytes, fatigue
  - Adenovirus pharyngitis - pharyngoconjunctival fever (pharyngitis, conjunctivitis, fever)
  - Peritonsillar abscess - unilateral severe pain, trismus, uvular deviation, muffled voice, drooling
  - Gonococcal pharyngitis - sexually active adolescents, history of oral sexual contact
  - Diphtheria (rare, preventable by vaccine) - gray pseudomembrane, bull neck, airway obstruction
  - Herpangina (coxsackievirus) - painful vesicles or ulcers on soft palate, posterior pharynx
  - Epiglottitis (rare post-Hib vaccine) - drooling, tripod positioning, stridor, toxic appearance (EMERGENCY)
  - Kawasaki disease - fever greater than 5 days, strawberry tongue, conjunctivitis, rash, extremity changes
