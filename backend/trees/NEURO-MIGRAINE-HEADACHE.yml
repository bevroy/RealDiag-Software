tree_id: NEURO-MIGRAINE-HEADACHE
name: Migraine Headache
family: Neurology
specialty: Neurology
chief_complaint: Severe throbbing headache with nausea
description: |
  Recurrent primary headache disorder with moderate to severe intensity, often unilateral and pulsating. Affects 15% of population, more common in women (3:1).
  Migraine with aura (20%) or without aura (80%). Significant impact on quality of life and productivity. Genetic predisposition common.
icd10: G43.909
urgency: Moderate
workup:
  - Clinical diagnosis based on International Headache Society criteria
  - Migraine without aura - at least 5 attacks, lasting 4-72 hours, with 2 of 4 pain characteristics (unilateral, pulsating, moderate-severe intensity, aggravated by activity) plus 1 of 2 associated symptoms (nausea/vomiting or photophobia/phonophobia)
  - Migraine with aura - visual aura most common (scintillating scotoma, zigzag lines, fortification spectra), sensory or speech disturbances, aura develops over 5-60 minutes, lasts less than 60 minutes, followed by headache within 60 minutes
  - Detailed headache history - frequency, duration, triggers, associated symptoms, red flags
  - Red flags requiring neuroimaging - thunderclap (sudden onset worst headache), new headache after age 50, change in headache pattern, focal neurologic deficits, papilledema, headache with fever/weight loss
  - Neuroimaging (MRI brain preferred) if red flags present or atypical features
  - Normal exam in uncomplicated migraine - perform focused neurologic exam
  - Headache diary helpful - track frequency, triggers (stress, sleep deprivation, certain foods, hormonal changes), response to treatments
treatment:
  - Acute treatment - treat early in attack for best efficacy
  - Mild-moderate attacks - NSAIDs (ibuprofen 400-800mg, naproxen 500-1000mg) or acetaminophen 1000mg
  - Moderate-severe attacks or inadequate response to NSAIDs - triptans
  - Sumatriptan 50-100mg PO (onset 30-60 min) or 6mg SC (onset 10-15 min, most effective) or 20mg intranasal
  - Alternative triptans - rizatriptan 10mg, eletriptan 40mg, zolmitriptan 2.5-5mg
  - Contraindications to triptans - cardiovascular disease, uncontrolled hypertension, hemiplegic migraine
  - Antiemetics for nausea - metoclopramide 10mg, prochlorperazine 10mg (also has analgesic effect)
  - CGRP receptor antagonists (gepants) - ubrogepant 50-100mg, rimegepant 75mg (alternative if triptans contraindicated or ineffective)
  - Avoid medication overuse (greater than 10 days/month NSAIDs or greater than 10 days/month triptans) - causes medication overuse headache
  - Preventive therapy if 4 or more headache days per month, debilitating attacks, or inadequate response to acute treatment
  - First-line preventives - propranolol 80-240mg daily, metoprolol 100-200mg daily, topiramate 50-200mg daily (weight loss, teratogenic), divalproex 500-1500mg daily (weight gain, teratogenic)
  - CGRP monoclonal antibodies - erenumab 70-140mg SC monthly, fremanezumab 225mg SC monthly, galcanezumab 240mg loading then 120mg monthly (50-60% reduction in headache days, well-tolerated)
  - OnabotulinumtoxinA (Botox) 155 units every 12 weeks for chronic migraine (15 or more headache days per month)
  - Lifestyle modifications - regular sleep schedule, exercise, stress management, identify and avoid triggers, adequate hydration
clinical_pearls:
  - Aura without headache (acephalgic migraine) occurs, especially in older adults
  - Menstrual migraine common - occurs predictably with menstruation, treat with extended NSAID or triptan prophylaxis
  - Status migrainosus - migraine lasting greater than 72 hours, may require IV fluids, antiemetics, DHE or hospitalization
  - Hemiplegic migraine rare variant with motor weakness during aura, triptans contraindicated
  - Chronic migraine (15 or more headache days per month for greater than 3 months) often involves medication overuse
  - Children present differently - bilateral, shorter duration, prominent GI symptoms
differentials:
  - Tension-type headache
  - Cluster headache
  - Medication overuse headache
  - Subarachnoid hemorrhage (if thunderclap)
  - Giant cell arteritis (if age greater than 50)
  - Intracranial mass or increased ICP
trace:
  - 32-year-old woman with recurrent severe left-sided throbbing headaches x 5 years, 6 episodes per month, lasting 12-24 hours → Preceded by visual zigzag lines x 15 minutes → Associated nausea, photophobia, phonophobia, worsens with activity → Triggers include stress, lack of sleep, menstrual period → Neurologic exam normal → Diagnose migraine with aura, high frequency → Start acute treatment with sumatriptan 100mg at headache onset, metoclopramide 10mg for nausea → Initiate preventive therapy with propranolol 40mg BID, titrate to 80mg BID → Keep headache diary → After 2 months, headache frequency reduced to 2-3 per month → Sumatriptan effective for breakthrough attacks → Continue preventive therapy, lifestyle modifications (regular sleep, exercise, stress reduction)
