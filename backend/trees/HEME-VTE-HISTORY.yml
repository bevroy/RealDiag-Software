tree_id: HEME-VTE-HISTORY
name: History of Venous Thromboembolism (Encounter)
family: hematology
specialty: Hematology, Primary Care
chief_complaint: Prior DVT or pulmonary embolism
description: |
  Encounter for patient with history of venous thromboembolism (VTE) including deep vein thrombosis (DVT) or pulmonary embolism (PE).
  Requires assessment for continued anticoagulation, thrombophilia workup, and risk stratification for recurrence.
icd10: Z86.718
snomed: "429098002"
presentations:
  - Prior documented DVT or PE
  - Currently on anticoagulation or completed treatment course
  - May be asymptomatic now
  - Recurrent VTE (unprovoked or despite anticoagulation)
  - Family history of VTE
urgency: Low
referrals:
  hematology:
    - Recurrent VTE
    - VTE at young age (<50 years)
    - VTE in unusual location (cerebral, mesenteric, portal)
    - Strong family history
    - Considering stopping anticoagulation
workup:
  - Review initial VTE details - provoked vs unprovoked, location, severity
  - Assess current anticoagulation status and duration
  - Thrombophilia testing (if unprovoked VTE, young age, family history, or recurrent)
    - Factor V Leiden mutation
    - Prothrombin G20210A mutation
    - Antithrombin deficiency
    - Protein C deficiency
    - Protein S deficiency
    - Antiphospholipid antibodies (lupus anticoagulant, anticardiolipin, anti-beta-2 glycoprotein)
  - Cancer screening if not up to date
  - Note - do thrombophilia testing AFTER completing anticoagulation (unless affects duration)
treatment:
  anticoagulation_duration:
    provoked_vte:
      - Reversible risk factor (surgery, immobilization, estrogen) - 3 months anticoagulation
      - Reassess at 3 months, usually stop if no recurrence
    unprovoked_vte:
      - First unprovoked VTE - minimum 3-6 months
      - Consider indefinite anticoagulation if low bleeding risk
      - Shared decision-making with patient
    recurrent_vte:
      - Indefinite anticoagulation
    cancer_associated:
      - LMWH preferred over warfarin
      - Continue anticoagulation while cancer active
  anticoagulation_choice:
    - DOACs preferred (rivaroxaban, apixaban, edoxaban, dabigatran) - easier than warfarin
    - Warfarin - requires INR monitoring, goal INR 2-3
    - LMWH - for cancer-associated VTE or pregnancy
  long_term_management:
    - Annual assessment of bleeding risk and thrombosis risk
    - Compression stockings if post-thrombotic syndrome
    - VTE prophylaxis for high-risk situations (surgery, hospitalization, long flights)
clinical_pearls:
  - Provoked VTE (surgery, trauma, prolonged immobility) - lower recurrence risk, limited anticoagulation
  - Unprovoked VTE - higher recurrence risk (10% per year), consider indefinite anticoagulation
  - Recurrent VTE requires indefinite anticoagulation
  - Thrombophilia testing usually doesn't change management unless strong family history
  - DOACs have similar efficacy to warfarin with lower bleeding risk and no monitoring
  - Post-thrombotic syndrome (leg swelling, pain) occurs in 20-50% after DVT
  - VTE prophylaxis important for future surgeries or hospitalizations
differentials:
  - Provoked VTE
  - Unprovoked VTE
  - Recurrent VTE
  - Hereditary thrombophilia
  - Antiphospholipid syndrome
  - Cancer-associated thrombosis
  - Post-thrombotic syndrome
trace:
  - 42-year-old woman with unprovoked DVT diagnosed 6 months ago, completed 6 months of apixaban. No recurrence. Thrombophilia workup negative. Discuss continuing vs stopping anticoagulation. Patient prefers to continue given unprovoked nature. Continue apixaban 5mg BID indefinitely with annual reassessment.
citations:
  - American College of Chest Physicians Antithrombotic Guidelines
  - American Society of Hematology Guidelines
  - UpToDate - Hematology
