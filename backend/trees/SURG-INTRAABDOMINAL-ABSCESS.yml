tree_id: SURG-INTRAABDOMINAL-ABSCESS
name: Intraabdominal Abscess
family: surgery
specialty: Surgery
icd10:
- K65.1
snomed:
- 128477000
urgency: medium
description: Comprehensive evaluation and management of Intraabdominal Abscess
version: '1.0'
citations:
  - ACS (American College of Surgeons) Clinical Guidelines
  - RCS (Royal College of Surgeons) Guidelines
  - UpToDate - General Surgery
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Postoperative fever
- Abdominal pain
- Leukocytosis
- CT shows fluid collection
- Recent abdominal surgery or complicated appendicitis
- May require percutaneous drainage
workup: []
treatment:
  - 'Broad-spectrum antibiotics - piperacillin-tazobactam 4.5g IV Q6H OR ceftriaxone 2g IV daily + metronidazole 500mg IV Q8H'
  - 'CT-guided percutaneous drainage - first-line for accessible abscesses'
  - 'Send fluid for culture (aerobic, anaerobic, fungal)'
  - 'Drain remains until output <10-20mL/day'
  - 'Serial CT to document resolution'
  - 'Operative drainage if: percutaneous drainage fails, multiple loculated abscesses, or bowel fistula'
  - 'Duration antibiotics: 4-6 weeks (2 weeks IV, then transition to PO based on clinical response)'
  - 'Source control critical - address underlying cause (diverticulitis, appendicitis, anastomotic leak)'
  - 'Monitor for complications - fistula formation, sepsis, recurrence'
clinical_pearls: []
referrals:
  emergency:
    - Acute abdomen
    - Peritonitis
    - Perforated viscus
    - Ruptured AAA
    - Necrotizing fasciitis
  urgent:
    - Suspected malignancy
    - Bowel obstruction
    - Incarcerated hernia
    - Acute cholecystitis
  routine:
    - Elective hernia repair
    - Gallstones without cholecystitis
    - Benign masses
    - Screening abnormalities
differentials:
  - Peritonitis
  - Appendicitis
  - Diverticulitis
  - Crohn abscess
  - Postop collection
trace:
