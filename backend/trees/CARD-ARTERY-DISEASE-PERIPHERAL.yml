tree_id: CARD-ARTERY-DISEASE-PERIPHERAL
name: Peripheral Artery Disease
family: Cardiology
specialty: Vascular Surgery
chief_complaint: Leg pain with walking
description: Atherosclerotic obstruction of lower extremity arteries causing exertional leg pain (claudication) and increased cardiovascular event risk. Medical management and revascularization improve symptoms and reduce limb loss.
icd10: I73.9
urgency: non-urgent

workup:
  - Clinical diagnosis: intermittent claudication (reproducible exertional leg pain relieved by rest) or rest pain or non-healing ulcers
  - Ankle-brachial index (ABI): ratio of ankle to brachial systolic BP, normal 1.0-1.4, PAD <0.90, severe <0.50, >1.4 non-compressible calcified vessels
  - Exercise ABI: if resting ABI normal but high clinical suspicion, post-exercise ABI drop >20% diagnostic
  - Pulse exam: diminished or absent femoral, popliteal, dorsalis pedis, posterior tibial pulses
  - Arterial duplex ultrasound: non-invasive localization of stenosis
  - CT angiography or MR angiography: anatomic detail for revascularization planning
  - Invasive angiography: if planning intervention
  - Screen for cardiovascular disease: ECG, lipid panel, consider stress test (50% have coronary disease)

treatment:
  - Medical management (all patients): antiplatelet (aspirin 81 mg or clopidogrel 75 mg daily), high-intensity statin (atorvastatin 80 mg), ACE inhibitor or ARB
  - Aggressive cardiovascular risk reduction: smoking cessation (most important), BP <130/80, diabetes control HbA1c <7%
  - Supervised exercise therapy: 30-45 minutes walking 3-5 times per week, walk until claudication, rest, repeat (most effective for claudication)
  - Cilostazol 100 mg BID: phosphodiesterase inhibitor improves walking distance 50% (contraindicated in heart failure)
  - Revascularization indications: lifestyle-limiting claudication despite medical therapy, rest pain, tissue loss, or acute limb ischemia
  - Revascularization options: endovascular (angioplasty/stent) preferred for focal lesions, bypass surgery for extensive disease
  - Acute limb ischemia: 6 Ps (Pain, Pallor, Pulselessness, Paresthesias, Paralysis, Poikilothermia) - emergent revascularization needed
  - Foot care: daily inspection, proper footwear, podiatry for nail and callus care

clinical_pearls:
  - Intermittent claudication reproducible with walking, relieved by rest
  - ABI <0.90 diagnostic, <0.50 severe, rest pain or tissue loss critical limb ischemia
  - Medical management: antiplatelet, high-intensity statin, ACE inhibitor, smoking cessation
  - Supervised exercise most effective for claudication - walk until pain, rest, repeat
  - Cilostazol improves walking distance if no heart failure
  - PAD marker for systemic atherosclerosis - 50% have coronary disease
  - Acute limb ischemia 6 Ps - emergent revascularization

differentials:
  - Spinal stenosis (neurogenic claudication): leg pain with standing/walking but also with standing still, relieved by sitting or lumbar flexion, normal pulses and ABI
  - Venous claudication: leg pain with activity but also swelling, history of DVT, normal pulses
  - Chronic compartment syndrome: younger athletes, reproducible with specific activity, normal pulses at rest
  - Arthritis: joint pain worse with activity, tenderness over joints, normal pulses

trace: |
  A 68-year-old man with diabetes, hypertension, and 40 pack-year smoking history presented with 6 months of bilateral calf pain after walking 2 blocks, relieved within 5 minutes of rest. Exam showed diminished femoral pulses bilaterally and absent dorsalis pedis and posterior tibial pulses. ABI right 0.58, left 0.62 (moderate PAD). Started aspirin 81 mg daily, atorvastatin 80 mg daily, lisinopril 10 mg daily, and cilostazol 100 mg BID. Referred to supervised exercise program and smoking cessation counseling. At 3 months quit smoking, walking distance improved from 2 blocks to 6 blocks. Lipid panel showed LDL 65. At 6 months claudication further improved, now walks 10 blocks without pain. Repeat ABI stable. Continues medical management with excellent symptom control without need for revascularization. Annual surveillance continues.
