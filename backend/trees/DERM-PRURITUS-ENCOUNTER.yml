tree_id: DERM-PRURITUS-ENCOUNTER
name: Pruritus (Itching) - Encounter
family: Dermatology
specialty: Dermatology/Primary Care
chief_complaint: Generalized or localized itching
description: Systematic evaluation of pruritus to identify underlying cause. Can be dermatologic (primary skin disease), systemic (internal disease), neuropathic, psychogenic, or multifactorial. Treatment directed at underlying cause plus symptomatic relief.
icd10: L29.9
snomed: 418290006
presentations:
  - Generalized or localized itching
  - Worse at night (common)
  - With or without visible rash
  - Excoriations from scratching
  - Sleep disturbance
  - Duration variable (acute vs chronic greater than 6 weeks)
urgency: routine
referrals:
  emergency:
    - Acute pruritus with angioedema or anaphylaxis
    - Severe pruritus with systemic illness requiring hospitalization
  urgent:
    - Intractable pruritus affecting quality of life
    - Concern for serious underlying disease (malignancy)
  routine:
    - Chronic pruritus requiring evaluation

workup:
  - Determine if pruritus with or without primary skin lesions
  - Pruritus with primary skin lesions - dermatologic cause
  - Rash precedes itching
  - Evaluate and treat skin condition
  - Common causes - atopic dermatitis, contact dermatitis, urticaria, psoriasis, scabies, insect bites, drug eruption
  - Pruritus without primary skin lesions (only secondary excoriations/lichenification from scratching) - systemic, neuropathic, or psychogenic
  - Itching precedes any skin changes
  - Requires evaluation for underlying systemic disease
  - History - key to diagnosis
  - Onset - acute (days to weeks) vs chronic (greater than 6 weeks)
  - Duration and pattern - constant vs intermittent, time of day (worse at night?), seasonal
  - Distribution - localized (specific area) vs generalized
  - Severity - impact on sleep, daily activities, quality of life
  - Aggravating factors - heat, sweating, stress, certain fabrics, water exposure
  - Relieving factors - cool temperatures, moisturizers, medications
  - Associated symptoms
  - Rash, skin changes
  - Fever, weight loss, night sweats (malignancy, infection)
  - Fatigue, weakness
  - Jaundice (liver disease)
  - Polyuria, polydipsia (diabetes, renal disease)
  - Neurologic symptoms (neuropathic pruritus)
  - Medication history - new medications in past 3 months
  - Common culprits - antibiotics, NSAIDs, opioids, ACE inhibitors, statins, hydroxyurea
  - Medical history - chronic diseases
  - Renal disease, liver disease, thyroid disease, diabetes, HIV, malignancy, psychiatric disorders
  - Social history - occupational exposures, hobbies, travel, new products (soaps, detergents, lotions)
  - Family history - atopy, psoriasis
  - Categories of pruritus without primary lesions
  - Dermatologic
  - Xerosis (dry skin) - most common cause
  - Elderly, winter months, low humidity, excessive bathing
  - Fine scale, eczema craquelé (crazy paving pattern)
  - Aquagenic pruritus - itching after water exposure, no visible changes
  - Systemic diseases
  - Chronic kidney disease - uremia (30-50% of dialysis patients)
  - Hepatic - cholestasis (primary biliary cholangitis, obstructive jaundice), elevated bilirubin and alkaline phosphatase
  - Endocrine - hyperthyroidism, hypothyroidism, diabetes mellitus
  - Hematologic - iron deficiency anemia, polycythemia vera (classically after warm bath), Hodgkin lymphoma, cutaneous T-cell lymphoma
  - Malignancy - paraneoplastic (solid tumors, leukemia, lymphoma)
  - Infection - HIV, parasites
  - Drug-induced - opioids (histamine release), antibiotics, NSAIDs, statins
  - Neuropathic pruritus
  - Damage to peripheral or central nervous system
  - Localized to specific dermatome or area
  - Notalgia paresthetica - upper back (T2-T6 dermatomes)
  - Brachioradial pruritus - arms (C5-C6), associated with cervical spine disease or sun damage
  - Post-herpetic itch - after herpes zoster
  - Multiple sclerosis, stroke, brain tumors (rare)
  - Psychogenic pruritus
  - No identified dermatologic, systemic, or neuropathic cause
  - Associated with psychiatric disorders - depression, anxiety, obsessive-compulsive disorder
  - Delusions of parasitosis (ekbom syndrome) - fixed false belief of infestation
  - Physical examination
  - Skin inspection - presence or absence of primary lesions
  - Primary lesions (rash) - suggests dermatologic cause
  - Only secondary lesions (excoriations, lichenification, prurigo nodules) - suggests systemic, neuropathic, or psychogenic
  - Distribution - generalized vs localized (specific dermatomes in neuropathic)
  - Signs of systemic disease
  - Jaundice, scleral icterus (liver disease)
  - Pallor (anemia)
  - Lymphadenopathy (lymphoma, HIV)
  - Hepatomegaly, splenomegaly
  - Thyromegaly
  - Xerosis (dry skin) - fine scale, especially lower legs
  - Laboratory evaluation - if pruritus without primary skin lesions
  - First-line screening labs
  - Complete blood count with differential - anemia, eosinophilia, malignancy
  - Comprehensive metabolic panel - renal function (BUN, creatinine), liver function (ALT, AST), glucose
  - Thyroid function tests (TSH, free T4)
  - Hepatic panel - bilirubin (total and direct), alkaline phosphatase (cholestasis)
  - Additional labs if indicated
  - Iron studies (ferritin, iron, TIBC) - if anemia
  - HIV test
  - Hepatitis B and C serologies - if liver disease
  - Chest X-ray - if concern for malignancy or sarcoidosis
  - CT chest/abdomen/pelvis - if concern for occult malignancy
  - Serum protein electrophoresis - if concern for paraproteinemia
  - Stool for ova and parasites - if travel history
  - Skin biopsy - rarely helpful unless specific diagnosis suspected
treatment:
  - Treat underlying cause if identified
  - Dermatologic - treat skin condition (topical steroids for eczema, etc.)
  - Systemic diseases
  - Renal pruritus - optimize dialysis, UV phototherapy, gabapentin, pregabalin, naltrexone
  - Cholestatic pruritus - cholestyramine (bile acid sequestrant), rifampin, naltrexone, UV phototherapy
  - Thyroid disease - treat underlying disorder
  - Iron deficiency - iron supplementation
  - Polycythemia vera - aspirin, hydroxyurea, interferon
  - Malignancy - treat underlying cancer
  - Drug-induced - discontinue offending medication
  - Neuropathic - gabapentin, pregabalin, capsaicin cream
  - Psychogenic - antidepressants (SSRIs, TCAs), antipsychotics if delusions, CBT
  - Symptomatic treatment - for all types
  - General skin care measures
  - Moisturizers - apply liberally and frequently (especially after bathing while skin damp)
  - Thick emollients (petroleum jelly, Aquaphor, CeraVe cream) more effective than lotions
  - Avoid hot water - lukewarm showers/baths
  - Gentle cleansers - avoid harsh soaps, use fragrance-free cleansers (Cetaphil, CeraVe)
  - Humidifier - especially winter months
  - Avoid irritants - wool, rough fabrics; wear cotton
  - Cool compresses
  - Topical therapies
  - Menthol/camphor lotions (Sarna, Gold Bond) - cooling effect
  - Topical corticosteroids - if inflammatory component (eczematous changes from scratching)
  - Topical calcineurin inhibitors (tacrolimus, pimecrolimus) - for chronic pruritus
  - Capsaicin cream 0.025-0.1% - for localized neuropathic pruritus (notalgia paresthetica, brachioradial pruritus)
  - Apply 3-4 times daily, burning sensation initially
  - Oral antihistamines - limited efficacy except for histamine-mediated pruritus (urticaria)
  - Sedating (hydroxyzine 25-50 mg, diphenhydramine 25-50 mg at bedtime) - for sleep
  - Non-sedating (cetirizine, loratadine, fexofenadine) - less effective for non-histaminergic pruritus
  - Systemic therapies for refractory pruritus
  - Gabapentin 300-2400 mg/day in divided doses - for neuropathic, uremic pruritus
  - Pregabalin 75-300 mg/day - alternative
  - Mirtazapine 15-30 mg at bedtime - sedating antidepressant, anti-pruritic effect
  - Doxepin 10-25 mg at bedtime - tricyclic antidepressant, H1/H2 antagonist
  - Naltrexone 25-50 mg daily - opioid antagonist, for cholestatic and uremic pruritus
  - SSRIs (sertraline, paroxetine) - for psychogenic pruritus
  - UV phototherapy (UVB narrowband) - for refractory pruritus, especially renal and cholestatic
  - Behavioral interventions
  - Cognitive behavioral therapy - for habit-reversal, stress management
  - Keep nails short - reduce skin damage from scratching
  - Distraction techniques
clinical_pearls:
  - Pruritus without primary skin lesions requires evaluation for systemic disease
  - Xerosis (dry skin) most common dermatologic cause - treat with moisturizers
  - Chronic kidney disease, cholestasis, thyroid disease common systemic causes
  - Chronic pruritus (greater than 6 weeks) more likely systemic or neuropathic
  - Worse at night - consider scabies, uremia, lymphoma
  - After warm bath - classic for polycythemia vera
  - Localized to back - notalgia paresthetica (neuropathic)
  - Antihistamines minimally effective for non-histaminergic pruritus (only help urticaria)
  - Gabapentin effective for neuropathic and uremic pruritus
  - Cholestyramine first-line for cholestatic pruritus
  - UV phototherapy effective for refractory uremic and cholestatic pruritus
  - Aquagenic pruritus (after water) associated with polycythemia vera, hypereosinophilic syndrome
  - Paraneoplastic pruritus may precede malignancy diagnosis by months to years
  - Prurigo nodules (hyperkeratotic nodules from chronic rubbing) sign of chronic pruritus
differentials:
  - Dermatologic - atopic dermatitis, contact dermatitis, urticaria, xerosis, scabies, psoriasis
  - Systemic - CKD, cholestasis, thyroid disease, iron deficiency, polycythemia vera, lymphoma, HIV
  - Drug-induced - opioids, antibiotics, NSAIDs, statins, hydroxyurea
  - Neuropathic - notalgia paresthetica, brachioradial pruritus, post-herpetic
  - Psychogenic - depression, anxiety, delusions of parasitosis
trace:
  - 68-year-old man presents with generalized itching for 3 months
  - Gradual onset, progressively worsening
  - Generalized, no specific area, constant, worse at night
  - No rash noted initially, now has scratches all over from itching
  - Significant sleep disturbance, wakes multiple times nightly to scratch
  - Tried over-the-counter antihistamines (loratadine, diphenhydramine) with minimal relief
  - Applied hydrocortisone cream without benefit
  - Denies new medications, no new soaps or detergents
  - No recent travel
  - Past medical history - hypertension, hyperlipidemia, chronic kidney disease stage 4 (baseline creatinine 3.5 mg/dL)
  - Medications - lisinopril, atorvastatin, sevelamer (phosphate binder)
  - Physical examination - multiple linear excoriations on trunk, arms, and legs from scratching
  - No primary rash, no urticaria, no vesicles
  - Skin dry with fine scale (xerosis) on lower legs
  - No jaundice, no scleral icterus
  - No lymphadenopathy, no hepatosplenomegaly
  - Laboratory studies
  - CBC - hemoglobin 10.2 g/dL (anemia of CKD), WBC and platelets normal
  - CMP - creatinine 3.8 mg/dL (stage 4 CKD), BUN 68 mg/dL (elevated), calcium 8.5, phosphate 5.8 (elevated)
  - LFTs - normal, bilirubin normal, alkaline phosphatase normal
  - TSH - 2.4 mIU/L (normal)
  - Ferritin 180 ng/mL (normal)
  - Diagnosis - Chronic pruritus secondary to chronic kidney disease (uremic pruritus)
  - Contributing factor - xerosis (dry skin)
  - Treatment plan
  - Symptomatic skin care measures
  - Thick moisturizer (Aquaphor) immediately after lukewarm shower and at bedtime, apply liberally to entire body
  - Switch to gentle fragrance-free cleanser (Cetaphil)
  - Avoid hot showers, limit to 10 minutes
  - Humidifier in bedroom
  - Menthol lotion (Sarna) for immediate itch relief as needed
  - Oral therapy for uremic pruritus
  - Gabapentin 100 mg at bedtime initially (lower dose due to CKD, renally cleared)
  - Adjust dose based on response and tolerability
  - Target 100-300 mg/day (lower than normal due to renal impairment)
  - Sedating antihistamine for sleep - hydroxyzine 25 mg at bedtime
  - Referred to nephrology for CKD management optimization, discuss dialysis planning
  - At 1 week - pruritus improved 30%, skin less dry with moisturizers, sleeping slightly better with hydroxyzine
  - Increased gabapentin to 100 mg twice daily (morning and bedtime)
  - At 4 weeks - pruritus improved 60%, only mild itching, sleeping much better, skin improved
  - Gabapentin dose effective at 100 mg twice daily, continues
  - Nephrology started erythropoietin for anemia, optimized phosphate binders
  - At 3 months - pruritus well-controlled 80% improvement, tolerating gabapentin without side effects, continues moisturizers twice daily
  - At 6 months - started hemodialysis (CKD progressed to ESRD), pruritus improved further with dialysis (removal of uremic toxins)
  - Continues gabapentin 100 mg after dialysis sessions (3x weekly), moisturizers daily
  - Pruritus now minimal, manageable

citations:
  - AAD (American Academy of Dermatology) Guidelines for Pruritus
  - International Forum for the Study of Itch Guidelines
  - UpToDate - Dermatology
