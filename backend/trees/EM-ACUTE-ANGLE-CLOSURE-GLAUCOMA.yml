tree_id: EM-ACUTE-ANGLE-CLOSURE-GLAUCOMA
name: Acute Angle-Closure Glaucoma
family: Emergency Medicine
specialty: Emergency Medicine
icd10:
- H40.211
- H40.212
- H40.211
snomed:
- '392288008'
urgency: urgent
description: Comprehensive evaluation and management of Acute Angle-Closure Glaucoma
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Sudden severe eye pain (deep, boring, unilateral pain)
- Blurred vision, halos around lights (from corneal edema)
- Red eye with conjunctival injection, "steamy" cloudy cornea
- Fixed mid-dilated pupil (4-6mm, unresponsive to light)
- Rock-hard eye on palpation (elevated intraocular pressure)
- Nausea, vomiting, headache (from elevated IOP and pain)
- 'IOP markedly elevated: >30 mmHg (normal 10-21), often 40-80 mmHg'
- 'Triggers: Dim lighting (pupil dilation), anticholinergic meds, emotional stress'
- 'Mechanism: Narrow anterior chamber angle, iris blocks aqueous drainage'
- 'Risk factors: Hyperopia (farsighted), Asian ancestry, age >60, family history'
- Ophthalmologic emergency - permanent vision loss within hours if untreated
- Fellow eye at 50% risk - needs prophylactic laser iridotomy
workup: []
treatment:
- 'Guideline-based treatment options for Acute Angle-Closure Glaucoma include:'
- 'Immediate: Ophthalmology consult, measure IOP, start topical drops (ACEP 2023)'
- 'Topical drops (give all): (1) Timolol 0.5% 1 drop, (2) Apraclonidine 1% 1 drop,
  (3) Prednisolone 1% 1 drop (ACEP 2023)'
- 'Systemic: Acetazolamide 500mg IV or PO (carbonic anhydrase inhibitor), antiemetics
  (ACEP 2023)'
- 'If IOP still elevated: Mannitol 1-2 g/kg IV over 30-45 min (osmotic diuresis) (ACEP
  2023)'
- 'Definitive: Laser peripheral iridotomy (ophthalmology) once IOP controlled, treat
  fellow eye prophylactically (ACEP 2023)'
clinical_pearls:
- 'Ophthalmic emergency: Permanent vision loss if IOP not lowered within hours'
- 'Tonometry: Measure IOP (>30 mmHg diagnostic, normal 10-21)'
- 'Treatment goal: Lower IOP <20 mmHg within 1-2 hours'
- 'Topical drops work synergistically: Beta-blocker + alpha-agonist + prostaglandin
  + steroid'
- 'Mannitol: Osmotic diuretic, lowers IOP rapidly (if topical drops insufficient)'
- 'Definitive: Laser peripheral iridotomy (ophthalmology) - creates hole in iris for
  aqueous drainage'
referrals: []
differentials: []
