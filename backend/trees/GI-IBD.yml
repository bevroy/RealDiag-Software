tree_id: GI-IBD
name: Inflammatory Bowel Disease
family: Gastroenterology
specialty: Gastroenterology  
chief_complaint: Chronic diarrhea, abdominal pain, rectal bleeding, weight loss
description: Chronic relapsing inflammatory GI disorders including Crohn disease (transmural, skip lesions, fistulas) and ulcerative colitis (mucosal only, continuous from rectum)
icd10: K51.90
snomed: 64766004
presentations:
  - Chronic diarrhea (often bloody in UC)
  - Abdominal pain, cramping
  - Weight loss, malnutrition
  - Fatigue, fever
  - Extraintestinal: arthritis, uveitis, skin lesions
  - Perianal disease (Crohn)
urgency: urgent
referrals:
  emergency:
    - GI bleeding with instability
    - Acute liver failure
    - Perforated viscus
    - Cholangitis
  urgent:
    - Suspected malignancy
    - Severe IBD flare
    - Persistent vomiting
  routine:
    - IBS management
    - GERD treatment
    - Screening colonoscopy

workup:
  - Overview - Crohn disease (CD) can affect any GI tract (mouth to anus), transmural inflammation, skip lesions, fistulas and strictures; Ulcerative colitis (UC) limited to colon, mucosal only, continuous from rectum
  - Epidemiology - 1.6 million in US, peak 15-30 years and 50-70 years, more common in northern latitudes, whites, Ashkenazi Jews
  - Pathophysiology - Dysregulated immune response to intestinal microbiota in genetically susceptible (NOD2, IL23R mutations)
  - Crohn disease - Terminal ileum and right colon most common (45%), transmural inflammation, skip lesions, non-caseating granulomas (30-40%), cobblestone appearance
  - Symptoms - Chronic non-bloody diarrhea (unless colonic involvement), RLQ pain (terminal ileum), weight loss, perianal disease (fistulas, abscesses 25-30%)
  - Complications - Fistulas (enteroenteric, enterocutaneous, enterovesical causing pneumaturia), strictures with obstruction, abscesses, malabsorption (B12, fat-soluble vitamins)
  - Ulcerative colitis - Always involves rectum (95%), continuous proximal spread, mucosal inflammation only (no fistulas)
  - Extent - Proctitis (rectum only 30%), left-sided (to splenic flexure 40%), pancolitis (entire colon 30%)
  - Symptoms - Bloody diarrhea (hallmark), urgency, tenesmus, lower abdominal cramping
  - Severity - Mild (<4 stools/day minimal blood), Moderate (4-6 stools/day), Severe (>6 stools/day profuse bleeding fever tachycardia anemia)
  - Complications - Toxic megacolon (colon >6 cm with systemic toxicity), massive hemorrhage, perforation, strictures, colorectal cancer (2-3x risk)
  - Extraintestinal manifestations (25-30%) - Peripheral arthritis (large joints), ankylosing spondylitis, erythema nodosum (shins), pyoderma gangrenosum (ulcers with violaceous borders), aphthous stomatitis (oral ulcers), episcleritis, uveitis (sight-threatening), primary sclerosing cholangitis (5% of UC, increased cholangiocarcinoma risk)
  - Laboratory - CBC (anemia leukocytosis), ESR and CRP elevated, fecal calprotectin >50 mcg/g (distinguishes IBD from IBS), hypoalbuminemia, stool culture to exclude infection (C. difficile, Salmonella, Shigella, Campylobacter)
  - Imaging - CT enterography (CD, shows bowel wall thickening, fistulas, abscesses, strictures), MR enterography (no radiation, good for young patients and perianal disease)
  - Colonoscopy with biopsies - GOLD STANDARD, UC shows continuous inflammation from rectum with erythema, friability, loss of vascular pattern, ulcerations, pseudopolyps; CD shows skip lesions, cobblestone appearance, aphthous ulcers, strictures
  - Biopsies - Multiple from affected and unaffected areas, UC has crypt abscesses, CD may have non-caseating granulomas (30-40%)
treatment:
  - Goals - Induce remission, maintain remission, prevent complications
  - Mild to moderate disease
  - 5-ASA (mesalamine) - UC first-line 2.4-4.8 g/day oral, topical suppositories or enemas for distal disease (combination oral + topical superior), limited efficacy in CD
  - Budesonide - Locally acting steroid, CD (ileal or right colon) 9 mg daily x 8 weeks, UC (MMX budesonide) 9 mg daily, fewer systemic side effects
  - Moderate to severe disease
  - Systemic corticosteroids - Prednisone 40-60 mg daily x 1-2 weeks then taper over 8-12 weeks, IV methylprednisolone 40-60 mg if severe, NOT for maintenance (30-40% steroid-dependent)
  - Immunomodulators - Azathioprine 2-2.5 mg/kg/day or 6-MP 1-1.5 mg/kg/day (slow onset 3-6 months, check TPMT, monitor CBC and LFTs), methotrexate 15-25 mg SC/IM weekly (CD, less effective UC)
  - Biologic therapy - Moderate-severe refractory to steroids, steroid-dependent, fistulizing CD
  - Anti-TNF - Infliximab 5 mg/kg IV at 0,2,6 weeks then q8 weeks, adalimumab 160 mg SC then 80 mg at 2 weeks then 40 mg q2 weeks (screen for TB with PPD or IGRA, side effects include infection, TB reactivation, lymphoma rare)
  - Integrin inhibitor - Vedolizumab (gut-selective, safer, no TB risk, slower onset 8-12 weeks)
  - IL-12/23 inhibitor - Ustekinumab (CD)
  - JAK inhibitor - Tofacitinib oral (UC, increased thrombosis risk)
  - Antibiotics - Metronidazole, ciprofloxacin for perianal CD or bacterial overgrowth
  - Surgical therapy
  - CD - Indications are strictures with obstruction, fistulas, abscesses, perforation, refractory disease; NOT curative (recurs 50-70% at 5 years), bowel-sparing resections, stricturoplasty
  - UC - Total proctocolectomy with ileal pouch-anal anastomosis (IPAA) is CURATIVE, indications are medically refractory, toxic megacolon, perforation, dysplasia/cancer, severe hemorrhage
  - Colorectal cancer surveillance - UC colonoscopy every 1-2 years starting 8-10 years after diagnosis (pancolitis) or 15 years (left-sided), CD if >1/3 colon involved, PSC annual colonoscopy (very high risk)
clinical_pearls:
  - Bloody diarrhea suggests UC, chronic non-bloody diarrhea with RLQ pain suggests Crohn disease
  - Fecal calprotectin >50 mcg/g distinguishes IBD from IBS (high negative predictive value)
  - Colonoscopy with biopsies is gold standard (skip lesions and granulomas favor CD, continuous from rectum favors UC)
  - 5-ASA first-line for mild-moderate UC, less effective in CD
  - Anti-TNF biologics (infliximab, adalimumab) effective for moderate-severe disease or fistulizing CD
  - Screen for TB before starting anti-TNF therapy (reactivation risk)
  - Total colectomy with IPAA is curative for UC but not CD (disease recurs post-op)
  - Colorectal cancer surveillance every 1-2 years starting 8-10 years after UC diagnosis
differentials:
  - GI-IRRITABLE-BOWEL-SYNDROME
  - INFECTIOUS-C-DIFFICILE-COLITIS
  - INFECTIOUS-GASTROENTERITIS
  - GI-CELIAC-DISEASE
  - GI-DIVERTICULITIS
trace:
  - Chronic diarrhea (bloody in UC, non-bloody in CD) with abdominal pain and weight loss
  - Elevated fecal calprotectin, CRP, anemia
  - Colonoscopy with biopsies (continuous from rectum in UC, skip lesions in CD)
  - Mild-moderate UC - 5-ASA oral and topical
  - Moderate-severe or steroid-refractory - Anti-TNF biologics (infliximab, adalimumab)

