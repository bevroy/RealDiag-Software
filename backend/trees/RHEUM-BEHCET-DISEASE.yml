tree_id: RHEUM-BEHCET-DISEASE
name: Behcet Disease
family: Rheumatology
specialty: Rheumatology
chief_complaint: Recurrent mouth sores and genital ulcers
description: Multisystem vasculitis causing recurrent oral and genital ulcers, uveitis, and skin lesions. More common and severe in Middle East and Asia, HLA-B51 associated. Colchicine for mucocutaneous symptoms, immunosuppression for severe organ involvement to prevent blindness.
icd10: M35.2
urgency: urgent

workup:
  - Clinical diagnosis: recurrent oral ulcers (mandatory criterion) plus 2 of 4 additional criteria
  - Mandatory: recurrent oral aphthous ulcers at least 3 times in 12 months
  - Painful ulcers on tongue, buccal mucosa, gingiva, pharynx
  - Heal without scarring in 1-2 weeks but recur
  - Additional criteria (need 2 of 4):
  - Recurrent genital ulcers: painful ulcers on scrotum, penis, vulva, vagina (scar unlike oral ulcers)
  - Eye lesions: anterior or posterior uveitis, retinal vasculitis
  - Skin lesions: erythema nodosum, pseudofolliculitis, papulopustular lesions, acneiform nodules
  - Positive pathergy test: pustule forms 24-48 hours after needle prick (hyperreactive skin)
  - Major organ involvement:
  - Ocular (50%): bilateral uveitis, retinal vasculitis, risk of blindness most feared complication
  - Vascular (25%): deep vein thrombosis, arterial aneurysms, superficial thrombophlebitis
  - Neurologic (5-10%): meningoencephalitis, stroke, venous sinus thrombosis
  - GI (10-15%): ulcers throughout GI tract (especially ileocecal), can mimic Crohn disease
  - Arthritis: non-erosive oligoarthritis (knees, ankles, wrists)
  - Epidemiology: more common along ancient Silk Road (Turkey, Iran, Japan, Korea), rare in Northern Europe and North America
  - HLA-B51: associated with Behcet (60-80% positive) but not diagnostic
  - Labs: elevated inflammatory markers (ESR, CRP) during active disease, no specific diagnostic test
  - Rule out: herpes simplex (culture oral/genital lesions), HIV, inflammatory bowel disease, reactive arthritis
  - Pathergy test: sterile needle prick on forearm, positive if pustule at 24-48 hours (70% sensitive in Turkey, only 10-20% in Western countries)

treatment:
  - Mucocutaneous disease (oral/genital ulcers, skin lesions):
  - Colchicine 0.6 mg BID: first-line, reduces frequency and severity of oral/genital ulcers and erythema nodosum
  - Topical corticosteroids: triamcinolone 0.1% in Orabase for oral ulcers, clobetasol cream for genital ulcers
  - Apremilast (Otezla) 30 mg BID: PDE4 inhibitor, FDA-approved for Behcet oral ulcers
  - Dapsone 50-100 mg daily: for mucocutaneous lesions
  - Ocular disease (sight-threatening - requires aggressive treatment):
  - Systemic corticosteroids: prednisone 1 mg/kg daily initially
  - Azathioprine 2-2.5 mg/kg daily: steroid-sparing, prevents blindness
  - TNF inhibitors: infliximab 5 mg/kg IV (very effective for refractory uveitis)
  - Interferon-alpha: alternative for severe ocular disease
  - Urgent ophthalmology referral: any eye symptoms (pain, redness, blurred vision, floaters)
  - Vascular disease:
  - Immunosuppression: corticosteroids plus azathioprine or cyclophosphamide
  - Anticoagulation controversial: may worsen arterial aneurysms (use cautiously)
  - Avoid surgery on aneurysms if possible (high anastomotic leak risk)
  - Neurologic disease:
  - High-dose corticosteroids: methylprednisolone 1 g IV daily x3-5 days
  - Azathioprine or cyclophosphamide: for maintenance
  - GI disease:
  - Sulfasalazine 2-3 g daily or mesalamine
  - Corticosteroids for active ulcers
  - TNF inhibitors: for refractory GI disease
  - Arthritis:
  - NSAIDs: first-line for joint symptoms
  - Colchicine: reduces arthritis frequency
  - Multidisciplinary care: rheumatology, ophthalmology, dermatology

clinical_pearls:
  - Recurrent oral ulcers (mandatory) plus genital ulcers, uveitis, or skin lesions
  - Blindness most feared complication - urgent ophthalmology for any eye symptoms
  - More common and severe in Middle East and Asia (Silk Road distribution)
  - Colchicine first-line for mucocutaneous disease
  - Aggressive immunosuppression for ocular disease to prevent blindness
  - Genital ulcers scar (unlike oral ulcers)
  - Pathergy test positive (pustule after needle prick) - more sensitive in Middle East
  - HLA-B51 associated (60-80%) but not diagnostic

differentials:
  - Herpes simplex: recurrent oral/genital ulcers, culture positive, responds to antivirals
  - Inflammatory bowel disease: GI symptoms, colonoscopy shows chronic inflammation
  - Reactive arthritis: oligoarthritis after infection, urethritis, conjunctivitis
  - Systemic lupus: oral ulcers painless, positive ANA, multisystem involvement
  - Aphthous stomatitis: recurrent oral ulcers only, no systemic features

trace: |
  A 32-year-old man from Turkey presented with recurrent mouth sores x5 years and genital ulcers x2 years. Oral ulcers appear every 4-6 weeks (3-5 painful ulcers on tongue and cheeks), last 10-14 days then heal, but recur. Six months ago developed recurrent painful ulcers on scrotum (heal with scarring). Two months ago had episode of right eye pain, redness, and blurred vision lasting 2 weeks (acute anterior uveitis). Also has episodes of red tender nodules on shins (erythema nodosum). Occasional knee and ankle pain and swelling. Family history: father had similar symptoms. Exam showed 3 active oral ulcers on buccal mucosa and tongue (painful), healed scar from genital ulcer on scrotum, erythematous nodules on anterior shins (erythema nodosum). Ophthalmology exam showed anterior uveitis resolving from recent episode. Labs: ESR 45, CRP 28, HLA-B51 positive. Pathergy test performed: sterile needle prick on forearm, at 48 hours pustule formed (positive pathergy test - diagnostic). Diagnosed with Behcet disease (recurrent oral ulcers plus genital ulcers, uveitis, erythema nodosum, positive pathergy test, from Turkey - endemic area). URGENT ophthalmology referral for uveitis management. Started colchicine 0.6 mg BID for mucocutaneous symptoms. Prednisone 60 mg daily for active uveitis. Azathioprine 150 mg daily (2.5 mg/kg) started as steroid-sparing and to prevent blindness. Topical prednisolone eye drops QID. At 4 weeks eye inflammation resolved, oral ulcer frequency decreased. At 3 months no new genital ulcers, oral ulcers reduced to once every 8-10 weeks (less frequent and less severe on colchicine). Prednisone tapered to 10 mg daily. At 6 months excellent control on azathioprine 150 mg and colchicine 0.6 mg BID. No recurrent uveitis (prevented with immunosuppression). Continues maintenance therapy. Ophthalmology follow-up every 3 months. Counseled on chronic relapsing disease, importance of urgent reporting of eye symptoms to prevent blindness.
