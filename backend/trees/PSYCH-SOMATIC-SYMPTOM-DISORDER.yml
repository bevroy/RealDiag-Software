tree_id: PSYCH-SOMATIC-SYMPTOM-DISORDER
name: Somatic Symptom Disorder
family: psychiatry
specialty: Psychiatry/Primary Care
icd10: F45.1
snomed: 271587009
urgency: []
homeopathy: []
presentations:
  - One or more somatic symptoms that are distressing or result in significant disruption of daily life
  - Excessive thoughts, feelings, or behaviors related to somatic symptoms
  - Disproportionate and persistent thoughts about seriousness of symptoms
  - Persistently high level of anxiety about health or symptoms
  - Excessive time and energy devoted to symptoms or health concerns
  - Duration: symptoms persistent (typically 6+ months)
  - May involve single symptom (usually pain) or multiple symptoms
  - Symptoms may or may not be medically explained
  - High healthcare utilization, "doctor shopping"
workup:
  - Clinical diagnosis based on DSM-5-TR criteria (not diagnosis of exclusion)
  - Key: focus on excessive thoughts, feelings, behaviors about symptoms, not whether symptoms are medically explained
  - Comprehensive medical evaluation to assess somatic complaints
  - Rule out underlying medical conditions (but avoid excessive testing)
  - Review previous medical workup and results
  - Mental status examination
  - Assess for anxiety and depression
  - Evaluate level of preoccupation with symptoms
  - Assess health anxiety and beliefs about illness
  - Functional assessment
  - Impact on work, school, social activities
  - Quality of life measures
  - Healthcare utilization patterns
  - Rating scales
  - PHQ-15 (Patient Health Questionnaire somatic symptoms)
  - Somatic Symptom Scale-8 (SSS-8)
  - Whiteley Index (health anxiety)
  - Screen for comorbid conditions
  - Major depression (present in 60-80%)
  - Anxiety disorders (present in 50-75%)
  - Personality disorders
  - Substance use disorders
  - Important: diagnosis requires psychological symptoms (excessive thoughts/feelings/behaviors), not just somatic symptoms
treatment:
  - Establish therapeutic alliance (most important intervention)
  - Schedule regular, time-limited appointments (not PRN)
  - Acknowledge and validate symptoms (do not tell patient "it's all in your head")
  - Shift focus from "cure" to "coping" and functional improvement
  - Avoid unnecessary tests and procedures
  - Psychotherapy (first-line treatment)
  - Cognitive Behavioral Therapy (CBT) - most evidence
  - Address catastrophic thinking about symptoms
  - Reduce checking and reassurance-seeking behaviors
  - Improve coping strategies
  - Mindfulness-based interventions
  - Acceptance and Commitment Therapy (ACT)
  - Pharmacotherapy (for comorbid depression/anxiety)
  - SSRIs if depression or anxiety present
  - Fluoxetine 20-60 mg daily
  - Sertraline 50-200 mg daily
  - Escitalopram 10-20 mg daily
  - SNRIs (duloxetine) may help with pain symptoms
  - Avoid benzodiazepines and opioids (high risk misuse, worsens outcomes)
  - Collaborative care model
  - Regular follow-up with primary care provider
  - Consultation with psychiatry/mental health
  - Physical therapy for pain/functional symptoms
  - Lifestyle interventions
  - Regular exercise (improves mood and reduces symptom focus)
  - Sleep hygiene
  - Stress management
  - Gradual return to normal activities
clinical_pearls:
  - "Affects 5-7% of general population, more common in women"
  - "Key change in DSM-5: focus on psychological features (excessive thoughts/behaviors), not whether symptoms are medically unexplained"
  - "Diagnosis is made in ADDITION to medical conditions, not instead of them"
  - "High healthcare costs - patients use 6-14 times more healthcare resources than average"
  - "Avoid extensive medical testing - reinforces belief that serious disease is present"
  - "Regular scheduled visits reduce PRN/emergency visits and improve outcomes"
  - "Comorbid depression/anxiety present in 70-80% - treat aggressively"
  - "Family involvement important - family members often reinforce illness behavior"
referrals:
  - Psychiatry or psychology for CBT and medication management
  - Mental health therapist for ongoing psychotherapy
  - Pain management if chronic pain prominent (multidisciplinary approach)
  - Avoid specialty referrals for extensive workup unless clear indication
differentials:
  - Somatic symptom disorder (psychological symptoms prominent, excessive focus on symptoms)
  - Illness anxiety disorder (preoccupation with having serious illness, minimal somatic symptoms)
  - Conversion disorder/Functional neurological symptom disorder (neurological symptoms incompatible with medical condition)
  - Factitious disorder (intentional production of symptoms for sick role)
  - Malingering (intentional symptoms for external gain)
  - Medical conditions causing symptoms (always consider, but SSD can coexist)
  - Major depressive disorder with somatic complaints
  - Generalized anxiety disorder (worry not focused solely on health)
  - Body dysmorphic disorder (preoccupation with appearance)
  - Pain disorders (chronic pain without excessive psychological symptoms)
trace:
  source: DSM-5-TR Criteria, APA Practice Guidelines, Cochrane Review on CBT for Somatic Symptom Disorders
  version: '1.0'
  last_updated: '2025-12-26'
