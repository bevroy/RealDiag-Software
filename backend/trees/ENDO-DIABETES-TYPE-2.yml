tree_id: ENDO-DIABETES-TYPE-2
name: Type 2 Diabetes Mellitus
family: Endocrinology
specialty: Endocrinology
chief_complaint: Elevated blood sugar and increased thirst
description: |
  Metabolic disorder of insulin resistance and progressive beta-cell dysfunction causing hyperglycemia. Affects 10% of US population, 90-95% of all diabetes cases.
  Risk factors - obesity, sedentary lifestyle, family history, age, ethnicity (African American, Hispanic, Native American). Complications - microvascular (retinopathy, nephropathy, neuropathy) and macrovascular (CAD, stroke, PAD). Tight glycemic control prevents complications.
icd10: E11.9
urgency: Low
workup:
  - Diagnostic criteria (any one of following)
  - Fasting glucose greater than or equal to 126 mg/dL (8-hour fast) on two occasions
  - Random glucose greater than or equal to 200 mg/dL with symptoms (polyuria, polydipsia, weight loss)
  - HbA1c greater than or equal to 6.5% (reflects average glucose over 3 months)
  - 2-hour glucose greater than or equal to 200 mg/dL on oral glucose tolerance test (OGTT)
  - Prediabetes (identify for prevention) - fasting glucose 100-125 mg/dL, HbA1c 5.7-6.4%, 2-hour OGTT 140-199 mg/dL
  - Screen all adults age 45+ every 3 years, earlier if overweight plus risk factor
  - C-peptide and GAD antibodies if type 1 vs type 2 uncertain (C-peptide low in type 1, GAD antibodies positive in type 1)
  - Assess for complications at diagnosis and annually
  - Diabetic retinopathy - dilated fundoscopic exam or retinal photography annually (leading cause of blindness in working-age adults)
  - Diabetic nephropathy - urine albumin-to-creatinine ratio (UACR) annually, serum creatinine/eGFR
  - Microalbuminuria (UACR 30-300 mg/g), macroalbuminuria (UACR greater than 300 mg/g)
  - Diabetic neuropathy - monofilament test, vibration sense, ankle reflexes
  - Peripheral arterial disease - ankle-brachial index, foot exam for ulcers
  - Cardiovascular risk - lipid panel (fasting), blood pressure
  - Screen for comorbidities - hypothyroidism (TSH), depression (PHQ-9)
treatment:
  - Lifestyle modifications cornerstone - all patients
  - Medical nutrition therapy - reduce calories, limit refined carbs, Mediterranean diet
  - Physical activity - at least 150 minutes weekly moderate exercise
  - Weight loss - 5-10% weight loss improves glycemic control, may achieve remission
  - Glycemic targets individualized - generally HbA1c less than 7% (less than 6.5% if early disease and low hypoglycemia risk, less than 8% if elderly or high hypoglycemia risk)
  - Fasting glucose 80-130 mg/dL, postprandial less than 180 mg/dL
  - First-line pharmacotherapy - metformin 500-2000mg daily (start 500mg with meals, titrate q1-2 weeks)
  - Decreases hepatic glucose production, improves insulin sensitivity
  - GI side effects common (diarrhea, nausea) - take with food, use extended-release formulation
  - Contraindications - eGFR less than 30, metabolic acidosis, contrast dye (hold 48 hours)
  - Rare lactic acidosis risk
  - If HbA1c not at goal after 3 months metformin, add second agent based on patient factors
  - Cardiovascular disease or high CV risk - add GLP-1 RA or SGLT2 inhibitor (proven CV benefit)
  - Heart failure or CKD - add SGLT2 inhibitor (reduces HF hospitalization and CKD progression)
  - Need to minimize hypoglycemia - avoid sulfonylureas/insulin
  - Weight loss priority - GLP-1 RA (most effective)
  - Cost concern - sulfonylurea or thiazolidinedione
  - Medication classes
  - GLP-1 receptor agonists - semaglutide 0.25-2mg SC weekly, dulaglutide 0.75-4.5mg SC weekly, liraglutide 0.6-1.8mg SC daily
  - Weight loss (10-15 lbs), CV benefit, no hypoglycemia, GI side effects (nausea)
  - SGLT2 inhibitors - empagliflozin 10-25mg daily, canagliflozin 100-300mg daily, dapagliflozin 5-10mg daily
  - Reduce CV events, HF, CKD progression, weight loss, no hypoglycemia
  - Increase UTI/yeast infections, rare DKA
  - DPP-4 inhibitors - sitagliptin 100mg daily, linagliptin 5mg daily (less effective than GLP-1 RA)
  - Sulfonylureas - glipizide 5-20mg daily, glimepiride 1-8mg daily (cheap but hypoglycemia risk, weight gain)
  - Thiazolidinediones - pioglitazone 15-45mg daily (avoid in heart failure - fluid retention)
  - Insulin if severe hyperglycemia or not at goal on oral agents
  - Basal insulin (long-acting) - glargine, detemir, degludec, start 10 units nightly or 0.1-0.2 units/kg
  - Titrate by 2 units q3 days based on fasting glucose
  - Add bolus insulin (rapid-acting) before meals if basal insufficient
  - Complications management
  - Diabetic retinopathy - laser photocoagulation, intravitreal anti-VEGF injections
  - Diabetic nephropathy - ACE inhibitor or ARB (renoprotective), SGLT2 inhibitor, control BP less than 130/80
  - Diabetic neuropathy - gabapentin, pregabalin, duloxetine, TCAs for pain; foot care education
  - Cardiovascular disease - aspirin 81mg daily, statin (atorvastatin 40-80mg), ACE/ARB
  - Vaccinations - annual influenza, pneumococcal (PCV20 or PCV15+PPSV23), COVID-19, hepatitis B
clinical_pearls:
  - HbA1c target individualized - younger/healthier aim less than 7%, elderly/comorbid less than 8%
  - Self-monitoring blood glucose frequency depends on regimen - not needed if on metformin alone
  - Hypoglycemia (glucose less than 70 mg/dL) - treat with 15g fast-acting carbs (glucose tablets, juice), recheck in 15 minutes
  - Severe hypoglycemia - glucagon 1mg IM/SC or dextrose 50% 50mL IV
  - DKA rare in type 2 (more common type 1) but can occur with severe stress
  - Metformin does not cause hypoglycemia (monotherapy)
  - Bariatric surgery most effective intervention for obese diabetics (remission rate 60-80%)
differentials:
  - Type 1 diabetes mellitus
  - Maturity onset diabetes of the young (MODY)
  - Cushing syndrome
  - Acromegaly
  - Pheochromocytoma
  - Drug-induced hyperglycemia (steroids)
trace:
  - 52-year-old obese man (BMI 34) presents for annual exam → Fasting glucose 148 mg/dL on routine labs → Repeat fasting glucose 152 mg/dL → HbA1c 7.8% → Diagnose type 2 diabetes mellitus → Asymptomatic, no complications on exam → Dilated eye exam normal, UACR 18 mg/g (normal), monofilament test intact → Lipid panel - LDL 132 mg/dL, HDL 38 mg/dL, triglycerides 210 mg/dL → BP 138/88 → Lifestyle counseling - diet, exercise, weight loss → Start metformin 500mg BID with meals → Educate on home glucose monitoring → HbA1c 7.2% at 3 months (improved but not at goal) → Increase metformin to 1000mg BID → Cardiovascular risk present - add semaglutide 0.25mg SC weekly → Titrate semaglutide to 1mg weekly over 2 months → Add atorvastatin 40mg daily for dyslipidemia → Add lisinopril 10mg daily for BP → Weight loss 18 lbs over 6 months → HbA1c 6.4% at 6 months (at goal) → Continue current regimen, annual monitoring for complications
