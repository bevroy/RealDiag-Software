nodes:
  - id: cll_evaluation
    type: diagnosis
    name: "Chronic Lymphocytic Leukemia"
    icd10: "C91.1"
    urgency: medium
    workup:
      - Chronic lymphocytic leukemia (CLL) - Clonal proliferation mature B-lymphocytes accumulate in blood, bone marrow, lymph nodes, spleen
      - Most common leukemia adults in Western countries
      - Same disease as small lymphocytic lymphoma (SLL) - lymph node predominant, minimal blood involvement
      - Epidemiology - Incidence 4.7 per 100,000/year, 20,000 new cases/year US
      - Median age 70 years (rarely <40 years), male:female 2:1
      - More common Caucasians, rare in Asians
      - Risk factors - Age (strongest), family history (7x risk if first-degree relative), Agent Orange exposure
      - Pathophysiology - Clonal B-cell accumulation (not rapidly dividing, but resist apoptosis) → progressive replacement bone marrow/lymph nodes
      - Immunophenotype - CD5+, CD19+, CD20+ (dim), CD23+, surface immunoglobulin (dim)
      - Chromosomal abnormalities (prognostic)
      - Del(13q) - Favorable prognosis (50-60% patients)
      - Trisomy 12 - Intermediate prognosis (10-20%)
      - Del(11q) - Poor prognosis (15-20%, bulky lymphadenopathy)
      - Del(17p) or TP53 mutation - Very poor prognosis (5-10%, treatment-resistant)
      - Clinical presentation - Highly variable (asymptomatic to symptomatic)
      - Asymptomatic (70-80% at diagnosis) - Incidental lymphocytosis on routine CBC
      - Lymphadenopathy (50-90%) - Painless, generalized, waxing/waning
      - Cervical, axillary, inguinal most common
      - Splenomegaly (25-50%), hepatomegaly (less common)
      - B symptoms (25% advanced disease) - Fever, night sweats, weight loss (>10% in 6 months)
      - Fatigue - Anemia or disease burden
      - Infections - Recurrent (hypogammaglobulinemia, immune dysfunction), sinopulmonary most common
      - Autoimmune complications (10-25%)
      - Autoimmune hemolytic anemia (AIHA, 10-15%) - Positive DAT (Coombs), warm agglutinins
      - Immune thrombocytopenia (ITP, 2-5%)
      - Pure red cell aplasia (rare)
      - Transformation (Richter transformation 2-10%) - Transform to aggressive lymphoma (diffuse large B-cell lymphoma), abrupt clinical deterioration, rapidly enlarging lymph node, fever, weight loss, hypercalcemia, elevated LDH
      - Physical exam - Lymphadenopathy (nontender, mobile, rubbery), splenomegaly, hepatomegaly, pallor (anemia)
      - Labs
      - CBC with differential - Absolute lymphocytosis (>5,000/μL B-lymphocytes REQUIRED for diagnosis)
      - Lymphocytes often 20,000-100,000+ (can be >200,000)
      - Smudge cells (Gumprecht shadows) - Fragile lymphocytes rupture during smear preparation (CHARACTERISTIC)
      - Anemia, thrombocytopenia (bone marrow infiltration or autoimmune)
      - Flow cytometry (peripheral blood) - DIAGNOSTIC
      - Clonal B-cells - CD5+, CD19+, CD20+ (dim), CD23+, surface Ig (dim), kappa or lambda light chain restriction
      - Distinguishes CLL from other lymphoproliferative disorders
      - Immunoglobulins - Hypogammaglobulinemia (low IgG, IgA, IgM in 50-70%), increased infection risk
      - Direct antiglobulin test (DAT, Coombs) - Positive in 10-35% (AIHA if also anemia + elevated retic)
      - LDH - Elevated if high tumor burden or Richter transformation
      - β2-microglobulin - Elevated (prognostic marker, higher = worse)
      - Bone marrow aspirate/biopsy - Not required for diagnosis (can diagnose with blood flow cytometry + lymphocytosis)
      - Shows lymphocytic infiltration (>30% lymphocytes)
      - Obtain if cytopenias present (assess for marrow involvement vs. autoimmune)
      - Cytogenetics/FISH - Prognostic
      - Del(13q) - Best prognosis (median survival 11-25 years)
      - Trisomy 12 - Intermediate (median survival 9 years)
      - Del(11q) - Poor prognosis (median survival 6-7 years, rapid progression, bulky adenopathy)
      - Del(17p) or TP53 mutation - Worst prognosis (median survival 2-3 years, chemo-resistant)
      - IGHV mutation status - Prognostic
      - Mutated IGHV - Favorable (indolent, median survival 25+ years)
      - Unmutated IGHV - Unfavorable (aggressive, median survival 8-10 years)
      - Imaging - Not routinely required
      - CT chest/abdomen/pelvis - If considering treatment (assess lymph node size, organomegaly)
      - PET-CT - If Richter transformation suspected
      - Diagnostic criteria (IWCLL 2018)
      - ≥5,000/μL clonal B-lymphocytes in peripheral blood (sustained ≥3 months)
      - Clonality confirmed by flow cytometry (CD5+, CD19+, CD20+ dim, CD23+, light chain restriction)
      - Monoclonal B-cell lymphocytosis (MBL) - Clonal B-cells <5,000/μL, no symptoms, no organomegaly
      - Progresses to CLL 1-2% per year
      - Staging - Guides treatment
      - Rai staging (US)
      - Stage 0 - Lymphocytosis only (low risk, median survival >10 years)
      - Stage I - Lymphocytosis + lymphadenopathy (intermediate risk, median survival 7-9 years)
      - Stage II - Lymphocytosis + splenomegaly or hepatomegaly (intermediate risk, median survival 7-9 years)
      - Stage III - Lymphocytosis + anemia (Hgb <11) (high risk, median survival 2-4 years)
      - Stage IV - Lymphocytosis + thrombocytopenia (platelets <100K) (high risk, median survival 2-4 years)
      - Binet staging (Europe)
      - Stage A - <3 lymphoid areas involved (median survival >10 years)
      - Stage B - ≥3 lymphoid areas involved (median survival 5-7 years)
      - Stage C - Anemia (Hgb <10) or thrombocytopenia (platelets <100K) (median survival 2-4 years)
    treatment:
      - Watch and wait - Early-stage asymptomatic CLL (Rai 0-II, Binet A-B)
      - NO benefit to early treatment (multiple trials show no survival advantage)
      - Monitor CBC q3-6 months, physical exam
      - Median time to treatment 2-5 years (many never require treatment)
      - Indications for treatment (IWCLL criteria) - Progressive or symptomatic disease
      - Progressive marrow failure - Worsening anemia (Hgb <10) or thrombocytopenia (platelets <100K)
      - Massive (>6 cm below costal margin) or progressive splenomegaly
      - Massive (>10 cm) or progressive lymphadenopathy
      - Progressive lymphocytosis - Increase >50% in 2 months or doubling time <6 months
      - Autoimmune anemia/thrombocytopenia poorly responsive to corticosteroids
      - B symptoms - Fever >100.5°F ≥2 weeks, night sweats ≥1 month, unintentional weight loss >10% in 6 months
      - First-line treatment - Depends on fitness, age, and TP53 status
      - Fit patients (no significant comorbidities, CrCl >70, CIRS <6)
      - Chemoimmunotherapy - Fludarabine, cyclophosphamide, rituximab (FCR)
      - Standard for young fit patients without TP53 deletion/mutation
      - Complete remission 70-90%, median PFS 5-7 years
      - Side effects - Myelosuppression, infections, secondary malignancies (MDS/AML 5%)
      - Contraindicated if del(17p)/TP53 mutation (refractory)
      - Targeted therapy - Increasingly preferred first-line
      - BTK inhibitors - Ibrutinib (Imbruvica), acalabrutinib (Calquence), zanubrutinib (Brukinsa)
      - Oral daily, indefinite duration (until progression or intolerance)
      - Response rate 85-90%, PFS 60-70% at 5 years
      - Advantages - Oral, effective even del(17p)/TP53 mutation, elderly/unfit patients
      - Side effects - Bleeding (platelet dysfunction, avoid anticoagulation), atrial fibrillation (10-15%), hypertension, arthralgias, diarrhea
      - BCL-2 inhibitor - Venetoclax (Venclexta)
      - Oral daily, fixed duration (1 year) when combined with obinutuzumab (anti-CD20 antibody)
      - Venetoclax + obinutuzumab - First-line option, complete remission 50%, PFS 70-80% at 4 years
      - Tumor lysis syndrome risk - Ramp-up dosing required, allopurinol/hydration
      - Side effects - Neutropenia, infections
      - Unfit/elderly patients (significant comorbidities, CrCl <70, CIRS >6)
      - BTK inhibitor monotherapy - Ibrutinib or acalabrutinib (oral, well-tolerated)
      - Venetoclax + obinutuzumab - Fixed duration (1 year)
      - Chlorambucil + obinutuzumab - If cannot tolerate above
      - Del(17p) or TP53 mutation - Avoid chemoimmunotherapy (refractory)
      - BTK inhibitor (ibrutinib, acalabrutinib) or venetoclax + obinutuzumab
      - Consider allogeneic stem cell transplant (only curative option, younger patients)
      - Relapsed/refractory CLL
      - Change drug class - If relapsed after BTK inhibitor, use venetoclax (and vice versa)
      - Novel agents - Pirtobrutinib (non-covalent BTK inhibitor for prior BTK inhibitor failure), CAR T-cell therapy (lisocabtagene maraleucel, FDA-approved 2024 for relapsed CLL)
      - Allogeneic stem cell transplant - Only curative option, consider if young, multiply relapsed, TP53 aberration
      - Supportive care
      - Autoimmune hemolytic anemia - Prednisone 1 mg/kg/day, rituximab
      - Immune thrombocytopenia - Corticosteroids, IVIG, rituximab
      - Infections - IVIG replacement if recurrent infections + hypogammaglobulinemia (IgG <400), prophylactic antibiotics (some patients), vaccinations (influenza, pneumococcal, COVID-19)
      - Richter transformation - Urgent treatment
      - Biopsy lymph node (confirm DLBCL)
      - R-CHOP chemotherapy (rituximab, cyclophosphamide, doxorubicin, vincristine, prednisone)
      - Poor prognosis (median survival 5-8 months), consider clinical trial, allogeneic transplant
      - Prognosis - Highly variable (indolent to aggressive)
      - Low-risk (Rai 0, del(13q), mutated IGHV) - Median survival 10-25+ years (near-normal life expectancy)
      - High-risk (Rai III-IV, del(17p), unmutated IGHV) - Median survival 2-3 years untreated, improved with novel agents (BTK inhibitors, venetoclax)
      - Overall median survival - 10 years (but very heterogeneous)
      - Cause of death - Infections (30-50%), Richter transformation (10%), secondary malignancies (10%), progressive CLL
