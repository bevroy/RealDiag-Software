tree_id: PEDS-ASTHMA
name: Pediatric Asthma
family: pediatrics
specialty: Pediatrics/Pulmonology
icd10: J45.909
snomed: 195967001
urgency:
  - Severe respiratory distress
  - Inability to speak
  - Cyanosis
  - Altered mental status
  - Silent chest
homeopathy: []
presentations:
  - Recurrent wheezing episodes
  - Cough (especially nighttime or early morning, with exercise, or with laughing/crying)
  - Shortness of breath or dyspnea
  - Chest tightness
  - Triggered by respiratory infections, allergens, exercise, cold air, smoke
  - Symptoms improve with bronchodilator therapy
  - Family history of asthma or atopy (eczema, allergic rhinitis)
  - More common in boys before puberty
  - May have history of infant wheezing with bronchiolitis
workup:
  - Clinical history
  - Pattern of symptoms (episodic versus chronic, triggers)
  - Frequency and severity of symptoms
  - Nighttime awakenings due to asthma
  - Exercise limitation
  - Triggers identified (URI, allergens, exercise, weather, smoke)
  - Frequency of rescue inhaler use
  - Previous exacerbations requiring ED visits or hospitalizations
  - Previous ICU admissions or intubations (high-risk)
  - Current medications and adherence
  - Family history of asthma, allergies, eczema
  - Environmental exposures (tobacco smoke, pets, mold, dust mites)
  - Impact on school attendance and daily activities
  - Physical examination during acute exacerbation
  - Vital signs (respiratory rate, heart rate, oxygen saturation, blood pressure)
  - General appearance and degree of distress
  - Ability to speak in full sentences (impaired with moderate-severe exacerbation)
  - Respiratory examination
  - Work of breathing (retractions, accessory muscle use, nasal flaring)
  - Auscultation (wheezing, prolonged expiration, decreased air entry)
  - '"Silent chest" (absence of wheeze with severe obstruction - ominous sign)'
  - Peak expiratory flow (if age greater than 5 years and able to perform)
  - Assess severity of exacerbation
  - Mild: speaks in full sentences, preferred position sitting, no accessory muscle use, SpO2 greater than 95%, PEFR 70-90% predicted
  - Moderate: speaks in phrases, sits upright, accessory muscle use, SpO2 91-95%, PEFR 40-69% predicted
  - Severe: speaks in words only, sits hunched forward, prominent accessory muscle use, SpO2 less than or equal to 90%, PEFR less than 40% predicted
  - Between exacerbations
  - May have normal physical exam
  - Assess for signs of allergic rhinitis, eczema, nasal polyps
  - Diagnostic testing
  - Spirometry with bronchodilator response (age greater than or equal to 5 years)
  - Gold standard for diagnosis in children able to perform
  - Demonstrates reversible airflow obstruction
  - FEV1/FVC ratio less than 0.80-0.85 (obstructive pattern)
  - Greater than 12% improvement in FEV1 after bronchodilator (reversibility)
  - May be normal between exacerbations
  - Peak expiratory flow (PEF) monitoring
  - Home monitoring in persistent asthma
  - Variability greater than 20% suggests poor control
  - Chest X-ray
  - NOT routinely needed for asthma diagnosis
  - Consider for first severe exacerbation or to rule out complications (pneumonia, pneumothorax, atelectasis)
  - Allergy testing (skin prick or specific IgE)
  - Identify allergic triggers (dust mites, pet dander, pollen, mold)
  - Helps guide environmental control measures
  - Complete blood count (CBC) with differential
  - Eosinophilia suggests allergic/atopic asthma
  - Exhaled nitric oxide (FeNO) - marker of eosinophilic airway inflammation
  - Elevated in allergic asthma, helps guide therapy
  - Not required for diagnosis but may aid in management
treatment:
  - Classify asthma severity and control
  - Intermittent: symptoms less than 2 days/week, nighttime awakenings less than or equal to 2 times/month, no interference with activity, FEV1 greater than 80%
  - Mild persistent: symptoms greater than 2 days/week but not daily, nighttime awakenings 3-4 times/month, FEV1 greater than 80%
  - Moderate persistent: daily symptoms, nighttime awakenings greater than 1 time/week, some limitation of activity, FEV1 60-80%
  - Severe persistent: symptoms throughout the day, nighttime awakenings often 7 times/week, extremely limited activity, FEV1 less than 60%
  - Acute exacerbation management
  - Mild exacerbation (outpatient)
  - Albuterol (salbutamol) 2-4 puffs via MDI with spacer every 20 minutes for 1 hour OR 2.5 mg nebulized every 20 minutes for 1 hour
  - Oral corticosteroids: prednisolone 1-2 mg/kg/day (max 40-60 mg) for 3-5 days
  - Reassess after 1 hour - if improved, can manage at home with albuterol every 4 hours as needed and oral steroids
  - Moderate-severe exacerbation (ED/hospital)
  - Albuterol nebulized 2.5-5 mg every 20 minutes for 3 doses, then every 1-4 hours as needed
  - Continuous nebulized albuterol (10-15 mg/hour) for severe exacerbation
  - Ipratropium bromide 250-500 mcg nebulized every 20 minutes for 3 doses (added to albuterol for moderate-severe)
  - Systemic corticosteroids: prednisolone 1-2 mg/kg/day PO (max 60 mg) OR methylprednisolone 1-2 mg/kg IV (max 60 mg) OR dexamethasone 0.6 mg/kg PO/IM/IV (max 16 mg)
  - Supplemental oxygen to maintain SpO2 greater than or equal to 92%
  - Magnesium sulfate 50 mg/kg IV (max 2 g) over 20-30 minutes for severe exacerbation not responding to initial therapy
  - Life-threatening/ICU management
  - IV corticosteroids (methylprednisolone 1-2 mg/kg every 6 hours)
  - Continuous albuterol nebulization
  - Magnesium sulfate IV
  - Heliox (helium-oxygen mixture) to reduce work of breathing
  - IV terbutaline (last resort before intubation)
  - Non-invasive positive pressure ventilation (BiPAP)
  - Mechanical ventilation if respiratory failure
  - Long-term controller therapy (based on severity)
  - Intermittent asthma: no daily medication, albuterol as needed for symptoms
  - Mild persistent: low-dose inhaled corticosteroid (ICS) OR leukotriene receptor antagonist (montelukast)
  - Moderate persistent: low-medium dose ICS + long-acting beta agonist (LABA) OR medium-dose ICS alone
  - Severe persistent: high-dose ICS-LABA + consider add-on therapy (leukotriene modifier, tiotropium, or biologic)
  - Inhaled corticosteroids (ICS) - FIRST-LINE controller
  - Fluticasone, budesonide, beclomethasone
  - Anti-inflammatory, reduce airway hyperresponsiveness
  - Daily use required, not for acute symptoms
  - Rinse mouth after use to prevent oral candidiasis
  - Low-risk side effects at low-medium doses
  - Rescue medication
  - Short-acting beta-2 agonist (SABA): albuterol 2-4 puffs as needed for symptoms
  - Use of SABA greater than 2 days/week indicates need for controller therapy escalation
  - Asthma action plan
  - Written individualized plan for daily management and exacerbations
  - Green zone (well-controlled), yellow zone (getting worse), red zone (medical alert)
  - When to increase medications, when to seek emergency care
  - Environmental control
  - Avoid tobacco smoke exposure (most important)
  - Reduce dust mite exposure (mattress/pillow covers, wash bedding hot water weekly)
  - Reduce pet dander if allergic (remove pets or restrict to outdoors)
  - Avoid mold exposure
  - Influenza and pneumococcal vaccination
clinical_pearls:
  - 'Asthma clinical diagnosis based on recurrent wheezing, cough, dyspnea that improves with bronchodilators - spirometry confirms if able to perform'
  - 'Inhaled corticosteroids (ICS) are first-line controller therapy for persistent asthma - reduce exacerbations and improve lung function'
  - 'Silent chest (absence of wheeze) in severe asthma exacerbation is ominous sign - indicates minimal air movement, impending respiratory failure'
  - 'Oral corticosteroids (prednisolone 1-2 mg/kg for 3-5 days) given early in exacerbation reduce hospitalization - no taper needed for short course'
  - 'Frequent SABA use (greater than 2 days/week) indicates poor asthma control - escalate controller therapy'
  - 'Tobacco smoke exposure single most important modifiable risk factor - counsel parents on smoking cessation'
  - 'Asthma action plan essential for all patients - written plan improves outcomes and reduces hospitalizations'
  - 'Spacers mandatory with MDI in children - improves drug delivery to lungs, reduces oropharyngeal deposition'
referrals:
  - Pediatric pulmonology if severe persistent asthma, poor control despite optimal therapy, frequent exacerbations requiring hospitalization
  - Pediatric pulmonology if considering biologic therapy (omalizumab, mepolizumab, dupilumab)
  - Pediatric allergy for comprehensive allergy testing and immunotherapy consideration
  - Pediatric ICU if life-threatening exacerbation, impending respiratory failure
differentials:
  - Asthma (recurrent wheezing with reversibility, triggered by allergens/exercise/URI, responds to bronchodilators)
  - Viral-induced wheeze (wheezing only with respiratory infections, age less than 3 years, may outgrow)
  - Bronchiolitis (first episode of wheeze, age less than 2 years, winter seasonality, preceding URI)
  - Foreign body aspiration (sudden onset, unilateral wheeze, choking episode)
  - Gastroesophageal reflux disease (GERD) - can trigger asthma-like symptoms
  - Vocal cord dysfunction (inspiratory stridor, normal spirometry, occurs during episode)
  - Cystic fibrosis (chronic cough, failure to thrive, recurrent pneumonia, malabsorption)
  - Primary ciliary dyskinesia (chronic rhinosinusitis, recurrent pneumonia, situs inversus in some)
  - Congenital heart disease with pulmonary overcirculation (failure to thrive, tachypnea, hepatomegaly)
  - Bronchopulmonary dysplasia (prematurity, chronic oxygen requirement)
