tree_id: PSYCH-DEPRESSION-ANXIETY-MIXED
name: Depression with Anxiety (Mixed)
family: psychiatry
specialty: Psychiatry/Primary Care
icd10: F41.8
snomed: 231504006
urgency: []
homeopathy: []
presentations:
  - Symptoms of both depression and anxiety present simultaneously
  - Depressive symptoms: persistent sad mood, anhedonia, low energy, sleep disturbance, appetite changes, poor concentration, feelings of worthlessness
  - Anxiety symptoms: excessive worry, restlessness, tension, irritability, muscle tension, difficulty relaxing
  - Neither symptom cluster clearly predominates
  - Both sets of symptoms cause clinically significant distress or functional impairment
  - Very common presentation (50-60% of depression includes significant anxiety; 60-70% of anxiety includes depression)
  - Often more severe and chronic than pure depression or anxiety
  - Higher suicide risk than pure depression or anxiety alone
workup:
  - Comprehensive psychiatric assessment
  - Assess depressive symptoms (PHQ-9)
  - Assess anxiety symptoms (GAD-7)
  - Determine which symptoms predominate or if truly mixed
  - Duration and course of illness
  - Assess severity and functional impairment
  - Occupational, social, academic functioning
  - Activities of daily living
  - Quality of life measures
  - Safety assessment
  - Suicidal ideation (higher risk in mixed presentations)
  - Self-harm behaviors
  - Columbia-Suicide Severity Rating Scale (C-SSRS)
  - Rule out bipolar disorder (critical)
  - Screen for history of manic/hypomanic episodes (MDQ - Mood Disorder Questionnaire)
  - Agitated depression can mimic mixed anxiety-depression
  - Family history of bipolar disorder
  - Previous antidepressant-induced mania
  - Rule out medical causes
  - Thyroid function (TSH) - hyper or hypothyroidism
  - CBC, CMP (anemia, metabolic abnormalities)
  - Vitamin D, B12
  - Screen for substance use
  - Alcohol, benzodiazepines (withdrawal causes anxiety and depression)
  - Stimulants, cannabis
  - Assess comorbidities
  - PTSD (trauma history)
  - Panic disorder (panic attacks)
  - Social anxiety disorder
  - OCD
  - Substance use disorders
treatment:
  - Psychotherapy (first-line, highly effective for mixed presentations)
  - Cognitive Behavioral Therapy (CBT) - most evidence
  - Addresses both depressive and anxious thoughts/behaviors
  - Behavioral activation (for depression)
  - Exposure (for anxiety)
  - Interpersonal therapy (IPT)
  - Mindfulness-Based Cognitive Therapy (MBCT)
  - Acceptance and Commitment Therapy (ACT)
  - Pharmacotherapy
  - SSRIs first-line (effective for both depression and anxiety)
  - Escitalopram 10-20 mg daily (excellent for both)
  - Sertraline 50-200 mg daily
  - Fluoxetine 20-60 mg daily (activating, may worsen anxiety initially)
  - Paroxetine 20-50 mg daily (more sedating, good if anxiety prominent)
  - SNRIs alternative
  - Venlafaxine XR 75-225 mg daily (good for mixed presentations)
  - Duloxetine 40-120 mg daily
  - Other options
  - Mirtazapine 15-45 mg at bedtime (if insomnia/poor appetite)
  - Bupropion 150-450 mg daily (if fatigue prominent, but may worsen anxiety)
  - Avoid benzodiazepines for long-term treatment
  - High addiction potential
  - Interfere with CBT exposure therapy
  - Short-term use only (2-4 weeks) if severe anxiety
  - Combination therapy (medication + psychotherapy)
  - More effective than either alone for mixed presentations
  - 60-70% response vs 40-50% with monotherapy
  - Lifestyle interventions
  - Regular aerobic exercise (30 min, 5 days/week) - reduces both depression and anxiety
  - Sleep hygiene
  - Stress reduction techniques (mindfulness, relaxation, yoga)
  - Limit caffeine and alcohol
  - Social support and engagement
clinical_pearls:
  - "Mixed anxiety-depression affects 25-35% of primary care patients with mood/anxiety disorders"
  - "More chronic and severe than pure depression or anxiety - worse prognosis, higher relapse rates"
  - "Suicide risk higher with mixed presentations - always assess carefully"
  - "SSRIs effective for both depression and anxiety - single agent treats both symptom clusters"
  - "CBT addresses both cognitive distortions (depression) and avoidance behaviors (anxiety) - ideal for mixed presentations"
  - "Avoid benzodiazepines long-term - worsen depression, addiction risk, interfere with therapy"
  - "Screen for bipolar disorder - agitated depression with anxiety can be misdiagnosed as mixed anxiety-depression"
  - "Combination therapy (medication + psychotherapy) superior to monotherapy for mixed presentations"
referrals:
  - Mental health therapist for CBT or other evidence-based psychotherapy
  - Psychiatry if symptoms severe, not responding to treatment, or diagnostic uncertainty
  - Emergency evaluation if active suicidal ideation or intent
differentials:
  - Mixed anxiety-depression (significant symptoms of both, neither clearly predominates)
  - Major depressive disorder with anxious distress (depression predominates, anxiety is specifier)
  - Generalized anxiety disorder with depressive symptoms (anxiety predominates)
  - Bipolar disorder (screen for manic/hypomanic episodes)
  - Adjustment disorder with mixed anxiety and depressed mood (identifiable stressor, <6 months)
  - PTSD (trauma history, specific symptom clusters)
  - Panic disorder with agoraphobia (panic attacks, avoidance)
  - Social anxiety disorder (fear of social situations)
  - OCD (obsessions and compulsions)
  - Substance-induced mood disorder (alcohol, benzodiazepines, stimulants)
  - Medical conditions (hyperthyroidism, hypothyroidism, anemia)
