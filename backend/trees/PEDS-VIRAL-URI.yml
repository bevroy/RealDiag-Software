tree_id: PEDS-VIRAL-URI
name: Viral Upper Respiratory Infection (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine
icd10: J06.9
snomed: 82272006
urgency: []
homeopathy: []
presentations:
  - Nasal congestion or rhinorrhea (clear to yellow/green discharge)
  - Sneezing
  - Sore throat or throat discomfort
  - Cough (dry or productive)
  - Low-grade fever (usually less than 101°F/38.3°C)
  - Decreased appetite
  - Irritability or fussiness (especially infants)
  - Mild headache
  - Fatigue or decreased activity level
  - Watery eyes
  - Mild ear discomfort (without otitis media)
  - Duration typically 7-10 days (cough may persist 2-3 weeks)
  - Peak symptoms at days 3-5
  - Commonly follows exposure to sick contacts or daycare
workup:
  - Clinical history
  - Duration and progression of symptoms
  - Sick contacts (family, daycare, school)
  - Fever pattern and maximum temperature
  - Feeding and hydration status (especially infants)
  - Breathing difficulty or increased work of breathing
  - Ear pain or tugging at ears
  - Previous episodes and frequency
  - Immunization status
  - Underlying conditions (asthma, immunodeficiency, heart disease)
  - Physical examination
  - Vital signs (temperature, respiratory rate, heart rate, oxygen saturation)
  - General appearance (assess degree of illness, hydration, respiratory distress)
  - Head and neck examination
  - Nasal discharge (clear, purulent) - color NOT reliable indicator of bacterial infection
  - Nasal mucosa (erythema, edema)
  - Pharynx (erythema, exudate - if present consider strep throat)
  - Tympanic membranes (assess for acute otitis media)
  - Cervical lymphadenopathy (tender, mobile anterior cervical nodes common in viral URI)
  - Lung examination
  - Auscultation (assess for wheezing, crackles, decreased air entry)
  - Work of breathing (retractions, nasal flaring, grunting)
  - Respiratory rate (tachypnea suggests lower respiratory tract involvement)
  - Laboratory and diagnostic testing
  - Usually NOT required for typical viral URI
  - Consider if atypical features or complications suspected
  - Rapid strep test if exudative pharyngitis (rule out strep throat)
  - Rapid flu test if influenza suspected during flu season (only if results would change management)
  - Chest X-ray if concern for pneumonia (persistent fever, respiratory distress, hypoxia, crackles)
  - COVID-19 testing based on local guidelines and exposure history
treatment:
  - Supportive care (mainstay of treatment - viral URI is self-limited)
  - Fluids and nutrition
  - Encourage adequate hydration (breast milk, formula, water, oral rehydration solutions)
  - Small frequent feedings if decreased appetite
  - Continue breastfeeding (provides immune benefits)
  - Fever and discomfort management
  - Acetaminophen (15 mg/kg/dose every 4-6 hours, max 5 doses/day)
  - Age greater than 2 months, dose based on weight
  - Ibuprofen (10 mg/kg/dose every 6-8 hours, max 40 mg/kg/day)
  - Age greater than 6 months only
  - Alternate acetaminophen and ibuprofen if needed for persistent fever
  - Treat fever for comfort, not to prevent complications (fever is protective)
  - Nasal congestion relief
  - Nasal saline drops or spray (0.9% saline)
  - Use before feedings and sleep
  - 2-3 drops each nostril, then suction with bulb syringe (infants)
  - Humidification (cool mist humidifier in bedroom)
  - Elevate head of bed 30 degrees (improves drainage)
  - Nasal suctioning with bulb syringe or nasal aspirator (infants and young children)
  - Cough management
  - Honey (age greater than 1 year ONLY) - 2.5-5 mL as needed for cough
  - DO NOT give honey to infants less than 1 year (botulism risk)
  - Encourage fluids (thins secretions)
  - Cough is protective mechanism - suppression not generally recommended
  - Avoid over-the-counter cough and cold medications (not recommended age less than 6 years)
  - Medications to AVOID in children
  - Over-the-counter cough and cold medications (age less than 4-6 years)
  - Not proven effective, risk of serious side effects
  - Aspirin (CONTRAINDICATED due to Reye syndrome risk)
  - Antibiotics (NOT effective for viral infections)
  - Topical decongestant sprays (rebound congestion)
  - Anticipatory guidance
  - Expected duration 7-10 days (cough may persist 2-3 weeks)
  - When to call or return
  - High fever (greater than 103°F/39.4°C) or fever lasting more than 3 days
  - Difficulty breathing, fast breathing, wheezing
  - Severe ear pain or drainage from ear
  - Not drinking or signs of dehydration (dry mouth, no tears, decreased urine output)
  - Worsening symptoms after initial improvement (suggests secondary bacterial infection)
  - Irritability, lethargy, or difficult to console
  - Symptoms lasting more than 10-14 days without improvement
  - Prevention
  - Hand hygiene (most important preventive measure)
  - Avoid close contact with sick individuals
  - Keep child home from daycare/school when ill
  - Annual influenza vaccine
  - Ensure up-to-date immunizations
clinical_pearls:
  - 'Viral URI most common illness in children - average 6-8 colds per year in young children, up to 12/year in daycare'
  - 'Color of nasal discharge (green or yellow) does NOT indicate bacterial infection - common in normal course of viral URI'
  - 'Antibiotics NOT indicated for uncomplicated viral URI - do not prevent bacterial complications and increase antibiotic resistance'
  - 'Fever in viral URI typically peaks day 2-3 and resolves by day 4-5 - persistence beyond 5 days suggests complication'
  - 'Over-the-counter cough and cold medications not recommended age less than 6 years - ineffective and potentially harmful'
  - 'Honey (age greater than 1 year) more effective than dextromethorphan for nighttime cough in children'
  - 'Most viral URIs self-resolve within 7-10 days - counseling parents on natural history reduces antibiotic prescribing'
  - 'Secondary bacterial infections (AOM, sinusitis, pneumonia) occur in less than 5% of viral URIs in previously healthy children'
referrals:
  - Pediatric pulmonology if recurrent respiratory infections with wheezing or persistent symptoms
  - Pediatric ENT if recurrent otitis media, adenoid hypertrophy, or chronic sinusitis
  - Pediatric immunology if unusually frequent or severe infections (suggests immunodeficiency)
  - Pediatric allergy if suspicion for allergic rhinitis as contributing factor
differentials:
  - Viral upper respiratory infection (most common - rhinovirus, coronavirus, adenovirus, RSV)
  - Allergic rhinitis (chronic or seasonal symptoms, clear rhinorrhea, sneezing, itchy eyes, no fever)
  - Acute bacterial sinusitis (persistent symptoms greater than 10 days OR worsening after initial improvement OR severe symptoms with high fever greater than 39°C and purulent nasal discharge for 3+ days)
  - Strep pharyngitis (exudative pharyngitis, fever, no cough, tender anterior cervical lymphadenopathy)
  - Influenza (abrupt onset high fever, myalgias, more severe systemic symptoms, during flu season)
  - COVID-19 (similar symptoms, consider based on exposure and local prevalence)
  - Acute otitis media (ear pain, fever, bulging tympanic membrane)
  - Bronchiolitis (age less than 2 years, wheezing, respiratory distress)
  - Pneumonia (persistent fever, respiratory distress, hypoxia, crackles on exam)
