tree_id: NEU-RADICULOPATHY
name: Radiculopathy
family: Neurology
specialty: Neurology/Orthopedics/Physical Medicine
chief_complaint: Radiating arm or leg pain with numbness and weakness in nerve root distribution
description: Compression or inflammation of spinal nerve root causing dermatomal pain, paresthesias, weakness, and reflex changes in the affected nerve root distribution

icd10: M54.16
snomed: "128200000"

urgency: urgent_if_severe

homeopathy:
  - remedy: "Hypericum perforatum 200C"
    indications: "Nerve pain, shooting pains along nerve distribution, numbness, tingling, worse with touch"
  - remedy: "Colocynthis 200C"
    indications: "Sciatica, shooting pain down leg, better with pressure and heat, worse with movement"
  - remedy: "Rhus toxicodendron 30C"
    indications: "Back pain and stiffness, worse after rest, better with continued motion, worse damp weather"
  - remedy: "Gnaphalium 30C"
    indications: "Sciatica alternating with numbness, pain down leg, numbness in feet, worse lying down"
  - remedy: "Ruta graveolens 30C"
    indications: "Lower back pain, sciatica, worse with overuse, stiffness, better with warmth and movement"

presentations:
  - Radiating pain in dermatomal distribution (neck to arm or back to leg)
  - Numbness and paresthesias in specific dermatome
  - Weakness in myotomal distribution
  - Diminished or absent deep tendon reflex
  - Pain worse with coughing, sneezing, Valsalva (raises intrathecal pressure)
  - Neck or back pain (may or may not be present)
  - Positive provocative tests (Spurling for cervical, straight leg raise for lumbar)
  - Unilateral symptoms typical (nerve root compression usually asymmetric)

workup:
  - Cervical radiculopathy: identify nerve root level by symptoms, C5 (deltoid weakness, lateral arm numbness, reflex none specific), C6 (biceps weakness, thumb/index numbness, biceps reflex decreased), C7 (triceps weakness, middle finger numbness, triceps reflex decreased - most common 50 percent), C8 (hand intrinsic weakness, ring/pinky numbness, reflex none specific), Spurling test (neck extension and rotation toward affected side - positive if reproduces arm pain, sensitivity 50 percent, specificity 85-95 percent)
  - Lumbar radiculopathy: identify level, L3 (hip flexion weak, anterior thigh numbness, knee reflex may decrease), L4 (knee extension weak, medial leg numbness, knee reflex decreased), L5 (ankle dorsiflexion weak - foot drop, great toe extension weak, lateral leg and dorsal foot numbness, no reflex - most common 50 percent), S1 (ankle plantarflexion weak, cannot toe walk, lateral foot numbness, ankle reflex decreased/absent - second most common 45 percent), straight leg raise test (supine leg raise with knee extended - positive if radiating leg pain at less than 60 degrees, sensitivity 80-90 percent, specificity 40 percent, crossed straight leg raise more specific 25 percent but less sensitive)
  - Motor examination: test key muscles in myotomal distribution, compare to contralateral side, grade strength 0-5 scale, C5 deltoid (arm abduction), C6 biceps and wrist extension, C7 triceps and wrist flexion, C8 finger flexion, L3 hip flexion, L4 knee extension, L5 ankle dorsiflexion and great toe extension (EHL), S1 ankle plantarflexion
  - Sensory examination: light touch and pinprick in dermatomal distribution, map out sensory deficits, C6 thumb and index, C7 middle finger, C8 ring and pinky, L4 medial leg, L5 lateral leg and dorsal foot, S1 lateral foot and posterior calf
  - Reflex testing: biceps (C5-C6), brachioradialis (C6), triceps (C7), patellar (L4), Achilles (S1), asymmetric or absent reflex supports radiculopathy diagnosis
  - Red flags requiring urgent imaging: saddle anesthesia (cauda equina syndrome), bowel or bladder dysfunction (retention or incontinence), progressive neurologic deficit (weakness worsening), fever or constitutional symptoms (infection - epidural abscess, osteomyelitis), history of cancer (metastases), significant trauma, age over 50 with new back pain (cancer risk), osteoporosis (fracture risk), chronic steroid use, immunosuppression
  - MRI spine (with and without contrast): gold standard imaging (shows disc herniation, foraminal stenosis, nerve root compression), cervical MRI for arm symptoms, lumbar MRI for leg symptoms, T1 and T2 sequences (T2 shows disc herniation, nerve root edema, stenosis), contrast if infection or tumor suspected
  - MRI findings: disc herniation (central, paracentral, foraminal, far lateral), disc protrusion (broad-based), disc extrusion (narrow neck), sequestered fragment (free fragment), foraminal stenosis (bony narrowing), ligamentum flavum hypertrophy, facet hypertrophy, spondylolisthesis, correlate MRI findings with clinical presentation (30-40 percent asymptomatic adults have disc abnormalities on MRI - clinical correlation essential)
  - CT spine: alternative if MRI contraindicated (pacemaker, claustrophobia), better visualizes bony structures (osteophytes, fractures, spondylolisthesis), less detail of soft tissues and nerve roots than MRI
  - X-ray spine: initial imaging if trauma or fracture suspected, assess alignment, degenerative changes, disc space narrowing, spondylolisthesis, not sensitive for nerve root compression
  - Electrodiagnostic studies (EMG/NCS): confirm diagnosis if clinical or imaging findings unclear, distinguish radiculopathy from peripheral neuropathy or plexopathy, assess chronicity and severity, denervation on EMG (fibrillations, positive sharp waves - appear 2-3 weeks after nerve injury), reduced recruitment, compare to contralateral side, sensitivity 50-85 percent (may be normal early or mild radiculopathy)
  - Labs if red flags: CBC (infection), ESR/CRP (inflammation, infection, malignancy), consider blood cultures if febrile

treatment:
  - Natural history: most radiculopathy (80-90 percent) improves spontaneously within 6-12 weeks without surgery, conservative management first-line for most
  - Activity modification: avoid aggravating positions (neck extension/rotation for cervical, bending/lifting for lumbar), relative rest (not strict bed rest - worse outcomes), gentle activity as tolerated, avoid prolonged sitting
  - NSAIDs: first-line medication (ibuprofen 600-800 mg TID with food or naproxen 500 mg BID), reduce inflammation and pain, use 2-4 weeks trial, caution if GI bleed risk, renal disease, cardiovascular disease
  - Muscle relaxants: if muscle spasm (cyclobenzaprine 5-10 mg THS at bedtime, methocarbamol 500-750 mg QID), sedation common, short-term use only (2-3 weeks)
  - Oral corticosteroids: prednisone 60-80 mg daily x 5-7 days then taper (alternative dose pack), reduce nerve root inflammation, may provide faster pain relief, consider if severe pain and no contraindications (diabetes, osteoporosis, infection)
  - Neuropathic pain medications: if pain persists beyond 2-4 weeks, gabapentin 300 mg THS titrate to 900-1800 mg daily divided TID (sedation, dizziness common), pregabalin 75 mg BID titrate to 150-300 mg BID, duloxetine 30-60 mg daily (SNRI - also treats comorbid depression)
  - Epidural steroid injection (ESI): if inadequate response to oral medications, severe pain, persistent symptoms beyond 6 weeks, transforaminal approach (targets specific nerve root - most effective), interlaminar approach (spread to multiple levels), fluoroscopy-guided, relief typically 50-70 percent but often temporary (median 3-6 months), can repeat up to 3 injections per year, risks include infection, bleeding, dural puncture, worsening pain
  - Physical therapy: after acute pain improves (1-2 weeks), cervical or lumbar strengthening exercises, core stabilization, postural training, traction (cervical - mixed evidence, lumbar - not recommended), manual therapy, education on body mechanics
  - Cervical collar or lumbar brace: short-term use only (less than 2 weeks), prolonged use leads to muscle deconditioning
  - Opioids: AVOID if possible (addiction risk, limited evidence of benefit, short-term use only if needed for severe acute pain - tramadol 50-100 mg Q6H PRN or oxycodone 5-10 mg Q4-6H PRN x 1-2 weeks maximum)
  - Surgical indications: progressive motor weakness (especially if severe less than 3/5 strength), cauda equina syndrome (emergency), severe intractable pain despite 6-12 weeks conservative treatment, patient preference after failed conservative care, cervical surgery (anterior cervical discectomy and fusion ACDF or posterior foraminotomy), lumbar surgery (microdiscectomy for herniation or laminectomy/foraminotomy for stenosis)
  - Cauda equina syndrome EMERGENCY: saddle anesthesia, bowel/bladder dysfunction (retention or incontinence), bilateral leg weakness, massive central disc herniation on MRI, requires urgent surgical decompression within 24-48 hours (better outcomes if surgery within 48 hours)
  - Prognosis: excellent with conservative management (80-90 percent improve 6-12 weeks), surgical outcomes good for disc herniation (80-90 percent relief), stenosis outcomes more variable, recurrence risk 5-15 percent

clinical_pearls:
  - 80-90 percent of radiculopathy improves with conservative treatment within 6-12 weeks
  - C7 radiculopathy most common cervical (50 percent) - triceps weakness, middle finger numbness, triceps reflex decreased
  - L5 radiculopathy most common lumbar (50 percent) - foot drop, great toe weak, lateral leg numb, no reflex change
  - Spurling test (cervical) and straight leg raise (lumbar) most useful provocative tests
  - Crossed straight leg raise highly specific for lumbar disc herniation (25 percent sensitivity but 90 percent specificity)
  - MRI findings must correlate with clinical presentation (30-40 percent asymptomatic adults have disc abnormalities)
  - Cauda equina syndrome is emergency requiring urgent surgery (saddle anesthesia, bowel/bladder dysfunction)
  - NSAIDs first-line medication, oral steroids may speed recovery
  - Epidural steroid injection for persistent pain (50-70 percent relief but often temporary)
  - Surgery indicated for progressive weakness, cauda equina, or failed conservative treatment 6-12 weeks

referrals:
  - Spine surgeon (orthopedic spine or neurosurgery) for progressive motor weakness, severe pain failing conservative treatment, cauda equina syndrome (emergency)
  - Physical medicine and rehabilitation (physiatry) for conservative management, epidural steroid injection
  - Pain management for interventional procedures (ESI, nerve blocks, radiofrequency ablation)
  - Physical therapy for exercises, strengthening, body mechanics education
  - Neurology if diagnosis uncertain or electrodiagnostic studies needed

differentials:
  - Peripheral neuropathy (stocking-glove distribution, symmetric, involves feet, no radicular pain, systemic cause - diabetes)
  - Carpal tunnel syndrome (median nerve - nocturnal symptoms, Phalen and Tinel signs, no neck pain)
  - Ulnar neuropathy (elbow or wrist - ulnar distribution, worse with elbow flexion, Tinel at elbow)
  - Brachial plexopathy (involves multiple nerve roots, trauma or idiopathic, shoulder pain, weakness)
  - Cervical myelopathy (spinal cord compression - upper motor neuron signs, hyperreflexia, Hoffman sign, gait disturbance, bowel/bladder)
  - Thoracic outlet syndrome (arm symptoms with overhead activity, supraclavicular tenderness, vascular symptoms)
  - Piriformis syndrome (sciatica-like pain, tenderness over piriformis, worse with sitting, negative straight leg raise, FAIR test positive)
  - Trochanteric bursitis (lateral hip pain, worse with walking, no radicular symptoms, tenderness over greater trochanter)
  - Lumbar spinal stenosis (neurogenic claudication - bilateral leg pain with walking, relieved by sitting or leaning forward, worse standing/walking)

trace:
  - 45-year-old construction worker presents with right leg pain x 3 weeks, radiating from lower back down posterior thigh to lateral calf and foot
  - Onset: lifting heavy object at work, immediate sharp back pain followed by leg pain developing over next 24 hours
  - Pain description: shooting, burning pain down right leg (worse than back pain), numbness lateral foot and calf, difficulty walking on heels (foot weak)
  - Aggravating factors: worse with coughing, sneezing, sitting, bending forward, better lying down
  - Past medical history: no prior back problems, no trauma, no bowel/bladder symptoms, no saddle anesthesia
  - Work: construction worker, frequent heavy lifting and bending
  - Exam: walks with antalgic gait favoring right leg, straight leg raise positive at 40 degrees on right (reproduces leg pain), negative on left, crossed straight leg raise positive (lifting left leg reproduces right leg pain - highly specific for disc herniation)
  - Motor: right ankle dorsiflexion 3/5 weak (cannot walk on heels), great toe extension (EHL) 4/5, ankle plantarflexion 5/5 normal, hip flexion 5/5, knee extension 5/5, left leg 5/5 all
  - Sensory: decreased light touch lateral right calf and dorsal foot (L5 dermatome), pinky and medial foot normal (S1 normal)
  - Reflexes: patellar (L4) 2+ symmetric, Achilles (S1) 2+ symmetric (ankle reflex normal - not S1 radiculopathy)
  - Diagnosis: right L5 radiculopathy (foot drop, lateral leg numbness, positive straight leg raise, no reflex change expected L5)
  - Red flags assessed: no saddle anesthesia (cauda equina ruled out), no bowel/bladder dysfunction, no fever, no cancer history, no progressive weakness (acute 3 weeks)
  - MRI lumbar spine without contrast: large right paracentral L4-L5 disc extrusion (8 mm), compressing right L5 nerve root, disc material extends into foramen, significant mass effect on nerve root
  - Diagnosis confirmed: L4-L5 disc herniation with right L5 radiculopathy
  - Treatment plan (initial conservative):
    • Activity modification: avoid heavy lifting, bending, prolonged sitting, relative rest (not bed rest), light activity as tolerated
    • NSAIDs: ibuprofen 800 mg TID with food x 2-4 weeks (reduce inflammation)
    • Muscle relaxants: cyclobenzaprine 5 mg THS at bedtime PRN muscle spasm x 2 weeks
    • Oral corticosteroids: prednisone 60 mg daily x 5 days then taper (reduce nerve root inflammation - may speed recovery)
    • Neuropathic pain: gabapentin 300 mg at bedtime x 3 days then 300 mg BID x 3 days then 300 mg TID (titrate slowly for leg pain)
    • Work: out of work 2-4 weeks (cannot perform heavy lifting with foot weakness)
  - Follow-up 2 weeks: pain improved 40 percent, leg pain still present but less severe, foot strength unchanged 3/5 dorsiflexion, gabapentin increased to 600 mg TID (better pain control)
  - 4-week follow-up: pain improved 60 percent, tolerating light activity, foot strength improving to 4/5 dorsiflexion, still cannot walk on heels fully but better
  - Referred to physiatry for epidural steroid injection consideration (persistent symptoms 4 weeks)
  - Transforaminal epidural steroid injection right L5: fluoroscopy-guided, 2 mL dexamethasone 10 mg with 1 mL lidocaine at right L4-L5 foramen targeting L5 nerve root
  - 1 week post-injection: significant improvement, leg pain 80 percent improved, numbness resolving, foot strength 4+/5
  - Physical therapy started 5 weeks: core strengthening, lumbar stabilization exercises, body mechanics training, education on proper lifting
  - 8-week follow-up: leg pain resolved, minimal back pain only, foot strength 5/5 (full recovery), sensation normal, straight leg raise negative (no pain)
  - 12-week follow-up: complete resolution of symptoms, returned to work with restrictions (avoid heavy lifting over 50 lbs for 3 months), continuing home exercise program
  - Patient counseled: 5-15 percent recurrence risk, proper body mechanics essential, core strengthening, maintain healthy weight, avoid heavy lifting if possible
  - 6-month follow-up: doing well, no recurrent symptoms, back to full duty work, exercises 3 times per week, no limitations
