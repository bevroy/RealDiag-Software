tree_id: CARD-ANGINA-CAD
name: Coronary Artery Disease with Angina
family: Cardiovascular
specialty: Cardiology
chief_complaint: Chest pain
description: Atherosclerotic narrowing of coronary arteries causing myocardial ischemia manifesting as angina pectoris (chest discomfort with exertion)

icd10: I25.10

urgency: urgent

workup:
  - Clinical presentation typical angina: substernal chest pressure/tightness/heaviness, provoked by exertion or emotional stress, relieved by rest or nitroglycerin within 5 minutes, may radiate to left arm/jaw/back, associated dyspnea/diaphoresis
  - Atypical presentations: epigastric discomfort, dyspnea equivalent (exertional dyspnea without chest pain), especially in women/elderly/diabetics
  - Risk factors: age, male sex, smoking, hypertension, diabetes, dyslipidemia, family history premature CAD (first-degree relative male less than 55 or female less than 65)
  - Canadian Cardiovascular Society (CCS) angina classification: Class I (angina with strenuous exertion only), Class II (slight limitation, angina with walking 2 blocks or more), Class III (marked limitation, angina with walking 1-2 blocks), Class IV (inability to perform any activity without angina or angina at rest)
  - Physical exam: often normal, may have S4 gallop, vascular disease signs (carotid bruits, diminished pulses)
  - ECG at rest: often normal between episodes, may show ST depressions or T wave inversions (chronic ischemia), Q waves (prior MI)
  - Stress testing for diagnosis: exercise ECG (treadmill) first-line if able to exercise and normal baseline ECG (positive if ST depressions 1 mm or more, angina, hypotension, arrhythmia), stress imaging (nuclear SPECT, stress echo) if unable to exercise or baseline ECG abnormalities (LBBB, LVH), pharmacologic stress (adenosine, regadenoson, dobutamine) if cannot exercise
  - Coronary CT angiography (CCTA): noninvasive visualizes coronary anatomy, high negative predictive value (rules out CAD if normal), useful for low-intermediate pretest probability
  - Invasive coronary angiography: gold standard, indicated if high-risk features, recurrent symptoms despite medical therapy, positive stress test, or planning revascularization
  - Laboratory: lipid panel (LDL goal less than 70 mg/dL or 50 percent reduction), HbA1c (diabetes), troponin if concern for ACS

treatment:
  - Acute angina episode: stop activity, sit down, sublingual nitroglycerin 0.4 mg every 5 minutes x 3 doses, if no relief after 3 doses call 911 (concern for MI)
  - Antianginal medications: beta-blockers first-line (metoprolol 25-200 mg BID, atenolol 25-100 mg daily, carvedilol 6.25-25 mg BID) - reduce heart rate and myocardial oxygen demand, target resting HR 55-60 bpm
  - Calcium channel blockers alternative or add-on: nondihydropyridines (diltiazem 120-360 mg daily, verapamil 120-480 mg daily) if beta-blocker intolerant, dihydropyridines (amlodipine 5-10 mg daily) can add to beta-blocker
  - Long-acting nitrates (isosorbide mononitrate 30-120 mg daily, isosorbide dinitrate 10-40 mg TID) for chronic angina, nitrate-free interval 10-12 hours overnight to prevent tolerance
  - Ranolazine 500-1000 mg BID add-on antianginal if persistent symptoms despite beta-blocker plus CCB
  - Sublingual nitroglycerin 0.4 mg PRN for acute angina episodes (take before activities likely to provoke angina)
  - Antiplatelet therapy: aspirin 81 mg daily (reduces MI/death), clopidogrel 75 mg daily if aspirin intolerant
  - High-intensity statin: atorvastatin 40-80 mg daily or rosuvastatin 20-40 mg daily, goal LDL less than 70 mg/dL (less than 55 if very high risk)
  - ACE inhibitor if diabetes, hypertension, LV dysfunction, or prior MI: lisinopril 10-40 mg daily, enalapril 10-20 mg BID
  - Risk factor modification: smoking cessation (most important), BP control (less than 130/80), glucose control (HbA1c less than 7 percent), weight loss if obese, regular exercise
  - Revascularization (PCI or CABG): indications include refractory angina despite medical therapy, high-risk anatomy (left main disease, 3-vessel disease, proximal LAD stenosis), ACS
  - Percutaneous coronary intervention (PCI): angioplasty plus stent for 1-2 vessel disease, dual antiplatelet therapy (aspirin plus clopidogrel/ticagrelor/prasugrel) x 12 months after drug-eluting stent
  - Coronary artery bypass grafting (CABG): preferred for left main disease, 3-vessel disease, diabetes with multivessel disease (FREEDOM trial), LV dysfunction with multivessel disease

clinical_pearls:
  - Typical angina: substernal chest pressure with exertion, relieved by rest or nitroglycerin
  - Stress testing for diagnosis (exercise ECG if able, imaging if unable or abnormal baseline ECG)
  - Beta-blockers first-line antianginal (reduce heart rate and oxygen demand)
  - All patients need aspirin plus high-intensity statin (atorvastatin 80 mg or rosuvastatin 40 mg)
  - PCI for 1-2 vessel disease, CABG for left main/3-vessel disease/diabetes with multivessel
  - Smoking cessation most important risk factor modification

differentials:
  - Acute coronary syndrome (unstable angina, NSTEMI, STEMI) - angina at rest, prolonged greater than 20 minutes, positive troponin, ECG changes, requires urgent cath
  - Aortic stenosis (exertional chest pain, syncope, heart failure, systolic murmur, low and slow pulse, echo shows stenosis)
  - GERD (heartburn, regurgitation, no relation to exertion, relieved by antacids)
  - Costochondritis (chest wall tenderness, reproducible with palpation, not related to exertion)

trace:
  - 58-year-old man presents with 3 months exertional chest pressure, substernal, occurs with climbing stairs or walking uphill, resolves with rest after 5 minutes, no chest pain at rest
  - Risk factors: hypertension, hyperlipidemia, 30 pack-year smoking history (quit 5 years ago), father had MI at age 62
  - Exam: BP 142/86, HR 78, BMI 29, normal cardiac exam, no murmurs/gallops
  - ECG: normal sinus rhythm, no acute changes
  - Labs: lipid panel total cholesterol 210, LDL 145, HDL 38, triglycerides 180, glucose 98, HbA1c 5.6 percent
  - 10-year ASCVD risk: 22 percent (high risk)
  - Exercise stress test: achieved 85 percent max predicted heart rate, 2 mm ST depressions in leads V4-V6 at peak exercise, chest pressure reproduced, recovered with rest (positive test, high probability CAD)
  - Diagnosis: stable angina pectoris CCS Class II, likely obstructive CAD
  - Referred for coronary angiography: 80 percent stenosis proximal LAD, 70 percent stenosis mid RCA, normal LCx
  - Decision for PCI given 2-vessel disease
  - Underwent PCI with drug-eluting stents to LAD and RCA (successful)
  - Started aspirin 81 mg daily plus ticagrelor 90 mg BID (DAPT x 12 months), atorvastatin 80 mg nightly, metoprolol succinate 50 mg daily, lisinopril 10 mg daily
  - Sublingual nitroglycerin 0.4 mg PRN angina
  - Cardiac rehabilitation referred
  - 1 month: no angina since PCI, tolerating medications well, attending cardiac rehab
  - 3 months: remains angina-free, excellent exercise tolerance, lipids improved (LDL 68 mg/dL on atorvastatin 80 mg)
  - 12 months: remains symptom-free, stopped ticagrelor (completed DAPT), continues aspirin 81 mg daily lifelong, atorvastatin 80 mg, metoprolol, lisinopril
  - Annual follow-up: remains asymptomatic, exercising regularly, BP 122/76, LDL 62 mg/dL, excellent outcome
