tree_id: ENDO-HYPOGLYCEMIA
name: Hypoglycemia
family: Endocrinology
specialty: Endocrinology
icd10:
- E16.0
- E16.1
- E16.2
snomed: []
urgency: medium
description: Comprehensive evaluation and management of Hypoglycemia
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Tremor and shakiness
- Palpitations and tachycardia
- Sweating (diaphoresis)
- Hunger and nausea
- Anxiety and nervousness
- Confusion and difficulty concentrating
- Slurred speech
- Blurred or double vision
- Weakness and fatigue
- Headache and dizziness
- In severe cases: Seizures, loss of consciousness, coma
- Symptoms occur when glucose <70 mg/dL (or <54 mg/dL for severe)
workup:
- Point-of-care glucose <70 mg/dL (confirm with serum glucose if able)
- 'If non-diabetic recurrent hypoglycemia: 72-hour fast with glucose, insulin, C-peptide,
  proinsulin'
- Insulin autoantibodies if suspected autoimmune hypoglycemia
- Morning cortisol if adrenal insufficiency suspected
treatment:
- 'Guideline-based treatment options for Hypoglycemia include:'
- 'Conscious patient: 15g fast-acting carbs (4 oz juice, 3-4 glucose tablets, 1 tbsp
  honey), recheck in 15 min (ADA 2024)'
- 'Unconscious/unable to swallow: D50W 25g (50 mL of 50% dextrose) IV push, repeat
  if no response (ADA 2024)'
- Glucagon 1mg IM/SQ if no IV access (teaches family members for home use) (ADA 2024)
- 'After recovery: Feed complex carbs + protein to prevent rebound hypoglycemia (ADA
  2024)'
- 'If sulfonylurea-induced: Admit for D10W infusion + frequent glucose monitoring
  (can recur 12-24hrs) (ADA 2024)'
clinical_pearls:
- 'Whipple''s triad: Symptoms consistent with hypoglycemia + documented low glucose
  (<70 mg/dL) + relief with treatment'
- 'In diabetics: Usually iatrogenic (insulin, sulfonylureas) - rule of 15: 15g carbs,
  recheck in 15 min'
- 'Non-diabetic hypoglycemia: Insulinoma, post-gastric bypass (dumping), adrenal insufficiency,
  liver failure'
- 'Hypoglycemia unawareness: Recurrent lows blunt autonomic symptoms - dangerous for
  diabetics'
- Sulfonylureas (glyburide, glipizide) cause prolonged hypoglycemia - admit for observation
referrals:
- Endocrinology for non-diabetic hypoglycemia or recurrent unexplained episodes
- Admission if sulfonylurea overdose, persistent hypoglycemia, or unable to maintain
  oral intake
differentials: []
