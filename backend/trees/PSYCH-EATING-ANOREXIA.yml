presentations:
- Restricted food intake
- Significantly low body weight
- Intense fear of weight gain
- Distorted body image
- Amenorrhea
- Excessive exercise
workup: []
treatment:
  - 'Multidisciplinary team - physician, therapist, dietitian, psychiatrist essential'
  - 'Nutritional rehabilitation - gradual refeeding, goal 2-3 lbs/week weight gain, monitor refeeding syndrome'
  - 'Refeeding syndrome prevention - monitor phosphate, potassium, magnesium closely during first week, replace aggressively'
  - 'Start refeeding at 30-40 kcal/kg/day, advance slowly to avoid refeeding syndrome'
  - 'Family-based therapy (FBT/Maudsley method) - first-line for adolescents, parents take charge of refeeding'
  - 'Cognitive behavioral therapy (CBT-E) enhanced for eating disorders - effective in adults'
  - 'Hospitalization indications: HR <40, BP <90/60, temp <96°F, severe electrolyte abnormalities, acute food refusal, suicidality'
  - 'No medications cure anorexia, but SSRIs may help prevent relapse after weight restoration'
  - 'Olanzapine 2.5-10mg qHS may help with anxiety around eating and weight gain (off-label)'
  - 'Address bone health - calcium 1200-1500mg daily, vitamin D 1000-2000 IU daily, consider DEXA scan'
  - 'Cardiac monitoring - ECG for QTc prolongation, bradycardia common'
  - 'Restore menses - usually returns when BMI >18.5 and body fat 17-22%, may take 6-12 months'
  - 'Treat comorbid depression, anxiety, OCD common'
  - 'Long-term follow-up critical - high relapse rate, chronic course in 20%'
