tree_id: URO-PHIMOSIS
name: Phimosis (Inability to Retract Foreskin)
family: urology
specialty: Urology/Pediatrics
icd10: N47.1
snomed: 449826002
urgency: []
homeopathy: []
presentations:
  - Inability to retract foreskin over glans penis
  - Physiologic phimosis (normal in infants and young children, resolves spontaneously by age 6-7 in 90%)
  - Pathologic phimosis (due to scarring from infection, inflammation, or forced retraction)
  - Ballooning of foreskin during urination
  - Difficulty urinating, weak urinary stream
  - Recurrent balanitis (inflammation of glans)
  - Recurrent urinary tract infections
  - Pain with erections (adults)
  - Sexual dysfunction (painful intercourse)
  - Paraphimosis (foreskin stuck behind glans - EMERGENCY, not covered here)
workup:
  - History
  - Age of patient (physiologic vs pathologic)
  - Previous episodes of balanitis or balanoposthitis
  - Forceful retraction attempts (can cause scarring and pathologic phimosis)
  - Urinary symptoms (difficulty, weak stream, UTIs)
  - Sexual function (if adult)
  - Personal or family history of lichen sclerosus (BXO)
  - Physical examination
  - Inspect foreskin
  - Physiologic: normal pliable foreskin, simply not retractable yet
  - Pathologic: tight scarred ring, white fibrous tissue (lichen sclerosus), cracking or bleeding with retraction attempts
  - Assess degree of phimosis
  - Grade 0: full retraction
  - Grade 1: full retraction but tight behind glans
  - Grade 2: partial glans exposure
  - Grade 3: partial meatus exposure
  - Grade 4: no retraction, tip scarring, may balloon with urination
  - Look for signs of lichen sclerosus (balanitis xerotica obliterans)
  - White plaques or scarring on foreskin or glans
  - Urinalysis if recurrent UTIs
  - No routine laboratory tests needed for diagnosis
treatment:
  - Management based on type and severity
  - Physiologic phimosis (normal in children)
  - Reassurance, observation, and education
  - Spontaneous resolution in 90% by age 6-7 years, 99% by age 16-17 years
  - Do NOT forcefully retract foreskin (causes scarring and pathologic phimosis)
  - Gentle retraction during bathing as tolerated without force
  - Topical corticosteroids if older child and still symptomatic
  - Betamethasone 0.05% cream twice daily for 4-8 weeks
  - Apply to tight foreskin ring, gentle retraction as tolerated
  - Effective in 70-90% of cases
  - Pathologic phimosis
  - Topical corticosteroids trial (betamethasone 0.05% cream for 4-8 weeks)
  - Less effective than physiologic (50-60% success) due to scarring
  - Circumcision (definitive treatment)
  - Indicated if
  - Recurrent balanitis or balanoposthitis
  - Recurrent UTIs
  - Urinary obstruction symptoms
  - Failed topical steroid trial
  - Lichen sclerosus (steroid-resistant condition)
  - Adult with sexual dysfunction
  - Complications: bleeding, infection, meatal stenosis (1-10%)
  - Alternative: dorsal slit (preserves foreskin but creates opening)
  - Lichen sclerosus (balanitis xerotica obliterans)
  - High-potency topical corticosteroids (clobetasol 0.05% cream twice daily for 8-12 weeks)
  - Circumcision often required as lichen sclerosus is steroid-resistant
  - May progress to urethral stenosis (requires urethroplasty)
  - Paraphimosis prevention education
  - Always return foreskin to normal position after retraction (examination, catheterization, intercourse)
clinical_pearls:
  - "Physiologic phimosis is NORMAL in infants and young children - do not forcefully retract"
  - "Forced retraction of physiologic phimosis causes scarring and pathologic phimosis"
  - "Only 4% of boys have retractable foreskin at birth, 50% by age 1, 90% by age 6-7"
  - "Pathologic phimosis characterized by white scarred ring - often due to lichen sclerosus (BXO)"
  - "Topical corticosteroids highly effective for physiologic phimosis (70-90%), less so for pathologic (50-60%)"
  - "Lichen sclerosus (BXO) is steroid-resistant and progresses - circumcision is definitive treatment"
  - "Paraphimosis is EMERGENCY: foreskin retracted and stuck behind glans causing venous congestion"
  - "Circumcision in US: 60-70%, varies by region and cultural factors"
  - "Ballooning during urination is normal finding with phimosis, not indication for intervention if no symptoms"
referrals:
  - Urology if pathologic phimosis with failed steroid trial, recurrent infections, or urinary symptoms
  - Urology if lichen sclerosus suspected (requires circumcision)
  - Urology URGENT if paraphimosis (foreskin stuck behind glans - EMERGENCY)
  - Pediatric urology for children with persistent symptomatic phimosis after age 6-7
differentials:
  - Physiologic phimosis (normal in children under 6-7, pliable foreskin, no scarring)
  - Pathologic phimosis (scarring, white ring, lichen sclerosus)
  - Paraphimosis (foreskin retracted and stuck behind glans, painful swelling - EMERGENCY)
  - Balanitis (glans inflammation, erythema, discharge)
  - Balanoposthitis (combined inflammation of glans and foreskin)
  - Lichen sclerosus (balanitis xerotica obliterans - white plaques, scarring, steroid-resistant)
  - Congenital adhesions (normal adherence of foreskin to glans in infants, resolves spontaneously)
