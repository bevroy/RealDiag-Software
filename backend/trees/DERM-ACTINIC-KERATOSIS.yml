tree_id: DERM-ACTINIC-KERATOSIS
name: Actinic Keratosis
family: Dermatology
specialty: Dermatology/Primary Care
chief_complaint: Rough, scaly patches on sun-exposed skin
description: Precancerous lesions caused by chronic UV exposure. Appear as rough, scaly papules or plaques on sun-damaged skin. Small risk of progression to squamous cell carcinoma (0.1-10% per year). Treatment prevents malignant transformation and improves cosmesis.
icd10: L57.0
snomed: 201101007
presentations:
  - Rough, scaly papules or plaques
  - Erythematous or skin-colored
  - "Sandpaper" texture
  - Located on sun-exposed areas (face, scalp, arms, hands)
  - "Feel better than they look" - more easily felt than seen
  - Often multiple lesions (field cancerization)
urgency: routine
referrals:
  emergency:
    - None typically
  urgent:
    - Rapidly growing or changing lesion (rule out SCC)
    - Thick, indurated, or ulcerated AK (suspicious for transformation)
  routine:
    - Biopsy confirmation if uncertain
    - Multiple lesions requiring field treatment

workup:
  - Clinical diagnosis based on appearance, texture, and location
  - Clinical features
  - Appearance
  - Small (2-10 mm), flat or slightly raised papules or plaques
  - Erythematous, pink, skin-colored, or brown
  - Adherent scale - rough, sandpaper-like, difficult to remove
  - Hyperkeratotic (thick scale) in some cases
  - May be tender or sensitive
  - Surrounding skin shows signs of photodamage (solar elastosis, hyperpigmentation, telangiectasias)
  - Texture - rough, scaly, "better felt than seen"
  - Key diagnostic feature - run fingers over skin to feel rough texture
  - Distribution - sun-exposed areas
  - Face (forehead, cheeks, nose, temples)
  - Scalp (bald areas in men)
  - Ears (helices)
  - Dorsal hands and forearms
  - Chest (V of chest in men)
  - Lower legs (women)
  - Lips (actinic cheilitis)
  - Number - typically multiple, "field cancerization" from chronic sun damage
  - Physical examination
  - Inspect sun-exposed areas - face, scalp, ears, neck, arms, hands, legs
  - Palpate - rough, gritty texture
  - Look for signs of photodamage - wrinkles, lentigines, telangiectasias, mottled pigmentation
  - Examine for concerning features suggesting transformation to SCC
  - Thick (greater than 1 cm) or indurated
  - Rapid growth
  - Ulceration or bleeding
  - Tenderness out of proportion to size
  - Cutaneous horn (hyperkeratotic projection)
  - Check for other skin cancers - AK patients at increased risk of BCC, SCC, melanoma
  - Clinical variants
  - Hypertrophic AK - thick, hyperkeratotic, may mimic SCC
  - Pigmented AK - brown or black, may mimic melanoma or seborrheic keratosis
  - Actinic cheilitis - lips, rough scaly lips, loss of vermillion border, erosions, risk of SCC
  - Cutaneous horn - conical hyperkeratotic projection, AK at base in 60% of cases
  - Biopsy indications
  - Atypical features - thick, indurated, rapid growth, ulceration, bleeding
  - Diagnostic uncertainty
  - No response to treatment
  - Biopsy shows dysplasia confined to epidermis (carcinoma in situ if full-thickness dysplasia)
  - Histopathology - atypical keratinocytes, parakeratosis, solar elastosis
  - Risk of progression to SCC
  - Overall low - 0.1-10% per lesion per year (studies vary)
  - Cumulative risk higher with multiple lesions and longer follow-up
  - Immunosuppressed patients higher risk - organ transplant recipients (250-fold increased SCC risk)
  - Controversial whether AK is pre-cancer or early cancer (dysplasia confined to epidermis vs very early SCC)
treatment:
  - Treatment goals - prevent progression to SCC, improve cosmesis
  - Lesion-directed therapies - for few isolated lesions
  - Cryotherapy (liquid nitrogen) - most common, first-line
  - Freeze lesion 5-10 seconds (freeze-thaw cycle)
  - Causes necrosis, blister formation, lesion sloughs off
  - Repeat at 2-4 weeks if not resolved
  - Cure rate 75-95% depending on technique
  - May cause hypopigmentation (permanent), scarring
  - Well-tolerated, quick office procedure
  - Curettage and electrodesiccation
  - Scrape off lesion, cauterize base
  - For thick, hyperkeratotic AKs
  - Provides tissue for histology
  - Small scar
  - Surgical excision
  - For thick, indurated lesions concerning for SCC
  - Provides tissue for diagnosis
  - Field-directed therapies - for multiple lesions or field cancerization
  - 5-Fluorouracil (5-FU) cream
  - 5% cream applied once or twice daily x 2-4 weeks (face) or 4-8 weeks (hands/arms)
  - Topical chemotherapy, destroys dysplastic keratinocytes
  - Causes significant inflammation, erythema, erosions (expected - indicates treatment working)
  - Warn patient about appearance during treatment
  - Cure rate 50-85%
  - Inexpensive, treats large areas
  - Imiquimod 5% cream (Aldara)
  - Apply 2-3 times per week x 12-16 weeks
  - Topical immunomodulator, stimulates immune response against dysplastic cells
  - Causes inflammatory reaction (erythema, scaling, crusting)
  - Cure rate 50-80%
  - Well-tolerated, less intense reaction than 5-FU
  - Expensive
  - Ingenol mebutate gel (Picato) - REMOVED from market in 2020 due to skin cancer risk
  - Previously used, no longer available
  - Diclofenac 3% gel (Solaraze)
  - Apply twice daily x 60-90 days
  - Topical NSAID, inhibits dysplastic keratinocyte proliferation
  - Milder inflammation than 5-FU or imiquimod
  - Lower cure rate (50-70%), longer treatment duration
  - Well-tolerated
  - Photodynamic therapy (PDT)
  - Apply photosensitizing agent (aminolevulinic acid or methyl aminolevulinate) to lesions, activate with blue or red light after incubation period
  - Selectively destroys dysplastic cells
  - Office-based procedure
  - Cure rate 70-90%
  - Causes burning sensation during treatment, post-treatment erythema and peeling
  - Expensive, requires special equipment
  - Excellent cosmetic outcome
  - Chemical peels (trichloroacetic acid, glycolic acid)
  - For multiple facial AKs
  - Destroys superficial skin layers
  - Improves photodamage and cosmesis
  - Requires trained provider
  - Laser resurfacing (ablative lasers - CO2, erbium:YAG)
  - For multiple facial AKs with photodamage
  - Ablates epidermis and superficial dermis
  - Excellent cosmetic improvement
  - Expensive, requires downtime
  - Combination therapy - may be more effective than monotherapy
  - Cryotherapy followed by field therapy (5-FU or imiquimod)
  - Sequential approach - treat visible lesions with cryo, then field therapy for subclinical lesions
  - Surveillance and prevention
  - Regular skin examination - self-exam monthly, physician full-body skin exam annually or semi-annually
  - Sun protection - critical to prevent new AKs and skin cancers
  - Sunscreen SPF 30+ broad-spectrum daily, even cloudy days
  - Protective clothing, wide-brimmed hat
  - Avoid peak sun hours (10 AM - 4 PM)
  - Avoid tanning beds
  - Nicotinamide (vitamin B3) - oral chemoprevention
  - 500 mg twice daily reduces new AK formation by 13-20% in high-risk patients
  - Well-tolerated, safe
  - Consider in patients with multiple AKs or history of skin cancers
clinical_pearls:
  - Precancerous lesions - risk of transformation to SCC 0.1-10% per lesion per year
  - "Field cancerization" - multiple AKs indicate diffuse sun damage with subclinical dysplasia
  - "Better felt than seen" - rough sandpaper texture key diagnostic feature
  - Cryotherapy first-line for few isolated lesions - quick, effective, well-tolerated
  - Field therapy (5-FU, imiquimod) for multiple lesions or face with extensive photodamage
  - 5-FU causes intense inflammation (erythema, erosions) - warn patients, appearance worse before better
  - Concerning features for SCC - thick, indurated, rapid growth, ulceration, tenderness
  - Actinic cheilitis (lips) higher risk of progression to SCC - treat aggressively
  - Immunosuppressed patients (organ transplant) 250-fold increased SCC risk - aggressive treatment and surveillance
  - Sun protection critical to prevent new AKs - patients with AKs have 10-fold increased risk of skin cancer
  - Nicotinamide 500 mg twice daily reduces new AK formation in high-risk patients
  - Untreated AKs may spontaneously regress (15-30%), but new ones develop
  - Seborrheic keratoses may mimic AKs - but waxy, "stuck on" appearance, no sandpaper texture
differentials:
  - Squamous cell carcinoma in situ (Bowen disease) - larger, well-demarcated scaly plaque, full-thickness dysplasia on biopsy
  - Invasive squamous cell carcinoma - indurated, ulcerated, rapid growth, larger
  - Seborrheic keratosis - waxy, "stuck on," smooth not rough, not on sun-damaged skin
  - Basal cell carcinoma (superficial type) - pink scaly plaque, pearly border, no sandpaper texture
  - Psoriasis - silvery scale, well-demarcated plaques, extensor surfaces and scalp, not limited to sun-exposed areas
  - Eczema/dermatitis - pruritic, ill-defined, not rough texture, responds to topical steroids
  - Keratosis pilaris - small rough bumps on upper arms and thighs, not sun-exposed areas, in younger patients
trace:
  - 68-year-old fair-skinned man (Fitzpatrick I) with history of extensive sun exposure (worked outdoors as landscaper for 40 years) presents for routine skin check
  - Wife noticed rough spots on his forehead and scalp (balding)
  - No symptoms, not painful or itchy
  - History of basal cell carcinoma excised from nose 2 years ago
  - Past medical history - hypertension, hyperlipidemia
  - Medications - lisinopril, atorvastatin, aspirin
  - Social history - retired landscaper, extensive lifetime sun exposure, never used sunscreen until recently
  - Physical examination
  - Multiple (8-10) erythematous and skin-colored rough, scaly papules 3-8 mm on forehead, temples, and bald scalp
  - Rough sandpaper texture on palpation
  - Extensive photodamage - solar elastosis, lentigines, telangiectasias on face
  - One larger (12 mm) hyperkeratotic plaque on right temple, thicker and more indurated than others
  - No other suspicious lesions on full-body skin exam
  - Diagnosis - Multiple actinic keratoses on face and scalp, with one suspicious hyperkeratotic AK on right temple (concerning for SCC)
  - Treatment plan
  - Shave biopsy of 12 mm lesion on right temple (rule out SCC)
  - Cryotherapy to remaining AKs on forehead and scalp - liquid nitrogen 8-10 seconds per lesion
  - Biopsy result - actinic keratosis with moderate dysplasia, no invasion (not SCC)
  - Given multiple AKs and field cancerization, recommended field therapy
  - Prescribed imiquimod 5% cream - apply to entire face and scalp 3 times per week (Monday, Wednesday, Friday) at bedtime x 16 weeks
  - Extensive counseling on expected inflammatory reaction - erythema, scaling, crusting indicates treatment working, will look worse before better, continue treatment unless severe pain or ulceration
  - Sun protection counseling - SPF 50+ sunscreen daily to face and scalp, reapply every 2 hours outdoors, wear wide-brimmed hat, avoid sun 10 AM-4 PM
  - Started nicotinamide 500 mg twice daily for chemoprevention (given history of BCC and multiple AKs)
  - Full-body skin exam every 6 months given high risk
  - At 6 weeks on imiquimod - moderate erythema, scaling on face and scalp, tolerating treatment, continues therapy
  - At 16 weeks - completed imiquimod course, post-inflammatory erythema resolving
  - At 4 months post-treatment - significant improvement, only 2 palpable AKs on scalp (vs 8-10 initially)
  - Cryotherapy to 2 residual AKs
  - Continues nicotinamide daily and sun protection
  - At 1 year - no new AKs, skin improved, continues surveillance every 6 months

citations:
  - AAD (American Academy of Dermatology) Guidelines for Actinic Keratosis
  - NCCN (National Comprehensive Cancer Network) Guidelines for Keratinocyte Carcinomas
  - UpToDate - Dermatology
