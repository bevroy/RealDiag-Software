tree_id: ORTHO-ANTERIOR-CRUCIATE-LIGAMENT-TEAR
name: Anterior Cruciate Ligament Tear
family: Orthopedics
specialty: Orthopedics
chief_complaint: Knee injury with pop and immediate swelling
description: |
  Most commonly injured knee ligament, particularly in athletes. Mechanism typically non-contact pivot/deceleration or direct blow.
  ACL prevents anterior translation and rotational instability of tibia. Torn ACL increases risk of meniscal injury and early osteoarthritis.
icd10: S83.511A
snomed: 444121005
presentations:
  - Acute knee pain after twisting injury
  - Audible "pop" at time of injury
  - Immediate swelling (hemarthrosis)
  - Knee instability, giving way
  - Difficulty weight-bearing
  - Positive Lachman, anterior drawer tests
urgency: Moderate
referrals:
  emergency:
    - Open fracture
    - Compartment syndrome
    - Neurovascular injury
  urgent:
    - Closed fracture
    - Joint dislocation
    - Septic arthritis
  routine:
    - Chronic joint pain
    - Osteoarthritis
    - Sports injury

workup:
  - History - sudden deceleration, pivot, or hyperextension with audible pop, immediate swelling (hemarthrosis within hours), difficulty weight-bearing
  - Physical exam - large knee effusion, positive Lachman test (most sensitive, 85%), positive anterior drawer test, positive pivot shift test (most specific but difficult with acute injury)
  - Lachman test - knee at 20-30 degrees flexion, pull tibia anteriorly while stabilizing femur, excessive anterior translation (soft endpoint) positive
  - Anterior drawer test - knee at 90 degrees flexion, foot stabilized, pull tibia forward
  - Pivot shift test - combines valgus stress and internal rotation while extending knee, positive if tibia subluxes then reduces
  - MRI gold standard - 95% sensitive and specific, shows ACL discontinuity or increased signal, assess for associated injuries (meniscal tears 50%, MCL injury 30%, bone contusion)
  - Plain X-rays - rule out fractures (Segond fracture pathognomonic for ACL tear, tibial eminence avulsion in children)
  - Arthrocentesis if tense effusion causing severe pain - aspirate hemarthrosis (fat droplets confirm intra-articular fracture)
treatment:
  - Acute management (first 2 weeks) - RICE (rest, ice, compression, elevation), NSAIDs, crutches for ambulation, brace if needed for comfort
  - Early physical therapy - restore range of motion (reduce swelling, prevent stiffness), quadriceps strengthening
  - Surgical vs non-operative decision - depends on age, activity level, associated injuries, knee stability
  - Surgical ACL reconstruction preferred for young active patients, athletes, those wanting to return to pivoting sports, associated repairable meniscal tear
  - Bone-patellar tendon-bone autograft (strongest, risk of anterior knee pain) or hamstring autograft (less donor site morbidity)
  - Allograft option for older patients or revision surgery
  - Timing of surgery - typically 2-6 weeks after injury (allows swelling to resolve, ROM to improve, reduces arthrofibrosis risk)
  - Arthroscopic ACL reconstruction - drill femoral and tibial tunnels, pass graft, fix with interference screws or suspensory fixation
  - Postoperative rehabilitation 6-9 months - early ROM and weight-bearing, progressive strengthening, proprioception training, return to sport clearance based on strength testing and functional assessment
  - Non-operative management for low-demand patients, older patients, partial tears - physical therapy focus on quadriceps strengthening and neuromuscular training
  - Functional brace may provide stability for activities
  - Counsel on increased risk of meniscal tears and osteoarthritis with chronic ACL deficiency
clinical_pearls:
  - Unhappy triad (O'Donoghue triad) - ACL, MCL, medial meniscus injury from valgus and external rotation force
  - Female athletes 4-6x higher risk than males (hormonal, anatomic, neuromuscular factors)
  - Bone bruises on MRI (lateral femoral condyle and posterior lateral tibial plateau) classic for ACL injury mechanism
  - Return to sport without reconstruction in ACL-deficient knee risks recurrent instability episodes and secondary meniscal/cartilage damage
  - Partial ACL tears controversial - may attempt non-operative if functional stability maintained
  - Pediatric ACL tears increasingly common, delay in treatment risks growth plate injury and meniscal damage
differentials:
  - Meniscal tear
  - MCL sprain
  - PCL tear
  - Patellar dislocation
  - Tibial plateau fracture
  - Knee contusion
trace:
  - 22-year-old soccer player with acute left knee injury during game, heard pop with sudden deceleration and cutting → Immediate swelling, unable to continue playing → ER visit, large effusion, Lachman test positive (2+ anterior translation) → X-rays negative for fracture → MRI shows complete ACL tear, lateral meniscus tear, bone contusion → Orthopedic referral → Patient desires return to competitive soccer → Plan for ACL reconstruction with hamstring autograft plus lateral meniscus repair → Prehabilitation physical therapy x 3 weeks to improve ROM and strength → Successful arthroscopic ACL reconstruction and meniscus repair → Postop protocol - immediate ROM exercises, weight-bearing as tolerated in brace, progressive strengthening → At 6 months, 90% strength symmetry, passes functional tests → Gradual return to sport training → Full return to soccer at 9 months with no instability

citations:
  - AAOS (American Academy of Orthopaedic Surgeons) Clinical Practice Guidelines
  - BOA (British Orthopaedic Association) Standards
  - UpToDate - Orthopedic Surgery
