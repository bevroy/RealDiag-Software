tree_id: ORTHO-ANTERIOR-CRUCIATE-LIGAMENT-TEAR
name: Anterior Cruciate Ligament Tear
family: Orthopedics
specialty: Orthopedics
chief_complaint: Acute knee pain and swelling after twisting injury, giving way sensation
description: Complete or partial tear of the anterior cruciate ligament (ACL) in the knee, most commonly from non-contact pivoting or deceleration injury, leads to knee instability and increased risk of meniscal injury and early arthritis
icd10: S83.511A
urgency: urgent
workup:
  - Anatomy and function
  - ACL - One of four major knee ligaments (ACL, PCL, MCL, LCL)
  - Origin - Posteromedial aspect of lateral femoral condyle
  - Insertion - Anteromedial aspect of tibial plateau (anterior to tibial eminence)
  - Function - Prevents anterior translation of tibia relative to femur, controls rotational stability
  - Two bundles - Anteromedial (taut in flexion), posterolateral (taut in extension)
  - Blood supply - Middle genicular artery (poor healing capacity, most tears require surgery)
  - Injury mechanism - Most ACL tears are non-contact (70%)
  - Non-contact - Deceleration with sudden direction change, pivoting on planted foot, landing from jump with knee in valgus position
  - Classic scenarios - Basketball player cutting to basket, soccer player changing direction, skier falling forward
  - Contact - Direct blow to lateral knee (causes valgus force, often associated MCL tear - "unhappy triad")
  - Epidemiology
  - 200,000 ACL tears per year in US
  - Peak incidence ages 15-45 years (active sports participation)
  - Female athletes 2-8x higher risk than males (neuromuscular control, hormonal factors, anatomic differences - narrow femoral notch, wider pelvis)
  - High-risk sports - Basketball, soccer, football, skiing, gymnastics
  - Associated injuries
  - Meniscal tears - 50-70% (lateral meniscus acutely, medial meniscus chronically)
  - MCL tear - 30% (especially with contact valgus injury)
  - 'Unhappy triad (O''Donoghue triad) - ACL + MCL + medial meniscus tear (from lateral blow causing valgus force)'
  - Bone bruise - 80% (lateral femoral condyle and posterolateral tibial plateau from pivot shift mechanism)
  - PCL, LCL tears - Less common
  - Clinical presentation
  - History
  - Mechanism - Non-contact pivoting, deceleration, landing awkwardly
  - Popping sensation - Audible or palpable "pop" at time of injury (70% report this)
  - Immediate swelling - Hemarthrosis (blood in joint) within 2-4 hours (70-80% of acute hemarthrosis is ACL tear)
  - Inability to continue activity - Unable to return to play (vs MCL sprain may be able to continue)
  - Giving way - Sense of knee instability, buckling (especially on stairs, pivoting)
  - Physical examination - Acute vs chronic
  - Acute (within 48 hours) - Difficult to examine due to pain, swelling, guarding
  - Effusion - Large hemarthrosis (tense, fluctuant swelling)
  - Range of motion - Limited by pain and swelling
  - Lachman test - Most sensitive test for ACL integrity (85-95% sensitivity)
  - Patient supine, knee flexed 20-30 degrees, stabilize femur with one hand, pull tibia anteriorly with other hand
  - Positive if increased anterior translation (>3mm compared to uninjured side) and soft or absent endpoint
  - Easier to perform than anterior drawer in acute setting
  - Anterior drawer test - 55% sensitivity (less reliable than Lachman)
  - Patient supine, knee flexed 90 degrees, hip flexed 45 degrees, foot flat on table (sit on foot to stabilize), pull tibia anteriorly
  - Positive if increased anterior translation
  - False negative if hamstring spasm (protects against anterior translation)
  - Pivot shift test - Most specific (98%) but least sensitive (24%)
  - Patient supine, knee extended, apply valgus force and internal rotation while flexing knee
  - Positive if sudden reduction (shift) of tibia at 20-40 degrees flexion (subluxation then reduction)
  - Difficult in acute setting (requires relaxation), best performed under anesthesia
  - MCL, LCL testing - Valgus and varus stress at 0 and 30 degrees (assess for associated ligament injuries)
  - Meniscal testing - McMurray test, joint line tenderness (assess for associated meniscal tear)
  - Imaging
  - Radiographs (knee AP, lateral, sunrise, tunnel views) - Rule out fracture
  - Usually normal or show effusion (lipohemarthrosis suggests intra-articular fracture)
  - Segond fracture - Avulsion fracture of lateral tibial plateau (pathognomonic for ACL tear, seen in 10%)
  - Second fracture - Avulsion of tibial eminence (ACL insertion site, more common in children)
  - MRI - GOLD STANDARD for diagnosis and assessment of associated injuries
  - Sensitivity 95%, specificity 95%
  - Findings
  - Primary signs - Discontinuity or increased signal within ACL fibers, ACL not parallel to Blumensaat line (intercondylar roof), empty notch sign
  - Secondary signs - Anterior translation of tibia, bone bruise (lateral femoral condyle, posterolateral tibia), hemarthrosis, associated meniscal or ligament tears
  - Timing - Can perform acutely, but sometimes delayed 1-2 weeks to allow swelling to decrease (improves comfort during scan)
  - Arthroscopy - Gold standard for diagnosis if MRI equivocal, but rarely needed (MRI usually sufficient)
treatment:
  - Acute management (initial 48-72 hours)
  - RICE protocol - Rest, Ice (15-20 minutes every 2-3 hours), Compression (elastic wrap), Elevation
  - NSAIDs - Ibuprofen 600-800 mg TID, naproxen 500 mg BID (pain, inflammation)
  - Crutches - Avoid weight bearing if too painful, wean as tolerated
  - Aspiration - If tense hemarthrosis (relieves pain, improves range of motion)
  - Immobilization - Brief immobilization (1-2 days) for comfort, then early mobilization
  - Avoid prolonged immobilization (leads to stiffness, muscle atrophy)
  - Treatment decision - Operative vs non-operative (individualized)
  - Factors to consider - Age, activity level, associated injuries, patient goals
  - Surgical reconstruction - ACL reconstruction (ACLR)
  - Indications
  - Young, active patients (especially athletes) who wish to return to pivoting sports
  - Associated repairable meniscal tear (preserve meniscus, prevent arthritis)
  - Multi-ligament injury (ACL + PCL, ACL + MCL + meniscus)
  - Recurrent instability despite conservative management
  - Technique - Arthroscopic ACL reconstruction (autograft or allograft)
  - Autograft options
  - Bone-patellar tendon-bone (BPTB) - Gold standard, strong fixation, higher donor site morbidity (anterior knee pain, kneeling discomfort)
  - Hamstring tendon (semitendinosus, gracilis) - Lower donor site morbidity, slightly higher re-tear rate
  - Quadriceps tendon - Good option for revision or large patients
  - Allograft (cadaver tissue) - Avoid donor site morbidity, higher re-tear rate (especially in young), risk of disease transmission (very low), longer incorporation time
  - Timing - Early (within 3 weeks) vs delayed
  - Early reconstruction if repairable meniscal tear (preserve meniscus)
  - Delayed reconstruction (6-8 weeks) more common - allows swelling to resolve, restore range of motion, reduce risk of arthrofibrosis
  - Immediate surgery (within days) NOT recommended (increased stiffness risk)
  - Outcomes - 80-90% return to sport, 10-20% re-tear rate (higher in young athletes <25, females, return to high-risk sport)
  - Complications - Infection (<1%), stiffness, graft failure, anterior knee pain (BPTB graft), donor site morbidity
  - Non-operative management - Activity modification, rehabilitation
  - Indications
  - Older, sedentary patients (low demand)
  - Partial tears with minimal instability
  - Children with open growth plates (delay reconstruction until near skeletal maturity to avoid growth disturbance)
  - Medical contraindications to surgery
  - Patients who accept lifestyle modification (avoid pivoting sports)
  - Rehabilitation
  - Strengthen quadriceps, hamstrings (dynamic stabilizers of knee)
  - Proprioceptive training (balance exercises)
  - Activity modification - Avoid pivoting, cutting sports (swimming, cycling OK)
  - Functional brace - May provide subjective stability, but does not prevent re-injury
  - Outcomes - 50% develop instability with return to pivoting sports, increased risk meniscal tear and early arthritis (within 10-15 years)
  - Post-operative rehabilitation (critical for success)
  - Phase 1 (0-6 weeks) - Protect graft, regain range of motion, reduce swelling
  - Full weight bearing as tolerated with brace initially
  - Passive and active-assisted range of motion (goal full extension, 120 degrees flexion by 6 weeks)
  - Quadriceps activation exercises (quad sets, straight leg raises)
  - Phase 2 (6-12 weeks) - Restore normal gait, strengthen muscles
  - Progressive resistance exercises (leg press, hamstring curls)
  - Proprioceptive training (balance board)
  - Stationary bike, swimming
  - Phase 3 (3-6 months) - Return to sport-specific activities
  - Running progression (straight line, then curves)
  - Agility drills, plyometrics
  - Sport-specific training
  - Phase 4 (6-12 months) - Return to full competition
  - Criteria for return to sport - No pain or swelling, full range of motion, >90% strength compared to uninjured leg, functional tests (single leg hop, crossover hop, 6-meter timed hop), psychological readiness
  - Typical timeline - 6-9 months for return to sport, 12-18 months for full graft maturation
  - Long-term considerations
  - Meniscal tear - Higher risk if ACL-deficient (chronic instability leads to meniscal damage)
  - Meniscectomy increases arthritis risk (lose shock absorber)
  - Post-traumatic osteoarthritis - 50-90% develop radiographic OA within 10-15 years (regardless of surgery)
  - ACL reconstruction may reduce OA risk slightly by restoring stability and preserving meniscus, but does not eliminate risk
  - Risk factors for OA - Meniscal injury/meniscectomy, cartilage damage at time of injury, delayed reconstruction, return to high-impact sports
clinical_pearls:
  - Popping sensation with immediate swelling (hemarthrosis) after non-contact pivot injury is ACL tear until proven otherwise
  - Lachman test is most sensitive physical exam maneuver (perform at 20-30 degrees flexion)
  - MRI has 95% sensitivity and specificity for ACL tear, also evaluates for meniscal and other ligament injuries
  - Surgical reconstruction indicated for young active patients, repairable meniscal tear, or recurrent instability
  - Hamstring or patellar tendon autograft preferred for young athletes (lower re-tear than allograft)
  - Return to sport typically 6-9 months post-op (need >90% strength, functional testing)
  - Post-traumatic osteoarthritis develops in 50-90% within 10-15 years regardless of treatment
differentials:
  - ORTHO-MENISCAL-TEAR
  - ORTHO-MEDIAL-COLLATERAL-LIGAMENT-TEAR
  - ORTHO-POSTERIOR-CRUCIATE-LIGAMENT-TEAR
