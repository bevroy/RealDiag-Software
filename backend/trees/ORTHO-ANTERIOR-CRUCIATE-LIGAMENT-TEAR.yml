trace:
  - Non-contact pivoting injury with popping sensation and immediate swelling
  - Lachman test shows increased anterior translation with soft endpoint
  - MRI confirms ACL tear and evaluates for meniscal/ligament injuries
  - Surgical reconstruction for young active patients (autograft preferred)
  - Rehabilitation 6-9 months for return to sport (>90% strength required)
