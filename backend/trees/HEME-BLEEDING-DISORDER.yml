tree_id: HEME-BLEEDING-DISORDER
name: Bleeding Disorder (Encounter)
family: hematology
specialty: Hematology, Primary Care
chief_complaint: Easy bruising, prolonged bleeding
description: |
  Bleeding disorders result from abnormalities in platelets, coagulation factors, or blood vessels.
  Can be inherited (hemophilia, von Willebrand disease) or acquired (medications, liver disease, DIC).
  Requires systematic evaluation to identify specific defect.
icd10: D69.9
snomed: "64779008"
presentations:
  - Easy bruising or excessive bruising
  - Prolonged bleeding from minor cuts
  - Spontaneous nosebleeds (epistaxis)
  - Heavy menstrual bleeding (menorrhagia)
  - Bleeding gums
  - Blood in urine (hematuria) or stool (GI bleeding)
  - Petechiae or purpura
  - Joint bleeds or muscle hematomas (hemophilia)
  - Family history of bleeding
urgency: High
referrals:
  emergency:
    - Active severe bleeding
    - Signs of intracranial hemorrhage
  hematology:
    - Suspected inherited bleeding disorder
    - Abnormal coagulation studies without clear cause
    - Recurrent bleeding episodes
workup:
  - CBC with platelet count - check for thrombocytopenia
  - PT/INR - assess extrinsic pathway (factors II, V, VII, X)
  - aPTT - assess intrinsic pathway (factors VIII, IX, XI, XII)
  - Fibrinogen level
  - Peripheral blood smear - platelet morphology and number
  - von Willebrand panel - vWF antigen, activity, factor VIII (most common inherited disorder)
  - Specific factor assays if aPTT or PT prolonged
  - Liver function tests - liver disease impairs coagulation factor synthesis
  - Medication review - anticoagulants, antiplatelet agents, NSAIDs
treatment:
  depends_on_disorder:
    thrombocytopenia:
      - Treat underlying cause
      - Platelet transfusion if severe bleeding or <10,000
    von_willebrand_disease:
      - Desmopressin (DDAVP) for type 1 - increases vWF release
      - vWF/factor VIII concentrate for severe bleeding
      - Avoid aspirin and NSAIDs
    hemophilia_a:
      - Factor VIII replacement
      - Desmopressin for mild hemophilia A
    hemophilia_b:
      - Factor IX replacement
    medication_induced:
      - Discontinue offending agent
      - Reversal agents if needed (vitamin K for warfarin, protamine for heparin)
    liver_disease:
      - Vitamin K supplementation
      - FFP or PCC for active bleeding
clinical_pearls:
  - von Willebrand disease most common inherited bleeding disorder (1% of population)
  - Hemophilia A (factor VIII deficiency) more common than hemophilia B (factor IX)
  - Isolated prolonged aPTT suggests hemophilia or vWD
  - Isolated prolonged PT suggests factor VII deficiency or early liver disease
  - Both PT and aPTT prolonged - liver disease, DIC, warfarin, severe deficiencies
  - Normal PT/aPTT does not rule out bleeding disorder (platelet dysfunction, mild vWD)
  - Heavy menstrual bleeding may be first presentation in women
differentials:
  - von Willebrand disease
  - Hemophilia A or B
  - Thrombocytopenia (ITP, drug-induced)
  - Platelet function disorders
  - Medication effect (anticoagulants, antiplatelets)
  - Liver disease
  - Vitamin K deficiency
  - Disseminated intravascular coagulation (DIC)
  - Scurvy (vitamin C deficiency)
trace:
  - 16-year-old female with lifelong easy bruising and heavy periods. CBC normal, platelet 200,000. PT/INR normal, aPTT mildly prolonged. vWF antigen 35% (low). Diagnose von Willebrand disease type 1. Prescribe desmopressin nasal spray for bleeding episodes. Counsel to avoid aspirin and NSAIDs.
citations:
  - American Society of Hematology Guidelines
  - UpToDate - Hematology
