tree_id: ENDO-ADRENAL-INSUFFICIENCY
name: Adrenal Insufficiency
family: Endocrine-Metabolic
specialty: Endocrinology
chief_complaint: Fatigue and weakness
description: Inadequate production of cortisol and/or aldosterone from adrenal glands, causing weakness, fatigue, hypotension, and electrolyte abnormalities

icd10: E27.40

urgency: urgent

workup:
  - Clinical presentation primary adrenal insufficiency (Addison disease): chronic fatigue, weakness, weight loss, anorexia, nausea, abdominal pain, salt craving, orthostatic hypotension, hyperpigmentation (ACTH-mediated, palmar creases, buccal mucosa, nipples, scars)
  - Clinical presentation secondary adrenal insufficiency (pituitary/hypothalamic): similar but NO hyperpigmentation (ACTH low), NO hyperkalemia or salt craving (aldosterone preserved), often other pituitary hormone deficiencies
  - Precipitants of adrenal crisis: infection, surgery, trauma, abrupt steroid withdrawal in chronic steroid user, bilateral adrenal hemorrhage
  - Adrenal crisis presentation: severe hypotension/shock, fever, abdominal pain, nausea/vomiting, confusion, hyponatremia, hyperkalemia (primary only), hypoglycemia
  - Laboratory: hyponatremia (low cortisol causes impaired free water excretion), hyperkalemia (primary only, aldosterone deficiency), hypoglycemia, eosinophilia, mild anemia
  - Morning cortisol less than 3 mcg/dL suggests adrenal insufficiency, greater than 18 mcg/dL rules out, 3-18 mcg/dL indeterminate requires ACTH stimulation test
  - ACTH stimulation test (cosyntropin stimulation): give cosyntropin 250 mcg IV or IM, measure cortisol at 0 and 30-60 minutes, normal response cortisol peak greater than 18-20 mcg/dL, inadequate response confirms adrenal insufficiency
  - Plasma ACTH distinguishes primary (ACTH elevated greater than 2 times upper limit normal) from secondary (ACTH low or inappropriately normal)
  - Etiology primary: autoimmune adrenalitis (80 percent, may have other autoimmune diseases), TB adrenalitis (developing countries), bilateral adrenal hemorrhage (sepsis, anticoagulation), metastases, medications (ketoconazole, etomidate)
  - Etiology secondary: exogenous glucocorticoids (most common, chronic prednisone suppresses HPA axis), pituitary adenoma/surgery/radiation, Sheehan syndrome (postpartum pituitary necrosis)
  - CT adrenals if primary: atrophic (autoimmune), enlarged (TB, metastases, hemorrhage)

treatment:
  - Adrenal crisis (life-threatening): emergent treatment do NOT wait for test results, hydrocortisone 100 mg IV bolus immediately then 50-100 mg IV every 6-8 hours (or continuous infusion 200 mg over 24 hours), aggressive IV fluid resuscitation (normal saline 1-2 liters rapidly), dextrose if hypoglycemic, identify and treat precipitant (infection, etc)
  - Draw baseline cortisol and ACTH before first hydrocortisone dose if possible but do NOT delay treatment
  - Chronic primary adrenal insufficiency replacement: glucocorticoid (hydrocortisone 15-25 mg daily in divided doses, typically 10-15 mg upon waking, 5 mg afternoon to mimic circadian rhythm) plus mineralocorticoid (fludrocortisone 0.05-0.2 mg daily), adjust fludrocortisone dose based on BP, potassium, renin
  - Chronic secondary adrenal insufficiency: hydrocortisone alone (NO fludrocortisone needed, aldosterone production preserved)
  - Stress dose steroids: double or triple dose for minor illness (fever, URI), major stress (surgery, severe illness) requires IV hydrocortisone 100 mg every 8 hours, teach patients to increase dose during illness
  - Medical alert bracelet/card: all patients should wear identifying adrenal insufficiency and need for stress-dose steroids
  - Monitor adequacy: clinical (energy level, BP, weight), labs (sodium, potassium normal), avoid overreplacement (Cushing features, osteoporosis)
  - Screen for other autoimmune diseases if primary autoimmune: thyroid (hypothyroidism), diabetes (type 1), celiac, pernicious anemia

clinical_pearls:
  - Primary adrenal insufficiency has hyperpigmentation (high ACTH), hyperkalemia, salt craving
  - Secondary adrenal insufficiency NO hyperpigmentation (low ACTH), NO hyperkalemia
  - Adrenal crisis life-threatening: hypotension, hyponatremia, hyperkalemia (primary), treat immediately with IV hydrocortisone 100 mg plus aggressive fluids
  - Most common cause secondary is chronic exogenous steroids (HPA axis suppression)
  - ACTH stimulation test diagnostic (cortisol fails to rise adequately after cosyntropin)
  - Replacement mimics physiology: hydrocortisone 15-25 mg divided (higher AM dose) plus fludrocortisone (primary only)
  - Stress dose steroids critical during illness/surgery to prevent crisis

differentials:
  - Chronic fatigue syndrome (fatigue but normal cortisol, no hypotension, no hyperpigmentation)
  - Depression (fatigue, anorexia, but normal labs and cortisol)
  - Hypothyroidism (fatigue, weight gain, but TSH elevated, no hyperpigmentation)
  - Anorexia nervosa (weight loss, hyponatremia, but normal cortisol)

trace:
  - 42-year-old woman presents with 6 months progressive fatigue, weakness, 15-pound weight loss despite normal appetite, anorexia, nausea, salt craving (eats pickles daily), lightheadedness with standing
  - History: noticed darkening of skin especially palms and old scars
  - Exam: BP 90/58 supine, 78/52 standing (orthostatic hypotension), HR 102, hyperpigmentation palmar creases and buccal mucosa, thin, no Cushing features
  - Labs: sodium 128 mEq/L (hyponatremia), potassium 5.8 mEq/L (hyperkalemia), glucose 62 mg/dL (hypoglycemia), morning cortisol 2.1 mcg/dL (very low), plasma ACTH 485 pg/mL (markedly elevated, normal 10-60)
  - Diagnosis: primary adrenal insufficiency suspected (low cortisol, high ACTH, hyperpigmentation, hyperkalemia)
  - ACTH stimulation test: baseline cortisol 2.4 mcg/dL, 60 minutes post-cosyntropin cortisol 3.8 mcg/dL (inadequate response, confirms adrenal insufficiency)
  - CT adrenals: small atrophic adrenals bilaterally (consistent with autoimmune adrenalitis)
  - Diagnosis confirmed: primary adrenal insufficiency (Addison disease), likely autoimmune
  - Started hydrocortisone 15 mg upon waking, 5 mg at 4 PM (total 20 mg daily), fludrocortisone 0.1 mg daily
  - Education: stress dose steroids (double dose for minor illness, go to ER for severe illness/vomiting for IV steroids), medical alert bracelet obtained
  - 2 weeks: dramatic improvement, energy markedly better, salt craving resolved, BP 110/68, sodium 136 mEq/L, potassium 4.2 mEq/L (normalized)
  - 3 months: feeling well, hyperpigmentation fading, weight gain 8 pounds, continues replacement therapy
  - Screened for other autoimmune: TSH 8.5 mIU/L (subclinical hypothyroidism), TPO antibodies positive, anti-tissue transglutaminase negative (no celiac), blood glucose normal
  - Started levothyroxine 50 mcg daily for autoimmune hypothyroidism (polyglandular autoimmune syndrome type 2)
  - Annual follow-up: stable on replacement therapy, carries emergency hydrocortisone injection kit, wears medical alert bracelet, no adrenal crises
