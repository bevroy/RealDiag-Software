tree_id: PULM-PLEURISY
name: Pleurisy (Pleuritic Chest Pain)
family: pulmonology
specialty: Pulmonology
icd10: R07.1
snomed: 3723001
urgency: moderate
homeopathy: []
presentations:
  - Sharp, stabbing chest pain
  - Pain worsens with deep breathing, coughing, or movement
  - Pain improves with shallow breathing or splinting
  - May radiate to shoulder (diaphragmatic irritation)
  - Decreased chest wall movement on affected side (splinting)
  - Pleural friction rub on auscultation (pathognomonic but uncommon)
  - Associated symptoms depend on etiology - fever, dyspnea, cough
  - Tachypnea and shallow breathing
  - May have history of recent viral illness, trauma, or pulmonary embolism risk factors
workup:
  - Detailed history - onset, quality, radiation, associated symptoms, risk factors
  - Physical examination - respiratory rate, breath sounds, pleural rub, cardiac exam
  - Chest X-ray (first-line imaging)
  - Assess for pneumonia, pneumothorax, pleural effusion, rib fractures, masses
  - Normal CXR in many cases of viral pleuritis
  - Electrocardiogram - rule out acute coronary syndrome, pericarditis
  - Pulse oximetry and arterial blood gas if hypoxemic
  - D-dimer if intermediate probability for pulmonary embolism (Wells score)
  - CT chest with PE protocol if pulmonary embolism suspected
  - Ultrasound chest if pleural effusion present (characterize size, guide thoracentesis)
  - Thoracentesis if significant pleural effusion
  - Light's criteria to differentiate exudate from transudate
  - Send fluid for cell count, chemistry, Gram stain, culture, cytology
  - Additional testing based on suspected etiology
  - Rheumatologic workup (ANA, RF, complement) if connective tissue disease suspected
  - Tuberculin skin test or interferon-gamma release assay if TB risk
  - Troponin if concern for myocardial infarction
treatment:
  - Treat underlying cause
  - Viral pleuritis - self-limited, supportive care
  - Bacterial pneumonia - appropriate antibiotics
  - Pulmonary embolism - anticoagulation
  - Pneumothorax - observation vs chest tube
  - Malignant effusion - drainage, pleurodesis, oncology referral
  - Symptomatic pain management
  - NSAIDs (first-line) - ibuprofen 400-800mg TID or naproxen 500mg BID
  - Acetaminophen alternative if NSAIDs contraindicated
  - Opioids (codeine, tramadol) for severe pain, short duration
  - Avoid NSAIDs if bleeding risk or renal insufficiency
  - Incentive spirometry to prevent atelectasis (pain limits deep breathing)
  - Splinting pillow against chest wall may provide comfort
  - Cough suppression with dextromethorphan or codeine
  - Breathing exercises once acute pain improves
  - Most viral pleuritis resolves in 1-2 weeks
  - Follow-up imaging if symptoms persist >4 weeks or worsen
clinical_pearls:
  - Pleurisy is symptom (pleuritic chest pain), not diagnosis - always seek underlying cause
  - Most common causes - viral infection, bacterial pneumonia, pulmonary embolism
  - Pleural friction rub - leathery, creaking sound during inspiration and expiration
  - Disappears with pleural effusion (fluid separates pleural surfaces)
  - Diaphragmatic pleura irritation causes referred pain to ipsilateral shoulder
  - Red flags - hypoxemia, hemodynamic instability, severe dyspnea, hemoptysis
  - Viral pleuritis (epidemic pleurodynia, Bornholm disease) - Coxsackie B virus
  - Autoimmune pleuritis - lupus most common (can be first manifestation)
  - Post-cardiac injury syndrome (Dressler syndrome) - pleuritis 2-10 weeks after MI or cardiac surgery
  - Familial Mediterranean fever - recurrent pleuritis with fever in Mediterranean populations
referrals:
  - Pulmonology for recurrent pleuritis, complicated effusion, or unclear etiology
  - Cardiology if pericarditis or post-MI syndrome
  - Rheumatology if autoimmune/connective tissue disease suspected
  - Thoracic surgery for empyema requiring decortication or recurrent malignant effusions
  - Oncology if malignant effusion
differentials:
  - Viral pleuritis (most common, self-limited)
  - Bacterial pneumonia with pleural involvement
  - Pulmonary embolism (sudden onset, risk factors)
  - Pneumothorax (decreased breath sounds, hyperresonance)
  - Rib fracture or costochondritis (tender to palpation)
  - Pericarditis (pain better leaning forward, diffuse ST elevation)
  - Acute coronary syndrome (cardiac risk factors, troponin elevation)
  - Pleural effusion (dullness to percussion)
  - Lung cancer (chronic, weight loss, smoking history)
  - Autoimmune pleuritis (lupus, rheumatoid arthritis)
  - Tuberculous pleuritis (endemic areas, chronic)
  - Mesothelioma (asbestos exposure)
