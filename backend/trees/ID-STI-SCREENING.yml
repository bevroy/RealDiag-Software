presentations:
  - Routine screening in asymptomatic patient
  - New sexual partner
  - Multiple sexual partners
  - Partner with known or suspected STI
  - Recent unprotected sexual encounter
  - Pregnancy planning or prenatal care
  - Men who have sex with men (MSM)
  - Sex work or transactional sex
  - History of prior STI
  - Adolescent or young adult seeking screening
differentials:
  - Symptomatic STI requiring treatment rather than screening alone
  - Sexual assault (requires forensic exam and prophylaxis protocols)
  - Post-exposure prophylaxis needs (HIV, hepatitis B)
workup:
  - Chlamydia and gonorrhea NAAT (all sexually active individuals per guidelines)
  - 'Women <25 years: annual screening for chlamydia and gonorrhea'
  - 'MSM: screen at least annually for chlamydia, gonorrhea, syphilis, HIV'
  - 'MSM high-risk: screen every 3-6 months'
  - HIV testing - 4th generation Ag/Ab test or HIV RNA if acute infection suspected
  - Syphilis screening - RPR or VDRL (nontreponemal) then confirmatory treponemal test
  - Hepatitis B serology (HBsAg, anti-HBs, anti-HBc) if not vaccinated
  - Hepatitis C antibody (anti-HCV) - one-time screening for all adults 18-79
  - Trichomonas NAAT in women with symptoms or high risk
  - HSV type-specific serology only if patient/partner has genital ulcers
  - Pregnancy test in women of reproductive age
  - 'Site-specific testing: pharyngeal, rectal, urogenital based on exposure sites'
treatment:
  - Counseling about safer sex practices
  - Consistent condom use with all partners
  - Limiting number of sexual partners
  - Pre-exposure prophylaxis (PrEP) for HIV if high risk
  - HPV vaccination if age 9-26 (shared decision-making 27-45)
  - Hepatitis B vaccination if non-immune (3-dose series)
  - Hepatitis A vaccination for MSM and high-risk individuals
  - Partner notification and testing
  - Routine rescreening at 3 months if positive test
  - Annual or more frequent screening based on risk
  - STI prevention education and resources
  - Treatment initiated based on positive results
  - Expedited partner therapy (EPT) for chlamydia and gonorrhea where legal
  - Contraception counseling and provision
  - Substance use screening and counseling (associated with STI risk)
clinical_pearls:
  - Most STIs are asymptomatic - screening is essential for detection and prevention
  - Annual chlamydia screening recommended for all sexually active women <25
  - MSM have higher STI rates - need more frequent screening at all exposure sites
  - Screen all pregnant women for HIV, syphilis, hepatitis B, chlamydia at first visit
  - Rescreening at 3 months after treatment due to high reinfection rates (20%)
  - HIV PrEP (Truvada, Descovy) highly effective - requires quarterly STI screening
  - HPV vaccine prevents genital warts and cervical/anal/oropharyngeal cancers
  - Routine HSV-2 screening not recommended - many false positives, limited intervention
  - 'Window periods: HIV 18-45 days (4th gen), syphilis 3-6 weeks, HCV 8-11 weeks'
  - 'Expedited partner therapy (EPT): providing prescriptions for partners without exam'
red_flags: []
disposition_guidance: {}
referrals:
  - Infectious Disease for HIV pre-exposure prophylaxis (PrEP) management
  - OB/GYN for abnormal Pap smear or HPV-related conditions
  - Public Health for partner notification services and free STI testing
  - Family planning clinic for contraception and reproductive health services
