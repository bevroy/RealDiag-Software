tree_id: CARDS-PACS
name: Premature Atrial Contractions (PACs)
family: Cardiology
specialty: Cardiology
chief_complaint: Palpitations with occasional skipped beats
description: Ectopic atrial beats arising from atria causing early P waves with narrow or wide QRS (if aberrant conduction). Usually benign. Frequent PACs may precede atrial fibrillation. Beta blockers for symptoms, observation if asymptomatic.
icd10: I49.1
snomed: 251198005
presentations:
  - Palpitations: irregular extra beats
  - Skipped beats sensation
  - Often asymptomatic
  - Anxiety, caffeine, or stress triggered
  - Usually benign
urgency: non-urgent

workup:
  - Symptoms: usually benign
  - Palpitations: brief sensation of irregular heartbeat or skipped beat
  - Chest discomfort: rarely
  - Often asymptomatic: discovered incidentally on ECG
  - ECG findings:
  - Premature P wave: occurs earlier than expected sinus P
  - Abnormal P wave morphology: different from sinus P wave (different atrial origin)
  - QRS usually narrow: under 120 ms if conducted normally
  - Aberrantly conducted PACs: wide QRS if right bundle still refractory (mimics PVC)
  - Non-compensatory pause: pause after PAC is less than compensatory (unlike PVC)
  - P wave resets SA node, next P wave comes earlier than expected
  - Blocked PACs: P wave not followed by QRS if AV node still refractory (mimics sinus pause)
  - Visible P wave on T wave of preceding beat
  - Patterns:
  - Bigeminy: every other beat is PAC
  - Trigeminy: every third beat is PAC
  - Frequency:
  - Rare: few per hour
  - Frequent: hundreds to thousands per day
  - Very frequent: may precede atrial fibrillation
  - Holter monitor:
  - Quantify PAC burden
  - Assess for paroxysmal atrial fibrillation (frequent PACs often precede AFib)
  - Causes:
  - Idiopathic: most common, benign
  - Stimulants: caffeine, alcohol, nicotine, cocaine
  - Structural heart disease: atrial enlargement from any cause
  - Valvular disease: mitral stenosis or regurgitation
  - Heart failure: atrial stretch
  - Hyperthyroidism: check TSH
  - Pulmonary disease: COPD, pulmonary hypertension
  - Medications: sympathomimetics
  - Electrolyte abnormalities: hypokalemia, hypomagnesemia
  - Often no underlying disease

treatment:
  - No treatment needed if:
  - Asymptomatic
  - Structurally normal heart
  - No associated atrial arrhythmias
  - Reassurance: PACs are benign
  - Lifestyle modifications:
  - Reduce caffeine, alcohol, nicotine
  - Manage stress
  - Adequate sleep
  - Beta blockers (if symptomatic):
  - Metoprolol 25-50 mg BID or atenolol 50 mg daily
  - Suppress PACs and reduce symptoms
  - Well tolerated
  - Calcium channel blockers: diltiazem or verapamil (alternative)
  - Antiarrhythmic medications: rarely needed
  - Flecainide or propafenone (if frequent and refractory, no structural heart disease)
  - Monitor for atrial fibrillation:
  - Very frequent PACs (over 1000 per day) may predict AFib development
  - Holter monitoring if concern
  - Treat underlying causes:
  - Hyperthyroidism: treat thyroid disorder
  - Valvular disease: treat valve lesion
  - Heart failure: optimize therapy
  - Electrolytes: correct abnormalities

clinical_pearls:
  - Premature abnormal P wave followed by narrow QRS (or wide if aberrant)
  - Non-compensatory pause (distinguishes from PVC with compensatory pause)
  - Aberrantly conducted PACs mimic PVCs (wide QRS) but have preceding P wave
  - Blocked PACs mimic sinus pause (P wave on T wave, no QRS)
  - Usually benign, no treatment needed if asymptomatic
  - Very frequent PACs may precede atrial fibrillation
  - Beta blockers effective for symptomatic PACs

differentials:
  - PVCs: wide QRS with compensatory pause, no preceding P wave
  - Sinus arrhythmia: gradual variation in rate with respiration, normal P waves
  - Artifact: irregular baseline mimics ectopy
  - Junctional premature beats: no P wave or retrograde P wave

trace: |
  A 45-year-old woman presented with palpitations x3 months. Frequent sensation of irregular heartbeat and skipped beats, worse with stress and after coffee. No chest pain, no dyspnea, no syncope. High caffeine intake (6 cups coffee daily), stressed job. Exam: BP 125/80, HR 75 with occasional irregular beats (PACs), no murmurs. ECG: normal sinus rhythm with frequent PACs, premature abnormal P waves with different morphology than sinus P (ectopic atrial origin), narrow QRS complexes following PACs (normal conduction), non-compensatory pauses after PACs. One PAC with wide QRS (aberrantly conducted PAC - right bundle still refractory when PAC conducted, mimics PVC but has preceding P wave). Diagnosed with frequent PACs (benign). Reassured patient that PACs are benign and not dangerous. Advised lifestyle modifications: reduce caffeine to 1-2 cups daily, stress management techniques, adequate sleep. No medications initially given benign nature. At 2 weeks: reduced caffeine significantly, palpitations improved 60%. Still occasionally symptomatic. Started low-dose metoprolol 25 mg BID (beta blocker to suppress PACs and reduce symptoms). At 4 weeks: palpitations reduced 80%, tolerating metoprolol well. Continues beta blocker. At 6 months: minimal palpitations, continues metoprolol 25 mg daily (reduced to once daily), maintains low caffeine intake. PACs well-controlled with lifestyle modification and low-dose beta blocker.
