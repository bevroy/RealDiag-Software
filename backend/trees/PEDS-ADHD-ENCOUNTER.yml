tree_id: PEDS-ADHD-ENCOUNTER
name: ADHD Follow-Up and Management (Encounter)
family: pediatrics
specialty: Pediatrics/Developmental-Behavioral Pediatrics/Psychiatry
icd10: F90.2
snomed: 406506008
urgency:
  - Suicidal ideation or self-harm behaviors
  - Severe aggression or harm to others
  - Acute medication adverse effects (cardiovascular symptoms, severe mood changes)
  - Psychotic symptoms
  - Substance abuse concerns
homeopathy: []
presentations:
  - Follow-up visit for established ADHD diagnosis
  - Medication management and monitoring
  - Assessment of treatment response and side effects
  - School or behavioral concerns despite treatment
  - Request for medication adjustment or change
  - Routine monitoring of growth and vital signs on stimulant medication
  - Behavioral therapy coordination and assessment
  - School performance and academic concerns
  - Parent reporting inadequate symptom control
  - New comorbid symptoms (anxiety, depression, tics)
  - Transition of care (new provider, college transition)
  - Annual comprehensive ADHD reassessment
workup:
  - Interval history since last visit
  - Medication adherence and effectiveness
  - Current medication name, dose, frequency, timing
  - Medication taken as prescribed (assess adherence)
  - Duration of medication effect (wearing off early)
  - Timing of doses (before school, after school, weekends)
  - Missed doses or medication holidays (weekends, summers)
  - Parent and child satisfaction with current medication
  - ADHD symptom control assessment
  - Inattention symptoms (school work, homework, task completion)
  - Hyperactivity symptoms (restlessness, fidgeting, excessive talking)
  - Impulsivity symptoms (interrupting, acting without thinking, risk-taking behaviors)
  - Functional impairment (school performance, peer relationships, family relationships)
  - Academic performance (grades, test scores, teacher reports, homework completion)
  - School behavior (disciplinary actions, peer conflicts)
  - Home behavior (compliance with requests, chores, family relationships)
  - Standardized rating scales (obtain from parent AND teacher)
  - Vanderbilt ADHD Follow-Up Rating Scales (parent and teacher)
  - Assess current symptom severity and response to treatment
  - Re-administer every 3-6 months or with medication changes
  - Medication side effects
  - Appetite and weight loss (most common)
  - Difficulty falling asleep or staying asleep
  - Irritability, mood changes, emotional lability
  - Headaches or stomachaches
  - Tics (motor or vocal - new onset or worsening)
  - Cardiovascular symptoms (chest pain, palpitations, syncope)
  - Growth deceleration
  - Personality changes ("zombie-like" effect)
  - Rebound hyperactivity as medication wears off
  - Other medications and supplements
  - New medications started since last visit
  - Interactions with ADHD medications
  - Comorbid conditions assessment
  - Anxiety symptoms (worry, panic, avoidance)
  - Depression symptoms (sadness, anhedonia, hopelessness, suicidal ideation)
  - Oppositional defiant disorder (ODD) symptoms
  - Conduct problems or aggression
  - Sleep disorders (difficulty falling asleep, night wakings, daytime sleepiness)
  - Tics or Tourette syndrome
  - Learning disabilities (academic struggles despite treatment)
  - Substance use (especially adolescents - screen annually)
  - Behavioral interventions
  - Parent behavior training (participation, effectiveness)
  - School interventions (IEP, 504 plan, accommodations)
  - Organizational skills training
  - Counseling or therapy (CBT, social skills training)
  - Social history
  - Changes in family structure or stressors
  - School changes or transitions
  - Peer relationships and social functioning
  - Activities and hobbies
  - Adverse events since last visit
  - Review of systems
  - Cardiovascular (chest pain, palpitations, syncope, exercise intolerance)
  - Neurologic (headaches, tics, tremors, seizures)
  - Psychiatric (mood, anxiety, sleep, suicidal ideation)
  - GI (appetite, abdominal pain, nausea)
  - Family history update
  - New diagnoses in family members (cardiovascular, psychiatric)
  - Physical examination
  - Growth parameters (CRITICAL for medication monitoring)
  - Height, weight, BMI - plot on growth charts
  - Assess growth velocity (compare to previous visits)
  - Growth deceleration concerning (may need medication adjustment or holiday)
  - Vital signs (CRITICAL for stimulant monitoring)
  - Blood pressure and heart rate
  - Compare to baseline and previous visits
  - Persistent elevation may warrant medication change or cardiology referral
  - General appearance and behavior
  - Observe attention, activity level, impulsivity during visit
  - Mood and affect
  - Cardiovascular examination
  - Heart rate and rhythm, murmurs
  - Perfusion, pulses
  - Neurologic examination
  - Assess for tics (motor or vocal)
  - Tremor, abnormal movements
  - Mental status examination (adolescents)
  - Mood, affect, thought content, suicidal ideation
  - Treatment response assessment
  - Compare current symptoms to baseline (before treatment)
  - Assess degree of improvement
  - Vanderbilt Parent and Teacher Follow-Up scales (quantify improvement)
  - Clinical Global Impression (CGI) - Improvement scale
  - Goal: significant reduction in symptoms and improved functioning
  - Medication optimization
  - Adequate trial: appropriate dose, duration, adherence
  - Partial response: consider dose increase, different formulation, or medication change
  - No response: consider different medication class (methylphenidate versus amphetamine, or non-stimulant)
  - Side effects limiting treatment: dose reduction, different formulation, medication change
treatment:
  - Medication management strategies
  - If good response with tolerable side effects: continue current regimen
  - If partial response (inadequate symptom control)
  - Increase dose (titrate to optimal dose, not maximum dose)
  - Methylphenidate: titrate by 5-10 mg increments weekly
  - Amphetamine: titrate by 5 mg increments weekly
  - Switch to longer-acting formulation (if short duration of effect)
  - Consider adding second medication (e.g., stimulant + guanfacine)
  - If no response after adequate trial (appropriate dose, 4-6 weeks)
  - Switch medication class (methylphenidate to amphetamine or vice versa)
  - 70-80% respond to first medication, 90% respond to either class
  - Consider non-stimulant (atomoxetine, guanfacine, clonidine)
  - Reassess diagnosis (is it truly ADHD, or comorbidity masquerading)
  - Managing side effects
  - Decreased appetite and weight loss
  - Give medication after meals (take stimulant after breakfast and lunch)
  - Encourage high-calorie snacks in evening when medication wears off
  - Ensure adequate breakfast before morning dose
  - Add calorie-dense foods (nut butter, smoothies, cheese)
  - Consider medication holiday on weekends or summers (if academically safe)
  - If severe: reduce dose or switch medication
  - Insomnia (difficulty falling asleep)
  - Ensure medication timing (avoid late-day dosing)
  - Switch to shorter-acting formulation
  - Add melatonin 1-6 mg at bedtime (evidence-based for ADHD-related insomnia)
  - Sleep hygiene: consistent bedtime, limit screens, cool dark room
  - If persistent: consider non-stimulant medication
  - Irritability or mood changes
  - Assess timing (during peak or as medication wears off)
  - Rebound irritability: overlap doses, add afternoon dose, or consider non-stimulant
  - If during peak effect: reduce dose or switch medication
  - Screen for comorbid anxiety or depression
  - Tics (new onset or worsening)
  - Stimulants do NOT cause tics but may unmask or transiently worsen
  - Usually improve over time despite continuing stimulant
  - If bothersome: reduce dose, switch medication, or add alpha-2 agonist (guanfacine, clonidine)
  - Cardiovascular concerns
  - If persistent elevation BP or HR: reduce dose or switch to non-stimulant
  - If chest pain, palpitations, or syncope: stop medication, obtain EKG, cardiology referral
  - Growth monitoring and intervention
  - Monitor height, weight, BMI every 3 months while on stimulant
  - Growth deceleration: assess adherence to medication, appetite, dietary intake
  - Consider medication holidays (weekends, summers) to allow catch-up growth
  - Ensure adequate nutrition (high-calorie diet)
  - If severe or persistent growth delay: reduce dose, switch to non-stimulant, or stop medication
  - Most children attain expected adult height despite temporary growth deceleration
  - Behavioral interventions (continue alongside medication)
  - Parent behavior training (booster sessions as needed)
  - School accommodations (review IEP or 504 plan annually)
  - Organizational skills training
  - Homework management strategies
  - Social skills training if peer difficulties
  - Cognitive-behavioral therapy (CBT) for older children and adolescents
  - Addressing comorbidities
  - Anxiety or depression: consider adding SSRI (fluoxetine, sertraline, escitalopram)
  - ODD or conduct problems: parent management training, family therapy
  - Learning disorders: psychoeducational testing, special education services
  - Sleep disorders: sleep study if concern for sleep apnea
  - Substance use: brief intervention, referral to substance abuse treatment
  - Monitoring frequency
  - During initial titration: every 2-4 weeks
  - Stable on medication: every 3 months (minimum)
  - Annual comprehensive evaluation (rating scales, growth, vital signs, comorbidities)
  - More frequent if concerns, side effects, or medication changes
  - Laboratory monitoring
  - NOT routinely required for stimulant or non-stimulant medications
  - Consider EKG if family history of sudden cardiac death, congenital heart disease, arrhythmia, or unexplained syncope
  - Not routine screening but if specific cardiac concerns
  - Baseline liver function tests (LFTs) if starting atomoxetine (rare hepatotoxicity)
  - Medication holidays and discontinuation
  - Medication holidays (weekends, summers) may be appropriate
  - Benefits: minimize side effects, assess continued need, allow catch-up growth
  - Risks: loss of symptom control, functional impairment, safety concerns
  - Individualize decision based on child's needs
  - Discontinuation trial
  - Consider after period of stability (1-2 years)
  - Trial off medication during low-stress time (not beginning of school year)
  - Monitor symptoms and functioning off medication
  - Many children require ongoing treatment through adolescence and adulthood
  - Transition to adult care (adolescents)
  - Begin transition planning by age 16-18 years
  - Identify adult provider (psychiatry, primary care with ADHD expertise)
  - Transfer medical records, medication history
  - Discuss stimulant medication diversion risks (college students)
  - Discuss driving safety (ADHD increases crash risk, medication improves)
  - Vocational planning and accommodations
clinical_pearls:
  - 'Treatment goal is optimal symptom control with minimal side effects - individualize dose, not one-size-fits-all'
  - 'Monitor growth (height, weight, BMI) and vital signs (BP, HR) every 3 months on stimulant medication'
  - 'Obtain parent AND teacher rating scales (Vanderbilt Follow-Up) to assess response - symptoms differ by setting'
  - 'Decreased appetite and weight loss most common stimulant side effect - give medication after meals, high-calorie evening snacks'
  - 'If no response to first stimulant, try other class (methylphenidate versus amphetamine) - 90% respond to one or the other'
  - 'Stimulants do NOT cause tics but may unmask or transiently worsen - usually improve over time, do not necessarily require stopping medication'
  - 'Medication holidays (weekends, summers) individualize - may benefit appetite and growth but loss of symptom control and functioning'
  - 'ADHD often requires long-term treatment - many adolescents and adults continue to need medication and support'
referrals:
  - Developmental-behavioral pediatrics or child psychiatry if refractory symptoms, complex comorbidities, or diagnostic uncertainty
  - Cardiology if cardiovascular concerns (chest pain, syncope, palpitations, family history sudden death, persistently elevated BP/HR)
  - Neuropsychological testing if concern for learning disorder, intellectual disability, or complex profile
  - Mental health therapist for behavioral interventions (CBT, parent training, social skills)
  - School psychologist for IEP or 504 plan updates and accommodations
  - Substance abuse treatment if adolescent with substance use disorder
differentials:
  - ADHD with good response to treatment (continue current regimen)
  - ADHD with partial response (inadequate dose, wrong medication, or comorbidity)
  - ADHD with medication side effects (dose adjustment or medication change needed)
  - ADHD with comorbid anxiety (may worsen with stimulants, consider non-stimulant or SSRI)
  - ADHD with comorbid depression (consider adding SSRI)
  - ADHD with learning disorder (needs educational interventions beyond medication)
  - ADHD with substance use (adolescents - consider non-stimulant to reduce diversion risk)
  - Misdiagnosis (symptoms actually due to anxiety, depression, trauma, or sleep disorder)
  - Medication non-adherence (appears like treatment failure but actually not taking medication)
  - Stimulant diversion or misuse (adolescents sharing or selling medication)
