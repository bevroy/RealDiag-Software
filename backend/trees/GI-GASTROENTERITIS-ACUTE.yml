tree_id: GI-GASTROENTERITIS-ACUTE
name: Acute Gastroenteritis
family: gastroenterology
specialty: Infectious Disease
chief_complaint: Diarrhea and vomiting
description: Acute inflammation of GI tract causing diarrhea, nausea, vomiting, and abdominal cramping, typically from viral or bacterial infection. Most cases self-limited, treatment focuses on hydration and symptom management.
icd10: K52.9
snomed: 25374005
presentations:
  - Acute diarrhea (watery or bloody)
  - Nausea, vomiting
  - Abdominal cramping
  - Fever
  - Recent exposure (contaminated food/water, sick contacts)
  - Dehydration
urgency: routine

