tree_id: HEME-SICKLE-CELL-DISEASE
name: Sickle Cell Disease
family: Hematology
specialty: Hematology
chief_complaint: Severe pain crisis and anemia
description: |
  Inherited hemoglobinopathy causing hemoglobin polymerization and red cell sickling. Vaso-occlusion causes ischemic injury to organs.
  Sickle cell anemia (HbSS) most severe, also HbSC and HbS-beta-thalassemia variants. Primarily affects individuals of African, Mediterranean, Middle Eastern, Indian ancestry.
icd10: D57.1
snomed: 417357006
presentations:
  - Acute painful crises (bone, joint, abdomen)
  - Fever, swelling
  - Chronic anemia, fatigue
  - Acute chest syndrome (fever, chest pain, hypoxia)
  - Stroke, priapism
  - Growth delay, delayed puberty
urgency: High
workup:
  - Newborn screening detects most cases (hemoglobin electrophoresis or HPLC)
  - Hemoglobin electrophoresis diagnostic - HbSS (sickle cell anemia), HbSC disease, HbS-beta-thalassemia
  - Complete blood count - chronic hemolytic anemia (Hgb 6-10 g/dL in HbSS), reticulocytosis, elevated WBC and platelets
  - Peripheral smear - sickle cells, target cells, Howell-Jolly bodies (splenic dysfunction)
  - Baseline studies - reticulocyte count, LDH and indirect bilirubin (elevated from hemolysis), type and screen
  - Assess organ damage - renal function (creatinine, proteinuria), liver function, ferritin (iron overload from transfusions)
  - Transcranial Doppler ultrasound annually in children 2-16 years (screen for stroke risk)
  - Pulmonary function tests, echocardiogram (assess for pulmonary hypertension)
  - During acute events - assess for precipitants (infection, dehydration, hypoxia), chest X-ray if chest pain or fever, blood cultures if febrile
treatment:
  - Hydroxyurea cornerstone of disease-modifying therapy - increases HbF (fetal hemoglobin), reduces vaso-occlusive crises by 50%, improves survival
  - Start hydroxyurea 15-20 mg/kg/day, titrate to maximum tolerated dose (goal ANC greater than 2000, platelets greater than 80000)
  - Offer to all patients with HbSS or HbS-beta-0-thalassemia starting at 9 months of age
  - L-glutamine 5-15g PO BID reduces crises (amino acid supplement)
  - Crizanlizumab 5 mg/kg IV monthly (P-selectin inhibitor) reduces vaso-occlusive crises by 45%
  - Voxelotor 1500mg daily (increases Hgb oxygen affinity, prevents sickling) improves anemia
  - Chronic transfusion therapy for stroke prevention (high-risk TCD), recurrent severe crises, or end-organ damage
  - Goal to maintain HbS less than 30%, chelation needed for iron overload (deferasirox 20-40 mg/kg/day)
  - Hematopoietic stem cell transplant curative option - consider in children with severe disease and matched sibling donor
  - Acute pain crisis management - aggressive hydration (IV fluids 1.5x maintenance), strong opioids (morphine, hydromorphone PCA), NSAIDs
  - Treat precipitating factors, supplemental oxygen if hypoxic
  - Acute chest syndrome (fever, chest pain, pulmonary infiltrate) - antibiotics (ceftriaxone plus azithromycin), oxygen, incentive spirometry, simple transfusion or exchange transfusion if severe
  - Prophylactic penicillin VK 125mg BID (age less than 3) or 250mg BID (age 3-5) prevents pneumococcal sepsis
  - Vaccinations - pneumococcal (PCV13 and PPSV23), Haemophilus influenzae, meningococcal, annual influenza
  - Folic acid 1mg daily (increased need from hemolysis)
clinical_pearls:
  - Vaso-occlusive crises precipitated by infection, dehydration, cold, stress, menses
  - Acute chest syndrome leading cause of death - can progress rapidly, low threshold for exchange transfusion
  - Splenic sequestration crisis in children (spleen enlarges, traps RBCs, severe anemia, shock) - immediate transfusion
  - Autosplenectomy occurs by age 5 (functional asplenia from repeated infarcts)
  - Aplastic crisis from parvovirus B19 (reticulocyte count drops, severe anemia)
  - Stroke risk 10% by age 20 without preventive measures, TCD screening identifies high-risk
  - Priapism medical emergency (urologic consultation, aspiration, phenylephrine injection)
  - Avoid high altitude, ensure adequate oxygenation during anesthesia
differentials:
  - Acute abdomen (appendicitis, cholecystitis)
  - Pneumonia
  - Osteomyelitis
  - Sepsis
  - Acute coronary syndrome
  - Pulmonary embolism
trace:
  - 8-year-old boy with known HbSS presents with severe bilateral leg and back pain x 6 hours, fever 38.8C → Last crisis 3 months ago → Exam shows diffuse bone tenderness, no focal findings → Hgb 7.2 g/dL (baseline 8.5), reticulocyte 8%, WBC 18000 → Chest X-ray clear, blood cultures drawn → Diagnose vaso-occlusive crisis with possible infection → Start IV fluids NS 1.5x maintenance, morphine PCA, ceftriaxone 50 mg/kg IV daily → Pain improves over 48 hours → Blood cultures negative → Transition to oral hydrocodone, discharge on day 4 → Currently on hydroxyurea 20 mg/kg/day, penicillin prophylaxis, folic acid 1mg daily → Counsel on trigger avoidance, adequate hydration, fever precautions → No stroke risk on TCD, continue annual screening
