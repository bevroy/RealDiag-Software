tree_id: CARD-CHF-ACUTE
name: Acute Decompensated Heart Failure
family: Cardiovascular
specialty: Cardiology
chief_complaint: Shortness of breath and leg swelling
description: Acute worsening of chronic heart failure with pulmonary congestion and/or systemic fluid overload causing dyspnea and volume retention

icd10: I50.9

urgency: emergent

workup:
  - Clinical presentation: progressive dyspnea (rest, exertional, orthopnea, PND), lower extremity edema, weight gain (rapid 2-3 pounds over days), fatigue, reduced exercise tolerance, abdominal bloating
  - Exam: elevated JVP (jugular venous pressure), pulmonary crackles (rales), S3 gallop (ventricular gallop), peripheral edema (legs, sacrum if bedbound), hepatomegaly, ascites if severe
  - Vital signs: tachycardia, tachypnea, hypoxemia (SpO2 less than 90 percent), hypertension or hypotension (cardiogenic shock if systolic BP less than 90)
  - Precipitants: medication noncompliance, dietary sodium indiscretion, volume overload, infection, arrhythmia (atrial fibrillation with RVR), acute coronary syndrome, uncontrolled hypertension, renal dysfunction, anemia, thyroid disease
  - Laboratory: BNP (greater than 400 pg/mL) or NT-proBNP (greater than 900 pg/mL for age less than 50, greater than 1800 for age 50-75, greater than 900 for age greater than 75) elevated diagnostic for heart failure, troponin (exclude ACS as precipitant), CBC (anemia), CMP (renal function, electrolytes), TSH if new onset
  - Chest X-ray: cardiomegaly, pulmonary edema (cephalization, Kerley B lines, pleural effusions, bilateral infiltrates)
  - ECG: assess for arrhythmia (atrial fibrillation), ischemia (ST changes), LVH
  - Echocardiogram: assess LV systolic function (EF), diastolic function, valvular disease, right ventricular function - if not done recently
  - Arterial blood gas if severe respiratory distress: hypoxemia, respiratory alkalosis initially, then respiratory acidosis if tiring

treatment:
  - Acute management ABCS: oxygen to maintain SpO2 greater than 90 percent (nasal cannula, high-flow, BiPAP if respiratory distress with hypercapnia), upright positioning (reduces preload)
  - Loop diuretics cornerstone of therapy: IV furosemide bolus 20-40 mg if diuretic-naive or 1-2 times home dose if on chronic furosemide, expect diuresis 1-2 liters over 6-8 hours, if inadequate double dose and repeat, goal net negative 1-2 liters daily until euvolemic
  - Continuous IV furosemide infusion if refractory to boluses: 5-10 mg/hr titrate to urine output goal 100-200 mL/hr
  - Diuretic resistance strategies: add thiazide (metolazone 2.5-10 mg daily) 30 minutes before loop diuretic (sequential nephron blockade), albumin if hypoalbuminemic
  - Monitor strict intake/output, daily weights (goal lose 1-2 kg daily), electrolytes (hypokalemia, hypomagnesemia from diuresis - replace), renal function (creatinine may increase 0.3 mg/dL acceptable if improving clinically)
  - Vasodilators if hypertensive (systolic BP greater than 140): IV nitroglycerin 5-200 mcg/min (reduces preload and afterload, improves dyspnea), titrate to BP and symptom response
  - Inotropes if cardiogenic shock (hypotension, poor perfusion, end-organ dysfunction): dobutamine 2.5-20 mcg/kg/min (increases contractility), milrinone 0.375-0.75 mcg/kg/min (inodilator), monitor for arrhythmias
  - Noninvasive positive pressure ventilation (BiPAP): for respiratory distress with hypercapnia, improves oxygenation and reduces work of breathing, reduces intubation rate
  - Intubation and mechanical ventilation if refractory respiratory failure
  - Treat precipitants: rate control if atrial fibrillation (metoprolol, diltiazem), antibiotics if infection, revascularization if ACS
  - Sodium restriction: 2 grams daily, fluid restriction 1.5-2 liters daily if hyponatremia
  - Transition to oral diuretics when improving: typically 1.5-2 times IV dose for oral furosemide equivalence
  - Optimize GDMT before discharge: ARNI or ACE/ARB, beta-blocker, MRA, SGLT2 inhibitor (see chronic heart failure management)
  - Close follow-up: within 7-14 days after discharge, heart failure clinic or cardiologist, medication titration, daily weights at home (call if gain 2-3 pounds over 1-2 days)

clinical_pearls:
  - Dyspnea with orthopnea/PND and elevated JVP classic for acute decompensated HF
  - BNP or NT-proBNP elevated diagnostic (rules out HF if normal)
  - IV loop diuretics cornerstone of therapy (goal net negative 1-2 L daily)
  - Most common precipitant is medication/dietary noncompliance
  - BiPAP reduces intubation rate if respiratory distress
  - Creatinine may increase 0.3 mg/dL during diuresis (acceptable if improving clinically)
  - Optimize GDMT before discharge (ARNI, beta-blocker, MRA, SGLT2i)
  - Close follow-up within 7-14 days critical (high readmission rate)

differentials:
  - COPD exacerbation (wheezing, prolonged expiration, hyperinflation on X-ray, normal BNP)
  - Pneumonia (fever, cough, focal infiltrate on X-ray, elevated WBC)
  - Pulmonary embolism (acute dyspnea, pleuritic chest pain, elevated D-dimer, CT angiography diagnostic)
  - Acute coronary syndrome (chest pain, troponin elevated, ECG changes)

trace:
  - 68-year-old man with ischemic cardiomyopathy (EF 25 percent on echo 6 months ago) presents with 5 days progressive dyspnea, now dyspneic at rest, orthopnea (sleeps on 3 pillows), PND, lower extremity edema, weight gain 10 pounds over 1 week
  - History: admits nonadherence to medications (ran out of furosemide 2 weeks ago), ate salty foods at family gathering last weekend
  - Medications: carvedilol 25 mg BID, lisinopril 20 mg daily, spironolactone 25 mg daily, furosemide 40 mg BID (patient stopped 2 weeks ago)
  - Exam: appears uncomfortable, sitting upright, tachypneic, RR 26, SpO2 88 percent on room air, BP 148/92, HR 102, JVP 12 cm, bibasilar crackles, S3 gallop, 3+ pitting edema legs to knees
  - Labs: BNP 1850 pg/mL (markedly elevated), troponin 0.02 ng/mL (normal, rules out ACS), creatinine 1.6 mg/dL (baseline 1.2), potassium 3.8 mEq/L, sodium 136 mEq/L
  - Chest X-ray: cardiomegaly, pulmonary edema (cephalization, Kerley B lines, bilateral pleural effusions)
  - ECG: sinus tachycardia 102, LVH, no acute ischemic changes
  - Diagnosis: acute decompensated heart failure NYHA Class IV with volume overload, precipitants medication noncompliance and dietary sodium indiscretion
  - Admitted to telemetry
  - Oxygen 4 L nasal cannula (SpO2 improved to 94 percent), upright positioning
  - IV furosemide 80 mg bolus (2 times home dose 40 mg), urine output 800 mL over 6 hours (good response)
  - IV furosemide 80 mg every 12 hours, strict intake/output, daily weights, sodium restriction 2 grams
  - Day 2: net negative 2 liters, weight decreased 2 kg, dyspnea improved, decreased oxygen to 2 L, bibasilar crackles persist, continues IV diuresis
  - Day 3: net negative 1.5 liters (total 3.5 liters negative), weight decreased 3.5 kg total, dyspnea much improved, weaned off oxygen (SpO2 95 percent on room air), crackles resolved, edema 1+, JVP 8 cm
  - Day 4: clinically euvolemic, transitioned to oral furosemide 80 mg BID (2 times IV dose), tolerating oral, ambulating
  - Reviewed GDMT: not on ARNI or SGLT2 inhibitor, discussed switching lisinopril to sacubitril/valsartan and adding dapagliflozin but defer until stable outpatient
  - Discharge day 5: euvolemic, breathing comfortably, weight decreased 5 kg from admission, discharge medications furosemide 80 mg BID, carvedilol 25 mg BID, lisinopril 20 mg daily, spironolactone 25 mg daily
  - Education: medication adherence critical, daily weights (call if gain 2-3 pounds over 1-2 days), sodium restriction 2 grams daily, fluid restriction 2 liters daily
  - Follow-up cardiology in 1 week
  - Outpatient clinic 1 week: stable, weight maintained, no dyspnea, switched lisinopril to sacubitril/valsartan 24/26 mg BID (titrate up), added dapagliflozin 10 mg daily (SGLT2i), optimizing GDMT
  - 1 month: doing well, no further decompensation, GDMT optimized, referred to heart failure clinic for ongoing management
