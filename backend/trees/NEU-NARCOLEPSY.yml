tree_id: NEU-NARCOLEPSY
name: Narcolepsy
family: Neurology
specialty: Neurology
icd10:
- G47.419
snomed:
- '60380001'
urgency: medium
description: Comprehensive evaluation and management of Narcolepsy
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- excessive daytime sleepiness
- cataplexy (sudden muscle weakness with emotion)
- sleep paralysis
- hypnagogic hallucinations
- automatic behaviors
- 'Excessive daytime sleepiness (EDS): Overwhelming sleepiness despite adequate nighttime
  sleep'
- 'Cataplexy (60-70%): Sudden bilateral muscle weakness triggered by emotion (laughter,
  surprise)'
- 'Sleep paralysis: Inability to move when falling asleep or waking up'
- 'Hypnagogic/hypnopompic hallucinations: Vivid dreams while falling asleep or waking'
workup:
- 'Polysomnography (overnight): Rule out sleep apnea, shows decreased sleep latency'
- 'MSLT (next day): Mean sleep latency <8 min + ≥2 sleep-onset REM periods (SOREMPs)'
- 'Hypocretin-1 (CSF): <110 pg/mL diagnostic for narcolepsy type 1 (not routinely
  done)'
- 'HLA-DQB1*06:02: Present in 98% of narcolepsy type 1 (not diagnostic, many normal
  people have it)'
treatment:
- 'Guideline-based treatment options for Narcolepsy include:'
- 'Scheduled naps: 15-20 minute naps 2-3x daily (non-pharmacologic foundation) (AAN
  2024)'
- 'Excessive sleepiness: Modafinil 200-400mg AM (AAN 2024)'
- 'Alternative stimulants: Methylphenidate 20-60mg/day, dextroamphetamine 10-60mg/day
  (AAN 2024)'
- 'Cataplexy: Sodium oxybate 4.5-9g divided into 2 doses at night (controls both EDS
  and cataplexy) (AAN 2024)'
- 'Antidepressants for cataplexy: Venlafaxine 75-150mg, SSRIs (fluoxetine, sertraline)
  (AAN 2024)'
clinical_pearls:
- 'Narcolepsy type 1: With cataplexy (low CSF hypocretin-1), HLA-DQB1*06:02 (98%)'
- 'Narcolepsy type 2: Without cataplexy (normal hypocretin)'
- Onset typically age 10-30, often misdiagnosed as depression or epilepsy
- 'MSLT (multiple sleep latency test): Mean sleep latency <8 min + ≥2 SOREMPs (sleep-onset
  REM)'
- 'Treatment: Modafinil/armodafinil for EDS, sodium oxybate for cataplexy'
referrals:
- 'Sleep medicine: For diagnosis confirmation (MSLT), treatment initiation'
- 'Neurology: For complex cases, cataplexy management'
differentials:
  - Sleep apnea
  - Insomnia
  - Depression
  - Medication effect
  - Hypothyroidism
trace:
