tree_id: PULM-TOBACCO-USE
name: Smoking-Related Disorder / Tobacco Use
family: pulmonology
specialty: Pulmonology
icd10: Z72.0
snomed: 77176002
urgency: routine
homeopathy: []
presentations:
  - Active tobacco use (cigarettes, cigars, pipes, smokeless tobacco)
  - Former smoker with smoking-related health concerns
  - Quantified in pack-years (packs per day × years smoked)
  - Symptoms from tobacco-related diseases
  - Chronic cough (smoker's cough)
  - Dyspnea on exertion
  - Increased sputum production
  - Recurrent respiratory infections
  - Desire to quit smoking
  - Failed previous quit attempts
  - Withdrawal symptoms during prior attempts
  - Social/occupational impairment from smoking
workup:
  - Smoking history - pack-years, age started, previous quit attempts, readiness to quit
  - Assess for nicotine dependence (Fagerström Test)
  - Time to first cigarette after waking (<30 min = high dependence)
  - Number of cigarettes per day
  - Difficulty refraining from smoking in restricted areas
  - Assess readiness to quit (5 As - Ask, Advise, Assess, Assist, Arrange)
  - Precontemplation - not ready to quit
  - Contemplation - considering quitting
  - Preparation - ready to quit within 30 days
  - Action - actively quitting
  - Maintenance - quit for >6 months
  - Screen for tobacco-related comorbidities
  - Pulmonary function tests (spirometry) - assess for COPD
  - Chest X-ray or low-dose CT for lung cancer screening (if meets criteria)
  - Age 50-80 with ≥20 pack-year history
  - Cardiovascular risk assessment (blood pressure, lipids, diabetes screening)
  - Assess for depression, anxiety, substance use (higher in smokers)
treatment:
  - Behavioral counseling (cornerstone of cessation)
  - Brief counseling (5-10 minutes) increases quit rates
  - Intensive counseling (group or individual) more effective
  - Quit line referral (1-800-QUIT-NOW)
  - Cognitive behavioral therapy, motivational interviewing
  - Set quit date within 2 weeks
  - Remove triggers and ashtrays from home/car
  - Pharmacotherapy (doubles quit rates vs counseling alone)
  - First-line medications (FDA-approved)
  - Varenicline (Chantix) 0.5-1mg BID x 12 weeks - most effective (OR 3.1)
  - Partial nicotine receptor agonist, reduces cravings and withdrawal
  - Start 1 week before quit date
  - Side effects - nausea, vivid dreams, rarely neuropsychiatric symptoms
  - Bupropion SR 150mg BID x 12 weeks (OR 2.0)
  - Antidepressant, reduces cravings
  - Start 1-2 weeks before quit date
  - Contraindicated if seizure history or eating disorder
  - Nicotine replacement therapy (NRT) - gum, patch, lozenge, inhaler, nasal spray
  - Patch 21mg daily x 6 weeks, taper to 14mg x 2 weeks, then 7mg x 2 weeks
  - Combination NRT (patch + short-acting) more effective than monotherapy
  - Safe in cardiovascular disease (benefits outweigh risks)
  - Second-line - nortriptyline, clonidine (off-label)
  - Combination therapy more effective than monotherapy
  - Varenicline + NRT patch
  - Bupropion + NRT
  - Relapse prevention - most relapses occur within 8 weeks of quitting
  - Continue pharmacotherapy 3-6 months (longer if needed)
  - Ongoing counseling and support
  - Address weight gain concerns (average 4-5 kg)
clinical_pearls:
  - Smoking leading cause of preventable death (480,000 deaths/year in US)
  - Smoking-related diseases - COPD, lung cancer, CAD, stroke, PAD, many others
  - Quitting at any age beneficial - within 1 year CHD risk drops 50%
  - Most smokers require 5-7 quit attempts before successful long-term cessation
  - Combination of counseling + pharmacotherapy most effective (quit rate 25-30%)
  - E-cigarettes/vaping controversial - may help some quit but health risks unclear
  - Not FDA-approved for cessation, contains nicotine and harmful chemicals
  - Secondhand smoke exposure harmful (children, pregnant women)
  - Smokeless tobacco (chewing tobacco, snuff) causes oral cancer, not "safe" alternative
  - Pregnancy - NRT safer than continued smoking, varenicline/bupropion not recommended
  - Financial incentives and support from employer/insurance improve quit rates
referrals:
  - Tobacco cessation program for intensive counseling
  - Behavioral health for comorbid depression, anxiety, or substance use disorder
  - Pulmonology if COPD or chronic respiratory symptoms
  - Cardiology if cardiovascular disease
  - Oncology if lung cancer detected on screening
differentials:
  - Tobacco use disorder (current smoker, nicotine dependence)
  - Former tobacco user (quit, monitoring for tobacco-related diseases)
  - COPD (chronic bronchitis, emphysema from smoking)
  - Lung cancer (smoking is #1 risk factor)
  - Cardiovascular disease (smoking major risk factor for CAD, stroke, PAD)
  - Chronic cough from smoking
  - Oral cancer (smokeless tobacco)
  - Nicotine withdrawal syndrome (irritability, anxiety, insomnia, increased appetite)
trace:
  source: USPSTF Tobacco Cessation Guidelines 2021
  version: '1.0'
  last_updated: '2025-12-26'
