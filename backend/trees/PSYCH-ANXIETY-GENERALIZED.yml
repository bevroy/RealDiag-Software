tree_id: PSYCH-ANXIETY-GENERALIZED
name: Generalized Anxiety Disorder
family: Psychiatry
specialty: Psychiatry
chief_complaint: Excessive worry and anxiety
description: Chronic excessive worry about multiple topics for most days over at least 6 months with physical symptoms causing functional impairment. SSRIs and cognitive behavioral therapy highly effective.
icd10: F41.1
urgency: non-urgent

workup:
  - Clinical diagnosis (DSM-5 criteria): excessive worry and anxiety most days for ≥6 months about multiple events, difficult to control, plus ≥3 physical symptoms (restlessness, fatigue, difficulty concentrating, irritability, muscle tension, sleep disturbance)
  - GAD-7 scale: 0-4 minimal, 5-9 mild, 10-14 moderate, 15-21 severe anxiety (screening and monitoring tool)
  - Rule out medical causes: TSH (hyperthyroidism), ECG (arrhythmia), glucose (hypoglycemia), caffeine intake
  - Substance use assessment: alcohol, stimulants, caffeine can cause or worsen anxiety
  - Screen for comorbidities: major depression (50% comorbid), panic disorder, substance use disorder
  - Assess functional impairment: work, relationships, social activities

treatment:
  - First-line: SSRI or SNRI plus cognitive behavioral therapy (combination superior to monotherapy)
  - SSRIs: escitalopram 10-20 mg daily, sertraline 50-200 mg daily, paroxetine 20-50 mg daily (takes 4-6 weeks for full effect)
  - SNRIs: venlafaxine XR 75-225 mg daily, duloxetine 60-120 mg daily
  - Cognitive behavioral therapy (CBT): addresses maladaptive thought patterns, worry exposure, relaxation techniques (12-16 sessions evidence-based)
  - Benzodiazepines: SHORT-TERM use only (2-4 weeks) while waiting for SSRI to work, high addiction potential, avoid long-term
  - If used: clonazepam 0.25-0.5 mg BID or lorazepam 0.5-1 mg BID PRN (use lowest effective dose, taper slowly to discontinue)
  - Buspirone 15-60 mg daily divided BID-TID: alternative if SSRI contraindicated, no addiction potential, takes 2-4 weeks
  - Alternative: pregabalin 150-600 mg daily divided, or hydroxyzine 25-50 mg TID PRN (non-addictive)
  - Lifestyle modifications: regular exercise (reduces anxiety), limit caffeine and alcohol, adequate sleep, stress management, mindfulness meditation
  - Treatment duration: continue 12 months after symptom remission, then consider tapering
  - If inadequate response: increase dose, switch to different SSRI/SNRI, augment with buspirone or atypical antipsychotic (quetiapine 25-300 mg HS)

clinical_pearls:
  - Excessive worry ≥6 months about multiple topics with ≥3 physical symptoms diagnostic
  - GAD-7 score quantifies severity and monitors response
  - SSRIs first-line - escitalopram or sertraline, takes 4-6 weeks
  - CBT highly effective - combination SSRI plus CBT superior to monotherapy
  - Benzodiazepines SHORT-TERM only (2-4 weeks) - addiction risk with long-term use
  - 50% comorbid with depression - screen and treat both
  - Continue treatment 12 months after remission before tapering

differentials:
  - Panic disorder: discrete panic attacks (sudden intense fear peaking within minutes), not constant worry
  - Social anxiety disorder: anxiety specific to social/performance situations, fear of embarrassment
  - Obsessive-compulsive disorder: intrusive obsessions and compulsions to reduce anxiety
  - Hyperthyroidism: anxiety, tremor, weight loss, palpitations, elevated TSH

trace: |
  A 35-year-old woman presented with 18 months of constant excessive worry about work, finances, family health, and daily activities. Difficulty controlling worry, always expecting worst-case scenarios. Physical symptoms included restlessness, muscle tension, difficulty concentrating at work, irritability, and insomnia with difficulty falling asleep. GAD-7 score 16 (severe). Functioning impaired at work and socially. No substance use. TSH normal. Diagnosed with generalized anxiety disorder. Started escitalopram 10 mg daily and referred to CBT therapist. Clonazepam 0.25 mg BID PRN for first 3 weeks for immediate relief while waiting for SSRI to work. At 2 weeks anxiety improved slightly, discontinued clonazepam. At 6 weeks GAD-7 improved to 10 (moderate), increased escitalopram to 15 mg daily, actively participating in CBT (learning cognitive restructuring and relaxation techniques). At 12 weeks GAD-7 6 (mild), significant improvement in worry control and physical symptoms, returned to normal functioning at work. At 6 months GAD-7 3 (minimal), achieved remission, completed CBT course (16 sessions), excellent coping skills. Continued escitalopram 15 mg daily with plan to continue 12 months then taper.
