tree_id: ENDO-CUSHINGS
name: Cushing's Syndrome
family: Endocrinology
specialty: Endocrinology
icd10:
- E24.9
snomed:
- '47270006'
urgency: medium
description: Comprehensive evaluation and management of Cushing's Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- weight gain, central obesity
- moon facies, buffalo hump
- purple striae, easy bruising
- hypertension, hyperglycemia
- muscle weakness
workup:
- 'Screening (pick 2 tests): 24-hr urine free cortisol (≥3x normal), late-night salivary
  cortisol (elevated), 1mg dexamethasone suppression test (cortisol >1.8 mcg/dL at
  8 AM)'
- 'ACTH to determine source: High = pituitary or ectopic, Low = adrenal tumor'
- 'If ACTH high: High-dose dexamethasone test and CRH stimulation test to differentiate
  pituitary vs ectopic'
- 'Imaging: Pituitary MRI if Cushing''s disease, adrenal CT if adrenal source, chest/abdomen
  CT for ectopic'
treatment:
- 'Guideline-based treatment options for Cushing''s Syndrome include:'
- 'First: Stop exogenous steroids if possible (taper slowly to avoid adrenal crisis)
  (ADA 2024)'
- 'Pituitary adenoma (Cushing''s disease): Transsphenoidal surgery (first-line, 70-90%
  cure) (ADA 2024)'
- 'If surgery fails: Pituitary radiation, bilateral adrenalectomy, or medical therapy
  (ketoconazole, metyrapone) (ADA 2024)'
- 'Ectopic ACTH: Resect source tumor if possible, medical therapy (ketoconazole, etomidate)
  to control cortisol (ADA 2024)'
- 'Adrenal tumor: Surgical resection (laparoscopic adrenalectomy) (ADA 2024)'
clinical_pearls:
- Cushing's syndrome = excess cortisol. Cushing's disease = pituitary adenoma causing
  Cushing's syndrome (70%)
- 'Causes: Pituitary adenoma (70%), ectopic ACTH (15% - small cell lung CA), adrenal
  tumor (15%)'
- Exogenous steroids (iatrogenic) is most common cause of Cushing's syndrome - exclude
  before workup
- Purple/wide striae (>1cm), proximal myopathy, easy bruising are most specific findings
- 'Complications: Diabetes, hypertension, osteoporosis, infections, psychiatric symptoms'
referrals:
- Endocrinology for all suspected cases - complex workup and management
- Neurosurgery (pituitary surgeon) if pituitary adenoma confirmed
- General surgery for adrenal tumor resection
differentials: []
trace:
