tree_id: PEDS-DEHYDRATION
name: Dehydration (Pediatric)
family: pediatrics
specialty: Pediatrics/Emergency Medicine
icd10: E86.0
snomed: 34095006
urgency:
  - Severe dehydration (greater than 9% fluid loss)
  - Altered mental status or lethargy
  - Tachycardia with weak pulse
  - Hypotension or delayed capillary refill greater than 3 seconds
  - Inability to tolerate oral fluids
  - Signs of hypovolemic shock
homeopathy: []
presentations:
  - Decreased urine output (oliguria, fewer wet diapers)
  - Dry mucous membranes (dry mouth, lips)
  - Decreased tears when crying
  - Sunken eyes
  - Sunken fontanelle in infants
  - Poor skin turgor (skin tenting)
  - Lethargy or irritability
  - Tachycardia
  - Rapid weight loss
  - Thirst (may be absent in severe dehydration)
  - History of vomiting, diarrhea, decreased oral intake, or fever
  - Dark concentrated urine or no urine for greater than 8 hours
workup:
  - Clinical history
  - Duration and frequency of vomiting and/or diarrhea
  - Last void time (hours since last urination)
  - Number of wet diapers in past 24 hours (infants normally 6-8)
  - Character of stool (watery, bloody, mucoid)
  - Oral intake amount and type (attempting to drink, refusing fluids)
  - Recent illness (fever, URI, gastroenteritis)
  - Urine output and color (dark amber suggests concentration)
  - Recent weight (if available - most accurate assessment)
  - Chronic medical conditions (diabetes, renal disease)
  - Medications (diuretics, laxatives)
  - Travel history (infectious gastroenteritis exposure)
  - Physical examination
  - Vital signs (heart rate, respiratory rate, blood pressure, temperature, weight)
  - Tachycardia present if mild-moderate dehydration
  - Orthostatic vital signs in older children (increase HR greater than 20 or decrease BP greater than 10 mmHg suggests volume depletion)
  - General appearance and mental status
  - Alert and playful (mild), lethargic or irritable (moderate), unresponsive or floppy (severe)
  - Mucous membranes (moist versus dry versus parched)
  - Eyes (normal versus sunken)
  - Tears (present versus absent)
  - Fontanelle assessment in infants (soft versus sunken versus very sunken)
  - Skin turgor (assess over abdomen or thigh)
  - Normal: skin snaps back immediately
  - Delayed: skin tenting present, slow recoil (greater than 2 seconds)
  - Capillary refill time (normal less than 2 seconds, delayed greater than 3 seconds)
  - Peripheral perfusion (warm extremities versus cool, mottled)
  - Classify degree of dehydration
  - Mild dehydration (3-5% fluid loss)
  - Alert, normal mental status
  - Slightly dry mucous membranes
  - Normal eyes, tears present
  - Normal skin turgor
  - Normal vital signs
  - Moderate dehydration (6-9% fluid loss)
  - Lethargic or irritable
  - Dry mucous membranes
  - Sunken eyes, decreased tears
  - Sunken fontanelle (infants)
  - Delayed skin turgor, tenting present
  - Tachycardia, normal blood pressure
  - Capillary refill 2-3 seconds
  - Oliguria (decreased urine output)
  - Severe dehydration (greater than 9% fluid loss)
  - Unresponsive, obtunded, or very weak
  - Parched mucous membranes
  - Very sunken eyes, absent tears
  - Very sunken fontanelle (infants)
  - Poor skin turgor, prolonged tenting
  - Tachycardia and hypotension (signs of shock)
  - Capillary refill greater than 3 seconds
  - Cool, mottled extremities
  - Minimal or no urine output
  - Laboratory evaluation
  - Not routinely needed for mild dehydration
  - Consider for moderate-severe dehydration or diagnostic uncertainty
  - Basic metabolic panel (BMP)
  - Electrolytes (sodium, potassium, chloride, bicarbonate)
  - Hypernatremic dehydration (Na greater than 145): slower rehydration needed to avoid cerebral edema
  - Hyponatremic dehydration (Na less than 130): risk seizures, inappropriate fluid losses
  - BUN and creatinine (assess renal function, pre-renal azotemia)
  - Glucose (hypoglycemia risk in young infants)
  - Venous blood gas if concern for metabolic acidosis
  - Urinalysis
  - Specific gravity greater than 1.030 indicates concentrated urine (dehydration)
  - Ketones suggest starvation ketosis
  - Complete blood count (CBC) - hemoconcentration if dehydrated
  - Stool studies if bloody diarrhea or concern for bacterial pathogen
treatment:
  - Oral rehydration therapy (ORT) - FIRST-LINE for mild-moderate dehydration
  - Preferred over IV fluids for mild-moderate dehydration if patient able to drink
  - Oral rehydration solution (ORS): Pedialyte, WHO-ORS
  - Contains glucose and electrolytes in optimal ratio for absorption
  - Do NOT use plain water, juice, soda, or sports drinks (incorrect osmolality)
  - Mild dehydration (3-5% loss): 50 mL/kg ORS over 2-4 hours
  - Moderate dehydration (6-9% loss): 100 mL/kg ORS over 2-4 hours
  - Plus ongoing losses (10 mL/kg for each diarrheal stool or vomiting episode)
  - Administration technique
  - Small frequent volumes (5 mL every 2-5 minutes) if vomiting
  - Use syringe or spoon, not bottle (better control)
  - Gradually increase volume as tolerated
  - After rehydration phase, resume normal diet (no BRAT diet)
  - Continue breastfeeding throughout (do not discontinue)
  - Intravenous (IV) rehydration - for severe dehydration or failed ORT
  - Severe dehydration or shock: rapid bolus resuscitation
  - Normal saline (0.9% NaCl) or lactated Ringer's 20 mL/kg IV bolus over 20-30 minutes
  - Repeat bolus as needed until perfusion improves (may need 40-60 mL/kg total)
  - Reassess after each bolus (vital signs, perfusion, mental status)
  - 'After stabilization: maintenance fluids plus deficit replacement'
  - 'Calculate fluid deficit: % dehydration x weight (kg) x 1000 = mL deficit'
  - Replace deficit over 24-48 hours (slower if hypernatremic to avoid cerebral edema)
  - Maintenance rate (Holliday-Segar method)
  - '0-10 kg: 4 mL/kg/hr OR 100 mL/kg/day'
  - '10-20 kg: add 2 mL/kg/hr for each kg above 10 OR add 50 mL/kg/day'
  - Greater than 20 kg: add 1 mL/kg/hr for each kg above 20 OR add 20 mL/kg/day
  - Maintenance fluid: D5 0.45% NaCl with 20 mEq/L KCl (after voiding)
  - Ongoing losses: replace mL for mL with appropriate fluid
  - Special considerations
  - Hypernatremic dehydration (Na greater than 145 mEq/L)
  - Correct slowly over 48 hours (decrease Na by max 10-12 mEq/L per day)
  - Rapid correction risks cerebral edema
  - Use 0.45% NaCl for IV fluids
  - Monitor sodium every 4-6 hours
  - Hyponatremic dehydration (Na less than 130 mEq/L)
  - Usually due to free water replacement of electrolyte losses
  - Correct with normal saline (0.9% NaCl)
  - Severe symptomatic hyponatremia (seizures): hypertonic 3% saline bolus
  - Isonatremic dehydration (Na 130-145 mEq/L): most common, standard rehydration
  - Ondansetron (Zofran) for vomiting - facilitates oral rehydration
  - Age greater than 6 months: 0.15 mg/kg PO (max 8 mg) single dose
  - Reduces vomiting, improves ORT success, decreases need for IV fluids
  - Use cautiously, not routinely (may prolong diarrhea slightly)
  - Antiemetics not routinely recommended but ondansetron reasonable if vomiting prevents ORT
  - Do NOT use routine antidiarrheal agents (loperamide) in children - risk complications
  - Probiotics (Lactobacillus, Saccharomyces boulardii) may reduce duration of diarrhea
  - Zinc supplementation (WHO recommendation for developing countries)
  - Disposition
  - Mild dehydration: discharge home with ORS and close follow-up
  - Moderate dehydration: trial of ORT, discharge if tolerating OR admit for IV fluids
  - Severe dehydration: admit for IV resuscitation and monitoring
  - Anticipatory guidance
  - Continue ORS at home for ongoing losses
  - Resume normal diet once rehydrated (no dietary restrictions, full-strength formula)
  - When to return: persistent vomiting, worsening diarrhea, decreased urine output, lethargy, blood in stool
clinical_pearls:
  - 'Oral rehydration therapy (ORT) with ORS is first-line for mild-moderate dehydration - equally effective as IV, less invasive, lower cost'
  - 'Small frequent volumes (5 mL every few minutes) successful even with vomiting - patience key to success'
  - 'Weight change most accurate dehydration assessment - 1% body weight loss equals 10 mL/kg fluid deficit'
  - 'Do NOT use plain water for rehydration - causes hyponatremia; do NOT use juice/soda - high osmolality worsens diarrhea'
  - 'Sunken fontanelle and decreased skin turgor are specific but late signs - present only in moderate-severe dehydration'
  - 'Hypernatremic dehydration (Na greater than 145) requires slow correction over 48 hours to prevent cerebral edema - NOT rapid boluses'
  - 'BRAT diet (bananas, rice, applesauce, toast) outdated - resume normal age-appropriate diet once rehydrated'
  - 'Capillary refill greater than 3 seconds and absent tears most reliable clinical signs in young children'
referrals:
  - Pediatric gastroenterology if chronic diarrhea, failure to thrive, or malabsorption suspected
  - Pediatric nephrology if persistent electrolyte abnormalities or renal dysfunction
  - Pediatric endocrinology if hyperglycemia or hypoglycemia concerning for diabetes or metabolic disorder
  - Social work if concerns for neglect or inability to provide adequate hydration at home
differentials:
  - Gastroenteritis (viral most common - rotavirus, norovirus, adenovirus; bacterial - Salmonella, Shigella, Campylobacter, E. coli)
  - Viral illness with poor oral intake (URI, fever)
  - Diabetic ketoacidosis (DKA) - hyperglycemia, polyuria, polydipsia, ketones, Kussmaul breathing
  - Pyloric stenosis (projectile non-bilious vomiting, age 3-12 weeks, hypochloremic metabolic alkalosis, palpable olive)
  - Intussusception (intermittent colicky pain, vomiting, currant jelly stools, age 6-36 months)
  - Malrotation with midgut volvulus (bilious vomiting, abdominal distension, surgical emergency)
  - Sepsis (fever, tachycardia, altered mental status, poor perfusion)
  - Acute kidney injury (oliguria, elevated BUN/creatinine)
  - Adrenal insufficiency (salt-wasting, hypoglycemia, hyperkalemia, hyponatremia)
  - Heat exhaustion or heat stroke (environmental exposure, hyperthermia)
