tree_id: ORTHO-SPINAL-CORD-INJURY
name: Spinal Cord Injury Evaluation
family: ORTHOPEDICS
specialty: Orthopedics, Neurosurgery, Trauma Surgery, Rehabilitation
chief_complaint: Paralysis, Loss of Sensation, Spinal Trauma
description: Comprehensive evaluation and management of acute spinal cord injury
version: "1.0"
icd10: N17.9
author: RealDiag Clinical Team

entry_point: spinal_cord_injury_presentation

nodes:
  - id: spinal_cord_injury_presentation
    type: question
    text: "Injury severity and level?"
    options:
      - label: "Complete spinal cord injury (no motor/sensory below level)"
        next: complete_spinal_cord_injury
      - label: "Incomplete spinal cord injury (partial motor/sensory preserved)"
        next: incomplete_spinal_cord_injury
      - label: "Spinal shock and autonomic complications"
        next: spinal_shock_management

  - id: complete_spinal_cord_injury
    type: diagnosis
    name: "Complete Spinal Cord Injury"
    icd10: "S14.109A"
    urgency: critical
    workup:
      - Definition - Complete loss of motor and sensory function below level of injury
      - ASIA (American Spinal Injury Association) Impairment Scale - Grade A
      - No motor or sensory function preserved in sacral segments S4-S5 (anal sphincter tone, deep anal pressure sensation)
      - Mechanism - High-energy trauma (MVA, fall from height, diving, sports), penetrating trauma (GSW, stab), non-traumatic (tumor, infection, vascular)
      - Level of injury determines deficits
      - C1-C4 (high cervical) - Tetraplegia, ventilator-dependent (phrenic nerve C3-C5), no arm/leg movement
      - C5 - Tetraplegia, shoulder abduction/elbow flexion preserved (biceps), no wrist/hand, no leg
      - C6 - Tetraplegia, wrist extension preserved, no hand intrinsics, no leg
      - C7 - Tetraplegia, elbow extension/wrist flexion preserved (triceps), weak hand, no leg
      - C8-T1 - Tetraplegia, hand intrinsics preserved (finger flexion/extension), no leg, Horner syndrome (T1)
      - T2-T6 - Paraplegia, upper extremity normal, trunk control impaired
      - T7-T12 - Paraplegia, progressively better trunk/abdominal control
      - L1-L5 - Paraplegia, variable hip flexion/knee extension/ankle dorsiflexion
      - S1-S5 - Paraplegia, some ankle plantar flexion, bowel/bladder/sexual dysfunction
      - Initial assessment (trauma setting) - ATLS protocol, maintain C-spine immobilization
      - Primary survey - ABCs, spinal precautions (cervical collar, backboard)
      - Neurologic exam - Motor (0-5 scale, key muscles each level), sensory (light touch, pinprick in all dermatomes), rectal exam (anal tone, voluntary contraction, sensation)
      - Sacral sparing - Preserved sensation at anal mucocutaneous junction or voluntary anal sphincter contraction = incomplete injury (NOT ASIA A)
      - Imaging - CT cervical/thoracic/lumbar spine (identify fractures, alignment, canal compromise)
      - MRI spine (within 48 hours if possible) - Assess cord compression, ligamentous injury, hematoma, edema
      - Spinal shock - Immediate transient loss of all reflex activity below injury level (flaccid paralysis, areflexia, autonomic dysfunction)
      - Lasts hours to weeks, resolves with return of reflexes (hyperreflexia, spasticity)
      - Cannot assess completeness until spinal shock resolves (presence of bulbocavernosus reflex indicates resolution)
    treatment:
      - Acute management - Time-sensitive
      - Maintain spinal immobilization - Cervical collar, logroll technique, avoid flexion/extension
      - Hemodynamic support - MAP goal 85-90 mmHg for 7 days (maintain spinal cord perfusion)
      - Neurogenic shock common (cervical/high thoracic injury) - Hypotension + bradycardia (loss of sympathetic tone)
      - Fluids first, then vasopressors (norepinephrine preferred, phenylephrine for bradycardia)
      - Atropine if severe bradycardia
      - Respiratory support - High cervical injury (C1-C4) requires intubation, mechanical ventilation (phrenic nerve dysfunction)
      - C5 and below may have adequate spontaneous breathing but monitor closely (vital capacity, negative inspiratory force)
      - Pulmonary toilet, incentive spirometry, prevent pneumonia
      - Methylprednisolone - CONTROVERSIAL, NOT routinely recommended
      - Historical protocol - 30 mg/kg bolus, then 5.4 mg/kg/hr x 23 hours (if within 8 hours of injury)
      - NASCIS-II trial showed modest benefit, but significant side effects (infection, GI bleed, wound complications)
      - Current guidelines - Not recommended as standard, may offer as option with informed consent (potential small benefit vs known risks)
      - Surgical decompression - If canal compromise, unstable fracture, progressive deficit
      - Timing - Early (<24 hours) may improve outcomes, but data mixed
      - Anterior vs posterior approach depends on injury pattern
      - Goals - Decompress cord, stabilize spine, allow early mobilization
      - DVT prophylaxis - HIGH RISK (paralysis, immobility)
      - LMWH (enoxaparin 30mg SC q12h) or heparin 5000 units SC q8h, start within 72 hours if no contraindication
      - IVC filter if anticoagulation contraindicated (active bleeding, ongoing surgery)
      - SCDs (sequential compression devices) adjunct
      - GI prophylaxis - PPI or H2 blocker (stress ulcer prophylaxis in ICU, high steroid doses if used)
      - Bladder management - Indwelling catheter initially, transition to intermittent catheterization when stable (reduces UTI risk)
      - Bowel program - Stool softeners, stimulant laxatives, suppositories, digital stimulation (prevent impaction)
      - Skin care - Prevent pressure ulcers (turn q2h, specialty mattress, inspect skin)
      - Rehabilitation - Early involvement, transfer to spinal cord injury center when medically stable

  - id: incomplete_spinal_cord_injury
    type: diagnosis
    name: "Incomplete Spinal Cord Injury"
    icd10: "S14.129A"
    urgency: critical
    workup:
      - Definition - Partial preservation of motor or sensory function below injury level, including sacral segments S4-S5
      - ASIA Impairment Scale - Grade B-D
      - ASIA B - Sensory incomplete (sensory preserved below level including S4-S5), no motor below level
      - ASIA C - Motor incomplete, >50% of key muscles below level have grade <3/5 (non-functional)
      - ASIA D - Motor incomplete, ≥50% of key muscles below level have grade ≥3/5 (functional)
      - ASIA E - Normal motor and sensory
      - Incomplete injury syndromes - Classic patterns
      - Central cord syndrome - Most common incomplete SCI
      - Hyperextension injury in older adults with cervical spondylosis/stenosis
      - Greater upper extremity weakness than lower (central cord affected more than peripheral)
      - Variable sensory loss, bladder dysfunction
      - Best prognosis (>75% ambulate), lower extremities recover first
      - Anterior cord syndrome - Anterior spinal artery occlusion or anterior compression
      - Loss of motor, pain, and temperature (spinothalamic tract, corticospinal tract)
      - Preserved proprioception and vibration (dorsal columns spared)
      - Poor prognosis (10-20% functional recovery)
      - Brown-Séquard syndrome - Hemisection of cord (penetrating trauma, lateral compression)
      - Ipsilateral motor weakness and proprioception/vibration loss (corticospinal, dorsal columns)
      - Contralateral pain and temperature loss (spinothalamic crosses)
      - Best prognosis (>90% ambulate)
      - Posterior cord syndrome - Rare, dorsal column injury
      - Loss of proprioception, vibration, deep touch
      - Motor and pain/temperature preserved
      - Conus medullaris syndrome - L1-L2 level, affects sacral cord segments
      - Sudden-onset areflexic bladder, bowel, sexual dysfunction, saddle anesthesia
      - Variable lower extremity weakness
      - Cauda equina syndrome - Nerve roots below L1-L2 (not true spinal cord)
      - Progressive asymmetric lower extremity weakness, saddle anesthesia, bladder/bowel dysfunction, radicular pain
      - Surgical emergency if acute (decompress within 48 hours to preserve function)
      - Imaging - MRI spine (assess cord signal changes, hemorrhage, compression)
      - High T2 signal in cord = edema (better prognosis)
      - Hemorrhage on T2* or GRE sequences (worse prognosis)
    treatment:
      - Acute management - Same as complete SCI (spinal immobilization, MAP 85-90, respiratory support, methylprednisolone controversial)
      - Surgical decompression - Often indicated, especially if progressive deficit or significant canal compromise
      - Timing - Early (<24 hours) may improve neurologic recovery in incomplete injuries
      - Cauda equina - URGENT decompression within 48 hours (some say 24 hours) for best outcome
      - Rehabilitation - Better prognosis than complete injury, intensive physical/occupational therapy
      - Recovery plateaus by 12-24 months
      - Functional goals based on level and completeness

  - id: spinal_shock_management
    type: diagnosis
    name: "Spinal Shock and Autonomic Complications"
    icd10: "G95.89"
    urgency: critical
    workup:
      - Spinal shock - Transient loss of reflexes below injury level
      - Flaccid paralysis, areflexia, loss of bulbocavernosus reflex, bladder atony
      - Autonomic dysfunction - Hypotension, bradycardia (neurogenic shock if cervical/high thoracic), loss of sweating, temperature dysregulation
      - Duration - Hours to weeks (average 1-6 weeks), resolves with return of reflexes
      - Bulbocavernosus reflex returns first (squeeze glans/pull foley → anal sphincter contraction)
      - Once reflexes return, can assess completeness of injury
      - Evolves to hyperreflexia, spasticity, autonomic dysreflexia (chronic phase)
      - Neurogenic shock vs spinal shock
      - Neurogenic shock - Hypotension + bradycardia from loss of sympathetic tone (injury at T6 or above)
      - Spinal shock - Loss of all spinal reflexes below injury (different phenomenon)
      - Autonomic dysreflexia - EMERGENCY, occurs in chronic phase (weeks-months post-injury) in injuries at T6 or above
      - Exaggerated sympathetic response to noxious stimulus below injury level (bladder distension most common, bowel impaction, pressure ulcer, tight clothing)
      - Severe hypertension (SBP >200 mmHg), pounding headache, flushing/sweating above injury level, piloerection, blurred vision
      - Reflex bradycardia (from baroreceptor response to HTN)
      - Can cause stroke, MI, seizures if untreated
    treatment:
      - Neurogenic shock (acute phase)
      - Goal MAP 85-90 mmHg (maintain spinal cord perfusion)
      - IV fluids - Crystalloid bolus 1-2L, but avoid excessive (risk pulmonary edema)
      - Vasopressors - Norepinephrine preferred (both alpha and beta activity), phenylephrine if severe bradycardia
      - Atropine 0.5-1mg IV if symptomatic bradycardia (HR <50 with hypotension)
      - Temporary transvenous pacing if refractory bradycardia
      - Duration - Usually resolves within 1-5 weeks as spinal shock resolves and autonomic tone returns
      - Autonomic dysreflexia (chronic phase) - MEDICAL EMERGENCY
      - Sit patient upright (lowers BP), remove tight clothing, loosen constrictive devices
      - Identify and remove trigger
      - Check bladder - Foley kinked or blocked? Empty bladder (gently, avoid triggering more reflex)
      - Check bowel - Digital rectal exam with lidocaine jelly (anesthetize first to avoid worsening), disimpaction if needed
      - Check skin - Pressure ulcers, ingrown toenail, tight shoes
      - Pharmacologic treatment if SBP >150 mmHg despite removing trigger
      - Nifedipine 10mg PO immediate-release (bite and swallow) OR
      - Nitropaste 1-2 inches topically (easy to remove) OR
      - Hydralazine 10-20mg IV OR
      - Labetalol 20mg IV
      - Monitor BP closely (can drop precipitously once trigger removed)
      - Prevention - Educate patient/caregivers, regular bladder/bowel program, prevent pressure ulcers, loose clothing
      - Prophylaxis - Nifedipine before procedures (cystoscopy, bowel program) if history of autonomic dysreflexia
