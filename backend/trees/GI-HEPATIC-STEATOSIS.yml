tree_id: GI-HEPATIC-STEATOSIS
name: Hepatic Steatosis (Fatty Liver Disease)
family: gastroenterology
specialty: Gastroenterology
icd10: K76.0
snomed: 197321007
urgency: []
homeopathy: []
presentations:
  - Asymptomatic (most common presentation)
  - Incidental finding on imaging or elevated liver enzymes
  - Fatigue and malaise (nonspecific)
  - Right upper quadrant discomfort (mild, vague)
  - Hepatomegaly on physical examination
  - Risk factors: obesity, diabetes, metabolic syndrome, dyslipidemia
  - Significant alcohol use (alcoholic fatty liver)
  - Medication-induced (amiodarone, methotrexate, tamoxifen, steroids)
workup:
  - Liver enzymes: ALT, AST typically mildly elevated (<3x ULN) or normal
  - AST:ALT ratio usually <1 in NAFLD (>2 suggests alcohol)
  - Comprehensive metabolic panel, fasting glucose, HbA1c, lipid panel
  - Rule out other causes of liver disease
  - Viral hepatitis serologies (HBV, HCV)
  - Autoimmune markers (ANA, anti-smooth muscle antibody)
  - Iron studies (ferritin, transferrin saturation)
  - Ceruloplasmin (Wilson's disease if age <40)
  - Right upper quadrant ultrasound
  - Increased echogenicity ("bright liver") suggests steatosis
  - Assess for cirrhosis, portal hypertension, masses
  - Non-invasive fibrosis assessment
  - FibroScan (transient elastography) - measures liver stiffness as surrogate for fibrosis
  - FIB-4 score or NAFLD fibrosis score (calculated from age, AST, ALT, platelets)
  - Liver biopsy if diagnosis uncertain or to stage disease (simple steatosis vs NASH vs fibrosis)
treatment:
  - Weight loss - most effective treatment
  - Goal: 7-10% body weight reduction improves steatosis and inflammation
  - Even 3-5% weight loss beneficial
  - Diet: calorie restriction, Mediterranean diet, reduce simple carbohydrates
  - Exercise: 150-200 minutes moderate-intensity aerobic exercise per week
  - Resistance training 2-3 times per week
  - Treat metabolic comorbidities
  - Diabetes: optimize glycemic control (metformin, GLP-1 agonists, SGLT2 inhibitors)
  - Dyslipidemia: statins safe in NAFLD (do not worsen liver disease)
  - Hypertension: ACE inhibitors or ARBs preferred
  - Avoid alcohol completely
  - Avoid hepatotoxic medications and unnecessary supplements
  - Pharmacotherapy (limited options, no FDA-approved drugs for NAFLD)
  - Vitamin E 800 IU daily may improve histology in non-diabetic NASH (some risk of prostate cancer)
  - Pioglitazone 30 mg daily may benefit diabetics with NASH (weight gain and fracture risk)
  - Weight loss medications (GLP-1 agonists like semaglutide) improve steatosis
  - Bariatric surgery for morbidly obese patients (BMI >35) refractory to lifestyle
clinical_pearls:
  - "NAFLD affects 25-30% of general population, 70-90% of obese and diabetic patients"
  - "Spectrum: simple steatosis → NASH (steatohepatitis) → fibrosis → cirrhosis → HCC"
  - "Simple steatosis has benign prognosis; NASH can progress to cirrhosis in 20-25%"
  - "NAFLD will soon be leading indication for liver transplantation in US"
  - "Weight loss of 7-10% can reverse NASH and improve fibrosis"
  - "Liver biopsy distinguishes simple steatosis from NASH but not always necessary"
  - "NAFLD increases risk of cardiovascular disease - screen and treat CV risk factors"
  - "Rapid weight loss (>1.6 kg/week) can paradoxically worsen liver inflammation"
referrals:
  - Gastroenterology/Hepatology if evidence of NASH, advanced fibrosis, or cirrhosis
  - Consider GI referral if FibroScan shows F3-F4 fibrosis or FIB-4 >2.67
  - Endocrinology for optimization of diabetes and metabolic syndrome
  - Bariatric surgery evaluation if BMI >35 and refractory to medical management
  - Liver transplant center if decompensated cirrhosis
differentials:
  - Non-alcoholic fatty liver disease (NAFLD) - most common chronic liver disease
  - Non-alcoholic steatohepatitis (NASH) - inflammatory subtype of NAFLD
  - Alcoholic fatty liver disease (significant alcohol use, AST:ALT >2)
  - Medication-induced steatosis (amiodarone, methotrexate, tamoxifen, steroids)
  - Viral hepatitis (HBV, HCV)
  - Hemochromatosis (elevated ferritin and transferrin saturation)
  - Wilson's disease (young age, low ceruloplasmin, neurologic symptoms)
  - Autoimmune hepatitis (elevated IgG, positive autoantibodies)
