tree_id: PEDS-FEVER
name: Fever, Unspecified (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine/Emergency Medicine
icd10: R50.9
snomed: 386661006
urgency:
  - Age less than 28 days with any fever
  - Fever with petechiae or purpura
  - Altered mental status
  - Severe respiratory distress
  - Signs of shock
homeopathy: []
presentations:
  - Elevated body temperature (rectal temp greater than or equal to 100.4°F/38°C)
  - Irritability or fussiness
  - Decreased activity or lethargy
  - Poor feeding or decreased oral intake
  - Warm skin, flushed cheeks
  - Chills or shivering
  - May be only sign of serious bacterial infection in young infants
  - No obvious source of fever identified on initial evaluation
workup:
  - Clinical history
  - Age of child (most critical factor in evaluation)
  - Maximum temperature and method of measurement (rectal most accurate)
  - Duration of fever
  - Associated symptoms (cough, rhinorrhea, vomiting, diarrhea, rash, ear pulling, dysuria)
  - Ill contacts or sick household members
  - Daycare attendance
  - Recent travel
  - Immunization status (up-to-date vaccines lower risk serious bacterial infection)
  - Previous episodes of fever without source
  - Chronic medical conditions or immunodeficiency
  - Recent antibiotic use
  - Urine output and signs of dehydration
  - Physical examination
  - General appearance (MOST important - well-appearing versus ill-appearing)
  - Vital signs (heart rate, respiratory rate, blood pressure, oxygen saturation)
  - Degree of dehydration (mucous membranes, capillary refill, fontanelle if infant)
  - Comprehensive exam to identify source
  - HEENT: tympanic membranes, pharynx, nasal discharge, sinuses, lymph nodes
  - Cardiovascular: murmur, peripheral perfusion
  - Respiratory: work of breathing, lung sounds
  - Abdomen: tenderness, organomegaly, masses
  - Skin: rashes, petechiae, purpura
  - Musculoskeletal: joint swelling, tenderness, limited range of motion
  - Neurologic: meningeal signs (neck stiffness, bulging fontanelle in infants), mental status
  - Age-based approach to fever without source
  - Neonate (age 0-28 days) - HIGH RISK
  - ALL neonates with fever require full sepsis evaluation and empiric antibiotics
  - Admit to hospital
  - Full sepsis workup: blood culture, urine culture (catheterized), lumbar puncture with CSF studies
  - Chest X-ray if respiratory symptoms
  - Stool culture if diarrhea
  - Empiric antibiotics: ampicillin + gentamicin OR ampicillin + cefotaxime
  - Young infant (age 29 days to 3 months) - INTERMEDIATE RISK
  - Risk stratification using clinical appearance and labs
  - Well-appearing, low-risk criteria (all must be met)
  - Previously healthy, full-term infant
  - No focal bacterial infection on exam
  - White blood cell count 5000-15000/μL
  - Absolute band count less than 1500/μL
  - Normal urinalysis (if obtained)
  - If stool, less than 5 WBC per high-power field
  - Low-risk well-appearing: may consider outpatient management with close follow-up
  - Blood culture, urine culture (catheterized), consider lumbar puncture
  - Ceftriaxone 50 mg/kg IM and next-day follow-up OR observation without antibiotics with very close follow-up
  - High-risk or ill-appearing: admit for full sepsis workup and IV antibiotics (ampicillin + gentamicin or cefotaxime)
  - Infant 3-36 months - LOWER RISK (if fully immunized)
  - Fever greater than or equal to 102.2°F (39°C) warrants more evaluation
  - Well-appearing with no source: may observe without testing if reliable follow-up
  - Ill-appearing or concerning features: blood culture, urinalysis and culture, consider chest X-ray, lumbar puncture if meningitis concern
  - Empiric antibiotics if toxic-appearing or positive labs
  - Urine culture in all girls age less than 24 months and uncircumcised boys age less than 12 months with fever without source
  - Child greater than 36 months
  - Usually can identify source on history and exam
  - Testing and treatment based on identified source
  - Laboratory evaluation
  - Complete blood count (CBC) with differential
  - WBC greater than 15000/μL or less than 5000/μL concerning for bacterial infection
  - Absolute neutrophil count (ANC) greater than 10000/μL suggests bacterial infection
  - Inflammatory markers
  - C-reactive protein (CRP), procalcitonin - elevated in bacterial infections
  - Urinalysis and urine culture (catheterized or suprapubic, NOT bag specimen)
  - Blood culture
  - Lumbar puncture with CSF analysis (cell count, glucose, protein, Gram stain, culture)
  - If concern for meningitis (altered mental status, meningeal signs, ill-appearing young infant)
  - Chest X-ray if respiratory symptoms or hypoxia
  - Stool culture if bloody diarrhea
treatment:
  - Antipyretic therapy (for comfort, NOT to prevent febrile seizures)
  - Acetaminophen 15 mg/kg/dose PO every 4-6 hours (max 5 doses/24 hours)
  - Safe for age greater than or equal to 2 months
  - Ibuprofen 10 mg/kg/dose PO every 6 hours
  - Safe for age greater than or equal to 6 months
  - Do NOT alternate acetaminophen and ibuprofen routinely (risk dosing errors)
  - Aspirin CONTRAINDICATED (Reye syndrome risk)
  - Supportive care
  - Encourage oral fluids (prevent dehydration)
  - Light clothing (avoid bundling)
  - Rest
  - Empiric antibiotic therapy
  - Based on age and risk assessment (see above)
  - 'Neonates: ampicillin + gentamicin or ampicillin + cefotaxime'
  - 'Young infants 29 days to 3 months: ceftriaxone (if meningitis: ampicillin + cefotaxime)'
  - 'Children greater than 3 months: ceftriaxone (if meningitis: vancomycin + cefotaxime or ceftriaxone)'
  - Treatment of identified source
  - Antibiotics for bacterial infections (UTI, pneumonia, bacteremia, meningitis)
  - Supportive care for viral infections
  - Disposition
  - Neonates: admit all
  - Young infants: admit if high-risk, toxic-appearing, or positive labs
  - Children greater than 3 months: admit if toxic-appearing, dehydrated, unable to tolerate oral, unreliable follow-up
  - Anticipatory guidance
  - Fever is protective response, not harmful itself
  - Treat fever for comfort, not to prevent complications
  - When to return: altered mental status, difficulty breathing, rash with fever, inconsolable crying, not drinking, decreased urine output, fever persisting more than 3 days
clinical_pearls:
  - 'Fever in neonate (age less than 28 days) requires full sepsis workup and empiric antibiotics - ALWAYS admit'
  - 'Rectal temperature most accurate in infants - oral and tympanic less reliable, forehead/axillary unreliable'
  - 'Well-appearing clinical status most important factor - ill-appearing child requires evaluation regardless of age'
  - 'Fever does NOT cause brain damage - safe to treat for comfort but not mandatory'
  - 'Alternating acetaminophen and ibuprofen NOT recommended - increases risk of dosing errors'
  - 'Febrile seizures occur in 2-5% of children age 6 months to 5 years - antipyretics do NOT prevent febrile seizures'
  - 'Bundling or overdressing child with fever worsens hyperthermia - dress in light clothing'
  - 'Complete Hib/PCV13 immunization dramatically reduces risk occult bacteremia in febrile children - unimmunized children higher risk'
referrals:
  - Pediatric infectious disease if immunocompromised, recurrent fever without source, or unusual pathogen
  - Pediatric rheumatology if prolonged fever (greater than 2 weeks) without identified source (consider Kawasaki, JIA, autoinflammatory)
  - Pediatric hematology-oncology if fever with pancytopenia or hepatosplenomegaly (consider malignancy)
differentials:
  - Viral infection (most common - URI, gastroenteritis, viral syndrome)
  - Bacterial infection (UTI most common occult source in young children, also otitis media, pneumonia, bacteremia, meningitis)
  - Kawasaki disease (fever greater than 5 days, rash, conjunctivitis, mucositis, extremity changes, lymphadenopathy)
  - Urinary tract infection (most common serious bacterial infection in febrile infants without source)
  - Roseola infantum (high fever 3-5 days, followed by rash as fever resolves, age 6-24 months, caused by HHV-6)
  - Teething (causes low-grade temp less than 100.4°F/38°C, NOT true fever)
  - Immunization reaction (low-grade fever within 48 hours of vaccines, usually mild and self-limited)
  - Heat illness (environmental exposure, core temp elevation)
trace:
  source: AAP Febrile Infant Guidelines, UpToDate Pediatrics
