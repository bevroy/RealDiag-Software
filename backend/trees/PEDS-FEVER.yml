tree_id: PEDS-FEVER
name: Pediatric Fever Evaluation
family: PEDIATRICS
specialty: Pediatrics/Emergency Medicine
chief_complaint: Fever in Child
description: Diagnostic decision tree for pediatric fever evaluation
version: "1.0"
author: RealDiag Team
entry_point: age_assessment

nodes:
  - id: age_assessment
    type: question
    text: "Patient age?"
    options:
      - label: "<28 days (neonate)"
        next: neonate_fever
      - label: "28 days to 3 months"
        next: young_infant
      - label: "3-36 months"
        next: toddler_fever
      - label: ">36 months"
        next: older_child

  - id: neonate_fever
    type: question
    text: "Temperature and appearance?"
    options:
      - label: "Temp ≥38°C (100.4°F)"
        next: neonate_sepsis_workup
      - label: "Ill-appearing, lethargic, poor feeding"
        next: neonate_critical

  - id: neonate_sepsis_workup
    type: diagnosis
    diagnosis: Fever in Neonate (<28 days)
    icd10: P36.9
    urgency: critical
    workup:
      - Full sepsis workup
      - Blood culture
      - CBC with differential
      - Urinalysis and urine culture (cath or SPA)
      - Lumbar puncture (CSF cell count, glucose, protein, culture)
      - CXR if respiratory symptoms
      - Consider HSV testing (CSF PCR, skin lesions)
    treatment:
      - Hospital admission
      - Empiric antibiotics IV (ampicillin + gentamicin OR ampicillin + cefotaxime)
      - Add acyclovir if HSV risk (maternal HSV, vesicles, CSF pleocytosis, seizures)
      - NPO if ill-appearing
      - Close monitoring
      - Adjust antibiotics based on cultures
      - Duration based on source and organism

  - id: neonate_critical
    type: diagnosis
    diagnosis: Critically Ill Neonate
    icd10: P36.9
    urgency: critical
    workup:
      - Full sepsis workup (blood, urine, CSF cultures)
      - CBC, CMP, lactate
      - CXR
      - HSV testing
      - Consider head ultrasound
    treatment:
      - Immediate hospitalization
      - IV antibiotics (ampicillin + cefotaxime)
      - Acyclovir
      - Fluid resuscitation if needed
      - Respiratory support
      - NICU admission
      - Infectious disease consult

  - id: young_infant
    type: question
    text: "Risk stratification (Rochester, Philadelphia, Boston criteria)?"
    options:
      - label: "Low-risk (well-appearing, normal labs, no focal infection)"
        next: young_infant_low_risk
      - label: "High-risk (ill-appearing or abnormal labs)"
        next: young_infant_high_risk

  - id: young_infant_low_risk
    type: diagnosis
    diagnosis: Low-Risk Febrile Young Infant (28 days-3 months)
    icd10: R50.9
    urgency: high
    workup:
      - Blood culture
      - CBC (WBC 5-15K)
      - Urinalysis and urine culture (cath)
      - Consider lumbar puncture (recommended by many)
      - CXR if respiratory symptoms
    treatment:
      - May consider observation without antibiotics if truly low-risk
      - Many centers still admit for 24-48h observation
      - Ceftriaxone 50 mg/kg IM if LP not done and outpatient
      - Strict return precautions
      - Pediatrician follow-up in 24 hours
      - Readmit if cultures positive
      - Increasing trend toward outpatient management with close follow-up

  - id: young_infant_high_risk
    type: diagnosis
    diagnosis: High-Risk Febrile Young Infant (28 days-3 months)
    icd10: R50.9
    urgency: critical
    workup:
      - Full sepsis workup
      - Blood culture
      - CBC
      - Urinalysis and urine culture (cath)
      - Lumbar puncture
      - CXR if respiratory symptoms
    treatment:
      - Hospital admission
      - Empiric IV antibiotics (ampicillin + cefotaxime OR ceftriaxone)
      - Consider acyclovir if CSF abnormal or <6 weeks
      - Observe until cultures negative x 24-48 hours
      - Adjust antibiotics based on cultures

  - id: toddler_fever
    type: question
    text: "Source of fever identified?"
    options:
      - label: "Obvious source (URI, otitis, pharyngitis)"
        next: focal_infection
      - label: "Fever without source, well-appearing"
        next: fever_without_source
      - label: "Ill-appearing or toxic"
        next: serious_bacterial_infection

  - id: focal_infection
    type: diagnosis
    diagnosis: Fever with Identified Source
    icd10: R50.9
    urgency: low
    workup:
      - Based on source (throat culture, ear exam)
      - Urinalysis if <24 months or no clear source
    treatment:
      - Treat identified source
      - Antipyretics (acetaminophen 15 mg/kg q4-6h or ibuprofen 10 mg/kg q6h)
      - Antibiotics if indicated (otitis, strep pharyngitis)
      - Hydration
      - Return precautions
      - Pediatrician follow-up

  - id: fever_without_source
    type: question
    text: "Temperature and duration?"
    options:
      - label: "Temp ≥39°C (102.2°F)"
        next: high_fever_evaluation
      - label: "Temp <39°C, <3 days"
        next: observation

  - id: high_fever_evaluation
    type: diagnosis
    diagnosis: Fever Without Source ≥39°C (3-36 months)
    icd10: R50.9
    urgency: medium
    workup:
      - Urinalysis and urine culture (girls <24 mo, uncircumcised boys <12 mo, all <6 mo)
      - CBC if toxic or no source (WBC >15K concerning)
      - Blood culture if toxic
      - CXR if respiratory symptoms or WBC >20K
      - Consider occult bacteremia (less common post-PCV13)
    treatment:
      - Antipyretics
      - Hydration
      - May observe if well-appearing and vaccinated
      - Consider ceftriaxone if high-risk and unable to follow-up
      - Close follow-up in 24 hours
      - Admit if toxic or positive cultures

  - id: observation
    type: diagnosis
    diagnosis: Fever Without Source <39°C
    icd10: R50.9
    urgency: low
    workup:
      - Usually none if well-appearing
      - Consider urinalysis if <24 months
    treatment:
      - Antipyretics for comfort
      - Hydration
      - Return precautions
      - Pediatrician follow-up if fever persists >3-5 days

  - id: serious_bacterial_infection
    type: diagnosis
    diagnosis: Suspected Serious Bacterial Infection
    icd10: A49.9
    urgency: critical
    workup:
      - Full sepsis workup
      - Blood culture
      - CBC, CMP
      - Urinalysis, urine culture
      - Lumbar puncture if meningitis suspected
      - CXR
    treatment:
      - Hospital admission
      - IV antibiotics (ceftriaxone 50-100 mg/kg/day)
      - IV fluids
      - Supportive care
      - Adjust based on cultures
      - ICU if septic or hemodynamically unstable

  - id: older_child
    type: question
    text: "Clinical presentation?"
    options:
      - label: "Obvious viral syndrome (URI, viral exanthem)"
        next: viral_illness
      - label: "Fever >5 days"
        next: prolonged_fever
      - label: "Ill-appearing"
        next: serious_infection_older

  - id: viral_illness
    type: diagnosis
    diagnosis: Viral Illness
    icd10: J06.9
    urgency: low
    workup:
      - Usually clinical diagnosis
      - Rapid strep if pharyngitis
      - Influenza test if indicated
    treatment:
      - Supportive care
      - Antipyretics
      - Hydration
      - Return if not improving in 3-5 days
      - Oseltamivir if influenza and <48 hours

  - id: prolonged_fever
    type: diagnosis
    diagnosis: Prolonged Fever (>5 days)
    icd10: R50.9
    urgency: medium
    workup:
      - CBC with differential
      - ESR, CRP
      - Blood culture
      - Urinalysis, urine culture
      - CXR
      - Consider Kawasaki disease (fever >5 days + rash, conjunctivitis, mucositis, lymphadenopathy)
      - Consider EBV, CMV testing
      - Infectious disease consult if fever >7 days
    treatment:
      - Evaluate for Kawasaki disease
      - IVIG if Kawasaki confirmed
      - Treat based on identified source
      - Admit if concerning features
      - Close follow-up

  - id: serious_infection_older
    type: diagnosis
    diagnosis: Serious Infection in Older Child
    icd10: A49.9
    urgency: high
    workup:
      - CBC, CMP
      - Blood culture
      - Urinalysis
      - CXR
      - Lumbar puncture if meningismus
    treatment:
      - Hospital admission
      - IV antibiotics (ceftriaxone)
      - IV fluids
      - Supportive care
      - Adjust based on cultures and clinical course
