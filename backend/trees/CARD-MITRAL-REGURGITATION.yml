tree_id: CARD-MITRAL-REGURGITATION
name: Mitral Regurgitation (MR)
family: Cardiology
specialty: Cardiology
icd10:
- I34.0
- I05.1
snomed:
- '48724000'
urgency: medium
description: Comprehensive evaluation and management of Mitral Regurgitation (MR)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Holosystolic murmur at apex, radiates to axilla
- Dyspnea, orthopnea, fatigue (symptoms of pulmonary congestion)
- May have laterally displaced, hyperdynamic PMI (chronic MR with LV dilation)
- 'Acute MR: Sudden onset dyspnea, pulmonary edema, cardiogenic shock'
- 'Chronic MR: Gradual onset, may be asymptomatic for years'
- 'Etiologies: Primary (valve disease - MVP, rheumatic), secondary (LV dilation, ischemic)'
workup:
- Echocardiogram (assess severity, LV size/function, mechanism)
- Chest X-ray (cardiomegaly, pulmonary edema)
- ECG (LVH, LA enlargement)
- TEE for surgical planning
- Cardiac catheterization if CAD evaluation needed
treatment:
- 'Guideline-based treatment options for Mitral Regurgitation (MR) include:'
- 'Acute severe MR: ICU, inotropes, IABP, emergent surgery (ACC/AHA 2023)'
- 'Chronic primary MR: Surgery if symptomatic, EF <60%, or progressive LV dilation
  (ACC/AHA 2023)'
- 'Secondary MR: Optimize HF therapy (ACEi, BB, diuretics, SGLT2i) (ACC/AHA 2023)'
- 'Afterload reduction: ACEi or hydralazine/nitrates (ACC/AHA 2023)'
- 'Consider: MitraClip for high surgical risk or secondary MR (ACC/AHA 2023)'
clinical_pearls:
- 'Acute severe MR: Medical emergency (papillary muscle rupture post-MI, endocarditis)'
- 'Chronic primary MR: Surgery if symptomatic or LVEF <60% or LVESD >40mm'
- 'Secondary (functional) MR: Optimize HF meds, consider MitraClip'
- 'MVP with severe MR: Repair preferred over replacement (better outcomes)'
- Afterload reduction (ACEi) helps in chronic MR
referrals:
- Cardiology for moderate-severe MR
- Cardiac surgery for severe symptomatic MR or LV dysfunction
differentials: []
