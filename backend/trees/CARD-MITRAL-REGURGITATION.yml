tree_id: CARD-MITRAL-REGURGITATION
name: Mitral Regurgitation
family: Cardiology
specialty: Cardiology
chief_complaint: Dyspnea and fatigue with holosystolic murmur
description: |
  Mitral valve insufficiency allows backflow from left ventricle to left atrium. Primary MR (valve pathology), secondary/functional MR (normal valve but LV dilation/dysfunction).
  Causes include mitral valve prolapse, rheumatic heart disease, endocarditis, ischemic (papillary muscle dysfunction), degenerative. Chronic MR tolerated for years, acute MR causes pulmonary edema.
icd10: I34.0
urgency: Moderate
workup:
  - Transthoracic echocardiogram (TTE) diagnostic - assess severity, mechanism, LV function, LV size
  - Severity grading - mild, moderate, severe based on jet area, regurgitant volume, regurgitant orifice area, vena contracta width
  - Severe MR criteria - regurgitant volume greater than 60 mL, regurgitant fraction greater than 50%, effective regurgitant orifice area (EROA) greater than 0.4 cm2
  - Assess valve morphology - primary (leaflet abnormality, prolapse, flail, vegetations) vs secondary (restricted motion, tethering from LV remodeling)
  - Transesophageal echo (TEE) for better visualization, surgical planning
  - Measure LV dimensions and ejection fraction - chronic MR causes volume overload leading to LV dilation
  - Left atrial size - chronic MR causes LA enlargement
  - Physical exam - holosystolic murmur at apex radiating to axilla, soft S1, S3 gallop, hyperdynamic PMI
  - ECG - left atrial enlargement (P mitrale), atrial fibrillation common, LVH if chronic severe
  - Chest X-ray - cardiomegaly, LA enlargement, pulmonary congestion if decompensated
  - Exercise stress echo if symptoms unclear with moderate-severe MR
  - Cardiac catheterization before surgery - coronary angiography to assess for CAD (concomitant CABG if needed)
treatment:
  - Asymptomatic chronic severe primary MR - observation with serial echos every 6-12 months if LV function preserved (EF greater than 60%, LVESD less than 40 mm)
  - Mitral valve surgery indications - symptomatic severe MR, asymptomatic with LV dysfunction (EF 30-60% or LVESD greater than 40 mm), new atrial fibrillation, pulmonary hypertension
  - Mitral valve repair preferred over replacement - lower mortality, better LV function, no anticoagulation needed (if sinus rhythm), 90-95% feasible for degenerative MR
  - Mitral valve replacement if repair not feasible - mechanical valve (lifelong warfarin) or bioprosthetic (no warfarin but degenerates over 10-15 years)
  - Transcatheter edge-to-edge repair (MitraClip) for high surgical risk patients with symptomatic severe primary MR or secondary MR despite optimal medical therapy
  - Secondary/functional MR - optimize heart failure treatment first (ACE inhibitor/ARB, beta-blocker, diuretics), cardiac resynchronization therapy if eligible
  - Consider surgery if severe secondary MR persisting despite optimal medical therapy and undergoing CABG
  - Acute severe MR (papillary muscle rupture from MI, chordae rupture, endocarditis) - medical stabilization (vasodilators, diuretics, intra-aortic balloon pump) then urgent surgery
  - Atrial fibrillation management - rate control, anticoagulation
  - Endocarditis prophylaxis not routinely recommended (only if prosthetic valve or prior endocarditis)
clinical_pearls:
  - Mitral valve prolapse most common cause in developed countries - myxomatous degeneration, click-murmur on exam
  - Rheumatic heart disease most common worldwide - mixed stenosis and regurgitation
  - Acute papillary muscle rupture complication of inferior MI (posteromedial papillary muscle) - cardiogenic shock, urgent surgery
  - Carpentier classification - Type I (normal leaflet motion, annular dilation), Type II (excessive motion, prolapse, flail), Type III (restricted motion, rheumatic or ischemic)
  - Chronic severe MR compensated by LV dilation (large compliant LA, increased preload), sudden deterioration if AF develops or LV fails
  - Surgery timing critical - waiting until symptoms or severe LV dysfunction reduces survival benefit
differentials:
  - Tricuspid regurgitation
  - Aortic stenosis
  - Hypertrophic cardiomyopathy
  - Ventricular septal defect
  - Mitral stenosis
trace:
  - 65-year-old man with progressive dyspnea on exertion x 1 year, orthopnea → Exam shows holosystolic murmur at apex radiating to axilla, laterally displaced PMI → ECG shows atrial fibrillation, left atrial enlargement → Echo shows severe MR (EROA 0.5 cm2, regurgitant volume 70 mL), posterior leaflet flail from ruptured chordae, dilated LV (LVESD 42 mm), LVEF 58%, dilated LA → Symptomatic severe primary MR with borderline LV dilation → Coronary angiography shows no significant CAD → TEE confirms posterior leaflet P2 flail, favorable for repair → Mitral valve repair with posterior leaflet resection and annuloplasty ring → Maze procedure for AF → Postop echo shows trace residual MR, improved LV function → Amiodarone for rhythm control, warfarin for AF and recent surgery → Sinus rhythm at 3 months, excellent functional capacity
