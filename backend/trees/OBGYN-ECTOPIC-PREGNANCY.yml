tree_id: OBGYN-ECTOPIC-PREGNANCY
name: Ectopic Pregnancy
family: OBSTETRICS
specialty: Obstetrics/Gynecology, Emergency Medicine
chief_complaint: Abdominal Pain in Pregnant Woman, Vaginal Bleeding
description: Early detection and management of ectopic pregnancy to prevent rupture and hemorrhage
version: "1.0"
icd10: O00.90
author: RealDiag Clinical Team

entry_point: ectopic_screening

nodes:
  - id: ectopic_screening
    type: question
    text: "Woman of reproductive age with concerning symptoms?"
    options:
      - label: "Positive pregnancy test + severe abdominal pain + hypotension/shock"
        next: ruptured_ectopic
      - label: "Positive pregnancy test + abdominal pain or vaginal bleeding"
        next: ectopic_workup
      - label: "Positive pregnancy test, asymptomatic early pregnancy"
        next: early_pregnancy_evaluation

  - id: ruptured_ectopic
    type: diagnosis
    name: "Ruptured Ectopic Pregnancy with Hemorrhage"
    icd10: "O00.91"
    urgency: critical
    workup:
      - STAT quantitative beta-hCG
      - CBC, type and cross-match 4 units PRBCs
      - Coagulation studies
      - CMP
      - Portable ultrasound (FAST exam) - free fluid in abdomen
      - DO NOT delay surgery for formal ultrasound if patient unstable
    treatment:
      - IMMEDIATE RESUSCITATION
      - Two large-bore IVs (18g or larger)
      - Aggressive crystalloid resuscitation (2L NS bolus)
      - Type O-negative blood if needed emergently
      - Cross-matched blood when available
      - STAT OB/GYN consultation for EMERGENT laparoscopy or laparotomy
      - Prepare for OR immediately
      - Methotrexate contraindicated in ruptured ectopic
      - Surgical options
        - Salpingectomy (remove affected tube) - most common
        - Salpingostomy (remove ectopic, preserve tube) - if fertility preservation desired and stable
      - Post-operative monitoring in ICU
      - "RhoGAM 50 mcg if Rh-negative and <12 weeks, 300 mcg if >12 weeks"
    prognosis: "Life-threatening; mortality <1% with prompt surgery but requires immediate intervention"

  - id: ectopic_workup
    type: diagnosis
    name: "Suspected Ectopic Pregnancy"
    icd10: "O00.9"
    urgency: emergency
    workup:
      - Quantitative beta-hCG (serum)
      - Transvaginal ultrasound (GOLD STANDARD)
        - Normal intrauterine pregnancy - gestational sac visible at hCG 1500-2000 mIU/mL
        - "Ectopic signs - adnexal mass, free fluid, empty uterus with hCG >2000"
        - Discriminatory zone - hCG level above which IUP should be visible (1500-2000)
      - CBC (assess for anemia from bleeding)
      - Blood type and screen (for RhoGAM)
      - CMP
      - "Progesterone level (if hCG less than 1500 and no IUP visible) - Progesterone over 25 ng/mL likely viable IUP, Progesterone under 5 ng/mL likely non-viable (ectopic or miscarriage)"
      - Serial hCG if diagnosis uncertain (q48h) - Normal pregnancy hCG should double every 48-72 hours, Ectopic or miscarriage shows inadequate rise or plateau
    treatment:
      - DETERMINE TREATMENT APPROACH based on:
        - Clinical stability
        - hCG level
        - Ectopic size and location
        - Desire for future fertility
      - Medical Management (Methotrexate) - IF STABLE and meets criteria:
        - Hemodynamically stable
        - No signs of rupture (no free fluid, no severe pain)
        - "hCG <5000 mIU/mL (ideally <2000)"
        - "Ectopic mass <3.5 cm"
        - No fetal cardiac activity
        - Patient reliable for follow-up
        - Normal liver and kidney function, no contraindications
        - Methotrexate Protocol:
          - "Single dose: 50 mg/m² IM (check hCG day 4 and 7, should drop >15%)"
          - If inadequate drop, give second dose
          - Monitor weekly hCG until undetectable
          - Strict contraception for 3 months after
          - Avoid folic acid, NSAIDs, alcohol
          - Return immediately if severe pain
      - Surgical Management - PREFERRED if:
        - Hemodynamically unstable
        - Ruptured ectopic
        - "hCG >5000 mIU/mL"
        - Fetal cardiac activity present
        - "Large ectopic mass >4 cm"
        - Patient unreliable for follow-up
        - Failed methotrexate
        - Interstitial, cornual, or cervical ectopic
        - Surgical options:
          - Laparoscopy (preferred) - salpingostomy or salpingectomy
          - Laparotomy if unstable or extensive adhesions
      - Expectant Management (Rarely Used)
        - "Very low and declining hCG (<200-1000)"
        - No symptoms or minimal symptoms
        - Patient willing for close monitoring
        - 70% chance of spontaneous resolution
        - Weekly hCG monitoring
      - All Patients:
        - RhoGAM if Rh-negative
        - Emotional support/counseling
        - Contraception counseling
        - Discuss future pregnancy planning
    prognosis: "Overall survival excellent; future fertility 60% after one ectopic; risk of repeat ectopic 10-15%"

  - id: early_pregnancy_evaluation
    type: diagnosis
    name: "Early Pregnancy - Location To Be Determined"
    icd10: "O09.00"
    urgency: moderate
    workup:
      - Quantitative beta-hCG
      - Transvaginal ultrasound
      - "If IUP not visible and hCG under 2000 - Repeat hCG in 48 hours, Repeat ultrasound when hCG over 2000"
    treatment:
      - Confirm intrauterine pregnancy
      - If unable to confirm IUP:
        - Ectopic precautions - avoid strenuous activity
        - Return for worsening pain, bleeding, dizziness
        - Close follow-up with serial hCG
        - Repeat ultrasound when appropriate
      - Start prenatal vitamins
      - Schedule OB follow-up
    prognosis: "Depends on pregnancy location confirmation"

clinical_pearls:
  - "Ectopic pregnancy occurs in 1-2% of pregnancies"
  - "Risk factors: prior ectopic, tubal surgery, PID, endometriosis, IUD, smoking, advanced maternal age"
  - "Classic triad: abdominal pain, vaginal bleeding, amenorrhea (only 50% present with all three)"
  - "Any Rh-negative woman with bleeding in pregnancy needs RhoGAM"
  - "hCG discriminatory zone varies by institution (1500-2000 mIU/mL)"
  - "90% of ectopic pregnancies occur in fallopian tube"
  - "Interstitial and cornual ectopics are rare but highest risk of rupture"
  - "After methotrexate, hCG may initially rise before falling"

red_flags:
  - "Hypotension or tachycardia (suggests rupture)"
  - "Severe abdominal pain"
  - "Shoulder pain (blood irritating diaphragm)"
  - "Syncope or near-syncope"
  - "Peritoneal signs on exam"
  - "Falling hemoglobin"
  - "Large amount of free fluid on ultrasound"
