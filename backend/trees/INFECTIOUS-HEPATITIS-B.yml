tree_id: INFECTIOUS-HEPATITIS-B
name: Hepatitis B
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Fatigue, jaundice, abdominal pain, elevated liver enzymes
description: Viral infection of liver caused by hepatitis B virus (HBV), transmitted through blood/body fluids, can cause acute or chronic hepatitis with risk of cirrhosis and hepatocellular carcinoma
icd10: B18.1
snomed: 76795007
urgency: medium
workup:
  - Virology - Hepatitis B virus (HBV), enveloped DNA virus, Hepadnaviridae family
  - Transmission - Blood/body fluids (sexual, IVDU, perinatal mother-to-child, occupational needlestick), NOT fecal-oral
  - Perinatal transmission - 90% become chronic if infected at birth (immune tolerance), main mode in endemic areas
  - Sexual transmission - Most common in US adults
  - Incubation period 30-180 days (average 60-90 days)
  - Epidemiology
  - Global prevalence 250-300 million chronic HBV (3-5% world population)
  - Endemic regions - Asia, sub-Saharan Africa, Pacific Islands (>8% prevalence)
  - US prevalence 0.3-0.5% (850,000-2.2 million), higher in immigrants from endemic areas
  - Clinical presentation - Ranges from asymptomatic to fulminant hepatic failure
  - Acute hepatitis B (95% adults infected)
  - Asymptomatic - 70% subclinical infection
  - Symptomatic (30%) - Prodrome (fatigue, malaise, anorexia, nausea, low-grade fever, arthralgia), icteric phase (jaundice, dark urine, pale stools, RUQ pain, hepatomegaly), recovery (symptoms resolve 1-3 months)
  - Severe acute hepatitis - Marked transaminitis (ALT/AST >1000), prolonged PT/INR, encephalopathy (rare, <1% develop fulminant hepatic failure)
  - Resolution - 95% adults clear virus (HBsAg negative, anti-HBs positive), lifelong immunity
  - Chronic hepatitis B (5% adults, 90% infants infected) - HBsAg positive >6 months
  - Immune tolerant - High HBV DNA, normal ALT, minimal inflammation (young patients, perinatally acquired), can last decades
  - Immune active - Elevated ALT, active inflammation, fibrosis progression, HBeAg positive or negative
  - Inactive carrier - Low/undetectable HBV DNA, normal ALT, HBsAg positive, anti-HBe positive, minimal disease activity
  - Reactivation - Can occur with immunosuppression (chemotherapy, immunosuppressants, biologics)
  - Complications chronic HBV
  - Cirrhosis - 15-40% chronic HBV develop cirrhosis over 20-30 years, accelerated by alcohol, co-infection HCV/HIV/HDV
  - Hepatocellular carcinoma (HCC) - 100-fold increased risk, can occur without cirrhosis (unlike HCV), annual incidence 2-5% if cirrhosis
  - Extrahepatic manifestations - Polyarteritis nodosa, membranous glomerulonephritis, cryoglobulinemia
  - Laboratory evaluation - Serologic markers (pattern determines stage)
  - HBsAg (hepatitis B surface antigen) - First marker detected (2-8 weeks post-exposure), indicates active infection (acute or chronic)
  - Positive <6 months = acute, >6 months = chronic
  - Anti-HBs (antibody to HBsAg) - Indicates recovery and immunity (natural or vaccine-induced), appears 1-4 months after HBsAg clears
  - Mutually exclusive with HBsAg (cannot be positive simultaneously)
  - Anti-HBc total (antibody to core antigen) - Indicates past or present infection (not produced by vaccine)
  - Positive = natural infection (not vaccine), persists lifelong
  - Anti-HBc IgM - Indicates acute or recent infection, present during acute phase, declines after 6-12 months
  - HBeAg (e antigen) - Marker of active viral replication and high infectivity
  - Positive = high HBV DNA, increased transmission risk
  - Anti-HBe - Indicates lower viral replication, seroconversion (HBeAg to anti-HBe) favorable prognostic sign in chronic HBV
  - HBV DNA (quantitative PCR) - Direct measure viral load, used to monitor disease activity and treatment response
  - High DNA >2000 IU/mL indicates active replication
  - Serologic patterns
  - Acute HBV - HBsAg positive, anti-HBc IgM positive, anti-HBs negative, HBeAg positive
  - Chronic HBV - HBsAg positive, anti-HBc IgG positive, anti-HBs negative, HBeAg variable
  - Resolved/immune - HBsAg negative, anti-HBs positive, anti-HBc positive
  - Vaccinated - HBsAg negative, anti-HBs positive, anti-HBc negative
  - Window period - HBsAg negative, anti-HBs negative, anti-HBc IgM positive (brief period during seroconversion)
  - Liver function tests
  - ALT/AST - Elevated (ALT usually higher, 10-100x normal in acute, variable in chronic)
  - Bilirubin - Elevated if icteric
  - PT/INR - Prolonged if severe acute hepatitis or cirrhosis
  - Albumin, platelets - Assess synthetic function and portal hypertension (chronic)
  - Imaging
  - Ultrasound - Screen for HCC in chronic HBV (every 6 months), assess cirrhosis, ascites
  - CT/MRI - Characterize liver lesions
  - Liver biopsy - Consider if unclear diagnosis, assess fibrosis/inflammation, not routinely needed (non-invasive fibrosis markers FibroScan, FIB-4, APRI often sufficient)
treatment:
  - Acute hepatitis B - SUPPORTIVE care, most resolve spontaneously
  - Rest, hydration, avoid alcohol, hepatotoxic drugs
  - Monitor liver function, PT/INR
  - Antiviral therapy NOT routinely indicated (self-limited 95%), consider if fulminant hepatitis or prolonged cholestasis
  - Post-exposure prophylaxis - Unvaccinated exposed to HBV
  - HBIG (hepatitis B immune globulin) 0.06 mL/kg IM within 24 hours (ideally <7 days)
  - PLUS HBV vaccine series (0, 1, 6 months)
  - Indications - Percutaneous/mucosal exposure to HBsAg-positive blood, sexual exposure, perinatal exposure (newborn of HBsAg+ mother)
  - Chronic hepatitis B - Goal suppress viral replication, prevent cirrhosis/HCC
  - Treatment indications
  - HBeAg positive with HBV DNA >20,000 IU/mL and ALT >2x ULN
  - HBeAg negative with HBV DNA >2000 IU/mL and ALT >2x ULN
  - Compensated cirrhosis with detectable HBV DNA (any level)
  - Decompensated cirrhosis - Immediate treatment regardless of HBV DNA
  - Pregnant women with HBV DNA >200,000 IU/mL (third trimester, prevent perinatal transmission)
  - Immunosuppressive therapy planned (prevent reactivation)
  - First-line antiviral agents
  - Tenofovir disoproxil fumarate (TDF) 300 mg daily - High barrier to resistance, potent, preferred
  - Tenofovir alafenamide (TAF) 25 mg daily - Fewer renal/bone toxicities than TDF, preferred if CKD/osteoporosis
  - Entecavir 0.5 mg daily - High barrier to resistance, potent, preferred (avoid if prior lamivudine resistance)
  - Duration - Usually lifelong (relapse common if stopped), consider stopping if HBsAg loss (rare, <1%/year)
  - Peginterferon alfa-2a - Alternative to oral antivirals (finite duration 48 weeks, but lower sustained response 20-30%, more side effects)
  - Preferred if young, non-cirrhotic, high ALT, low HBV DNA, genotype A
  - Contraindicated if decompensated cirrhosis, autoimmune disease, psychiatric illness
  - Monitoring on treatment
  - HBV DNA every 3-6 months (goal undetectable <20 IU/mL)
  - ALT every 3-6 months
  - HBsAg, HBeAg annually (monitor for seroconversion)
  - HCC surveillance - Ultrasound every 6 months if cirrhosis, Asian male >40, Asian female >50, African descent >20, family history HCC
  - Prevention
  - Vaccination - Recombinant HBsAg vaccine (Engerix-B, Recombivax HB), 3-dose series (0, 1, 6 months), >90% seroconversion
  - Universal infant vaccination, catch-up for adolescents, high-risk adults (healthcare workers, IVDU, MSM, chronic liver disease, HIV, immunosuppressed)
  - Check anti-HBs titer 1-2 months after series, >10 mIU/mL protective
  - Safe practices - Screen blood products, safe sex, avoid needle sharing
  - Perinatal prevention - Screen all pregnant women for HBsAg, if positive give newborn HBIG + vaccine within 12 hours birth (>90% prevention)
clinical_pearls:
  - HBsAg positive >6 months defines chronic hepatitis B (90% if infected at birth, 5% if adult)
  - All chronic HBV need HCC surveillance every 6 months with ultrasound (risk even without cirrhosis)
  - Tenofovir or entecavir are first-line agents (high barrier to resistance, potent)
  - Pregnant women with high HBV DNA (>200,000 IU/mL) need antiviral in third trimester to prevent perinatal transmission
  - HBV reactivation can occur with immunosuppression - screen before chemotherapy, consider prophylaxis
  - Anti-HBc alone (isolated) indicates past infection with waned anti-HBs or occult HBV - check HBV DNA
differentials:
  - INFECTIOUS-HEPATITIS-A
  - INFECTIOUS-HEPATITIS-C
  - INFECTIOUS-MONONUCLEOSIS
  - GI-ACUTE-LIVER-FAILURE
  - GI-ALCOHOLIC-HEPATITIS
trace:
  - Fatigue, jaundice, elevated ALT/AST
  - HBsAg positive (acute or chronic)
  - Anti-HBc IgM if acute infection
  - Monitor HBV DNA and ALT, screen for HCC if chronic
