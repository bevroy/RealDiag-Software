tree_id: CARDS-HYPERTROPHIC-CARDIOMYOPATHY
name: Hypertrophic Cardiomyopathy (HCM)
family: Cardiology
specialty: Cardiology
chief_complaint: Shortness of breath and chest pain with exertion
description: Genetic disorder causing asymmetric LV hypertrophy and dynamic LVOT obstruction, leading cause of sudden cardiac death in young athletes. Systolic murmur increases with Valsalva. Beta blockers or disopyramide for symptoms, ICD for high-risk patients, septal reduction therapy for refractory obstruction.
icd10: I42.1
urgency: urgent

workup:
  - Symptoms: often asymptomatic, discovered on screening
  - Dyspnea: exertional dyspnea from diastolic dysfunction
  - Chest pain: exertional angina (increased oxygen demand, microvascular ischemia, systolic compression of coronaries)
  - Syncope: exertional syncope or presyncope from dynamic LVOT obstruction
  - Palpitations: atrial fibrillation (20-25%), ventricular arrhythmias
  - Sudden cardiac death: ventricular fibrillation, most feared complication, often first presentation in young athletes
  - Family history: autosomal dominant inheritance (50% if parent affected), sudden death in relatives
  - Physical exam:
  - Systolic murmur: harsh, at left sternal border, does NOT radiate to carotids
  - Increases with Valsalva or standing (decreases preload, worsens obstruction)
  - Decreases with squatting or leg raise (increases preload, reduces obstruction)
  - Opposite of most murmurs (distinguishes HCM from AS)
  - Bisferiens pulse: double systolic peak (brisk rise then obstruction then second peak)
  - S4 gallop: stiff LV from hypertrophy
  - Displaced PMI: LV hypertrophy
  - Echocardiogram (diagnostic):
  - Asymmetric septal hypertrophy: septum over 15 mm (normal below 12 mm), septal/posterior wall ratio over 1.3
  - Systolic anterior motion (SAM) of mitral valve: anterior mitral leaflet pulled into LVOT during systole
  - LVOT gradient: peak gradient over 30 mmHg at rest or over 50 mmHg with provocation (Valsalva, exercise)
  - Mitral regurgitation: from SAM displacing mitral valve
  - Small LV cavity with hyperdynamic function
  - Diastolic dysfunction: impaired relaxation
  - ECG: LV hypertrophy with deep T wave inversions in lateral leads (V4-V6), deep Q waves (septal depolarization), left atrial enlargement
  - Cardiac MRI: gold standard for quantifying hypertrophy, identify patterns, detect apical variant, late gadolinium enhancement (scar predicts arrhythmia risk)
  - Genetic testing: sarcomeric protein mutations (MYH7, MYBPC3 most common), recommended for all patients and family screening
  - Sudden cardiac death risk stratification (5 major risk factors):
  - Family history of sudden cardiac death
  - Unexplained syncope
  - Non-sustained VT on Holter monitor
  - Abnormal BP response to exercise (failure to rise or drop)
  - Severe LV hypertrophy (wall thickness over 30 mm)
  - If 1 or more risk factors: consider ICD

treatment:
  - Avoid strenuous exercise: competitive sports contraindicated (risk sudden cardiac death)
  - Avoid dehydration and vasodilators: decrease preload worsens obstruction
  - Beta blockers (first-line for symptoms):
  - Metoprolol 50-200 mg daily or propranolol 80-160 mg daily
  - Negative inotrope reduces obstruction, improves diastolic filling
  - Calcium channel blockers:
  - Verapamil 240-480 mg daily (non-dihydropyridine)
  - If beta blockers ineffective or contraindicated
  - Avoid dihydropyridines (nifedipine) - vasodilate and worsen obstruction
  - Disopyramide:
  - Class IA antiarrhythmic with negative inotropic effects
  - 300-600 mg daily for refractory LVOT obstruction
  - Side effects: dry mouth, urinary retention (anticholinergic)
  - Add to beta blocker if symptoms persist
  - Septal reduction therapy (for severe refractory symptoms with LVOT gradient over 50 mmHg):
  - Surgical septal myectomy: remove portion of hypertrophied septum, most definitive, mortality below 1% at experienced centers
  - Alcohol septal ablation: inject alcohol into septal perforator artery causes controlled MI of septum, less invasive but requires pacemaker in 10-20%
  - ICD (implantable cardioverter-defibrillator):
  - Primary prevention if high risk: 1 or more major risk factors for sudden cardiac death
  - Secondary prevention: survived cardiac arrest or sustained VT
  - Most effective intervention to prevent sudden death
  - Atrial fibrillation management:
  - High stroke risk: anticoagulate with warfarin (INR 2-3) or DOAC regardless of CHA2DS2-VASc score
  - Rate control: beta blockers preferred
  - Rhythm control: amiodarone if needed (avoid class IC like flecainide)
  - Heart failure management:
  - Diuretics cautiously for volume overload (avoid overdiuresis)
  - Avoid ACE inhibitors and vasodilators (decrease preload, worsen obstruction)
  - If end-stage with low EF: treat as systolic heart failure (burnt-out HCM)
  - Family screening: first-degree relatives get echo and ECG, genetic testing if mutation identified

clinical_pearls:
  - Asymmetric septal hypertrophy causing dynamic LVOT obstruction
  - Systolic murmur increases with Valsalva (opposite of AS)
  - Leading cause of sudden cardiac death in young athletes
  - Beta blockers first-line for symptoms
  - ICD if high risk for sudden death (family history, syncope, VT, abnormal exercise BP)
  - Avoid strenuous exercise, dehydration, vasodilators
  - Septal myectomy for severe refractory symptoms
  - Autosomal dominant, screen first-degree relatives

differentials:
  - Aortic stenosis: systolic murmur decreases with Valsalva, radiates to carotids
  - Athlete heart: physiologic hypertrophy, symmetric, wall thickness below 13 mm, normal diastolic function
  - Hypertensive heart disease: concentric hypertrophy, history of hypertension
  - Infiltrative cardiomyopathy: amyloid causes hypertrophy but low voltage on ECG

trace: |
  A 22-year-old college athlete presented for sports clearance physical. Asymptomatic. Father died suddenly at age 38 while jogging (family history sudden cardiac death). Exam: harsh 3/6 systolic murmur at left sternal border, increased with Valsalva and standing (decreased with squatting - classic for HCM), S4 gallop. ECG: LV hypertrophy with deep T wave inversions in V4-V6 (lateral leads), deep Q waves in inferior leads. Echocardiogram: asymmetric septal hypertrophy with septum 22 mm (normal below 12, severe hypertrophy), posterior wall 10 mm, septal/posterior ratio 2.2 (over 1.3 diagnostic), systolic anterior motion of mitral valve (SAM - anterior leaflet pulled into LVOT), resting LVOT gradient 45 mmHg (over 30 significant), gradient increased to 85 mmHg with Valsalva (provoked obstruction), hyperdynamic LV function EF 75%, diastolic dysfunction. Diagnosed with obstructive hypertrophic cardiomyopathy (asymmetric septal hypertrophy, LVOT gradient, SAM, positive family history). Sudden cardiac death risk stratification: family history of sudden death in father (major risk factor - ICD indicated). 48-hour Holter monitor: brief runs of non-sustained VT (second major risk factor). Exercise stress test: abnormal BP response (BP failed to rise normally with exercise - third major risk factor). THREE major risk factors for sudden death: HIGH RISK. Genetic testing: MYH7 mutation (sarcomeric protein, confirms diagnosis). Started metoprolol 50 mg BID (beta blocker first-line). Disqualified from competitive sports (basketball) - devastating news but necessary to prevent sudden death. At 2 weeks symptoms minimal (was asymptomatic), metoprolol dose acceptable. ICD implanted for primary prevention given high sudden death risk (three risk factors). At 1 month adjusting to lifestyle changes, understanding importance of ICD. Referred to genetic counseling, family screening initiated. Mother and sister both underwent echo and genetic testing: sister positive for same mutation, asymptomatic with mild hypertrophy (septum 14 mm), started beta blocker and exercise restriction. At 6 months doing well on metoprolol, no ICD shocks. Annual echo monitoring, exercise stress test. At 2 years ICD fired once for ventricular fibrillation during emotional stress - ICD saved his life (justified implantation). Continues metoprolol, ICD monitoring every 6 months, leading normal life avoiding competitive sports.
