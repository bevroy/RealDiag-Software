tree_id: GI-PANCREATITIS-ACUTE
name: Acute Pancreatitis
family: Gastrointestinal
specialty: Gastroenterology
chief_complaint: Severe abdominal pain
description: Acute inflammation of pancreas causing severe epigastric pain, nausea, vomiting, and elevated pancreatic enzymes

icd10: K85.90

urgency: emergent

workup:
  - Clinical presentation: severe epigastric abdominal pain (acute onset, constant, boring), radiates to back, nausea, vomiting, anorexia, unable to find comfortable position
  - Exam: epigastric tenderness, abdominal distension, decreased bowel sounds, tachycardia, fever, hypotension if severe, Cullen sign (periumbilical ecchymosis) or Grey Turner sign (flank ecchymosis) rare but indicate hemorrhagic pancreatitis
  - Diagnosis requires 2 of 3 criteria: characteristic abdominal pain, serum lipase or amylase greater than 3 times upper limit normal, characteristic findings on CT/MRI/ultrasound
  - Laboratory: lipase elevated (more specific than amylase, remains elevated longer), amylase elevated (less specific, normalizes faster), elevated transaminases suggest biliary etiology (ALT greater than 150 U/L 95 percent specific for gallstone pancreatitis), bilirubin elevated if choledocholithiasis, triglycerides if greater than 1000 mg/dL can cause pancreatitis
  - Assess severity: CBC (leukocytosis, hematocrit elevation suggests hemoconcentration), CMP (creatinine elevation suggests prerenal azotemia from volume depletion, BUN elevation, calcium low if severe), LDH elevated, glucose elevated
  - Ranson criteria or BISAP score predict severity: BISAP (BUN greater than 25, Impaired mental status, SIRS, Age greater than 60, Pleural effusion) - score 3-5 suggests severe pancreatitis with high mortality
  - Imaging: CT abdomen with IV contrast after 48-72 hours (initial CT may be normal, delayed CT shows necrosis, fluid collections, complications), ultrasound right upper quadrant (identify gallstones as etiology, dilated CBD), MRCP if concern for choledocholithiasis
  - Etiology: gallstones (40 percent most common), alcohol (30 percent), hypertriglyceridemia (triglycerides greater than 1000 mg/dL), medications (azathioprine, 6-MP, thiazides, furosemide, valproate, sulfonamides), ERCP (post-procedure), hypercalcemia, trauma, idiopathic (10-20 percent)

treatment:
  - Supportive care cornerstone: aggressive IV fluid resuscitation (lactated Ringer preferred over normal saline, 250-500 mL/hr initially, goal urine output greater than 0.5 mL/kg/hr, prevents pancreatic necrosis and organ failure), NPO initially, analgesia (opioids required, IV hydromorphone or fentanyl), antiemetics (ondansetron)
  - Monitor: strict intake/output, vital signs every 4 hours, daily labs (hematocrit, creatinine, calcium, lipase)
  - Nutrition: early enteral nutrition preferred over parenteral (within 24-48 hours if tolerated, reduces infection and mortality), start with clear liquids advance to low-fat diet as tolerated, if unable to tolerate oral feeding use nasogastric or nasojejunal tube feeding (do NOT delay nutrition)
  - Antibiotics NOT indicated for sterile pancreatitis (no proven benefit, do NOT give prophylactic antibiotics), use only if infected necrosis proven or suspected (fever persisting, clinical deterioration)
  - Mild pancreatitis (no organ failure, no complications): supportive care, advance diet as tolerated (lipase does NOT need to normalize before feeding), discharge when tolerating oral intake and pain controlled
  - Severe pancreatitis (organ failure, necrosis): ICU admission, aggressive resuscitation, may require vasopressors, mechanical ventilation, RRT if acute kidney injury, CT at 48-72 hours to assess necrosis, infected necrosis requires antibiotics (imipenem or meropenem) plus surgical/percutaneous drainage/debridement
  - Gallstone pancreatitis: ERCP with sphincterotomy if cholangitis or persistent CBD obstruction (dilated CBD, elevated bilirubin), otherwise defer ERCP until inflammation resolves, cholecystectomy during same admission once improved (prevents recurrence)
  - Alcohol-related: alcohol cessation counseling, no recurrence if abstinent
  - Hypertriglyceridemia-induced: lower triglycerides (fibrates, omega-3 fatty acids, insulin if severe)
  - Complications: pancreatic necrosis (30 percent, identified on CT after 72 hours), infected necrosis (fever, leukocytosis, gas in necrosis on CT, requires antibiotics plus drainage), pseudocyst (fluid collection greater than 4 weeks, most resolve spontaneously, drain if symptomatic), splenic vein thrombosis, chronic pancreatitis

clinical_pearls:
  - Diagnosis requires 2 of 3: characteristic pain, lipase greater than 3 times normal, imaging findings
  - Gallstones and alcohol cause 70 percent of cases
  - Aggressive IV fluids (lactated Ringer 250-500 mL/hr) cornerstone prevents necrosis and organ failure
  - Early enteral nutrition (within 24-48 hours) reduces complications
  - Antibiotics NOT indicated for sterile pancreatitis (only if infected necrosis)
  - ALT greater than 150 U/L suggests gallstone etiology (95 percent specific)
  - Cholecystectomy during same admission for gallstone pancreatitis (prevents recurrence)

differentials:
  - Perforated peptic ulcer (acute severe pain, peritonitis, free air on X-ray)
  - Acute cholecystitis (RUQ pain, Murphy sign, gallbladder wall thickening on ultrasound)
  - Mesenteric ischemia (severe pain out of proportion to exam, older patient, atrial fibrillation)
  - Myocardial infarction (epigastric pain can mimic pancreatitis, check ECG and troponin)

trace:
  - 48-year-old man presents to ED with 6 hours severe epigastric pain, constant, radiates to back, nausea, vomiting x 5, unable to eat, worse lying flat (leans forward for relief)
  - History: heavy alcohol use (6-8 beers daily x 20 years), no prior episodes
  - Exam: appears uncomfortable, tachycardic HR 108, BP 102/68, temp 99.8 F, epigastric tenderness, no guarding/rebound, hypoactive bowel sounds, no Cullen/Grey Turner signs
  - Labs: lipase 1850 U/L (markedly elevated, normal less than 60), amylase 980 U/L (elevated), WBC 15.2K, hematocrit 48 percent (hemoconcentration), creatinine 1.4 mg/dL (elevated from baseline 0.9, prerenal azotemia), calcium 8.2 mg/dL (low-normal), AST 65, ALT 42, bilirubin 0.8 mg/dL (normal transaminases suggest alcohol not gallstones)
  - BISAP score: 1 (BUN 28, no impaired mental status, no SIRS, age less than 60, no pleural effusion on exam) - mild severity
  - Ultrasound RUQ: no gallstones, normal CBD 4 mm, pancreas obscured by bowel gas
  - Diagnosis: acute pancreatitis likely alcohol-induced (heavy alcohol use, normal transaminases/bilirubin)
  - Admitted to floor telemetry
  - Started aggressive IV fluids lactated Ringer 250 mL/hr, NPO, IV hydromorphone 0.5-1 mg every 4 hours PRN pain, ondansetron 4 mg every 6 hours PRN nausea
  - Day 2: pain improved, nausea decreased, hematocrit 42 percent (down from 48, good response to fluids), creatinine 1.0 mg/dL (improved), started clear liquids well-tolerated
  - Day 3: pain mild, tolerating low-fat diet, lipase 450 U/L (decreasing), ambulating
  - Discharge day 4: pain controlled on oral oxycodone, tolerating regular low-fat diet, lipase 180 U/L (still elevated but improving)
  - Alcohol cessation counseling: strong recommendation abstinence (prevent recurrent pancreatitis and chronic pancreatitis), referred to addiction services
  - Follow-up 2 weeks: pain resolved, abstinent from alcohol (using naltrexone), no recurrence
  - 3 months: continues abstinence, no further episodes, repeat lipase 45 U/L (normalized)
