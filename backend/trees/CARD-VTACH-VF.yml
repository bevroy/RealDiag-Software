tree_id: CARD-VTACH-VF
name: Ventricular Tachycardia and Ventricular Fibrillation
family: CARDIOLOGY
specialty: Cardiology, Emergency Medicine, Critical Care
chief_complaint: Palpitations, Syncope, Cardiac Arrest
description: Comprehensive evaluation and management of ventricular tachycardia and ventricular fibrillation
version: "1.0"
icd10: I47.2
author: RealDiag Clinical Team

entry_point: vtach_presentation

nodes:
  - id: vtach_presentation
    type: question
    text: "Patient presentation with wide-complex tachycardia or ventricular arrhythmia?"
    options:
      - label: "Ventricular fibrillation or pulseless VT (cardiac arrest)"
        next: vf_pulseless_vt
      - label: "Sustained VT with pulse - hemodynamically unstable (hypotension, altered mental status, chest pain, heart failure)"
        next: unstable_vt
      - label: "Sustained VT with pulse - hemodynamically stable"
        next: stable_vt
      - label: "Non-sustained VT (self-terminating <30 seconds)"
        next: non_sustained_vt

  - id: vf_pulseless_vt
    type: diagnosis
    name: "Ventricular Fibrillation or Pulseless Ventricular Tachycardia"
    icd10: "I49.01"
    urgency: critical
    workup:
      - ECG (when ROSC achieved) - Look for STEMI, long QT, Brugada pattern, WPW
      - Troponin (assess for MI)
      - Electrolytes (potassium, magnesium, calcium)
      - Toxicology screen
      - Echocardiogram (assess EF and structural disease)
      - Coronary angiography (urgent if STEMI or suspected ACS)
      - Continuous telemetry monitoring
    treatment:
      - IMMEDIATE CPR and ACLS protocol
      - High-quality chest compressions (100-120/min, depth 2-2.4 inches)
      - IMMEDIATE defibrillation - Biphasic 120-200J (or manufacturer recommended dose)
      - Resume CPR immediately for 2 minutes
      - Establish IV/IO access
      - Epinephrine 1mg IV/IO q3-5 min
      - Amiodarone 300mg IV/IO bolus (first dose), then 150mg IV/IO (second dose)
      - Alternative - Lidocaine 1-1.5mg/kg IV/IO first dose, then 0.5-0.75mg/kg (max 3mg/kg)
      - Treat reversible causes (H's and T's) - Hypovolemia, Hypoxia, H+ (acidosis), Hypo/hyperkalemia, Hypothermia, Tension pneumothorax, Tamponade, Toxins, Thrombosis (MI or PE)
      - Correct electrolytes - Magnesium sulfate 2g IV over 15 min (especially if torsades or hypomagnesemia)
      - If refractory VF - Consider double sequential defibrillation, esmolol, change pad position
      - Post-ROSC care
      - ICU admission
      - Targeted temperature management (TTM) 32-36°C x 24 hours (if comatose)
      - Urgent coronary angiography if STEMI or suspected ACS
      - Continuous EEG if comatose (assess for seizures)
      - ICD placement for secondary prevention (before discharge if structural heart disease or no reversible cause)
      - Electrophysiology study and catheter ablation if indicated

  - id: unstable_vt
    type: diagnosis
    name: "Hemodynamically Unstable Ventricular Tachycardia with Pulse"
    icd10: "I47.2"
    urgency: critical
    workup:
      - ECG (wide-complex tachycardia, rate typically 150-250 bpm)
      - Confirm VT vs SVT with aberrancy (assume VT if uncertain)
      - Brugada criteria, Vereckei algorithm (favor VT)
      - Troponin, BNP
      - Electrolytes (K, Mg, Ca)
      - Echocardiogram
      - Consider toxicology screen
    treatment:
      - IMMEDIATE synchronized cardioversion
      - Conscious sedation (etomidate, propofol, midazolam)
      - Synchronized cardioversion - 100J (monomorphic VT), 200J if unsuccessful
      - If polymorphic VT (irregular) - Unsynchronized defibrillation (same as VF)
      - If cardioversion successful, follow with antiarrhythmic
      - Amiodarone 150mg IV over 10 min, then 1mg/min x 6hrs, then 0.5mg/min x18hrs
      - Alternative - Procainamide 20-50mg/min IV until arrhythmia suppressed, hypotension, QRS widens >50%, or max 17mg/kg (avoid if prolonged QT)
      - Alternative - Lidocaine 1-1.5mg/kg IV bolus, then infusion 1-4mg/min
      - Correct electrolytes - Magnesium 2g IV, potassium to >4.0 mEq/L
      - Treat underlying cause (ischemia, heart failure, electrolyte abnormalities)
      - ICU admission with continuous telemetry
      - Beta-blocker when stable (metoprolol, carvedilol)
      - Urgent cardiology consultation
      - ICD evaluation for secondary prevention
      - EP study and ablation if recurrent

  - id: stable_vt
    type: question
    text: "Type of VT?"
    options:
      - label: "Monomorphic VT (uniform QRS morphology)"
        next: monomorphic_vt
      - label: "Polymorphic VT (varying QRS morphology)"
        next: polymorphic_vt_assess

  - id: monomorphic_vt
    type: diagnosis
    name: "Hemodynamically Stable Monomorphic Ventricular Tachycardia"
    icd10: "I47.2"
    urgency: high
    workup:
      - 12-lead ECG (wide-complex tachycardia, uniform morphology, rate 150-250)
      - Troponin (rule out MI)
      - Electrolytes (K, Mg, Ca)
      - Echocardiogram (assess EF and structural disease)
      - Consider stress test or coronary angiography (rule out ischemia)
      - Old ECGs for comparison
    treatment:
      - Hospital admission with telemetry or ICU
      - Antiarrhythmic medications (if stable)
      - Amiodarone 150mg IV over 10 min, then infusion 1mg/min x 6hrs, then 0.5mg/min (most effective, fewer proarrhythmic effects)
      - Alternative - Procainamide 20-50mg/min IV until arrhythmia suppressed or max 17mg/kg (check QRS width, stop if widens >50%)
      - Alternative - Lidocaine 1-1.5mg/kg IV bolus, then 1-4mg/min infusion (less effective but safe)
      - If medications fail or patient becomes unstable, proceed to synchronized cardioversion
      - Correct electrolytes (K >4.0, Mg >2.0)
      - Beta-blocker (metoprolol 25-50mg PO BID or carvedilol 3.125-6.25mg PO BID) once stable
      - Treat underlying cause (CAD - revascularization, heart failure - diuretics/ACE/BB)
      - Cardiology consultation
      - ICD placement for secondary prevention (if structural heart disease or EF <35%)
      - EP study and catheter ablation (curative for some VTs, especially idiopathic VT)
      - Transition to oral amiodarone 400mg PO BID x 1 week, then 400mg daily x 1 week, then 200mg daily maintenance (monitor thyroid, liver, PFTs)

  - id: polymorphic_vt_assess
    type: question
    text: "QT interval (when in normal rhythm)?"
    options:
      - label: "Prolonged QTc (>500 ms) - Torsades de pointes"
        next: torsades
      - label: "Normal QTc - Polymorphic VT with normal QT"
        next: polymorphic_vt_normal_qt

  - id: torsades
    type: diagnosis
    name: "Torsades de Pointes (Polymorphic VT with Long QT)"
    icd10: "I47.2"
    urgency: critical
    workup:
      - ECG (polymorphic VT, twisting of QRS axis around baseline, in setting of prolonged QTc)
      - Electrolytes (K, Mg, Ca) - hypokalemia and hypomagnesemia are common causes
      - Medication review (QT-prolonging drugs - antiarrhythmics, antipsychotics, antibiotics)
      - Congenital long QT syndrome (genetic testing, family history)
    treatment:
      - If pulseless, treat as VF (defibrillation, CPR)
      - If with pulse, unsynchronized defibrillation (torsades is irregular, cannot sync)
      - Magnesium sulfate 2g IV push over 1-2 min (first-line treatment), then 1-2g/hr infusion (even if magnesium level normal)
      - Correct potassium to >4.5 mEq/L
      - Discontinue ALL QT-prolonging medications
      - Avoid Class Ia (procainamide, quinidine) and Class III (amiodarone, sotalol) antiarrhythmics (worsen QT prolongation)
      - Isoproterenol 2-10 mcg/min IV infusion (increases heart rate, shortens QT) OR temporary pacing (overdrive pacing at 100-120 bpm)
      - Lidocaine is safe (does not prolong QT)
      - ICU admission
      - Cardiology consultation
      - Treat underlying cause (drug-induced vs congenital)
      - If congenital long QT - Beta-blockers (nadolol, propranolol), avoid QT-prolonging drugs, ICD if high risk

  - id: polymorphic_vt_normal_qt
    type: diagnosis
    name: "Polymorphic VT with Normal QT Interval"
    icd10: "I47.2"
    urgency: critical
    workup:
      - ECG (polymorphic VT with normal baseline QTc)
      - Troponin (rule out acute MI - most common cause)
      - Coronary angiography (urgent if STEMI or ACS)
      - Echocardiogram
      - Electrolytes
    treatment:
      - Treat as acute ischemia until proven otherwise
      - If unstable, cardioversion/defibrillation
      - Dual antiplatelet therapy (aspirin 325mg + ticagrelor 180mg or prasugrel 60mg)
      - Heparin or bivalirudin
      - Urgent coronary angiography for revascularization
      - Beta-blocker IV (metoprolol 5mg IV q5min x3)
      - Amiodarone 150mg IV bolus, then infusion
      - Correct electrolytes
      - ICU admission
      - ICD placement after revascularization if EF <35% or recurrent VT

  - id: non_sustained_vt
    type: diagnosis
    name: "Non-Sustained Ventricular Tachycardia"
    icd10: "I47.2"
    urgency: medium
    workup:
      - ECG (3+ consecutive ventricular beats at rate >100 bpm, lasting <30 seconds, self-terminating)
      - Echocardiogram (assess EF - most important prognostic factor)
      - Troponin (rule out ischemia)
      - Electrolytes
      - Holter monitor or event recorder (assess frequency and duration)
      - Stress test or coronary angiography if CAD suspected
      - Consider cardiac MRI (assess for scar, myocarditis, arrhythmogenic RV dysplasia)
    treatment:
      - Risk stratification based on underlying heart disease
      - If structurally normal heart and EF >50% - Generally benign, observation, no specific treatment
      - If EF 35-50% or frequent NSVT runs - Cardiology referral, beta-blocker, consider EP study
      - If EF <35% - ICD for primary prevention (regardless of NSVT)
      - Beta-blocker (metoprolol, carvedilol) for all patients with structural heart disease
      - Treat underlying cause (CAD, heart failure, cardiomyopathy)
      - EP study if recurrent symptomatic NSVT
      - Avoid Class Ic antiarrhythmics (flecainide, propafenone) in structural heart disease (proarrhythmic)
