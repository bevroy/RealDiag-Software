presentations:
  - Hip or groin pain after fall or trauma
  - Unable to bear weight
  - Shortened and externally rotated leg
  - Common in elderly with osteoporosis
  - X-ray shows femoral neck or intertrochanteric fracture
differentials:
  - Hip arthritis
  - Bursitis
  - AVN
  - Stress fracture
  - Metastatic disease
workup:
  - 'X-ray hip (AP pelvis + lateral): Femoral neck vs intertrochanteric fracture, displacement, comminution'
  - MRI hip if X-ray negative but high clinical suspicion (occult fracture - MRI 99% sensitive)
  - 'Preop labs: CBC, CMP, coags, type & cross (blood loss 1-2 units)'
  - 'ECG: Cardiac risk stratification (elderly)'
treatment:
  - 'Guideline-based treatment options for Hip Fracture include:'
  - 'Surgery within 24-48 hours: Early mobilization reduces complications (pneumonia, DVT, delirium) (AAOS 2023)'
  - 'Femoral neck: Hemiarthroplasty (elderly, displaced) or ORIF with cannulated screws (young, non-displaced) (AAOS 2023)'
  - 'Intertrochanteric: Intramedullary nail (dynamic hip screw) - allows early weight bearing (AAOS 2023)'
  - 'DVT prophylaxis: Enoxaparin 40mg SQ daily OR fondaparinux 2.5mg SQ daily (start postop, continue 10-35 days) (AAOS 2023)'
  - 'Early mobilization: Physical therapy POD#1, weight bearing as tolerated, prevent deconditioning (AAOS 2023)'
clinical_pearls:
  - 25-30% mortality within 1 year (due to complications - DVT/PE, pneumonia, MI) - surgery within 24-48h improves outcomes
  - 'Femoral neck fracture: Intracapsular - disrupts blood supply, risk of AVN. Treatment: Hemiarthroplasty if displaced (elderly), ORIF if non-displaced (young)'
  - 'Intertrochanteric fracture: Extracapsular - better blood supply, lower AVN risk. Treatment: Intramedullary nail or sliding hip screw'
  - 'Garden classification: Type I-II (non-displaced, ORIF), Type III-IV (displaced, arthroplasty if elderly)'
  - 'Delayed surgery >48h: Increased mortality, pressure ulcers, delirium, DVT'
red_flags: []
disposition_guidance: {}
referrals:
  - Orthopedic surgery urgently - admit for surgery within 24-48 hours
  - Geriatrics co-management improves outcomes (delirium prevention, osteoporosis treatment)
