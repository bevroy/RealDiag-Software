tree_id: ORTHO-HIP-FRACTURE
name: Hip Fracture
family: Orthopedics
specialty: Orthopedics
chief_complaint: Hip pain and inability to walk after fall
description: |
  Fracture of proximal femur, typically from low-energy fall in elderly with osteoporosis. Affects 300,000 annually in US, 90% over age 65. High morbidity and mortality - 20-30% die within 1 year.
  Types - femoral neck (intracapsular), intertrochanteric, subtrochanteric. Femoral neck fractures risk avascular necrosis (AVN) due to disrupted blood supply. Urgent surgical fixation required in most cases.
icd10: S72.009A
urgency: High
workup:
  - Clinical presentation - elderly patient with fall, hip pain, inability to bear weight
  - Classic position - externally rotated, shortened, adducted leg
  - Mechanism - usually low-energy fall from standing (high-energy in young requires greater force)
  - Exam - tenderness over hip, pain with range of motion (especially internal/external rotation), groin or lateral hip pain
  - Assess neurovascular status - distal pulses, sensation, motor function
  - X-rays hip (AP pelvis and lateral hip) - diagnostic in 95%
  - Femoral neck fracture - intracapsular, subcapital most common, risk of AVN and nonunion
  - Garden classification - I (incomplete/impacted), II (complete non-displaced), III (complete partially displaced), IV (complete fully displaced)
  - Displaced (Garden III-IV) higher risk AVN, nonunion
  - Intertrochanteric fracture - extracapsular, between greater and lesser trochanters, better healing (good blood supply)
  - Subtrochanteric fracture - below lesser trochanter, high-energy or pathologic, difficult to treat
  - MRI hip if X-ray negative but high clinical suspicion (occult fracture) - detects non-displaced fracture, bone marrow edema
  - CT rarely needed unless complex fracture pattern or preoperative planning
  - Labs - CBC, CMP, PT/PTT, type and screen (anticipate surgery)
  - ECG, chest X-ray - preoperative clearance
  - Assess for medical comorbidities - cardiac disease, COPD, diabetes, anticoagulation
treatment:
  - Early surgical fixation (within 24-48 hours) improves outcomes - reduces mortality, complications (pneumonia, DVT, pressure ulcers)
  - Delay only if unstable medical condition requiring optimization
  - Femoral neck fracture treatment depends on displacement and patient age
  - Non-displaced or minimally displaced (Garden I-II) - internal fixation with cannulated screws or sliding hip screw
  - Displaced (Garden III-IV)
  - Young patients (less than 65) - open reduction internal fixation (ORIF) attempt to preserve femoral head
  - Elderly (greater than 65) - hemiarthroplasty (replace femoral head only) or total hip arthroplasty (replace acetabulum and femoral head)
  - Total hip arthroplasty preferred if pre-existing hip arthritis, active patient
  - Intertrochanteric fracture - sliding hip screw or intramedullary nail
  - Intramedullary (cephalomedullary) nail preferred for unstable fractures, subtrochanteric extension
  - Subtrochanteric fracture - intramedullary nail (load-bearing device)
  - Non-operative management rare - non-ambulatory, severe dementia, hospice, medical contraindication to surgery
  - Pain control, pressure ulcer prevention, palliative care
  - Perioperative management
  - DVT prophylaxis - enoxaparin 40mg SC daily or fondaparinux 2.5mg SC daily (high VTE risk)
  - Start 12-24 hours postoperatively
  - Transfusion threshold hemoglobin less than 8 g/dL (or less than 10 if symptomatic, cardiac disease)
  - Early mobilization - physical therapy day 1 postoperatively, weight-bearing as tolerated (most modern fixation allows full weight-bearing)
  - Multimodal analgesia - acetaminophen, NSAIDs (if no contraindication), regional anesthesia (peripheral nerve block), minimize opioids
  - Complications - mortality (5-10% at 30 days, 20-30% at 1 year), pneumonia, DVT/PE, delirium, pressure ulcers, infection, hardware failure, AVN (femoral neck), nonunion
  - Orthogeriatric co-management - medical optimization, delirium prevention, osteoporosis treatment
  - Osteoporosis treatment mandatory - bisphosphonate (alendronate 70mg weekly or zoledronic acid 5mg IV annually), calcium 1200mg daily, vitamin D 800-1000 IU daily
  - DEXA scan if not previously done
  - Fall prevention - home safety assessment, physical therapy, treat vision problems, medication review (avoid sedatives, anticholinergics)
  - Rehabilitation - acute rehab or subacute nursing facility, intensive physical and occupational therapy
  - Goal return to baseline function (50% achieve)
clinical_pearls:
  - Hip fracture until proven otherwise in elderly patient with fall and inability to walk
  - Femoral neck fractures risk AVN (disrupts retinacular vessels) - consider arthroplasty in elderly
  - Intertrochanteric fractures heal well with fixation (extracapsular, good blood supply)
  - Mortality higher than many cancers - aggressive medical optimization critical
  - Delirium extremely common postoperatively (40-50%) - multicomponent prevention (orientation, sleep hygiene, early mobilization, avoid Foley, minimize sedatives)
  - Bisphosphonate paradox - atypical subtrochanteric fractures with long-term use (rare, drug holiday after 5 years if low risk)
  - Pathologic fracture if minimal trauma - consider metastases (breast, lung, kidney, thyroid, prostate), multiple myeloma
differentials:
  - Hip contusion/strain
  - Pelvic fracture
  - Femoral shaft fracture
  - Greater trochanteric bursitis
  - Hip dislocation
  - Lumbar radiculopathy
trace:
  - 82-year-old woman with osteoporosis falls in bathroom, unable to bear weight on right leg → Severe right hip pain → Exam shows right leg externally rotated, shortened 2 cm, pain with any hip motion → X-ray pelvis shows displaced right femoral neck fracture (Garden IV) → Labs normal, creatinine 1.1 mg/dL → ECG shows sinus rhythm, no acute changes → Medical optimization - hold aspirin, give IV fluids → Preoperative anesthesia evaluation → Surgery within 24 hours - hemiarthroplasty (unipolar femoral head replacement) → Spinal anesthesia, femoral nerve block → Surgery 90 minutes, EBL 250 mL, no complications → Postoperative - enoxaparin 40mg SC daily for DVT prophylaxis, multimodal analgesia, Foley catheter removed POD 1 → Physical therapy POD 1 - weight-bearing as tolerated with walker → Transfer to acute rehab POD 3 → Start alendronate 70mg weekly plus calcium and vitamin D for osteoporosis → Intensive PT/OT x 2 weeks → Discharged home with home PT, ambulating with walker → Returns to baseline function at 3 months, using cane
