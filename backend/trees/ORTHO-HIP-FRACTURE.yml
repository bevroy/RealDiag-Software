tree_id: ORTHO-HIP-FRACTURE
name: Hip Fracture
family: Orthopedics
specialty: Orthopedics
chief_complaint: Hip pain and inability to bear weight after fall
description: |
  Fracture of proximal femur (femoral neck, intertrochanteric, or subtrochanteric). Most common in elderly with osteoporosis.
  90% occur from low-energy falls. High morbidity and mortality - 1-year mortality 20-30%.
icd10: S72.009A
urgency: Critical
workup:
  - X-ray pelvis and hip (AP and lateral views) diagnoses 95% of fractures
  - MRI hip if high clinical suspicion with negative X-ray (detects occult fractures)
  - CT scan alternative if MRI contraindicated
  - Classify fracture type - femoral neck (intracapsular), intertrochanteric, subtrochanteric (affects treatment)
  - Garden classification for femoral neck fractures (I-IV, higher grades indicate displacement)
  - Complete blood count, type and screen, basic metabolic panel, coagulation studies
  - ECG, chest X-ray for preoperative clearance
  - Assess for medical optimization before surgery
treatment:
  - Surgery within 24-48 hours reduces mortality and complications
  - Femoral neck fracture displaced (Garden III-IV) - total hip arthroplasty or hemiarthroplasty in elderly
  - Femoral neck fracture non-displaced (Garden I-II) - internal fixation with cannulated screws
  - Intertrochanteric fracture - intramedullary nail (cephalomedullary nail) or sliding hip screw
  - Subtrochanteric fracture - intramedullary nail
  - Non-operative management only if patient non-ambulatory or severe comorbidities preclude surgery
  - Pain control - nerve blocks (femoral or fascia iliaca) preferred over opioids
  - Multimodal analgesia - acetaminophen, NSAIDs, regional anesthesia
  - DVT prophylaxis - enoxaparin 40mg SC daily or fondaparinux 2.5mg SC daily
  - Early mobilization postoperatively (same or next day) improves outcomes
  - Physical therapy and rehabilitation essential
clinical_pearls:
  - Classic presentation includes shortened, externally rotated leg after fall, unable to bear weight
  - Femoral neck fractures risk AVN (avascular necrosis) due to disruption of blood supply
  - Displaced femoral neck fractures in young patients require urgent ORIF to preserve femoral head
  - Intertrochanteric fractures heal reliably (extracapsular, good blood supply)
  - Osteoporosis treatment essential after fracture - bisphosphonate (alendronate) or denosumab, calcium, vitamin D
  - Fall risk assessment and prevention critical (home safety, vision, medications, PT)
differentials:
  - Hip contusion
  - Greater trochanter fracture (avulsion)
  - Pubic ramus fracture
  - Femoral shaft fracture
  - Pathologic fracture (metastatic disease)
  - Hip dislocation
trace:
  - 82-year-old woman fell at home, unable to bear weight on right leg → Right leg shortened and externally rotated → X-ray shows displaced right femoral neck fracture (Garden IV) → Admit, pain control with fascia iliaca block → Preoperative clearance → Hemiarthroplasty within 24 hours → DVT prophylaxis with enoxaparin → Early mobilization with PT day 1 postop → Discharge to rehab facility → Start alendronate for osteoporosis → Fall prevention evaluation
