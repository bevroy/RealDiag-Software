tree_id: GI-HEPATITIS-C
name: Hepatitis C Virus Infection
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Elevated liver enzymes or chronic liver disease
description: |
  Chronic viral infection transmitted parenterally. Leading indication for liver transplantation in US until direct-acting antivirals (DAAs).
  Chronic infection develops in 75-85% of exposed individuals. Genotypes 1-6, genotype 1 most common in US. Cure rates greater than 95% with DAAs.
icd10: B18.2
urgency: Moderate
workup:
  - Screen high-risk populations - baby boomers (born 1945-1965) one-time screening, injection drug use, hemodialysis, HIV infection, incarceration, unregulated tattoos, blood transfusion before 1992, needlestick injury
  - HCV antibody screening test - if positive, confirm with HCV RNA (quantitative PCR) to distinguish active infection from resolved infection
  - HCV antibody positive, RNA negative - cleared infection (spontaneous or treated), no further action
  - HCV antibody positive, RNA positive - chronic HCV, needs treatment
  - HCV genotype and viral load for treatment planning
  - Assess liver disease severity - ALT, AST, bilirubin, albumin, INR, platelet count
  - Noninvasive fibrosis assessment - FIB-4 score, APRI score, transient elastography (FibroScan)
  - Liver biopsy if diagnosis uncertain or significant comorbid liver disease
  - Hepatitis A and B serology - vaccinate if not immune
  - Screen for hepatocellular carcinoma if cirrhosis - ultrasound and AFP every 6 months
treatment:
  - Direct-acting antivirals (DAAs) cure HCV in greater than 95% - pan-genotypic regimens preferred (treat all genotypes)
  - Sofosbuvir/velpatasvir 400/100mg once daily x 12 weeks (all genotypes, treatment-naive and experienced)
  - Glecaprevir/pibrentasvir 300/120mg (3 tablets) once daily x 8 weeks (genotypes 1-6, no cirrhosis) or 12 weeks (compensated cirrhosis)
  - Ledipasvir/sofosbuvir 90/400mg once daily x 12 weeks (genotypes 1, 4, 5, 6)
  - Treatment-experienced or decompensated cirrhosis may need longer duration (16-24 weeks) or add ribavirin
  - Check for drug interactions - contraindicated with certain anticonvulsants, rifampin, St. John's wort, proton pump inhibitors (some regimens)
  - Monitor HCV RNA at 12 weeks post-treatment (sustained virologic response, SVR12) - undetectable RNA indicates cure
  - Counsel on preventing transmission - do not share needles, razors, toothbrushes, practice safe sex (low risk but possible)
  - Avoid alcohol and hepatotoxic medications
  - Continue HCC surveillance if cirrhosis even after cure (cancer risk persists but reduced)
clinical_pearls:
  - Acute HCV often asymptomatic, 20-30% develop jaundice, most don't clear virus and progress to chronic infection
  - Chronic HCV typically asymptomatic until advanced liver disease (cirrhosis develops in 20-30% over 20-30 years)
  - Extrahepatic manifestations - mixed cryoglobulinemia, membranoproliferative glomerulonephritis, porphyria cutanea tarda, lymphoma
  - SVR (cure) reduces but does not eliminate HCC risk if cirrhosis present
  - DAAs well-tolerated, few side effects compared to old interferon-based regimens
  - Reinfection possible - counsel on harm reduction for injection drug users
differentials:
  - Hepatitis B
  - Alcoholic liver disease
  - Non-alcoholic fatty liver disease
  - Autoimmune hepatitis
  - Hemochromatosis
  - Primary biliary cholangitis
trace:
  - 62-year-old baby boomer presents for routine screening → HCV antibody positive → HCV RNA 2.5 million IU/mL (confirms chronic infection) → Genotype 1a → ALT 78 U/L, AST 65 U/L, platelets 185K, albumin 3.8, INR 1.1 → FibroScan shows F2 fibrosis (moderate), no cirrhosis → Hepatitis A and B immune → Start sofosbuvir/velpatasvir 400/100mg once daily x 12 weeks → Well-tolerated, no side effects → HCV RNA undetectable at week 4 → Complete 12-week treatment → HCV RNA undetectable at week 12 post-treatment (SVR12) - cured → Counsel on preventing reinfection, annual monitoring of liver enzymes
