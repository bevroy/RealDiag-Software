tree_id: GI-HEPATITIS-C
name: Hepatitis C Virus Infection
family: Gastrointestinal
specialty: Gastroenterology
chief_complaint: Elevated liver enzymes
description: Chronic viral infection of liver transmitted by blood exposure causing progressive hepatic inflammation, fibrosis, cirrhosis, and hepatocellular carcinoma if untreated

icd10: B18.2

urgency: routine

workup:
  - Risk factors: injection drug use (most common transmission in US), blood transfusion before 1992, hemodialysis, healthcare exposure (needlestick), HIV infection, incarceration, intranasal drug use, tattoos (non-professional settings), sexual transmission (rare, increased with HIV coinfection)
  - Acute hepatitis C: usually asymptomatic (70-80 percent), if symptomatic jaundice, fatigue, nausea, abdominal pain, dark urine, develops 2-12 weeks after exposure, 20-30 percent spontaneously clear virus, 70-80 percent progress to chronic infection
  - Chronic hepatitis C: usually asymptomatic until advanced liver disease, fatigue common, may have extrahepatic manifestations (cryoglobulinemia, glomerulonephritis, porphyria cutanea tarda, lichen planus)
  - Screening: CDC recommends one-time screening for all adults age 18-79 (birth cohort 1945-1965 highest prevalence), risk-based screening (IVDU, HIV, dialysis)
  - Laboratory diagnosis: anti-HCV antibody (screening test, if positive confirm with HCV RNA PCR), HCV RNA quantitative (viral load, confirms active infection, negative if spontaneously cleared or cured)
  - Genotype: determine HCV genotype (genotype 1 most common in US 75 percent, genotype 2 and 3 less common) - guides treatment duration
  - Assess liver disease severity: ALT/AST (may be normal or mildly elevated in chronic HCV), platelet count (thrombocytopenia suggests cirrhosis), albumin and INR (synthetic function), bilirubin
  - Fibrosis assessment: non-invasive (FibroScan or FIB-4 score or APRI score) vs liver biopsy, staging F0-F4 (F0 no fibrosis, F4 cirrhosis)
  - Ultrasound abdomen: assess for cirrhosis (nodular liver, splenomegaly, ascites), screen for hepatocellular carcinoma if cirrhosis
  - Coinfection screening: HIV, hepatitis B (HBsAg, anti-HBc, anti-HBs)

treatment:
  - Goal: cure HCV (sustained virologic response SVR, undetectable HCV RNA 12 weeks after completing treatment) - prevents progression to cirrhosis, reduces hepatocellular carcinoma risk, reduces all-cause mortality
  - Direct-acting antivirals (DAAs): highly effective (greater than 95 percent SVR), well-tolerated, short duration (8-12 weeks), pangenotypic regimens available
  - First-line pangenotypic regimen: sofosbuvir-velpatasvir 400/100 mg one tablet daily x 12 weeks (all genotypes, with or without cirrhosis) OR glecaprevir-pibrentasvir 300/120 mg three tablets daily x 8 weeks (treatment-naive without cirrhosis) or 12 weeks (with cirrhosis)
  - Genotype-specific regimens: ledipasvir-sofosbuvir for genotype 1, 4-6 (not genotype 2-3)
  - Treatment-experienced or decompensated cirrhosis: may require longer duration or ribavirin addition (consult hepatology)
  - Drug interactions: DAAs have significant interactions (especially with acid-suppressing medications, amiodarone, statins) - check interactions before prescribing
  - Monitoring during treatment: HCV RNA at week 4 (not required but confirms viral suppression), ALT/AST, bilirubin, CBC
  - Sustained virologic response (SVR): HCV RNA undetectable 12 weeks after completing treatment (SVR12) - considered cured, 99 percent remain HCV RNA negative long-term
  - Post-treatment: check HCV RNA at 12 weeks post-treatment (confirm SVR), if cirrhosis continue HCC surveillance (ultrasound every 6 months plus AFP), continue screening for varices (endoscopy)
  - Prevention: no vaccine available, avoid sharing needles or personal items (razors, toothbrushes), harm reduction (needle exchange programs for IVDU)
  - Cirrhosis management: screen for varices (EGD), hepatocellular carcinoma surveillance (ultrasound plus AFP every 6 months), avoid hepatotoxins (alcohol, NSAIDs), vaccinate (hepatitis A and B)
  - Reinfection risk: can be reinfected after SVR if ongoing risk behaviors (IVDU), treat reinfection same as initial infection

clinical_pearls:
  - Screen all adults 18-79 once, risk-based screening (IVDU, HIV, hemodialysis)
  - Anti-HCV antibody screening, confirm with HCV RNA PCR (active infection)
  - Direct-acting antivirals cure greater than 95 percent (sofosbuvir-velpatasvir 12 weeks pangenotypic)
  - SVR12 (undetectable RNA 12 weeks post-treatment) considered cured
  - If cirrhosis continue HCC surveillance (ultrasound every 6 months) even after cure
  - No vaccine, prevent by avoiding blood exposure

differentials:
  - Hepatitis B (similar presentation, check HBsAg)
  - Alcoholic hepatitis (history heavy alcohol use, AST:ALT greater than 2:1)
  - Non-alcoholic fatty liver disease (obesity, diabetes, metabolic syndrome)
  - Drug-induced liver injury (medication or herbal supplement)
  - Autoimmune hepatitis (elevated IgG, positive ANA, smooth muscle antibody)

trace:
  - 56-year-old man presents for routine physical, reports history injection drug use age 20-30 (heroin, shared needles), sober x 25 years, no symptoms
  - History: married, employed, no current drug use, denies alcohol
  - Exam: appears healthy, no stigmata chronic liver disease (no jaundice, spider angiomas, palmar erythema), liver not palpable, no splenomegaly
  - Labs routine screening: ALT 68 U/L (mildly elevated, normal less than 40), AST 52 U/L (mildly elevated), bilirubin 0.8 mg/dL (normal), albumin 4.2 g/dL (normal), platelets 185K (normal), INR 1.0 (normal)
  - Given history IVDU ordered: anti-HCV antibody POSITIVE
  - Confirmatory test: HCV RNA quantitative 2.4 million IU/mL (positive, confirms active chronic infection)
  - HCV genotype: genotype 1a
  - HIV test: negative
  - Hepatitis B: HBsAg negative, anti-HBc negative, anti-HBs positive (vaccinated)
  - Fibrosis assessment: FibroScan 8.2 kPa (F2 moderate fibrosis, no cirrhosis)
  - Ultrasound abdomen: normal liver, no cirrhosis, no focal lesions
  - Diagnosis: chronic hepatitis C genotype 1a with moderate fibrosis (F2), likely acquired from IVDU 25-30 years ago
  - Counseling: highly effective treatment available (cure greater than 95 percent), prevents progression to cirrhosis and liver cancer
  - Treatment plan: sofosbuvir-velpatasvir 400/100 mg one tablet daily x 12 weeks (pangenotypic DAA)
  - Checked drug interactions: none with current medications
  - Insurance prior authorization obtained
  - Baseline labs before treatment: ALT 68, AST 52, bilirubin 0.8, CBC normal, HCV RNA 2.4 million IU/mL
  - Week 4 on treatment: HCV RNA undetectable (less than 15 IU/mL, excellent response), ALT decreased to 42 U/L, tolerating medication well (no side effects)
  - Week 12: completed treatment course, HCV RNA undetectable, ALT 32 U/L (normalized)
  - Post-treatment week 12 (SVR12): HCV RNA undetectable (CURED, sustained virologic response achieved), ALT 28 U/L (normal)
  - Counseling: cured of hepatitis C, 99 percent remain virus-free long-term, can be reinfected if exposure (avoid sharing needles), no HCC surveillance needed (no cirrhosis), repeat FibroScan in 2-3 years to assess fibrosis regression
  - 1 year post-treatment: HCV RNA remains undetectable (confirmed cure), ALT 24 U/L (normal), repeat FibroScan 6.8 kPa (F1, fibrosis regression from F2 to F1)
