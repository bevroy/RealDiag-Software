tree_id: PSYCH-SELF-HARM
name: Self-Harm (Non-Suicidal Self-Injury)
family: psychiatry
specialty: Psychiatry/Emergency Medicine
icd10: Z91.5
snomed: 248062006
urgency: []
homeopathy: []
presentations:
  - Intentional self-inflicted damage to body tissue without suicidal intent
  - Common methods: cutting (most common 70-90%), burning, scratching, hitting, interfering with wound healing
  - Onset typically in adolescence (ages 12-14)
  - Performed to relieve negative emotions or feelings (emotional regulation)
  - May occur during dysphoric or dissociative states
  - Often hidden from others (long sleeves, wearing bracelets)
  - Scars, fresh cuts, or burns in various stages of healing
  - Most commonly affects arms, legs, abdomen
  - May report relief, calmness, or numbness after self-injury
  - Often expresses guilt or shame about behavior
workup:
  - Comprehensive safety assessment (CRITICAL)
  - Distinguish non-suicidal self-injury from suicide attempt
  - NSSI: intent is to relieve emotional distress, not to die
  - Suicide attempt: intent is to end life
  - Important: NSSI increases suicide risk 3-4 times - always assess both
  - Assess current suicidal ideation and intent
  - Columbia-Suicide Severity Rating Scale (C-SSRS)
  - History of suicide attempts
  - Access to lethal means
  - Protective factors
  - Physical examination
  - Document location, type, and age of injuries
  - Assess need for medical treatment (wound care, tetanus, infection)
  - Screen for infection, need for sutures
  - Assess self-harm patterns
  - Frequency and methods
  - Triggers and emotional states before self-harm
  - Functions: emotion regulation, self-punishment, communication, sensation-seeking
  - Level of planning vs impulsive
  - Psychiatric evaluation
  - Screen for underlying mental health conditions (present in 90%)
  - Depression (50-60%)
  - Anxiety disorders (50-60%)
  - Borderline personality disorder (70-80% engage in NSSI)
  - PTSD/trauma history (40-60%)
  - Eating disorders (40-60%)
  - Substance use disorders
  - Assess psychosocial factors
  - Family functioning and support
  - Peer relationships
  - School/work stressors
  - History of abuse or trauma
treatment:
  - Immediate medical management
  - Treat acute injuries (wound care, sutures if needed, tetanus prophylaxis)
  - Assess need for hospitalization
  - Active suicidal ideation with plan/intent
  - Inability to ensure safety
  - Lack of support system
  - Severe underlying psychiatric condition
  - Evidence-based psychotherapy (FIRST-LINE treatment)
  - Dialectical Behavior Therapy (DBT) - most evidence for NSSI
  - Emotion regulation skills
  - Distress tolerance
  - Mindfulness
  - Interpersonal effectiveness
  - Reduces self-harm by 50-70%
  - Cognitive Behavioral Therapy (CBT)
  - Identify triggers and maladaptive coping
  - Develop alternative coping strategies
  - Challenge distorted thoughts
  - Mentalization-Based Therapy (MBT) for borderline personality disorder
  - Family therapy (especially for adolescents)
  - Pharmacotherapy (treat underlying psychiatric conditions)
  - SSRIs for depression, anxiety, or impulsivity
  - Fluoxetine 20-60 mg daily
  - Sertraline 50-200 mg daily
  - Consider mood stabilizers or atypical antipsychotics for borderline personality disorder
  - No medication specifically FDA-approved for NSSI
  - Harm reduction approach
  - Safety planning (identify triggers, warning signs, coping strategies, support contacts)
  - Develop alternative coping strategies (ice, red marker, rubber band)
  - Delay technique (wait 10-15 minutes before self-harming)
  - Remove or limit access to means of self-harm
  - Engage support system
  - Family psychoeducation
  - Reduce shame and stigma
  - Improve communication
  - Avoid punishment or threats
clinical_pearls:
  - "NSSI affects 15-20% of adolescents and young adults, more common in females (3:1 ratio)"
  - "Peak onset age 12-14 years, typically decreases in late 20s"
  - "NSSI is NOT a suicide attempt, but increases suicide risk 3-4 times - always assess both"
  - "Primary function: emotion regulation (90%) - temporary relief from intense negative emotions"
  - "Cutting most common method (70-90%), usually on arms, legs, or abdomen"
  - "DBT most effective treatment - reduces self-harm frequency by 50-70%"
  - "90% have comorbid psychiatric disorder - borderline personality disorder, depression, anxiety most common"
  - "Avoid 'no-harm contracts' - ineffective and may damage therapeutic relationship"
referrals:
  - Emergency department if active suicidal ideation, severe injuries, or unable to ensure safety
  - Psychiatry for medication management and risk assessment
  - DBT-trained therapist (evidence-based treatment for NSSI)
  - Outpatient mental health for ongoing psychotherapy
differentials:
  - Non-suicidal self-injury (intent to relieve emotional distress, not die)
  - Suicide attempt (intent to end life)
  - Borderline personality disorder (chronic pattern of self-harm, identity disturbance, unstable relationships)
  - Major depressive disorder (self-harm as symptom of depression)
  - Post-traumatic stress disorder (self-harm related to trauma)
  - Eating disorders (self-harm behavior comorbid with restrictive eating)
  - Substance use disorders (self-harm during intoxication)
  - Factitious disorder (self-injury for sick role)
  - Psychosis (self-harm in response to command hallucinations)
  - Developmental disorders (stereotypic self-injury in autism, intellectual disability)
