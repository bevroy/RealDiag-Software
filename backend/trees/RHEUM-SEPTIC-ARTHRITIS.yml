tree_id: RHEUM-SEPTIC-ARTHRITIS
name: Septic Arthritis and Acute Monoarthritis
family: RHEUMATOLOGY
specialty: Rheumatology, Orthopedics, Emergency Medicine
chief_complaint: Acute Joint Pain, Swelling, Warmth
description: Comprehensive evaluation and management of septic arthritis and acute monoarticular arthritis
version: "1.0"
icd10: M00.9
author: RealDiag Clinical Team

entry_point: monoarthritis_presentation

nodes:
  - id: monoarthritis_presentation
    type: question
    text: "Patient with acute monoarticular joint pain and swelling?"
    options:
      - label: "Yes - Single joint, acute onset (<2 weeks)"
        next: arthrocentesis_needed
      - label: "Multiple joints involved (polyarticular)"
        next: polyarthritis

  - id: polyarthritis
    type: diagnosis
    name: "Polyarticular Arthritis - Alternative Diagnosis"
    icd10: "M25.50"
    urgency: medium
    workup:
      - Consider RA, psoriatic arthritis, viral arthritis, reactive arthritis
      - RF, anti-CCP, ANA, ESR, CRP
      - Rheumatology referral
    treatment:
      - Treat based on underlying diagnosis

  - id: arthrocentesis_needed
    type: question
    text: "Is joint effusion present?"
    options:
      - label: "Yes - Effusion confirmed, arthrocentesis performed"
        next: synovial_fluid_analysis
      - label: "No effusion or unable to aspirate"
        next: imaging_workup

  - id: imaging_workup
    type: diagnosis
    name: "No Effusion - Consider Other Diagnoses"
    icd10: "M25.50"
    urgency: medium
    workup:
      - X-ray of joint
      - Ultrasound to assess for effusion
      - MRI if concerned for osteomyelitis or soft tissue pathology
      - Consider periarticular processes (bursitis, tendinitis, fracture)
    treatment:
      - Based on final diagnosis

  - id: synovial_fluid_analysis
    type: question
    text: "Synovial fluid analysis results?"
    options:
      - label: "WBC >50,000 cells/mm³ with >75% PMNs - Highly suspicious for septic arthritis"
        next: septic_arthritis
      - label: "WBC 25,000-50,000 - Indeterminate, may be septic or inflammatory"
        next: indeterminate_arthritis
      - label: "Crystals present (monosodium urate or calcium pyrophosphate)"
        next: crystal_arthropathy
      - label: "WBC <2,000, clear fluid - Non-inflammatory"
        next: osteoarthritis

  - id: septic_arthritis
    type: diagnosis
    name: "Septic Arthritis"
    icd10: "M00.9"
    urgency: critical
    workup:
      - Arthrocentesis with synovial fluid analysis - Urgent
      - Synovial fluid WBC (>50,000 cells/mm³, often >100,000, with >90% PMNs is highly suggestive)
      - Gram stain (positive in 50% of bacterial cases)
      - Synovial fluid culture (aerobic and anaerobic) - most important test
      - Synovial fluid glucose (low <40 mg/dL)
      - Blood cultures (positive in 50%)
      - CBC (leukocytosis)
      - ESR, CRP (elevated)
      - X-ray of joint (may be normal early, later shows joint space narrowing, erosions)
      - Consider MRI if diagnosis uncertain or concerned for osteomyelitis
      - Identify risk factors (prosthetic joint, RA, immunosuppression, DM, IVDU, recent joint injection)
    treatment:
      - Hospital admission
      - URGENT orthopedic consultation for joint washout (arthroscopic or open surgical drainage)
      - Empiric IV antibiotics (start immediately after cultures obtained, do NOT wait)
      - Native joint, no prosthesis - Vancomycin 15-20mg/kg IV q8-12h (covers MRSA and Strep) PLUS ceftriaxone 2g IV q24h OR cefepime 2g IV q8h (covers gram-negatives)
      - Prosthetic joint - Vancomycin + cefepime or vancomycin + meropenem 1g IV q8h (broader coverage)
      - IVDU or immunocompromised - Add anti-Pseudomonal coverage (cefepime or piperacillin-tazobactam)
      - Gonococcal arthritis suspected (young, sexually active) - Ceftriaxone 1-2g IV q24h (covers Neisseria gonorrhoeae)
      - Common organisms - S. aureus (most common, 40-50%), Streptococcus, Gram-negatives (E. coli, Pseudomonas), Neisseria gonorrhoeae (young adults)
      - Narrow antibiotics based on culture results
      - Duration - 2-3 weeks IV for Strep and Neisseria, 3-4 weeks for S. aureus, 4-6 weeks if MRSA or poor response, 6 weeks minimum for prosthetic joint
      - Serial arthrocentesis or surgical drainage may be needed if persistent effusion
      - Monitor CRP (should decrease with treatment)
      - Physical therapy after acute infection controlled

  - id: indeterminate_arthritis
    type: diagnosis
    name: "Indeterminate Monoarthritis (Possible Septic Arthritis)"
    icd10: "M13.10"
    urgency: critical
    workup:
      - Synovial fluid WBC 25,000-50,000 (overlap between septic and inflammatory)
      - Gram stain and culture (may be negative even with infection)
      - Blood cultures
      - ESR, CRP
      - Crystal analysis (crystals do not rule out infection - can coexist)
    treatment:
      - Treat as septic arthritis until proven otherwise (infection is a surgical emergency)
      - Hospital admission
      - Empiric IV antibiotics (vancomycin + ceftriaxone)
      - Orthopedic consultation for possible washout
      - Repeat arthrocentesis in 24-48 hours if not improving
      - If cultures negative and improving, consider inflammatory arthritis
      - Continue antibiotics until cultures finalized (48-72 hours)

  - id: crystal_arthropathy
    type: question
    text: "Type of crystals seen on polarized microscopy?"
    options:
      - label: "Monosodium urate crystals (needle-shaped, negatively birefringent) - Gout"
        next: gout
      - label: "Calcium pyrophosphate crystals (rhomboid, positively birefringent) - Pseudogout"
        next: pseudogout

  - id: gout
    type: diagnosis
    name: "Acute Gout Flare"
    icd10: "M10.9"
    urgency: medium
    workup:
      - Synovial fluid analysis (monosodium urate crystals, needle-shaped, negatively birefringent under polarized light)
      - Synovial fluid WBC (typically 10,000-50,000, but can be >50,000)
      - Serum uric acid (may be normal during acute flare - do not rule out gout if normal)
      - Gram stain and culture (to rule out coexisting septic arthritis)
      - X-ray (late findings - erosions with overhanging edges, tophi)
    treatment:
      - Acute flare treatment (do NOT start uric acid-lowering therapy during acute attack)
      - NSAIDs (first-line if no contraindications) - Indomethacin 50mg PO TID x 5-7 days OR naproxen 500mg PO BID OR ibuprofen 800mg PO TID
      - Colchicine 1.2mg PO x1, then 0.6mg 1 hour later, then 0.6mg daily or BID (lower doses equally effective with fewer side effects)
      - Corticosteroids (if NSAIDs contraindicated) - Prednisone 30-40mg PO daily x 5 days then taper OR intra-articular corticosteroid injection (triamcinolone 40mg)
      - IL-1 inhibitors (anakinra, canakinumab) if refractory
      - Start uric acid-lowering therapy (allopurinol or febuxostat) after acute flare resolves (usually 2-4 weeks)
      - Target serum uric acid <6 mg/dL (or <5 if tophi present)
      - Prophylaxis during initiation of uric acid-lowering therapy - Colchicine 0.6mg daily or NSAIDs x 3-6 months
      - Lifestyle modifications - Limit alcohol, high-fructose corn syrup, red meat, seafood; encourage low-fat dairy, vegetables, hydration

  - id: pseudogout
    type: diagnosis
    name: "Calcium Pyrophosphate Deposition (Pseudogout)"
    icd10: "M11.20"
    urgency: medium
    workup:
      - Synovial fluid analysis (calcium pyrophosphate crystals, rhomboid-shaped, positively birefringent)
      - X-ray (chondrocalcinosis - linear calcification of cartilage, especially in knee menisci, wrist triangular fibrocartilage)
      - Rule out metabolic disorders (hyperparathyroidism, hemochromatosis, hypomagnesemia) - calcium, PTH, ferritin, magnesium
    treatment:
      - Similar to gout treatment
      - NSAIDs (indomethacin, naproxen) OR colchicine OR corticosteroids (oral or intra-articular)
      - Arthrocentesis alone can be therapeutic (drainage relieves pressure)
      - No uric acid-lowering equivalent (no effective prophylaxis for CPPD)
      - Treat underlying metabolic disorders if present

  - id: osteoarthritis
    type: diagnosis
    name: "Osteoarthritis with Effusion"
    icd10: "M19.90"
    urgency: low
    workup:
      - Synovial fluid analysis (non-inflammatory, WBC <2,000, clear/yellow, viscous)
      - X-ray (joint space narrowing, osteophytes, subchondral sclerosis)
    treatment:
      - NSAIDs PRN
      - Acetaminophen
      - Intra-articular corticosteroid injection (triamcinolone)
      - Physical therapy
      - Weight loss if applicable
      - Consider hyaluronic acid injections (controversial benefit)
      - Orthopedic referral for joint replacement if severe
