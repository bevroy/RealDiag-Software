tree_id: ORTHO-LATERAL-EPICONDYLITIS
name: Lateral Epicondylitis (Tennis Elbow)
family: Orthopedics
specialty: Orthopedics
chief_complaint: Lateral elbow pain worse with gripping
description: Degenerative tendinopathy of wrist extensor origin at lateral epicondyle causing elbow pain worse with gripping and wrist extension. Conservative management with physical therapy and activity modification effective in 80-90% within 6-12 months.
icd10: M77.10
urgency: non-urgent

workup:
  - Clinical diagnosis: lateral elbow pain worse with gripping, lifting objects, wrist extension, shaking hands
  - Point tenderness: lateral epicondyle at origin of extensor carpi radialis brevis (most commonly affected)
  - Provocative tests: pain with resisted wrist extension (most sensitive), resisted middle finger extension, passive wrist flexion
  - Cozen test: pain with resisted wrist extension and radial deviation
  - Mill test: pain with passive wrist flexion with elbow extended and forearm pronated
  - Grip strength: decreased compared to unaffected side
  - Risk factors: repetitive wrist extension and gripping (typing, racquet sports, manual labor), age 30-50, smoking
  - No imaging needed: clinical diagnosis sufficient
  - X-ray elbow: only if trauma, limited range of motion, or failed conservative treatment (typically normal, may show calcification in chronic cases)
  - MRI: rarely needed, only if diagnosis uncertain or surgical planning (shows tendinopathy, partial tears at extensor origin)

treatment:
  - Conservative management (first-line): effective in 80-90% within 6-12 months
  - Rest and activity modification: avoid repetitive gripping and wrist extension (2-4 weeks), modify work activities
  - NSAIDs: ibuprofen 400-600 mg TID or naproxen 500 mg BID x2-4 weeks for pain (modest benefit)
  - Counterforce bracing: forearm strap 2-3 inches below elbow (reduces strain on extensor origin by distributing force)
  - Wear during activities that provoke symptoms
  - Ice: apply 15-20 minutes after aggravating activities
  - Physical therapy: eccentric strengthening exercises (most effective), stretching tight wrist extensors, massage
  - Tyler twist exercise: eccentric wrist extension with flexbar highly effective
  - Therapy 6-12 weeks typically needed
  - Corticosteroid injection: if failed conservative treatment after 6-12 weeks
  - Methylprednisolone 40 mg or triamcinolone 40 mg with lidocaine at lateral epicondyle
  - Short-term benefit (4-6 weeks) but no long-term benefit, may delay healing
  - Use sparingly - maximum 2-3 injections
  - Platelet-rich plasma (PRP) injection: emerging treatment, some evidence for benefit in chronic cases
  - Surgery (lateral epicondyle debridement): if failed 6-12 months conservative treatment (less than 5% of cases)
  - Arthroscopic or open debridement of degenerative tendon tissue
  - Success rate 80-90% but lengthy recovery (3-6 months)
  - Natural history: self-limited condition, 80-90% resolve within 6-12 months with conservative treatment

clinical_pearls:
  - Lateral elbow pain worse with gripping, lifting, wrist extension
  - Point tenderness at lateral epicondyle, pain with resisted wrist extension
  - Conservative management effective in 80-90% within 6-12 months
  - Physical therapy with eccentric strengthening (Tyler twist) most effective
  - Counterforce brace reduces strain on extensor origin
  - Corticosteroid injection provides short-term relief only
  - Surgery rarely needed (less than 5% of cases)
  - Self-limited condition - most resolve with time and activity modification

differentials:
  - Radial tunnel syndrome: pain 3-4 cm distal to lateral epicondyle (over radial nerve), pain with resisted supination and middle finger extension
  - Posterior interosseous nerve entrapment: weakness wrist and finger extension without sensory loss
  - Cervical radiculopathy (C6-C7): neck pain radiating to arm, dermatomal pattern, decreased reflexes
  - Elbow osteoarthritis: joint line tenderness, crepitus, limited range of motion, X-ray shows joint space narrowing

trace: |
  A 42-year-old software engineer presented with 4 months of right lateral elbow pain (dominant arm). Pain worse with typing, lifting coffee cup, shaking hands. Works long hours at computer. No acute injury. Exam showed point tenderness over lateral epicondyle, pain with resisted wrist extension (positive Cozen test), full range of motion, no swelling. Grip strength decreased on right compared to left. Diagnosed with lateral epicondylitis (tennis elbow). Started conservative management: ibuprofen 600 mg TID with meals x3 weeks for pain. Counterforce brace to wear during work. Activity modification: frequent breaks from typing every 30 minutes, ergonomic keyboard assessment. Ice 15-20 minutes after work. Referred to physical therapy for eccentric strengthening program (Tyler twist exercises with flexbar). At 4 weeks pain improved 30%, continuing PT. At 8 weeks pain improved 60%, able to type with minimal discomfort. At 12 weeks pain improved 80%, grip strength nearly equal bilaterally. Continued home exercise program. At 6 months 95% resolved, minimal pain only after prolonged typing. No injection or surgery needed. Continues wrist extensor stretching and strengthening to prevent recurrence. Ergonomic workplace modifications maintained.
