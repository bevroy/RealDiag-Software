tree_id: ORTHO-KNEE-SPRAIN
name: Knee Sprain
family: orthopedics
specialty: Orthopedics
icd10: S83.90XA
snomed: 239720000
urgency: []
homeopathy: []
presentations:
  - Acute knee pain after twisting, pivoting, or direct blow to knee
  - Immediate or delayed swelling (hemarthrosis suggests ACL/PCL tear)
  - Pain with weight-bearing or knee movement
  - Instability or "giving way" sensation
  - Difficulty straightening or bending knee fully
  - Popping or tearing sensation at time of injury
  - Tenderness along ligament course (medial/lateral joint line, anterior/posterior)
  - Limited range of motion
workup:
  - Clinical assessment and mechanism of injury
  - Non-contact deceleration/pivoting: ACL tear
  - Valgus stress/contact to lateral knee: MCL sprain
  - Hyperextension or dashboard injury: PCL tear
  - Physical examination
  - Inspect for swelling, effusion, ecchymosis, deformity
  - Assess gait and ability to bear weight
  - Palpate joint lines, ligaments, patella, tibial tubercle
  - Range of motion testing (active and passive)
  - Ligament stability tests
  - Lachman test (ACL) - most sensitive for ACL tear
  - Anterior drawer test (ACL)
  - Pivot shift test (ACL) - most specific
  - Valgus stress test at 0° and 30° (MCL)
  - Varus stress test at 0° and 30° (LCL)
  - Posterior drawer test (PCL)
  - Meniscal tests (McMurray, Thessaly) if meniscus injury suspected
  - Imaging
  - Knee X-rays (AP, lateral, sunrise, tunnel views) to rule out fracture
  - MRI if suspected ligament tear or meniscal injury
  - Gold standard for assessing soft tissue structures
  - 90-95% sensitive for ACL/PCL tears
  - Ottawa knee rules for X-ray decision
  - X-ray if: age >55, isolated patellar tenderness, fibular head tenderness, inability to flex 90°, unable to bear weight 4 steps
  - Grading knee sprains
  - Grade 1: ligament stretched, no laxity, mild pain/swelling
  - Grade 2: partial ligament tear, mild-moderate laxity, moderate pain/swelling/instability
  - Grade 3: complete ligament tear, significant laxity, severe pain/swelling/instability
treatment:
  - Acute management (first 48-72 hours) - RICE protocol
  - Rest: crutches if unable to bear weight
  - Ice: 15-20 minutes every 2-3 hours
  - Compression: knee sleeve or wrap
  - Elevation: above heart to reduce swelling
  - Grade 1 sprains (MCL, LCL most common)
  - Weight-bearing as tolerated
  - Knee sleeve or hinged brace for comfort
  - Early range of motion exercises
  - Quadriceps strengthening (straight leg raises, quad sets)
  - Return to activities 2-4 weeks
  - Grade 2 sprains
  - Hinged knee brace for 4-6 weeks
  - Crutches initially, progress weight-bearing as tolerated
  - Physical therapy for ROM, strengthening, proprioception
  - Return to sports 6-8 weeks
  - Grade 3 sprains
  - MCL: usually non-operative (hinged brace, PT) - heals well
  - ACL: surgical reconstruction for active individuals, athletes
  - PCL: usually non-operative unless combined injury
  - LCL: often requires surgery, especially if combined with other injuries
  - Immobilization in brace initially, then structured PT
  - Pain management
  - NSAIDs: ibuprofen 600-800 mg TID or naproxen 500 mg BID
  - Acetaminophen 1000 mg TID alternative
  - Consider aspiration if large tense effusion
  - Rehabilitation
  - Early ROM to prevent stiffness
  - Quadriceps strengthening critical (prevents atrophy)
  - Hamstring strengthening
  - Closed-chain exercises (leg press, squats)
  - Proprioception and neuromuscular training
  - Sport-specific training before return to play
clinical_pearls:
  - "MCL most commonly injured knee ligament (40-50% of knee sprains)"
  - "ACL tear classic: non-contact pivot/deceleration, 'pop', immediate swelling (hemarthrosis)"
  - "Lachman test most sensitive for ACL tear (85-95% sensitive)"
  - "MCL Grade 1-2 sprains heal well non-operatively - surgery rarely needed"
  - "Unhappy triad: ACL + MCL + medial meniscus tear (severe valgus injury)"
  - "PCL tear rare (5-20% knee injuries) - dashboard injury or fall on flexed knee"
  - "Immediate large effusion suggests hemarthrosis (ACL, PCL, fracture, dislocation)"
  - "Isolated LCL injury rare - usually with other structures (posterolateral corner)"
referrals:
  - Orthopedic sports medicine if suspected ACL, PCL, or Grade 3 ligament tear
  - MRI recommended before orthopedic referral to guide treatment planning
  - Physical therapy for all Grade 2-3 sprains
  - Emergency orthopedics if knee dislocation (high risk vascular injury)
differentials:
  - MCL sprain (medial joint line pain, valgus stress laxity)
  - ACL tear (pop, immediate swelling, positive Lachman, pivot shift)
  - PCL tear (posterior drawer laxity, dashboard injury mechanism)
  - LCL sprain (lateral pain, varus stress laxity, less common)
  - Meniscal tear (joint line tenderness, locking, catching, positive McMurray)
  - Patellar dislocation (patella displaced laterally, young female athletes)
  - Fracture (tibial plateau, femoral condyle, patella)
  - Patellar tendon rupture (unable to extend knee, palpable gap)
  - Quadriceps tendon rupture (unable to extend knee, high-riding patella)
