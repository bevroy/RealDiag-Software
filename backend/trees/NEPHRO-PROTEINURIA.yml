tree_id: NEPHRO-PROTEINURIA
name: Proteinuria
family: nephrology
specialty: Nephrology/Primary Care
icd10: R80.9
snomed: 29738008
urgency: []
homeopathy: []
presentations:
  - Asymptomatic proteinuria detected on routine urinalysis (most common presentation)
  - Foamy or frothy urine (from protein)
  - Edema (periorbital, lower extremity) if nephrotic-range proteinuria
  - Fatigue and malaise
  - May have symptoms of underlying disease (diabetes, hypertension, lupus)
  - Hematuria if glomerular disease
  - Hypertension
  - Family history of kidney disease
workup:
  - Confirm and quantify proteinuria
  - Urine dipstick (screening tool)
  - Trace to 4+ (corresponds approximately to 15-500+ mg/dL)
  - False positives: concentrated urine, alkaline urine, hematuria
  - False negatives: dilute urine, non-albumin proteinuria
  - Urine protein-to-creatinine ratio (UPCR) - PREFERRED quantitative test
  - Spot urine sample (random)
  - "UPCR less than 0.2 mg/mg: normal"
  - "UPCR 0.2-3.5 mg/mg: non-nephrotic proteinuria"
  - "UPCR greater than 3.5 mg/mg: nephrotic-range proteinuria"
  - 24-hour urine collection (gold standard but cumbersome)
  - "Less than 150 mg/day: normal"
  - "150-3500 mg/day: non-nephrotic"
  - "Greater than 3500 mg/day: nephrotic-range"
  - Urine albumin-to-creatinine ratio (UACR) for diabetic nephropathy screening
  - "Less than 30 mg/g: normal"
  - "30-300 mg/g: moderately increased albuminuria (microalbuminuria)"
  - "Greater than 300 mg/g: severely increased albuminuria (macroalbuminuria)"
  - Classify type of proteinuria
  - Glomerular (albumin, from glomerular damage): diabetes, hypertension, glomerulonephritis
  - Tubular (low molecular weight proteins, from tubular dysfunction): interstitial nephritis, toxins
  - Overflow (excess protein production): multiple myeloma (light chains), myoglobin
  - Urinalysis with microscopy
  - Red blood cells and red cell casts suggest glomerulonephritis
  - White blood cells suggest infection or interstitial nephritis
  - Oval fat bodies or fatty casts suggest nephrotic syndrome
  - Laboratory evaluation
  - Basic metabolic panel (BUN, creatinine, eGFR, electrolytes)
  - Assess kidney function
  - Complete blood count
  - Fasting glucose and hemoglobin A1c (diabetes most common cause)
  - Lipid panel (dyslipidemia associated with nephrotic syndrome)
  - Serum albumin (low in nephrotic syndrome)
  - If nephrotic-range proteinuria or concern for glomerular disease
  - Complement levels (C3, C4)
  - Antinuclear antibody (ANA) for lupus
  - Anti-dsDNA, anti-Smith if ANA positive
  - Hepatitis B and C serologies
  - HIV testing
  - Serum and urine protein electrophoresis (multiple myeloma)
  - Renal ultrasound
  - Assess kidney size and echogenicity
  - Rule out structural abnormalities
  - Consider kidney biopsy if
  - Nephrotic-range proteinuria without clear cause
  - Proteinuria with declining kidney function
  - Concern for glomerulonephritis or systemic disease
  - Resistance to treatment
treatment:
  - Treat underlying cause
  - Diabetes: optimize glycemic control (HbA1c less than 7%)
  - Hypertension: target BP less than 130/80 mmHg
  - Glomerulonephritis: immunosuppression (steroids, cyclophosphamide) based on type
  - ACE inhibitor or ARB (FIRST-LINE antiproteinuric therapy)
  - Reduce proteinuria and slow progression of kidney disease
  - Lisinopril 10-40 mg daily or enalapril 5-20 mg twice daily
  - Losartan 50-100 mg daily or valsartan 80-320 mg daily
  - Monitor potassium and creatinine (may increase initially)
  - Continue if creatinine increase less than 30% and potassium less than 5.5 mEq/L
  - Combination ACE+ARB NOT recommended (increased side effects, no benefit)
  - SGLT2 inhibitors for diabetic kidney disease
  - Empagliflozin 10-25 mg daily or dapagliflozin 10 mg daily
  - Reduce proteinuria and slow CKD progression
  - Cardiovascular benefit
  - Blood pressure control
  - Target less than 130/80 mmHg (less than 125/75 if proteinuria greater than 1 g/day)
  - Dietary sodium restriction (less than 2 g/day)
  - Lipid management if nephrotic syndrome
  - Statin therapy (atorvastatin 10-80 mg or rosuvastatin 5-40 mg)
  - Edema management
  - Sodium restriction (less than 2 g/day)
  - Diuretics: furosemide 20-80 mg daily (titrate to effect)
  - Lifestyle modifications
  - Smoking cessation
  - Weight loss if obese
  - Regular exercise
  - Dietary protein restriction (0.8 g/kg/day) if CKD
  - Monitor and follow-up
  - Repeat UPCR or UACR every 3-6 months
  - BMP and eGFR every 3-6 months
  - Adjust treatment based on response
clinical_pearls:
  - "Proteinuria present in 5-10% of general population - often first sign of kidney disease"
  - "Diabetes and hypertension most common causes of proteinuria (70-80%)"
  - "ACE inhibitors and ARBs reduce proteinuria by 30-50% and slow CKD progression - cornerstone of therapy"
  - "Nephrotic syndrome: proteinuria greater than 3.5 g/day, hypoalbuminemia, edema, hyperlipidemia"
  - "Transient proteinuria can occur with fever, exercise, dehydration - repeat UA after resolution"
  - "Orthostatic proteinuria (in young adults): proteinuria when upright, resolves when supine - benign"
  - "Microalbuminuria (30-300 mg/g) earliest sign of diabetic nephropathy - start ACE/ARB immediately"
  - "Proteinuria is independent risk factor for cardiovascular disease and all-cause mortality"
referrals:
  - Nephrology for nephrotic-range proteinuria, rapidly declining kidney function, or unclear etiology
  - Nephrology if proteinuria persists despite optimal treatment
  - Nephrology for consideration of kidney biopsy
differentials:
  - Diabetic nephropathy (diabetes, microalbuminuria progressing to macroalbuminuria, retinopathy)
  - Hypertensive nephrosclerosis (long-standing hypertension, mild-moderate proteinuria)
  - Glomerulonephritis (hematuria, RBC casts, acute kidney injury, systemic symptoms)
  - Nephrotic syndrome (proteinuria greater than 3.5 g/day, hypoalbuminemia, edema, hyperlipidemia)
  - Orthostatic proteinuria (young adults, proteinuria only when upright, benign)
  - Transient proteinuria (fever, exercise, dehydration - resolves with treatment of cause)
  - Multiple myeloma (older adults, bone pain, anemia, light chains in urine)
  - Chronic kidney disease (elevated creatinine, small kidneys, anemia)
