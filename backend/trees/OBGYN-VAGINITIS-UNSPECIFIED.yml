tree_id: OBGYN-VAGINITIS-UNSPECIFIED
name: Vaginitis, Unspecified
family: obstetrics_gynecology
specialty: Gynecology/Primary Care
applies_to: female
icd10: N76.0
snomed: 30800001
urgency: []
homeopathy: []
presentations:
  - Abnormal vaginal discharge (change in color, amount, odor, or consistency)
  - Vaginal itching or irritation
  - Vaginal burning
  - Dysuria (external - burning when urine touches irritated tissues)
  - Dyspareunia (painful intercourse)
  - Vulvar erythema or swelling
  - Vaginal odor (fishy, foul)
  - May be asymptomatic with incidental finding on exam
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Characteristics of discharge (color, odor, consistency, amount)
  - Associated symptoms (itching, burning, dysuria, dyspareunia)
  - Recent antibiotic use
  - Douching or use of vaginal products
  - New sexual partner, multiple partners
  - Previous episodes and treatment response
  - Menstrual cycle timing
  - Diabetes history or risk factors
  - Immunosuppression (HIV, medications)
  - Pregnancy status
  - Physical examination
  - External genitalia inspection
  - Erythema, edema, excoriation
  - Fissures or ulcerations
  - Inguinal lymphadenopathy
  - Speculum examination
  - Inspect vaginal walls and cervix
  - Assess discharge characteristics
  - Color: white, gray, yellow-green
  - Consistency: thick, thin, frothy, curdy
  - Amount: scant, copious
  - Adherence to walls
  - Cervical appearance (cervicitis: mucopurulent discharge, friability)
  - Laboratory evaluation - POINT-OF-CARE testing preferred
  - Vaginal pH measurement
  - "Normal pH: 4.0-4.5"
  - "pH greater than 4.5: bacterial vaginosis or trichomoniasis"
  - "pH normal (less than 4.5): vulvovaginal candidiasis"
  - Wet mount microscopy (saline preparation)
  - Obtain vaginal discharge from posterior fornix or lateral wall
  - Mix with drop of normal saline on slide
  - Findings
  - Clue cells (epithelial cells with adherent bacteria): bacterial vaginosis
  - Motile trichomonads (flagellated protozoa): trichomoniasis
  - White blood cells (many suggest infection)
  - Whiff test (amine/KOH test)
  - Add drop of 10% KOH to discharge on slide
  - Positive test: fishy amine odor (bacterial vaginosis or trichomoniasis)
  - KOH preparation (fungal prep)
  - Add 10% KOH to discharge to lyse epithelial cells
  - Look for pseudohyphae and budding yeast: vulvovaginal candidiasis
  - Vaginal culture (if microscopy negative but symptoms present)
  - Fungal culture for recurrent candidiasis
  - Bacterial culture rarely helpful
  - Nucleic acid amplification testing (NAAT)
  - For Trichomonas vaginalis (more sensitive than wet mount)
  - For STI screening: gonorrhea and chlamydia if risk factors
  - Additional testing if indicated
  - Pregnancy test
  - HIV, syphilis screening if STI suspected
  - Fasting glucose or HbA1c if recurrent candidiasis (screen for diabetes)
treatment:
  - Bacterial vaginosis
  - Diagnosis: Amsel criteria (need 3 of 4)
  - Thin, gray-white homogeneous discharge
  - Clue cells on wet mount (greater than 20%)
  - Vaginal pH greater than 4.5
  - Positive whiff test (fishy odor with KOH)
  - Treatment regimens
  - Metronidazole 500 mg PO twice daily for 7 days (FIRST-LINE)
  - Metronidazole gel 0.75% one applicator intravaginally daily for 5 days
  - Clindamycin cream 2% one applicator intravaginally at bedtime for 7 days
  - Alternative: clindamycin 300 mg PO twice daily for 7 days
  - Avoid alcohol during metronidazole and 24 hours after (disulfiram reaction)
  - Treat in pregnancy (oral metronidazole preferred)
  - Partner treatment NOT recommended (not sexually transmitted)
  - Vulvovaginal candidiasis (yeast infection)
  - Diagnosis: vaginal pH less than 4.5, pseudohyphae/budding yeast on KOH prep
  - Uncomplicated candidiasis (mild-moderate symptoms, infrequent, C. albicans, non-immunocompromised)
  - Single-dose oral fluconazole 150 mg (MOST CONVENIENT)
  - Intravaginal azole therapies
  - Miconazole 2% cream or 200 mg suppository intravaginally for 3 days
  - Clotrimazole 1% cream or 100 mg tablet intravaginally for 7 days
  - Terconazole 0.4% cream or 80 mg suppository for 3 days
  - Available over-the-counter
  - Complicated candidiasis (severe symptoms, recurrent, non-albicans species, immunocompromised)
  - Recurrent (4 or more episodes per year)
  - Fluconazole 150 mg on days 1, 4, 7, then weekly for 6 months (suppressive therapy)
  - Screen for diabetes
  - Consider vaginal culture to identify non-albicans species
  - Severe symptoms: 7-14 days topical azole or two doses fluconazole 150 mg 72 hours apart
  - Pregnancy: topical azole only (fluconazole contraindicated)
  - Trichomoniasis
  - Diagnosis: motile trichomonads on wet mount or positive NAAT
  - Presentation: yellow-green frothy discharge, pH greater than 4.5, strawberry cervix
  - Treatment (sexually transmitted - treat partners)
  - Metronidazole 500 mg PO twice daily for 7 days (PREFERRED)
  - Alternative: tinidazole 2 g PO single dose or metronidazole 2 g PO single dose
  - Treat all sexual partners from past 60 days
  - Abstain from intercourse for 7 days after treatment
  - Test of cure in 3 months (high reinfection rates)
  - Safe in pregnancy (oral metronidazole)
  - Mixed infections
  - Can have more than one type simultaneously
  - Treat each identified pathogen
  - Non-infectious vaginitis
  - Atrophic vaginitis (postmenopausal): vaginal estrogen therapy
  - Irritant/allergic vaginitis: avoid irritants, topical corticosteroids
  - Cytolytic vaginosis (excess lactobacilli): baking soda sitz baths
  - Desquamative inflammatory vaginitis: clindamycin cream + hydrocortisone
  - Prevention counseling
  - Avoid douching (disrupts normal flora)
  - Avoid scented feminine products, bubble baths
  - Wear cotton underwear, avoid tight clothing
  - Wipe front to back
  - Change out of wet clothing promptly
  - Condom use to prevent STIs
clinical_pearls:
  - 'Bacterial vaginosis most common cause of vaginal discharge (40-50%), followed by candidiasis (20-25%) and trichomoniasis (15-20%)'
  - 'Vaginal pH single most useful test - pH greater than 4.5 rules OUT candidiasis (normal pH in VVC)'
  - 'Clue cells on wet mount pathognomonic for bacterial vaginosis - epithelial cells with stippled borders from adherent bacteria'
  - 'Wet mount sensitivity for Trichomonas only 60% - NAAT more sensitive (95%) if high suspicion and negative wet mount'
  - 'Bacterial vaginosis NOT sexually transmitted - partner treatment not recommended, does not reduce recurrence'
  - 'Fluconazole 150 mg single dose equally effective as 7 days topical azoles for uncomplicated candidiasis'
  - 'Recurrent candidiasis (4+ episodes/year) warrants diabetes screening - chronic hyperglycemia promotes yeast overgrowth'
  - 'Trichomoniasis IS sexually transmitted - must treat all partners or reinfection inevitable'
referrals:
  - Gynecology for recurrent vaginitis despite appropriate treatment
  - Infectious disease for refractory trichomoniasis or candidiasis in immunocompromised patients
  - Dermatology if suspicion for dermatologic condition (lichen sclerosus, lichen planus)
  - Allergy/immunology for suspected allergic vaginitis
differentials:
  - Bacterial vaginosis (thin gray discharge, clue cells, pH greater than 4.5, fishy odor)
  - Vulvovaginal candidiasis (thick white curdy discharge, pH less than 4.5, pseudohyphae, intense pruritus)
  - Trichomoniasis (yellow-green frothy discharge, pH greater than 4.5, motile trichomonads, strawberry cervix)
  - Cervicitis (mucopurulent cervical discharge, friability, caused by gonorrhea/chlamydia)
  - Atrophic vaginitis (postmenopausal, vaginal dryness, pH greater than 5, parabasal cells)
  - Physiologic discharge (white, floccular, no odor, pH 4.0-4.5, asymptomatic - normal)
  - Contact/irritant dermatitis (exposure to irritant, pruritus, normal wet mount)
  - Foreign body (retained tampon, pessary - foul odor, may see foreign body on exam)
