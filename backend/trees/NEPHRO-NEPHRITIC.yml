tree_id: NEPHRO-NEPHRITIC
name: Acute Nephritic Syndrome
family: Nephrology
specialty: Nephrology
icd10:
- N00.9
- N05.9
snomed:
- '236455006'
urgency: urgent
description: Comprehensive evaluation and management of Acute Nephritic Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Hematuria
- Proteinuria (< 3.5 g/day)
- Hypertension
- Edema
- Oliguria
- Red cell casts
workup:
- 'Urinalysis: RBC casts (pathognomonic for GN), dysmorphic RBCs, proteinuria'
- Serum creatinine, BUN (assess kidney function)
- Complement levels (C3, C4) - low suggests post-infectious, lupus, MPGN
- ASO titer, anti-DNase B (post-streptococcal GN)
- ANA, anti-dsDNA (lupus nephritis), ANCA (vasculitis), anti-GBM (Goodpasture)
- Renal biopsy if diagnosis unclear or suspected RPGN
treatment:
- 'Guideline-based treatment options for Acute Nephritic Syndrome include:'
- 'Supportive: Fluid/sodium restriction, diuretics for edema, antihypertensives (KDIGO
  2024)'
- 'Post-strep GN: Supportive only (self-limited in 4-6 weeks), antibiotics if active
  infection (KDIGO 2024)'
- 'RPGN: Urgent therapy - steroids, cyclophosphamide, plasmapheresis (based on etiology)
  (KDIGO 2024)'
- 'IgA nephropathy: ACEi/ARB to reduce proteinuria, steroids if rapidly progressive
  (KDIGO 2024)'
- Dialysis if severe AKI (KDIGO 2024)
clinical_pearls:
- Glomerular inflammation → hematuria (tea/cola-colored urine), RBC casts, hypertension,
  edema
- 'Post-streptococcal GN: Most common pediatric cause, 1-3 weeks after strep pharyngitis
  or impetigo'
- 'IgA nephropathy (Berger disease): Most common primary GN worldwide, hematuria during
  URI'
- 'RPGN (rapidly progressive GN): Crescent formation, rapid decline in GFR (weeks)
  - needs urgent treatment'
- 'Low C3/C4 complement: Post-strep GN, lupus nephritis, MPGN'
referrals:
- Nephrology for all nephritic syndrome (urgent if RPGN suspected)
- Renal biopsy if diagnosis unclear or suspected RPGN
differentials: []
