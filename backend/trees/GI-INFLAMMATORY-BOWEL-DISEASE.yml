tree_id: GI-INFLAMMATORY-BOWEL-DISEASE
name: Inflammatory Bowel Disease (Crohn Disease and Ulcerative Colitis)
family: Gastrointestinal
specialty: Gastroenterology
chief_complaint: Chronic diarrhea and abdominal pain
description: Chronic relapsing inflammatory conditions of GI tract - Crohn disease (transmural, skip lesions, mouth to anus) and ulcerative colitis (mucosal, continuous, colon only)

icd10: K50.90

urgency: urgent

workup:
  - Distinguish Crohn disease vs ulcerative colitis based on pattern and distribution
  - Crohn disease features: transmural inflammation (entire bowel wall), skip lesions (discontinuous), can affect any part GI tract (mouth to anus, commonly terminal ileum), fistulas and strictures, perianal disease common, spares rectum often, cobblestoning on endoscopy
  - Ulcerative colitis features: mucosal inflammation only (superficial), continuous inflammation (no skip lesions), limited to colon, always involves rectum and extends proximally, no fistulas, pseudopolyps on colonoscopy
  - Clinical presentation: chronic diarrhea (bloody in UC, may be non-bloody in Crohn), abdominal pain, weight loss, fatigue, low-grade fever, extraintestinal manifestations (arthritis, erythema nodosum, pyoderma gangrenosum, uveitis, primary sclerosing cholangitis with UC)
  - Laboratory: anemia (chronic blood loss, chronic disease), elevated inflammatory markers (CRP, ESR), hypoalbuminemia (malnutrition, protein-losing enteropathy), positive fecal calprotectin (elevated in active inflammation, useful to distinguish IBD from IBS)
  - Stool studies: exclude infection (C. difficile, Salmonella, Shigella, Campylobacter, E. coli O157:H7, ova and parasites), CMV colitis if immunosuppressed
  - Colonoscopy with biopsies: gold standard for diagnosis, UC shows continuous mucosal inflammation starting at rectum, friability, ulceration, pseudopolyps, Crohn shows skip lesions, cobblestoning, linear ulcers, aphthous ulcers
  - Upper endoscopy: if Crohn suspected (can involve upper GI tract)
  - CT or MRI enterography: assess small bowel in Crohn (wall thickening, strictures, fistulas, abscesses), MRI preferred in young patients (avoid radiation)
  - Serology: pANCA positive in 60-70 percent UC, ASCA positive in 60 percent Crohn (not diagnostic but supportive)

treatment:
  - Goals: induce remission, maintain remission, prevent complications, improve quality of life
  - Mild-moderate ulcerative colitis (proctitis or left-sided): 5-ASA (mesalamine) suppository 1000 mg daily or enema 4 grams daily for proctitis, oral 5-ASA (mesalamine 2.4-4.8 grams daily, sulfasalazine 4-6 grams daily) for more extensive disease
  - Moderate-severe UC: systemic corticosteroids (prednisone 40-60 mg daily) to induce remission, taper over 8-12 weeks, add immunomodulator (azathioprine 2-2.5 mg/kg daily or 6-mercaptopurine) as steroid-sparing agent, check TPMT enzyme before starting (avoid if deficient, risk severe myelosuppression)
  - Severe UC (greater than 6 bloody stools daily, fever, tachycardia, anemia): hospitalize, IV methylprednisolone 40-60 mg daily or hydrocortisone 100 mg every 8 hours, if no improvement in 3-5 days consider rescue therapy (infliximab or cyclosporine) or colectomy
  - Mild-moderate Crohn disease: budesonide 9 mg daily x 8 weeks (less systemic side effects than prednisone, effective for ileal/right colon disease) or systemic steroids, 5-ASA less effective in Crohn than UC
  - Moderate-severe Crohn: anti-TNF biologics (infliximab 5 mg/kg IV at 0, 2, 6 weeks then every 8 weeks, adalimumab 160 mg SC then 80 mg week 2 then 40 mg every 2 weeks), immunomodulators (azathioprine, methotrexate 25 mg SC weekly)
  - Perianal Crohn disease: antibiotics (metronidazole, ciprofloxacin) plus anti-TNF, may need surgical drainage if abscess
  - Maintenance therapy UC: 5-ASA (mesalamine) long-term, immunomodulators (azathioprine) if steroid-dependent, anti-TNF if moderate-severe
  - Maintenance Crohn: immunomodulators or anti-TNF biologics
  - Surgery: UC can be cured with total colectomy with ileal pouch-anal anastomosis (IPAA), Crohn surgery for complications (stricture, fistula, abscess) but disease recurs
  - Complications: toxic megacolon (medical emergency, colon dilation greater than 6 cm with systemic toxicity, IV steroids and surgery if no improvement), colon cancer risk (start surveillance colonoscopy after 8-10 years disease, dysplasia requires colectomy)

clinical_pearls:
  - Crohn transmural skip lesions mouth to anus, UC mucosal continuous colon only
  - UC always involves rectum, Crohn spares rectum often
  - Bloody diarrhea more common in UC, Crohn may have non-bloody diarrhea
  - Fecal calprotectin elevated distinguishes IBD from IBS
  - 5-ASA effective for UC, anti-TNF biologics for moderate-severe Crohn
  - Toxic megacolon medical emergency (colon dilation greater than 6 cm, systemic toxicity)
  - Colon cancer surveillance after 8-10 years IBD

differentials:
  - Irritable bowel syndrome (chronic diarrhea but normal labs, normal colonoscopy, no weight loss)
  - Infectious colitis (acute onset, stool cultures positive, resolves with treatment)
  - Celiac disease (diarrhea, malabsorption, positive tissue transglutaminase antibodies)
  - Microscopic colitis (chronic watery diarrhea, normal colonoscopy, biopsies show inflammation)

trace:
  - 24-year-old man presents with 4 months progressive diarrhea (5-7 bloody stools daily), crampy lower abdominal pain, urgency, tenesmus, 12-pound weight loss, low-grade fever
  - History: symptoms continuous (no symptom-free periods), worsening over time
  - Exam: thin, abdominal tenderness lower quadrants, no masses, perianal exam normal
  - Labs: hemoglobin 10.2 g/dL (anemia from chronic blood loss), MCV 78 fL (microcytic), ferritin 8 ng/mL (iron deficiency), albumin 3.2 g/dL (low), CRP 45 mg/L (elevated), ESR 58 mm/hr (elevated)
  - Stool studies: negative C. difficile, negative bacterial cultures, fecal calprotectin 850 mcg/g (markedly elevated, normal less than 50)
  - Colonoscopy: continuous friable mucosa with ulceration starting at rectum extending to splenic flexure (left-sided colitis), loss of vascular pattern, pseudopolyps, biopsies show chronic active colitis with crypt abscesses and distortion (consistent with ulcerative colitis)
  - Diagnosis: ulcerative colitis, moderate severity (5-7 bloody stools daily, anemia, elevated inflammatory markers)
  - Started prednisone 40 mg daily to induce remission, oral mesalamine 4.8 grams daily, iron supplementation
  - 2 weeks: diarrhea decreased to 2-3 stools daily (less bloody), abdominal pain improved
  - 4 weeks: near remission (1-2 formed stools daily, minimal blood), prednisone taper started
  - Added azathioprine 150 mg daily (2.5 mg/kg, TPMT normal) as steroid-sparing maintenance therapy
  - 8 weeks: clinical remission (normal formed stools, no blood, no pain), prednisone tapered off
  - Continued mesalamine 4.8 grams daily plus azathioprine 150 mg daily for maintenance
  - 6 months: sustained remission, hemoglobin 13.8 g/dL (normalized), CRP 3 mg/L (normal), fecal calprotectin 45 mcg/g (normal)
  - Counseled on colon cancer surveillance (start colonoscopy in 8 years after diagnosis)
  - 1 year: remains in remission on maintenance therapy, quality of life excellent
