tree_id: GI-INFLAMMATORY-BOWEL-DISEASE
name: Inflammatory Bowel Disease (Crohn's and Ulcerative Colitis)
family: Gastroenterology
specialty: Gastroenterology
chief_complaint: Chronic diarrhea with blood and abdominal pain
description: |
  Chronic inflammatory conditions of gastrointestinal tract. Crohn disease (CD) affects any part GI tract transmurally, skip lesions, fistulas common.
  Ulcerative colitis (UC) limited to colon, continuous inflammation from rectum proximally, mucosal only. Peak onset 15-35 years.
icd10: K50.90
urgency: Moderate
workup:
  - Complete blood count - anemia (chronic disease or blood loss), thrombocytosis, leukocytosis
  - Comprehensive metabolic panel - hypoalbuminemia, electrolyte abnormalities
  - Inflammatory markers - ESR and CRP elevated during active disease
  - Fecal calprotectin - elevated (greater than 150 mcg/g suggests IBD), useful for monitoring disease activity
  - Stool studies - culture, ova and parasites, C. difficile toxin (rule out infectious causes)
  - Colonoscopy with multiple biopsies (gold standard) - CD shows skip lesions, cobblestoning, linear ulcers, perianal disease; UC shows continuous inflammation starting from rectum, friability, loss of vascular pattern
  - Upper endoscopy if Crohn suspected (can involve upper GI)
  - CT or MRI enterography - evaluate small bowel in Crohn disease, assess complications (abscess, fistula, stricture)
  - Serologic markers - pANCA positive in 60% UC, ASCA positive in 60% CD (not diagnostic but supportive)
treatment:
  - 5-aminosalicylic acid (5-ASA) for mild-moderate UC - mesalamine 2.4-4.8g daily oral plus rectal suppositories or enemas
  - Corticosteroids for moderate-severe flares - prednisone 40-60mg daily, taper over 8-12 weeks; budesonide 9mg daily for ileal/right colon Crohn (fewer systemic effects)
  - Immunomodulators for steroid-dependent or maintenance - azathioprine 2-2.5 mg/kg/day, 6-mercaptopurine 1-1.5 mg/kg/day, methotrexate 15-25mg weekly (Crohn)
  - Biologic therapy for moderate-severe disease - anti-TNF agents (infliximab 5 mg/kg IV at 0, 2, 6 weeks then q8 weeks, adalimumab 160mg SC then 80mg week 2 then 40mg q2 weeks)
  - Alternative biologics - vedolizumab (gut-selective integrin inhibitor), ustekinumab (IL-12/23 inhibitor)
  - Surgery for complications - colectomy curative for UC, bowel resection for Crohn strictures/fistulas (recurrence common)
  - Nutritional support - vitamin D, calcium, B12 supplementation, iron replacement
  - Treat complications - abscess drainage, fistula management, osteoporosis prevention
clinical_pearls:
  - Crohn disease involves mouth to anus (most common terminal ileum and colon), transmural inflammation causes fistulas, strictures, abscesses
  - UC limited to colon, always involves rectum, extends proximally in continuous fashion, superficial mucosal inflammation
  - Extraintestinal manifestations in both - arthritis, erythema nodosum, pyoderma gangrenosum, primary sclerosing cholangitis (UC), uveitis, episcleritis
  - Toxic megacolon medical emergency - colon diameter greater than 6 cm with systemic toxicity, risk of perforation
  - UC increases colorectal cancer risk - start surveillance colonoscopy 8 years after diagnosis
  - Smoking worsens Crohn but protective for UC (mechanism unclear)
differentials:
  - Infectious colitis
  - Ischemic colitis
  - Celiac disease
  - Irritable bowel syndrome
  - Colorectal cancer
  - Diverticulitis
trace:
  - 25-year-old with bloody diarrhea 8-10 times daily, urgency, weight loss 20 lbs x 3 months → Colonoscopy shows continuous inflammation from rectum to splenic flexure, friability, loss of vascular pattern → Biopsies show chronic inflammation, crypt abscesses, no granulomas → Fecal calprotectin 850 mcg/g → Diagnose moderate ulcerative colitis → Start prednisone 40mg daily, mesalamine 4.8g daily plus 1g rectal suppositories nightly → No response after 2 weeks → Add infliximab 5 mg/kg IV at weeks 0, 2, 6 → Symptoms improve, taper prednisone → Continue infliximab q8 weeks and mesalamine maintenance → Clinical remission, fecal calprotectin normalizes
