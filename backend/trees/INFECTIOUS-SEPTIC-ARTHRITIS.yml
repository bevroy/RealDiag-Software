author: RealDiag Clinical Team

entry_point: septic_arthritis_evaluation

nodes:
  - id: septic_arthritis_evaluation
    type: diagnosis
    name: "Septic Arthritis"
    icd10: "M00.9"
    urgency: critical
    workup:
      - Joint infection - Medical/surgical emergency, delay causes irreversible cartilage destruction
      - Pathophysiology - Hematogenous seeding (most common), direct inoculation (trauma, injection, surgery), contiguous spread (osteomyelitis, cellulitis)
      - Bacteria proliferate in synovial fluid, trigger inflammatory response, release enzymes (proteases, collagenases) → cartilage destruction within hours to days
      - Risk factors - Advanced age, immunosuppression (diabetes, HIV, steroids, chemotherapy), pre-existing joint disease (RA, OA, prosthetic joint), IVDU, skin infection, recent joint surgery/injection
      - Clinical presentation - Acute monoarticular arthritis (80-90% monoarticular)
      - Severe joint pain, swelling, warmth, erythema, decreased/painful range of motion (patient refuses to move joint)
      - Fever (60%), chills, systemic symptoms
      - Most common joints - Knee (50%), hip (20%), shoulder, ankle, wrist
      - Polyarticular (10-20%) - Higher risk if RA, IVDU, gonococcal arthritis, overwhelming sepsis
      - Knee most accessible for arthrocentesis, hip requires ultrasound/fluoroscopy guidance
      - Differential diagnosis - Gout (crystals), pseudogout (CPPD), reactive arthritis, RA flare, cellulitis
      - MUST rule out septic arthritis (cannot wait for culture results, empiric treatment based on clinical suspicion)
      - Diagnostic workup - ARTHROCENTESIS (joint aspiration) mandatory before antibiotics
      - Do NOT delay if high suspicion (but do before antibiotics if possible)
      - Synovial fluid analysis
      - Cell count with differential - WBC >50,000 (often >100,000) with >90% neutrophils = septic until proven otherwise
      - WBC 25,000-50,000 gray zone (can be septic or inflammatory - gout, RA)
      - Gram stain - Positive 50-70% (S. aureus Gram-positive cocci in clusters, N. gonorrhoeae Gram-negative diplococci)
      - Culture - Gold standard, 70-90% positive (blood culture bottles increase yield), hold 5-7 days
      - Crystal analysis - Polarized microscopy (rule out gout, pseudogout - can coexist with septic)
      - Blood cultures - Positive 25-50% (bacteremia), obtain before antibiotics
      - Labs - CBC (leukocytosis), ESR/CRP (elevated, nonspecific), blood cultures
      - Imaging
      - X-ray - Normal early, later shows joint effusion, soft tissue swelling, (late) cartilage loss, osteomyelitis
      - Ultrasound - Detect effusion, guide arthrocentesis (especially hip)
      - MRI - Assess for osteomyelitis (if suspect contiguous spread), evaluate prosthetic joint infection
      - Common organisms
      - S. aureus (40-50%) - Most common overall, MRSA increasing (15-30%), aggressive, rapid destruction
      - Streptococcus (25-30%) - Group A, B, viridans, pneumococcus
      - Gram-negative (10-15%) - E. coli, Pseudomonas (IVDU, elderly, immunocompromised)
      - N. gonorrhoeae (gonococcal arthritis) - Young sexually active, migratory polyarthralgia, tenosynovitis, dermatitis (pustules), culture-negative (culture genital/pharyngeal/rectal sites), NAAT positive
      - Prosthetic joint infection - S. aureus, S. epidermidis (coagulase-negative staph), Gram-negatives
    treatment:
      - Empiric antibiotics - Start immediately after arthrocentesis (do NOT delay for culture results)
      - Tailor based on Gram stain, patient factors, risk factors
      - Native joint septic arthritis
      - No Gram stain or Gram-positive cocci (suspect S. aureus, Streptococcus)
      - Vancomycin 15-20 mg/kg IV q8-12h (target trough 15-20) - Covers MRSA + strep
      - If MSSA confirmed (susceptible oxacillin) - Switch to nafcillin 2 g IV q4h or cefazolin 2 g IV q8h (more effective than vancomycin for MSSA)
      - Gram-negative rods
      - Ceftriaxone 2 g IV daily OR cefepime 2 g IV q8h
      - Add antipseudomonal coverage if IVDU or risk factors (cefepime, piperacillin-tazobactam, meropenem)
      - Gonococcal arthritis (young, sexually active, tenosynovitis)
      - Ceftriaxone 1-2 g IV daily x 7-14 days
      - Treat concurrent chlamydia (doxycycline 100 mg PO BID x 7 days or azithromycin 1 g PO x1)
      - Partner notification, test for other STIs (HIV, syphilis)
      - Duration - 2-4 weeks IV antibiotics (minimum 2 weeks if good response, uncomplicated; 4-6 weeks if S. aureus, delayed diagnosis, slow response)
      - Switch to PO if improving after 2 weeks and highly bioavailable oral option (fluoroquinolones for Gram-negatives, doxycycline for gonorrhea)
      - Longer if osteomyelitis (6 weeks total)
      - Joint drainage - ESSENTIAL, antibiotics alone insufficient
      - Serial arthrocentesis - Knee, shoulder, ankle (accessible joints), daily or every 1-2 days until fluid reaccumulates slowly and WBC declining
      - Arthroscopic drainage/lavage - More effective than needle aspiration, debride fibrin/pus, single procedure, preferred for most cases
      - Open arthrotomy (surgical drainage) - If arthroscopy not available, hip (requires open drainage), failed arthroscopy, extensive loculations, concomitant osteomyelitis
      - Prosthetic joint infection - More complex, biofilm formation
      - Acute (<3 weeks) or hematogenous (well-fixed prosthesis, short symptom duration <3 weeks)
      - Debridement, antibiotics, implant retention (DAIR)
      - Irrigation/debridement, exchange modular components (liner), long-term antibiotics (4-6 weeks IV then PO suppression 3-6 months)
      - Success rate 50-60%
      - Chronic (>3 weeks) or loosened prosthesis
      - Two-stage exchange - Remove prosthesis, antibiotic spacer, 6-8 weeks IV antibiotics, reimplant new prosthesis
      - Gold standard, success 80-90%
      - One-stage exchange - Remove + reimplant same surgery (shorter recovery, but higher failure)
      - Suppressive antibiotics - If not surgical candidate, PO antibiotics lifelong (not curative)
      - Supportive care - Rest initially, then physical therapy (ROM exercises to prevent stiffness/contracture), pain management
      - Monitoring - Repeat arthrocentesis in 48-72 hours (WBC should decline 50% by 5-7 days), blood cultures if bacteremic, inflammatory markers (CRP decline indicates response)
      - Complications - Joint destruction (20-30% develop chronic arthritis, limited ROM), osteomyelitis (contiguous spread), sepsis/death (10-15% mortality in elderly/immunocompromised)
      - Prognosis - Depends on organism, time to treatment, joint affected
      - S. aureus worse outcomes (more destructive)
      - Hip worse than knee (harder to drain, contiguous osteomyelitis)
      - Delayed treatment (>7 days) → irreversible damage
