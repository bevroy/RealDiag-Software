tree_id: ORTHO-COMPARTMENT-SYNDROME
name: Compartment Syndrome
family: Orthopedics
specialty: Orthopedics
icd10:
- T79.A19A
snomed:
- 111243008
urgency: medium
description: Comprehensive evaluation and management of Compartment Syndrome
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Severe pain out of proportion to exam
- Pain with passive stretch of muscles
- Tense, swollen compartment
- Paresthesias, weakness
- 'Late findings: pulselessness, pallor (indicates irreversible damage)'
- Follows trauma, fracture, or prolonged limb compression
- Compartment pressure > 30 mmHg
workup:
- 'Clinical diagnosis: Pain out of proportion, pain with passive stretch (earliest
  signs), tense compartment'
- 'Compartment pressure measurement: >30 mmHg absolute OR delta P <30 mmHg (diastolic
  BP minus compartment pressure) = fasciotomy'
- 'Late findings (indicates damage already occurred): Paresthesias, paralysis, pulselessness,
  pallor'
- 'X-ray: Identify fracture (tibial shaft most common), but don''t delay treatment
  for imaging'
treatment:
- 'Guideline-based treatment options for Compartment Syndrome include:'
- 'EMERGENCY fasciotomy: If clinical diagnosis (pain out of proportion + passive stretch
  pain) OR compartment pressure >30 mmHg (or delta P <30 mmHg) (AAOS 2023)'
- 'Delta P: Diastolic BP minus compartment pressure. If <30 mmHg = inadequate perfusion
  pressure, needs fasciotomy (AAOS 2023)'
- 'Remove all constricting dressings/casts immediately: May be sufficient if caught
  early (AAOS 2023)'
- Elevate limb to heart level only (NOT above heart - decreases arterial inflow) (AAOS
  2023)
- DO NOT delay fasciotomy for imaging or pressure measurement if high clinical suspicion
  (AAOS 2023)
clinical_pearls:
- ORTHOPEDIC EMERGENCY - irreversible muscle/nerve damage within 6-8 hours if untreated
- Increased pressure in fascial compartment compromises perfusion - ischemia, necrosis,
  Volkmann contracture
- 'Pain out of proportion + pain with passive stretch: Most sensitive early findings
  (5 P''s are late: Pain, Pallor, Paresthesias, Pulselessness, Paralysis)'
- Pulse present does NOT rule out compartment syndrome - arterial pressure higher
  than capillary/venous pressure
- 'Common causes: Tibial fracture (40%), crush injury, burns, tight casts/dressings,
  prolonged limb compression (unconscious patient)'
referrals:
- Orthopedic surgery EMERGENTLY - call immediately for fasciotomy
- If high clinical suspicion, DO NOT wait for pressure measurement - irreversible
  damage occurs in 6-8 hours
differentials:
  - DVT
  - Cellulitis
  - Muscle strain
  - Fracture
trace:
  source: American Academy of Orthopaedic Surgeons (AAOS) Clinical Practice Guidelines,
    Orthopaedic Trauma Association (OTA)
