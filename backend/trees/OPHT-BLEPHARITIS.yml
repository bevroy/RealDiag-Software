tree_id: OPHT-BLEPHARITIS
name: Blepharitis
family: Ophthalmology
specialty: Ophthalmology
icd10:
- H01.009
snomed:
- 41446000
urgency: medium
description: Comprehensive evaluation and management of Blepharitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Chronic eyelid inflammation
- Burning, itching, gritty sensation
- Crusting at base of eyelashes
- Red eyelid margins
- Dry eyes
- May be anterior (staphylococcal) or posterior (meibomian gland dysfunction)
workup:
- 'Clinical diagnosis: Slit lamp exam shows lid margin erythema, telangiectasias,
  capped meibomian glands, crusting'
- 'Express meibomian glands: Assess secretion quality (clear/thin normal, thick/toothpaste-like
  abnormal)'
- 'Schirmer test or TBUT: If dry eye symptoms (often coexists)'
treatment:
- 'Guideline-based treatment options for Blepharitis include:'
- 'Lid hygiene (cornerstone of treatment): Warm compresses 10-15 min BID + gentle
  lid scrubs with dilute baby shampoo or commercial lid wipes (AAO 2023)'
- 'Anterior blepharitis: Bacitracin or erythromycin ointment to lid margin qHS x1-2
  weeks (AAO 2023)'
- 'Posterior blepharitis: Omega-3 fatty acids 1000-2000mg daily (improves meibum quality),
  doxycycline 50-100mg daily x1-3 months (anti-inflammatory + meibum) (AAO 2023)'
- 'Artificial tears: For associated dry eye symptoms (AAO 2023)'
- 'Treat rosacea: If present, oral doxycycline improves both (AAO 2023)'
clinical_pearls:
- Chronic bilateral eyelid margin inflammation - often associated with seborrheic
  dermatitis or rosacea
- 'Anterior blepharitis: Staphylococcal or seborrheic - crusting/scales at lash base
  (collarettes)'
- 'Posterior blepharitis (meibomian gland dysfunction, MGD): Plugged glands, frothy
  tear film, oil layer disruption'
- Often coexists with dry eye syndrome (evaporative type from poor meibum quality)
- Chronic relapsing condition - requires long-term maintenance therapy, not curable
referrals:
- 'Ophthalmology if: Not responding to lid hygiene + topical/oral therapy, vision
  affected, corneal involvement (keratitis)'
- Most chronic blepharitis managed by primary care with long-term maintenance
differentials: []
