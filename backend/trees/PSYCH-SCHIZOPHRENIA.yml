presentations:
  - 'Positive symptoms: Delusions, hallucinations (auditory most common), disorganized speech/behavior'
  - 'Negative symptoms: Flat affect, alogia (poverty of speech), avolition (lack of motivation), anhedonia'
  - 'Cognitive symptoms: Impaired attention, memory, executive function'
  - Symptoms ≥6 months, with ≥1 month of active-phase symptoms
  - Significant functional decline (work, relationships, self-care)
  - 'First-episode psychosis: Typically late teens to early 30s'
differentials:
  - Schizoaffective disorder
  - Bipolar disorder with psychosis
  - Drug-induced psychosis
  - Brief psychotic disorder
workup:
  - Urine drug screen (rule out substance-induced psychosis)
  - CBC, CMP, TSH (medical causes)
  - MRI brain if atypical presentation (first episode, focal neuro signs)
  - 'Baseline: Weight, BMI, glucose, HgA1c, lipid panel (before starting antipsychotics)'
treatment:
  - 'Guideline-based treatment options for Schizophrenia include:'
  - 'Atypical antipsychotic: Risperidone 2-6mg/day, olanzapine 10-20mg/day, or quetiapine 400-800mg/day (APA 2022)'
  - 'Aripiprazole 10-30mg/day: Lower metabolic side effects (APA 2022)'
  - 'Clozapine 300-450mg/day: If treatment-resistant (failed 2+ antipsychotics), requires weekly CBC (APA 2022)'
  - 'Psychosocial: Supported employment, cognitive remediation, family psychoeducation (APA 2022)'
  - 'Hospitalization if: Acute psychosis with danger to self/others, unable to care for self (APA 2022)'
clinical_pearls:
  - 'Rule out medical/substance causes: Drugs (stimulants, cannabis), delirium, brain tumor, autoimmune encephalitis'
  - 'Atypical antipsychotics first-line: Risperidone, olanzapine, quetiapine, aripiprazole'
  - 'Clozapine for treatment-resistant: Most effective but requires weekly CBC (agranulocytosis risk)'
  - 'Long-acting injectables: Improve adherence (paliperidone, risperidone, aripiprazole monthly)'
  - 'Monitor: Weight, glucose, lipids (metabolic syndrome common with antipsychotics)'
red_flags: []
