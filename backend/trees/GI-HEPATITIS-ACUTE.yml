tree_id: GI-HEPATITIS-ACUTE
name: Acute Hepatitis (Unspecified/Other)
family: gastroenterology
specialty: Gastroenterology, Infectious Disease
icd10: K72.00
snomed: 37871000
urgency: []
homeopathy: []
presentations:
  - Acute onset of jaundice (yellowing of skin and eyes)
  - Dark urine (tea-colored) and pale stools
  - Right upper quadrant pain or discomfort
  - Nausea, vomiting, and anorexia
  - Fatigue and malaise
  - Fever (especially in viral hepatitis)
  - Pruritus (from cholestasis)
  - Marked elevation of transaminases (ALT/AST >10x ULN typical)
  - May have fulminant hepatic failure (encephalopathy, coagulopathy)
workup:
  - Liver function tests: ALT, AST, alkaline phosphatase, total and direct bilirubin
  - Hepatocellular pattern: very high transaminases (>10x ULN), moderate bilirubin elevation
  - Synthetic function: PT/INR, albumin (assess severity)
  - Complete blood count
  - Viral hepatitis serologies
  - Hepatitis A IgM (acute infection)
  - Hepatitis B: HBsAg, anti-HBc IgM, HBV DNA
  - Hepatitis C: anti-HCV antibody, HCV RNA
  - Hepatitis E IgM (especially if travel to endemic area)
  - EBV and CMV serology if suspected
  - Autoimmune markers: ANA, anti-smooth muscle antibody, anti-LKM, IgG levels
  - Medication/toxin screen: acetaminophen level, urine drug screen
  - Ceruloplasmin and 24-hour urine copper (Wilson's disease if <40 years)
  - Right upper quadrant ultrasound with Doppler
  - Rule out biliary obstruction, assess liver parenchyma, check hepatic vein patency (Budd-Chiari)
  - Pregnancy test in women of childbearing age (AFLP, HELLP syndrome)
treatment:
  - Supportive care (no specific treatment for most viral hepatitis)
  - Hospitalization if severe (INR >1.5, encephalopathy, inability to maintain hydration)
  - IV fluids, antiemetics, nutritional support
  - Avoid hepatotoxic medications (acetaminophen, NSAIDs, alcohol, herbal supplements)
  - Monitor liver function tests and INR closely
  - Specific treatments based on etiology
  - Acetaminophen overdose: N-acetylcysteine (NAC) - start immediately if suspected
  - Autoimmune hepatitis: prednisone ± azathioprine
  - Hepatitis B: consider antiviral therapy (tenofovir, entecavir) if severe or fulminant
  - Herpes simplex hepatitis: acyclovir IV (high mortality if untreated)
  - Wilson's disease: chelation therapy, liver transplant evaluation
  - Drug-induced liver injury: discontinue offending agent
  - Fulminant hepatic failure management
  - ICU admission, liver transplant evaluation
  - Lactulose for encephalopathy, fresh frozen plasma for coagulopathy
  - Monitor for complications (cerebral edema, renal failure, sepsis)
  - Avoid sedatives and hepatotoxic drugs
clinical_pearls:
  - "Acute hepatitis defined as sudden onset of liver inflammation with transaminases >10x ULN"
  - "Most common causes: viral (HAV, HBV, HCV, HEV, EBV, CMV), drug-induced (acetaminophen, antibiotics), autoimmune"
  - "Acetaminophen toxicity most common cause of acute liver failure in US"
  - "Fulminant hepatic failure: encephalopathy within 26 weeks of onset in patient without pre-existing liver disease"
  - "AST:ALT ratio >2 suggests alcoholic hepatitis; very high transaminases (>1000) suggest viral, drug-induced, or ischemic"
  - "Hepatitis A and E are self-limited, do not cause chronic infection"
  - "Wilson's disease should be considered in all patients <40 with acute hepatitis of unknown cause"
  - "Drug-induced liver injury (DILI) has many patterns - hepatocellular, cholestatic, or mixed"
referrals:
  - Gastroenterology/Hepatology for all cases of acute hepatitis
  - Hospital admission if severe hepatitis (INR >1.5, encephalopathy, bilirubin >10)
  - Liver transplant center if fulminant hepatic failure or signs of decompensation
  - Intensive care if encephalopathy or multi-organ failure
differentials:
  - Viral hepatitis (HAV, HBV, HCV, HEV, EBV, CMV, HSV)
  - Drug-induced liver injury (acetaminophen, antibiotics, NSAIDs, herbal supplements)
  - Autoimmune hepatitis (young women, elevated IgG, positive autoantibodies)
  - Alcoholic hepatitis (heavy alcohol use, AST:ALT >2, neutrophilia)
  - Ischemic hepatitis (shock liver, very high transaminases >1000, cardiac or hypotensive event)
  - Wilson's disease (young age <40, hemolytic anemia, neurologic symptoms, low ceruloplasmin)
  - Acute Budd-Chiari syndrome (hepatic vein thrombosis, RUQ pain, hepatomegaly, ascites)
  - AFLP or HELLP syndrome (pregnant women, third trimester)
  - Bile duct obstruction (choledocholithiasis, cholangitis) - cholestatic pattern more common
