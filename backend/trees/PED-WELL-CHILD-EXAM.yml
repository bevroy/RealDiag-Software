tree_id: PED-WELL-CHILD-EXAM
name: Well-Child Examination (Pediatric)
family: pediatrics
specialty: Pediatrics/Family Medicine
icd10: Z00.129
snomed: 410620009
urgency: []
homeopathy: []
presentations:
  - Routine health maintenance visit
  - Well-child check
  - Physical examination for healthy child
  - Growth monitoring
  - Developmental screening
  - Immunization administration
  - Anticipatory guidance for parents
  - Age-specific preventive care
workup:
  - Bright Futures schedule (AAP recommended visit timing)
  - Newborn (3-5 days after hospital discharge)
  - "1 month, 2 months, 4 months, 6 months, 9 months"
  - "12 months, 15 months, 18 months"
  - "24 months (2 years), 30 months (2.5 years)"
  - "3 years, then ANNUAL visits ages 4-21 years"
  - More frequent if preterm or medical complexity
  - Interval history
  - Nutrition (breastfeeding, formula, solids introduction, diet quality)
  - Sleep patterns and safe sleep practices
  - Elimination (stool/urine frequency, toilet training)
  - Development (milestones achieved since last visit)
  - Behavior and temperament
  - Social interactions (daycare, school, peers)
  - Screen time and media use
  - Safety (car seat, home safety, supervision)
  - Family dynamics and psychosocial stressors
  - Review of systems
  - Physical examination (comprehensive)
  - Vital signs (HR, RR, BP starting age 3, temperature if concern)
  - Growth parameters
  - Weight, length/height, head circumference (until age 3)
  - Plot on WHO (0-2 years) or CDC (2+ years) growth charts
  - BMI calculation (age 2+) and percentile
  - General appearance and nutrition
  - HEENT (fontanelles in infants, dentition, red reflex, tympanic membranes, oral cavity)
  - Cardiovascular (heart sounds, femoral pulses, signs of CHD)
  - Respiratory (breath sounds, work of breathing)
  - Abdomen (masses, organomegaly, hernias)
  - Genitourinary (Tanner staging in adolescents, testicular descent, hypospadias)
  - Musculoskeletal (hip dysplasia screening in infants, scoliosis screening age 10+, gait)
  - Neurological (tone, reflexes, developmental milestones)
  - Skin (birthmarks, rashes, neurocutaneous lesions)
  - Developmental surveillance and screening
  - Observe parent-child interaction
  - Assess developmental domains (gross motor, fine motor, language, social-emotional, cognitive)
  - Standardized screening tools at 9, 18, 24-30 months (ASQ, PEDS, SWYC)
  - Autism-specific screening at 18 and 24 months (M-CHAT-R)
  - Vision and hearing screening
  - Newborn hearing screen (before hospital discharge)
  - Vision assessment at every visit (red reflex, eye alignment, pupil reactivity)
  - Formal vision screening age 3-5 years (Snellen chart or picture cards)
  - Hearing screening at 4, 5, 6, 8, and 10 years, then age 11-14, 15-17, 18-21
  - Laboratory screening
  - Newborn metabolic screen (state-mandated, typically 24-48 hours after birth)
  - Hemoglobin/hematocrit at 12 months (anemia screening) - universal or risk-based per local guidelines
  - Lead screening at 12 and 24 months (or per state requirements)
  - Lipid screening once between 9-11 years and again 17-21 years (or earlier if risk factors)
  - Tuberculosis screening (if risk factors) - annual or per local guidelines
  - Sexually transmitted infection screening (adolescents per sexual history)
  - Depression screening annually ages 12-21 years (PHQ-A, PHQ-2)
  - Other screening
  - Oral health risk assessment at every visit (dental home by 12 months)
  - Fluoride varnish application (6 months - 5 years if no dental home)
  - Psychosocial screening (ACEs, maternal depression, domestic violence, food insecurity)
  - Substance use screening (CRAFFT) starting age 11
treatment:
  - Immunizations per CDC schedule
  - Birth: Hepatitis B #1
  - 2 months: DTaP, IPV, Hib, PCV13, Rotavirus, Hepatitis B #2
  - 4 months: DTaP, IPV, Hib, PCV13, Rotavirus
  - 6 months: DTaP, Hib, PCV13, Rotavirus (if 3-dose), Hepatitis B #3, Influenza (annually starting 6 months)
  - 12 months: MMR, Varicella, Hepatitis A #1, PCV13
  - 15 months: DTaP, Hib
  - 18 months: Hepatitis A #2
  - 4-6 years: DTaP, IPV, MMR, Varicella
  - 11-12 years: Tdap, MenACWY, HPV (2-dose series)
  - 16 years: MenACWY booster, MenB (optional)
  - Annual influenza vaccine starting 6 months
  - COVID-19 vaccine per current CDC recommendations
  - Anticipatory guidance (age-appropriate)
  - Newborn/infant (0-12 months)
  - Breastfeeding support (exclusive until 6 months)
  - Safe sleep (back to sleep, firm surface, no loose bedding, room-sharing without bed-sharing)
  - Introduce solids around 6 months (allergenic foods early)
  - No honey before 12 months (botulism risk)
  - Vitamin D supplementation (400 IU daily if breastfed)
  - Car seat (rear-facing until age 2 or height/weight limits)
  - Toddler (1-3 years)
  - Nutrition: whole milk until age 2, transition to balanced diet
  - Limit juice (4 oz/day max), avoid sugar-sweetened beverages
  - Toilet training (typically 18-36 months, child-led approach)
  - Discipline strategies (positive reinforcement, time-outs, consistency)
  - Screen time: avoid <18 months except video chat, limit to 1 hour/day high-quality programming 18-24 months
  - Car seat: rear-facing until age 2, then forward-facing with harness
  - Safety: poison control (1-800-222-1222), water safety, supervision
  - Preschool (3-5 years)
  - School readiness (socialization, pre-literacy skills)
  - Screen time limit: 1 hour/day high-quality programming, co-view with parent
  - Car seat: forward-facing with harness until 40+ pounds, then booster
  - Stranger danger and body safety education
  - School-age (6-12 years)
  - Physical activity (60 minutes daily)
  - Nutrition: balanced diet, limit fast food and sugary drinks
  - Screen time: consistent limits, no screens in bedroom, monitor content
  - Homework routines and sleep hygiene (9-12 hours/night)
  - Bullying awareness and social skills
  - Booster seat until 4'9" tall (typically age 8-12)
  - Adolescent (13-21 years)
  - HEADSS assessment (Home, Education, Activities, Drugs, Sexuality, Suicide/depression)
  - Confidential time with provider (without parent)
  - Substance use prevention
  - Sexual health education, contraception, STI prevention
  - Mental health screening (depression, anxiety, eating disorders)
  - Screen time and social media awareness
  - Driving safety (seat belts, distracted driving, substance use)
  - College/career planning
  - Injury and violence prevention
  - Fluoride supplementation (if water not fluoridated)
  - Dental home establishment by 12 months
  - Sun protection and skin cancer prevention
  - Family planning and parenting resources
clinical_pearls:
  - 'Bright Futures schedule: newborn, 1/2/4/6/9/12/15/18/24/30 months, then annual age 3-21 years'
  - 'Developmental screening with standardized tools at 9, 18, 24-30 months; autism screening at 18 and 24 months'
  - 'Red reflex examination at EVERY visit (until 3 years) to detect cataracts, retinoblastoma, or other ocular abnormalities'
  - 'Lead screening at 12 and 24 months (or per state requirements) - cognitive effects irreversible'
  - 'Depression screening annually starting age 12 - suicide is 2nd leading cause of death in adolescents'
  - 'Confidential time with adolescent patients (without parent) essential for honest discussion of risky behaviors'
  - 'Safe sleep: back to sleep, firm surface, room-sharing without bed-sharing - reduces SIDS by 50%'
  - 'Rear-facing car seat until age 2 (or height/weight limits) - 5x safer than forward-facing for children <2 years'
  - 'Introduce allergenic foods (peanuts, eggs, dairy) around 6 months to REDUCE allergy risk - do not delay'
  - 'Screen time limits: none <18 months (except video chat), 1 hour/day age 2-5 years, consistent limits age 6+'
referrals:
  - Audiology if failed hearing screen or parental concern
  - Ophthalmology if abnormal red reflex, strabismus, or failed vision screen
  - Dentistry for dental home by 12 months, dental caries, or malocclusion
  - Early intervention services (birth-3 years) if developmental delay or parental concern
  - Developmental-behavioral pediatrics if developmental delay, autism, ADHD, or behavioral concerns
  - Nutrition/dietitian if failure to thrive, obesity, or feeding disorders
  - Mental health (child psychiatry, psychology) if depression, anxiety, behavioral problems, or substance use
  - Cardiology if heart murmur (not innocent), abnormal femoral pulses, or hypertension
  - Endocrinology if abnormal growth (short stature, tall stature), obesity, or early/delayed puberty
  - Orthopedics if hip dysplasia, scoliosis, or musculoskeletal abnormality
  - Social work for psychosocial concerns, family stressors, or resource navigation
differentials:
  - This is preventive care visit, not diagnostic encounter
  - Well-child exam identifies normal growth/development versus variations or abnormalities
  - Common findings requiring follow-up
  - Growth abnormalities (failure to thrive, obesity, short stature)
  - Developmental delay (motor, speech, social, cognitive)
  - Vision or hearing impairment
  - Heart murmur or abnormal cardiac exam
  - Anemia (iron deficiency most common)
  - Lead exposure/toxicity
  - Hypertension (obesity-related or secondary causes)
  - Behavioral/mental health concerns (ADHD, anxiety, depression)
  - Dental caries
