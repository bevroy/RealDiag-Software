id: OPHTHO-DIPLOPIA
title: Diplopia (Double Vision) Diagnostic Tree
family: Ophthalmology
specialty: Ophthalmology/Neurology/Emergency Medicine
version: 1.0
icd10: A64
snomed: 246636008
presentations:
  - Double vision
  - May be horizontal, vertical, or oblique
  - Worse with certain gaze directions
  - Ptosis, pupil abnormality
  - May have headache, eye pain
  - Acute or chronic onset
last_updated: 2025-11-20
evidence_level: AAO Preferred Practice Patterns, AAN Guidelines
entry: monocular_vs_binocular

clinical_pearls:
  - Monocular diplopia (persists with one eye covered) = ocular cause (cataract, cornea, refractive)
  - Binocular diplopia (resolves covering either eye) = misalignment (nerve, muscle, mechanical)
  - Acute binocular diplopia = stroke, aneurysm, or mass until proven otherwise
  - Painful third nerve palsy with pupil involvement = aneurysm until proven otherwise (urgent CTA/MRA)
  - Ptosis + pupil sparing third nerve palsy = likely microvascular (diabetes, hypertension)
  - Variable diplopia worsening with fatigue = myasthenia gravis

red_flags:
  - Painful third nerve palsy with dilated pupil (posterior communicating artery aneurysm)
  - Diplopia + severe headache (aneurysm, GCA, ICP elevation)
  - Diplopia + other neurologic signs (stroke, MS, tumor)
  - Bilateral sixth nerve palsies (increased ICP)
  - Progressive diplopia (tumor, thyroid eye disease, myasthenia)

differentials:
  - Cranial nerve palsy
  - Myasthenia gravis
  - Orbital disease
  - Stroke
  - Multiple sclerosis

nodes:
- id: monocular_vs_binocular
  when: {}
  description: Differentiate monocular vs binocular diplopia
  tests:
  - Cover one eye - does diplopia resolve?
  - Monocular - diplopia persists with either eye (ocular cause)
  - Binocular - diplopia resolves covering either eye (misalignment)
  - Visual acuity
  - Extraocular motility
  - Pupil examination
  - Head tilt test
  suggest_dx: []
  next:
  - when:
      diplopia_type: monocular
    go: monocular_diplopia
  - when:
      diplopia_type: binocular
    go: binocular_diplopia_assessment
  - default: binocular_diplopia_assessment

- id: monocular_diplopia
  when:
    diplopia_persists_one_eye_covered: true
  description: Monocular diplopia - ocular cause
  tests:
  - Pinhole test (improves if refractive)
  - Slit lamp examination
  - Look for cataract, corneal irregularity
  - Refractive error assessment
  - Retinal examination
  suggest_dx:
  - Refractive error (most common)
  - Cataract
  - Corneal irregularity (keratoconus, scar)
  - Lens subluxation
  - Macular disease
  - Psychogenic (rare)
  referrals:
  - Routine ophthalmology
  - Non-urgent unless vision significantly impaired
  management:
  - Refraction and glasses
  - Cataract surgery if visually significant
  - Treat corneal pathology
  - Pinhole or occluder as temporary measure
  next:
  - default: null

- id: binocular_diplopia_assessment
  when:
    diplopia_resolves_one_eye_covered: true
  description: Binocular diplopia - ocular misalignment
  tests:
  - Extraocular motility in all 9 positions of gaze
  - Identify pattern of restriction
    - Abduction deficit (CN VI)
    - Adduction deficit (CN VI contralateral or CN III)
    - Elevation deficit (CN III or IV)
    - Depression deficit (CN IV)
  - Pupil examination (dilated = CN III involvement)
  - Ptosis (CN III)
  - Head tilt test (CN IV palsy tilts away from affected side)
  - Proptosis, lid retraction (thyroid eye disease)
  - Onset (acute vs gradual)
  - Pain assessment
  suggest_dx: []
  next:
  - when:
      all_of:
      - ptosis: present
      - pupil_dilation: present
      - pain: present
    go: third_nerve_palsy_painful
  - when:
      all_of:
      - abduction_deficit: present
      - affected_eye_turns_in: true
    go: sixth_nerve_palsy
  - when:
      all_of:
      - ptosis: present
      - eye_down_and_out: true
    go: third_nerve_palsy_painless
  - when:
      head_tilt: present
    go: fourth_nerve_palsy
  - when:
      symptoms_contains: variable_worse_with_fatigue
    go: myasthenia_gravis_assessment
  - when:
      exam_findings_any:
      - proptosis
      - lid_retraction
      - eyelid_lag
    go: thyroid_eye_disease
  - when:
      mechanism: trauma
    go: traumatic_diplopia
  - default: cranial_nerve_palsy_workup

- id: third_nerve_palsy_painful
  when:
    all_of:
    - ptosis: present
    - pupil_involvement: present
    - pain: present
  description: Painful third nerve palsy with pupil involvement - EMERGENCY
  tests:
  - URGENT neuroimaging - CTA or MRA
  - Look for posterior communicating artery (PComm) aneurysm
  - Dilated, poorly reactive pupil
  - Eye down and out position
  - Complete ptosis
  - Cannot elevate, depress, or adduct eye
  suggest_dx:
  - Posterior communicating artery aneurysm (PCOM) - most concerning
  - Cavernous sinus thrombosis
  - Pituitary apoplexy
  - Intracranial mass
  referrals:
  - Neurosurgery STAT
  - Neuro-ophthalmology
  - CTA/MRA within 2-4 hours
  management:
  - URGENT vascular imaging
  - Do NOT delay - aneurysm can rupture
  - If aneurysm found - neurosurgery for coiling or clipping
  - Blood pressure control
  - Do NOT discharge without imaging
  next:
  - default: null

- id: third_nerve_palsy_painless
  when:
    all_of:
    - ptosis: present
    - eye_down_and_out: true
    - pupil_sparing: true
  description: Pupil-sparing third nerve palsy
  tests:
  - Pupil size and reactivity (should be normal)
  - Ptosis degree
  - Extraocular motility - cannot elevate, depress, adduct
  - Blood glucose, HbA1c
  - Blood pressure
  - MRI brain if not typical for microvascular
    - Age <50
    - No vascular risk factors
    - Progressive symptoms
    - Other neurologic signs
  suggest_dx:
  - Microvascular third nerve palsy (diabetes, hypertension) - most common
  - Less likely aneurysm if pupil completely spared
  referrals:
  - Neuro-ophthalmology within 1 week
  - Neurology for stroke risk factor management
  - MRI if atypical features
  management:
  - If typical microvascular (age >50, diabetes/HTN, pupil sparing)
    - Observation for spontaneous recovery
    - Usually improves within 3 months
    - Eye patching or prism glasses for diplopia
  - Control vascular risk factors
    - Optimize diabetes control
    - Blood pressure management
    - Antiplatelet therapy (aspirin)
  - If no improvement in 3 months - MRI brain
  prognosis:
  - 80-90% recover spontaneously within 3 months
  - Pupil sparing rules out aneurysm (95% sensitive)
  next:
  - default: null

- id: fourth_nerve_palsy
  when:
    all_of:
    - vertical_diplopia: true
    - head_tilt: present
  description: Fourth nerve (trochlear) palsy
  tests:
  - Parks-Bielschowsky three-step test (Step 1 - which eye higher, Step 2 - worse on gaze to which side, Step 3 - worse on head tilt to which side)
  - Affected eye cannot depress when adducted
  - Head tilt away from affected side (compensatory)
  - Old photos (congenital if long-standing head tilt)
  suggest_dx:
  - Congenital fourth nerve palsy (most common, decompensated)
  - Traumatic fourth nerve palsy (head trauma)
  - Microvascular fourth nerve palsy
  referrals:
  - Neuro-ophthalmology within 1-2 weeks
  - Imaging if
    - Bilateral fourth nerve palsies
    - Associated neurologic signs
    - No history of trauma or vascular risk factors
  management:
  - If congenital (old photos show head tilt)
    - Prism glasses
    - Strabismus surgery if symptomatic
  - If traumatic
    - Observation for 6 months (may improve)
    - Strabismus surgery if persistent
  - If microvascular
    - Spontaneous recovery within 3 months typically
    - Prism glasses or eye patch
  prognosis:
  - Traumatic - 40-50% improve within 6 months
  - Microvascular - good recovery
  - Congenital decompensated - may need surgery
  next:
  - default: null

- id: sixth_nerve_palsy
  when:
    exam_findings: abduction_deficit
  description: Sixth nerve (abducens) palsy
  tests:
  - Affected eye cannot abduct (turn outward)
  - Esotropia (eye turned in)
  - Horizontal diplopia worse at distance and on gaze to affected side
  - Bilateral sixth nerve palsies = increased ICP until proven otherwise
  - Check blood pressure, glucose
  - Neuroimaging
    - MRI brain with and without contrast
    - Look for brainstem lesion, increased ICP, mass
  suggest_dx:
  - Microvascular sixth nerve palsy (diabetes, HTN) - most common
  - Increased intracranial pressure (bilateral)
  - Brainstem stroke
  - Multiple sclerosis
  - Tumor (pontine glioma, nasopharyngeal carcinoma)
  - Meningitis
  - Trauma
  referrals:
  - Neuro-ophthalmology within 1 week
  - Neurology
  - Emergency imaging if
    - Bilateral sixth nerve palsies
    - Other neurologic signs
    - Papilledema
    - Age <50 without vascular risk factors
  management:
  - If bilateral - URGENT imaging (increased ICP)
  - If typical microvascular (unilateral, age >50, diabetes/HTN)
    - May observe with close follow-up
    - Eye patching or prism glasses
    - Spontaneous recovery within 6 months
  - Control vascular risk factors
  - If no improvement in 6 months - repeat MRI
  prognosis:
  - Microvascular - 70% recover within 6 months
  - Traumatic - variable recovery
  - Tumor - depends on treatment
  next:
  - default: null

- id: myasthenia_gravis_assessment
  when:
    symptoms_contains_any:
    - variable_diplopia
    - worsens_with_fatigue
    - ptosis_worsens_during_day
  description: Myasthenia gravis evaluation
  tests:
  - Ice pack test (place ice on closed eyelid x 2 min, ptosis improves)
  - Fatigue test (prolonged upgaze - ptosis worsens)
  - Variable ptosis and/or ophthalmoplegia
  - Acetylcholine receptor (AChR) antibodies
  - Anti-MuSK antibodies (if AChR negative)
  - Chest CT (rule out thymoma - 10-15% of MG patients)
  - Repetitive nerve stimulation (RNS)
  - Single-fiber EMG (most sensitive)
  - Edrophonium (Tensilon) test - historical, rarely used now
  suggest_dx:
  - Ocular myasthenia gravis
  - Generalized myasthenia gravis
  referrals:
  - Neurology for management
  - Neuromuscular specialist
  - Cardiothoracic surgery if thymoma present
  management:
  - Pyridostigmine (Mestinon) 60mg TID-QID
  - Prednisone (for generalized or refractory ocular MG)
  - Thymectomy if thymoma present
  - Immunosuppressants (azathioprine, mycophenolate) if needed
  - Avoid medications that worsen MG
    - Fluoroquinolones
    - Aminoglycosides
    - Beta-blockers
    - Magnesium
  - Myasthenic crisis (respiratory failure) - ICU, IVIG, plasmapheresis
  prognosis:
  - 50% of ocular MG patients progress to generalized MG within 2 years
  - Treatment usually controls symptoms
  - Lifelong disease requiring monitoring
  next:
  - default: null

- id: thyroid_eye_disease
  when:
    exam_findings_any:
    - proptosis
    - lid_retraction
    - lid_lag
    - restrictive_myopathy
  description: Thyroid eye disease (Graves ophthalmopathy)
  tests:
  - Exophthalmometry (measure proptosis)
  - Extraocular motility - restrictive pattern
    - Inferior rectus most commonly affected (limited upgaze)
    - Medial rectus second most common (limited abduction)
  - Lid retraction, lid lag
  - Thyroid function tests (TSH, free T4, free T3)
  - TSI (thyroid-stimulating immunoglobulin)
  - CT or MRI orbits
    - Enlarged extraocular muscles (muscle belly, tendon spared)
    - Proptosis
    - Optic nerve compression
  suggest_dx:
  - Thyroid eye disease (Graves ophthalmopathy) (H05.2)
  - Active (inflammatory) vs inactive (fibrotic)
  referrals:
  - Oculoplastics or neuro-ophthalmology
  - Endocrinology for thyroid management
  - Urgent if compressive optic neuropathy
  management:
  - Active inflammatory phase
    - High-dose IV methylprednisolone (12 infusions over 12 weeks)
    - Selenium supplementation
    - Consider orbital radiation
    - Teprotumumab (Tepezza) - monoclonal antibody, highly effective
  - Inactive fibrotic phase
    - Strabismus surgery for diplopia
    - Orbital decompression for proptosis
    - Eyelid surgery for retraction
  - Compressive optic neuropathy (EMERGENCY)
    - High-dose IV steroids
    - Urgent orbital decompression surgery
  - Thyroid management crucial
    - Achieve euthyroid state
    - Radioactive iodine may worsen eye disease (use with steroids)
  - Smoking cessation mandatory (worsens disease)
  - Prism glasses for diplopia
  - Lubricating drops for exposure keratopathy
  prognosis:
  - Active phase lasts 6-24 months, then "burns out"
  - Surgery deferred until inactive phase (6 months stable)
  - Sequence: decompression → strabismus → eyelid surgery
  next:
  - default: null

- id: traumatic_diplopia
  when:
    mechanism: trauma
  description: Post-traumatic diplopia
  tests:
  - Orbital CT (fracture, hemorrhage, muscle entrapment)
  - Forced duction test
  - Assess for orbital fracture
  - Look for muscle entrapment (especially inferior rectus)
  - Rule out globe injury
  suggest_dx:
  - Orbital fracture with muscle entrapment
  - Traumatic cranial nerve palsy
  - Orbital hemorrhage
  - Muscle contusion
  referrals:
  - See OPHTHO-EYE-TRAUMA tree for orbital fracture management
  - Oculoplastics for fracture repair
  management:
  - If muscle entrapment (especially pediatric trapdoor fracture)
    - URGENT surgery within 24 hours
  - If no entrapment
    - Observation, may improve as swelling resolves
    - Surgical repair 1-2 weeks if indicated
  next:
  - default: null

- id: cranial_nerve_palsy_workup
  when: {}
  description: General cranial nerve palsy evaluation
  tests:
  - MRI brain with and without contrast
  - MRI orbits with fat suppression
  - Consider MRA for vascular lesions
  - Blood work
    - CBC, CMP
    - ESR, CRP (vasculitis)
    - HbA1c, fasting glucose (diabetes)
    - ACE level (sarcoidosis)
    - Lyme serology if endemic
    - RPR (syphilis)
    - ANA (vasculitis)
  suggest_dx:
  - Microvascular (diabetes, hypertension)
  - Demyelinating (MS)
  - Tumor
  - Aneurysm
  - Stroke
  - Inflammation (sarcoidosis, vasculitis)
  - Infection (Lyme, syphilis)
  referrals:
  - Neuro-ophthalmology
  - Neurology
  management:
  - Depends on underlying cause
  - Vascular risk factor modification
  - Disease-specific treatment
  next:
  - default: null

special_conditions:
  internuclear_ophthalmoplegia:
    description: MLF (medial longitudinal fasciculus) lesion
    findings:
      - Affected eye cannot adduct on lateral gaze
      - Contralateral eye has abduction nystagmus
      - Convergence intact (distinguishes from CN III palsy)
    causes:
      - Multiple sclerosis (young patients, often bilateral)
      - Stroke (older patients, usually unilateral)
    management:
      - MRI brain
      - If MS - neurology for disease-modifying therapy
      - If stroke - stroke workup and prevention
  
  skew_deviation:
    description: Vertical misalignment from brainstem/cerebellar lesion
    findings:
      - Vertical diplopia
      - Does not follow pattern of single cranial nerve
      - Alternate cover test shows vertical shift
    causes:
      - Brainstem stroke
      - MS
      - Cerebellar lesion
    management:
      - MRI brain urgent
      - Neurology consultation
  
  convergence_insufficiency:
    description: Inability to maintain convergence
    findings:
      - Diplopia at near only
      - Normal distance vision
      - Exophoria at near
    causes:
      - Idiopathic (common in children, young adults)
      - Decompensation of latent exophoria
      - Post-concussion syndrome
    management:
      - Convergence exercises
      - Base-in prism glasses for reading
      - Vision therapy
  
  fisher_syndrome:
    description: Variant of Guillain-Barré syndrome
    findings:
      - Ophthalmoplegia (multiple CN palsies)
      - Ataxia
      - Areflexia
    causes:
      - Post-infectious (Campylobacter, URI)
      - Anti-GQ1b antibodies
    management:
      - IVIG or plasmapheresis
      - Neurology admission
      - Monitor respiratory function

differential_diagnosis:
  cranial_nerve_palsies:
    - Third nerve palsy (CN III)
    - Fourth nerve palsy (CN IV)
    - Sixth nerve palsy (CN VI)
    - Multiple cranial nerve palsies (cavernous sinus, orbital apex)
  neuromuscular:
    - Myasthenia gravis
    - Lambert-Eaton syndrome
    - Chronic progressive external ophthalmoplegia (CPEO)
  mechanical_restrictive:
    - Thyroid eye disease
    - Orbital fracture with entrapment
    - Orbital tumor
    - Orbital inflammatory disease (pseudotumor)
  central:
    - Internuclear ophthalmoplegia (MLF lesion)
    - Skew deviation
    - Brainstem stroke
    - Multiple sclerosis
  ocular:
    - Monocular diplopia (refractive, cataract, corneal)
    - Convergence insufficiency
    - Decompensated phoria

disposition_guidance:
  emergency:
    - Painful third nerve palsy with pupil involvement (aneurysm)
    - Bilateral sixth nerve palsies (increased ICP)
    - Diplopia with papilledema
    - Diplopia with other acute neurologic signs
    - Compressive optic neuropathy (thyroid eye disease)
  urgent_within_24_48h:
    - Acute painful diplopia without pupil involvement
    - Myasthenia gravis (first diagnosis)
    - Orbital cellulitis
    - Thyroid eye disease without compression
  routine:
    - Pupil-sparing third nerve palsy in elderly with vascular risk factors
    - Fourth nerve palsy (congenital decompensation)
    - Monocular diplopia
    - Convergence insufficiency

references:
  - American Academy of Ophthalmology. Preferred Practice Pattern - Adult Strabismus. 2020.
  - American Academy of Neurology. Practice Parameter - Evaluation of Disconjugate Gaze Diplopia. 2003.
  - Rucker JC. Oculomotor Nerve Palsy. Semin Neurol. 2019.
  - Barton JJ, Benatar M. Field of vision - a manual and atlas of perimetry. Humana Press. 2003.
