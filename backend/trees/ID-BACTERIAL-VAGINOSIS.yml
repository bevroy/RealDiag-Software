tree_id: ID-BACTERIAL-VAGINOSIS
name: Bacterial Vaginosis
family: infectious_disease
specialty: Gynecology
icd10: N76.0
snomed: 419760006
urgency: []
homeopathy: []
presentations:
  - Thin, gray-white vaginal discharge
  - Fishy odor, especially after intercourse
  - Vaginal pH >4.5
  - Minimal to no vulvovaginal irritation or erythema
  - Asymptomatic in up to 50% of cases
  - Symptoms may worsen after menses
  - Discharge may be frothy but typically minimal
  - Recurrent episodes common
workup:
  - Clinical diagnosis using Amsel criteria (3 of 4 required)
  - Thin homogeneous gray-white discharge
  - Vaginal pH >4.5 (normal pH 3.8-4.5)
  - Positive whiff test (fishy odor with 10% KOH)
  - Clue cells on wet mount (epithelial cells covered with bacteria)
  - Microscopy - wet mount showing clue cells, decreased lactobacilli
  - Gram stain (Nugent score ≥7 diagnostic but not routinely done)
  - NAAT testing available but not standard of care
  - Rule out co-infections (trichomoniasis, candidiasis, STIs)
treatment:
  - First-line: Metronidazole 500 mg PO BID x 7 days
  - Alternative: Metronidazole gel 0.75% intravaginal daily x 5 days
  - Alternative: Clindamycin cream 2% intravaginal at bedtime x 7 days
  - Alternative: Clindamycin 300 mg PO BID x 7 days
  - Avoid alcohol during and 24 hours after metronidazole (disulfiram reaction)
  - Treatment in pregnancy (any trimester): Metronidazole 500 mg PO BID x 7 days
  - Recurrent BV (≥3 episodes/year): longer suppressive therapy needed
  - Suppressive therapy: Metronidazole gel 0.75% twice weekly x 4-6 months
  - Partner treatment not recommended (not sexually transmitted)
  - Probiotics may help prevent recurrence but evidence limited
treatment:
  - Routine screening not recommended in asymptomatic patients
  - Screen before surgical procedures (hysterectomy, abortion, IUD insertion)
  - Test of cure not recommended if symptoms resolve
  - Educate about increased risk of STIs and PID
clinical_pearls:
  - "BV is not considered sexually transmitted but is associated with sexual activity and multiple partners"
  - "Caused by overgrowth of anaerobes (Gardnerella vaginalis, Prevotella, Mobiluncus) with decreased lactobacilli"
  - "Most common cause of vaginal discharge in women of reproductive age (prevalence 20-30%)"
  - "Increases risk of STI acquisition (HIV, HSV, gonorrhea, chlamydia), PID, and preterm birth in pregnancy"
  - "Recurrence rate 30% within 3 months, 50% within 12 months despite appropriate treatment"
  - "Douching is major risk factor - disrupts normal vaginal flora (advise against)"
  - "Can occur in women who have never been sexually active"
  - "Symptomatic BV in pregnancy associated with adverse outcomes (preterm labor, PROM, low birth weight)"
referrals:
  - Gynecology for recurrent BV refractory to standard treatment
  - Consider STI testing and counseling if risk factors present
differentials:
  - Trichomoniasis (frothy yellow-green discharge, strawberry cervix, motile trichomonads)
  - Vulvovaginal candidiasis (thick white discharge, vulvar pruritus, pH <4.5)
  - Aerobic vaginitis (inflammatory discharge, vaginal pH >6.0, parabasal cells)
  - Desquamative inflammatory vaginitis (purulent discharge, severe inflammation)
  - Cervicitis (mucopurulent discharge from cervix, test for gonorrhea/chlamydia)
  - Normal physiologic discharge (clear/white, pH <4.5, no odor, no symptoms)
