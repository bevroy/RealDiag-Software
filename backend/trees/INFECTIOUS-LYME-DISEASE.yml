tree_id: INFECTIOUS-LYME-DISEASE
name: Lyme Disease
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Erythema migrans rash and flu-like symptoms
description: |
  Tick-borne illness caused by Borrelia burgdorferi spirochete. Transmitted by Ixodes scapularis (deer tick) in northeastern and upper Midwest US.
  Three stages - early localized (erythema migrans), early disseminated (cardiac, neurologic), late (arthritis, chronic neurologic). Preventable with prompt tick removal.
icd10: A69.20
urgency: Moderate
workup:
  - Clinical diagnosis if erythema migrans (EM) rash present - do not need serologic testing, start treatment immediately
  - EM appears 3-30 days after tick bite (average 7 days), expanding red rash with central clearing (bull's-eye), at least 5 cm diameter
  - Two-tier serologic testing if no EM but suspected Lyme - ELISA screening followed by Western blot confirmation if positive or equivocal
  - IgM and IgG antibodies - IgM peaks at 3-6 weeks, IgG appears later and persists
  - Serology negative in first 2-4 weeks (early infection), do not repeat if EM present
  - Lumbar puncture if neurologic symptoms - CSF shows lymphocytic pleocytosis, elevated protein, intrathecal antibody production
  - ECG if cardiac symptoms - variable degree AV block (first, second, or third degree)
  - Joint aspiration if arthritis - inflammatory fluid with WBC 10,000-25,000
  - PCR of synovial fluid sensitive for Lyme arthritis
treatment:
  - Early localized or early disseminated Lyme without neurologic involvement - doxycycline 100mg PO BID x 10-14 days (first-line in adults and children greater than 8 years)
  - Alternative amoxicillin 500mg TID x 14 days (pregnancy, young children) or cefuroxime 500mg BID x 14 days
  - Lyme carditis - oral antibiotics if first-degree AV block and PR less than 300 ms, IV ceftriaxone 2g daily x 14-21 days if higher degree block (may need temporary pacemaker)
  - Neurologic Lyme (meningitis, cranial neuropathy, radiculopathy) - ceftriaxone 2g IV daily x 14-28 days, alternative doxycycline 200-400mg/day PO x 14-28 days
  - Lyme arthritis - doxycycline 100mg BID x 28 days, may need second course or switch to ceftriaxone if no response
  - Post-treatment Lyme disease syndrome - supportive care, no benefit from prolonged antibiotics
  - Tick prophylaxis - single dose doxycycline 200mg within 72 hours of deer tick bite if attached greater than 36 hours in endemic area
clinical_pearls:
  - EM pathognomonic, appears in 70-80% of Lyme cases, may be multiple lesions
  - Early disseminated features include multiple EM lesions, facial nerve palsy (bilateral in 25%), meningitis, carditis
  - Lyme carditis presents with palpitations, syncope, chest pain - AV block typically resolves with antibiotics
  - Lyme arthritis (late stage) - intermittent large joint swelling, especially knee (80%), oligoarticular
  - No person-to-person transmission, tick must be attached 36-48 hours to transmit
  - Post-treatment symptoms (fatigue, arthralgia) occur in 10-20%, resolve over months, not active infection
differentials:
  - Viral illness
  - Cellulitis
  - Erythema multiforme
  - Southern tick-associated rash illness (STARI)
  - Rheumatoid arthritis
  - Bell's palsy (other causes)
trace:
  - Patient in Connecticut with expanding red rash on thigh x 5 days after hiking, recalls tick bite 1 week ago → Exam shows 8 cm erythema migrans with central clearing → Diagnose early Lyme disease (clinical diagnosis, no serology needed) → Start doxycycline 100mg PO BID x 14 days → Rash resolves within 1 week → Complete antibiotic course, full recovery → Counsel on tick prevention (permethrin-treated clothing, DEET repellent, tick checks after outdoor activities)
