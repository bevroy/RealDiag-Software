tree_id: INFECTIOUS-LYME-DISEASE
name: Lyme Disease
family: Infectious Disease
specialty: Infectious Disease
chief_complaint: Erythema migrans rash, fever, headache, joint pain, fatigue
description: Tick-borne infection caused by Borrelia burgdorferi transmitted by Ixodes ticks, presents with characteristic erythema migrans rash followed by systemic dissemination causing neurologic, cardiac, and arthritic manifestations if untreated
icd10: A69.20
urgency: routine
workup:
  - Microbiology
  - Causative organism - Borrelia burgdorferi (spirochete bacteria)
  - Three genospecies in US - B. burgdorferi sensu stricto (most common), B. mayonii (Midwest)
  - Vector - Ixodes scapularis (blacklegged tick, deer tick) in Northeast and Upper Midwest
  - Ixodes pacificus in Pacific Coast
  - Transmission - Tick must be attached 36-48 hours to transmit (early removal prevents infection)
  - Nymphal ticks (size of poppy seed) most common vector (hard to detect, active May-July)
  - Adult ticks larger (easier to detect), active October-November
  - Reservoir - White-footed mice, white-tailed deer
  - Epidemiology
  - Most common vector-borne disease in US (30,000-40,000 cases/year, likely underreported)
  - Endemic areas - Northeast (Massachusetts to Maryland), Upper Midwest (Wisconsin, Minnesota), Northern California
  - 95% of cases occur in 14 states (Connecticut, Delaware, Maine, Maryland, Massachusetts, Minnesota, New Hampshire, New Jersey, New York, Pennsylvania, Rhode Island, Vermont, Virginia, Wisconsin)
  - Seasonal - Peak incidence June-August (nymphal tick activity)
  - Risk factors - Outdoor activities in wooded or grassy areas, endemic region, spring/summer months
  - Pathophysiology - Three stages
  - Early localized (3-30 days post-tick bite) - Localized skin infection (erythema migrans)
  - Early disseminated (days to weeks later) - Hematogenous dissemination (multiple EM lesions, neurologic, cardiac)
  - Late disseminated (months to years) - Persistent infection (Lyme arthritis, chronic neurologic)
  - Clinical presentation - Highly variable, depends on stage
  - Early localized Lyme disease (stage 1)
  - Erythema migrans (EM) rash - Pathognomonic, 70-80% of cases
  - Appears 3-30 days post-tick bite (median 7 days)
  - Starts as red macule or papule at bite site, expands over days
  - Classic "bull's-eye" appearance (central clearing with red outer ring) in 20% (most are homogeneous erythema)
  - Size typically >5 cm (up to 30+ cm), warm but not painful or pruritic
  - Location - Thigh, groin, axilla (warm moist areas where ticks prefer)
  - Resolves spontaneously in 3-4 weeks even without treatment (but infection persists)
  - Constitutional symptoms - Fever, chills, headache, fatigue, myalgias, arthralgias (flu-like)
  - Early disseminated Lyme disease (stage 2)
  - Multiple EM lesions - Secondary lesions (smaller, no central punctum) from hematogenous spread
  - Neurologic (10-15%) - Lyme neuroborreliosis
  - Cranial nerve palsy - Facial nerve (CN VII) most common (bilateral in 30%, unlike Bell's palsy which is unilateral)
  - Meningitis - Lymphocytic meningitis (headache, neck stiffness, photophobia), CSF shows lymphocytic pleocytosis, normal glucose, elevated protein
  - Radiculoneuropathy - Painful radiculopathy (shooting pains), motor or sensory deficits
  - Triad - Meningitis, cranial neuropathy, radiculoneuritis (Bannwarth syndrome)
  - Cardiac (1-2%) - Lyme carditis
  - Atrioventricular block (first, second, or third degree) - Most common manifestation
  - Myopericarditis - Chest pain, palpitations, dyspnea
  - Can present with syncope (high-grade AV block)
  - Usually self-limited (resolves in 1-6 weeks), but may require temporary pacemaker
  - Musculoskeletal - Migratory arthralgias, myalgias
  - Late disseminated Lyme disease (stage 3)
  - Lyme arthritis (60% untreated) - Months to years after infection
  - Large joint monoarthritis or oligoarthritis (knee most common 90%)
  - Intermittent swelling (weeks to months), recurrent episodes
  - Effusion large but usually not very painful (compared to septic arthritis)
  - Chronic neurologic - Encephalopathy (subtle cognitive dysfunction, memory problems), peripheral neuropathy (paresthesias, dysesthesias)
  - Post-treatment Lyme disease syndrome (PTLDS) - Persistent symptoms (fatigue, pain, cognitive dysfunction) >6 months after appropriate treatment
  - Not active infection (prolonged antibiotics not beneficial)
  - Mechanism unclear (possibly immune-mediated, not ongoing infection)
  - Diagnosis - Based on clinical presentation and serology (if indicated)
  - Clinical diagnosis for early localized disease
  - EM rash in endemic area with tick exposure is DIAGNOSTIC (do not wait for serology)
  - Treat empirically based on rash alone (serology often negative early)
  - Serology - Two-tier testing (ELISA followed by Western blot)
  - ELISA (enzyme-linked immunosorbent assay) - Screening test
  - Detects IgM and IgG antibodies to B. burgdorferi
  - High sensitivity (>95% in late disease), but false positives common
  - If ELISA positive or equivocal, proceed to Western blot
  - Western blot - Confirmatory test
  - IgM - Positive if 2 of 3 bands (23, 39, 41 kDa)
  - IgG - Positive if 5 of 10 bands
  - Interpretation
  - IgM appears 2-4 weeks post-infection (peak 3-6 weeks), declines after 4-6 months
  - IgG appears 4-6 weeks, persists for years (even after treatment)
  - Do NOT test IgM beyond 4 weeks (high false positive rate)
  - Serology often NEGATIVE in early localized disease (antibodies not yet produced)
  - Serology does not distinguish active vs past infection (IgG persists)
  - Post-treatment positive serology is expected (does not indicate treatment failure)
  - Do NOT order Lyme serology if - EM rash present (clinical diagnosis), no pretest probability (screening in endemic area), symptoms <2 weeks (antibodies not yet present)
  - CSF studies if neurologic symptoms
  - Lymphocytic pleocytosis (10-1000 cells, mostly lymphocytes), elevated protein, normal glucose
  - CSF Lyme antibody index (intrathecal antibody production) confirms CNS infection
  - Synovial fluid analysis if arthritis
  - Inflammatory (5,000-80,000 WBC, mostly PMNs), negative Gram stain and culture
  - PCR for B. burgdorferi (more sensitive than culture)
  - ECG if cardiac symptoms - AV block (first, second, third degree)
treatment:
  - Early localized Lyme disease (EM rash, no dissemination)
  - Doxycycline 100 mg PO BID x 10-14 days - FIRST-LINE (also treats Anaplasmosis, another tick-borne coinfection)
  - Contraindications - Pregnancy, age <8 years (tooth discoloration)
  - Alternatives - Amoxicillin 500 mg PO TID x 14 days (pregnancy, children), cefuroxime 500 mg PO BID x 14 days
  - Azithromycin 500 mg daily x 7 days - Less effective, use only if penicillin/doxycycline intolerant
  - Early disseminated Lyme disease
  - Multiple EM, isolated facial nerve palsy (no meningitis) - Same as early localized (oral doxycycline x 14-21 days)
  - Lyme meningitis or radiculoneuropathy - IV ceftriaxone 2g daily x 14-28 days (CNS penetration)
  - Alternative - IV cefotaxime 2g q8h or IV penicillin G 18-24 million units/day divided q4h
  - Oral doxycycline 100 mg BID x 14-21 days is alternative if mild CNS disease (no severe symptoms)
  - Lyme carditis
  - Outpatient (first-degree AV block, PR <30 ms) - Oral doxycycline 100 mg BID x 14-21 days
  - Inpatient (second or third-degree AV block, symptomatic) - IV ceftriaxone 2g daily x 14 days (admit for telemetry)
  - Temporary pacemaker if high-grade block with symptoms (syncope, hemodynamic instability)
  - Late disseminated Lyme disease
  - Lyme arthritis - Oral doxycycline 100 mg BID x 28 days OR amoxicillin 500 mg TID x 28 days
  - If persistent or recurrent after oral therapy - IV ceftriaxone 2g daily x 14-28 days (consider antibiotic-refractory arthritis)
  - Antibiotic-refractory Lyme arthritis - Synovitis persists >2 months after appropriate antibiotics
  - NSAIDs, DMARDs (hydroxychloroquine, methotrexate), arthroscopic synovectomy
  - Do NOT repeat antibiotics (not active infection, likely immune-mediated)
  - Chronic neurologic - IV ceftriaxone 2g daily x 14-28 days
  - Post-treatment Lyme disease syndrome (PTLDS)
  - Symptomatic management (NSAIDs, rest, gradual return to activity)
  - Do NOT give prolonged or repeat antibiotics (no benefit, potential harm)
  - Jarisch-Herxheimer reaction - Fever, chills, myalgias within 24 hours of starting antibiotics
  - Caused by release of bacterial antigens (spirochete lysis)
  - Self-limited (resolves in 24-48 hours), supportive care (NSAIDs)
  - Prevention
  - Tick avoidance - Wear long sleeves and pants, tuck pants into socks, stay on trails (avoid tall grass)
  - Repellents - DEET on skin (20-30%), permethrin on clothing
  - Tick checks - Daily full-body inspection after outdoor activities, remove ticks promptly
  - Tick removal - Fine-tipped tweezers, grasp near skin surface, pull upward with steady pressure
  - Do NOT squeeze, twist, or apply heat/petroleum jelly (increases transmission risk)
  - Post-exposure prophylaxis - Single dose doxycycline 200 mg PO if ALL criteria met
  - Attached Ixodes tick, tick attached >36 hours (engorged), tick removed <72 hours, endemic area, no contraindication to doxycycline
  - NOT recommended if any criteria not met
  - Vaccine - LYMErix vaccine withdrawn from market (2002), new vaccines in development
clinical_pearls:
  - Erythema migrans rash in endemic area with tick exposure is diagnostic (treat without waiting for serology)
  - Serology often negative in early disease (antibodies not yet developed), do not delay treatment
  - Two-tier testing (ELISA then Western blot) required, do NOT test IgM beyond 4 weeks
  - Doxycycline 100 mg BID x 10-14 days is first-line for early localized disease
  - Bilateral facial nerve palsy (rare) is highly suggestive of Lyme disease
  - Lyme carditis can cause high-grade AV block requiring temporary pacemaker
  - Post-treatment positive serology is expected (IgG persists), does not indicate treatment failure
  - Prolonged antibiotics for PTLDS not beneficial (symptom management only)
differentials:
  - DERM-ERYTHEMA-MULTIFORME
  - DERM-CELLULITIS
  - INFECTIOUS-ROCKY-MOUNTAIN-SPOTTED-FEVER
  - NEURO-BELLS-PALSY
  - RHEUM-RHEUMATOID-ARTHRITIS
  - INFECTIOUS-ANAPLASMOSIS
trace:
  - Erythema migrans rash (>5 cm expanding red rash) after tick bite in endemic area
  - Clinical diagnosis (do not wait for serology in early disease)
  - Doxycycline 100 mg BID x 10-14 days (first-line treatment)
  - Serology (two-tier ELISA/Western blot) if disseminated disease or atypical presentation
  - IV ceftriaxone for CNS or severe cardiac involvement
