tree_id: CARDS-CONSTRICTIVE-PERICARDITIS
name: Constrictive Pericarditis
family: Cardiology
specialty: Cardiology
chief_complaint: Swollen legs and shortness of breath
description: Chronic thickened fibrotic pericardium restricting cardiac filling causing right heart failure symptoms. Follows prior pericarditis, cardiac surgery, or radiation. Pericardial knock, equalization of pressures on catheterization, septal bounce on echo. Pericardiectomy curative but high operative mortality.
icd10: I31.1
urgency: urgent

workup:
  - Symptoms: progressive dyspnea, fatigue, peripheral edema, ascites, abdominal distension
  - Right heart failure predominant: lower extremity edema, ascites out of proportion to dyspnea
  - Causes:
  - Idiopathic (40-50%): presumed prior pericarditis
  - Prior cardiac surgery (30%): CABG, valve surgery (develops months to years post-op)
  - Radiation therapy: mediastinal radiation for lymphoma, breast cancer (latency 5-20 years)
  - Tuberculosis: in developing countries, most common cause worldwide
  - Recurrent pericarditis: chronic inflammation leads to fibrosis
  - Physical exam:
  - Elevated JVP with prominent x and y descents (steep dips)
  - Kussmaul sign: JVP rises with inspiration (paradoxical, normally falls)
  - Pericardial knock: early diastolic sound (high-pitched, earlier than S3)
  - Hepatomegaly, ascites, peripheral edema
  - Pulsus paradoxus: absent in constriction (present in tamponade)
  - Distinguishing from restrictive cardiomyopathy (challenging):
  - Both cause right heart failure with elevated JVP and diastolic dysfunction
  - Constriction: pericardial thickening on imaging, septal bounce, ventricular discordance
  - Restriction: normal pericardium, enlarged atria, no septal bounce, concordant ventricles
  - Echocardiogram:
  - Septal bounce: ventricular septum shifts leftward during inspiration (ventricular interdependence)
  - Increased respiratory variation in mitral inflow (over 25%)
  - Dilated IVC with no respiratory collapse
  - Pericardial thickening (not always present)
  - CT or MRI chest:
  - Pericardial thickening over 4 mm (normal below 2 mm)
  - Pericardial calcification on CT (suggests chronic constriction)
  - Cardiac catheterization (gold standard):
  - Equalization of diastolic pressures (RA, RV, PCWP within 5 mmHg)
  - Square root sign: early rapid diastolic filling then abrupt halt (dip and plateau)
  - Ventricular discordance: systolic pressures in RV and LV change in opposite directions with respiration
  - Labs: BNP mildly elevated (less than restrictive cardiomyopathy), liver enzymes elevated (congestive hepatopathy)

treatment:
  - Medical management (temporizing):
  - Diuretics: furosemide for volume overload, ascites, edema
  - Careful diuresis (avoid overdiuresis - cardiac output depends on preload)
  - Avoid beta blockers and CCBs: impair compensatory tachycardia
  - Treat underlying cause: anti-TB therapy if tuberculous, no specific treatment for idiopathic
  - Pericardiectomy (definitive treatment):
  - Complete surgical removal of pericardium (both visceral and parietal layers)
  - Indicated for symptomatic constriction (NYHA class III-IV)
  - High operative mortality 6-12% (depends on etiology, worse with radiation)
  - Improvement in symptoms over 3-6 months post-op (myocardium remodels)
  - Best outcomes if early disease (class II-III), worse if severe RV dysfunction or radiation-induced
  - Post-radiation constriction: worst prognosis, consider only if symptoms severe
  - Medical therapy trial: if early or mild symptoms, trial colchicine or NSAIDs (limited evidence)
  - Prognosis without surgery: progressive right heart failure, poor quality of life, median survival 5-10 years

clinical_pearls:
  - Right heart failure: elevated JVP, edema, ascites out of proportion to dyspnea
  - Kussmaul sign (JVP rises with inspiration) classic finding
  - Pericardial knock early diastolic sound (earlier and higher pitched than S3)
  - Equalization of diastolic pressures on catheterization diagnostic
  - Septal bounce on echo (ventricular interdependence)
  - Distinguish from restrictive cardiomyopathy (both cause diastolic dysfunction)
  - Pericardiectomy curative but high operative mortality 6-12%
  - Post-cardiac surgery and post-radiation most common causes
  - Pericardial thickening on CT/MRI (over 4 mm)

differentials:
  - Restrictive cardiomyopathy: normal pericardium, no septal bounce, enlarged atria, concordant ventricles, higher BNP
  - Cardiac tamponade: acute presentation, pulsus paradoxus present, equalization at higher pressures
  - Right heart failure from pulmonary hypertension: elevated PA pressures, no equalization
  - Cirrhosis: ascites and edema but normal JVP, liver disease stigmata
  - Nephrotic syndrome: edema and ascites but hypoalbuminemia, proteinuria

trace: |
  A 58-year-old man presented with 6 months of progressive lower extremity edema and abdominal distension. Shortness of breath with exertion. History of CABG 4 years ago. Progressive symptoms despite diuretics. Exam: elevated JVP 18 cm (very high), Kussmaul sign present (JVP rose with inspiration - paradoxical), pericardial knock heard (early diastolic high-pitched sound), hepatomegaly, massive ascites, 3+ pitting edema to knees. Distant heart sounds. BP 108/68, HR 92. Lungs clear. Echocardiogram: normal LV systolic function (EF 60%), prominent septal bounce during respiration (ventricular septum shifts leftward with inspiration - ventricular interdependence), increased respiratory variation in mitral inflow 35% (over 25% diagnostic), dilated IVC with no collapse, pericardium appears thickened. CT chest: pericardial thickening 6 mm throughout (normal below 2 mm), pericardial calcification present (chronic). Diagnosed with constrictive pericarditis (classic findings: right heart failure after cardiac surgery, Kussmaul sign, pericardial knock, septal bounce, pericardial thickening). Right heart catheterization performed: RA pressure 18 mmHg, RV pressure 42/18 mmHg, PA pressure 40/18 mmHg, PCWP 16 mmHg (equalization of diastolic pressures all around 16-18 mmHg - diagnostic), square root sign on RV tracing (rapid early filling then abrupt plateau). Confirmed constrictive pericarditis. Medical management trial: increased furosemide to 80 mg BID, cautious diuresis. Lost 15 pounds fluid over 2 weeks but symptoms still NYHA class III (limited functional capacity). Referred to cardiothoracic surgery for pericardiectomy. Preoperative evaluation showed severe constriction with elevated pressures. Underwent complete pericardiectomy (removal of parietal and visceral pericardium from phrenic nerve to phrenic nerve). High-risk surgery, operative mortality 6-12%. Surgery complicated by bleeding (pericardium adherent to myocardium) but successful. Post-op ICU course: required inotropic support x48 hours (myocardium stunned from chronic constriction). At 1 week JVP decreased to 8 cm, diuresis improved. At 1 month edema resolved 90%, ascites improved, able to walk without dyspnea. At 3 months dramatic improvement: NYHA class I-II, JVP normal, no edema, no ascites, off diuretics (myocardium remodeled). Echocardiogram: normalized septal motion, no more ventricular interdependence. At 1 year excellent functional status, pericardiectomy curative for constrictive pericarditis.
