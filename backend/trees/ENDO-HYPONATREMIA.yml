tree_id: ENDO-HYPONATREMIA
name: Hyponatremia
family: Endocrinology
specialty: Endocrinology/Nephrology
chief_complaint: Confusion, nausea, headache, seizures if severe
description: Serum sodium less than 135 mEq/L, most common electrolyte disorder
icd10: E87.1
urgency: routine-to-emergency
workup:
  - Clinical presentation - severity depends on degree and rapidity of sodium decline
  - Mild hyponatremia (130-135 mEq/L) - often asymptomatic
  - Moderate (125-129 mEq/L) - nausea, malaise, headache, confusion, lethargy
  - Severe (less than 125 mEq/L) - altered mental status, seizures, coma, respiratory arrest
  - Acute hyponatremia (less than 48 hours) - more symptomatic, higher risk cerebral edema
  - Chronic hyponatremia (greater than 48 hours) - brain adapted, less symptomatic
  - Symptoms - nausea, vomiting, headache, confusion, lethargy, muscle cramps, seizures, coma
  - Laboratory assessment - systematic approach
  - Confirm true hyponatremia
  - Serum osmolality - distinguishes types
  - Hypotonic hyponatremia (serum osm less than 280 mOsm/kg) - TRUE hyponatremia, most common
  - Isotonic (280-295) - pseudohyponatremia (lab artifact from hyperlipidemia, hyperproteinemia)
  - Hypertonic (greater than 295) - hyperglycemia, mannitol (osmotic shift of water)
  - For hypotonic hyponatremia - assess volume status
  - Hypovolemic - total body sodium depleted, water depleted more
  - Euvolemic - total body sodium normal, water excess
  - Hypervolemic - total body sodium increased, water increased more
  - Physical examination for volume status
  - Hypovolemic - orthostatic hypotension, tachycardia, dry mucous membranes, decreased skin turgor, flat neck veins
  - Euvolemic - normal vital signs, no edema, normal JVP
  - Hypervolemic - edema, elevated JVP, ascites, pulmonary crackles
  - Urine studies - key to determining etiology
  - Urine sodium (UNa)
  - Less than 20 mEq/L - renal sodium conservation (extrarenal losses, low effective circulating volume)
  - Greater than 40 mEq/L - renal sodium wasting
  - Urine osmolality (Uosm)
  - Greater than 100 mOsm/kg - ADH present (SIADH, volume depletion, hypothyroidism, adrenal insufficiency)
  - Less than 100 mOsm/kg - ADH suppressed (primary polydipsia, beer potomania)
  - Additional tests based on clinical suspicion
  - Thyroid function (TSH, free T4) - hypothyroidism causes hyponatremia
  - Cortisol level (morning cortisol, ACTH stimulation test) - adrenal insufficiency
  - Serum glucose (correct sodium for hyperglycemia - add 1.6 mEq/L for every 100 mg/dL glucose above 100)
  - BUN, creatinine (renal function)
  - Uric acid (low in SIADH due to increased renal excretion)
  - Classification by volume status and urine sodium
  - Hypovolemic hyponatremia
  - UNa less than 20 - extrarenal losses (vomiting, diarrhea, third-spacing, burns)
  - UNa greater than 40 - renal losses (diuretics, cerebral salt wasting, adrenal insufficiency, osmotic diuresis)
  - Euvolemic hyponatremia
  - SIADH (most common) - UNa greater than 40, Uosm greater than 100
  - Hypothyroidism - low TSH, low T4
  - Adrenal insufficiency (secondary) - low cortisol, low ACTH
  - Primary polydipsia - UNa variable, Uosm less than 100
  - Hypervolemic hyponatremia
  - Heart failure, cirrhosis, nephrotic syndrome
  - UNa less than 20 (avid sodium retention)
  - Total body sodium increased but effective circulating volume decreased
treatment:
  - Treatment depends on severity of symptoms and chronicity
  - Severe symptomatic hyponatremia (seizures, coma, respiratory arrest) - EMERGENCY
  - Hypertonic saline (3% NaCl) 100-150 mL IV bolus over 10-20 minutes
  - Can repeat x2-3 if persistent severe symptoms
  - Goal - increase sodium by 4-6 mEq/L in first 1-2 hours (stop seizures, reduce cerebral edema)
  - Check sodium every 2-4 hours
  - CAUTION - do NOT correct too rapidly (risk osmotic demyelination syndrome)
  - Maximum correction 10-12 mEq/L in 24 hours, 18 mEq/L in 48 hours
  - Moderate symptomatic hyponatremia - gradual correction
  - Hypertonic saline 3% NaCl infusion at 15-30 mL/hr
  - Goal increase 0.5-1 mEq/L per hour initially, then slower
  - Monitor sodium every 4-6 hours
  - Asymptomatic or chronic hyponatremia - slow correction
  - Goal increase 4-6 mEq/L per day (maximum 8 mEq/L in 24 hours)
  - Treat underlying cause
  - Specific treatments by etiology
  - Hypovolemic hyponatremia
  - Isotonic saline (0.9% NaCl) to restore volume
  - Stop diuretics if cause
  - Hydrocortisone if adrenal insufficiency
  - SIADH (euvolemic)
  - Fluid restriction 800-1000 mL/day (first-line)
  - Salt tablets, high-salt diet
  - Vasopressin receptor antagonists (vaptans)
  - Tolvaptan 15 mg daily (oral) - conivaptan 20 mg IV (inpatient only)
  - Induce aquaresis (free water excretion without sodium loss)
  - Reserved for severe refractory SIADH
  - CAUTION - can cause rapid overcorrection
  - Treat underlying cause (malignancy, pneumonia, CNS disease, medications)
  - Stop offending medications (SSRIs, carbamazepine, NSAIDs, PPIs)
  - Demeclocycline 300-600 mg BID (induces nephrogenic diabetes insipidus) - alternative for chronic SIADH
  - Hypervolemic hyponatremia
  - Fluid restriction
  - Diuretics (loop diuretics) for volume overload
  - Treat underlying condition (optimize heart failure therapy, treat cirrhosis)
  - Hypothyroidism - levothyroxine replacement
  - Primary polydipsia - behavioral therapy, fluid restriction
  - Osmotic demyelination syndrome (ODS) prevention
  - Occurs if sodium corrected too rapidly (especially in chronic hyponatremia)
  - Risk factors - chronic hyponatremia (greater than 48 hours), severe hyponatremia (less than 120 mEq/L), alcoholism, malnutrition, liver disease
  - Maximum correction 10-12 mEq/L in 24 hours, 18 mEq/L in 48 hours
  - If overcorrection occurs, re-lower sodium with desmopressin (DDAVP) plus hypotonic fluids
  - ODS symptoms - dysarthria, dysphagia, paraparesis, quadriparesis, locked-in syndrome
  - Onset 2-6 days after rapid correction
  - Often irreversible
clinical_pearls:
  - Most common electrolyte abnormality, prevalence 15-30% hospitalized patients
  - Chronic hyponatremia often asymptomatic due to brain adaptation
  - SIADH most common cause of euvolemic hyponatremia
  - SIADH criteria - hypotonic hyponatremia, Uosm greater than 100, UNa greater than 40, euvolemia, normal renal/adrenal/thyroid function
  - Causes of SIADH - malignancy (small cell lung cancer, paraneoplastic), CNS disorders (meningitis, stroke, trauma), pulmonary disease (pneumonia), medications (SSRIs, carbamazepine, cyclophosphamide)
  - Correct sodium for hyperglycemia - for every 100 mg/dL glucose above 100, add 1.6 mEq/L to measured sodium
  - Osmotic demyelination syndrome (ODS) most feared complication - occurs with overly rapid correction
  - High-risk patients for ODS - chronic hyponatremia, alcoholics, malnourished, liver disease
  - If severe symptomatic hyponatremia (seizures) - give hypertonic saline emergently, but then slow correction
  - Beer potomania - hyponatremia in chronic alcoholics from poor solute intake (beer has minimal sodium/protein) plus high fluid intake
differentials:
  - Pseudohyponatremia (lab artifact from hyperlipidemia, hyperproteinemia - normal serum osmolality)
  - Hyperglycemia causing hyponatremia (hypertonic hyponatremia - correct sodium for glucose)
  - Cerebral salt wasting vs SIADH (both UNa greater than 40 but CSW has volume depletion, occurs with CNS disease)
trace:
  - 72-year-old woman presents to ED with 2-day history of confusion and nausea
  - Family reports she has been increasingly confused, not making sense
  - Nausea, several episodes vomiting
  - Generalized weakness
  - No fever, no cough, no chest pain
  - Past medical history - small cell lung cancer diagnosed 6 months ago, on chemotherapy
  - Medications - carboplatin/etoposide chemotherapy (last dose 1 week ago), ondansetron PRN
  - Physical exam - appears confused, oriented to person only
  - Vitals - temp 36.8C, HR 78, BP 125/75, RR 16, SpO2 96% room air
  - HEENT - mucous membranes moist
  - No jugular venous distention
  - Lungs - clear bilaterally
  - Cardiovascular - regular rate and rhythm
  - Abdomen - soft, non-tender, no ascites
  - Extremities - no edema
  - Neurologic - confused but arousable, follows simple commands, no focal deficits
  - Volume status - EUVOLEMIC (normal vital signs, moist mucous membranes, no edema)
  - Labs - sodium 118 mEq/L (severe hyponatremia, normal 135-145)
  - Potassium 4.2 mEq/L, chloride 85 mEq/L, bicarbonate 26 mEq/L
  - BUN 12 mg/dL (low), creatinine 0.8 mg/dL (normal)
  - Glucose 95 mg/dL (normal)
  - Serum osmolality 245 mOsm/kg (low, hypotonic hyponatremia)
  - Urine studies - urine sodium 65 mEq/L (elevated, greater than 40)
  - Urine osmolality 420 mOsm/kg (concentrated, greater than 100)
  - TSH 2.1 mIU/L (normal), morning cortisol 18 mcg/dL (normal)
  - Uric acid 3.2 mg/dL (low, consistent with SIADH)
  - Diagnosis - Severe symptomatic hyponatremia due to SIADH (syndrome of inappropriate ADH)
  - Etiology - paraneoplastic from small cell lung cancer (common cause SIADH)
  - SIADH criteria met - hypotonic hyponatremia, Uosm greater than 100, UNa greater than 40, euvolemic, normal thyroid/adrenal
  - Symptomatic (confusion, nausea) with sodium 118 mEq/L - requires active treatment
  - Unknown if acute or chronic hyponatremia (assume chronic given cancer diagnosis)
  - Admitted for treatment
  - Treatment plan
  - Moderate symptomatic hyponatremia - hypertonic saline
  - 3% NaCl (hypertonic saline) infusion at 20 mL/hr
  - Goal increase sodium by 4-6 mEq/L in first 24 hours
  - Monitor sodium every 4 hours
  - Fluid restriction 800 mL daily
  - Discontinue ondansetron (can worsen SIADH)
  - Hospital course - 4 hours: Sodium increased to 122 mEq/L (increase 4 mEq/L)
  - Confusion improving
  - Hypertonic saline rate decreased to 10 mL/hr
  - 24 hours: Sodium 124 mEq/L (total increase 6 mEq/L in 24 hours - appropriate rate)
  - Confusion resolved, nausea improved
  - Continue hypertonic saline at 10 mL/hr
  - Strict fluid restriction
  - 48 hours: Sodium 129 mEq/L (total increase 11 mEq/L in 48 hours - safe, below 18 mEq/L limit)
  - Asymptomatic, tolerating oral intake
  - Stop hypertonic saline
  - Continue fluid restriction
  - Transition to oral salt tablets
  - Day 4: Sodium 132 mEq/L (stable)
  - Discharge planned
  - Discharge Day 5 - sodium 133 mEq/L
  - Fluid restriction 1000 mL daily
  - High salt diet, salt tablets 2 g TID
  - Oncology follow-up - discuss chemotherapy reducing tumor burden to treat SIADH
  - Consider tolvaptan if refractory
  - 1-week follow-up - sodium 135 mEq/L (normal)
  - Adhering to fluid restriction
  - No confusion, tolerating oral intake
  - Continue management
  - Oncology evaluation - chemotherapy continuing to shrink lung tumor
  - Long-term management - chronic fluid restriction and salt supplementation
  - Sodium stable 133-138 mEq/L
  - Continue treatment of underlying malignancy
  - Outcome - Successful treatment of severe symptomatic SIADH with gradual sodium correction, no osmotic demyelination syndrome
