tree_id: PEDS-CONJUNCTIVITIS
name: Conjunctivitis (Pediatric)
family: pediatrics
specialty: Pediatrics/Ophthalmology
icd10: H10.9
snomed: 9826008
urgency:
  - Decreased vision or significant eye pain
  - Photophobia (suggests corneal involvement or uveitis)
  - Copious purulent discharge in neonate (gonococcal conjunctivitis)
  - Unilateral conjunctivitis with preauricular lymphadenopathy and vesicular eyelid lesions (HSV keratoconjunctivitis)
  - Severe chemosis or eyelid swelling (orbital cellulitis concern)
  - Hypopyon (pus in anterior chamber)
homeopathy: []
presentations:
  - Red or pink eye (conjunctival injection)
  - Eye discharge (watery, mucoid, or purulent)
  - Crusting of eyelids, especially upon waking
  - Foreign body sensation
  - Mild discomfort or irritation (but NOT severe pain)
  - Itching (suggests allergic etiology)
  - Tearing or increased lacrimation
  - Eyelid swelling or edema
  - Normal vision (if vision decreased, consider other diagnosis)
  - Unilateral or bilateral involvement
  - Recent URI symptoms or sick contacts (viral)
  - Seasonal pattern (allergic)
workup:
  - Clinical history
  - Onset and duration of symptoms
  - Unilateral versus bilateral
  - Viral typically starts unilateral, becomes bilateral
  - Bacterial may be unilateral or bilateral
  - Allergic typically bilateral
  - Character of discharge
  - Watery: viral or allergic
  - Thick purulent (yellow-green): bacterial
  - Mucoid stringy: allergic
  - Itching prominent: allergic conjunctivitis
  - Associated symptoms
  - URI symptoms (rhinorrhea, cough, sore throat) - viral
  - Ear pain (otitis media often accompanies bacterial conjunctivitis)
  - Sneezing, nasal congestion, itching - allergic
  - Photophobia or eye pain - concerning for keratitis or uveitis (NOT simple conjunctivitis)
  - Vision changes - concerning for more serious pathology
  - Recent sick contacts or known conjunctivitis exposure
  - Contact lens use (bacterial keratitis risk, especially Pseudomonas)
  - Neonatal conjunctivitis (ophthalmia neonatorum) - special considerations
  - Age at onset (helps determine etiology)
  - Chemical (silver nitrate prophylaxis): first 24 hours
  - Gonococcal: 2-5 days of life
  - Chlamydia: 5-14 days of life
  - HSV: 6-14 days of life
  - Maternal history of sexually transmitted infections
  - Physical examination
  - Visual acuity (age-appropriate testing)
  - Normal in conjunctivitis; if decreased, consider keratitis or uveitis
  - External examination
  - Eyelid swelling, erythema (mild in conjunctivitis; severe suggests orbital cellulitis)
  - Periorbital cellulitis (preseptal) versus orbital cellulitis (postseptal)
  - Orbital cellulitis: proptosis, ophthalmoplegia, pain with eye movement, vision changes - EMERGENT
  - Eyelid eversion to examine tarsal conjunctiva (foreign body, papillae)
  - Conjunctival examination
  - Conjunctival injection (hyperemia)
  - Type and amount of discharge (watery, purulent, mucoid)
  - Chemosis (conjunctival edema)
  - Papillae (bumps on tarsal conjunctiva - allergic)
  - Follicles (lymphoid aggregates - viral, chlamydia)
  - Petechiae or hemorrhage
  - Corneal examination
  - Clarity and luster (should be clear)
  - Staining with fluorescein dye (use blue light or Wood's lamp)
  - Dendritic pattern suggests HSV keratitis
  - Punctate staining suggests keratitis or foreign body
  - Pupil examination
  - Size, symmetry, reactivity (should be normal in conjunctivitis)
  - Irregular pupil or hypopyon suggests anterior uveitis or endophthalmitis
  - Preauricular lymphadenopathy (viral or chlamydia)
  - Distinguish bacterial versus viral versus allergic conjunctivitis
  - Bacterial: purulent discharge, crusting, may be unilateral, no itching
  - Viral: watery discharge, preauricular lymphadenopathy, often with URI, initially unilateral
  - Allergic: bilateral, itching, watery or stringy discharge, seasonal, history of atopy
  - Laboratory evaluation
  - Usually NOT needed - clinical diagnosis
  - Consider culture/Gram stain if:
  - Neonatal conjunctivitis (identify pathogen, test for gonorrhea/chlamydia)
  - Severe purulent conjunctivitis
  - Not responding to empiric treatment
  - Contact lens wearer (risk Pseudomonas)
  - Immunocompromised patient
  - Conjunctival culture and sensitivity
  - Chlamydia and gonorrhea NAAT (especially neonates)
  - Viral culture or PCR if concern for HSV
  - Fluorescein staining (assess for corneal involvement)
treatment:
  - Viral conjunctivitis (most common)
  - Self-limited, resolves in 7-14 days without treatment
  - Supportive care
  - Cool compresses to affected eye
  - Artificial tears (lubricating drops) for comfort
  - Gentle eyelid hygiene (remove crusting with warm water)
  - NO topical antibiotics needed (not bacterial)
  - Highly contagious - handwashing, avoid sharing towels
  - Exclude from daycare/school until discharge resolves (usually 3-5 days)
  - Bacterial conjunctivitis
  - Often self-limited but antibiotics hasten resolution
  - Topical antibiotic eye drops or ointment
  - First-line options
  - Erythromycin 0.5% ophthalmic ointment - apply small ribbon to lower conjunctival sac 2-4 times daily for 5-7 days
  - Good choice for infants and young children (less stinging)
  - Polymyxin B-trimethoprim (Polytrim) drops - 1 drop every 3-4 hours for 5-7 days
  - Fluoroquinolones (broader spectrum, more expensive)
  - Moxifloxacin 0.5% or gatifloxacin 0.3% - 1 drop three times daily for 5-7 days
  - Reserve for contact lens wearers or severe cases (covers Pseudomonas)
  - If concurrent otitis media: oral antibiotics (amoxicillin) cover both
  - Instruct proper administration: pull lower lid down, place drop/ointment, close eye
  - Re-evaluate if no improvement in 2-3 days
  - Allergic conjunctivitis
  - Avoid allergen triggers if identified (dust, pollen, pet dander)
  - Cool compresses
  - Artificial tears (wash away allergens, soothe)
  - Topical antihistamines (first-line)
  - Olopatadine 0.1% (Patanol) - 1 drop twice daily
  - Ketotifen 0.025% (Zaditor) - 1 drop twice daily, available OTC
  - Oral antihistamines (cetirizine, loratadine) if systemic allergy symptoms
  - Topical mast cell stabilizers (cromolyn) - prophylaxis if chronic
  - Topical NSAIDs (ketorolac) for moderate-severe symptoms
  - Topical corticosteroids (prednisolone) - SHORT-TERM only for severe cases
  - Requires ophthalmology supervision (risk increased intraocular pressure, cataracts)
  - Neonatal conjunctivitis (ophthalmia neonatorum)
  - Chemical (silver nitrate): self-limited, no treatment
  - Gonococcal conjunctivitis (copious purulent discharge, 2-5 days age)
  - URGENT - risk corneal perforation and blindness
  - Ceftriaxone 25-50 mg/kg IV/IM single dose (max 125 mg)
  - Frequent saline lavage (every 1-2 hours initially)
  - Admit to hospital, ophthalmology consult
  - Test mother and treat for gonorrhea
  - Chlamydia conjunctivitis (5-14 days age)
  - Oral erythromycin 50 mg/kg/day divided four times daily for 14 days
  - Topical antibiotics NOT sufficient (risk chlamydia pneumonia)
  - Treat mother and partner
  - HSV conjunctivitis (6-14 days age)
  - Topical antiviral: trifluridine drops or vidarabine ointment
  - PLUS systemic acyclovir 60 mg/kg/day IV divided three times daily for 14-21 days
  - Ophthalmology consult
  - Evaluate for disseminated HSV
  - General measures (all types)
  - Hand hygiene (most important to prevent spread)
  - Avoid touching or rubbing eyes
  - Avoid sharing towels, pillowcases, cosmetics
  - Discard eye makeup and replace after infection resolves
  - Clean contact lenses and case (or discard)
  - Stay home from school/daycare while contagious
clinical_pearls:
  - 'Viral conjunctivitis most common cause in children - watery discharge, preauricular lymphadenopathy, often with URI, self-limited'
  - 'Bacterial conjunctivitis has purulent discharge, thick yellow-green, crusting - treat with topical antibiotics'
  - 'Allergic conjunctivitis characterized by itching (hallmark), bilateral, watery/stringy discharge, seasonal pattern'
  - 'Vision should be normal in simple conjunctivitis - if decreased vision, photophobia, or severe pain, consider keratitis or uveitis'
  - 'Most bacterial conjunctivitis self-limited but topical antibiotics shorten course and reduce contagion'
  - 'Neonatal conjunctivitis timing helps identify cause: chemical (first 24 hours), gonococcal (2-5 days), chlamydia (5-14 days), HSV (6-14 days)'
  - 'Gonococcal conjunctivitis in neonate is emergency - copious purulent discharge, risk corneal perforation, needs IV ceftriaxone'
  - 'Fluorescein staining useful to assess corneal involvement - dendritic pattern diagnostic of HSV keratitis'
referrals:
  - Pediatric ophthalmology if decreased vision, corneal involvement, suspected HSV keratitis, severe disease, or not responding to treatment
  - Pediatric ophthalmology URGENT if neonatal gonococcal or HSV conjunctivitis
  - Allergy/immunology if severe refractory allergic conjunctivitis
  - Infectious disease if recurrent or chronic bacterial conjunctivitis, immunocompromised host
differentials:
  - Viral conjunctivitis (most common) - watery discharge, preauricular lymphadenopathy, URI symptoms, self-limited
  - Bacterial conjunctivitis - purulent discharge, crusting, may be unilateral
  - Allergic conjunctivitis - bilateral, itching, watery/stringy mucoid discharge, seasonal
  - Nasolacrimal duct obstruction (dacryostenosis) - tearing and discharge, medial canthal massage improves, age less than 12 months
  - Keratitis (corneal inflammation) - pain, photophobia, decreased vision, fluorescein uptake
  - Uveitis (intraocular inflammation) - photophobia, eye pain, decreased vision, small irregular pupil
  - Blepharitis (eyelid inflammation) - eyelid margin erythema and crusting, dry eyes
  - Subconjunctival hemorrhage - bright red blood under conjunctiva, no discharge, no pain (benign, self-resolves)
  - Orbital cellulitis - severe eyelid swelling, proptosis, ophthalmoplegia, pain with eye movement, fever (URGENT)
  - Foreign body - unilateral, sudden onset, pain, tearing, foreign body sensation
