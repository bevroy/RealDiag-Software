tree_id: OPHT-HORDEOLUM-CHALAZION
name: Hordeolum (Stye) or Chalazion
family: Ophthalmology
specialty: Ophthalmology
icd10:
- H00.019
snomed:
- 1482004
urgency: medium
description: Comprehensive evaluation and management of Hordeolum (Stye) or Chalazion
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Painful or tender eyelid swelling (hordeolum)
- Painless firm nodule in eyelid (chalazion)
- Red, swollen eyelid
- May point toward skin or conjunctival surface
- Hordeolum - acute infection of eyelid gland
- Chalazion - chronic granulomatous inflammation
workup:
- 'Clinical diagnosis: External exam of eyelid'
- 'Evert lid: Determine if internal (meibomian) vs external (Zeis/Moll)'
- No labs or imaging needed
treatment:
- 'Guideline-based treatment options for Hordeolum (Stye) or Chalazion include:'
- 'Warm compresses: 10-15 minutes QID (most important treatment) - promotes drainage
  (AAO 2023)'
- 'Lid hygiene: Gentle massage after warm compress to express gland contents (AAO
  2023)'
- 'Topical antibiotics: Only if pointing or associated blepharitis (AAO 2023)'
- 'Oral antibiotics: Only if surrounding cellulitis or recurrent (also treats meibomian
  dysfunction) (AAO 2023)'
- 'I&D or steroid injection: By ophthalmology if not resolving after 4-6 weeks (chalazion)
  (AAO 2023)'
clinical_pearls:
- 'Hordeolum (stye): Acute infection of gland - external (Zeis or Moll glands at lash
  follicle) or internal (meibomian gland)'
- 'Chalazion: Chronic lipogranuloma from blocked meibomian gland - sterile, not infected'
- Most resolve spontaneously with warm compresses - antibiotics don't speed resolution
- 'Recurrent: Consider seborrheic dermatitis, blepharitis, rosacea - treat underlying
  condition'
- 'Sebaceous gland carcinoma: If chalazion recurs in same location, consider biopsy
  (rare but aggressive cancer)'
referrals:
- 'Ophthalmology if: Not resolving after 4-6 weeks of conservative therapy (may need
  I&D or injection), vision affected, recurrent in same location (biopsy for malignancy),
  preseptal cellulitis develops'
- Most managed by primary care with conservative measures
differentials: []
