  - MRI with demyelinating lesions
  - 'Optic neuritis (25% present with): Painful vision loss, RAPD'
  - 'Sensory symptoms: Paresthesias, Lhermitte sign (electric shock with neck flexion)'
  - 'Motor: Unilateral weakness, spasticity, hyperreflexia, Babinski sign'
  - 'Cerebellar: Ataxia, intention tremor, nystagmus, dysarthria'
differentials:
  - Neuromyelitis optica
  - ADEM
  - Lyme disease
  - Sarcoidosis
  - Vasculitis
workup:
  - 'MRI brain/spine with contrast: Periventricular white matter lesions, enhancement indicates active inflammation'
  - 'LP: Oligoclonal bands (95% MS, absent in serum), elevated IgG index'
  - 'VEP (visual evoked potentials): Prolonged latency (optic nerve demyelination)'
  - 'Serology: Check for NMO-IgG (aquaporin-4 antibody) to exclude neuromyelitis optica'
treatment:
  - 'Guideline-based treatment options for Multiple sclerosis include:'
  - 'Acute relapse: Methylprednisolone 1g IV daily x3-5 days (speeds recovery, doesn''t change long-term outcome) (AAN 2024)'
  - 'First-line DMT: Interferon beta, glatiramer, teriflunomide, dimethyl fumarate (AAN 2024)'
  - 'High-efficacy DMT (aggressive disease): Natalizumab, ocrelizumab, alemtuzumab (AAN 2024)'
  - 'Symptomatic: Baclofen/tizanidine (spasticity), amantadine (fatigue), oxybutynin (bladder) (AAN 2024)'
  - 'MRI monitoring: Annual MRI to assess disease activity and treatment response (AAN 2024)'
clinical_pearls:
  - 'McDonald criteria: Dissemination in time (2+ attacks) and space (2+ CNS lesions)'
  - 'Relapsing-remitting MS (85%): Discrete attacks with full/partial recovery'
  - 'Primary progressive MS (10%): Gradual worsening from onset without relapses'
  - 'MRI: Periventricular white matter lesions (Dawson fingers), juxtacortical, infratentorial'
  - 'OCT (optical coherence tomography): Retinal nerve fiber layer thinning predicts disability'
  - 'Disease-modifying therapy (DMT): Start early to prevent disability'
red_flags: []
disposition_guidance: {}
referrals:
  - 'Neurology for: Suspected MS, initiation of DMT, disease monitoring'
  - 'Neuro-ophthalmology if: Optic neuritis, vision loss'
  - 'Urology if: Neurogenic bladder, urinary retention'
