tree_id: ENDO-DKA-HHS
name: Diabetic Ketoacidosis and Hyperglycemic Hyperosmolar State
family: ENDOCRINOLOGY
specialty: Emergency Medicine, Endocrinology, Critical Care
chief_complaint: Hyperglycemia, Altered Mental Status, Abdominal Pain, Polyuria
description: Comprehensive evaluation and management of DKA and HHS with detailed treatment protocols
version: "1.0"
author: RealDiag Clinical Team

entry_point: hyperglycemic_emergency

nodes:
  - id: hyperglycemic_emergency
    type: question
    text: "Patient with hyperglycemia - Classification?"
    options:
      - label: "Glucose >250, pH <7.3, bicarbonate <18, ketones present"
        next: dka_severity
      - label: "Glucose >600, pH >7.3, serum osmolality >320, minimal ketones"
        next: hhs_diagnosis
      - label: "Features of both DKA and HHS overlap"
        next: mixed_dka_hhs

  - id: dka_severity
    type: question
    text: "DKA severity classification?"
    options:
      - label: "Severe - pH <7.0, bicarbonate <10, or altered mental status"
        next: severe_dka
      - label: "Moderate - pH 7.0-7.24, bicarbonate 10-15"
        next: moderate_dka
      - label: "Mild - pH 7.25-7.30, bicarbonate 15-18"
        next: mild_dka

  - id: severe_dka
    type: diagnosis
    name: "Severe Diabetic Ketoacidosis"
    icd10: "E10.10"
    urgency: critical
    workup:
      - Fingerstick glucose
      - VBG or ABG (pH, bicarbonate, pCO2)
      - Serum beta-hydroxybutyrate (preferred over urine ketones, >3 mmol/L diagnostic)
      - Urine ketones if beta-hydroxybutyrate not available (moderate to large)
      - Anion gap calculation (Na - [Cl + HCO3], typically >12 in DKA)
      - CBC (leukocytosis common even without infection)
      - CMP (sodium, potassium, chloride, bicarbonate, BUN, creatinine, glucose)
      - Corrected sodium (add 1.6 mEq/L for every 100mg/dL glucose >100)
      - Serum osmolality (calculated = 2×Na + glucose/18 + BUN/2.8, usually 290-320 in DKA)
      - Phosphate, magnesium, calcium
      - HbA1c (assess chronic control)
      - Lipase (if abdominal pain)
      - Troponin and ECG (if chest pain or age >40)
      - Blood cultures, urinalysis, urine culture (search for precipitant)
      - Chest X-ray (pneumonia)
      - Pregnancy test in women of childbearing age
    treatment:
      - ICU admission
      - FLUIDS - Initial resuscitation
      - 0.9% normal saline 1-2 L IV bolus over first hour (15-20 mL/kg/hr)
      - Then 0.45% saline at 250-500 mL/hr if corrected sodium normal or high
      - Continue 0.9% saline if corrected sodium low
      - Switch to D5 0.45% saline when glucose reaches 200-250 mg/dL (to prevent hypoglycemia while continuing insulin)
      - INSULIN - Continuous IV infusion (do NOT give bolus in severe DKA with K <3.3)
      - Check potassium before starting insulin
      - If K <3.3, hold insulin and give potassium first
      - If K 3.3-5.2, start insulin and give potassium
      - If K >5.2, start insulin and hold potassium initially
      - Regular insulin 0.1 units/kg/hr IV continuous infusion (or 0.14 units/kg/hr)
      - Goal glucose decrease 50-75 mg/dL per hour
      - When glucose <200-250, decrease insulin to 0.02-0.05 units/kg/hr AND add dextrose to fluids
      - Continue insulin infusion until anion gap closes (<12) and bicarbonate >15 mEq/L
      - POTASSIUM - Aggressive replacement (insulin shifts K intracellularly)
      - Goal potassium 4-5 mEq/L
      - If K <3.3, give 20-30 mEq/hr IV and hold insulin
      - If K 3.3-4.0, give 20-30 mEq/L in each liter of IV fluid
      - If K 4.0-5.2, give 10-20 mEq/L in each liter of IV fluid
      - If K >5.2, hold potassium initially, recheck in 2 hours
      - BICARBONATE - Controversial, generally NOT recommended
      - Consider if pH <6.9 - give 100 mEq sodium bicarbonate in 400mL sterile water + 20 mEq KCl over 2 hours, repeat q2h until pH >7.0
      - PHOSPHATE - Usually not needed unless severe hypophosphatemia <1.0 mg/dL
      - Can add potassium phosphate 20-30 mEq/L to IV fluids
      - TREAT PRECIPITATING CAUSE - infection (antibiotics), MI (cardiology), medication non-compliance (education)
      - MONITORING - Hourly fingersticks, vitals, neuro checks; Labs q2-4h (VBG, CMP, anion gap, beta-hydroxybutyrate)
      - TRANSITION - Once anion gap closed, bicarbonate >15, and patient able to eat, overlap SC insulin with IV insulin x 1-2 hours before stopping drip
      - Start basal-bolus insulin regimen (e.g., glargine QHS + lispro with meals)

  - id: moderate_dka
    type: diagnosis
    name: "Moderate Diabetic Ketoacidosis"
    icd10: "E10.10"
    urgency: critical
    workup:
      - Same as severe DKA
      - VBG, glucose, ketones, anion gap, CMP
      - Search for precipitant
    treatment:
      - ICU or step-down unit admission
      - Same treatment protocol as severe DKA
      - IV fluid resuscitation (0.9% NS 1L first hour, then 250-500mL/hr)
      - Insulin infusion 0.1 units/kg/hr
      - Potassium replacement (goal 4-5 mEq/L)
      - Add dextrose when glucose <250
      - Continue until anion gap closes
      - Monitor q2-4h
      - Transition to SC insulin when anion gap closed and patient eating

  - id: mild_dka
    type: diagnosis
    name: "Mild Diabetic Ketoacidosis"
    icd10: "E10.10"
    urgency: high
    workup:
      - VBG, glucose, ketones, CMP, anion gap
      - Urinalysis and culture
      - Chest X-ray if respiratory symptoms
    treatment:
      - Hospital admission (floor or observation)
      - IV fluids (0.9% NS 1L first hour, then 250mL/hr)
      - Insulin infusion 0.1 units/kg/hr OR subcutaneous rapid-acting insulin q2h
      - Potassium replacement as needed
      - Add dextrose when glucose <250
      - Monitor q2-4h
      - Can transition to SC insulin earlier once anion gap normalizing and patient tolerating PO
      - Total resolution typically within 12-24 hours

  - id: hhs_diagnosis
    type: diagnosis
    name: "Hyperglycemic Hyperosmolar State (HHS)"
    icd10: "E11.00"
    urgency: critical
    workup:
      - Glucose (typically >600 mg/dL, often >1000)
      - VBG (pH usually >7.3, mild acidosis possible)
      - Serum osmolality (>320 mOsm/kg, diagnostic)
      - Calculated osmolality = 2×Na + glucose/18 + BUN/2.8
      - Anion gap (usually normal or mildly elevated)
      - Beta-hydroxybutyrate (absent or minimal <3 mmol/L)
      - CMP (sodium, potassium, severe dehydration)
      - BUN/Cr (prerenal azotemia common)
      - CBC
      - Mental status assessment (stupor/coma common)
      - Neurologic exam (focal deficits can occur)
      - CT head if focal findings (to rule out stroke)
      - Search for precipitant (infection, MI, stroke, medication non-adherence)
    treatment:
      - ICU admission (high mortality rate 10-20%)
      - FLUIDS - More aggressive than DKA (total body water deficit 8-12 L)
      - 0.9% NS 1-2 L IV bolus first hour
      - Then 0.9% NS 250-500 mL/hr (or 0.45% saline if corrected sodium high)
      - Switch to D5 0.45% saline when glucose reaches 250-300 mg/dL
      - Goal - correct dehydration over 24-48 hours (slower than DKA to avoid cerebral edema)
      - INSULIN - Lower doses than DKA, start AFTER initial fluid resuscitation
      - Wait 1-2 hours after starting fluids before starting insulin (fluids alone will lower glucose initially)
      - Regular insulin 0.05-0.1 units/kg/hr IV (HALF the rate used in DKA)
      - Goal glucose decrease 50-75 mg/dL per hour
      - Reduce insulin when glucose <300 mg/dL
      - POTASSIUM - Replace as in DKA protocol
      - Check before starting insulin
      - Goal 4-5 mEq/L
      - Add to IV fluids as needed
      - MONITOR - Hourly glucose, vitals, neuro checks, I/O; Labs q2-4h (VBG, CMP, osmolality)
      - Avoid rapid correction of hypernatremia (risk of cerebral edema)
      - TREAT PRECIPITATING CAUSE - infection (antibiotics), stroke (neurology), MI (cardiology)
      - DVT prophylaxis (high risk due to hyperosmolality) - heparin 5000 units SC q8-12h
      - TRANSITION - Once glucose <250-300, osmolality <315, and patient alert and eating, transition to SC insulin
      - Overlap SC and IV insulin x2 hours

  - id: mixed_dka_hhs
    type: diagnosis
    name: "Mixed DKA and HHS"
    icd10: "E10.10"
    urgency: critical
    workup:
      - Same as severe DKA and HHS
      - Glucose >600, pH <7.3, ketones present, osmolality >320
    treatment:
      - ICU admission
      - Treat as severe DKA with HHS fluid requirements
      - Aggressive IV fluid resuscitation
      - Insulin infusion 0.1 units/kg/hr
      - Potassium replacement
      - Correct acidosis and hyperosmolality simultaneously
      - Close monitoring q1-2h
      - Treat precipitating cause
      - High mortality risk
