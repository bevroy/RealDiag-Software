tree_id: ENT-CHRONIC-SINUSITIS
name: Chronic Sinusitis
family: Ent
specialty: Ent
icd10:
- J32.9
snomed:
- 40055000
urgency: medium
description: Comprehensive evaluation and management of Chronic Sinusitis
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Symptoms lasting > 12 weeks
- Nasal congestion, obstruction
- Facial pressure or fullness
- Postnasal drip
- Decreased sense of smell
- May have nasal polyps
- Recurrent acute exacerbations
workup:
- CT sinus without contrast (REQUIRED for diagnosis) - shows mucosal thickening, opacification,
  polyps
- Nasal endoscopy by ENT - visualize polyps, purulent discharge, anatomic obstruction
- Allergy testing if suspected allergic component (IgE, skin testing)
- Sweat chloride or genetic testing if concern for cystic fibrosis (children/young
  adults with polyps)
treatment:
- 'Guideline-based treatment options for Chronic Sinusitis include:'
- Saline nasal irrigation (neti pot or squeeze bottle) BID - most effective medical
  therapy (AAO-HNS 2023)
- 'Intranasal corticosteroids: Fluticasone 2 sprays each nostril daily × 3-6 months
  (first-line) (AAO-HNS 2023)'
- 'Trial of prolonged antibiotics: Amoxicillin-clavulanate or doxycycline × 3 weeks
  (culture-directed if available) (AAO-HNS 2023)'
- 'Oral corticosteroids: Prednisone 40-60mg daily × 5-7 days for acute exacerbations
  or nasal polyps (AAO-HNS 2023)'
- 'If refractory: FESS (functional endoscopic sinus surgery) to restore drainage pathways
  (AAO-HNS 2023)'
clinical_pearls:
- Inflammation of sinuses >12 weeks (vs acute <4 weeks, subacute 4-12 weeks)
- 'Pathophysiology: Ostiomeatal complex obstruction → impaired drainage → chronic
  inflammation'
- 'With nasal polyps: Suspect aspirin-exacerbated respiratory disease (Samter''s triad:
  polyps, asthma, aspirin sensitivity)'
- 'Fungal sinusitis: Allergic fungal sinusitis (thick mucin, eosinophils) vs invasive
  (immunocompromised, life-threatening)'
- Medical therapy fails in 20-30% - functional endoscopic sinus surgery (FESS) improves
  drainage
referrals:
- ENT for all chronic sinusitis - nasal endoscopy and FESS evaluation
- Allergy/Immunology if refractory or allergic fungal sinusitis
- Immunology workup if recurrent infections (consider immunodeficiency)
differentials: []
