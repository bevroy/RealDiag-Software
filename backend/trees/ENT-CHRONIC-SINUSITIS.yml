tree_id: ENT-CHRONIC-SINUSITIS
name: Chronic Sinusitis
family: ent
specialty: Otolaryngology
icd10_code: J32.9

presentations:
  - Nasal congestion or obstruction (>12 weeks)
  - Purulent nasal drainage (anterior or posterior)
  - Facial pain or pressure
  - Hyposmia or anosmia (reduced sense of smell)
  - Postnasal drip
  - Chronic cough (especially nocturnal)
  - Halitosis
  - Fatigue
  - Dental pain (maxillary sinusitis)
  - Recurrent acute sinusitis episodes

workup:
  - History:
    - Duration and chronicity of symptoms (>12 weeks diagnostic)
    - Prior treatments and response
    - History of allergies or asthma
    - Prior sinus surgery
    - Immunodeficiency or immunosuppression
    - Occupational or environmental exposures
    - Tobacco use
    - Recent dental procedures or dental disease
  - Physical exam:
    - Anterior rhinoscopy (purulent drainage, mucosal edema, polyps)
    - Transillumination of sinuses (limited sensitivity)
    - Nasal endoscopy (purulence from middle meatus, polyps, anatomic obstruction)
    - Examine for nasal septal deviation
    - Palpation and percussion over sinuses
    - Dentition examination
  - Diagnostic studies:
    - CT sinus (non-contrast) - gold standard imaging
    - Allergy testing (skin prick or IgE) if allergic component suspected
    - Nasal endoscopy in ENT clinic
    - Consider sweat chloride test or genetic testing if cystic fibrosis suspected
    - Immunoglobulin levels if recurrent or refractory
    - Aspergillus IgE if allergic fungal sinusitis suspected
    - Nasal culture (limited utility unless post-operative or recurrent)

treatment:
  medical_management:
    - Intranasal corticosteroids (first-line) - Fluticasone 2 sprays each nostril daily or mometasone 2 sprays each nostril daily
    - Saline nasal irrigation BID-TID (high-volume, isotonic or hypertonic)
    - Systemic corticosteroids for severe exacerbations - Prednisone 20-40mg daily x 5-7 days
    - Prolonged antibiotic course (3-4 weeks) if bacterial superinfection suspected - Amoxicillin-clavulanate 875mg PO BID or doxycycline 100mg PO BID
    - Macrolide antibiotics for anti-inflammatory effect - Azithromycin 250mg PO 3x/week x 12 weeks
    - Oral antihistamines if allergic component (cetirizine, loratadine)
    - Leukotriene antagonist (montelukast 10mg daily) if asthma or aspirin sensitivity
    - Decongestants (pseudoephedrine) - use with caution, avoid prolonged use
  allergy_management:
    - Environmental allergen avoidance
    - Allergy testing and immunotherapy if appropriate
  surgical_management:
    - Functional endoscopic sinus surgery (FESS) if refractory to medical therapy
    - Indications - Failed medical management (>12 weeks optimal therapy), anatomic obstruction, nasal polyps, recurrent acute sinusitis
    - Balloon sinuplasty (less invasive option for select patients)
  special_considerations:
    - Allergic fungal sinusitis - requires surgery plus oral corticosteroids
    - Aspirin-exacerbated respiratory disease (Samter triad) - aspirin desensitization may help
    - Cystic fibrosis - aggressive medical therapy, consider dornase alfa nasal irrigation

clinical_pearls:
  - Chronic rhinosinusitis requires symptoms >12 weeks plus objective findings (CT or endoscopy)
  - Most common organisms are polymicrobial (Staph aureus, coagulase-negative Staph, anaerobes)
  - Nasal saline irrigation is as effective as antibiotics for symptom relief
  - Intranasal corticosteroids are the cornerstone of medical therapy
  - Acute bacterial exacerbations may require antibiotics, but prolonged courses (3-4 weeks) needed
  - CT scan should be obtained after maximal medical therapy to guide surgical planning
  - Nasal polyps are common in chronic sinusitis and suggest need for surgery
  - Unilateral symptoms or findings warrant evaluation for tumor
  - Consider cystic fibrosis in children with chronic sinusitis and nasal polyps
  - Allergic fungal sinusitis presents with thick, eosinophilic mucin and requires surgery
  - Samter triad (asthma, aspirin sensitivity, nasal polyps) has high recurrence after surgery
  - Dental disease can cause maxillary sinusitis (odontogenic sinusitis)

trace:
  - Diagnostic criteria for chronic rhinosinusitis
  - Medical management algorithm
  - Indications for functional endoscopic sinus surgery
  - Management of allergic fungal sinusitis

citations:
  - Rosenfeld RM, et al. (2015). Clinical Practice Guideline (Update): Adult Sinusitis. Otolaryngol Head Neck Surg, 152(2 Suppl), S1-S39.
  - Orlandi RR, et al. (2016). International Consensus Statement on Allergy and Rhinology: Rhinosinusitis. Int Forum Allergy Rhinol, 6 Suppl 1, S22-209.
  - Fokkens WJ, et al. (2020). European Position Paper on Rhinosinusitis and Nasal Polyps 2020. Rhinology, 58(Suppl S29), 1-464.
