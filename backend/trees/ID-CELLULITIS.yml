tree_id: ID-CELLULITIS
name: Cellulitis and Skin and Soft Tissue Infections
family: INFECTIOUS DISEASE
specialty: Emergency Medicine, Infectious Disease, Internal Medicine
chief_complaint: Red, Swollen, Painful Skin
description: Comprehensive evaluation and management of cellulitis and complicated skin infections
version: "1.0"
icd10: L03.90
author: RealDiag Clinical Team

entry_point: cellulitis_presentation

nodes:
  - id: cellulitis_presentation
    type: question
    text: "Clinical presentation of skin infection?"
    options:
      - label: "Purulent drainage, fluctuance, or abscess present"
        next: purulent_infection
      - label: "Non-purulent (cellulitis) - erythema, warmth, edema without drainage"
        next: cellulitis_severity
      - label: "Necrotizing infection suspected (rapid progression, severe pain, crepitus, bullae, systemic toxicity)"
        next: necrotizing_fasciitis

  - id: necrotizing_fasciitis
    type: diagnosis
    name: "Necrotizing Fasciitis"
    icd10: "M72.6"
    urgency: critical
    workup:
      - Clinical diagnosis (do NOT delay surgery for imaging)
      - LRINEC score (Laboratory Risk Indicator for Necrotizing Fasciitis) - CRP >150, WBC, Hgb, Na, Cr, glucose (score ≥6 suggests necrotizing infection)
      - CBC (leukocytosis or leukopenia)
      - CMP (renal failure, hyponatremia)
      - Lactate (elevated)
      - CK (elevated if myonecrosis)
      - Blood cultures
      - CT or MRI (shows fascial thickening, gas in soft tissue) - only if diagnosis uncertain and patient stable
      - Surgical exploration is diagnostic
    treatment:
      - EMERGENT surgical consultation for immediate debridement (within 6 hours improves survival)
      - ICU admission
      - Aggressive fluid resuscitation
      - Broad-spectrum IV antibiotics (empiric, start immediately)
      - Vancomycin 15-20mg/kg IV q8-12h (MRSA coverage) PLUS
      - Piperacillin-tazobactam 4.5g IV q6h OR meropenem 1g IV q8h (gram-negative and anaerobic coverage) PLUS
      - Clindamycin 600-900mg IV q8h (toxin suppression, improves outcomes)
      - Alternative if penicillin allergy - Vancomycin + ciprofloxacin 400mg IV q12h + metronidazole 500mg IV q8h
      - IVIG 2g/kg IV x1 dose (consider for streptococcal toxic shock syndrome)
      - Multiple surgical debridements often needed (repeat every 24-48 hours until all necrotic tissue removed)
      - Hyperbaric oxygen (adjunctive, controversial benefit)
      - Vasopressors if septic shock
      - Monitor for compartment syndrome
      - High mortality (20-40%)

  - id: purulent_infection
    type: question
    text: "Size and severity of abscess/purulent infection?"
    options:
      - label: "Large abscess (>5cm) or multiple abscesses with systemic signs (fever, tachycardia)"
        next: complicated_abscess
      - label: "Simple abscess (<5cm) without systemic signs"
        next: simple_abscess

  - id: simple_abscess
    type: diagnosis
    name: "Simple Skin Abscess"
    icd10: "L02.91"
    urgency: medium
    workup:
      - Clinical diagnosis
      - No labs or cultures needed for simple abscess
      - Consider wound culture if treatment failure or immunocompromised
    treatment:
      - Incision and drainage (I&D) - PRIMARY treatment (antibiotics alone insufficient)
      - Local anesthesia (lidocaine 1% with epinephrine)
      - Incision along skin lines
      - Break up loculations with hemostat
      - Irrigate cavity
      - Pack wound loosely with iodoform gauze (remove in 24-48 hours)
      - Antibiotics NOT routinely needed after adequate I&D
      - Antibiotics indicated if - Systemic signs, immunocompromised, failed I&D alone, extensive surrounding cellulitis (>5cm from abscess)
      - If antibiotics needed - Treat for MRSA
      - Outpatient oral antibiotics - TMP-SMX DS 1-2 tabs PO BID x 5-7 days OR doxycycline 100mg PO BID x 5-7 days OR clindamycin 300-450mg PO TID x 5-7 days
      - Warm compresses
      - Elevation
      - Follow-up in 48-72 hours for wound check and packing removal
      - Return precautions - worsening redness, fever, spreading infection

  - id: complicated_abscess
    type: diagnosis
    name: "Complicated Skin Abscess with Systemic Signs"
    icd10: "L02.91"
    urgency: high
    workup:
      - CBC (leukocytosis)
      - Blood cultures (if febrile or septic)
      - Wound culture and Gram stain from abscess
      - Consider imaging (ultrasound or CT) if deep abscess suspected
    treatment:
      - Hospital admission if severe systemic signs or unable to tolerate oral
      - Incision and drainage (I&D)
      - IV antibiotics for MRSA and streptococcal coverage
      - Vancomycin 15-20mg/kg IV q8-12h OR daptomycin 4-6mg/kg IV q24h OR linezolid 600mg IV q12h
      - Add gram-negative coverage if diabetic foot infection or immunocompromised
      - Transition to oral when afebrile and improving (TMP-SMX, doxycycline, or clindamycin)
      - Total duration 5-10 days depending on response
      - Daily wound care
      - Surgical consultation if large or deep abscess

  - id: cellulitis_severity
    type: question
    text: "Cellulitis severity assessment?"
    options:
      - label: "Severe - Systemic toxicity, immunocompromised, facial cellulitis, or failed outpatient treatment"
        next: severe_cellulitis
      - label: "Moderate - Otherwise healthy, able to tolerate oral antibiotics"
        next: moderate_cellulitis

  - id: severe_cellulitis
    type: diagnosis
    name: "Severe Cellulitis Requiring Hospitalization"
    icd10: "L03.90"
    urgency: high
    workup:
      - CBC (leukocytosis)
      - Blood cultures x2 (low yield, only 5-10% positive)
      - CMP (if septic or AKI concern)
      - Wound culture if drainage present
      - Imaging (ultrasound or MRI) if concerned for deep abscess or necrotizing infection
      - Mark borders of erythema with pen (track progression)
    treatment:
      - Hospital admission
      - IV antibiotics - Empiric for Streptococcus and Staphylococcus aureus (including MRSA)
      - Vancomycin 15-20mg/kg IV q8-12h (MRSA coverage) OR daptomycin 4mg/kg IV q24h OR linezolid 600mg IV q12h PLUS (if purulent features or MRSA risk)
      - Cefazolin 1-2g IV q8h (streptococcal coverage) - if non-purulent cellulitis in non-MRSA colonized patient
      - For typical non-purulent cellulitis - Cefazolin 2g IV q8h alone is adequate (covers Strep, MSSA)
      - Facial cellulitis - Add anaerobic coverage (ampicillin-sulbactam 3g IV q6h OR ceftriaxone 2g IV q24h + metronidazole 500mg IV q8h)
      - Diabetic foot infection - Broad-spectrum (piperacillin-tazobactam 3.375g IV q6h OR ampicillin-sulbactam + ciprofloxacin)
      - Elevation of affected limb
      - Mark borders and reassess in 24-48 hours
      - Transition to oral when improving (48-72 hours afebrile, erythema not progressing)
      - Oral step-down - Cephalexin 500mg PO QID, dicloxacillin 500mg PO QID, or if MRSA - TMP-SMX DS 1-2 tabs BID or doxycycline 100mg BID
      - Total duration 5-14 days (until erythema and warmth resolved)

  - id: moderate_cellulitis
    type: diagnosis
    name: "Moderate Cellulitis (Outpatient Treatment)"
    icd10: "L03.90"
    urgency: medium
    workup:
      - Clinical diagnosis
      - Mark borders of erythema
      - No labs or cultures needed for uncomplicated cellulitis
    treatment:
      - Outpatient oral antibiotics
      - Non-purulent cellulitis (typical) - Treat for Streptococcus and MSSA
      - Cephalexin 500mg PO QID x 5-10 days OR dicloxacillin 500mg PO QID x 5-10 days OR cefadroxil 500mg PO BID
      - If penicillin allergy - Clindamycin 300-450mg PO TID x 5-10 days
      - If MRSA risk factors (prior MRSA, injection drug use, recent hospitalization, purulent features) - Add MRSA coverage
      - TMP-SMX DS 1-2 tabs PO BID x 5-10 days OR doxycycline 100mg PO BID x 5-10 days OR clindamycin 300-450mg PO TID
      - Elevation of affected limb
      - NSAIDs for pain and inflammation
      - Warm compresses
      - Close follow-up in 48-72 hours (phone call or visit)
      - Return precautions - Fever, worsening pain, spreading redness, blisters, drainage
      - If no improvement in 48-72 hours, consider hospitalization for IV antibiotics
