tree_id: RHEUM-RHEUMATOID-ARTHRITIS
name: Rheumatoid Arthritis
family: Orthopedics
specialty: Rheumatology
chief_complaint: Joint pain and swelling
description: Chronic systemic autoimmune disease causing symmetric inflammatory polyarthritis with potential for joint destruction and extra-articular manifestations

icd10: M05.9
snomed: 69896004

urgency: routine

workup:
  - Clinical diagnosis: symmetric polyarthritis (>3 joints), morning stiffness >1 hour, involvement of small joints of hands/feet (MCPs, PIPs, MTPs - DIP sparing), rheumatoid nodules
  - Laboratory: RF positive in 70-80%, anti-CCP antibodies more specific (95%), ESR/CRP elevated (markers of inflammation), CBC (anemia of chronic disease common)
  - Imaging: radiographs hands/feet show periarticular osteopenia early, then joint space narrowing/erosions (diagnostic but late finding), ultrasound/MRI detect synovitis and erosions earlier
  - 2010 ACR/EULAR classification criteria: score ≥6/10 definite RA (points for number/size joints involved, serology RF/anti-CCP, duration ≥6 weeks, acute phase reactants ESR/CRP)
  - Extra-articular: pulmonary (interstitial lung disease, pleural effusion), cardiac (pericarditis, accelerated atherosclerosis), ocular (keratoconjunctivitis sicca, scleritis), Felty syndrome (RA + splenomegaly + neutropenia)

treatment:
  - Early aggressive DMARD therapy prevents joint damage - start within 3 months of diagnosis
  - First-line: methotrexate 15-25 mg weekly (DMARD anchor drug) with folic acid 1 mg daily (reduces side effects), monitor CBC/CMP/LFTs every 8-12 weeks
  - Add hydroxychloroquine 200-400 mg daily or sulfasalazine 2-3 g daily for combination DMARD therapy if inadequate response to methotrexate monotherapy
  - Biologic DMARDs if inadequate response to conventional DMARDs: TNF inhibitors first-line biologics (etanercept 50 mg SC weekly, adalimumab 40 mg SC every 2 weeks, infliximab 3-10 mg/kg IV at 0/2/6 weeks then every 8 weeks), screen for latent TB before starting
  - Alternative biologics: IL-6 inhibitor (tocilizumab), B-cell depleting (rituximab), T-cell costimulation blocker (abatacept), JAK inhibitors (tofacitinib, baricitinib)
  - Glucocorticoids: prednisone 5-10 mg daily bridging therapy while waiting for DMARD to work (takes 6-12 weeks), taper to lowest effective dose or discontinue (long-term side effects)
  - NSAIDs for symptomatic relief but do not modify disease
  - Target: clinical remission or low disease activity (DAS28 <2.6 remission, <3.2 low disease activity)
  - Physical/occupational therapy for joint protection and function
  - Vaccinations: pneumococcal, influenza, avoid live vaccines if on immunosuppression

clinical_pearls:
  - Symmetric polyarthritis with morning stiffness >1 hour classic presentation
  - Anti-CCP more specific than RF and predicts erosive disease
  - Early aggressive DMARD therapy (within 3 months) prevents joint destruction
  - Methotrexate is anchor DMARD - most patients require combination therapy
  - Treat to target: remission or low disease activity assessed every 3-6 months
  - Screen for latent TB before starting biologics (TNF inhibitors reactivate TB)
  - Extra-articular manifestations increase morbidity/mortality
  - Increased cardiovascular risk - manage traditional risk factors aggressively

differentials:
  - Psoriatic arthritis (asymmetric oligoarthritis, DIP involvement, nail pitting/onycholysis, dactylitis, enthesitis, psoriatic skin lesions)
  - Systemic lupus erythematosus (non-erosive arthritis, malar rash, photosensitivity, serositis, renal disease, ANA/anti-dsDNA positive)
  - Osteoarthritis (DIP/PIP involvement, Heberden/Bouchard nodes, worse with use, no prolonged morning stiffness, not inflammatory)
  - Polymyalgia rheumatica (elderly, shoulder/hip girdle pain and stiffness, ESR markedly elevated >50, dramatic response to prednisone)

trace:
  - 45-year-old woman presents with 4 months progressive joint pain and swelling in hands/wrists/feet, worst in mornings with stiffness lasting 2-3 hours, improves with activity, difficulty making fist/opening jars, 10-pound weight loss, fatigue
  - Exam: synovitis (boggy swelling/warmth/tenderness) bilateral MCPs/PIPs/wrists/MTPs symmetric, decreased grip strength, no rash/nodules
  - Labs: RF 156 IU/mL (elevated), anti-CCP >200 U/mL (markedly elevated), ESR 48 mm/hr, CRP 3.2 mg/dL (both elevated), CBC with mild anemia Hgb 11.2 g/dL
  - Radiographs hands/feet: periarticular osteopenia, no erosions yet (early disease)
  - Diagnosis: seropositive rheumatoid arthritis (2010 criteria score 8/10 - symmetric polyarthritis small joints 5 points, RF/anti-CCP positive 3 points, ESR/CRP elevated 1 point, duration >6 weeks)
  - Started methotrexate 15 mg weekly with folic acid 1 mg daily, prednisone 10 mg daily bridging therapy
  - 6 weeks: some improvement but still significant synovitis, increased methotrexate to 20 mg weekly, added hydroxychloroquine 400 mg daily
  - 3 months: marked improvement, morning stiffness 15 minutes, tapered prednisone to 5 mg daily
  - 6 months: clinical remission (no tender/swollen joints, ESR/CRP normal), stopped prednisone, continued methotrexate/hydroxychloroquine maintenance
  - 1 year: sustained remission, repeat radiographs show no progression/new erosions, excellent functional status
