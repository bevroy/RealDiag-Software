tree_id: DERM-ALOPECIA-ENCOUNTER
name: Alopecia Areata (Encounter)
family: Dermatology
specialty: Dermatology/Primary Care
chief_complaint: Sudden hair loss in patches
description: Autoimmune condition causing non-scarring hair loss, typically in well-demarcated round or oval patches. Exclamation point hairs at periphery diagnostic. Variable prognosis - may spontaneously regrow or progress to total scalp (alopecia totalis) or body (alopecia universalis) hair loss.
icd10: L63.9
snomed: 68225006
presentations:
  - Sudden onset hair loss
  - Round or oval patches of complete hair loss
  - Smooth scalp without scarring or scaling
  - Exclamation point hairs at margins
  - May affect scalp, beard, eyebrows, eyelashes, body hair
  - Nail pitting (20% of cases)
urgency: routine
referrals:
  emergency:
    - None typically
  urgent:
    - Rapidly progressive or extensive hair loss
    - Severe psychological distress
  routine:
    - Diagnosis confirmation
    - Treatment options
    - Refractory cases

workup:
  - Clinical diagnosis based on characteristic appearance
  - History
  - Onset - sudden, noticed over days to weeks
  - Pattern - patchy vs diffuse, single vs multiple patches
  - Progression - stable vs expanding
  - Duration - weeks to months
  - Associated symptoms - usually asymptomatic, occasionally pruritus or tingling before hair loss
  - Triggers - none identified usually, occasionally after stressful event or illness
  - Personal history - other autoimmune diseases (vitiligo, thyroid disease, type 1 diabetes)
  - Family history - alopecia areata, autoimmune disease (30% have family history)
  - Medications - rarely drug-induced (distinguish from telogen effluvium, anagen effluvium)
  - Physical examination
  - Scalp - one or more well-demarcated round or oval patches of complete hair loss
  - Smooth scalp, no scarring, no scaling, no erythema (key - distinguishes from tinea capitis, lupus)
  - Exclamation point hairs - short broken hairs (3-4 mm) wider at distal end, narrow at scalp, at periphery of patch (pathognomonic sign of active disease)
  - Hair pull test - gently pull 50-60 hairs, normally fewer than 3 come out
  - Positive (more than 6 hairs) at margins of patch indicates active disease
  - Negative in center of patch (no hairs to pull)
  - Examine other body hair - eyebrows, eyelashes, beard, body hair (may be affected)
  - Nail examination - pitting (most common nail change, 20%), trachyonychia (rough nails), onycholysis
  - Patterns and severity
  - Patchy alopecia areata (most common) - one to few patches, scalp most common
  - Alopecia totalis - complete loss of scalp hair
  - Alopecia universalis - loss of all body hair (scalp, eyebrows, eyelashes, body)
  - Ophiasis pattern - band-like hair loss along temporal and occipital margins (worse prognosis)
  - Diffuse alopecia areata - sudden diffuse thinning without discrete patches (rare)
  - Laboratory studies - rule out associated conditions
  - Not required for diagnosis but reasonable to check
  - Thyroid function tests (TSH, free T4) - thyroid disease associated (8-28%)
  - Complete blood count - rule out anemia
  - ANA (antinuclear antibody) - if concern for lupus
  - Vitamin D, ferritin, zinc - if deficiency suspected
  - Skin biopsy - rarely needed
  - If diagnosis uncertain, atypical features, or scarring suspected
  - Shows peribulbar lymphocytic infiltrate ("swarm of bees"), miniaturized follicles, increased telogen hairs
  - Dermoscopy (trichoscopy) - aids diagnosis
  - Yellow dots (dilated follicular openings with keratin and sebum)
  - Black dots (broken hairs at scalp surface)
  - Short vellus hairs, exclamation point hairs
  - Prognosis
  - Variable and unpredictable
  - Spontaneous regrowth common (50% within 1 year, 80% eventually) for limited patchy disease
  - New patches may develop while old patches regrow
  - Poor prognostic factors - young age at onset, extensive disease (greater than 50% scalp), alopecia totalis/universalis, ophiasis pattern, nail changes, atopy, family history, long duration
  - Better prognosis - adult onset, limited patches, no family history
  - Recurrence common (30-50% have multiple episodes)
treatment:
  - Observation - reasonable for limited patchy disease, especially if first episode
  - 50% spontaneous regrowth within 1 year without treatment
  - Patient education and counseling about variable course, treatment limitations
  - Topical corticosteroids - first-line for limited patchy disease
  - Potent (clobetasol 0.05%) or super-potent (clobetasol 0.05% foam or ointment) applied daily or twice daily
  - Apply to patches and 1 cm beyond
  - May see regrowth in 3-6 months if effective
  - Long-term use risks - skin atrophy, telangiectasias
  - Intralesional corticosteroid injections - most effective treatment for limited patches
  - Triamcinolone acetonide 5-10 mg/mL injected into dermis at affected areas
  - Multiple injections (1 cm apart) to cover patch
  - Repeat monthly until regrowth or 6 months
  - Response rate 60-70% for patches
  - Side effects - temporary pain, skin atrophy, depigmentation at injection sites
  - Most effective for small to moderate patches (less than 50% scalp)
  - Topical immunotherapy - for extensive or refractory disease (greater than 50% scalp)
  - Contact sensitizers - diphencyprone (DPCP) or squaric acid dibutylester (SADBE)
  - Induce allergic contact dermatitis to stimulate immune response
  - Requires sensitization phase then weekly applications at increasing concentrations
  - Response rate 40-60% for extensive disease
  - Requires experienced provider, not widely available
  - Side effects - severe dermatitis, cervical lymphadenopathy, autosensitization
  - Topical minoxidil - adjunctive therapy
  - 5% minoxidil foam or solution twice daily to affected areas
  - May enhance regrowth when combined with corticosteroids
  - Weak evidence for monotherapy
  - Takes 3-6 months to see effect
  - Systemic corticosteroids - for rapidly progressive or extensive disease
  - Prednisone 40-60 mg daily x 4-6 weeks, then taper
  - Or pulse therapy - high-dose IV methylprednisolone
  - May halt progression, induce regrowth
  - Not sustainable long-term due to side effects
  - High recurrence rate after discontinuation
  - Reserved for rapidly progressive cases
  - JAK inhibitors (Janus kinase inhibitors) - emerging therapy for extensive/severe disease
  - Oral tofacitinib, ruxolitinib, baricitinib
  - Target immune pathway involved in alopecia areata
  - Studies show 40-50% response in alopecia totalis/universalis
  - Expensive, require monitoring (infections, labs)
  - Not FDA approved for alopecia areata yet (off-label use), under investigation
  - Ruxolitinib topical - in development
  - Other systemic agents - limited efficacy
  - Methotrexate, cyclosporine, azathioprine - weak evidence, not recommended
  - Anthralin (dithranol) - topical irritant, limited efficacy
  - Phototherapy (PUVA) - limited efficacy, not recommended
  - Camouflage and support
  - Wigs, hair pieces, scalp tattoos (micropigmentation)
  - Eyebrow pencils, false eyelashes
  - Support groups - National Alopecia Areata Foundation
  - Psychological support - can be psychologically devastating, especially extensive disease
  - No treatment universally effective - realistic expectations
clinical_pearls:
  - Autoimmune condition - T-cell mediated attack on hair follicles
  - Non-scarring hair loss - follicles preserved, capable of regrowth
  - Exclamation point hairs pathognomonic - short broken hairs wider at distal end
  - Smooth scalp without scaling or erythema (distinguishes from tinea capitis, lupus)
  - Spontaneous regrowth common for limited disease (50% within 1 year)
  - Prognosis variable - cannot predict, some regrow completely, others progress to totalis/universalis
  - Intralesional corticosteroids most effective for limited patches (60-70% response)
  - Topical immunotherapy (DPCP) for extensive disease (40-60% response)
  - JAK inhibitors promising for severe disease but expensive, not yet FDA approved
  - Associated with other autoimmune diseases - thyroid disease (8-28%), vitiligo, type 1 diabetes
  - Nail changes (pitting) in 20%, sign of more extensive disease
  - Poor prognosis - young age at onset, extensive disease, ophiasis pattern, atopy, family history
  - No cure - treatment promotes regrowth but does not prevent recurrence
  - Psychological impact significant - support and counseling important
differentials:
  - Tinea capitis (scalp ringworm) - scaling, broken hairs at different lengths (not complete hair loss), KOH positive, more common in children
  - Trichotillomania (hair pulling disorder) - irregular patches, hairs of varying lengths, often bizarre pattern, psychological disorder
  - Traction alopecia - hair loss from tension (tight hairstyles), at margins (frontal, temporal), scarring if chronic
  - Telogen effluvium - diffuse hair thinning (not patches), follows stressor (illness, medications, childbirth), positive hair pull test throughout scalp
  - Androgenetic alopecia (pattern baldness) - gradual thinning, follows male or female pattern, miniaturized hairs
  - Discoid lupus - scarring alopecia, erythema, scaling, dyspigmentation, atrophy, positive ANA
  - Secondary syphilis - "moth-eaten" pattern, patchy non-scarring, other symptoms (rash, lymphadenopathy), positive serology
trace:
  - 28-year-old woman presents with sudden hair loss on scalp noticed 2 months ago
  - First noticed when brushing hair, saw smooth bald patch on right side of scalp
  - No itching, no pain, no burning
  - Coworker pointed out another patch on back of head last week
  - Causing significant distress, worried about losing all hair
  - No recent illness, no new medications, no known triggers
  - No personal history of thyroid disease or autoimmune disease
  - Mother had similar hair loss in 30s that regrew after several months
  - Physical examination - two well-demarcated round patches of complete hair loss on right parietal scalp (3 cm) and occipital scalp (2 cm)
  - Smooth scalp without scaling, erythema, or scarring
  - Exclamation point hairs (short broken hairs 3-4 mm, tapered at base) at margins of both patches
  - Hair pull test positive at margins (8 hairs), negative in normal scalp areas (2 hairs)
  - Eyebrows, eyelashes intact
  - Nails show mild pitting on several fingernails
  - No other body hair loss
  - Laboratory tests - TSH 2.1 mIU/L (normal), CBC normal
  - Diagnosis - Alopecia areata, patchy type, two patches, active disease (exclamation point hairs, positive pull test)
  - Treatment plan
  - Given limited disease (2 patches, less than 10% scalp), offered observation vs treatment
  - Patient desires treatment due to distress
  - Intralesional triamcinolone 5 mg/mL injections to both patches, multiple injection sites 1 cm apart to cover patches
  - Topical clobetasol 0.05% foam once daily to patches and 1 cm beyond
  - Minoxidil 5% foam twice daily to affected areas (adjunctive)
  - Discussed prognosis - uncertain, may spontaneously regrow, new patches may develop, cannot predict
  - Reassurance that follicles not destroyed, regrowth possible
  - Provided National Alopecia Areata Foundation resources
  - Follow-up in 1 month for repeat injections
  - At 1 month - no new patches, existing patches stable in size
  - Repeat intralesional injections
  - At 3 months - fine vellus hair regrowth visible in both patches (encouraging)
  - Repeat injections third time
  - Continues topical clobetasol and minoxidil
  - At 6 months - significant terminal hair regrowth in both patches, approximately 70% coverage
  - Tapered clobetasol to every other day then discontinue
  - Continues minoxidil
  - At 9 months - complete regrowth, patches no longer visible, normal hair density
  - Discontinued minoxidil
  - Counseled that recurrence possible (30-50%), monitor for new patches

citations:
  - AAD (American Academy of Dermatology) Guidelines for Alopecia Areata
  - British Association of Dermatologists Guidelines
  - UpToDate - Dermatology
