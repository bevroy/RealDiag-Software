tree_id: CARDS-MITRAL-REGURGITATION
name: Mitral Regurgitation
family: Cardiology
specialty: Cardiology
chief_complaint: Dyspnea with holosystolic murmur radiating to axilla
description: Backward flow of blood from LV to LA during systole causing volume overload. Acute MR (from papillary muscle rupture, chordae rupture, endocarditis) presents with pulmonary edema and cardiogenic shock. Chronic MR is primary (degenerative, prolapse) or secondary (functional from LV dilation). Severe MR defined by echo criteria. Surgery indicated if symptomatic or asymptomatic with EF under 60% or LV dilation. MitraClip option for high surgical risk.
icd10: I34.0
snomed: 48724000
urgency: urgent

workup:
  - Clinical presentation:
  - Acute severe MR (medical emergency):
  - Sudden dyspnea, pulmonary edema, hypotension, cardiogenic shock
  - From papillary muscle rupture post-MI, chordae rupture, endocarditis
  - Cannot compensate, rapid decompensation
  - Chronic MR (gradual onset):
  - Asymptomatic for years (LV compensation)
  - Dyspnea on exertion (late symptom when LV dysfunction develops)
  - Fatigue, exercise intolerance
  - Palpitations if AFib (dilated LA)
  - Etiology:
  - Primary MR (valve leaflet or chordae abnormality):
  - Degenerative (most common): mitral valve prolapse, myxomatous degeneration, chordae rupture
  - Endocarditis
  - Rheumatic heart disease
  - Secondary (functional) MR (normal valve with LV dilation):
  - Ischemic (papillary muscle dysfunction or rupture from MI)
  - Dilated cardiomyopathy (LV dilation prevents leaflet coaptation)
  - Physical exam:
  - Holosystolic murmur at apex radiating to axilla (classic)
  - Intensity correlates poorly with severity
  - Acute severe MR may have soft murmur (LA not dilated, rapid equalization of pressures)
  - Hyperdynamic apical impulse (volume overload)
  - S3 gallop if volume overload or LV dysfunction
  - Laterally displaced PMI if chronic MR with LV dilation
  - Mid-systolic click if mitral valve prolapse
  - Imaging:
  - Echocardiogram (diagnostic):
  - Severity grading:
  - Mild MR (vena contracta under 0.3 cm, regurgitant volume under 30 mL, regurgitant fraction under 30%)
  - Moderate MR (vena contracta 0.3-0.7 cm, regurgitant volume 30-59 mL, regurgitant fraction 30-49%)
  - Severe MR (vena contracta over 0.7 cm, regurgitant volume over 60 mL, regurgitant fraction over 50%, ERO over 0.4 cm²)
  - Mechanism (primary vs secondary, flail leaflet, prolapse, restriction)
  - LV size (LVESD and LVEDD)
  - EF assessment (lower threshold for surgery in MR, EF under 60% is abnormal)
  - LA size (often dilated)
  - PA pressure (assess pulmonary hypertension)
  - TEE (detailed valve anatomy, surgical planning)
  - Chest X-ray (cardiomegaly, LA enlargement, pulmonary edema if acute)
  - ECG (LA enlargement, LV hypertrophy, AFib common)

treatment:
  - Acute severe MR (emergency):
  - Medical stabilization (ICU):
  - Vasodilators (nitroprusside) to reduce afterload and regurgitant fraction
  - Inotropes (dobutamine) if hypotension
  - IABP for hemodynamic support (reduces afterload)
  - Diuretics for pulmonary edema
  - Emergent surgery (mitral valve repair or replacement)
  - Chronic MR medical management:
  - Vasodilators (ACE inhibitor or ARB):
  - If hypertensive or symptomatic
  - Reduce afterload and regurgitant volume
  - No proven benefit if normotensive and asymptomatic
  - Diuretics if congestion
  - Beta blocker if HFrEF (secondary MR)
  - Rate control if AFib
  - Anticoagulation if AFib
  - Serial monitoring if asymptomatic:
  - Severe MR with normal EF and LV size every 6 months
  - Moderate MR annually
  - Mild MR every 2-3 years
  - Surgery indications:
  - Symptomatic severe primary MR (class I indication)
  - Asymptomatic severe primary MR with EF 30-60% (abnormal for MR)
  - Asymptomatic severe primary MR with LV dilation (LVESD over 40 mm)
  - Asymptomatic severe primary MR with new-onset AFib or pulmonary hypertension (PA pressure over 50 mmHg)
  - Severe primary MR undergoing other cardiac surgery
  - Secondary MR:
  - Surgery if undergoing CABG and severe MR
  - Consider if severe MR despite optimal medical therapy for HF
  - Surgical options:
  - Mitral valve repair (preferred for primary MR, better outcomes than replacement):
  - Chordal repair or replacement
  - Leaflet resection
  - Annuloplasty ring
  - Repair success rate over 95% for degenerative MR in experienced centers
  - Mitral valve replacement (if repair not feasible):
  - Mechanical or bioprosthetic valve
  - Preserve chordae if possible (maintains LV function)
  - Transcatheter options (for high surgical risk):
  - MitraClip (percutaneous edge-to-edge repair):
  - Clip leaflets together to reduce MR
  - For high or prohibitive surgical risk with symptomatic severe MR
  - Reduces MR to mild-moderate in most cases
  - Post-operative management:
  - Anticoagulation if mechanical valve (warfarin INR 2.5-3.5 for mitral position)
  - Antiplatelet if bioprosthetic valve or repair (aspirin 81 mg)
  - Serial echo to assess repair durability or prosthetic valve function

clinical_pearls:
  - Acute severe MR is medical emergency requiring emergent surgery
  - Chronic MR often asymptomatic until LV dysfunction develops
  - Holosystolic murmur at apex radiating to axilla classic finding
  - Severe MR criteria include vena contracta over 0.7 cm, regurgitant volume over 60 mL
  - Surgery indicated if symptomatic, EF under 60% (abnormal for MR), or LVESD over 40 mm
  - Mitral valve repair preferred over replacement for primary MR (better outcomes)
  - MitraClip option for high surgical risk patients
  - Lower EF threshold for surgery in MR (under 60% is abnormal due to unloading into LA)

differentials:
  - Aortic stenosis (systolic ejection murmur at right upper sternal border)
  - Tricuspid regurgitation (holosystolic murmur at left lower sternal border, increases with inspiration)
  - VSD (holosystolic murmur but with thrill at left sternal border)
  - Aortic regurgitation (diastolic murmur)

trace: |
  A 68-year-old man with history of mitral valve prolapse (known for 20 years, previously asymptomatic) presented with 6 months progressive dyspnea on exertion. Now dyspneic climbing one flight of stairs (NYHA class II). No orthopnea or edema. Exam: BP 130/80, irregularly irregular rhythm (new-onset atrial fibrillation from LA enlargement), holosystolic murmur grade 4/6 at apex radiating to axilla (loud regurgitant murmur), mid-systolic click (mitral valve prolapse), hyperdynamic apical impulse (volume overload), laterally displaced PMI (LV dilation), S3 gallop (volume overload). ECG: atrial fibrillation, LA enlargement. Chest X-ray: cardiomegaly (LV and LA enlargement). Echocardiogram: mitral valve prolapse with flail posterior leaflet (ruptured chordae to P2 scallop), severe mitral regurgitation (vena contracta 0.9 cm - over 0.7 is severe, regurgitant volume 75 mL - over 60 is severe, regurgitant fraction 62% - over 50% is severe, ERO 0.55 cm² - over 0.4 is severe), large eccentric jet directed anteriorly (flail posterior leaflet), LV dilation with LVEDD 62 mm (normal under 55 mm) and LVESD 42 mm (normal under 35 mm, over 40 mm is surgical indication), EF 58% (borderline low for MR - under 60% is abnormal in MR due to unloading into LA), severely enlarged LA (5.8 cm), PA pressure 55 mmHg (pulmonary hypertension from chronic MR). Diagnosed with severe primary mitral regurgitation from degenerative disease (mitral valve prolapse with flail leaflet from chordae rupture). Multiple surgical indications: symptomatic (NYHA class II dyspnea) plus LVESD 42 mm (over 40 mm threshold) plus EF 58% (under 60% abnormal for MR) plus new-onset AFib plus pulmonary hypertension. All are class I or class IIa indications for surgery. Referred to cardiac surgery. TEE for surgical planning: confirmed flail P2 scallop with ruptured chordae, severe MR, remainder of valve relatively normal (good for repair). Given primary degenerative MR with flail leaflet, excellent candidate for mitral valve repair (repair preferred over replacement, better long-term outcomes). Started anticoagulation for AFib (heparin bridging to warfarin), metoprolol for rate control. Underwent mitral valve repair: resection of flail P2 segment (quadrangular resection), neochordae placement, posterior leaflet sliding plasty, 32mm annuloplasty ring. Intraoperative TEE post-repair: no residual MR (excellent repair), good leaflet coaptation. Post-operative course uneventful, extubated POD 0. Started warfarin with target INR 2-3 (for AFib, also recommended first 3 months post-repair). Discharge POD 5 on warfarin, metoprolol, aspirin 81 mg x3 months, lisinopril. At 6 weeks: outpatient follow-up, symptoms dramatically improved. Walking without dyspnea, NYHA class I. Exam: no murmur (successful repair), still in AFib but rate controlled 70-80 bpm. Echo: durable repair with no MR (trace only - excellent result), LV size decreased from LVEDD 62 mm to 56 mm (reverse remodeling after eliminating volume overload), LVESD decreased from 42 mm to 36 mm, EF improved from 58% to 64% (improved with normal loading conditions and reverse remodeling). LA size 5.2 cm (decreased from 5.8 cm). PA pressure 40 mmHg (improved from 55 mmHg). At 6 months: continued improvement, LVEDD 54 mm (near normal), EF 65%, PA pressure 35 mmHg. NYHA class I, excellent exercise tolerance. At 1 year: durable repair maintained (no MR), LV completely reverse remodeled to normal size, EF 66%. This case demonstrates severe primary MR from degenerative disease (mitral valve prolapse with flail leaflet) with progression from asymptomatic to symptomatic with LV remodeling and dysfunction (EF 58% abnormal for MR, LVESD 42 mm over threshold). Multiple surgical indications present. Mitral valve repair preferred approach for primary degenerative MR, excellent immediate and long-term results with reverse remodeling and symptom resolution. Repair superior to replacement with better long-term outcomes and LV function preservation.
