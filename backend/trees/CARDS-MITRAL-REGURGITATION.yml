tree_id: CARDS-MITRAL-REGURGITATION
name: Mitral Regurgitation
family: Cardiology
specialty: Cardiology
chief_complaint: Shortness of breath and fatigue
description: Backward flow from LV to LA during systole causing volume overload, classic holosystolic murmur radiating to axilla. Chronic primary MR from degenerative disease or mitral valve prolapse, secondary MR from LV dysfunction. Mitral valve repair preferred over replacement when feasible.
icd10: I34.0
urgency: urgent

workup:
  - Symptoms (late manifestations):
  - Dyspnea: exertional dyspnea, orthopnea, PND (elevated LA pressure causes pulmonary congestion)
  - Fatigue: low forward cardiac output (blood regurgitates backward)
  - Palpitations: atrial fibrillation from LA enlargement (30-50%)
  - Acute MR: sudden onset pulmonary edema, cardiogenic shock (papillary muscle rupture post-MI or chordae rupture)
  - Physical exam:
  - Holosystolic murmur: high-pitched, blowing, best at apex, radiates to axilla (left armpit)
  - Murmur intensity does NOT correlate with severity (severe MR may have soft murmur if very large LA)
  - S3 gallop: volume overload
  - Displaced and hyperdynamic apical impulse: LV dilatation
  - Soft S1: incomplete valve closure
  - Wide splitting S2: early aortic valve closure from reduced forward flow
  - Mitral valve prolapse: mid-systolic click followed by late systolic murmur (click moves with preload changes)
  - Acute MR: soft murmur (non-compliant LA), tachycardia, hypotension, pulmonary edema
  - Classification:
  - Primary (organic) MR: intrinsic valve disease
  - Degenerative: mitral valve prolapse (myxomatous degeneration, most common cause in developed countries), flail leaflet, chordae rupture
  - Rheumatic: leaflet thickening and retraction
  - Endocarditis: valve perforation or vegetation
  - Secondary (functional) MR: structurally normal valve but regurgitation from LV remodeling
  - Ischemic: papillary muscle dysfunction or rupture post-MI, LV dilatation from cardiomyopathy
  - Dilated cardiomyopathy: annular dilatation prevents leaflet coaptation
  - Echocardiogram (diagnostic):
  - Visualize regurgitant jet: color Doppler shows backflow from LV to LA
  - Severity grading: vena contracta width, regurgitant volume, regurgitant fraction, EROA (effective regurgitant orifice area)
  - Severe MR: vena contracta over 0.7 cm, regurgitant volume over 60 mL, regurgitant fraction over 50%, EROA over 0.4 cm²
  - LV size and function: end-systolic dimension (ESD over 40 mm threshold), EF (over 60% compensated, below 60% suggests dysfunction)
  - LA size: enlargement from chronic volume overload
  - Pulmonary hypertension: elevated PA systolic pressure
  - Mechanism: flail leaflet, prolapse, restricted motion, annular dilatation
  - TEE: better visualization of valve anatomy, guide surgical repair

treatment:
  - Chronic primary MR medical management (asymptomatic):
  - No proven medications to delay progression
  - ACE inhibitors or ARBs: if hypertension or LV dysfunction, NOT routine
  - Diuretics: if volume overload symptoms
  - Vasodilators: reduce afterload, decrease regurgitant volume
  - Atrial fibrillation: rate control, anticoagulation
  - Serial echocardiograms: monitor LV size and function every 6-12 months
  - Mitral valve surgery (definitive treatment):
  - Indications: symptomatic severe primary MR, asymptomatic with LV dysfunction (EF below 60% or ESD over 40 mm), asymptomatic with AFib or pulmonary hypertension (PASP over 50 mmHg)
  - Mitral valve repair (preferred over replacement):
  - Quadrangular resection, chordae transfer, annuloplasty ring
  - Preserves LV function, no anticoagulation needed (except AFib), lower operative mortality
  - 90% success rate for degenerative MR (prolapse, flail)
  - Durability: 10-year freedom from reoperation 90%
  - Mitral valve replacement:
  - If repair not feasible (rheumatic, heavily calcified, extensive destruction)
  - Mechanical valve: lifelong warfarin
  - Bioprosthetic valve: no anticoagulation (aspirin only), degenerates 10-15 years
  - Operate BEFORE EF drops below 60% or ESD exceeds 40 mm (irreversible LV dysfunction if delayed)
  - Transcatheter edge-to-edge repair (MitraClip):
  - Percutaneous clip approximates leaflets (Alfieri stitch)
  - For high surgical risk patients with severe primary or secondary MR
  - Less invasive than surgery but less durable
  - Secondary MR treatment:
  - Optimize heart failure therapy: ACE inhibitors, beta blockers, diuretics, CRT if indicated
  - Many improve with medical therapy alone
  - Surgery controversial: valve repair vs replacement if severe MR persists despite optimal medical therapy
  - Acute MR (medical emergency):
  - Cardiogenic shock: vasodilators (nitroprusside), inotropes (dobutamine), IABP
  - Emergent surgical repair or replacement: only definitive treatment

clinical_pearls:
  - Holosystolic murmur radiating to axilla classic for MR
  - Mitral valve prolapse most common cause in developed countries (mid-systolic click and late systolic murmur)
  - Severe MR: vena contracta over 0.7 cm, regurgitant volume over 60 mL, EROA over 0.4 cm²
  - Mitral valve repair preferred over replacement (preserves LV function, no anticoagulation)
  - Operate BEFORE EF drops below 60% or ESD exceeds 40 mm
  - Secondary MR often improves with optimal heart failure therapy
  - Acute MR from papillary muscle rupture post-MI is surgical emergency
  - S3 gallop from volume overload

differentials:
  - Aortic stenosis: systolic murmur at right upper sternal border radiating to carotids, not axilla
  - Tricuspid regurgitation: holosystolic at left lower sternal border, increases with inspiration
  - Ventricular septal defect: holosystolic at left sternal border with thrill, not radiating to axilla
  - Hypertrophic cardiomyopathy: systolic murmur increases with Valsalva

trace: |
  A 65-year-old man presented with 6 months of progressive dyspnea on exertion and fatigue. Previously very active, now short of breath after walking 1 block. No chest pain. Exam: BP 135/80, HR 88 irregularly irregular (atrial fibrillation), holosystolic 3/6 murmur at apex radiating to left axilla, S3 gallop, apical impulse displaced to anterior axillary line (LV dilatation), bibasilar rales. ECG: atrial fibrillation. Echocardiogram: severe mitral regurgitation from flail posterior mitral leaflet (ruptured chordae), vena contracta 0.9 cm (severe over 0.7), regurgitant volume 85 mL (severe over 60), EROA 0.55 cm² (severe over 0.4), eccentric posteriorly directed jet, LV dilated with end-diastolic dimension 68 mm, end-systolic dimension 42 mm (surgical threshold 40 mm), EF 58% (below normal 60% threshold - early dysfunction), LA severely enlarged 5.8 cm, pulmonary hypertension PASP 52 mmHg. Diagnosed with severe symptomatic primary mitral regurgitation from degenerative disease (flail leaflet from ruptured chordae) with multiple surgical indications: symptomatic, EF 58% below 60%, ESD 42 mm over 40 mm, AFib, pulmonary hypertension. TEE: confirmed flail P2 scallop of posterior leaflet, ruptured chordae, otherwise good tissue quality (favorable for repair). Cardiothoracic surgery consultation: excellent candidate for mitral valve repair (degenerative MR with flail leaflet, repair success 90%). Coronary angiography: normal coronaries. Underwent mitral valve repair: quadrangular resection of flail P2 segment, chordae reconstruction, 32 mm annuloplasty ring. Intraoperative TEE: successful repair, trivial residual MR, no systolic anterior motion (SAM). Post-operative course uncomplicated. Started warfarin for AFib (not for repaired valve). At 2 weeks echo: trace MR (successful repair), LV size decreased EDD 62 mm (reverse remodeling starting), EF 60%, LA decreased. At 3 months dramatic improvement: no dyspnea, back to full activities. Echo: LV size continued improvement EDD 58 mm ESD 38 mm, EF 62% (normalized), trace MR stable. At 1 year: excellent functional status, LV dimensions normalized, EF 65%, trace MR. Mitral valve repair successful, 10-year freedom from reoperation 90%. Annual echo monitoring. Continues warfarin for AFib.
