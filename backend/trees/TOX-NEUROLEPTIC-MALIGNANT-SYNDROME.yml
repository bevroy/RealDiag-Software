referrals:
  emergency:
    - Altered mental status from toxin
    - Severe poisoning
    - Drug overdose with respiratory depression
    - Serotonin syndrome
  urgent:
    - Toxic ingestion without symptoms
    - Suspected toxic exposure
    - Drug overdose stable
  routine:
    - Substance use disorder treatment
    - Chronic exposure evaluation
    - Lead screening
differentials:
  - Serotonin syndrome
  - Malignant hyperthermia
  - Meningitis
  - Sepsis
  - Heat stroke
