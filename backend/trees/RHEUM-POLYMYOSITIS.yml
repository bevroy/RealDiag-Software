tree_id: RHEUM-POLYMYOSITIS
name: Polymyositis
family: musculoskeletal
specialty: Rheumatology
chief_complaint: Progressive proximal muscle weakness
description: Autoimmune inflammatory myopathy causing symmetric proximal muscle weakness
icd10: M33.20
urgency: routine-to-urgent
workup:
  - Clinical presentation - symmetric proximal muscle weakness developing over weeks to months
  - Difficulty rising from chair, climbing stairs, lifting arms overhead, combing hair
  - Difficulty swallowing (dysphagia) in 40-60%
  - No muscle pain or tenderness (distinguishes from polymyalgia rheumatica)
  - No skin manifestations (distinguishes from dermatomyositis)
  - Constitutional symptoms - fatigue, weight loss, fever (30-50%)
  - Extramuscular manifestations - ILD (interstitial lung disease 10-40%), cardiac involvement (arrhythmias, myocarditis)
  - Physical examination
  - Proximal muscle weakness - shoulder abduction, hip flexion
  - Grade muscle strength 0-5 scale (typically 3-4 in affected muscles)
  - Distal strength preserved initially
  - Reflexes preserved or decreased
  - No fasciculations (distinguishes from ALS)
  - Laboratory studies
  - Creatine kinase (CK) markedly elevated (often 10-50x normal, can be greater than 10,000 U/L)
  - Aldolase elevated (correlates with CK)
  - Transaminases (AST/ALT) elevated (released from muscle, not liver)
  - LDH elevated
  - Myoglobin in serum and urine (rhabdomyolysis if severe)
  - ESR and CRP variably elevated
  - Myositis-specific antibodies (MSA) - help with diagnosis and prognosis
  - Anti-Jo-1 (most common antisynthetase antibody) - associated with ILD, arthritis, Raynaud, mechanic's hands
  - Anti-SRP (signal recognition particle) - severe myositis, cardiac involvement
  - Anti-Mi-2 - good prognosis
  - ANA often positive (50-80%)
  - Electromyography (EMG) - classic triad
  - Small amplitude, short duration polyphasic motor potentials
  - Fibrillation potentials and positive sharp waves at rest
  - Bizarre high-frequency repetitive discharges
  - MRI muscle (T2-weighted or STIR sequences) - shows muscle edema, inflammation
  - Useful to identify best site for biopsy
  - Muscle biopsy - gold standard for diagnosis
  - Endomysial inflammatory infiltrate (CD8+ T cells)
  - Muscle fiber necrosis and regeneration
  - No perifascicular atrophy (seen in dermatomyositis)
  - Screening for complications
  - Chest CT or HRCT - screen for interstitial lung disease
  - PFTs with DLCO if ILD suspected
  - ECG and echocardiogram - cardiac involvement
  - Cancer screening - increased risk of malignancy (especially if older, anti-TIF1-gamma antibody)
treatment:
  - Corticosteroids - first-line treatment
  - Prednisone 1 mg/kg/day (60-80 mg daily) for 4-6 weeks
  - Expect clinical improvement in 2-4 weeks, CK normalization in 6-12 weeks
  - Once strength improves and CK normalizes, begin slow taper over 6-12 months
  - Taper by 10-20% every 2-4 weeks
  - Monitor CK and strength at each visit
  - Steroid-sparing immunosuppressive agents - start early (with or shortly after steroids)
  - Methotrexate 15-25 mg weekly (most commonly used)
  - Azathioprine 2-3 mg/kg/day (150-200 mg)
  - Mycophenolate mofetil 2-3 g daily in divided doses
  - Goal to reduce steroid exposure and improve long-term outcomes
  - Biologic agents for refractory disease
  - Intravenous immunoglobulin (IVIG) 2 g/kg monthly - very effective
  - Rituximab 1000 mg IV at 0 and 2 weeks (anti-CD20) - for refractory cases
  - Physical therapy - start early to prevent contractures
  - Active ROM exercises initially, progressive resistance training as strength improves
  - Treatment of ILD if present
  - Mycophenolate or cyclophosphamide plus corticosteroids
  - Supportive care
  - Bone protection with calcium, vitamin D, bisphosphonates (prolonged steroid use)
  - PPI for GI protection
  - Physical and occupational therapy
  - Swallowing evaluation if dysphagia
  - Monitor for disease-associated malignancy
  - Age-appropriate cancer screening
  - Enhanced screening if anti-TIF1-gamma positive (breast, ovarian, lung, GI)
clinical_pearls:
  - Rare disease, incidence 1-10 per million, female-to-male ratio 2:1, peak age 30-50 years
  - Part of idiopathic inflammatory myopathy spectrum - polymyositis, dermatomyositis, inclusion body myositis
  - True polymyositis (without skin involvement) is rarer than previously thought - many cases are dermatomyositis sine dermatitis
  - Antisynthetase syndrome (20% of myositis) - myositis, ILD, arthritis, Raynaud, fever, mechanic's hands
  - Anti-Jo-1 most common antisynthetase antibody
  - Cancer-associated myositis (15-30%) - especially ovarian, lung, gastric, colorectal, lymphoma
  - Risk highest in older patients, dermatomyositis greater than polymyositis
  - CK elevation proportional to disease activity - useful for monitoring
  - Prognosis generally good with treatment - 5-year survival 75-90%
  - Poor prognostic factors - older age, malignancy, cardiac involvement, severe dysphagia, ILD
differentials:
  - Dermatomyositis (gottron papules, heliotrope rash, shawl sign, V-sign on chest)
  - Inclusion body myositis (older patients, asymmetric, distal weakness, quadriceps and finger flexors, refractory to steroids)
  - Muscular dystrophy (genetic, family history, slowly progressive since childhood, elevated CK)
  - Drug-induced myopathy (statins, steroids, colchicine - temporal relationship)
  - Hypothyroid myopathy (elevated TSH, responds to thyroid replacement)
  - Polymyalgia rheumatica (older age, pain more than weakness, normal CK, dramatic steroid response)
  - Motor neuron disease (ALS - fasciculations, upper and lower motor neuron signs, normal CK)
  - Myasthenia gravis (fatigable weakness, ocular involvement, positive acetylcholine receptor antibody)
  - Rhabdomyolysis (acute onset, myoglobinuria, renal failure, CK greater than 10,000)
trace:
  - 45-year-old woman presents with 3-month history of progressive weakness
  - Difficulty getting up from sitting position, needs to use arms to push off
  - Difficulty climbing stairs, cannot lift grocery bags
  - Difficulty raising arms to wash hair or reach overhead cabinets
  - Difficulty swallowing solid foods, needs to drink water with meals
  - Fatigue, 10-pound unintentional weight loss
  - No muscle pain, no rashes, no joint pain
  - No fevers, no cough, no dyspnea
  - Past medical history - none
  - Medications - none
  - Family history - no muscle diseases
  - Physical exam - appears fatigued but in no distress
  - Vitals - normal
  - Skin - no rashes, no gottron papules, no heliotrope rash
  - Musculoskeletal exam - muscle strength testing
  - Shoulder abduction 3/5 bilaterally (can raise against gravity but not resistance)
  - Hip flexion 3/5 bilaterally
  - Distal strength (hand grip, ankle dorsiflexion) 5/5 normal
  - Reflexes 2+ symmetric
  - No fasciculations, no muscle atrophy
  - Cardiovascular and respiratory exam normal
  - Labs - CK 8500 U/L (markedly elevated, normal less than 200)
  - Aldolase 95 U/L (elevated, normal less than 8)
  - AST 250 U/L, ALT 180 U/L (elevated from muscle)
  - LDH 650 U/L (elevated)
  - ESR 45 mm/hr (elevated), CRP 15 mg/L (elevated)
  - Creatinine 1.0 mg/dL (normal), no myoglobinuria
  - ANA positive 1:640 (homogeneous pattern)
  - Myositis panel - Anti-Jo-1 antibody positive (antisynthetase antibody)
  - RF negative, anti-CCP negative
  - TSH normal
  - EMG - small amplitude polyphasic potentials, fibrillations, positive sharp waves (consistent with myositis)
  - MRI thigh muscles - diffuse bilateral symmetric hyperintensity on STIR sequences (muscle edema/inflammation)
  - Muscle biopsy (left vastus lateralis) - endomysial inflammatory infiltrate with CD8+ T cells, muscle fiber necrosis and regeneration, no perifascicular atrophy
  - Diagnosis - Polymyositis with antisynthetase syndrome (anti-Jo-1 positive)
  - Chest CT ordered given anti-Jo-1 positivity (high risk ILD)
  - CT chest - mild ground-glass opacities bilateral lower lobes consistent with early ILD
  - PFTs - mild restrictive pattern, DLCO 65% predicted
  - ECG and echocardiogram - normal
  - Age-appropriate cancer screening - up to date, no evidence malignancy
  - Treatment initiated
  - Prednisone 60 mg daily (1 mg/kg)
  - Methotrexate 20 mg weekly (steroid-sparing agent)
  - Folic acid 1 mg daily
  - Physical therapy referral
  - Calcium 1200 mg daily, vitamin D 1000 IU daily, alendronate 70 mg weekly (bone protection)
  - Omeprazole 20 mg daily
  - 4-week follow-up - noticeable improvement in strength
  - Can now rise from chair without using arms, climbing stairs easier
  - Swallowing improved
  - CK decreased to 2400 U/L (significant drop but still elevated)
  - Continue prednisone 60 mg daily, methotrexate
  - 3-month follow-up - continued improvement
  - Strength nearly back to baseline, performing most daily activities
  - CK 450 U/L (near normal)
  - Begin prednisone taper - decreased to 50 mg daily
  - Continue methotrexate
  - 6-month follow-up - strength normal (5/5 all muscle groups)
  - CK 180 U/L (normal)
  - Prednisone tapered to 15 mg daily
  - Repeat chest CT - stable ground-glass opacities, no progression of ILD
  - Continue slow prednisone taper with goal 5-7.5 mg daily maintenance
  - Continue methotrexate long-term
  - 1-year follow-up - in remission, prednisone 7.5 mg daily, methotrexate 20 mg weekly
  - Strength maintained, CK normal, ILD stable
  - Outcome - Excellent response to treatment, achieved remission
