tree_id: NEPHRO-HYPERKALEMIA
name: Hyperkalemia
family: Nephrology
specialty: Nephrology
chief_complaint: Elevated serum potassium, often asymptomatic or with cardiac arrhythmias
description: Serum potassium over 5.5 mEq/L, life-threatening condition that can cause fatal cardiac arrhythmias. Most commonly caused by chronic kidney disease, medications (ACE inhibitors, ARBs, NSAIDs, potassium-sparing diuretics), or increased potassium intake. ECG changes include peaked T waves, widened QRS, loss of P waves, and sine wave pattern progressing to ventricular fibrillation. Severity includes mild (5.5-5.9), moderate (6.0-6.4), severe (over 6.5 mEq/L). Treatment based on severity and ECG changes includes calcium for cardiac membrane stabilization, insulin with glucose and beta-agonists to shift potassium into cells, diuretics and cation exchange resins for removal, dialysis if refractory. Address underlying cause and discontinue offending medications.
icd10: E87.5
urgency: emergent

workup:
  - Clinical presentation (often asymptomatic until severe):
    - Cardiac symptoms (most concerning):
      - Palpitations or irregular heartbeat
      - Chest pain or discomfort
      - Cardiac arrest (ventricular fibrillation or asystole)
      - Sudden death
    - Neuromuscular symptoms:
      - Muscle weakness (ascending, similar to Guillain-Barré)
      - Paresthesias (tingling, numbness)
      - Paralysis (if severe, over 7 mEq/L)
      - Respiratory muscle weakness (life-threatening)
    - Gastrointestinal symptoms:
      - Nausea
      - Vomiting
      - Abdominal cramping
      - Diarrhea
    - Most patients are asymptomatic even with severe hyperkalemia
  - Causes of hyperkalemia (assess for underlying etiology):
    - Impaired renal excretion (most common overall cause):
      - Chronic kidney disease (GFR under 30, stage 4-5 CKD)
      - Acute kidney injury
      - Type 4 renal tubular acidosis (hyporeninemic hypoaldosteronism)
      - Addison disease (adrenal insufficiency)
      - Medications impairing renal excretion (see below)
    - Transcellular shift (potassium moves from intracellular to extracellular):
      - Metabolic acidosis (DKA, lactic acidosis, RTA)
      - Insulin deficiency (DKA)
      - Tissue breakdown (rhabdomyolysis, tumor lysis syndrome, massive hemolysis)
      - Beta-blocker toxicity (blocks cellular uptake)
      - Digoxin toxicity (inhibits Na-K-ATPase pump)
      - Hyperkalemic periodic paralysis (rare genetic disorder)
      - Succinylcholine administration (depolarizing paralytic)
      - Massive blood transfusion (stored blood releases potassium)
    - Increased intake (rarely sole cause unless impaired excretion):
      - Potassium supplements or salt substitutes
      - High-potassium diet (bananas, oranges, tomatoes, potatoes, spinach)
      - Parenteral nutrition with high potassium content
    - Pseudohyperkalemia (falsely elevated, no treatment needed):
      - Hemolysis of blood sample (most common)
      - Prolonged tourniquet time or fist clenching during draw
      - Thrombocytosis (over 1 million platelets release K+ after clot formation)
      - Leukocytosis (over 100k WBC release K+)
      - Repeat sample if suspected (draw carefully without tourniquet)
  - Medication causes (very common, often multiple medications):
    - RAAS inhibitors (block aldosterone, impair renal excretion):
      - ACE inhibitors (lisinopril, enalapril, ramipril)
      - ARBs (losartan, valsartan, irbesartan)
      - Direct renin inhibitors (aliskiren)
      - Aldosterone antagonists (spironolactone, eplerenone)
    - Potassium-sparing diuretics:
      - Amiloride, triamterene
      - Often combined with thiazides (Dyazide, Maxzide)
    - NSAIDs (impair renin release and renal blood flow)
    - Trimethoprim (blocks ENaC channel, similar to amiloride)
    - Calcineurin inhibitors (tacrolimus, cyclosporine)
    - Heparin (suppresses aldosterone synthesis)
    - Digoxin (inhibits Na-K-ATPase)
    - Beta blockers (impair cellular uptake)
  - Physical examination:
    - Vital signs (bradycardia or tachycardia, hypotension if severe)
    - Cardiovascular exam:
      - Irregular rhythm (arrhythmia)
      - Assess for signs of heart failure
    - Neuromuscular exam:
      - Muscle strength testing (proximal weakness)
      - Deep tendon reflexes (may be decreased)
      - Sensory testing (paresthesias)
    - Volume status assessment:
      - Dehydration (suggests hypovolemia, AKI)
      - Edema (suggests CKD, heart failure)
    - Skin hyperpigmentation (Addison disease)
  - Laboratory evaluation:
    - Serum potassium (confirm elevation):
      - Mild: 5.5-5.9 mEq/L
      - Moderate: 6.0-6.4 mEq/L
      - Severe: over 6.5 mEq/L
      - Life-threatening: over 7.0 mEq/L or ECG changes regardless of level
    - Repeat potassium if pseudohyperkalemia suspected
    - Basic metabolic panel:
      - Creatinine and BUN (assess renal function, calculate GFR)
      - Glucose (DKA can cause hyperkalemia)
      - Bicarbonate (acidosis contributes to hyperkalemia)
      - Sodium, chloride, calcium, magnesium
    - Arterial blood gas if acidotic (assess pH and severity)
    - Urine potassium and creatinine:
      - Calculate transtubular potassium gradient (TTKG)
      - TTKG under 5 suggests impaired renal excretion
      - TTKG over 10 suggests extrarenal cause
    - Aldosterone and renin levels (if adrenal insufficiency suspected)
    - Cortisol (random and ACTH stimulation test for Addison disease)
    - Digoxin level (if on digoxin, toxicity)
    - Creatine kinase (if rhabdomyolysis suspected)
    - Uric acid and LDH (tumor lysis syndrome)
  - ECG findings (correlate poorly with serum level, but guide urgency):
    - Earliest changes (K+ 5.5-6.5):
      - Peaked T waves (tall, narrow, symmetric - most sensitive finding)
      - Shortened QT interval
    - Progressive changes (K+ 6.5-7.5):
      - PR interval prolongation (first-degree AV block)
      - Loss of P wave amplitude (flattened or absent P waves)
      - Widening of QRS complex
    - Severe changes (K+ over 7.5):
      - Sine wave pattern (wide bizarre QRS merging with T wave)
      - Ventricular tachycardia or fibrillation
      - Asystole
    - Any ECG changes mandate IMMEDIATE treatment regardless of potassium level

treatment:
  - Immediate stabilization (based on ECG changes and severity):
    - If ECG changes present (peaked T waves, widened QRS, etc.):
      - Cardiac membrane stabilization with calcium (FIRST):
        - Calcium gluconate 10% 1-2 grams (10-20 mL) IV over 2-5 minutes
        - Or calcium chloride 10% 0.5-1 gram (5-10 mL) IV over 2-5 minutes (more potent, requires central line)
        - Onset within 1-3 minutes, duration 30-60 minutes
        - Stabilizes cardiac membrane, NO effect on serum potassium
        - Repeat dose if ECG changes persist after 5 minutes
        - Monitor on continuous telemetry
      - Shift potassium intracellularly (SECOND):
        - Insulin and glucose:
          - Regular insulin 10 units IV push with 50 mL D50 (25 grams dextrose)
          - Or insulin 10 units in 500 mL D10 over 1 hour
          - Lowers K+ by 0.5-1.5 mEq/L
          - Onset 10-20 minutes, duration 4-6 hours
          - Check glucose q1h x 4-6 hours (risk of hypoglycemia)
          - If baseline glucose over 250, give insulin without dextrose
        - Beta-2 agonist (albuterol):
          - Albuterol 10-20 mg nebulized over 10 minutes
          - Lowers K+ by 0.5-1 mEq/L
          - Onset 30 minutes, duration 2-4 hours
          - Additive to insulin
          - Side effects: Tachycardia, tremor, hyperglycemia
        - Sodium bicarbonate (if metabolic acidosis present):
          - 50-100 mEq (1-2 amps) IV over 5-10 minutes
          - Or 150 mEq in 1L D5W over 4 hours
          - Controversial efficacy, takes hours to work
          - Use only if concurrent acidosis (pH under 7.2)
    - If NO ECG changes but K+ over 6.0:
      - Start with intracellular shift (insulin/glucose, albuterol)
      - May not need calcium unless ECG changes develop
    - If K+ 5.5-6.0 without ECG changes:
      - May not need emergent therapy
      - Focus on potassium removal and addressing cause
  - Potassium removal (definitive treatment):
    - Loop diuretics (if adequate renal function):
      - Furosemide 40-80 mg IV (higher doses if CKD)
      - Increases urinary potassium excretion
      - Ineffective if anuric or severe CKD (GFR under 15)
    - Cation exchange resins (binds potassium in GI tract):
      - Patiromer (Veltassa) 8.4-25.2 grams PO daily
      - Sodium zirconium cyclosilicate (Lokelma) 10 g PO TID initially, then 5-10 g daily
      - Onset 1-7 hours, durable effect
      - Preferred over sodium polystyrene sulfonate (SPS/Kayexalate)
      - SPS (Kayexalate) 15-60 grams PO or PR:
        - Older agent, risk of bowel necrosis (especially with sorbitol)
        - Avoid in post-operative patients or ileus
        - Less commonly used now due to safety concerns
    - Hemodialysis (most effective, removes 25-50 mEq/hr):
      - Indications:
        - Refractory hyperkalemia despite medical therapy
        - Severe hyperkalemia (over 7.5) with poor renal function
        - Oliguric or anuric acute kidney injury
        - Life-threatening arrhythmias
        - Symptomatic (weakness, paralysis)
      - Rapidly lowers potassium
      - Definitive treatment for ESRD patients
  - Address underlying cause:
    - Discontinue or reduce offending medications:
      - ACE inhibitors, ARBs, NSAIDs, potassium-sparing diuretics
      - May need to permanently discontinue or reduce dose
    - Treat acute kidney injury (address prerenal, intrarenal, postrenal causes)
    - Correct acidosis (improves cellular uptake of potassium)
    - Treat Addison disease with glucocorticoids and mineralocorticoids
    - Avoid high-potassium foods
    - Discontinue potassium supplements
    - Optimize CKD management
  - Monitoring:
    - Continuous cardiac monitoring (telemetry) for severe hyperkalemia or ECG changes
    - Repeat serum potassium:
      - Every 2-4 hours during acute treatment
      - Daily once stabilized
    - Repeat ECG after treatment to assess response
    - Monitor glucose frequently after insulin administration (risk of hypoglycemia)
    - Monitor for rebound hyperkalemia (shifts are temporary, need definitive removal)
  - Prevention and long-term management:
    - Dietary potassium restriction (under 2-3 grams per day)
    - Avoid salt substitutes (contain potassium chloride)
    - Patient education on high-potassium foods to avoid
    - Medication adjustments:
      - Reduce or discontinue RAAS inhibitors if recurrent hyperkalemia
      - Use lowest effective dose
    - Loop diuretics to enhance renal excretion (if adequate kidney function)
    - Newer potassium binders for chronic management:
      - Patiromer (Veltassa) 8.4 grams PO daily
      - Sodium zirconium cyclosilicate (Lokelma) 10 g daily
      - Allow continued use of RAAS inhibitors in CKD patients
    - Treat underlying CKD (delay progression, optimize for dialysis)
    - Sodium bicarbonate for chronic acidosis (if acidotic)
    - Regular monitoring of potassium in high-risk patients:
      - CKD patients (at least monthly)
      - Patients on RAAS inhibitors (check 1-2 weeks after dose change)

clinical_pearls:
  - Hyperkalemia is life-threatening - ECG changes mandate immediate treatment
  - Peaked T waves are earliest and most sensitive ECG finding
  - Calcium stabilizes cardiac membrane but does NOT lower potassium - always give FIRST if ECG changes
  - Insulin + glucose and albuterol shift potassium intracellularly - give SECOND, additive effects
  - Shifts are temporary (4-6 hours) - must follow with definitive removal (diuretics, dialysis, resins)
  - Dialysis is most effective removal method (removes 25-50 mEq/hr)
  - Sodium polystyrene sulfonate (Kayexalate) has risk of bowel necrosis - newer agents preferred
  - Pseudohyperkalemia from hemolysis is common - repeat sample if suspected
  - ACE inhibitors/ARBs are most common medication cause in CKD patients
  - TTKG under 5 suggests impaired renal excretion (most common cause overall)
  - Severe hyperkalemia (over 6.5) or any ECG changes requires continuous cardiac monitoring
  - Newer potassium binders (patiromer, zirconium cyclosilicate) allow continued RAAS inhibitor use in CKD

presentations:
  - Asymptomatic (most common)
  - Palpitations
  - Muscle weakness
  - Paresthesias
  - Nausea and vomiting
  - Cardiac arrhythmias
  - Paralysis (if severe)
  - Respiratory weakness
  - Cardiac arrest
  - Peaked T waves on ECG
  - Widened QRS on ECG

