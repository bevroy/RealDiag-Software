tree_id: NEPHRO-HYPONATREMIA
name: Hyponatremia
family: Nephrology
specialty: Nephrology
icd10:
- E87.1
snomed:
- '89627008'
urgency: medium
description: Comprehensive evaluation and management of Hyponatremia
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- 'Mild (130-135): Often asymptomatic'
- 'Moderate (120-130): Nausea, malaise, confusion, headache'
- 'Severe (<120): Seizures, coma, respiratory arrest'
- 'Assess volume status: Hypovolemic (dehydration), euvolemic (SIADH), hypervolemic
  (CHF, cirrhosis)'
- 'Urine sodium: <20 (hypovolemic), >40 (SIADH or renal loss)'
- 'Causes: SIADH, diuretics, adrenal insufficiency, hypothyroidism, psychogenic polydipsia'
workup:
- Basic metabolic panel (Na, osmolality)
- Urine sodium and osmolality
- Assess volume status (clinical exam, orthostatics)
- TSH, cortisol (rule out hypothyroid, adrenal insufficiency)
- Chest X-ray if SIADH suspected (malignancy, pneumonia)
treatment:
- 'Guideline-based treatment options for Hyponatremia include:'
- 'Symptomatic (seizures, coma): 3% hypertonic saline 100mL IV bolus (can repeat x2-3)
  (KDIGO 2024)'
- 'Hypovolemic: Normal saline IV (corrects hyponatremia by improving volume) (KDIGO
  2024)'
- 'SIADH: Fluid restriction <800 mL/day, salt tabs, consider tolvaptan (vasopressin
  antagonist) (KDIGO 2024)'
- 'Hypervolemic: Diuresis + fluid restriction (KDIGO 2024)'
- Correct <8 mEq/L in 24 hours (chronic cases) to avoid osmotic demyelination (KDIGO
  2024)
clinical_pearls:
- 'Acute (<48hr): Can correct faster (1-2 mEq/L/hr), high seizure risk'
- 'Chronic (>48hr): Correct slowly (<8 mEq/L in 24hr) to avoid osmotic demyelination
  syndrome'
- 'Osmotic demyelination (central pontine myelinolysis): Quadriplegia, dysarthria,
  dysphagia - IRREVERSIBLE'
- 'SIADH: Urine Na >40, urine osm >100, euvolemic, normal thyroid/adrenal function'
- 'Treatment depends on cause: Fluid restriction (SIADH), NS (hypovolemic), diuresis
  (hypervolemic)'
referrals:
- ICU if symptomatic or severe (<120)
- Nephrology consult for SIADH or complex cases
differentials: []
trace:
  source: 'Kidney Disease: Improving Global Outcomes (KDIGO) Guidelines, American
    Society of Nephrology (ASN)'
