tree_id: CARDS-ACUTE-DECOMPENSATED-HEART-FAILURE
name: Acute Decompensated Heart Failure (ADHF)
family: Cardiology
specialty: Emergency Medicine
chief_complaint: Acute dyspnea and volume overload
description: Acute worsening of chronic HF or new-onset HF with pulmonary and/or systemic congestion. Common precipitants include medication non-compliance, dietary indiscretion, arrhythmia, MI, infection. Requires hospitalization for IV diuretics. Identify and treat precipitants. Resume or uptitrate GDMT before discharge.
icd10: I50.23
urgency: emergency

workup:
  - Clinical presentation (acute symptoms):
  - Dyspnea: sudden worsening, may be at rest
  - Orthopnea: unable to lie flat
  - Paroxysmal nocturnal dyspnea
  - Lower extremity edema: rapid weight gain (over 2-3 pounds daily)
  - Fatigue, weakness: if low cardiac output
  - Assess volume status (wet vs dry, warm vs cold):
  - Wet (congested): elevated JVP, crackles, edema
  - Dry (euvolemic): normal JVP, clear lungs
  - Warm (adequate perfusion): warm extremities, normal mentation
  - Cold (hypoperfused): cool extremities, confusion, low BP
  - Most common: warm and wet (congested but perfused)
  - Worst: cold and wet (congested and hypoperfused, cardiogenic shock)
  - Precipitating factors (identify and treat):
  - Medication non-compliance: most common (stopped diuretic, ACE inhibitor, beta blocker)
  - Dietary indiscretion: high sodium intake
  - Arrhythmia: new AFib with RVR, VT
  - Acute coronary syndrome: MI causing worsening HF
  - Infection: pneumonia, UTI increase metabolic demand
  - Uncontrolled hypertension
  - Anemia: worsens oxygen delivery
  - Renal failure: fluid retention
  - NSAIDs: fluid retention, worsen HF
  - Physical exam:
  - Vital signs: tachycardia, tachypnea, hypoxemia, hypotension if severe
  - JVP elevated: over 12 cm H2O
  - Lungs: crackles, rales, may have pleural effusions
  - Cardiac: S3 gallop, displaced PMI
  - Extremities: pitting edema, cool if hypoperfused
  - Imaging:
  - Chest X-ray: cardiomegaly, pulmonary edema (cephalization, Kerley B lines, pleural effusions)
  - Echocardiogram: assess EF (HFrEF vs HFpEF), valvular disease, wall motion abnormalities
  - Labs:
  - BNP or NT-proBNP: markedly elevated (BNP over 400 pg/mL, NT-proBNP over 900 pg/mL)
  - Troponin: if ACS suspected
  - Renal function: cardiorenal syndrome common
  - Electrolytes: hyponatremia (dilutional), check potassium
  - CBC: anemia
  - ECG: assess for ischemia, arrhythmia

treatment:
  - Oxygen: if hypoxemic (goal SpO2 over 90%)
  - Non-invasive ventilation (BiPAP) if respiratory distress
  - Diuresis (cornerstone of ADHF treatment):
  - IV loop diuretic: furosemide, bumetanide
  - Initial dose: if already on oral diuretic, give 2-2.5 times home dose IV
  - If diuretic naive, furosemide 40 mg IV bolus or continuous infusion
  - Goal: net negative 1-2 liters daily until euvolemic
  - Monitor: daily weights (goal lose 2-3 pounds daily), strict intake/output
  - If inadequate response: increase dose or add thiazide (metolazone 5-10 mg daily for synergy)
  - Vasodilators: if hypertensive (SBP over 140)
  - IV nitroglycerin: reduce preload and afterload
  - Contraindicated if RV infarction, hypotension, recent PDE5 inhibitor
  - Inotropes: if hypoperfused (cold and wet, cardiogenic shock)
  - Dobutamine: beta-1 agonist, increase contractility
  - Milrinone: phosphodiesterase inhibitor, inotrope and vasodilator
  - Risk arrhythmias, use cautiously
  - Vasopressors: if cardiogenic shock with hypotension
  - Norepinephrine: if SBP under 70 mmHg
  - Treat precipitant:
  - AFib with RVR: rate control (beta blocker, diltiazem)
  - ACS: reperfusion
  - Infection: antibiotics
  - Medication adjustment:
  - Continue beta blocker if stable (stopping may worsen HF)
  - Hold ACE inhibitor/ARB if hypotensive or worsening renal function
  - Restart or uptitrate GDMT before discharge
  - Advance care planning: if refractory HF, discuss LVAD, transplant, palliative care

clinical_pearls:
  - ADHF: acute worsening of chronic HF or new-onset HF with congestion
  - Most common presentation: warm and wet (congested but perfused)
  - IV loop diuretic cornerstone of treatment (goal net negative 1-2 L daily)
  - Identify and treat precipitants: medication non-compliance, dietary indiscretion, arrhythmia, ACS, infection
  - Continue beta blocker if stable (stopping worsens outcomes)
  - Uptitrate GDMT before discharge (reduce readmissions)
  - BiPAP if respiratory distress

differentials:
  - Pulmonary embolism: acute dyspnea but no congestion
  - Pneumonia: fever, infiltrate on X-ray
  - COPD exacerbation: wheezing, no edema or elevated BNP
  - ACS: chest pain, troponin elevation

trace: |
  A 68-year-old man with history of HFrEF (EF 30%) on GDMT presented to ED with 3 days worsening dyspnea. Ran out of medications 1 week ago (medication non-compliance - most common precipitant). Now dyspneic at rest, orthopneic, unable to sleep lying flat. Gained 8 pounds over 3 days. Exam: BP 160/95 (hypertensive), HR 110 (tachycardia), RR 28 (tachypnea), SpO2 88% on room air (hypoxemia), JVP 16 cm H2O (markedly elevated - severe congestion), diffuse crackles bilaterally (pulmonary edema), S3 gallop, 3+ pitting edema to thighs (anasarca). Chest X-ray: cardiomegaly, pulmonary edema with cephalization, Kerley B lines, bilateral pleural effusions. BNP 1850 pg/mL (markedly elevated - over 400 diagnostic for ADHF). ECG: sinus tachycardia, no acute ischemia. Labs: creatinine 1.8 mg/dL (baseline 1.2 - worsening renal function from cardiorenal syndrome), sodium 130 mEq/L (hyponatremia - dilutional), potassium 4.5 mEq/L. Troponin negative (no ACS). Diagnosed with acute decompensated heart failure (ADHF), warm and wet presentation (congested but perfused). Precipitant: medication non-compliance. Admitted to cardiology service. Started on supplemental oxygen 4L nasal cannula (SpO2 improved to 93%). Given hypertensive (SBP 160), started IV nitroglycerin drip 10 mcg/min (vasodilator - reduce preload and afterload), titrated up for BP control. Home furosemide dose 40 mg daily, so gave furosemide 100 mg IV bolus (2.5 times home dose), then 80 mg IV BID. Strict intake/output monitoring. Day 1: diuresed 2.5 liters, weight decreased 6 pounds (excellent response). BP improved to 135/85, dyspnea improved, able to lie at 30 degrees. Day 2: continued furosemide 80 mg IV BID, diuresed another 2 liters, weight down 5 more pounds (total 11 pounds lost - back near dry weight). JVP decreased to 10 cm H2O, crackles resolved, edema improved to 1+. Transitioned off nitroglycerin drip, BP stable. Day 3: switched to oral torsemide 40 mg daily (more bioavailable than furosemide), restarted GDMT: sacubitril/valsartan 97/103 mg BID (ARNI), carvedilol 25 mg BID (beta blocker - continued throughout hospitalization), spironolactone 25 mg daily (aldosterone antagonist), dapagliflozin 10 mg daily (SGLT2 inhibitor). Day 4: euvolemic (JVP 8 cm H2O, no crackles, trace edema only), ambulating without dyspnea, weight stable. Repeat labs: creatinine improved to 1.4 mg/dL (better with euvolemia), sodium 134 mEq/L (improved). Repeat BNP 420 pg/mL (decreased from 1850 - improved with diuresis). Extensive counseling on medication compliance, sodium restriction, daily weights. Arranged close outpatient follow-up in 1 week. Discharged on day 5 with medications and home health visits. At 1 week: outpatient cardiology visit, stable, no weight gain, NYHA class II. At 1 month: no HF readmission (excellent outcome), adherent to medications and diet, weight stable, NYHA class II. Repeat echo: EF stable at 32%. ADHF episode successfully treated with IV diuresis and GDMT optimization.
