tree_id: PULM-ARDS
name: Acute Respiratory Distress Syndrome (ARDS)
family: Pulmonology
specialty: Pulmonology
icd10:
- J80
snomed:
- '67782005'
urgency: urgent
description: Comprehensive evaluation and management of Acute Respiratory Distress
  Syndrome (ARDS)
version: '1.0'
author: RealDiag Clinical Team
homeopathy: []
presentations:
- Acute onset (<1 week) of severe hypoxemia
- Bilateral infiltrates on chest imaging (not fully explained by effusions/atelectasis)
- Respiratory failure not explained by heart failure (PCWP <18 or clinical assessment)
- 'Berlin criteria: PaO2/FiO2 ratio ≤300 (Mild 200-300, Moderate 100-200, Severe <100)'
- Dyspnea, tachypnea, hypoxia refractory to oxygen
- 'Causes: Sepsis (most common), pneumonia, aspiration, trauma, pancreatitis'
workup:
- ABG (PaO2/FiO2 ratio)
- Chest X-ray or CT (bilateral infiltrates)
- Echocardiogram (rule out cardiogenic pulmonary edema)
- 'Consider: Bronchoscopy (BAL) if infectious etiology unclear'
treatment:
- 'Guideline-based treatment options for Acute Respiratory Distress Syndrome (ARDS)
  include:'
- 'Mechanical ventilation: Low tidal volume 6 mL/kg IBW, PEEP 5-15 (ATS 2023)'
- Plateau pressure goal <30 cm H2O (ATS 2023)
- Prone positioning 16 hours/day if severe (PaO2/FiO2 <150) (ATS 2023)
- Conservative fluid management after resuscitation (prevent pulmonary edema) (ATS
  2023)
- 'Treat underlying cause: Antibiotics, source control, supportive care (ATS 2023)'
clinical_pearls:
- 'Lung-protective ventilation: Tidal volume 6 mL/kg ideal body weight (prevents VILI)'
- Plateau pressure <30 cm H2O (prevents barotrauma)
- Prone positioning improves mortality in severe ARDS (PaO2/FiO2 <150)
- Conservative fluid strategy after initial resuscitation
- Mortality 30-40% even with optimal treatment
referrals:
- ICU admission (all ARDS)
- Consider ECMO if refractory hypoxemia despite optimal ventilation
differentials:
  - Cardiogenic pulmonary edema
  - Pneumonia
  - Pulmonary hemorrhage
  - Aspiration
trace:
  source: American Thoracic Society (ATS) Guidelines, Global Initiative for Chronic
    Obstructive Lung Disease (GOLD)
  version: 0.1.0
  last_updated: '2024-12-26'
