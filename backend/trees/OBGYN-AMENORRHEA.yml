tree_id: OBGYN-AMENORRHEA
name: Amenorrhea
family: obstetrics_gynecology
specialty: Gynecology/Endocrinology
icd10: N91.2
snomed: 14302001
urgency: []
homeopathy: []
presentations:
  - Primary amenorrhea: no menarche by age 15 (or age 13 with no secondary sexual characteristics)
  - Secondary amenorrhea: absence of menses for 3 months in women with previously regular cycles or 6 months with irregular cycles
  - Absence of menstruation with or without other symptoms
  - May have associated symptoms depending on cause (galactorrhea, hirsutism, hot flashes, headaches, visual changes)
  - History of weight loss, excessive exercise, or eating disorder
  - Psychological stress
  - Recent medication changes (antipsychotics, chemotherapy)
workup:
  - Detailed history
  - Age of menarche (if applicable)
  - Previous menstrual pattern and date of last menstrual period
  - Sexual activity and contraception use
  - Pregnancy history
  - Weight changes, diet, exercise habits
  - Medications (antipsychotics, chemotherapy, hormones)
  - Galactorrhea, headaches, visual changes (pituitary pathology)
  - Hot flashes, vaginal dryness (hypoestrogenism)
  - Hirsutism, acne (hyperandrogenism - PCOS)
  - Chronic medical conditions (thyroid disease, chronic kidney disease)
  - Family history (age of menarche in mother/sisters, early menopause)
  - Physical examination
  - Vital signs, BMI (very low or very high BMI associated with amenorrhea)
  - General appearance (body habitus, stigmata of Turner syndrome)
  - Thyroid examination
  - Breast examination (Tanner staging, galactorrhea)
  - Abdominal examination (masses, pregnancy)
  - Pelvic examination
  - Assess for presence of uterus and vagina
  - Evaluate for imperforate hymen, transverse vaginal septum
  - Cervical mucus (assess estrogen effect)
  - Bimanual exam (uterine size, adnexal masses)
  - Hyperandrogenism signs (hirsutism, acne, clitoromegaly)
  - Laboratory evaluation - systematic approach
  - Step 1: Rule out pregnancy
  - Urine or serum beta-hCG (ALWAYS first test)
  - Step 2: Initial hormone panel
  - Thyroid-stimulating hormone (TSH) - hypothyroidism and hyperthyroidism can cause amenorrhea
  - Prolactin - hyperprolactinemia suppresses GnRH
  - "Normal: less than 25 ng/mL"
  - "Greater than 100 ng/mL: likely prolactinoma"
  - Follicle-stimulating hormone (FSH)
  - "FSH greater than 40 mIU/mL: ovarian failure/premature ovarian insufficiency"
  - "FSH less than 5 mIU/mL: hypothalamic or pituitary dysfunction"
  - "FSH normal: PCOS, outflow obstruction, or anatomic abnormality"
  - Step 3: If hyperandrogenism signs present
  - Total and free testosterone
  - "Greater than 200 ng/dL: consider ovarian or adrenal tumor"
  - DHEA-S (dehydroepiandrosterone sulfate)
  - "Greater than 700 mcg/dL: consider adrenal tumor"
  - 17-hydroxyprogesterone (if suspect congenital adrenal hyperplasia)
  - Step 4: Additional tests based on initial results
  - Estradiol level (assess estrogen status)
  - Luteinizing hormone (LH) - LH:FSH ratio greater than 2:1 suggests PCOS
  - Karyotype if primary amenorrhea with high FSH (Turner syndrome, gonadal dysgenesis)
  - Progestin challenge test
  - Medroxyprogesterone acetate 10 mg daily for 10 days
  - Withdrawal bleeding within 2-7 days indicates adequate estrogen and patent outflow tract
  - No bleeding suggests low estrogen or outflow obstruction
  - Imaging studies
  - Pelvic ultrasound
  - Assess for uterine and ovarian anatomy
  - Polycystic ovaries (12 or more follicles 2-9 mm or ovarian volume greater than 10 mL)
  - Ovarian masses
  - MRI brain with pituitary focus if prolactin greater than 100 ng/mL or visual symptoms
  - Evaluate for pituitary adenoma (prolactinoma)
  - Hysteroscopy or sonohysterography if suspect Asherman syndrome (intrauterine adhesions)
treatment:
  - Treat underlying cause
  - Hypothalamic amenorrhea (functional - stress, weight loss, excessive exercise)
  - Restore normal weight (if BMI less than 18.5)
  - Reduce exercise intensity if excessive
  - Stress management, cognitive behavioral therapy
  - Nutritional counseling
  - Hormone replacement to prevent bone loss if estrogen deficient
  - Combined oral contraceptives or cyclic estrogen-progestin
  - Premature ovarian insufficiency (POI - menopause before age 40)
  - Hormone replacement therapy (HRT) until age 51 (average age of menopause)
  - Estrogen-progestin combination (oral, transdermal, or vaginal)
  - Prevents osteoporosis, cardiovascular disease, menopausal symptoms
  - Fertility requires egg donation if pregnancy desired
  - Karyotype and FMR1 (fragile X) premutation testing
  - Polycystic ovary syndrome (PCOS)
  - Lifestyle modifications: weight loss (5-10% improves ovulation)
  - Combined oral contraceptives (regulate cycles, reduce androgens)
  - Metformin 1500-2000 mg daily (improve insulin sensitivity, may restore ovulation)
  - If fertility desired: clomiphene citrate or letrozole for ovulation induction
  - Anti-androgens (spironolactone) for hirsutism
  - Hyperprolactinemia/prolactinoma
  - Dopamine agonists
  - Cabergoline 0.25-1 mg twice weekly (preferred - fewer side effects)
  - Bromocriptine 2.5-15 mg daily
  - Normalizes prolactin, restores ovulation, shrinks tumor
  - Surgery (transsphenoidal) if medication fails or macroadenoma with visual symptoms
  - Thyroid dysfunction
  - Levothyroxine replacement for hypothyroidism
  - Target TSH 0.5-2.5 mIU/L
  - Antithyroid medications for hyperthyroidism
  - Anatomic abnormalities
  - Imperforate hymen or transverse vaginal septum: surgical correction
  - Asherman syndrome (intrauterine adhesions): hysteroscopic adhesiolysis + estrogen therapy
  - Mullerian agenesis (absent uterus): cannot carry pregnancy, consider surrogacy
  - Turner syndrome (45,XO): HRT, cannot conceive with own eggs
  - Medications causing amenorrhea
  - Discontinue offending agent if possible
  - Antipsychotics: switch to agent with lower prolactin effect (aripiprazole, quetiapine)
  - If cannot stop medication: combined OCPs or progestin to induce withdrawal bleeding every 3 months
  - Bone health for hypoestrogenic amenorrhea
  - Calcium 1200 mg daily + vitamin D 800-1000 IU daily
  - Weight-bearing exercise
  - Hormone replacement (estrogen-progestin)
  - DEXA scan if amenorrhea greater than 6 months to assess bone density
clinical_pearls:
  - 'Always rule out pregnancy first - most common cause of secondary amenorrhea in reproductive-age women'
  - 'FSH level distinguishes between ovarian failure (FSH greater than 40) versus hypothalamic/pituitary dysfunction (low FSH)'
  - 'PCOS most common cause of secondary amenorrhea (70% of anovulatory amenorrhea cases)'
  - 'Prolactin greater than 100 ng/mL almost always indicates prolactinoma - get MRI brain'
  - 'Female athlete triad: amenorrhea + low energy availability + low bone density - seen in endurance athletes, dancers'
  - 'Hypothalamic amenorrhea can cause irreversible bone loss - urgent need for estrogen replacement'
  - 'Premature ovarian insufficiency (menopause before 40) requires HRT until age 51 to prevent osteoporosis and CVD'
  - 'Primary amenorrhea with normal breast development but absent uterus suggests Mullerian agenesis (46,XX)'
referrals:
  - Reproductive endocrinology and infertility (REI) for ovulation disorders, premature ovarian insufficiency, fertility concerns
  - Endocrinology for complex hormonal disorders, hyperprolactinemia, thyroid disease
  - Neurosurgery for pituitary macroadenoma with visual symptoms or failed medical therapy
  - Gynecologic surgery for anatomic abnormalities requiring surgical correction
  - Nutrition/eating disorder specialist for suspected anorexia nervosa or disordered eating
differentials:
  - Pregnancy (most common cause of secondary amenorrhea - positive beta-hCG)
  - Polycystic ovary syndrome (irregular cycles, hirsutism, acne, polycystic ovaries, elevated LH:FSH ratio)
  - Hypothalamic amenorrhea (low BMI, excessive exercise, stress, low FSH and estradiol)
  - Hyperprolactinemia (elevated prolactin, galactorrhea, may have pituitary adenoma)
  - Premature ovarian insufficiency (age less than 40, elevated FSH greater than 40, low estradiol)
  - Thyroid dysfunction (abnormal TSH - hypothyroidism more common than hyperthyroidism)
  - Asherman syndrome (intrauterine adhesions - history of D&C, endometritis, no withdrawal bleeding after progestin)
  - Anatomic abnormalities (imperforate hymen, transverse vaginal septum, absent uterus)
  - Medications (antipsychotics, chemotherapy, GnRH agonists, progestins)
