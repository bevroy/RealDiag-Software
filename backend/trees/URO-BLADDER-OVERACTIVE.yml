tree_id: URO-BLADDER-OVERACTIVE
name: Overactive Bladder
family: Urology
specialty: Urology
chief_complaint: Urinary urgency and frequency
description: Urgency with or without urge incontinence, usually with frequency and nocturia, in absence of infection or pathology. Behavioral therapy plus anticholinergics or beta-3 agonist improve symptoms and quality of life.
icd10: N32.81
snomed: 442972004
urgency: non-urgent

workup:
  - Clinical diagnosis: urgency (sudden compelling desire to void difficult to defer) with frequency (≥8 voids per 24 hours) and/or nocturia (≥2 voids per night), with or without urgency urinary incontinence
  - Bladder diary: 3-day diary documenting void times, volumes, urgency episodes, leakage episodes (objective assessment)
  - Urinalysis and culture: rule out UTI (most important initial test)
  - Post-void residual: bladder scan or catheterization, >200 mL suggests incomplete emptying or overflow incontinence
  - Rule out secondary causes: diabetes (polyuria), medications (diuretics, caffeine), pelvic mass, neurologic disease
  - Specialized testing if refractory: urodynamics (cystometry) demonstrates detrusor overactivity
  - Cystoscopy: if hematuria, pain, suspected bladder pathology

treatment:
  - First-line behavioral therapy: bladder training (scheduled voiding, gradually increase intervals), pelvic floor exercises (Kegel), fluid management
  - Avoid bladder irritants: caffeine, alcohol, carbonation, artificial sweeteners, spicy foods
  - Timed voiding: void on schedule (every 2-3 hours) rather than waiting for urgency
  - Anticholinergics (if behavioral therapy inadequate): block muscarinic receptors, reduce detrusor contractions
  - Oxybutynin IR 5 mg BID-TID or ER 5-10 mg daily, tolterodine IR 2 mg BID or ER 4 mg daily, solifenacin 5-10 mg daily, darifenacin 7.5-15 mg daily
  - Side effects: dry mouth (most common), constipation, blurred vision, cognitive impairment (especially elderly - avoid if dementia risk)
  - Beta-3 agonist: mirabegron 25-50 mg daily (alternative to anticholinergics, different mechanism, fewer anticholinergic side effects)
  - Contraindicated uncontrolled hypertension (raises BP slightly)
  - Combination therapy: anticholinergic plus beta-3 agonist if monotherapy inadequate
  - Topical estrogen: if postmenopausal atrophic vaginitis contributes (estradiol vaginal cream)
  - Botulinum toxin A (Botox): intravesical injection 100 units if medications fail, lasts 6-12 months, risk urinary retention requiring catheterization 5-10%
  - Sacral neuromodulation (InterStim): implantable device stimulates sacral nerves if medications fail
  - Percutaneous tibial nerve stimulation (PTNS): weekly 30-minute sessions x12 weeks, less invasive alternative

clinical_pearls:
  - Urgency with frequency/nocturia with or without incontinence diagnostic
  - Rule out UTI first - urinalysis and culture
  - Behavioral therapy first-line - bladder training, Kegel exercises, avoid irritants
  - Anticholinergics second-line - oxybutynin, tolterodine, solifenacin
  - Dry mouth most common side effect anticholinergics, avoid in dementia risk
  - Mirabegron alternative - beta-3 agonist, fewer anticholinergic effects
  - Botox intravesical injection for refractory cases
  - Sacral neuromodulation if medications fail

differentials:
  - Urinary tract infection: dysuria, urgency, pyuria, positive culture
  - Interstitial cystitis/bladder pain syndrome: pelvic pain, urgency, frequency, negative cultures, cystoscopy shows Hunner lesions or glomerulations
  - Stress urinary incontinence: leakage with cough, sneeze, exercise (increased intra-abdominal pressure), no urgency
  - Diabetes insipidus or mellitus: polyuria, polydipsia, elevated glucose or low urine osmolality

trace: |
  A 62-year-old postmenopausal woman presented with 18 months of sudden urgent need to urinate occurring 12-15 times daily and 4 times nightly, with 2-3 episodes per day of urge incontinence (unable to reach bathroom in time). Bladder diary confirmed 14 voids per 24 hours with urgency and leakage episodes. Significantly affecting quality of life, avoiding social activities. Urinalysis and culture negative. Post-void residual 30 mL (normal). No diabetes. Diagnosed with overactive bladder with urgency urinary incontinence. Started behavioral therapy with bladder training (scheduled voids every 2 hours), pelvic floor exercises, eliminated caffeine intake. At 4 weeks improved to 10-11 voids daily with behavioral therapy alone but still bothersome urgency. Added oxybutynin ER 5 mg daily. At 2 weeks dry mouth (tolerable), urgency reduced. At 6 weeks increased to 10 mg daily. At 12 weeks excellent improvement - 7-8 voids daily, 1-2 times nightly, urgency episodes reduced 80%, incontinence episodes once per week or less. At 6 months continues oxybutynin 10 mg daily plus behavioral strategies, excellent symptom control, returned to social activities, dramatically improved quality of life.
