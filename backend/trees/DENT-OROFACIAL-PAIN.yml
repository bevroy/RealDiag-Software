tree_id: DENT-OROFACIAL-PAIN
name: Dental Pain (Orofacial Pain) (Encounter)
family: dentistry
specialty: Dentistry, Primary Care
chief_complaint: Tooth pain, jaw pain, facial pain
description: |
  Orofacial pain encompasses dental pain and other pain in the oral and facial region. Most common cause is dental pathology
  including caries, pulpitis, periodontitis, and dental abscess. Can also result from TMJ disorders, trigeminal neuralgia, or sinusitis.
icd10: K08.89
snomed: "27355003"
presentations:
  - Toothache or dental pain
  - Sharp, throbbing, or constant pain
  - Pain with chewing or biting
  - Sensitivity to hot or cold
  - Swelling of gums or face
  - Jaw pain or TMJ pain
  - Facial pain
  - Pain radiating to ear or neck
  - Difficulty opening mouth (trismus)
urgency: Moderate
referrals:
  emergency:
    - Airway compromise from swelling
    - Spreading facial infection (cellulitis)
    - Fever with facial swelling
    - Unable to swallow
  urgent:
    - Severe uncontrolled pain
    - Signs of dental abscess with systemic symptoms
    - Broken or avulsed tooth with exposed nerve
  dentistry:
    - All dental pain for definitive evaluation and treatment
workup:
  - History - onset, quality, duration, triggers (hot/cold, chewing), prior dental work
  - Physical exam - inspect teeth for caries, fractures, missing fillings; palpate for tenderness; check for swelling, erythema
  - Percussion test - tap on suspected tooth to localize pain
  - Thermal sensitivity testing
  - Examine gums for periodontal disease, gingivitis
  - TMJ exam - palpate joint, assess range of motion, crepitus
  - Cranial nerve exam if concern for trigeminal neuralgia
  - Dental X-rays if available (panorex or periapical)
treatment:
  acute_pain_management:
    - NSAIDs - ibuprofen 400-600mg q6h or naproxen 500mg q12h (first-line)
    - Acetaminophen 650-1000mg q6h (alternative or in addition)
    - Opioids for severe pain (short-term, 3-5 days) - hydrocodone or oxycodone
    - Topical anesthetics - benzocaine gel for temporary relief
  dental_caries_pulpitis:
    - Definitive treatment requires dental referral
    - Root canal or extraction
    - Temporary measures - avoid triggers, soft diet
  dental_abscess:
    - Antibiotics - amoxicillin 500mg TID x 7 days or clindamycin 300mg TID if penicillin allergy
    - Incision and drainage if fluctuant
    - Urgent dental referral for definitive treatment
  periodontal_disease:
    - Improved oral hygiene
    - Saltwater rinses
    - Dental scaling and cleaning
  TMJ_disorder:
    - NSAIDs, muscle relaxants (cyclobenzaprine 5-10mg qhs)
    - Soft diet, avoid hard/chewy foods
    - Warm compresses
    - Bite guard or splint (dentist fabricated)
clinical_pearls:
  - Most dental pain is from caries, pulpitis, or periodontal disease
  - Antibiotics alone do not cure dental abscess - need drainage or extraction
  - TMJ disorder pain typically worse with chewing, jaw movement
  - Trigeminal neuralgia is brief, shock-like pain triggered by light touch
  - Referred pain common - maxillary tooth pain can present as sinus pain, mandibular pain can refer to ear
  - Always examine for facial swelling and signs of spreading infection
differentials:
  - Dental caries with pulpitis
  - Dental abscess
  - Periodontal disease, gingivitis
  - TMJ disorder
  - Trigeminal neuralgia
  - Acute sinusitis (maxillary sinus pain mimics upper tooth pain)
  - Atypical facial pain
  - Temporal arteritis (in older patients)
trace:
  - 35-year-old presents with severe right lower tooth pain x 2 days, worse with chewing and hot/cold. Exam shows large carious lesion on lower right first molar with tenderness to percussion. No facial swelling. Diagnose dental caries with acute pulpitis. Prescribe ibuprofen 600mg q6h and refer urgently to dentist. Dentist performs root canal with resolution of pain.
citations:
  - American Dental Association Clinical Guidelines
  - UpToDate - Dental and Primary Care
