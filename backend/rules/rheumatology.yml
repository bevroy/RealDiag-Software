- id: RHEUM-FIBROMYALGIA
  label: Fibromyalgia
  presentations:
  - Widespread musculoskeletal pain
  - Fatigue
  - Sleep disturbance
  - Cognitive difficulties (fibro fog)
  - Multiple tender points
  - Normal lab tests
  clinical_pearls:
  - Central pain amplification syndrome - 2-4% of population, female 7:1, peak onset
    30-50 years
  - 'Diagnosis: Widespread pain >3 months + Widespread Pain Index >7 + Symptom Severity
    Score >5 (2016 criteria - tender point exam no longer required)'
  - 'Normal labs: Normal ESR/CRP, normal RF/ANA, normal CPK - helps distinguish from
    inflammatory arthritis or myositis'
  - 'Comorbidities: Depression (50%), anxiety, irritable bowel syndrome, migraine,
    TMJ, interstitial cystitis - often coexist'
  - 'NOT a diagnosis of exclusion: Can coexist with RA, lupus, other rheumatic diseases'
  management:
  - 'Guideline-based treatment options for Fibromyalgia include:'
  - 'Education: Explain central sensitization, chronic pain neurobiology - sets realistic
    expectations (management, not cure)'
  - 'Exercise: Aerobic exercise (walking, swimming, cycling) 30 min 3-5x/week - MOST
    effective non-pharmacologic treatment'
  - 'Cognitive behavioral therapy (CBT): Addresses maladaptive thoughts, improves
    coping strategies'
  - 'Medications: Duloxetine 60mg daily (SNRI) OR pregabalin 150-450mg divided BID
    (for pain) OR amitriptyline 10-25mg qHS (for sleep)'
  - 'Avoid opioids: Not effective for fibromyalgia, high risk of dependence/adverse
    effects'
  tests:
  - 'Clinical diagnosis: No specific lab test'
  - 'ESR/CRP: Normal (if elevated, consider alternative diagnosis like inflammatory
    arthritis)'
  - 'CBC, CMP: Normal'
  - 'TSH: Rule out hypothyroidism (can mimic fibromyalgia)'
  - 'Vitamin D: If low, replace (may improve pain/fatigue)'
  - 'RF, anti-CCP, ANA: Not routinely needed unless features of inflammatory arthritis
    or connective tissue disease'
  referrals:
  - 'Rheumatology if: Diagnostic uncertainty (elevated inflammatory markers, synovitis,
    abnormal labs suggesting alternative diagnosis)'
  - Most fibromyalgia managed by primary care with exercise, CBT, duloxetine/pregabalin/amitriptyline
  icd10:
  - M79.7
  snomed:
  - '203082005'
- id: RHEUM-VASCULITIS
  label: Systemic Vasculitis
  presentations:
  - Fever and weight loss
  - Purpura or skin ulcers
  - Neuropathy
  - Renal involvement
  - Elevated inflammatory markers
  - Organ-specific symptoms
  clinical_pearls:
  - 'Inflammation of blood vessels - classified by vessel size: Large (GCA, Takayasu),
    Medium (PAN, Kawasaki), Small (GPA, MPA, EGPA)'
  - 'ANCA-associated vasculitis: GPA (Wegener''s - c-ANCA/PR3), MPA (p-ANCA/MPO),
    EGPA (Churg-Strauss - eosinophilia, asthma)'
  - 'GPA (granulomatosis with polyangiitis): Upper/lower respiratory (sinusitis, pulmonary
    nodules) + glomerulonephritis - ''saddle nose deformity'''
  - 'PAN (polyarteritis nodosa): Medium vessel - renal artery aneurysms, mesenteric
    ischemia, mononeuritis multiplex, ANCA-negative'
  - 'Red flags: Constitutional symptoms (fever, weight loss) + multisystem involvement
    (kidneys, lungs, skin, nerves) + elevated ESR/CRP'
  management:
  - 'Guideline-based treatment options for Systemic Vasculitis include:'
  - 'Induction (severe/organ-threatening): Cyclophosphamide IV 500-750 mg/m2 monthly
    x6 months + prednisone 1mg/kg daily'
  - 'Alternative induction: Rituximab 375 mg/m2 IV weekly x4 (non-inferior to cyclophosphamide,
    less toxicity)'
  - 'Maintenance (after remission): Rituximab 500-1000mg IV q6 months OR azathioprine
    2mg/kg daily x18-24 months'
  - 'Plasma exchange: If rapidly progressive glomerulonephritis (creatinine >5.8 mg/dL)
    or pulmonary hemorrhage'
  - 'Steroid taper: After 4-6 weeks, taper prednisone by 10-20% every 2 weeks to 10mg,
    then slower taper to 5mg by 6 months'
  tests:
  - 'ANCA: c-ANCA/PR3 (GPA), p-ANCA/MPO (MPA, EGPA) - 80-90% sensitive in active disease'
  - 'ESR/CRP: Markedly elevated'
  - 'UA with micro: RBC casts, proteinuria (glomerulonephritis)'
  - 'Creatinine: Renal function (rapidly progressive GN can cause renal failure in
    days-weeks)'
  - 'Chest X-ray/CT: Pulmonary nodules, cavitation, infiltrates, hemorrhage'
  - 'Biopsy (kidney, lung, skin): Necrotizing vasculitis, granulomas (GPA), eosinophils
    (EGPA) - gold standard'
  referrals:
  - Rheumatology EMERGENTLY - vasculitis is medical emergency, untreated can cause
    irreversible organ damage/death
  - Nephrology if renal involvement (glomerulonephritis)
  icd10:
  - M31.9
  - M31.30
  snomed:
  - '31996006'
