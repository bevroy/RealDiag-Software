- id: ENT-EPIGLOTTITIS
  label: Epiglottitis
  presentations:
  - Severe sore throat
  - High fever
  - Drooling
  - Stridor
  - Tripod position (leaning forward)
  - Muffled voice
  - Dysphagia
  - Medical emergency - airway obstruction risk
  - Thumb sign on lateral neck X-ray
  clinical_pearls:
  - Life-threatening airway emergency - can progress to complete obstruction in hours
  - '4 D''s: Drooling, Dysphagia, Dysphonia (muffled voice), Distress (respiratory)'
  - 'Organism: H. influenzae type B (rare now due to Hib vaccine), Strep species,
    Staph aureus'
  - 'Peak age: Adults (20-40 years) now more common than children since Hib vaccine
    introduced'
  - DO NOT examine oropharynx with tongue depressor - may precipitate laryngospasm
    and airway obstruction
  management:
  - 'Guideline-based treatment options for Epiglottitis include:'
  - Call anesthesia/ENT IMMEDIATELY - do not leave patient unattended (Guidelines)
  - Keep patient calm, sitting upright in position of comfort (tripod position) (Guidelines)
  - 'Secure airway in controlled setting (OR): Intubation or tracheostomy (difficult
    intubation - swollen epiglottis) (Guidelines)'
  - 'Antibiotics AFTER airway secured: Ceftriaxone 2g IV q24h OR cefotaxime 2g IV
    q8h (Guidelines)'
  - Add vancomycin 15-20mg/kg IV q12h if concern for MRSA (Guidelines)
  tests:
  - DO NOT obtain labs or imaging if diagnosis suspected - risk of airway obstruction
    during procedures
  - 'Lateral neck X-ray (portable at bedside if stable): Thumb sign (swollen epiglottis)
    - but don''t delay treatment'
  - Visualization of cherry-red epiglottis with fiberoptic laryngoscopy - only in
    controlled setting by ENT/anesthesia
  - Blood cultures after airway secured
  referrals:
  - ENT + Anesthesia STAT - airway emergency
  - ICU admission for airway monitoring after intubation
  - Average intubation duration 2-3 days, then extubation when epiglottis improved
    on direct visualization
  icd10:
  - J05.10
  snomed:
  - 80384002
- id: ENT-LARYNGITIS
  label: Acute Laryngitis
  presentations:
  - Hoarseness or voice loss
  - Dry cough
  - Sore throat (mild)
  - Usually follows viral URI
  - Voice worsens with use
  - Self-limited (typically 1-2 weeks)
  clinical_pearls:
  - 'Viral laryngitis (95%): Self-limited inflammation of larynx, peak symptoms 2-3
    days, resolves in 1-2 weeks'
  - 'Causes: Rhinovirus, adenovirus, influenza, RSV (follows URI symptoms)'
  - 'Voice rest: Don''t whisper (causes more strain) - speak softly or write notes'
  - 'Chronic hoarseness >3 weeks: Red flag for vocal cord nodules, polyps, paralysis,
    or laryngeal cancer - needs laryngoscopy'
  - 'Reinke''s edema: Chronic smoking causes diffuse polypoid degeneration of vocal
    cords (deep, hoarse voice)'
  management:
  - 'Guideline-based treatment options for Acute Laryngitis include:'
  - 'Voice rest (most important): Minimize talking for 2-3 days, don''t whisper (Guidelines)'
  - 'Hydration: Increase fluids (8+ glasses/day), humidified air (Guidelines)'
  - 'Avoid irritants: No smoking, alcohol, caffeine (dehydrating) (Guidelines)'
  - 'Symptomatic: Throat lozenges, warm tea with honey (soothes throat) (Guidelines)'
  - NO ANTIBIOTICS (viral) - corticosteroids only if professional voice user (singer)
    with urgent need (Guidelines)
  tests:
  - Clinical diagnosis - no testing needed for acute viral laryngitis
  - 'Laryngoscopy (by ENT) if: Hoarseness >3 weeks, no URI symptoms, smoker, unilateral
    symptoms, dysphagia'
  referrals:
  - 'ENT for direct laryngoscopy if: Hoarseness >3 weeks (rule out vocal cord pathology,
    cancer)'
  - Speech-language pathology for voice therapy if chronic voice strain or vocal cord
    nodules
  icd10:
  - J04.0
  snomed:
