  - id: NEU-CONCUSSION
    label: Concussion
    presentations:
      - head trauma with altered consciousness
      - headache, confusion, amnesia
      - dizziness, nausea
      - may have delayed symptoms
      - CT often normal
      - "Mild traumatic brain injury (mTBI) - brief alteration in consciousness"
      - "Retrograde or anterograde amnesia"
      - "Post-concussive symptoms: Headache, dizziness, fatigue, irritability, concentration difficulty"
      - "Symptoms may develop hours to days after injury"
    clinical_pearls:
      - "CT head not needed if: GCS 15, no LOC, no vomiting, age <65, no anticoagulation (per PECARN or Canadian CT rules)"
      - "Return to play: Graded protocol, not same day even if asymptomatic (increased second impact risk)"
      - "Post-concussion syndrome: Symptoms >3 months in 10-15%, headache most common"
      - "Cognitive rest: Limit screen time, reading, work/school initially (24-48h), then gradual return"
      - "Avoid NSAIDs first 24-48h: Theoretical bleeding risk, use acetaminophen for headache"
    management:
      - "Acute: Rest 24-48 hours (physical and cognitive), avoid screens, sleep hygiene"
      - "Symptom-limited activity: Gradual return to activities as symptoms allow, don't push through pain"
      - "Return to play protocol: (1) Rest, (2) light aerobic, (3) sport-specific, (4) non-contact, (5) full contact, (6) game play"
      - "Each step 24 hours: If symptoms return, drop back to previous step"
      - "Persistent symptoms >2 weeks: Neurology or sports medicine referral"
    tests:
      - "CT head: Not needed if low risk (PECARN/Canadian rules), obtain if LOC, vomiting, severe mechanism, anticoagulation"
      - "Concussion assessment tools: SCAT5 (Sport Concussion Assessment Tool), ImPACT testing"
      - "Cognitive testing: If symptoms persist >2 weeks"
    referrals:
      - "Neurology or sports medicine if: Symptoms persist >2 weeks, multiple concussions, severe symptoms"
      - "Neuropsychology if: Cognitive symptoms affecting school/work"
    icd10:
      - S06.0X0A  # Concussion without loss of consciousness
    snomed:
      - "110030002"  # Concussion injury of brain

  - id: NEU-SPINAL-STENOSIS
    label: Lumbar Spinal Stenosis
    presentations:
      - back pain radiating to legs
      - neurogenic claudication (pain worse with walking, standing)
      - relief with sitting or leaning forward
      - numbness in legs
      - typically older adults
      - "Neurogenic claudication: Leg pain/weakness with walking, relieved by sitting/flexion"
      - "Shopping cart sign: Relief when leaning forward on cart (flexion opens canal)"
      - "Bilateral leg symptoms common (vs unilateral in disc herniation)"
      - "Degenerative: Facet joint hypertrophy, ligamentum flavum thickening, disc bulge"
    clinical_pearls:
