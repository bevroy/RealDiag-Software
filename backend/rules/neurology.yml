    presentations:
      - bilateral action tremor of hands
      - head tremor (yes-yes or no-no)
      - voice tremor
      - improves with alcohol
      - often family history
      - "Bilateral postural and kinetic tremor (4-12 Hz)"
      - "Improves at rest (vs Parkinson resting tremor)"
      - "Head tremor (50%): Yes-yes (vertical) or no-no (horizontal)"
      - "Voice tremor, difficulty with fine motor tasks (writing, drinking)"
    clinical_pearls:
      - "Most common movement disorder (4-5% over age 65), autosomal dominant 50%"
      - "Action tremor: Postural (arms outstretched) and kinetic (reaching for object), worse with intention"
      - "Alcohol responsive (50-70%): Transient improvement with alcohol (diagnostic clue)"
      - "Propranolol 40-320mg/day: First-line, reduces tremor 50-70% in 60% of patients"
      - "Primidone: Alternative first-line, start low (12.5-25mg qhs) to avoid acute toxicity"
      - "DBS: Thalamic stimulation for refractory disabling tremor"
    management:
      - "First-line: Propranolol 40mg BID, titrate to 80-320mg/day (or metoprolol if asthma)"
      - "Alternative: Primidone 12.5-25mg qhs, titrate slowly to 250mg qhs (acute toxicity common if start high)"
      - "Second-line: Gabapentin 300-2400mg/day, topiramate 25-400mg/day"
      - "Botulinum toxin: For head or voice tremor if meds ineffective"
      - "Deep brain stimulation (DBS): Thalamic VIM nucleus for severe disabling tremor refractory to meds"
    tests:
      - "Clinical diagnosis: Bilateral postural/kinetic tremor, no other neuro signs"
      - "Distinguish from Parkinson: ET is action tremor (worse with movement), PD is resting tremor (improves with movement)"
      - "No imaging needed: Unless atypical features (asymmetric, rigidity, bradykinesia)"
    referrals:
      - "Neurology if: Atypical features, uncertain diagnosis, refractory to first-line meds"
      - "DBS evaluation if: Severe disabling tremor despite medication optimization"
