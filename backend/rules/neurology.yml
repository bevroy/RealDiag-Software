      - "Metastatic brain tumors: More common than primary (10:1), from lung, breast, melanoma, renal, colon"
      - "MRI with contrast: Gadolinium enhancement differentiates high-grade (enhances) vs low-grade (no enhancement)"
      - "Dexamethasone: Reduces vasogenic edema, improves symptoms rapidly"
      - "Glioblastoma: Median survival 15 months with surgery + radiation + temozolomide"
