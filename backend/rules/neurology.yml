      - "Red flags: Cauda equina (saddle anesthesia, bowel/bladder dysfunction, severe weakness) - emergency surgery"
      - "MRI lumbar spine: Shows stenosis degree, but correlation with symptoms variable (many asymptomatic stenosis)"
      - "Surgery: Laminectomy if conservative fails and significant functional impairment"
