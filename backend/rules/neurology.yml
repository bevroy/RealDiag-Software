  - id: NEU-SCIATICA
    label: Sciatica
    presentations:
      - radiating pain from lower back to leg
      - follows sciatic nerve distribution
      - numbness, tingling, weakness
      - often due to herniated disc
      - positive straight leg raise test
      - "Sharp shooting pain from buttock down posterior leg to foot"
      - "Dermatomal distribution: L5 (lateral leg, dorsal foot) or S1 (posterior leg, plantar foot)"
      - "Weakness: L5 (foot drop, ankle dorsiflexion), S1 (unable to toe stand, plantar flexion)"
      - "Herniated disc (90%): L4-L5 (affects L5 root) or L5-S1 (affects S1 root)"
    clinical_pearls:
      - "Natural history: 80-90% improve with conservative management over 6-12 weeks"
      - "Straight leg raise: Positive if pain <60 degrees leg elevation (80% sensitive, 40% specific)"
      - "Crossed straight leg raise: Contralateral leg raise reproduces pain (95% specific for herniated disc)"
      - "Red flags: Cauda equina (saddle anesthesia, bladder/bowel dysfunction), progressive weakness, fever"
      - "MRI lumbar spine: Not needed unless red flags or failed conservative therapy >6 weeks"
    management:
      - "First 6 weeks: NSAIDs (ibuprofen 600-800mg TID), remain active (bed rest not helpful)"
      - "Physical therapy: McKenzie exercises (extension-based), core strengthening after acute phase"
      - "Neuropathic pain: Gabapentin 300-900mg TID or pregabalin 75-150mg BID if radicular pain prominent"
      - "Avoid opioids: Not superior to NSAIDs, high abuse risk, delays recovery"
      - "Epidural steroid injection: Consider if failed NSAIDs + PT x6 weeks, provides 3-6 months relief"
      - "Surgery (microdiscectomy): If failed conservative x6-12 weeks, progressive weakness, or cauda equina"
    tests:
      - "Straight leg raise: Supine, passively raise leg - positive if pain <60 degrees"
      - "MRI lumbar spine: If red flags, failed conservative x6 weeks, or considering surgery (shows disc herniation, nerve compression)"
      - "X-ray lumbar spine: Rule out fracture, spondylolisthesis, but doesn't show disc"
      - "Neurologic exam: Check strength (L5 dorsiflexion, S1 plantarflexion), reflexes (L4 patellar, S1 Achilles)"
    referrals:
      - "Neurosurgery or orthopedic spine if: Cauda equina (emergency), progressive weakness, failed conservative x6-12 weeks"
      - "Physical therapy: First-line conservative management"
    icd10:
      - M54.30   # Sciatica, unspecified side
    snomed:
      - "23056005"   # Sciatica

  - id: NEU-NARCOLEPSY
    label: Narcolepsy
    presentations:
      - excessive daytime sleepiness
      - cataplexy (sudden muscle weakness with emotion)
      - sleep paralysis
      - hypnagogic hallucinations
      - automatic behaviors
      - "Excessive daytime sleepiness (EDS): Overwhelming sleepiness despite adequate nighttime sleep"
      - "Cataplexy (60-70%): Sudden bilateral muscle weakness triggered by emotion (laughter, surprise)"
      - "Sleep paralysis: Inability to move when falling asleep or waking up"
      - "Hypnagogic/hypnopompic hallucinations: Vivid dreams while falling asleep or waking"
    clinical_pearls:
      - "Narcolepsy type 1: With cataplexy (low CSF hypocretin-1), HLA-DQB1*06:02 (98%)"
      - "Narcolepsy type 2: Without cataplexy (normal hypocretin)"
      - "Onset typically age 10-30, often misdiagnosed as depression or epilepsy"
      - "MSLT (multiple sleep latency test): Mean sleep latency <8 min + ≥2 SOREMPs (sleep-onset REM)"
      - "Treatment: Modafinil/armodafinil for EDS, sodium oxybate for cataplexy"
    management:
      - "Scheduled naps: 15-20 minute naps 2-3x daily (non-pharmacologic foundation)"
      - "Excessive sleepiness: Modafinil 200-400mg AM (or armodafinil 150-250mg AM)"
      - "Alternative stimulants: Methylphenidate 20-60mg/day, dextroamphetamine 10-60mg/day"
      - "Cataplexy: Sodium oxybate 4.5-9g divided into 2 doses at night (controls both EDS and cataplexy)"
      - "Antidepressants for cataplexy: Venlafaxine 75-150mg, SSRIs (fluoxetine, sertraline)"
    tests:
      - "Polysomnography (overnight): Rule out sleep apnea, shows decreased sleep latency"
      - "MSLT (next day): Mean sleep latency <8 min + ≥2 sleep-onset REM periods (SOREMPs)"
      - "Hypocretin-1 (CSF): <110 pg/mL diagnostic for narcolepsy type 1 (not routinely done)"
      - "HLA-DQB1*06:02: Present in 98% of narcolepsy type 1 (not diagnostic, many normal people have it)"
    referrals:
      - "Sleep medicine: For diagnosis confirmation (MSLT), treatment initiation"
      - "Neurology: For complex cases, cataplexy management"
    icd10:
      - G47.419  # Narcolepsy without cataplexy
    snomed:
      - "60380001"   # Narcolepsy
