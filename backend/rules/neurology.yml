  - id: NEU-HYDROCEPHALUS
    label: Hydrocephalus
    presentations:
      - headache, nausea, vomiting
      - gait disturbance, cognitive decline, urinary incontinence (NPH triad)
      - papilledema
      - enlarged ventricles on imaging
      - "Normal pressure hydrocephalus (NPH): Triad of gait apraxia, dementia, urinary incontinence"
      - "Gait abnormality: Magnetic gait (feet stuck to floor), wide-based, shuffling"
      - "Cognitive decline: Bradyphrenia, executive dysfunction"
      - "Urinary incontinence: Urgency initially, then frank incontinence"
    clinical_pearls:
      - "NPH triad: Wet (urinary incontinence), Wacky (dementia), Wobbly (gait disturbance) - recall 'wet, wacky, wobbly'"
      - "Gait usually first symptom (95%), then cognitive (75%), then urinary (50%)"
      - "Reversible dementia: Shunt-responsive if diagnosed early"
      - "Large-volume LP (30-50 mL): Temporary improvement in gait predicts shunt response (90% PPV)"
      - "Ventriculoperitoneal shunt: 50-80% improve after shunting, gait improves most, cognition variable"
    management:
      - "Diagnostic LP: Remove 30-50 mL CSF, test gait before and 2-4 hours after (improvement predicts shunt response)"
      - "Timed gait test: 25-foot walk timed before and after LP (>10% improvement suggests shunt-responsive)"
      - "Ventriculoperitoneal (VP) shunt: Neurosurgery placement, diverts CSF to peritoneum"
      - "Shunt complications: Over-drainage (subdural hematoma), under-drainage (recurrence), infection (1-2%)"
      - "Post-shunt: Serial imaging, adjust shunt valve pressure if needed"
    tests:
      - "MRI brain: Enlarged ventricles (Evans index >0.3), narrow sulci, periventricular T2 hyperintensity"
      - "High-volume LP: Remove 30-50 mL, test gait improvement (predicts shunt response)"
      - "Gait testing: 25-foot timed walk before and after LP"
      - "Cognitive testing: MMSE, MoCA before and after LP"
    referrals:
      - "Neurosurgery for: Shunt evaluation and placement"
      - "Neurology for: Diagnosis confirmation, prognostic LP"
    icd10:
      - G91.9    # Hydrocephalus, unspecified
      - G91.2    # Normal pressure hydrocephalus
    snomed:
      - "230745008"  # Hydrocephalus

