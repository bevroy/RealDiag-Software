family: neurology
version: 0.1.0
source: "RealDiag Neurology Core Rules"
rules:

  - id: NEU-SAH
    label: Nontraumatic subarachnoid hemorrhage
    presentations:
      - sudden severe thunderclap headache
      - neck stiffness, altered mental status
      - sentinel bleed may precede rupture
      - worst headache of life reaching maximum intensity in seconds
      - Photophobia, nausea, vomiting
      - Syncope at onset (50%)
      - Focal neurologic deficits if mass effect
    clinical_pearls:
      - "Ruptured saccular aneurysm (85%), perimesencephalic venous bleed (10%), AVM, trauma"
      - "CT head 95% sensitive if <6 hours, sensitivity decreases over time"
      - "LP if CT negative and high suspicion: Xanthochromia (yellow CSF) confirms SAH"
      - "Hunt-Hess grade I-V predicts outcomes: I (mild headache) to V (coma)"
      - "Nimodipine 60mg PO q4h x21 days: Prevents vasospasm, improves outcomes"
      - "Re-bleeding risk highest in first 24hr: Urgent aneurysm repair"
    management:
      - "Immediate: Noncontrast CT head, if negative → LP (tube 4 for xanthochromia), neurosurgery consult"
      - "CTA or MRA: Identify aneurysm location for endovascular coiling vs surgical clipping"
      - "Nimodipine 60mg PO/NG q4h: Start immediately, continue 21 days to prevent vasospasm"
      - "BP control: Nicardipine or labetalol to SBP <160 (avoid hypotension)"
      - "Disposition: ICU admission, neurosurgery/IR for urgent aneurysm repair, daily TCDs to monitor vasospasm"
    tests:
      - "Noncontrast CT head: Blood in subarachnoid space (95% sensitive if <6hr)"
      - "LP if CT negative: Xanthochromia (tube 4 centrifuged, yellow supernatant from bilirubin)"
      - "CTA head/neck or MRA: Identify aneurysm location, size, morphology"
      - "Transcranial Doppler (TCD): Daily monitoring for vasospasm days 4-14"
    referrals:
      - "Neurosurgery EMERGENTLY: Aneurysm coiling (endovascular) or clipping (open)"
      - "ICU admission for all SAH patients"
    icd10:
      - I60.9    # Nontraumatic subarachnoid hemorrhage, unspecified
    snomed:
      - "21454007"   # Subarachnoid hemorrhage

  - id: NEU-ICH
    label: Spontaneous intracerebral hemorrhage
    presentations:
      - sudden severe headache with focal deficits
      - nausea, vomiting, altered consciousness
      - hypertension common risk factor
      - Markedly elevated BP (often >200/120)
      - Seizures (10-15%, more common than ischemic stroke)
      - "Common locations: Basal ganglia (hypertension), lobar (amyloid angiopathy)"
    clinical_pearls:
      - "Reverse anticoagulation immediately: Vitamin K 10mg IV + PCC (or FFP) for warfarin"
      - "BP lowering: Target SBP 140-160 mmHg (lower mortality, but avoid <140)"
      - "Neurosurgery consult: For cerebellar hemorrhage >3cm, hydrocephalus, mass effect"
      - "Hold tPA/anticoagulation: Contraindicated, will worsen bleeding"
      - "ICH score predicts mortality: GCS + ICH volume + IVH + age + location"
    management:
      - "Immediate: Noncontrast CT head, reverse anticoagulation, BP control, neurosurgery consult"
      - "Reverse anticoagulation: Warfarin (PCC + vit K), DOACs (idarucizumab for dabigatran, andexanet for Xa inhibitors)"
      - "BP control: Nicardipine 5mg/hr IV titrated to SBP 140-160 (avoid aggressive lowering)"
      - "ICP management: Elevate HOB 30°, maintain CPP >60, consider mannitol/hypertonic saline if herniation"
      - "Disposition: ICU admission, neurosurgery evaluation for surgical evacuation vs observation"
    tests:
      - "Noncontrast CT head: Hyperdense blood in brain parenchyma"
      - "CT angiography (CTA): If concern for vascular malformation, tumor, or secondary cause"
      - "MRI brain: If lobar hemorrhage (rule out amyloid angiopathy, tumor)"
      - "Coagulation studies: PT/INR, aPTT, platelet count"
    referrals:
      - "Neurosurgery URGENTLY: For cerebellar hemorrhage >3cm, hydrocephalus, significant mass effect"
      - "ICU admission for all ICH patients"
    icd10:
      - I61.9    # Nontraumatic intracerebral hemorrhage, unspecified
    snomed:
      - "274100004"  # Cerebral hemorrhage

  - id: NEU-ISCH-STROKE
    label: Ischemic stroke (cerebral infarction)
    presentations:
      - Acute focal neurological deficit (sudden onset)
      - Hemiparesis/hemiplegia, facial droop (FAST criteria)
      - Aphasia (expressive or receptive), dysarthria
      - Visual field defect, diplopia, ataxia
      - Sensory loss (hemibody), neglect syndrome
      - NIHSS score (0-42) quantifies severity
      - Time of symptom onset critical (thrombolysis window <4.5 hours)
      - "Large vessel occlusion: Consider thrombectomy up to 24 hours"
    clinical_pearls:
      - "FAST: Face drooping, Arm weakness, Speech difficulty, Time to call 911"
      - "CT head FIRST to rule out hemorrhage before thrombolysis"
      - "tPA eligibility: <4.5 hours, no contraindications, significant deficit"
      - "Blood pressure management: Permissive hypertension unless extreme (>220/120)"
      - "Aspirin 325mg after hemorrhage excluded (within 24-48 hours)"
    sensitivity: 0.88
    specificity: 0.95
    icd10:
      - I63.9    # Cerebral infarction, unspecified
      - I63.50   # Cerebral infarction due to occlusion/stenosis of unspecified cerebral artery
    snomed:
      - "422504002"  # Ischemic stroke

  - id: NEU-TIA
    label: Transient ischemic attack (TIA)
    presentations:
      - Transient focal neurological symptoms (typically <1 hour duration)
      - Complete resolution within 24 hours (by definition)
      - No acute infarction on DWI MRI (tissue-based definition)
      - "Same symptoms as stroke: weakness, aphasia, visual loss, ataxia"
      - "High early stroke risk: ABCD2 score predicts 2-day stroke risk"
      - "Crescendo TIAs (multiple in 24 hours): Very high risk, urgent evaluation"
    clinical_pearls:
      - "ABCD2 score: Age, BP, Clinical features, Duration, Diabetes (0-7 points)"
      - "High risk (ABCD2 ≥4): 4% stroke risk at 2 days, admit for workup"
      - "Urgent workup: Carotid imaging (US or CTA), echocardiogram, telemetry"
      - "Dual antiplatelet therapy (aspirin + clopidogrel) for 21 days reduces stroke risk"
      - "50-99% carotid stenosis: Consider urgent CEA/CAS within 2 weeks"
    sensitivity: 0.75
    specificity: 0.92
    icd10:
      - G45.9    # Transient cerebral ischemic attack, unspecified
    snomed:
      - "266257000"  # Transient ischemic attack

  - id: NEU-EPILEPSY
    label: Epilepsy, unspecified
    presentations:
      - convulsions, loss of consciousness, altered awareness
      - postictal confusion
      - may have aura or automatisms
      - Recurrent unprovoked seizures (≥2 seizures >24 hours apart)
      - "Generalized: Tonic-clonic, absence, myoclonic, atonic"
      - "Focal: Aware vs impaired awareness, with or without motor symptoms"
    clinical_pearls:
      - "Diagnosis: ≥2 unprovoked seizures OR 1 seizure + high recurrence risk (>60% at 10 years)"
      - "EEG: Interictal epileptiform discharges support diagnosis (50% yield, repeat improves to 80%)"
      - "MRI brain: Rule out structural cause (tumor, vascular malformation, hippocampal sclerosis)"
      - "First-line AEDs: Levetiracetam (broad spectrum, few interactions), lamotrigine, valproate"
      - "Focal seizures: Levetiracetam, lamotrigine, carbamazepine, oxcarbazepine"
      - "Generalized seizures: Valproate (avoid women of childbearing age), levetiracetam, lamotrigine"
    management:
      - "First seizure: Neuro consult, EEG, MRI brain, consider AED if high recurrence risk"
      - "Recurrent seizures: Start AED (levetiracetam 500mg BID or lamotrigine 25mg daily titrate)"
      - "Monotherapy first: Start one AED, titrate to effect, if fails try alternative monotherapy"
      - "Seizure precautions: No driving (state-specific, typically 3-12 months seizure-free), no swimming alone, no heights"
      - "Breakthrough seizure: Check AED levels, assess compliance, identify triggers (sleep deprivation, alcohol, meds)"
    tests:
      - "EEG: Interictal spikes, sharp waves (50% first EEG, 80% after repeat)"
      - "MRI brain with epilepsy protocol: Hippocampal sclerosis, cortical dysplasia, tumors"
      - "AED levels: Phenytoin, valproate, carbamazepine (not needed for levetiracetam, lamotrigine)"
      - "Metabolic panel: Rule out electrolyte abnormalities triggering seizures"
    referrals:
      - "Neurology for: New-onset seizures, medication management, refractory epilepsy"
      - "Epilepsy surgery evaluation if: Drug-resistant (failed ≥2 appropriate AEDs)"
    icd10:
      - G40.909  # Epilepsy, unspecified, not intractable, without status epilepticus
      - R56.9    # Unspecified convulsions
    snomed:
      - "313307000"  # Epileptic seizure

  - id: NEU-STATUS-EPILEPTICUS
    label: Status epilepticus
    presentations:
      - prolonged seizure >5 minutes or recurrent seizures without recovery
      - medical emergency requiring immediate treatment
      - Generalized tonic-clonic (most common) or focal with impaired awareness
      - Altered consciousness, coma
      - High mortality (10-20%) if treatment delayed
      - "Causes: Medication noncompliance, CNS infection, metabolic, withdrawal"
    clinical_pearls:
      - "Time is brain: Start treatment at 5 minutes, not 30 minutes (old definition outdated)"
      - "Benzodiazepines FIRST: Lorazepam 0.1mg/kg IV (or diazepam, midazolam IM)"
      - "If benzos fail (refractory): Fosphenytoin 20 PE/kg IV or levetiracetam 60mg/kg IV"
      - "If still seizing: Intubation + propofol or midazolam infusion, EEG monitoring"
      - "Check glucose immediately (hypoglycemia can mimic seizure)"
      - "Thiamine 100mg IV before dextrose if malnourished/alcoholic"
    management:
      - "0-5 min: ABCs, O2, IV access, check glucose, give thiamine if indicated"
      - "5-10 min: Lorazepam 4mg IV (may repeat once) or midazolam 10mg IM"
      - "10-20 min: Fosphenytoin 20 PE/kg IV or levetiracetam 60mg/kg IV (max 4500mg)"
      - "20-40 min: Refractory status - intubate, propofol/midazolam drip, ICU, EEG"
      - "Workup: Labs (CBC, CMP, tox screen, AED levels), LP if concern for infection, MRI brain"
    tests:
      - "Glucose: Fingerstick immediately (hypoglycemia can cause seizures)"
      - "Labs: CBC, CMP (lytes, Ca, Mg), AED levels if on meds, tox screen"
      - "LP: If fever or concern for meningitis/encephalitis (after CT if focal deficits)"
      - "MRI brain: After stabilization to rule out structural cause"
      - "EEG: Continuous monitoring if refractory status or persistent altered mental status"
    referrals:
      - "Neurology STAT for refractory status epilepticus"
      - "ICU admission for all status epilepticus requiring >1 dose of benzos"
    icd10:
      - G41.9    # Status epilepticus, unspecified
    snomed:
      - "230456007"  # Status epilepticus

  - id: NEU-HEADACHE-MIGRAINE
    label: Migraine without aura
    presentations:
      - Recurrent unilateral (60%) or bilateral throbbing headache
      - Moderate to severe intensity, worsens with activity
      - "Associated: Nausea/vomiting, photophobia, phonophobia"
      - Duration 4-72 hours if untreated
      - "Aura (20-30%): Visual (scintillating scotoma), sensory, speech disturbance"
      - "Migraine with brainstem aura: Vertigo, diplopia, ataxia, dysarthria"
      - "Chronic migraine: ≥15 headache days/month for >3 months (≥8 are migraines)"
      - "ICHD-3 criteria: ≥5 attacks meeting duration, location, quality criteria"
    clinical_pearls:
      - "Acute treatment: NSAIDs, triptans (within 2 hours of onset), antiemetics"
      - "Triptans contraindicated in hemiplegic migraine, basilar migraine, CAD"
      - "Prophylaxis if ≥4 attacks/month: Propranolol, topiramate, CGRP inhibitors"
      - "Medication overuse headache: >10 days/month analgesic use for >3 months"
      - "Red flags requiring imaging: New onset >50, thunderclap, focal neuro deficits"
    sensitivity: 0.81
    specificity: 0.75
    icd10:
      - G43.009  # Migraine without aura
      - G43.109  # Migraine with aura
      - G43.709  # Chronic migraine without aura
    snomed:
      - "37796009"   # Migraine

  - id: NEU-HEADACHE-TENSION
    label: Tension-type headache
    presentations:
      - bilateral band-like pressure headache
      - mild to moderate intensity
      - not aggravated by routine physical activity
      - "Pressing/tightening quality (non-pulsating)"
      - Duration 30 minutes to 7 days
      - "May have photophobia OR phonophobia (not both)"
      - No nausea or vomiting (distinguishes from migraine)
    clinical_pearls:
      - "Most common primary headache disorder (lifetime prevalence 40-80%)"
      - "Episodic (<15 days/month) vs chronic (≥15 days/month for >3 months)"
      - "Associated with neck muscle tightness, stress, poor posture, lack of sleep"
      - "Medication overuse headache: >10 days/month analgesic use transforms episodic to chronic"
      - "Red flags requiring imaging: New onset >50, thunderclap, focal deficits, fever, cognitive changes"
    management:
      - "Acute: NSAIDs (ibuprofen 400-800mg, naproxen 500mg) or acetaminophen 1000mg"
      - "Avoid opioids and butalbital: High abuse potential, worsen chronic headaches"
      - "Chronic tension headache prophylaxis: Amitriptyline 10-75mg qhs (most effective)"
      - "Non-pharmacologic: Physical therapy, stress management, CBT, biofeedback, trigger point injections"
      - "Medication withdrawal if overuse: Gradual taper, expect rebound headaches x2-4 weeks"
    tests:
      - "Clinical diagnosis: No imaging needed if typical presentation and normal neuro exam"
      - "Imaging (CT or MRI) if: Red flags, new onset >50, progressive, focal neuro findings"
      - "Headache diary: Track frequency, triggers, medication use"
    referrals:
      - "Neurology if: Chronic refractory headaches, medication overuse, unclear diagnosis"
      - "Physical therapy for: Cervicogenic component, muscle tension"
    icd10:
      - G44.209  # Tension-type headache, unspecified
    snomed:
      - "398057008"  # Tension headache

  - id: NEU-BPPV
    label: Benign paroxysmal positional vertigo
    presentations:
      - brief episodes of vertigo with head position changes
      - positive Dix-Hallpike maneuver
      - nystagmus with characteristic pattern
      - "Vertigo lasting seconds to 1 minute with head movement"
      - "Triggered by: Rolling over in bed, looking up, bending over"
      - "Posterior canal (90%): Upbeat-torsional nystagmus toward affected ear"
      - "No hearing loss or tinnitus (distinguishes from Meniere's)"
    clinical_pearls:
      - "Most common cause of vertigo (20-30% of all vertigo)"
      - "Otoconia (calcium carbonate crystals) dislodge into semicircular canals"
      - "Dix-Hallpike test: Positive = vertigo + nystagmus with 30-second delay, fatigues with repetition"
      - "Epley maneuver: 80% success rate after 1-2 treatments"
      - "Recurrence rate: 50% at 5 years, may need repeat Epley"
    management:
      - "Dix-Hallpike maneuver: Patient sits upright, turn head 45° to affected side, rapidly lay supine with head hanging 20°"
      - "Epley (canalith repositioning) maneuver: 5 positions held x30 seconds each to move crystals out of canal"
      - "Epley steps: (1) Dix-Hallpike position, (2) rotate head 90° to opposite side, (3) roll onto side, (4) sit upright"
      - "Meclizine 25mg TID: Symptomatic relief for severe nausea, but doesn't speed recovery (avoid chronic use)"
      - "Vestibular exercises (Brandt-Daroff): If Epley fails, home exercises to habituate"
    tests:
      - "Dix-Hallpike maneuver: Diagnostic test, positive = vertigo + upbeat-torsional nystagmus"
      - "No imaging needed: Unless atypical features (central nystagmus, hearing loss, focal deficits)"
      - "Audiometry if: Hearing loss present (consider Meniere's, acoustic neuroma)"
    referrals:
      - "ENT or vestibular physical therapy if: Refractory to Epley maneuvers (after 2-3 attempts)"
      - "Neurology if: Atypical features, central vertigo suspected"
    icd10:
      - H81.1     # Benign paroxysmal positional vertigo
    snomed:
      - "41598007"   # Benign paroxysmal positional vertigo

  - id: NEU-TN
    label: Trigeminal neuralgia
    presentations:
      - sudden severe unilateral facial pain
      - electric shock-like sensations
      - triggered by touch, chewing, or talking
      - "Intense stabbing pain lasting seconds to 2 minutes"
      - "Affects V2 (maxillary) or V3 (mandibular) divisions most commonly"
      - "Trigger zones: Light touch to face, wind, brushing teeth"
      - Unilateral facial spasm may accompany pain
    clinical_pearls:
      - "Classic (idiopathic) TN: Vascular compression of trigeminal nerve root (90%)"
      - "Secondary TN: MS (2-5% of MS patients), tumor, vascular malformation - younger age, bilateral"
      - "Carbamazepine 200mg BID: First-line treatment, 70-80% response rate"
      - "MRI brain with FIESTA sequence: Rule out MS plaques, tumor, vascular compression"
      - "Surgical options if refractory: Microvascular decompression (70-80% long-term cure)"
    management:
      - "First-line: Carbamazepine 200mg BID, titrate to 400-800mg BID (check levels, aim 4-12 mcg/mL)"
      - "Alternative: Oxcarbazepine 300mg BID (fewer side effects than carbamazepine), gabapentin, pregabalin"
      - "Monitor: CBC, CMP (carbamazepine can cause hyponatremia, bone marrow suppression)"
      - "Baclofen: Add-on if inadequate response to carbamazepine (10mg TID, titrate to 60-80mg/day)"
      - "Surgical: Microvascular decompression (MVD) if refractory to meds - 70-80% long-term pain-free"
    tests:
      - "MRI brain with FIESTA or CISS sequence: Visualize neurovascular compression, rule out MS, tumor"
      - "Clinical diagnosis: Typical triggers, brief electric shock pain, normal neuro exam"
      - "Carbamazepine level: Therapeutic 4-12 mcg/mL"
      - "CBC, CMP: Baseline and periodic monitoring on carbamazepine (hyponatremia, bone marrow suppression)"
    referrals:
      - "Neurology for: Atypical features (age <40, bilateral, sensory loss), refractory to first-line therapy"
      - "Neurosurgery if: Failed medical management, consider microvascular decompression"
    icd10:
      - G50.0     # Trigeminal neuralgia
    snomed:
      - "31681005"   # Trigeminal neuralgia

  - id: NEU-MG
    label: Myasthenia gravis
    presentations:
      - fluctuating muscle weakness, worsens with activity
      - ptosis, diplopia, bulbar symptoms
      - autoimmune disorder of neuromuscular junction
      - "Ocular symptoms (85% present with): Ptosis, diplopia"
      - "Bulbar symptoms: Dysphagia, dysarthria, facial weakness"
      - "Generalized weakness: Proximal limb weakness, respiratory muscle involvement"
      - Weakness improves with rest, worsens throughout day
    clinical_pearls:
      - "Autoimmune: Antibodies block ACh receptors at NMJ (anti-AChR 85%, anti-MuSK 5%)"
      - "Ice pack test: Ptosis improves after ice on closed eyelid x2 min (80% sensitive)"
      - "Pyridostigmine 60mg TID-QID: Acetylcholinesterase inhibitor, symptomatic relief"
      - "Immunosuppression: Prednisone, azathioprine, mycophenolate for long-term control"
      - "Thymectomy: 30% have thymoma (remove), 50% improve after thymectomy even without thymoma"
      - "Myasthenic crisis: Respiratory failure from weakness, needs ICU + plasmapheresis/IVIG"
    management:
      - "Symptomatic: Pyridostigmine 60mg PO q4-6h (max 600mg/day), adjust based on response"
      - "Immunosuppression: Prednisone 1mg/kg daily (may worsen first 2 weeks, hospitalize), taper after improvement"
      - "Steroid-sparing: Azathioprine 2-3 mg/kg/day or mycophenolate 1000mg BID (takes 6-12 months)"
      - "Myasthenic crisis: ICU admission, plasmapheresis or IVIG, mechanical ventilation if needed"
      - "Thymectomy: For thymoma (always) or generalized MG age <65 without thymoma (improves outcomes)"
    tests:
      - "Serology: Anti-AChR antibodies (85% generalized, 50% ocular), anti-MuSK (5%, AChR-negative)"
      - "Ice pack test: Apply ice to closed eyelid x2 min, ptosis improves (80% sensitive)"
      - "EMG: Repetitive nerve stimulation shows >10% decrement (80% sensitive)"
      - "CT chest: Thymoma present in 10-15% (anterior mediastinal mass)"
      - "Edrophonium (Tensilon) test: Rarely used (cardiac risks), ice pack test preferred"
    referrals:
      - "Neurology for: Diagnosis confirmation, immunosuppression management"
      - "Cardiothoracic surgery: Thymectomy (if thymoma or generalized MG age <65)"
      - "ICU if: Myasthenic crisis (respiratory failure), FVC <15 mL/kg or NIF <-30 cmH2O"
    icd10:
      - G70.00   # Myasthenia gravis without (acute) exacerbation
    snomed:
      - "91637004"   # Myasthenia gravis

  - id: NEU-MENINGITIS
    label: Meningitis
    presentations:
      - "Classic triad: Fever, headache, neck stiffness (only 44% have all three)"
      - Altered mental status, confusion, lethargy
      - Photophobia, phonophobia, nausea/vomiting
      - "Kernig sign: Resistance to knee extension with hip flexed"
      - "Brudzinski sign: Hip flexion when neck is flexed"
      - Petechial rash suggests N. meningitidis (medical emergency)
      - Seizures (20-40% of bacterial cases)
    clinical_pearls:
      - "Do NOT delay antibiotics for LP if clinical suspicion high"
      - "Empiric antibiotics: Vancomycin + ceftriaxone (+ ampicillin if >50 or immunocompromised)"
      - "Dexamethasone 0.15mg/kg before or with first antibiotic dose (bacterial)"
      - "LP opening pressure, cell count, glucose, protein, Gram stain, culture"
      - "Bacterial: Elevated WBC (>1000), low glucose (<40), high protein (>200)"
      - "Viral: Lymphocytic pleocytosis (<300), normal glucose, mildly elevated protein"
    sensitivity: 0.95
    specificity: 0.94
    icd10:
      - G03.9    # Meningitis, unspecified
      - G00.9    # Bacterial meningitis, unspecified
      - A87.9    # Viral meningitis, unspecified
    snomed:
      - "7180009"    # Meningitis

  - id: NEU-ENCEPHALITIS
    label: Encephalitis
    presentations:
      - fever, headache, altered mental status
      - seizures, focal neurological deficits
      - often viral (HSV, arbovirus)
      - "Classic triad: Fever, headache, altered mental status (distinguishes from meningitis)"
      - Personality changes, confusion, memory impairment
      - Seizures (50% of HSV encephalitis)
      - "Viral: HSV-1 (most common, 10-20%), VZV, EBV, enteroviruses, arboviruses (West Nile)"
    clinical_pearls:
      - "HSV encephalitis: Most common fatal sporadic encephalitis, temporal lobe involvement"
      - "Start acyclovir empirically if suspicion: Do NOT wait for PCR results (high mortality if delayed)"
      - "MRI: Temporal lobe inflammation (HSV), thalamic (arbovirus), basal ganglia (EV-71)"
      - "LP: Lymphocytic pleocytosis, elevated protein, normal glucose (viral pattern)"
      - "HSV PCR: 95% sensitive after 72 hours, may be negative early (repeat if high suspicion)"
    management:
      - "Empiric acyclovir 10mg/kg IV q8h: Start immediately if encephalitis suspected (covers HSV, VZV)"
      - "LP: Cell count, protein, glucose, HSV PCR, VZV PCR, bacterial culture, enterovirus PCR"
      - "MRI brain with contrast: Temporal lobe involvement suggests HSV"
      - "Supportive: Seizure management (levetiracetam 1000-1500mg BID), ICP monitoring if needed"
      - "Continue acyclovir x14-21 days if HSV confirmed (21 days for severe cases)"
    tests:
      - "LP: Lymphocytic pleocytosis (10-500 WBC), elevated protein (50-100), normal glucose, RBCs if HSV"
      - "HSV PCR (CSF): 95% sensitive after 72 hours, 98% specific (gold standard)"
      - "MRI brain: FLAIR hyperintensity in temporal lobes (HSV), thalamus (West Nile), basal ganglia (EV-71)"
      - "EEG: Periodic lateralized epileptiform discharges (PLEDs) in temporal lobe suggest HSV"
    referrals:
      - "Neurology STAT for diagnosis and management"
      - "ICU admission for: Altered mental status, seizures, respiratory compromise"
      - "Infectious disease consult: For atypical organisms, immunocompromised"
    icd10:
      - G04.90   # Encephalitis, unspecified
    snomed:
      - "45170000"   # Encephalitis

  - id: NEU-MS
    label: Multiple sclerosis
    presentations:
      - relapsing-remitting or progressive neurological symptoms
      - optic neuritis, sensory changes, weakness, ataxia
      - MRI with demyelinating lesions
      - "Optic neuritis (25% present with): Painful vision loss, RAPD"
      - "Sensory symptoms: Paresthesias, Lhermitte sign (electric shock with neck flexion)"
      - "Motor: Unilateral weakness, spasticity, hyperreflexia, Babinski sign"
      - "Cerebellar: Ataxia, intention tremor, nystagmus, dysarthria"
    clinical_pearls:
      - "McDonald criteria: Dissemination in time (2+ attacks) and space (2+ CNS lesions)"
      - "Relapsing-remitting MS (85%): Discrete attacks with full/partial recovery"
      - "Primary progressive MS (10%): Gradual worsening from onset without relapses"
      - "MRI: Periventricular white matter lesions (Dawson fingers), juxtacortical, infratentorial"
      - "OCT (optical coherence tomography): Retinal nerve fiber layer thinning predicts disability"
      - "Disease-modifying therapy (DMT): Start early to prevent disability"
    management:
      - "Acute relapse: Methylprednisolone 1g IV daily x3-5 days (speeds recovery, doesn't change long-term outcome)"
      - "First-line DMT: Interferon beta, glatiramer, teriflunomide, dimethyl fumarate"
      - "High-efficacy DMT (aggressive disease): Natalizumab, ocrelizumab, alemtuzumab"
      - "Symptomatic: Baclofen/tizanidine (spasticity), amantadine (fatigue), oxybutynin (bladder)"
      - "MRI monitoring: Annual MRI to assess disease activity and treatment response"
    tests:
      - "MRI brain/spine with contrast: Periventricular white matter lesions, enhancement indicates active inflammation"
      - "LP: Oligoclonal bands (95% MS, absent in serum), elevated IgG index"
      - "VEP (visual evoked potentials): Prolonged latency (optic nerve demyelination)"
      - "Serology: Check for NMO-IgG (aquaporin-4 antibody) to exclude neuromyelitis optica"
    referrals:
      - "Neurology for: Suspected MS, initiation of DMT, disease monitoring"
      - "Neuro-ophthalmology if: Optic neuritis, vision loss"
      - "Urology if: Neurogenic bladder, urinary retention"
    icd10:
      - G35      # Multiple sclerosis
    snomed:
      - "24700007"   # Multiple sclerosis

  - id: NEU-PARKINSONS
    label: Parkinson disease
    presentations:
      - resting tremor, rigidity, bradykinesia, postural instability
      - gradual onset, typically older adults
      - "Resting tremor: 4-6 Hz pill-rolling, unilateral initially, improves with movement"
      - "Bradykinesia: Slow movements, reduced arm swing, masked facies, micrographia"
      - "Rigidity: Cogwheel rigidity on passive movement"
      - "Postural instability: Stooped posture, shuffling gait, festination"
    clinical_pearls:
      - "Clinical diagnosis: Requires bradykinesia + tremor and/or rigidity"
      - "Dopaminergic deficiency: Degeneration of substantia nigra pars compacta"
      - "Carbidopa/levodopa: Gold standard, start when symptoms interfere with function"
      - "Honeymoon period: 3-5 years of good response, then motor fluctuations (wearing off, dyskinesias)"
      - "Non-motor symptoms: REM sleep behavior disorder, constipation, hyposmia, depression precede motor"
      - "DaTscan: SPECT imaging shows reduced striatal dopamine uptake (not routinely needed)"
    management:
      - "Start when functional impairment: Carbidopa/levodopa 25/100mg TID, titrate by 25/100mg q3-7days"
      - "Alternative first-line (age <65): Dopamine agonist (ropinirole, pramipexole) - delays motor complications"
      - "MAO-B inhibitors: Rasagiline 1mg daily or selegiline 5mg BID (mild symptoms, delays need for levodopa)"
      - "Motor fluctuations: COMT inhibitors (entacapone), amantadine (dyskinesias), MAO-B inhibitors"
      - "Deep brain stimulation (DBS): If motor fluctuations refractory to meds, age <70, good levodopa response"
    tests:
      - "Clinical diagnosis: No lab test required, diagnosis based on cardinal features"
      - "DaTscan (not routine): SPECT imaging shows reduced striatal dopamine transporter uptake"
      - "MRI brain: Rule out atypical parkinsonism (vascular, PSP, MSA) - normal in idiopathic PD"
      - "Response to levodopa: Improvement supports diagnosis (atypical parkinsonism doesn't respond)"
    referrals:
      - "Neurology (movement disorders): For diagnosis confirmation, medication management"
      - "Physical therapy: Gait training, fall prevention, Lee Silverman Voice Treatment (LSVT BIG)"
      - "DBS evaluation if: Motor fluctuations refractory to medication optimization"
    icd10:
      - G20      # Parkinson disease
    snomed:
      - "49049000"   # Parkinson disease

  - id: NEU-ALZHEIMERS
    label: Alzheimer disease
    presentations:
      - progressive memory loss and cognitive decline
      - impaired daily functioning
      - most common cause of dementia
      - "Early: Short-term memory loss, word-finding difficulty, disorientation"
      - "Middle: Behavioral changes, apraxia, agnosia, getting lost"
      - "Late: Unable to recognize family, incontinence, immobility"
      - Gradual onset and progression (vs vascular which is stepwise)
    clinical_pearls:
      - "Most common dementia (60-80%), age >65, prevalence doubles every 5 years"
      - "Amyloid plaques and neurofibrillary tangles: Pathologic hallmarks"
      - "MoCA or MMSE: Screening cognitive tests (MMSE 0-30, <24 suggests dementia)"
      - "Rule out reversible causes: B12, TSH, syphilis, depression (pseudo-dementia)"
      - "Cholinesterase inhibitors: Donepezil, rivastigmine, galantamine - modest benefit (2-3 points MMSE)"
      - "Memantine: NMDA antagonist for moderate-severe AD, can combine with cholinesterase inhibitor"
    management:
      - "Mild-moderate AD: Donepezil 5mg qhs, increase to 10mg after 4-6 weeks (or rivastigmine, galantamine)"
      - "Moderate-severe AD: Add memantine 5mg daily, titrate to 10mg BID over 4 weeks"
      - "Behavioral symptoms: Avoid antipsychotics if possible (black box warning, increased mortality)"
      - "Depression common (40%): SSRI (sertraline, citalopram) first-line"
      - "Caregiver support: Most important intervention, respite care, support groups, legal/financial planning"
    tests:
      - "MoCA or MMSE: Cognitive screening (MMSE <24 suggests dementia)"
      - "MRI brain: Hippocampal atrophy, rule out vascular disease, NPH, tumor"
      - "Labs: B12, TSH, syphilis (RPR), CBC, CMP to rule out reversible causes"
      - "Amyloid PET scan: Shows amyloid deposition (not routinely needed, expensive)"
      - "CSF biomarkers: Low Aβ42, elevated tau (research, not routine)"
    referrals:
      - "Neurology for: Atypical features (age <65, rapid progression, focal deficits)"
      - "Geriatrics or memory clinic: Comprehensive assessment, care coordination"
      - "Social work: Caregiver support, community resources, long-term care planning"
    icd10:
      - G30.9    # Alzheimer disease, unspecified
    snomed:
      - "26929004"   # Alzheimer disease

  - id: NEU-GBS
    label: Guillain-Barré syndrome
    presentations:
      - ascending weakness and areflexia
      - often follows infection
      - respiratory muscle involvement possible
      - "Acute inflammatory demyelinating polyneuropathy (AIDP, 90% in US)"
      - "Progressive symmetric weakness over days to 4 weeks"
      - "Areflexia: Loss of deep tendon reflexes (hallmark)"
      - "Preceding infection (70%): Campylobacter jejuni, CMV, EBV, Zika"
    clinical_pearls:
      - "Ascending paralysis: Starts legs, ascends to arms, trunk, face (30% need intubation)"
      - "Albuminocytologic dissociation: Elevated CSF protein (>45), normal WBC count"
      - "Respiratory monitoring: Serial FVC (intubate if <15 mL/kg or declining), NIF"
      - "IVIG or plasmapheresis: Equally effective, shorten recovery time"
      - "Axonal variants (Asia): Acute motor axonal neuropathy (AMAN), worse prognosis"
      - "Recovery: Weeks to months, 80% fully recover, 5% mortality"
    management:
      - "ICU monitoring: Serial FVC q4-6h, NIF (negative inspiratory force), intubate if FVC <15 mL/kg or declining"
      - "IVIG 0.4 g/kg/day x5 days OR plasmapheresis 5 sessions over 10-14 days (start within 2 weeks)"
      - "Supportive: DVT prophylaxis (heparin), monitor autonomic instability (arrhythmias, BP swings), pain control"
      - "Physical therapy: Early mobilization after acute phase to prevent contractures"
      - "Pain management: Gabapentin 300-900mg TID, carbamazepine for neuropathic pain"
    tests:
      - "LP: Elevated protein (>45 mg/dL, peaks at 4-6 weeks), normal WBC (<10 cells)"
      - "EMG/NCS: Demyelinating features (prolonged distal latencies, conduction block, slow velocities)"
      - "Pulmonary function: Serial FVC (intubate <15 mL/kg), NIF (<-30 cmH2O concerning)"
      - "Serology: Anti-GQ1b antibodies (Miller Fisher variant - ataxia, areflexia, ophthalmoplegia)"
    referrals:
      - "Neurology STAT: For diagnosis confirmation, IVIG vs plasmapheresis decision"
      - "ICU admission: All GBS patients need monitoring for respiratory failure"
      - "Physical medicine & rehab: Acute and long-term rehabilitation"
    icd10:
      - G61.0    # Guillain-Barré syndrome
    snomed:
      - "40956001"   # Guillain-Barré syndrome

  - id: NEU-ALS
    label: Amyotrophic lateral sclerosis (ALS)
    presentations:
      - progressive muscle weakness and atrophy
      - upper and lower motor neuron signs
      - fasciculations, spasticity, bulbar symptoms
      - "UMN signs: Hyperreflexia, spasticity, Babinski, clonus"
      - "LMN signs: Weakness, atrophy, fasciculations, hyporeflexia"
      - "Bulbar onset (25%): Dysarthria, dysphagia, tongue atrophy"
      - "Limb onset (75%): Asymmetric arm or leg weakness"
    clinical_pearls:
      - "El Escorial criteria: UMN + LMN signs in ≥3 regions (bulbar, cervical, thoracic, lumbar)"
      - "Riluzole 50mg BID: Only FDA-approved drug, extends survival 2-3 months"
      - "Median survival: 3-5 years from symptom onset (20% survive >5 years)"
      - "Respiratory failure: Most common cause of death, FVC <50% consider NIV"
      - "No sensory, bowel/bladder, cognitive involvement (classic - but FTD in 15%)"
      - "EMG: Widespread denervation (fibrillations, fasciculations) in ≥3 limbs"
    management:
      - "Riluzole 50mg BID: Start at diagnosis, may slow progression, monitor LFTs"
      - "Edaravone: IV infusion (60mg daily x14 days/month), may slow decline in early ALS"
      - "Multidisciplinary clinic: Neurology, pulmonology, nutrition, PT/OT, speech, palliative"
      - "Respiratory: Serial FVC (NIV if <50%, consider tracheostomy discussions), cough assist device"
      - "Nutrition: PEG tube if weight loss >10%, dysphagia, aspiration (place while FVC >50%)"
    tests:
      - "EMG/NCS: Widespread denervation in ≥3 limbs, fibrillations, fasciculations, normal conduction velocities"
      - "MRI brain/spine: Rule out mimics (cervical myelopathy, MS, tumor)"
      - "Pulmonary function: Serial FVC (NIV if <50%), consider tracheostomy if continued decline"
      - "Rule out ALS mimics: CK (myopathy), TSH, SPEP (paraprotein), heavy metals, Lyme"
    referrals:
      - "Neurology (ALS clinic): Diagnosis confirmation, riluzole, multidisciplinary care"
      - "Pulmonology: NIV initiation when FVC <50%"
      - "Gastroenterology: PEG tube placement (place while FVC >50%)"
      - "Palliative care: Early involvement for symptom management, goals of care"
    icd10:
      - G12.21   # Amyotrophic lateral sclerosis
    snomed:
      - "86044005"   # Amyotrophic lateral sclerosis

  - id: NEU-BELL-PALSY
    label: Bell's Palsy
    presentations:
      - sudden unilateral facial weakness or paralysis
      - inability to close eye on affected side
      - loss of taste on anterior tongue
      - hyperacusis
      - often preceded by viral illness
      - "Complete hemifacial weakness: Forehead involved (vs stroke which spares forehead)"
      - "Periauricular pain (50%) may precede weakness"
      - "House-Brackmann grade I-VI: I (normal) to VI (complete paralysis)"
    clinical_pearls:
      - "Idiopathic facial nerve palsy (CN VII) - diagnosis of exclusion"
      - "Forehead involvement: Distinguishes from stroke (stroke spares forehead due to bilateral UMN innervation)"
      - "Prednisone + acyclovir: Start within 72 hours, improves recovery to 90-95%"
      - "Eye protection critical: Artificial tears, eye ointment at night, tape eyelid closed (prevent corneal abrasion)"
      - "Recovery: 70% complete in 6 months without treatment, 85% with steroids, 30% have mild residual weakness"
      - "Ramsay Hunt syndrome: Herpes zoster of geniculate ganglion (vesicles in ear canal, worse prognosis)"
    management:
      - "Prednisone 60mg daily x5 days, taper over 5 days (10 days total) - START WITHIN 72 HOURS"
      - "Acyclovir 400mg 5x daily x7 days (or valacyclovir 1g TID x7 days) - if severe or Ramsay Hunt"
      - "Eye protection: Artificial tears q2h during day, lacrilube ointment at night, tape eyelid closed if incomplete closure"
      - "Physical therapy: Facial exercises after 2-3 weeks (avoid early to prevent synkinesis)"
      - "Recheck: 1-2 weeks to assess for improvement, consider EMG if no recovery by 3 months"
    tests:
      - "Clinical diagnosis: Acute unilateral facial weakness including forehead, normal neuro exam otherwise"
      - "No imaging if typical: Sudden onset, complete hemifacial weakness, no other neuro deficits"
      - "MRI brain with contrast: If atypical (gradual onset, other cranial nerves, bilateral, not improving)"
      - "EMG (after 2-3 weeks): Nerve conduction studies predict prognosis if no clinical improvement"
    referrals:
      - "Ophthalmology if: Incomplete eye closure, corneal abrasion, persistent lagophthalmos"
      - "Neurology if: Atypical features (bilateral, recurrent, other cranial nerves, no improvement 3 months)"
      - "ENT if: Ramsay Hunt syndrome, chronic facial paralysis (consider surgical decompression)"
    icd10:
      - G51.0    # Bell's palsy
    snomed:
      - "193093009"  # Bell's palsy

  - id: NEU-CLUSTER-HEADACHE
    label: Cluster Headache
    presentations:
      - severe unilateral periorbital pain
      - lacrimation, rhinorrhea, ptosis, miosis
      - restlessness during attacks
      - occurs in clusters (daily attacks for weeks/months)
      - more common in men
      - "Excruciating unilateral periorbital pain (8-10/10) lasting 15-180 minutes"
      - "Ipsilateral autonomic features: Lacrimation, conjunctival injection, rhinorrhea, Horner syndrome"
      - "Cluster periods: 1-8 attacks/day for weeks to months, then remission months to years"
    clinical_pearls:
      - "Most painful primary headache disorder (suicidal headache)"
      - "Male predominance (3:1), average age 30, associated with smoking/alcohol"
      - "Restlessness during attacks: Unlike migraine (prefer dark quiet room), cluster patients pace/rock"
      - "Oxygen 100% 12-15 L/min x15 min: Aborts attack in 70% within 15 minutes"
      - "Sumatriptan 6mg SC: Aborts attack in 75% within 15 minutes (faster than oral)"
      - "Prophylaxis: Verapamil 240-960mg/day (most effective), taper after cluster period ends"
    management:
      - "Acute attack: 100% oxygen 12-15 L/min via non-rebreather mask x15 min (first-line)"
      - "Sumatriptan 6mg SC or 20mg intranasal (faster than oral) - can repeat once after 1 hour"
      - "Prophylaxis: Verapamil 240mg daily, increase by 80mg q2 weeks to 480-960mg (EKG before increases >480mg)"
      - "Prednisone taper: 60mg x5d then taper over 3 weeks (bridge therapy while verapamil titrating)"
      - "Avoid triggers: Alcohol, nitroglycerin, histamine during cluster period"
    tests:
      - "Clinical diagnosis: Severe unilateral periorbital pain + ipsilateral autonomic features + restlessness"
      - "MRI brain with contrast: To rule out secondary causes (pituitary tumor, aneurysm, cavernous sinus pathology)"
      - "EKG: Before verapamil >480mg/day (can cause heart block)"
    referrals:
      - "Neurology for: Diagnosis confirmation, verapamil titration, refractory cases"
      - "Consider nerve blocks: Greater occipital nerve block for transitional therapy"
