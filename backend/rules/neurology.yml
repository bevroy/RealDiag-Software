      - "Dexamethasone: 4-8mg PO/IV q6h to reduce vasogenic edema and symptoms"
      - "Anti-epileptics: If seizures present (levetiracetam 500-1000mg BID), not for prophylaxis"
      - "Neurosurgery consult: Resection for tissue diagnosis and cytoreduction"
      - "Radiation + chemotherapy: Temozolomide for glioblastoma, radiation for many primary and metastatic tumors"
      - "Palliative care: Early involvement for symptom management, goals of care"
    tests:
      - "MRI brain with and without contrast: Gold standard, shows location, size, enhancement pattern"
      - "Biopsy or resection: Tissue diagnosis required (glioma grade, metastasis, lymphoma, meningioma)"
      - "Chest/abdomen/pelvis CT: If metastases suspected, find primary tumor"
      - "PET scan: May help differentiate tumor recurrence from radiation necrosis"
    referrals:
      - "Neurosurgery URGENTLY: For biopsy/resection"
      - "Neuro-oncology: For chemotherapy and radiation planning"
      - "Palliative care: Early involvement for high-grade tumors"
