      - "NSAIDs: Ibuprofen 600-800mg TID or naproxen 500mg BID for pain"
      - "Gabapentin: 300-900mg TID for neuropathic leg pain"
      - "Epidural steroid injection: If radicular symptoms prominent, provides 3-6 months relief in 50%"
      - "Surgical decompression (laminectomy): If failed conservative therapy >6 months and significant disability"
