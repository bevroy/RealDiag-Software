  - id: NEU-PERIPHERAL-NEUROPATHY
    label: Peripheral Neuropathy
    presentations:
      - numbness, tingling, burning in hands/feet
      - weakness
      - loss of reflexes
      - stocking-glove distribution
      - often due to diabetes, alcohol, or medications
      - "Sensory > motor: Paresthesias, dysesthesias, numbness"
      - "Neuropathic pain: Burning, shooting, electric shock pain"
      - "Distal symmetric polyneuropathy: Stocking-glove distribution (feet before hands)"
    clinical_pearls:
      - "Diabetes most common cause (50%), followed by alcohol, B12 deficiency, medications"
      - "Length-dependent: Starts feet, ascends to knees before affecting hands (longest nerves affected first)"
      - "Screen for causes: HbA1c, B12, TSH, SPEP, HIV, heavy metals, Lyme"
      - "Diabetic neuropathy: Screen annually with 10g monofilament, vibration (128 Hz tuning fork)"
      - "Neuropathic pain: Gabapentin, pregabalin, duloxetine, or tricyclics (amitriptyline)"
      - "CIDP (chronic inflammatory demyelinating polyneuropathy): Acquired immune-mediated, treatable with IVIG"
    management:
      - "Treat underlying cause: Glycemic control (diabetes), B12 replacement, stop toxin (alcohol, meds)"
      - "Neuropathic pain: Gabapentin 300mg TID titrate to 900-3600mg/day, or pregabalin 75mg BID titrate to 300mg BID"
      - "Alternative: Duloxetine 60mg daily (SNRI), amitriptyline 25-75mg qhs (TCA)"
      - "Topical: Lidocaine 5% patches, capsaicin cream for localized pain"
      - "Foot care: Daily inspection, proper footwear, podiatry (diabetics at high ulcer/amputation risk)"
    tests:
      - "Diabetes: HbA1c, fasting glucose"
      - "B12 level: <200 pg/mL deficient, methylmalonic acid if borderline"
      - "Thyroid: TSH (hypothyroidism)"
      - "SPEP with immunofixation: Paraproteinemia, amyloidosis"
      - "EMG/NCS: Distinguish axonal (reduced amplitude) vs demyelinating (slow velocity, prolonged latencies)"
      - "Consider: HIV, RPR, Lyme, heavy metals (lead, arsenic), ANA if idiopathic"
    referrals:
      - "Neurology if: Rapid progression, asymmetric, motor > sensory, demyelinating pattern on EMG"
      - "Podiatry for: Diabetic neuropathy (ulcer prevention, foot care)"
      - "Pain management if: Refractory neuropathic pain"
