- id: ID-VIRAL-MENINGITIS
  label: Viral (Aseptic) Meningitis
  presentations:
  - Fever, headache, neck stiffness (milder than bacterial)
  - Photophobia, nausea, malaise
  - No altered mental status typically (less severe than bacterial)
  - 'CSF: Lymphocytic pleocytosis (10-1000 cells, lymphocyte predominant), normal
    glucose, mildly elevated protein'
  - 'Causes: Enteroviruses (most common), HSV-2, VZV, HIV, mumps'
  - Self-limited in most cases (1-2 weeks)
  clinical_pearls:
  - Cannot distinguish from bacterial clinically - treat as bacterial until CSF results
  - CSF lymphocytic predominance suggests viral (but early bacterial can have lymphocytes)
  - 'HSV-2 meningitis: Recurrent, associated with genital HSV'
  - 'Most common cause: Enteroviruses (coxsackie, echovirus)'
  - Treatment supportive unless HSV encephalitis (acyclovir)
  management:
  - 'Guideline-based treatment options for Viral (Aseptic) Meningitis include:'
  - Initially treat as bacterial meningitis until CSF results available (IDSA 2024)
  - 'If CSF confirms viral: Supportive care (fluids, analgesics, antiemetics) (IDSA
    2024)'
  - Acyclovir if HSV suspected (encephalitis features, immunocompromised) (IDSA 2024)
  - 'Pain control: Acetaminophen, NSAIDs (IDSA 2024)'
  - Most recover fully in 7-10 days without treatment (IDSA 2024)
  tests:
  - 'Lumbar puncture: CSF cell count (lymphocytic), glucose (normal), protein (mildly
    elevated)'
  - CSF viral PCR panel (enterovirus, HSV, VZV)
  - Blood cultures (rule out bacterial)
  referrals:
  - Infectious disease if HSV or complicated
  - Admission if severe symptoms, unable to tolerate PO
  sensitivity: 0.8
  specificity: 0.85
  icd10:
