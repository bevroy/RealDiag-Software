family: infectious_disease
version: 0.1.0
source: Infectious Diseases Society of America (IDSA) Guidelines, Centers for Disease
  Control and Prevention (CDC)
rules:
- id: ID-SEPSIS
  label: Sepsis and Septic Shock
  presentations:
  - 'Sepsis: Life-threatening organ dysfunction due to dysregulated host response
    to infection'
  - SOFA score increase ≥2 points (indicates organ dysfunction)
  - 'qSOFA (quick screening): Altered mental status, SBP ≤100, RR ≥22 (2+ positive)'
  - Fever (>38.3°C) or hypothermia (<36°C)
  - Tachycardia (HR >90), tachypnea (RR >20 or PaCO2 <32)
  - 'Septic shock: Persistent hypotension requiring vasopressors, lactate >2 mmol/L'
  - 'Source: Pneumonia (most common), UTI, abdominal, skin/soft tissue'
  clinical_pearls:
  - 'Surviving Sepsis Campaign bundle: Complete within 1 hour'
  - 1. Measure lactate, 2. Blood cultures before antibiotics, 3. Broad-spectrum antibiotics
  - 4. Crystalloid 30mL/kg if hypotensive/lactate ≥4, 5. Vasopressors if still hypotensive
  - 'Empiric antibiotics: Vancomycin + Pip-Tazo or carbapenem (broad coverage)'
  - Norepinephrine is first-line vasopressor (target MAP ≥65 mmHg)
  - Mortality increases 7% per hour delay in antibiotics
  sensitivity: 0.91
  specificity: 0.86
  icd10:
  - A41.9
  - R65.21
  - R65.20
  snomed:
  - '91302008'
- id: ID-UTI
  label: Urinary Tract Infection
  presentations:
  - Dysuria
  - Urinary frequency and urgency
  - Suprapubic pain
  - Hematuria
  - Fever (if pyelonephritis)
  - CVA tenderness (if pyelonephritis)
  clinical_pearls:
  - E. coli causes 80-85% of community-acquired UTIs
  - 'Uncomplicated UTI: Young, healthy women without structural/functional abnormalities'
  - 'Complicated UTI: Male, pregnancy, catheter, obstruction, immunocompromised, pyelonephritis'
  - Nitrites (specific for bacteria), leukocyte esterase (sensitive for pyuria)
  - Treat empirically if symptoms present, don't wait for culture (3-day course for
    uncomplicated)
  - 'Recurrent UTIs (≥2 in 6mo or ≥3 in 1yr): Consider prophylaxis or post-coital
    antibiotics'
  management:
  - 'Guideline-based treatment options for Urinary Tract Infection include:'
  - 'Uncomplicated cystitis: Nitrofurantoin 100mg BID x 5d or TMP-SMX DS BID x 3d
    (if local resistance <20%) (IDSA 2024)'
  - 'Alternative: Fosfomycin 3g single dose (convenient but lower efficacy) (IDSA
    2024)'
  - 'Complicated/pyelonephritis: Ciprofloxacin 500mg BID x 7d or ceftriaxone 1g IV
    x1 then PO (IDSA 2024)'
  - 'Pregnant: Nitrofurantoin (avoid 1st trimester and near term), cephalexin, or
    amoxicillin-clavulanate x 7d (IDSA 2024)'
  - 'Catheter-associated: Remove/change catheter + antibiotics x 7d (IDSA 2024)'
  tests:
  - Urinalysis with microscopy (pyuria, bacteriuria, nitrites, leukocyte esterase)
  - 'Urine culture if: Complicated, pyelonephritis, pregnant, or failed initial therapy'
  - Renal ultrasound if pyelonephritis with poor response (rule out abscess, obstruction)
  - No need for test-of-cure UA/culture if symptoms resolve
  referrals:
  - 'Urology if: Recurrent UTIs in men, anatomic abnormality, stones, obstruction'
  - Nephrology if acute pyelonephritis complicated by AKI
  - 'Admission if: Sepsis, pregnant with pyelonephritis, inability to tolerate oral
    hydration'
  icd10:
  - N39.0
  - N30.00
  - N10
  snomed:
  - '68566005'
- id: ID-CELLULITIS
  label: Cellulitis
  presentations:
  - Erythema and warmth
  - Swelling and tenderness
  - Fever
  - Regional lymphadenopathy
  - Clearly demarcated borders (vs diffuse)
  clinical_pearls:
  - Strep pyogenes (Group A Strep) and Staph aureus most common organisms
  - 'Purulent cellulitis (abscess/drainage): Suspect MRSA, needs I&D + antibiotics'
  - 'Non-purulent cellulitis: Beta-lactam (cephalexin) covers strep adequately'
  - Mark borders with marker pen to track progression or improvement
  - Elevation + NSAIDs reduce inflammation and edema
  - 'Recurrent cellulitis: Consider prophylaxis (penicillin VK 250-500mg daily)'
  management:
  - 'Guideline-based treatment options for Cellulitis include:'
  - 'Non-purulent: Cephalexin 500mg PO QID x 5-7 days or dicloxacillin 500mg QID (IDSA
    2024)'
  - 'MRSA risk: TMP-SMX DS 1-2 tabs BID + cephalexin OR doxycycline 100mg BID (IDSA
    2024)'
  - 'Severe/systemic: Admit for IV cefazolin 2g q8h or vancomycin 15-20mg/kg q12h
    if MRSA (IDSA 2024)'
  - 'Abscess: Incision and drainage (I&D) REQUIRED + antibiotics (IDSA 2024)'
  - Elevation of affected extremity, NSAIDs for pain and inflammation (IDSA 2024)
  tests:
  - Clinical diagnosis (no routine lab testing for uncomplicated)
  - Blood cultures if systemic symptoms (fever, tachycardia)
  - Wound culture if abscess drained
  - Ultrasound if abscess suspected but not clinically apparent
  referrals:
  - 'Admission if: Systemic toxicity, failed outpatient therapy, immunocompromised,
    rapidly progressive'
  - Surgery if necrotizing fasciitis suspected (pain out of proportion, crepitus,
    rapid progression)
  - Dermatology if atypical or recurrent
  icd10:
  - L03.90
  - L03.115
  - L03.119
  snomed:
  - '128045006'
- id: ID-MENINGITIS
  label: Bacterial Meningitis
  presentations:
  - Severe headache
  - Fever
  - Neck stiffness
  - Photophobia
  - Altered mental status
  - Kernig's or Brudzinski's sign
  clinical_pearls:
  - Classic triad (fever, neck stiffness, altered mental status) present in only 44%
    of cases
  - Don't delay antibiotics for LP or imaging - empiric treatment immediately if suspected
  - 'Empiric: Vancomycin + ceftriaxone (add ampicillin if >50yo or immunocompromised
    for Listeria)'
  - Dexamethasone 10mg IV before or with first antibiotic dose reduces mortality and
    sequelae
  - 'CSF: WBC >1000 (PMN predominant), glucose <40 mg/dL, protein >200 mg/dL'
  - Mortality 15-25% despite treatment; neurologic sequelae (hearing loss, seizures)
    common
  management:
  - 'Guideline-based treatment options for Bacterial Meningitis include:'
  - Blood cultures, then empiric antibiotics IMMEDIATELY (IDSA 2024)
  - Vancomycin 15-20mg/kg IV q8-12h + ceftriaxone 2g IV q12h (IDSA 2024)
  - 'If >50yo or immunocompromised: Add ampicillin 2g IV q4h (covers Listeria) (IDSA
    2024)'
  - Dexamethasone 10mg IV q6h x 4 days (start with or before antibiotics) (IDSA 2024)
  - LP when safe (after CT if focal deficit, papilledema, immunocompromised) (IDSA
    2024)
  tests:
  - Blood cultures x2 before antibiotics
  - CT head if focal deficit, papilledema, immunocompromised, or seizure BEFORE LP
  - 'Lumbar puncture: CSF cell count, glucose, protein, gram stain, culture'
  - Procalcitonin (elevated suggests bacterial vs viral)
  referrals:
  - ICU admission for all bacterial meningitis
  - Infectious disease consult
  - Neurology if complications (seizures, stroke, hydrocephalus)
  icd10:
  - G00.9
  - G03.9
  snomed:
  - '23572006'
- id: ID-ENCEPHALITIS
  label: Viral Encephalitis
  presentations:
  - Fever
  - Altered mental status
  - Seizures
  - Focal neurologic deficits
  - Headache
  - Behavioral changes
  clinical_pearls:
  - HSV encephalitis most common viral cause (and most important to treat)
  - Start acyclovir empirically if encephalitis suspected - don't wait for PCR results
  - 'MRI: Temporal lobe involvement (HSV), hemorrhagic changes'
  - 'EEG: PLEDS (periodic lateralizing epileptiform discharges) suggest HSV'
  - Mortality 70% untreated HSV; 30% with treatment; neurologic sequelae common
  - 'Other causes: VZV, enteroviruses, arboviruses (West Nile, EEE), rabies'
  management:
  - 'Guideline-based treatment options for Viral Encephalitis include:'
  - Empiric acyclovir 10mg/kg IV q8h IMMEDIATELY (IDSA 2024)
  - Continue acyclovir 14-21 days if HSV confirmed on PCR (IDSA 2024)
  - 'Supportive care: IV fluids, anticonvulsants if seizures (levetiracetam, fosphenytoin)
    (IDSA 2024)'
  - Consider antibiotics (vancomycin + ceftriaxone) until bacterial meningitis ruled
    out (IDSA 2024)
  - Treat elevated ICP if present (elevate head, osmotic therapy) (IDSA 2024)
  tests:
  - MRI brain with contrast (temporal lobe enhancement, hemorrhagic changes suggest
    HSV)
  - 'Lumbar puncture: CSF PCR for HSV, VZV, enteroviruses; cell count/glucose/protein'
  - EEG (PLEDS suggest HSV encephalitis)
  - Blood cultures (rule out bacterial)
  referrals:
  - ICU admission
  - Neurology consult
  - Infectious disease consult
  icd10:
  - G04.90
  - A86
  snomed:
  - '45170000'
- id: ID-COVID19
  label: COVID-19
  presentations:
  - Fever or chills
  - Cough
  - Dyspnea
  - Fatigue
  - Loss of taste or smell
  - Body aches
  - Sore throat
  clinical_pearls:
  - SARS-CoV-2 virus, respiratory droplet transmission
  - Incubation 2-14 days (median 5 days)
  - 'Risk factors for severe disease: Age >65, obesity, diabetes, immunocompromised,
    lung/heart disease'
  - Nirmatrelvir-ritonavir (Paxlovid) within 5 days reduces hospitalization 89% (high-risk
    patients)
  - Dexamethasone reduces mortality in hospitalized patients requiring oxygen
  - 'Long COVID: Persistent symptoms >4 weeks (fatigue, dyspnea, brain fog)'
  management:
  - 'Guideline-based treatment options for COVID-19 include:'
  - 'Mild-moderate: Supportive care (rest, hydration, acetaminophen for fever) (IDSA
    2024)'
  - 'High-risk within 5 days: Nirmatrelvir-ritonavir (Paxlovid) 300/100mg BID x 5
    days (IDSA 2024)'
  - 'Alternative: Molnupiravir 800mg BID x 5 days (if Paxlovid contraindicated) (IDSA
    2024)'
  - 'Hospitalized requiring oxygen: Dexamethasone 6mg daily x 10 days + remdesivir
    200mg IV x1, then 100mg daily x 5d (IDSA 2024)'
  - 'Severe: Tocilizumab or baricitinib + dexamethasone, mechanical ventilation if
    needed (IDSA 2024)'
  tests:
  - NAAT (PCR) - gold standard, high sensitivity
  - Rapid antigen test - quick, less sensitive (good PPV if positive, repeat if negative
    with symptoms)
  - Chest X-ray if moderate-severe (bilateral infiltrates)
  - D-dimer, ferritin, CRP elevated (poor prognostic indicators)
  referrals:
  - 'Hospitalization if: SpO2 <94%, respiratory rate >30, severe symptoms'
  - ICU if respiratory failure, shock, or multiorgan dysfunction
  - Infectious disease for complex cases or immunocompromised
  icd10:
  - U07.1
  - J12.82
  snomed:
  - '840539006'
- id: ID-INFLUENZA
  label: Influenza
  presentations:
  - Sudden onset fever
  - Myalgias
  - Headache
  - Dry cough
  - Sore throat
  - Fatigue
  - Seasonal pattern
  clinical_pearls:
  - Seasonal (winter in Northern hemisphere), types A and B cause epidemics
  - Oseltamivir (Tamiflu) most effective if started within 48 hours of symptom onset
  - Reduces symptom duration by ~1 day and reduces complications in high-risk patients
  - 'High-risk: Age >65, pregnant, chronic diseases (lung, heart, diabetes), immunocompromised'
  - 'Complications: Pneumonia (viral or secondary bacterial), myocarditis, encephalitis,
    myositis'
  - Annual vaccination recommended for all >6 months old
  management:
  - 'Guideline-based treatment options for Influenza include:'
  - 'Supportive care: Rest, fluids, acetaminophen or NSAIDs for fever/myalgias (IDSA
    2024)'
  - 'Antiviral (if <48hr from onset): Oseltamivir 75mg PO BID x 5 days (IDSA 2024)'
  - 'Alternative: Baloxavir marboxil 40-80mg single dose (one-time treatment) (IDSA
    2024)'
  - 'Prophylaxis if exposed: Oseltamivir 75mg daily x 7-10 days (unvaccinated high-risk)
    (IDSA 2024)'
  - Treat secondary bacterial pneumonia if develops (amoxicillin-clavulanate or ceftriaxone)
    (IDSA 2024)
  tests:
  - Rapid influenza diagnostic test (RIDT) - quick but lower sensitivity (50-70%)
  - RT-PCR (gold standard, high sensitivity)
  - Chest X-ray if concern for pneumonia
  - Clinical diagnosis reasonable during flu season with typical symptoms
  referrals:
  - 'Hospitalization if: Severe symptoms, hypoxia, dehydration, high-risk with complications'
  - ICU if respiratory failure or septic shock
  - Infectious disease if immunocompromised or resistant infection
  icd10:
  - J11.1
  - J10.1
  snomed:
  - '6142004'
- id: ID-HIV
  label: HIV/AIDS
  presentations:
  - Opportunistic infections
  - Unexplained weight loss
  - Persistent fever
  - Chronic diarrhea
  - Oral thrush
  - Kaposi's sarcoma
  - Low CD4 count
  clinical_pearls:
  - 'AIDS definition: CD4 <200 or AIDS-defining illness (PCP, CMV, cryptococcal meningitis,
    Kaposi''s)'
  - 'Acute HIV: Mononucleosis-like syndrome 2-4 weeks after exposure (fever, rash,
    lymphadenopathy)'
  - 'PrEP (pre-exposure prophylaxis): Tenofovir-emtricitabine daily reduces transmission
    >90%'
  - 'PEP (post-exposure): Start within 72 hours, same regimen x 28 days'
  - 'U=U: Undetectable viral load = Untransmittable'
  - Screen all ages 13-64 at least once, high-risk annually
  management:
  - 'Guideline-based treatment options for HIV/AIDS include:'
  - Start ART (antiretroviral therapy) immediately after diagnosis (IDSA 2024)
  - 'Preferred regimen: Integrase inhibitor (bictegravir or dolutegravir) + 2 NRTIs
    (tenofovir-emtricitabine) (IDSA 2024)'
  - 'Example: Biktarvy (bictegravir-tenofovir-emtricitabine) 1 tablet daily (IDSA
    2024)'
  - 'Prophylaxis: TMP-SMX DS daily if CD4 <200 (prevents PCP, toxo) (IDSA 2024)'
  - 'Monitor: Viral load (goal undetectable <50), CD4 count (IDSA 2024)'
  tests:
  - HIV antibody/antigen test (4th generation) - detects HIV-1, HIV-2, p24 antigen
  - HIV RNA viral load (confirms diagnosis if antibody positive)
  - CD4 count (assesses immune status)
  - Genotypic resistance testing before starting ART
  - 'Screen for: Hepatitis B/C, STIs, TB (PPD or IGRA)'
  referrals:
  - HIV clinic or infectious disease for all newly diagnosed
  - Social work (medication assistance programs, housing, mental health)
  - Start ART as soon as possible (improves outcomes)
  icd10:
  - B20
  - Z21
  snomed:
  - '86406008'
- id: ID-ENDOCARDITIS
  label: Infective Endocarditis
  presentations:
  - 'Duke criteria: 2 major, 1 major + 3 minor, or 5 minor criteria'
  - 'Major: Positive blood cultures (typical organisms in 2 cultures), echo findings
    (vegetation, abscess, new regurgitation)'
  - 'Minor: Fever >38°C, vascular phenomena (emboli, septic infarcts, Janeway lesions),
    immunologic (Osler nodes, Roth spots), predisposing condition'
  - Persistent bacteremia (S. aureus, Streptococcus, Enterococcus)
  - New heart murmur (especially regurgitant)
  - Splinter hemorrhages (subungual), petechiae
  - 'Risk factors: IV drug use, prosthetic valve, previous endocarditis'
  clinical_pearls:
  - 3 sets of blood cultures from different sites before starting antibiotics
  - Transthoracic echo first, TEE if high suspicion and TTE negative (more sensitive)
  - 'Empiric antibiotics: Vancomycin + ceftriaxone (native valve), + gentamicin (prosthetic)'
  - 'S. aureus endocarditis: High mortality, surgical evaluation for complications'
  - 'Surgery indications: Heart failure, persistent infection, large vegetation (>10mm),
    abscess'
  sensitivity: 0.8
  specificity: 0.96
  icd10:
  - I33.0
  - I33.9
  snomed:
  - '56819008'
- id: ID-OSTEOMYELITIS
  label: Osteomyelitis
  presentations:
  - Bone pain
  - Fever
  - Localized swelling and erythema
  - Draining sinus tract
  - History of trauma, surgery, or diabetic foot ulcer
  clinical_pearls:
  - 'Hematogenous (children, IVDU): Long bones, vertebrae; Staph aureus most common'
  - 'Contiguous (adults): From adjacent infection, surgery, trauma; polymicrobial
    if diabetic foot'
  - MRI is most sensitive test (detects within days), bone scan less specific
  - Bone biopsy for culture (gold standard) - guides antibiotic choice
  - 'Duration: 4-6 weeks IV antibiotics, may need PICC line'
  - 'Diabetic foot osteomyelitis: Probe-to-bone test (if probe touches bone = likely
    osteo)'
  management:
  - 'Guideline-based treatment options for Osteomyelitis include:'
  - 'Empiric: Vancomycin 15-20mg/kg IV q12huntil culture results (IDSA 2024)'
  - 'If MSSA: Switch to nafcillin or cefazolin (IDSA 2024)'
  - 'Diabetic foot (polymicrobial): Vancomycin + piperacillin-tazobactam (IDSA 2024)'
  - 'Duration: 4-6 weeks IV antibiotics, may transition to PO after 2 weeks if improving
    (IDSA 2024)'
  - 'Surgery if: Abscess, sequestrum (dead bone), failed medical therapy, hardware
    infection (IDSA 2024)'
  tests:
  - MRI (most sensitive, detects marrow edema within 3-5 days)
  - Bone biopsy with culture (gold standard for organism identification)
  - Blood cultures, ESR, CRP (elevated, track response to treatment)
  - X-ray (shows changes after 10-14 days - periosteal elevation, lytic lesions)
  - Probe-to-bone test (diabetic foot) - positive if probe contacts bone
  referrals:
  - Infectious disease for antibiotic management (long-term IV)
  - Orthopedic surgery if abscess, sequestrum, or hardware-associated
  - Vascular surgery if diabetic foot with ischemia
  - PICC line placement for prolonged IV antibiotics
  icd10:
  - M86.9
  - M86.8X9
  snomed:
  - '60168000'
- id: ID-LYME
  label: Lyme Disease
  presentations:
  - Erythema migrans (bulls-eye rash)
  - Fever and chills
  - Fatigue
  - Headache
  - Joint pain
  - Tick exposure in endemic area
  clinical_pearls:
  - Borrelia burgdorferi transmitted by Ixodes tick (deer tick), endemic in Northeast/Upper
    Midwest US
  - Erythema migrans (EM) rash diagnostic if present (70-80% of cases) - treat clinically,
    no testing needed
  - 'Early localized: EM rash. Early disseminated: Multiple EM, facial palsy, carditis,
    meningitis'
  - 'Late: Lyme arthritis (knee), encephalopathy'
  - 'Two-tier testing: ELISA screening, if positive confirm with Western blot'
  - Doxycycline preferred (also covers anaplasmosis, another tick-borne disease)
  management:
  - 'Guideline-based treatment options for Lyme Disease include:'
  - 'Early localized or disseminated: Doxycycline 100mg PO BID x 10-21 days (IDSA
    2024)'
  - 'Alternative: Amoxicillin 500mg TID or cefuroxime 500mg BID (if pregnant or <8
    years old) (IDSA 2024)'
  - 'Lyme carditis: Ceftriaxone 2g IV daily x 14-21 days (IDSA 2024)'
  - 'Lyme meningitis/encephalitis: Ceftriaxone 2g IV daily x 14-28 days (IDSA 2024)'
  - 'Lyme arthritis: Doxycycline 100mg BID x 28 days (IDSA 2024)'
  tests:
  - Clinical diagnosis if EM rash present (no testing needed)
  - 'Two-tier serology: ELISA screening, if positive confirm with Western blot'
  - Testing not useful in first 3-4 weeks (antibodies not yet developed)
  - CSF analysis if neurologic symptoms (lymphocytic pleocytosis)
  - ECG if carditis suspected (AV block)
  referrals:
  - Infectious disease if neurologic involvement, carditis, or refractory symptoms
  - Cardiology if Lyme carditis (AV block may need temporary pacing)
  - Rheumatology if Lyme arthritis refractory to antibiotics
  icd10:
  - A69.20
  - A69.23
  snomed:
  - '23502006'
- id: ID-MONONUCLEOSIS
  label: Infectious Mononucleosis
  presentations:
  - Severe sore throat
  - Fever
  - Lymphadenopathy (especially posterior cervical)
  - Splenomegaly
  - Fatigue
  - Atypical lymphocytes
  clinical_pearls:
  - Epstein-Barr virus (EBV) most common cause, transmitted via saliva ('kissing disease')
  - 'Classic triad: Fever, pharyngitis, lymphadenopathy (especially posterior cervical)'
  - Avoid ampicillin/amoxicillin (causes maculopapular rash in 90-100% of EBV patients)
  - Splenomegaly in 50% (peak 2-3 weeks) - avoid contact sports 3-4 weeks to prevent
    splenic rupture
  - 'Monospot test (heterophile antibody): Quick, but false negative in first week
    or young children'
  - Self-limited, supportive care only (no antivirals effective)
  management:
  - 'Guideline-based treatment options for Infectious Mononucleosis include:'
  - 'Supportive care: Rest, fluids, NSAIDs or acetaminophen for fever/pain (IDSA 2024)'
  - Avoid contact sports for 3-4 weeks (risk splenic rupture) (IDSA 2024)
  - Short course steroids if severe tonsillar hypertrophy with airway compromise (prednisone
    40-60mg x 5-7 days) (IDSA 2024)
  - Avoid ampicillin/amoxicillin (causes rash) (IDSA 2024)
  - Most recover in 2-4 weeks, but fatigue may persist months (IDSA 2024)
  tests:
  - Monospot test (heterophile antibody) - quick, but negative first week or in young
    children
  - 'EBV serology: VCA-IgM (acute), VCA-IgG (past/chronic), EBNA (past infection)'
  - 'CBC: Lymphocytosis with atypical lymphocytes (>10%)'
  - Liver function tests (mild transaminitis common)
  referrals:
  - ENT if severe tonsillar hypertrophy with airway compromise
  - Hematology if severe cytopenias or prolonged symptoms
  - Most managed outpatient with supportive care
  icd10:
  - B27.90
  snomed:
  - '271558008'
- id: ID-C-DIFF
  label: Clostridioides difficile Infection
  presentations:
  - Watery diarrhea (≥3 unformed stools in 24 hours)
  - Abdominal cramping and tenderness
  - Fever, leukocytosis (WBC >15,000)
  - 'Recent antibiotic use (within 3 months): Clindamycin, fluoroquinolones, cephalosporins'
  - 'Severe: WBC >15K, Cr >1.5x baseline, or complicated (hypotension, ileus, megacolon)'
  - 'Fulminant: Hypotension, shock, ileus, or megacolon'
  - 'Stool test: Nucleic acid amplification test (NAAT) or toxin EIA'
  clinical_pearls:
  - 'Initial episode: Vancomycin 125mg PO QID or fidaxomicin 200mg PO BID x 10 days'
  - 'First recurrence: Same regimen. Second recurrence: Fidaxomicin or vancomycin
    taper'
  - 'Severe/fulminant: Vancomycin 500mg PO QID + metronidazole 500mg IV q8h'
  - 'If ileus: Consider vancomycin retention enema, surgical evaluation if no improvement'
  - Stop inciting antibiotics if possible. Fecal microbiota transplant for recurrent
  sensitivity: 0.85
  specificity: 0.93
  icd10:
  - A04.7
  - A04.72
  snomed:
  - '186431008'
- id: ID-SEPSIS
  label: Sepsis and Septic Shock
  presentations:
  - 'SIRS criteria: Temp >38°C or <36°C, HR >90, RR >20, WBC >12K or <4K'
  - 'Sepsis: Infection + organ dysfunction (qSOFA ≥2 - RR ≥22, AMS, SBP ≤100)'
  - 'Septic shock: Sepsis + hypotension requiring vasopressors + lactate >2 mmol/L'
  - 'Source: Pneumonia, UTI, intra-abdominal, skin/soft tissue most common'
  - 'Signs: Fever/hypothermia, tachycardia, tachypnea, hypotension, altered mental
    status'
  - Elevated lactate (more than 2), elevated WBC or bandemia
  clinical_pearls:
  - 'Sepsis-3 definition: Infection + SOFA score increase ≥2'
  - 'Septic shock: Sepsis + vasopressors + lactate >2 despite fluids (mortality 40%)'
  - 'Sepsis bundle: Blood cultures, antibiotics within 1 hour, 30mL/kg fluids'
  - 'Source control essential: Drain abscess, remove infected device, debridement'
  - Broad-spectrum antibiotics initially, then narrow based on culture
  management:
  - 'Guideline-based treatment options for Sepsis and Septic Shock include:'
  - Blood cultures x2 (before antibiotics), then broad-spectrum antibiotics within
    1 hour (IDSA 2024)
  - 'IV fluids: 30 mL/kg crystalloid bolusin first 3 hours (IDSA 2024)'
  - 'Antibiotics: Vancomycin + piperacillin-tazobactam (or cefepime or meropenem)
    (IDSA 2024)'
  - 'Vasopressors if hypotensive after fluids: Norepinephrine first-line (IDSA 2024)'
  - 'Source control: Remove infected catheter, drain abscess, debride necrotic tissue
    (IDSA 2024)'
  tests:
  - Blood cultures x2 (different sites, before antibiotics)
  - Lactate (elevated >2, recheck in 2-4hr if elevated)
  - CBC with differential, comprehensive metabolic panel
  - Procalcitonin (elevated in bacterial infection)
  - Imaging to identify source (chest X-ray, CT abdomen/pelvis, etc.)
  referrals:
  - ICU admission for septic shock or severe sepsis
  - Surgery if source control needed (abscess, bowel perforation)
  - Infectious disease consult for complex cases
  sensitivity: 0.88
  specificity: 0.8
  icd10:
  - A41.9
  - R65.20
  - R65.21
  snomed:
  - '91302008'
- id: ID-BACTERIAL-MENINGITIS
  label: Bacterial Meningitis
  presentations:
  - 'Classic triad: Fever, neck stiffness, altered mental status (only 44% have all
    3)'
  - Severe headache, photophobia, nausea/vomiting
  - Kernig's sign (pain with leg extension), Brudzinski's sign (neck flexion → hip
    flexion)
  - Petechial rash (Neisseria meningitidis)
  - Seizures, focal neurologic deficits (complications)
  - 'CSF: Elevated WBC (>1000, PMN predominant), low glucose, high protein, elevated
    opening pressure'
  clinical_pearls:
  - Don't delay antibiotics for LP or imaging! Give empiric antibiotics if high suspicion
  - 'LP contraindicated if: Focal deficit, papilledema, immunocompromised → get CT
    first'
  - 'Empiric: Vancomycin + ceftriaxone (add ampicillin if >50yo or immunocompromised
    for Listeria)'
  - Dexamethasone 10mg IV 15-20 min before or with first antibiotic dose (reduces
    mortality)
  - Mortality 15-25% even with treatment; neurologic sequelae common
  management:
  - 'Guideline-based treatment options for Bacterial Meningitis include:'
  - Blood cultures, then empiric antibiotics immediately (don't wait for LP!) (IDSA
    2024)
  - Vancomycin 15-20mg/kg IV + ceftriaxone 2g IV q12h (IDSA 2024)
  - 'If >50yo or immunocompromised: Add ampicillin 2g IV q4h (for Listeria) (IDSA
    2024)'
  - Dexamethasone 10mg IV q6h x 4 days (start with or before antibiotics) (IDSA 2024)
  - LP when safe (after CT if focal signs); send CSF for cell count, glucose, protein,
    gram stain, culture (IDSA 2024)
  tests:
  - 'Lumbar puncture: CSF cell count, glucose, protein, gram stain, culture'
  - Blood cultures x2 before antibiotics
  - CT head if focal neurologic signs before LP
  - Procalcitonin (elevated in bacterial)
  referrals:
  - ICU admission for all bacterial meningitis
  - Infectious disease consult
  - Neurology if complications (seizures, stroke)
  sensitivity: 0.85
  specificity: 0.9
