- id: ENDO-METABOLIC-SYNDROME
  label: Metabolic Syndrome
  presentations:
  - central obesity
  - hypertension
  - hyperglycemia
  - dyslipidemia
  - increased cardiovascular risk
  clinical_pearls:
  - 'Diagnosis: 3 of 5 criteria: Waist >40 in (men) or >35 in (women), BP ≥130/85,
    fasting glucose ≥100, TG ≥150, HDL <40 (men) or <50 (women)'
  - Insulin resistance is the underlying pathophysiology - leads to hyperinsulinemia
    and metabolic dysfunction
  - 2x increased risk of cardiovascular disease, 5x increased risk of type 2 diabetes
  - Weight loss of 5-7% significantly improves insulin sensitivity and all metabolic
    parameters
  - Non-alcoholic fatty liver disease (NAFLD) present in 90% of metabolic syndrome
    patients
  management:
  - 'Guideline-based treatment options for Metabolic Syndrome include:'
  - 'Lifestyle (cornerstone): Weight loss 5-10%, 150 min/week moderate exercise, Mediterranean
    diet (ADA 2024)'
  - 'Treat hypertension: ACE inhibitor or ARB (losartan 50-100mg daily) - protect
    kidneys, improve insulin sensitivity (ADA 2024)'
  - 'Treat dyslipidemia: Statin (atorvastatin 10-40mg nightly) if 10-yr ASCVD risk
    ≥7.5% (ADA 2024)'
  - 'Treat prediabetes/diabetes: Metformin 1000mg BID reduces progression to diabetes
    by 31% (ADA 2024)'
  - Consider GLP-1 agonist (semaglutide 0.25-1mg SQ weekly) for weight loss + glucose
    control (ADA 2024)
  tests:
  - Fasting glucose and A1c (screen for prediabetes/diabetes)
  - 'Lipid panel: Total cholesterol, LDL, HDL, triglycerides'
  - Blood pressure measurement (home BP monitoring preferred)
  - Waist circumference (measure at iliac crest)
  - 'Consider: ALT/AST (NAFLD screening), urine microalbumin (kidney damage), calculate
    10-yr ASCVD risk'
  referrals:
  - Nutrition/dietitian for medical nutrition therapy and weight loss counseling
  - Endocrinology if diabetes develops or difficult to control metabolic parameters
  - Cardiology if known cardiovascular disease or high ASCVD risk
