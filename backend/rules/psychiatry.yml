family: psychiatry
version: 0.1.0
source: "RealDiag Psychiatry Core Rules"
rules:
  - id: PSYCH-MDD
    label: Major Depressive Disorder
    presentations:
      - Depressed mood most of the day
      - Loss of interest or pleasure
      - Sleep disturbance (insomnia or hypersomnia)
      - Fatigue or loss of energy
      - Feelings of worthlessness or guilt
      - Difficulty concentrating
      - Suicidal ideation
    icd10:
      - F32.9
      - F33.1
      - F33.2
    snomed:
      - "370143000"

  - id: PSYCH-GAD
    label: Generalized Anxiety Disorder
    presentations:
      - Excessive worry > 6 months
      - Difficulty controlling worry
      - Restlessness
      - Fatigue
      - Difficulty concentrating
      - Muscle tension
      - Sleep disturbance
    icd10:
      - F41.1
    snomed:
      - "21897009"

  - id: PSYCH-PANIC
    label: Panic Disorder
    presentations:
      - Recurrent unexpected panic attacks
      - Palpitations and chest pain
      - Shortness of breath
      - Dizziness or lightheadedness
      - Fear of dying or losing control
      - Worry about future attacks
    icd10:
      - F41.0
    snomed:
      - "371631005"

  - id: PSYCH-BIPOLAR
    label: Bipolar Disorder
    presentations:
      - Manic episodes (elevated mood, decreased sleep, impulsivity)
      - Depressive episodes
      - Rapid speech and racing thoughts
      - Risky behavior during mania
      - Mood cycling pattern
    icd10:
      - F31.9
      - F31.10
      - F31.30
    snomed:
      - "13746004"

  - id: PSYCH-SCHIZOPHRENIA
    label: Schizophrenia
    presentations:
      - Hallucinations (auditory most common)
      - Delusions
      - Disorganized speech
      - Negative symptoms (flat affect, avolition)
      - Social/occupational dysfunction
      - Duration > 6 months
    icd10:
      - F20.9
      - F20.0
    snomed:
      - "58214004"

  - id: PSYCH-PTSD
    label: Post-Traumatic Stress Disorder
    presentations:
      - History of trauma exposure
      - Intrusive memories or flashbacks
      - Avoidance of trauma reminders
      - Negative mood and cognitions
      - Hyperarousal and hypervigilance
      - Duration > 1 month
    icd10:
      - F43.10
    snomed:
      - "47505003"

  - id: PSYCH-OCD
    label: Obsessive-Compulsive Disorder
    presentations:
      - Recurrent intrusive thoughts (obsessions)
      - Repetitive behaviors (compulsions)
      - Time-consuming (> 1 hour/day)
      - Significant distress or impairment
      - Recognition that obsessions are excessive
    icd10:
      - F42.9
      - F42.2
    snomed:
      - "191736004"

  - id: PSYCH-ADHD
    label: Attention-Deficit/Hyperactivity Disorder
    presentations:
      - Inattention and distractibility
      - Difficulty organizing tasks
      - Hyperactivity (fidgeting, inability to sit still)
      - Impulsivity
      - Onset before age 12
      - Symptoms in multiple settings
    icd10:
      - F90.9
      - F90.2
    snomed:
      - "406506008"

  - id: PSYCH-SUBSTANCE-USE
    label: Substance Use Disorder
    presentations:
      - Impaired control over substance use
      - Continued use despite harm
      - Tolerance
      - Withdrawal symptoms
      - Social/occupational impairment
      - Craving
    icd10:
      - F10.20
      - F11.20
      - F19.20
    snomed:
      - "191816009"

  - id: PSYCH-EATING-ANOREXIA
    label: Anorexia Nervosa
    presentations:
      - Restricted food intake
      - Significantly low body weight
      - Intense fear of weight gain
      - Distorted body image
      - Amenorrhea
      - Excessive exercise
    icd10:
      - F50.00
      - F50.02
    snomed:
      - "56882008"

  - id: PSYCH-EATING-BULIMIA
    label: Bulimia Nervosa
    presentations:
      - Recurrent binge eating
      - Compensatory behaviors (vomiting, laxatives, exercise)
      - Self-evaluation influenced by body shape/weight
      - Episodes at least weekly for 3 months
      - Normal or slightly above normal weight
    icd10:
      - F50.2
    snomed:
      - "78004001"

  - id: PSYCH-AUTISM
    label: Autism Spectrum Disorder
    presentations:
      - Social communication deficits
      - Restricted, repetitive behaviors
      - Sensory sensitivities
      - Difficulty with social reciprocity
      - Onset in early developmental period
      - Impairment in functioning
    icd10:
      - F84.0
      - F84.5
    snomed:
      - "408856003"

  - id: PSYCH-MAJOR-DEPRESSION
    label: Major Depressive Disorder (MDD)
    presentations:
      - Depressed mood or anhedonia (loss of interest) for ≥2 weeks
      - "Additional symptoms: Sleep changes (insomnia or hypersomnia), appetite/weight changes"
      - Fatigue, low energy, psychomotor agitation or retardation
      - Feelings of worthlessness or excessive guilt
      - Difficulty concentrating, indecisiveness
      - Recurrent thoughts of death or suicide
      - Significant functional impairment (work, relationships, self-care)
    clinical_pearls:
      - "PHQ-9 score ≥10 suggests moderate-severe depression (screening tool)"
      - "Screen for bipolar disorder before starting antidepressants (can trigger mania)"
      - "SSRIs first-line: Sertraline, escitalopram, fluoxetine (4-6 weeks for effect)"
      - "Assess suicide risk: Ask directly about ideation, plan, means, intent"
      - "Psychotherapy + medication superior to either alone"
    management:
      - "SSRI: Sertraline 50mg daily (titrate to 200mg) or escitalopram 10mg daily (up to 20mg)"
      - "Psychotherapy: CBT (cognitive-behavioral therapy) or IPT (interpersonal therapy)"
      - "Exercise: 30 min moderate activity 3-5x/week (evidence-based adjunct)"
      - "Monitor: Every 1-2 weeks initially (suicide risk highest early treatment)"
      - "Augmentation if partial response: Add bupropion, mirtazapine, or atypical antipsychotic"
    tests:
      - PHQ-9 questionnaire (depression severity)
      - TSH (rule out hypothyroidism)
      - CBC, CMP (medical causes)
      - Vitamin B12, folate (if indicated)
    referrals:
      - Psychiatry for treatment-resistant depression or complex cases
      - Hospitalization if acute suicidal ideation with plan/intent
    sensitivity: 0.85
    specificity: 0.80
    icd10:
      - F32.9    # Major depressive disorder, single episode, unspecified
      - F33.1    # Major depressive disorder, recurrent, moderate
    snomed:
      - "370143000"  # Major depressive disorder

  - id: PSYCH-BIPOLAR-DISORDER
    label: Bipolar I Disorder
    presentations:
      - "Manic episode: ≥1 week of elevated/expansive or irritable mood"
      - Inflated self-esteem or grandiosity, decreased need for sleep (3 hours feels sufficient)
      - More talkative than usual, pressured speech, flight of ideas
      - Distractibility, increased goal-directed activity, psychomotor agitation
      - Excessive involvement in pleasurable activities (spending sprees, sexual indiscretions, risky investments)
      - Marked functional impairment, may require hospitalization
      - Depressive episodes also common (but not required for diagnosis)
    clinical_pearls:
      - "Bipolar I: At least one manic episode (depressive episodes common but not required)"
      - "Bipolar II: Hypomanic episodes + major depressive episodes (no full mania)"
      - "Mood stabilizers first-line: Lithium, valproate, lamotrigine, atypical antipsychotics"
      - "Avoid antidepressants alone: Can trigger mania or rapid cycling"
      - "Lithium levels: Therapeutic 0.6-1.2 mEq/L, check levels q3-6 months + TSH, Cr"
    management:
      - "Acute mania: Atypical antipsychotic (olanzapine 10-20mg, risperidone 2-6mg, quetiapine 400-800mg)"
      - "Mood stabilizer: Lithium 300mg BID-TID (titrate to level 0.6-1.2), or valproate 500-1500mg/day"
      - "Depressive episode: Lamotrigine 200mg daily, or quetiapine, or add antidepressant (with mood stabilizer)"
      - "Avoid: Antidepressants alone (risk mania), benzodiazepines long-term"
      - "Psychotherapy: CBT, family-focused therapy, psychoeducation"
    tests:
      - Mood Disorder Questionnaire (MDQ) for screening
      - "Lithium level (if on lithium): Therapeutic 0.6-1.2 mEq/L"
      - TSH, Cr, CBC (baseline and monitor with mood stabilizers)
      - Urine drug screen (substance-induced mania)
    referrals:
      - Psychiatry for all bipolar disorder
      - Hospitalization if manic with psychosis, danger to self/others, or severe impairment
    sensitivity: 0.80
    specificity: 0.85
    icd10:
      - F31.10   # Bipolar disorder, current episode manic without psychotic features, unspecified
      - F31.31   # Bipolar disorder, current episode depressed, mild
    snomed:
      - "13746004"  # Bipolar disorder

  - id: PSYCH-GENERALIZED-ANXIETY
    label: Generalized Anxiety Disorder (GAD)
    presentations:
      - Excessive anxiety and worry about multiple events/activities for ≥6 months
      - Difficulty controlling worry
      - Restlessness, feeling keyed up or on edge
      - Easily fatigued, difficulty concentrating, irritability
      - Muscle tension, sleep disturbance
      - Significant distress or functional impairment
      - Not attributable to substance use or medical condition
    clinical_pearls:
      - "GAD-7 score ≥10 suggests moderate-severe anxiety (screening tool)"
      - "SSRIs/SNRIs first-line: Escitalopram, sertraline, duloxetine, venlafaxine"
      - "Avoid benzodiazepines long-term: Dependence, tolerance, cognitive impairment"
      - "CBT highly effective: Cognitive restructuring, exposure, relaxation techniques"
      - "Buspirone: Non-benzodiazepine anxiolytic, takes 2-4 weeks, no dependence"
    management:
      - "SSRI: Escitalopram 10-20mg daily or sertraline 50-200mg daily (first-line)"
      - "SNRI: Venlafaxine XR 75-225mg daily or duloxetine 30-60mg daily"
      - "Buspirone: 15mg BID (titrate to 30mg BID), takes 2-4 weeks for effect"
      - "CBT: 12-16 sessions, focus on cognitive restructuring and exposure"
      - "Avoid: Long-term benzodiazepines (short-term PRN OK for acute anxiety)"
    tests:
      - GAD-7 questionnaire (anxiety severity)
      - TSH (hyperthyroidism can mimic anxiety)
      - ECG if palpitations (rule out arrhythmia)
      - "Consider: Urine drug screen, alcohol use assessment"
    referrals:
      - Psychiatry if treatment-resistant or complex comorbidities
      - Psychologist for CBT
    sensitivity: 0.82
    specificity: 0.80
    icd10:
      - F41.1    # Generalized anxiety disorder
    snomed:
      - "21897009"  # Generalized anxiety disorder

  - id: PSYCH-PANIC-DISORDER
    label: Panic Disorder
    presentations:
      - "Recurrent unexpected panic attacks: Sudden surge of intense fear/discomfort, peaks within minutes"
      - Palpitations, sweating, trembling, shortness of breath, chest pain
      - Nausea, dizziness, chills, paresthesias
      - Fear of losing control, "going crazy," or dying
      - Derealization (feeling of unreality) or depersonalization
      - Persistent concern about additional panic attacks or consequences (≥1 month)
      - Avoidance of situations that might trigger attacks (agoraphobia common)
    clinical_pearls:
      - "Rule out medical causes: Hyperthyroidism, arrhythmia, pheochromocytoma, substance use"
      - "SSRIs first-line: Sertraline, paroxetine, fluoxetine (take 4-6 weeks for effect)"
      - "Benzodiazepines PRN for acute attacks: Clonazepam 0.5-1mg or alprazolam 0.5-1mg (short-term only)"
      - "CBT very effective: Interoceptive exposure (deliberately induce physical sensations), cognitive restructuring"
      - "30-50% develop agoraphobia: Avoidance of public places where escape difficult"
    management:
      - "SSRI: Sertraline 50-200mg daily or paroxetine 20-60mg daily (first-line)"
      - "Benzodiazepine PRN: Clonazepam 0.5-1mg or alprazolam 0.5-1mg (acute attacks only, avoid daily use)"
      - "CBT: Exposure therapy, interoceptive exposure, cognitive restructuring (12-16 sessions)"
      - "Breathing techniques: Slow diaphragmatic breathing during attacks"
      - "Taper benzos after SSRI effective (4-6 weeks)"
    tests:
      - ECG (rule out arrhythmia)
      - TSH (hyperthyroidism)
      - Urine drug screen (stimulants, caffeine excess)
      - "Consider: Holter monitor if palpitations, metanephrines (pheochromocytoma)"
    referrals:
      - Psychiatry if treatment-resistant or severe agoraphobia
      - Psychologist for CBT
    sensitivity: 0.85
    specificity: 0.82
    icd10:
      - F41.0    # Panic disorder without agoraphobia
      - F40.01   # Agoraphobia with panic disorder
    snomed:
      - "371631005"  # Panic disorder

  - id: PSYCH-SCHIZOPHRENIA
    label: Schizophrenia
    presentations:
      - "Positive symptoms: Delusions, hallucinations (auditory most common), disorganized speech/behavior"
      - "Negative symptoms: Flat affect, alogia (poverty of speech), avolition (lack of motivation), anhedonia"
      - "Cognitive symptoms: Impaired attention, memory, executive function"
      - Symptoms ≥6 months, with ≥1 month of active-phase symptoms
      - Significant functional decline (work, relationships, self-care)
      - "First-episode psychosis: Typically late teens to early 30s"
    clinical_pearls:
      - "Rule out medical/substance causes: Drugs (stimulants, cannabis), delirium, brain tumor, autoimmune encephalitis"
      - "Atypical antipsychotics first-line: Risperidone, olanzapine, quetiapine, aripiprazole"
      - "Clozapine for treatment-resistant: Most effective but requires weekly CBC (agranulocytosis risk)"
      - "Long-acting injectables: Improve adherence (paliperidone, risperidone, aripiprazole monthly)"
      - "Monitor: Weight, glucose, lipids (metabolic syndrome common with antipsychotics)"
    management:
      - "Atypical antipsychotic: Risperidone 2-6mg/day, olanzapine 10-20mg/day, or quetiapine 400-800mg/day"
      - "Aripiprazole 10-30mg/day: Lower metabolic side effects"
      - "Clozapine 300-450mg/day: If treatment-resistant (failed 2+ antipsychotics), requires weekly CBC"
      - "Psychosocial: Supported employment, cognitive remediation, family psychoeducation"
      - "Hospitalization if: Acute psychosis with danger to self/others, unable to care for self"
    tests:
      - Urine drug screen (rule out substance-induced psychosis)
      - CBC, CMP, TSH (medical causes)
      - MRI brain if atypical presentation (first episode, focal neuro signs)
      - "Baseline: Weight, BMI, glucose, HgA1c, lipid panel (before starting antipsychotics)"
    referrals:
      - Psychiatry for all schizophrenia
      - Hospitalization if acute psychosis, danger to self/others
      - Assertive community treatment (ACT) team for severe cases
    sensitivity: 0.75
    specificity: 0.80
    icd10:
      - F20.9    # Schizophrenia, unspecified
      - F20.0    # Paranoid schizophrenia
    snomed:
      - "58214004"  # Schizophrenia

  - id: PSYCH-PTSD
    label: Post-Traumatic Stress Disorder (PTSD)
    presentations:
      - Exposure to actual/threatened death, serious injury, or sexual violence
      - "Intrusive symptoms: Recurrent distressing memories, nightmares, flashbacks"
      - "Avoidance: Avoids trauma-related thoughts, feelings, reminders"
      - "Negative alterations in cognition/mood: Inability to recall trauma details, negative beliefs, persistent negative emotions"
      - "Hyperarousal: Irritability, hypervigilance, exaggerated startle response, sleep disturbance"
      - Duration >1 month, significant distress/impairment
    clinical_pearls:
      - "PCL-5 score ≥33 suggests PTSD (screening tool)"
      - "SSRIs first-line: Sertraline, paroxetine (FDA-approved for PTSD)"
      - "Trauma-focused psychotherapy gold standard: Prolonged exposure (PE), CPT (cognitive processing therapy), EMDR"
      - "Prazosin for nightmares: Alpha-blocker, 2-15mg at bedtime (evidence mixed but commonly used)"
      - "Screen for comorbidities: Depression (50%), substance use (30%), TBI common in veterans"
    management:
      - "SSRI: Sertraline 50-200mg daily or paroxetine 20-60mg daily"
      - "Trauma-focused psychotherapy: Prolonged exposure (PE) or CPT (8-15 sessions)"
      - "EMDR (Eye Movement Desensitization and Reprocessing): Evidence-based alternative"
      - "Prazosin 2-15mg at bedtime for nightmares (start 1mg, titrate)"
      - "Avoid benzodiazepines: Not effective for PTSD, worsen outcomes"
    tests:
      - PCL-5 questionnaire (PTSD severity)
      - PHQ-9 (depression screening)
      - Urine drug screen, alcohol assessment
      - "Consider: TBI screening (in military/veterans)"
    referrals:
      - Psychiatry for complex cases or comorbidities
      - Trauma-focused psychotherapist (PE, CPT, EMDR)
      - Substance use treatment if comorbid
    sensitivity: 0.82
    specificity: 0.85
    icd10:
      - F43.10   # Post-traumatic stress disorder, unspecified
    snomed:
      - "47505003"  # Posttraumatic stress disorder
