family: allergy
version: 0.1.0
source: American Academy of Allergy, Asthma & Immunology (AAAAI) Guidelines, World Allergy Organization (WAO) Guidelines
rules:

- id: ALLERGY-URTICARIA
  label: Urticaria (Hives)
  presentations:
  - Pruritic wheals (raised, blanching lesions)
  - Transient lesions that resolve within 24 hours
  - Central pallor with erythematous border
  - Variable size from few millimeters to large plaques
  - Migratory pattern (lesions appear and disappear in different locations)
  - May have angioedema (deeper swelling of face, lips, tongue, extremities)
  - Worse with heat, pressure, or scratching
  - Associated with flushing or warmth
  - Triggered by allergens (food, medications, insect stings)
  - Can occur with infections (viral URI), stress, or physical stimuli
  - May have dermographism (skin writing from light scratching)
  - Systemic symptoms if anaphylaxis (dyspnea, hypotension, GI symptoms)
  clinical_pearls:
  - 'Acute urticaria (<6 weeks): Usually identifiable trigger (food, medication, infection)'
  - 'Chronic urticaria (>6 weeks): Often idiopathic, autoimmune in 30-50% of cases'
  - Individual lesions resolve in <24 hours (if longer, consider urticarial vasculitis)
  - 'Angioedema without urticaria: Consider ACE inhibitor, hereditary angioedema, C1 esterase deficiency'
  - 'Common triggers: Foods (shellfish, nuts, eggs), medications (NSAIDs, antibiotics, opioids), infections (viral URI)'
  - 'Physical urticaria subtypes: Dermatographism (most common), cold-induced, cholinergic (exercise/heat), solar, pressure-induced'
  - Up to 20% of population experiences urticaria at some point in life
  - 'Chronic urticaria can last years: 50% resolve by 1 year, 20% persist >10 years'
  management:
  - 'Guideline-based treatment options for Urticaria (Hives) include:'
  - 'First-line acute: Non-sedating H1 antihistamine (cetirizine 10mg, loratadine 10mg, or fexofenadine 180mg daily) (AAAAI 2023)'
  - Can increase H1 antihistamine up to 4x standard dose if inadequate response (AAAAI 2023)
  - Add H2 blocker (famotidine 20mg BID) if inadequate response to H1 blocker alone (AAAAI 2023)
  - 'Severe/angioedema: Prednisone 40-60mg daily for 3-7 days, avoid long-term steroids (AAAAI 2023)'
  - 'Airway angioedema: Epinephrine 0.3-0.5mg IM, consider ICU monitoring (AAAAI 2023)'
  - 'Chronic urticaria: Daily non-sedating H1 antihistamine, increase to 4x dose before adding other agents (AAAAI 2023)'
  - 'Refractory chronic urticaria: Omalizumab (anti-IgE) 150-300mg SQ every 4 weeks (first-line add-on) (AAAAI 2023)'
  - 'Alternative for refractory: Cyclosporine 3-5mg/kg/day (requires monitoring) (AAAAI 2023)'
  - Avoid aspirin and NSAIDs as they can worsen urticaria
  - Identify and eliminate triggers when possible (food diary, medication review)
  tests:
  - Acute urticaria: Usually clinical diagnosis, no routine testing needed
  - 'Chronic urticaria workup: CBC with differential, ESR or CRP, TSH (thyroid autoimmunity common)'
  - Serum tryptase if concern for mastocytosis (urticaria pigmentosa, systemic symptoms)
  - 'Complement levels (C4, C1q, C1 esterase inhibitor) if recurrent angioedema without urticaria'
  - Skin biopsy if lesions persist >24 hours or have purpura (rule out urticarial vasculitis)
  - 'Allergy testing: Skin prick or specific IgE only if clear trigger history (not routine)'
  - 'Autologous serum skin test (ASST) can identify autoimmune urticaria but doesn''t change management'
  referrals:
  - Allergy/Immunology for chronic urticaria or when first-line therapy fails
  - Consider for recurrent angioedema or suspected hereditary angioedema
  - Dermatology if concern for urticarial vasculitis or atypical features
  icd10:
  - L50.9
  - L50.0
  - L50.1
  snomed:
  - '126485001'
  citations:
  - American Academy of Allergy, Asthma & Immunology (AAAAI) Urticaria Guidelines 2023
  - Zuberbier T, et al. EAACI/GA2LEN/EDF/WAO guideline for urticaria. Allergy. 2022
  - Bernstein JA, et al. Diagnosis and management of chronic urticaria. J Allergy Clin Immunol. 2022

- id: ALLERGY-ANAPHYLAXIS
  label: Anaphylaxis
  presentations:
  - Acute onset (minutes to hours) of skin/mucosal involvement (urticaria, angioedema, flushing, pruritus)
  - Respiratory compromise (dyspnea, wheezing, stridor, hypoxemia, throat tightness)
  - Cardiovascular collapse (hypotension, syncope, shock, tachycardia)
  - Gastrointestinal symptoms (nausea, vomiting, diarrhea, abdominal cramping)
  - Sense of impending doom or anxiety
  - Lightheadedness or dizziness
  - Can occur without skin manifestations in 10-20% of cases
  - 'Biphasic reaction in 20%: Recurrence 4-72 hours after initial episode'
  - 'Common triggers: Foods (peanuts, tree nuts, shellfish, eggs), medications (penicillin, NSAIDs), insect stings (bee, wasp)'
  - May progress rapidly to cardiovascular collapse within minutes
  - Involvement of ≥2 organ systems (skin, respiratory, CV, GI) with rapid onset
  clinical_pearls:
  - Life-threatening emergency requiring immediate epinephrine
  - Diagnosis is clinical - do not delay treatment for testing
  - 'Criteria: Involvement of ≥2 organ systems (skin, respiratory, CV, GI) with rapid onset'
  - Can occur without skin manifestations in 10-20% of cases
  - Epinephrine 0.3-0.5mg IM (1:1000) anterolateral thigh - repeat every 5-15 min if needed
  - Early epinephrine improves outcomes - delay is associated with fatalities
  - Antihistamines and steroids are adjunctive only, NOT first-line
  - Observe minimum 4-8 hours due to biphasic reaction risk
  - All patients should be prescribed epinephrine auto-injectors (EpiPen) and taught how to use
  management:
  - 'Guideline-based treatment options for Anaphylaxis include:'
  - 'FIRST-LINE: Epinephrine 0.3-0.5mg IM (1:1000) anterolateral thigh immediately (AAAAI 2023)'
  - Repeat epinephrine every 5-15 minutes if no response or worsening symptoms (AAAAI 2023)
  - Place patient supine with legs elevated (or left lateral if pregnant/vomiting) (AAAAI 2023)
  - High-flow oxygen, establish IV access, aggressive fluid resuscitation if hypotensive (AAAAI 2023)
  - 'Adjunctive H1 antihistamine: Diphenhydramine 25-50mg IV/IM (helps pruritus, NOT life-saving) (AAAAI 2023)'
  - 'Adjunctive H2 blocker: Ranitidine 50mg or famotidine 20mg IV (AAAAI 2023)'
  - 'Corticosteroids: Methylprednisolone 125mg IV or prednisone 60mg PO (may reduce biphasic reaction) (AAAAI 2023)'
  - 'Refractory hypotension: Epinephrine infusion 0.1-1 mcg/kg/min, glucagon 1-5mg IV if on beta-blockers (AAAAI 2023)'
  - 'Bronchospasm refractory to epinephrine: Inhaled albuterol 2.5-5mg nebulized (AAAAI 2023)'
  - Observe minimum 4-8 hours (longer if severe or biphasic reaction concern)
  - Discharge with epinephrine auto-injector x2 and anaphylaxis action plan
  - Follow-up with allergist within 1-2 weeks for trigger identification and prevention plan
  tests:
  - Diagnosis is clinical - do not delay treatment for testing
  - Serum tryptase level if obtained within 1-2 hours can confirm diagnosis (elevated in 60-80%)
  - 'Allergy testing after resolution: Skin prick or specific IgE to suspected triggers (food, venom, medications)'
  - Consider serum tryptase baseline (if elevated, suggests mastocytosis)
  referrals:
  - All patients require Allergy/Immunology referral for trigger identification and venom immunotherapy if indicated
  - Consider if recurrent idiopathic anaphylaxis or unclear trigger
  icd10:
  - T78.2
  - T78.00
  snomed:
  - '39579001'
  citations:
  - Shaker MS, et al. Anaphylaxis - a 2020 practice parameter update. Ann Allergy Asthma Immunol. 2020
  - American Academy of Allergy, Asthma & Immunology (AAAAI) Anaphylaxis Guidelines 2023
  - Cardona V, et al. World Allergy Organization anaphylaxis guidance 2020

- id: ALLERGY-ALLERGIC-RHINITIS
  label: Allergic Rhinitis (Hay Fever)
  presentations:
  - Nasal congestion and rhinorrhea (clear discharge)
  - Sneezing (often paroxysmal)
  - Nasal itching
  - Postnasal drip
  - Itchy, watery eyes (allergic conjunctivitis)
  - Itching of palate or throat
  - Worse with allergen exposure (seasonal pollens, perennial dust mites, pet dander, mold)
  - Symptoms improve when away from allergen
  - May have dark circles under eyes ("allergic shiners")
  - Nasal crease from frequent nose rubbing
  - Pale, boggy nasal mucosa on exam
  - Associated with asthma, eczema, or food allergies
  clinical_pearls:
  - Most common allergic disorder, affects 10-30% of population
  - 'Seasonal vs perennial: Seasonal (pollen - spring trees, summer grass, fall ragweed), Perennial (dust mites, pets, mold)'
  - Often begins in childhood, can develop at any age
  - Associated with asthma (80% of asthmatics have allergic rhinitis)
  - Chronic inflammation can lead to sinusitis, sleep disturbance, impaired quality of life
  - 'Allergic salute: Upward rubbing of nose causing transverse nasal crease'
  - Untreated can lead to complications: chronic sinusitis, otitis media, asthma exacerbations
  management:
  - 'Guideline-based treatment options for Allergic Rhinitis include:'
  - 'First-line: Intranasal corticosteroid (fluticasone, mometasone, triamcinolone) daily (AAAAI 2023)'
  - 'Add non-sedating oral H1 antihistamine (cetirizine, loratadine, fexofenadine) for breakthrough symptoms (AAAAI 2023)'
  - 'Intranasal antihistamine (azelastine) can be added if inadequate response to steroid alone (AAAAI 2023)'
  - Allergen avoidance measures (dust mite covers, HEPA filters, pet avoidance if applicable)
  - Saline nasal irrigation can provide symptom relief
  - 'For severe or refractory: Allergen immunotherapy (allergy shots or sublingual tablets) (AAAAI 2023)'
  - Avoid prolonged use of oral decongestants (pseudoephedrine) - can cause rebound congestion
  - 'Pregnancy: Intranasal steroids generally safe (budesonide pregnancy category B) (AAAAI 2023)'
  tests:
  - Clinical diagnosis based on history and exam
  - 'Allergy testing if considering immunotherapy or unclear triggers: Skin prick test (preferred) or specific IgE blood test'
  - Nasal endoscopy if concern for structural abnormality (polyps, deviated septum)
  referrals:
  - Allergy/Immunology if considering immunotherapy or unclear diagnosis
  - ENT if structural abnormality, chronic sinusitis, or refractory symptoms
  icd10:
  - J30.9
  - J30.1
  - J30.2
  snomed:
  - '61582004'
  citations:
  - Seidman MD, et al. Clinical practice guideline: Allergic rhinitis. Otolaryngol Head Neck Surg. 2015
  - American Academy of Allergy, Asthma & Immunology (AAAAI) Rhinitis Guidelines 2023
