family: nephrology
version: 0.1.0
source: 'Kidney Disease: Improving Global Outcomes (KDIGO) Guidelines, American Society
  of Nephrology (ASN)'
rules:
- id: NEPHRO-AKI
  label: Acute Kidney Injury
  presentations:
  - Decreased urine output
  - Elevated creatinine
  - Fluid overload
  - Nausea and vomiting
  - Confusion
  - Uremic symptoms
  clinical_pearls:
  - 'KDIGO criteria: Cr increase ≥0.3 mg/dL in 48hr OR increase ≥1.5x baseline in
    7 days OR UOP <0.5 mL/kg/hr x 6hr'
  - 'Classify etiology: Prerenal (70% - volume depletion), intrinsic (ATN, GN, AIN),
    postrenal (obstruction)'
  - FeNa <1% = prerenal; >2% = ATN/intrinsic (not reliable if on diuretics - use FeUrea)
  - Muddy brown casts = ATN; RBC casts = glomerulonephritis; WBC casts = pyelonephritis/AIN
  - 'Mortality increases with stage: Stage 1 (10%), Stage 2 (25%), Stage 3 (50%)'
  management:
  - 'Guideline-based treatment options for Acute Kidney Injury include:'
  - 'Identify and treat underlying cause: Fluids if prerenal, stop nephrotoxins (NSAIDs,
    aminoglycosides) (Guidelines) (Guidelines 2023)'
  - Monitor ins/outs, daily weights, strict fluid balance (Guidelines) (Guidelines
    2023)
  - Adjust medication doses for GFR, avoid contrast if possible (Guidelines) (Guidelines
    2023)
  - 'Indications for dialysis (AEIOU): Acidosis (pH <7.1), Electrolytes (K+ >6.5),
    Ingestion (toxins), Overload (pulmonary edema), Uremia (pericarditis, encephalopathy)
    (Guidelines) (Guidelines 2023)'
  - 'Supportive: Nutrition, prevent complications (Guidelines) (Guidelines 2023)'
  tests:
  - Basic metabolic panel (Cr, BUN, electrolytes) - serial monitoring
  - Urinalysis with microscopy (casts, cells)
  - Urine sodium, FeNa (fractional excretion of sodium)
  - Renal ultrasound (assess size, hydronephrosis, obstruction)
  - Consider renal biopsy if unclear etiology after workup
  referrals:
  - Nephrology consult for all AKI
  - Dialysis if AEIOU criteria met
  - ICU if severe (oliguric, hyperkalemia, acidosis)
  icd10:
  - N17.9
  - N17.0
  - N17.1
  snomed:
  - '14669001'
- id: NEPHRO-CKD
  label: Chronic Kidney Disease
  presentations:
  - Gradual decline in kidney function
  - Hypertension
  - Anemia
  - Bone disease
  - Proteinuria
  - Edema
  clinical_pearls:
  - 'Stages: G1 (eGFR ≥90), G2 (60-89), G3a (45-59), G3b (30-44), G4 (15-29), G5 (<15
    or dialysis)'
  - 'Most common causes: Diabetes (40%), hypertension (25%), glomerulonephritis'
  - 'Complications: Anemia (low EPO), bone disease (high PTH), hyperkalemia, acidosis,
    uremia'
  - ACEi/ARBs slow progression (reduce proteinuria), especially if diabetes
  - 'Monitor: eGFR, electrolytes, calcium, phosphate, PTH, hemoglobin every 3-6 months'
  - Nephrology referral when eGFR <30 (stage G4) or rapidly declining
  management:
  - 'Guideline-based treatment options for Chronic Kidney Disease include:'
  - 'Treat underlying cause: Tight glucose control (diabetes), BP control (goal <130/80)
    (Guidelines) (Guidelines 2023)'
  - ACEi or ARB (slow progression, reduce proteinuria) - monitor Cr, K+ (Guidelines)
    (Guidelines 2023)
  - 'Anemia: Erythropoietin (EPO) if Hgb <10, iron supplementation (Guidelines) (Guidelines
    2023)'
  - 'Bone disease: Phosphate binders (sevelamer, calcium acetate), vitamin D (Guidelines)
    (Guidelines 2023)'
  - 'Prepare for dialysis: AV fistula placement when eGFR <20 (Guidelines) (Guidelines
    2023)'
  tests:
  - eGFR (calculated from Cr using CKD-EPI equation)
  - Urinalysis + urine albumin-to-creatinine ratio (UACR)
  - Basic metabolic panel, CBC, calcium, phosphate, PTH
  - Renal ultrasound (kidney size - small kidneys suggest chronic disease)
  referrals:
  - Nephrology when eGFR <30 (stage G4), rapidly declining (≥5 mL/min/year), or resistant
    HTN
  - Vascular surgery for AV fistula placement when eGFR <20
  - Transplant evaluation when eGFR <20
  icd10:
  - N18.3
  - N18.4
  - N18.5
  - N18.6
  snomed:
  - '709044004'
- id: NEPHRO-NEPHROTIC
  label: Nephrotic Syndrome
  presentations:
  - Massive proteinuria (>3.5 g/day)
  - Hypoalbuminemia
  - Edema (periorbital, pedal)
  - Hyperlipidemia
  - Frothy urine
  clinical_pearls:
  - 'Classic tetrad: Proteinuria >3.5g/day, hypoalbuminemia <3.0, edema, hyperlipidemia'
  - 'Most common primary causes: Minimal change disease (children), FSGS, membranous
    nephropathy (adults)'
  - 'Secondary causes: Diabetes (most common overall), amyloidosis, lupus, NSAIDs,
    infections (HIV, hepatitis)'
  - 'Hypercoagulable state: Loss of antithrombin III → increased VTE risk'
  - 'Minimal change disease: Responds to steroids (95% remission), most common in
    children'
  management:
  - 'Guideline-based treatment options for Nephrotic Syndrome include:'
  - 'Treat edema: Diuretics (furosemide 40-80mg daily), sodium restriction <2g/day
    (Guidelines) (Guidelines 2023)'
  - ACEi or ARB (reduce proteinuria) (Guidelines) (Guidelines 2023)
  - Statins for hyperlipidemia (Guidelines) (Guidelines 2023)
  - Anticoagulation if albumin <2.5 (high VTE risk) (Guidelines) (Guidelines 2023)
  - 'Primary glomerular disease: Steroids (minimal change), immunosuppression (FSGS,
    membranous) (Guidelines) (Guidelines 2023)'
  tests:
  - 24-hour urine protein or spot urine protein-to-creatinine ratio (>3.5g/day or
    >3.0)
  - Serum albumin (<3.0 g/dL)
  - Lipid panel (elevated cholesterol, triglycerides)
  - Renal biopsy (definitive diagnosis, determines specific glomerular disease)
  - 'Consider: Hepatitis B/C serologies, ANA, complement levels, SPEP/UPEP (amyloid,
    myeloma)'
  referrals:
  - Nephrology for all nephrotic syndrome (renal biopsy, management)
  - Consider renal biopsy if not responsive to initial therapy or unclear etiology
  icd10:
  - N04.9
  snomed:
  - '52254009'
- id: NEPHRO-NEPHRITIC
  label: Acute Nephritic Syndrome
  presentations:
  - Hematuria
  - Proteinuria (< 3.5 g/day)
  - Hypertension
  - Edema
  - Oliguria
  - Red cell casts
  clinical_pearls:
  - Glomerular inflammation → hematuria (tea/cola-colored urine), RBC casts, hypertension,
    edema
  - 'Post-streptococcal GN: Most common pediatric cause, 1-3 weeks after strep pharyngitis
    or impetigo'
  - 'IgA nephropathy (Berger disease): Most common primary GN worldwide, hematuria
    during URI'
  - 'RPGN (rapidly progressive GN): Crescent formation, rapid decline in GFR (weeks)
    - needs urgent treatment'
  - 'Low C3/C4 complement: Post-strep GN, lupus nephritis, MPGN'
  management:
  - 'Guideline-based treatment options for Acute Nephritic Syndrome include:'
  - 'Supportive: Fluid/sodium restriction, diuretics for edema, antihypertensives
    (Guidelines) (Guidelines 2023)'
  - 'Post-strep GN: Supportive only (self-limited in 4-6 weeks), antibiotics if active
    infection (Guidelines) (Guidelines 2023)'
  - 'RPGN: Urgent therapy - steroids, cyclophosphamide, plasmapheresis (based on etiology)
    (Guidelines) (Guidelines 2023)'
  - 'IgA nephropathy: ACEi/ARB to reduce proteinuria, steroids if rapidly progressive
    (Guidelines) (Guidelines 2023)'
  - Dialysis if severe AKI (Guidelines) (Guidelines 2023)
  tests:
  - 'Urinalysis: RBC casts (pathognomonic for GN), dysmorphic RBCs, proteinuria'
  - Serum creatinine, BUN (assess kidney function)
  - Complement levels (C3, C4) - low suggests post-infectious, lupus, MPGN
  - ASO titer, anti-DNase B (post-streptococcal GN)
  - ANA, anti-dsDNA (lupus nephritis), ANCA (vasculitis), anti-GBM (Goodpasture)
  - Renal biopsy if diagnosis unclear or suspected RPGN
  referrals:
  - Nephrology for all nephritic syndrome (urgent if RPGN suspected)
  - Renal biopsy if diagnosis unclear or suspected RPGN
  icd10:
  - N00.9
  - N05.9
  snomed:
  - '236455006'
- id: NEPHRO-KIDNEY-STONE
  label: Nephrolithiasis (Kidney Stones)
  presentations:
  - Severe colicky flank pain
  - Hematuria
  - Nausea and vomiting
  - Pain radiating to groin
  - Unable to find comfortable position
  clinical_pearls:
  - 'Most common type: Calcium oxalate (80%), then uric acid (10%), struvite (infection),
    cystine (rare)'
  - 'Stones <5mm: 90% pass spontaneously with conservative management'
  - 'Stones >10mm: Unlikely to pass, usually need intervention'
  - CT without contrast is gold standard (100% sensitivity), detects all stone types
  - Tamsulosin (alpha-blocker) facilitates stone passage (medical expulsive therapy)
  - Recurrence rate 50% at 5-10 years
  management:
  - 'Guideline-based treatment options for Nephrolithiasis (Kidney Stones) include:'
  - 'Pain control: NSAIDs (ketorolac 30mg IV) preferred over opioids (equally effective,
    less nausea) (Guidelines) (Guidelines 2023)'
  - 'Antiemetics: Ondansetron 4-8mg IV PRN (Guidelines) (Guidelines 2023)'
  - 'Hydration: Encourage PO fluids (no benefit to IV fluids unless unable to tolerate
    PO) (Guidelines) (Guidelines 2023)'
  - 'Medical expulsive therapy: Tamsulosin 0.4mg daily (helps stones 5-10mm pass)
    (Guidelines) (Guidelines 2023)'
  - 'Intervention if: Stone >10mm, obstruction with infection, intractable pain, solitary
    kidney (Guidelines) (Guidelines 2023)'
  tests:
  - CT abdomen/pelvis without contrast (gold standard, 100% sensitive)
  - Urinalysis (hematuria in 85%, but absence doesn't rule out stone)
  - Basic metabolic panel (Cr, assess for AKI if obstruction)
  - Stone analysis if passed (guides prevention)
  - 24-hour urine collection (calcium, oxalate, citrate, uric acid) if recurrent
  referrals:
  - 'Urology if: Stone >10mm, obstruction with infection, intractable pain, failed
    conservative management'
  - 'Procedures: Shock wave lithotripsy (ESWL), ureteroscopy, percutaneous nephrolithotomy
    (PCNL)'
  - Nephrology if recurrent stones for metabolic workup
  icd10:
  - N20.0
  - N20.2
  snomed:
  - '95570007'
- id: NEPHRO-PYELONEPHRITIS
  label: Acute Pyelonephritis
  presentations:
  - Fever and chills
  - Flank pain
  - CVA tenderness
  - Dysuria and urinary frequency
  - Nausea and vomiting
  clinical_pearls:
  - Upper urinary tract infection (kidney), E. coli causes 80%
  - WBC casts pathognomonic for pyelonephritis
  - 'Uncomplicated: Young, healthy women - outpatient oral antibiotics'
  - 'Complicated: Male, pregnant, catheter, obstruction, immunocompromised - admission
    for IV antibiotics'
  - Imaging not needed for uncomplicated; CT if severe or no improvement in 48-72
    hours (rule out abscess)
  - Sepsis can develop rapidly - low threshold for admission
  management:
  - 'Guideline-based treatment options for Acute Pyelonephritis include:'
  - 'Outpatient: Ciprofloxacin 500mg PO BID x 7 days or levofloxacin 750mg daily x
    5 days (Guidelines) (Guidelines 2023)'
  - 'Alternative: Ceftriaxone 1g IV/IM x 1 dose, then cefpodoxime or ciprofloxacin
    PO (Guidelines) (Guidelines 2023)'
  - 'Inpatient: Ceftriaxone 1-2g IV daily or fluoroquinolone IV (levofloxacin 750mg)
    (Guidelines) (Guidelines 2023)'
  - 'If severe/septic: Piperacillin-tazobactam 3.375g IV q6h or carbapenem (Guidelines)
    (Guidelines 2023)'
  - 'Duration: 7 days (fluoroquinolone) or 10-14 days (beta-lactam) (Guidelines) (Guidelines
    2023)'
  tests:
  - Urinalysis (pyuria, WBC casts, bacteriuria)
  - Urine culture (before antibiotics)
  - Blood cultures if admitted or severe
  - CT abdomen/pelvis with IV contrast if complicated or no improvement in 48-72hr
    (rule out abscess, obstruction)
  - Renal ultrasound if pregnant (avoid radiation)
  referrals:
  - 'Admission if: Sepsis, pregnant, obstruction, immunocompromised, unable to tolerate
    PO, social concerns'
  - Urology if obstruction or recurrent infections
  - Interventional radiology if abscess needs drainage
  icd10:
  - N10
  - N12
  snomed:
  - '45816000'
- id: NEPHRO-GN
  label: Glomerulonephritis
  presentations:
  - Hematuria (tea-colored urine)
  - Proteinuria
  - Hypertension
  - Edema
  - Recent infection (post-streptococcal)
  clinical_pearls:
  - Glomerular inflammation → hematuria, RBC casts, proteinuria, hypertension
  - 'Post-streptococcal GN: 1-3 weeks after strep pharyngitis or impetigo, low C3,
    self-limited'
  - 'IgA nephropathy: Most common primary GN, hematuria concurrent with URI (synpharyngitic)'
  - 'RPGN: Rapidly progressive GN with crescent formation, GFR declines over days-weeks
    (urgent treatment)'
  - RBC casts pathognomonic for glomerulonephritis
  management:
  - 'Guideline-based treatment options for Glomerulonephritis include:'
  - 'Supportive: Fluid/sodium restriction, diuretics (furosemide), antihypertensives
    (ACEi/ARB) (Guidelines) (Guidelines 2023)'
  - 'Post-strep GN: Supportive only, resolves spontaneously in 4-6 weeks (Guidelines)
    (Guidelines 2023)'
  - 'IgA nephropathy: ACEi/ARB (reduce proteinuria), fish oil, steroids if progressive
    (Guidelines) (Guidelines 2023)'
  - 'RPGN: Urgent immunosuppression - high-dose steroids (methylprednisolone 1g IV
    daily x 3d) + cyclophosphamide (Guidelines) (Guidelines 2023)'
  - Plasmapheresis if anti-GBM disease (Goodpasture) or severe ANCA vasculitis (Guidelines)
    (Guidelines 2023)
  tests:
  - 'Urinalysis: RBC casts (pathognomonic), dysmorphic RBCs, proteinuria'
  - Serum Cr, BUN (assess kidney function, follow serial Cr if RPGN suspected)
  - 'Complement (C3, C4): Low in post-strep, lupus, MPGN'
  - 'Serologies: ASO/anti-DNase B (post-strep), ANA/anti-dsDNA (lupus), ANCA (vasculitis),
    anti-GBM (Goodpasture)'
  - Renal biopsy (definitive diagnosis, especially if RPGN or unclear etiology)
  referrals:
  - Nephrology for all glomerulonephritis (URGENT if RPGN suspected)
  - Renal biopsy if diagnosis unclear or rapidly progressive
  - Dialysis if severe AKI
  icd10:
  - N05.9
  - N03.9
  snomed:
  - '36171008'
- id: NEPHRO-ESRD
  label: End-Stage Renal Disease
  presentations:
  - Uremic symptoms
  - Requiring dialysis
  - Severe fluid overload
  - Metabolic acidosis
  - Hyperkalemia
  - Anemia
  clinical_pearls:
  - CKD Stage 5 (eGFR <15 mL/min/1.73m²) or requiring dialysis
  - 'Uremic symptoms: Nausea, anorexia, pruritus, metallic taste, confusion, pericarditis,
    platelet dysfunction'
  - 'Dialysis indications (AEIOU): Acidosis, Electrolytes (K+ >6.5), Ingestion, Overload
    (pulmonary edema), Uremia'
  - 'Three dialysis options: Hemodialysis (in-center 3x/week), peritoneal dialysis
    (home daily), or transplant (best outcomes)'
  - AV fistula creation when eGFR <20 (needs 2-3 months to mature before use)
  management:
  - 'Guideline-based treatment options for End-Stage Renal Disease include:'
  - 'Dialysis: Hemodialysis 3-4 hours 3x/week or peritoneal dialysis daily (Guidelines)
    (Guidelines 2023)'
  - Erythropoietin (EPO) for anemia (target Hgb 10-11.5 g/dL) (Guidelines) (Guidelines
    2023)
  - Phosphate binders with meals (sevelamer, calcium acetate) (Guidelines) (Guidelines
    2023)
  - Vitamin D supplementation (calcitriol or paricalcitol) (Guidelines) (Guidelines
    2023)
  - Kidney transplant evaluation (best long-term outcomes) (Guidelines) (Guidelines
    2023)
  tests:
  - Basic metabolic panel (Cr, K+, bicarb, calcium, phosphate) - frequent monitoring
  - CBC (anemia), PTH (secondary hyperparathyroidism)
  - Kt/V (dialysis adequacy measure)
  - Echocardiogram (assess for uremic cardiomyopathy)
  referrals:
  - Nephrology managing care
  - Vascular surgery for AV fistula creation
  - Transplant surgery for kidney transplant evaluation (best if done before dialysis
    initiation)
  - Palliative care for symptom management and goals of care discussions
  icd10:
  - N18.6
  snomed:
  - '46177005'
- id: NEPHRO-POLYCYSTIC
  label: Polycystic Kidney Disease
  presentations:
  - Flank pain
  - Hematuria
  - Hypertension
  - Palpable kidneys
  - Family history
  - Progressive renal insufficiency
  clinical_pearls:
  - Autosomal dominant PKD (ADPKD) most common, presents 30-50 years old
  - Bilateral kidney cysts, also liver cysts (75%), intracranial aneurysms (10%),
    mitral valve prolapse
  - 'Screen for aneurysms: MRA brain if family history of aneurysm or hemorrhagic
    stroke'
  - 'Complications: Hypertension (75%), kidney stones, UTIs, hematuria, ruptured cysts'
  - 50% progress to ESRD by age 60
  - Tolvaptan (vasopressin antagonist) slows cyst growth and eGFR decline in select
    patients
  management:
  - 'Guideline-based treatment options for Polycystic Kidney Disease include:'
  - 'Hypertension control: Goal <120/80, ACEi or ARB first-line (Guidelines) (Guidelines
    2023)'
  - Tolvaptan 45-120mg daily if rapidly progressive (slows cyst growth, only if eGFR
    >25) (Guidelines) (Guidelines 2023)
  - 'Treat complications: Antibiotics for cyst infections (fluoroquinolones penetrate
    cysts), lithotripsy for stones (Guidelines) (Guidelines 2023)'
  - 'Hydration: Encourage fluid intake 3-4L/day (Guidelines) (Guidelines 2023)'
  - Screen family members (ultrasound at age 20-30) (Guidelines) (Guidelines 2023)
  tests:
  - Renal ultrasound (multiple bilateral cysts, enlarged kidneys)
  - CT or MRI (more sensitive, quantifies total kidney volume)
  - Basic metabolic panel, eGFR (monitor kidney function)
  - MRA brain if family history of aneurysm or hemorrhagic stroke (screen for intracranial
    aneurysms)
  - Genetic testing if diagnosis uncertain
  referrals:
  - Nephrology for all PKD (monitor progression, consider tolvaptan)
  - Neurosurgery if intracranial aneurysm detected
  - Genetic counseling for family planning
  - Transplant evaluation if eGFR <20
  icd10:
  - Q61.3
  - Q61.2
  snomed:
  - '28728004'
- id: NEPHRO-RTA
  label: Renal Tubular Acidosis
  presentations:
  - Metabolic acidosis
  - Normal anion gap
  - Hypokalemia or hyperkalemia
  - Nephrolithiasis
  - Growth retardation (children)
  clinical_pearls:
  - 'Type 1 (distal RTA): Cannot acidify urine (urine pH >5.5), hypokalemia, kidney
    stones (calcium phosphate)'
  - 'Type 2 (proximal RTA): Impaired bicarb reabsorption, hypokalemia, Fanconi syndrome'
  - 'Type 4: Hypoaldosteronism (diabetes, NSAIDs), hyperkalemia, mild acidosis'
  - Normal anion gap metabolic acidosis (urine anion gap positive differentiates RTA
    from diarrhea)
  - 'Type 1 causes: Sjögren''s, lupus, sickle cell, amphotericin B, lithium'
  management:
  - 'Guideline-based treatment options for Renal Tubular Acidosis include:'
  - 'Type 1 (distal): Sodium bicarbonate or potassium citrate 1-2 mEq/kg/day (replace
    bicarb losses) (Guidelines) (Guidelines 2023)'
  - 'Type 2 (proximal): High-dose sodium bicarbonate 10-15 mEq/kg/day + potassium
    supplementation (Guidelines) (Guidelines 2023)'
  - 'Type 4: Treat hyperkalemia - kayexalate, fludrocortisone 0.1-0.2mg daily (mineralocorticoid)
    (Guidelines) (Guidelines 2023)'
  - Discontinue offending medications if possible (NSAIDs, ACEi/ARB in type 4) (Guidelines)
    (Guidelines 2023)
  - Treat underlying autoimmune disease if present (Guidelines) (Guidelines 2023)
  tests:
  - ABG (low pH, low HCO3, normal pCO2 = metabolic acidosis)
  - Basic metabolic panel (low HCO3, normal anion gap, K+ low or high)
  - Urine pH (>5.5 in type 1 despite acidosis, <5.5 in type 2/4)
  - Urine anion gap (positive in RTA, negative in diarrhea)
  - 'Workup for etiology: ANA, SSA/SSB (Sjögren''s), SPEP/UPEP (Fanconi), renin/aldosterone
    (type 4)'
  referrals:
  - Nephrology for all RTA (diagnosis confirmation, management)
  - Rheumatology if autoimmune etiology (Sjögren's, lupus)
  - Endocrinology if hypoaldosteronism suspected
  icd10:
  - N25.89
  snomed:
  - '236467001'
- id: NEPHRO-AKI-PRERENAL
  label: Acute Kidney Injury - Prerenal
  presentations:
  - Elevated BUN/Cr ratio (>20:1)
  - Oliguria, concentrated urine (dark, low urine sodium <20 mEq/L)
  - 'Dehydration signs: Dry mucous membranes, decreased skin turgor, orthostatic hypotension'
  - 'Recent volume loss: Vomiting, diarrhea, diuretics, bleeding, poor oral intake'
  - FeNa <1% (fractional excretion of sodium)
  - Responds to IV fluids (Cr improves with rehydration)
  clinical_pearls:
  - Most common cause of AKI (70%) and most reversible
  - BUN rises more than Cr in prerenal (>20:1 ratio)
  - FeNa <1% indicates kidney holding onto sodium (appropriate response to low perfusion)
  - 'Give fluid challenge: 500-1000mL NS, if Cr improves → prerenal confirmed'
  - 'Causes: Hypovolemia, heart failure, cirrhosis, sepsis (vasodilation)'
  management:
  - 'Guideline-based treatment options for Acute Kidney Injury - Prerenal include:'
  - 'IV fluid resuscitation: NS or LR 500-1000mL bolus, then 100-200 mL/hr (Guidelines)
    (Guidelines 2023)'
  - Monitor urine output (goal >0.5 mL/kg/hr) (Guidelines) (Guidelines 2023)
  - Hold nephrotoxic medications (NSAIDs, ACEi/ARB, diuretics temporarily) (Guidelines)
    (Guidelines 2023)
  - 'Treat underlying cause: Antibiotics for sepsis, stop GI losses (Guidelines) (Guidelines
    2023)'
  - 'Serial creatinine: Should improve with fluids in 24-48 hours (Guidelines) (Guidelines
    2023)'
  tests:
  - Basic metabolic panel (BUN, Cr, electrolytes)
  - Urinalysis (concentrated, high specific gravity >1.020)
  - Urine sodium (<20 mEq/L prerenal)
  - FeNa (fractional excretion Na <1%)
  - Renal ultrasound (rule out obstruction if no improvement)
  referrals:
  - Nephrology if Cr not improving with fluids after 48-72 hours
  - ICU if severe (Cr >3, oliguria, hyperkalemia)
  sensitivity: 0.9
  specificity: 0.88
  icd10:
  - N17.0
  snomed:
  - '35455006'
- id: NEPHRO-AKI-ATN
  label: Acute Tubular Necrosis (ATN)
  presentations:
  - Muddy brown casts on urinalysis (pathognomonic)
  - FeNa >2% (kidneys cannot concentrate urine)
  - Isosthenuria (urine specific gravity ~1.010, same as plasma)
  - Oliguria or anuria
  - History of prolonged hypotension, sepsis, or nephrotoxin exposure
  - Does NOT rapidly improve with fluids (unlike prerenal)
  clinical_pearls:
  - Most common intrinsic cause of AKI
  - 'Ischemic ATN: Prolonged prerenal state (hypotension, shock)'
  - 'Nephrotoxic ATN: Aminoglycosides, contrast dye, rhabdomyolysis (myoglobin), tumor
    lysis'
  - 'Recovery phase: Polyuria (2-3 weeks after injury), watch electrolytes'
  - Mortality high if requiring dialysis (50-80% in ICU setting)
  management:
  - 'Guideline-based treatment options for Acute Tubular Necrosis (ATN) include:'
  - 'Supportive care: IV fluids to maintain euvolemia (not excessive) (Guidelines)
    (Guidelines 2023)'
  - 'Avoid further nephrotoxins: Hold NSAIDs, aminoglycosides, contrast if possible
    (Guidelines) (Guidelines 2023)'
  - 'Dialysis if: Severe hyperkalemia (>6.5), acidosis (pH <7.15), uremia, volume
    overload (Guidelines) (Guidelines 2023)'
  - 'Treat underlying: Antibiotics for sepsis, resuscitation for shock (Guidelines)
    (Guidelines 2023)'
  - 'Monitor for recovery: Urine output should gradually increase over 1-3 weeks (Guidelines)
    (Guidelines 2023)'
  tests:
  - Urinalysis (muddy brown casts, tubular epithelial cells)
  - FeNa >2%, urine sodium >40 mEq/L
  - Serial BMP (monitor Cr, K+, phosphate)
  - Creatine kinase if rhabdomyolysis suspected
  - Renal ultrasound (rule out obstruction)
  referrals:
  - Nephrology consult for all ATN
  - Dialysis if refractory hyperkalemia, acidosis, or uremia
  sensitivity: 0.85
  specificity: 0.82
  icd10:
  - N17.0
  snomed:
  - '197774008'
- id: NEPHRO-AKI-POSTRENAL
  label: Acute Kidney Injury - Postrenal (Obstructive)
  presentations:
  - Anuria or fluctuating oliguria/polyuria
  - Suprapubic or flank pain
  - Palpable bladder (urinary retention)
  - Bilateral hydronephrosis on ultrasound (or unilateral if single kidney)
  - History of BPH, nephrolithiasis, malignancy, neurogenic bladder
  - Rapid rise in Cr after obstruction develops
  clinical_pearls:
  - Requires bilateral obstruction (or unilateral with single functioning kidney)
  - 'Bladder outlet obstruction most common: BPH, prostate cancer, neurogenic bladder'
  - 'Upper tract: Bilateral kidney stones, retroperitoneal fibrosis, malignancy'
  - Relief of obstruction → dramatic improvement in Cr within hours to days
  - 'Post-obstructive diuresis: Massive polyuria after relief (replace losses carefully)'
  management:
  - 'Guideline-based treatment options for Acute Kidney Injury - Postrenal (Obstructive)
    include:'
  - Relieve obstruction emergently (Guidelines) (Guidelines 2023)
  - 'Lower tract: Foley catheter (BPH, retention) (Guidelines) (Guidelines 2023)'
  - 'Upper tract: Nephrostomy tubes or ureteral stents (stones, extrinsic compression)
    (Guidelines) (Guidelines 2023)'
  - 'Post-obstructive diuresis: Replace urine output (0.5 mL per mL urine initially)
    (Guidelines) (Guidelines 2023)'
  - Monitor electrolytes closely (K+, Na+, Mg2+, PO4 can drop rapidly) (Guidelines)
    (Guidelines 2023)
  tests:
  - Renal ultrasound (hydronephrosis diagnostic)
  - Bladder scan (assess post-void residual >200mL suggests retention)
  - CT abdomen/pelvis if ultrasound equivocal (better for stones, masses)
  - Urinalysis, urine culture
  - PSA if BPH/prostate cancer suspected
  referrals:
  - Urology STAT for obstruction relief
  - Nephrology if Cr not improving after decompression
  sensitivity: 0.92
  specificity: 0.9
  icd10:
  - N13.1
  - N13.6
