family: ophthalmology
version: 0.1.0
source: American Academy of Ophthalmology (AAO) Preferred Practice Patterns, American
  Glaucoma Society Guidelines
rules:
- id: OPHT-GLAUCOMA-OPEN-ANGLE
  label: Open-Angle Glaucoma
  presentations:
  - Progressive peripheral vision loss
  - Elevated intraocular pressure (IOP > 21 mmHg)
  - Optic nerve cupping on fundoscopy
  - Often asymptomatic in early stages
  - Gradual bilateral vision changes
  - Family history of glaucoma
  clinical_pearls:
  - Leading cause of irreversible blindness worldwide - damage is permanent, prevention
    key
  - Open angle but impaired aqueous outflow through trabecular meshwork - gradual
    IOP elevation
  - Cup-to-disc ratio >0.5 suspicious, >0.7 highly concerning for glaucoma
  - 'Normal tension glaucoma: Optic nerve damage with IOP <21 mmHg (20-30% of cases)'
  - 'Screen high-risk: Age >60, African ancestry, family history, high myopia, diabetes'
  management:
  - 'Guideline-based treatment options for Open-Angle Glaucoma include:'
  - 'First-line topical: Prostaglandin analogs (latanoprost 0.005% qHS) - lowers IOP
    25-30%, once daily'
  - 'Add-on therapy: Beta-blockers (timolol 0.5% BID), alpha-agonists (brimonidine
    BID), carbonic anhydrase inhibitors (dorzolamide TID)'
  - 'Target IOP: Reduce baseline IOP by 25-30% initially, adjust based on progression'
  - 'Laser trabeculoplasty (SLT): If meds insufficient or intolerant, can lower IOP
    20-30%'
  - 'Trabeculectomy surgery: If medical/laser therapy fails - creates new drainage
    pathway'
  tests:
  - 'Tonometry: IOP measurement (normal 10-21 mmHg, glaucoma often >21 but not always)'
  - 'Fundoscopy: Cup-to-disc ratio, rim thinning, disc hemorrhages'
  - 'Visual field testing (perimetry): Detects peripheral vision loss, monitors progression'
  - 'OCT (optical coherence tomography): Quantifies retinal nerve fiber layer thinning'
  - 'Gonioscopy: Confirms open angle (vs angle-closure)'
  referrals:
  - Ophthalmology for all suspected or confirmed glaucoma - requires specialized monitoring
  - Urgent if IOP >30 mmHg or rapid vision loss
  icd10:
  - H40.11
  snomed:
  - 77075001
- id: OPHT-GLAUCOMA-ANGLE-CLOSURE
  label: Acute Angle-Closure Glaucoma
  presentations:
  - Sudden severe eye pain
  - Blurred vision, halos around lights
  - Nausea and vomiting
  - Red eye with fixed mid-dilated pupil
  - Markedly elevated IOP (40-80 mmHg)
  - Corneal edema (cloudy cornea)
  - Medical emergency requiring immediate treatment
  clinical_pearls:
  - OPHTHALMOLOGIC EMERGENCY - permanent vision loss within hours if untreated
  - 'Mechanism: Pupillary dilation causes iris to block trabecular meshwork (narrow
    angle) - aqueous cannot drain'
  - 'Risk factors: Hyperopia (farsighted), Asian ancestry, shallow anterior chamber,
    family history, age >60'
  - 'Precipitants: Pupil dilation (dim lighting, anticholinergics, sympathomimetics),
    emotional stress'
  - Fellow eye at 50% risk within 5-10 years - prophylactic laser iridotomy recommended
  management:
  - 'Guideline-based treatment options for Acute Angle-Closure Glaucoma include:'
  - 'IMMEDIATE IOP lowering (goal <40 mmHg within 1 hour): Acetazolamide 500mg IV,
    timolol 0.5% drops, apraclonidine 1% drops, pilocarpine 2% q15min (constricts
    pupil)'
  - Mannitol 1-2 g/kg IV if IOP remains >40 mmHg (osmotic diuresis)
  - 'Antiemetics: Ondansetron 4mg IV (vomiting common)'
  - 'Definitive: Laser peripheral iridotomy (LPI) within 24-48 hours - creates hole
    in iris for aqueous drainage'
  - Prophylactic LPI in fellow eye to prevent bilateral involvement
  tests:
  - 'IOP: Markedly elevated (40-80 mmHg) - check with tonometry'
  - 'Gonioscopy: Closed angle (iris against trabecular meshwork) - do after acute
    attack resolves'
  - 'Slit lamp: Corneal edema (cloudy), shallow anterior chamber, mid-dilated non-reactive
    pupil'
  - 'Visual acuity: Often decreased to counting fingers or hand motion'
  referrals:
  - Ophthalmology EMERGENTLY - call immediately, patient needs laser iridotomy within
    hours
  - If ophthalmology unavailable, transfer to facility with ophthalmology after starting
    medical therapy
  icd10:
  - H40.21
  snomed:
  - 392288005
- id: OPHT-CATARACT
  label: Cataracts
  presentations:
  - Gradual painless vision loss
  - Glare and difficulty with night driving
  - Colors appear faded or yellowed
  - Cloudy or opaque lens on examination
  - Common in elderly
  - May be accelerated by diabetes, steroids, trauma
  clinical_pearls:
  - Most common cause of reversible vision loss worldwide - surgery 90-95% successful
  - 'Nuclear sclerosis (most common): Yellow-brown discoloration, nearsighted shift'
  - 'Posterior subcapsular: Younger patients, rapid progression, glare with bright
    light, associated with steroids'
  - 'Second eye rule: Medicare covers surgery when best corrected vision ≤0.5 (20/40)'
  - 'Risk factors: Age (50% by age 75), UV exposure, diabetes (3-5x risk), smoking,
    chronic steroids'
  management:
  - 'Guideline-based treatment options for Cataracts include:'
  - 'Early cataracts: Updated glasses prescription, better lighting, anti-glare sunglasses'
  - 'Surgery indication: When vision impairment affects daily activities (driving,
    reading, work)'
  - 'Phacoemulsification + intraocular lens (IOL): Outpatient, 15-20 min, local anesthesia,
    95% success'
  - 'Postoperative: Antibiotic drops (moxifloxacin QID x1 week), steroid drops (prednisolone
    QID taper over 4 weeks)'
  - 'Posterior capsule opacification (PCO): 20-30% develop months-years after surgery,
    treated with YAG laser capsulotomy'
  tests:
  - 'Visual acuity: Decreased, not correctable with refraction'
  - 'Slit lamp exam: Lens opacity - nuclear, cortical, or posterior subcapsular'
  - 'Red reflex: Absent or diminished dark spots (direct ophthalmoscope)'
  - 'IOL calculations: A-scan biometry to determine lens power for surgery'
  referrals:
  - Ophthalmology (routine) when patient desires surgery or vision impairs daily function
  - No rush if patient functional with current vision - surgery is elective
  icd10:
  - H25.9
  snomed:
  - 193570009
- id: OPHT-RETINAL-DETACHMENT
  label: Retinal Detachment
  presentations:
  - Sudden onset of floaters
  - Flashing lights (photopsia)
  - Dark curtain or shadow across visual field
  - Painless vision loss
  - May follow eye trauma or surgery
  - Requires urgent ophthalmology referral
  clinical_pearls:
  - Separation of neurosensory retina from retinal pigment epithelium - URGENT, can
    cause permanent vision loss
  - 'Rhegmatogenous (most common): Retinal tear allows vitreous fluid under retina
    - high myopia, trauma, post-cataract surgery'
  - 'Tractional: Fibrovascular membranes pull retina (diabetic retinopathy, sickle
    cell)'
  - 'Exudative: Fluid accumulates without tear (uveitis, tumors, hypertension)'
  - 'Risk factors: High myopia (6-8 diopters), lattice degeneration, prior RD in fellow
    eye (10-15% risk)'
  management:
  - 'Guideline-based treatment options for Retinal Detachment include:'
  - Position patient with detached area dependent (if superior detachment, elevate
    head to slow progression)
  - Urgent surgery within 24-48 hours for macula-on detachment (preserves central
    vision)
  - 'Pneumatic retinopexy: Gas bubble injected, patient positioning, laser/cryotherapy
    to seal tear - 80% success for small superior tears'
  - 'Scleral buckle: Silicone band around eye to indent wall toward tear - for young
    patients, large tears'
  - 'Vitrectomy: Remove vitreous, flatten retina, gas/silicone oil tamponade - for
    complex or large detachments'
  tests:
  - 'Dilated fundoscopy: Gray elevated retina, corrugated appearance, retinal tear
    (horseshoe or round hole)'
  - 'B-scan ultrasound: If media opacity prevents visualization (cataract, vitreous
    hemorrhage)'
  - 'Visual acuity: Decreased, correlates with macular involvement'
  - 'Visual field: Defect corresponding to detachment location'
  referrals:
  - Ophthalmology URGENTLY (same day) - retinal detachment requires surgery within
    24-48 hours
  - 'Macula-on detachment: EMERGENT (hours) - every hour counts to preserve central
    vision'
  icd10:
  - H33.0
  snomed:
  - 42059000
- id: OPHT-DIABETIC-RETINOPATHY
  label: Diabetic Retinopathy
  presentations:
  - Blurred or fluctuating vision
  - Floaters, dark spots
  - May be asymptomatic in early stages
  - History of diabetes mellitus
  - Microaneurysms, hemorrhages, exudates on fundoscopy
  - Cotton-wool spots, neovascularization in proliferative stage
  clinical_pearls:
  - Leading cause of blindness in working-age adults (20-65 years) - all diabetics
    need annual eye exams
  - 'Non-proliferative (NPDR): Microaneurysms, dot-blot hemorrhages, hard exudates,
    cotton-wool spots, venous beading'
  - 'Proliferative (PDR): Neovascularization of disc or elsewhere - VEGF-driven, risk
    of vitreous hemorrhage and tractional RD'
  - 'Macular edema: Can occur at any stage, most common cause of vision loss in diabetes'
  - 'Duration predicts risk: 80% of type 1 diabetics have retinopathy after 20 years'
  management:
  - 'Guideline-based treatment options for Diabetic Retinopathy include:'
  - 'Glycemic control: HbA1c <7% reduces progression 76% (DCCT trial)'
  - 'Blood pressure control: Goal <140/90, reduces progression 34%'
  - 'Laser photocoagulation: Panretinal for high-risk PDR (reduces severe vision loss
    50%), focal for macular edema'
  - 'Anti-VEGF injections: Ranibizumab, bevacizumab, aflibercept for macular edema
    - intravitreal q4-8 weeks'
  - 'Vitrectomy: For non-clearing vitreous hemorrhage or tractional retinal detachment'
  tests:
  - 'Dilated fundoscopy: Microaneurysms (earliest sign), hemorrhages, exudates, cotton-wool
    spots, neovascularization'
  - 'OCT (optical coherence tomography): Quantify macular edema (central subfield
    thickness >250 microns abnormal)'
  - 'Fluorescein angiography: Identify macular ischemia, neovascularization, guide
    laser treatment'
  - 'HbA1c: Correlates with retinopathy progression'
  referrals:
  - Ophthalmology annually for all diabetics (type 1 after 5 years, type 2 at diagnosis)
  - Urgent if proliferative DR, macular edema, or vision changes
  icd10:
  - E11.319
  snomed:
  - 4855003
- id: OPHT-MACULAR-DEGENERATION
  label: Age-Related Macular Degeneration (AMD)
  presentations:
  - Central vision loss (difficulty reading, recognizing faces)
  - Distortion of straight lines (metamorphopsia)
  - Dry AMD - drusen, gradual vision loss
  - Wet AMD - sudden vision loss, subretinal hemorrhage
  - Common in elderly (age > 60)
  - Preserved peripheral vision
  clinical_pearls:
  - Leading cause of irreversible vision loss in elderly (age >60) in developed countries
  - 'Dry AMD (90%): Drusen and RPE changes, gradual vision loss, no effective treatment'
  - 'Wet AMD (10%): Choroidal neovascularization (CNV) - sudden vision loss, treatable
    with anti-VEGF'
  - 'Amsler grid: Home monitoring tool - wavy lines indicate metamorphopsia, prompts
    urgent eval'
  - 'Risk factors: Age >60, smoking (2-3x risk), family history, Caucasian, cardiovascular
    disease'
  management:
  - 'Guideline-based treatment options for Age-Related Macular Degeneration (AMD)
    include:'
  - 'Dry AMD: AREDS2 vitamins (vitamin C 500mg, vitamin E 400 IU, zinc 80mg, copper
    2mg, lutein 10mg, zeaxanthin 2mg) - slows progression 25%'
  - 'Wet AMD: Anti-VEGF injections (ranibizumab, aflibercept, bevacizumab) intravitreal
    q4-8 weeks - prevents severe vision loss in 90%'
  - 'Smoking cessation: Most important modifiable risk factor'
  - 'Low vision aids: Magnifiers, large-print materials if vision loss severe'
  - 'Monitor fellow eye: If unilateral wet AMD, 10% per year risk in other eye - daily
    Amsler grid'
  tests:
  - 'Dilated fundoscopy: Dry (drusen - yellow deposits, RPE changes). Wet (subretinal
    fluid, hemorrhage, exudates)'
  - 'OCT: Gold standard for macular edema, subretinal fluid, CNV activity'
  - 'Fluorescein angiography: Identifies CNV (classic or occult), guides treatment'
  - 'Amsler grid: Detects metamorphopsia (wavy lines) - home monitoring'
  referrals:
  - Ophthalmology URGENTLY if sudden vision changes or metamorphopsia (wet AMD needs
    treatment within days)
  - Routine ophthalmology for dry AMD - monitor progression q6-12 months
  icd10:
  - H35.30
  snomed:
  - 267718000
- id: OPHT-UVEITIS
  label: Uveitis
  presentations:
  - Eye pain and redness
  - Photophobia
  - Blurred vision
  - Floaters
  - Small irregular pupil
  - Anterior (iritis), intermediate, or posterior
  - May be associated with autoimmune disease
  clinical_pearls:
  - Inflammation of uveal tract (iris, ciliary body, choroid) - can cause permanent
    vision loss if untreated
  - 'Anterior uveitis (iritis, 75%): Most common, HLA-B27 associated (ankylosing spondylitis,
    IBD, reactive arthritis)'
  - 'Intermediate (pars planitis): Floaters, multiple sclerosis association'
  - 'Posterior/panuveitis: Vision loss, worse prognosis, systemic disease (sarcoid,
    Behcet''s, VKH, toxoplasmosis)'
  - 'HLA-B27 uveitis: Acute, recurrent, unilateral, alternating eyes'
  management:
  - 'Guideline-based treatment options for Uveitis include:'
  - 'Anterior uveitis: Prednisolone acetate 1% q1-2h while awake (taper over 4-6 weeks),
    cycloplegic (homatropine 5% BID for pain/photophobia)'
  - 'Severe or posterior: Systemic steroids (prednisone 1mg/kg) or immunosuppressants
    (methotrexate, azathioprine)'
  - 'Treat underlying cause: Antibiotics if infectious (toxoplasmosis, syphilis, TB)'
  - 'Follow IOP: Uveitis can cause secondary glaucoma (inflammation blocks drainage)
    or hypotony'
  - Anti-TNF biologics (adalimumab) for refractory cases or Behcet's
  tests:
  - 'Slit lamp: Anterior chamber cells and flare, keratic precipitates, posterior
    synechiae (iris stuck to lens)'
  - 'IOP: May be elevated (inflammatory glaucoma) or low (ciliary body shutdown)'
  - 'Dilated fundoscopy: Posterior uveitis - retinitis, choroiditis, vasculitis'
  - 'Workup: CBC, CMP, ESR, CRP, RPR, QuantiFERON, CXR, HLA-B27, ACE (sarcoid), ANA
    if posterior or recurrent'
  referrals:
  - Ophthalmology urgently for all uveitis - same day if severe pain or vision loss
  - Rheumatology if systemic disease (HLA-B27, sarcoid, Behcet's)
  icd10:
  - H20.9
  snomed:
  - 128473001
- id: OPHT-CONJUNCTIVITIS
  label: Conjunctivitis
  presentations:
  - Red eye with discharge
  - Gritty or foreign body sensation
  - Crusting of eyelids, especially in morning
  - Viral - watery discharge, highly contagious
  - Bacterial - purulent discharge
  - Allergic - itching, bilateral, seasonal
  clinical_pearls:
  - Most common cause of red eye - usually self-limited, differentiate from serious
    causes (uveitis, glaucoma, keratitis)
  - 'Viral (80%): Adenovirus most common, watery discharge, follicles, preauricular
    lymphadenopathy, highly contagious'
  - 'Bacterial (20%): S. aureus, S. pneumoniae, H. influenzae - purulent discharge,
    wake with eyes crusted shut'
  - 'Gonococcal: Hyperacute, copious purulent discharge, risk of corneal perforation
    - EMERGENT ophthalmology'
  - 'Allergic: Bilateral, itching prominent, cobblestone papillae on tarsal conjunctiva,
    seasonal'
  management:
  - 'Guideline-based treatment options for Conjunctivitis include:'
  - 'Viral: Supportive care (cool compresses, artificial tears), resolves 1-2 weeks.
    Highly contagious - hygiene measures'
  - 'Bacterial: Erythromycin 0.5% ointment QID x5-7 days OR moxifloxacin 0.5% drops
    QID x5-7 days'
  - 'Gonococcal/chlamydial: Ceftriaxone 1g IM + azithromycin 1g PO (treat for both),
    urgent ophthalmology'
  - 'Allergic: Olopatadine (antihistamine) drops BID, cool compresses, avoid allergen'
  - 'Contact lens wearers: STOP lenses until resolved, fluoroquinolone drops (concern
    for Pseudomonas keratitis)'
  tests:
  - Clinical diagnosis usually - culture rarely needed
  - Culture if severe, not responding, recurrent, or suspected gonorrhea
  - 'Fluorescein stain: Rule out corneal involvement (dendritic ulcer HSV, infiltrate
    keratitis)'
  - 'Check visual acuity: Normal in simple conjunctivitis (decreased suggests keratitis,
    uveitis)'
  referrals:
  - 'Ophthalmology urgently if: Decreased vision, severe pain, corneal involvement,
    hyperacute purulent (gonococcal), contact lens wearer not improving'
  - Most cases managed by primary care
  icd10:
  - H10.9
  snomed:
  - 9826008
- id: OPHT-OPTIC-NEURITIS
  label: Optic Neuritis
  presentations:
  - Sudden monocular vision loss
  - Pain with eye movement
  - Central scotoma
  - Decreased color vision (red desaturation)
  - Relative afferent pupillary defect (RAPD)
  - Associated with multiple sclerosis in many cases
  clinical_pearls:
  - Demyelinating inflammation of optic nerve - 50% presenting sign of multiple sclerosis
  - 'Classic triad: Vision loss (hours to days), pain with eye movement (90%), color
    desaturation'
  - 'MRI brain: 50-70% have white matter lesions (demyelinating plaques) at presentation'
  - 'MS risk: If abnormal brain MRI, 72% develop MS within 15 years. If normal MRI,
    only 25%'
  - 'Vision recovery: 90-95% improve to 20/40 or better within 6-12 months (with or
    without steroids)'
  management:
  - 'Guideline-based treatment options for Optic Neuritis include:'
  - 'IV methylprednisolone 1g daily x3 days (then oral prednisone taper 11 days):
    Speeds recovery but doesn''t change final vision outcome'
  - 'Avoid oral prednisone alone: ONTT trial showed increased recurrence vs placebo'
  - 'MRI brain and orbits with gadolinium: Assess for demyelinating lesions (MS risk
    stratification)'
  - 'If 2+ brain lesions: Consider MS disease-modifying therapy (reduces MS risk from
    56% to 35% over 5 years)'
  - 'Reassurance: Vision usually improves spontaneously, steroids speed recovery by
    1-2 weeks'
  tests:
  - 'Visual acuity: Decreased (20/40 to counting fingers)'
  - 'Ishihara color plates: Red desaturation (color vision affected before acuity)'
  - 'RAPD (Marcus Gunn pupil): Swinging flashlight test - affected pupil dilates when
    light swung from normal to affected eye'
  - 'Fundoscopy: Disc edema in 33% (papillitis), normal in 67% (retrobulbar neuritis)'
  - 'MRI brain + orbits with contrast: Optic nerve enhancement, brain demyelinating
    lesions (MS risk)'
  - 'LP if atypical: Oligoclonal bands, elevated IgG index (MS)'
  referrals:
  - Ophthalmology urgently (within 1-2 days) to confirm diagnosis and initiate workup
  - Neurology for MS evaluation if brain MRI abnormal
  icd10:
  - H46.9
  snomed:
  - 78370002
- id: OPHT-CENTRAL-RETINAL-ARTERY-OCCLUSION
  label: Central Retinal Artery Occlusion (CRAO)
  presentations:
  - Sudden painless monocular vision loss
  - Amaurosis fugax may precede
  - Cherry-red spot on macula
  - Retinal pallor on fundoscopy
  - Emergency - vision loss often permanent
  - Associated with carotid disease, emboli
  clinical_pearls:
  - OPHTHALMOLOGIC STROKE - retinal ischemia from embolic or thrombotic arterial occlusion
  - 'Window of treatment: 90-100 minutes (retinal tolerance to ischemia) - after 240
    min, permanent damage'
  - 'Cherry-red spot: Fovea has direct choroidal blood supply (appears red) while
    rest of macula infarcted (appears white)'
  - 'Prognosis poor: Only 20% regain useful vision, most remain counting fingers or
    worse'
  - 'Embolic sources: Carotid atherosclerosis (70%), cardiac (15%), giant cell arteritis
    (1-2% - MUST rule out)'
  management:
  - 'Guideline-based treatment options for Central Retinal Artery Occlusion (CRAO)
    include:'
  - 'EMERGENCY within 90 minutes: Ocular massage (firm pressure on closed eye 5 sec,
    release 5 sec, repeat x5), anterior chamber paracentesis (lower IOP to dislodge
    embolus)'
  - 'Lower IOP: Acetazolamide 500mg IV, timolol 0.5% drops (attempt to increase perfusion
    pressure)'
  - 'Carbogen inhalation (95% O2 + 5% CO2): Vasodilates retinal vessels (if available)'
  - 'Stroke workup: ESR (giant cell arteritis if >50), carotid duplex, echocardiogram,
    hypercoagulable panel if young'
  - 'Antiplatelet therapy: Aspirin 81-325mg daily to prevent contralateral eye and
    stroke'
  tests:
  - 'Fundoscopy: Retinal pallor/edema (whitening), cherry-red spot at fovea, boxcarring
    of blood in vessels'
  - 'RAPD: Relative afferent pupillary defect present'
  - 'Visual acuity: Counting fingers to light perception'
  - 'ESR/CRP: Rule out giant cell arteritis (if age >50, treat empirically with prednisone
    60mg before results)'
  - 'Carotid duplex ultrasound: Assess for stenosis'
  - 'Echocardiogram: Identify cardiac embolic source'
  referrals:
  - Ophthalmology EMERGENTLY (call immediately) - time is retina
  - Neurology/stroke team - treat as stroke equivalent for workup
  - 'If age >50 or symptoms of GCA: Rheumatology urgently for temporal artery biopsy'
  icd10:
  - H34.1
  snomed:
  - 24596005
- id: OPHT-CENTRAL-RETINAL-VEIN-OCCLUSION
  label: Central Retinal Vein Occlusion (CRVO)
  presentations:
  - Sudden painless monocular vision loss
  - Blood and thunder appearance on fundoscopy
  - Diffuse retinal hemorrhages
  - Tortuous dilated veins
  - Cotton-wool spots
  - Risk factors - hypertension, diabetes, glaucoma, hypercoagulable states
  clinical_pearls:
  - Thrombosis of central retinal vein at lamina cribrosa - venous stasis causes hemorrhages
    and edema
  - 'Ischemic CRVO (25%): >10 disc areas of capillary nonperfusion, high risk of neovascular
    glaucoma (NVG) - rubeosis iridis in 3-6 months'
  - 'Non-ischemic CRVO (75%): Better prognosis, may improve spontaneously, but 33%
    progress to ischemic'
  - 'Neovascular glaucoma: Ischemic retina releases VEGF → iris neovascularization
    → angle closure → very high IOP (40-60 mmHg)'
  - 'Risk factors: Hypertension (50%), diabetes, glaucoma (increased IOP compresses
    vein), hypercoagulable states'
  management:
  - 'Guideline-based treatment options for Central Retinal Vein Occlusion (CRVO) include:'
  - 'Macular edema: Anti-VEGF injections (ranibizumab, aflibercept) intravitreal monthly
    - improves vision in 50-60%'
  - 'Ischemic CRVO: Monitor monthly for neovascularization. If develops, panretinal
    photocoagulation (PRP) to prevent NVG'
  - 'Control risk factors: Optimize BP, glucose, consider hypercoagulable workup if
    young (<50) or bilateral'
  - Avoid anticoagulation unless clear indication (doesn't improve outcomes, increases
    hemorrhage risk)
  - 'Monitor IOP: Watch for neovascular glaucoma (rubeosis iridis at slit lamp)'
  tests:
  - 'Fundoscopy: Diffuse retinal hemorrhages in all 4 quadrants (''blood and thunder''),
    dilated tortuous veins, disc edema, cotton-wool spots'
  - 'OCT: Quantify macular edema (central subfield thickness >250 microns)'
  - 'Fluorescein angiography: Differentiate ischemic (>10 disc areas nonperfusion)
    vs non-ischemic, identify neovascularization'
  - 'BP, glucose, lipids: Modifiable risk factors'
  - 'Hypercoagulable panel if age <50: Protein C/S, antithrombin III, factor V Leiden,
    homocysteine'
  referrals:
  - Ophthalmology urgently (within 1-2 days) - needs fluorescein angiography to assess
    ischemia
  - Frequent follow-up first 6 months (monthly) to detect neovascularization
  icd10:
  - H34.81
  snomed:
  - 24596005
- id: OPHT-CORNEAL-ABRASION
  label: Corneal Abrasion
  presentations:
  - Eye pain, sharp or foreign body sensation
  - Tearing, photophobia
  - Blurred vision
  - History of trauma or foreign body
  - Fluorescein staining shows epithelial defect
  - Red eye
  clinical_pearls:
  - Disruption of corneal epithelium - very painful (cornea most densely innervated
    tissue in body)
  - 'Causes: Trauma (fingernail, paper, tree branch), contact lens overwear, foreign
    body, dry eyes'
  - 'Contact lens wearers: High risk for Pseudomonas keratitis - needs fluoroquinolone
    drops'
  - 'Recurrent erosion syndrome: 10% recur, especially if basement membrane disrupted
    (heal within hours but fragile)'
  - DO NOT patch eye (increases infection risk, delays healing)
  management:
  - 'Guideline-based treatment options for Corneal Abrasion include:'
  - 'Topical antibiotic: Erythromycin 0.5% ointment QID x3-5 days (non-contact lens)
    OR moxifloxacin 0.5% drops QID (contact lens - Pseudomonas coverage)'
  - 'Pain control: Cycloplegic drops (cyclopentolate 1% or homatropine 5%) for pain,
    oral NSAIDs (ibuprofen 600mg TID)'
  - DO NOT prescribe topical anesthetics (tetracaine) for home use - delays healing,
    causes corneal toxicity
  - 'Remove foreign body if present: Irrigate, use moist cotton swab, needle at slit
    lamp if embedded (refer if deep)'
  - 'Follow-up in 24 hours: Re-check with fluorescein to ensure healing'
  tests:
  - 'Fluorescein stain with cobalt blue light: Epithelial defect lights up bright
    green'
  - 'Visual acuity: Document baseline (usually normal or mildly decreased)'
  - 'Slit lamp: Rule out infiltrate (bacterial keratitis - white opacity), anterior
    chamber reaction'
  - 'Evert upper lid: Rule out retained foreign body (causes vertical linear abrasions)'
  referrals:
  - 'Ophthalmology if: Large abrasion (>4mm), central location affecting vision, penetrating
    injury, not healing in 24-48 hours, infiltrate present'
  - Most small peripheral abrasions managed by primary care
  icd10:
  - S05.00
  snomed:
  - 26324009
- id: OPHT-HORDEOLUM-CHALAZION
  label: Hordeolum (Stye) or Chalazion
  presentations:
  - Painful or tender eyelid swelling (hordeolum)
  - Painless firm nodule in eyelid (chalazion)
  - Red, swollen eyelid
  - May point toward skin or conjunctival surface
  - Hordeolum - acute infection of eyelid gland
  - Chalazion - chronic granulomatous inflammation
  clinical_pearls:
  - 'Hordeolum (stye): Acute infection of gland - external (Zeis or Moll glands at
    lash follicle) or internal (meibomian gland)'
  - 'Chalazion: Chronic lipogranuloma from blocked meibomian gland - sterile, not
    infected'
  - Most resolve spontaneously with warm compresses - antibiotics don't speed resolution
  - 'Recurrent: Consider seborrheic dermatitis, blepharitis, rosacea - treat underlying
    condition'
  - 'Sebaceous gland carcinoma: If chalazion recurs in same location, consider biopsy
    (rare but aggressive cancer)'
  management:
  - 'Guideline-based treatment options for Hordeolum (Stye) or Chalazion include:'
  - 'Warm compresses: 10-15 minutes QID (most important treatment) - promotes drainage'
  - 'Lid hygiene: Gentle massage after warm compress to express gland contents'
  - 'Topical antibiotics (erythromycin 0.5% ointment BID): Only if pointing or associated
    blepharitis'
  - 'Oral antibiotics (doxycycline 100mg BID): Only if surrounding cellulitis or recurrent
    (also treats meibomian dysfunction)'
  - 'I&D or steroid injection: By ophthalmology if not resolving after 4-6 weeks (chalazion)'
  tests:
  - 'Clinical diagnosis: External exam of eyelid'
  - 'Evert lid: Determine if internal (meibomian) vs external (Zeis/Moll)'
  - No labs or imaging needed
  referrals:
  - 'Ophthalmology if: Not resolving after 4-6 weeks of conservative therapy (may
    need I&D or injection), vision affected, recurrent in same location (biopsy for
    malignancy), preseptal cellulitis develops'
  - Most managed by primary care with conservative measures
