  label: Upper Gastrointestinal Bleeding
  presentations:
  - Hematemesis (vomiting blood, coffee-ground emesis)
  - Melena (black, tarry stools)
  - 'Hemodynamic instability: Hypotension, tachycardia, syncope'
  - Anemia, elevated BUN/Cr ratio (BUN/Cr >30 suggests upper GI source)
