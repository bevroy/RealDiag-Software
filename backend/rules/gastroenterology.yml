- id: GASTRO-CROHNS-DISEASE
  label: Crohn's Disease
  presentations:
  - Chronic diarrhea (may be bloody), abdominal pain (often RLQ)
  - Weight loss, fatigue, fever
  - 'Perianal disease: Fissures, fistulas, abscesses (highly specific)'
  - 'Skip lesions: Patchy inflammation anywhere from mouth to anus'
  - 'Extraintestinal manifestations: Arthritis, erythema nodosum, uveitis, PSC'
  - 'Complications: Strictures, fistulas, abscesses, bowel obstruction'
  clinical_pearls:
  - Transmural inflammation (unlike UC which is mucosal)
  - Can affect any part of GI tract (mouth to anus), but commonly terminal ileum
  - String sign on imaging (narrowed terminal ileum)
  - Smoking worsens Crohn's (opposite of UC)
  - Biologic therapy (anti-TNF) for moderate-severe disease
  management:
  - 'Guideline-based treatment options for Crohn''s Disease include:'
  - 'Mild-moderate: Budesonide 9mg daily or mesalamine'
  - 'Moderate-severe: Prednisone 40mg daily taper, then azathioprine or anti-TNF'
  - 'Biologics: Infliximab, adalimumab, vedolizumab (for steroid-refractory)'
  - 'Surgery for complications: Stricturoplasty, resection (not curative)'
  - 'Nutrition: Elemental diet, avoid NSAIDs'
  tests:
  - Colonoscopy with ileoscopy (patchy ulcers, skip lesions, cobblestoning)
  - CT enterography or MR enterography (assess small bowel)
  - Fecal calprotectin (elevated, monitors inflammation)
  - CBC (anemia, leukocytosis), CRP/ESR (elevated)
  - Stool studies (rule out infection)
  referrals:
  - Gastroenterology for all suspected IBD
  - Surgery if complications (obstruction, fistula, abscess)
  sensitivity: 0.85
  specificity: 0.82
  icd10:
  - K50.90
  - K50.80
  snomed:
  - '34000006'
- id: GASTRO-ULCERATIVE-COLITIS
  label: Ulcerative Colitis (UC)
  presentations:
  - Bloody diarrhea (hallmark), tenesmus, urgency
  - Lower abdominal cramping, often relieved by defecation
  - Continuous inflammation starting at rectum, extends proximally
  - 'Extraintestinal: Arthritis, PSC (stronger association than Crohn''s), erythema
    nodosum'
  - 'Severe flare (fulminant colitis): More than 10 BM/day, fever, tachycardia, anemia'
  - 'Toxic megacolon: Dilated colon (>6 cm), systemic toxicity, risk of perforation'
  clinical_pearls:
  - Continuous mucosal inflammation (unlike Crohn's skip lesions)
  - Starts in rectum, extends proximally (can be proctitis, left-sided, or pancolitis)
  - Smoking protective (opposite of Crohn's)
  - 'Increased colon cancer risk: Screen starting 8 years after diagnosis'
  - 'Severe flare: IV steroids, if no response in 3-5 days → consider colectomy'
  management:
  - 'Guideline-based treatment options for Ulcerative Colitis (UC) include:'
  - 'Mild-moderate: Mesalamine (5-ASA) 2.4-4.8g daily, topical mesalamine suppositories/enemas'
  - 'Moderate-severe: Prednisone 40mg daily taper'
  - 'Maintenance: Azathioprine, 6-MP, or biologics (infliximab, vedolizumab)'
  - 'Severe flare: IV methylprednisolone 60mg daily, if refractory → cyclosporine
    or colectomy'
  - 'Toxic megacolon: NPO, IV fluids, antibiotics, surgery if no improvement'
  tests:
  - Colonoscopy (continuous inflammation, loss of vascular pattern, pseudopolyps)
  - Biopsy (crypt abscesses, basal plasmacytosis)
  - Fecal calprotectin (elevated)
  - CBC (anemia), CRP/ESR, stool studies
  - Abdominal X-ray if toxic megacolon suspected (dilated colon)
  referrals:
  - Gastroenterology for all suspected UC
  - Colorectal surgery if severe refractory flare or toxic megacolon
  sensitivity: 0.88
  specificity: 0.85
  icd10:
  - K51.90
  - K51.00
