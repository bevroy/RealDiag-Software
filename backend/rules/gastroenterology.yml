- id: GASTRO-PEPTIC-ULCER-DISEASE
  label: Peptic Ulcer Disease (PUD)
  presentations:
  - Epigastric pain (burning or gnawing)
  - 'Duodenal ulcer: Pain 2-5 hours after eating, relieved by food'
  - 'Gastric ulcer: Pain worsened by eating'
  - Nausea, bloating, early satiety
  - 'Alarm symptoms: Weight loss, anemia, dysphagia, hematemesis, melena'
  - 'Causes: H. pylori (70%), NSAIDs (20-30%), stress ulcers'
  clinical_pearls:
  - Duodenal ulcers more common than gastric (4:1 ratio)
  - H. pylori test and treat (even without EGD if no alarm symptoms)
  - Stop NSAIDs if possible
  - 'PPI therapy: 4-8 weeks for healing'
  - 'Gastric ulcers: Always biopsy to rule out malignancy'
  management:
  - 'Guideline-based treatment options for Peptic Ulcer Disease (PUD) include:'
  - 'PPI: Omeprazole 20-40mg daily or pantoprazole 40mg daily x 4-8 weeks'
  - 'H. pylori eradication: Triple therapy (PPI BID + clarithromycin + amoxicillin)
    x 14 days'
  - 'Alternative: Quadruple therapy (PPI + bismuth + tetracycline + metronidazole)'
  - Stop NSAIDs; if needed, use with PPI
  - 'Confirm eradication: Urea breath test or stool antigen 4 weeks after treatment'
  tests:
  - EGD if alarm symptoms, age >60, or refractory symptoms
  - 'H. pylori testing: Urea breath test, stool antigen, or biopsy during EGD'
  - CBC (anemia from chronic bleeding)
  - Stool guaiac (occult blood)
  referrals:
  - Gastroenterology for EGD if alarm symptoms or refractory
  - Surgery if perforation or refractory bleeding
