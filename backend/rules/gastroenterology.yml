- id: GASTRO-ACUTE-HEPATITIS
  label: Acute Viral Hepatitis (A, B, C)
  presentations:
  - Jaundice, dark urine, clay-colored stools
  - Right upper quadrant pain, hepatomegaly
  - Nausea, vomiting, anorexia, fatigue
  - Fever, myalgias (prodrome)
  - Markedly elevated transaminases (ALT/AST >1000 U/L)
  - 'Hep A: Fecal-oral transmission, self-limited'
  - 'Hep B: Percutaneous/sexual, risk of chronic infection'
  - 'Hep C: Bloodborne, high chronicity rate (70-85%)'
  clinical_pearls:
  - ALT > AST (unlike alcoholic hepatitis where AST > ALT 2:1)
  - 'Hep A: IgM anti-HAV positive (acute infection)'
  - 'Hep B: HBsAg + IgM anti-HBc = acute infection'
  - 'Hep C: Anti-HCV + HCV RNA = acute or chronic (check HCV RNA)'
  - Fulminant hepatic failure rare but serious (encephalopathy, coagulopathy)
  management:
  - 'Guideline-based treatment options for Acute Viral Hepatitis (A, B, C) include:'
  - 'Supportive care: Hydration, antiemetics, rest'
  - 'Avoid: Alcohol, hepatotoxic drugs (acetaminophen, NSAIDs)'
  - 'Hep A: Self-limited, no specific treatment'
  - 'Hep B: Most resolve, monitor; if chronic → entecavir or tenofovir'
  - 'Hep C: Treat with direct-acting antivirals (sofosbuvir-based regimens), cure
    rate >95%'
  tests:
  - 'Hepatitis panel: Anti-HAV IgM, HBsAg, anti-HBc IgM, anti-HCV'
  - 'Liver function tests: ALT, AST, bilirubin, alkaline phosphatase, PT/INR'
  - 'If chronic suspected: HCV RNA, HBV DNA, HIV test, liver ultrasound'
  referrals:
  - Gastroenterology/hepatology for chronic hepatitis B or C
  - Transplant hepatology if fulminant hepatic failure
  sensitivity: 0.92
  specificity: 0.88
  icd10:
  - B15.9
  - B16.9
  - B17.10
  snomed:
  - '40468003'
- id: GASTRO-ACUTE-PANCREATITIS
  label: Acute Pancreatitis
  presentations:
  - Severe, constant epigastric pain radiating to back
  - Nausea, vomiting, anorexia
  - Elevated lipase (>3x ULN) or amylase
  - 'Imaging: Pancreatic inflammation, edema, or necrosis on CT'
  - 'Causes: Gallstones (40%), alcohol (30%), hypertriglyceridemia, medications, trauma'
  - 'Severe pancreatitis: Organ failure, necrosis, SIRS'
  clinical_pearls:
  - 'Diagnosis: 2 of 3 criteria (pain, lipase >3x ULN, imaging findings)'
  - Lipase more specific than amylase
  - CT not needed for mild cases; delay 48-72hr if imaging needed (IV contrast)
  - Ranson's criteria or APACHE II score for severity assessment
  - Early aggressive IV hydration (LR preferred) improves outcomes
  management:
  - 'Guideline-based treatment options for Acute Pancreatitis include:'
  - 'Aggressive IV fluids: LR 250-500 mL/hr (goal UOP 0.5-1 mL/kg/hr)'
  - NPO initially, advance diet as tolerated (early feeding better than prolonged
    NPO)
  - 'Pain control: Opioids (morphine, hydromorphone)'
  - 'Treat underlying cause: ERCP for gallstone pancreatitis with cholangitis/obstruction'
  - 'ICU if severe: Organ failure, necrosis, SIRS'
  tests:
  - Lipase (elevated >3x ULN)
  - Liver function tests (if gallstone etiology)
  - Triglycerides (if hypertriglyceridemia suspected, >1000 mg/dL)
  - CT abdomen with IV contrast (if severe or uncertain diagnosis, delay 48-72hr)
  - Right upper quadrant ultrasound (assess for gallstones)
  referrals:
  - Gastroenterology for all cases
  - Surgery for complications (necrosis, abscess, pseudocyst)
  - ERCP if gallstone with cholangitis/obstruction
  sensitivity: 0.9
  specificity: 0.85
  icd10:
  - K85.90
  - K85.00
  snomed:
  - '197456007'
- id: GASTRO-CHRONIC-PANCREATITIS
  label: Chronic Pancreatitis
  presentations:
  - Chronic or recurrent epigastric pain, often after eating
  - Steatorrhea (fatty, foul-smelling stools) - pancreatic insufficiency
  - Weight loss, malabsorption
  - Diabetes mellitus (endocrine insufficiency)
  - Calcifications on CT (pathognomonic)
  - 'Most common cause: Chronic alcohol use (70%)'
  clinical_pearls:
  - 'Triad: Chronic pain, steatorrhea, diabetes (burnt out pancreas)'
  - Pancreatic calcifications on CT are diagnostic
  - Lipase/amylase often NORMAL (gland burnt out)
  - Increased risk of pancreatic cancer (5%)
  - Pancreatic enzyme replacement improves absorption and reduces pain
  management:
  - 'Guideline-based treatment options for Chronic Pancreatitis include:'
  - Alcohol cessation (essential), smoking cessation
  - 'Pancreatic enzyme replacement: Creon 25,000-40,000 units lipase with meals'
  - 'Pain management: NSAIDs, opioids (often refractory pain)'
  - 'Fat-soluble vitamins: A, D, E, K supplementation'
  - 'Diabetes management: Insulin often required'
  tests:
  - CT abdomen (pancreatic calcifications, atrophy, duct dilation)
  - Fecal elastase (low <200 mcg/g indicates exocrine insufficiency)
  - Hemoglobin A1c (assess for diabetes)
  - MRCP or ERCP (duct abnormalities, strictures)
  referrals:
  - Gastroenterology for all cases
  - Endocrinology for diabetes management
  - Pain clinic for refractory pain
  - Surgery if severe refractory pain (pancreatic resection, duct decompression)
  sensitivity: 0.82
  specificity: 0.88
  icd10:
  - K86.1
  - K86.0
  snomed:
  - '235494005'
- id: GASTRO-CHOLECYSTITIS
  label: Acute Cholecystitis
  presentations:
  - Right upper quadrant pain, often after fatty meal
  - 'Murphy''s sign: Inspiratory arrest with RUQ palpation'
  - Fever, nausea, vomiting
  - 'Ultrasound: Gallstones, thickened gallbladder wall (>4mm), pericholecystic fluid'
  - Positive sonographic Murphy's sign
  - Elevated WBC, sometimes elevated bilirubin/alkaline phosphatase
  clinical_pearls:
  - Cholecystitis = inflammation of gallbladder (usually due to stone obstruction)
  - Murphy's sign highly specific (90%)
  - RUQ ultrasound is diagnostic test of choice
  - Early cholecystectomy (within 72hr) preferred over delayed
  - Gangrenous cholecystitis and perforation are serious complications
  management:
  - 'Guideline-based treatment options for Acute Cholecystitis include:'
  - NPO, IV fluids, IV antibiotics (ceftriaxone + metronidazole)
  - 'Pain control: Opioids, NSAIDs'
  - 'Cholecystectomy: Ideally within 72 hours of symptom onset'
  - 'If poor surgical candidate: Percutaneous cholecystostomy tube'
  - Avoid delaying surgery >72hr (increased complications)
  tests:
  - Right upper quadrant ultrasound (gallstones, wall thickening, Murphy's sign)
  - CBC (leukocytosis), liver function tests
  - HIDA scan if ultrasound equivocal (non-filling gallbladder)
  referrals:
  - Surgery for cholecystectomy
  - Gastroenterology if ERCP needed (choledocholithiasis)
  sensitivity: 0.88
  specificity: 0.9
  icd10:
  - K81.0
  snomed:
  - '76581006'
- id: GASTRO-ASCENDING-CHOLANGITIS
  label: Acute Ascending Cholangitis
  presentations:
  - 'Charcot''s triad: Fever/chills, jaundice, RUQ pain (50-70% have all 3)'
  - 'Reynolds'' pentad: Charcot triad + hypotension + altered mental status (severe)'
  - Elevated bilirubin, alkaline phosphatase, transaminases
  - Dilated bile ducts on imaging
  - 'Most common cause: Choledocholithiasis (CBD stone)'
  clinical_pearls:
  - Medical emergency requiring IV antibiotics and biliary decompression
  - ERCP within 24-48 hours for drainage
  - Mortality 10% even with treatment; 50% if untreated
  - 'Tokyo guidelines for severity: Grade I (mild), II (moderate), III (severe)'
  - Blood cultures often positive (E. coli, Klebsiella, Enterococcus)
  management:
  - 'Guideline-based treatment options for Acute Ascending Cholangitis include:'
  - 'IV antibiotics: Piperacillin-tazobactam 3.375g q6h or ceftriaxone + metronidazole'
  - IV fluids, supportive care
  - 'Emergent ERCP: Sphincterotomy, stone extraction, stent placement'
  - 'If ERCP unsuccessful: Percutaneous transhepatic biliary drainage (PTBD)'
  - Blood cultures before antibiotics
  tests:
  - Right upper quadrant ultrasound (dilated CBD >6mm, stones)
  - Liver function tests (elevated bilirubin, alk phos)
  - CBC (leukocytosis), blood cultures
  - MRCP or CT if ultrasound equivocal
  - ERCP (diagnostic and therapeutic)
  referrals:
  - Gastroenterology for emergent ERCP
  - Surgery if ERCP unsuccessful or complications
  - ICU if septic shock
  sensitivity: 0.85
  specificity: 0.88
