- id: GASTRO-UPPER-GI-BLEEDING
  label: Upper Gastrointestinal Bleeding
  presentations:
  - Hematemesis (vomiting blood, coffee-ground emesis)
  - Melena (black, tarry stools)
  - 'Hemodynamic instability: Hypotension, tachycardia, syncope'
  - Anemia, elevated BUN/Cr ratio (BUN/Cr >30 suggests upper GI source)
  - 'Causes: Peptic ulcer (40%), varices (20%), Mallory-Weiss tear, gastritis, malignancy'
  clinical_pearls:
  - 'Stabilize first: Two large-bore IVs, fluids, type and cross'
  - GBS score (Glasgow-Blatchford) predicts need for intervention
  - PPI drip (pantoprazole 80mg bolus, then 8mg/hr) for ulcer bleeding
  - 'Variceal bleeding: Octreotide drip + antibiotics + EGD banding'
  - Emergent EGD within 24 hours (sooner if unstable)
  management:
  - 'Guideline-based treatment options for Upper Gastrointestinal Bleeding include:'
  - 'Resuscitation: Two large-bore IVs, crystalloid, transfuse if Hgb <7 (or <8-9
    if CAD)'
  - 'PPI: Pantoprazole 80mg IV bolus, then 8mg/hr infusion'
  - 'If variceal suspected: Octreotide 50mcg bolus, then 50mcg/hr + ceftriaxone 1g
    IV'
  - EGD within 24 hours (emergent if unstable)
  - Hold anticoagulation, reverse if necessary
  tests:
  - CBC (hemoglobin trend), type and cross
  - BMP (BUN/Cr ratio >30 suggests upper GI source)
  - Coagulation studies (PT/INR if on anticoagulation)
  - Liver function tests (if suspect varices)
  - EGD (diagnostic and therapeutic)
