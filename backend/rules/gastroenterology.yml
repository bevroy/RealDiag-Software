- id: GASTRO-CHOLECYSTITIS
  label: Acute Cholecystitis
  presentations:
  - Right upper quadrant pain, often worse after fatty meals
  - 'Murphy''s sign: Inspiratory arrest with RUQ palpation (90% specific)'
  - Positive sonographic Murphy's sign on ultrasound
  - Fever (often low-grade), chills
  - Nausea and vomiting
  - 'Ultrasound findings: Gallstones, gallbladder wall thickening >4mm, pericholecystic
    fluid'
  - Pain radiating to right shoulder or scapula (referred pain)
  - 95% due to gallstone obstruction of cystic duct
  - Leukocytosis (elevated WBC count)
  - May have mild jaundice if Mirizzi syndrome (stone compresses CBD)
  - 'Complications: Gangrenous cholecystitis, perforation, emphysematous cholecystitis
    (diabetics)'
  - 'Risk factors: 4 F''s - Female, Forty, Fertile, Fat (obesity)'
  clinical_pearls:
  - Cholecystitis = inflammation of gallbladder (usually due to stone obstruction)
  - Murphy's sign highly specific (90%)
  - RUQ ultrasound is diagnostic test of choice
  - Early cholecystectomy (within 72hr) preferred over delayed
  - Gangrenous cholecystitis and perforation are serious complications
  management:
  - 'Guideline-based treatment options for Acute Cholecystitis include:'
  - NPO, IV fluids, IV antibiotics (ceftriaxone + metronidazole) (ACG 2023)
  - 'Pain control: Opioids, NSAIDs (ACG 2023)'
  - 'Cholecystectomy: Ideally within 72 hours of symptom onset (ACG 2023)'
  - 'If poor surgical candidate: Percutaneous cholecystostomy tube (ACG 2023)'
  - Avoid delaying surgery >72hr (increased complications) (ACG 2023)
  tests:
  - Right upper quadrant ultrasound (gallstones, wall thickening, Murphy's sign)
  - CBC (leukocytosis), liver function tests
  - HIDA scan if ultrasound equivocal (non-filling gallbladder)
  referrals:
  - Surgery for cholecystectomy
  - Gastroenterology if ERCP needed (choledocholithiasis)
  sensitivity: 0.88
  specificity: 0.9
