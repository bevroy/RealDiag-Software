family: gastroenterology
version: 0.1.0
source: American College of Gastroenterology (ACG) Guidelines, American Gastroenterological
  Association (AGA) Guidelines
rules:
- id: GI-GERD
  label: Gastroesophageal Reflux Disease (GERD)
  presentations:
  - Heartburn (pyrosis)
  - Regurgitation
  - Dysphagia
  - Chronic cough
  - Laryngitis or hoarseness
  - Symptoms worse when lying down
  clinical_pearls:
  - 'Clinical diagnosis: Typical symptoms (heartburn, regurgitation) - no testing
    needed'
  - 'PPI trial: If symptoms improve on PPI, confirms GERD (diagnostic and therapeutic)'
  - 'Alarm symptoms: Dysphagia, weight loss, anemia, vomiting - need EGD'
  - 'Barrett''s esophagus: Chronic GERD causes intestinal metaplasia (increased cancer
    risk)'
  - 'Extraesophageal manifestations: Chronic cough, asthma, laryngitis (less responsive
    to PPI)'
  - 'Lifestyle modifications: Elevate head of bed, avoid late meals, lose weight,
    avoid triggers'
  management:
  - 'Guideline-based treatment options for Gastroesophageal Reflux Disease (GERD)
    include:'
  - 'Lifestyle: Weight loss, elevate head of bed 6-8 inches, avoid meals 3 hours before
    bed (ACG 2023)'
  - 'Avoid triggers: Caffeine, alcohol, chocolate, peppermint, fatty foods, smoking
    (ACG 2023)'
  - 'PPI therapy: Omeprazole 20mg daily or pantoprazole 40mg daily x 8 weeks (take
    30-60min before breakfast) (ACG 2023)'
  - 'If refractory: Increase PPI to BID dosing or switch PPI (ACG 2023)'
  - Consider H2 blocker at bedtime for nocturnal symptoms (ranitidine, famotidine)
    (ACG 2023)
  tests:
  - None needed for typical symptoms (empiric PPI trial)
  - 'EGD if: Alarm symptoms, refractory symptoms, or long-standing GERD (screen for
    Barrett''s)'
  - Esophageal pH monitoring if diagnosis uncertain or evaluating for anti-reflux
    surgery
  - Esophageal manometry if dysphagia present (rule out achalasia, scleroderma)
  referrals:
  - 'Gastroenterology if: Refractory to PPI, alarm symptoms, Barrett''s esophagus,
    or surgical candidate'
  - Surgery (Nissen fundoplication) if medical therapy fails or patient preference
  - ENT if extraesophageal symptoms (laryngitis, chronic cough)
  icd10:
  - K21.9
  - K21.0
  snomed:
  - '235595009'
- id: GI-APPENDICITIS
  label: Acute Appendicitis
  presentations:
  - Periumbilical pain migrating to RLQ
  - Anorexia and nausea
  - Fever
  - Rebound tenderness
  - McBurney's point tenderness
  clinical_pearls:
  - 'Classic presentation: Periumbilical pain migrating to RLQ (McBurney''s point)
    within 12-24 hours'
  - Anorexia almost universal (if hungry, unlikely appendicitis)
  - 'Rovsing''s sign: LLQ palpation causes RLQ pain (highly specific)'
  - Psoas sign (pain with right hip extension) or obturator sign (pain with internal
    hip rotation)
  - Perforation risk increases after 36-48 hours (mortality increases from 0.1% to
    3%)
  - CT has high sensitivity (95%), but ultrasound preferred in pregnancy/children
    (avoid radiation)
  management:
  - 'Guideline-based treatment options for Acute Appendicitis include:'
  - NPO, IV fluids, pain control (opioids do NOT mask exam findings) (ACG 2023)
  - 'Antibiotics: Ceftriaxone 1g IV + metronidazole 500mg IV (ACG 2023)'
  - Appendectomy (laparoscopic preferred, open if perforated/complicated) (ACG 2023)
  - 'Non-operative management: Antibiotics alone for uncomplicated (controversial,
    30% recurrence) (ACG 2023)'
  - 'If perforated/abscess: Antibiotics, consider percutaneous drainage, interval
    appendectomy 6-8 weeks (ACG 2023)'
  tests:
  - CT abdomen/pelvis with IV contrast (sensitivity 95%, specificity 94%)
  - Ultrasound if pregnancy, children, or young women (avoid radiation)
  - CBC (leukocytosis with left shift), CRP elevated
  - Urinalysis (rule out UTI, may have mild pyuria from appendiceal inflammation)
  - Pregnancy test in women of childbearing age
  referrals:
  - Surgery consultation STAT for all suspected appendicitis
  - Gynecology if ovarian pathology suspected (ruptured cyst, torsion, PID)
  - Interventional radiology if abscess needs drainage
  icd10:
  - K35.80
  - K35.89
  snomed:
  - '74400008'
- id: GI-DIVERTICULITIS
  label: Acute Diverticulitis
  presentations:
  - Left lower quadrant abdominal pain (most common presentation)
  - Fever, chills (signs of infection/inflammation)
  - Change in bowel habits (constipation or diarrhea)
  - Nausea, vomiting, anorexia
  - Tenderness and guarding in LLQ
  - Leukocytosis (elevated WBC count)
  - 'CT findings: Colonic wall thickening, pericolic fat stranding, inflamed diverticula'
  - Diverticulosis common (50% by age 60); 10-25% develop diverticulitis
  - May have urinary symptoms (frequency, urgency) from bladder irritation
  - Occult blood in stool possible (avoid colonoscopy during acute episode)
  - 'Hinchey classification: I (phlegmon), II (abscess), III (purulent), IV (fecal
    peritonitis)'
  - Risk factors - low fiber diet, obesity, lack of exercise, NSAIDs
  clinical_pearls:
  - Diverticulosis common (50% by age 60), most asymptomatic; 10-25% develop diverticulitis
  - 'Hinchey classification: I (phlegmon), II (abscess), III (purulent peritonitis),
    IV (fecal peritonitis)'
  - CT abdomen/pelvis is diagnostic test of choice (sensitivity 98%)
  - 'Uncomplicated: Outpatient antibiotics + clear liquids; complicated: Admission
    + IV antibiotics'
  - Avoid colonoscopy during acute episode (risk perforation) - wait 6-8 weeks
  - High-fiber diet after resolution may reduce recurrence
  management:
  - 'Guideline-based treatment options for Acute Diverticulitis include:'
  - 'Uncomplicated (outpatient): Ciprofloxacin 500mg BID + metronidazole 500mg TID
    x 7-10 days, clear liquids (ACG 2023)'
  - 'Complicated (admission): NPO or clear liquids, IV antibiotics (ACG 2023)'
  - 'Abscess >3cm: Percutaneous drainage + antibiotics (ACG 2023)'
  - 'Surgery (sigmoid resection) if: Perforation, obstruction, refractory symptoms,
    or recurrent episodes (ACG 2023)'
  - Elective surgery after 2nd episode (or 1st in immunocompromised) (ACG 2023)
  tests:
  - CT abdomen/pelvis with IV contrast (bowel wall thickening, pericolic fat stranding,
    abscess)
  - CBC (leukocytosis), CRP elevated
  - Urinalysis (rule out UTI, may have mild pyuria from adjacent inflammation)
  - Colonoscopy 6-8 weeks after resolution (rule out colon cancer if >50 years or
    not up-to-date)
  referrals:
  - 'Surgery if: Complicated diverticulitis (perforation, obstruction), abscess needs
    drainage, recurrent episodes'
  - Gastroenterology for colonoscopy 6-8 weeks post-resolution
  - Interventional radiology if abscess >3cm needs drainage
  icd10:
  - K57.92
  - K57.32
  snomed:
  - '397881000'
- id: GI-BOWEL-OBSTRUCTION
  label: Small Bowel Obstruction
  presentations:
  - Cramping abdominal pain
  - Nausea and vomiting
  - Abdominal distention
  - Absent bowel sounds or high-pitched sounds
  - Constipation or obstipation
  clinical_pearls:
  - 'Most common causes: Adhesions (60% - prior surgery), hernias (20%), malignancy,
    Crohn''s'
  - 'Partial vs complete: Partial may pass flatus/stool, complete has obstipation'
  - 'Closed-loop obstruction: Two points of obstruction, high risk strangulation/ischemia'
  - 'CT findings: Dilated small bowel >3cm, transition point, air-fluid levels'
  - Conservative management (NPO + NGT) successful in 80% of partial obstructions
  - 'Strangulation (ischemic bowel): Fever, severe pain, peritoneal signs - surgical
    emergency'
  management:
  - 'Guideline-based treatment options for Small Bowel Obstruction include:'
  - NPO, IV fluids (aggressive resuscitation if dehydrated) (ACG 2023)
  - Nasogastric tubedecompression (ACG 2023)
  - Serial abdominal exams (monitor for peritoneal signs suggesting ischemia) (ACG
    2023)
  - Conservative management 24-48 hours if partial obstruction and no peritoneal signs
    (ACG 2023)
  - 'Surgery if: Complete obstruction, signs of ischemia (fever, peritonitis, lactic
    acidosis), or failed conservative management (ACG 2023)'
  tests:
  - CT abdomen/pelvis with IV contrast (diagnostic, identifies transition point, ischemia)
  - Abdominal X-ray (dilated small bowel loops, air-fluid levels, paucity of colonic
    gas)
  - CBC (leukocytosis suggests ischemia), BMP (assess electrolytes), lactate (elevated
    if ischemia)
  - Water-soluble contrast study (Gastrografin) if diagnosis uncertain or predicts
    need for surgery
  referrals:
  - Surgery consultation for all small bowel obstructions
  - 'Emergent surgery if: Signs of strangulation (peritonitis, fever, lactic acidosis),
    closed-loop, or complete obstruction'
  icd10:
  - K56.60
  - K56.69
  snomed:
  - '81060008'
- id: GI-CIRRHOSIS
  label: Liver Cirrhosis
  presentations:
  - Jaundice
  - Ascites
  - Spider angiomas
  - Palmar erythema
  - Hepatic encephalopathy
  - Easy bruising
  clinical_pearls:
  - End-stage liver disease with fibrosis and regenerative nodules
  - 'Causes: Alcohol (most common US), hepatitis C, NAFLD, hepatitis B, autoimmune,
    hemochromatosis'
  - Child-Pugh score (A, B, C) and MELD score predict mortality
  - 'Screen for HCC: Ultrasound + AFP every 6 months (cirrhosis increases HCC risk
    100-fold)'
  - 'Variceal screening: EGD at diagnosis, if large varices start propranolol prophylaxis'
  - 'Hepatorenal syndrome: Renal failure in cirrhosis (high mortality without transplant)'
  management:
  - 'Guideline-based treatment options for Liver Cirrhosis include:'
  - 'Treat underlying cause: Alcohol cessation, antiviral therapy (HBV with tenofovir,
    HCV with DAAs) (ACG 2023)'
  - 'Ascites: Sodium restriction (<2g/day), spironolactone 100mg + furosemide 40mg
    (2:1 ratio) (ACG 2023)'
  - 'Hepatic encephalopathy: Lactulose 30mL TID (goal 2-3 soft stools/day) + rifaximin
    550mg BID (ACG 2023)'
  - 'Variceal prophylaxis: Propranolol 20mg BID (titrate to HR 55-60) or nadolol,
    or EGD banding (ACG 2023)'
  - Liver transplant evaluation if decompensated (ascites, variceal bleed, encephalopathy)
    or MELD >15 (ACG 2023)
  tests:
  - Liver ultrasound (nodular liver, splenomegaly, ascites, portal vein patency)
  - Liver function tests (albumin, bilirubin, PT/INR, transaminases)
  - Hepatitis serologies (HBsAg, anti-HCV), iron studies (ferritin, TIBC), ANA/ASMA
    (autoimmune)
  - EGD (screen for varices)
  - Ultrasound + AFP every 6 months (HCC screening)
  referrals:
  - Gastroenterology/hepatology for all cirrhosis patients
  - Transplant hepatology if decompensated (ascites, variceal bleed, encephalopathy)
    or MELD >15
  - Addiction medicine for alcohol use disorder
  icd10:
  - K74.60
  - K70.30
  - K74.69
  snomed:
  - '19943007'
- id: GI-IBS
  label: Irritable Bowel Syndrome
  presentations:
  - Chronic abdominal pain
  - Bloating
  - Altered bowel habits (diarrhea, constipation, or mixed)
  - Symptoms relieved by defecation
  - No red flag symptoms
  clinical_pearls:
  - 'Diagnosis of exclusion: Rome IV criteria (abdominal pain ≥1 day/week x 3 months
    with ≥2 of: related to defecation, change in stool frequency, change in stool
    form)'
  - 'Subtypes: IBS-D (diarrhea), IBS-C (constipation), IBS-M (mixed), IBS-U (unclassified)'
  - 'Rule out red flags: Age >50, weight loss, anemia, family history colon cancer,
    rectal bleeding'
  - No diagnostic test for IBS - diagnosis based on symptoms and exclusion of other
    causes
  - Low FODMAP diet reduces symptoms in 70%
  management:
  - 'Guideline-based treatment options for Irritable Bowel Syndrome include:'
  - 'Dietary: Low FODMAP diet trial x 6-8 weeks, increase fiber if IBS-C, avoid triggers
    (ACG 2023)'
  - 'IBS-D: Loperamide 2-4mg PRN, rifaximin 550mg TID x 14 days (if bloating), eluxadoline
    (ACG 2023)'
  - 'IBS-C: Osmotic laxatives (PEG 3350 17g daily), linaclotide 290mcg daily, lubiprostone
    (ACG 2023)'
  - 'Antispasmodics: Hyoscyamine 0.125-0.25mg PRN or dicyclomine 10-20mg QID (ACG
    2023)'
  - Consider tricyclic antidepressantsfor pain or SSRIs if comorbid anxiety (ACG 2023)
  tests:
  - Minimal testing if typical symptoms and no red flags
  - CBC, CMP, TSH, celiac serologies (tissue transglutaminase IgA + total IgA)
  - Stool studies (C. diff, ova & parasites, Giardia antigen) if diarrhea
  - 'Colonoscopy if: Age >45 (colon cancer screening), alarm features, or family history
    IBD/colon cancer'
  referrals:
  - 'Gastroenterology if: Refractory symptoms, alarm features, or need colonoscopy'
  - Dietitian for low FODMAP diet guidance
  - Psychiatry/psychology if severe anxiety or depression comorbidity
  icd10:
  - K58.9
  - K58.0
  snomed:
  - '10743008'
- id: GI-CELIAC
  label: Celiac Disease
  presentations:
  - Chronic diarrhea
  - Bloating and gas
  - Weight loss
  - Fatigue
  - Dermatitis herpetiformis
  - Iron deficiency anemia
  clinical_pearls:
  - Autoimmune reaction to gluten (wheat, rye, barley) causing small bowel villous
    atrophy
  - Tissue transglutaminase IgA (tTG-IgA) most sensitive and specific screening test
  - Must be eating gluten when tested (false negative if already on gluten-free diet)
  - 'Gold standard: Small bowel biopsy showing villous atrophy (Marsh classification)'
  - Associated with dermatitis herpetiformis (intensely pruritic vesicles on extensor
    surfaces)
  - Strict gluten-free diet is only treatment, improves symptoms and reduces cancer
    risk
  management:
  - 'Guideline-based treatment options for Celiac Disease include:'
  - Strict lifelong gluten-free diet (avoid wheat, rye, barley) (ACG 2023)
  - 'Supplement deficiencies: Iron, folate, vitamin D, calcium, B12 (ACG 2023)'
  - Repeat tTG-IgA after 6-12 months (should normalize on gluten-free diet) (ACG 2023)
  - Screen first-degree relatives (10% risk) (ACG 2023)
  - Dietitian referral for gluten-free diet education (ACG 2023)
  tests:
  - Tissue transglutaminase IgA (tTG-IgA) + total IgA (most sensitive/specific)
  - 'If IgA deficient: Deamidated gliadin peptide IgG or tTG-IgG'
  - Small bowel biopsy (duodenum) via EGD (villous atrophy, crypt hyperplasia, intraepithelial
    lymphocytes)
  - CBC (anemia), CMP (hypoalbuminemia), iron studies, vitamin D, folate, B12
  - Must be on gluten-containing diet when tested (false negative if gluten-free)
  referrals:
  - Gastroenterology for EGD with small bowel biopsy (confirms diagnosis)
  - Dietitian for gluten-free diet education and meal planning
  - 'Refractory celiac: GI for repeat biopsy, rule out complications (lymphoma, refractory
    sprue)'
  icd10:
  - K90.0
  snomed:
  - '396331005'
- id: GI-COLORECTAL-CA
  label: Colorectal Cancer
  presentations:
  - Change in bowel habits
  - Rectal bleeding or melena
  - Abdominal pain
  - Unintentional weight loss
  - Iron deficiency anemia
  - Palpable mass
  clinical_pearls:
  - Third most common cancer, second leading cause of cancer death in US
  - 'Screening: Colonoscopy every 10 years starting age 45 (or 40 if African American
    or family history)'
  - 'Right-sided: Iron deficiency anemia, occult bleeding (cecum has large caliber,
    no obstruction)'
  - 'Left-sided: Bright red blood per rectum, obstruction, pencil-thin stools (descending
    colon narrow)'
  - 'Staging: CT chest/abdomen/pelvis, CEA level'
  - '5-year survival: Stage I (90%), Stage II (80%), Stage III (70%), Stage IV (14%)'
  management:
  - 'Guideline-based treatment options for Colorectal Cancer include:'
  - 'Surgical resection: Hemicolectomy (right or left), low anterior resection, abdominoperineal
    resection (ACG 2023)'
  - 'Adjuvant chemotherapy: FOLFOX (5-FU + leucovorin + oxaliplatin) for Stage III
    or high-risk Stage II (ACG 2023)'
  - 'Metastatic: Systemic chemotherapy+ biologics (bevacizumab, cetuximab) (ACG 2023)'
  - 'Rectal cancer: Neoadjuvant chemoradiation before surgery if T3-4 or node-positive
    (ACG 2023)'
  - 'Surveillance: Colonoscopy at 1 year, then every 3-5 years; CEA every 3-6 months
    x 2 years (ACG 2023)'
  tests:
  - Colonoscopy with biopsy (diagnostic, allows tissue diagnosis and polypectomy)
  - CT chest/abdomen/pelvis with IV contrast (staging, assess for metastases)
  - Carcinoembryonic antigen (CEA) - tumor marker for surveillance
  - MRI pelvis if rectal cancer (local staging)
  - 'Molecular testing: MSI (microsatellite instability), KRAS, NRAS, BRAF (guides
    therapy)'
  referrals:
  - Gastroenterology for colonoscopy (diagnosis)
  - Colorectal surgery for resection
  - Medical oncology for chemotherapy (Stage III, IV, or high-risk Stage II)
  - Radiation oncology if rectal cancer
  icd10:
  - C18.9
  - C20
  snomed:
  - '363406005'
- id: GASTRO-CROHNS-DISEASE
  label: Crohn's Disease
  presentations:
  - Chronic diarrhea (may be bloody), abdominal pain (often RLQ)
  - Weight loss, fatigue, fever
  - 'Perianal disease: Fissures, fistulas, abscesses (highly specific)'
  - 'Skip lesions: Patchy inflammation anywhere from mouth to anus'
  - 'Extraintestinal manifestations: Arthritis, erythema nodosum, uveitis, PSC'
  - 'Complications: Strictures, fistulas, abscesses, bowel obstruction'
  clinical_pearls:
  - Transmural inflammation (unlike UC which is mucosal)
  - Can affect any part of GI tract (mouth to anus), but commonly terminal ileum
  - String sign on imaging (narrowed terminal ileum)
  - Smoking worsens Crohn's (opposite of UC)
  - Biologic therapy (anti-TNF) for moderate-severe disease
  management:
  - 'Guideline-based treatment options for Crohn''s Disease include:'
  - 'Mild-moderate: Budesonide 9mg daily or mesalamine (ACG 2023)'
  - 'Moderate-severe: Prednisone 40mg daily taper, then azathioprine or anti-TNF (ACG
    2023)'
  - 'Biologics: Infliximab, adalimumab, vedolizumab (for steroid-refractory) (ACG
    2023)'
  - 'Surgery for complications: Stricturoplasty, resection (not curative) (ACG 2023)'
  - 'Nutrition: Elemental diet, avoid NSAIDs (ACG 2023)'
  tests:
  - Colonoscopy with ileoscopy (patchy ulcers, skip lesions, cobblestoning)
  - CT enterography or MR enterography (assess small bowel)
  - Fecal calprotectin (elevated, monitors inflammation)
  - CBC (anemia, leukocytosis), CRP/ESR (elevated)
  - Stool studies (rule out infection)
  referrals:
  - Gastroenterology for all suspected IBD
  - Surgery if complications (obstruction, fistula, abscess)
  sensitivity: 0.85
  specificity: 0.82
  icd10:
  - K50.90
  - K50.80
  snomed:
  - '34000006'
- id: GASTRO-ULCERATIVE-COLITIS
  label: Ulcerative Colitis (UC)
  presentations:
  - Bloody diarrhea (hallmark), tenesmus, urgency
  - Lower abdominal cramping, often relieved by defecation
  - Continuous inflammation starting at rectum, extends proximally
  - 'Extraintestinal: Arthritis, PSC (stronger association than Crohn''s), erythema
    nodosum'
  - 'Severe flare (fulminant colitis): More than 10 BM/day, fever, tachycardia, anemia'
  - 'Toxic megacolon: Dilated colon (>6 cm), systemic toxicity, risk of perforation'
  clinical_pearls:
  - Continuous mucosal inflammation (unlike Crohn's skip lesions)
  - Starts in rectum, extends proximally (can be proctitis, left-sided, or pancolitis)
  - Smoking protective (opposite of Crohn's)
  - 'Increased colon cancer risk: Screen starting 8 years after diagnosis'
  - 'Severe flare: IV steroids, if no response in 3-5 days → consider colectomy'
  management:
  - 'Guideline-based treatment options for Ulcerative Colitis (UC) include:'
  - 'Mild-moderate: Mesalamine2.4-4.8g daily, topical mesalamine suppositories/enemas
    (ACG 2023)'
  - 'Moderate-severe: Prednisone 40mg daily taper (ACG 2023)'
  - 'Maintenance: Azathioprine, 6-MP, or biologics (infliximab, vedolizumab) (ACG
    2023)'
  - 'Severe flare: IV methylprednisolone 60mg daily, if refractory → cyclosporine
    or colectomy (ACG 2023)'
  - 'Toxic megacolon: NPO, IV fluids, antibiotics, surgery if no improvement (ACG
    2023)'
  tests:
  - Colonoscopy (continuous inflammation, loss of vascular pattern, pseudopolyps)
  - Biopsy (crypt abscesses, basal plasmacytosis)
  - Fecal calprotectin (elevated)
  - CBC (anemia), CRP/ESR, stool studies
  - Abdominal X-ray if toxic megacolon suspected (dilated colon)
  referrals:
  - Gastroenterology for all suspected UC
  - Colorectal surgery if severe refractory flare or toxic megacolon
  sensitivity: 0.88
  specificity: 0.85
  icd10:
  - K51.90
  - K51.00
  snomed:
  - '64766004'
- id: GASTRO-ACUTE-HEPATITIS
  label: Acute Viral Hepatitis (A, B, C)
  presentations:
  - Jaundice, dark urine, clay-colored stools
  - Right upper quadrant pain, hepatomegaly
  - Nausea, vomiting, anorexia, fatigue
  - Fever, myalgias (prodrome)
  - Markedly elevated transaminases (ALT/AST >1000 U/L)
  - 'Hep A: Fecal-oral transmission, self-limited'
  - 'Hep B: Percutaneous/sexual, risk of chronic infection'
  - 'Hep C: Bloodborne, high chronicity rate (70-85%)'
  clinical_pearls:
  - ALT > AST (unlike alcoholic hepatitis where AST > ALT 2:1)
  - 'Hep A: IgM anti-HAV positive (acute infection)'
  - 'Hep B: HBsAg + IgM anti-HBc = acute infection'
  - 'Hep C: Anti-HCV + HCV RNA = acute or chronic (check HCV RNA)'
  - Fulminant hepatic failure rare but serious (encephalopathy, coagulopathy)
  management:
  - 'Guideline-based treatment options for Acute Viral Hepatitis (A, B, C) include:'
  - 'Supportive care: Hydration, antiemetics, rest (ACG 2023)'
  - 'Avoid: Alcohol, hepatotoxic drugs (acetaminophen, NSAIDs) (ACG 2023)'
  - 'Hep A: Self-limited, no specific treatment (ACG 2023)'
  - 'Hep B: Most resolve, monitor; if chronic → entecavir or tenofovir (ACG 2023)'
  - 'Hep C: Treat with direct-acting antivirals (sofosbuvir-based regimens), cure
    rate >95% (ACG 2023)'
  tests:
  - 'Hepatitis panel: Anti-HAV IgM, HBsAg, anti-HBc IgM, anti-HCV'
  - 'Liver function tests: ALT, AST, bilirubin, alkaline phosphatase, PT/INR'
  - 'If chronic suspected: HCV RNA, HBV DNA, HIV test, liver ultrasound'
  referrals:
  - Gastroenterology/hepatology for chronic hepatitis B or C
  - Transplant hepatology if fulminant hepatic failure
  sensitivity: 0.92
  specificity: 0.88
  icd10:
  - B15.9
  - B16.9
  - B17.10
  snomed:
  - '40468003'
- id: GASTRO-ACUTE-PANCREATITIS
  label: Acute Pancreatitis
  presentations:
  - Severe, constant epigastric pain radiating to back (hallmark symptom)
  - Nausea and vomiting (often severe and persistent)
  - Abdominal tenderness and distention
  - Elevated lipase and amylase (>3x upper limit of normal) - lipase more specific
  - 'Common causes: Gallstones (40%), alcohol (30%), hypertriglyceridemia (>1000 mg/dL)'
  - Fever, tachycardia if severe inflammation
  - 'Cullen sign: Periumbilical ecchymosis (hemorrhagic pancreatitis, rare)'
  - 'Grey-Turner sign: Flank ecchymosis (hemorrhagic pancreatitis, rare)'
  - 'CT findings: Pancreatic inflammation, edema, peripancreatic fluid, or necrosis'
  - Hypotension, shock if severe (SIRS, third-spacing of fluids)
  - 'Diagnosis: 2 of 3 criteria (pain, lipase >3x ULN, imaging findings)'
  - 'Risk factors: Alcohol, gallstones, medications (azathioprine, thiazides), ERCP,
    trauma'
  clinical_pearls:
  - 'Diagnosis: 2 of 3 criteria (pain, lipase >3x ULN, imaging findings)'
  - Lipase more specific than amylase
  - CT not needed for mild cases; delay 48-72hr if imaging needed (IV contrast)
  - Ranson's criteria or APACHE II score for severity assessment
  - Early aggressive IV hydration (LR preferred) improves outcomes
  management:
  - 'Guideline-based treatment options for Acute Pancreatitis include:'
  - 'Aggressive IV fluids: LR 250-500 mL/hr (goal UOP 0.5-1 mL/kg/hr) (ACG 2023)'
  - NPO initially, advance diet as tolerated (ACG 2023)
  - 'Pain control: Opioids (morphine, hydromorphone) (ACG 2023)'
  - 'Treat underlying cause: ERCP for gallstone pancreatitis with cholangitis/obstruction
    (ACG 2023)'
  - 'ICU if severe: Organ failure, necrosis, SIRS (ACG 2023)'
  tests:
  - Lipase (elevated >3x ULN)
  - Liver function tests (if gallstone etiology)
  - Triglycerides (if hypertriglyceridemia suspected, >1000 mg/dL)
  - CT abdomen with IV contrast (if severe or uncertain diagnosis, delay 48-72hr)
  - Right upper quadrant ultrasound (assess for gallstones)
  referrals:
  - Gastroenterology for all cases
  - Surgery for complications (necrosis, abscess, pseudocyst)
  - ERCP if gallstone with cholangitis/obstruction
  sensitivity: 0.9
  specificity: 0.85
  icd10:
  - K85.90
  - K85.00
  snomed:
  - '197456007'
- id: GASTRO-CHRONIC-PANCREATITIS
  label: Chronic Pancreatitis
  presentations:
  - Chronic or recurrent epigastric pain, often after eating
  - Steatorrhea (fatty, foul-smelling stools) - pancreatic insufficiency
  - Weight loss, malabsorption
  - Diabetes mellitus (endocrine insufficiency)
  - Calcifications on CT (pathognomonic)
  - 'Most common cause: Chronic alcohol use (70%)'
  clinical_pearls:
  - 'Triad: Chronic pain, steatorrhea, diabetes (burnt out pancreas)'
  - Pancreatic calcifications on CT are diagnostic
  - Lipase/amylase often NORMAL (gland burnt out)
  - Increased risk of pancreatic cancer (5%)
  - Pancreatic enzyme replacement improves absorption and reduces pain
  management:
  - 'Guideline-based treatment options for Chronic Pancreatitis include:'
  - Alcohol cessation (essential), smoking cessation (ACG 2023)
  - 'Pancreatic enzyme replacement: Creon 25,000-40,000 units lipase with meals (ACG
    2023)'
  - 'Pain management: NSAIDs, opioids (often refractory pain) (ACG 2023)'
  - 'Fat-soluble vitamins: A, D, E, K supplementation (ACG 2023)'
  - 'Diabetes management: Insulin often required (ACG 2023)'
