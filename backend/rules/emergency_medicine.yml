- id: EM-DKA
  label: Diabetic Ketoacidosis (DKA)
  presentations:
  - 'Hyperglycemia: Glucose >250 mg/dL (often >400)'
  - 'Anion gap metabolic acidosis: pH <7.3, bicarb <18, anion gap >12'
  - 'Ketones: Positive urine or serum ketones (beta-hydroxybutyrate >3 mmol/L)'
  - 'Kussmaul respirations: Deep, rapid breathing (compensatory for acidosis)'
  - Fruity breath odor (acetone)
  - Nausea, vomiting, abdominal pain (can mimic surgical abdomen)
  - Altered mental status, confusion (more severe with lower pH)
  - 'Triggers: Infection (most common), insulin noncompliance, new-onset diabetes'
  clinical_pearls:
  - 'DKA triad: Hyperglycemia + anion gap acidosis + ketones (need all 3)'
  - Anion gap = Na - (Cl + HCO3), normal 8-12, DKA typically >20
  - 'Insulin protocol: 0.1 units/kg/hr IV (e.g., 7 units/hr for 70kg), don''t bolus
    unless severe'
  - 'Potassium replacement critical: Start when K <5.2, hold insulin if K <3.3 (can
    cause cardiac arrest)'
  - Add dextrose (D5 in fluids) when glucose <250, continue insulin until anion gap
    closes
  - 'Resolution: Glucose <200, bicarb >18, pH >7.3, anion gap <12, able to eat'
  management:
  - 'Guideline-based treatment options for Diabetic Ketoacidosis (DKA) include:'
  - 'Immediate: IV access, labs (VBG, BMP, glucose, ketones), aggressive fluid resuscitation
    (ACEP 2023)'
  - 'Fluids: 1L NS bolus, then 250-500 mL/hr (10-14 mL/kg/hr), switch to D5 1/2NS
    when glucose <250 (ACEP 2023)'
  - 'Insulin: Regular insulin 0.1 units/kg/hr IV infusion (don''t bolus), continue
    until anion gap closes (ACEP 2023)'
  - 'Potassium: Measure q2-4hr, replace if <5.2 (20-40 mEq/L in fluids), hold insulin
    if <3.3 (ACEP 2023)'
  - 'Disposition: ICU if severe (pH <7.0, bicarb <10, altered mental status), telemetry
    for moderate, discharge when eating/drinking (ACEP 2023)'
  icd10:
  - E10.10
  - E11.10
  snomed:
  - '420422005'
- id: EM-ADRENAL-CRISIS
  label: Acute Adrenal Crisis (Addisonian Crisis)
  presentations:
  - Severe hypotension refractory to IV fluids and vasopressors
  - Hyponatremia (<130 mEq/L) and hyperkalemia (>5.5 mEq/L)
  - Hypoglycemia
  - Abdominal pain, nausea, vomiting (can mimic acute abdomen)
  - Confusion, lethargy, altered mental status
  - Fever (may indicate precipitating infection)
  - 'History: Known adrenal insufficiency, chronic steroid use (>2 weeks), pituitary
    disease'
  - 'Precipitants: Infection, trauma, surgery, abrupt steroid cessation'
  clinical_pearls:
  - 'Do NOT wait for confirmatory testing: Give hydrocortisone immediately if suspected'
  - Cortisol level before treatment if possible, but don't delay hydrocortisone
  - 'Hydrocortisone dose: 100mg IV bolus, then 50mg IV q6h or 200mg/day continuous
    infusion'
  - 'Chronic steroid use ≥2 weeks suppresses HPA axis: Need stress-dose steroids for
    acute illness'
  - Hyponatremia + hyperkalemia + hypoglycemia = classic triad (think adrenal crisis)
  - 'High mortality if untreated: 100% fatal without steroids'
  management:
  - 'Guideline-based treatment options for Acute Adrenal Crisis (Addisonian Crisis)
    include:'
  - 'Immediate: IV access, NS bolus 1-2L, hydrocortisone 100mg IV STAT (before labs)
    (ACEP 2023)'
  - 'Fluids: Aggressive NS resuscitation (D5NS if hypoglycemic), may need 4-6L in
    first 24hr (ACEP 2023)'
  - 'Hydrocortisone: 100mg IV bolus, then 50mg q6h (or 200mg/day infusion) (ACEP 2023)'
  - 'Labs: Cortisol level before hydrocortisone (if possible), ACTH, aldosterone,
    electrolytes, glucose (ACEP 2023)'
  - 'Disposition: ICU admission, identify precipitant (infection, MI, etc.), taper
    steroids once stable (ACEP 2023)'
  icd10:
  - E27.2
  snomed:
  - '36171008'
- id: EM-THYROID-STORM
  label: Thyroid Storm
  presentations:
  - Severe hyperthyroidism with life-threatening decompensation
  - 'High fever: >40°C (104°F), often >41°C'
  - Tachycardia out of proportion to fever (HR >140), atrial fibrillation (50%)
  - 'CNS: Agitation, confusion, delirium, seizures, coma'
  - 'GI: Nausea, vomiting, diarrhea, abdominal pain'
  - 'Cardiovascular: High-output heart failure, hypotension (late)'
  - 'Precipitants: Infection, surgery, trauma, iodine contrast, medication noncompliance'
  - Burch-Wartofsky score ≥45 supports diagnosis (fever, CNS, CV, GI, precipitant)
  clinical_pearls:
  - 'Clinical diagnosis: Don''t wait for thyroid labs, treat immediately if suspected'
  - 'Treatment order matters: (1) PTU/methimazole, (2) beta-blocker, (3) iodine 1hr
    later, (4) steroids'
  - 'Give iodine 1 hour AFTER PTU/methimazole: Otherwise iodine provides substrate
    for more T3/T4 synthesis'
  - 'Beta-blockers: Propranolol preferred (blocks T4→T3 conversion), esmolol if hemodynamically
    unstable'
  - 'Aggressive cooling: Acetaminophen (NOT aspirin - displaces T4 from binding proteins),
    cooling blankets'
  - 'High mortality: 10-30% even with treatment'
  management:
  - 'Guideline-based treatment options for Thyroid Storm include:'
  - 'Immediate: IV access, cooling measures (ice packs, cooling blanket), acetaminophen
    1g (ACEP 2023)'
  - '(1) Block synthesis: PTU 500-1000mg PO load then 250mg q4h, or methimazole 20mg
    q4h (ACEP 2023)'
  - '(2) Beta-blocker: Propranolol 1-2mg IV q10-15min (or 60-80mg PO q4h), esmolol
    if unstable (ACEP 2023)'
  - '(3) Block release (1hr after PTU): Iodine solution (Lugol''s 8 drops q6h or SSKI
    5 drops q6h) (ACEP 2023)'
  - '(4) Hydrocortisone 100mg IV q8h: Blocks T4→T3 conversion, treats possible adrenal
    insufficiency (ACEP 2023)'
  icd10:
  - E05.5
  snomed:
  - '10079009'
- id: EM-TENSION-PNEUMOTHORAX
  label: Tension Pneumothorax
  presentations:
  - Severe dyspnea, chest pain, respiratory distress
  - Hypotension, tachycardia, shock (late finding - don't wait for this)
  - Absent or decreased breath sounds on affected side
  - Hyperresonance to percussion on affected side
  - Tracheal deviation AWAY from affected side (late, unreliable sign)
  - Jugular venous distension (JVD)
  - Subcutaneous emphysema may be present
  - 'Clinical diagnosis: Do NOT wait for imaging if suspected'
  clinical_pearls:
  - 'Clinical diagnosis = immediate treatment: Do NOT wait for CXR if tension suspected'
  - 'Tracheal deviation is LATE finding: Absence doesn''t rule out tension pneumothorax'
  - 'Needle decompression: 2nd intercostal space, midclavicular line, insert 5cm needle/catheter'
  - Gush of air confirms diagnosis, patient improves immediately
  - 'Needle decompression is temporizing: Follow with chest tube (4th/5th ICS, anterior
    axillary line)'
  - 'Causes: Trauma (most common), mechanical ventilation (barotrauma), central line
    placement'
  management:
  - 'Guideline-based treatment options for Tension Pneumothorax include:'
  - 'Immediate: Needle decompression if tension suspected - 14-16G needle/catheter,
    2nd ICS midclavicular line (ACEP 2023)'
  - Insert needle perpendicular to chest wall, advance until gush of air, secure catheter
    (ACEP 2023)
  - 'Definitive: Chest tube placement (28-32 Fr) in 4th/5th intercostal space, anterior
    axillary line (ACEP 2023)'
  - 'If needle decompression fails: Consider finger thoracostomy (open pneumothorax,
    then chest tube) (ACEP 2023)'
  - 'Disposition: Admit for chest tube management, serial CXRs, respiratory therapy
    (ACEP 2023)'
  icd10:
  - J93.0
  snomed:
  - '44816003'
- id: EM-CARDIAC-TAMPONADE
  label: Cardiac Tamponade
  presentations:
  - Hypotension and tachycardia
  - Jugular venous distension
  - Muffled heart sounds
  - 'Beck''s triad: Hypotension, JVD, muffled heart sounds'
  - 'Pulsus paradoxus: >10 mmHg drop in SBP with inspiration'
  - Dyspnea and chest pain
  - Tachycardia out of proportion to findings
  - Electrical alternans on ECG (beat-to-beat QRS amplitude variation)
  - 'Causes: Pericardial effusion (malignancy, uremia, infection), trauma, post-MI
    (free wall rupture), aortic dissection'
  clinical_pearls:
  - Accumulation of pericardial fluid compresses heart, prevents ventricular filling,
    decreases cardiac output
  - 'Beck''s triad (hypotension, JVD, muffled heart sounds): Classic but only 10-40%
    have all three'
  - 'Pulsus paradoxus: Exaggerated drop in SBP >10 mmHg during inspiration (normal
    <10 mmHg) - 80% sensitive'
  - 'Electrical alternans: Beat-to-beat variation in QRS amplitude (heart swinging
    in fluid) - pathognomonic but rare'
  - 'RUSH exam (bedside ultrasound): Circumferential pericardial effusion + IVC plethora
    + RV diastolic collapse'
  - Pericardiocentesis is both diagnostic and therapeutic - immediate life-saving
    intervention
  management:
  - 'Guideline-based treatment options for Cardiac Tamponade include:'
  - 'Immediate: IV access (two large-bore), aggressive fluid resuscitation (preload),
    oxygen, bedside ultrasound (ACEP 2023)'
  - 'Fluids: NS bolus 1-2L to increase preload (temporizing measure - buys time for
    pericardiocentesis) (ACEP 2023)'
  - 'Avoid: Positive pressure ventilation (worsens preload), diuretics (worsens preload)
    (ACEP 2023)'
  - 'Emergent pericardiocentesis: Subxiphoid or parasternal approach, ultrasound-guided,
    aspirate fluid (send for culture, cytology, Gram stain) (ACEP 2023)'
  - 'Disposition: ICU after pericardiocentesis, cardiothoracic surgery consult if
    traumatic/post-MI, pericardial drain placement (ACEP 2023)'
  tests:
  - 'Bedside ultrasound (RUSH exam): Circumferential pericardial effusion, RV diastolic
    collapse (80% sensitive), RA systolic collapse (best predictor)'
  - 'IVC ultrasound: Plethoric (dilated >2cm, <50% collapse with inspiration) - indicates
    elevated CVP'
  - 'ECG: Low voltage QRS (<5mm in limb leads), electrical alternans (pathognomonic
    but rare 20%)'
  - 'CXR: Enlarged cardiac silhouette (water bottle heart) - needs >250 mL effusion,
    often normal in acute tamponade'
  - 'Pericardial fluid analysis: Cell count, Gram stain, culture, cytology, glucose,
    protein, LDH'
  referrals:
  - Cardiology EMERGENTLY for pericardiocentesis - can be performed at bedside by
    emergency or cardiology
  - 'Cardiothoracic surgery if: Traumatic tamponade, post-MI free wall rupture, recurrent
    effusion after drainage'
  icd10:
  - I31.4
  snomed:
  - '35304003'
- id: EM-ECTOPIC-PREGNANCY-RUPTURED
  label: Ruptured Ectopic Pregnancy
  presentations:
  - Acute lower abdominal pain (sudden onset, unilateral or diffuse)
  - Vaginal bleeding (may be minimal despite massive internal bleeding)
  - Hypotension, tachycardia, shock
  - 'Shoulder pain (Kehr sign): Referred pain from diaphragmatic irritation by blood'
  - 'Peritoneal signs: Rebound tenderness, guarding'
  - Positive pregnancy test (urine or serum beta-hCG)
  - 'Risk factors: Prior ectopic, PID, IUD, tubal surgery, smoking'
  - 'FAST exam: Free fluid in Morison''s pouch, pelvis'
  clinical_pearls:
  - Any woman of childbearing age with abdominal pain = pregnancy test (beta-hCG)
  - 'Ruptured ectopic = surgical emergency: Call OB/GYN immediately if suspected'
  - 'FAST exam: Free fluid in abdomen + positive pregnancy test = ruptured ectopic
    until proven otherwise'
  - 'Hemodynamically unstable: Go straight to OR, don''t wait for formal ultrasound'
  - 'Methotrexate contraindicated if ruptured: Needs immediate surgery'
  - 'Beta-hCG doesn''t correlate with rupture risk: Can rupture at any hCG level'
  management:
  - 'Guideline-based treatment options for Ruptured Ectopic Pregnancy include:'
  - 'Immediate: IV access (two large-bore), aggressive fluid resuscitation, T&C 4
    units PRBC (ACEP 2023)'
  - 'Labs: Beta-hCG, CBC, type & screen, coags (ACEP 2023)'
  - 'FAST exam: Assess for free fluid (hemoperitoneum) (ACEP 2023)'
  - 'If unstable: Emergent OB/GYN consult, OR for exploratory laparotomy/laparoscopy
    (ACEP 2023)'
  - 'If stable: Transvaginal ultrasound (look for intrauterine pregnancy vs ectopic
    mass), may need serial hCG (ACEP 2023)'
