  - O00.10
  snomed:
  - '34801009'
- id: EM-ACUTE-ANGLE-CLOSURE-GLAUCOMA
  label: Acute Angle-Closure Glaucoma
  presentations:
  - Sudden severe eye pain (deep, boring pain)
  - Blurred vision, halos around lights (corneal edema)
  - Red eye (conjunctival injection), "steamy" cloudy cornea
  - Fixed mid-dilated pupil (4-6mm, unresponsive to light)
  - Rock-hard eye on palpation
  - Nausea, vomiting, headache (from elevated IOP)
  - Intraocular pressure (IOP) >30 mmHg (normal 10-21), often >40-60 mmHg
  - 'Triggers: Dim lighting, dilating drops, anticholinergic medications'
  clinical_pearls:
  - 'Ophthalmic emergency: Permanent vision loss if IOP not lowered within hours'
  - 'Tonometry: Measure IOP (>30 mmHg diagnostic, normal 10-21)'
  - 'Treatment goal: Lower IOP <20 mmHg within 1-2 hours'
  - 'Topical drops work synergistically: Beta-blocker + alpha-agonist + prostaglandin
    + steroid'
  - 'Mannitol: Osmotic diuretic, lowers IOP rapidly (if topical drops insufficient)'
  - 'Definitive: Laser peripheral iridotomy (ophthalmology) - creates hole in iris
    for aqueous drainage'
  management:
  - 'Guideline-based treatment options for Acute Angle-Closure Glaucoma include:'
  - 'Immediate: Ophthalmology consult, measure IOP, start topical drops (ACEP 2023)'
  - 'Topical drops (give all): (1) Timolol 0.5% 1 drop, (2) Apraclonidine 1% 1 drop,
    (3) Prednisolone 1% 1 drop (ACEP 2023)'
  - 'Systemic: Acetazolamide 500mg IV or PO (carbonic anhydrase inhibitor), antiemetics
    (ACEP 2023)'
  - 'If IOP still elevated: Mannitol 1-2 g/kg IV over 30-45 min (osmotic diuresis)
    (ACEP 2023)'
  - 'Definitive: Laser peripheral iridotomy (ophthalmology) once IOP controlled, treat
    fellow eye prophylactically (ACEP 2023)'
  icd10:
  - H40.211
  - H40.212
  - H40.211
  snomed:
  - '392288008'
- id: EM-TESTICULAR-TORSION
  label: Testicular Torsion
  presentations:
  - Sudden onset severe testicular pain (unilateral)
  - Nausea, vomiting (50%)
  - Absent cremasteric reflex (99% sensitive)
  - High-riding testis, horizontal lie
  - Swelling, erythema, scrotal edema
  - 'Negative Prehn sign: Elevation does NOT relieve pain (vs epididymitis)'
  - 'Peak ages: Neonates and 12-18 years'
  - 'Time-critical: Testicular salvage 90% if <6 hours, <50% if 6-12 hours, <10% if
    >12 hours'
  clinical_pearls:
  - Absent cremasteric reflex = torsion until proven otherwise (99% sensitive, 100%
    NPV)
  - 'Do NOT delay surgery for imaging if high suspicion: Ultrasound can give false
    negatives'
  - 'Color Doppler ultrasound: Decreased/absent testicular blood flow (but don''t
    delay surgery)'
  - '6-hour window critical: Testicular salvage depends on time to detorsion'
  - 'Manual detorsion: ''Open the book'' - rotate affected testis outward (lateral
    to medial) 180-720°'
  - 'All patients need surgery: Detorsion + orchiopexy bilaterally (contralateral
    testis at risk)'
  management:
  - 'Guideline-based treatment options for Testicular Torsion include:'
  - 'Immediate: IV access, analgesia (morphine, ketorolac), urgent urology consult
    (ACEP 2023)'
  - 'Manual detorsion attempt: Rotate affected testis OUTWARD (medial border toward
    thigh) 180-720° until pain relief (ACEP 2023)'
  - 'If pain worsens: Stop and rotate in opposite direction (ACEP 2023)'
  - 'Ultrasound only if diagnosis uncertain AND surgery will not be delayed: Color
    Doppler shows decreased flow (ACEP 2023)'
  - 'Disposition: Emergent OR for surgical detorsion + bilateral orchiopexy (fix both
    testes to prevent recurrence) (ACEP 2023)'
  tests:
  - 'Cremasteric reflex: Absent in 99% of torsion (stroke inner thigh, normal = testicle
    retracts)'
  - 'Doppler ultrasound: Decreased or absent blood flow (don''t delay surgery for
    this)'
  - 'Physical exam: High-riding testis, horizontal lie, firm tender testis'
  referrals:
  - Urology EMERGENTLY - call immediately, patient goes directly to OR
