- id: CARD-PERICARDITIS
  label: Acute Pericarditis
  presentations:
  - Sharp, pleuritic chest pain (90%), worse with lying flat, better leaning forward
  - Pain may radiate to trapezius ridge (pathognomonic for pericarditis)
  - Pericardial friction rub on auscultation (30%, best heard at left sternal border,
    patient leaning forward)
  - 'ECG: Diffuse ST elevation in multiple leads (unlike regional in MI), PR depression'
  - Fever, malaise common if infectious etiology (viral most common)
  - 'Most common causes: Viral (coxsackie, echovirus), post-MI (Dressler syndrome),
    uremia, autoimmune (SLE, RA)'
  - Pericardial effusion may be present (seen on echocardiogram)
  - Dyspnea if large effusion or associated myocarditis
  - Tachycardia common (compensatory or inflammatory response)
  - Positional symptoms - relieved by sitting up and leaning forward
  - May have prodromal viral illness (URI symptoms 1-2 weeks prior)
  - Risk of progression to cardiac tamponade if large effusion develops
  clinical_pearls:
  - 'ECG: Diffuse ST elevation + PR depression (unlike MI: regional ST elevation)'
  - Troponin may be mildly elevated (myopericarditis) - doesn't mean ACS
  - NSAIDs + colchicine reduce recurrence by 50%
  - Avoid steroids initially (increase recurrence risk)
  - 'Red flags for tamponade: Hypotension, JVD, muffled heart sounds (Beck triad)'
  management:
  - 'Guideline-based treatment options for Acute Pericarditis include:'
  - 'NSAIDs: Ibuprofen 600-800mg TID or aspirin 750-1000mg TID for 1-2 weeks (ACC/AHA
    2023)'
  - Colchicine 0.6mg BID (or daily if <70kg) for 3 months (reduces recurrence) (ACC/AHA
    2023)
  - Avoid strenuous activity until symptoms resolve and CRP normalizes (ACC/AHA 2023)
  - 'If refractory: Low-dose prednisone taper (but increases recurrence) (ACC/AHA
    2023)'
  - 'Watch for tamponade: Daily clinical assessment first week (ACC/AHA 2023)'
  tests:
  - ECG (diffuse ST elevation, PR depression)
  - Echocardiogram (assess for effusion, tamponade)
  - Chest X-ray (cardiomegaly if large effusion)
  - CRP/ESR (elevated, track resolution)
  - Troponin (may be elevated in myopericarditis)
  - 'Consider: Viral serologies, ANA, RF if suspect autoimmune'
  referrals:
  - Cardiology for recurrent pericarditis or large effusion
  - Rheumatology if autoimmune etiology suspected
  sensitivity: 0.85
  specificity: 0.8
