- id: CARD-AORTIC-STENOSIS
  label: Aortic Stenosis (AS)
  presentations:
  - 'Classic triad (late disease): Exertional dyspnea, angina, syncope (SAD mnemonic)'
  - Crescendo-decrescendo systolic murmur, loudest at right upper sternal border
  - Radiates to carotids, reduced carotid upstroke (pulsus parvus et tardus)
  - Soft or absent S2 (A2 component), may have S4
  - 'Etiology: Calcific (age >70), bicuspid valve (age 40-60), rheumatic'
  - 'Symptoms indicate severe AS: Mean gradient >40 mmHg, AVA <1.0 cm², Vmax >4 m/s'
  clinical_pearls:
  - 'Severe symptomatic AS: 2-year survival 50% without AVR'
  - Once symptomatic, needs valve replacement (TAVR or SAVR)
  - Avoid afterload reducers (ACEi, hydralazine) - can cause hypotension
  - Low-dose diuretics OK for HF symptoms, but preload-dependent
  - Echo every 1-2 years for moderate AS, every 6-12 months for severe asymptomatic
  management:
  - 'Guideline-based treatment options for Aortic Stenosis (AS) include:'
  - 'Symptomatic severe AS: Aortic valve replacement (ACC/AHA 2023)'
  - TAVR preferred if age >65, high surgical risk, or comorbidities (ACC/AHA 2023)
  - 'Medical management: Treat HTN carefully (avoid aggressive afterload reduction)
    (ACC/AHA 2023)'
  - Diuretics for HF symptoms (low dose), beta-blockers for angina (caution) (ACC/AHA
    2023)
  - Endocarditis prophylaxis NOT routinely recommended (ACC/AHA 2023)
  tests:
