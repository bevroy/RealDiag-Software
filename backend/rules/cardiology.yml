  - no pulse, no consciousness
  - requires immediate defibrillation
  - medical emergency
  - Pulseless, unresponsive, no breathing (cardiac arrest)
  - 'ECG: Chaotic, irregular waveform with no identifiable QRS complexes'
  - Shockable rhythm on defibrillator
  - 'Causes: MI, cardiomyopathy, long QT, Brugada, hypokalemia, hypothermia'
  clinical_pearls:
  - 'Immediate defibrillation: Only definitive treatment, delays reduce survival 10%
    per minute'
  - 'CPR + defibrillation: 2 minutes CPR, then shock, repeat'
  - 'ACLS protocol: Epinephrine 1mg IV q3-5min, amiodarone 300mg IV if refractory'
  - 'Post-cardiac arrest: Targeted temperature management (33-36°C x24hr), cardiac
    cath if STEMI'
  - 'ICD placement: Secondary prevention (survived VF arrest)'
  management:
  - 'Guideline-based treatment options for Ventricular Fibrillation include:'
  - 'Immediate defibrillation: 200J biphasic (or 360J monophasic), don''t delay (ACC/AHA
    2023)'
  - 'CPR: 2 minutes, then reassess rhythm and shock again if still VF (ACC/AHA 2023)'
  - Epinephrine 1mg IV q3-5min during CPR (ACC/AHA 2023)
  - Amiodarone 300mg IV bolus if VF persists after 3 shocks, then 150mg if needed
