- id: CARD-HYPERTENSIVE-EMERGENCY
  label: Hypertensive Emergency
  presentations:
  - 'Severe hypertension: SBP >180 mmHg or DBP >120 mmHg'
  - Evidence of acute end-organ damage (distinguishes from urgency)
  - 'CNS: Hypertensive encephalopathy (confusion, headache, seizures, vision changes)'
  - 'Cardiac: Acute MI, acute heart failure, pulmonary edema (flash pulmonary edema)'
  - 'Renal: Acute kidney injury (Creatinine elevated, reduced urine output)'
  - 'Vascular: Aortic dissection, acute stroke (hemorrhagic or ischemic)'
  - 'Retinal: Hemorrhages, exudates, papilledema on fundoscopy (grade III-IV hypertensive
    retinopathy)'
  - 'Hematologic: Microangiopathic hemolytic anemia (MAHA), thrombocytopenia'
  - 'Risk factors: Medication noncompliance, chronic kidney disease, stimulant use
    (cocaine, amphetamines)'
  - Chest pain if cardiac ischemia or dissection
  - Dyspnea if pulmonary edema or heart failure
  - Nausea, vomiting if increased intracranial pressure
  clinical_pearls:
  - Emergency = end-organ damage (needs IV meds, ICU)
  - Urgency = high BP alone (oral meds, outpatient follow-up)
  - Reduce BP 10-20% in first hour, then 25% over 24 hours (don't drop too fast!)
  - Too-rapid BP reduction can cause stroke, blindness, renal failure
  - Nicardipine or labetalol drips most common first-line agents
  management:
  - 'Guideline-based treatment options for Hypertensive Emergency include:'
  - 'IV antihypertensives: Nicardipine drip 5-15 mg/hr (preferred), or Labetalol 20mg
    IV bolus (ACC/AHA 2023)'
  - 'Goal: Reduce MAP by 10-20% in first hour, max 25% in 24 hours (ACC/AHA 2023)'
  - 'Treat underlying emergency: Nitroprusside for dissection, diuretics for pulmonary
    edema (ACC/AHA 2023)'
  - 'Avoid: Oral/sublingual nifedipine (unpredictable drops) (ACC/AHA 2023)'
  - ICU admission for continuous BP monitoring (ACC/AHA 2023)
  tests:
  - ECG (ischemia)
  - Chest X-ray (pulmonary edema, widened mediastinum)
  - Basic metabolic panel (renal function)
  - Urinalysis (proteinuria, RBC casts)
  - Troponin (ACS)
  - CT head if neuro symptoms (stroke vs encephalopathy)
  - 'Consider: Echocardiogram, CTA chest (dissection)'
  referrals:
  - ICU admission for IV drip and monitoring
  - Cardiology consult
  - Nephrology if acute renal failure
