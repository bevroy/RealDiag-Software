family: cardiology
version: 0.1.0
source: American College of Cardiology (ACC/AHA) Clinical Practice Guidelines, European
  Society of Cardiology (ESC) Guidelines
rules:
- id: CARD-ACS
  label: Acute coronary syndrome
  presentations:
  - Chest pain or pressure (substernal, may radiate to arm/jaw/back/epigastrium)
  - 'Associated symptoms: dyspnea, diaphoresis, nausea, vomiting'
  - 'STEMI: ST elevation ≥1mm in 2+ contiguous leads, new LBBB'
  - 'NSTEMI: Elevated troponin WITHOUT ST elevation'
  - 'Unstable angina: Ischemic symptoms WITHOUT troponin elevation'
  - Atypical presentations common in elderly, diabetics, women
  - HEART score for risk stratification (History, ECG, Age, Risk factors, Troponin)
  clinical_pearls:
  - 'Door-to-balloon time goal: <90 minutes for STEMI'
  - Aspirin 325mg chewed immediately if no contraindications
  - 'MONA protocol: Morphine, Oxygen (if hypoxic), Nitroglycerin, Aspirin'
  - Diabetics and elderly may present with dyspnea alone (no chest pain)
  sensitivity: 0.9
  specificity: 0.85
  icd10:
  - I21.9
  - I21.3
  - I21.4
  snomed:
  - '394659003'
- id: CARD-AORTIC-DISSECTION
  label: Aortic dissection
  presentations:
  - sudden severe tearing chest or back pain
  - pulse differential between arms
  - widened mediastinum on CXR
  - Sudden onset severe 'tearing' or 'ripping' chest/back pain (90%)
  - 'Pain location: Anterior chest (Type A), interscapular back (Type B)'
  - Blood pressure differential >20 mmHg between arms
  - Pulse deficits, aortic regurgitation murmur (Type A)
  - 'Risk factors: Hypertension (most common), Marfan/Ehlers-Danlos, bicuspid valve,
    cocaine'
  clinical_pearls:
  - 'Type A (ascending aorta): Surgical emergency, mortality 1-2%/hour if untreated'
  - 'Type B (descending aorta): Medical management unless complicated (malperfusion,
    rupture)'
  - CTA chest/abdomen/pelvis with IV contrast is diagnostic test of choice
  - 'Don''t give beta-blocker alone: Lower heart rate FIRST (target HR <60), then
    BP (SBP 100-120)'
  - TEE highly sensitive if CTA contraindicated, but delays definitive diagnosis
  management:
  - 'Guideline-based treatment options for Aortic dissection include:'
  - 'Immediate: IV access (two large-bore), arterial line, pain control (morphine),
    BP control (ACC/AHA 2023)'
  - 'BP control: Beta-blocker FIRST (esmolol 0.5mg/kg bolus, then 50-200 mcg/kg/min
    infusion, or labetalol 20mg IV q10min) (ACC/AHA 2023)'
  - 'After HR <60: Add vasodilator if needed (nicardipine 5mg/hr IV, titrate to SBP
    100-120) (ACC/AHA 2023)'
  - 'Type A: Emergent cardiothoracic surgery consult, OR as soon as possible (ACC/AHA
    2023)'
  - 'Type B uncomplicated: Medical management (BP/HR control), admit to ICU, serial
    imaging (ACC/AHA 2023)'
  tests:
  - 'CTA chest/abdomen/pelvis: Intimal flap, true vs false lumen (gold standard)'
  - 'Chest X-ray: Widened mediastinum (>8cm), but normal CXR doesn''t rule out dissection'
  - 'TEE: If CTA contraindicated, highly sensitive for Type A'
  - 'ECG: May show ischemia if dissection extends to coronaries'
  referrals:
  - Cardiothoracic surgery EMERGENTLY for Type A
  - Vascular surgery for Type B if complicated (malperfusion, rupture, refractory
    pain)
  icd10:
  - I71.0
  snomed:
  - '60920007'
- id: CARD-PE
  label: Pulmonary embolism
  presentations:
  - Sudden onset dyspnea (most common symptom)
  - Pleuritic chest pain, tachycardia (HR >100)
  - Tachypnea (RR >20), hypoxia
  - Hemoptysis (less common, 10-15%)
  - 'Risk factors: immobility, recent surgery, malignancy, DVT, hypercoagulable state'
  - Wells criteria for risk stratification (≥4 points = high probability)
  - 'PERC rule: Can rule out PE if low risk and all 8 PERC criteria negative'
  - 'D-dimer: High sensitivity, low specificity (useful to rule OUT if negative)'
  clinical_pearls:
  - CTA pulmonary angiography is gold standard for diagnosis
  - V/Q scan alternative if contrast contraindicated
  - 'Massive PE: Hemodynamic instability, consider thrombolysis'
  - Start anticoagulation immediately if high suspicion, don't wait for imaging
  - Check for DVT with duplex ultrasound (present in ~50% of PE cases)
  sensitivity: 0.83
  specificity: 0.96
  icd10:
  - I26.9
  - I26.0
  snomed:
  - '59282003'
- id: CARD-VASOVAGAL
  label: Vasovagal syncope
  presentations:
  - sudden loss of consciousness with prodrome
  - triggered by emotional stress, pain, standing
  - rapid recovery without confusion
  - 'Prodrome: Nausea, warmth, diaphoresis, tunnel vision (lasts seconds to minutes)'
  - 'Triggers: Prolonged standing, pain, blood/needles, emotional stress, hot environment'
  - 'Rapid recovery: Consciousness returns within seconds, no post-ictal confusion'
  - Most common cause of syncope (21% of all syncope)
  clinical_pearls:
  - 'Diagnosis of exclusion: Benign if typical triggers, prodrome, quick recovery,
    normal exam'
  - 'No ECG abnormalities: Normal sinus rhythm, normal QT, no heart block'
  - 'Young healthy patients: Often vasovagal, but still need cardiac workup if concerning
    features'
  - 'Concerning features: Exertional syncope, no prodrome, family history SCD, abnormal
    ECG'
  - 'Recurrent vasovagal: Increase salt/fluid intake, counterpressure maneuvers'
  management:
  - 'Guideline-based treatment options for Vasovagal syncope include:'
  - 'Reassurance if classic presentation: Benign condition, excellent prognosis (ACC/AHA
    2023)'
  - 'Avoid triggers: Stay hydrated, avoid prolonged standing, recognize prodrome (ACC/AHA
    2023)'
  - 'Counterpressure maneuvers: Leg crossing + muscle tensing, hand grip when prodromal
    (ACC/AHA 2023)'
  - 'Increase salt/fluid intake: 2-3L fluid daily, extra salt (if no contraindication)
    (ACC/AHA 2023)'
  - 'Midodrine if refractory: 5-10mg TID (ACC/AHA 2023)'
  tests:
  - 'ECG: Rule out structural/electrical heart disease (long QT, WPW, heart block,
    Brugada)'
  - 'Orthostatic vitals: BP supine, then standing at 1 and 3 minutes (rule out orthostatic
    hypotension)'
  - 'No further testing if: Typical presentation, normal ECG, normal exam, no concerning
    features'
  - 'Consider: Echo, Holter, tilt-table test if recurrent or atypical'
  referrals:
  - 'Cardiology if: Exertional syncope, abnormal ECG, family history SCD, structural
    heart disease'
  - No referral needed if typical vasovagal with normal ECG
  icd10:
  - R55
  snomed:
  - '398665002'
- id: CARD-ORTHOSTATIC
  label: Orthostatic hypotension
  presentations:
  - lightheadedness or syncope upon standing
  - BP drop ≥20/10 mmHg within 3 minutes of standing
  - common in elderly or volume depleted
  - 'Symptoms within 3 minutes of standing: Lightheadedness, dizziness, visual changes,
    weakness'
  - May have syncope or near-syncope
  - 'Diagnosis: SBP drop ≥20 mmHg or DBP drop ≥10 mmHg within 3 minutes'
  - 'Causes: Dehydration, medications (diuretics, alpha-blockers, antihypertensives),
    autonomic neuropathy (diabetes, Parkinson)'
  clinical_pearls:
  - 'Classic orthostatic: Within 3 minutes of standing'
  - 'Delayed orthostatic: 3-10 minutes of standing (POTS if HR rises ≥30 bpm)'
  - 'Most common in elderly: Impaired baroreceptor response, polypharmacy'
  - 'Review medications: Diuretics, alpha-blockers, nitrates, antidepressants, antipsychotics'
  - 'Autonomic neuropathy: Diabetes, Parkinson''s, pure autonomic failure'
  management:
  - 'Guideline-based treatment options for Orthostatic hypotension include:'
  - 'Review and reduce offending medications: Diuretics, antihypertensives, alpha-blockers
    (ACC/AHA 2023)'
  - 'Non-pharmacologic: Increase salt/fluid intake, compression stockings, rise slowly
    (ACC/AHA 2023)'
  - 'Physical countermaneuvers: Leg crossing, muscle tensing before standing (ACC/AHA
    2023)'
  - 'Elevate head of bed 30 degrees at night: Reduces nocturnal diuresis (ACC/AHA
    2023)'
  - 'Pharmacologic if refractory: Midodrine 2.5-10mg TID, fludrocortisone 0.1-0.2mg
    daily (ACC/AHA 2023)'
  tests:
  - 'Orthostatic vitals: BP supine x5 min, then standing at 1 and 3 minutes'
  - Document BP and HR at each time point
  - 'Labs: CBC (anemia), BMP (dehydration, adrenal insufficiency), glucose (autonomic
    neuropathy)'
  - 'Consider: Tilt-table test if diagnosis unclear or POTS suspected'
  referrals:
  - 'Neurology if: Autonomic neuropathy suspected (Parkinson''s, pure autonomic failure)'
  - 'Cardiology if: Cardiac syncope cannot be excluded'
  icd10:
  - I95.1
  - R55
  snomed:
  - '28651003'
- id: CARD-HF
  label: Heart failure (chronic)
  presentations:
  - Dyspnea on exertion, orthopnea, paroxysmal nocturnal dyspnea (PND)
  - Peripheral edema (lower extremities), jugular venous distention (JVD)
  - Fatigue, exercise intolerance, weight gain
  - Rales on lung auscultation, S3 gallop
  - 'HFrEF: Ejection fraction <40% (systolic dysfunction)'
  - 'HFpEF: Ejection fraction ≥50% (diastolic dysfunction)'
  - 'Framingham criteria: 2 major or 1 major + 2 minor for diagnosis'
  - BNP >100 or NT-proBNP >300 supports diagnosis
  clinical_pearls:
  - 'NYHA classification: Class I (asymptomatic) to Class IV (symptoms at rest)'
  - 'HFrEF treatment: ACE-I/ARB/ARNI, beta-blocker, MRA, SGLT2i (GDMT)'
  - 'Acute decompensation: Diuretics, consider BiPAP if hypoxic'
  - 'Daily weights: >2-3 lbs gain in 24 hours suggests fluid retention'
  - Sodium restriction <2g/day, fluid restriction if hyponatremic
  sensitivity: 0.85
  specificity: 0.78
  icd10:
  - I50.9
  - I50.1
  - I50.30
  - I50.20
  snomed:
  - '84114007'
- id: CARD-HTN
  label: Hypertension
  presentations:
  - elevated blood pressure ≥130/80 mmHg
  - often asymptomatic
  - risk factor for cardiovascular disease
  - 'Stage 1: SBP 130-139 or DBP 80-89 mmHg'
  - 'Stage 2: SBP ≥140 or DBP ≥90 mmHg'
  - Usually asymptomatic (silent killer)
  - 'Complications: Stroke, MI, heart failure, CKD, retinopathy'
  clinical_pearls:
  - 'Confirm diagnosis: Home BP monitoring or 24-hour ambulatory BP (more accurate
    than office)'
  - 'White coat hypertension: Elevated in office, normal at home (20-30% of diagnoses)'
  - 'Target BP: <130/80 for most adults, <140/90 if age >65'
  - 'First-line medications: ACEi/ARB, CCB, thiazide diuretic'
  - 'Lifestyle: Weight loss 5-10 kg reduces SBP 5-20 mmHg, DASH diet, exercise, limit
    alcohol'
  management:
  - 'Guideline-based treatment options for Hypertension include:'
  - 'Lifestyle first if Stage 1 without ASCVD: Weight loss, DASH diet, exercise 150
    min/week, limit alcohol (ACC/AHA 2023)'
  - 'Start medication if: Stage 2 OR Stage 1 with ASCVD/diabetes/CKD (ACC/AHA 2023)'
  - 'First-line: Thiazide (chlorthalidone 12.5-25mg), ACEi (lisinopril 10-40mg), ARB
    (losartan 50-100mg), or CCB (amlodipine 5-10mg) (ACC/AHA 2023)'
  - 'Black patients: CCB or thiazide first-line (ACEi less effective as monotherapy)
    (ACC/AHA 2023)'
  - 'Combination therapy: Often need 2+ medications (ACEi/ARB + CCB or diuretic) (ACC/AHA
    2023)'
  tests:
  - 'Confirm diagnosis: Repeat BP measurements on 2+ visits or home BP monitoring'
  - 'Baseline labs: BMP (K, Cr), fasting glucose, lipid panel, UA, ECG'
  - 'Screen for secondary causes if: Age <30, resistant HTN, hypokalemia, abdominal
    bruit'
  - 'Secondary causes: Renal artery stenosis, primary aldosteronism, pheochromocytoma,
    Cushing''s'
  referrals:
  - 'Nephrology if: Resistant HTN (not controlled on 3+ meds) or concern for secondary
    causes'
  - 'Cardiology if: Target organ damage (LVH, CAD)'
  icd10:
  - I10
  snomed:
  - '38341003'
- id: CARD-PAD
  label: Peripheral arterial disease
  presentations:
  - claudication (leg pain with walking)
  - diminished pulses, cool extremities
  - may progress to critical limb ischemia
  - 'Intermittent claudication: Reproducible leg pain with walking, relieved by rest
    (calf, thigh, buttock)'
  - 'Distance to claudication: Consistent (e.g., always after 2 blocks)'
  - 'Physical exam: Diminished/absent pulses, bruits, cool skin, hair loss, atrophic
    changes'
  - 'Critical limb ischemia: Rest pain, non-healing ulcers, gangrene'
  - 'Risk factors: Smoking (most important), diabetes, age >65, HTN, dyslipidemia'
  clinical_pearls:
  - ABI (ankle-brachial index) <0.9 diagnostic (90% sensitive, 95% specific)
  - 'Smoking cessation most important: Reduces amputation risk 50%'
  - 'Antiplatelet therapy: Aspirin or clopidogrel reduces MI/stroke/death 25%'
  - 'Statin regardless of LDL: High-intensity atorvastatin 40-80mg'
  - 'Supervised exercise therapy: 30-45 min treadmill 3x/week improves walking distance
    50-200%'
  management:
  - 'Guideline-based treatment options for Peripheral arterial disease include:'
  - 'Smoking cessation: Most important intervention, reduces amputation 50% (ACC/AHA
    2023)'
  - 'Antiplatelet: Aspirin 81mg or clopidogrel 75mg daily (ACC/AHA 2023)'
  - 'Statin: High-intensity (atorvastatin 40-80mg) regardless of LDL level (ACC/AHA
    2023)'
  - 'ACE inhibitor: Ramipril reduces CV events even if normotensive (ACC/AHA 2023)'
  - 'Supervised exercise therapy: 30-45 min walking 3x/week (improves symptoms without
    revascularization) (ACC/AHA 2023)'
  - 'Cilostazol 100mg BID: Increases walking distance 40-60% (contraindicated in heart
    failure) (ACC/AHA 2023)'
  tests:
  - 'ABI (ankle-brachial index): Ankle SBP / brachial SBP. <0.9 = PAD, <0.4 = severe'
  - 'Arterial duplex ultrasound: Non-invasive imaging, identifies stenosis location'
  - 'CT angiography or MR angiography: Pre-procedural planning if revascularization
    considered'
  - 'Catheter angiography: Gold standard, done if intervention planned'
  referrals:
  - 'Vascular surgery if: Critical limb ischemia (rest pain, ulcers, gangrene), lifestyle-limiting
    claudication despite optimal medical therapy'
  - 'Wound care if: Non-healing ulcers'
  icd10:
  - I73.9
  snomed:
  - '399957001'
- id: CARD-AFIB
  label: Atrial fibrillation
  presentations:
  - Irregularly irregular heart rhythm (most reliable sign)
  - Palpitations, dyspnea, chest discomfort, fatigue
  - May be asymptomatic (discovered incidentally)
  - Absence of P waves on ECG, irregular R-R intervals
  - 'Increased stroke risk: CHA2DS2-VASc score guides anticoagulation'
  - Paroxysmal (<7 days, self-terminating), Persistent (>7 days), Permanent
  - Tachycardia-mediated cardiomyopathy if chronic rapid rate
  clinical_pearls:
  - 'CHA2DS2-VASc ≥2 (men) or ≥3 (women): Anticoagulation recommended'
  - 'Rate control goal: Resting HR <110 bpm (lenient) or <80 bpm (strict)'
  - 'Rhythm control: Consider cardioversion if <48 hours or TEE negative'
  - 'New onset with hemodynamic instability: Urgent cardioversion'
  - Check TSH (hyperthyroidism common cause), electrolytes, echo
  sensitivity: 0.95
  specificity: 0.9
  icd10:
  - I48.0
  - I48.1
  - I48.2
  - I48.91
  snomed:
  - '49436004'
- id: CARDIO-DVT
  label: Deep vein thrombosis
  presentations:
  - unilateral leg swelling, pain, warmth, erythema
  - positive Doppler ultrasound
  - Unilateral leg swelling (most specific finding)
  - Calf or thigh pain, tenderness along deep venous system
  - Warmth, erythema over affected area
  - 'Risk factors: Recent surgery, immobilization, malignancy, pregnancy, OCPs, thrombophilia'
  - 'Wells score: Clinical prediction rule (≥2 = high probability)'
  clinical_pearls:
  - 'Proximal DVT (popliteal/femoral): High risk for PE, needs anticoagulation'
  - 'Distal DVT (calf veins): Lower PE risk, consider serial ultrasound vs anticoagulation'
  - 'D-dimer: High sensitivity, low specificity. Negative rules out DVT if low pretest
    probability'
  - 'Duplex ultrasound: 95% sensitive for proximal DVT, less sensitive for calf DVT'
  - 'Anticoagulation: Apixaban or rivaroxaban preferred (no LMWH bridge needed)'
  management:
  - 'Guideline-based treatment options for Deep vein thrombosis include:'
  - 'Anticoagulation: Apixaban 10mg BID x7 days, then 5mg BID OR rivaroxaban 15mg
    BID x21 days, then 20mg daily (ACC/AHA 2023)'
  - 'Alternative: LMWH→ warfarin (INR 2-3) (ACC/AHA 2023)'
  - 'Duration: 3 months minimum (provoked), 3-6 months (unprovoked), indefinite if
    recurrent (ACC/AHA 2023)'
  - 'IVC filter: Only if anticoagulation contraindicated (active bleeding) (ACC/AHA
    2023)'
  - 'Compression stockings: May reduce post-thrombotic syndrome (controversial) (ACC/AHA
    2023)'
  tests:
  - 'Compression ultrasound with Doppler: First-line diagnostic test (95% sensitive
    for proximal DVT)'
  - 'Wells score: Pretest probability (≥2 = high probability)'
  - 'D-dimer: If low probability Wells score, negative D-dimer rules out DVT'
  - 'Consider: CT venography or MR venography if ultrasound equivocal'
  referrals:
  - 'Hematology if: Recurrent DVT, thrombophilia workup, anticoagulation complications'
  - 'Vascular surgery if: Phlegmasia cerulea dolens (limb-threatening), IVC filter
    placement'
  icd10:
  - I82.40
  snomed:
  - '128053003'
- id: CARD-CARDIOMYOPATHY
  label: Cardiomyopathy
  presentations:
  - dyspnea, fatigue, edema
  - may be dilated, hypertrophic, or restrictive
  - reduced cardiac output
  - arrhythmias
  - 'Three main types: Dilated (most common, reduced EF), hypertrophic (LVH, outflow
    obstruction), restrictive (stiff ventricles)'
  - 'Dilated: Heart failure symptoms, EF <40%, global LV dilation'
  - 'Hypertrophic: Dyspnea, syncope, systolic murmur increases with Valsalva'
  - 'Restrictive: Heart failure, preserved EF, impaired filling, mimics constrictive
    pericarditis'
  clinical_pearls:
  - 'Dilated cardiomyopathy: Ischemic (CAD) vs non-ischemic (alcohol, viral, idiopathic,
    peripartum)'
  - 'Hypertrophic cardiomyopathy: Genetic (sarcomere mutations), avoid dehydration/nitrates/ACEi'
  - 'Restrictive cardiomyopathy: Amyloidosis (most common), sarcoidosis, hemochromatosis,
    radiation'
  - 'Echo distinguishes types: Dilated (big thin heart), hypertrophic (thick septum),
    restrictive (small stiff heart)'
  - 'Cardiac MRI: Helps identify etiology (fibrosis pattern, infiltration)'
  management:
  - 'Guideline-based treatment options for Cardiomyopathy include:'
  - 'Dilated: GDMT for HFrEF (sacubitril-valsartan, BB, MRA, SGLT2i), ICD if EF ≤35%
    (ACC/AHA 2023)'
  - 'Hypertrophic: Beta-blockers (metoprolol) or verapamil, avoid ACEi/ARBs/nitrates,
    ICD if high risk (ACC/AHA 2023)'
  - 'Restrictive: Treat underlying cause (amyloidosis, hemochromatosis), diuretics
    for volume (ACC/AHA 2023)'
  - 'All types: Anticoagulation if AFib, avoid NSAIDs, manage arrhythmias (ACC/AHA
    2023)'
  tests:
  - 'Echocardiogram: EF, chamber size, wall thickness, diastolic function'
  - 'Cardiac MRI: Fibrosis pattern (helps identify etiology)'
  - 'ECG: LVH (hypertrophic), low voltage (restrictive/amyloid), LBBB (dilated)'
  - 'BNP: Elevated in all types with heart failure'
  - 'Consider: Endomyocardial biopsy if restrictive (amyloidosis, sarcoidosis)'
  referrals:
  - Cardiology for all new diagnoses
  - Genetic counseling if hypertrophic or familial dilated cardiomyopathy
  - Advanced HF team if refractory (LVAD, transplant)
  icd10:
  - I42.9
  - I42.0
  snomed:
  - '57809008'
- id: CARD-MYOCARDITIS
  label: Myocarditis
  presentations:
  - chest pain, dyspnea
  - fever, recent viral illness
  - elevated troponin
  - ECG changes
  - heart failure symptoms
  - Chest pain (pleuritic or pressure-like), dyspnea, palpitations
  - 'Recent viral illness (1-4 weeks prior): URI, GI symptoms'
  - Troponin elevated (myocardial injury), may mimic MI
  - 'ECG: ST changes, T-wave inversions, arrhythmias (VT, heart block)'
  - 'Fulminant myocarditis: Cardiogenic shock, life-threatening arrhythmias'
  clinical_pearls:
  - 'Viral causes: Coxsackie B, parvovirus B19, adenovirus, influenza, COVID-19'
  - 'Non-viral: Autoimmune (lupus, sarcoidosis), drugs (anthracyclines, immune checkpoint
    inhibitors), toxins (cocaine)'
  - 'Cardiac MRI: Lake Louise criteria (T2 hyperintensity, LGE, increased T1/T2 mapping)'
  - 'Supportive care: Most recover spontaneously, 20% progress to dilated cardiomyopathy'
  - 'Avoid NSAIDs in acute phase: May worsen inflammation'
  management:
  - 'Guideline-based treatment options for Myocarditis include:'
  - 'Supportive: Rest, avoid exercise until resolution (risk of arrhythmias, sudden
    death) (ACC/AHA 2023)'
  - 'Heart failure: Standard HF therapy (ACEi, BB, diuretics) once hemodynamically
    stable (ACC/AHA 2023)'
  - 'Arrhythmias: Continuous telemetry, treat VT, temporary pacemaker if high-degree
    block (ACC/AHA 2023)'
  - 'Immunosuppression: Only for giant cell or eosinophilic myocarditis (NOT viral)
    (ACC/AHA 2023)'
  - 'Fulminant: ICU, inotropes, mechanical support, transplant if refractory (ACC/AHA
    2023)'
  tests:
  - 'Troponin: Elevated (myocardial injury)'
  - 'ECG: ST changes, T-wave inversions, PR depression, arrhythmias'
  - 'Echocardiogram: LV dysfunction, wall motion abnormalities, may be normal'
  - 'Cardiac MRI: Gold standard for diagnosis (Lake Louise criteria)'
  - 'Endomyocardial biopsy: Reserved for fulminant cases or if specific treatment
    changes management'
  referrals:
  - Cardiology for all suspected myocarditis
  - 'ICU if: Fulminant myocarditis, cardiogenic shock, life-threatening arrhythmias'
  - 'Advanced HF team if: Progressive LV dysfunction, need for mechanical support'
  icd10:
  - I40.9
  snomed:
  - '50920009'
- id: CARD-PERICARDITIS
  label: Acute Pericarditis
  presentations:
  - sharp chest pain, worse with lying down, improved sitting forward
  - pericardial friction rub
  - diffuse ST elevation on ECG
  - may have pericardial effusion
  icd10:
  - I30.9
  snomed:
  - '3238004'
- id: CARD-VALVE-AR
  label: Aortic Regurgitation
  presentations:
  - dyspnea on exertion
  - diastolic murmur
  - wide pulse pressure
  - bounding pulses (waterhammer pulse)
  - 'Chronic AR: Gradual dyspnea, palpitations, angina (even without CAD)'
  - 'Acute AR: Sudden pulmonary edema, cardiogenic shock (endocarditis, dissection)'
  - 'Diastolic decrescendo murmur: Best heard at left sternal border, leaning forward'
  - 'Wide pulse pressure: SBP elevated, DBP low (e.g., 160/40)'
  - 'Bounding pulses: Waterhammer pulse, Corrigan pulse, de Musset sign (head bobbing)'
  clinical_pearls:
  - 'Chronic AR: LV adapts (eccentric hypertrophy), asymptomatic for years'
  - 'Acute AR: No time for LV adaptation, rapid pulmonary edema/cardiogenic shock'
  - 'Surgery indicated: Symptomatic, EF <50%, LVESD >50mm, or LV dilation'
  - 'Afterload reduction: ACEi/ARB/hydralazine helps chronic AR (reduces regurgitant
    volume)'
  - 'Avoid beta-blockers: Bradycardia prolongs diastole, increases regurgitant volume'
  management:
  - 'Guideline-based treatment options for Aortic Regurgitation include:'
  - 'Chronic AR: Afterload reduction, avoid beta-blockers (ACC/AHA 2023)'
  - 'Surgery: If symptomatic, EF <50%, LVESD >50mm, or progressive LV dilation (ACC/AHA
    2023)'
  - 'Acute severe AR: Emergent surgery (endocarditis, dissection), inotropes, nitroprusside,
    avoid IABP (ACC/AHA 2023)'
  - 'Endocarditis: 6 weeks antibiotics + early surgery if valve destruction (ACC/AHA
    2023)'
  - 'Serial echo: Every 6-12 months for moderate-severe AR (ACC/AHA 2023)'
  tests:
  - 'Echocardiogram: Assess severity (vena contracta, regurgitant volume), LV size/function'
  - 'Chest X-ray: Cardiomegaly, prominent ascending aorta'
  - 'ECG: LVH with strain pattern (chronic AR)'
  - 'Cardiac catheterization: If echo equivocal or assess CAD pre-surgery'
  referrals:
  - Cardiology for all moderate-severe AR
  - 'Cardiac surgery if: Symptomatic, EF <50%, or LVESD >50mm'
  - Emergent surgery if acute severe AR
  icd10:
  - I35.1
  snomed:
  - '60234000'
- id: CARD-VALVE-MS
  label: Mitral Stenosis
  presentations:
  - dyspnea, hemoptysis
  - opening snap, diastolic rumble
  - atrial fibrillation common
  - often rheumatic heart disease history
  - Dyspnea on exertion (most common), orthopnea, PND
  - 'Hemoptysis: From pulmonary venous hypertension'
  - 'Opening snap: After S2, then low-pitched diastolic rumble (best at apex, left
    lateral position)'
  - 'Atrial fibrillation: 40-50% (LA enlargement from increased pressure)'
  - 'Rheumatic heart disease: 99% of MS in developing countries, rare in US'
  clinical_pearls:
  - 'Opening snap to S2 interval: Shorter interval = more severe stenosis'
  - 'Severe MS: Valve area <1.0 cm² (normal 4-6 cm²), mean gradient >10 mmHg'
  - 'Pregnancy: High risk - increased cardiac output worsens symptoms'
  - 'Mitral valve area inversely related to gradient: Smaller valve = higher gradient'
  - 'Percutaneous mitral balloon commissurotomy (PMBC): First-line if suitable anatomy'
  management:
  - 'Guideline-based treatment options for Mitral Stenosis include:'
  - 'Medical: Rate control for AFib, anticoagulation (warfarin for AFib or prior embolism)
    (ACC/AHA 2023)'
  - 'Diuretics: For pulmonary congestion symptoms (ACC/AHA 2023)'
  - 'Percutaneous mitral balloon commissurotomy: If symptomatic, valve area <1.5 cm²,
    favorable anatomy (ACC/AHA 2023)'
  - 'Surgical mitral valve replacement: If PMBC not suitable (severe MR, heavy calcification,
    LA thrombus) (ACC/AHA 2023)'
  - 'Endocarditis prophylaxis: NOT routinely recommended (ACC/AHA 2023)'
  tests:
  - 'Echocardiogram: Assess severity (valve area, mean gradient), valve morphology,
    LA size'
  - 'ECG: LA enlargement (broad P wave V1), AFib common'
  - 'Chest X-ray: LA enlargement (straightening of left heart border), pulmonary edema'
  - 'TEE: Pre-procedure (rule out LA thrombus before PMBC)'
  referrals:
