- id: CARD-SUPRAVENTRICULAR-TACHYCARDIA
  label: Supraventricular Tachycardia (SVT)
  presentations:
  - Sudden onset palpitations (abrupt start and stop)
  - Regular narrow-complex tachycardia, rate 150-250 bpm
  - Dizziness, lightheadedness, dyspnea, chest discomfort
  - Polyuria common after episode (atrial stretch → ANP release)
  - 'Most common type: AVNRT (AV nodal reentrant tachycardia) 60%'
  - 'Other types: AVRT (accessory pathway), atrial tachycardia'
  - Usually young patients without structural heart disease
  clinical_pearls:
  - 'Vagal maneuvers: Valsalva, carotid massage, ice water immersion'
  - Adenosine 6mg rapid IV push (then 12mg if no response) - diagnostic and therapeutic
  - 'Warning before adenosine: ''You''ll feel like you''re dying for 10 seconds'''
  - Adenosine causes transient asystole (have defibrillator ready)
  - 'If recurrent: Refer to EP for ablation (>95% cure rate)'
  management:
  - 'Guideline-based treatment options for Supraventricular Tachycardia (SVT) include:'
  - 'Vagal maneuvers first: Valsalva (bear down), carotid massage (ACC/AHA 2023)'
  - Adenosine 6mg rapid IV push, flush immediately (half-life 10 seconds) (ACC/AHA
    2023)
  - 'If no response: Adenosine 12mg, then 12mg again (ACC/AHA 2023)'
  - 'Alternatives: Diltiazem 0.25mg/kg IV or metoprolol 5mg IV (ACC/AHA 2023)'
  - Synchronized cardioversion if unstable or refractory (ACC/AHA 2023)
  tests:
  - ECG during episode (narrow-complex tachycardia, no P waves or buried P waves)
  - Echocardiogram if recurrent (rule out structural disease)
  - Consider EP study if recurrent or poorly tolerated
  referrals:
  - Cardiology/EP for recurrent SVT
  - Catheter ablation for definitive cure (consider after 2+ episodes)
  sensitivity: 0.95
  specificity: 0.9
  icd10:
  - I47.1
  - I47.19
  snomed:
  - '6456007'
- id: CARD-ATRIAL-FIBRILLATION-RVR
  label: Atrial Fibrillation with Rapid Ventricular Response (AFib RVR)
  presentations:
  - Irregularly irregular rhythm on ECG, no P waves, rate >100 bpm
  - Palpitations, dyspnea, chest discomfort, dizziness
  - May be asymptomatic in chronic AFib
  - Heart rate typically 110-180 bpm (uncontrolled)
  - 'Risk factors: HTN, CAD, valvular disease, thyroid disease, ETOH, advanced age'
  - 'Complications: Stroke risk (CHA2DS2-VASc score), heart failure, cardiomyopathy'
  clinical_pearls:
  - 'Goals: Rate control (<110 bpm at rest) and anticoagulation'
  - 'Rate vs rhythm control: Rate control non-inferior for most patients'
  - 'CHA2DS2-VASc ≥2 men, ≥3 women: Start anticoagulation (apixaban, rivaroxaban)'
