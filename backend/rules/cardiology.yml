- id: CARD-STABLE-ANGINA
  label: Stable Angina Pectoris
  presentations:
  - Predictable chest discomfort with exertion, relieved by rest (5-10 minutes)
  - Substernal pressure, tightness, or heaviness (not sharp)
  - May radiate to left arm, jaw, neck, or epigastrium
  - 'Associated symptoms: Dyspnea, diaphoresis, nausea (less common than ACS)'
  - 'Reproducible pattern: Same level of exertion triggers symptoms'
  - Relieved by nitroglycerin within 5 minutes
  - No symptoms at rest (distinguishes from unstable angina)
  clinical_pearls:
  - 'Typical angina: Substernal, exertional, relieved by rest or NTG'
  - 'Atypical angina: 2 of 3 features (more common in women, diabetics)'
  - Stable = predictable pattern, no crescendo, no rest symptoms
  - Stress test if new diagnosis (exercise ECG, nuclear, echo stress)
  - 'Optimal medical therapy: Aspirin, statin, BB or CCB, nitrates PRN'
  management:
  - 'Guideline-based treatment options for Stable Angina Pectoris include:'
  - 'Antiplatelet: Aspirin 81mg daily (ACC/AHA 2023)'
  - 'Beta-blocker: Metoprolol 25-100mg BID (first-line for rate control) (ACC/AHA
