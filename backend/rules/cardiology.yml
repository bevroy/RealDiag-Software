  - 'Nitrates: Sublingual NTG 0.4mg PRN for angina (take up to 3 doses 5 min apart)
    (ACC/AHA 2023)'
  - 'Statin: High-intensity (atorvastatin 40-80mg) regardless of LDL (ACC/AHA 2023)'
  - 'Risk factor modification: Smoking cessation, BP control, diabetes management
