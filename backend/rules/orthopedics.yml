family: orthopedics
version: 0.1.0
source: American Academy of Orthopaedic Surgeons (AAOS) Clinical Practice Guidelines,
  Orthopaedic Trauma Association (OTA)
rules:
- id: ORTHO-HIP-FRACTURE
  label: Hip Fracture
  presentations:
  - Hip or groin pain after fall or trauma
  - Unable to bear weight
  - Shortened and externally rotated leg
  - Common in elderly with osteoporosis
  - X-ray shows femoral neck or intertrochanteric fracture
  clinical_pearls:
  - 25-30% mortality within 1 year (due to complications - DVT/PE, pneumonia, MI)
    - surgery within 24-48h improves outcomes
  - 'Femoral neck fracture: Intracapsular - disrupts blood supply, risk of AVN. Treatment:
    Hemiarthroplasty if displaced (elderly), ORIF if non-displaced (young)'
  - 'Intertrochanteric fracture: Extracapsular - better blood supply, lower AVN risk.
    Treatment: Intramedullary nail or sliding hip screw'
  - 'Garden classification: Type I-II (non-displaced, ORIF), Type III-IV (displaced,
    arthroplasty if elderly)'
  - 'Delayed surgery >48h: Increased mortality, pressure ulcers, delirium, DVT'
  management:
  - 'Guideline-based treatment options for Hip Fracture include:'
  - 'Surgery within 24-48 hours: Early mobilization reduces complications (pneumonia,
    DVT, delirium) (AAOS 2023)'
  - 'Femoral neck: Hemiarthroplasty (elderly, displaced) or ORIF with cannulated screws
    (young, non-displaced) (AAOS 2023)'
  - 'Intertrochanteric: Intramedullary nail (dynamic hip screw) - allows early weight
    bearing (AAOS 2023)'
  - 'DVT prophylaxis: Enoxaparin 40mg SQ daily OR fondaparinux 2.5mg SQ daily (start
    postop, continue 10-35 days) (AAOS 2023)'
  - 'Early mobilization: Physical therapy POD#1, weight bearing as tolerated, prevent
    deconditioning (AAOS 2023)'
  tests:
  - 'X-ray hip (AP pelvis + lateral): Femoral neck vs intertrochanteric fracture,
    displacement, comminution'
  - MRI hip if X-ray negative but high clinical suspicion (occult fracture - MRI 99%
    sensitive)
  - 'Preop labs: CBC, CMP, coags, type & cross (blood loss 1-2 units)'
  - 'ECG: Cardiac risk stratification (elderly)'
  referrals:
  - Orthopedic surgery urgently - admit for surgery within 24-48 hours
  - Geriatrics co-management improves outcomes (delirium prevention, osteoporosis
    treatment)
  icd10:
  - S72.009A
  snomed:
  - 5913000
- id: ORTHO-DISTAL-RADIUS-FX
  label: Distal Radius Fracture (Colles Fracture)
  presentations:
  - Wrist pain and swelling after fall on outstretched hand (FOOSH)
  - Dorsal angulation ("dinner fork deformity")
  - Common in elderly with osteoporosis
  - X-ray shows fracture of distal radius
  clinical_pearls:
  - Most common upper extremity fracture in adults - Colles (dorsal angulation, 90%)
    vs Smith (volar angulation, 10%)
  - 'Acceptable reduction: <5mm radial shortening, <10° dorsal angulation, <2mm articular
    step-off'
  - 'Instability criteria: >20° dorsal angulation, >2mm radial shortening, comminuted
    dorsal cortex, intra-articular, age >60'
  - 'Complications: Median nerve injury (acute carpal tunnel), EPL tendon rupture
    (1-2%), malunion, post-traumatic arthritis'
  - 'Smith fracture (reverse Colles): Volar angulation from fall on dorsiflexed wrist
    - more unstable, often needs ORIF'
  management:
  - 'Guideline-based treatment options for Distal Radius Fracture (Colles Fracture)
    include:'
  - 'Non-displaced stable: Sugar tong splint x1 week, then short arm cast x4-6 weeks.
    Repeat X-ray at 1 week (check for loss of reduction) (AAOS 2023)'
  - 'Closed reduction (Hematoma block + conscious sedation): Traction, palmar flexion,
    ulnar deviation. Post-reduction splint (AAOS 2023)'
  - 'ORIF with volar plate: If unstable, intra-articular, open, loss of reduction
    after casting (AAOS 2023)'
  - 'External fixation: If severely comminuted or soft tissue injury (AAOS 2023)'
  - Immediate elevation, ice, finger ROM exercises to prevent stiffness (AAOS 2023)
  tests:
  - 'X-ray wrist (PA, lateral, oblique): Assess angulation, shortening, articular
    involvement'
  - 'Radial height: Normal 11-12mm (relative to ulna). <10mm = significant shortening'
  - 'Radial inclination: Normal 23°. Volar tilt: Normal 11° volar (negative = dorsal
    angulation)'
  - 'Check median nerve function: Sensation thumb/index/middle, thumb opposition (APB)'
  referrals:
  - 'Orthopedics urgently if: Open fracture, unstable fracture, intra-articular, neurovascular
    compromise, failed closed reduction'
  - Stable non-displaced fractures can be managed with cast by primary care with orthopedic
    follow-up
  icd10:
  - S52.509A
  snomed:
  - 263204007
- id: ORTHO-ANKLE-FRACTURE
  label: Ankle Fracture
  presentations:
  - Ankle pain, swelling, inability to bear weight after trauma
  - Deformity if displaced
  - Ottawa ankle rules to determine need for X-ray
  - X-ray shows fracture of malleolus (medial, lateral, or bimalleolar)
  clinical_pearls:
  - 'Ottawa ankle rules (99% sensitive): X-ray if bone tenderness at posterior edge/tip
    of lateral or medial malleolus OR unable to bear weight 4 steps'
  - 'Stable fractures: Isolated non-displaced lateral malleolus below plafond - can
    be treated with boot/cast'
  - 'Unstable fractures (need ORIF): Bimalleolar, trimalleolar, displaced, talar shift,
    syndesmotic injury (Maisonneuve)'
  - 'Maisonneuve fracture: Proximal fibula fracture with syndesmotic disruption -
    palpate entire fibula, unstable, needs ORIF'
  - 'Syndesmotic injury: Widened mortise on X-ray (>4mm medial clear space) - high
    ankle sprain, prolonged recovery'
  management:
  - 'Guideline-based treatment options for Ankle Fracture include:'
  - 'Non-displaced stable lateral malleolus: Controlled ankle motionboot, weight bearing
    as tolerated, f/u 1 week (AAOS 2023)'
  - 'Displaced or unstable: ORIF with plates/screws (bimalleolar, trimalleolar, syndesmotic
    injury) (AAOS 2023)'
  - 'Post-op: Non-weight bearing x6 weeks, then progressive weight bearing with PT
    (AAOS 2023)'
  - 'Splint initially: Posterior splint with ankle 90° dorsiflexion until swelling
    improves, then cast or surgery (AAOS 2023)'
  - 'DVT prophylaxis: Enoxaparin 40mg SQ daily if non-weight bearing >3 days (Caprini
    score) (AAOS 2023)'
  tests:
  - 'X-ray ankle (AP, lateral, mortise): Medial, lateral, or posterior malleolus fracture.
    Mortise view for talar shift'
  - 'Medial clear space: <4mm normal. >4mm = syndesmotic disruption or deltoid ligament
    injury'
  - 'Tibiofibular overlap: >6mm on AP, >1mm on mortise. Less = syndesmotic injury'
  - 'Palpate entire fibula: Rule out Maisonneuve fracture (proximal fibula fracture)'
  referrals:
  - 'Orthopedics urgently if: Bimalleolar/trimalleolar, displaced fracture, syndesmotic
    injury, Maisonneuve fracture, neurovascular compromise'
  - 'Stable non-displaced lateral malleolus: Can manage with CAM boot and orthopedic
    follow-up 1 week'
  icd10:
  - S82.899A
  snomed:
  - 16114001
- id: ORTHO-CLAVICLE-FRACTURE
  label: Clavicle Fracture
  presentations:
  - Shoulder pain after fall or direct blow
  - Tenderness and deformity over clavicle
  - Arm held close to body
  - X-ray shows fracture (most common in middle third)
  clinical_pearls:
  - Most common fracture in children and adults (5% of all fractures) - usually middle
    third (80%)
  - 'Mechanism: Fall on shoulder (indirect) or direct blow to clavicle'
  - 95% treated non-operatively with excellent outcomes - figure-8 brace vs sling
    (no difference in outcomes)
  - 'Operative indications: Displaced >2cm, Z-deformity, open fracture, neurovascular
    injury, skin tenting, bilateral'
  - 'Complications: Neurovascular injury rare (<1%), malunion common (cosmetic bump)
    but usually not functionally significant'
  management:
  - 'Guideline-based treatment options for Clavicle Fracture include:'
  - 'Non-displaced or minimally displaced (<2cm): Sling for comfort x3-6 weeks, ice,
    analgesia (NSAIDs) (AAOS 2023)'
  - 'Figure-8 brace: No better than sling, less comfortable, not recommended (AAOS
    2023)'
  - 'Early ROM: Pendulum exercises at 2 weeks, active ROM at 6 weeks when pain allows
    (AAOS 2023)'
  - 'Return to full activity: 12 weeks (contact sports) (AAOS 2023)'
  - 'ORIF with plate or intramedullary nail: If displaced >2cm, skin tenting, neurovascular
    injury (AAOS 2023)'
  tests:
  - 'X-ray clavicle (AP with 15° cephalic tilt): Shows fracture location, displacement,
    comminution'
  - 'Check neurovascular: Brachial plexus (sensation, motor - deltoid, biceps), subclavian
    vessels (pulses, bruits)'
  - 'Chest X-ray if high-energy trauma: Rule out pneumothorax, hemothorax'
  referrals:
  - 'Orthopedics urgently if: Displaced >2cm, skin tenting, open fracture, neurovascular
    injury'
  - 'Non-displaced: Can manage with sling and orthopedic follow-up 1-2 weeks'
  icd10:
  - S42.009A
  snomed:
  - 58150001
- id: ORTHO-FEMUR-FRACTURE
  label: Femoral Shaft Fracture
  presentations:
  - Severe thigh pain after high-energy trauma
  - Unable to bear weight
  - Deformity, swelling, shortening of leg
  - Risk of fat embolism and significant blood loss
  - X-ray shows mid-shaft femur fracture
  clinical_pearls:
  - High-energy injury (MVA, fall from height) - always assess for other injuries
    (20-50% have polytrauma)
  - 'Blood loss: 1000-1500 mL into thigh (1-3 units) - can cause hemorrhagic shock'
  - 'Fat embolism syndrome: 1-3% risk - petechiae, hypoxia, confusion 24-72h post-injury
    (fat globules in pulmonary circulation)'
  - 'Compartment syndrome risk: Rare in isolated femur fracture (thigh compartment
    large) but monitor if crushed/vascular injury'
  - 'Associated injuries: Ipsilateral knee injury (5-10%), hip fracture/dislocation
    (5%), chest/abdominal trauma'
  management:
  - 'Guideline-based treatment options for Femoral Shaft Fracture include:'
  - 'EMERGENCY: ATLS protocol if trauma. Large bore IV × 2, resuscitate, assess for
    other injuries (AAOS 2023)'
  - 'Immediate traction: Hare traction splint or skin traction (reduces pain, bleeding,
    fat embolism risk) (AAOS 2023)'
  - 'Surgical fixation: Intramedullarynail within 24 hours (gold standard) - allows
    early mobilization (AAOS 2023)'
  - 'DVT prophylaxis: Enoxaparin 30mg SQ BID OR fondaparinux 2.5mg SQ daily (high
    risk - trauma, immobility) (AAOS 2023)'
  - 'Analgesia: Femoral nerve block, opioids PRN (AAOS 2023)'
  tests:
  - 'X-ray femur (AP + lateral) including hip and knee: Fracture location, displacement,
    comminution'
  - 'CT chest/abdomen/pelvis if trauma: Rule out other injuries (ATLS protocol)'
  - 'CBC: Baseline hemoglobin (expect drop 2-3 g/dL), type & cross 4 units'
  - 'Check distal pulses: Palpate dorsalis pedis and posterior tibial (vascular injury
    rare but possible)'
  referrals:
  - Orthopedic surgery EMERGENTLY - admit for IM nail within 24 hours
  - Trauma team activation if high-energy mechanism (polytrauma common)
  icd10:
  - S72.309A
  snomed:
  - 71642004
- id: ORTHO-VERTEBRAL-COMPRESSION
  label: Vertebral Compression Fracture
  presentations:
  - Acute back pain (often thoracic or lumbar)
  - Common in elderly with osteoporosis or after minor trauma
  - Height loss, kyphosis if multiple fractures
  - Point tenderness over affected vertebra
  - X-ray or MRI shows vertebral body compression
  clinical_pearls:
  - 700,000 per year in US - osteoporotic (75%), malignant (20%), traumatic (5%)
  - 'Osteoporotic: Spontaneous or minor trauma (lifting, coughing), thoracolumbar
    junction (T12-L1) most common'
  - 'Red flags for malignancy: Age <50, history of cancer, weight loss, night pain,
    posterior element involvement, pedicle destruction'
  - 'Multiple fractures: Height loss (1-2 inches per fracture), kyphosis, restrictive
    lung disease'
  - Neurologic deficits RARE in osteoporotic fractures (compression only) - if present,
    suspect malignancy or trauma
  management:
  - 'Guideline-based treatment options for Vertebral Compression Fracture include:'
  - 'Acute pain control: Acetaminophen 1g TID, NSAIDs, opioids short-term if severe
    (AAOS 2023)'
  - 'Bracing: Thoracolumbosacral orthosisfor 6-12 weeks - reduces pain, unclear if
    prevents further collapse (AAOS 2023)'
  - 'Early mobilization: Bedrest <3 days increases osteoporosis, deconditioning. Ambulate
    as tolerated (AAOS 2023)'
  - 'Osteoporosis treatment: Bisphosphonate (alendronate 70mg weekly), calcium 1200mg
    + vitamin D 800-1000 IU daily (AAOS 2023)'
  - 'Vertebroplasty/kyphoplasty: If pain refractory to medical management >6 weeks
    OR patient can''t tolerate meds (AAOS 2023)'
  tests:
  - 'X-ray spine (AP + lateral): Shows fracture (wedge, biconcave, crush), height
    loss >20-25%'
  - 'MRI spine (if red flags or neurologic deficits): STIR sequence shows acute fracture
    (bone marrow edema - bright), differentiates acute vs chronic, malignancy'
  - 'DEXA scan: Assess bone density (T-score <-2.5 = osteoporosis)'
  - 'Labs if malignancy suspected: CBC, CMP, SPEP (myeloma), PSA (men), ESR/CRP'
  referrals:
  - Neurosurgery urgently if neurologic deficits (cord compression - rare in osteoporotic
    fractures, suggests malignancy)
  - Interventional radiology if refractory pain >6 weeks (vertebroplasty/kyphoplasty)
  - Endocrinology/rheumatology for osteoporosis management
  icd10:
  - S32.009A
  snomed:
  - 230662006
- id: ORTHO-ACL-TEAR
  label: Anterior Cruciate Ligament (ACL) Tear
  presentations:
  - Knee pain and swelling after twisting injury or sudden deceleration
  - Pop felt at time of injury
  - Knee instability, giving way
  - Positive Lachman test, positive anterior drawer test
  - MRI shows ACL tear
  clinical_pearls:
  - Most common knee ligament injury in athletes - non-contact deceleration, pivoting,
    landing (70% of cases)
  - Pop heard/felt at injury in 90% - immediate swelling (hemarthrosis within 2 hours)
    distinguishes ACL from meniscus tear
  - 'Lachman test (knee 20-30° flexion): 85% sensitive, more sensitive than anterior
    drawer. Soft endpoint = complete tear'
  - 'Associated injuries: Lateral meniscus (50%), medial meniscus (30%), MCL (30%)
    - O''Donoghue''s unhappy triad (ACL + MCL + medial meniscus)'
  - 'Natural history: Chronic ACL deficiency leads to meniscus tears (75%) and osteoarthritis
    by age 40 in active patients'
  management:
  - 'Guideline-based treatment options for Anterior Cruciate Ligament (ACL) Tear include:'
  - 'Acute: RICE (rest, ice, compression, elevation), crutches non-weight bearing
    until pain improves, NSAIDs (AAOS 2023)'
  - 'ACL reconstruction (within 3-6 weeks): For young, active patients, athletes (allows
    return to cutting/pivoting sports) (AAOS 2023)'
  - 'Graft options: Bone-patellar tendon-bone (strongest, risk patellar pain), hamstring
    (less pain), allograft (older patients) (AAOS 2023)'
  - 'Non-operative: For low-demand, older patients, willing to avoid cutting/pivoting
    sports. Physical therapy for quadriceps/hamstring strengthening (AAOS 2023)'
  - 'Prehab: PT before surgeryimproves postop outcomes (AAOS 2023)'
  tests:
  - 'Clinical diagnosis: Lachman test (85% sensitive), anterior drawer (75%), pivot
    shift (specific but low sensitivity - only if patient relaxed)'
  - 'MRI knee: 95% sensitive and specific - shows ACL tear, associated meniscus/cartilage
    injury'
  - 'X-ray knee (AP, lateral, sunrise, tunnel): Rule out Segond fracture (lateral
    tibial plateau avulsion - pathognomonic for ACL tear), tibial spine avulsion'
  - 'Knee aspiration if tense hemarthrosis: Aspirate 30-60 mL blood, inject 10-20
    mL marcaine for pain relief'
  referrals:
  - Orthopedic sports medicine within 1-2 weeks for evaluation and reconstruction
    planning
  - 'Acute: Crutches, ice, NSAIDs, avoid pivoting until seen by orthopedics'
  icd10:
  - S83.511A
  snomed:
  - 427477000
- id: ORTHO-MENISCUS-TEAR
  label: Meniscus Tear
  presentations:
  - Knee pain, swelling, clicking or locking
  - Joint line tenderness
  - Positive McMurray test
  - May follow twisting injury
  - MRI shows meniscal tear
  clinical_pearls:
  - Most common knee injury - medial meniscus (70%) more common than lateral (30%)
  - 'Mechanism: Twisting on weight-bearing knee (young athletes) OR degenerative (older
    patients, minimal trauma)'
  - 'True locking (can''t fully extend): Suggests bucket-handle tear or displaced
    flap - needs urgent surgery'
  - 'Pseudo-locking (can wiggle into extension): Pain limiting motion, not mechanical
    block'
  - 'Healing potential: Outer 1/3 red zone (vascular) can heal, inner 2/3 white zone
    (avascular) won''t heal'
  management:
  - 'Guideline-based treatment options for Meniscus Tear include:'
  - 'Acute traumatic: RICE, NSAIDs, crutches until can walk without limp (AAOS 2023)'
  - 'Physical therapy: If no mechanical symptoms (locking, catching) - quadriceps
    strengthening can improve function without surgery in 50% (AAOS 2023)'
  - 'Arthroscopic partial meniscectomy: If mechanical symptoms (true locking, catching)
    or failed 6-8 weeks PT (AAOS 2023)'
  - 'Meniscal repair: If tear in vascular red zone (outer 1/3), patient <40, vertical/longitudinal
    tear - higher healing rate (AAOS 2023)'
  - 'Degenerative tears (age >50): Arthroscopy NO better than PT alone - conservative
    management first (AAOS 2023)'
  tests:
  - 'McMurray test: Palpate joint line, flex knee, externally rotate + extend (medial
    meniscus), internally rotate + extend (lateral). Click/pain = positive'
  - 'Thessaly test: Stand on one leg, rotate knee 5° medially/laterally 3 times -
    joint line pain or catching = positive (better sensitivity than McMurray)'
  - 'MRI knee: 90% sensitive and specific - shows tear location, pattern (vertical,
    horizontal, bucket-handle, flap), associated injuries'
  - 'X-ray knee: Rule out arthritis, loose bodies, tibial plateau fracture'
  referrals:
  - 'Orthopedic sports medicine if: True locking (can''t extend), failed 6-8 weeks
    PT, young patient with traumatic tear'
  - Conservative management first for degenerative tears in older patients (PT equally
    effective as surgery)
  icd10:
  - S83.209A
  snomed:
  - 239720000
- id: ORTHO-ROTATOR-CUFF-TEAR
  label: Rotator Cuff Tear
  presentations:
  - Shoulder pain, especially with overhead activities
  - Weakness with arm elevation
  - Painful arc of motion
  - Positive drop arm test, empty can test
  - MRI shows rotator cuff tear
  - Common in elderly or after trauma
  clinical_pearls:
  - 'Prevalence increases with age: 10% at age 60, 50% at age 80 (many asymptomatic)'
  - 'Traumatic vs degenerative: Young trauma (fall on outstretched arm) vs older degenerative
    (chronic impingement, overuse)'
  - Supraspinatus most commonly torn (90%), then infraspinatus (60%), subscapularis
    (40%), teres minor (rare)
  - 'Partial vs full-thickness: Partial tears (bursal or articular side) may respond
    to PT, full-thickness often need surgery'
  - 'Massive tears (>5 cm, 2+ tendons): High re-tear rate after repair, may need reverse
    total shoulder if irreparable'
  management:
  - 'Guideline-based treatment options for Rotator Cuff Tear include:'
  - 'Conservative (first-line for degenerative tears): PT 6-12 weeks (deltoid compensation,
    scapular stabilization), NSAIDs, subacromial steroid injection (AAOS 2023)'
  - 'Subacromial steroid injection: Triamcinolone 40mg + 5 mL lidocaine - diagnostic
    and therapeutic (AAOS 2023)'
  - 'Surgical repair: If traumatic tear in young patient, failed 3-6 months PT, significant
    weakness, large tear (>3 cm) (AAOS 2023)'
  - 'Repair options: Arthroscopic (preferred), mini-open, open. Better outcomes if
    repaired within 6 months (muscle atrophy/fatty infiltration irreversible after
    6 months) (AAOS 2023)'
  - 'Post-op: Sling x6 weeks, passive ROM only x6 weeks, then active ROM, strengthening
    at 3 months (AAOS 2023)'
  tests:
  - 'Empty can test (supraspinatus): Arm 90° abduction, 30° forward, thumb down. Resist
    elevation. Pain/weakness = positive'
  - 'Drop arm test: Passively abduct arm 90°, ask to slowly lower. Arm drops suddenly
    = positive (full-thickness tear)'
  - 'External rotation lag sign: Passively externally rotate arm 90°, ask to hold.
    Arm falls to neutral = positive (infraspinatus tear)'
  - 'MRI shoulder: 90% sensitive - shows tear size, retraction, muscle atrophy, fatty
    infiltration (poor prognosis for repair)'
  - 'X-ray shoulder (AP, scapular Y, axillary): Rule out fracture, calcific tendinitis,
    acromioclavicular arthritis'
  referrals:
  - 'Orthopedic shoulder specialist if: Acute traumatic tear, failed 3-6 months PT,
    significant weakness, large/massive tear'
  - 'Degenerative tears: Trial PT x3-6 months before surgery (50% improve with PT
    alone)'
  icd10:
  - M75.100
  snomed:
  - 47433009
- id: ORTHO-ACHILLES-RUPTURE
  label: Achilles Tendon Rupture
  presentations:
  - Sudden onset of posterior heel/calf pain during activity
  - Pop felt at time of injury
  - Difficulty walking, inability to stand on tiptoes
  - Positive Thompson test (no plantar flexion with calf squeeze)
  - Palpable gap in Achilles tendon
  clinical_pearls:
  - Most common in weekend warriors (30-50 years, sporadic activity) - eccentric loading
    during pushoff (basketball, tennis)
  - 'Thompson (Simmonds) test: Patient prone, squeeze calf. Normal = foot plantar
    flexes. Ruptured = no plantar flexion (90% sensitive)'
  - 'Palpable gap: 2-6 cm proximal to calcaneus insertion (zone of hypovascularity
    - watershed area)'
  - 'Risk factors: Fluoroquinolone antibiotics (3-5x risk), steroids, gout, rheumatoid
    arthritis, prior tendinopathy'
  - Bilateral rupture rare (<5%) - consider hypermobility, connective tissue disorder
  management:
  - 'Guideline-based treatment options for Achilles Tendon Rupture include:'
  - 'Surgical repair: Open or percutaneous - lower re-rupture rate (3-5%) vs conservative,
    preferred for young/active patients (AAOS 2023)'
  - 'Conservative (casting): Equinus cast x2 weeks, then walking boot with heel lifts,
    gradually lower heel over 8-12 weeks. Re-rupture 10-15% (AAOS 2023)'
  - 'Post-op: Splint in equinus x2 weeks, then walking boot with 2-3cm heel lifts,
    progressive weight bearing, PT at 6-8 weeks (AAOS 2023)'
  - 'Early mobilization: Functional bracing with early ROM (vs rigid immobilization)
    reduces stiffness, faster return to activity (AAOS 2023)'
  - 'Return to sports: 6-9 months (conservative), 4-6 months (surgical). Rehab focuses
    on eccentric strengthening (AAOS 2023)'
  tests:
  - 'Clinical diagnosis: Thompson test (90% sensitive), palpable gap, inability to
    stand on tiptoe'
  - 'Ultrasound: Can confirm diagnosis and measure gap size (if <5mm, may consider
    conservative treatment)'
  - 'MRI: Usually not needed (clinical diagnosis sufficient), but shows complete vs
    partial tear if unclear'
  - 'X-ray ankle (lateral): Rules out calcaneus avulsion fracture (rare - older patients)'
  referrals:
  - Orthopedic foot/ankle specialist within 1-2 days for surgical vs conservative
    discussion
  - Posterior splint in equinus (ankle plantar flexed) until seen by orthopedics to
    keep torn ends approximated
  icd10:
  - S86.019A
  snomed:
  - 40593004
- id: ORTHO-CARPAL-TUNNEL
  label: Carpal Tunnel Syndrome
  presentations:
  - Hand numbness and tingling in median nerve distribution (thumb, index, middle,
    radial half of ring finger)
  - Pain worse at night
  - Weakness of thumb abduction
  - Positive Tinel sign, positive Phalen test
  - Nerve conduction studies show median nerve compression
  clinical_pearls:
  - Most common entrapment neuropathy - compression of median nerve under transverse
    carpal ligament at wrist
  - 'Classic symptom: Waking at night with numbness, shaking hand relieves symptoms
    (flick sign)'
  - 'Spares palm: Palmar cutaneous branch branches before carpal tunnel - if palm
    numb, not CTS'
  - 'Risk factors: Pregnancy (resolves postpartum), obesity, diabetes, hypothyroidism,
    rheumatoid arthritis, repetitive hand use'
  - 'Severe CTS: Thenar atrophy (flattened thenar eminence), weakness thumb opposition
    (APB muscle) - often irreversible, needs surgery'
  management:
  - 'Guideline-based treatment options for Carpal Tunnel Syndrome include:'
  - 'Conservative (mild to moderate): Nighttime wrist splint in neutral (NOT flexion/extension),
    activity modification, NSAIDs (AAOS 2023)'
  - 'Steroid injection: Triamcinolone 20-40mg into carpal tunnel - 70% improve, but
    50% recur within 1 year (AAOS 2023)'
  - 'Surgical release (carpal tunnel release): If severe (thenar atrophy, weakness),
    failed conservative 3-6 months, electrophysiologic evidence severe (AAOS 2023)'
  - 'Surgery options: Open (2-3cm incision) vs endoscopic (2 small portals) - similar
    outcomes, endoscopic faster recovery (AAOS 2023)'
  - 'Treat underlying: Optimize thyroid, glucose control if diabetic, pregnancy (often
    resolves postpartum - delay surgery) (AAOS 2023)'
  tests:
  - 'Phalen test: Flex wrists 90° for 60 seconds. Numbness in median distribution
    = positive (75% sensitive)'
  - 'Tinel sign: Tap over carpal tunnel (volar wrist). Tingling in median distribution
    = positive (60% sensitive)'
  - 'Thenar atrophy: Look at thenar eminence (thumb base). Flattened = severe CTS'
  - 'Nerve conduction studies: Prolonged distal motor latency (>4.5 ms) and sensory
    latency (>3.5 ms) across carpal tunnel - confirms diagnosis and severity'
  - 'Two-point discrimination: >6mm abnormal (normal 2-5mm) - indicates severe axonal
    loss'
  referrals:
  - 'Hand surgeon or orthopedics if: Severe (thenar atrophy, weakness), failed 3-6
    months conservative treatment, patient preference for surgery'
  - 'Mild to moderate: Trial splinting, activity modification x3-6 months'
  icd10:
  - G56.00
  snomed:
  - 57406009
- id: ORTHO-COMPARTMENT-SYNDROME
  label: Compartment Syndrome
  presentations:
  - Severe pain out of proportion to exam
  - Pain with passive stretch of muscles
  - Tense, swollen compartment
  - Paresthesias, weakness
  - 'Late findings: pulselessness, pallor (indicates irreversible damage)'
  - Follows trauma, fracture, or prolonged limb compression
  - Compartment pressure > 30 mmHg
  clinical_pearls:
  - ORTHOPEDIC EMERGENCY - irreversible muscle/nerve damage within 6-8 hours if untreated
  - Increased pressure in fascial compartment compromises perfusion - ischemia, necrosis,
    Volkmann contracture
  - 'Pain out of proportion + pain with passive stretch: Most sensitive early findings
    (5 P''s are late: Pain, Pallor, Paresthesias, Pulselessness, Paralysis)'
  - Pulse present does NOT rule out compartment syndrome - arterial pressure higher
    than capillary/venous pressure
  - 'Common causes: Tibial fracture (40%), crush injury, burns, tight casts/dressings,
    prolonged limb compression (unconscious patient)'
  management:
  - 'Guideline-based treatment options for Compartment Syndrome include:'
  - 'EMERGENCY fasciotomy: If clinical diagnosis (pain out of proportion + passive
    stretch pain) OR compartment pressure >30 mmHg (or delta P <30 mmHg) (AAOS 2023)'
  - 'Delta P: Diastolic BP minus compartment pressure. If <30 mmHg = inadequate perfusion
    pressure, needs fasciotomy (AAOS 2023)'
  - 'Remove all constricting dressings/casts immediately: May be sufficient if caught
    early (AAOS 2023)'
  - Elevate limb to heart level only (NOT above heart - decreases arterial inflow)
    (AAOS 2023)
  - DO NOT delay fasciotomy for imaging or pressure measurement if high clinical suspicion
    (AAOS 2023)
  tests:
  - 'Clinical diagnosis: Pain out of proportion, pain with passive stretch (earliest
    signs), tense compartment'
  - 'Compartment pressure measurement: >30 mmHg absolute OR delta P <30 mmHg (diastolic
    BP minus compartment pressure) = fasciotomy'
  - 'Late findings (indicates damage already occurred): Paresthesias, paralysis, pulselessness,
    pallor'
  - 'X-ray: Identify fracture (tibial shaft most common), but don''t delay treatment
    for imaging'
  referrals:
  - Orthopedic surgery EMERGENTLY - call immediately for fasciotomy
  - If high clinical suspicion, DO NOT wait for pressure measurement - irreversible
    damage occurs in 6-8 hours
  icd10:
  - T79.A19A
  snomed:
  - 111243008
- id: ORTHO-OSTEOMYELITIS
  label: Osteomyelitis
  presentations:
  - Bone pain (localized, constant, deep pain)
  - Fever, chills (if acute hematogenous spread)
  - Localized swelling, warmth, and erythema over affected bone
  - Draining sinus tract (chronic osteomyelitis)
  - 'Causes: Hematogenous spread (children, IVDU), contiguous spread (trauma, surgery,
    diabetic foot), direct inoculation'
  - 'Organisms: S. aureus (50%, most common), S. epidermidis (prosthetic), Pseudomonas
    (IVDU, diabetic foot), Salmonella (sickle cell)'
  - 'MRI shows: Bone marrow edema (T2 bright, T1 dark), enhancement, periosteal reaction'
  - 'X-ray changes lag 10-14 days: Periosteal elevation, lytic lesions (2-4 weeks)'
  - 'Diabetic foot osteomyelitis: Probe-to-bone test (95% specific if probe touches
    bone through ulcer)'
  - History of trauma, surgery, diabetic foot ulcer, or IVDU
  - Elevated ESR/CRP (typically ESR >50, CRP >10)
  - 'Treatment: 4-6 weeks IV antibiotics, surgical debridement if abscess/sequestrum'
  clinical_pearls:
  - Bone infection - hematogenous (children, vertebral in adults), contiguous (trauma,
    surgery, diabetic foot), direct inoculation (open fracture)
  - 'Organisms: S. aureus (most common, 50%), S. epidermidis (prosthetic joints),
    Salmonella (sickle cell), Pseudomonas (IVDU, diabetic foot)'
  - 'X-ray changes lag 10-14 days: Early X-ray normal. Periosteal reaction first sign
    (7-10 days), lytic lesions at 2-4 weeks'
  - 'MRI: Gold standard for diagnosis - 90% sensitive, shows bone marrow edema (T2
    bright), abscess, soft tissue involvement'
  - 'Diabetic foot osteomyelitis: Probe-to-bone test (probe through ulcer touches
    bone) 95% specific'
  management:
  - 'Guideline-based treatment options for Osteomyelitis include:'
  - 'IV antibiotics x4-6 weeks: Empiric nafcillin or cefazolin 2g IV q8h (MRSA: vancomycin
    15mg/kg IV q12h) until culture results (AAOS 2023)'
  - Tailor antibiotics based on culture/sensitivities from bone biopsy or blood cultures
    (AAOS 2023)
  - 'Surgical debridement: If abscess, sequestrum (dead bone), prosthetic joint infection,
    failed medical therapy (AAOS 2023)'
  - 'Diabetic foot osteomyelitis: Surgical debridement + antibiotics x6 weeks (consider
    amputation if non-healing ulcer, severe ischemia) (AAOS 2023)'
  - PICC line for outpatient IV antibiotics after clinical improvement (AAOS 2023)
  tests:
  - 'MRI: Gold standard - bone marrow edema (T2 bright, T1 dark), enhancement, abscess,
    soft tissue involvement'
  - 'X-ray: Periosteal reaction (7-10 days), lytic lesions (2-4 weeks), sequestrum
    (dense dead bone). Early X-ray normal'
  - 'ESR/CRP: Elevated (ESR often >50, CRP >10) - follow to assess treatment response
    (should decline by 50% in 2 weeks)'
  - 'Blood cultures: Positive in 50% of hematogenous osteomyelitis'
  - 'Bone biopsy with culture: Gold standard for organism identification, especially
    if blood cultures negative or atypical presentation'
  referrals:
  - Orthopedic surgery for bone biopsy and possible debridement
  - Infectious disease for antibiotic selection and duration
  - Admit for IV antibiotics
  icd10:
  - M86.9
  snomed:
  - 60168000
- id: ORTHO-SEPTIC-ARTHRITIS
  label: Septic Arthritis
  presentations:
  - Acute monoarticular joint pain, swelling, warmth, erythema
  - Fever
  - Restricted range of motion
  - Joint aspiration shows WBC > 50,000 with > 90% neutrophils
  - Positive gram stain or culture of synovial fluid
  - Medical emergency requiring drainage
  clinical_pearls:
  - ORTHOPEDIC EMERGENCY - cartilage destruction within 24-48 hours if untreated (irreversible
    arthritis)
  - S. aureus 40-50% (most common), Streptococcus 20%, N. gonorrhoeae (young sexually
    active), gram-negative (elderly, immunocompromised)
  - 'Risk factors: Age >80, diabetes, rheumatoid arthritis, prosthetic joint, IVDU,
    immunosuppression'
  - 'Gonococcal arthritis: Migratory polyarthralgia, tenosynovitis, pustular rash,
    often culture-negative (culture blood, cervix, throat)'
  - 'Prosthetic joint infection: S. epidermidis most common, needs joint removal +
    spacer + revision in most cases'
  management:
  - 'Guideline-based treatment options for Septic Arthritis include:'
  - 'EMERGENCY joint drainage: Arthrocentesis OR arthroscopic lavage/debridement (knee,
    shoulder) OR open I&D (hip) (AAOS 2023)'
  - Repeat drainage if fluid reaccumulates (may need serial aspirations or surgical
    washout) (AAOS 2023)
  - 'IV antibiotics x3-4 weeks: Empiric vancomycin 15mg/kg IV q12h + ceftriaxone 2g
    IV daily (cover MRSA + gram-negative) (AAOS 2023)'
  - 'Gonococcal: Ceftriaxone 1g IV daily x7 days (can transition to oral after clinical
    improvement) (AAOS 2023)'
  - 'Tailor antibiotics based on gram stain/culture: MSSA (nafcillin), MRSA (vancomycin),
    Streptococcus (penicillin G), gram-negative (ceftriaxone) (AAOS 2023)'
  tests:
  - 'Synovial fluid analysis (BEFORE antibiotics): Cell count (>50k WBC with >90%
    PMNs highly suspicious), gram stain (60% sensitive), culture (90% sensitive)'
  - 'Synovial fluid WBC: <200 (non-inflammatory), 200-2000 (inflammatory, OA), 2000-50,000
    (inflammatory arthritis, gout), >50,000 (septic)'
  - 'Blood cultures: Positive in 50% (obtain before antibiotics)'
  - 'X-ray: Normal early. Later: joint effusion, bone erosions, joint space narrowing'
  - 'ESR/CRP: Elevated but nonspecific'
  referrals:
  - Orthopedic surgery EMERGENTLY for joint drainage - call immediately
  - Admit for IV antibiotics and serial drainage
  - Infectious disease consult for antibiotic management
  icd10:
  - M00.9
  snomed:
  - 372938004
- id: ORTHO-LOW-BACK-PAIN-RADICULOPATHY
  label: Low Back Pain with Radiculopathy (Sciatica)
  presentations:
  - Low back pain radiating down leg in dermatomal pattern
  - Numbness, tingling, weakness in affected nerve distribution
  - Positive straight leg raise test
  - May have bowel/bladder dysfunction if cauda equina syndrome
  - MRI shows disc herniation or spinal stenosis
  clinical_pearls:
  - 90% resolve with conservative treatment within 6-12 weeks - surgery rarely needed
  - 'L5 radiculopathy (45%): Dorsiflexion weakness (foot drop), numbness dorsum of
    foot/first web space, diminished ankle reflex'
  - 'S1 radiculopathy (40%): Plantar flexion weakness (can''t stand on toes), numbness
    lateral foot, diminished ankle reflex'
  - 'Straight leg raise: Sensitivity 90%, specificity 20%. Positive = pain down leg
    (not back) at <60° hip flexion'
  - 'Cauda equina syndrome: Saddle anesthesia, bowel/bladder dysfunction, bilateral
    leg weakness - SURGICAL EMERGENCY (decompress within 48h)'
  management:
  - 'Guideline-based treatment options for Low Back Pain with Radiculopathy (Sciatica)
    include:'
  - 'Conservative (first-line): Continue activity as tolerated (bedrest >2 days worsens
    outcomes), NSAIDs, muscle relaxants PRN (AAOS 2023)'
  - 'Physical therapy: McKenzie exercises (extension-based), core strengthening after
    acute phase (AAOS 2023)'
  - 'Medications: NSAIDs, neuropathic pain (AAOS 2023)'
  - 'Epidural steroid injection: If severe pain >6 weeks despite conservative treatment
    - short-term benefit (1-3 months) (AAOS 2023)'
  - 'Microdiscectomy: If severe/progressive neurologic deficit, failed 6-12 weeks
    conservative treatment, cauda equina syndrome (AAOS 2023)'
  tests:
  - 'Straight leg raise: Supine, passively raise affected leg (knee extended). Pain
    down leg <60° = positive'
  - 'Crossed straight leg raise: Raising contralateral leg causes pain in affected
    leg - more specific for disc herniation'
  - 'Motor exam: L4 (dorsiflexion ankle), L5 (great toe extension), S1 (plantarflexion
    ankle)'
  - 'Reflexes: Patellar (L4), ankle (S1). L5 has no reflex'
  - 'MRI lumbar spine (if considering surgery or red flags): Disc herniation, spinal
    stenosis, nerve root compression'
  - 'Red flags: Age >50, cancer history, fever, trauma, weight loss, night pain, bowel/bladder
    dysfunction - needs urgent MRI'
  referrals:
  - 'Neurosurgery/spine surgery if: Cauda equina syndrome (EMERGENCY), progressive
    motor deficit, failed 6-12 weeks conservative treatment'
  - Most patients improve with conservative management - MRI and surgery not needed
    unless red flags or persistent symptoms
  icd10:
  - M54.16
  snomed:
  - 23056005
- id: ORTHO-CERVICAL-RADICULOPATHY
  label: Cervical Radiculopathy
  presentations:
  - Neck pain radiating to arm in dermatomal pattern
  - Numbness, tingling, weakness in affected nerve distribution
  - Positive Spurling test (pain with neck extension and rotation)
  - MRI shows disc herniation or foraminal stenosis
  clinical_pearls:
  - 'Most common: C7 (50%), C6 (25%), C5 (15%) - lumbar radiculopathy more common
    overall but cervical has worse prognosis'
  - 'C5 radiculopathy: Deltoid weakness (arm abduction), numbness lateral shoulder,
    diminished biceps reflex'
  - 'C6 radiculopathy: Biceps/wrist extensor weakness, numbness thumb/index, diminished
    brachioradialis reflex'
  - 'C7 radiculopathy (most common): Triceps weakness (elbow extension), numbness
    middle finger, diminished triceps reflex'
  - 'C8 radiculopathy: Hand intrinsic weakness (finger abduction/adduction), numbness
    4th/5th fingers, no reflex changes'
  management:
  - 'Guideline-based treatment options for Cervical Radiculopathy include:'
  - 'Conservative (first-line): Soft cervical collar short-term (<2 weeks), NSAIDs,
    continue activity as tolerated (AAOS 2023)'
  - 'Physical therapy: Cervical traction, range of motion, isometric strengthening
    after acute phase (AAOS 2023)'
  - 'Medications: NSAIDs, neuropathic pain (AAOS 2023)'
  - 'Cervical epidural steroid injection: If severe pain >6 weeks despite PT/meds
    - provides 1-3 months relief (AAOS 2023)'
  - 'Anterior cervical discectomy and fusion: If progressive motor deficit, myelopathy,
    failed 6-12 weeks conservative treatment (AAOS 2023)'
  tests:
  - 'Spurling test: Extend neck, rotate to affected side, apply axial compression.
    Pain radiating down arm = positive (specific for radiculopathy)'
  - 'Neck distraction test: Pull head upward. Relief of arm symptoms = positive (suggests
    nerve root compression)'
  - 'Motor exam: C5 (deltoid), C6 (biceps, wrist extensors), C7 (triceps, wrist flexors),
    C8 (finger flexors, hand intrinsics)'
  - 'Reflexes: Biceps (C5-6), brachioradialis (C6), triceps (C7)'
  - 'MRI cervical spine (if considering surgery or myelopathy): Disc herniation, foraminal
    stenosis, cord compression'
  - 'Red flags for myelopathy: Gait instability, bowel/bladder dysfunction, hyperreflexia,
    Hoffmann sign, Babinski - needs urgent MRI'
  referrals:
  - 'Neurosurgery/spine surgery if: Myelopathy (URGENT), progressive motor deficit,
    failed 6-12 weeks conservative treatment'
  - Most improve with conservative management x6-12 weeks - surgery only if refractory
    or myelopathy
  icd10:
  - M54.12
  snomed:
  - 128200000
- id: ORTHO-PLANTAR-FASCIITIS
  label: Plantar Fasciitis
  presentations:
  - Heel pain, especially with first steps in morning
  - Pain worse after prolonged standing or activity
  - Tenderness at medial calcaneal tuberosity
  - Pain improves with rest
  - X-ray may show heel spur (not diagnostic)
  clinical_pearls:
  - Most common cause of heel pain in adults - degenerative process (not inflammatory
    fasciitis), 10% of population affected
  - Pain maximal with first steps in morning (post-static dyskinesia) - improves with
    walking, worsens with prolonged activity
  - 'Risk factors: Pes planus (flat feet), limited ankle dorsiflexion, obesity, prolonged
    standing, running'
  - 'Heel spur on X-ray: Present in 50% with plantar fasciitis AND 15% without symptoms
    - NOT causative, just association'
  - 'Natural history: 80-90% resolve with conservative treatment in 6-12 months (very
    slow resolution)'
  management:
  - 'Guideline-based treatment options for Plantar Fasciitis include:'
  - 'Conservative (first-line): Plantar fascia stretching exercises (towel stretch,
    wall calf stretch) x10 reps TID, ice massage, NSAIDs (AAOS 2023)'
  - 'Orthotics: Over-the-counter arch supports or custom orthotics (provide cushioning,
    reduce tension on plantar fascia) (AAOS 2023)'
  - 'Night splint: Dorsiflexion splint prevents plantar fascia contracture overnight
    - effective but compliance poor (uncomfortable) (AAOS 2023)'
  - 'Steroid injection: Methylprednisolone 40mg + 1 mL lidocaine at medial calcaneal
    tuberosity - 70% improve but 50% recur, max 3 injections (risk plantar fascia
    rupture) (AAOS 2023)'
  - 'Extracorporeal shockwave therapyor platelet-rich plasma: If failed 6-12 months
    conservative treatment (AAOS 2023)'
  tests:
  - 'Clinical diagnosis: Point tenderness at medial calcaneal tuberosity (origin of
    plantar fascia), pain with passive dorsiflexion of toes'
  - 'Windlass test: Passively dorsiflex great toe. Reproduces heel pain = positive
    (stretches plantar fascia)'
  - 'X-ray foot (lateral, AP): Rule out stress fracture, calcaneal spur (present in
    50% but not diagnostic)'
  - 'MRI or ultrasound: Only if diagnosis unclear - shows thickened plantar fascia
    (>4mm), edema. NOT routinely needed'
  referrals:
  - Podiatry or orthopedic foot/ankle if failed 6-12 months conservative treatment
    (stretching, orthotics, NSAIDs)
  - Most cases resolve with stretching exercises and orthotics - surgery (plantar
    fascia release) rarely needed (<5%)
  icd10:
  - M72.2
  snomed:
  - 202882003
