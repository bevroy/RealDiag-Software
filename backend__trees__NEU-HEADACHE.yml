id: NEU-HEADACHE
title: Headache Diagnostic Tree
entry: hx_start
nodes:
- id: hx_start
  when: {}
  tests: []
  suggest_dx: []
  next:
  - when:
      red_flags_any:
      - thunderclap
      - worst headache of life
    go: thunderclap
  - when:
      any_of:
      - triage_sbp_ge: severe_htn_sbp
      - triage_dbp_ge: severe_htn_dbp
      - triage_o2_le: hypoxemia_o2
      - triage_temp_c_ge: high_fever_temp_c
      - triage_hr_ge: tachycardia_hr
    go: headache_vitals_urgent
  - when:
      exam_flags_any:
      - papilledema
    go: iih
  - default: primary
- id: thunderclap
  when: {}
  tests:
  - CT head w/o contrast STAT
  - CTA head/neck
  - LP if CT negative
  suggest_dx:
  - Subarachnoid hemorrhage
  next:
  - default: null
- id: iih
  when:
    all_of:
    - symptoms_contains_any:
      - headache
      - pulsatile tinnitus
    - exam_flags_any:
      - papilledema
  tests:
  - MRI/MRV
  - Lumbar puncture (if safe)
  suggest_dx:
  - Idiopathic intracranial hypertension
  next:
  - default: null
- id: headache_vitals_urgent
  when: {}
  tests:
  - Immediate ED evaluation and neurologic reassessment
  - Repeat focused vitals and oxygenation monitoring
  - CT head w/o contrast if severe or atypical headache
  suggest_dx:
  - Secondary headache with physiologic instability
  - Hypertensive emergency vs systemic cause
  next:
  - default: null
- id: primary
  when: {}
  tests:
  - No emergent imaging if normal neuro exam and primary pattern
  suggest_dx:
  - Migraine
  - Tension-type
  - Cluster (if TAC features)
  next:
  - default: null
