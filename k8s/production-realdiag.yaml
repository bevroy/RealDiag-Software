---
# Production Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    environment: production

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: realdiag-config
  namespace: staging
data:
  APP_NAME: "RealDiag"
  APP_VERSION: "1.4.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  RATE_LIMIT_ENABLED: "true"
  PROMETHEUS_ENABLED: "true"
  HIPAA_COMPLIANCE_MODE: "true"
  HTTPS_ONLY: "true"
  HSTS_ENABLED: "true"

---
# Secret for sensitive data (create manually or use external secrets operator)
apiVersion: v1
kind: Secret
metadata:
  name: realdiag-secrets
  namespace: staging
type: Opaque
stringData:
  # NOTE: Replace these with actual secrets before deploying!
  # Use: kubectl create secret generic realdiag-secrets --from-env-file=.env -n production
  # Or use external-secrets operator to sync from cloud provider secret manager
  JWT_SECRET_KEY: "CHANGE_ME_BEFORE_DEPLOY"
  DATABASE_PASSWORD: "CHANGE_ME_BEFORE_DEPLOY"
  REDIS_PASSWORD: "CHANGE_ME_BEFORE_DEPLOY"
  # Get your Sentry DSN from: https://sentry.io/settings/[organization]/projects/[project]/keys/
  SENTRY_DSN: "https://your-sentry-dsn@sentry.io/project-id"

---
# PersistentVolumeClaim for database backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: realdiag-backups
  namespace: staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard

---
# Deployment for RealDiag API (FastAPI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realdiag-api
  namespace: staging
  labels:
    app: realdiag-api
    version: v1.4.0
spec:
  replicas: 3  # High availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  selector:
    matchLabels:
      app: realdiag-api
  template:
    metadata:
      labels:
        app: realdiag-api
        version: v1.4.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: realdiag-api
          image: ghcr.io/bevroy/realdiag-backend:latest
          imagePullPolicy: Always
          
          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: realdiag-config
            - secretRef:
                name: realdiag-secrets
          
          # Additional environment variables
          env:
            - name: DATABASE_HOST
              value: "postgresql-service.production.svc.cluster.local"
            - name: REDIS_HOST
              value: "redis-service.production.svc.cluster.local"
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Startup probe for slow-starting containers
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          
          # Resource limits (tuned for production)
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 2Gi
          
          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
            - name: logs
              mountPath: /var/log/realdiag
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: logs
          emptyDir: {}
      
      # Pod affinity for distribution across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - realdiag-api
                topologyKey: kubernetes.io/hostname

---
# Service for RealDiag API
apiVersion: v1
kind: Service
metadata:
  name: realdiag-api
  namespace: staging
  labels:
    app: realdiag-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: realdiag-api
  sessionAffinity: ClientIP  # Sticky sessions

---
# Deployment for RealDiag Web (Next.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realdiag-web
  namespace: staging
  labels:
    app: realdiag-web
    version: v1.4.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: realdiag-web
  template:
    metadata:
      labels:
        app: realdiag-web
        version: v1.4.0
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
        - name: realdiag-web
          image: ghcr.io/bevroy/realdiag-frontend:latest
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          env:
            - name: NEXT_PUBLIC_API_BASE
              value: "https://api.realdiag.com"
            - name: NODE_ENV
              value: "production"
          
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /.next/cache
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - realdiag-web
                topologyKey: kubernetes.io/hostname

---
# Service for RealDiag Web
apiVersion: v1
kind: Service
metadata:
  name: realdiag-web
  namespace: staging
  labels:
    app: realdiag-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: realdiag-web

---
# HorizontalPodAutoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realdiag-api-hpa
  namespace: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realdiag-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

---
# HorizontalPodAutoscaler for Web
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realdiag-web-hpa
  namespace: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realdiag-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# PodDisruptionBudget for API (ensure availability during updates)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: realdiag-api-pdb
  namespace: staging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: realdiag-api

---
# PodDisruptionBudget for Web
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: realdiag-web-pdb
  namespace: staging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: realdiag-web

---
# Ingress with TLS termination
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realdiag-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.realdiag.com;";
spec:
  tls:
    - hosts:
        - realdiag.com
        - www.realdiag.com
        - api.realdiag.com
      secretName: realdiag-tls
  rules:
    # Main web application
    - host: realdiag.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realdiag-web
                port:
                  number: 80
    
    # www redirect
    - host: www.realdiag.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realdiag-web
                port:
                  number: 80
    
    # API subdomain
    - host: api.realdiag.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realdiag-api
                port:
                  number: 80

---
# NetworkPolicy to restrict traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realdiag-network-policy
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app: realdiag-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: realdiag-web
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

---
# ServiceMonitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: realdiag-api-metrics
  namespace: staging
  labels:
    app: realdiag-api
spec:
  selector:
    matchLabels:
      app: realdiag-api
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
