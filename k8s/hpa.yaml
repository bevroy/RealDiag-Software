apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realdiag-api-hpa
  namespace: staging
  labels:
    app: realdiag-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realdiag-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metric: requests per second (if metrics server supports)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60  # Scale down max 50% of pods per minute
        - type: Pods
          value: 1
          periodSeconds: 60  # Or max 1 pod per minute
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 60  # React quickly to increased load
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30  # Scale up max 100% of pods every 30 seconds
        - type: Pods
          value: 2
          periodSeconds: 30  # Or max 2 pods every 30 seconds
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realdiag-web-hpa
  namespace: staging
  labels:
    app: realdiag-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realdiag-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: realdiag-api-pdb
  namespace: staging
  labels:
    app: realdiag-api
spec:
  minAvailable: 2  # Always keep at least 2 replicas available
  selector:
    matchLabels:
      app: realdiag-api
      tier: backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: realdiag-web-pdb
  namespace: staging
  labels:
    app: realdiag-web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: realdiag-web
      tier: frontend
