# Render Blueprint for RealDiag TEST Environment
# Uses EXISTING database (realdiag-database) to avoid downgrade issues
# 
# This configuration deploys:
# - Backend API with test mode enabled
# - Frontend static site
# - Connects to your existing database
#
# All users automatically get ENTERPRISE access in test mode

databases:
  # Test Database (separate from production)
  - name: realdiag-test-database
    plan: free
    region: virginia
    databaseName: realdiag_test
    user: realdiag_test_user

services:

  # Backend Web Service (Test Mode)
  - type: web
    name: realdiag-test-backend
    env: docker
    region: virginia
    branch: main
    plan: free
    repo: https://github.com/bevroy/RealDiag-Software
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: TZ
        value: America/New_York
      
      # TEST MODE CONFIGURATION
      - key: ENVIRONMENT
        value: test
      - key: FREE_ACCESS_TESTING
        value: true
      - key: BYPASS_SUBSCRIPTION_CHECKS
        value: true
      - key: RATE_LIMIT_ENABLED
        value: false
      - key: SUBSCRIPTION_CHECK_ENABLED
        value: false
      
      # Database - Using EXISTING database
      # NOTE: You need to set this manually in Render Dashboard
      # Go to: Service Settings > Environment > Add Environment Variable
      # Name: DATABASE_URL
      # Value: Your actual database connection string
      - key: DATABASE_URL
        fromDatabase:
          name: realdiag-test-database
          property: connectionString
      
      # Security (relaxed for testing)
      - key: SECURITY_ENABLED
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      
      # CORS (allow all origins for testing)
      - key: CORS_ORIGINS
        value: "*"
      - key: PREVIEW_ORIGIN_REGEX
        value: ^https?://.*$
      
      # Optional: Disable external services
      - key: EMAIL_ENABLED
        value: false
      - key: STRIPE_ENABLED
        value: false
      - key: FHIR_ENABLED
        value: false
      
      # Logging
      - key: LOG_LEVEL
        value: DEBUG

  # Frontend Static Site (Test Mode)  
  - type: web
    name: realdiag-test-frontend
    env: static
    region: virginia
    branch: main
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: test
      - key: NEXT_PUBLIC_API_BASE
        value: https://realdiag-test-backend.onrender.com
      - key: NEXT_PUBLIC_SHOW_TEST_BANNER
        value: true
