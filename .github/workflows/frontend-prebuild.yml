name: Frontend prebuild + image

on:
  push:
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build-frontend:
    name: Build frontend artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          # next.config.js sets distDir: 'out', so the build output is frontend/out
          include-hidden-files: true
          path: |
            frontend/out
            frontend/public
            frontend/package-lock.json

  build-image:
    name: Build Docker image using prebuilt frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    env:
      # `secrets` can't be used in step `if:` conditions; test env.GHCR_TOKEN instead.
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      # Images are pushed to GHCR only from main; pull requests and other
      # branches only build the image (and smoke-test it below).
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend

      - name: Show files (debug)
        run: ls -la frontend && test -d frontend/out

      - name: Build image (no push)
        run: |
          # Use the prebuilt Dockerfile which copies the built frontend directory
          docker build -f Dockerfile.prebuilt -t frontend-prebuilt:${{ github.sha }} .

      - name: Tag image for GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/realdig-frontend:${{ github.sha }}
          docker tag frontend-prebuilt:${{ github.sha }} $IMAGE
          echo "Tagged $IMAGE"

      - name: Push to GHCR (main only)
        id: push
        if: ${{ env.GHCR_TOKEN != '' && env.PUSH_IMAGE == 'true' }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository_owner }}/realdig-frontend:${{ github.sha }}
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE
          echo "Pushed $IMAGE to GHCR"
          # Pull the pushed image so we can inspect RepoDigests which include the digest
          docker pull $IMAGE
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE || true)
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Captured digest: $DIGEST"

      - name: Create GitHub Release with image (on main)
        if: ${{ env.GHCR_TOKEN != '' && env.PUSH_IMAGE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/realdig-frontend:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE || true)
          SHORT=${GITHUB_SHA:0:8}
          TAG=frontend-image-$SHORT
          BODY="Frontend image published: $IMAGE\nDigest: $DIGEST\nRunner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Creating release $TAG"
          curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"Frontend image $TAG\", \"body\": \"$BODY\", \"prerelease\": false }" || true

      - name: Save image (optional)
        if: always()
        run: docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | sed -n '1,200p'

  smoke-test:
    name: Smoke e2e using prebuilt image (pytest)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend

      - name: Build prebuilt image for smoke test
        run: |
          docker build -f Dockerfile.prebuilt -t realdiag-frontend:smoketest .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Generate a throwaway JWT secret for the API container
        run: |
          KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$KEY"
          echo "JWT_SECRET_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run e2e pytest against the prebuilt frontend image
        env:
          # tests/test_e2e.py runs plain `docker compose`; COMPOSE_FILE makes it
          # use the override, so `web` runs realdiag-frontend:prebuilt and only
          # `api` is built.
          COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml
        run: |
          docker tag realdiag-frontend:smoketest realdiag-frontend:prebuilt
          # --noconftest: tests/conftest.py imports the backend app (FastAPI),
          # which this job doesn't install; the e2e test only needs requests.
          pytest -q --noconftest tests/test_e2e.py::test_e2e_stack

      - name: Tear down stack
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml
        run: docker compose down || true
